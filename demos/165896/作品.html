<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>药归 · 过期药品回收指引</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
        body { background: #f0f5f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .app {
            max-width: 400px; width: 100%; background: #ffffff; border-radius: 36px; 
            box-shadow: 0 20px 60px rgba(40, 80, 40, 0.15); overflow: hidden; padding: 24px 20px 32px;
        }
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; font-weight: 700; color: #1e3a2f; letter-spacing: 1px; }
        .header h1 span { color: #2d7a4f; }
        .eco-badge { background: #e3f5e8; color: #1e6b3e; padding: 6px 14px; border-radius: 30px; font-size: 12px; font-weight: 600; }

        /* Scan Box */
        .scan-area {
            background: linear-gradient(145deg, #e8f0e8, #d4e0d4);
            border-radius: 28px; height: 190px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; border: 2px dashed #6b9b7a; 
            cursor: pointer; transition: 0.2s; margin-bottom: 20px; position: relative;
        }
        .scan-area:active { transform: scale(0.97); background: #dce8dc; }
        .scan-icon { font-size: 44px; margin-bottom: 6px; }
        .scan-text { color: #2d5a3d; font-weight: 500; font-size: 15px; }
        .scan-sub { color: #5a7a62; font-size: 12px; margin-top: 4px; }

        /* Result Card */
        .result-card {
            background: #f8fbf8; border-radius: 20px; padding: 16px; 
            border-left: 5px solid #2d7a4f; margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .drug-name { font-size: 20px; font-weight: 700; color: #1e3a2f; display: flex; align-items: center; gap: 10px; }
        .drug-status { font-size: 13px; font-weight: 600; padding: 2px 14px; border-radius: 30px; }
        .status-expired { background: #fee2e2; color: #b91c1c; }
        .status-valid { background: #dcfce7; color: #166534; }
        .drug-detail { margin-top: 10px; color: #3d5a45; font-size: 14px; line-height: 1.6; }
        .drug-detail i { font-style: normal; background: #ecf3ec; padding: 2px 8px; border-radius: 12px; margin-right: 4px; }

        /* Map / Location */
        .location-box {
            background: #eef5ee; border-radius: 16px; padding: 14px 16px; 
            display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
            border: 1px solid #cde0cd;
        }
        .loc-icon { font-size: 28px; }
        .loc-info { flex: 1; }
        .loc-title { font-weight: 600; color: #1e3a2f; font-size: 15px; }
        .loc-addr { font-size: 13px; color: #4d6b55; margin-top: 2px; }
        .loc-dist { background: #2d7a4f; color: white; padding: 4px 12px; border-radius: 30px; font-size: 12px; font-weight: 600; }

        /* Points & Action */
        .points-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: #fcf9f0; border-radius: 40px; padding: 12px 18px;
            border: 1px solid #e5dcc6; margin-bottom: 16px;
        }
        .points-left { display: flex; align-items: center; gap: 8px; }
        .points-num { font-size: 22px; font-weight: 800; color: #b68b40; }
        .points-label { color: #6b5a3a; font-size: 14px; }
        .btn-nav {
            background: #1e3a2f; color: white; border: none; padding: 10px 24px; 
            border-radius: 40px; font-weight: 600; font-size: 15px; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-nav:active { transform: scale(0.95); background: #143025; }

        .footer { margin-top: 14px; font-size: 11px; color: #8aa08a; text-align: center; border-top: 1px solid #e3eee3; padding-top: 14px; }
        .tag-group { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .tag { background: #e3eee3; color: #2d5a3d; padding: 2px 12px; border-radius: 20px; font-size: 11px; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>🌿 药<span>归</span></h1>
        <span class="eco-badge">♻️ 环保先锋</span>
    </div>

    <!-- 模拟扫码区域 -->
    <div class="scan-area" id="scanBtn">
        <div class="scan-icon">📦</div>
        <div class="scan-text">点击扫描药品条形码</div>
        <div class="scan-sub">或手动输入药品名</div>
    </div>

    <!-- 识别结果 -->
    <div class="result-card" id="resultCard">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="drug-name" id="drugName">💊 板蓝根颗粒</div>
            <span class="drug-status status-expired" id="statusBadge">⚠️ 已过期</span>
        </div>
        <div class="drug-detail" id="drugDetail">
            <i>📅</i> 生产日期：2024.01 · 有效期至：2026.01 <br>
            <i>⚠️</i> 处理建议：请投入 <strong>有害垃圾</strong> 回收箱，切勿随意丢弃。
        </div>
        <div class="tag-group">
            <span class="tag"># 抗生素类</span>
            <span class="tag"># 高风险污染</span>
        </div>
    </div>

    <!-- 回收点推荐 -->
    <div class="location-box">
        <div class="loc-icon">📍</div>
        <div class="loc-info">
            <div class="loc-title">🏥 同仁堂定点回收站 (经三路店)</div>
            <div class="loc-addr">郑州市金水区经三路与纬五路交叉口</div>
        </div>
        <span class="loc-dist">距您 320m</span>
    </div>

    <!-- 积分 + 导航 -->
    <div class="points-bar">
        <div class="points-left">
            <span style="font-size:22px;">🏅</span>
            <span class="points-num" id="pointsDisplay">128</span>
            <span class="points-label">环保积分</span>
            <span style="font-size:12px; color:#8a9b8a; margin-left:4px;">+10 本次</span>
        </div>
        <button class="btn-nav" id="navBtn">🧭 去这里</button>
    </div>

    <div class="footer">
        TRAE Work 生成 · 创意概念演示 · 药品信息仅为模拟展示
    </div>
</div>

<script>
    // 模拟药品数据库（包含过期和有效两种状态）
    const drugDB = [
        { 
            name: '💊 板蓝根颗粒', 
            status: 'expired', 
            statusText: '⚠️ 已过期',
            detail: '生产日期：2024.01 · 有效期至：2026.01<br>⚠️ 处理建议：请投入 <strong>有害垃圾</strong> 回收箱。',
            tags: ['# 抗生素类', '# 高风险污染'],
            points: 15
        },
        { 
            name: '💊 阿莫西林胶囊', 
            status: 'expired', 
            statusText: '⚠️ 已过期',
            detail: '生产日期：2023.06 · 有效期至：2025.06<br>⚠️ 处理建议：属于危险废物，需密封后投放至有害垃圾桶。',
            tags: ['# 处方药', '# 需密封'],
            points: 15
        },
        { 
            name: '💊 维生素C片', 
            status: 'valid', 
            statusText: '✅ 有效期内',
            detail: '生产日期：2025.03 · 有效期至：2027.03<br>✅ 可正常使用，注意避光防潮。',
            tags: ['# 保健品', '# 常温保存'],
            points: 0
        },
        { 
            name: '💊 布洛芬缓释胶囊', 
            status: 'expired', 
            statusText: '⚠️ 已过期',
            detail: '生产日期：2023.11 · 有效期至：2025.11<br>⚠️ 建议回收，避免误服及环境污染。',
            tags: ['# 止痛药', '# 高风险'],
            points: 15
        }
    ];

    let currentDrug = drugDB[0];
    let currentPoints = 128;

    // DOM 元素
    const drugNameEl = document.getElementById('drugName');
    const statusBadge = document.getElementById('statusBadge');
    const drugDetail = document.getElementById('drugDetail');
    const tagGroup = document.querySelector('.result-card .tag-group');
    const pointsDisplay = document.getElementById('pointsDisplay');

    // 更新界面
    function updateUI(drug) {
        drugNameEl.textContent = drug.name;
        statusBadge.textContent = drug.statusText;
        statusBadge.className = `drug-status ${drug.status === 'expired' ? 'status-expired' : 'status-valid'}`;
        drugDetail.innerHTML = drug.detail;
        
        // 更新标签
        tagGroup.innerHTML = drug.tags.map(t => `<span class="tag">${t}</span>`).join('');

        // 如果过期，加积分；否则不加（但演示中我们模拟加积分，点击时累加）
        // 积分在点击时统一处理，这里只展示
    }

    // 随机切换药品
    function randomPickDrug() {
        const idx = Math.floor(Math.random() * drugDB.length);
        return drugDB[idx];
    }

    // 扫描点击事件
    document.getElementById('scanBtn').addEventListener('click', function() {
        const newDrug = randomPickDrug();
        currentDrug = newDrug;
        updateUI(newDrug);

        // 振动反馈
        if (navigator.vibrate) navigator.vibrate(15);

        // 只有过期药品才增加积分（模拟规则）
        if (newDrug.status === 'expired') {
            currentPoints += newDrug.points;
            pointsDisplay.textContent = currentPoints;
            // 语音播报提示
            const msg = `识别到 ${newDrug.name.replace('💊 ', '')}，已过期，请前往附近回收点处理。`;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(msg);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        } else {
            const msg = `识别到 ${newDrug.name.replace('💊 ', '')}，仍在有效期内。`;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(msg);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        }
    });

    // 导航按钮（模拟）
    document.getElementById('navBtn').addEventListener('click', function() {
        alert('🧭 即将跳转至地图导航：\n同仁堂定点回收站 (经三路店)\n距离您 320 米');
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance('已为您规划前往回收站的路线');
            utterance.lang = 'zh-CN';
            speechSynthesis.speak(utterance);
        }
    });

    // 初始化显示
    updateUI(currentDrug);
    pointsDisplay.textContent = currentPoints;
</script>
</body>
</html>
