<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪治愈解压小站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #f7f3f0;
            color: #444;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .box {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px #e2dcd6;
        }
        h2 {
            color: #7d6b63;
            margin-bottom: 16px;
        }
        /* 治愈语录 */
        .quote-text {
            font-size: 18px;
            line-height: 1.8;
            min-height: 80px;
            text-align: center;
            margin: 10px 0;
        }
        button {
            background: #cbbcb1;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
            margin: 5px;
        }
        button:hover {
            background: #b8a79c;
        }
        /* 白噪音 */
        .audio-btns {
            margin-top:10px;
        }
        /* 心情打卡 */
        #moodInput {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin:10px 0;
            resize: none;
            height: 80px;
        }
        .mood-item {
            padding:8px;
            border-bottom:1px solid #eee;
        }
        /* 专注倒计时 */
        .time-num {
            font-size:40px;
            text-align:center;
            margin:10px 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>温柔治愈语录</h2>
        <div class="quote-text" id="quote"></div>
        <button onclick="changeQuote()">换一句治愈文案</button>
    </div>

    <div class="box">
        <h2>白噪音放松</h2>
        <div class="audio-btns">
            <button onclick="playSound('rain')">雨声</button>
            <button onclick="playSound('wind')">风声</button>
            <button onclick="playSound('forest')">林间音</button>
            <button onclick="stopAudio()">停止音效</button>
        </div>
        <audio id="rain" loop src="https://assets.mixkit.co/sfx/preview/mixkit-light-rain-ambience-1169.mp3">
        <audio id="wind" loop src="https://assets.mixkit.co/sfx/preview/mixkit-wind-in-trees-1170.mp3">
        <audio id="forest" loop src="https://assets.mixkit.co/sfx/preview/mixkit-forest-birds-ambience-1210.mp3">
    </div>

    <div class="box">
        <h2>每日心情打卡</h2>
        <textarea id="moodInput" placeholder="写下今天的心情吧..."></textarea>
        <button onclick="saveMood()">保存今日心情</button>
        <div id="moodList"></div>
    </div>

    <div class="box">
        <h2>专注放松倒计时</h2>
        <div class="time-num" id="timer">05:00</div>
        <button onclick="startTimer()">开始5分钟放松</button>
        <button onclick="resetTimer()">重置</button>
    </div>

    <script>
        // 1.治愈语录
        const quotes = [
            "不必逼迫自己一直优秀，允许偶尔疲惫。",
            "风会带走烦恼，你只需要慢慢走。",
            "你的情绪值得被温柔对待，不用硬撑。",
            "慢一点没关系，生活不是竞速赛道。",
            "今天辛苦了，好好安抚一下自己吧。",
            "所有压力都会慢慢消散，一切都会变好。"
        ];
        function changeQuote() {
            const random = Math.floor(Math.random() * quotes.length);
            document.getElementById("quote").innerText = quotes[random];
        }
        changeQuote();

        // 2.白噪音控制
        let nowAudio = null;
        function playSound(id) {
            stopAudio();
            nowAudio = document.getElementById(id);
            nowAudio.play();
        }
        function stopAudio() {
            if(nowAudio) nowAudio.pause();
        }

        //3.心情打卡 本地存储
        function loadMood() {
            const data = JSON.parse(localStorage.getItem("moodList")) || [];
            const wrap = document.getElementById("moodList");
            wrap.innerHTML = "";
            data.forEach(item=>{
                wrap.innerHTML += `<div class="mood-item">${item.time}：${item.text}</div>`;
            })
        }
        function saveMood() {
            const text = document.getElementById("moodInput").value.trim();
            if(!text) return alert("请填写心情内容");
            const data = JSON.parse(localStorage.getItem("moodList")) || [];
            const time = new Date().toLocaleString();
            data.push({time, text});
            localStorage.setItem("moodList", JSON.stringify(data));
            document.getElementById("moodInput").value = "";
            loadMood();
            alert("心情保存成功！");
        }
        loadMood();

        //4.倒计时
        let timerMin = 5;
        let timerSec = 0;
        let timerInterval = null;
        function refreshTimer() {
            let m = String(timerMin).padStart(2,"0");
            let s = String(timerSec).padStart(2,"0");
            document.getElementById("timer").innerText = `${m}:${s}`;
        }
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(()=>{
                if(timerSec === 0){
                    if(timerMin === 0){
                        clearInterval(timerInterval);
                        alert("放松时间结束啦，调整好状态咯！");
                        return;
                    }
                    timerMin--;
                    timerSec = 59;
                }else{
                    timerSec--;
                }
                refreshTimer();
            },1000)
        }
        function resetTimer() {
            clearInterval(timerInterval);
            timerMin = 5;
            timerSec = 0;
            refreshTimer();
        }
        refreshTimer();
    </script>
</body>
</html>
