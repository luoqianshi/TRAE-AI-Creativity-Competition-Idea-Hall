<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI测试数据速查工具 - Excel转便携复制HTML</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
  .container { max-width: 1200px; margin: 0 auto; }
  .header { text-align: center; color: #fff; margin-bottom: 30px; }
  .header h1 { font-size: 28px; margin-bottom: 8px; }
  .header p { font-size: 14px; opacity: 0.9; }
  .upload-area { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); margin-bottom: 24px; text-align: center; }
  .upload-area.dragover { border: 3px dashed #667eea; background: rgba(102,126,234,0.1); }
  .upload-icon { font-size: 64px; color: #667eea; margin-bottom: 16px; }
  .upload-area h2 { font-size: 20px; color: #333; margin-bottom: 8px; }
  .upload-area p { color: #666; font-size: 14px; margin-bottom: 20px; }
  .upload-btn { display: inline-block; padding: 12px 36px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 30px; font-size: 14px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
  .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
  #fileInput { display: none; }
  .nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; background: rgba(255,255,255,0.95); padding: 16px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  .nav a { text-decoration: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; background: #f0f0f0; color: #555; transition: all 0.2s; }
  .nav a:hover { background: #667eea; color: #fff; }
  .nav a.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
  .search-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .search-bar input { padding: 10px 16px; border: 1px solid #ddd; border-radius: 25px; font-size: 14px; width: 350px; outline: none; transition: border-color 0.2s; }
  .search-bar input:focus { border-color: #667eea; }
  .search-bar button { padding: 10px 24px; border: none; border-radius: 25px; background: #667eea; color: #fff; font-size: 14px; cursor: pointer; }
  .search-bar button:hover { background: #764ba2; }
  .section { background: rgba(255,255,255,0.95); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-bottom: 24px; overflow: hidden; }
  .section-title { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; padding: 16px 24px; font-size: 18px; font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: #fafafa; padding: 12px 14px; text-align: left; font-weight: 600; color: #1a1a2e; border-bottom: 2px solid #e8e8e8; white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; white-space: nowrap; transition: background 0.15s; cursor: pointer; }
  tr:hover td { background: #f0f7ff; }
  td.copied { background: #d4edda !important; }
  td.active-cell { background: #fff3cd !important; }
  tr.active-row td { background: #e7f3ff !important; }
  .toast { position: fixed; top: 30px; right: 30px; background: #52c41a; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: transform 0.3s ease; z-index: 9999; transform: translateX(400px); }
  .toast.show { transform: translateX(0); }
  .hint { text-align: center; color: rgba(255,255,255,0.8); font-size: 13px; margin-bottom: 20px; }
  .empty-state { text-align: center; padding: 60px 20px; color: #999; }
  .features-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 20px; }
  .feature-item { background: rgba(255,255,255,0.15); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px;">
      <h1>🚀 AI测试数据速查工具</h1>
      <span style="background: linear-gradient(135deg, #ff6b6b, #ffa500); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px;">v1.0 初期版本</span>
    </div>
    <p>Excel一键转便携复制HTML · 让测试数据复制更高效</p>
  </div>

  <div class="features-list">
    <div class="feature-item">✓ Excel文件导入</div>
    <div class="feature-item">✓ 多工作表解析</div>
    <div class="feature-item">✓ 单击复制</div>
    <div class="feature-item">✓ 全局搜索</div>
    <div class="feature-item">✓ 导航跳转</div>
  </div>

  <p class="hint"><span>单击单元格</span> 即可自动复制内容到剪贴板</p>

  <div class="upload-area" id="uploadArea" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
    <div class="upload-icon">📊</div>
    <h2>上传Excel文件</h2>
    <p>支持 .xlsx / .xls 格式，自动解析所有工作表</p>
    <label class="upload-btn">
      <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="handleFileSelect(event)">
      选择文件
    </label>
  </div>

  <div class="search-bar" id="searchBar" style="display: none;">
    <input type="text" id="searchInput" placeholder="搜索任意关键词...">
    <button onclick="doSearch()">搜索</button>
    <button onclick="clearSearch()" style="background:#999">清除</button>
  </div>

  <div class="nav" id="nav" style="display: none;"></div>

  <div id="content">
    <div class="empty-state">
      <div style="font-size: 48px; margin-bottom: 16px;">📁</div>
      <p>请上传Excel文件开始转换</p>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
function handleDragOver(e) { e.preventDefault(); document.getElementById('uploadArea').classList.add('dragover'); }
function handleDragLeave(e) { e.preventDefault(); document.getElementById('uploadArea').classList.remove('dragover'); }
function handleDrop(e) { e.preventDefault(); document.getElementById('uploadArea').classList.remove('dragover'); var files = e.dataTransfer.files; if (files.length > 0) processFile(files[0]); }
function handleFileSelect(e) { var file = e.target.files[0]; if (file) processFile(file); }

function processFile(file) {
  showToast('正在解析Excel文件...');
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var workbook = XLSX.read(data, { type: 'array' });
      renderWorkbook(workbook);
      showToast('转换完成！共 ' + workbook.SheetNames.length + ' 个工作表');
    } catch (error) {
      showToast('解析失败：' + error.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderWorkbook(workbook) {
  var nav = document.getElementById('nav');
  var content = document.getElementById('content');
  var searchBar = document.getElementById('searchBar');
  
  nav.innerHTML = '';
  content.innerHTML = '';
  
  workbook.SheetNames.forEach(function(sheetName, index) {
    var link = document.createElement('a');
    link.href = '#' + 'sheet-' + index;
    link.textContent = sheetName;
    if (index === 0) link.classList.add('active');
    nav.appendChild(link);
  });
  
  workbook.SheetNames.forEach(function(sheetName, index) {
    var worksheet = workbook.Sheets[sheetName];
    var html = XLSX.utils.sheet_to_html(worksheet);
    
    var section = document.createElement('div');
    section.className = 'section';
    section.id = 'sheet-' + index;
    section.innerHTML = '<div class="section-title">' + sheetName + '</div><div class="table-wrap">' + html + '</div>';
    content.appendChild(section);
  });
  
  nav.style.display = 'flex';
  searchBar.style.display = 'flex';
  
  document.querySelectorAll('td').forEach(function(td) {
    td.addEventListener('click', function() {
      var text = td.textContent.trim();
      if (!text) return;
      navigator.clipboard.writeText(text).then(function() {
        td.classList.add('copied');
        showToast('已复制: ' + (text.length > 30 ? text.substring(0, 30) + '...' : text));
        setTimeout(function() { td.classList.remove('copied'); }, 1200);
      });
    });
  });
  
  nav.addEventListener('click', function(e) {
    if (e.target.tagName === 'A') {
      e.preventDefault();
      document.querySelectorAll('.nav a').forEach(function(a) { a.classList.remove('active'); });
      e.target.classList.add('active');
      var targetId = e.target.getAttribute('href').substring(1);
      document.getElementById(targetId).scrollIntoView({ behavior: 'smooth' });
    }
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function doSearch() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  document.querySelectorAll('td').forEach(td => td.style.background = '');
  
  if (!keyword) return;
  
  document.querySelectorAll('td').forEach(td => {
    if (td.textContent.toLowerCase().includes(keyword)) {
      td.style.background = '#fff3cd';
    }
  });
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('td').forEach(td => td.style.background = '');
}
</script>
</body>
</html>
