  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <h1>AI 错题整理师</h1>
      <p>拍照识别错题，智能生成知识点与变式练习</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="input" onclick="switchTab('input')">整理错题</button>
      <button class="tab" data-tab="notebook" onclick="switchTab('notebook')">错题本</button>
    </div>

    <!-- Input Section -->
    <div id="input-section">
      <div class="input-card">
        <div class="form-group">
          <label class="form-label">选择学科<span class="required">*</span></label>
          <select class="form-control" id="subject">
            <option value="">请选择学科</option>
            <option value="math">数学</option>
            <option value="english">英语</option>
            <option value="physics">物理</option>
            <option value="chemistry">化学</option>
          </select>
        </div>

        <!-- Photo Upload Area -->
        <div class="photo-area">
          <label class="form-label">拍照 / 上传错题图片</label>
          <div class="photo-actions">
            <button class="btn-photo" onclick="openCamera()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              拍照识别
            </button>
            <button class="btn-photo" onclick="document.getElementById('fileInput').click()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              相册上传
            </button>
          </div>
          <input type="file" id="fileInput" class="hidden-input" accept="image/*" onchange="handleFileSelect(event)">

          <!-- OCR Status -->
          <div class="ocr-status" id="ocrStatus">
            <div class="ocr-spinner"></div>
            <svg class="ocr-status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            <span id="ocrStatusText">正在识别文字...</span>
          </div>

          <!-- Photo Preview -->
          <div class="photo-preview-wrapper" id="photoPreview">
            <img id="previewImg" src="" alt="错题图片预览">
            <div class="photo-preview-overlay">
              <span class="photo-preview-text" id="previewText">已识别</span>
              <button class="btn-photo-remove" onclick="removePhoto()" title="移除图片">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">错题描述<span class="required">*</span></label>
          <textarea class="form-control" id="question" placeholder="拍照识别后文字将自动填入此处，也可以手动输入或修改：&#10;例如：已知函数 f(x) = x² - 2x + 3，求 f(x) 在区间 [0,3] 上的最大值。"></textarea>
        </div>
        <button class="btn-primary" id="organizeBtn" onclick="organizeError()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          整理错题
        </button>
      </div>

      <!-- Loading -->
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>AI 正在分析错题，请稍候...</p>
      </div>

      <!-- Result -->
      <div class="result-card" id="result">
        <div class="subject-badge" id="subjectBadge"></div>
        <div class="result-section">
          <div class="result-section-title">
            <span class="icon icon-knowledge"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></span>
            涉及知识点
          </div>
          <div class="knowledge-tags" id="knowledgeTags"></div>
        </div>
        <div class="result-section">
          <div class="result-section-title">
            <span class="icon icon-practice"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>
            变式练习题
          </div>
          <div class="practice-list" id="practiceList"></div>
        </div>
        <button class="btn-save" id="saveBtn" onclick="saveToNotebook()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          加入错题本
        </button>
      </div>
    </div>

    <!-- Notebook Section -->
    <div class="notebook-section" id="notebook-section">
      <div class="notebook-header">
        <h2>我的错题本</h2>
        <span class="notebook-count" id="notebookCount">0 道错题</span>
      </div>
      <div class="notebook-list" id="notebookList"></div>
    </div>
  </div>

  <!-- Camera Modal -->
  <div class="camera-modal" id="cameraModal">
    <div class="camera-header">
      <button onclick="closeCamera()">取消</button>
      <span>拍照识别错题</span>
      <button onclick="closeCamera()" style="opacity:0;pointer-events:none;">取消</button>
    </div>
    <div class="camera-body">
      <video id="cameraVideo" autoplay playsinline></video>
      <canvas id="cameraCanvas"></canvas>
      <div class="camera-guide"></div>
    </div>
    <div class="camera-footer">
      <button class="camera-switch" onclick="switchCamera()" title="切换摄像头">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="btn-capture" id="captureBtn" onclick="capturePhoto()">
        <div class="btn-capture-flash" id="captureFlash"></div>
      </button>
      <div style="width:44px;"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Tesseract.js for OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    // Data store
    let currentResult = null;
    let notebook = JSON.parse(localStorage.getItem('errorNotebook') || '[]');
    let cameraStream = null;
    let currentFacingMode = 'environment';
    let tesseractWorker = null;

    const subjectNames = {
      math: '数学',
      english: '英语',
      physics: '物理',
      chemistry: '化学'
    };

    const subjectClasses = {
      math: 'subject-math',
      english: 'subject-english',
      physics: 'subject-physics',
      chemistry: 'subject-chemistry'
    };

    const subjectBadgeStyles = {
      math: { bg: '#eff6ff', color: '#3b82f6', border: '#dbeafe' },
      english: { bg: '#fef3c7', color: '#d97706', border: '#fde68a' },
      physics: { bg: '#ede9fe', color: '#7c3aed', border: '#ddd6fe' },
      chemistry: { bg: '#d1fae5', color: '#059669', border: '#a7f3d0' }
    };

    // ========== Camera Functions ==========
    async function openCamera() {
      const modal = document.getElementById('cameraModal');
      const video = document.getElementById('cameraVideo');
      modal.classList.add('active');

      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1920 },
            height: { ideal: 1440 }
          }
        };
        cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = cameraStream;
      } catch (err) {
        console.error('Camera error:', err);
        closeCamera();
        showToast('无法打开相机，请检查权限设置');
      }
    }

    function closeCamera() {
      const modal = document.getElementById('cameraModal');
      const video = document.getElementById('cameraVideo');
      modal.classList.remove('active');

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      video.srcObject = null;
    }

    async function switchCamera() {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      const video = document.getElementById('cameraVideo');
      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1920 },
            height: { ideal: 1440 }
          }
        };
        cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = cameraStream;
      } catch (err) {
        console.error('Switch camera error:', err);
        showToast('切换摄像头失败');
      }
    }

    function capturePhoto() {
      const video = document.getElementById('cameraVideo');
      const canvas = document.getElementById('cameraCanvas');
      const flash = document.getElementById('captureFlash');

      // Flash effect
      flash.classList.remove('flash');
      void flash.offsetWidth;
      flash.classList.add('flash');

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      closeCamera();
      processImage(dataUrl);
    }

    // ========== File Upload ==========
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('请选择图片文件');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        processImage(e.target.result);
      };
      reader.readAsDataURL(file);
      // Reset input so same file can be selected again
      event.target.value = '';
    }

    // ========== Image Processing & OCR ==========
    async function processImage(dataUrl) {
      // Show preview
      const preview = document.getElementById('photoPreview');
      const previewImg = document.getElementById('previewImg');
      previewImg.src = dataUrl;
      preview.classList.add('active');

      // Show OCR status
      setOcrStatus('loading', '正在识别文字，请稍候...');

      try {
        // Initialize worker if needed
        if (!tesseractWorker) {
          tesseractWorker = await Tesseract.createWorker('chi_sim+eng', 1, {
            logger: m => {
              if (m.status === 'recognizing text') {
                const progress = Math.round((m.progress || 0) * 100);
                setOcrStatus('loading', `正在识别文字... ${progress}%`);
              }
            }
          });
        }

        const { data: { text } } = await tesseractWorker.recognize(dataUrl);
        const cleanedText = text.replace(/\n{3,}/g, '\n\n').trim();

        if (cleanedText.length < 2) {
          setOcrStatus('error', '未能识别到文字，请手动输入');
          showToast('识别结果为空，请手动输入');
          return;
        }

        // Fill textarea
        const textarea = document.getElementById('question');
        textarea.value = cleanedText;
        textarea.focus();

        setOcrStatus('success', `识别成功，共 ${cleanedText.length} 个字符`);
        showToast('文字识别完成');

      } catch (err) {
        console.error('OCR error:', err);
        setOcrStatus('error', '识别失败，请手动输入');
        showToast('文字识别失败，请手动输入');
      }
    }

    function setOcrStatus(type, message) {
      const status = document.getElementById('ocrStatus');
      const text = document.getElementById('ocrStatusText');

      status.className = 'ocr-status active';
      if (type === 'loading') {
        status.classList.add('active');
      } else if (type === 'success') {
        status.classList.add('success');
      } else if (type === 'error') {
        status.classList.add('error');
      }
      text.textContent = message;
    }

    function removePhoto() {
      const preview = document.getElementById('photoPreview');
      const status = document.getElementById('ocrStatus');
      preview.classList.remove('active');
      status.className = 'ocr-status';
      status.classList.remove('active');
    }

    // ========== Tab switching ==========
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      if (tab === 'input') {
        document.getElementById('input-section').style.display = 'block';
        document.getElementById('notebook-section').classList.remove('active');
      } else {
        document.getElementById('input-section').style.display = 'none';
        document.getElementById('notebook-section').classList.add('active');
        renderNotebook();
      }
    }

    // ========== Mock AI analysis ==========
    function analyzeError(subject, question) {
      const analyses = {
        math: {
          tags: ['二次函数', '区间最值', '函数图像', '对称轴'],
          practices: [
            { q: '已知函数 f(x) = -x² + 4x - 1，求 f(x) 在区间 [1,4] 上的最大值与最小值。', a: '最大值：f(2) = 3；最小值：f(4) = -1' },
            { q: '若函数 f(x) = x² - 2ax + 3 在区间 [0,2] 上的最小值为 1，求实数 a 的值。', a: 'a = 1 或 a = √2' }
          ]
        },
        english: {
          tags: ['时态辨析', '现在完成时', '一般过去时', '时间状语'],
          practices: [
            { q: '用所给动词的正确形式填空：I ______ (live) in Beijing since 2010.', a: 'have lived / have been living' },
            { q: '选择填空：She ______ (has gone / has been / went) to Paris three times.', a: 'has been' }
          ]
        },
        physics: {
          tags: ['牛顿第二定律', '受力分析', '加速度', '摩擦力'],
          practices: [
            { q: '质量为 2kg 的物体在水平面上受到 10N 的拉力作用，若动摩擦因数为 0.3，求物体的加速度。（g = 10m/s²）', a: 'a = 2 m/s²' },
            { q: '一个物体沿倾角为 30° 的光滑斜面下滑，求其加速度。（g = 10m/s²）', a: 'a = 5 m/s²' }
          ]
        },
        chemistry: {
          tags: ['氧化还原反应', '化合价变化', '电子转移', '配平'],
          practices: [
            { q: '配平下列方程式：Cu + HNO₃(稀) → Cu(NO₃)₂ + NO↑ + H₂O', a: '3Cu + 8HNO₃(稀) = 3Cu(NO₃)₂ + 2NO↑ + 4H₂O' },
            { q: '在反应 2KMnO₄ + 16HCl = 2KCl + 2MnCl₂ + 5Cl₂↑ + 8H₂O 中，氧化剂与还原剂的物质的量之比为？', a: '1 : 5' }
          ]
        }
      };

      let result = analyses[subject];
      if (!result) {
        result = {
          tags: ['基础概念', '理解应用', '综合分析'],
          practices: [
            { q: '请根据本题涉及的核心概念，完成一道类似的巩固练习题。（AI生成）', a: '详见解析' },
            { q: '进阶练习：结合多个知识点进行综合应用的变式题。（AI生成）', a: '详见解析' }
          ]
        };
      }
      return result;
    }

    function organizeError() {
      const subject = document.getElementById('subject').value;
      const question = document.getElementById('question').value.trim();

      if (!subject) {
        showToast('请选择学科');
        return;
      }
      if (!question) {
        showToast('请输入错题描述');
        return;
      }

      const btn = document.getElementById('organizeBtn');
      const loading = document.getElementById('loading');
      const result = document.getElementById('result');

      btn.disabled = true;
      result.classList.remove('active');
      loading.classList.add('active');

      setTimeout(() => {
        const analysis = analyzeError(subject, question);
        currentResult = {
          id: Date.now(),
          subject,
          question,
          tags: analysis.tags,
          practices: analysis.practices,
          date: new Date().toLocaleString('zh-CN')
        };

        renderResult(currentResult);
        loading.classList.remove('active');
        result.classList.add('active');
        btn.disabled = false;
      }, 1500);
    }

    function renderResult(data) {
      const badge = document.getElementById('subjectBadge');
      const style = subjectBadgeStyles[data.subject];
      badge.style.background = style.bg;
      badge.style.color = style.color;
      badge.style.border = `1px solid ${style.border}`;
      badge.textContent = subjectNames[data.subject];

      const tagsContainer = document.getElementById('knowledgeTags');
      tagsContainer.innerHTML = data.tags.map(tag => `<span class="knowledge-tag">${tag}</span>`).join('');

      const practiceContainer = document.getElementById('practiceList');
      practiceContainer.innerHTML = data.practices.map((p, i) => `
        <div class="practice-item">
          <div class="practice-item-header">
            <span class="practice-num">${i + 1}</span>
            <span class="practice-label">变式练习 ${i + 1}</span>
          </div>
          <div class="practice-content">${p.q}</div>
          <div class="practice-answer"><strong>答案：</strong>${p.a}</div>
        </div>
      `).join('');

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.classList.remove('saved');
      saveBtn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        加入错题本
      `;
    }

    function saveToNotebook() {
      if (!currentResult) return;

      const exists = notebook.some(item => item.id === currentResult.id);
      if (exists) {
        showToast('该错题已在错题本中');
        return;
      }

      notebook.unshift(currentResult);
      localStorage.setItem('errorNotebook', JSON.stringify(notebook));

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.classList.add('saved');
      saveBtn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        已加入错题本
      `;
      showToast('成功加入错题本');
    }

    function renderNotebook() {
      const list = document.getElementById('notebookList');
      const count = document.getElementById('notebookCount');
      count.textContent = `${notebook.length} 道错题`;

      if (notebook.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <p>错题本还是空的，快去整理第一道错题吧</p>
          </div>
        `;
        return;
      }

      list.innerHTML = notebook.map(item => `
        <div class="notebook-item" onclick="viewNotebookItem(${item.id})">
          <span class="notebook-item-subject ${subjectClasses[item.subject]}">${subjectNames[item.subject]}</span>
          <div class="notebook-item-title">${item.question.substring(0, 60)}${item.question.length > 60 ? '...' : ''}</div>
          <div class="notebook-item-date">${item.date}</div>
        </div>
      `).join('');
    }

    function viewNotebookItem(id) {
      const item = notebook.find(n => n.id === id);
      if (!item) return;
      currentResult = item;
      renderResult(item);
      switchTab('input');
      document.getElementById('result').classList.add('active');
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.classList.add('saved');
      saveBtn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        已加入错题本
      `;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
