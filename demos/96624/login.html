<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伴瞳 - 登录</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <a href="#login-form" class="skip-link" id="skip-link">跳到主表单</a>

    <div class="container">
        <!-- 左侧品牌展示区 -->
        <section class="cover" aria-label="品牌介绍区域">
            <div class="cover-icon" aria-hidden="true">👁</div>
            <h1>伴瞳</h1>
            <p>智能出行助手 · 实时无障碍陪伴</p>
        </section>

        <!-- 右侧表单区 -->
        <section class="form-container" aria-label="登录注册表单区域">
            <!-- 切换按钮 -->
            <div class="form-toggle" role="tablist" aria-label="登录或注册">
                <div class="toggle-slider" id="toggle-slider" aria-hidden="true"></div>
                <button type="button" id="tab-login" class="toggle-btn active"
                        role="tab" aria-selected="true" aria-controls="login-form"
                        onclick="switchForm('login')">登录</button>
                <button type="button" id="tab-register" class="toggle-btn"
                        role="tab" aria-selected="false" aria-controls="register-form"
                        onclick="switchForm('register')">注册</button>
            </div>

            <h2 class="form-subtitle" id="form-subtitle" aria-live="polite">欢迎回来，请登录</h2>

            <!-- 登录表单 -->
            <form id="login-form" class="form active" role="tabpanel"
                  aria-labelledby="tab-login" novalidate onsubmit="return false;">
                <div class="field">
                    <label for="login-username">用户名</label>
                    <input type="text" id="login-username"
                           placeholder="请输入用户名"
                           autocomplete="username"
                           aria-required="true"
                           aria-describedby="login-username-error"
                           oninput="clearError('login-username')"
                           onkeypress="if(event.key==='Enter')login()">
                    <div class="error-text" id="login-username-error" role="alert" aria-live="assertive"></div>
                </div>

                <div class="field">
                    <label for="login-password">密码</label>
                    <div class="password-wrap">
                        <input type="password" id="login-password"
                               placeholder="请输入密码"
                               autocomplete="current-password"
                               aria-required="true"
                               aria-describedby="login-password-error"
                               oninput="clearError('login-password')"
                               onkeypress="if(event.key==='Enter')login()">
                        <button type="button" class="pwd-toggle"
                                aria-label="显示或隐藏密码"
                                onclick="togglePassword('login-password', this)"><svg class="eye-icon" viewBox="0 0 40 40" aria-hidden="true"><circle class="eye-glow" cx="20" cy="20" r="18"/><path class="eye-shape" d="M4,20 Q20,6 36,20 Q20,34 4,20 Z"/><circle class="eye-pupil" cx="20" cy="20" r="5"/><g class="eye-rays"><line x1="20" y1="0" x2="20" y2="4"/><line x1="20" y1="36" x2="20" y2="40"/><line x1="0" y1="20" x2="4" y2="20"/><line x1="36" y1="20" x2="40" y2="20"/><line x1="6" y1="6" x2="9" y2="9"/><line x1="31" y1="31" x2="34" y2="34"/><line x1="6" y1="34" x2="9" y2="31"/><line x1="31" y1="9" x2="34" y2="6"/></g></svg></button>
                    </div>
                    <div class="error-text" id="login-password-error" role="alert" aria-live="assertive"></div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me">
                        <span>记住密码</span>
                    </label>
                    <a href="javascript:void(0)" class="link"
                       onclick="showForgotPassword()" aria-label="忘记密码，点击查看提示">忘记密码？</a>
                </div>

                <button type="button" class="submit-btn" onclick="login()"
                        aria-describedby="form-status">登录</button>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" class="form" role="tabpanel"
                  aria-labelledby="tab-register" style="display:none;" novalidate onsubmit="return false;">
                <div class="field">
                    <label for="register-username">用户名</label>
                    <input type="text" id="register-username"
                           placeholder="3-20位，支持字母数字下划线中文"
                           aria-required="true"
                           aria-describedby="register-username-error"
                           oninput="clearError('register-username')"
                           onkeypress="if(event.key==='Enter')register()">
                    <div class="error-text" id="register-username-error" role="alert" aria-live="assertive"></div>
                </div>

                <div class="field">
                    <label for="register-email">邮箱</label>
                    <input type="email" id="register-email"
                           placeholder="请输入邮箱"
                           aria-required="true"
                           aria-describedby="register-email-error"
                           oninput="clearError('register-email')"
                           onkeypress="if(event.key==='Enter')register()">
                    <div class="error-text" id="register-email-error" role="alert" aria-live="assertive"></div>
                </div>

                <div class="field">
                    <label for="register-password">密码</label>
                    <div class="password-wrap">
                        <input type="password" id="register-password"
                               placeholder="至少6位，需含字母和数字"
                               aria-required="true"
                               aria-describedby="register-password-error password-strength-text"
                               oninput="onPasswordInput()"
                               onkeypress="if(event.key==='Enter')register()">
                        <button type="button" class="pwd-toggle"
                                aria-label="显示或隐藏密码"
                                onclick="togglePassword('register-password', this)"><svg class="eye-icon" viewBox="0 0 40 40" aria-hidden="true"><circle class="eye-glow" cx="20" cy="20" r="18"/><path class="eye-shape" d="M4,20 Q20,6 36,20 Q20,34 4,20 Z"/><circle class="eye-pupil" cx="20" cy="20" r="5"/><g class="eye-rays"><line x1="20" y1="0" x2="20" y2="4"/><line x1="20" y1="36" x2="20" y2="40"/><line x1="0" y1="20" x2="4" y2="20"/><line x1="36" y1="20" x2="40" y2="20"/><line x1="6" y1="6" x2="9" y2="9"/><line x1="31" y1="31" x2="34" y2="34"/><line x1="6" y1="34" x2="9" y2="31"/><line x1="31" y1="9" x2="34" y2="6"/></g></svg></button>
                    </div>
                    <div class="password-strength" aria-hidden="true">
                        <div class="password-strength-bar" id="password-strength-bar"></div>
                    </div>
                    <div class="strength-text" id="password-strength-text" role="status" aria-live="polite">密码强度：未输入</div>
                    <div class="error-text" id="register-password-error" role="alert" aria-live="assertive"></div>
                </div>

                <div class="field">
                    <label for="register-confirm-password">确认密码</label>
                    <input type="password" id="register-confirm-password"
                           placeholder="请再次输入密码"
                           aria-required="true"
                           aria-describedby="register-confirm-password-error"
                           oninput="clearError('register-confirm-password')"
                           onkeypress="if(event.key==='Enter')register()">
                    <div class="error-text" id="register-confirm-password-error" role="alert" aria-live="assertive"></div>
                </div>

                <button type="button" class="submit-btn" onclick="register()"
                        aria-describedby="form-status">注册</button>
            </form>

            <!-- 全局状态区（供读屏实时朗读） -->
            <div class="sr-only" id="form-status" role="status" aria-live="assertive" aria-atomic="true"></div>
        </section>
    </div>

    <!-- Toast 反馈 -->
    <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

    <!-- 加载遮罩 -->
    <div class="loading-mask" id="loading-mask" role="status" aria-live="polite" aria-label="正在处理，请稍候">
        <div class="spinner" aria-hidden="true"></div>
        <div class="loading-text">正在处理...</div>
    </div>

    <script src="login.js"></script>
</body>
</html>
