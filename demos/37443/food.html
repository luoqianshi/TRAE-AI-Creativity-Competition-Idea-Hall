<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深夜食堂 - 智能交互版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fdf6ee;
            padding: 30px 20px;
            color: #2d1f14;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 40px 20px 30px;
            background: linear-gradient(135deg, #f97316, #ef4444);
            border-radius: 24px;
            color: #fff;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.25);
        }
        .header h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .header h1 span {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 0 16px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 400;
            margin-left: 12px;
        }
        .header p {
            opacity: 0.9;
            margin-top: 10px;
            font-size: 16px;
        }
        .header .toast-badge {
            display: inline-block;
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 13px;
            backdrop-filter: blur(4px);
        }

        /* 输入区 */
        .search-box {
            background: #fff;
            border-radius: 16px;
            padding: 24px 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            margin-bottom: 30px;
            border: 1px solid #f0e6dc;
        }
        .search-box label {
            font-size: 14px;
            font-weight: 600;
            color: #5a3e2b;
            display: block;
            margin-bottom: 6px;
        }
        .search-box textarea {
            width: 100%;
            border: 2px solid #f0e6dc;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 70px;
            transition: border 0.2s;
            background: #fefcf9;
        }
        .search-box textarea:focus {
            outline: none;
            border-color: #f97316;
        }
        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 14px;
            align-items: center;
        }
        .tag-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }
        .tag {
            padding: 6px 18px;
            border-radius: 30px;
            border: 1.5px solid #e8ddd2;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #5a3e2b;
            user-select: none;
        }
        .tag:hover {
            border-color: #f97316;
            background: #fef3e8;
        }
        .tag.active {
            background: #f97316;
            color: #fff;
            border-color: #f97316;
        }
        .btn-primary {
            background: #f97316;
            color: #fff;
            border: none;
            padding: 10px 32px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background: #ea580c;
        }
        .btn-secondary {
            background: #f0e6dc;
            color: #5a3e2b;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-secondary:hover {
            background: #e0d4c8;
        }
        .btn-primary:active,
        .btn-secondary:active {
            transform: scale(0.96);
        }

        /* 结果计数 */
        .result-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 14px;
            color: #8a7a6a;
        }
        .result-meta .count {
            font-weight: 600;
            color: #2d1f14;
        }

        /* 菜谱网格 */
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: 260px;
        }
        @media (max-width: 700px) {
            .result-grid {
                grid-template-columns: 1fr;
            }
        }

        .recipe-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 1px solid #f0e6dc;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeUp 0.35s ease;
        }
        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .recipe-img {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            color: rgba(255, 255, 255, 0.7);
            background: linear-gradient(135deg, #fbbf24, #f97316);
        }
        .recipe-img.dark {
            background: linear-gradient(135deg, #f97316, #dc2626);
        }
        .recipe-img.green {
            background: linear-gradient(135deg, #a3e635, #22c55e);
        }
        .recipe-img.purple {
            background: linear-gradient(135deg, #c084fc, #8b5cf6);
        }
        .recipe-img.blue {
            background: linear-gradient(135deg, #60a5fa, #2563eb);
        }

        .recipe-body {
            padding: 18px 22px 22px;
        }
        .recipe-body h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .recipe-body .meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #8a7a6a;
            margin: 6px 0 10px;
        }
        .recipe-body .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .recipe-body .desc {
            font-size: 14px;
            color: #5a4a3a;
            line-height: 1.6;
        }
        .recipe-body .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .recipe-body .tags .mini-tag {
            font-size: 11px;
            padding: 2px 12px;
            border-radius: 20px;
            background: #fef3e8;
            color: #b45309;
        }

        /* 空状态 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #b8a89a;
        }
        .empty-state .big-icon {
            font-size: 56px;
            margin-bottom: 10px;
        }

        /* 底部 */
        .footer-text {
            text-align: center;
            color: #b8a89a;
            font-size: 13px;
            margin-top: 30px;
            border-top: 1px solid #f0e6dc;
            padding-top: 20px;
        }
        .footer-text strong {
            color: #f97316;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🍳 深夜食堂 <span>AI 互动版</span></h1>
            <p>输入食材或心情，点击按钮，AI 帮你决定今天吃什么</p>
            <div class="toast-badge">⚡ 点击下方标签或按钮体验实时交互</div>
        </div>

        <!-- 搜索区 -->
        <div class="search-box">
            <label>📝 告诉我你冰箱里有什么、今天想吃什么风格</label>
            <textarea id="inputField" placeholder="例如：冰箱里有鸡蛋、番茄、青菜，今天想吃得清淡一点，最好10分钟能搞定">冰箱里有鸡蛋、番茄、青菜，今天想吃得清淡一点</textarea>
            <div class="search-row">
                <div class="tag-group" id="tagGroup">
                    <span class="tag active" data-filter="all">🍜 全部</span>
                    <span class="tag" data-filter="lowcal">🥗 低卡</span>
                    <span class="tag" data-filter="fast">⏱️ 快手</span>
                    <span class="tag" data-filter="veggie">🥬 素食</span>
                    <span class="tag" data-filter="home">🏠 家常</span>
                    <span class="tag" data-filter="soup">🍲 汤品</span>
                </div>
                <button class="btn-primary" id="inspireBtn">✨ 给我灵感</button>
                <button class="btn-secondary" id="randomBtn">🎲 随机探索</button>
            </div>
        </div>

        <!-- 结果区域 -->
        <div class="result-meta">
            <span>🍽️ 今日推荐 · <span class="count" id="resultCount">4</span> 道菜</span>
            <span id="activeFilterLabel" style="font-size:13px; background:#f0e6dc; padding:2px 14px; border-radius:20px;">全部</span>
        </div>
        <div class="result-grid" id="recipeGrid">
            <!-- JS 动态渲染 -->
        </div>

        <div class="footer-text">
            由 <strong>TRAE Work</strong> 生成 · 创意提案「深夜食堂」· 世界很大，放手去造 🌍
        </div>
    </div>

    <script>
        // ---------- 菜谱数据库 ----------
        const recipeDB = [{
            id: 1,
            name: '番茄鸡蛋面',
            emoji: '🍅',
            time: '15分钟',
            level: '简单',
            calories: '320 kcal',
            desc: '经典家常味道，酸甜开胃。番茄炒出汤汁后加水煮面，最后淋入蛋液，撒上葱花。',
            tags: ['home', 'fast'],
            keywords: ['番茄', '鸡蛋', '面', '家常', '快手']
        }, {
            id: 2,
            name: '蒜蓉清炒时蔬',
            emoji: '🥬',
            time: '8分钟',
            level: '超简单',
            calories: '90 kcal',
            desc: '蒜蓉爆香，快速翻炒青菜，保持脆嫩口感。清淡健康，适合减脂期。',
            tags: ['lowcal', 'veggie', 'fast'],
            keywords: ['青菜', '蒜蓉', '清淡', '素食', '低卡']
        }, {
            id: 3,
            name: '番茄炒蛋盖饭',
            emoji: '🥘',
            time: '12分钟',
            level: '简单',
            calories: '450 kcal',
            desc: '国民下饭菜，酸甜浓郁，汤汁拌饭是灵魂。鸡蛋嫩滑、番茄软烂。',
            tags: ['home', 'fast'],
            keywords: ['番茄', '鸡蛋', '盖饭', '家常']
        }, {
            id: 4,
            name: '青菜鸡蛋汤',
            emoji: '🥣',
            time: '10分钟',
            level: '超简单',
            calories: '150 kcal',
            desc: '清淡暖胃的汤品，鸡蛋打成蛋花，青菜烫熟即捞。适合没胃口时。',
            tags: ['lowcal', 'veggie', 'soup', 'fast'],
            keywords: ['青菜', '鸡蛋', '汤', '清淡', '暖胃']
        }, {
            id: 5,
            name: '麻辣豆腐煲',
            emoji: '🌶️',
            time: '20分钟',
            level: '中等',
            calories: '380 kcal',
            desc: '嫩滑豆腐配上麻辣酱汁，小火慢炖入味，超级下饭。',
            tags: ['home'],
            keywords: ['豆腐', '麻辣', '下饭', '辣']
        }, {
            id: 6,
            name: '凉拌黄瓜木耳',
            emoji: '🥒',
            time: '5分钟',
            level: '超简单',
            calories: '60 kcal',
            desc: '爽脆开胃，醋香扑鼻。低卡又解腻，夏日必备凉菜。',
            tags: ['lowcal', 'veggie', 'fast'],
            keywords: ['黄瓜', '木耳', '凉拌', '低卡', '开胃']
        }, {
            id: 7,
            name: '香菇鸡肉粥',
            emoji: '🍗',
            time: '30分钟',
            level: '简单',
            calories: '280 kcal',
            desc: '鲜香软糯，暖胃暖心。鸡肉丝和香菇的鲜味完全融入米粥中。',
            tags: ['home', 'soup'],
            keywords: ['香菇', '鸡肉', '粥', '暖胃', '清淡']
        }, {
            id: 8,
            name: '酸辣土豆丝',
            emoji: '🥔',
            time: '12分钟',
            level: '中等',
            calories: '210 kcal',
            desc: '酸辣脆爽，刀工和火候是关键。最家常的米饭杀手。',
            tags: ['home', 'fast'],
            keywords: ['土豆', '酸辣', '家常', '下饭']
        }];

        // ---------- 核心逻辑 ----------
        let currentFilter = 'all';
        let currentRecipes = [...recipeDB];

        const grid = document.getElementById('recipeGrid');
        const countSpan = document.getElementById('resultCount');
        const filterLabel = document.getElementById('activeFilterLabel');
        const inputField = document.getElementById('inputField');

        // 渲染函数
        function renderRecipes(recipes) {
            if (!recipes || recipes.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="big-icon">🔍</div>
                        <p>没有找到匹配的菜谱，试试其他关键词或点击「随机探索」</p>
                    </div>
                `;
                countSpan.textContent = '0';
                return;
            }

            const colorClasses = ['', 'dark', 'green', 'purple', 'blue'];
            let html = '';
            recipes.forEach((r, idx) => {
                const colorClass = colorClasses[idx % colorClasses.length];
                const tagHtml = r.tags.map(t => {
                    const label = {
                        'home': '🏠 家常',
                        'fast': '⏱️ 快手',
                        'lowcal': '🥗 低卡',
                        'veggie': '🥬 素食',
                        'soup': '🍲 汤品'
                    } [t] || t;
                    return `<span class="mini-tag">${label}</span>`;
                }).join('');

                html += `
                    <div class="recipe-card">
                        <div class="recipe-img ${colorClass}">${r.emoji}</div>
                        <div class="recipe-body">
                            <h3>${r.name}</h3>
                            <div class="meta">
                                <span>⏱️ ${r.time}</span>
                                <span>⭐ ${r.level}</span>
                                <span>🔥 ${r.calories}</span>
                            </div>
                            <div class="desc">${r.desc}</div>
                            <div class="tags">${tagHtml}</div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
            countSpan.textContent = recipes.length;
        }

        // 过滤函数
        function filterByTag(tag) {
            currentFilter = tag;
            // 更新标签激活样式
            document.querySelectorAll('.tag').forEach(el => {
                el.classList.toggle('active', el.dataset.filter === tag);
            });
            // 更新标签显示文字
            const labelMap = {
                'all': '全部',
                'lowcal': '🥗 低卡',
                'fast': '⏱️ 快手',
                'veggie': '🥬 素食',
                'home': '🏠 家常',
                'soup': '🍲 汤品'
            };
            filterLabel.textContent = labelMap[tag] || tag;

            if (tag === 'all') {
                currentRecipes = [...recipeDB];
            } else {
                currentRecipes = recipeDB.filter(r => r.tags.includes(tag));
            }
            renderRecipes(currentRecipes);
        }

        // 关键词匹配 (智能灵感)
        function getInspiration() {
            const text = inputField.value.trim().toLowerCase();
            if (!text) {
                // 没输入就随机
                randomExplore();
                return;
            }

            // 拆词
            const words = text.split(/[，,、.\s]+/).filter(w => w.length > 0);
            // 给每个菜谱打分
            const scored = recipeDB.map(r => {
                let score = 0;
                const keyStr = r.keywords.join(' ').toLowerCase();
                words.forEach(w => {
                    if (keyStr.includes(w)) score += 2;
                    if (r.name.includes(w)) score += 3;
                });
                // 额外匹配“清淡”、“快手”等语义（简化版直接匹配标签描述）
                if (text.includes('清淡') && r.tags.includes('lowcal')) score += 1;
                if (text.includes('快') && r.tags.includes('fast')) score += 1;
                if (text.includes('素') && r.tags.includes('veggie')) score += 1;
                if (text.includes('汤') && r.tags.includes('soup')) score += 1;
                return { ...r, score };
            });

            const sorted = scored.filter(r => r.score > 0).sort((a, b) => b.score - a.score);
            if (sorted.length === 0) {
                // 无匹配则随机展示3道
                const shuffled = [...recipeDB].sort(() => Math.random() - 0.5).slice(0, 3);
                currentRecipes = shuffled;
                renderRecipes(shuffled);
                // 重置过滤状态
                resetFilterUI();
                return;
            }

            // 取前4个
            const top = sorted.slice(0, 4);
            currentRecipes = top;
            renderRecipes(top);
            resetFilterUI();
        }

        // 随机探索
        function randomExplore() {
            const shuffled = [...recipeDB].sort(() => Math.random() - 0.5);
            // 取4-5个
            const count = Math.min(4 + Math.floor(Math.random() * 2), shuffled.length);
            const selected = shuffled.slice(0, count);
            currentRecipes = selected;
            renderRecipes(selected);
            resetFilterUI();
        }

        function resetFilterUI() {
            currentFilter = 'all';
            document.querySelectorAll('.tag').forEach(el => {
                el.classList.toggle('active', el.dataset.filter === 'all');
            });
            filterLabel.textContent = '全部';
        }

        // ---------- 绑定事件 ----------
        // 1. 标签点击
        document.querySelectorAll('.tag').forEach(el => {
            el.addEventListener('click', function() {
                const filter = this.dataset.filter;
                filterByTag(filter);
            });
        });

        // 2. 灵感按钮
        document.getElementById('inspireBtn').addEventListener('click', getInspiration);

        // 3. 随机按钮
        document.getElementById('randomBtn').addEventListener('click', randomExplore);

        // 4. 支持回车快捷操作（在textarea按Ctrl+Enter触发灵感）
        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                getInspiration();
            }
        });

        // ---------- 初始加载 ----------
        // 默认展示前4个（或者全部，但控制台显示4个）
        const initial = recipeDB.slice(0, 4);
        currentRecipes = initial;
        renderRecipes(initial);
        filterLabel.textContent = '全部 (默认)';
    </script>

</body>
</html>
