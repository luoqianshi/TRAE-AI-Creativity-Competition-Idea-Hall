<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>药品说明书朗读器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #1a1a2e;
      --card-bg: rgba(30, 40, 70, 0.85);
      --card-border: rgba(100, 120, 180, 0.25);
      --text-primary: #ffffff;
      --text-secondary: #a0b0d0;
      --accent-pink: #e94560;
      --accent-pink-light: #ff6b6b;
      --accent-purple: #533483;
      --accent-purple-light: #7b68ee;
      --accent-teal: #0f3460;
      --label-color: #e94560;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    /* Phone frame */
    .phone-frame {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(180deg, #16213e 0%, #1a1a2e 100%);
      border-radius: 32px;
      padding: 24px 20px;
      border: 1px solid rgba(100, 120, 180, 0.15);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .phone-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #0a0a1a;
      border-radius: 0 0 20px 20px;
      z-index: 10;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 20px 0 24px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-pink);
      letter-spacing: 2px;
    }

    /* Section */
    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Upload buttons */
    .btn-upload {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn-upload:active { transform: scale(0.97); }

    .btn-camera {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-pink-light));
      box-shadow: 0 6px 24px rgba(233, 69, 96, 0.35);
    }

    .btn-album {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-purple-light));
      box-shadow: 0 6px 24px rgba(83, 52, 131, 0.35);
    }

    .btn-read {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-purple-light));
      box-shadow: 0 6px 24px rgba(83, 52, 131, 0.35);
      margin-top: 16px;
    }

    .btn-slow {
      background: var(--accent-teal);
      border: 1px solid rgba(100, 120, 180, 0.3);
      color: var(--text-secondary);
      margin-top: 12px;
    }

    .btn-slow.active {
      background: linear-gradient(135deg, #2a9d8f, #264653);
      color: white;
      border-color: transparent;
    }

    /* Info cards */
    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
    }

    .info-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--label-color);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-content {
      font-size: 20px;
      line-height: 1.7;
      color: var(--text-primary);
      word-break: break-all;
    }

    /* Preview */
    .preview-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }

    .preview-img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 12px;
    }

    /* Loading */
    .loading-box {
      text-align: center;
      padding: 60px 20px;
    }

    .loading-spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(233, 69, 96, 0.15);
      border-top-color: var(--accent-pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 18px;
      color: var(--text-primary);
      font-weight: 500;
    }

    .loading-sub {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    /* Playing indicator */
    .playing-indicator {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
    }

    .playing-indicator.active { display: flex; }

    .bar {
      width: 4px;
      height: 20px;
      background: var(--accent-pink);
      border-radius: 2px;
      animation: soundBar 0.8s ease-in-out infinite;
    }

    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.15s; }

    @keyframes soundBar {
      0%, 100% { height: 12px; }
      50% { height: 28px; }
    }

    /* Bottom actions */
    .bottom-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .bottom-btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .bottom-btn:active { transform: scale(0.97); }

    .bottom-btn.primary {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-pink-light));
      color: white;
      border: none;
    }

    /* Demo badge */
    .demo-badge {
      text-align: center;
      padding: 16px 0 8px;
      font-size: 12px;
      color: var(--text-secondary);
      opacity: 0.6;
    }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="phone-frame">

    <!-- Header -->
    <div class="header">
      <h1>药品说明书朗读器</h1>
    </div>

    <!-- Upload Section -->
    <div class="section active" id="uploadSection">
      <button class="btn-upload btn-camera" onclick="document.getElementById('cameraInput').click()">
        <span>&#128247;</span> 拍照识别药品
      </button>
      <input type="file" id="cameraInput" accept="image/*" capture="camera" onchange="handleFile(event)">

      <button class="btn-upload btn-album" onclick="document.getElementById('albumInput').click()">
        <span>&#128193;</span> 从相册选择
      </button>
      <input type="file" id="albumInput" accept="image/*" onchange="handleFile(event)">
    </div>

    <!-- Preview Section -->
    <div class="section" id="previewSection">
      <div class="preview-box">
        <img class="preview-img" id="previewImg" src="" alt="药品图片">
      </div>
      <button class="btn-upload btn-camera" onclick="startRecognize()">
        <span>&#9989;</span> 开始识别
      </button>
      <button class="btn-upload btn-slow" onclick="resetUpload()">
        <span>&#128260;</span> 重新选择
      </button>
    </div>

    <!-- Loading Section -->
    <div class="section" id="loadingSection">
      <div class="loading-box">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在识别药品信息...</div>
        <div class="loading-sub">AI正在分析图片中的文字</div>
      </div>
    </div>

    <!-- Result Section -->
    <div class="section" id="resultSection">
      <div class="info-card">
        <div class="info-label">&#128138; 药品名称</div>
        <div class="info-content" id="drugName">阿托伐他汀钙片</div>
      </div>

      <div class="info-card">
        <div class="info-label">&#128167; 用法用量</div>
        <div class="info-content" id="usage">每日一次，每次一片，晚餐时服用</div>
      </div>

      <div class="info-card">
        <div class="info-label">&#9888; 禁忌</div>
        <div class="info-content" id="contraindication">活动性肝病、妊娠期及哺乳期妇女禁用</div>
      </div>

      <div class="info-card">
        <div class="info-label">&#128197; 有效期</div>
        <div class="info-content" id="expiry">2027年06月15日</div>
      </div>

      <div class="info-card">
        <div class="info-label">&#128137; 不良反应</div>
        <div class="info-content" id="sideEffect">常见：头痛、恶心、腹泻、肌肉疼痛</div>
      </div>

      <div class="info-card">
        <div class="info-label">&#128221; 注意事项</div>
        <div class="info-content" id="precaution">用药期间定期监测肝功能，避免与葡萄柚汁同服</div>
      </div>

      <button class="btn-upload btn-read" id="readBtn" onclick="toggleRead()">
        <span id="readIcon">&#128266;</span> <span id="readText">朗读说明书</span>
      </button>

      <div class="playing-indicator" id="playingIndicator">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <span style="color: var(--accent-pink); font-size: 14px; margin-left: 8px;">正在朗读...</span>
      </div>

      <button class="btn-upload btn-slow" id="slowBtn" onclick="toggleSlow()">
        <span>&#128034;</span> 放慢语速
      </button>

      <div class="bottom-actions">
        <button class="bottom-btn" onclick="resetUpload()">&#128247; 识别其他</button>
        <button class="bottom-btn primary" onclick="shareResult()">&#128236; 分享</button>
      </div>
    </div>

    <div class="demo-badge">Demo演示版本 · 数据为模拟</div>

  </div>

  <script>
    // Demo drug database
    const demoDrugs = [
      {
        name: "阿托伐他汀钙片",
        usage: "每日一次，每次一片，晚餐时服用",
        contraindication: "活动性肝病、妊娠期及哺乳期妇女禁用",
        expiry: "2027年06月15日",
        sideEffect: "常见：头痛、恶心、腹泻、肌肉疼痛",
        precaution: "用药期间定期监测肝功能，避免与葡萄柚汁同服"
      },
      {
        name: "二甲双胍缓释片",
        usage: "每日两次，每次一片，随餐服用",
        contraindication: "严重肾功能不全、代谢性酸中毒患者禁用",
        expiry: "2026年12月30日",
        sideEffect: "常见：胃肠道不适、腹泻、恶心",
        precaution: "定期检查肾功能，服药期间避免饮酒"
      },
      {
        name: "氨氯地平片",
        usage: "每日一次，每次一片，晨起服用",
        contraindication: "严重低血压、对二氢吡啶类药物过敏者禁用",
        expiry: "2027年03月20日",
        sideEffect: "常见：头痛、面部潮红、踝部水肿",
        precaution: "用药初期避免驾驶，不可突然停药"
      },
      {
        name: "阿司匹林肠溶片",
        usage: "每日一次，每次一片，饭后服用",
        contraindication: "活动性出血、血友病、严重肝肾功能不全禁用",
        expiry: "2027年01月10日",
        sideEffect: "常见：胃肠道不适、出血倾向",
        precaution: "手术前一周停药，出现黑便立即就医"
      }
    ];

    let currentDrug = null;
    let isReading = false;
    let isSlow = false;
    let speechUtterance = null;

    // Switch section
    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // Handle file
    function handleFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('previewImg').src = e.target.result;
        showSection('previewSection');
      };
      reader.readAsDataURL(file);
    }

    // Reset
    function resetUpload() {
      document.getElementById('cameraInput').value = '';
      document.getElementById('albumInput').value = '';
      stopRead();
      showSection('uploadSection');
    }

    // Start recognition
    function startRecognize() {
      showSection('loadingSection');

      setTimeout(() => {
        currentDrug = demoDrugs[Math.floor(Math.random() * demoDrugs.length)];

        document.getElementById('drugName').textContent = currentDrug.name;
        document.getElementById('usage').textContent = currentDrug.usage;
        document.getElementById('contraindication').textContent = currentDrug.contraindication;
        document.getElementById('expiry').textContent = currentDrug.expiry;
        document.getElementById('sideEffect').textContent = currentDrug.sideEffect;
        document.getElementById('precaution').textContent = currentDrug.precaution;

        showSection('resultSection');
      }, 2000);
    }

    // Toggle read
    function toggleRead() {
      if (isReading) {
        stopRead();
      } else {
        startRead();
      }
    }

    // Start reading
    function startRead() {
      if (!currentDrug) return;

      const text = `药品名称：${currentDrug.name}。用法用量：${currentDrug.usage}。禁忌：${currentDrug.contraindication}。有效期至：${currentDrug.expiry}。不良反应：${currentDrug.sideEffect}。注意事项：${currentDrug.precaution}`;

      speechUtterance = new SpeechSynthesisUtterance(text);
      speechUtterance.lang = 'zh-CN';
      speechUtterance.rate = isSlow ? 0.5 : 1;
      speechUtterance.pitch = 1;

      speechUtterance.onend = () => {
        isReading = false;
        updateReadBtn();
      };

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speechUtterance);

      isReading = true;
      updateReadBtn();
    }

    // Stop reading
    function stopRead() {
      window.speechSynthesis.cancel();
      isReading = false;
      updateReadBtn();
    }

    // Update read button
    function updateReadBtn() {
      const btn = document.getElementById('readBtn');
      const icon = document.getElementById('readIcon');
      const text = document.getElementById('readText');
      const indicator = document.getElementById('playingIndicator');

      if (isReading) {
        icon.textContent = '\u25A0';
        text.textContent = '停止朗读';
        btn.style.background = 'linear-gradient(135deg, #e94560, #c0392b)';
        indicator.classList.add('active');
      } else {
        icon.textContent = '\uD83D\uDD0A';
        text.textContent = '朗读说明书';
        btn.style.background = '';
        indicator.classList.remove('active');
      }
    }

    // Toggle slow speed
    function toggleSlow() {
      isSlow = !isSlow;
      const btn = document.getElementById('slowBtn');
      btn.classList.toggle('active', isSlow);

      // 无论是否正在朗读，都重新开始（用新语速）
      if (currentDrug) {
        startRead();
      }
    }

    // Share
    function shareResult() {
      alert('分享功能演示\n\n识别结果已生成分享卡片，可发送给家人\n（实际产品将调用微信分享API）');
    }
  </script>

</body>
</html>
