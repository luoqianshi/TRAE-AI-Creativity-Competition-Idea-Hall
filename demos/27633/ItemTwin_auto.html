<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物忆 ItemTwin - 家庭物品的数字双胞胎管家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        warm: {
                            50: '#fdfbf7',
                            100: '#faf6f0',
                            200: '#f5efe6',
                            300: '#e8ddd0',
                            400: '#d4c4b0',
                            500: '#b8a48a',
                            600: '#9a866d',
                            700: '#7d6b56',
                            800: '#3d3226',
                        },
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(180deg, #fdfbf7 0%, #faf6f0 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="font-sans text-warm-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen flex flex-col px-4 py-8">
        
        <!-- Header -->
        <header class="flex flex-col items-center mb-10">
            <div class="w-20 h-20 bg-gradient-to-br from-warm-200 to-warm-300 rounded-2xl flex items-center justify-center mb-4 shadow-sm">
                <svg class="w-10 h-10 text-warm-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-warm-800">物忆 ItemTwin</h1>
            <p class="text-sm text-warm-500 mt-1">家庭物品的数字双胞胎管家</p>
        </header>

        <!-- Main Action -->
        <div class="mb-10">
            <button class="w-full bg-gradient-to-r from-warm-600 to-warm-700 text-warm-50 rounded-2xl py-4 px-6 font-semibold text-lg shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2">
                <span>📸</span>
                <span>拍照智能建档</span>
            </button>
        </div>

        <!-- Item List -->
        <div class="flex-1">
            <h2 class="text-xs font-semibold text-warm-500 uppercase tracking-wider mb-4">我的数字档案 (3)</h2>
            
            <!-- Card A: 家电 - 保修期内 -->
            <div class="bg-white/70 backdrop-blur-md border border-white/50 rounded-3xl p-5 mb-4 shadow-sm hover:shadow-md transition-all duration-200">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 bg-warm-100 rounded-2xl flex items-center justify-center text-2xl flex-shrink-0">
                        🌪️
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2">
                            <h3 class="font-semibold text-warm-800 truncate">戴森 Supersonic 吹风机</h3>
                        </div>
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                            保修期内
                        </span>
                    </div>
                </div>
                <div class="flex gap-3 mt-4">
                    <button class="flex-1 bg-warm-100 hover:bg-warm-200 text-warm-700 rounded-xl py-2 px-3 text-sm font-medium transition-colors flex items-center justify-center gap-1.5">
                        📄 电子说明书
                    </button>
                    <button class="flex-1 bg-warm-100 hover:bg-warm-200 text-warm-700 rounded-xl py-2 px-3 text-sm font-medium transition-colors flex items-center justify-center gap-1.5">
                        💰 二手估值: ¥1,850
                    </button>
                </div>
            </div>

            <!-- Card B: 药品 - 过期警告 -->
            <div class="bg-white/70 backdrop-blur-md border border-white/50 rounded-3xl p-5 mb-4 shadow-sm hover:shadow-md transition-all duration-200">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 bg-warm-100 rounded-2xl flex items-center justify-center text-2xl flex-shrink-0">
                        💊
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2">
                            <h3 class="font-semibold text-warm-800 truncate">布洛芬缓释胶囊</h3>
                        </div>
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-orange-100 text-orange-700 animate-pulse">
                            ⚠️ 30天后过期
                        </span>
                    </div>
                </div>
                <div class="mt-4">
                    <div class="flex items-center justify-between text-xs text-warm-500 mb-1.5">
                        <span>生命周期</span>
                        <span>85%</span>
                    </div>
                    <div class="h-2 bg-warm-100 rounded-full overflow-hidden">
                        <div class="h-full bg-orange-400 rounded-full" style="width: 85%"></div>
                    </div>
                </div>
            </div>

            <!-- Card C: 化妆品 - 已开封 -->
            <div class="bg-white/70 backdrop-blur-md border border-white/50 rounded-3xl p-5 mb-4 shadow-sm hover:shadow-md transition-all duration-200">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 bg-warm-100 rounded-2xl flex items-center justify-center text-2xl flex-shrink-0">
                        🧴
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2">
                            <h3 class="font-semibold text-warm-800 truncate">某品牌 维C精华液</h3>
                        </div>
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-warm-200 text-warm-600">
                            已开封
                        </span>
                    </div>
                </div>
                <div class="mt-4">
                    <button class="w-full bg-warm-100 hover:bg-warm-200 text-warm-700 rounded-xl py-2.5 px-3 text-sm font-medium transition-colors flex items-center justify-center gap-1.5">
                        🔔 设置过期提醒
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-auto pt-8 pb-4 text-center">
            <p class="text-xs text-warm-400">✨ 本原型由 TRAE Work 结合温暖极简主义设计语言生成</p>
        </footer>
    </div>
</body>
</html>
