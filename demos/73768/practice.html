<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>刷题 - 公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 顶部栏 -->
    <div class="header">
      <a href="exam-papers.html" class="header-back">
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </a>
      <div style="text-align:center;flex:1;">
        <span style="font-size:15px;font-weight:600;">
          <span id="current-num">1</span>/<span id="total-num">5</span>
        </span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:14px;font-weight:600;color:var(--success);" id="timer">00:00</span>
        <i data-lucide="layout-grid" style="width:20px;height:20px;color:var(--text-secondary);cursor:pointer;" onclick="toggleAnswerCard()"></i>
      </div>
    </div>

    <!-- 模式切换 -->
    <div style="display:flex;padding:8px 16px;background:white;border-bottom:1px solid var(--border);gap:8px;">
      <button class="btn btn-primary btn-sm" style="flex:1;" id="mode-exam" onclick="switchMode('exam')">做题模式</button>
      <button class="btn btn-outline btn-sm" style="flex:1;" id="mode-study" onclick="switchMode('study')">背题模式</button>
    </div>

    <!-- 题目内容 -->
    <div style="padding: 16px;flex:1;overflow-y:auto;" id="question-area">
      <div id="question-content">
        <!-- JS 渲染 -->
      </div>

      <!-- 解析区域（背题模式或提交后显示） -->
      <div id="analysis-area" style="display:none;margin-top:16px;">
        <div class="card-flat" style="background:#f8fafc;border-color:var(--primary-soft);">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
            <i data-lucide="lightbulb" style="width:16px;height:16px;color:var(--warning);"></i>
            <span style="font-size:14px;font-weight:600;color:var(--primary);">解析</span>
          </div>
          <p style="font-size:14px;color:var(--text-primary);line-height:1.7;" id="analysis-text"></p>
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
            <a href="ai-solution.html" class="btn btn-ghost btn-sm" style="width:100%;">
              <i data-lucide="sparkles" style="width:14px;height:14px;"></i>
              查看 AI 解题拆解
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部操作区 -->
    <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;min-width:375px;background:white;border-top:1px solid var(--border);padding:12px 16px 24px;display:flex;gap:10px;z-index:50;">
      <button class="btn btn-outline" style="flex:0 0 auto;padding:12px;" onclick="toggleMark()" id="mark-btn">
        <i data-lucide="flag" style="width:18px;height:18px;" id="mark-icon"></i>
      </button>
      <button class="btn btn-primary w-full" id="submit-btn" onclick="submitAnswer()">提交答案</button>
      <button class="btn btn-primary w-full hidden" id="next-btn" onclick="nextQuestion()">下一题</button>
    </div>
  </div>

  <!-- 答题卡浮层 -->
  <div id="answer-card" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:100;padding-top:60px;">
    <div style="background:white;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px;height:100%;max-height:70%;overflow-y:auto;animation:slideUp 0.3s ease;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h3 style="font-size:16px;font-weight:700;">答题卡</h3>
        <button onclick="toggleAnswerCard()" style="background:none;border:none;cursor:pointer;">
          <i data-lucide="x" style="width:20px;height:20px;color:var(--text-secondary);"></i>
        </button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;" id="answer-grid">
        <!-- JS 渲染 -->
      </div>
      <div style="display:flex;gap:16px;margin-top:16px;justify-content:center;">
        <div style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);">
          <div style="width:12px;height:12px;border-radius:50%;background:var(--success);"></div> 已答
        </div>
        <div style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);">
          <div style="width:12px;height:12px;border-radius:50%;background:var(--warning);"></div> 标记
        </div>
        <div style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);">
          <div style="width:12px;height:12px;border-radius:50%;background:var(--border);"></div> 未答
        </div>
      </div>
      <button class="btn btn-primary w-full" style="margin-top:20px;" onclick="submitPaper()">交卷</button>
    </div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/components.js"></script>
  <script>
    let practiceData = null;
    let questions = [];
    let currentIndex = 0;
    let answers = {};
    let marks = {};
    let mode = 'exam';
    let timer = null;
    let isSubmitted = false;

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      practiceData = Store.getCurrentPractice();
      if (!practiceData) {
        // 使用默认数据
        practiceData = {
          subject: 'reasoning',
          count: 5,
          mode: 'exam',
          questions: MockData.questions.slice(0, 5)
        };
      }

      questions = practiceData.questions;
      mode = practiceData.mode || 'exam';

      // 初始化
      document.getElementById('total-num').textContent = questions.length;
      updateModeUI();
      renderQuestion();
      renderAnswerGrid();

      // 启动计时器
      timer = new Timer();
      timer.onTick = (seconds) => {
        document.getElementById('timer').textContent = timer.format();
      };
      timer.start();

      lucide.createIcons();
    });

    function updateModeUI() {
      if (mode === 'exam') {
        document.getElementById('mode-exam').className = 'btn btn-primary btn-sm';
        document.getElementById('mode-study').className = 'btn btn-outline btn-sm';
      } else {
        document.getElementById('mode-exam').className = 'btn btn-outline btn-sm';
        document.getElementById('mode-study').className = 'btn btn-primary btn-sm';
      }
    }

    function switchMode(newMode) {
      mode = newMode;
      updateModeUI();
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      if (!q) return;

      isSubmitted = !!answers[currentIndex];
      document.getElementById('current-num').textContent = currentIndex + 1;

      const subjectNames = {
        reasoning: '判断推理',
        data: '资料分析',
        language: '言语理解',
        math: '数量关系',
        common: '常识判断'
      };

      let html = `
        <div style="margin-bottom:16px;">
          <span class="tag tag-primary">${subjectNames[q.subject] || '综合'}</span>
          <span class="tag" style="background:#f3f4f6;color:var(--text-secondary);margin-left:6px;">${q.year}年</span>
        </div>
        <p style="font-size:15px;line-height:1.7;color:var(--text-primary);margin-bottom:20px;font-weight:500;">${q.content}</p>
        <div id="options">
      `;

      q.options.forEach((opt, idx) => {
        let btnClass = 'option-btn';
        if (isSubmitted) {
          if (idx === q.correct) btnClass += ' correct';
          else if (idx === answers[currentIndex]) btnClass += ' wrong';
        } else if (answers[currentIndex] === idx) {
          btnClass += ' selected';
        }

        html += `
          <button class="${btnClass}" onclick="selectOption(${idx})" ${isSubmitted ? 'disabled' : ''}>
            <span style="font-weight:600;flex-shrink:0;">${String.fromCharCode(65 + idx)}.</span>
            <span>${opt.substring(3)}</span>
          </button>
        `;
      });

      html += '</div>';
      document.getElementById('question-content').innerHTML = html;

      // 解析
      if (mode === 'study' || isSubmitted) {
        document.getElementById('analysis-area').style.display = 'block';
        document.getElementById('analysis-text').textContent = q.analysis;
      } else {
        document.getElementById('analysis-area').style.display = 'none';
      }

      // 按钮状态
      if (isSubmitted || mode === 'study') {
        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
      } else {
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');
      }

      // 更新标记按钮
      updateMarkBtn();
      lucide.createIcons();
    }

    function selectOption(index) {
      if (isSubmitted && mode === 'exam') return;
      answers[currentIndex] = index;
      renderQuestion();
      renderAnswerGrid();
    }

    function submitAnswer() {
      if (answers[currentIndex] === undefined) {
        Toast('请先选择一个答案', 'warning');
        return;
      }
      isSubmitted = true;
      const q = questions[currentIndex];
      const isCorrect = answers[currentIndex] === q.correct;

      if (isCorrect) {
        Toast('回答正确！', 'success');
      } else {
        Toast('回答错误', 'error');
        // 添加错题
        Store.addWrongQuestion(q.id, answers[currentIndex], '练习错误');
      }

      renderQuestion();
      renderAnswerGrid();
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        // 最后一题，交卷
        submitPaper();
      }
    }

    function toggleMark() {
      marks[currentIndex] = !marks[currentIndex];
      updateMarkBtn();
      renderAnswerGrid();
    }

    function updateMarkBtn() {
      const icon = document.getElementById('mark-icon');
      if (marks[currentIndex]) {
        icon.style.color = 'var(--warning)';
        icon.setAttribute('data-lucide', 'flag');
      } else {
        icon.style.color = '';
        icon.setAttribute('data-lucide', 'flag');
      }
      lucide.createIcons();
    }

    function toggleAnswerCard() {
      const card = document.getElementById('answer-card');
      card.style.display = card.style.display === 'flex' ? 'none' : 'flex';
      if (card.style.display === 'flex') {
        renderAnswerGrid();
        lucide.createIcons();
      }
    }

    function renderAnswerGrid() {
      const html = Array.from({ length: questions.length }, (_, i) => {
        let bg = 'var(--border)';
        let color = 'var(--text-secondary)';
        if (answers[i] !== undefined) {
          bg = 'var(--success)';
          color = 'white';
        }
        if (marks[i]) {
          bg = 'var(--warning)';
          color = 'white';
        }
        return `
          <div style="width:44px;height:44px;border-radius:50%;background:${bg};color:${color};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer;"
               onclick="jumpToQuestion(${i})">${i + 1}</div>
        `;
      }).join('');
      document.getElementById('answer-grid').innerHTML = html;
    }

    function jumpToQuestion(index) {
      currentIndex = index;
      renderQuestion();
      toggleAnswerCard();
    }

    function submitPaper() {
      if (timer) {
        timer.pause();
      }

      const total = questions.length;
      let correct = 0;
      questions.forEach((q, i) => {
        if (answers[i] === q.correct) correct++;
      });

      const duration = timer ? timer.seconds : 0;
      const report = MockData.generateReport({
        total,
        correct,
        duration,
        subjectBreakdown: {
          reasoning: { total: 2, correct: answers[0] === questions[0].correct ? 1 : 0 + (answers[1] === questions[1].correct ? 1 : 0) }
        }
      });

      Store.setLastReport(report);
      Router.go('practice-report.html');
    }
  </script>
</body>
</html>
