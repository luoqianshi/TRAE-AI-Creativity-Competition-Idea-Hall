<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>入门测评 - 公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 欢迎页 -->
    <div id="welcome-page" style="padding: 40px 24px;text-align:center;height:100vh;display:flex;flex-direction:column;justify-content:center;">
      <div style="width:80px;height:80px;border-radius:var(--radius-lg);background:linear-gradient(135deg,var(--primary),#3730a3);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
        <i data-lucide="graduation-cap" style="width:40px;height:40px;color:white;"></i>
      </div>
      <h1 style="font-size:24px;font-weight:800;margin-bottom:12px;">欢迎来到公考 AI 学习助手</h1>
      <p style="font-size:14px;color:var(--text-secondary);line-height:1.7;margin-bottom:32px;">
        通过 8 道快速测评题，AI 将分析你的强弱项<br>
        并生成专属备考计划
      </p>
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:32px;">
        <div style="display:flex;align-items:center;gap:12px;background:var(--primary-soft);padding:14px 16px;border-radius:var(--radius-md);">
          <i data-lucide="clipboard-check" style="width:24px;height:24px;color:var(--primary);"></i>
          <div style="text-align:left;">
            <p style="font-size:14px;font-weight:600;">快速诊断</p>
            <p style="font-size:12px;color:var(--text-secondary);">8题覆盖5大模块，约3分钟</p>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;background:var(--success-soft);padding:14px 16px;border-radius:var(--radius-md);">
          <i data-lucide="sparkles" style="width:24px;height:24px;color:var(--success);"></i>
          <div style="text-align:left;">
            <p style="font-size:14px;font-weight:600;">智能分析</p>
            <p style="font-size:12px;color:var(--text-secondary);">AI分析薄弱点，精准定位</p>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;background:var(--warning-soft);padding:14px 16px;border-radius:var(--radius-md);">
          <i data-lucide="calendar" style="width:24px;height:24px;color:var(--warning);"></i>
          <div style="text-align:left;">
            <p style="font-size:14px;font-weight:600;">定制计划</p>
            <p style="font-size:12px;color:var(--text-secondary);">生成30天基础备考计划</p>
          </div>
        </div>
      </div>
      <button class="btn btn-primary w-full" style="padding:14px;" onclick="startTest()">开始测评</button>
    </div>

    <!-- 答题页 -->
    <div id="test-page" style="display:none;">
      <!-- 进度条 -->
      <div style="padding: 16px;background:white;border-bottom:1px solid var(--border);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span style="font-size:13px;color:var(--text-secondary);">测评进度</span>
          <span style="font-size:13px;font-weight:600;" id="test-progress-text">1/8</span>
        </div>
        <div class="progress-bar">
          <div class="progress-bar-fill" id="test-progress-bar" style="width:12.5%"></div>
        </div>
      </div>

      <!-- 题目 -->
      <div style="padding: 20px 16px;" id="test-question">
        <!-- JS 渲染 -->
      </div>
    </div>

    <!-- 结果页 -->
    <div id="result-page" style="display:none;padding: 24px 16px;">
      <div style="text-align:center;margin-bottom:24px;">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--success-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
          <i data-lucide="check-circle" style="width:32px;height:32px;color:var(--success);"></i>
        </div>
        <h2 style="font-size:20px;font-weight:700;margin-bottom:8px;">测评完成！</h2>
        <p style="font-size:14px;color:var(--text-secondary);">已为你生成专属能力分析</p>
      </div>

      <!-- 能力雷达 -->
      <div class="card" style="padding:12px;margin-bottom:16px;">
        <canvas id="result-radar" style="width:100%;height:200px;"></canvas>
      </div>

      <!-- 分析结果 -->
      <div class="card" style="padding:16px;margin-bottom:16px;">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:12px;">你的强项</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
          <span class="tag tag-success">言语理解</span>
          <span class="tag tag-success">常识判断</span>
        </div>
        <h3 style="font-size:16px;font-weight:700;margin-bottom:12px;">待加强</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <span class="tag tag-warning">资料分析</span>
          <span class="tag tag-warning">数量关系</span>
        </div>
      </div>

      <!-- 计划预览 -->
      <div class="card" style="padding:16px;margin-bottom:24px;background:linear-gradient(135deg,var(--primary-soft),#eef2ff);border:1px solid #c7d2fe;">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:12px;color:var(--primary);">30天基础计划</h3>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;">1</div>
            <div>
              <p style="font-size:14px;font-weight:500;">第1-10天 · 基础巩固</p>
              <p style="font-size:12px;color:var(--text-secondary);">每天20题，重点突破资料分析</p>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;">2</div>
            <div>
              <p style="font-size:14px;font-weight:500;">第11-20天 · 专项提升</p>
              <p style="font-size:12px;color:var(--text-secondary);">强化数量关系，每日10题</p>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;">3</div>
            <div>
              <p style="font-size:14px;font-weight:500;">第21-30天 · 综合训练</p>
              <p style="font-size:12px;color:var(--text-secondary);">整卷模拟，每周2套</p>
            </div>
          </div>
        </div>
      </div>

      <button class="btn btn-primary w-full" style="padding:14px;" onclick="finishOnboarding()">进入首页</button>
    </div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/charts.js"></script>
  <script src="shared/components.js"></script>
  <script>
    const testQuestions = MockData.questions.slice(0, 5).concat([
      {
        id: 106,
        content: '下列词语中，没有错别字的一项是：',
        options: ['A. 按部就班', 'B. 按步就班', 'C. 按部就搬', 'D. 安部就班'],
        correct: 0,
        subject: 'language'
      },
      {
        id: 107,
        content: '2024年某市GDP增长7.2%，其中第三产业占比52%，第二产业占比38%。求第三产业比第二产业多占比多少个百分点？',
        options: ['A. 12', 'B. 14', 'C. 10', 'D. 16'],
        correct: 0,
        subject: 'data'
      },
      {
        id: 108,
        content: '下列哪项不属于我国四大名著？',
        options: ['A. 《红楼梦》', 'B. 《西游记》', 'C. 《水浒传》', 'D. 《聊斋志异》'],
        correct: 3,
        subject: 'common'
      }
    ]);

    let currentQIndex = 0;
    let testAnswers = {};

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    function startTest() {
      document.getElementById('welcome-page').style.display = 'none';
      document.getElementById('test-page').style.display = 'block';
      renderTestQuestion();
    }

    function renderTestQuestion() {
      const q = testQuestions[currentQIndex];
      document.getElementById('test-progress-text').textContent = `${currentQIndex + 1}/${testQuestions.length}`;
      document.getElementById('test-progress-bar').style.width = `${((currentQIndex + 1) / testQuestions.length) * 100}%`;

      const subjectNames = { reasoning: '判断推理', data: '资料分析', language: '言语理解', math: '数量关系', common: '常识判断' };

      let html = `
        <div style="margin-bottom:20px;">
          <span class="tag tag-primary">${subjectNames[q.subject] || '综合'}</span>
        </div>
        <p style="font-size:16px;line-height:1.7;color:var(--text-primary);margin-bottom:24px;font-weight:500;">${q.content}</p>
        <div>
      `;

      q.options.forEach((opt, idx) => {
        html += `
          <button class="option-btn" onclick="answerTest(${idx})">
            <span style="font-weight:600;flex-shrink:0;">${String.fromCharCode(65 + idx)}.</span>
            <span>${opt.substring(3)}</span>
          </button>
        `;
      });

      html += '</div>';
      document.getElementById('test-question').innerHTML = html;
    }

    function answerTest(index) {
      testAnswers[currentQIndex] = index;

      if (currentQIndex < testQuestions.length - 1) {
        currentQIndex++;
        renderTestQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('test-page').style.display = 'none';
      document.getElementById('result-page').style.display = 'block';

      // 计算正确率
      let correct = 0;
      testQuestions.forEach((q, i) => {
        if (testAnswers[i] === q.correct) correct++;
      });

      // 绘制雷达图
      setTimeout(() => {
        Charts.drawRadar(document.getElementById('result-radar'), {
          判断推理: 75,
          资料分析: 55,
          言语理解: 85,
          数量关系: 60,
          常识判断: 80
        });
      }, 100);

      // 保存状态
      Store.updateUserState({ isFirstVisit: false });
    }

    function finishOnboarding() {
      Toast('计划已生成！', 'success');
      setTimeout(() => {
        Router.go('index.html');
      }, 800);
    }
  </script>
</body>
</html>
