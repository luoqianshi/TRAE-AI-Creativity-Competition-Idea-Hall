<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>错题本 - 公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 顶部栏 -->
    <div class="header">
      <a href="index.html" class="header-back">
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </a>
      <span class="header-title">错题本</span>
      <div style="width:20px;"></div>
    </div>

    <!-- 筛选标签 -->
    <div style="padding: 12px 16px;background:white;border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;">
      <div style="display:inline-flex;gap:8px;">
        <button class="btn btn-primary btn-sm" onclick="filterWrong('all')" id="filter-all">全部</button>
        <button class="btn btn-outline btn-sm" onclick="filterWrong('概念混淆')" id="filter-概念混淆">概念混淆</button>
        <button class="btn btn-outline btn-sm" onclick="filterWrong('计算失误')" id="filter-计算失误">计算失误</button>
        <button class="btn btn-outline btn-sm" onclick="filterWrong('粗心')" id="filter-粗心">粗心</button>
      </div>
    </div>

    <!-- 错题列表 -->
    <div style="padding: 16px;" id="wrongbook-list">
      <!-- JS 渲染 -->
    </div>

    <!-- 底部导航 -->
    <div id="bottom-nav"></div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/components.js"></script>
  <script>
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderWrongList();
      document.getElementById('bottom-nav').innerHTML = renderBottomNav('wrongbook');
      lucide.createIcons();
    });

    function renderWrongList() {
      let wrongs = Store.getWrongQuestions();
      if (currentFilter !== 'all') {
        wrongs = wrongs.filter(w => w.wrongReason === currentFilter);
      }

      if (wrongs.length === 0) {
        document.getElementById('wrongbook-list').innerHTML = `
          <div class="empty-state">
            <i data-lucide="check-circle" style="width:48px;height:48px;color:var(--success);"></i>
            <p style="font-size:14px;font-weight:500;margin-top:8px;">暂无错题</p>
            <p style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">继续保持，加油！</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const html = wrongs.map(wq => {
        const q = MockData.questions.find(q => q.id === wq.questionId);
        if (!q) return '';

        const userOpt = q.options[wq.userAnswer] || '未作答';
        const correctOpt = q.options[q.correct];

        return `
          <div class="card" style="margin-bottom:12px;overflow:hidden;">
            <!-- 错题摘要 -->
            <div style="padding:14px 16px;cursor:pointer;" onclick="toggleDetail(${wq.questionId})">
              <div style="display:flex;align-items:flex-start;gap:10px;">
                <div style="width:32px;height:32px;border-radius:50%;background:var(--danger-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                  <i data-lucide="x" style="width:16px;height:16px;color:var(--danger);"></i>
                </div>
                <div style="flex:1;min-width:0;">
                  <p style="font-size:14px;color:var(--text-primary);line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${q.content}</p>
                  <div style="display:flex;gap:6px;margin-top:8px;align-items:center;">
                    <span class="tag tag-danger">${wq.wrongReason}</span>
                    <span class="tag" style="background:#f3f4f6;color:var(--text-secondary);">错 ${wq.wrongCount} 次</span>
                    <span style="font-size:12px;color:var(--text-tertiary);margin-left:auto;">${wq.lastWrongAt}</span>
                  </div>
                </div>
                <i data-lucide="chevron-down" style="width:16px;height:16px;color:var(--text-tertiary);flex-shrink:0;margin-top:4px;transition:transform 0.2s;" id="arrow-${wq.questionId}"></i>
              </div>
            </div>

            <!-- 展开详情 -->
            <div id="detail-${wq.questionId}" style="display:none;border-top:1px solid var(--border);padding:14px 16px;background:#f8fafc;">
              <!-- 答案对比 -->
              <div style="margin-bottom:14px;">
                <p style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;">你的答案</p>
                <p style="font-size:14px;color:var(--danger);font-weight:500;">${userOpt}</p>
              </div>
              <div style="margin-bottom:14px;">
                <p style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;">正确答案</p>
                <p style="font-size:14px;color:var(--success);font-weight:500;">${correctOpt}</p>
              </div>

              <!-- 解析 -->
              <div style="background:white;border-radius:var(--radius-md);padding:12px;margin-bottom:14px;">
                <p style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;">解析</p>
                <p style="font-size:13px;color:var(--text-primary);line-height:1.7;">${q.analysis}</p>
              </div>

              <!-- AI 举一反三 -->
              <div style="border:2px solid var(--warning);border-radius:var(--radius-md);padding:14px;background:white;">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;">
                  <i data-lucide="sparkles" style="width:16px;height:16px;color:var(--warning);"></i>
                  <span style="font-size:14px;font-weight:700;color:var(--warning);">AI 举一反三</span>
                </div>
                <p style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;">
                  <span style="font-weight:600;color:var(--text-primary);">同类套路：</span>
                  三段论推理中，标准结构是"所有A是B，C是A，所以C是B"。错误常出在混淆"所有"与"有些"，或结论否定形式。
                </p>
                <div style="display:flex;gap:8px;margin-bottom:10px;">
                  <span class="tag tag-warning">三段论</span>
                  <span class="tag tag-warning">推理结构</span>
                </div>
                <p style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">为你生成 3 道变式题：</p>
                <div id="similar-${wq.questionId}">
                  ${renderSimilarQuestions(wq.similarQuestions)}
                </div>
              </div>

              <!-- 操作 -->
              <div style="display:flex;gap:10px;margin-top:14px;">
                <button class="btn btn-outline btn-sm" style="flex:1;" onclick="removeWrong(${wq.questionId})">
                  <i data-lucide="check" style="width:14px;height:14px;"></i> 已掌握
                </button>
                <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="Toast('已收藏', 'success')">
                  <i data-lucide="star" style="width:14px;height:14px;"></i> 收藏
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('wrongbook-list').innerHTML = html;
      lucide.createIcons();
    }

    function renderSimilarQuestions(ids) {
      return ids.slice(0, 3).map(id => {
        const sq = MockData.similarQuestions[id];
        if (!sq) return '';
        return `
          <div style="background:#f8fafc;border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;cursor:pointer;"
               onclick="Toast('变式题练习功能开发中', 'warning')">
            <p style="font-size:12px;color:var(--text-primary);line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${sq.content}</p>
            <div style="display:flex;gap:4px;margin-top:6px;">
              <span class="tag tag-primary" style="font-size:10px;padding:2px 6px;">变式 ${id - 200}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleDetail(questionId) {
      const detail = document.getElementById(`detail-${questionId}`);
      const arrow = document.getElementById(`arrow-${questionId}`);
      if (!detail || !arrow) return;

      if (detail.style.display === 'none') {
        detail.style.display = 'block';
        detail.style.animation = 'fadeInUp 0.3s ease';
        arrow.style.transform = 'rotate(180deg)';
      } else {
        detail.style.display = 'none';
        arrow.style.transform = 'rotate(0deg)';
      }
    }

    function filterWrong(reason) {
      currentFilter = reason;

      // 更新按钮样式
      ['all', '概念混淆', '计算失误', '粗心'].forEach(r => {
        const btn = document.getElementById(`filter-${r}`);
        if (btn) {
          btn.className = r === reason ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
        }
      });

      renderWrongList();
    }

    function removeWrong(questionId) {
      showModal({
        title: '确认移除',
        content: '确定已掌握这道错题？移除后将不再出现在错题本中。',
        onConfirm: () => {
          const wrongs = Store.getWrongQuestions().filter(w => w.questionId !== questionId);
          Store.set('wrongQuestions', wrongs);
          renderWrongList();
          Toast('已移出错题本', 'success');
        }
      });
    }
  </script>
</body>
</html>
