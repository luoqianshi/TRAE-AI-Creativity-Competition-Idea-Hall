<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 教练 - 公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 顶部栏 -->
    <div class="header">
      <a href="index.html" class="header-back">
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </a>
      <div style="display:flex;align-items:center;gap:10px;flex:1;justify-content:center;">
        <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#3730a3);display:flex;align-items:center;justify-content:center;">
          <i data-lucide="bot" style="width:18px;height:18px;color:white;"></i>
        </div>
        <div style="text-align:left;">
          <p style="font-size:14px;font-weight:600;">公考小助手</p>
          <div style="display:flex;align-items:center;gap:4px;">
            <div style="width:6px;height:6px;border-radius:50%;background:var(--success);"></div>
            <span style="font-size:11px;color:var(--text-secondary);">在线</span>
          </div>
        </div>
      </div>
      <div style="width:20px;"></div>
    </div>

    <!-- 消息列表 -->
    <div style="padding: 16px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;" id="chat-messages">
      <!-- 欢迎消息 -->
      <div style="display:flex;gap:8px;align-items:flex-start;">
        <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#3730a3);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i data-lucide="bot" style="width:16px;height:16px;color:white;"></i>
        </div>
        <div class="chat-bubble chat-bubble-ai">
          <p>你好！我是你的公考 AI 教练。我可以帮你：</p>
          <ul style="margin-top:6px;padding-left:16px;line-height:1.7;">
            <li>解答行测各类题型</li>
            <li>申论写作指导与批改</li>
            <li>制定个性化备考计划</li>
            <li>分析错题原因</li>
          </ul>
          <p style="margin-top:6px;">有什么问题随时问我！</p>
        </div>
      </div>
    </div>

    <!-- 快捷问题 -->
    <div style="padding: 8px 16px;background:white;border-top:1px solid var(--border);overflow-x:auto;white-space:nowrap;">
      <div style="display:inline-flex;gap:8px;">
        <button class="tag tag-primary" style="cursor:pointer;" onclick="sendQuick('如何提高资料分析速度')">如何提高资料分析速度</button>
        <button class="tag tag-success" style="cursor:pointer;" onclick="sendQuick('申论大作文结构')">申论大作文结构</button>
        <button class="tag tag-warning" style="cursor:pointer;" onclick="sendQuick('判断推理技巧')">判断推理技巧</button>
        <button class="tag" style="background:#f3e8ff;color:#9333ea;cursor:pointer;" onclick="sendQuick('行测做题顺序建议')">行测做题顺序建议</button>
      </div>
    </div>

    <!-- 输入区 -->
    <div style="padding: 10px 16px 24px;background:white;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;">
      <button style="background:none;border:none;cursor:pointer;padding:6px;">
        <i data-lucide="mic" style="width:20px;height:20px;color:var(--text-tertiary);"></i>
      </button>
      <input type="text" class="input" placeholder="输入问题..." style="flex:1;" id="chat-input"
             onkeypress="if(event.key==='Enter')sendMessage()">
      <button class="btn btn-primary" style="padding:10px 14px;border-radius:50%;" onclick="sendMessage()">
        <i data-lucide="send" style="width:18px;height:18px;"></i>
      </button>
    </div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/components.js"></script>
  <script>
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');

    const aiResponses = {
      '如何提高资料分析速度': '提高资料分析速度的关键在于：\n\n1. **熟记常用公式**：增长率、比重、平均数等公式要烂熟于心\n2. **快速定位数据**：先看问题再找数据，避免通读材料\n3. **估算技巧**：掌握截位法、特值法等速算方法\n4. **限时训练**：每篇材料控制在6-8分钟\n5. **每天坚持**：至少练习2篇保持手感',
      '申论大作文结构': '申论大作文推荐采用"五段三分式"结构：\n\n**开头**（150字）：引用名言/数据，引出论点\n**分论点1**（200字）：观点+材料论证+案例\n**分论点2**（200字）：观点+材料论证+案例\n**分论点3**（200字）：观点+材料论证+案例\n**结尾**（150字）：总结升华，呼应开头\n\n注意三个分论点要有逻辑递进关系！',
      '判断推理技巧': '判断推理各模块技巧：\n\n**图形推理**：记住"点线面角素"五大规律\n**定义判断**：抓关键词，用排除法\n**类比推理**：先横向找关系，再纵向比较\n**逻辑判断**：重点掌握翻译推理、加强削弱\n\n建议每天刷20题保持敏感度。',
      '行测做题顺序建议': '推荐的做题顺序（因人而异）：\n\n1. **常识判断**（5-8分钟）- 快速过，不会就蒙\n2. **资料分析**（25-30分钟）- 头脑清醒时做\n3. **判断推理**（30-35分钟）- 逻辑清晰\n4. **言语理解**（30-35分钟）- 靠语感\n5. **数量关系**（剩余时间）- 先做简单的\n\n原则是：先易后难，资料分析不放在最后！'
    };

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    function sendQuick(text) {
      chatInput.value = text;
      sendMessage();
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      // 添加用户消息
      addUserMessage(text);
      chatInput.value = '';

      // 显示思考中
      const thinkingId = addThinkingMessage();

      // 模拟 AI 回复
      await new Promise(r => setTimeout(r, 1500));

      // 移除思考中
      removeThinkingMessage(thinkingId);

      // 添加 AI 回复
      const response = aiResponses[text] || `关于"${text}"，这是一个很好的问题。\n\n建议你可以：\n1. 先从基础概念入手\n2. 多做真题练习\n3. 总结错题规律\n4. 保持每天学习的节奏\n\n如果需要更详细的解答，欢迎继续追问！`;
      addAiMessage(response);
    }

    function addUserMessage(text) {
      const html = `
        <div style="display:flex;gap:8px;align-items:flex-start;justify-content:flex-end;animation:slideInRight 0.3s ease;">
          <div class="chat-bubble chat-bubble-user">
            <p>${text}</p>
          </div>
        </div>
      `;
      chatMessages.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addAiMessage(text) {
      const id = 'ai-msg-' + Date.now();
      const html = `
        <div style="display:flex;gap:8px;align-items:flex-start;animation:fadeInUp 0.3s ease;" id="${id}">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#3730a3);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i data-lucide="bot" style="width:16px;height:16px;color:white;"></i>
          </div>
          <div class="chat-bubble chat-bubble-ai">
            <p style="white-space:pre-line;">${text}</p>
            <div style="display:flex;gap:12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">
              <button style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-tertiary);" onclick="Toast('已复制', 'success')">
                <i data-lucide="copy" style="width:12px;height:12px;"></i> 复制
              </button>
              <button style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-tertiary);" onclick="Toast('已标记有用', 'success')">
                <i data-lucide="thumbs-up" style="width:12px;height:12px;"></i> 有用
              </button>
            </div>
          </div>
        </div>
      `;
      chatMessages.insertAdjacentHTML('beforeend', html);
      lucide.createIcons();
      scrollToBottom();
    }

    function addThinkingMessage() {
      const id = 'thinking-' + Date.now();
      const html = `
        <div style="display:flex;gap:8px;align-items:flex-start;" id="${id}">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#3730a3);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i data-lucide="bot" style="width:16px;height:16px;color:white;"></i>
          </div>
          <div class="chat-bubble chat-bubble-ai" style="display:flex;align-items:center;gap:6px;padding:10px 16px;">
            <div style="display:flex;gap:3px;">
              <div style="width:6px;height:6px;border-radius:50%;background:var(--text-tertiary);animation:typing 1s infinite;"></div>
              <div style="width:6px;height:6px;border-radius:50%;background:var(--text-tertiary);animation:typing 1s infinite 0.2s;"></div>
              <div style="width:6px;height:6px;border-radius:50%;background:var(--text-tertiary);animation:typing 1s infinite 0.4s;"></div>
            </div>
            <span style="font-size:12px;color:var(--text-tertiary);">思考中...</span>
          </div>
        </div>
      `;
      chatMessages.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return id;
    }

    function removeThinkingMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</body>
</html>
