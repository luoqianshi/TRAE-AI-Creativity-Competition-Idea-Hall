<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>申论弱项诊断 - 公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 顶部栏 -->
    <div class="header">
      <a href="essay-compare.html" class="header-back">
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </a>
      <span class="header-title">申论弱项诊断</span>
      <div style="width:20px;"></div>
    </div>

    <!-- 诊断得分总览 -->
    <div style="padding: 24px 16px;text-align:center;background:linear-gradient(180deg,white,#f8fafc);">
      <p style="font-size:13px;color:var(--text-secondary);">综合诊断得分</p>
      <div style="display:flex;align-items:baseline;justify-content:center;gap:4px;margin-top:4px;">
        <span style="font-size:48px;font-weight:800;color:var(--text-primary);">68</span>
        <span style="font-size:16px;color:var(--text-secondary);">/100</span>
      </div>
      <span class="tag tag-warning" style="margin-top:8px;display:inline-block;">良好，有提升空间</span>
    </div>

    <!-- 弱项维度分析 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">维度分析</h2>
      <div class="card" style="padding:12px;">
        <canvas id="dimension-bar" style="width:100%;height:180px;"></canvas>
      </div>
    </div>

    <!-- 问题清单 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">问题清单</h2>
      <div class="card" style="padding:14px;">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;gap:10px;">
            <div style="width:8px;height:8px;border-radius:50%;background:var(--danger);margin-top:6px;flex-shrink:0;"></div>
            <div>
              <p style="font-size:14px;font-weight:500;color:var(--text-primary);">概括不够精炼，存在口语化表达</p>
              <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">建议多阅读官方文件，学习规范表述</p>
            </div>
          </div>
          <div style="display:flex;gap:10px;">
            <div style="width:8px;height:8px;border-radius:50%;background:var(--danger);margin-top:6px;flex-shrink:0;"></div>
            <div>
              <p style="font-size:14px;font-weight:500;color:var(--text-primary);">缺乏具体数据和案例支撑</p>
              <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">论证时适当引用材料中的数据增强说服力</p>
            </div>
          </div>
          <div style="display:flex;gap:10px;">
            <div style="width:8px;height:8px;border-radius:50%;background:var(--warning);margin-top:6px;flex-shrink:0;"></div>
            <div>
              <p style="font-size:14px;font-weight:500;color:var(--text-primary);">成效与举措的对应关系不够紧密</p>
              <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">注意前后呼应，避免泛泛而谈</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 可执行训练目标 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">训练目标</h2>
      <div style="display:flex;flex-direction:column;gap:10px;" id="training-goals">
        <div class="card" style="padding:14px;">
          <div style="display:flex;align-items:flex-start;gap:10px;">
            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;"
                 onclick="toggleGoal(this)">
              <i data-lucide="check" style="width:14px;height:14px;color:var(--primary);opacity:0;"></i>
            </div>
            <div style="flex:1;">
              <p style="font-size:14px;font-weight:500;color:var(--text-primary);" class="goal-text">每日精读 2 篇人民日报评论，提炼核心观点并控制在 50 字以内</p>
              <span class="tag tag-primary" style="font-size:10px;margin-top:6px;display:inline-block;">归纳概括</span>
            </div>
          </div>
        </div>
        <div class="card" style="padding:14px;">
          <div style="display:flex;align-items:flex-start;gap:10px;">
            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;"
                 onclick="toggleGoal(this)">
              <i data-lucide="check" style="width:14px;height:14px;color:var(--primary);opacity:0;"></i>
            </div>
            <div style="flex:1;">
              <p style="font-size:14px;font-weight:500;color:var(--text-primary);" class="goal-text">每周完成 2 道概括题，限时 15 分钟</p>
              <span class="tag tag-success" style="font-size:10px;margin-top:6px;display:inline-block;">限时训练</span>
            </div>
          </div>
        </div>
        <div class="card" style="padding:14px;">
          <div style="display:flex;align-items:flex-start;gap:10px;">
            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;"
                 onclick="toggleGoal(this)">
              <i data-lucide="check" style="width:14px;height:14px;color:var(--primary);opacity:0;"></i>
            </div>
            <div style="flex:1;">
              <p style="font-size:14px;font-weight:500;color:var(--text-primary);" class="goal-text">积累 10 组规范表述（如"提质增效""纵深推进"）</p>
              <span class="tag tag-warning" style="font-size:10px;margin-top:6px;display:inline-block;">素材积累</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 推荐练习 -->
    <div style="padding: 0 16px 24px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">推荐练习</h2>
      <a href="essay-compare.html" class="card" style="display:block;padding:14px;text-decoration:none;color:inherit;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:40px;height:40px;border-radius:var(--radius-sm);background:var(--warning-soft);display:flex;align-items:center;justify-content:center;">
            <i data-lucide="file-text" style="width:20px;height:20px;color:var(--warning);"></i>
          </div>
          <div style="flex:1;">
            <p style="font-size:14px;font-weight:600;">概括题专项训练</p>
            <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">针对弱项 · 15题 · 预计30分钟</p>
          </div>
          <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--text-tertiary);"></i>
        </div>
      </a>
    </div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/charts.js"></script>
  <script src="shared/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      // 绘制维度条形图
      setTimeout(() => {
        Charts.drawBar(document.getElementById('dimension-bar'), [
          { label: '概括能力', value: 60, level: 'weak' },
          { label: '对策能力', value: 55, level: 'weak' },
          { label: '分析能力', value: 72, level: 'medium' },
          { label: '文字表达', value: 80, level: 'strong' }
        ]);
      }, 100);
    });

    function toggleGoal(el) {
      const check = el.querySelector('i');
      const card = el.closest('.card');
      const text = card.querySelector('.goal-text');

      if (check.style.opacity === '1') {
        check.style.opacity = '0';
        el.style.background = 'var(--primary-soft)';
        text.style.textDecoration = 'none';
        text.style.color = 'var(--text-primary)';
      } else {
        check.style.opacity = '1';
        el.style.background = 'var(--success)';
        text.style.textDecoration = 'line-through';
        text.style.color = 'var(--text-tertiary)';
        Toast('目标打卡成功！', 'success');
      }
    }
  </script>
</body>
</html>
