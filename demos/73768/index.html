<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 顶部问候区 -->
    <div style="padding: 20px 16px 12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <h1 style="font-size:22px;font-weight:700;color:var(--text-primary);">
            <span id="greeting">早上好</span>，备考人
          </h1>
          <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">
            坚持学习 <span style="color:var(--primary);font-weight:600;">12</span> 天，继续加油！
          </p>
        </div>
        <div style="display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#fef3c7,#fde68a);padding:8px 14px;border-radius:100px;">
          <i data-lucide="flame" style="width:18px;height:18px;color:#d97706;"></i>
          <span style="font-size:14px;font-weight:700;color:#92400e;">12天</span>
        </div>
      </div>
    </div>

    <!-- 倒计时卡片 -->
    <div style="padding: 0 16px 12px;">
      <div class="card" style="background:linear-gradient(135deg,var(--primary),#3730a3);color:white;padding:20px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <p style="font-size:13px;opacity:0.85;">距离 2026 年国考还有</p>
            <div style="display:flex;align-items:baseline;gap:4px;margin-top:6px;">
              <span style="font-size:42px;font-weight:800;line-height:1;" id="countdown-days">146</span>
              <span style="font-size:16px;opacity:0.9;">天</span>
            </div>
            <p style="font-size:12px;opacity:0.7;margin-top:6px;">考试时间：2026年11月29日</p>
          </div>
          <div style="position:relative;width:80px;height:80px;">
            <canvas id="countdown-ring" style="width:80px;height:80px;"></canvas>
            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;">
              <span style="font-size:11px;opacity:0.8;">进度</span>
              <span style="font-size:16px;font-weight:700;display:block;">35%</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 今日任务 -->
    <div style="padding: 0 16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h2 style="font-size:17px;font-weight:700;">今日训练计划</h2>
        <span style="font-size:13px;color:var(--text-secondary);">
          已完成 <span id="task-done-count" style="color:var(--success);font-weight:600;">1</span>/4
        </span>
      </div>
      <div class="card" style="padding:0;overflow:hidden;">
        <div id="task-list">
          <!-- 任务列表由 JS 渲染 -->
        </div>
        <div id="task-completed-msg" style="display:none;padding:16px;text-align:center;">
          <i data-lucide="party-popper" style="width:32px;height:32px;color:var(--warning);margin-bottom:8px;"></i>
          <p style="font-size:14px;font-weight:600;color:var(--success);">今日任务全部完成！</p>
          <p style="font-size:12px;color:var(--text-secondary);margin-top:4px;">太棒了，继续保持！</p>
        </div>
      </div>
    </div>

    <!-- 快捷入口 -->
    <div style="padding: 16px 16px 8px;">
      <h2 style="font-size:17px;font-weight:700;margin-bottom:12px;">快捷入口</h2>
      <div class="quick-actions">
        <a href="exam-papers.html" class="quick-action-item">
          <div class="icon-wrap" style="background:var(--primary-soft);">
            <i data-lucide="book-open" style="width:20px;height:20px;color:var(--primary);"></i>
          </div>
          <span>真题集</span>
        </a>
        <a href="ai-coach.html" class="quick-action-item">
          <div class="icon-wrap" style="background:#f0fdf4;">
            <i data-lucide="bot" style="width:20px;height:20px;color:var(--success);"></i>
          </div>
          <span>AI教练</span>
        </a>
        <a href="wrongbook.html" class="quick-action-item">
          <div class="icon-wrap" style="background:var(--danger-soft);">
            <i data-lucide="rotate-ccw" style="width:20px;height:20px;color:var(--danger);"></i>
          </div>
          <span>错题本</span>
        </a>
        <a href="essay-compare.html" class="quick-action-item">
          <div class="icon-wrap" style="background:var(--warning-soft);">
            <i data-lucide="file-text" style="width:20px;height:20px;color:var(--warning);"></i>
          </div>
          <span>申论批改</span>
        </a>
        <a href="dashboard.html" class="quick-action-item">
          <div class="icon-wrap" style="background:#f3e8ff;">
            <i data-lucide="bar-chart-3" style="width:20px;height:20px;color:#9333ea;"></i>
          </div>
          <span>数据看板</span>
        </a>
        <a href="onboarding.html" class="quick-action-item">
          <div class="icon-wrap" style="background:#ecfdf5;">
            <i data-lucide="clipboard-check" style="width:20px;height:20px;color:#059669;"></i>
          </div>
          <span>测评</span>
        </a>
      </div>
    </div>

    <!-- 最近练习 -->
    <div style="padding: 8px 16px 16px;">
      <h2 style="font-size:17px;font-weight:700;margin-bottom:12px;">最近练习</h2>
      <div id="recent-practice" style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;">
        <!-- 由 JS 渲染 -->
      </div>
    </div>

    <!-- 学习统计 -->
    <div style="padding: 0 16px 16px;">
      <div class="card" style="display:flex;align-items:center;justify-content:space-around;padding:16px;">
        <div style="text-align:center;">
          <p style="font-size:24px;font-weight:800;color:var(--primary);" id="stat-total">1523</p>
          <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">总题数</p>
        </div>
        <div style="width:1px;height:40px;background:var(--border);"></div>
        <div style="text-align:center;">
          <p style="font-size:24px;font-weight:800;color:var(--success);" id="stat-rate">68%</p>
          <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">正确率</p>
        </div>
        <div style="width:1px;height:40px;background:var(--border);"></div>
        <div style="text-align:center;">
          <p style="font-size:24px;font-weight:800;color:var(--warning);" id="stat-time">54h</p>
          <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">学习时长</p>
        </div>
      </div>
    </div>

    <!-- 底部导航 -->
    <div id="bottom-nav"></div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/charts.js"></script>
  <script src="shared/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 初始化 Lucide 图标
      lucide.createIcons();

      // 设置问候语
      document.getElementById('greeting').textContent = Utils.getGreeting();

      // 计算倒计时
      const userState = Store.getUserState();
      const days = Utils.getCountdownDays(userState.currentExamDate);
      document.getElementById('countdown-days').textContent = days;

      // 绘制倒计时环形图
      setTimeout(() => {
        const ringCanvas = document.getElementById('countdown-ring');
        if (ringCanvas) {
          Charts.drawRing(ringCanvas, 35, { color: '#ffffff', bgColor: 'rgba(255,255,255,0.25)', lineWidth: 5 });
        }
      }, 100);

      // 渲染任务列表
      renderTasks(userState.todayTasks);

      // 渲染最近练习
      renderRecentPractice();

      // 渲染底部导航
      document.getElementById('bottom-nav').innerHTML = renderBottomNav('index');
      lucide.createIcons();

      // 数字动画
      Animation.countUp(document.getElementById('stat-total'), 1523, 1500, '');
      Animation.countUp(document.getElementById('stat-rate'), 68, 1500, '%');
      Animation.countUp(document.getElementById('stat-time'), 54, 1500, 'h');
    });

    function renderTasks(tasks) {
      const container = document.getElementById('task-list');
      let doneCount = 0;

      const html = tasks.map(task => {
        if (task.done) doneCount++;
        const typeColors = {
          practice: { bg: '#dbeafe', color: '#1e40af', icon: 'pencil' },
          essay: { bg: '#ffedd5', color: '#c2410c', icon: 'file-text' },
          wrongbook: { bg: '#fee2e2', color: '#dc2626', icon: 'rotate-ccw' },
          news: { bg: '#dcfce7', color: '#166534', icon: 'newspaper' }
        };
        const typeStyle = typeColors[task.type] || typeColors.practice;

        return `
          <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;"
               onclick="toggleTask(${task.id})" class="task-item">
            <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${task.done ? 'var(--success)' : 'var(--border)'};
                        background:${task.done ? 'var(--success)' : 'transparent'};
                        display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s ease;">
              ${task.done ? '<i data-lucide="check" style="width:14px;height:14px;color:white;"></i>' : ''}
            </div>
            <div style="flex:1;">
              <p style="font-size:14px;font-weight:500;${task.done ? 'text-decoration:line-through;color:var(--text-tertiary);' : 'color:var(--text-primary);'}">${task.title}</p>
              <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">
                <span style="display:inline-flex;align-items:center;gap:3px;">
                  <i data-lucide="${typeStyle.icon}" style="width:10px;height:10px;"></i>
                  ${task.type === 'practice' ? '刷题' : task.type === 'essay' ? '申论' : task.type === 'wrongbook' ? '错题' : '时政'}
                </span>
                ${task.current > 0 ? ` · 已完成 ${task.current}/${task.target}` : ''}
              </p>
            </div>
            <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--text-tertiary);"></i>
          </div>
        `;
      }).join('');

      container.innerHTML = html;
      document.getElementById('task-done-count').textContent = doneCount;

      if (doneCount === tasks.length) {
        document.getElementById('task-completed-msg').style.display = 'block';
      }

      lucide.createIcons();
    }

    function toggleTask(taskId) {
      const state = Store.getUserState();
      const task = state.todayTasks.find(t => t.id === taskId);
      if (!task) return;

      // 根据任务类型跳转
      if (task.type === 'practice' && !task.done) {
        Router.go('exam-papers.html');
        return;
      }
      if (task.type === 'essay' && !task.done) {
        Router.go('essay-compare.html');
        return;
      }
      if (task.type === 'wrongbook' && !task.done) {
        Router.go('wrongbook.html');
        return;
      }

      // 切换完成状态
      task.done = !task.done;
      Store.updateUserState({ todayTasks: state.todayTasks });
      renderTasks(state.todayTasks);

      if (task.done) {
        Toast('任务完成！+1 打卡', 'success');
      }
    }

    function renderRecentPractice() {
      const items = [
        { subject: '判断推理', correct: 14, total: 20, date: '今天', color: '#dbeafe', iconColor: '#1e40af' },
        { subject: '资料分析', correct: 12, total: 15, date: '昨天', color: '#dcfce7', iconColor: '#166534' },
        { subject: '言语理解', correct: 18, total: 20, date: '7月4日', color: '#ffedd5', iconColor: '#c2410c' }
      ];

      const html = items.map(item => {
        const rate = Math.round((item.correct / item.total) * 100);
        return `
          <div style="flex-shrink:0;width:160px;background:white;border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-sm);border:1px solid var(--border);">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
              <div style="width:32px;height:32px;border-radius:var(--radius-sm);background:${item.color};display:flex;align-items:center;justify-content:center;">
                <i data-lucide="pencil" style="width:16px;height:16px;color:${item.iconColor};"></i>
              </div>
              <div>
                <p style="font-size:13px;font-weight:600;">${item.subject}</p>
                <p style="font-size:11px;color:var(--text-tertiary);">${item.date}</p>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span style="font-size:18px;font-weight:800;color:var(--text-primary);">${rate}<span style="font-size:12px;">%</span></span>
              <span style="font-size:12px;color:var(--text-secondary);">${item.correct}/${item.total}</span>
            </div>
            <div class="progress-bar" style="margin-top:6px;height:4px;">
              <div class="progress-bar-fill" style="width:${rate}%;height:4px;"></div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('recent-practice').innerHTML = html;
    }
  </script>
</body>
</html>
