<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数据看板 - 公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 顶部栏 -->
    <div class="header">
      <a href="index.html" class="header-back">
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </a>
      <span class="header-title">学习数据</span>
      <div style="width:20px;"></div>
    </div>

    <!-- 日期范围 -->
    <div style="padding: 12px 16px;background:white;border-bottom:1px solid var(--border);">
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm" style="flex:1;" onclick="switchRange('7d')" id="range-7d">近7天</button>
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="switchRange('30d')" id="range-30d">近30天</button>
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="switchRange('all')" id="range-all">全部</button>
      </div>
    </div>

    <!-- 正确率趋势 -->
    <div style="padding: 16px 16px 8px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">正确率趋势</h2>
      <div class="card" style="padding:12px;">
        <canvas id="correct-trend" style="width:100%;height:180px;"></canvas>
      </div>
    </div>

    <!-- 申论分数趋势 -->
    <div style="padding: 8px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">申论批改分数趋势</h2>
      <div class="card" style="padding:12px;">
        <canvas id="essay-trend" style="width:100%;height:180px;"></canvas>
      </div>
    </div>

    <!-- 模块强弱 -->
    <div style="padding: 8px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">各模块强弱分析</h2>
      <div class="card" style="padding:12px;">
        <canvas id="module-strength" style="width:100%;height:200px;"></canvas>
      </div>
    </div>

    <!-- 打卡与时长 -->
    <div style="padding: 8px 16px;">
      <div style="display:flex;gap:10px;">
        <div class="card" style="flex:1;padding:16px;text-align:center;">
          <p style="font-size:12px;color:var(--text-secondary);">连续打卡</p>
          <p style="font-size:36px;font-weight:800;color:var(--primary);margin-top:4px;" id="streak-num">12</p>
          <p style="font-size:12px;color:var(--text-tertiary);">天</p>
        </div>
        <div class="card" style="flex:1;padding:16px;text-align:center;">
          <p style="font-size:12px;color:var(--text-secondary);">本周学习</p>
          <p style="font-size:36px;font-weight:800;color:var(--success);margin-top:4px;" id="week-hours">8.5</p>
          <p style="font-size:12px;color:var(--text-tertiary);">小时</p>
        </div>
      </div>
    </div>

    <!-- 日历热图 -->
    <div style="padding: 8px 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">本月学习热力</h2>
      <div class="card" style="padding:12px;">
        <canvas id="heatmap" style="width:100%;height:140px;"></canvas>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;align-items:center;">
        <span style="font-size:11px;color:var(--text-tertiary);">少</span>
        <div style="display:flex;gap:3px;">
          <div style="width:12px;height:12px;background:#e5e7eb;border-radius:2px;"></div>
          <div style="width:12px;height:12px;background:#dbeafe;border-radius:2px;"></div>
          <div style="width:12px;height:12px;background:#93c5fd;border-radius:2px;"></div>
          <div style="width:12px;height:12px;background:#3b82f6;border-radius:2px;"></div>
          <div style="width:12px;height:12px;background:#1e3a8a;border-radius:2px;"></div>
        </div>
        <span style="font-size:11px;color:var(--text-tertiary);">多</span>
      </div>
    </div>

    <!-- 底部导航 -->
    <div id="bottom-nav"></div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/charts.js"></script>
  <script src="shared/components.js"></script>
  <script>
    let currentRange = '7d';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderCharts();
      document.getElementById('bottom-nav').innerHTML = renderBottomNav('dashboard');
      lucide.createIcons();

      // 数字动画
      Animation.countUp(document.getElementById('streak-num'), 12, 1000);
      Animation.countUp(document.getElementById('week-hours'), 8.5, 1000);
    });

    function switchRange(range) {
      currentRange = range;
      ['7d', '30d', 'all'].forEach(r => {
        const btn = document.getElementById(`range-${r}`);
        btn.className = r === range ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
      });
      renderCharts();
    }

    function renderCharts() {
      const studyData = MockData.studyData;

      // 正确率趋势
      setTimeout(() => {
        Charts.drawLine(document.getElementById('correct-trend'), studyData.dailyCorrectRate, studyData.dailyLabels);
      }, 100);

      // 申论分数趋势
      setTimeout(() => {
        Charts.drawLine(document.getElementById('essay-trend'), studyData.essayScores, studyData.dailyLabels, {
          lineColor: '#f97316',
          fillColor: 'rgba(249, 115, 22, 0.1)'
        });
      }, 200);

      // 模块强弱
      setTimeout(() => {
        const items = Object.entries(studyData.moduleStrength).map(([key, val]) => ({
          label: { reasoning: '判断推理', data: '资料分析', language: '言语理解', math: '数量关系', common: '常识判断' }[key] || key,
          value: val.score,
          level: val.level
        }));
        Charts.drawBar(document.getElementById('module-strength'), items);
      }, 300);

      // 日历热图
      setTimeout(() => {
        Charts.drawHeatmap(document.getElementById('heatmap'), studyData.checkInDays);
      }, 400);
    }
  </script>
</body>
</html>
