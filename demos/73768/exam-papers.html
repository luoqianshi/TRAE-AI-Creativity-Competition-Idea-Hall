<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>真题集 - 公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 顶部栏 -->
    <div class="header">
      <a href="index.html" class="header-back">
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </a>
      <span class="header-title">真题集</span>
      <div style="width:20px;"></div>
    </div>

    <!-- 考试类型筛选 -->
    <div style="display:flex;gap:8px;padding:12px 16px;background:white;border-bottom:1px solid var(--border);">
      <button class="btn btn-primary btn-sm" style="flex:1;" id="tab-national" onclick="switchExamType('national')">国考</button>
      <button class="btn btn-outline btn-sm" style="flex:1;" id="tab-jiangsu" onclick="switchExamType('jiangsu')">江苏省考</button>
    </div>

    <!-- 行测模块 -->
    <div style="padding: 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">行测模块</h2>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;" id="subject-grid">
        <!-- JS 渲染 -->
      </div>
    </div>

    <!-- 申论题型 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">申论题型</h2>
      <div class="card" style="padding:0;overflow:hidden;" id="essay-types">
        <!-- JS 渲染 -->
      </div>
    </div>

    <!-- 试卷列表 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">历年试卷</h2>
      <div id="paper-list">
        <!-- JS 渲染 -->
      </div>
    </div>

    <!-- 底部导航 -->
    <div id="bottom-nav"></div>
  </div>

  <!-- 练习确认弹窗 -->
  <div id="practice-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:150;align-items:center;justify-content:center;padding:20px;">
    <div style="background:white;border-radius:var(--radius-lg);padding:24px;width:100%;max-width:320px;animation:scaleIn 0.2s ease;">
      <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;text-align:center;" id="modal-subject-title">判断推理</h3>
      <div style="margin-bottom:16px;">
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">题目数量</p>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline btn-sm" style="flex:1;" onclick="selectCount(10)" data-count="10">10题</button>
          <button class="btn btn-primary btn-sm" style="flex:1;" onclick="selectCount(20)" data-count="20">20题</button>
          <button class="btn btn-outline btn-sm" style="flex:1;" onclick="selectCount(30)" data-count="30">30题</button>
        </div>
      </div>
      <div style="margin-bottom:20px;">
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">练习模式</p>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary btn-sm" style="flex:1;" onclick="selectMode('exam')" data-mode="exam">做题模式</button>
          <button class="btn btn-outline btn-sm" style="flex:1;" onclick="selectMode('study')" data-mode="study">背题模式</button>
        </div>
      </div>
      <button class="btn btn-primary w-full" onclick="startPractice()">开始练习</button>
    </div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/components.js"></script>
  <script>
    let currentExamType = 'national';
    let selectedSubject = null;
    let selectedCount = 20;
    let selectedMode = 'exam';

    const subjects = {
      reasoning: { name: '判断推理', icon: 'git-branch', count: 356, color: '#dbeafe', iconColor: '#1e40af' },
      data: { name: '资料分析', icon: 'bar-chart-2', count: 248, color: '#dcfce7', iconColor: '#166534' },
      language: { name: '言语理解', icon: 'type', count: 412, color: '#ffedd5', iconColor: '#c2410c' },
      math: { name: '数量关系', icon: 'calculator', count: 198, color: '#f3e8ff', iconColor: '#9333ea' },
      common: { name: '常识判断', icon: 'globe', count: 309, color: '#ecfdf5', iconColor: '#059669' }
    };

    const essayTypes = [
      { name: '归纳概括', count: 56 },
      { name: '综合分析', count: 42 },
      { name: '提出对策', count: 38 },
      { name: '贯彻执行', count: 35 },
      { name: '大作文', count: 28 }
    ];

    const papers = [
      { year: 2026, type: '国考', name: '2026年国家公务员考试行测真题', total: 135, done: 45 },
      { year: 2025, type: '国考', name: '2025年国家公务员考试行测真题', total: 135, done: 0 },
      { year: 2024, type: '国考', name: '2024年国家公务员考试行测真题', total: 130, done: 0 },
      { year: 2026, type: '江苏A', name: '2026年江苏省考行测A类真题', total: 135, done: 0 },
      { year: 2025, type: '江苏A', name: '2025年江苏省考行测A类真题', total: 135, done: 0 }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderSubjects();
      renderEssayTypes();
      renderPapers();
      document.getElementById('bottom-nav').innerHTML = renderBottomNav('exam-papers');
      lucide.createIcons();
    });

    function renderSubjects() {
      const html = Object.entries(subjects).map(([key, subject]) => `
        <div style="background:white;border-radius:var(--radius-md);padding:16px;text-align:center;box-shadow:var(--shadow-sm);border:1px solid var(--border);cursor:pointer;transition:all 0.2s ease;"
             onclick="openPracticeModal('${key}')" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
          <div style="width:44px;height:44px;border-radius:var(--radius-sm);background:${subject.color};display:flex;align-items:center;justify-content:center;margin:0 auto 8px;">
            <i data-lucide="${subject.icon}" style="width:22px;height:22px;color:${subject.iconColor};"></i>
          </div>
          <p style="font-size:13px;font-weight:600;">${subject.name}</p>
          <p style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">${subject.count}题</p>
        </div>
      `).join('');
      document.getElementById('subject-grid').innerHTML = html;
    }

    function renderEssayTypes() {
      const html = essayTypes.map(type => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;"
             onclick="Toast('申论练习功能开发中', 'warning')">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:36px;height:36px;border-radius:var(--radius-sm);background:var(--warning-soft);display:flex;align-items:center;justify-content:center;">
              <i data-lucide="file-text" style="width:18px;height:18px;color:var(--warning);"></i>
            </div>
            <span style="font-size:14px;font-weight:500;">${type.name}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:12px;color:var(--text-tertiary);">${type.count}题</span>
            <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--text-tertiary);"></i>
          </div>
        </div>
      `).join('');
      document.getElementById('essay-types').innerHTML = html;
    }

    function renderPapers() {
      const filtered = papers.filter(p => currentExamType === 'national' ? p.type === '国考' : p.type.includes('江苏'));
      const html = filtered.map(paper => {
        const progress = Math.round((paper.done / paper.total) * 100);
        return `
          <div class="card" style="padding:14px 16px;margin-bottom:10px;cursor:pointer;" onclick="Toast('整卷练习功能开发中', 'warning')">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <div>
                <span class="tag tag-primary" style="margin-bottom:6px;display:inline-block;">${paper.type}</span>
                <p style="font-size:14px;font-weight:600;margin-top:4px;">${paper.name}</p>
              </div>
              <i data-lucide="chevron-right" style="width:18px;height:18px;color:var(--text-tertiary);flex-shrink:0;"></i>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="progress-bar" style="flex:1;">
                <div class="progress-bar-fill" style="width:${progress}%"></div>
              </div>
              <span style="font-size:12px;color:var(--text-secondary);white-space:nowrap;">${paper.done}/${paper.total}题</span>
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('paper-list').innerHTML = html;
    }

    function switchExamType(type) {
      currentExamType = type;
      document.getElementById('tab-national').className = type === 'national' ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
      document.getElementById('tab-jiangsu').className = type === 'jiangsu' ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
      renderPapers();
      lucide.createIcons();
    }

    function openPracticeModal(subject) {
      selectedSubject = subject;
      const subjectData = subjects[subject];
      document.getElementById('modal-subject-title').textContent = subjectData.name;
      document.getElementById('practice-modal').style.display = 'flex';
    }

    function selectCount(count) {
      selectedCount = count;
      document.querySelectorAll('[data-count]').forEach(btn => {
        btn.className = parseInt(btn.dataset.count) === count ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
      });
    }

    function selectMode(mode) {
      selectedMode = mode;
      document.querySelectorAll('[data-mode]').forEach(btn => {
        btn.className = btn.dataset.mode === mode ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
      });
    }

    function startPractice() {
      document.getElementById('practice-modal').style.display = 'none';
      Store.setCurrentPractice({
        subject: selectedSubject,
        count: selectedCount,
        mode: selectedMode,
        questions: MockData.questions.slice(0, selectedCount)
      });
      Router.go('practice.html');
    }

    // 点击遮罩关闭弹窗
    document.getElementById('practice-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('practice-modal')) {
        document.getElementById('practice-modal').style.display = 'none';
      }
    });
  </script>
</body>
</html>
