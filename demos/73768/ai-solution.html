<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 解题拆解 - 公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 顶部栏 -->
    <div class="header">
      <a href="practice.html" class="header-back">
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </a>
      <span class="header-title">AI 解题拆解</span>
      <div style="width:20px;"></div>
    </div>

    <!-- 步骤导航 -->
    <div style="padding: 12px 16px;background:white;border-bottom:1px solid var(--border);">
      <div id="step-nav">
        <!-- JS 渲染 -->
      </div>
      <div class="progress-bar" style="margin-top:10px;">
        <div class="progress-bar-fill" id="step-progress" style="width:20%"></div>
      </div>
    </div>

    <!-- 内容区 -->
    <div style="padding: 16px;min-height:400px;" id="solution-content">
      <!-- JS 渲染 -->
    </div>

    <!-- 底部导航 -->
    <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;min-width:375px;background:white;border-top:1px solid var(--border);padding:12px 16px 24px;display:flex;gap:10px;z-index:50;">
      <button class="btn btn-outline" style="flex:1;" id="prev-btn" onclick="prevStep()">上一步</button>
      <button class="btn btn-primary" style="flex:1;" id="next-btn" onclick="nextStep()">下一步</button>
    </div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/components.js"></script>
  <script>
    const steps = ['审题', '踩分点', '材料定位', '答题框架', '注意事项'];
    const stepIcons = ['eye', 'target', 'map-pin', 'layout-template', 'alert-triangle'];
    let currentStep = 0;

    const solutionData = {
      审题: {
        title: '审题：明确题目要求',
        content: `
          <div style="background:var(--primary-soft);border-radius:var(--radius-md);padding:14px;margin-bottom:14px;">
            <p style="font-size:13px;color:var(--primary);font-weight:600;margin-bottom:6px;">题目类型</p>
            <p style="font-size:14px;color:var(--text-primary);">三段论推理结构类比题</p>
          </div>
          <div style="margin-bottom:14px;">
            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">核心要求</p>
            <p style="font-size:14px;color:var(--text-primary);line-height:1.7;">找出与题干推理结构相同的选项，而非判断结论对错。</p>
          </div>
          <div>
            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">关键信息</p>
            <ul style="font-size:14px;color:var(--text-primary);line-height:1.8;padding-left:18px;">
              <li>大前提："所有公务员都要为人民服务"（全称肯定）</li>
              <li>小前提："小张是公务员"（个体属于类）</li>
              <li>结论："小张要为人民服务"（个体具有属性）</li>
            </ul>
          </div>
        `
      },
      踩分点: {
        title: '踩分点：得分关键',
        content: `
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div class="card-flat" style="border-left:4px solid var(--success);margin-bottom:0;">
              <p style="font-size:13px;font-weight:600;color:var(--success);margin-bottom:4px;">踩分点 1</p>
              <p style="font-size:14px;color:var(--text-primary);">准确识别三段论的标准形式：所有A是B，C是A，所以C是B</p>
            </div>
            <div class="card-flat" style="border-left:4px solid var(--success);margin-bottom:0;">
              <p style="font-size:13px;font-weight:600;color:var(--success);margin-bottom:4px;">踩分点 2</p>
              <p style="font-size:14px;color:var(--text-primary);">区分"所有"与"有些"的推理差异</p>
            </div>
            <div class="card-flat" style="border-left:4px solid var(--success);margin-bottom:0;">
              <p style="font-size:13px;font-weight:600;color:var(--success);margin-bottom:4px;">踩分点 3</p>
              <p style="font-size:14px;color:var(--text-primary);">结论的肯定/否定形式要与题干一致</p>
            </div>
          </div>
        `
      },
      材料定位: {
        title: '材料定位：关键内容',
        content: `
          <div style="background:#fffbeb;border-radius:var(--radius-md);padding:14px;margin-bottom:14px;border:1px solid #fde68a;">
            <p style="font-size:13px;font-weight:600;color:#d97706;margin-bottom:8px;">题干关键句</p>
            <p style="font-size:14px;color:var(--text-primary);line-height:1.7;">"<span style="background:#fde68a;padding:0 2px;">所有</span>公务员<span style="background:#fde68a;padding:0 2px;">都</span>要为人民服务，小张<span style="background:#fde68a;padding:0 2px;">是</span>公务员，<span style="background:#fde68a;padding:0 2px;">所以</span>小张要为人民服务。"</p>
          </div>
          <div>
            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">结构拆解</p>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="tag tag-primary" style="flex-shrink:0;">大前提</span>
                <span style="font-size:13px;color:var(--text-primary);">所有A（公务员）是B（为人民服务）</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="tag tag-success" style="flex-shrink:0;">小前提</span>
                <span style="font-size:13px;color:var(--text-primary);">C（小张）是A（公务员）</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="tag tag-warning" style="flex-shrink:0;">结论</span>
                <span style="font-size:13px;color:var(--text-primary);">C（小张）是B（为人民服务）</span>
              </div>
            </div>
          </div>
        `
      },
      答题框架: {
        title: '答题框架：标准模板',
        content: `
          <div style="background:var(--primary-soft);border-radius:var(--radius-md);padding:14px;margin-bottom:14px;">
            <p style="font-size:13px;font-weight:600;color:var(--primary);margin-bottom:8px;">三段论结构识别法</p>
            <ol style="font-size:14px;color:var(--text-primary);line-height:1.8;padding-left:18px;">
              <li>提取题干的大前提形式（全称/特称、肯定/否定）</li>
              <li>提取题干的小前提形式（个体归属）</li>
              <li>提取题干的结论形式</li>
              <li>逐一对比选项的三段论结构</li>
              <li>排除结构不同的选项</li>
            </ol>
          </div>
          <div class="card-flat" style="margin-bottom:0;">
            <p style="font-size:13px;font-weight:600;margin-bottom:8px;">选项分析速记</p>
            <div style="font-size:13px;color:var(--text-primary);line-height:1.8;">
              <p><span style="color:var(--success);font-weight:600;">A. 正确</span> — 完全符合三段论标准结构</p>
              <p><span style="color:var(--danger);">B. 错误</span> — "有些"开头，非全称</p>
              <p><span style="color:var(--danger);">C. 错误</span> — 结论否定，与题干不符</p>
              <p><span style="color:var(--danger);">D. 错误</span> — "有些"开头，非全称</p>
            </div>
          </div>
        `
      },
      注意事项: {
        title: '注意事项：常见失分点',
        content: `
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div class="card-flat" style="border-left:4px solid var(--danger);margin-bottom:0;background:var(--danger-soft);">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                <i data-lucide="alert-circle" style="width:14px;height:14px;color:var(--danger);"></i>
                <span style="font-size:13px;font-weight:600;color:var(--danger);">常见错误 1</span>
              </div>
              <p style="font-size:14px;color:var(--text-primary);">只看结论内容是否相似，忽略推理结构形式。本题要求"结构相同"，而非"内容相关"。</p>
            </div>
            <div class="card-flat" style="border-left:4px solid var(--danger);margin-bottom:0;background:var(--danger-soft);">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                <i data-lucide="alert-circle" style="width:14px;height:14px;color:var(--danger);"></i>
                <span style="font-size:13px;font-weight:600;color:var(--danger);">常见错误 2</span>
              </div>
              <p style="font-size:14px;color:var(--text-primary);">混淆"所有"与"有些"。三段论要求大前提是全称命题（所有），特称命题（有些）结构不同。</p>
            </div>
            <div class="card-flat" style="border-left:4px solid var(--warning);margin-bottom:0;background:var(--warning-soft);">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                <i data-lucide="lightbulb" style="width:14px;height:14px;color:var(--warning);"></i>
                <span style="font-size:13px;font-weight:600;color:var(--warning);">提速技巧</span>
              </div>
              <p style="font-size:14px;color:var(--text-primary);">快速看选项开头：非"所有"开头的可直接排除，大幅缩小范围。</p>
            </div>
          </div>
        `
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderStepNav();
      renderContent();
      updateButtons();
    });

    function renderStepNav() {
      const html = steps.map((step, index) => `
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;"
             onclick="goToStep(${index})">
          <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.2s ease;
                      ${index < currentStep ? 'background:var(--success);color:white;' :
                        index === currentStep ? 'background:var(--primary);color:white;' :
                        'background:var(--border);color:var(--text-tertiary);'}">
            ${index < currentStep ? '<i data-lucide="check" style="width:18px;height:18px;"></i>' :
              `<i data-lucide="${stepIcons[index]}" style="width:18px;height:18px;"></i>`}
          </div>
          <span style="font-size:11px;color:${index === currentStep ? 'var(--primary)' : index < currentStep ? 'var(--success)' : 'var(--text-tertiary)'};font-weight:${index === currentStep ? '600' : '400'};">${step}</span>
        </div>
      `).join('');
      document.getElementById('step-nav').innerHTML = `<div style="display:flex;justify-content:space-between;">${html}</div>`;
      lucide.createIcons();
    }

    function renderContent() {
      const data = solutionData[steps[currentStep]];
      const html = `
        <div style="animation:slideInRight 0.3s ease;">
          <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">${data.title}</h2>
          ${data.content}
        </div>
      `;
      document.getElementById('solution-content').innerHTML = html;
    }

    function updateButtons() {
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');

      prevBtn.style.visibility = currentStep === 0 ? 'hidden' : 'visible';
      nextBtn.textContent = currentStep === steps.length - 1 ? '完成' : '下一步';

      // 更新进度条
      const progress = ((currentStep + 1) / steps.length) * 100;
      document.getElementById('step-progress').style.width = progress + '%';
    }

    function nextStep() {
      if (currentStep < steps.length - 1) {
        currentStep++;
        renderStepNav();
        renderContent();
        updateButtons();
      } else {
        Toast('已完成 AI 解题拆解！', 'success');
        setTimeout(() => Router.back(), 800);
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderStepNav();
        renderContent();
        updateButtons();
      }
    }

    function goToStep(index) {
      currentStep = index;
      renderStepNav();
      renderContent();
      updateButtons();
    }
  </script>
</body>
</html>
