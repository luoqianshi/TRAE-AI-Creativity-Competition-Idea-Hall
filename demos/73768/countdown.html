<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>备考倒计时 - 公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 顶部栏 -->
    <div class="header">
      <a href="index.html" class="header-back">
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </a>
      <span class="header-title">备考进度</span>
      <div style="width:20px;"></div>
    </div>

    <!-- 目标考试选择 -->
    <div style="padding: 12px 16px;background:white;border-bottom:1px solid var(--border);">
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm" style="flex:1;" onclick="switchTarget('national')" id="target-national">国考</button>
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="switchTarget('jiangsu')" id="target-jiangsu">江苏省考</button>
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="switchTarget('custom')" id="target-custom">自定义</button>
      </div>
    </div>

    <!-- 大型倒计时 -->
    <div style="padding: 32px 16px;text-align:center;background:linear-gradient(180deg,var(--primary-soft),white);">
      <p style="font-size:14px;color:var(--text-secondary);">距离 2026 年国考还有</p>
      <div style="display:flex;align-items:baseline;justify-content:center;gap:4px;margin-top:8px;">
        <span style="font-size:64px;font-weight:800;color:var(--primary);line-height:1;" id="countdown-main">146</span>
        <span style="font-size:18px;color:var(--text-secondary);">天</span>
      </div>
      <p style="font-size:14px;color:var(--text-tertiary);margin-top:8px;" id="countdown-sub">3 小时 42 分钟</p>
    </div>

    <!-- 整体复习进度 -->
    <div style="padding: 0 16px 16px;">
      <div class="card" style="text-align:center;padding:20px;">
        <p style="font-size:14px;color:var(--text-secondary);margin-bottom:12px;">整体复习进度</p>
        <div style="position:relative;width:120px;height:120px;margin:0 auto;">
          <canvas id="progress-ring" style="width:120px;height:120px;"></canvas>
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
            <span style="font-size:28px;font-weight:800;color:var(--primary);">35</span>
            <span style="font-size:14px;color:var(--text-secondary);">%</span>
          </div>
        </div>
        <div style="display:flex;justify-content:center;gap:24px;margin-top:16px;">
          <div>
            <p style="font-size:20px;font-weight:700;">523</p>
            <p style="font-size:12px;color:var(--text-secondary);">已完成题</p>
          </div>
          <div>
            <p style="font-size:20px;font-weight:700;">1000</p>
            <p style="font-size:12px;color:var(--text-secondary);">目标题数</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 阶段里程碑 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">阶段里程碑</h2>
      <div class="card" style="padding:16px;">
        <div class="timeline">
          <div class="timeline-item completed">
            <p style="font-size:14px;font-weight:600;color:var(--text-primary);">基础阶段</p>
            <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">系统学习各模块知识点 · 已完成</p>
          </div>
          <div class="timeline-item active">
            <p style="font-size:14px;font-weight:600;color:var(--text-primary);">强化阶段</p>
            <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">专项突破薄弱环节 · 进行中</p>
          </div>
          <div class="timeline-item">
            <p style="font-size:14px;font-weight:600;color:var(--text-primary);">冲刺阶段</p>
            <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">真题模拟 · 考前30天开始</p>
          </div>
          <div class="timeline-item" style="padding-bottom:0;">
            <p style="font-size:14px;font-weight:600;color:var(--text-primary);">模考阶段</p>
            <p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">全真模拟 · 考前7天开始</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 关键节点 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">关键节点</h2>
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:32px;height:32px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;">
              <i data-lucide="file-text" style="width:16px;height:16px;color:var(--primary);"></i>
            </div>
            <div>
              <p style="font-size:14px;font-weight:500;">报名开始</p>
              <p style="font-size:12px;color:var(--text-secondary);">2026年10月15日</p>
            </div>
          </div>
          <span class="tag tag-primary">待开始</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:32px;height:32px;border-radius:50%;background:var(--warning-soft);display:flex;align-items:center;justify-content:center;">
              <i data-lucide="credit-card" style="width:16px;height:16px;color:var(--warning);"></i>
            </div>
            <div>
              <p style="font-size:14px;font-weight:500;">缴费截止</p>
              <p style="font-size:12px;color:var(--text-secondary);">2026年10月26日</p>
            </div>
          </div>
          <span class="tag tag-primary">待开始</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:32px;height:32px;border-radius:50%;background:var(--success-soft);display:flex;align-items:center;justify-content:center;">
              <i data-lucide="printer" style="width:16px;height:16px;color:var(--success);"></i>
            </div>
            <div>
              <p style="font-size:14px;font-weight:500;">准考证打印</p>
              <p style="font-size:12px;color:var(--text-secondary);">2026年11月20日</p>
            </div>
          </div>
          <span class="tag tag-primary">待开始</span>
        </div>
      </div>
    </div>

    <!-- 底部导航 -->
    <div id="bottom-nav"></div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/charts.js"></script>
  <script src="shared/components.js"></script>
  <script>
    let currentTarget = 'national';
    const targetDates = {
      national: '2026-11-29',
      jiangsu: '2026-12-12',
      custom: '2026-11-29'
    };

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updateCountdown();
      setInterval(updateCountdown, 60000); // 每分钟更新

      // 绘制进度环形图
      setTimeout(() => {
        Charts.drawRing(document.getElementById('progress-ring'), 35, { lineWidth: 8 });
      }, 100);

      document.getElementById('bottom-nav').innerHTML = renderBottomNav('countdown');
      lucide.createIcons();
    });

    function switchTarget(target) {
      currentTarget = target;
      ['national', 'jiangsu', 'custom'].forEach(t => {
        const btn = document.getElementById(`target-${t}`);
        btn.className = t === target ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
      });
      updateCountdown();
    }

    function updateCountdown() {
      const days = Utils.getCountdownDays(targetDates[currentTarget]);
      const now = new Date();
      const hours = 23 - now.getHours();
      const minutes = 59 - now.getMinutes();

      document.getElementById('countdown-main').textContent = days;
      document.getElementById('countdown-sub').textContent = `${hours} 小时 ${minutes} 分钟`;
    }
  </script>
</body>
</html>
