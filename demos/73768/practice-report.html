<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>练习报告 - 公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 顶部栏 -->
    <div class="header">
      <a href="index.html" class="header-back">
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </a>
      <span class="header-title">练习报告</span>
      <div style="width:20px;"></div>
    </div>

    <!-- 得分区 -->
    <div style="padding: 24px 16px;text-align:center;background:linear-gradient(180deg,white,#f8fafc);">
      <div style="position:relative;width:140px;height:140px;margin:0 auto;">
        <canvas id="score-ring" style="width:140px;height:140px;"></canvas>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
          <span style="font-size:42px;font-weight:800;color:var(--text-primary);" id="score-num">70</span>
          <span style="font-size:14px;color:var(--text-secondary);">分</span>
        </div>
      </div>
      <p style="font-size:14px;color:var(--text-secondary);margin-top:12px;">
        正确 <span style="font-weight:700;color:var(--success);" id="correct-count">14</span> 题 /
        错误 <span style="font-weight:700;color:var(--danger);" id="wrong-count">6</span> 题
      </p>
      <div style="display:flex;justify-content:center;gap:24px;margin-top:16px;">
        <div style="text-align:center;">
          <p style="font-size:12px;color:var(--text-secondary);">用时</p>
          <p style="font-size:16px;font-weight:700;" id="duration">15:32</p>
        </div>
        <div style="text-align:center;">
          <p style="font-size:12px;color:var(--text-secondary);">平均用时</p>
          <p style="font-size:16px;font-weight:700;" id="avg-time">46秒</p>
        </div>
      </div>
    </div>

    <!-- 答题时间曲线 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">答题时间分布</h2>
      <div class="card" style="padding:12px;">
        <canvas id="time-curve" style="width:100%;height:180px;"></canvas>
      </div>
    </div>

    <!-- 模块表现 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">模块表现</h2>
      <div class="card" style="padding:12px;">
        <canvas id="module-bar" style="width:100%;height:160px;"></canvas>
      </div>
    </div>

    <!-- 能力雷达图 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">能力分析</h2>
      <div class="card" style="padding:12px;">
        <canvas id="ability-radar" style="width:100%;height:220px;"></canvas>
      </div>
    </div>

    <!-- 错题列表 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">本次错题</h2>
      <div id="wrong-list">
        <!-- JS 渲染 -->
      </div>
    </div>

    <!-- 操作按钮 -->
    <div style="padding: 0 16px 24px;">
      <div style="display:flex;gap:10px;">
        <a href="exam-papers.html" class="btn btn-outline" style="flex:1;">再来一组</a>
        <a href="wrongbook.html" class="btn btn-primary" style="flex:1;">查看错题本</a>
      </div>
    </div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/charts.js"></script>
  <script src="shared/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const report = Store.getLastReport() || MockData.generateReport({
        total: 20,
        correct: 14,
        duration: 932
      });

      // 更新数据
      document.getElementById('score-num').textContent = report.correctRate;
      document.getElementById('correct-count').textContent = report.correct;
      document.getElementById('wrong-count').textContent = report.wrong;
      document.getElementById('duration').textContent = Timer.formatSeconds(report.duration);
      document.getElementById('avg-time').textContent = Timer.formatSeconds(report.avgTime);

      // 绘制环形图
      setTimeout(() => {
        Charts.drawRingWithText(document.getElementById('score-ring'), report.correctRate, {
          color: report.correctRate >= 60 ? '#22c55e' : '#f97316'
        });
      }, 100);

      // 绘制时间曲线
      setTimeout(() => {
        Charts.drawLine(document.getElementById('time-curve'), report.timeCurve,
          report.timeCurve.map((_, i) => `${i + 1}`));
      }, 200);

      // 绘制模块表现
      setTimeout(() => {
        const items = Object.entries(report.subjectBreakdown).map(([key, val]) => ({
          label: { reasoning: '判断推理', data: '资料分析', language: '言语理解', math: '数量关系', common: '常识判断' }[key] || key,
          value: Math.round((val.correct / val.total) * 100),
          level: val.correct / val.total >= 0.7 ? 'strong' : val.correct / val.total >= 0.5 ? 'medium' : 'weak'
        }));
        Charts.drawBar(document.getElementById('module-bar'), items);
      }, 300);

      // 绘制雷达图
      setTimeout(() => {
        Charts.drawRadar(document.getElementById('ability-radar'), report.abilityRadar);
      }, 400);

      // 渲染错题列表
      renderWrongList();
    });

    function renderWrongList() {
      const wrongQuestions = Store.getWrongQuestions().slice(0, 3);
      if (wrongQuestions.length === 0) {
        document.getElementById('wrong-list').innerHTML = `
          <div class="empty-state">
            <i data-lucide="check-circle" style="width:48px;height:48px;color:var(--success);"></i>
            <p>太棒了，这次没有错题！</p>
          </div>
        `;
        return;
      }

      const html = wrongQuestions.map(wq => {
        const q = MockData.questions.find(q => q.id === wq.questionId);
        if (!q) return '';
        return `
          <div class="card" style="padding:12px 16px;margin-bottom:8px;cursor:pointer;" onclick="Router.go('wrongbook.html')">
            <div style="display:flex;align-items:flex-start;gap:10px;">
              <div style="width:28px;height:28px;border-radius:50%;background:var(--danger-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i data-lucide="x" style="width:14px;height:14px;color:var(--danger);"></i>
              </div>
              <div style="flex:1;min-width:0;">
                <p style="font-size:13px;color:var(--text-primary);line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${q.content}</p>
                <div style="display:flex;gap:6px;margin-top:6px;">
                  <span class="tag tag-danger">${wq.wrongReason}</span>
                  <span class="tag" style="background:#f3f4f6;color:var(--text-secondary);">错 ${wq.wrongCount} 次</span>
                </div>
              </div>
              <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--text-tertiary);flex-shrink:0;margin-top:4px;"></i>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('wrong-list').innerHTML = html;
      lucide.createIcons();
    }
  </script>
</body>
</html>
