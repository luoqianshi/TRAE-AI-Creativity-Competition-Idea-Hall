<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>申论批改对比 - 公考 AI 学习助手</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone-frame page-enter">
    <!-- 顶部栏 -->
    <div class="header">
      <a href="index.html" class="header-back">
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </a>
      <span class="header-title">多模型批改对比</span>
      <div style="width:20px;"></div>
    </div>

    <!-- 题目区 -->
    <div style="padding: 16px;">
      <div class="card" style="padding:14px;margin-bottom:12px;cursor:pointer;" onclick="toggleTopic()">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="tag tag-warning">申论题目</span>
          <i data-lucide="chevron-down" style="width:16px;height:16px;color:var(--text-tertiary);" id="topic-arrow"></i>
        </div>
        <p style="font-size:14px;color:var(--text-primary);line-height:1.6;margin-top:8px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;" id="topic-text">
          根据给定材料，概括"数字乡村建设"的主要举措和成效。
        </p>
      </div>

      <!-- 展开的完整题目 -->
      <div id="topic-full" style="display:none;" class="card" style="padding:14px;margin-bottom:12px;background:#f8fafc;">
        <p style="font-size:14px;color:var(--text-primary);line-height:1.7;">
          <strong>题目：</strong>根据给定材料，概括"数字乡村建设"的主要举措和成效。（15分）<br><br>
          <strong>要求：</strong>准确全面，条理清楚，语言简洁，不超过200字。
        </p>
      </div>

      <!-- 用户作答 -->
      <div class="card" style="padding:14px;margin-bottom:12px;cursor:pointer;" onclick="toggleAnswer()">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="tag tag-primary">我的作答</span>
          <i data-lucide="chevron-down" style="width:16px;height:16px;color:var(--text-tertiary);" id="answer-arrow"></i>
        </div>
        <p style="font-size:14px;color:var(--text-primary);line-height:1.6;margin-top:8px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;" id="answer-text">
          近年来，我国积极推进数字乡村建设。一是加强农村信息基础设施建设，实现了宽带网络全覆盖。二是推广智慧农业，利用物联网技术提升农业生产效率...
        </p>
      </div>

      <!-- 展开的完整作答 -->
      <div id="answer-full" style="display:none;" class="card" style="padding:14px;margin-bottom:12px;background:#f8fafc;">
        <p style="font-size:14px;color:var(--text-primary);line-height:1.7;" id="answer-full-text"></p>
      </div>
    </div>

    <!-- 模型分数对比 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">模型评分对比</h2>
      <div style="display:flex;flex-direction:column;gap:10px;" id="model-scores">
        <!-- JS 渲染 -->
      </div>
    </div>

    <!-- 评语 Tab -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">详细评语</h2>
      <div style="display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;">
        <button class="btn btn-primary btn-sm" onclick="switchModel(0)" id="model-tab-0">DeepSeek</button>
        <button class="btn btn-outline btn-sm" onclick="switchModel(1)" id="model-tab-1">Qwen</button>
        <button class="btn btn-outline btn-sm" onclick="switchModel(2)" id="model-tab-2">Doubao</button>
      </div>
      <div class="card" id="comment-content">
        <!-- JS 渲染 -->
      </div>
    </div>

    <!-- 共性建议 -->
    <div style="padding: 0 16px 16px;">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">共性改进建议</h2>
      <div class="card" style="background:linear-gradient(135deg,#fef3c7,#ffedd5);border:1px solid #fde68a;">
        <div id="common-suggestions">
          <!-- JS 渲染 -->
        </div>
      </div>
    </div>

    <!-- 操作 -->
    <div style="padding: 0 16px 24px;">
      <a href="essay-diagnosis.html" class="btn btn-primary w-full">查看弱项诊断</a>
    </div>
  </div>

  <script src="shared/utils.js"></script>
  <script src="shared/components.js"></script>
  <script>
    let currentModel = 0;
    const data = MockData.essayEvaluation;

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderModelScores();
      renderComment();
      renderCommonSuggestions();
      document.getElementById('answer-full-text').textContent = data.userAnswer;
    });

    function toggleTopic() {
      const full = document.getElementById('topic-full');
      const arrow = document.getElementById('topic-arrow');
      full.style.display = full.style.display === 'none' ? 'block' : 'none';
      arrow.style.transform = full.style.display === 'none' ? 'rotate(0deg)' : 'rotate(180deg)';
      arrow.style.transition = 'transform 0.2s ease';
    }

    function toggleAnswer() {
      const full = document.getElementById('answer-full');
      const arrow = document.getElementById('answer-arrow');
      full.style.display = full.style.display === 'none' ? 'block' : 'none';
      arrow.style.transform = full.style.display === 'none' ? 'rotate(0deg)' : 'rotate(180deg)';
      arrow.style.transition = 'transform 0.2s ease';
    }

    function renderModelScores() {
      const maxScore = Math.max(...data.models.map(m => m.score));
      const minScore = Math.min(...data.models.map(m => m.score));

      const html = data.models.map((model, index) => {
        const isMax = model.score === maxScore;
        const isMin = model.score === minScore;
        const scoreColor = isMax ? 'var(--success)' : isMin ? 'var(--warning)' : 'var(--text-primary)';

        const dimLabels = { 立意: '立意', 结构: '结构', 语言: '语言', 内容: '内容' };
        const dimensions = Object.entries(model.dimensions).map(([k, v]) => `
          <div style="text-align:center;">
            <div style="font-size:11px;color:var(--text-tertiary);margin-bottom:2px;">${dimLabels[k]}</div>
            <div style="font-size:14px;font-weight:700;color:${v >= 75 ? 'var(--success)' : v >= 70 ? 'var(--text-primary)' : 'var(--warning)'};">${v}</div>
          </div>
        `).join('');

        return `
          <div class="card" style="padding:14px;margin-bottom:0;${isMax ? 'border:2px solid var(--success);' : ''}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <div style="width:36px;height:36px;border-radius:50%;background:${isMax ? 'var(--success-soft)' : 'var(--primary-soft)'};display:flex;align-items:center;justify-content:center;">
                  <i data-lucide="bot" style="width:18px;height:18px;color:${isMax ? 'var(--success)' : 'var(--primary)'};"></i>
                </div>
                <div>
                  <p style="font-size:14px;font-weight:600;">${model.name}</p>
                  ${isMax ? '<span class="tag tag-success" style="font-size:10px;padding:2px 6px;">最高分</span>' : ''}
                </div>
              </div>
              <div style="text-align:right;">
                <span style="font-size:32px;font-weight:800;color:${scoreColor};">${model.score}</span>
                <span style="font-size:14px;color:var(--text-secondary);">/100</span>
              </div>
            </div>
            <div style="display:flex;justify-content:space-around;padding-top:10px;border-top:1px solid var(--border);">
              ${dimensions}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('model-scores').innerHTML = html;
      lucide.createIcons();
    }

    function switchModel(index) {
      currentModel = index;

      // 更新标签样式
      data.models.forEach((_, i) => {
        const btn = document.getElementById(`model-tab-${i}`);
        btn.className = i === index ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
      });

      renderComment();
    }

    function renderComment() {
      const model = data.models[currentModel];
      const html = `
        <div style="animation:fadeIn 0.3s ease;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
            <div style="width:32px;height:32px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;">
              <i data-lucide="bot" style="width:16px;height:16px;color:var(--primary);"></i>
            </div>
            <span style="font-size:14px;font-weight:600;">${model.name}</span>
            <span style="font-size:18px;font-weight:800;color:var(--primary);margin-left:auto;">${model.score}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            ${model.comment.map((c, i) => `
              <div style="display:flex;gap:8px;">
                <span style="width:20px;height:20px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;">${i + 1}</span>
                <p style="font-size:13px;color:var(--text-primary);line-height:1.6;">${c}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      document.getElementById('comment-content').innerHTML = html;
      lucide.createIcons();
    }

    function renderCommonSuggestions() {
      const html = data.weakness.map((w, i) => `
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <div style="width:20px;height:20px;border-radius:50%;background:var(--warning);color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;">${i + 1}</div>
          <p style="font-size:14px;color:var(--text-primary);line-height:1.5;">${w}</p>
        </div>
      `).join('');
      document.getElementById('common-suggestions').innerHTML = html;
    }
  </script>
</body>
</html>
