<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今晚吃什么 - 美食转盘</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a00 0%, #2d1b00 30%, #4a2500 60%, #1a0a00 100%);
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景装饰粒子 */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,200,100,0.3) 0%, transparent 70%);
            animation: floatUp 8s infinite ease-in-out;
        }

        @keyframes floatUp {
            0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { transform: translateY(50vh) scale(1); opacity: 0.6; }
        }

        /* 标题 */
        .title {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 0 4px 8px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            z-index: 10;
            letter-spacing: 4px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .subtitle {
            color: #d4a574;
            font-size: 1rem;
            margin-bottom: 30px;
            z-index: 10;
            letter-spacing: 2px;
        }

        /* 转盘容器 */
        .wheel-container {
            position: relative;
            width: min(360px, 85vw);
            height: min(360px, 85vw);
            z-index: 10;
        }

        /* 外圈装饰 */
        .wheel-outer-ring {
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border-radius: 50%;
            border: 3px dashed rgba(255, 215, 0, 0.4);
            animation: ringRotate 20s linear infinite;
        }

        @keyframes ringRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 转盘主体 */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 0 40px rgba(255, 140, 0, 0.3),
                0 0 80px rgba(255, 100, 0, 0.15),
                inset 0 0 30px rgba(0,0,0,0.3);
            transition: transform 0.1s linear;
        }

        .wheel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            border: 4px solid #ffd700;
            z-index: 20;
            pointer-events: none;
        }

        /* 扇形区域 */
        .slice {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            left: 0;
            top: 0;
            clip-path: polygon(100% 100%, 100% 0, 0 0);
        }

        .slice-content {
            position: absolute;
            left: 65%;
            top: 25%;
            transform: rotate(-22.5deg);
            transform-origin: center;
            text-align: center;
            color: white;
            font-weight: 700;
            font-size: clamp(11px, 3vw, 14px);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .slice-emoji {
            font-size: clamp(18px, 5vw, 24px);
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
        }

        /* 中心圆 */
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #ffd700 0%, #ff8c00 100%);
            border-radius: 50%;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 20px rgba(255, 215, 0, 0.6),
                0 4px 10px rgba(0,0,0,0.4),
                inset 0 -3px 8px rgba(0,0,0,0.2);
            border: 3px solid #fff;
        }

        .wheel-center span {
            font-size: 28px;
        }

        /* 指针 */
        .pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
            animation: pointerBounce 1.5s ease-in-out infinite;
        }

        @keyframes pointerBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        .pointer svg {
            width: 40px;
            height: 50px;
        }

        /* 按钮 */
        .controls {
            margin-top: 40px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .spin-btn {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.5rem;
            padding: 15px 60px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c00 50%, #ff6b35 100%);
            color: white;
            cursor: pointer;
            box-shadow: 
                0 6px 20px rgba(255, 107, 53, 0.4),
                0 0 40px rgba(255, 140, 0, 0.2),
                inset 0 -3px 10px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            letter-spacing: 4px;
            position: relative;
            overflow: hidden;
        }

        .spin-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255,255,255,0.2) 50%,
                transparent 70%
            );
            transform: rotate(45deg);
            transition: all 0.5s ease;
        }

        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 10px 30px rgba(255, 107, 53, 0.5),
                0 0 60px rgba(255, 140, 0, 0.3);
        }

        .spin-btn:hover::before {
            left: 100%;
        }

        .spin-btn:active {
            transform: translateY(1px);
        }

        .spin-btn:disabled {
            background: linear-gradient(135deg, #666 0%, #888 50%, #666 100%);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 结果展示 */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-overlay.active {
            display: flex;
        }

        .result-card {
            background: linear-gradient(135deg, #2d1b00 0%, #4a2500 100%);
            border: 3px solid #ffd700;
            border-radius: 24px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 
                0 0 60px rgba(255, 215, 0, 0.3),
                0 20px 40px rgba(0,0,0,0.5);
            animation: resultPop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 90vw;
        }

        @keyframes resultPop {
            0% { transform: scale(0) rotate(-10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .result-label {
            color: #d4a574;
            font-size: 1rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .result-emoji {
            font-size: 5rem;
            margin: 15px 0;
            animation: emojiBounce 1s ease infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        @keyframes emojiBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.1); }
        }

        .result-food {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }

        .result-desc {
            color: #d4a574;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .result-btn {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1rem;
            padding: 12px 40px;
            border: 2px solid #ffd700;
            border-radius: 30px;
            background: transparent;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .result-btn:hover {
            background: #ffd700;
            color: #2d1b00;
            transform: scale(1.05);
        }

        /* 彩带效果 */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* 旋转时的光效 */
        .wheel-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,140,0,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 5;
        }

        .wheel-glow.active {
            opacity: 1;
            animation: glowPulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to { transform: translate(-50%, -50%) scale(1.1); }
        }

        /* 底部提示 */
        .footer-hint {
            position: fixed;
            bottom: 20px;
            color: rgba(212, 165, 116, 0.5);
            font-size: 0.8rem;
            z-index: 10;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <!-- 背景粒子 -->
    <div class="bg-particles" id="particles"></div>

    <!-- 标题 -->
    <h1 class="title">今晚吃什么</h1>
    <p class="subtitle">转动转盘，让命运决定你的晚餐</p>

    <!-- 转盘 -->
    <div class="wheel-container">
        <div class="wheel-outer-ring"></div>
        <div class="wheel-glow" id="wheelGlow"></div>
        <div class="wheel" id="wheel"></div>
        <div class="wheel-center"><span>🍽️</span></div>
        <div class="pointer">
            <svg viewBox="0 0 40 50" fill="none">
                <path d="M20 0L40 40L20 30L0 40L20 0Z" fill="#ff4444" stroke="#fff" stroke-width="2"/>
                <circle cx="20" cy="30" r="5" fill="#ffd700"/>
            </svg>
        </div>
    </div>

    <!-- 按钮 -->
    <div class="controls">
        <button class="spin-btn" id="spinBtn" onclick="toggleSpin()">开始转动</button>
    </div>

    <!-- 结果弹窗 -->
    <div class="result-overlay" id="resultOverlay" onclick="closeResult(event)">
        <div class="result-card" onclick="event.stopPropagation()">
            <p class="result-label">命中注定</p>
            <div class="result-emoji" id="resultEmoji">🍜</div>
            <div class="result-food" id="resultFood">日式拉面</div>
            <p class="result-desc" id="resultDesc">热腾腾的拉面在等你！</p>
            <button class="result-btn" onclick="closeResult()">再来一次</button>
        </div>
    </div>

    <!-- 彩带容器 -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- 底部提示 -->
    <p class="footer-hint">点击按钮开始 / 再次点击停止</p>

    <script>
        // 美食数据
        const foods = [
            { name: '火锅', emoji: '🍲', color: '#e74c3c', desc: '热气腾腾的火锅，涮出人间烟火气！' },
            { name: '烧烤', emoji: '🍖', color: '#d35400', desc: '滋滋作响的烤肉，配啤酒绝了！' },
            { name: '麻辣烫', emoji: '🌶️', color: '#c0392b', desc: '又麻又辣，吃到额头冒汗才过瘾！' },
            { name: '汉堡', emoji: '🍔', color: '#e67e22', desc: '大口吃肉的快乐，经典永不过时！' },
            { name: '寿司', emoji: '🍣', color: '#f39c12', desc: '精致的一口，鲜到眉毛掉下来！' },
            { name: '披萨', emoji: '🍕', color: '#f1c40f', desc: '拉丝芝士的快乐，谁能拒绝？' },
            { name: '拉面', emoji: '🍜', color: '#27ae60', desc: '吸溜吸溜，一碗治愈一切！' },
            { name: '炒饭', emoji: '🍚', color: '#16a085', desc: '粒粒分明的黄金炒饭！' }
        ];

        const sliceCount = foods.length;
        const sliceAngle = 360 / sliceCount;

        // 初始化转盘
        function initWheel() {
            const wheel = document.getElementById('wheel');
            wheel.innerHTML = '';

            foods.forEach((food, index) => {
                const slice = document.createElement('div');
                slice.className = 'slice';
                slice.style.transform = `rotate(${index * sliceAngle}deg)`;
                slice.style.background = food.color;

                const content = document.createElement('div');
                content.className = 'slice-content';
                content.innerHTML = `
                    <span class="slice-emoji">${food.emoji}</span>
                    <span>${food.name}</span>
                `;

                slice.appendChild(content);
                wheel.appendChild(slice);
            });
        }

        // 旋转状态
        let isSpinning = false;
        let currentRotation = 0;
        let spinSpeed = 0;
        let animationId = null;
        let decelerating = false;

        // 开始/停止旋转
        function toggleSpin() {
            const btn = document.getElementById('spinBtn');
            const glow = document.getElementById('wheelGlow');

            if (!isSpinning) {
                // 开始旋转
                isSpinning = true;
                decelerating = false;
                btn.textContent = '停止';
                btn.disabled = false;
                glow.classList.add('active');
                
                // 初始加速
                spinSpeed = 15;
                animateSpin();
            } else if (!decelerating) {
                // 开始减速
                decelerating = true;
                btn.textContent = '减速中...';
                btn.disabled = true;
            }
        }

        // 动画循环
        function animateSpin() {
            const wheel = document.getElementById('wheel');

            if (decelerating) {
                // 减速
                spinSpeed *= 0.985;
                if (spinSpeed < 0.3) {
                    spinSpeed = 0;
                    isSpinning = false;
                    decelerating = false;
                    cancelAnimationFrame(animationId);
                    showResult();
                    return;
                }
            } else {
                // 保持高速
                if (spinSpeed < 25) {
                    spinSpeed += 0.5;
                }
            }

            currentRotation += spinSpeed;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            animationId = requestAnimationFrame(animateSpin);
        }

        // 计算结果
        function getResult() {
            // 指针在顶部（0度），需要计算哪个扇区对准指针
            // 转盘顺时针旋转，所以结果是反的
            const normalizedRotation = (360 - (currentRotation % 360)) % 360;
            const index = Math.floor(normalizedRotation / sliceAngle) % sliceCount;
            return foods[index];
        }

        // 显示结果
        function showResult() {
            const food = getResult();
            const glow = document.getElementById('wheelGlow');
            const btn = document.getElementById('spinBtn');

            glow.classList.remove('active');
            btn.textContent = '开始转动';
            btn.disabled = false;

            // 填充结果
            document.getElementById('resultEmoji').textContent = food.emoji;
            document.getElementById('resultFood').textContent = food.name;
            document.getElementById('resultDesc').textContent = food.desc;

            // 显示弹窗
            setTimeout(() => {
                document.getElementById('resultOverlay').classList.add('active');
                createConfetti();
            }, 300);
        }

        // 关闭结果
        function closeResult(event) {
            if (!event || event.target === event.currentTarget || event.target.classList.contains('result-btn')) {
                document.getElementById('resultOverlay').classList.remove('active');
                document.getElementById('confettiContainer').innerHTML = '';
            }
        }

        // 彩带效果
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#ffd700', '#ff6b35', '#ff8c00', '#e74c3c', '#f39c12', '#27ae60'];

            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = (Math.random() * 10 + 5) + 'px';
                container.appendChild(confetti);
            }
        }

        // 初始化背景粒子
        function initParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 20 + 10) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
                container.appendChild(particle);
            }
        }

        // 启动
        initWheel();
        initParticles();
    </script>
</body>
</html>
