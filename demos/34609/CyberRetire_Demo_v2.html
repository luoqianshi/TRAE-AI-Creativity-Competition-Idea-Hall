<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberRetire · 数码断舍离 - 交互Demo演示</title>
    <style>
        :root {
            --bg: #f5f2eb;
            --panel: #ffffff;
            --text-main: #2d2926;
            --text-sub: #7a726c;
            --accent: #bfa37a;
            --accent-light: #f0e9dd;
            --sage: #7d9786;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Noto Serif SC", Georgia, serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--panel);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(45,41,38,0.06);
            border: 1px solid #e6e0d5;
            min-height: 640px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .screen {
            display: none;
            flex: 1;
            padding: 35px 30px;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* Screen 1: Welcome */
        .title-group {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 50px;
        }

        .title-group h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .title-group p {
            color: var(--text-sub);
            font-size: 0.9rem;
            font-style: italic;
        }

        .type-selector {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        .select-btn {
            background: none;
            border: 1px solid #e6e0d5;
            padding: 18px;
            border-radius: 14px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-main);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .select-btn:hover {
            border-color: var(--accent);
            background-color: var(--accent-light);
        }

        .select-btn span.icon {
            font-size: 1.2rem;
        }

        /* Screen 2: Input Details */
        .back-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 20px;
            width: fit-content;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6e0d5;
            border-radius: 8px;
            background-color: #faf9f6;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        .primary-btn {
            background-color: var(--text-main);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: auto;
            text-align: center;
        }

        .primary-btn:hover {
            background-color: #423d39;
        }

        /* Screen 3: Immersive Ritual */
        .ritual-screen {
            background-color: #1a1716;
            color: #f5f2eb;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .orb-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 40px;
        }

        .glowing-orb {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(240,233,221,1) 0%, rgba(191,163,122,0.4) 60%, rgba(0,0,0,0) 100%);
            border-radius: 50%;
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .ritual-text {
            font-size: 1.05rem;
            letter-spacing: 1px;
            color: #d1c7bd;
            min-height: 60px;
            line-height: 1.8;
        }

        /* Screen 4: Certificate & Green Action */
        .cert-card {
            border: 1px solid var(--accent);
            background-color: #faf8f5;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .cert-card::before {
            content: "✧ ✧";
            color: var(--accent);
            display: block;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .cert-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .cert-body {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .green-badge {
            background-color: var(--accent-light);
            color: var(--accent);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 25px;
            border-left: 4px solid var(--sage);
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Screen 1: Choose Type -->
        <div class="screen active" id="scr-welcome">
            <div class="title-group">
                <h1>数码断舍离</h1>
                <p>CyberRetire · 赋予回忆温柔的终点</p>
            </div>
            <p style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 20px; text-align: center;">请选择您想要进行情感道别与退役的数字资产：</p>
            <div class="type-selector">
                <button class="select-btn" onclick="nextScreen('hardware', '老旧电子硬件 (手机/相机/电脑)')">
                    <span>📱 实体旧数码硬件</span>
                    <span class="icon">➔</span>
                </button>
                <button class="select-btn" onclick="nextScreen('relationship', '一段已逝去关系的数据 (聊天记录/照片)')">
                    <span>💬 情感羁绊数字留存</span>
                    <span class="icon">➔</span>
                </button>
                <button class="select-btn" onclick="nextScreen('passed', '已故亲友/宠物的数字遗物')">
                    <span>🐾 生命痕迹数字档案</span>
                    <span class="icon">➔</span>
                </button>
            </div>
        </div>

        <!-- Screen 2: Fill Details -->
        <div class="screen" id="scr-form">
            <button class="back-btn" onclick="goBack('scr-welcome')">⇠ 返回上级</button>
            <h2 style="margin-bottom: 20px; font-weight: 500;" id="form-title">退役详情记录</h2>
            
            <div class="form-group">
                <label id="label-name">资产具体名称/型号</label>
                <input type="text" id="input-name" placeholder="例如：iPhone 6s 银色 / 2018年相册">
            </div>

            <div class="form-group">
                <label>凝聚在此处的1-2句核心记忆</label>
                <textarea id="input-memory" placeholder="写一句你想对那段时光或这个物品说的话...系统将提取其核心情感波动生成数字星空。"></textarea>
            </div>

            <button class="primary-btn" onclick="startRitual()">启动数据情感解构与退役仪式</button>
        </div>

        <!-- Screen 3: Immersive Ritual Animation -->
        <div class="screen ritual-screen" id="scr-ritual">
            <div class="orb-container">
                <div class="glowing-orb"></div>
            </div>
            <div class="ritual-text" id="ritual-text">
                正在建立安全的情感断舍离场域...
            </div>
        </div>

        <!-- Screen 4: Preservation Certificate & Action -->
        <div class="screen" id="scr-result">
            <h2 style="text-align: center; margin-bottom: 25px; font-weight: 500; color: var(--sage);">✧ 仪式圆满礼成 ✧</h2>
            
            <div class="cert-card">
                <div class="cert-title">电子留存摘要保管证</div>
                <div class="cert-body" id="cert-content">
                    <!-- Dynamic Content -->
                </div>
                <p style="font-size: 0.75rem; color: var(--accent);">记忆已被深空安全归档，物理重担就此放下</p>
            </div>

            <div class="green-badge" id="green-action-box">
                <strong>🌱 绿色循环行动联动：</strong><br>
                由于您选择了物理硬件退役，系统已自动配对国家资质绿色拆解通道。
            </div>

            <button class="primary-btn" style="background-color: var(--sage);" onclick="triggerRecycle()">一键通知绿色邮政上门环保回收</button>
        </div>

    </div>

    <script>
        let currentAssetType = '';
        let currentAssetTypeName = '';

        function nextScreen(type, name) {
            currentAssetType = type;
            currentAssetTypeName = name;
            
            // Customize Form label based on selection
            if (type === 'hardware') {
                document.getElementById('label-name').innerText = "旧硬件设备型号";
                document.getElementById('input-name').placeholder = "如：旧灰色 iPhone 6s";
                document.getElementById('green-action-box').style.display = 'block';
            } else {
                document.getElementById('label-name').innerText = "数字记忆区间名称";
                document.getElementById('input-name').placeholder = "如：2019-2021年微信聊天记录";
                document.getElementById('green-action-box').style.display = 'none'; // No physical recycling for pure digital
            }

            document.getElementById('scr-welcome').classList.remove('active');
            document.getElementById('scr-form').classList.add('active');
        }

        function goBack(targetId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(targetId).classList.add('active');
        }

        function startRitual() {
            const name = document.getElementById('input-name').value.trim();
            const memory = document.getElementById('input-memory').value.trim();

            if(!name || !memory) {
                alert("请完整填写名称与记忆描述，这能让告别充满尊严。");
                return;
            }

            document.getElementById('scr-form').classList.remove('active');
            document.getElementById('scr-ritual').classList.add('active');

            // Simulate ritual progression with narrative text
            const textEl = document.getElementById('ritual-text');
            
            setTimeout(() => {
                textEl.innerText = `正在读取 【${name}】 的数据频率...`;
            }, 1200);

            setTimeout(() => {
                textEl.innerText = `提取核心记忆烙印...“${memory.substring(0, 10)}...” 转化为恒星编码`;
            }, 2600);

            setTimeout(() => {
                textEl.innerText = `数据外壳正在温柔瓦解，核心灵魂已融入数字星空。`;
            }, 4000);

            setTimeout(() => {
                // Populate certificate
                const certContent = document.getElementById('cert-content');
                certContent.innerHTML = `
                    您对 <strong>[ ${name} ]</strong> 进行了体面的告别。<br><br>
                    “${memory}”<br><br>
                    核心记忆粒子已封存于轻量加密HTML星空摘要文件中，物理载体或臃肿存储已被安全解放。
                `;
                
                document.getElementById('scr-ritual').classList.remove('active');
                document.getElementById('scr-result').classList.add('active');
            }, 5500);
        }

        function triggerRecycle() {
            if(currentAssetType === 'hardware') {
                alert("【邮政绿色循环下单成功】\nEMS快递员将在24小时内联系您，免费上门取走您的旧硬件，并运送至环保资质工厂进行重组拆解。感谢您用情感开启了地球的绿色明天！");
            } else {
                alert("【星空文件下载成功】\n纯数字资产不需要物理回收。记忆摘要文件已安全存储，请点击放心删除本地原臃肿文件，拥抱全新生活！");
            }
        }
    </script>
</body>
</html>
