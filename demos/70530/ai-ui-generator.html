<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI UI 生成器 - 需求到页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        accent: '#8b5cf6',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: {
                            100: '#1f2937',
                            200: '#111827',
                            300: '#030712',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'typing': 'typing 0.8s steps(1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        typing: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' },
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .scrollbar-thin::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            .scrollbar-thin::-webkit-scrollbar-track {
                background: #1f2937;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb {
                background: #4b5563;
                border-radius: 3px;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb:hover {
                background: #6b7280;
            }
            .glass-panel {
                background: rgba(31, 41, 55, 0.8);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .message-bubble {
                max-width: 85%;
                word-wrap: break-word;
            }
            .think-badge {
                background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            }
            .reason-badge {
                background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            }
            .act-badge {
                background: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
            }
        }
    </style>
</head>
<body class="bg-dark-300 text-white h-screen overflow-hidden flex flex-col">

    <!-- 顶部导航栏 -->
    <header class="h-14 bg-dark-200 border-b border-gray-800 flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-accent flex items-center justify-center">
                <i class="fa fa-paint-brush text-white"></i>
            </div>
            <span class="font-bold text-lg">AI UI 生成器</span>
            <div class="flex items-center gap-2 ml-4">
                <span class="text-xs text-gray-400">流程：</span>
                <div class="flex items-center gap-2">
                    <span id="step-1" class="px-2 py-1 rounded text-xs bg-primary-600 text-white">需求梳理</span>
                    <i class="fa fa-chevron-right text-gray-500 text-xs"></i>
                    <span id="step-2" class="px-2 py-1 rounded text-xs bg-gray-700 text-gray-400">方向设计</span>
                    <i class="fa fa-chevron-right text-gray-500 text-xs"></i>
                    <span id="step-3" class="px-2 py-1 rounded text-xs bg-gray-700 text-gray-400">最终迭代</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button id="export-btn" class="px-4 py-1.5 rounded-lg bg-primary-600 hover:bg-primary-700 text-sm flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <i class="fa fa-download"></i>
                导出 HTML
            </button>
            <button id="reset-btn" class="px-4 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-sm">
                <i class="fa fa-refresh"></i>
                重置
            </button>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- 左侧：UI预览区域 -->
        <section id="preview-section" class="w-2/3 border-r border-gray-800 flex flex-col">
            <!-- 预览区域头部 -->
            <div class="h-12 bg-dark-200 border-b border-gray-800 flex items-center justify-between px-4 shrink-0">
                <h2 class="font-medium" id="preview-title">UI 预览区域</h2>
                <div id="preview-actions" class="flex items-center gap-2">
                    <span class="text-xs text-gray-400" id="version-count">共 0 个版本</span>
                </div>
            </div>
            
            <!-- 预览内容 -->
            <div id="preview-content" class="flex-1 overflow-auto p-4 scrollbar-thin">
                <!-- 初始状态 -->
                <div id="initial-state" class="h-full flex flex-col items-center justify-center text-gray-500">
                    <div class="w-20 h-20 rounded-full bg-gray-800 flex items-center justify-center mb-4">
                        <i class="fa fa-image text-3xl"></i>
                    </div>
                    <p class="text-lg mb-2">请在右侧输入需求</p>
                    <p class="text-sm">AI 将帮助您从需求生成 UI 设计</p>
                </div>
                
                <!-- 多版本展示区域 -->
                <div id="versions-grid" class="grid grid-cols-2 gap-4 hidden">
                    <!-- 版本卡片将动态生成 -->
                </div>
                
                <!-- 单一最终版本展示 -->
                <div id="final-version" class="hidden">
                    <div class="bg-white rounded-xl shadow-2xl overflow-hidden">
                        <iframe id="final-preview" class="w-full h-[600px] border-none" sandbox="allow-same-origin allow-scripts"></iframe>
                    </div>
                </div>
            </div>
        </section>

        <!-- 右侧：AI助手对话面板 -->
        <section id="chat-section" class="w-1/3 flex flex-col bg-dark-200">
            
            <!-- 角色切换器 -->
            <div class="h-12 border-b border-gray-800 flex items-center gap-2 px-3 shrink-0 overflow-x-auto scrollbar-thin">
                <button class="role-btn active px-3 py-1.5 rounded-lg text-xs font-medium bg-primary-600 text-white whitespace-nowrap" data-role="architect">
                    <i class="fa fa-building-o mr-1"></i>设计系统架构师
                </button>
                <button class="role-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-700 text-gray-300 whitespace-nowrap" data-role="designer">
                    <i class="fa fa-pencil-square-o mr-1"></i>UI设计师
                </button>
                <button class="role-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-700 text-gray-300 whitespace-nowrap" data-role="pm">
                    <i class="fa fa-users mr-1"></i>产品经理
                </button>
            </div>
            
            <!-- 对话历史 -->
            <div id="chat-history" class="flex-1 overflow-auto p-4 space-y-4 scrollbar-thin">
                <!-- 欢迎消息 -->
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary-500 to-accent flex items-center justify-center shrink-0">
                        <i class="fa fa-robot text-white text-sm"></i>
                    </div>
                    <div class="message-bubble bg-dark-100 rounded-2xl rounded-tl-md p-3 text-sm">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs px-2 py-0.5 rounded bg-primary-600 text-white">设计系统架构师</span>
                        </div>
                        <p class="text-gray-300">您好！我是您的设计系统架构师。请描述您的需求，我将帮助您梳理需求并生成UI设计方案。</p>
                        <p class="text-gray-500 text-xs mt-2">例如："我需要一个企业客户管理系统的首页，主要功能包括客户列表、数据统计、快捷操作"</p>
                    </div>
                </div>
            </div>
            
            <!-- 思考过程展示区 -->
            <div id="thinking-panel" class="px-4 pb-2 hidden">
                <div class="glass-panel rounded-lg p-3">
                    <div class="flex items-center gap-2 mb-2">
                        <i class="fa fa-cogs text-accent animate-spin"></i>
                        <span class="text-xs text-gray-400 font-medium">AI 思考中...</span>
                    </div>
                    <div id="thinking-content" class="space-y-2">
                        <!-- 思考步骤动态生成 -->
                    </div>
                </div>
            </div>
            
            <!-- 输入区域 -->
            <div class="p-4 border-t border-gray-800 shrink-0">
                <div class="flex items-end gap-2">
                    <textarea id="user-input" class="flex-1 bg-dark-100 border border-gray-700 rounded-xl px-4 py-3 text-sm resize-none focus:outline-none focus:border-primary-500 transition-colors" rows="3" placeholder="请输入您的需求..."></textarea>
                    <button id="send-btn" class="w-10 h-10 rounded-xl bg-primary-600 hover:bg-primary-700 flex items-center justify-center transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- 版本选择模态框 -->
    <div id="version-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden">
        <div class="bg-dark-200 rounded-2xl p-6 w-[900px] max-h-[80vh] overflow-auto">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold">选择您喜欢的设计方向</h3>
                <button id="close-modal" class="text-gray-400 hover:text-white">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div id="modal-versions" class="grid grid-cols-2 gap-4">
                <!-- 版本卡片 -->
            </div>
        </div>
    </div>

    <script>
        // 状态管理
        const state = {
            currentStep: 1,
            currentRole: 'architect',
            userInput: '',
            requirements: [],
            designDirections: [],
            selectedDirection: null,
            designVersions: [],
            selectedVersion: null,
            finalDesign: null,
            chatHistory: []
        };

        // DOM元素
        const dom = {
            userInput: document.getElementById('user-input'),
            sendBtn: document.getElementById('send-btn'),
            chatHistory: document.getElementById('chat-history'),
            thinkingPanel: document.getElementById('thinking-panel'),
            thinkingContent: document.getElementById('thinking-content'),
            previewTitle: document.getElementById('preview-title'),
            previewContent: document.getElementById('preview-content'),
            initialState: document.getElementById('initial-state'),
            versionsGrid: document.getElementById('versions-grid'),
            finalVersion: document.getElementById('final-version'),
            finalPreview: document.getElementById('final-preview'),
            versionCount: document.getElementById('version-count'),
            roleBtns: document.querySelectorAll('.role-btn'),
            step1: document.getElementById('step-1'),
            step2: document.getElementById('step-2'),
            step3: document.getElementById('step-3'),
            exportBtn: document.getElementById('export-btn'),
            resetBtn: document.getElementById('reset-btn'),
            versionModal: document.getElementById('version-modal'),
            modalVersions: document.getElementById('modal-versions'),
            closeModal: document.getElementById('close-modal')
        };

        // Mock AI响应数据
        const mockData = {
            architect: {
                think: [
                    { type: 'think', content: '分析用户需求：用户需要一个企业客户管理系统首页' },
                    { type: 'reason', content: '需求模糊点：1) 客户列表展示方式？2) 数据统计维度？3) 目标用户角色？' },
                    { type: 'think', content: '考虑不同设计方向：A) 数据驱动型 - 强调可视化报表；B) 操作便捷型 - 强调快捷入口；C) 关系管理型 - 强调客户画像' },
                    { type: 'reason', content: '各方向利弊分析：A适合管理层决策，B适合一线销售，C适合客户成功团队' },
                    { type: 'act', content: '生成3个需求方向供用户选择' }
                ],
                response: `根据您的需求，我梳理出以下3个可能的设计方向：

- 适用：管理层决策、数据分析场景

**方向B - 操作便捷型**
- 核心：以快捷操作为核心
- 特点：突出搜索、筛选、添加客户等操作入口，信息层级简洁明了
- 适用：一线销售人员日常使用

**方向C - 关系管理型**
- 核心：以客户关系管理为核心
- 特点：客户卡片展示更丰富的画像信息，强调客户生命周期管理
- 适用：客户成功团队、客户经理

请选择您倾向的设计方向（A/B/C），或告诉我您的偏好，我会进一步调整。`
            },
            designer: {
                think: [
                    { type: 'think', content: '根据方向A（数据驱动型）设计UI' },
                    { type: 'reason', content: '设计要点：1) 深色主题适合数据展示；2) 卡片式布局展示KPI；3) 图表区域占据主要空间' },

                    { type: 'act', content: '生成3个设计版本供用户选择' }
                ],
                response: `基于您选择的【方向A - 数据驱动型】，我为您设计了3个版本：

**版本1 - 现代简约风格**
- 配色：深蓝+白色为主，简洁干净
- 特点：圆角卡片、柔和阴影、扁平化设计

**版本2 - 科技感风格**
- 配色：深紫+青色渐变，科技感十足
- 特点：玻璃拟态效果、发光边框、深色主题

**版本3 - 商务风格**
- 配色：深灰+金色点缀，专业大气
- 特点：直角卡片、稳重字体、数据突出

请查看左侧预览并选择您喜欢的版本（1/2/3）。`
            },
            collaboration: {
                think1: [
                    { type: 'think', content: '产品经理：确认版本2的功能完整性' },
                    { type: 'reason', content: '需要补充：1) 搜索功能入口；2) 分页导航；3) 客户状态筛选' },
                    { type: 'act', content: '提出功能补充建议' }
                ],
                think2: [
                    { type: 'think', content: 'UI设计师：评估并优化产品经理建议' },
                    { type: 'reason', content: '搜索入口放在顶部右侧更合理，筛选器采用标签式设计' },
                    { type: 'act', content: '调整设计方案' }
                ],
                think3: [
                    { type: 'think', content: '产品经理+UI设计师：最终确认' },
                    { type: 'reason', content: '所有需求点已覆盖，布局合理，视觉效果良好' },
                    { type: 'act', content: '生成最终设计方案' }

                response1: `【产品经理】：版本2的科技感风格很棒！但我建议补充以下功能：

3. 分页导航：处理大量数据

- 客户列表：卡片式展示，支持筛选和分页

设计已确认，可以生成最终HTML代码！`
            }
        };

            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full ${roleColor} flex items-center justify-center shrink-0">

                    ${!isUser && !isThinking ? `<div class="flex items-center gap-2 mb-2"><span class="text-xs px-2 py-0.5 rounded ${getRoleBadgeColor(role)} text-white">${roleName}</span></div>` : ''}
                    <p class="${isUser ? 'text-white' : 'text-gray-300'}">${content.replace(/\n/g, '<br>')}</p>
                </div>
            `;
            
            dom.chatHistory.appendChild(msgDiv);
            dom.chatHistory.scrollTop = dom.chatHistory.scrollHeight;
            
            state.chatHistory.push({ role, content, timestamp: Date.now() });
        }

        function getRoleName(role) {
            const names = {
                architect: '设计系统架构师',
                designer: 'UI设计师',
                pm: '产品经理',
                user: '用户'
            };
            return names[role] || role;
        }

        function getRoleIcon(role) {
            const icons = {
                architect: 'building-o',
                designer: 'pencil-square-o',
                pm: 'users',
                user: 'user'
            };
            return icons[role] || 'user';
        }

        function getRoleColor(role) {
            const colors = {
                architect: 'bg-gradient-to-br from-blue-500 to-indigo-600',
                designer: 'bg-gradient-to-br from-purple-500 to-pink-600',
                pm: 'bg-gradient-to-br from-green-500 to-teal-600',
                user: 'bg-gray-600'
            };
            return colors[role] || 'bg-gray-600';
        }

        function getRoleBadgeColor(role) {
            const colors = {
                architect: 'bg-blue-600',
                designer: 'bg-purple-600',
                pm: 'bg-green-600'
            };
            return colors[role] || 'bg-gray-600';
        }

        function showThinking(thinkSteps) {
            dom.thinkingPanel.classList.remove('hidden');
            dom.thinkingContent.innerHTML = '';
            
            thinkSteps.forEach((step, index) => {
                setTimeout(() => {
                    const stepDiv = document.createElement('div');
                    stepDiv.className = 'flex items-start gap-2 animate-slide-up';
                    
                    let badgeClass = '';
                    let badgeText = '';
                    switch(step.type) {
                        case 'think': badgeClass = 'think-badge'; badgeText = '思考'; break;
                        case 'reason': badgeClass = 'reason-badge'; badgeText = '推理'; break;
                        case 'act': badgeClass = 'act-badge'; badgeText = '行动'; break;
                    }
                    
                    stepDiv.innerHTML = `
                        <span class="${badgeClass} text-[10px] px-1.5 py-0.5 rounded text-white shrink-0">${badgeText}</span>
                        <span class="text-xs text-gray-300">${step.content}</span>
                    `;
                    dom.thinkingContent.appendChild(stepDiv);
                    dom.thinkingPanel.scrollTop = dom.thinkingPanel.scrollHeight;
                }, index * 800);
            });
            
            setTimeout(() => {
                dom.thinkingPanel.classList.add('hidden');
            }, thinkSteps.length * 800 + 500);

        function updateStepIndicator(step) {
            state.currentStep = step;
            
            const steps = [dom.step1, dom.step2, dom.step3];
            steps.forEach((el, idx) => {
                if (idx < step) {
                    el.className = 'px-2 py-1 rounded text-xs bg-success text-white';
