<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>开心一刻 — AI 快乐段子助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #ff6b35;
    --primary-light: #ff8c5a;
    --accent: #ffd166;
    --bg: #fff8f0;
    --card: #ffffff;
    --text: #2d3436;
    --muted: #636e72;
    --border: #ffe8d6;
    --success: #00b894;
    --shadow: 0 8px 32px rgba(255, 107, 53, 0.12);
  }
  body {
    font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #fff8f0 0%, #ffe8d6 50%, #fff5eb 100%);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, #ff9f43 100%);
    color: #fff;
    padding: 28px 20px 24px;
    border-radius: 0 0 28px 28px;
    box-shadow: var(--shadow);
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .logo { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .logo-icon { font-size: 28px; }
  .badge { background: rgba(255,255,255,0.25); padding: 4px 10px; border-radius: 20px; font-size: 11px; }
  .header-slogan { font-size: 14px; opacity: 0.95; margin-bottom: 16px; }
  .daily-card {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .daily-label { font-size: 12px; opacity: 0.9; margin-bottom: 8px; }
  .daily-joke { font-size: 16px; font-weight: 500; line-height: 1.7; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 16px 16px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    background: var(--card);
    border: 1.5px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.25s;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
    border-color: transparent;
    font-weight: 600;
  }

  /* Main content */
  .main { flex: 1; padding: 16px; }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Joke cards */
  .joke-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .joke-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    border: 1.5px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .joke-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .joke-tags { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    background: #fff3e6;
    color: var(--primary);
    font-weight: 500;
  }
  .tag.scene { background: #e8f8f5; color: var(--success); }
  .joke-text { font-size: 15px; color: var(--text); margin-bottom: 12px; line-height: 1.7; }
  .joke-actions { display: flex; justify-content: space-between; align-items: center; }
  .joke-meta { font-size: 12px; color: var(--muted); }
  .action-btns { display: flex; gap: 8px; }
  .action-btn {
    width: 36px; height: 36px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .action-btn:hover { border-color: var(--primary); background: #fff8f0; }
  .action-btn.liked { background: #ffe8e0; border-color: var(--primary); }

  /* AI Generate panel */
  .ai-panel {
    background: var(--card);
    border-radius: 20px;
    padding: 20px;
    border: 1.5px solid var(--border);
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .ai-panel-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
  }
  .ai-avatar {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .ai-title { font-size: 16px; font-weight: 600; }
  .ai-desc { font-size: 12px; color: var(--muted); }
  .scene-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    background: #f8f9fa;
    border: 1.5px solid #eee;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip:hover, .chip.selected {
    background: #fff3e6;
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 500;
  }
  .input-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .keyword-input {
    flex: 1;
    height: 44px;
    padding: 0 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    outline: none;
  }
  .keyword-input:focus { border-color: var(--primary); }
  .btn-generate {
    height: 44px;
    padding: 0 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), #ff9f43);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s;
  }
  .btn-generate:hover { opacity: 0.9; }
  .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; }
  .ai-result {
    background: linear-gradient(135deg, #fff8f0, #fff);
    border: 1.5px dashed var(--primary);
    border-radius: 12px;
    padding: 16px;
    min-height: 80px;
    font-size: 15px;
    line-height: 1.7;
    display: none;
  }
  .ai-result.show { display: block; animation: fadeIn 0.4s ease; }
  .ai-result.loading { color: var(--muted); font-style: italic; display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Stats bar */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-item {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    border: 1.5px solid var(--border);
  }
  .stat-num { font-size: 20px; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Bottom nav */
  .bottom-nav {
    display: flex;
    justify-content: space-around;
    padding: 12px 16px 20px;
    background: var(--card);
    border-top: 1.5px solid var(--border);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11px; color: var(--muted); cursor: pointer;
    padding: 4px 12px; border-radius: 10px;
    transition: all 0.2s;
  }
  .nav-item.active { color: var(--primary); font-weight: 600; }
  .nav-icon { font-size: 22px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(45, 52, 54, 0.9); color: #fff;
    padding: 10px 20px; border-radius: 24px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-top">
      <div class="logo"><span class="logo-icon">😄</span> 开心一刻</div>
      <span class="badge">社会服务 · AI 助手</span>
    </div>
    <p class="header-slogan">每天一分钟，让生活多一点笑声</p>
    <div class="daily-card">
      <div class="daily-label">📅 今日一笑 · 2026年6月16日</div>
      <div class="daily-joke" id="dailyJoke">医生问病人："你哪里不舒服？" 病人说："我看了您的挂号费，心口就开始疼了。"</div>
    </div>
  </header>

  <div class="tabs" id="categoryTabs">
    <div class="tab active" data-cat="all">全部</div>
    <div class="tab" data-cat="daily">日常幽默</div>
    <div class="tab" data-cat="cold">冷笑话</div>
    <div class="tab" data-cat="community">邻里段子</div>
    <div class="tab" data-cat="work">职场轻松</div>
  </div>

  <main class="main">
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-num">12.8万</div><div class="stat-label">今日阅读</div></div>
      <div class="stat-item"><div class="stat-num">3,562</div><div class="stat-label">AI 生成</div></div>
      <div class="stat-item"><div class="stat-num">98%</div><div class="stat-label">好评率</div></div>
    </div>

    <section id="feedSection">
      <div class="section-title">🔥 精选推荐</div>
      <div class="joke-list" id="jokeList"></div>
    </section>

    <section id="aiSection" class="hidden">
      <div class="ai-panel">
        <div class="ai-panel-header">
          <div class="ai-avatar">🤖</div>
          <div>
            <div class="ai-title">AI 造梗工坊</div>
            <div class="ai-desc">输入关键词，生成贴合生活的原创段子</div>
          </div>
        </div>
        <div class="scene-chips" id="sceneChips">
          <span class="chip selected" data-scene="日常">🏠 日常</span>
          <span class="chip" data-scene="社区活动">🎉 社区活动</span>
          <span class="chip" data-scene="加班">💼 加班</span>
          <span class="chip" data-scene="遛娃">👶 遛娃</span>
          <span class="chip" data-scene="广西美食">🍜 广西美食</span>
          <span class="chip" data-scene="节日">🎊 节日</span>
        </div>
        <div class="input-row">
          <input class="keyword-input" id="keywordInput" placeholder="输入关键词，如：螺蛳粉、跳广场舞..." maxlength="20"/>
          <button class="btn-generate" id="btnGenerate">✨ 生成</button>
        </div>
        <div class="ai-result" id="aiResult">点击下方「生成」，AI 将为您创作专属段子</div>
      </div>
    </section>

    <section id="collectSection" class="hidden">
      <div class="section-title">⭐ 我的收藏</div>
      <div class="joke-list" id="collectList">
        <div class="joke-card" style="text-align:center;color:var(--muted);padding:32px;">
          还没有收藏，遇到喜欢的段子点 ❤️ 吧
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <div class="nav-item active" data-page="feed"><span class="nav-icon">🏠</span>首页</div>
    <div class="nav-item" data-page="ai"><span class="nav-icon">✨</span>AI造梗</div>
    <div class="nav-item" data-page="collect"><span class="nav-icon">⭐</span>收藏</div>
    <div class="nav-item" data-page="share"><span class="nav-icon">📤</span>分享</div>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
const jokes = [
  { id: 1, cat: 'daily', tags: ['日常幽默'], text: '老婆问我："你爱我什么？" 我说："爱你善良、温柔、体贴。" 她问："就这些？" 我说："还有，爱你问这种问题的时候，我脑子转得特别快。"', likes: 1284 },
  { id: 2, cat: 'cold', tags: ['冷笑话'], text: '为什么数学书总是很忧郁？因为它有太多的问题，却找不到答案。', likes: 892 },
  { id: 3, cat: 'community', tags: ['邻里段子', '社区活动'], text: '社区组织广场舞比赛，张阿姨说："我跳了二十年，今天终于遇到对手了。" 对手是谁？是她老伴——负责放音乐的那个。', likes: 2156 },
  { id: 4, cat: 'work', tags: ['职场轻松'], text: '同事问我为什么总是最后一个下班。我说："因为老板还没走。" 同事："那老板走了呢？" 我："那我就可以走了啊。"', likes: 1673 },
  { id: 5, cat: 'daily', tags: ['日常幽默', '广西美食'], text: '广西人第一次带外地朋友吃螺蛳粉，朋友问："这味道你受得了？" 我说："受不了的话，我们就不叫广西人了。"', likes: 3421 },
  { id: 6, cat: 'cold', tags: ['冷笑话'], text: '问：什么动物最容易摔倒？答：狐狸，因为它很狡猾（脚滑）。', likes: 756 },
  { id: 7, cat: 'community', tags: ['邻里段子'], text: '邻居王叔在群里发："谁家的猫跑到我家阳台了？" 五分钟后他自己回复："哦，是我家的，它不认门。"', likes: 1890 },
  { id: 8, cat: 'work', tags: ['职场轻松'], text: '老板："这个项目很重要，大家加把劲！" 我："收到！" 内心 OS：收到，但不一定做。', likes: 2341 },
];

const aiTemplates = {
  '日常': [
    '关于「{kw}」的日常段子：今天路过看到{kw}，突然想起——生活就像{kw}，看起来简单，做起来才发现，原来我连第一步都还没迈出去。',
    '「{kw}」这件事告诉我一个道理：你以为你在掌控生活，其实是生活在掌控你的{kw}预算。',
  ],
  '社区活动': [
    '社区{kw}活动暖场段子：各位邻居，今天的{kw}活动只有一个规则——笑出来的不算犯规，笑太大声的需要负责下次带瓜子。',
    '组织{kw}活动最大的感悟：原来邻居们的才艺，比{kw}本身精彩多了。',
  ],
  '加班': [
    '关于{kw}的加班段子：别人加班是为了梦想，我加班是为了——让{kw}不再出现在明天的 to-do 里。',
    '老板说{kw}很重要，我说是的，就像睡眠对我很重要一样——重要，但经常缺席。',
  ],
  '遛娃': [
    '遛娃遇上{kw}：娃问："爸爸，{kw}是什么？" 我："等你长大就知道了。" 娃："那你长大了吗？" 我："……还没。"',
    '带孩子在{kw}附近玩，别的家长问我秘诀，我说：秘诀就是——假装自己也是孩子，虽然腰已经不允许了。',
  ],
  '广西美食': [
    '广西人聊{kw}：外地朋友问辣不辣，我说不辣，他信了。十分钟后，他眼含热泪说："你们广西人对不辣是不是有什么误解？"',
    '关于{kw}的段子：广西人的乡愁，一半是水，一半是{kw}的味道——离开广西后才懂，原来{kw}香是可以被想念的。',
  ],
  '节日': [
    '{kw}祝福段子：祝大家{kw}快乐！温馨提示——节日可以放纵，但体重秤不会放假。',
    '{kw}到了，亲戚问我有没有对象，我说有——对象是{kw}假期，我们相处得很愉快，就是时间太短。',
  ],
};

let currentCat = 'all';
let selectedScene = '日常';
let collected = new Set();

function renderJokes() {
  const list = document.getElementById('jokeList');
  const filtered = currentCat === 'all' ? jokes : jokes.filter(j => j.cat === currentCat);
  list.innerHTML = filtered.map(j => `
    <div class="joke-card" data-id="${j.id}">
      <div class="joke-tags">${j.tags.map(t => `<span class="tag${t.includes('社区') || t.includes('邻里') ? ' scene' : ''}">${t}</span>`).join('')}</div>
      <div class="joke-text">${j.text}</div>
      <div class="joke-actions">
        <span class="joke-meta">👍 ${j.likes.toLocaleString()} 人喜欢</span>
        <div class="action-btns">
          <button class="action-btn like-btn ${collected.has(j.id) ? 'liked' : ''}" data-id="${j.id}" title="收藏">❤️</button>
          <button class="action-btn share-btn" data-text="${encodeURIComponent(j.text)}" title="分享">📤</button>
        </div>
      </div>
    </div>
  `).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('categoryTabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentCat = tab.dataset.cat;
  renderJokes();
});

document.getElementById('jokeList').addEventListener('click', e => {
  const likeBtn = e.target.closest('.like-btn');
  const shareBtn = e.target.closest('.share-btn');
  if (likeBtn) {
    const id = +likeBtn.dataset.id;
    if (collected.has(id)) { collected.delete(id); showToast('已取消收藏'); }
    else { collected.add(id); showToast('已加入收藏 ❤️'); }
    renderJokes();
    renderCollect();
  }
  if (shareBtn) {
    const text = decodeURIComponent(shareBtn.dataset.text);
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text + '\n\n——来自「开心一刻」').then(() => showToast('已复制，快去分享吧 📤'));
    } else {
      showToast('段子已准备好分享！');
    }
  }
});

document.getElementById('sceneChips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  chip.classList.add('selected');
  selectedScene = chip.dataset.scene;
});

document.getElementById('btnGenerate').addEventListener('click', () => {
  const kw = document.getElementById('keywordInput').value.trim() || selectedScene;
  const result = document.getElementById('aiResult');
  const btn = document.getElementById('btnGenerate');
  btn.disabled = true;
  result.className = 'ai-result loading show';
  result.textContent = 'AI 正在创作中，请稍候...';

  setTimeout(() => {
    const templates = aiTemplates[selectedScene] || aiTemplates['日常'];
    const tpl = templates[Math.floor(Math.random() * templates.length)];
    result.className = 'ai-result show';
    result.textContent = tpl.replace(/\{kw\}/g, kw);
    btn.disabled = false;
    showToast('段子生成成功 ✨');
  }, 1200);
});

function renderCollect() {
  const list = document.getElementById('collectList');
  const items = jokes.filter(j => collected.has(j.id));
  if (!items.length) {
    list.innerHTML = '<div class="joke-card" style="text-align:center;color:var(--muted);padding:32px;">还没有收藏，遇到喜欢的段子点 ❤️ 吧</div>';
    return;
  }
  list.innerHTML = items.map(j => `
    <div class="joke-card">
      <div class="joke-tags">${j.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="joke-text">${j.text}</div>
    </div>
  `).join('');
}

document.querySelector('.bottom-nav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  item.classList.add('active');
  const page = item.dataset.page;
  document.getElementById('feedSection').classList.toggle('hidden', page !== 'feed');
  document.getElementById('aiSection').classList.toggle('hidden', page !== 'ai');
  document.getElementById('collectSection').classList.toggle('hidden', page !== 'collect');
  document.getElementById('categoryTabs').style.display = page === 'feed' ? 'flex' : 'none';
  if (page === 'share') {
    showToast('分享功能：可生成海报发到微信群 📱');
    document.querySelector('[data-page="feed"]').classList.add('active');
    item.classList.remove('active');
  }
});

renderJokes();
</script>
</body>
</html>
