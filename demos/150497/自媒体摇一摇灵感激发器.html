<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自媒体主题编辑器 - 原型 Demo</title>
  <style>
    /* ========== 变量 & 重置 ========== */
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface-hover: #22222e;
      --border: #2a2a3a;
      --text: #e8e8f0;
      --text-secondary: #8888a0;
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.3);
      --green: #22c55e;
      --blue: #3b82f6;
      --purple: #a855f7;
      --radius: 12px;
      --radius-lg: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    /* ========== 布局 ========== */
    .app-container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      height: calc(100vh - 48px);
    }

    /* ========== 主区域 ========== */
    .main-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    /* 头部 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .badge {
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    /* ========== 三要素面板 ========== */
    .element-panel {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 28px;
      border: 1px solid var(--border);
    }
    .element-panel h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-secondary);
    }
    .element-row {
      display: grid;
      grid-template-columns: 80px 1fr 44px;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .element-row:last-child { margin-bottom: 0; }
    .element-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    .element-label .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .dot-track { background: var(--accent); }
    .dot-theme { background: var(--blue); }
    .dot-diff { background: var(--purple); }

    .element-select {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%238888a0' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }
    .element-select:focus { border-color: var(--accent); }
    .element-select option { background: var(--surface); color: var(--text); }

    .element-random-btn {
      width: 44px; height: 44px;
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .element-random-btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--accent);
    }
    .element-random-btn.active {
      background: rgba(249, 115, 22, 0.12);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ========== 摇一摇按钮 ========== */
    .shake-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
    }
    .shake-btn {
      width: 140px; height: 140px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent), #fbbf24);
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
      transition: all .3s;
      box-shadow: 0 0 40px var(--accent-glow);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .shake-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 60px var(--accent-glow);
    }
    .shake-btn:active { transform: scale(0.95); }
    .shake-btn .sub { font-size: 12px; font-weight: 400; opacity: 0.8; }
    .shake-btn.shaking {
      animation: shake 0.5s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: rotate(0); }
      10% { transform: rotate(-15deg); }
      20% { transform: rotate(12deg); }
      30% { transform: rotate(-10deg); }
      40% { transform: rotate(8deg); }
      50% { transform: rotate(-6deg); }
      60% { transform: rotate(4deg); }
      70% { transform: rotate(-2deg); }
    }
    .shake-status {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ========== 结果展示区（重设计） ========== */
    .result-area {
      display: none;
      flex-direction: column;
      gap: 20px;
    }
    .result-area.show {
      display: flex;
      animation: fadeUp 0.5s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- 组合摘要条 --- */
    .combo-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }
    .combo-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }
    .combo-tag .tag-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .combo-tag.track { background: rgba(249, 115, 22, 0.12); color: #fb923c; }
    .combo-tag.track .tag-dot { background: #fb923c; }
    .combo-tag.theme { background: rgba(59, 130, 246, 0.12); color: #60a5fa; }
    .combo-tag.theme .tag-dot { background: #60a5fa; }
    .combo-tag.diff  { background: rgba(168, 85, 247, 0.12); color: #c084fc; }
    .combo-tag.diff .tag-dot { background: #c084fc; }
    .combo-bar .divider {
      color: var(--border);
      font-size: 18px;
    }

    /* --- 方案卡片（主题方案） --- */
    .plan-card {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(249, 115, 22, 0.2);
      padding: 32px;
      position: relative;
      overflow: hidden;
    }
    .plan-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .plan-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(249, 115, 22, 0.15);
      color: var(--accent);
      margin-bottom: 16px;
    }
    .plan-title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      background: linear-gradient(135deg, #fff 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .plan-slogan {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      padding-left: 2px;
      border-left: 3px solid var(--accent);
      padding-left: 14px;
    }
    .plan-concept {
      font-size: 14px;
      line-height: 1.7;
      color: #b0b0c0;
      margin-bottom: 20px;
      padding: 16px;
      background: rgba(0,0,0,0.2);
      border-radius: var(--radius);
    }
    .plan-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .plan-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .plan-meta-item .emoji {
      font-size: 14px;
    }
    .plan-meta-item .label {
      color: #666;
    }
    .plan-meta-item .val {
      color: var(--text);
    }

    /* --- 报告卡片（赛道评估报告） --- */
    .report-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 28px;
    }
    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .report-header h3 {
      font-size: 16px;
      font-weight: 600;
    }
    .report-header .rep-badge {
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(59, 130, 246, 0.12);
      color: #60a5fa;
    }

    /* 报告网格 */
    .report-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .report-metric {
      background: rgba(0,0,0,0.15);
      border-radius: var(--radius);
      padding: 18px;
    }
    .report-metric .metric-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    /* 变现能力 - 进度条 */
    .profit-bar-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .profit-bar {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      overflow: hidden;
    }
    .profit-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s ease;
    }
    .profit-bar-fill.high { width: 90%; background: linear-gradient(90deg, #22c55e, #4ade80); }
    .profit-bar-fill.mid  { width: 55%; background: linear-gradient(90deg, #f97316, #fb923c); }
    .profit-bar-fill.low  { width: 25%; background: linear-gradient(90deg, #ef4444, #f87171); }
    .profit-level-text {
      font-size: 14px;
      font-weight: 600;
      min-width: 24px;
    }
    .profit-level-text.high { color: #22c55e; }
    .profit-level-text.mid  { color: #f97316; }
    .profit-level-text.low  { color: #ef4444; }
    .metric-reason {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* 爆款概率 - 环形图 */
    .gauge-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .gauge-ring {
      width: 56px;
      height: 56px;
      position: relative;
      flex-shrink: 0;
    }
    .gauge-ring svg {
      transform: rotate(-90deg);
    }
    .gauge-ring .bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 4; }
    .gauge-ring .fill {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s ease;
    }
    .gauge-ring .center-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .gauge-info {
      flex: 1;
    }
    .gauge-info .pct-label {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .gauge-info .pct-reason {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
      line-height: 1.5;
    }

    /* 竞争热度 - 标签组 */
    .competition-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .comp-chip {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .comp-chip.red   { background: rgba(239, 68, 68, 0.12); color: #f87171; }
    .comp-chip.blue  { background: rgba(59, 130, 246, 0.12); color: #60a5fa; }
    .comp-chip.green { background: rgba(34, 197, 94, 0.12); color: #4ade80; }
    .comp-chip.yellow { background: rgba(250, 204, 21, 0.12); color: #facc15; }
    .comp-reason {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* 建议 */
    .report-suggestion {
      padding: 16px 20px;
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.08) 0%, rgba(251, 191, 36, 0.04) 100%);
      border-radius: var(--radius);
      border: 1px solid rgba(249, 115, 22, 0.12);
    }
    .report-suggestion .sug-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .report-suggestion .sug-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    /* ========== 侧边栏 ========== */
    .sidebar {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .sidebar-header h3 {
      font-size: 14px;
      font-weight: 600;
    }
    .sidebar-header .count {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg);
      padding: 2px 10px;
      border-radius: 12px;
    }
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      padding: 10px 12px;
      border-radius: var(--radius);
      background: var(--bg);
      cursor: pointer;
      transition: background .2s;
    }
    .history-item:hover { background: var(--surface-hover); }
    .history-item .hi-title {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .history-item .hi-meta {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .sidebar-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 13px;
      gap: 8px;
    }
    .sidebar-empty .icon { font-size: 32px; opacity: 0.3; }

    .clear-btn {
      padding: 6px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: all .2s;
    }
    .clear-btn:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    /* ========== 滚动条 ========== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ========== 响应式 ========== */
    @media (max-width: 900px) {
      .app-container {
        grid-template-columns: 1fr;
        height: auto;
      }
      .result-area { grid-template-columns: 1fr; }
      .sidebar { height: 300px; }
    }
  </style>
</head>
<body>
<div class="app-container">

  <!-- ==================== 主区域 ==================== -->
  <div class="main-area">
    <!-- 头部 -->
    <div class="header">
      <h1>✦ 自媒体主题编辑器</h1>
      <span class="badge">原型 v0.1</span>
    </div>

    <!-- 三要素面板 -->
    <div class="element-panel">
      <h2>三要素输入</h2>

      <!-- 赛道 -->
      <div class="element-row">
        <span class="element-label"><span class="dot dot-track"></span>赛道</span>
        <select class="element-select" id="trackSelect">
          <option value="">— 随机抽取 —</option>
          <option>知识博主</option>
          <option>美妆博主</option>
          <option>穿搭博主</option>
          <option>美食博主</option>
          <option>旅行博主</option>
          <option>健身博主</option>
          <option>读书博主</option>
          <option>情感博主</option>
          <option>宠物博主</option>
          <option>科技博主</option>
          <option>育儿博主</option>
          <option>家居博主</option>
          <option>职场博主</option>
          <option>理财博主</option>
          <option>好物分享博主</option>
        </select>
        <button class="element-random-btn" data-target="track" title="随机填充">🎲</button>
      </div>

      <!-- 主题 -->
      <div class="element-row">
        <span class="element-label"><span class="dot dot-theme"></span>主题</span>
        <select class="element-select" id="themeSelect">
          <option value="">— 随机抽取 —</option>
          <option>时间管理</option>
          <option>学习方法</option>
          <option>两性关系</option>
          <option>亲子教育</option>
          <option>护肤步骤</option>
          <option>穿搭技巧</option>
          <option>菜谱教程</option>
          <option>旅行攻略</option>
          <option>书单推荐</option>
          <option>健身计划</option>
          <option>影视解说</option>
          <option>行业分析</option>
          <option>效率工具</option>
          <option>副业赚钱</option>
          <option>面试技巧</option>
          <option>职场沟通</option>
          <option>情绪管理</option>
          <option>理财规划</option>
        </select>
        <button class="element-random-btn" data-target="theme" title="随机填充">🎲</button>
      </div>

      <!-- 差异点 -->
      <div class="element-row">
        <span class="element-label"><span class="dot dot-diff"></span>差异点</span>
        <select class="element-select" id="diffSelect">
          <option value="">— 随机抽取 —</option>
          <option>穿婴儿服讲解</option>
          <option>用 Rap 播报</option>
          <option>倒立出镜</option>
          <option>每天换一个城市打卡</option>
          <option>用 Excel 画画</option>
          <option>边做饭边读书</option>
          <option>一人分饰多角</option>
          <option>全程无台词</option>
          <option>只拍阴影不拍脸</option>
          <option>AI 生成虚拟形象出镜</option>
        </select>
        <button class="element-random-btn" data-target="diff" title="随机填充">🎲</button>
      </div>
    </div>

    <!-- 摇一摇 -->
    <div class="shake-section">
      <button class="shake-btn" id="shakeBtn">
        <span>摇一摇</span>
        <span class="sub">生成主题方案</span>
      </button>
      <span class="shake-status" id="shakeStatus">点击按钮，开始创意探索</span>
    </div>

    <!-- 结果展示 -->
    <div class="result-area" id="resultArea">
      <!-- 组合摘要条 -->
      <div class="combo-bar" id="comboBar">
        <span class="combo-tag track" id="comboTrack"><span class="tag-dot"></span>赛道</span>
        <span class="divider">✕</span>
        <span class="combo-tag theme" id="comboTheme"><span class="tag-dot"></span>主题</span>
        <span class="divider">✕</span>
        <span class="combo-tag diff" id="comboDiff"><span class="tag-dot"></span>差异点</span>
      </div>

      <!-- 方案卡片 -->
      <div class="plan-card">
        <div class="plan-badge">✦ AI 生成的主题方案</div>
        <div class="plan-title" id="planTitle">方案标题</div>
        <div class="plan-slogan" id="planSlogan">slogan</div>
        <div class="plan-concept" id="planConcept">核心卖点描述</div>
        <div class="plan-meta" id="planMeta">
          <div class="plan-meta-item"><span class="emoji">👤</span><span class="label">人设</span><span class="val" id="metaPersona">—</span></div>
          <div class="plan-meta-item"><span class="emoji">📌</span><span class="label">方向</span><span class="val" id="metaDirection">—</span></div>
          <div class="plan-meta-item"><span class="emoji">🎯</span><span class="label">受众</span><span class="val" id="metaAudience">—</span></div>
        </div>
      </div>

      <!-- 评估报告卡片 -->
      <div class="report-card">
        <div class="report-header">
          <h3>📊 赛道评估报告</h3>
          <span class="rep-badge">AI 分析</span>
        </div>
        <div class="report-grid" id="reportGrid">
          <!-- 通过 JS 渲染 -->
        </div>
        <div class="report-suggestion" id="reportSuggestion">
          <div class="sug-label">💡 建议</div>
          <div class="sug-text" id="sugText">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 侧边栏 ==================== -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h3>📜 历史记录</h3>
      <span class="count" id="historyCount">0 条</span>
    </div>
    <div class="sidebar-list" id="historyList">
      <div class="sidebar-empty">
        <div class="icon">📭</div>
        <span>还没有摇一摇记录</span>
        <span style="font-size:11px;">快去试试吧！</span>
      </div>
    </div>
    <button class="clear-btn" id="clearBtn" style="margin-top:12px;">清空历史</button>
  </div>
</div>

<script>
  // ========== 动态生成方案（基于实际选中的赛道/主题/差异点） ==========

  // 赛道 → 标题后缀/人设模板
  const TRACK_PROFILES = {
    '知识博主':  { suffix: '知识局', persona: '知识型博主', profit: '高', profitReason: '知识付费+商单广告，变现路径清晰', audience: '20-35岁求知人群' },
    '美妆博主':  { suffix: '变美日记', persona: '美妆达人', profit: '高', profitReason: '带货+品牌合作，化妆品客单价高', audience: '18-30岁女性群体' },
    '穿搭博主':  { suffix: '穿搭公式', persona: '潮流穿搭师', profit: '高', profitReason: '品牌合作+带货，穿搭类变现稳定', audience: '20-35岁时尚人群' },
    '美食博主':  { suffix: '食验室', persona: '美食探索家', profit: '中', profitReason: '广告+带货，但同类竞争激烈', audience: '25-40岁美食爱好者' },
    '旅行博主':  { suffix: '漫游记', persona: '旅行体验官', profit: '中', profitReason: '住宿合作+广告，季节性较强', audience: '22-35岁旅行爱好者' },
    '健身博主':  { suffix: '改造计划', persona: '健身教练型博主', profit: '中', profitReason: '知识付费+品牌合作，受众粘性高', audience: '20-35岁健身人群' },
    '读书博主':  { suffix: '书单', persona: '阅读推广人', profit: '低', profitReason: '书单带货+品牌合作，变现天花板较低', audience: '25-40岁阅读爱好者' },
    '情感博主':  { suffix: '情感说', persona: '情感导师', profit: '中', profitReason: '知识付费+咨询，但合规风险较高', audience: '20-40岁情感困惑人群' },
    '宠物博主':  { suffix: '萌宠日记', persona: '宠物达人', profit: '高', profitReason: '宠物品牌合作，赛道增长快', audience: '18-35岁宠物爱好者' },
    '科技博主':  { suffix: '科技前沿', persona: '科技评测员', profit: '高', profitReason: '数码品牌合作，客单价高', audience: '20-35岁科技爱好者' },
    '育儿博主':  { suffix: '育儿经', persona: '育儿专家', profit: '高', profitReason: '母婴品牌合作+知识付费，受众精准', audience: '25-40岁宝妈群体' },
    '家居博主':  { suffix: '家居美学', persona: '家居设计师', profit: '中', profitReason: '家居品牌合作，但决策周期长', audience: '25-40岁家居爱好者' },
    '职场博主':  { suffix: '职场进化论', persona: '职场导师', profit: '中', profitReason: '知识付费+课程，稳定但增长慢', audience: '22-35岁职场人群' },
    '理财博主':  { suffix: '理财课堂', persona: '理财规划师', profit: '高', profitReason: '知识付费+课程，高客单价', audience: '25-45岁理财人群' },
    '好物分享博主': { suffix: '好物清单', persona: '好物推荐官', profit: '中', profitReason: '带货佣金，依赖选品能力', audience: '20-35岁消费人群' }
  };

  // 主题 → 内容方向描述
  const THEME_DIRECTIONS = {
    '时间管理':   { direction: '时间管理技巧', emoji: '⏰' },
    '学习方法':   { direction: '高效学习方法', emoji: '📚' },
    '两性关系':   { direction: '两性情感话题', emoji: '💑' },
    '亲子教育':   { direction: '亲子教育理念', emoji: '👨‍👩‍👧' },
    '护肤步骤':   { direction: '护肤美妆教程', emoji: '🧴' },
    '穿搭技巧':   { direction: '穿搭造型指南', emoji: '👗' },
    '菜谱教程':   { direction: '美食菜谱分享', emoji: '🍳' },
    '旅行攻略':   { direction: '旅行攻略推荐', emoji: '✈️' },
    '书单推荐':   { direction: '书单推荐分享', emoji: '📖' },
    '健身计划':   { direction: '健身训练计划', emoji: '💪' },
    '影视解说':   { direction: '影视深度解说', emoji: '🎬' },
    '行业分析':   { direction: '行业深度分析', emoji: '📊' },
    '效率工具':   { direction: '效率工具推荐', emoji: '⚡' },
    '副业赚钱':   { direction: '副业赚钱方法', emoji: '💰' },
    '面试技巧':   { direction: '面试求职技巧', emoji: '🎯' },
    '职场沟通':   { direction: '职场沟通技巧', emoji: '💬' },
    '情绪管理':   { direction: '情绪管理方法', emoji: '🧘' },
    '理财规划':   { direction: '理财规划指南', emoji: '📈' }
  };

  // 差异点 → 创意角度/标题前缀
  const DIFF_ANGLES = {
    '穿婴儿服讲解':   { prefix: '婴儿服', angle: '穿婴儿服制造强烈反差，用最幼稚的造型讲最硬核的内容', slogan: '穿最幼稚的衣服，讲最认真的内容' },
    '用 Rap 播报':    { prefix: 'Rap', angle: '用Rap节奏说内容，节奏感强、记忆点高、适合碎片化传播', slogan: '跟着节奏涨知识，每天3分钟' },
    '倒立出镜':       { prefix: '倒立', angle: '以倒立作为固定开场/结尾，独特的视觉符号增加账号识别度', slogan: '换个角度看世界，倒立也是生活态度' },
    '每天换一个城市打卡': { prefix: '城市打卡', angle: '每日打卡不同城市，记录当地特色，形成系列化内容IP', slogan: '每天换个城市，换个心情' },
    '用 Excel 画画':  { prefix: 'Excel', angle: '用Excel作画，将工具的功能性发挥到极致，视觉冲击力强', slogan: '用最枯燥的工具，画最惊艳的作品' },
    '边做饭边读书':   { prefix: '食书', angle: '将烹饪与阅读结合，每期做一道菜分享一本书，有温度的知识内容', slogan: '一边做饭，一边读书，人间烟火最治愈' },
    '一人分饰多角':   { prefix: '一人剧团', angle: '一人分饰多角演绎短剧，低成本高创意，内容形式新颖', slogan: '一个人撑起一部剧' },
    '全程无台词':     { prefix: '无声', angle: '全程无台词，依靠画面/字幕/音效传递信息，突破语言限制', slogan: '不说话，但每一帧都是故事' },
    '只拍阴影不拍脸': { prefix: '影子', angle: '只拍阴影/局部出镜，保持神秘感，内容聚焦于作品本身', slogan: '不露脸，但全世界都记得我' },
    'AI 生成虚拟形象出镜': { prefix: 'AI分身', angle: '使用AI生成的虚拟形象出镜，新颖且降低出镜门槛', slogan: '我的AI分身，替我出镜营业' }
  };

  // 差异点 → 竞争热度映射
  const DIFF_COMPETITION = {
    '穿婴儿服讲解':   { level: '红海赛道中的蓝海切角', reason: '该赛道竞争激烈，但此差异化打法目前市场空白' },
    '用 Rap 播报':    { level: '新兴', reason: 'Rap+内容赛道目前创作者极少，有先发优势' },
    '倒立出镜':       { level: '蓝海', reason: '倒立标签的博主极少，视觉符号独特' },
    '每天换一个城市打卡': { level: '红海', reason: '旅行博主多，但日更城市打卡的模式少' },
    '用 Excel 画画':  { level: '蓝海', reason: '该赛道创作者极少，内容稀缺性强' },
    '边做饭边读书':   { level: '蓝海', reason: '美食+读书融合赛道较少，差异化明显' },
    '一人分饰多角':   { level: '新兴', reason: '单人短剧赛道在增长但仍有空间' },
    '全程无台词':     { level: '蓝海', reason: '无台词赛道玩家较少，蓝海市场' },
    '只拍阴影不拍脸': { level: '蓝海', reason: '不露脸赛道有独特定位，竞争少' },
    'AI 生成虚拟形象出镜': { level: '新兴', reason: 'AI虚拟博主快速增长中，但尚未饱和' }
  };

  // ========== 动态生成方案 ==========
  function generatePlan(track, theme, diff) {
    const tp = TRACK_PROFILES[track] || { suffix: '频道', persona: '自媒体博主', profit: '中', profitReason: '常规变现路径', audience: '20-35岁人群' };
    const td = THEME_DIRECTIONS[theme] || { direction: theme, emoji: '📌' };
    const da = DIFF_ANGLES[diff] || { prefix: '', angle: '独特的表现手法', slogan: '不一样的内容视角' };
    const dc = DIFF_COMPETITION[diff] || { level: '蓝海', reason: '该差异化打法有独特优势' };

    // 生成标题
    const title = `${da.prefix}${tp.suffix}`;

    // 生成核心卖点
    const coreConcept = `一位${track}，${da.angle}。每期围绕「${theme}」展开，${td.direction}与${da.prefix}形式深度融合，${tp.persona}的人设定位让内容既有专业度又有记忆点。`;

    // 生成内容方向
    const contentDirection = `${td.direction} + ${da.prefix}形式融合`;

    // 生成爆款概率
    const baseProb = 45 + Math.floor(Math.random() * 35);
    const explosiveProbability = {
      percentage: Math.min(baseProb, 92),
      reason: da.prefix ? `${da.prefix}形式新颖，${track}赛道有基础受众` : `形式与内容契合度高，有传播潜力`
    };

    // 生成建议
    const suggestion = `初期以「${da.prefix}」为流量钩子吸引关注，中后期逐步沉淀「${theme}」的内容价值，建立「${tp.persona}」的品牌认知，完成从流量到人设的升级。建议每周更新3-4期，固定栏目感可提升粉丝粘性。`;

    return {
      title,
      slogan: da.slogan,
      core_concept: coreConcept,
      persona: tp.persona,
      content_direction: contentDirection,
      target_audience: tp.audience,
      profitability: {
        level: tp.profit,
        reason: tp.profitReason
      },
      explosive_probability: explosiveProbability,
      competition: dc,
      suggestion
    };
  }

  // ========== 状态 ==========
  let history = [];
  let usedCombinations = new Set();
  const MAX_COMBOS = 20;

  // ========== DOM 引用 ==========
  const trackSel = document.getElementById('trackSelect');
  const themeSel = document.getElementById('themeSelect');
  const diffSel  = document.getElementById('diffSelect');
  const shakeBtn = document.getElementById('shakeBtn');
  const shakeStatus = document.getElementById('shakeStatus');
  const resultArea = document.getElementById('resultArea');

  // 方案卡片元素
  const comboTrack = document.getElementById('comboTrack');
  const comboTheme = document.getElementById('comboTheme');
  const comboDiff  = document.getElementById('comboDiff');
  const planTitle  = document.getElementById('planTitle');
  const planSlogan = document.getElementById('planSlogan');
  const planConcept = document.getElementById('planConcept');
  const metaPersona = document.getElementById('metaPersona');
  const metaDirection = document.getElementById('metaDirection');
  const metaAudience = document.getElementById('metaAudience');

  // 报告卡片元素
  const reportGrid = document.getElementById('reportGrid');
  const sugText    = document.getElementById('sugText');

  const historyList = document.getElementById('historyList');
  const historyCount = document.getElementById('historyCount');
  const clearBtn = document.getElementById('clearBtn');

  // ========== 随机按钮 ==========
  document.querySelectorAll('.element-random-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.target;
      let sel, arr;
      if (target === 'track') { sel = trackSel; arr = TRACKS; }
      else if (target === 'theme') { sel = themeSel; arr = THEMES; }
      else { sel = diffSel; arr = DIFFS; }

      // 从剩余可用组合中随机（Demo 简化：直接随机）
      const pick = arr[Math.floor(Math.random() * arr.length)];
      sel.value = pick;
      btn.classList.add('active');
      setTimeout(() => btn.classList.remove('active'), 500);
    });
  });

  // ========== 摇一摇 ==========
  shakeBtn.addEventListener('click', () => {
    // 摇动动画
    shakeBtn.classList.add('shaking');
    shakeStatus.textContent = '🤖 AI 正在思考中...';
    setTimeout(() => shakeBtn.classList.remove('shaking'), 500);

    // 模拟 AI 延迟
    const delay = 800 + Math.random() * 600;
    setTimeout(() => {
      // 获取当前选择（模拟随机填充空缺）
      let track = trackSel.value || TRACKS[Math.floor(Math.random() * TRACKS.length)];
      let theme = themeSel.value || THEMES[Math.floor(Math.random() * THEMES.length)];
      let diff  = diffSel.value  || DIFFS[Math.floor(Math.random() * DIFFS.length)];

      // 计算 hash 去重
      const hash = `${track}|${theme}|${diff}`;
      if (usedCombinations.has(hash)) {
        shakeStatus.textContent = '⚠️ 该组合已摇过，为你重新匹配...';
        // 重新随机
        track = TRACKS[Math.floor(Math.random() * TRACKS.length)];
        theme = THEMES[Math.floor(Math.random() * THEMES.length)];
        diff  = DIFFS[Math.floor(Math.random() * DIFFS.length)];
        const newHash = `${track}|${theme}|${diff}`;
        if (usedCombinations.has(newHash)) {
          // 模拟重置
          usedCombinations.clear();
          history = [];
          shakeStatus.textContent = '🔄 所有组合已用完，已自动重置！';
        }
      }

      const finalHash = `${track}|${theme}|${diff}`;
      usedCombinations.add(finalHash);

      // 动态生成方案（基于实际选中的赛道/主题/差异点）
      const plan = generatePlan(track, theme, diff);

      // 渲染组合摘要
      comboTrack.innerHTML = `<span class="tag-dot"></span>${track}`;
      comboTheme.innerHTML = `<span class="tag-dot"></span>${theme}`;
      comboDiff.innerHTML  = `<span class="tag-dot"></span>${diff}`;

      // 渲染方案卡片
      planTitle.textContent = plan.title;
      planSlogan.textContent = plan.slogan;
      planConcept.textContent = plan.core_concept;
      metaPersona.textContent = plan.persona;
      metaDirection.textContent = plan.content_direction;
      metaAudience.textContent = plan.target_audience;

      // 渲染评估报告（从 plan 中取报告数据）
      renderReport({
        profitability: plan.profitability,
        explosive_probability: plan.explosive_probability,
        competition: plan.competition,
        suggestion: plan.suggestion
      });

      // 显示结果
      resultArea.classList.add('show');

      // 更新历史
      const entry = { track, theme, diff, plan, time: new Date().toLocaleString() };
      history.unshift(entry);
      renderHistory();

      shakeStatus.textContent = `✅ 已生成：${track} × ${theme} × ${diff}`;
      shakeBtn.classList.remove('shaking');
    }, delay);
  });

  // ========== 渲染评估报告（环形图 + 进度条 + 竞争标签） ==========
  function renderReport(report) {
    const p = report.profitability;
    const e = report.explosive_probability;
    const c = report.competition;

    // 变现能力等级映射
    const levelMap = { '高': 'high', '中': 'mid', '低': 'low' };
    const levelKey = levelMap[p.level] || 'mid';

    // 爆款概率环形图 SVG
    const circumference = 2 * Math.PI * 22; // r=22
    const offset = circumference - (e.percentage / 100) * circumference;

    // 竞争热度颜色
    let compColor = 'blue';
    if (c.level.includes('红海')) compColor = 'red';
    else if (c.level.includes('蓝海')) compColor = 'green';
    else if (c.level.includes('新兴')) compColor = 'yellow';

    reportGrid.innerHTML = `
      <div class="report-metric">
        <div class="metric-label">💰 变现能力</div>
        <div class="profit-bar-wrap">
          <div class="profit-bar">
            <div class="profit-bar-fill ${levelKey}"></div>
          </div>
          <span class="profit-level-text ${levelKey}">${p.level}</span>
        </div>
        <div class="metric-reason">${p.reason}</div>
      </div>
      <div class="report-metric">
        <div class="metric-label">🔥 爆款概率</div>
        <div class="gauge-wrap">
          <div class="gauge-ring">
            <svg width="56" height="56" viewBox="0 0 56 56">
              <circle class="bg" cx="28" cy="28" r="22"/>
              <circle class="fill" cx="28" cy="28" r="22"
                stroke="${e.percentage >= 70 ? '#22c55e' : e.percentage >= 50 ? '#f97316' : '#ef4444'}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${offset}"/>
            </svg>
            <div class="center-text">${e.percentage}%</div>
          </div>
          <div class="gauge-info">
            <div class="pct-label">爆款潜力</div>
            <div class="pct-reason">${e.reason}</div>
          </div>
        </div>
      </div>
      <div class="report-metric" style="grid-column:1/3">
        <div class="metric-label">🏆 竞争热度</div>
        <div class="competition-chips">
          <span class="comp-chip ${compColor}">${c.level}</span>
        </div>
        <div class="comp-reason">${c.reason}</div>
      </div>
    `;

    sugText.textContent = report.suggestion;
  }

  // ========== 渲染历史 ==========
  function renderHistory() {
    historyCount.textContent = `${history.length} 条`;
    if (history.length === 0) {
      historyList.innerHTML = `
        <div class="sidebar-empty">
          <div class="icon">📭</div>
          <span>还没有摇一摇记录</span>
          <span style="font-size:11px;">快去试试吧！</span>
        </div>
      `;
      return;
    }
    historyList.innerHTML = history.map((h, i) => `
      <div class="history-item" onclick="restoreHistory(${i})">
        <div class="hi-title">${h.plan.title}</div>
        <div class="hi-meta">${h.track} · ${h.theme} · ${h.time}</div>
      </div>
    `).join('');
  }

  // ========== 恢复历史记录 ==========
  window.restoreHistory = function(idx) {
    const h = history[idx];
    if (!h) return;
    trackSel.value = h.track;
    themeSel.value = h.theme;
    diffSel.value = h.diff;
    comboTrack.innerHTML = `<span class="tag-dot"></span>${h.track}`;
    comboTheme.innerHTML = `<span class="tag-dot"></span>${h.theme}`;
    comboDiff.innerHTML  = `<span class="tag-dot"></span>${h.diff}`;
    planTitle.textContent = h.plan.title;
    planSlogan.textContent = h.plan.slogan;
    planConcept.textContent = h.plan.core_concept;
    metaPersona.textContent = h.plan.persona;
    metaDirection.textContent = h.plan.content_direction;
    metaAudience.textContent = h.plan.target_audience;
    renderReport({
      profitability: h.plan.profitability,
      explosive_probability: h.plan.explosive_probability,
      competition: h.plan.competition,
      suggestion: h.plan.suggestion
    });
    resultArea.classList.add('show');
    shakeStatus.textContent = `📂 已恢复：${h.track} × ${h.theme} × ${h.diff}`;
  };

  // ========== 清空历史 ==========
  clearBtn.addEventListener('click', () => {
    history = [];
    usedCombinations.clear();
    renderHistory();
    resultArea.classList.remove('show');
    shakeStatus.textContent = '🔄 历史已清空，重新开始探索';
  });
</script>
</body>
</html>
