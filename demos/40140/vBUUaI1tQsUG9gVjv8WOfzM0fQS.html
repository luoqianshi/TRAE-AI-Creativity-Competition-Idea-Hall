                    desc: '拥有电子装甲系统，可以装备虚拟怪兽装甲来增强战斗力，科技感十足。',
                    skills: ['扎纳帝姆光线', '贝塔火花']
                }
            },
            // 22: 欧布
            {
                left: { type: 'hero', img: 'assets/orb.jpg' },
                right: {
                    type: 'info',
                    name: '欧布奥特曼',
                    nameEn: 'ULTRAMAN ORB',
                    badge: '借力变身',
                    desc: '可以通过欧布圆环融合前辈奥特曼的力量变身为不同形态，在地球流浪了数千年。',
                    skills: ['欧布至高圣剑', '重光形态']
                }
            },
            // 23: 捷德
            {
                left: { type: 'hero', img: 'assets/ged.jpg' },
                right: {
                    type: 'info',
                    name: '捷德奥特曼',
                    nameEn: 'ULTRAMAN GEED',
                    badge: '超越命运',
                    desc: '贝利亚奥特曼的儿子，但选择了正义之路，最终击败父亲证明了自己的正义之心。',
                    skills: ['毁灭爆裂', '皇家终结']
                }
            },
            // 24: 泽塔
            {
                left: { type: 'hero', img: 'assets/z.jpg' },
                right: {
                    type: 'info',
                    name: '泽塔奥特曼',
                    nameEn: 'ULTRAMAN Z',
                    badge: '赛罗的徒弟',
                    desc: '赛罗的徒弟，性格热血但有些冒失，凭借出色的剧情获得了日本星云赏。',
                    skills: ['泽斯帝姆光线', '德尔塔天爪']
                }
            },
            // 25: 特利迦
            {
                left: { type: 'hero', img: 'assets/trigger.jpg' },
                right: {
                    type: 'info',
                    name: '特利迦奥特曼',
                    nameEn: 'ULTRAMAN TRIGGER',
                    badge: '新生代迪迦',
                    desc: '继承迪迦世界观的令和奥特曼，拥有复合型、强力型、空中型及永恒闪耀形态。',
                    skills: ['哉佩利敖光线', '闪耀形态']
                }
            },
            // 26: 布莱泽
            {
                left: { type: 'hero', img: 'assets/blazar.jpg' },
                right: {
                    type: 'info',
                    name: '布莱泽奥特曼',
                    nameEn: 'ULTRAMAN BLAZAR',
                    badge: '野生战士',
                    desc: '来自M421星云的野生奥特曼，拥有原始野性的战斗风格，回归怪兽特摄原点。',
                    skills: ['螺旋光矛', '布莱泽光线']
                }
            },
            // 27: 结束页
            {
                left: {
                    type: 'end',
                    html: `
                        <div class="end-title">THE END</div>
                        <div class="end-sub">光之巨人<br>守护宇宙和平的英雄们</div>
                    `
                },
                right: {
                    type: 'end',
                    html: `
                        <div style="font-size:clamp(20px,3vw,32px);color:#d4af37;font-weight:700;text-align:center;line-height:2;">
                            从昭和到令和<br>
                            跨越半个多世纪的传奇<br><br>
                            <span style="font-size:16px;color:rgba(255,255,255,0.4);">所有角色版权归圆谷制作株式会社所有</span>
                        </div>
                    `
                }
            }
        ];

        let current = 0;
        const total = spreads.length;
        const contentLeft = document.getElementById('contentLeft');
        const contentRight = document.getElementById('contentRight');
        const pageLeft = document.getElementById('pageLeft');
        const pageRight = document.getElementById('pageRight');

        function renderSpread(index) {
            const spread = spreads[index];
            
            // 渲染左页
            const leftData = spread.left;
            if (leftData.type === 'hero') {
                pageLeft.className = 'page-left';
                contentLeft.innerHTML = `<img src="${leftData.img}" class="hero-img" alt="">`;
            } else if (leftData.type === 'chapter' || leftData.type === 'cover' || leftData.type === 'end') {
                pageLeft.className = 'page-left chapter-page';
                contentLeft.innerHTML = leftData.html;
            }
            
            // 渲染右页
            const rightData = spread.right;
            if (rightData.type === 'info') {
                pageRight.className = 'page-right';
                contentRight.innerHTML = `
                    <div class="hero-name">${rightData.name}</div>
                    <div class="hero-name-en">${rightData.nameEn}</div>
                    <div class="hero-badge">${rightData.badge}</div>
                    <div class="hero-desc">${rightData.desc}</div>
                    <div class="hero-skills">
                        ${rightData.skills.map(s => `<span class="skill-pill">${s}</span>`).join('')}
                    </div>
                `;
            } else if (rightData.type === 'chapter' || rightData.type === 'cover' || rightData.type === 'end') {
                pageRight.className = 'page-right chapter-page';
                contentRight.innerHTML = rightData.html;
            } else if (rightData.type === 'hero') {
                pageRight.className = 'page-right';
                contentRight.innerHTML = `<img src="${rightData.img}" class="hero-img" alt="">`;
            }
        }

        function update() {
            // 淡出
            contentLeft.classList.add('fade-out');
            contentRight.classList.add('fade-out');
            
            setTimeout(() => {
                renderSpread(current);
                // 淡入
                contentLeft.classList.remove('fade-out');
                contentRight.classList.remove('fade-out');
            }, 300);
            
            // 更新导航
            document.getElementById('prevBtn').disabled = current === 0;
            document.getElementById('nextBtn').disabled = current === total - 1;
            
            // 更新圆点
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === current);
            });
        }

        function go(dir) {
            const next = current + dir;
            if (next >= 0 && next < total) {
                current = next;
                update();
            }
        }

        // 生成圆点
        const dotsContainer = document.getElementById('dots');
        for (let i = 0; i < total; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot' + (i === 0 ? ' active' : '');
            dot.onclick = () => { current = i; update(); };
            dotsContainer.appendChild(dot);
        }

        // 键盘
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === ' ') go(1);
            if (e.key === 'ArrowLeft') go(-1);
        });

        // 触摸滑动
        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
        document.addEventListener('touchend', e => {
            const diff = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) go(diff > 0 ? 1 : -1);
        });

        // 星空
        const bg = document.getElementById('starsBg');
        for (let i = 0; i < 80; i++) {
            const s = document.createElement('div');
            s.className = 'star-deco';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 3 + 's';
            const size = Math.random() * 2 + 1;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            bg.appendChild(s);
        }

        // 初始渲染
        renderSpread(0);
    </script>
</body>
</html>
