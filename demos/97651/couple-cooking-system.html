];

let favorites = new Set();
let order = [];
let currentRandom = null;
let currentFilter = 'all';

// Render dishes
function renderDishes() {
  const grid = document.getElementById('dishGrid');
  const filtered = currentFilter === 'all' ? dishes : dishes.filter(d => d.category === currentFilter);
  grid.innerHTML = filtered.map(dish => `
    <div class="dish-card" data-id="${dish.id}">
      <div class="dish-img" style="background: linear-gradient(135deg, ${dish.color} 0%, white 100%);">
        <span style="font-size:3rem;">${dish.emoji}</span>
        <span class="dish-badge">${dish.category}</span>
        <button class="dish-fav ${favorites.has(dish.id) ? 'liked' : ''}" onclick="toggleFav(event, ${dish.id})">
          ${favorites.has(dish.id) ? '❤️' : '🤍'}
        </button>
      </div>
      <div class="dish-info">
        <div class="dish-name">${dish.name}</div>
        <div class="dish-meta">
          <span>⏱️ ${dish.time}</span>
          <span>📊 ${dish.difficulty}</span>
        </div>
        <div class="dish-tags">
          ${dish.tags.map(t => `<span class="dish-tag">${t}</span>`).join('')}
        </div>
        <button class="dish-add ${order.find(o => o.id === dish.id) ? 'added' : ''}" onclick="toggleOrder(${dish.id})">
          ${order.find(o => o.id === dish.id) ? '✅ 已添加' : '➕ 加入清单'}
        </button>
      </div>
    </div>
  `).join('');
}

// Filter click
 document.getElementById('filters').addEventListener('click', e => {
  if (e.target.classList.contains('filter-tag')) {
    document.querySelectorAll('.filter-tag').forEach(btn => btn.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    renderDishes();
  }
});

// Toggle favorite
function toggleFav(event, id) {
  event.stopPropagation();
  if (favorites.has(id)) {
    favorites.delete(id);
  } else {
    favorites.add(id);
  }
  renderDishes();
}

// Toggle order
function toggleOrder(id) {
  const idx = order.findIndex(o => o.id === id);
  if (idx >= 0) {
    order.splice(idx, 1);
  } else {
    const dish = dishes.find(d => d.id === id);
    order.push(dish);
  }
  renderDishes();
  renderOrder();
}

// Render order list
function renderOrder() {
  const list = document.getElementById('orderList');
  const footer = document.getElementById('orderFooter');
  const count = document.getElementById('orderCount');

  if (order.length === 0) {
    list.innerHTML = '<div class="order-empty">还没有点菜哦～快去上面挑选喜欢的菜品吧 💕</div>';
    footer.style.display = 'none';
    return;
  }

  list.innerHTML = order.map(item => `
    <div class="order-item">
      <div class="order-item-info">
        <span class="order-item-emoji">${item.emoji}</span>
        <div>
          <div class="order-item-name">${item.name}</div>
          <div class="order-item-tags">${item.category} · ${item.time} · ${item.difficulty}</div>
        </div>
      </div>
      <button class="order-item-remove" onclick="toggleOrder(${item.id})">🗑️</button>
    </div>
  `).join('');

  count.textContent = order.length;
  footer.style.display = 'flex';
}

// Clear order
function clearOrder() {
  order = [];
  renderDishes();
  renderOrder();
}

// Random pick
function randomPick() {
  const resultEl = document.getElementById('randomResult');
  const addBtn = document.getElementById('addRandomBtn');
  const pool = currentFilter === 'all' ? dishes : dishes.filter(d => d.category === currentFilter);

  if (pool.length === 0) return;

  let count = 0;
  const max = 12;
  const interval = setInterval(() => {
    const temp = pool[Math.floor(Math.random() * pool.length)];
    resultEl.innerHTML = `<span style="opacity:0.5;">${temp.emoji} ${temp.name}</span>`;
    count++;
    if (count >= max) {
      clearInterval(interval);
      const selected = pool[Math.floor(Math.random() * pool.length)];
      currentRandom = selected;
      resultEl.innerHTML = `<span class="animate-pop">🎉 ${selected.emoji} ${selected.name}</span>`;
      addBtn.style.display = 'inline-flex';
      addBtn.textContent = `➕ 加入清单`;
      addBtn.classList.remove('added');
    }
  }, 80);
}

// Add random to order
function addRandomToOrder() {
  if (!currentRandom) return;
  if (!order.find(o => o.id === currentRandom.id)) {
    order.push(currentRandom);
    renderDishes();
    renderOrder();
  }
  const addBtn = document.getElementById('addRandomBtn');
  addBtn.textContent = '✅ 已添加';
  addBtn.classList.add('added');
}

// Assign tasks
function assignTasks() {
  const p1 = document.getElementById('person1').value.trim() || '宝宝';
  const p2 = document.getElementById('person2').value.trim() || '猪猪';
  const box = document.getElementById('assignmentBox');
  const chefEl = document.getElementById('chefName');
  const washerEl = document.getElementById('washerName');

  box.style.display = 'block';
  chefEl.textContent = '...';
  washerEl.textContent = '...';

  let count = 0;
  const interval = setInterval(() => {
    const names = [p1, p2];
    const shuffled = names.sort(() => Math.random() - 0.5);
    chefEl.textContent = shuffled[0];
    washerEl.textContent = shuffled[1];
    count++;
    if (count >= 10) {
      clearInterval(interval);
    }
  }, 100);
}

// Init
renderDishes();
renderOrder();
</script>
