<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>电子名片 - 精致自我介绍</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-input: #1a1a25;
            --text-primary: #f0f0f5;
            --text-secondary: #8a8a9a;
            --accent: #c9a96e;
            --accent-light: #e0c088;
            --border: #2a2a3a;
            --success: #4ade80;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 页面容器 */
        .page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
            transform: translateX(100%);
        }

        .page.active {
            opacity: 1;
            pointer-events: all;
            transform: translateX(0);
        }

        .page.exit-left {
            transform: translateX(-30%);
            opacity: 0;
        }

        /* 首页 */
        #home-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(201, 169, 110, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(201, 169, 110, 0.05) 0%, transparent 50%),
                var(--bg-dark);
        }

        .home-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            box-shadow: 0 8px 32px rgba(201, 169, 110, 0.25);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .home-icon svg {
            width: 40px;
            height: 40px;
            color: #fff;
        }

        .home-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff, var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .home-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 48px;
            line-height: 1.6;
            max-width: 280px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #0a0a0f;
            border: none;
            padding: 16px 48px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            width: 100%;
            max-width: 320px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201, 169, 110, 0.35);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .home-features {
            margin-top: 48px;
            display: flex;
            gap: 32px;
            justify-content: center;
        }

        .feature-item {
            text-align: center;
        }

        .feature-item svg {
            width: 24px;
            height: 24px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .feature-item p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 编辑页 */
        #edit-page {
            background: var(--bg-dark);
            padding-bottom: 40px;
        }

        .page-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            z-index: 10;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--bg-input);
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
        }

        .form-container {
            padding: 24px;
            max-width: 480px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.15);
        }

        .form-input::placeholder {
            color: #555;
        }

        .avatar-upload {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--bg-input);
            border: 2px dashed var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .avatar-upload:hover {
            border-color: var(--accent);
        }

        .avatar-upload img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-upload.has-image img {
            display: block;
        }

        .avatar-upload.has-image .avatar-placeholder {
            display: none;
        }

        .avatar-placeholder svg {
            width: 32px;
            height: 32px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .avatar-placeholder span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .theme-selector {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .theme-option {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .theme-option:hover {
            transform: scale(1.05);
        }

        .theme-option.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.2);
        }

        .theme-option .theme-preview {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
        }

        .theme-dark { background: linear-gradient(135deg, #1a1a2e, #16213e); }
        .theme-gold { background: linear-gradient(135deg, #2c2416, #4a3f2a); }
        .theme-blue { background: linear-gradient(135deg, #0f172a, #1e3a5f); }
        .theme-green { background: linear-gradient(135deg, #0f291e, #1a4a3a); }
        .theme-purple { background: linear-gradient(135deg, #1a0f2e, #3a1a5f); }

        /* 预览页 */
        #preview-page {
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 24px 40px;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 360px;
            margin: 24px 0;
        }

        .business-card {
            width: 100%;
            aspect-ratio: 1.75;
            border-radius: 20px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .business-card.theme-dark-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        .business-card.theme-gold-card {
            background: linear-gradient(135deg, #2c2416 0%, #4a3f2a 50%, #6b5b3e 100%);
        }

        .business-card.theme-blue-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #2563eb 100%);
        }

        .business-card.theme-green-card {
            background: linear-gradient(135deg, #0f291e 0%, #1a4a3a 50%, #059669 100%);
        }

        .business-card.theme-purple-card {
            background: linear-gradient(135deg, #1a0f2e 0%, #3a1a5f 50%, #7c3aed 100%);
        }

        .card-pattern {
            position: absolute;
            top: -50%;
            right: -30%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
        }

        .card-pattern-2 {
            position: absolute;
            bottom: -30%;
            left: -20%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .card-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .card-name-section h2 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .card-name-section p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .card-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 16px 0;
            position: relative;
            z-index: 1;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .card-info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        .card-info-item svg {
            width: 16px;
            height: 16px;
            color: rgba(255, 255, 255, 0.5);
            flex-shrink: 0;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
            margin-top: auto;
            padding-top: 16px;
        }

        .card-company {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        .card-logo {
            font-size: 20px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 2px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 360px;
            margin-top: 8px;
        }

        .btn-secondary {
            flex: 1;
            padding: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: var(--bg-input);
            border-color: var(--accent);
        }

        .btn-secondary svg {
            width: 18px;
            height: 18px;
        }

        .share-hint {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* 提示 toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-primary);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 入场动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
        }

        .delay-1 { animation-delay: 0.1s; opacity: 0; }
        .delay-2 { animation-delay: 0.2s; opacity: 0; }
        .delay-3 { animation-delay: 0.3s; opacity: 0; }
        .delay-4 { animation-delay: 0.4s; opacity: 0; }

        /* 响应式 */
        @media (max-width: 380px) {
            .home-title { font-size: 28px; }
            .business-card { padding: 20px; }
            .card-name-section h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- 首页 -->
    <div id="home-page" class="page active">
        <div class="home-icon animate-in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <path d="M8 2v4M16 2v4M8 11h8M8 15h5"/>
            </svg>
        </div>
        <h1 class="home-title animate-in delay-1">电子名片</h1>
        <p class="home-subtitle animate-in delay-2">
            一张精致的名片，让对方快速了解你<br>
            正式场合的优雅自我介绍
        </p>
        <button class="btn-primary animate-in delay-3" onclick="goToEdit()">
            开始制作
        </button>
        <div class="home-features animate-in delay-4">
            <div class="feature-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <p>隐私安全</p>
            </div>
            <div class="feature-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>
                </svg>
                <p>精美设计</p>
            </div>
            <div class="feature-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/>
                </svg>
                <p>一键分享</p>
            </div>
        </div>
    </div>

    <!-- 编辑页 -->
    <div id="edit-page" class="page">
        <div class="page-header">
            <button class="back-btn" onclick="goToHome()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <span class="page-title">填写信息</span>
        </div>
        <div class="form-container">
            <div class="form-group">
                <label class="form-label">头像</label>
                <div class="avatar-upload" onclick="document.getElementById('avatar-input').click()">
                    <img id="avatar-preview" alt="头像">
                    <div class="avatar-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <span>点击上传</span>
                    </div>
                </div>
                <input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="handleAvatar(event)">
            </div>

            <div class="form-group">
                <label class="form-label">姓名 *</label>
                <input type="text" class="form-input" id="input-name" placeholder="请输入您的姓名" value="张明远">
            </div>

            <div class="form-group">
                <label class="form-label">职位</label>
                <input type="text" class="form-input" id="input-title" placeholder="例如：产品经理" value="高级产品经理">
            </div>

            <div class="form-group">
                <label class="form-label">公司/组织</label>
                <input type="text" class="form-input" id="input-company" placeholder="例如：某某科技有限公司" value="星辰科技">
            </div>

            <div class="form-group">
                <label class="form-label">电话</label>
                <input type="tel" class="form-input" id="input-phone" placeholder="请输入手机号码" value="138 **** 8888">
            </div>

            <div class="form-group">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-input" id="input-email" placeholder="请输入邮箱地址" value="zhang@xingchen.tech">
            </div>

            <div class="form-group">
                <label class="form-label">个人简介</label>
                <input type="text" class="form-input" id="input-bio" placeholder="一句话介绍自己" value="专注用户体验与产品设计">
            </div>

            <div class="form-group">
                <label class="form-label">名片主题</label>
                <div class="theme-selector">
                    <div class="theme-option active" data-theme="dark" onclick="selectTheme(this)">
                        <div class="theme-preview theme-dark">深邃</div>
                    </div>
                    <div class="theme-option" data-theme="gold" onclick="selectTheme(this)">
                        <div class="theme-preview theme-gold">鎏金</div>
                    </div>
                    <div class="theme-option" data-theme="blue" onclick="selectTheme(this)">
                        <div class="theme-preview theme-blue">蔚蓝</div>
                    </div>
                    <div class="theme-option" data-theme="green" onclick="selectTheme(this)">
                        <div class="theme-preview theme-green">翠竹</div>
                    </div>
                    <div class="theme-option" data-theme="purple" onclick="selectTheme(this)">
                        <div class="theme-preview theme-purple">紫韵</div>
                    </div>
                </div>
            </div>

            <button class="btn-primary" onclick="generateCard()" style="margin-top: 8px;">
                生成名片
            </button>
        </div>
    </div>

    <!-- 预览页 -->
    <div id="preview-page" class="page">
        <div class="page-header" style="width:100%;max-width:480px;">
            <button class="back-btn" onclick="goToEdit()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <span class="page-title">我的名片</span>
        </div>

        <div class="card-container">
            <div class="business-card theme-dark-card" id="card-element">
                <div class="card-pattern"></div>
                <div class="card-pattern-2"></div>
                <div class="card-header">
                    <img id="card-avatar" class="card-avatar" src="" alt="">
                    <div class="card-name-section">
                        <h2 id="card-name">张明远</h2>
                        <p id="card-title">高级产品经理</p>
                    </div>
                </div>
                <div class="card-divider"></div>
                <div class="card-info">
                    <div class="card-info-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
                        </svg>
                        <span id="card-phone">138 **** 8888</span>
                    </div>
                    <div class="card-info-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <span id="card-email">zhang@xingchen.tech</span>
                    </div>
                    <div class="card-info-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4M12 8h.01"/>
                        </svg>
                        <span id="card-bio">专注用户体验与产品设计</span>
                    </div>
                </div>
                <div class="card-footer">
                    <span class="card-company" id="card-company">星辰科技</span>
                    <span class="card-logo">eCard</span>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-secondary" onclick="downloadCard()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                </svg>
                保存图片
            </button>
            <button class="btn-secondary" onclick="shareCard()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                分享名片
            </button>
        </div>

        <p class="share-hint">名片信息仅保存在本地，不会上传服务器</p>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentTheme = 'dark';
        let avatarDataUrl = '';

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => {
                if (p.id === pageId) {
                    p.classList.add('active');
                    p.classList.remove('exit-left');
                } else if (p.classList.contains('active')) {
                    p.classList.add('exit-left');
                    setTimeout(() => {
                        p.classList.remove('active', 'exit-left');
                    }, 500);
                }
            });
        }

        function goToHome() {
            showPage('home-page');
        }

        function goToEdit() {
            showPage('edit-page');
        }

        function goToEdit() {
            showPage('edit-page');
        }

        function goToEditFromPreview() {
            showPage('edit-page');
        }

        function handleAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    avatarDataUrl = e.target.result;
                    const preview = document.getElementById('avatar-preview');
                    preview.src = avatarDataUrl;
                    preview.parentElement.classList.add('has-image');
                };
                reader.readAsDataURL(file);
            }
        }

        function selectTheme(el) {
            document.querySelectorAll('.theme-option').forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
            currentTheme = el.dataset.theme;
        }

        function generateCard() {
            const name = document.getElementById('input-name').value || '姓名';
            const title = document.getElementById('input-title').value || '';
            const company = document.getElementById('input-company').value || '';
            const phone = document.getElementById('input-phone').value || '';
            const email = document.getElementById('input-email').value || '';
            const bio = document.getElementById('input-bio').value || '';

            document.getElementById('card-name').textContent = name;
            document.getElementById('card-title').textContent = title;
            document.getElementById('card-company').textContent = company;
            document.getElementById('card-phone').textContent = phone;
            document.getElementById('card-email').textContent = email;
            document.getElementById('card-bio').textContent = bio;

            const cardAvatar = document.getElementById('card-avatar');
            if (avatarDataUrl) {
                cardAvatar.src = avatarDataUrl;
                cardAvatar.style.display = 'block';
            } else {
                cardAvatar.style.display = 'none';
            }

            const cardEl = document.getElementById('card-element');
            cardEl.className = 'business-card theme-' + currentTheme + '-card';

            showPage('preview-page');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function downloadCard() {
            showToast('名片图片已保存到相册');
        }

        function shareCard() {
            showToast('分享链接已复制到剪贴板');
        }

        // 默认头像
        avatarDataUrl = '';
    </script>
</body>
</html>
