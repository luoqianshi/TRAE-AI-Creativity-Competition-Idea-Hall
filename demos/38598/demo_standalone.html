<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoFA Copilot — Demo</title>
<style>
/* system fonts */
:root {
  --bg:#0a0d13;--surface:rgba(18,22,33,.85);--border:rgba(75,85,100,.3);
  --text:#e0e4f0;--text-dim:#8890a4;--muted:#5a6170;
  --cyan:#00d4ff;--cyan-glow:rgba(0,212,255,.3);--green:#00f0a0;--green-glow:rgba(0,240,160,.3);
  --yellow:#f5b642;--yellow-glow:rgba(245,182,66,.3);--red:#ff4060;--red-glow:rgba(255,64,96,.3);
  --purple:#a855f7;--purple-glow:rgba(168,85,247,.3);--radius:14px;--radius-sm:8px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono','Cascadia Code',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative;
}

#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.4}

.header{
  position:relative;z-index:10;background:var(--surface);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  padding:10px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.header-left{display:flex;align-items:center;gap:12px}
.logo-icon{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;
  box-shadow:0 0 16px rgba(0,212,255,.2),0 0 32px rgba(168,85,247,.12);
  animation:logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse{0%,100%{box-shadow:0 0 16px rgba(0,212,255,.2)}50%{box-shadow:0 0 26px rgba(0,212,255,.35)}}
.logo-text{font-size:18px;font-weight:700;letter-spacing:-.02em}
.logo-text .gradient{background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-text .dim{color:var(--muted);font-weight:300}
.header-right{display:flex;align-items:center;gap:14px}
.badge{
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;
  background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.25);color:var(--purple);
}
.btn-demo{
  padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:none;
  background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;
  transition:all .3s;letter-spacing:.02em;
}
.btn-demo:hover{box-shadow:0 4px 20px rgba(0,212,255,.2);transform:translateY(-1px)}

.layout{
  display:flex;flex:1;overflow:hidden;position:relative;z-index:5;
}

.left-nav{
  width:15%;flex-shrink:0;
  background:rgba(14,17,25,.92);backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.left-nav-header{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
  flex-shrink:0;
}
.left-nav-header .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--purple);box-shadow:0 0 8px var(--purple-glow);
}
.left-nav-body{
  flex:1;overflow-y:auto;padding:12px 16px;
  display:flex;flex-direction:column;gap:4px;
}
.left-nav-body::-webkit-scrollbar{width:4px}
.left-nav-body::-webkit-scrollbar-track{background:transparent}
.left-nav-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.05);border-radius:6px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:var(--radius-sm);
  font-size:12px;color:var(--text-dim);cursor:pointer;
  transition:all .2s;
}
.nav-item:hover{background:rgba(255,255,255,.03);color:var(--text)}
.nav-item .nav-icon{font-size:15px;width:22px;text-align:center;flex-shrink:0}
.nav-item .nav-badge{font-size:10px;padding:1px 7px;border-radius:8px;margin-left:auto;font-weight:500}
.nav-item .nav-badge.active{background:rgba(168,85,247,.15);color:var(--purple)}
.nav-divider{border-top:1px solid rgba(255,255,255,.04);margin:6px 0}
.nav-label{font-size:10px;color:var(--muted);padding:4px 12px 2px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
.nav-label .add-task{font-size:13px;cursor:pointer;color:var(--muted);transition:color .2s;line-height:1;padding:0 2px;}
.nav-label .add-task:hover{color:var(--cyan)}

.right-col{
  width:42.5%;flex-shrink:0;min-width:0;
  display:flex;flex-direction:column;overflow:hidden;
}

.right-panel{
  width:42.5%;flex-shrink:0;min-width:0;
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.right-top{
  flex:1;overflow:hidden;min-height:0;
  background:rgba(14,17,25,.92);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;
}
.right-top-header{
  padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
  flex-shrink:0;color:var(--text-dim);
}
.right-bottom-body{
  flex:1;overflow-y:scroll;padding:12px 16px;
  display:flex;flex-direction:column;gap:10px;
}
.right-bottom-body::-webkit-scrollbar{width:4px}
.right-bottom-body::-webkit-scrollbar-track{background:transparent}
.right-bottom-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.05);border-radius:6px}
.right-top-body{
  flex:1;overflow:hidden;padding:0;
  display:flex;flex-direction:column;
  position:relative;
}
.right-bottom{
  height:35%;flex-shrink:0;min-height:0;overflow:hidden;
  background:rgba(14,17,25,.92);backdrop-filter:blur(20px);
  display:flex;flex-direction:column;
}
.right-bottom-header{
  padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  flex-shrink:0;
}
.right-bottom-header .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--cyan);box-shadow:0 0 6px var(--cyan-glow);
}

.viz-wrapper{flex:1;position:relative;display:none;min-height:0}
.viz-wrapper.active{display:block}
.viz-toolbar{position:absolute;top:6px;left:6px;z-index:10;display:none;gap:6px}
.viz-toolbar.active{display:flex}
.viz-toolbar button{padding:4px 10px;border:1px solid rgba(255,255,255,.15);border-radius:4px;background:rgba(14,17,25,.85);color:var(--text-dim);cursor:pointer;font-size:11px;transition:all .2s;backdrop-filter:blur(8px)}
.viz-toolbar button:hover{background:rgba(0,212,255,.15);color:var(--text)}
.viz-iframe{width:100%;height:100%;border:none;display:none;background:#1a1a2e}
.viz-iframe.active{display:block}


.toggle-wrap{display:flex;align-items:center;gap:8px;margin-left:auto}
.toggle-label{font-size:10px;color:var(--muted);font-weight:500;transition:color .2s}
.toggle-label.on{color:var(--cyan)}
.toggle-track{
  width:36px;height:20px;border-radius:10px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  position:relative;cursor:pointer;transition:all .3s;
}
.toggle-track.ai{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.25)}
.toggle-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--text);position:absolute;top:2px;left:3px;
  transition:all .3s;
}
.toggle-track.ai .toggle-thumb{left:17px;background:var(--cyan)}

.side-panel{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;animation:sidePanelIn .4s ease;
  background:rgba(18,22,33,.5);
}
@keyframes sidePanelIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}

.side-panel-title{
  font-size:11px;font-weight:600;color:var(--text-dim);
  margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.side-panel-title .icon{font-size:13px}

/* 3D canvas */
#sideCanvas{
  width:100%;height:100%;border-radius:var(--radius-sm);
  background:rgba(10,13,19,.6);border:1px solid var(--border);
  display:block;
}

/* Formula */
.formula-line{
  font-family:var(--mono);font-size:11px;color:var(--text-dim);
  padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03);
  display:flex;justify-content:space-between;
}
.formula-line .val{color:var(--cyan);font-weight:500}

/* Param table */
.param-table{width:100%;font-size:11px;border-collapse:collapse}
.param-table td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
.param-table td:first-child{color:var(--text-dim)}
.param-table td:last-child{color:var(--text);text-align:right;font-family:var(--mono);font-weight:500}

.main{
  position:relative;z-index:5;flex:1;overflow-y:auto;padding:20px 24px;
  display:flex;flex-direction:column;gap:14px;
}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-track{background:transparent}
.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:10px}

.intro{
  text-align:center;padding:40px 20px 10px;animation:fadeUp .8s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.intro-icon{
  width:64px;height:64px;margin:0 auto 16px;border-radius:18px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 0 36px rgba(0,212,255,.18),0 0 64px rgba(168,85,247,.08);
  animation:welcomeIcon 4s ease-in-out infinite;
}
@keyframes welcomeIcon{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.intro h2{font-size:26px;font-weight:700;margin-bottom:6px;
  background:linear-gradient(135deg,var(--text)30%,var(--cyan)70%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.intro p{font-size:13px;color:var(--text-dim);max-width:460px;margin:0 auto;line-height:1.6}
.intro .start-hint{margin-top:14px;font-size:12px;color:var(--muted);animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
.btn-start{
  padding:10px 36px;min-width:180px;text-align:center;
  border:1px solid var(--cyan);border-radius:8px;
  background:rgba(0,212,255,.08);color:var(--cyan);
  font-size:14px;font-weight:600;cursor:pointer;
  transition:all .3s;letter-spacing:.04em;
}
.btn-start:hover{background:rgba(0,212,255,.16);box-shadow:0 0 24px rgba(0,212,255,.2);transform:translateY(-1px)}
.intro-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn-afa-demo{
  padding:10px 36px;min-width:180px;text-align:center;
  border:1px solid var(--purple);border-radius:8px;
  background:rgba(168,85,247,.08);color:var(--purple);
  font-size:14px;font-weight:600;cursor:pointer;
  transition:all .3s;letter-spacing:.04em;
}
.btn-afa-demo:hover{background:rgba(168,85,247,.16);box-shadow:0 0 24px rgba(168,85,247,.2);transform:translateY(-1px)}

.msg{
  max-width:85%;padding:11px 16px;border-radius:var(--radius);
  line-height:1.6;word-break:break-word;font-size:14px;
  animation:msgSlide .35s ease;
}
@keyframes msgSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-user{
  align-self:flex-end;
  background:linear-gradient(135deg,var(--cyan),rgba(0,212,255,.7));
  color:#0a0d13;font-weight:500;
  box-shadow:0 4px 20px rgba(0,212,255,.15);
}
.msg-assistant{
  align-self:flex-start;
  background:var(--surface);backdrop-filter:blur(20px);
  border:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.2);
}
.msg-assistant h1,.msg-assistant h2,.msg-assistant h3{font-size:15px;margin:6px 0 3px}
.msg-assistant code{background:rgba(0,212,255,.08);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--cyan);font-family:var(--mono)}
.msg-assistant pre{background:rgba(10,13,19,.6);padding:10px;border-radius:var(--radius-sm);overflow-x:auto;margin:6px 0;font-size:12px;border:1px solid var(--border);font-family:var(--mono)}
.msg-assistant table{border-collapse:collapse;margin:6px 0;width:100%;font-size:12px}
.msg-assistant th,.msg-assistant td{border:1px solid var(--border);padding:5px 8px}
.msg-assistant th{background:rgba(255,255,255,.03)}
.msg-assistant ul,.msg-assistant ol{padding-left:18px;margin:4px 0}
.msg-system{
  align-self:center;color:var(--text-dim);font-size:12px;
  padding:5px 14px;border-radius:20px;background:rgba(255,255,255,.02);
  animation:fadeUp .3s ease;
}

.activity{width:100%;max-width:100%}

.phase-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:6px;
  animation:badgeIn .4s ease;
}
@keyframes badgeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.phase-badge.thinking{background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
.phase-badge.tool_calling{background:rgba(245,182,66,.1);color:var(--yellow);border:1px solid rgba(245,182,66,.2)}
.phase-badge.sub_agent{background:rgba(168,85,247,.1);color:var(--purple);border:1px solid rgba(168,85,247,.2)}
.phase-badge.done{background:rgba(0,240,160,.1);color:var(--green);border:1px solid rgba(0,240,160,.2)}

.thinking-panel{
  background:var(--surface);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 14px;margin-bottom:8px;cursor:pointer;transition:all .2s;
  animation:fadeUp .3s ease;
}
.thinking-header{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);font-weight:500}
.thinking-header .chevron{transition:transform .25s;font-size:9px;color:var(--muted)}
.thinking-header.collapsed .chevron{transform:rotate(-90deg)}
.thinking-content{
  margin-top:6px;font-size:12px;color:var(--text-dim);font-style:italic;
  white-space:pre-wrap;max-height:90px;overflow-y:auto;line-height:1.6;
}
.thinking-content.hidden{display:none}

.tool-card{
  background:var(--surface);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:9px 14px;margin-bottom:6px;font-size:12px;position:relative;overflow:hidden;
  animation:fadeUp .3s ease;transition:all .3s;
}
.tool-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;transition:all .5s;
}
.tool-card.running::before{background:var(--yellow);box-shadow:0 0 12px var(--yellow-glow)}
.tool-card.done::before{background:var(--green);box-shadow:0 0 8px var(--green-glow)}
.tool-card-header{display:flex;align-items:center;gap:8px}
.tool-icon{font-size:13px;width:18px;text-align:center;flex-shrink:0}
.tool-icon.done{color:var(--green)}
.tool-name{font-weight:600;font-family:var(--mono);color:var(--cyan);font-size:12px}
.tool-args{color:var(--text-dim);margin-left:4px;font-size:11px;font-family:var(--mono)}
.tool-elapsed{margin-left:auto;color:var(--muted);font-size:11px;font-family:var(--mono)}
.tool-result{
  margin-top:6px;padding:6px 10px;background:rgba(10,13,19,.4);
  border-radius:var(--radius-sm);max-height:70px;overflow-y:auto;
  font-size:11px;color:var(--text-dim);white-space:pre-wrap;
  font-family:var(--mono);border:1px solid rgba(255,255,255,.04);
}

.spinner{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(255,255,255,.08);border-top-color:var(--yellow);
  border-radius:50%;animation:spin .7s linear infinite;
  box-shadow:0 0 8px var(--yellow-glow);
}
@keyframes spin{to{transform:rotate(360deg)}}

.subagent-panel{
  background:var(--surface);backdrop-filter:blur(20px);
  border:1px solid var(--purple-glow);border-radius:var(--radius);
  padding:12px 16px;margin-bottom:8px;
  box-shadow:0 0 20px rgba(168,85,247,.05);
  animation:fadeUp .3s ease;
}
.subagent-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.subagent-role{
  width:26px;height:26px;border-radius:7px;
  background:linear-gradient(135deg,var(--purple),rgba(168,85,247,.5));
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.subagent-title{font-weight:600}
.subagent-status{
  font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;
}
.subagent-status.running{background:rgba(245,182,66,.1);color:var(--yellow)}
.subagent-status.waiting{background:rgba(168,85,247,.1);color:var(--purple);border:1px solid rgba(168,85,247,.25)}
.subagent-status.done{background:rgba(0,240,160,.1);color:var(--green)}
.subagent-meta{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}

.question-panel{
  background:rgba(168,85,247,.04);border:1px solid rgba(168,85,247,.25);
  border-radius:var(--radius);padding:12px 16px;margin:8px 0;
  animation:fadeUp .3s ease;
}
.question-badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--purple);
  margin-bottom:6px;background:rgba(168,85,247,.1);padding:3px 8px;border-radius:10px;
}
.question-text{font-size:13px;margin-bottom:8px;line-height:1.5}
.question-options{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.question-opt{
  padding:5px 12px;border:1px solid rgba(168,85,247,.2);border-radius:16px;
  font-size:11px;background:var(--surface-solid);color:var(--text-dim);
}
.question-opt.chosen{border-color:var(--green);color:var(--green);background:rgba(0,240,160,.06)}
.question-answer{margin-top:4px;font-size:11px;color:var(--green)}

.footer{
  position:relative;z-index:10;background:var(--surface);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);padding:6px 24px;font-size:11px;
  color:var(--text-dim);display:flex;gap:18px;flex-shrink:0;
}
.footer-item{display:flex;align-items:center;gap:5px}
.footer-value{color:var(--text);font-weight:600;font-family:var(--mono);font-size:11px}
.footer-phase{margin-left:auto;font-weight:500}

@media(max-width:640px){
  .left-nav,.right-panel{display:none}
  .right-col{width:100%}
  .header{padding:8px 14px}.main{padding:14px 10px}.msg{max-width:95%}.intro{padding:24px 10px 8px}
}

.input-area{
  position:relative;z-index:10;
  background:var(--surface);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);padding:10px 24px;
  display:flex;gap:10px;flex-shrink:0;
}
.input-wrapper{flex:1;position:relative}
.input-glow{
  position:absolute;inset:-1px;border-radius:16px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  opacity:0;transition:opacity .3s;z-index:0;filter:blur(2px);
}
.input-wrapper:focus-within .input-glow{opacity:.3}
.input-area textarea{
  position:relative;z-index:1;
  width:100%;padding:10px 16px;
  background:rgba(10,13,19,.8);border:1px solid var(--border);
  border-radius:var(--radius);color:var(--text);
  font-size:14px;font-family:var(--font);resize:none;
  line-height:1.5;min-height:42px;max-height:120px;
  transition:all .3s;
}
.input-area textarea:focus{outline:none;border-color:transparent}
.input-area textarea::placeholder{color:var(--muted)}
.input-area textarea:disabled{opacity:.5;cursor:not-allowed}
.send-btn{
  position:relative;z-index:1;
  padding:10px 26px;align-self:flex-end;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  color:#fff;border:none;border-radius:var(--radius);
  cursor:pointer;font-size:14px;font-weight:600;
  transition:all .3s;white-space:nowrap;letter-spacing:.02em;
  box-shadow:0 4px 20px rgba(0,212,255,.15);
}
.send-btn:hover{box-shadow:0 6px 30px rgba(0,212,255,.25);transform:translateY(-1px)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.send-btn.enabled{animation:btnGlow 2s ease-in-out infinite}
@keyframes btnGlow{0%,100%{box-shadow:0 4px 20px rgba(0,212,255,.15)}50%{box-shadow:0 4px 30px rgba(0,240,160,.35)}}

.calc-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.calc-overlay.active{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.calc-modal{background:var(--surface);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--radius);max-width:720px;width:90%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.calc-modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.calc-modal-header h3{font-size:15px;color:var(--text);margin:0}
.calc-modal-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text-dim);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.calc-modal-close:hover{background:rgba(255,64,96,.15);border-color:var(--red);color:var(--red)}
.calc-modal-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.calc-modal-body::-webkit-scrollbar{width:4px}
.calc-modal-body::-webkit-scrollbar-track{background:transparent}
.calc-modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.05);border-radius:6px}
.calc-status{padding:8px 12px;border-radius:var(--radius-sm);font-size:11px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.calc-status.ok{background:rgba(0,240,160,.08);color:var(--green);border:1px solid rgba(0,240,160,.15)}
.calc-status.err{background:rgba(255,64,96,.08);color:var(--red);border:1px solid rgba(255,64,96,.15)}
.calc-strategy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc-strategy-card{padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;background:rgba(255,255,255,.02);display:flex;flex-direction:column;gap:6px}
.calc-strategy-card:hover{border-color:var(--cyan);background:rgba(0,212,255,.06)}
.calc-strategy-card .card-icon{font-size:18px}
.calc-strategy-card .card-name{font-size:12px;font-weight:600;color:var(--text)}
.calc-strategy-card .card-desc{font-size:10px;color:var(--text-dim);line-height:1.4}
.calc-strategy-card .card-endpoint{font-size:9px;color:var(--muted);font-family:var(--mono)}
.calc-empty{text-align:center;padding:30px;color:var(--text-dim);font-size:13px}
.calc-toolbar{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.calc-toolbar button{padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.04);color:var(--text-dim);cursor:pointer;font-size:11px;transition:all .2s;display:flex;align-items:center;gap:4px}
.calc-toolbar button:hover{background:rgba(255,255,255,.08);color:var(--text);border-color:var(--cyan)}
.calc-toolbar button.primary{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.3);color:var(--cyan)}
.calc-toolbar button.primary:hover{background:rgba(0,212,255,.22)}
.calc-toolbar button.danger{background:rgba(255,64,96,.08);border-color:rgba(255,64,96,.2);color:var(--red)}
.calc-toolbar button.danger:hover{background:rgba(255,64,96,.18)}
.calc-list-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:rgba(255,255,255,.015);transition:all .2s;cursor:pointer}
.calc-list-item:hover{border-color:var(--cyan);background:rgba(0,212,255,.04)}
.calc-list-item.selected{border-color:var(--cyan);background:rgba(0,212,255,.1)}
.calc-list-item .item-icon{font-size:18px;flex-shrink:0}
.calc-list-item .item-info{flex:1;min-width:0}
.calc-list-item .item-title{font-size:12px;font-weight:600;color:var(--text)}
.calc-list-item .item-meta{font-size:10px;color:var(--text-dim);margin-top:2px}
.calc-list-item .item-check{width:16px;height:16px;border:1px solid var(--border);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.calc-list-item .item-check.checked{background:var(--cyan);border-color:var(--cyan)}
.calc-list-item .item-check.checked::after{content:'✓';font-size:10px;color:#000}
.calc-search{width:100%;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.04);color:var(--text);font-size:12px;outline:none;transition:all .2s}
.calc-search:focus{border-color:var(--cyan)}
.calc-search::placeholder{color:var(--muted)}
.scheme-tier{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600;flex-shrink:0;cursor:pointer}
.scheme-tier.tier-企业{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.25)}
.scheme-tier.tier-个人{background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
.scheme-tier.tier-免费{background:rgba(0,240,160,.1);color:var(--green);border:1px solid rgba(0,240,160,.2)}
.scheme-cat{padding:3px 7px;border-radius:4px;font-size:9px;font-weight:600;flex-shrink:0;letter-spacing:.02em}
.scheme-cat.cat-整机设备{background:rgba(245,182,66,.1);color:#f5b642;border:1px solid rgba(245,182,66,.2)}
.scheme-cat.cat-关键机构{background:rgba(255,64,96,.1);color:var(--red);border:1px solid rgba(255,64,96,.2)}
.scheme-price{font-size:11px;font-weight:600;color:var(--yellow);padding:3px 6px;background:rgba(245,182,66,.08);border-radius:6px;flex-shrink:0;min-width:50px;text-align:center}
.scheme-ai-btn{padding:3px 8px;border:1px solid rgba(0,212,255,.25);border-radius:6px;background:rgba(0,212,255,.08);color:var(--cyan);cursor:pointer;font-size:10px;font-weight:600;flex-shrink:0;transition:all .2s}
.scheme-ai-btn:hover{background:rgba(0,212,255,.18);border-color:var(--cyan);box-shadow:0 0 10px rgba(0,212,255,.15)}
.afa-upload-btn{padding:3px 8px;border:1px solid rgba(168,85,247,.25);border-radius:6px;background:rgba(168,85,247,.08);color:var(--purple);cursor:pointer;font-size:10px;font-weight:600;flex-shrink:0;transition:all .2s}
.afa-upload-btn:hover{background:rgba(168,85,247,.18);border-color:var(--purple);box-shadow:0 0 10px rgba(168,85,247,.15)}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="header">
  <div class="header-left">
    <div class="logo-icon">⚡</div>
    <div class="logo-text"><span class="gradient">AutoFA</span><span class="dim">Copilot</span></div>
  </div>
  <div class="header-right">
    <span class="badge" id="stepLabel">准备演示</span>
    <button class="btn-demo" onclick="restart()">🔄 重播</button>
  </div>
</div>

<div class="layout">

<div class="left-nav">
  <div class="left-nav-header">
    <span class="dot"></span> AutoFA Copilot
  </div>
  <div class="left-nav-body">
    <div class="nav-label">任务列表 <span class="add-task" onclick="addTask()" title="新建任务">＋</span></div>
    <div class="nav-item"><span class="nav-icon">📁</span>Design 1<span class="nav-badge active">当前</span></div>
    <div class="nav-divider"></div>
    <div class="nav-label">工具</div>
    <div class="nav-item" onclick="openListModal('schemes')"><span class="nav-icon">📚</span>AFA方案库</div>
    <div class="nav-item" onclick="openListModal('history')"><span class="nav-icon">🕐</span>个人/企业项目</div>
    <div class="nav-item" onclick="openPartModal()"><span class="nav-icon">🔍</span>零件管理</div>
    <div class="nav-item" onclick="openCalcModal()"><span class="nav-icon">📐</span>工程计算</div>
    <div class="nav-item" onclick="openCadcaeModal()"><span class="nav-icon">🏗️</span>CAD/CAE桥接</div>
    <div class="nav-item" onclick="openSyncModal()"><span class="nav-icon">📥</span>Model Sync</div>
    <div class="nav-divider"></div>
    <div class="nav-label">知识库</div>
    <div class="nav-item"><span class="nav-icon">📖</span>设计规范</div>
    <div class="nav-item"><span class="nav-icon">📊</span>选型手册</div>
    <div class="nav-item"><span class="nav-icon">📋</span>BOM模板</div>
    <div class="nav-divider"></div>
    <div class="nav-item"><span class="nav-icon">ℹ️</span>关于</div>
  </div>
</div>

<div class="right-col">

<div class="main" id="messages">
  <div class="intro" id="introScreen">
    <div class="intro-icon">🤖</div>
    <h2>AutoFA Copilot 演示</h2>
    <p>智能工厂自动化助手 — 模拟完整的工程设计流程</p>
    <div class="intro-btns">
      <button class="btn-start" onclick="startProject()">▶ 项目演示</button>
      <button class="btn-afa-demo" onclick="startAFA()">🔍 AFA方案演示</button>
    </div>
  </div>
</div>

<div class="footer">
  <div class="footer-item">🔤 <span class="footer-value" id="tokenCount">0</span></div>
  <div class="footer-item">⏱ <span class="footer-value" id="timeCount">0.0</span>s</div>
  <div class="footer-item">🔧 <span class="footer-value" id="toolCount">0</span></div>
  <div class="footer-item">🤖 <span class="footer-value" id="saCount">0</span></div>
  <div class="footer-item footer-phase"><span id="phaseLabel">准备就绪</span></div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <div class="input-glow"></div>
    <textarea id="chatInput" placeholder="演示播放中，结束后可自由对话..." rows="1" disabled></textarea>
  </div>
  <button class="send-btn" id="sendBtn" disabled onclick="sendChat()">⚡ 发送</button>
</div>

</div>

<div class="right-panel">
  <div class="right-top">
    <div class="right-top-header">
      可视面板
      <div class="toggle-wrap" id="vizToggle">
        <span class="toggle-label on" data-side="ai">🧠 AI</span>
        <div class="toggle-track ai" onclick="toggleViz(event)">
          <div class="toggle-thumb"></div>
        </div>
        <span class="toggle-label" data-side="human">🌐 3D</span>
      </div>
    </div>
    <div class="right-top-body" id="rightTopBody">
      <div class="viz-wrapper active" id="vizWrapper" style="display:none">
        
      </div>
    </div>
  </div>
  <div class="right-bottom">
    <div class="right-bottom-header">
      <span class="dot"></span> 工程面板
    </div>
    <div class="right-bottom-body" id="sidebarBody"></div>
  </div>
</div>

</div>

<script>
const $msgs=document.getElementById('messages');
const $stepLabel=document.getElementById('stepLabel');
const $tokenCount=document.getElementById('tokenCount');
const $timeCount=document.getElementById('timeCount');
const $toolCount=document.getElementById('toolCount');
const $saCount=document.getElementById('saCount');
const $phaseLabel=document.getElementById('phaseLabel');
const $intro=document.getElementById('introScreen');
const $chatInput=document.getElementById('chatInput');
const $sendBtn=document.getElementById('sendBtn');
const $sidebarBody=document.getElementById('sidebarBody');

let sessionId='';
let chatReady=false;

marked.setOptions({breaks:true,gfm:true});

let tokens=0,toolIdx=0,saIdx=0,demoStart=0;
let currentTurn=null;
let running=true;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ── Particle background ──
const canvas=document.getElementById('bgCanvas');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);
class P{
  constructor(){this.reset()}
  reset(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.vx=(Math.random()-.5)*.35;this.vy=(Math.random()-.5)*.35;this.r=Math.random()*1.8+.4;this.o=Math.random()*.3+.06}
  upd(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>canvas.width)this.vx*=-1;if(this.y<0||this.y>canvas.height)this.vy*=-1}
  draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(0,212,255,${this.o})`;ctx.fill()}
}
const ps=Array.from({length:50},()=>new P());
function anim(){ctx.clearRect(0,0,canvas.width,canvas.height);ps.forEach(p=>{p.upd();p.draw()});
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){let dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<120){ctx.beginPath();ctx.moveTo(ps[i].x,ps[i].y);ctx.lineTo(ps[j].x,ps[j].y);ctx.strokeStyle=`rgba(0,212,255,${.025*(1-dist/120)})`;ctx.lineWidth=.4;ctx.stroke()}}
  requestAnimationFrame(anim)}
anim();

// ── DOM helpers ──
function scroll(){requestAnimationFrame(()=>$msgs.scrollTop=$msgs.scrollHeight)}
function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}
function addMsg(role,html){let d=document.createElement('div');d.className='msg msg-'+role;d.innerHTML=html;$msgs.appendChild(d);scroll();return d}
function addSys(t){addMsg('system',t)}
function newTurn(){let g=document.createElement('div');g.className='activity';g.id='t-'+Date.now();$msgs.appendChild(g);return g}
function setPhase(p){
  let icons={thinking:'💭',tool_calling:'🔧',sub_agent:'🤖',done:'✅',idle:'⏳'};
  let labels={thinking:'分析中',tool_calling:'执行工具',sub_agent:'子Agent运行',done:'完成',idle:'空闲'};
  $phaseLabel.textContent=(icons[p]||'')+' '+(labels[p]||p);
}
function addTokens(n){tokens+=n;$tokenCount.textContent=tokens.toLocaleString()}
function updateTime(){$timeCount.textContent=((Date.now()-demoStart)/1000).toFixed(0)}
function setStep(s){$stepLabel.textContent=s}

// ── Thinking ──
let thinkingEl=null;
async function showThinking(text){
  if(!thinkingEl){
    thinkingEl=document.createElement('div');
    thinkingEl.className='thinking-panel';
    thinkingEl.innerHTML='<div class="thinking-header"><span class="chevron">▼</span> 💭 思考过程</div><div class="thinking-content"></div>';
    thinkingEl.querySelector('.thinking-header').onclick=()=>{
      let c=thinkingEl.querySelector('.thinking-content');
      c.classList.toggle('hidden');
      thinkingEl.querySelector('.thinking-header').classList.toggle('collapsed');
    };
    currentTurn.appendChild(thinkingEl);
  }
  let c=thinkingEl.querySelector('.thinking-content');
  for(let ch of text){
    c.textContent+=ch;
    scroll();
    await sleep(15);
  }
}

// ── Tool ──
async function addTool(name,args,result,wait=800){
  let card=document.createElement('div');
  card.className='tool-card running';
  let argsStr=args?Object.keys(args).map(k=>k+': '+JSON.stringify(args[k])).join(', ').slice(0,55):'';
  card.innerHTML=`<div class="tool-card-header">
    <span class="tool-icon"><span class="spinner"></span></span>
    <span class="tool-name">${esc(name)}</span>
    ${argsStr?`<span class="tool-args">${esc(argsStr)}</span>`:''}
    <span class="tool-elapsed">...</span>
  </div>`;
  currentTurn.appendChild(card);
  scroll();
  toolIdx++;$toolCount.textContent=toolIdx;
  setPhase('tool_calling');
  await sleep(wait);

  card.className='tool-card done';
  card.querySelector('.tool-icon').innerHTML='✓';
  card.querySelector('.tool-icon').className='tool-icon done';
  card.querySelector('.tool-elapsed').textContent=(wait/1000).toFixed(1)+'s';
  if(result){
    let rd=document.createElement('div');
    rd.className='tool-result';
    rd.textContent=result;
    card.appendChild(rd);
  }
  addTokens(16000+Math.floor(Math.random()*12000));
  scroll();
}

// ── SubAgent ──
async function showSubAgent(role,title,toolsData,questionData=null){
  let panel=document.createElement('div');
  panel.className='subagent-panel';
  panel.id='sa-'+role;
  panel.innerHTML=`<div class="subagent-header">
    <div class="subagent-role">🤖</div>
    <span class="subagent-title">${esc(title)}</span>
    <span class="subagent-status running">运行中</span>
  </div>`;
  currentTurn.appendChild(panel);
  scroll();
  saIdx++;$saCount.textContent=saIdx;
  setPhase('sub_agent');
  setStep(`Step ${saIdx+1}: ${role}`);

  let toolsDiv=document.createElement('div');
  panel.appendChild(toolsDiv);

  for(let td of toolsData){
    let card=document.createElement('div');
    card.className='tool-card running';
    card.innerHTML=`<div class="tool-card-header">
      <span class="tool-icon"><span class="spinner"></span></span>
      <span class="tool-name">${esc(td.name)}</span>
      <span class="tool-elapsed">...</span>
    </div>`;
    toolsDiv.appendChild(card);
    scroll();
    toolIdx++;$toolCount.textContent=toolIdx;
    await sleep(td.wait||900);

    card.className='tool-card done';
    card.querySelector('.tool-icon').innerHTML='✓';
    card.querySelector('.tool-icon').className='tool-icon done';
    card.querySelector('.tool-elapsed').textContent=((td.wait||900)/1000).toFixed(1)+'s';
    if(td.result){
      let rd=document.createElement('div');
      rd.className='tool-result';
      rd.textContent=td.result;
      card.appendChild(rd);
    }
    addTokens(12000+Math.floor(Math.random()*8000));
    scroll();
  }

  if(questionData){
    panel.querySelector('.subagent-status').textContent='等待回答';
    panel.querySelector('.subagent-status').className='subagent-status waiting';
    setPhase('sub_agent');

    let qp=document.createElement('div');
    qp.className='question-panel';
    qp.innerHTML=`<div class="question-badge">📋 ${esc(questionData.header||'')}</div>
      <div class="question-text">${esc(questionData.question)}</div>
      ${questionData.options?`<div class="question-options">
        ${questionData.options.map((o,i)=>`<span class="question-opt ${i===0?'chosen':''}">${esc(o)}</span>`).join('')}
      </div>`:''}`;
    panel.appendChild(qp);
    scroll();
    await sleep(3500);

    panel.appendChild((()=>{let d=document.createElement('div');d.className='question-answer';d.textContent='→ '+(questionData.answer||questionData.options[0]);return d})());
    panel.querySelector('.subagent-status').textContent='已回答';
    panel.querySelector('.subagent-status').className='subagent-status running';
    scroll();
    await sleep(600);
  }

  panel.querySelector('.subagent-status').textContent='完成';
  panel.querySelector('.subagent-status').className='subagent-status done';
  let meta=document.createElement('div');
  meta.className='subagent-meta';
  meta.textContent=`output: ${esc(questionData?.answer||'done')}`;
  panel.appendChild(meta);
  addTokens(8000);
  scroll();
}

// ── Sidebar ──
function addTask(){}
function addSidePanel(title,icon,html){
  const p=document.createElement('div');
  p.className='side-panel';
  p.innerHTML=`<div class="side-panel-title"><span class="icon">${icon||'📐'}</span> ${title}</div>${html}`;
  $sidebarBody.appendChild(p);
  requestAnimationFrame(()=>p.scrollIntoView({behavior:'smooth',block:'nearest'}));
  return p;
}

function addFormulaPanel(title,formulas){
  const rows=formulas.map(f=>`<div class="formula-line"><span>${esc(f.expr)}</span><span class="val">${esc(f.result)}</span></div>`).join('');
  return addSidePanel(title,'📐',rows);
}

function addParamTable(title,params){
  const rows=params.map(p=>`<tr><td>${esc(p.label)}</td><td>${esc(p.value)}</td></tr>`).join('');
  return addSidePanel(title,'📊',`<table class="param-table">${rows}</table>`);
}

function addBOMTable(title,items){
  const rows=items.map(i=>`<tr><td>${esc(i.part)}</td><td>${esc(i.brand)}</td><td>${esc(i.model)}</td><td>${esc(i.qty)}</td></tr>`).join('');
  return addSidePanel(title,'📦',`<table class="param-table"><tr style="color:var(--text-dim);font-weight:500"><td>零件</td><td>品牌</td><td>型号</td><td>数量</td></tr>${rows}</table>`);
}

async function sideSleep(ms){await sleep(ms)}


// Three.js bridge
let _threeStarted=false;
function _startThree(){
  if(_threeStarted)return;_threeStarted=true;
  const wrap=document.getElementById('vizWrapper');
  if(!wrap)return;
  const canvas=document.getElementById('sideCanvas');
  if(canvas)canvas.style.display='none';
  wrap.style.display='block';wrap.classList.add('active');
  wrap.innerHTML='<div id="_vRoot" style="width:100%;height:100%;position:relative;overflow:hidden"><div id="_vSidebar" class="v3d-sidebar"><div id="_vHdr"><h2>📦 传输平台建模</h2><div class="_vStat" id="_vStat">正在连接...</div></div><div class="_vBar"><button onclick="window.__vLoadAll()" class="_vPrim">加载</button><button onclick="window.__vCadModel()">CAD建模</button><button onclick="window.__vCadDraw()">CAD出图</button></div><div id="_vList" style="flex:1;overflow-y:auto;padding:6px 0"></div></div><div id="_vInfo" style="position:absolute;bottom:14px;left:14px;background:rgba(14,17,25,.7);border:1px solid var(--border);color:var(--text-dim);padding:6px 14px;border-radius:8px;font-size:.6rem;pointer-events:none;z-index:30">顶点: 0 | 线: 0 | 面: 0</div></div>';
  var s=document.createElement('style');s.textContent='.v3d-sidebar{position:absolute;top:0;right:0;bottom:0;width:180px;background:rgba(14,17,25,.94);backdrop-filter:blur(20px);color:var(--text);display:flex;flex-direction:column;border-left:1px solid var(--border);overflow:hidden;z-index:40}#_vHdr{padding:12px 14px;border-bottom:1px solid var(--border)}#_vHdr h2{font-size:.8rem;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}#_vHdr ._vStat{font-size:.6rem;color:var(--text-dim)}._vBar{padding:8px 14px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border)}._vBar button{padding:3px 8px;border:1px solid rgba(255,255,255,.1);border-radius:4px;background:rgba(255,255,255,.04);color:var(--text-dim);cursor:pointer;font-size:.6rem;transition:all .2s}._vBar button:hover{background:rgba(168,85,247,.12);color:var(--text);border-color:rgba(168,85,247,.3)}._vBar ._vPrim{background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(168,85,247,.2));border-color:rgba(168,85,247,.3);color:#c0d0ff}._vBar ._vPrim:hover{background:linear-gradient(135deg,rgba(0,212,255,.25),rgba(168,85,247,.35));color:#fff;box-shadow:0 0 16px rgba(168,85,247,.15)}._vItem{display:flex;align-items:center;padding:4px 14px;cursor:pointer;font-size:.65rem;gap:6px;color:var(--text-dim);transition:background .15s}._vItem:hover{background:rgba(255,255,255,.03);color:var(--text)}._vItem.on{background:rgba(168,85,247,.1);color:var(--text);border-left:2px solid var(--purple);padding-left:12px}._vDot{width:9px;height:9px;border-radius:2px;flex-shrink:0}';document.head.appendChild(s);
  if(window.__doInit)window.__doInit();
}

// ── Visual Panel Toggle ──
let graphAnim=null;
let vizIsAI=true;

function toggleViz(e){
  e.stopPropagation();
  vizIsAI=!vizIsAI;
  const canvas=document.getElementById('sideCanvas');
  const wrap=document.getElementById('vizWrapper');
  const labels=document.querySelectorAll('#vizToggle .toggle-label');
  const track=document.querySelector('#vizToggle .toggle-track');
  if(vizIsAI){
    track.classList.add('ai');
    labels[0].classList.add('on');labels[1].classList.remove('on');
    if(canvas)canvas.style.display='block';
    if(wrap){wrap.style.display='none';wrap.classList.remove('active');}
  } else {
    track.classList.remove('ai');
    labels[0].classList.remove('on');labels[1].classList.add('on');
    if(canvas)canvas.style.display='none';
    if(wrap){wrap.style.display='block';wrap.classList.add('active');}
    _startThree();
  }
}

// ── 工程计算 API ──
const CALC_API='http://localhost:8090/api/calc';

const CALC_JS={
  bearing({d,F_r,F_a,n}){
    d=d||25;F_r=F_r||1000;F_a=F_a||500;n=n||1500;
    const X=0.56,Y=1.0,P=X*F_r+Y*F_a;
    const candidates=[
      {code:'6204',C:12.8},{code:'6205',C:14.0},{code:'6206',C:19.5},{code:'6305',C:22.5}
    ].map(c=>({...c,life:Math.round((c.C*1000/P)**3*1e6/(60*n)),pass:(c.C*1000/P)**3*1e6/(60*n)>=10000}));
    return {inputs:{d,F_r,F_a,n,X,Y,P:Math.round(P)},candidates,
            qualified:candidates.filter(c=>c.pass),recommendation:'6305'};
  },
  ball_screw({m1,m2,L,n0,mu,eta}){
    m1=m1||400;m2=m2||100;L=L||1000;n0=n0||1500;mu=mu||0.1;eta=eta||0.9;
    const Fa=(m1+m2)*9.81*mu;
    const screws=[
      {diameter:16,lead:10,model:'BLW 1610-2.5',Ca:7.6,Cao:12.3},
      {diameter:20,lead:20,model:'BLW 2020-3.6',Ca:11.1,Cao:24.7},
      {diameter:25,lead:25,model:'BLW 2525-4.8',Ca:16.5,Cao:38.2}
    ].map(s=>({...s,safety:+(s.Ca*1000/Math.max(Fa,1)).toFixed(1),life_h:Math.round((s.Ca*1000/Fa)**3*1e6/(60*n0))}));
    return {inputs:{工作台质量:(m1+m2)+' kg',丝杆轴向力:Fa.toFixed(1)+' N',行程:L+' mm'},candidates:screws,recommendation:'BLW 2020-3.6'};
  },
  linear_guide({P,Ls,fw}){

async function calcAPI(path,params={}){
  try{
    const r=await fetch(`${CALC_API}/${path}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)});
    if(r.ok)return await r.json();
  }catch(e){console.log('API unreachable, using local engine');}
  return CALC_JS[path]?CALC_JS[path](params):null;
}

async function openCalcModal(){
  const overlay=document.getElementById('calcOverlay');
  const header=document.querySelector('.calc-modal-header h3');
  const body=document.getElementById('calcModalBody');
  header.textContent='📐 工程计算 — API 策略列表';
  overlay.classList.add('active');
  body.innerHTML='<div class="calc-empty">⏳ 正在连接 API 获取策略列表...</div>';

  let strategies=null;
  let apiOk=false;
  try{
    const r=await fetch(`${CALC_API}/strategies`);
    if(r.ok){strategies=await r.json();apiOk=true;}
  }catch(e){console.log('API unreachable, using static list');}

  if(apiOk && strategies){
    const names=strategies.strategies||[];
    body.innerHTML=`<div class="calc-toolbar">
      <button class="primary" onclick="addStrategy()">➕ 增加</button>
      <button onclick="delStrategy()">🗑 删除</button>
      <button onclick="batchImport()">📥 批量导入</button>
      <button onclick="aiDocImport()">🤖 文档AI智能导入</button>
    </div>
    <div class="calc-strategy-grid">`+names.map(name=>{
      const info=STRATEGY_INFO[name]||{icon:'📡',name,desc:'实时工程计算',method:'POST',params:''};
      return `<div class="calc-strategy-card" onclick="tryCalc('${name}')">
        <div class="card-icon">${info.icon}</div>
        <div class="card-name">${info.name}</div>
        <div class="card-desc">${info.desc}</div>
        <div class="card-endpoint">${info.method} /api/calc/${name} (${info.params})</div>
      </div>`;
    }).join('')+'</div>';
  } else {
    const allNames=Object.keys(STRATEGY_INFO);
    body.innerHTML=`<div class="calc-toolbar">
      <button class="primary" onclick="addStrategy()">➕ 增加</button>
      <button onclick="delStrategy()">🗑 删除</button>
      <button onclick="batchImport()">📥 批量导入</button>
      <button onclick="aiDocImport()">🤖 文档AI智能导入</button>
    </div>
    <div class="calc-strategy-grid">`+allNames.map(name=>{
      const info=STRATEGY_INFO[name];
      return `<div class="calc-strategy-card" onclick="tryCalc('${name}')">
        <div class="card-icon">${info.icon}</div>
        <div class="card-name">${info.name}</div>
        <div class="card-desc">${info.desc}</div>
        <div class="card-endpoint">${info.method} /api/calc/${name} (${info.params})</div>
      </div>`;
    }).join('')+'</div>';
  }
}

function closeCalcModal(){
  document.getElementById('calcOverlay').classList.remove('active');
}
function closeListModal(){closeCalcModal();}

function tryCalc(name){
  const info=STRATEGY_INFO[name]||{name};
  closeCalcModal();
  addSys(`📐 工程策略已选择: <b>${info.name}</b> — API: /api/calc/${name} — 参数: ${info.params||'待确认'}。可在 Demo 流程 Step 3 逐项选型中查看该策略的实时计算结果。`);
  scroll();
}

function addStrategy(){
  const name=prompt('请输入新策略名称 (英文, 如 my_custom):');
  if(!name)return;
  if(STRATEGY_INFO[name]){alert('策略 "'+name+'" 已存在');return;}
  STRATEGY_INFO[name]={icon:'✨',name,desc:'自定义工程计算策略',method:'POST',params:''};
  openCalcModal();
}

function delStrategy(){
  const name=prompt('请输入要删除的策略名称 (英文):');
  if(!name)return;
  if(!STRATEGY_INFO[name]){alert('策略 "'+name+'" 不存在');return;}
  delete STRATEGY_INFO[name];
  openCalcModal();
}

function batchImport(){
  closeCalcModal();
  addSys('📥 批量导入: 请在弹窗中选择 JSON/CSV 文件上传，支持从 fa-framework/strategies/ 批量导入策略。');
  scroll();
  const input=document.createElement('input');
  input.type='file';input.accept='.json,.csv';input.multiple=true;
  input.onchange=async()=>{
    for(const f of input.files){
      try{
        const text=await f.text();
        const data=JSON.parse(text);
        if(data.strategies)data.strategies.forEach(s=>{if(s.name&&!STRATEGY_INFO[s.name])STRATEGY_INFO[s.name]={icon:'📦',name:s.name,desc:s.desc||'批量导入',method:s.method||'POST',params:s.params||''};});
        else addSys('📄 '+f.name+': 已读取，未识别策略格式');
      }catch(e){addSys('⚠️ '+f.name+': 解析失败 — '+e.message);}
    }
    addSys('✅ 批量导入完成，点击左侧"工程计算"查看最新策略列表。');
  };
  input.click();
}

function aiDocImport(){
  closeCalcModal();
  const url=prompt('请输入工程文档 URL 或粘贴 Markdown 内容:\n(支持: PDF链接 / 技术手册 / 设计规范 / 选型手册)');
  if(!url)return;
  addSys('🤖 AI正在分析文档内容: '+url.slice(0,40)+'...');
  scroll();
  setTimeout(()=>{
    const guessedName='doc_ai_'+Date.now().toString(36);
    STRATEGY_INFO[guessedName]={icon:'🧠',name:'AI: '+url.slice(0,20),desc:'从文档自动提取策略',method:'POST',params:''};
    addSys('✅ AI智能导入完成! 策略录入工程计算面板，点击左侧"工程计算"查看。');
  },1500);
}

  const statusColors={已录入:'var(--green)',审核中:'var(--cyan)',已交付:'var(--green)'};
  const items=data.map((d,i)=>{
    const sc=statusColors[d.status]||'var(--text-dim)';
    const vc=VERSION_COLORS[i%VERSION_COLORS.length];
    if(type==='history'){
      return `<div class="calc-list-item" data-index="${i}" onclick="toggleListItem(this)" data-id="${d.id}">
        <div class="item-check"></div>
        <div class="item-icon"></div>
        <div class="item-info" style="flex:1;min-width:0">
          <div class="item-title">${d.name}</div>
          <div class="item-meta">${d.date} · <span style="color:${sc}">${d.status}</span></div>
        </div>
        <span style="font-size:11px;font-weight:600;color:${vc};padding:2px 8px;border:1px solid ${vc}22;border-radius:4px;background:${vc}0f;flex-shrink:0">${d.version||''}</span>
        <button class="calc-modal-close" style="width:24px;height:24px;font-size:12px;flex-shrink:0" onclick="event.stopPropagation();showVersionNote('${d.id}')" title="版本说明">📝</button>
        <button class="afa-upload-btn" onclick="event.stopPropagation();uploadToAFA('${d.id}')">⬆ 智能上传AFA</button>
        <button class="scheme-ai-btn" onclick="event.stopPropagation();aiAdaptHistory('${d.id}')">🤖 AI适配</button>
      </div>`;
    }
    return `<div class="calc-list-item" data-index="${i}" onclick="toggleListItem(this)" data-id="${d.id}">
      <div class="item-check"></div>
      <div class="item-icon">📁</div>
      <div class="item-info">
        <div class="item-title">${d.name}</div>
        <div class="item-meta">${d.date} · <span style="color:${sc}">${d.status}</span></div>
      </div>
      <span class="scheme-tier tier-${d.tier}" onclick="event.stopPropagation()">${d.tier}</span>
      <span class="scheme-cat cat-${d.category||'整机设备'}">${d.category||'整机设备'}</span>
      <span class="scheme-price">${d.price}</span>
      <button class="scheme-ai-btn" onclick="event.stopPropagation();aiAdaptScheme('${d.id}')">🤖 AI适配</button>
    </div>`;
  }).join('');
  body.innerHTML=`<div class="calc-toolbar">
    <input class="calc-search" placeholder="🔍 搜索..." oninput="filterListItems(this.value)">
    <button class="primary" onclick="viewListItems()">👁 浏览</button>
    <button class="danger" onclick="delListItems()">🗑 删除</button>
    <button class="danger" onclick="batchDelListItems()">🗑 批量删除</button>
  </div>
  <div style="font-size:10px;color:var(--muted);padding:2px 0">共 ${data.length} 项 · 点击勾选 · 点击"浏览"查看详情</div>
  <div id="listContainer">${items}</div>`;
}

function showVersionNote(id){
  const item=MOCK_HISTORY.find(h=>h.id===id);
  if(!item){addSys('⚠️ 未找到该项目');scroll();return;}
  addSys(`📝 <b>${item.name}</b> — <span style="color:var(--cyan)">${item.version}</span> 版本说明:<br/>${item.versionNote}`);
  scroll();
}

function uploadToAFA(id){
  const item=MOCK_HISTORY.find(h=>h.id===id);
  if(!item){addSys('⚠️ 未找到该项目');scroll();return;}
  const now=new Date().toISOString().slice(0,10);
  const newId='S'+(MOCK_SCHEMES.length+1).toString().padStart(3,'0');
  const tier=item.status==='已交付'?'企业':'个人';
  const category=Math.random()>0.5?'整机设备':'关键机构';
  const price=tier==='企业'?'¥'+(3+Math.floor(Math.random()*10))+','+(Math.floor(Math.random()*9)+1)+'00':'¥'+(Math.floor(Math.random()*2)+1)+','+(Math.floor(Math.random()*9)+1)+'00';
  MOCK_SCHEMES.push({id:newId,name:item.name,date:now,desc:item.desc,status:'已录入',tier,price,category});
  addSys(`⬆ <b>智能上传AFA</b>: 已将 <span style="color:var(--purple)">${item.name}</span> (${item.version}) 上传至AFA方案库 — 编号 <span style="color:var(--cyan)">${newId}</span> · ${tier} · ${category} · ${price}`);
  scroll();
  closeListModal();
}

function toggleListItem(el){
  el.classList.toggle('selected');
  el.querySelector('.item-check').classList.toggle('checked');
}

function filterListItems(q){
  document.querySelectorAll('#listContainer .calc-list-item').forEach(el=>{
    const title=el.querySelector('.item-title').textContent.toLowerCase();
    el.style.display=title.includes(q.toLowerCase())?'':'none';
  });
}

function getSelectedIds(){
  return [...document.querySelectorAll('#listContainer .calc-list-item.selected')].map(el=>el.dataset.id);
}

function viewListItems(){
  const selected=getSelectedIds();
  if(selected.length===0){addSys('⚠️ 请先勾选要浏览的项目');scroll();closeListModal();return;}
  addSys(`👁 浏览: 已选择 ${selected.length} 项 (${selected.join(', ')})`);
  scroll();
  closeListModal();
}

function aiAdaptScheme(id){
  const item=MOCK_SCHEMES.find(s=>s.id===id);
  if(!item){addSys('⚠️ 未找到该方案');scroll();return;}
  addSys('🤖 <b>AI适配</b>: 正在将方案 <span style="color:var(--cyan)">'+item.name+'</span> 适配到当前项目参数...');
  scroll();
  closeListModal();
}

function aiAdaptHistory(id){
  const item=MOCK_HISTORY.find(h=>h.id===id);
  if(!item){addSys('⚠️ 未找到该项目');scroll();return;}
  addSys(`🤖 <b>AI适配</b>: 正在将项目 <span style="color:var(--cyan)">${item.name}</span> (${item.version}) 适配到当前工作区 — ${item.desc}`);
  scroll();
  closeListModal();
}

function delListItems(){
  const selected=getSelectedIds();
  if(selected.length===0){addSys('⚠️ 请先勾选要删除的项目');scroll();closeListModal();return;}
  addSys(`🗑 删除: 已删除 ${selected.length} 项 (${selected.join(', ')})`);
  if(listModalType==='schemes'){
    for(let i=MOCK_SCHEMES.length-1;i>=0;i--){if(selected.includes(MOCK_SCHEMES[i].id))MOCK_SCHEMES.splice(i,1);}
  }else{
    for(let i=MOCK_HISTORY.length-1;i>=0;i--){if(selected.includes(MOCK_HISTORY[i].id))MOCK_HISTORY.splice(i,1);}
  }
  scroll();
  closeListModal();
}

function batchDelListItems(){
  if(!confirm('确定要批量删除所有选中的项目吗？此操作不可撤销。'))return;
  delListItems();
}

function viewPartDetail(){
  const selected=getSelectedIds();
  if(selected.length===0){addSys('⚠️ 请先勾选要浏览的零件');scroll();closeCalcModal();return;}
  const parts=MOCK_PARTS.filter(p=>selected.includes(p.id));
  const detail=parts.map(p=>{
    const attrs=Object.entries(p.attrs).map(([k,v])=>`  ${k}: ${v}`).join('\n');
    return `<b>${p.name}</b> [${p.code}]\n类型: ${p.type} | 厂商: ${p.manufacturer}\n国标: ${p.standard} | 材料: ${p.material} | 重量: ${p.weight}kg\n技术参数:\n${attrs}`;
  }).join('\n\n');
  addSys(`👁 零件详情:\n\n${detail}`);
  scroll();
  closeCalcModal();
}

function importPart(){
  closeCalcModal();
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=async()=>{
    for(const f of input.files){
      try{
        const text=await f.text();
        const data=JSON.parse(text);
        const arr=Array.isArray(data)?data:[data];
        arr.forEach(p=>{
          if(p.code&&p.part_name){
            const typeMap={ball_bearing:'ball_bearing',roller_bearing:'roller_bearing',motor:'motor'};
            MOCK_PARTS.unshift({
              id:'P'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5),
              code:p.code,name:p.part_name,type:typeMap[p.type]||p.type||'other',
              manufacturer:p.manufacturing_company||'—',standard:p.national_standard_no||'—',
              version:p.version||'V1.0',material:p.material_grade||'—',weight:p.weight||0,
              attrs:p.attributes||{}
            });
          }
        });
        addSys('📥 导入成功: '+f.name);
      }catch(e){addSys('⚠️ '+f.name+': 解析失败 — '+e.message);}
    }
    scroll();
  };
  input.click();
}

function delParts(){
  const selected=getSelectedIds();
  if(selected.length===0){addSys('⚠️ 请先勾选要删除的零件');scroll();closeCalcModal();return;}
  for(let i=MOCK_PARTS.length-1;i>=0;i--){if(selected.includes(MOCK_PARTS[i].id))MOCK_PARTS.splice(i,1);}
  addSys(`🗑 已删除 ${selected.length} 个零件`);
  scroll();
  closeCalcModal();
}

function batchDelParts(){
  if(!confirm('确定要批量删除所有选中的零件吗？'))return;
  delParts();
}

function importFile(){
  closeCalcModal();
  const input=document.createElement('input');
  input.type='file';
  input.accept='.step,.stp,.igs,.iges,.stl,.x_t,.sldprt,.prt,.csv,.pdf,.md';
  input.onchange=()=>{
    for(const f of input.files){
      const ext=f.name.split('.').pop().toUpperCase();
      const typeMap={STEP:'STEP',STP:'STEP',IGS:'IGES',IGES:'IGES',STL:'STL',X_T:'Parasolid',SLDPRT:'SOLIDWORKS',PRT:'NX',CSV:'CSV',PDF:'PDF',MD:'文档'};
      MOCK_SYNC.unshift({
        id:'F'+Date.now().toString(36).toUpperCase(),
        name:f.name,type:typeMap[ext]||ext,size:(f.size/1024>1024?(f.size/1024/1024).toFixed(1)+' MB':(f.size/1024).toFixed(0)+' KB'),date:new Date().toISOString().slice(0,10),status:'待同步'
      });
      addSys(`📥 已添加: <b>${f.name}</b> (${typeMap[ext]||ext}, ${(f.size/1024).toFixed(1)} KB) — 待同步`);
    }
    scroll();
  };
  input.click();
}

function batchImportFile(){
  closeCalcModal();
  const input=document.createElement('input');
  input.type='file';input.multiple=true;
  input.accept='.step,.stp,.igs,.iges,.stl,.x_t,.sldprt,.prt,.csv,.pdf,.md';
  let count=0;
  input.onchange=()=>{
    for(const f of input.files){
      const ext=f.name.split('.').pop().toUpperCase();
      const typeMap={STEP:'STEP',STP:'STEP',IGS:'IGES',IGES:'IGES',STL:'STL',X_T:'Parasolid',SLDPRT:'SOLIDWORKS',PRT:'NX',CSV:'CSV',PDF:'PDF',MD:'文档'};
      MOCK_SYNC.unshift({
        id:'F'+Date.now().toString(36).toUpperCase()+count,
        name:f.name,type:typeMap[ext]||ext,size:(f.size/1024>1024?(f.size/1024/1024).toFixed(1)+' MB':(f.size/1024).toFixed(0)+' KB'),date:new Date().toISOString().slice(0,10),status:'待同步'
      });
      count++;
    }
    addSys(`📥 批量导入完成: ${count} 个文件已添加，状态: 待同步`);
    scroll();
  };
  input.click();
}

function syncSelected(){
  const selected=getSelectedIds();
  if(selected.length===0){addSys('⚠️ 请先勾选要同步的文件');scroll();closeCalcModal();return;}
  MOCK_SYNC.forEach(f=>{if(selected.includes(f.id))f.status='已同步';});
  addSys(`🔄 已同步 ${selected.length} 个文件`);
  scroll();
  closeCalcModal();
}

function delSyncItems(){
  const selected=getSelectedIds();
  if(selected.length===0){addSys('⚠️ 请先勾选要删除的文件');scroll();closeCalcModal();return;}
  for(let i=MOCK_SYNC.length-1;i>=0;i--){if(selected.includes(MOCK_SYNC[i].id))MOCK_SYNC.splice(i,1);}
  addSys(`🗑 已删除 ${selected.length} 个文件`);
  scroll();
  closeCalcModal();
}

function aiOrganizeSync(){
  const selected=getSelectedIds();
  if(selected.length===0){addSys('⚠️ 请先勾选要AI整理的文件');scroll();closeCalcModal();return;}
  const files=MOCK_SYNC.filter(f=>selected.includes(f.id));
  const names=files.map(f=>f.name).join(', ');
  const typeSet=[...new Set(files.map(f=>f.type))].join(' / ');
  for(const f of files)f.status='已同步';
  addSys(`🤖 <b>AI整理</b>: 已分析 ${selected.length} 个文件 (${typeSet}) — ${names}<br/>自动分类完成，状态更新为已同步。`);
  scroll();
  closeCalcModal();
}

function syncToProject(){
  const selected=getSelectedIds();
  if(selected.length===0){addSys('⚠️ 请先勾选要同步的文件');scroll();closeCalcModal();return;}
  const files=MOCK_SYNC.filter(f=>selected.includes(f.id));
  const names=files.map(f=>f.name).join(', ');
  for(const f of files)f.status='已同步';
  const count=selected.length;
  addSys(`📋 <b>同步个人/企业项目库</b>: 已将 ${count} 个文件同步至项目库 — ${names}`);
  scroll();
  closeCalcModal();
}

function connectCadcae(){
  const selected=getSelectedIds();
  if(selected.length===0){addSys('⚠️ 请先勾选要连接的软件');scroll();closeCalcModal();return;}
  MOCK_CADCAE.forEach(c=>{if(selected.includes(c.id))c.status='已连接';});
  addSys(`🔗 已连接 ${selected.length} 个软件`);
  scroll();
  closeCalcModal();
}

function detectCadcae(){
  const selected=getSelectedIds();
  const targets=selected.length>0?selected:MOCK_CADCAE.map(c=>c.id);
  targets.forEach(id=>{
    const c=MOCK_CADCAE.find(x=>x.id===id);
    if(c)c.status='检测中';
  });
  closeCalcModal();
  addSys(`🔍 正在检索 ${targets.length} 个软件安装路径...`);
  scroll();
  if(cadcaeDetectTimer)clearTimeout(cadcaeDetectTimer);
  cadcaeDetectTimer=setTimeout(()=>{
    targets.forEach(id=>{
      const c=MOCK_CADCAE.find(x=>x.id===id);
      if(c){
        const found=Math.random()>0.3;
        c.status=found?'已连接':'待检测';
      }
    });
    const foundCount=MOCK_CADCAE.filter(c=>c.status==='已连接').length;
    addSys(`✅ 检索完成: 共检测 ${targets.length} 个软件, 其中 ${MOCK_CADCAE.filter(c=>targets.includes(c.id)&&c.status==='已连接').length} 个已就绪。当前已连接 ${foundCount}/${MOCK_CADCAE.length}`);
    scroll();
  },2000);
}

function disconnectCadcae(){
  const selected=getSelectedIds();
  if(selected.length===0){addSys('⚠️ 请先勾选要断链的软件');scroll();closeCalcModal();return;}
  MOCK_CADCAE.forEach(c=>{if(selected.includes(c.id))c.status='待检测';});
  addSys(`⛓️‍💥 已断链 ${selected.length} 个软件`);
  scroll();
  closeCalcModal();
}

function stop3DCanvas(){
  if(graphAnim){cancelAnimationFrame(graphAnim);graphAnim=null;}
}

function setupCanvas(){
  const container=document.getElementById('rightTopBody');
  if(!container)return null;
  let c=document.getElementById('sideCanvas');
  if(!c){c=document.createElement('canvas');c.id='sideCanvas';container.appendChild(c);}
  const ctx=c.getContext('2d');
  function resize(){
    const r=container.getBoundingClientRect();
    c.width=r.width-20;c.height=r.height-20;
  }
  resize();window.addEventListener('resize',resize);
  return {c,ctx};
}

function init3DFD(){
  if(graphAnim)cancelAnimationFrame(graphAnim);
  const s=setupCanvas();if(!s)return;
  const {c,ctx}=s;

  const nodes=[
    {id:'底板',     x:0,y:0,r:14,color:'#6e8dc8'},{id:'丝杠',     x:0,y:0,r:12,color:'#c8b478'},
    {id:'电机',     x:0,y:0,r:12,color:'#a08cc8'},{id:'导轨A',    x:0,y:0,r:10,color:'#8c96c8'},
    {id:'导轨B',    x:0,y:0,r:10,color:'#8c96c8'},{id:'轴承座A',  x:0,y:0,r:9, color:'#b4a078'},
    {id:'轴承座B',  x:0,y:0,r:9, color:'#b4a078'},{id:'联轴器',   x:0,y:0,r:8, color:'#c88c78'},
    {id:'电机座',   x:0,y:0,r:9, color:'#8cb4c8'},{id:'螺母',     x:0,y:0,r:8, color:'#c4a470'},
    {id:'滑块',     x:0,y:0,r:9, color:'#78b4a0'},{id:'端盖A',    x:0,y:0,r:7, color:'#9e8e78'},
    {id:'端盖B',    x:0,y:0,r:7, color:'#9e8e78'},{id:'密封圈',   x:0,y:0,r:6, color:'#78b4c8'},
    {id:'限位开关', x:0,y:0,r:7, color:'#d48878'},
  ];
  nodes.forEach(n=>{const cx=c.width/2,cy=c.height/2;n.x=cx+(Math.random()-.5)*140;n.y=cy+(Math.random()-.5)*140;});

  const edges=[
    {src:'底板',tgt:'丝杠'},{src:'底板',tgt:'电机座'},{src:'底板',tgt:'导轨A'},
    {src:'底板',tgt:'导轨B'},{src:'底板',tgt:'限位开关'},{src:'丝杠',tgt:'螺母'},
    {src:'丝杠',tgt:'轴承座A'},{src:'丝杠',tgt:'轴承座B'},{src:'丝杠',tgt:'联轴器'},
    {src:'轴承座A',tgt:'端盖A'},{src:'轴承座A',tgt:'密封圈'},{src:'轴承座B',tgt:'端盖B'},
    {src:'联轴器',tgt:'电机'},{src:'电机',tgt:'电机座'},{src:'电机',tgt:'限位开关'},
  ].map(e=>({...e,label:{'底板->丝杠':'安装','底板->电机座':'固定','底板->导轨A':'安装','底板->导轨B':'安装','底板->限位开关':'安装','丝杠->螺母':'啮合','丝杠->轴承座A':'支承','丝杠->轴承座B':'支承','丝杠->联轴器':'连接','轴承座A->端盖A':'压紧','轴承座A->密封圈':'密封','轴承座B->端盖B':'压紧','联轴器->电机':'驱动','电机->电机座':'安装','电机->限位开关':'信号'}[e.src+'->'+e.tgt]||''}));

  let hovered=null;
  const sim={alpha:8,velocityDecay:.34};
  c.addEventListener('mousemove',e=>{
    const rect=c.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
    hovered=null;
    for(const n of nodes){const dx=n.x-mx,dy=n.y-my;if(dx*dx+dy*dy<(n.r+5)**2){hovered=n;break;}}
  });
  c.addEventListener('mouseleave',()=>{hovered=null;});

  let fc=0;
  function draw(){
    if(!document.getElementById('sideCanvas')){graphAnim=requestAnimationFrame(draw);return;}
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='rgba(10,13,19,.6)';ctx.fillRect(0,0,c.width,c.height);
    fc++;

    for(let i=0;i<3;i++){
      for(const n of nodes){n.vx=(n.vx||0)*sim.velocityDecay;n.vy=(n.vy||0)*sim.velocityDecay;n.x+=n.vx||0;n.y+=n.vy||0;}
      for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y;const dist=Math.sqrt(dx*dx+dy*dy)||1;
        const md=a.r+b.r+22;if(dist<md){const f=(md-dist)*.03;a.vx=(a.vx||0)-f*(dx/dist);a.vy=(a.vy||0)-f*(dy/dist);b.vx=(b.vx||0)+f*(dx/dist);b.vy=(b.vy||0)+f*(dy/dist);}
      }
      const cx2=c.width/2,cy2=c.height/2;
      for(const n of nodes){n.vx=(n.vx||0)+(cx2-n.x)*.002;n.vy=(n.vy||0)+(cy2-n.y)*.002;}
      for(const e of edges){
        const src=nodes.find(n=>n.id===e.src),tgt=nodes.find(n=>n.id===e.tgt);if(!src||!tgt)continue;
        let dx=tgt.x-src.x,dy=tgt.y-src.y;const dist=Math.sqrt(dx*dx+dy*dy)||1;
        const f=(dist-65)*.02;src.vx=(src.vx||0)+f*(dx/dist);src.vy=(src.vy||0)+f*(dy/dist);tgt.vx=(tgt.vx||0)-f*(dx/dist);tgt.vy=(tgt.vy||0)-f*(dy/dist);
      }
    }

    for(const e of edges){
      const src=nodes.find(n=>n.id===e.src),tgt=nodes.find(n=>n.id===e.tgt);
      if(!src||!tgt)continue;
      const isH=hovered&&(hovered.id===e.src||hovered.id===e.tgt);
      let dx=tgt.x-src.x,dy=tgt.y-src.y;const dist=Math.sqrt(dx*dx+dy*dy)||1;
      const ux=dx/dist,uy=dy/dist;
      ctx.beginPath();ctx.moveTo(src.x+ux*src.r,src.y+uy*src.r);
      ctx.lineTo(tgt.x-ux*tgt.r,tgt.y-uy*tgt.r);
      ctx.strokeStyle=isH?'rgba(168,85,247,.5)':'rgba(255,255,255,.1)';
      ctx.lineWidth=isH?1.5:.6;ctx.stroke();
      if(e.label){const mx=(src.x+tgt.x)/2,my=(src.y+tgt.y)/2;ctx.fillStyle='rgba(255,255,255,.15)';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText(e.label,mx,my-4);}
    }
    for(const n of nodes){
      const isH=hovered&&hovered.id===n.id;const r=n.r+(isH?2:0);
      ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fillStyle=isH?'#fff':n.color;ctx.fill();
      if(isH){ctx.beginPath();ctx.arc(n.x,n.y,r+10,0,Math.PI*2);ctx.strokeStyle='rgba(168,85,247,'+(.18+.1*Math.sin(fc*.08))+')';ctx.lineWidth=2;ctx.stroke();}
      ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='8px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(n.id,n.x,n.y+r+5);
    }
    graphAnim=requestAnimationFrame(draw);
  }
  draw();
}

let _3dParts=null;

function init3DWire(gradual){
  if(graphAnim)cancelAnimationFrame(graphAnim);
  const s=setupCanvas();if(!s)return;
  const {c,ctx}=s;

  let rx=-.55,ry=.25,dist=3,drag=false,prx,px,py;
  c.addEventListener('mousedown',e=>{drag=true;px=e.clientX;py=e.clientY;prx=rx;});
  c.addEventListener('mouseup',()=>drag=false);
  c.addEventListener('mouseleave',()=>drag=false);
  c.addEventListener('mousemove',e=>{if(!drag)return;rx=prx+(e.clientX-px)*.007;ry+=(e.clientY-py)*.007;});
  c.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(2,Math.min(8,dist+e.deltaY*.004));});

  const proj=(x,y,z)=>{
    const cx=Math.cos(rx),sx=Math.sin(rx),cy=Math.cos(ry),sy=Math.sin(ry);
    let x1=x*cy+z*sy,z1=-x*sy+z*cy,y1=y*cx-z1*sx,z2=y*sx+z1*cx;
    const s=5/(dist+z2);
    return {x:c.width/2+x1*s*280,y:c.height/2-y1*s*280,z:z2};
  };
  const box=(cx,cy,cz,dx,dy,dz)=>[].concat(
    [[cx-dx,cy-dy,cz-dz],[cx+dx,cy-dy,cz-dz]],[[cx+dx,cy-dy,cz-dz],[cx+dx,cy-dy,cz+dz]],[[cx+dx,cy-dy,cz+dz],[cx-dx,cy-dy,cz+dz]],[[cx-dx,cy-dy,cz+dz],[cx-dx,cy-dy,cz-dz]],
    [[cx-dx,cy+dy,cz-dz],[cx+dx,cy+dy,cz-dz]],[[cx+dx,cy+dy,cz-dz],[cx+dx,cy+dy,cz+dz]],[[cx+dx,cy+dy,cz+dz],[cx-dx,cy+dy,cz+dz]],[[cx-dx,cy+dy,cz+dz],[cx-dx,cy+dy,cz-dz]],
    [[cx-dx,cy-dy,cz-dz],[cx-dx,cy+dy,cz-dz]],[[cx+dx,cy-dy,cz-dz],[cx+dx,cy+dy,cz-dz]],[[cx+dx,cy-dy,cz+dz],[cx+dx,cy+dy,cz+dz]],[[cx-dx,cy-dy,cz+dz],[cx-dx,cy+dy,cz+dz]]
  );
  const cyl=(cx,cy,cz,r,len,seg=10)=>{
    let e=[];
    for(let i=0;i<seg;i++){
      let a1=i/seg*Math.PI*2,a2=(i+1)/seg*Math.PI*2,x1=cx+Math.cos(a1)*r,z1=cz+Math.sin(a1)*r,x2=cx+Math.cos(a2)*r,z2=cz+Math.sin(a2)*r;
      e.push([x1,cy,z1,x2,cy,z2],[x1,cy+len,z1,x2,cy+len,z2],[x1,cy,z1,x1,cy+len,z1]);
    }
    return e;
  };
  _3dParts=[
    {label:'底板',color:'#6e8dc8',edges:box(0,.06,0,1.45,.06,.55)},{label:'导轨A',color:'#8c96c8',edges:box(-.85,.23,-.45,.06,.11,.018)},
    {label:'导轨B',color:'#8c96c8',edges:box(.85,.23,.45,.06,.11,.018)},{label:'丝杠',color:'#c8b478',edges:cyl(0,.26,0,.12,.64,12)},
    {label:'轴承座A',color:'#b4a078',edges:box(-.82,.26,0,.22,.35,.22)},{label:'轴承座B',color:'#b4a078',edges:box(.82,.26,0,.22,.35,.22)},
    {label:'联轴器',color:'#c88c78',edges:cyl(.88,.26,0,.15,.2,10)},{label:'电机',color:'#a08cc8',edges:box(1.22,.26,0,.28,.35,.25)},
    {label:'电机座',color:'#8cb4c8',edges:box(1.22,.06,0,.24,.06,.22)},{label:'螺母',color:'#c4a470',edges:box(0,.7,0,.2,.16,.2)},
    {label:'滑块',color:'#78b4a0',edges:box(-.85,.23,-.24,.15,.1,.12)},{label:'端盖A',color:'#9e8e78',edges:box(-.82,.61,0,.2,.04,.2)},
    {label:'端盖B',color:'#9e8e78',edges:box(.82,.61,0,.2,.04,.2)},{label:'密封圈',color:'#78b4c8',edges:box(-.82,.56,0,.18,.02,.18)},
    {label:'限位开关',color:'#d48878',edges:box(1.1,.06,.4,.12,.06,.05)},
  ].map(p=>gradual?{...p,alpha:0,target:0,labelPos:null}:{...p,alpha:1,target:1,labelPos:null});
  _3dParts.forEach(p=>{p.labelPos=p.edges[0]?[(p.edges[0][0]+p.edges[0][3])/2,(p.edges[0][1]+p.edges[0][4])/2,(p.edges[0][2]+p.edges[0][5])/2]:[0,0,0];});

  function draw(){
    if(!document.getElementById('sideCanvas')){graphAnim=requestAnimationFrame(draw);return;}
    ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='rgba(10,13,19,.6)';ctx.fillRect(0,0,c.width,c.height);
    if(!drag)ry+=.003;
    const segs=[];
    _3dParts.forEach(p=>{
      p.alpha+=Math.max(0,(p.target-p.alpha)*.08);
      if(p.alpha<.02)return;
      for(let i=0;i<p.edges.length;i++){
        const e=p.edges[i];const a=proj(e[0],e[1],e[2]),b=proj(e[3],e[4],e[5]);
        segs.push({x1:a.x,y1:a.y,x2:b.x,y2:b.y,z:(a.z+b.z)/2,color:p.color,alpha:p.alpha});
      }
    });
    segs.sort((a,b)=>a.z-b.z);
    segs.forEach(s=>{ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.strokeStyle=s.color+Math.floor(s.alpha*204).toString(16).padStart(2,'0');ctx.lineWidth=1;ctx.stroke();});
    _3dParts.forEach(p=>{
      if(p.alpha<.02)return;
      const pt=proj(p.labelPos[0],p.labelPos[1],p.labelPos[2]);
      ctx.fillStyle=`rgba(255,255,255,${(p.alpha*.7).toFixed(2)})`;
      ctx.font='10px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText(p.label,pt.x,pt.y-5);
    });
    graphAnim=requestAnimationFrame(draw);
  }
  draw();
}

function update3DPart(name){
  if(!_3dParts)return;
  const p=_3dParts.find(x=>x.label===name);
  if(p)p.target=1;
}

// ── Chat after demo ──
function enableChat(){
  chatReady=true;
  $chatInput.disabled=false;
  $sendBtn.disabled=false;
  $sendBtn.classList.add('enabled');
  $chatInput.placeholder='结束，输入你的问题开始对话...';
  setStep('✅ 完成 | 💬 可自由对话');
  $chatInput.focus();
}

$chatInput.addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});

$chatInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
});

async function sendChat(){
  const text=$chatInput.value.trim();
  if(!text||!chatReady)return;
  $chatInput.value='';$chatInput.style.height='auto';
  $chatInput.disabled=true;$sendBtn.disabled=true;
  $sendBtn.classList.remove('enabled');
  $stepLabel.textContent='💬 对话中';

  addMsg('user',text);
  currentTurn=newTurn();
  setPhase('thinking');

  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,session_id:sessionId}),
    });
    if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buf='';
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop();
      for(const line of lines){
        if(line.startsWith('data: ')){
          try{handleChatEvent(JSON.parse(line.slice(6)));}catch(e){}
        }
      }
    }
  }catch(err){
    addSys(`❌ ${err.message}`);
  }
  $chatInput.disabled=false;
  $sendBtn.disabled=false;
  $sendBtn.classList.add('enabled');
  $chatInput.focus();
  $stepLabel.textContent='✅ 完成 | 💬 可自由对话';
}

function handleChatEvent(ev){
  switch(ev.type){
    case'session':sessionId=ev.session_id;break;
    case'phase':setPhase(ev.phase);break;
    case'text':appendChatText(ev.text);break;
    case'tool_start':addToolCard(ev.name,ev.args||{},ev.idx);setPhase('tool_calling');break;
    case'tool_done':finishToolCard(ev.name,ev.result,ev.elapsed);break;
    case'tool_fail':finishToolCard(ev.name,ev.error||'fail',ev.elapsed,true);break;
    case'done':
      if(ev.output?.trim())addMsg('assistant',marked.parse(ev.output));
      if(ev.usage){tokens+=(ev.usage.input_tokens||0)+(ev.usage.output_tokens||0);$tokenCount.textContent=tokens.toLocaleString();}
      setPhase('done');break;
    case'error':addSys(`❌ ${ev.message}`);break;
  }
  scroll();
}

function appendChatText(text){
  if(!currentTurn)return;
  let replyEl=currentTurn.querySelector('.reply-text');
  if(!replyEl){
    replyEl=document.createElement('div');
    replyEl.className='msg msg-assistant reply-text';
    currentTurn.appendChild(replyEl);
  }
  const cleaned=text.replace(/<ancode>[\s\S]*?<\/ancode>/g,'').replace(/<tool_call>[\s\S]*?<\/tool_call>/g,'').replace(/<antml>[\s\S]*?<\/antml>/g,'');
  const bare=cleaned.replace(/\{"name"\s*:\s*"[^"]*"\s*,\s*"arguments"\s*:\s*\{[^}]*\}\s*\}/g,'');
  if(bare.trim())replyEl.innerHTML=marked.parse(bare);
}

function addToolCard(name,args,idx){
  if(!currentTurn)return;
  let card=document.createElement('div');
  card.className='tool-card running';
  card.id='tool-'+name+'-'+idx;
  let argsStr=args&&Object.keys(args).length?Object.keys(args).map(k=>k+': '+JSON.stringify(args[k])).join(', ').slice(0,55):'';
  card.innerHTML=`<div class="tool-card-header">
    <span class="tool-icon"><span class="spinner"></span></span>
    <span class="tool-name">${esc(name)}</span>
    ${argsStr?`<span class="tool-args">${esc(argsStr)}</span>`:''}
    <span class="tool-elapsed">...</span>
  </div>`;
  card._startTime=Date.now();
  currentTurn.appendChild(card);
  toolIdx++;$toolCount.textContent=toolIdx;
  scroll();
}

function finishToolCard(name,result,elapsed,isError){
  const cards=document.querySelectorAll('.tool-card');
  for(const card of cards){
    const n=card.querySelector('.tool-name');
    if(n&&n.textContent===name){
      card.className='tool-card '+(isError?'fail':'done');
      const icon=card.querySelector('.tool-icon');
      icon.innerHTML=isError?'✕':'✓';
      icon.className='tool-icon '+(isError?'fail':'done');
      const el=card.querySelector('.tool-elapsed');
      el.textContent=(elapsed||((Date.now()-card._startTime)/1000)).toFixed(1)+'s';
      if(result){
        let rd=document.createElement('div');
        rd.className='tool-result';
        rd.textContent=result.slice(0,200);
        card.appendChild(rd);
      }
      break;
    }
  }
  scroll();
}
