let _R,_S,_CAM,_CTL,_DATA=null,_GRP={},_NAMES=[],_loaded=false;

window._vAll=v=>{Object.values(_GRP).forEach(g=>g.visible=v);};
window._vFit=()=>{
  if(!_loaded||!_CAM||!_CTL)return;
  const box=new TH.Box3();Object.values(_GRP).forEach(g=>{if(g.visible)box.expandByObject(g);});
  if(box.isEmpty())return;
  const ctr=new TH.Vector3();box.getCenter(ctr);
  const sz=new TH.Vector3();box.getSize(sz);
  const mx=Math.max(sz.x,sz.y,sz.z);
  _CAM.position.set(ctr.x+mx*.8,ctr.y+mx*.6,ctr.z+mx);
  _CTL.target.copy(ctr);_CTL.update();
};
window.__vLoadAll=()=>{_buildAll();};
window.__vCadModel=()=>{_buildAll();};
window.__vCadDraw=()=>{_buildAll();};

async function _loadData(){
  try{
    const b=_CHUNKS.join(""),bin=atob(b),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const ds=new DecompressionStream("gzip");
    const w=ds.writable.getWriter();w.write(bytes);w.close();
    const r=ds.readable.getReader();
    const parts=[];while(true){const {done,value}=await r.read();if(done)break;parts.push(value);}
    let len=0;for(const c of parts)len+=c.length;
    const result=new Uint8Array(len);let off=0;
    for(const c of parts){result.set(c,off);off+=c.length;}
    _DATA=JSON.parse(new TextDecoder().decode(result));
    _NAMES=Object.keys(_DATA).sort();
    _buildAll();
  }catch(e){console.error(e);}
}

function _sampleArc(v1,v2,center,radius,normal,segments){
  const c=new TH.Vector3(center[0],center[1],center[2]);
  const n=new TH.Vector3(normal[0],normal[1],normal[2]).normalize();
  const p1=new TH.Vector3(v1[0],v1[1],v1[2]).sub(c);
  const p2=new TH.Vector3(v2[0],v2[1],v2[2]).sub(c);
  const avgR=(p1.length()+p2.length())/2;
  p1.normalize();p2.normalize();
  let ang=Math.acos(Math.min(1,Math.max(-1,p1.dot(p2))));
  const cross=new TH.Vector3().crossVectors(p1,p2);
  if(cross.dot(n)<0)ang=2*Math.PI-ang;
  if(ang<.001)ang=2*Math.PI;
  const pts=[];
  for(let i=0;i<=segments;i++){
    const a=(i/segments)*ang,nxv=new TH.Vector3().crossVectors(n,p1);
    pts.push(new TH.Vector3().addScaledVector(p1,Math.cos(a)).addScaledVector(nxv,Math.sin(a)).normalize().multiplyScalar(avgR).add(c));
  }
  return pts;
}

function _buildEdgeLine(edge,color){
  const v=edge.v;if(!v||v.length<2)return null;
  if(edge.t==="line"){
    const g=new TH.BufferGeometry().setFromPoints([new TH.Vector3(v[0][0],v[0][1],v[0][2]),new TH.Vector3(v[1][0],v[1][1],v[1][2])]);
    return new TH.Line(g,new TH.LineBasicMaterial({color,transparent:true,opacity:.85}));
  }
  if(edge.t==="circle"||edge.t==="arc"){
    const p=edge.p||{},cp=p.center_point||[0,0,0],r=p.radius||1,n=p.normal_vector||[0,0,1];
    const pts=_sampleArc(v[0],v[1],cp,r,n,AS);
    return new TH.Line(new TH.BufferGeometry().setFromPoints(pts),new TH.LineBasicMaterial({color,transparent:true,opacity:.85}));
  }
  if(edge.t==="bspline_curve"){
    const pp=edge.p||{};
    if(pp.control_poles&&pp.knot_vector&&pp.degree!=null){
      const pts=_sampleBSpline(pp,AS*2);
      if(pts.length>=2)return new TH.Line(new TH.BufferGeometry().setFromPoints(pts),new TH.LineBasicMaterial({color:0xaaaaaa,transparent:true,opacity:.7}));
    }
    return new TH.Line(new TH.BufferGeometry().setFromPoints([new TH.Vector3(v[0][0],v[0][1],v[0][2]),new TH.Vector3(v[1][0],v[1][1],v[1][2])]),new TH.LineBasicMaterial({color:0xaaaaaa,transparent:true,opacity:.7}));
  }
  if(v.length>=2){
    const pts=v.map(p=>new TH.Vector3(p[0],p[1],p[2]));
    return new TH.Line(new TH.BufferGeometry().setFromPoints(pts),new TH.LineBasicMaterial({color:0x666666,transparent:true,opacity:.6}));
  }
  return null;
}

function _sampleBSpline(params,segments){
  const degree=params.degree,poles=params.control_poles||[],knots=params.knot_vector||[],weights=params.weights||null;
  const n=poles.length-1;if(n<degree||knots.length<n+degree+2)return[];
  const tMin=knots[degree],tMax=knots[n+1],pts=[];
  for(let i=0;i<=segments;i++){const t=tMin+(i/segments)*(tMax-tMin),pt=_evalBSpline(degree,poles,knots,t,weights);if(pt)pts.push(pt);}
  return pts;
}
function _evalBSpline(degree,poles,knots,t,weights){
  const n=poles.length-1,span=_findSpan(n,degree,t,knots);
  const N=new Array(degree+1).fill(0);_basisFuns(span,t,degree,knots,N);
  let wx=0,wy=0,wz=0,w=0;
  for(let i=0;i<=degree;i++){const idx=span-degree+i,wi=weights?weights[idx]:1,Ni=N[i];wx+=Ni*wi*poles[idx][0];wy+=Ni*wi*poles[idx][1];wz+=Ni*wi*poles[idx][2];w+=Ni*wi;}
  if(Math.abs(w)<1e-12)return null;
  return new TH.Vector3(wx/w,wy/w,wz/w);
}
function _findSpan(n,p,u,knots){if(u>=knots[n+1])return n;if(u<=knots[p])return p;let low=p,high=n+1,mid=Math.floor((low+high)/2);while(u<knots[mid]||u>=knots[mid+1]){if(u<knots[mid])high=mid;else low=mid;mid=Math.floor((low+high)/2);}return mid;}
function _basisFuns(i,u,p,knots,N){N[0]=1;const left=new Array(p+1),right=new Array(p+1);for(let j=1;j<=p;j++){left[j]=u-knots[i+1-j];right[j]=knots[i+j]-u;let saved=0;for(let r=0;r<j;r++){const temp=N[r]/(right[r+1]+left[j-r]);N[r]=saved+right[r+1]*temp;saved=left[j-r]*temp;}N[j]=saved;}}

function _dedup(pts,tol){const r=[];for(const p of pts){let dup=false;for(const q of r){if(p.distanceToSquared(q)<tol*tol){dup=true;break;}}if(!dup)r.push(p.clone());}return r;}

function _buildPlaneFill(face,color){
  const allPts=[];
  for(const e of face.e){
    const v=e.v;if(!v||v.length<2)continue;
    if(e.t==="line"){allPts.push(new TH.Vector3(v[0][0],v[0][1],v[0][2]));}
    else if(e.t==="arc"||e.t==="circle"){const p=e.p||{},cp=p.center_point||[0,0,0],r=p.radius||1,n=p.normal_vector||[0,0,1];const arcPts=_sampleArc(v[0],v[1],cp,r,n,24);for(let i=0;i<arcPts.length-1;i++)allPts.push(arcPts[i]);}
    else{allPts.push(new TH.Vector3(v[0][0],v[0][1],v[0][2]));}
  }
  if(allPts.length<3)return null;
  const dp=_dedup(allPts,.001);if(dp.length<3)return null;
  let cent=new TH.Vector3();dp.forEach(p=>cent.add(p));cent.divideScalar(dp.length);
  let normal=new TH.Vector3();
  for(let i=0;i<dp.length;i++){const j=(i+1)%dp.length;normal.x+=(dp[i].y-dp[j].y)*(dp[i].z+dp[j].z);normal.y+=(dp[i].z-dp[j].z)*(dp[i].x+dp[j].x);normal.z+=(dp[i].x-dp[j].x)*(dp[i].y+dp[j].y);}
  normal.normalize();
  const ref=Math.abs(normal.x)<.9?new TH.Vector3(1,0,0):new TH.Vector3(0,1,0);
  const u=new TH.Vector3().crossVectors(normal,ref).normalize();
  const v=new TH.Vector3().crossVectors(normal,u).normalize();
  const proj=dp.map(p=>new TH.Vector2(p.dot(u),p.dot(v)));
  try{
    const shape=new TH.Shape(proj),sg=new TH.ShapeGeometry(shape);
    const mesh=new TH.Mesh(sg,new TH.MeshPhongMaterial({color,transparent:true,opacity:.25,side:TH.DoubleSide,depthWrite:false,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
    const m=new TH.Matrix4();m.makeBasis(u,v,normal);m.setPosition(cent.clone().addScaledVector(normal,-cent.dot(normal)));
    const im=new TH.Matrix4().copy(m).invert();mesh.geometry.applyMatrix4(im);mesh.applyMatrix4(m);
    return mesh;
  }catch(e){return null;}
}

function _buildCylWireframe(face,color){
  const g=new TH.Group();
  const fp=face.fp||{},axis=new TH.Vector3((fp.axis_direction||[0,0,1])[0],(fp.axis_direction||[0,0,1])[1],(fp.axis_direction||[0,0,1])[2]).normalize();
  const radius=fp.radius||1;
  const ortho=Math.abs(axis.x)<.9?new TH.Vector3(1,0,0):new TH.Vector3(0,1,0);
  const u=new TH.Vector3().crossVectors(axis,ortho).normalize(),v=new TH.Vector3().crossVectors(axis,u).normalize();
  let minP=Infinity,maxP=-Infinity;
  for(const e of face.e){for(const vt of e.v||[]){const pt=new TH.Vector3(vt[0],vt[1],vt[2]),proj=pt.dot(axis);if(proj<minP)minP=proj;if(proj>maxP)maxP=proj;}}
  const h=maxP-minP;if(h<.001)return g;
  const CS=64,tc=axis.clone().multiplyScalar(maxP),bc=axis.clone().multiplyScalar(minP);
  const tp=[],bp=[];
  for(let i=0;i<=CS;i++){const a=(i/CS)*Math.PI*2,dx=u.clone().multiplyScalar(Math.cos(a)*radius),dy=v.clone().multiplyScalar(Math.sin(a)*radius),off=dx.add(dy);tp.push(tc.clone().add(off));bp.push(bc.clone().add(off));}
  g.add(new TH.Line(new TH.BufferGeometry().setFromPoints(tp),new TH.LineBasicMaterial({color,transparent:true,opacity:.6})));
  g.add(new TH.Line(new TH.BufferGeometry().setFromPoints(bp),new TH.LineBasicMaterial({color,transparent:true,opacity:.6})));
  for(let i=0;i<4;i++){const idx=Math.floor(i*CS/4);g.add(new TH.Line(new TH.BufferGeometry().setFromPoints([tp[idx],bp[idx]]),new TH.LineBasicMaterial({color,transparent:true,opacity:.4})));}
  return g;
}

function _buildSolid(name,idx){
  const data=_DATA[name];if(!data||!_S)return;
  const color=SC[idx%15],group=new TH.Group(),faces=data.f||[];group.name=name;
  for(const f of faces){
    const ft=f.ft||"other_surface",ec=FC[ft]||0x888888;
    for(const e of f.e||[]){const line=_buildEdgeLine(e,ec);if(line)group.add(line);}
    if(ft==="plane"&&(f.e||[]).length>=3){const fill=_buildPlaneFill(f,color);if(fill){fill.visible=false;fill.userData={solidName:name};group.add(fill);}}
    else if(ft==="cylinder"){const cw=_buildCylWireframe(f,ec);if(cw)group.add(cw);}
  }
  group.userData={solidName:name,faceCount:faces.length};
  _S.add(group);_GRP[name]=group;
}

function _buildAll(){
  const stat=document.getElementById("_vStat");
  let count=0;
  Object.values(_GRP).forEach(g=>{_S.remove(g);});
  _GRP={};
  _NAMES.forEach((name,i)=>{
    setTimeout(()=>{_buildSolid(name,i);count++;if(stat)stat.textContent="加载 "+count+" / "+_NAMES.length;},(i+1)*25);
  });
  setTimeout(()=>{
    _loaded=true;
    const box=new TH.Box3();Object.values(_GRP).forEach(g=>box.expandByObject(g));
    if(!box.isEmpty()){
      const ctr=new TH.Vector3();box.getCenter(ctr);
      const sz=new TH.Vector3();box.getSize(sz);
      const mx=Math.max(sz.x,sz.y,sz.z);
      _CAM.position.set(ctr.x+mx*.8,ctr.y+mx*.6,ctr.z+mx);
      _CTL.target.copy(ctr);_CTL.update();
    }
    if(stat)stat.textContent="共 "+_NAMES.length+" 个零件";
    _updateStats();
    _renderSidebar();
  },_NAMES.length*25+1000);
}

function _updateStats(){
  let tv=0,tl=0,vf=0;
  Object.values(_GRP).forEach(g=>{
    if(!g.visible)return;
    g.children.forEach(c=>{
      if(c.isLine&&c.geometry&&c.geometry.attributes&&c.geometry.attributes.position)tv+=c.geometry.attributes.position.count;
    });
    tl+=g.children.filter(c=>c.isLine).length;
    vf+=g.userData?.faceCount||0;
  });
  const info=document.getElementById("_vInfo");
  if(info)info.textContent="顶点: "+tv.toLocaleString()+" | 线: "+tl.toLocaleString()+" | 面: "+vf.toLocaleString();
}

function _renderSidebar(){
  const list=document.getElementById("_vList");if(!list)return;
  const Q="'";
  list.innerHTML=_NAMES.map((n,i)=>
    '<div class="_vItem" data-name="'+n+'" onclick="var g=window._GRP&&window._GRP['+Q+n+Q+'];if(g){g.visible=!g.visible;this.classList.toggle('+Q+'on'+Q+',g.visible);}" style="display:flex;align-items:center;padding:4px 14px;cursor:pointer;font-size:.65rem;gap:6px;color:var(--text-dim)"><span class="_vDot" style="width:9px;height:9px;border-radius:2px;flex-shrink:0;background:#'+SC[i%15].toString(16).padStart(6,'0')+'"></span><span>'+n+'</span></div>'
  ).join('');
  const stat=document.getElementById("_vStat");
  if(stat)stat.textContent="共 "+_NAMES.length+" 个零件";
}

window.__doInit = function init(){
  const root=document.getElementById("_vRoot");
  if(!root)return;
  window.__doInit=null;
  const info=document.getElementById("_vInfo");
  const stat=document.getElementById("_vStat");
  if(stat)stat.textContent="正在连接...";
  if(info)info.textContent="顶点: 0 | 线: 0 | 面: 0";

  _R=new TH.WebGLRenderer({antialias:true});
  _R.setSize(root.clientWidth,root.clientHeight);
  _R.setPixelRatio(Math.min(window.devicePixelRatio,2));
  _R.setClearColor(0x0a0d13);
  root.insertBefore(_R.domElement,root.firstChild);

  _S=new TH.Scene();
  _S.fog=new TH.Fog(0x0a0d13,30,3000);

  _CAM=new TH.PerspectiveCamera(45,root.clientWidth/root.clientHeight,.1,5000);
  _CAM.position.set(100,80,150);_CAM.lookAt(0,0,0);

  _CTL=new OrbitControls(_CAM,_R.domElement);
  _CTL.enableDamping=true;_CTL.dampingFactor=.08;_CTL.target.set(0,0,0);_CTL.update();

  _S.add(new TH.AmbientLight(0x404060,.6));
  const d1=new TH.DirectionalLight(0xffffff,.8);d1.position.set(1,2,1);_S.add(d1);
  const d2=new TH.DirectionalLight(0x4488cc,.3);d2.position.set(-1,-.5,-.5);_S.add(d2);
  const g=new TH.GridHelper(200,20,0x333355,0x222244);g.position.y=-100;_S.add(g);

  window._GRP=_GRP;

  (function anim(){requestAnimationFrame(anim);_CTL.update();_R.render(_S,_CAM);})();

  window.addEventListener("resize",()=>{
    if(!_CAM||!_R)return;
    _CAM.aspect=root.clientWidth/root.clientHeight;_CAM.updateProjectionMatrix();
    _R.setSize(root.clientWidth,root.clientHeight);
  });

  if(info)info.textContent="顶点: 0 | 线: 0 | 面: 0";
  if(stat)stat.textContent="正在加载...";
  _loadData();
};

if(document.getElementById("_vRoot"))window.__doInit();
</script>
