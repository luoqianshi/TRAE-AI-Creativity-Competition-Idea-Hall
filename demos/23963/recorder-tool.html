  <script>
    (function () {
      /* ---- 元素引用 ---- */
      const btn      = document.getElementById('btnRecord');
      const iconMic  = document.getElementById('iconMic');
      const timerEl  = document.getElementById('timer');
      const statusEl = document.getElementById('status');
      const canvas   = document.getElementById('waveCanvas');
      const ctx      = canvas.getContext('2d');
      const listEl   = document.getElementById('recordings');
      const toast    = document.getElementById('errorToast');
      const transcriptSection = document.getElementById('transcriptSection');
      const transcriptText    = document.getElementById('transcriptText');
      const btnAiNote         = document.getElementById('btnAiNote');
      const notesPanel        = document.getElementById('notesPanel');
      const topicsList        = document.getElementById('topicsList');
      const todoList          = document.getElementById('todoList');
      const conclusionList    = document.getElementById('conclusionList');

      /* ---- 状态 ---- */
      let mediaRecorder = null;
      let audioCtx      = null;
      let analyser      = null;
      let chunks        = [];
      let recording     = false;
      let startTime     = 0;
      let tickTimer      = null;
      let animFrame      = null;
      let recordings     = [];

      /* ---- Canvas 尺寸 ---- */
      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width  = rect.width * devicePixelRatio;
        canvas.height = rect.height * devicePixelRatio;
        ctx.scale(devicePixelRatio, devicePixelRatio);
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      /* ---- 提示 ---- */
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      }

      /* ---- 格式化时间 ---- */
      function fmt(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(Math.floor(sec % 60)).padStart(2, '0');
        return m + ':' + s;
      }

      /* ---- 计时器 ---- */
      function startTick() {
        startTime = Date.now();
        timerEl.classList.add('active');
        tickTimer = setInterval(() => {
          timerEl.textContent = fmt((Date.now() - startTime) / 1000);
        }, 200);
      }
      function stopTick() {
        clearInterval(tickTimer);
        timerEl.classList.remove('active');
      }

      /* ---- 波形绘制 ---- */
      function drawWave() {
        if (!analyser) return;
        const bufLen = analyser.frequencyBinCount;
        const data   = new Uint8Array(bufLen);
        analyser.getByteTimeDomainData(data);

        const w = canvas.width / devicePixelRatio;
        const h = canvas.height / devicePixelRatio;

        ctx.clearRect(0, 0, w, h);

        // 静态中线
        ctx.strokeStyle = 'rgba(139,143,163,0.15)';
        ctx.lineWidth   = 1;
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();

        // 波形
        const color = recording ? '#2ecc71' : '#e74c5e';
        ctx.strokeStyle = color;
        ctx.lineWidth   = 2;
        ctx.beginPath();

        const sliceW = w / bufLen;
        let x = 0;
        for (let i = 0; i < bufLen; i++) {
          const v = data[i] / 128.0;
          const y = (v * h) / 2;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceW;
        }
        ctx.lineTo(w, h / 2);
        ctx.stroke();

        animFrame = requestAnimationFrame(drawWave);
      }

      function stopWave() {
        cancelAnimationFrame(animFrame);
        // 清空画布
        const w = canvas.width / devicePixelRatio;
        const h = canvas.height / devicePixelRatio;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(139,143,163,0.15)';
        ctx.lineWidth   = 1;
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();
      }

      /* ---- 渲染列表 ---- */
      function renderList() {
        if (recordings.length === 0) {
          listEl.innerHTML = '<div class="empty-hint">暂无录音</div>';
          return;
        }
        listEl.innerHTML = recordings.map(function (r, i) {
          return '<div class="rec-item">' +
            '<span class="rec-name">录音 ' + (i + 1) + '</span>' +
            '<span class="rec-dur">' + fmt(r.duration) + '</span>' +
            '<button data-idx="' + i + '">下载</button>' +
          '</div>';
        }).join('');

        listEl.querySelectorAll('button').forEach(function (b) {
          b.addEventListener('click', function () {
            const idx = +this.getAttribute('data-idx');
            const r   = recordings[idx];
            const a   = document.createElement('a');
            a.href     = URL.createObjectURL(r.blob);
            a.download = '录音_' + (idx + 1) + '.webm';
            a.click();
            URL.revokeObjectURL(a.href);
          });
        });
      }

      /* ---- 模拟会议录音稿 ---- */
      const MOCK_TRANSCRIPT =
        '<span class="timestamp">00:12</span><span class="speaker">主持人（张经理）：</span>大家好，今天我们来讨论一下如何提升团队协作效率。首先，我想听听大家对目前协作流程的看法，有没有觉得哪里可以改进的？\n\n' +
        '<span class="timestamp">00:34</span><span class="speaker">李明（产品经理）：</span>我觉得我们目前的沟通工具太分散了，Slack、邮件、飞书都在用，信息经常在不同平台之间来回跳转，导致很多信息遗漏。\n\n' +
        '<span class="timestamp">01:05</span><span class="speaker">王芳（技术主管）：</span>我同意李明的观点。另外，我们的周会效率也有待提高，每次会议时间都在一小时以上，但很多内容其实可以通过异步文档解决。\n\n' +
        '<span class="timestamp">01:28</span><span class="speaker">陈杰（设计师）：</span>从设计团队的角度，我觉得需求文档的规范度不够，很多时候需求变更没有同步到设计侧，导致返工。\n\n' +
        '<span class="timestamp">02:01</span><span class="speaker">主持人（张经理）：</span>好的，我总结一下大家提到的几个核心问题：一是沟通工具分散，二是会议效率低，三是需求同步不及时。接下来我们逐一讨论解决方案。\n\n' +
        '<span class="timestamp">02:30</span><span class="speaker">李明（产品经理）：</span>关于沟通工具，我建议统一使用飞书作为内部主要沟通平台，Slack 只用于和海外团队的对接。\n\n' +
        '<span class="timestamp">03:05</span><span class="speaker">王芳（技术主管）：</span>会议方面，我建议推行"25分钟会议制"，所有内部会议默认25分钟，超时需要申请延期。同时，会前必须发议程，会后必须发纪要。\n\n' +
        '<span class="timestamp">03:42</span><span class="speaker">陈杰（设计师）：</span>需求同步这块，我建议所有需求变更必须通过飞书文档进行记录，并@相关人，确保信息触达。\n\n' +
        '<span class="timestamp">04:15</span><span class="speaker">主持人（张经理）：</span>非常好，大家的建议都很具体。那我们今天就把这三项作为行动项，下周一我来跟进落实情况。还有其他补充吗？\n\n' +
        '<span class="timestamp">04:38</span><span class="speaker">李明（产品经理）：</span>没有了，我觉得今天的讨论很有成效。\n\n' +
        '<span class="timestamp">04:45</span><span class="speaker">主持人（张经理）：</span>好的，那今天的会议就到这里，谢谢大家。';

      /* ---- AI 笔记内容 ---- */
      const AI_TOPICS = [
        '沟通工具过于分散（Slack、邮件、飞书混用）',
        '周会效率低下，时间过长且内容冗余',
        '需求文档规范度不足，变更同步不及时'
      ];

      const AI_TODOS = [
        '统一内部沟通平台为飞书，Slack 仅用于海外对接',
        '推行"25分钟会议制"，会前发议程、会后发纪要',
        '所有需求变更通过飞书文档记录并@相关人员',
        '张经理下周一跟进三项行动项的落实情况'
      ];

      const AI_CONCLUSIONS = [
        '团队共识：当前协作痛点集中在"信息分散"和"同步滞后"',
        '解决方案：统一工具 + 规范流程 + 限时会议',
        '下一步：由张经理牵头，在一周内完成工具迁移和制度落地',
        '预期效果：减少信息遗漏，缩短会议时间，降低设计返工率'
      ];

      /* ---- 显示模拟转写 ---- */
      function showTranscript() {
        transcriptText.innerHTML = MOCK_TRANSCRIPT;
        transcriptSection.classList.add('visible');
        notesPanel.classList.remove('visible');
        btnAiNote.style.display = 'flex';
        // 滚动到转写区域
        setTimeout(function () {
          transcriptSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      }

      /* ---- 生成 AI 笔记 ---- */
      function generateAiNotes() {
        topicsList.innerHTML     = AI_TOPICS.map(function (t) { return '<li>' + t + '</li>'; }).join('');
        todoList.innerHTML       = AI_TODOS.map(function (t) { return '<li>' + t + '</li>'; }).join('');
        conclusionList.innerHTML = AI_CONCLUSIONS.map(function (t) { return '<li>' + t + '</li>'; }).join('');

        notesPanel.classList.add('visible');
        btnAiNote.style.display = 'none';
      }

      /* ---- 开始录音 ---- */
      async function startRecording() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

          audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          mediaRecorder = new MediaRecorder(stream);
          chunks = [];

          mediaRecorder.ondataavailable = function (e) {
            if (e.data.size > 0) chunks.push(e.data);
          };

          mediaRecorder.onstop = function () {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const duration = (Date.now() - startTime) / 1000;
            recordings.push({ blob: blob, duration: duration });
            renderList();

            // 停止所有轨道
            stream.getTracks().forEach(function (t) { t.stop(); });
            audioCtx.close();
            audioCtx  = null;
            analyser  = null;

            // 显示模拟转写
            showTranscript();
          };

          mediaRecorder.start();
          recording = true;

          btn.classList.add('recording');
          statusEl.textContent = '正在录音…';
          statusEl.classList.add('recording');

          startTick();
          drawWave();

        } catch (err) {
          showToast('无法访问麦克风，请检查浏览器权限设置');
          console.error(err);
        }
      }

      /* ---- 停止录音 ---- */
      function stopRecording() {
        if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
        mediaRecorder.stop();
        recording = false;

        btn.classList.remove('recording');
        statusEl.textContent = '点击按钮开始录音';
        statusEl.classList.remove('recording');

        stopTick();
        stopWave();
        timerEl.textContent = '00:00';
      }

      /* ---- 按钮事件 ---- */
      btn.addEventListener('click', function () {
        if (!recording) startRecording();
        else stopRecording();
      });

      btnAiNote.addEventListener('click', generateAiNotes);

    })();
  </script>
</body>
</html>
