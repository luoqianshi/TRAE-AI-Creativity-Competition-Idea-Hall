<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>社区好物漂流 · 小程序原型</title>
  <!-- Font Awesome (图标库) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 手机卡片容器 — 模拟小程序界面 */
    .phone-frame {
      max-width: 380px;
      width: 100%;
      background: #ffffff;
      border-radius: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 0 0 10px #e8ecf1;
      overflow: hidden;
      position: relative;
      transition: transform 0.2s ease;
    }

    .phone-frame:hover {
      transform: scale(1.01);
    }

    /* 状态栏 + 导航 */
    .status-bar {
      padding: 14px 20px 6px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 500;
      color: #1c1e24;
      background: #ffffff;
      border-bottom: 1px solid #f0f2f6;
    }

    .status-bar i {
      color: #4a4e5a;
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 20px 14px 20px;
      background: #ffffff;
      border-bottom: 1px solid #f0f2f6;
    }

    .nav-header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #0b2b3c;
    }

    .nav-header h1 i {
      color: #2a9d8f;
      margin-right: 6px;
    }

    .nav-actions i {
      font-size: 20px;
      margin-left: 16px;
      color: #3d4a5a;
    }

    /* 主内容区域 — 可滚动 */
    .main-content {
      padding: 16px 16px 100px 16px;
      background: #f8fafc;
    }

    /* 分类标签 */
    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 16px;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .category-tabs span {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      color: #3d4a5a;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      border: 1px solid #e9edf2;
      transition: all 0.1s;
    }

    .category-tabs span.active {
      background: #1d3b4c;
      color: white;
      border-color: #1d3b4c;
      box-shadow: 0 4px 8px rgba(29, 59, 76, 0.12);
    }

    .category-tabs span i {
      margin-right: 6px;
    }

    /* 物品卡片列表 */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 4px;
    }

    .item-card {
      background: white;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      border: 1px solid #eef2f7;
      display: flex;
      gap: 16px;
      transition: all 0.15s;
      cursor: default;
    }

    .item-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .item-img {
      width: 80px;
      height: 80px;
      background: #e9edf2;
      border-radius: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #728197;
      font-size: 32px;
      background: #eef3fa;
    }

    .item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-info h3 {
      font-size: 16px;
      font-weight: 600;
      color: #0b1a26;
      margin-bottom: 4px;
    }

    .item-info .desc {
      font-size: 13px;
      color: #5a6b7c;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .item-info .desc i {
      color: #8b9aad;
      font-size: 12px;
    }

    .item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .item-meta .owner {
      font-size: 12px;
      color: #617182;
      background: #f0f4fa;
      padding: 4px 10px;
      border-radius: 30px;
    }

    .item-meta .distance {
      font-size: 12px;
      color: #5a6b7c;
    }

    .item-meta .distance i {
      margin-right: 4px;
      color: #2a9d8f;
    }

    .tag-status {
      background: #e4f2ef;
      color: #1a6d63;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 12px;
      border-radius: 30px;
      display: inline-block;
    }

    .tag-status.available {
      background: #e3f2ed;
      color: #126b5e;
    }

    .tag-status.rented {
      background: #f1f1f4;
      color: #6d7b8c;
    }

    /* 发布按钮（浮动） */
    .float-action {
      position: sticky;
      bottom: 20px;
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .btn-post {
      background: #1d3b4c;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 60px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(29, 59, 76, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
      cursor: pointer;
      border: 1px solid #2f5266;
      letter-spacing: 0.3px;
    }

    .btn-post i {
      font-size: 18px;
    }

    .btn-post:hover {
      background: #14303e;
      box-shadow: 0 8px 28px rgba(29, 59, 76, 0.4);
      transform: scale(1.02);
    }

    /* 详情弹窗 (模拟) */
    .detail-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      align-items: flex-end;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .detail-overlay.active {
      display: flex;
    }

    .detail-card {
      background: white;
      max-width: 380px;
      width: 100%;
      border-radius: 32px 32px 32px 32px;
      padding: 24px 20px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .detail-card .close-btn {
      text-align: right;
      font-size: 24px;
      color: #7b8b9e;
      cursor: pointer;
      margin-bottom: 6px;
    }

    .detail-card .big-icon {
      font-size: 60px;
      background: #eef3fa;
      width: 100%;
      border-radius: 24px;
      padding: 30px 0;
      text-align: center;
      color: #3f5a6b;
      margin-bottom: 16px;
    }

    .detail-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #0b1a26;
    }

    .detail-card .detail-meta {
      display: flex;
      gap: 12px;
      margin: 8px 0 16px;
      font-size: 14px;
      color: #4e6277;
    }

    .detail-card .detail-meta span {
      background: #f2f6fc;
      padding: 4px 14px;
      border-radius: 30px;
    }

    .detail-card p {
      color: #334654;
      line-height: 1.6;
      margin: 12px 0 18px;
    }

    .detail-card .action-row {
      display: flex;
      gap: 12px;
    }

    .detail-card .action-row button {
      flex: 1;
      padding: 14px 0;
      border-radius: 60px;
      border: none;
      font-weight: 600;
      font-size: 16px;
      background: #eef2f7;
      color: #1d3b4c;
    }

    .detail-card .action-row .primary {
      background: #1d3b4c;
      color: white;
      box-shadow: 0 4px 12px rgba(29, 59, 76, 0.25);
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #8f9eb0;
      padding: 16px 0 8px;
      border-top: 1px solid #eef2f6;
      margin-top: 12px;
    }

    /* 响应式微调 */
    @media (max-width: 420px) {
      .phone-frame {
        border-radius: 28px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.10);
      }
    }
  </style>
</head>
<body>

<div class="phone-frame">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span>9:41</span>
    <span><i class="fas fa-signal"></i> <i class="fas fa-wifi"></i> <i class="fas fa-battery-three-quarters"></i></span>
  </div>

  <!-- 导航 -->
  <div class="nav-header">
    <h1><i class="fas fa-route"></i> 好物漂流</h1>
    <div class="nav-actions">
      <i class="fas fa-search"></i>
      <i class="fas fa-user-circle"></i>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="main-content">

    <!-- 分类标签 -->
    <div class="category-tabs">
      <span class="active"><i class="fas fa-fire"></i> 推荐</span>
      <span><i class="fas fa-baby"></i> 母婴</span>
      <span><i class="fas fa-book"></i> 书籍</span>
      <span><i class="fas fa-tools"></i> 工具</span>
      <span><i class="fas fa-campground"></i> 户外</span>
      <span><i class="fas fa-utensils"></i> 厨房</span>
    </div>

    <!-- 物品列表 -->
    <div class="item-list">

      <!-- 卡片 1 -->
      <div class="item-card" onclick="openDetail('婴儿推车 · 轻便型', '几乎全新，宝宝长大了用不上。仅限同小区漂流，希望爱护～', '👶 母婴', '3楼 · 王阿姨', '12米', 'available')">
        <div class="item-img"><i class="fas fa-baby-carriage"></i></div>
        <div class="item-info">
          <h3>婴儿推车 · 轻便型</h3>
          <div class="desc"><i class="fas fa-tag"></i> 几乎全新，宝宝长大了</div>
          <div class="item-meta">
            <span class="owner"><i class="fas fa-user"></i> 3楼 · 王阿姨</span>
            <span class="distance"><i class="fas fa-location-dot"></i> 12m</span>
          </div>
          <div style="margin-top: 4px;"><span class="tag-status available"><i class="fas fa-circle"></i> 可漂流</span></div>
        </div>
      </div>

      <!-- 卡片 2 -->
      <div class="item-card" onclick="openDetail('烘焙模具套装 (15件)', '戚风、吐司、饼干模具一应俱全，只用过两次。欢迎烘焙爱好者接力。', '🍰 厨房', '5楼 · 大林', '28米', 'available')">
        <div class="item-img"><i class="fas fa-cake"></i></div>
        <div class="item-info">
          <h3>烘焙模具套装 (15件)</h3>
          <div class="desc"><i class="fas fa-tag"></i> 戚风、吐司、饼干模具</div>
          <div class="item-meta">
            <span class="owner"><i class="fas fa-user"></i> 5楼 · 大林</span>
            <span class="distance"><i class="fas fa-location-dot"></i> 28m</span>
          </div>
          <div style="margin-top: 4px;"><span class="tag-status available"><i class="fas fa-circle"></i> 可漂流</span></div>
        </div>
      </div>

      <!-- 卡片 3 -->
      <div class="item-card" onclick="openDetail('儿童绘本 30册+', '适合3-6岁，经典绘本，书页完整。漂流给需要的邻居，看完可继续传递。', '📚 书籍', '2楼 · 小鹿妈', '8米', 'rented')">
        <div class="item-img"><i class="fas fa-book-open"></i></div>
        <div class="item-info">
          <h3>儿童绘本 30册+</h3>
          <div class="desc"><i class="fas fa-tag"></i> 适合3-6岁，经典绘本</div>
          <div class="item-meta">
            <span class="owner"><i class="fas fa-user"></i> 2楼 · 小鹿妈</span>
            <span class="distance"><i class="fas fa-location-dot"></i> 8m</span>
          </div>
          <div style="margin-top: 4px;"><span class="tag-status rented"><i class="fas fa-clock"></i> 漂流中</span></div>
        </div>
      </div>

      <!-- 卡片 4 -->
      <div class="item-card" onclick="openDetail('露营帐篷 双人', '防风防雨，仅用过一次。适合周末公园或近郊露营，欢迎借用。', '⛺ 户外', '8楼 · 阿峰', '45米', 'available')">
        <div class="item-img"><i class="fas fa-tent"></i></div>
        <div class="item-info">
          <h3>露营帐篷 双人</h3>
          <div class="desc"><i class="fas fa-tag"></i> 防风防雨，仅用过一次</div>
          <div class="item-meta">
            <span class="owner"><i class="fas fa-user"></i> 8楼 · 阿峰</span>
            <span class="distance"><i class="fas fa-location-dot"></i> 45m</span>
          </div>
          <div style="margin-top: 4px;"><span class="tag-status available"><i class="fas fa-circle"></i> 可漂流</span></div>
        </div>
      </div>

      <!-- 卡片 5 -->
      <div class="item-card" onclick="openDetail('电钻 + 螺丝批套装', '家用轻型电钻，打墙/拧螺丝都很方便。工具不常用，借给需要的邻居。', '🔧 工具', '1楼 · 老张', '6米', 'available')">
        <div class="item-img"><i class="fas fa-drill"></i></div>
        <div class="item-info">
          <h3>电钻 + 螺丝批套装</h3>
          <div class="desc"><i class="fas fa-tag"></i> 家用轻型电钻，打墙/拧螺丝</div>
          <div class="item-meta">
            <span class="owner"><i class="fas fa-user"></i> 1楼 · 老张</span>
            <span class="distance"><i class="fas fa-location-dot"></i> 6m</span>
          </div>
          <div style="margin-top: 4px;"><span class="tag-status available"><i class="fas fa-circle"></i> 可漂流</span></div>
        </div>
      </div>
    </div>

    <!-- 发布按钮 (悬浮) -->
    <div class="float-action">
      <button class="btn-post" onclick="alert('📸 打开发布漂流页面\n拍照 + 描述 + 设置漂流规则')">
        <i class="fas fa-plus-circle"></i> 发布漂流
      </button>
    </div>

    <div class="footer-note">
      <i class="fas fa-leaf" style="color:#2a9d8f;"></i> 邻里共享 · 让好物流动起来
    </div>
  </div>
</div>

<!-- 详情弹窗 (模拟) -->
<div id="detailOverlay" class="detail-overlay">
  <div class="detail-card">
    <div class="close-btn" onclick="closeDetail()"><i class="fas fa-times-circle"></i></div>
    <div class="big-icon" id="detailIcon"><i class="fas fa-box"></i></div>
    <h2 id="detailTitle">物品名称</h2>
    <div class="detail-meta">
      <span id="detailCategory"><i class="fas fa-tag"></i> 分类</span>
      <span id="detailOwner"><i class="fas fa-user"></i> 邻居</span>
    </div>
    <p id="detailDesc">物品描述，漂流规则等。</p>
    <div class="action-row">
      <button onclick="alert('💬 联系邻居 (模拟)')"><i class="fas fa-comment"></i> 聊聊</button>
      <button class="primary" onclick="alert('📦 申请漂流 — 等待邻居确认')"><i class="fas fa-hand-peace"></i> 申请漂流</button>
    </div>
    <div style="margin-top: 12px; font-size: 13px; color: #5b7388; background: #f4f8fe; padding: 8px 12px; border-radius: 30px;">
      <i class="fas fa-location-dot" style="color:#2a9d8f;"></i> 同小区 · 漂流信用保障
    </div>
  </div>
</div>

<script>
  // 打开详情弹窗，动态填充内容
  function openDetail(title, desc, category, owner, distance, status) {
    const overlay = document.getElementById('detailOverlay');
    document.getElementById('detailTitle').innerText = title;
    document.getElementById('detailDesc').innerText = desc;
    document.getElementById('detailCategory').innerHTML = `<i class="fas fa-tag"></i> ${category}`;
    document.getElementById('detailOwner').innerHTML = `<i class="fas fa-user"></i> ${owner}`;
    // 图标简易映射
    const iconMap = {
      '婴儿推车': 'fa-baby-carriage',
      '烘焙模具': 'fa-cake',
      '儿童绘本': 'fa-book-open',
      '露营帐篷': 'fa-tent',
      '电钻': 'fa-drill',
    };
    let iconClass = 'fa-box';
    for (let [key, val] of Object.entries(iconMap)) {
      if (title.includes(key)) iconClass = val;
    }
    document.getElementById('detailIcon').innerHTML = `<i class="fas ${iconClass}"></i>`;
    overlay.classList.add('active');
  }

  function closeDetail() {
    document.getElementById('detailOverlay').classList.remove('active');
  }

  // 点击遮罩关闭
  document.getElementById('detailOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeDetail();
  });

  // 演示：点击卡片 → 打开详情（已绑定 onclick）
  // 额外：模拟「发布漂流」按钮已有 alert
</script>

</body>
</html>
