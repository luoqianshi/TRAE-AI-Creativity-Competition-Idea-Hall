<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邻邻工具墙 · 社区共享</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "ZCOOL KuaiLe", "Ma Shan Zheng", "PingFang SC", cursive;
    background: #d4a574 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='10' cy='10' r='1.5' fill='%23b88a5e' opacity='0.5'/><circle cx='60' cy='70' r='2' fill='%23b88a5e' opacity='0.4'/><circle cx='85' cy='25' r='1.5' fill='%23b88a5e' opacity='0.5'/></svg>");
    min-height: 100vh;
    padding: 30px 20px;
    color: #3e2723;
  }
  .cork-frame {
    max-width: 960px;
    margin: 0 auto;
    background: #c4956a;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 20px 60px rgba(62, 39, 35, 0.3), inset 0 0 40px rgba(0,0,0,0.15);
    border: 10px solid #8d6e63;
  }
  .cork-board {
    background: linear-gradient(135deg, #d7b897 0%, #c9a67d 100%);
    border-radius: 12px;
    padding: 36px 30px;
    min-height: 600px;
    position: relative;
    box-shadow: inset 0 0 80px rgba(93, 64, 55, 0.2);
  }
  .cork-board::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'><circle cx='12' cy='18' r='1.5' fill='%23a1887f' opacity='0.3'/><circle cx='42' cy='45' r='2' fill='%23a1887f' opacity='0.25'/><circle cx='38' cy='10' r='1.5' fill='%23a1887f' opacity='0.3'/></svg>");
    opacity: 0.6;
  }
  .title-note {
    position: relative;
    z-index: 1;
    background: #fff59d;
    padding: 18px 32px;
    display: inline-block;
    transform: rotate(-2deg);
    box-shadow: 3px 4px 12px rgba(0,0,0,0.2);
    margin-bottom: 28px;
  }
  .title-note::after {
    content: "";
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 14px;
    background: #e53935;
    border-radius: 50%;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3);
  }
  .title-note h1 { font-size: 2.2rem; color: #5d4037; }
  .title-note p { color: #795548; font-size: 1rem; margin-top: 6px; }
  .search-strip {
    position: relative;
    z-index: 1;
    background: #fff;
    padding: 14px 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.12);
    transform: rotate(1deg);
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
  }
  .search-strip input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #d7ccc8;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    outline: none;
  }
  .search-strip button {
    padding: 12px 24px;
    background: #66bb6a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
  }
  .tools-grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 22px;
  }
  .sticky-note {
    padding: 20px;
    min-height: 180px;
    box-shadow: 3px 5px 12px rgba(0,0,0,0.18);
    position: relative;
    transition: transform 0.2s;
    cursor: default;
  }
  .sticky-note:hover { transform: scale(1.03) rotate(0deg) !important; }
  .sticky-note::after {
    content: "";
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: #e53935;
    border-radius: 50%;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3);
  }
  .note-yellow { background: #fff9c4; transform: rotate(2deg); }
  .note-green { background: #ccff90; transform: rotate(-1.5deg); }
  .note-blue { background: #80d8ff; transform: rotate(1deg); }
  .note-pink { background: #ff80ab; transform: rotate(-2deg); color: #880e4f; }
  .note-orange { background: #ffd180; transform: rotate(1.5deg); }
  .note-purple { background: #e1bee7; transform: rotate(-1deg); color: #4a148c; }
  .sticky-note .emoji { font-size: 2.6rem; margin-bottom: 8px; display: block; }
  .sticky-note h3 { font-size: 1.2rem; margin-bottom: 6px; }
  .sticky-note p { font-size: 0.9rem; margin-bottom: 10px; opacity: 0.85; }
  .sticky-note .status {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.8rem;
    background: #fff;
    opacity: 0.9;
  }
  .sticky-note .borrow-btn {
    margin-top: 10px;
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    background: #5d4037;
    color: #fff;
  }
  .sticky-note .borrow-btn:disabled { background: #a1887f; }
  .footer-note {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-top: 30px;
    color: #5d4037;
    font-size: 0.95rem;
    opacity: 0.8;
  }
</style>
</head>
<body>
<div class="cork-frame">
  <div class="cork-board">
    <div class="title-note">
      <h1>🧰 邻邻工具墙</h1>
      <p>今天借什么？邻里互助，少买多用</p>
    </div>

    <div class="search-strip">
      <input type="text" id="toolSearch" placeholder="找工具：梯子、电钻、帐篷..." />
      <button onclick="searchTools()">🔍 搜一搜</button>
    </div>

    <div class="tools-grid" id="toolGrid"></div>

    <div class="footer-note">留张小纸条，工具用完记得还回来哟 ~</div>
  </div>
</div>

<script>
  const tools = [
    { name: '电钻', emoji: '🔌', owner: '张大哥', status: 'available', color: 'note-yellow' },
    { name: '折叠梯', emoji: '🪜', owner: '李阿姨', status: 'available', color: 'note-green' },
    { name: '露营帐篷', emoji: '⛺', owner: '小王', status: 'borrowed', color: 'note-blue' },
    { name: '投影仪', emoji: '📽️', owner: '社区中心', status: 'available', color: 'note-pink' },
    { name: '自行车修理架', emoji: '🚲', owner: '刘叔', status: 'available', color: 'note-orange' },
    { name: '高压清洗机', emoji: '💦', owner: '陈先生', status: 'borrowed', color: 'note-purple' },
    { name: '烘焙模具', emoji: '🧁', owner: '赵姐', status: 'available', color: 'note-yellow' },
    { name: '冲击钻', emoji: '🔨', owner: '孙师傅', status: 'available', color: 'note-green' }
  ];
  function renderTools(list) {
    const grid = document.getElementById('toolGrid');
    grid.innerHTML = list.map((t, i) => `
      <div class="sticky-note ${t.color}">
        <span class="emoji">${t.emoji}</span>
        <h3>${t.name}</h3>
        <p>提供者：${t.owner}</p>
        <span class="status" style="color:${t.status === 'available' ? '#2e7d32' : '#c62828'}">${t.status === 'available' ? '✓ 可借' : '✗ 已借出'}</span>
        <br>
        <button class="borrow-btn" ${t.status === 'borrowed' ? 'disabled' : ''} onclick="borrow(${i})">${t.status === 'available' ? '申请借用' : '等还回'}</button>
      </div>
    `).join('');
  }
  function borrow(i) {
    tools[i].status = 'borrowed';
    alert(`已给 ${tools[i].owner} 留纸条：想借 ${tools[i].name}！`);
    renderTools(tools);
  }
  function searchTools() {
    const kw = document.getElementById('toolSearch').value.trim();
    if (!kw) { renderTools(tools); return; }
    renderTools(tools.filter(t => t.name.includes(kw) || t.owner.includes(kw)));
  }
  renderTools(tools);
</script>
</body>
</html>
