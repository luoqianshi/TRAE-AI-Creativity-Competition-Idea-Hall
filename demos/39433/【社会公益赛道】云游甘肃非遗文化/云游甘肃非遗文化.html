<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甘肃省非物质文化遗产查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #d4a574 0%, #eab676 30%, #d4a574 70%, #c9956a 100%);
            min-height: 100vh;
            color: #2d2016;
        }

        header {
            background: rgba(74, 56, 32, 0.15);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(74, 56, 32, 0.15);
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #6b5320, #8b6914, #6b5320);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        header p {
            color: #3d2e1f;
            font-size: 1.1rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .stats-bar {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-card {
            background: rgba(74, 56, 32, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(74, 56, 32, 0.2);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(74, 56, 32, 0.15);
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #3d2e1f;
        }

        .stat-card .label {
            color: #3d2e1f;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .map-section {
            background: rgba(74, 56, 32, 0.08);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 1200px;
            border: 1px solid rgba(74, 56, 32, 0.15);
        }

        .map-with-cities {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 20px;
        }

        .city-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px;
            background: rgba(74, 56, 32, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(74, 56, 32, 0.2);
            min-width: 120px;
            max-height: 600px;
            overflow-y: auto;
        }

        .city-list.left {
            order: 1;
        }

        .city-list.right {
            order: 3;
        }

        .city-item {
            padding: 12px 15px;
            background: rgba(74, 56, 32, 0.08);
            border-radius: 10px;
            color: #3d2e1f;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 0.95rem;
            border: 1px solid rgba(74, 56, 32, 0.2);
        }

        .city-item:hover {
            background: rgba(74, 56, 32, 0.2);
            border-color: rgba(61, 46, 31, 0.5);
            transform: translateX(5px);
        }

        .city-item.active {
            background: linear-gradient(135deg, rgba(61, 46, 31, 0.3), rgba(107, 83, 32, 0.3));
            border-color: rgba(61, 46, 31, 0.5);
            color: #2d2016;
        }

        .map-container {
            order: 2;
            flex: 1;
            max-width: 700px;
            height: 600px;
            background: url('image 1.png') no-repeat center center;
            background-size: contain;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(139, 105, 20, 0.5); }
            50% { box-shadow: 0 4px 25px rgba(139, 105, 20, 0.8); }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 56, 32, 0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #f5e6d3 0%, #eed9b8 100%);
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            border: 1px solid rgba(107, 83, 32, 0.3);
            box-shadow: 0 20px 60px rgba(74, 56, 32, 0.3);
        }

        .modal-header {
            background: rgba(74, 56, 32, 0.08);
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(74, 56, 32, 0.15);
        }

        .modal-header h2 {
            font-size: 1.5rem;
            color: #3d2e1f;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(61, 46, 31, 0.15);
            color: #3d2e1f;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(61, 46, 31, 0.3);
            transform: rotate(90deg);
        }

        .modal-content {
            padding: 25px 30px;
            overflow-y: auto;
            max-height: calc(90vh - 120px);
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(61, 46, 31, 0.25);
            background: rgba(61, 46, 31, 0.1);
            color: #3d2e1f;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .category-tab.active {
            background: linear-gradient(135deg, #6b5320, #8b6914);
            border-color: transparent;
            color: #fff;
            font-weight: bold;
        }

        .ich-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .ich-card {
            background: rgba(74, 56, 32, 0.06);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(74, 56, 32, 0.12);
        }

        .ich-card:hover {
            background: rgba(74, 56, 32, 0.12);
            transform: translateY(-3px);
            border-color: rgba(107, 83, 32, 0.3);
        }

        .ich-card .ich-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #3d2e1f;
        }

        .ich-card .ich-category {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 10px;
            background: rgba(61, 46, 31, 0.2);
            color: #3d2e1f;
            font-size: 0.75rem;
            margin-bottom: 10px;
        }

        .ich-card .ich-county {
            color: #3d2e1f;
            font-size: 0.85rem;
        }

        .ich-card .level-badge {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .level-badge span {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 8px;
        }

        .level-badge .national {
            background: rgba(61, 46, 31, 0.25);
            color: #3d2e1f;
        }

        .level-badge .provincial {
            background: rgba(61, 46, 31, 0.15);
            color: #3d2e1f;
        }

        .detail-panel {
            display: none;
            background: rgba(74, 56, 32, 0.06);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            border-left: 4px solid #8b6914;
        }

        .detail-panel.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-panel .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .detail-panel h3 {
            font-size: 1.5rem;
            color: #3d2e1f;
        }

        .detail-panel .close-detail {
            color: rgba(61, 46, 31, 0.6);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
        }

        .detail-panel .close-detail:hover {
            color: #3d2e1f;
        }

        .detail-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-info .info-item {
            background: rgba(61, 46, 31, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .detail-info .info-label {
            color: rgba(61, 46, 31, 0.7);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .detail-info .info-value {
            color: #3d2e1f;
            font-size: 1rem;
        }

        .detail-panel .description {
            color: #3d2e1f;
            line-height: 1.8;
            font-size: 1rem;
        }

        .inheritors-list {
            margin-top: 20px;
        }

        .inheritors-list h4 {
            color: #3d2e1f;
            margin-bottom: 10px;
        }

        .inheritors-list ul {
            list-style: none;
        }

        .inheritors-list li {
            padding: 8px 15px;
            background: rgba(61, 46, 31, 0.1);
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            color: #3d2e1f;
        }

        .back-btn {
            display: none;
            margin-bottom: 20px;
            padding: 12px 25px;
            border-radius: 30px;
            background: rgba(61, 46, 31, 0.15);
            border: 1px solid rgba(61, 46, 31, 0.25);
            color: #3d2e1f;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .back-btn:hover {
            background: rgba(61, 46, 31, 0.3);
            transform: translateX(-5px);
        }

        .back-btn.active {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .legend-item .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-item .dot.national {
            background: #ff6b6b;
        }

        .legend-item .dot.provincial {
            background: #feca57;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .map-with-cities {
                flex-direction: column;
                align-items: center;
            }

            .city-list {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                max-height: none;
                order: initial;
            }

            .city-list.left,
            .city-list.right {
                order: initial;
            }

            .city-item {
                min-width: 80px;
                padding: 8px 12px;
                font-size: 0.85rem;
            }

            .map-container {
                height: 300px;
                max-width: 100%;
            }

            .modal {
                margin: 10px;
            }

            .ich-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>甘肃省非物质文化遗产查询系统</h1>
        <p>探索甘肃14个市州的珍贵非遗文化遗产</p>

                                <div class="info-label">列入年份</div>
                                <div class="info-value" id="detailYear"></div>

                                <div class="info-label">保护单位</div>

        </div>
    </div>

    <script>

                    { id: "NAT-020", name: "高跷", sub_name: "苦水高高跷", category: "传统舞蹈", county: "永登县", year: 2006, unit: "永登县文化馆", desc: "苦水高高跷是永登县苦水镇的传统民俗表演，以高达3-4米的高跷而闻名。表演者在高跷上做出各种惊险动作，展现高超的技艺和勇敢精神，是当地春节期间最具特色的民俗活动。", inheritors: ["巨海全"] },
                    { id: "NAT-041", name: "兰州鼓子", category: "曲艺", county: "兰州市", year: 2006, unit: "兰州市文化馆", desc: "兰州鼓子是流行于兰州地区的一种传统曲艺形式，以唱为主，辅以简单的动作和表情。曲调优美婉转，内容多取材于民间故事和历史传说，具有浓郁的地方特色。", inheritors: ["魏世发", "陈增三"] },
                    { id: "NAT-058", name: "兰州黄河大水车制作技艺", category: "传统技艺", county: "西固区", year: 2006, unit: "兰州市西固区文化馆", desc: "兰州黄河大水车是古代黄河沿岸重要的提水灌溉工具，其制作技艺体现了古代劳动人民的智慧。水车利用水流冲击力量自动提水，结构精巧，是黄河文化的重要象征。", inheritors: ["段怡村"] },
                    { id: "NAT-082", name: "兰州牛肉面制作技艺", category: "传统技艺", county: "城关区", year: 2021, unit: "兰州市城关区文化馆", desc: "兰州牛肉面是享誉全国的特色美食，其制作技艺讲究\"一清、二白、三红、四绿、五黄\"的标准。面条劲道爽滑，汤鲜味美，是兰州饮食文化的代表。", inheritors: [] }

                    { name: "嘉峪关石砚制作技艺", category: "传统技艺", county: "嘉峪关市" },
                    { name: "嘉峪关烤肉制作技艺", category: "传统技艺", county: "嘉峪关市" }
                ]
            },
            "金昌市": {
                national: [
                    { id: "NAT-074", name: "元宵节", sub_name: "永昌县卍字灯俗", category: "民俗", county: "永昌县", year: 2008, unit: "永昌县文化馆", desc: "永昌县卍字灯俗是一种独特的元宵节民俗活动，以巨大的卍字形灯阵为特色。灯阵由数千盏灯笼组成，人们穿行其中祈福，场面壮观，具有深厚的文化内涵。", inheritors: ["陈永清"] }
                ],

                    { name: "永昌宝卷", category: "民间文学", county: "永昌县" },

                    { id: "NAT-050", name: "剪纸", sub_name: "会宁剪纸", category: "传统美术", county: "会宁县", year: 2008, unit: "会宁县文化馆", desc: "会宁剪纸以其细腻的刀法和丰富的题材著称，内容包括花鸟鱼虫、人物故事、吉祥图案等，是当地民间艺术的瑰宝。", inheritors: ["刘伟"] }

        const allCategories = ["民间文学", "传统音乐", "传统舞蹈", "传统戏剧", "曲艺", "传统体育、游艺与杂技", "传统美术", "传统技艺", "传统医药", "民俗"];

        const cityItems = document.querySelectorAll('.city-item');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const closeModal = document.getElementById('closeModal');
        const categoryTabs = document.getElementById('categoryTabs');
        const ichList = document.getElementById('ichList');
        const detailPanel = document.getElementById('detailPanel');
        const closeDetail = document.getElementById('closeDetail');
        const backBtn = document.getElementById('backBtn');

        cityItems.forEach(item => {
            item.addEventListener('click', () => {
                cityItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const city = item.dataset.city;
                showCityIch(city);
            });
        });

        closeModal.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            detailPanel.classList.remove('active');
        });

        closeDetail.addEventListener('click', () => {
            detailPanel.classList.remove('active');
        });

        backBtn.addEventListener('click', () => {
            backBtn.classList.remove('active');
            document.getElementById('mapSection').style.display = 'block';
            detailPanel.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
                detailPanel.classList.remove('active');
            }
        });

        function showCityIch(city) {
            modalTitle.textContent = `${city} - 非物质文化遗产列表`;
            const cityData = ichData[city];
            if (!cityData) return;

            const allItems = [...cityData.national.map(item => ({ ...item, level: '国家级' })),
                             ...cityData.provincial.map(item => ({ ...item, level: '省级' }))];

            initCategoryTabs(allItems);
            renderIchList(allItems);

            modalOverlay.classList.add('active');
        }

        function initCategoryTabs(items) {
            categoryTabs.innerHTML = '';
            
            const allTab = document.createElement('div');
            allTab.className = 'category-tab active';
            allTab.dataset.category = 'all';
            allTab.textContent = '全部';
            allTab.addEventListener('click', () => {
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                allTab.classList.add('active');
                filterByCategory('all');
            });
            categoryTabs.appendChild(allTab);
            
            const categories = [...new Set(items.map(item => item.category))];
            categories.forEach(cat => {
                const tab = document.createElement('div');
                tab.className = 'category-tab';
                tab.dataset.category = cat;
                tab.textContent = cat;
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    filterByCategory(cat);
                });
                categoryTabs.appendChild(tab);
            });
        }

        function renderIchList(items) {
            ichList.innerHTML = '';
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'ich-card';
                card.innerHTML = `
                    <div class="ich-name">${item.name}${item.sub_name ? ' - ' + item.sub_name : ''}</div>
                    <div class="ich-category">${item.category}</div>
                    <div class="ich-county">所属地区：${item.county || '暂无'}</div>
                    <div class="level-badge">
                        <span class="${item.level === '国家级' ? 'national' : 'provincial'}">${item.level}</span>
                    </div>
                `;
                card.addEventListener('click', () => {
                    showIchDetail(item);
                });
                ichList.appendChild(card);
            });
        }

        function filterByCategory(category) {
            const city = modalTitle.textContent.split(' - ')[0];
            const cityData = ichData[city];
            if (!cityData) return;

            const allItems = [...cityData.national.map(item => ({ ...item, level: '国家级' })),
                             ...cityData.provincial.map(item => ({ ...item, level: '省级' }))];

            const filtered = category === 'all' ? allItems : allItems.filter(item => item.category === category);
            renderIchList(filtered);
            detailPanel.classList.remove('active');
        }

        function showIchDetail(item) {
            document.getElementById('detailName').textContent = `${item.name}${item.sub_name ? ' - ' + item.sub_name : ''}`;
            document.getElementById('detailCategory').textContent = item.category;
            document.getElementById('detailCity').textContent = item.county || '暂无';
            document.getElementById('detailYear').textContent = item.year ? `${item.year}年` : '暂无';
            document.getElementById('detailUnit').textContent = item.unit || '暂无';
            document.getElementById('detailDesc').textContent = item.desc || '暂无详细介绍';

            const inheritorsList = document.getElementById('inheritorsList');
            if (item.inheritors && item.inheritors.length > 0) {
                inheritorsList.innerHTML = `
                    <h4>国家级传承人</h4>
                    <ul>
                        ${item.inheritors.map(name => `<li>${name}</li>`).join('')}
                    </ul>
                `;
            } else {
                inheritorsList.innerHTML = '';
            }

            detailPanel.classList.add('active');
            detailPanel.scrollIntoView({ behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('甘肃非遗文化查询系统已加载');
        });
    </script>
