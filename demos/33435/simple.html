<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豆包生图小助手</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --surface: #141416;
      --surface-hover: #1a1a1d;
      --border: rgba(245, 245, 244, 0.06);
      --border-strong: rgba(245, 245, 244, 0.12);
      --text: #f5f5f4;
      --text-secondary: #a8a29e;
      --text-muted: #78716c;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --success: #10b981;
      --error: #f43f5e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      padding: 48px 20px 80px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* Ambient glow */
    .glow {
      position: fixed;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: -1;
      animation: breathe 8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.12em;
      margin-bottom: 16px;
      padding: 6px 12px;
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 100px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
    }

    h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 300;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:focus-within {
      border-color: rgba(245, 158, 11, 0.25);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.06);
    }

    /* Toggle */
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      padding: 4px;
    }

    .toggle-left {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .toggle-icon {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      transition: transform 0.25s ease;
    }

    .toggle.open .toggle-icon { transform: rotate(180deg); }

    .toggle-status {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .toggle-status.ok { color: var(--success); }

    /* Expandable content */
    .expandable {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      animation: slideDown 0.25s ease;
    }

    .expandable.active { display: block; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Form fields */
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }

    .field-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"], input[type="password"], textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      transition: all 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.08);
    }

    input::placeholder, textarea::placeholder { color: var(--text-muted); }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.7;
      font-family: 'Noto Sans SC', sans-serif;
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: var(--bg);
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.2);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
      padding: 10px 16px;
      font-size: 13px;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-verify {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 10px 16px;
      font-size: 13px;
    }

    .btn-verify:hover {
      background: rgba(16, 185, 129, 0.15);
    }

    .btn-verify:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .verify-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .verify-row input { flex: 1; }

    /* Result */
    .result {
      margin-top: 20px;
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .result.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.08em;
    }

    .prompt-box {
      position: relative;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .btn-copy {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-copy.copied {
      color: var(--success);
      border-color: var(--success);
    }

    /* Alert */
    .alert {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }

    .alert.active { display: block; }
    .alert-error { background: rgba(244, 63, 94, 0.08); border: 1px solid rgba(244, 63, 95, 0.15); color: #fda4af; }
    .alert-success { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.15); color: #6ee7b7; }

    /* History */
    .history-section { margin-top: 32px; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .history-title {
      font-size: 18px;
      font-weight: 600;
    }

    .history-count {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-left: 8px;
    }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .history-item:hover { border-color: var(--border-strong); }

    .history-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
    }

    .history-time {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }

    .history-input {
      flex: 1;
      font-size: 14px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-actions {
      display: flex;
      gap: 8px;
    }

    .history-actions button {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .history-actions button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .history-actions button.delete:hover {
      border-color: var(--error);
      color: var(--error);
    }

    .history-chevron {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .history-item.open .history-chevron { transform: rotate(180deg); }

    .history-body {
      display: none;
      padding: 0 18px 18px;
      border-top: 1px solid var(--border);
      animation: slideDown 0.2s ease;
    }

    .history-item.open .history-body { display: block; }

    .history-prompt {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.8;
      color: var(--text-secondary);
      padding-top: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .history-empty {
      text-align: center;
      padding: 48px 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
    }

    .pagination button {
      min-width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pagination button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pagination button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 48px;
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Icons */
    .icon { width: 16px; height: 16px; }
    .icon-sm { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div class="glow"></div>

  <div class="container">
    <header>
      <div class="badge">
        <div class="badge-dot"></div>
        VOS-玄造 · DOUBAO PROMPT ASSISTANT
      </div>
      <h1>豆包生图小助手</h1>
      <p class="subtitle">描述画面，一键生成高质量提示词</p>
    </header>

    <!-- Settings -->
    <div class="card">
      <div class="toggle" id="settingToggle" onclick="toggleSettings()">
        <div class="toggle-left">
          <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 9l-7 7-7-7"/>
          </svg>
          <span>API 设置</span>
        </div>
        <div class="toggle-status" id="verifyStatus">兼容 OpenAI 格式</div>
      </div>

      <div class="expandable" id="settings">
        <div class="field">
          <label class="field-label">API Base URL</label>
          <input type="text" id="apiUrl" placeholder="https://ark.cn-beijing.volces.com/api/v3" value="https://ark.cn-beijing.volces.com/api/v3">
        </div>
        <div class="field">
          <label class="field-label">API Key</label>
          <input type="password" id="apiKey" placeholder="sk-...">
          <div class="hint">仅保存在浏览器本地</div>
        </div>
        <div class="field">
          <label class="field-label">模型名称</label>
          <div class="verify-row">
            <input type="text" id="modelName" placeholder="doubao-pro-32k / ep-xxx..." value="doubao-pro-32k">
            <button class="btn btn-verify" id="verifyBtn" onclick="verifyConnection()">验证连接</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="card">
      <div class="field">
        <label class="field-label">你想生成什么画面？</label>
        <textarea id="input" placeholder="例如：夏日黄昏海边，一对情侣相视而笑，氛围感头像"></textarea>
      </div>
      <button class="btn btn-primary" id="btn" onclick="generate()">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        生成提示词
      </button>

      <div class="alert alert-error" id="error"></div>
      <div class="alert alert-success" id="success"></div>

      <div class="result" id="result">
        <div class="result-label">生成结果</div>
        <div class="prompt-box">
          <button class="btn-copy" onclick="copyFromElement('prompt')">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
            </svg>
            复制
          </button>
          <div id="prompt"></div>
        </div>
      </div>
    </div>

    <!-- History -->
    <div class="history-section">
      <div class="history-header">
        <div>
          <span class="history-title">历史记录</span>
          <span class="history-count" id="historyCount"></span>
        </div>
        <button class="btn btn-secondary" onclick="clearHistory()">清空全部</button>
      </div>
      <div id="historyList"></div>
      <div class="pagination" id="pagination"></div>
    </div>

    <footer>
      为 TRAE AI 创造力大赛 · 生活娱乐赛道构建
    </footer>
  </div>

  <script>
    const SYSTEM_PROMPT = `你是 VOS-玄造 V3，一位专为 DiT 图像模型（Seedream/即梦/豆包）服务的视觉导演与提示词架构师。

你的任务：接收用户用自然语言描述的画面意图，输出一段高质量中文提示词（流式散文风格，情境化描述，保留少量必要的英文专业术语如摄影焦段、画种名称）。

核心原则：
- 审美先于细节：先判断画面整体风格（摄影真实 / 绘画插画 / 史诗概念 / 空间生态 / 氛围壁纸），并用该风格的视觉语言组织描述。
- 注意力金字塔：确保第一眼有强视觉锚点，第二眼有叙事张力，最后留下情绪记忆。
- 物理真实感：描述光学焦段、空间介质（雾气、尘埃、湿度）、材质摩擦（皮肤、织物、石材、金属）。
- 禁止使用 masterpiece、8k、hyperdetailed、ultra HD 等无效堆叠词。

直接输出提示词文本，不需要解释。`;

    const examples = {
      sea: "电影感 85mm 黄金时刻人像，一对年轻情侣在夏日黄昏的安静海边相依而立，侧脸转向彼此，海风轻轻拂起发丝掠过温暖肌肤，身后是缓缓下沉的橘色落日，海浪化作奶油般的虚化背景，潮湿的海盐雾气柔化所有边缘，棉麻衣物被暖风吹动，浪漫而略带忧伤，干净的负空间，琥珀色与青蓝色的色彩记忆，浅景深，真实的皮肤质感",
      night: "35mm 纪实闪光灯摄影，午夜时分一个孤独的女孩站在便利店门外，脸部被直闪硬光抓住成为视觉中心，潮湿的柏油路面反射着霓虹蓝与自动贩卖机的暖光，不完美偏心构图，疲惫的神情，一缕头发挡在一只眼睛前，都市孤独感， raw film grain，过曝的高光，真实皮肤纹理，浅景深",
      myth: "神圣东方神话史诗绘画，破碎的南天门以悲壮宏伟的姿态耸入风暴撕裂的天空，年轻的齐天大圣作为暗金色剪影立于画面下三分之一，猩红战袍被狂风卷起，手持金箍棒默默反抗，天宫废墟消融于无尽云海，浓雾弥散着噼啪作响的金色闪电，神圣悲悯，矿物颜料质感，厚涂笔触，强烈的大气透视",
      nature: "宁静的环境概念艺术，黎明时分一个孤独身影站在古老森林湖泊边缘，水面升起薄雾，巨大的苔藓覆盖树木框住画面，柔和的金色光线穿透树冠，漂浮的花粉颗粒捕捉光束，连贯的自然生态，大气深度，有机纹理，安静的沉思，冷暖色调平衡",
      default: "视觉冲击力强的画面，具有清晰剪影的主体，和谐的色彩 palette，电影感灯光，连贯的氛围，丰富的材质纹理，情绪共鸣，有意识的负空间平衡构图"
    };

    let currentInput = '';
    let historyPage = 1;
    const HISTORY_PER_PAGE = 5;

    function pick(input) {
      const s = input.toLowerCase();
      if (s.includes('海') || s.includes('beach') || s.includes('海边')) return 'sea';
      if (s.includes('夜') || s.includes('深夜') || s.includes('便利店') || s.includes('lonely')) return 'night';
      if (s.includes('神') || s.includes('大圣') || s.includes('天宫') || s.includes('神话')) return 'myth';
      if (s.includes('森') || s.includes('自然') || s.includes('山') || s.includes('湖')) return 'nature';
      return 'default';
    }

    function toggleSettings() {
      document.getElementById('settings').classList.toggle('active');
      document.getElementById('settingToggle').classList.toggle('open');
    }

    function showAlert(type, msg) {
      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      errorEl.classList.remove('active');
      successEl.classList.remove('active');
      if (type === 'error') {
        errorEl.textContent = msg;
        errorEl.classList.add('active');
      } else {
        successEl.textContent = msg;
        successEl.classList.add('active');
      }
    }

    function hideAlerts() {
      document.getElementById('error').classList.remove('active');
      document.getElementById('success').classList.remove('active');
    }

    function renderResult(prompt) {
      document.getElementById('prompt').textContent = prompt;
      document.getElementById('result').classList.add('active');
    }

    async function verifyConnection() {
      const apiUrl = document.getElementById('apiUrl').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const modelName = document.getElementById('modelName').value.trim();
      const btn = document.getElementById('verifyBtn');
      const statusEl = document.getElementById('verifyStatus');

      if (!apiUrl || !apiKey || !modelName) {
        showAlert('error', '请先填写完整的 API 信息');
        return;
      }

      btn.disabled = true;
      btn.textContent = '验证中...';
      hideAlerts();

      try {
        const response = await fetch(`${apiUrl.replace(/\/$/, '')}/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: modelName,
            messages: [
              { role: 'system', content: 'You are a helpful assistant.' },
              { role: 'user', content: 'Hi' }
            ],
            max_tokens: 5
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`${response.status}: ${errText}`);
        }

        statusEl.textContent = '连接成功';
        statusEl.classList.add('ok');
        showAlert('success', 'API 连接验证成功，可以开始生成提示词');
      } catch (err) {
        statusEl.textContent = '连接失败';
        statusEl.classList.remove('ok');
        showAlert('error', `连接失败：${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = '验证连接';
      }
    }

    function saveHistory(input, prompt) {
      if (!input || !prompt) return;
      const list = JSON.parse(localStorage.getItem('xuanzao_history') || '[]');
      list.unshift({
        id: Date.now(),
        time: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
        input,
        prompt
      });
      localStorage.setItem('xuanzao_history', JSON.stringify(list.slice(0, 200)));
      renderHistory();
    }

    function deleteHistoryItem(id) {
      const list = JSON.parse(localStorage.getItem('xuanzao_history') || '[]');
      const filtered = list.filter(item => item.id !== id);
      localStorage.setItem('xuanzao_history', JSON.stringify(filtered));
      const maxPage = Math.ceil(filtered.length / HISTORY_PER_PAGE) || 1;
      if (historyPage > maxPage) historyPage = maxPage;
      renderHistory();
    }

    function clearHistory() {
      if (!confirm('确定要清空所有历史记录吗？')) return;
      localStorage.removeItem('xuanzao_history');
      historyPage = 1;
      renderHistory();
    }

    function toggleHistoryItem(el) {
      const item = el.closest('.history-item');
      item.classList.toggle('open');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderHistory() {
      const list = JSON.parse(localStorage.getItem('xuanzao_history') || '[]');
      const listEl = document.getElementById('historyList');
      const countEl = document.getElementById('historyCount');
      const paginationEl = document.getElementById('pagination');

      countEl.textContent = list.length > 0 ? `共 ${list.length} 条` : '';

      if (list.length === 0) {
        listEl.innerHTML = '<div class="history-empty">暂无历史记录</div>';
        paginationEl.innerHTML = '';
        return;
      }

      const totalPages = Math.ceil(list.length / HISTORY_PER_PAGE);
      if (historyPage > totalPages) historyPage = totalPages;

      const start = (historyPage - 1) * HISTORY_PER_PAGE;
      const pageItems = list.slice(start, start + HISTORY_PER_PAGE);

      listEl.innerHTML = pageItems.map(item => `
        <div class="history-item">
          <div class="history-summary" onclick="toggleHistoryItem(this)">
            <svg class="history-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 9l-7 7-7-7"/>
            </svg>
            <div class="history-time">${item.time}</div>
            <div class="history-input">${escapeHtml(item.input)}</div>
            <div class="history-actions" onclick="event.stopPropagation()">
              <button onclick="copyText('${escapeHtml(item.prompt).replace(/'/g, "\\'")}')" title="复制提示词">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                </svg>
              </button>
              <button class="delete" onclick="deleteHistoryItem(${item.id})" title="删除">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="history-body">
            <div class="history-prompt">${escapeHtml(item.prompt)}</div>
          </div>
        </div>
      `).join('');

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const el = document.getElementById('pagination');
      if (totalPages <= 1) {
        el.innerHTML = '';
        return;
      }

      let html = `
        <button onclick="goToPage(${historyPage - 1})" ${historyPage === 1 ? 'disabled' : ''}>上一页</button>
      `;

      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="${i === historyPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }

      html += `
        <button onclick="goToPage(${historyPage + 1})" ${historyPage === totalPages ? 'disabled' : ''}>下一页</button>
      `;

      el.innerHTML = html;
    }

    function goToPage(page) {
      historyPage = page;
      renderHistory();
    }

    function fallbackDemo(input) {
      const key = pick(input);
      const prompt = examples[key];
      renderResult(prompt);
      saveHistory(input, prompt);
    }

    async function generate() {
      const input = document.getElementById('input').value.trim();
      currentInput = input;
      if (!input) return;

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.innerHTML = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> 生成中...`;
      hideAlerts();

      const apiUrl = document.getElementById('apiUrl').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const modelName = document.getElementById('modelName').value.trim();

      if (!apiUrl || !apiKey || !modelName) {
        setTimeout(() => {
          fallbackDemo(input);
          btn.disabled = false;
          btn.innerHTML = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg> 生成提示词`;
        }, 600);
        return;
      }

      try {
        const response = await fetch(`${apiUrl.replace(/\/$/, '')}/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: modelName,
            messages: [
              { role: 'system', content: SYSTEM_PROMPT },
              { role: 'user', content: input }
            ],
            temperature: 0.7
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`API 错误 ${response.status}: ${errText}`);
        }

        const data = await response.json();
        const content = data.choices?.[0]?.message?.content || '';
        const prompt = content.trim();

        renderResult(prompt);
        saveHistory(input, prompt);
      } catch (err) {
        console.error(err);
        showAlert('error', `调用失败：${err.message}。已切换到本地演示模式。`);
        fallbackDemo(input);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg> 生成提示词`;
      }
    }

    function copyFromElement(id) {
      copyText(document.getElementById(id).textContent);
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.currentTarget;
        const original = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = '已复制';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = original;
        }, 1500);
      });
    }

    // Load history on page load
    renderHistory();
  </script>
</body>
</html>
