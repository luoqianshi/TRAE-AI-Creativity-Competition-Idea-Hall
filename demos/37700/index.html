<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感生成器 - 创意内容工厂</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部标题 -->
        <header class="header">
            <h1 class="title">✨ 灵感生成器</h1>
            <p class="subtitle">创意内容工厂 - 让灵感触手可及</p>
        </header>

        <!-- 输入区域 -->
        <div class="input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="keywordInput" 
                    class="keyword-input" 
                    placeholder="输入一个关键词（如：猫、咖啡、旅行、未来城市）..."
                    maxlength="20"
                >
                <button id="generateBtn" class="generate-btn">
                    <span class="btn-icon">🚀</span>
                    一键生成
                </button>
            </div>
        </div>

        <!-- 生成结果区域 -->
        <div id="resultsSection" class="results-section" style="display: none;">
            <div class="results-header">
                <h2 class="results-title">生成结果</h2>
                <div class="action-buttons">
                    <button id="copyAllBtn" class="action-btn copy-btn" title="复制全部内容">
                        <span>📋</span> 一键复制
                    </button>
                    <button id="enhanceBtn" class="action-btn enhance-btn" title="让内容更夸张、更有创意">
                        <span>⚡</span> 灵感增强
                    </button>
                    <button id="regenerateBtn" class="action-btn regenerate-btn" title="同关键词重新生成">
                        <span>🔄</span> 重新生成
                    </button>
                </div>
            </div>

            <div class="cards-container">
                <!-- 短故事卡片 -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">📖</span>
                        <h3 class="card-title">短故事</h3>
                    </div>
                    <div id="storyContent" class="card-content"></div>
                    <button class="copy-single-btn" data-target="storyContent" title="复制此内容">复制</button>
                </div>

                <!-- 广告文案卡片 -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">📢</span>
                        <h3 class="card-title">广告文案</h3>
                    </div>
                    <div id="adContent" class="card-content"></div>
                    <button class="copy-single-btn" data-target="adContent" title="复制此内容">复制</button>
                </div>

                <!-- 创意点子卡片 -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">💡</span>
                        <h3 class="card-title">创意点子</h3>
                    </div>
                    <div id="ideaContent" class="card-content"></div>
                    <button class="copy-single-btn" data-target="ideaContent" title="复制此内容">复制</button>
                </div>

                <!-- 短视频脚本卡片 -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">🎬</span>
                        <h3 class="card-title">短视频脚本</h3>
                    </div>
                    <div id="scriptContent" class="card-content"></div>
                    <button class="copy-single-btn" data-target="scriptContent" title="复制此内容">复制</button>
                </div>
            </div>
        </div>

        <!-- 历史记录区域 -->
        <div class="history-section">
            <div class="history-header">
                <h2 class="history-title">📜 历史记录</h2>
                <button id="clearHistoryBtn" class="clear-history-btn">清空历史</button>
            </div>
            <div id="historyList" class="history-list">
                <p class="empty-history">暂无历史记录</p>
            </div>
        </div>

        <!-- 提示消息 -->
        <div id="toast" class="toast"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
