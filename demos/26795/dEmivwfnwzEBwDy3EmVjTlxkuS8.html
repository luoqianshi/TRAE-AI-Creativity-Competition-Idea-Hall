<style>
/* ========== Design Tokens ========== */
:root {
  --blue-50:#f0f9ff;--blue-100:#e0f2fe;--blue-200:#bae6fd;--blue-400:#38bdf8;

  --violet-100:#ede9fe;--violet-400:#a78bfa;--violet-500:#8b5cf6;
  --emerald-100:#d1fae5;--emerald-400:#34d399;--emerald-500:#10b981;
  --pink-100:#fce7f3;--pink-400:#f472b6;--pink-500:#ec4899;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;
  --gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;

  --shadow-md:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.04);

*,*:before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100vh;overflow:hidden}
body{font-family:var(--font);background:#f0f2f5;color:var(--gray-900);-webkit-font-smoothing:antialiased}

/* ========== Banner ========== */
.banner{
  position:relative;height:220px;overflow:hidden;display:flex;align-items:center;
  justify-content:space-between;padding:0 56px;flex-shrink:0;
  background:
    radial-gradient(ellipse 800px 400px at 20% 50%,rgba(6,182,212,.5) 0%,transparent 65%),
    radial-gradient(ellipse 600px 350px at 75% 30%,rgba(139,92,246,.3) 0%,transparent 60%),
    radial-gradient(ellipse 500px 300px at 50% 80%,rgba(236,72,153,.2) 0%,transparent 55%),
    radial-gradient(ellipse 400px 250px at 90% 70%,rgba(16,185,129,.25) 0%,transparent 50%),
    radial-gradient(ellipse 350px 200px at 10% 20%,rgba(245,158,11,.2) 0%,transparent 50%),
    linear-gradient(160deg,#0c4a6e 0%,#075985 10%,#0369a1 25%,#0ea5e9 45%,#06b6d4 60%,#22d3ee 78%,#a5f3fc 100%);
  background-size:100% 100%;
}
.banner::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle 200px at 10% 40%,rgba(255,255,255,.12) 0%,transparent 70%),
    radial-gradient(circle 150px at 60% 20%,rgba(255,255,255,.08) 0%,transparent 60%),
    radial-gradient(circle 180px at 85% 60%,rgba(255,255,255,.07) 0%,transparent 65%);
  animation:bannerShimmer 12s ease-in-out infinite alternate;pointer-events:none;
}
@keyframes bannerShimmer{0%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.02)}100%{opacity:.7;transform:scale(1)}}
.banner::after{
  content:'';position:absolute;width:300px;height:300px;border-radius:50%;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);right:-60px;top:-80px;pointer-events:none;
}
.banner-left{position:relative;z-index:1}
.banner-left h1{
  color:#fff;font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.2;
  text-shadow:0 2px 20px rgba(0,0,0,.2);
}
.banner-left h1 span{
  display:block;font-size:18px;font-weight:500;letter-spacing:.08em;
  opacity:.85;margin-top:4px;text-shadow:0 1px 8px rgba(0,0,0,.15);
}
.train-tags{display:flex;gap:10px;margin-top:14px}
.train-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 12px;
  color:rgba(255,255,255,.9);font-size:12px;font-weight:500;letter-spacing:.02em;
}
/* Glass badge */
.banner-badge{
  position:relative;z-index:1;
  background:rgba(255,255,255,.13);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.22);border-radius:var(--radius-lg);
  padding:20px 30px;display:flex;gap:32px;color:#fff;
  box-shadow:0 8px 32px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.1);
}
.badge-item{text-align:center;min-width:60px}
.badge-item .num{
  font-size:30px;font-weight:800;line-height:1;
  background:linear-gradient(135deg,#fff 30%,rgba(255,255,255,.75));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.badge-item .label{font-size:11px;font-weight:500;opacity:.8;margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
.badge-divider{width:1px;background:rgba(255,255,255,.15);align-self:stretch}

/* ========== Tabs ========== */
.tabs-bar{
  display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--gray-200);
  padding:8px 48px;flex-shrink:0;
}
.tab-btn{
  padding:9px 20px;border:none;background:transparent;font-size:13.5px;font-weight:600;
  color:var(--gray-400);cursor:pointer;position:relative;
  transition:all .25s cubic-bezier(.4,0,.2,1);font-family:inherit;
  border-radius:8px;letter-spacing:.01em;white-space:nowrap;
}
.tab-btn:hover{color:var(--blue-600);background:var(--blue-50)}
.tab-btn.active{
  color:#fff;background:linear-gradient(135deg,var(--blue-500),var(--blue-600));
  box-shadow:0 2px 8px rgba(14,165,233,.3);
}
.tab-btn:not(.active)::after{
  content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:0;height:2px;background:var(--blue-400);border-radius:2px;transition:width .25s;
}
.tab-btn:not(.active):hover::after{width:24px}

/* ========== Main Layout ========== */
.main-wrap{display:flex;height:calc(100vh - 220px - 47px);gap:0}

/* ========== Left: Timeline ========== */
.timeline-panel{
  width:500px;min-width:500px;overflow-y:auto;padding:20px 22px 30px;
  background:#fff;border-right:1px solid var(--gray-200);scroll-behavior:smooth;
}
.timeline-panel::-webkit-scrollbar{width:5px}
.timeline-panel::-webkit-scrollbar-track{background:transparent}
.timeline-panel::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:10px}
.timeline-panel::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}

/* Day header */
.day-header-card{
  background:linear-gradient(135deg,#f0f9ff 0%,#ecfdf5 100%);
  border:1px solid rgba(14,165,233,.15);border-radius:var(--radius-md);
  padding:14px 18px;margin-bottom:22px;margin-left:50px;position:relative;overflow:hidden;
}
.day-header-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--blue-400),var(--emerald-400));border-radius:0 2px 2px 0;
}
.dh-date{font-size:11px;color:var(--blue-600);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.dh-title{font-size:16px;font-weight:800;color:var(--gray-900);margin-top:3px;letter-spacing:-.01em}
.dh-note{font-size:11.5px;color:var(--gray-500);margin-top:5px;line-height:1.55}

/* Transport card */
.transport-card{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid rgba(234,88,12,.15);
  border-radius:var(--radius-md);padding:11px 16px;margin-bottom:16px;margin-left:50px;
  transition:transform .2s,box-shadow .2s;cursor:pointer;
}
.transport-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.tc-icon{font-size:22px;flex-shrink:0}
.tc-info{flex:1}
.tc-route{font-size:13px;font-weight:700;color:#92400e}
.tc-detail{font-size:11px;color:#b45309;margin-top:2px}

/* Timeline items */
.day-group{display:none}.day-group.active{display:block}
.timeline-item{
  display:flex;gap:0;margin-bottom:0;position:relative;cursor:pointer;
  border-radius:var(--radius-md);transition:transform .2s cubic-bezier(.4,0,.2,1);padding:2px 0;
}
.timeline-item:hover{transform:translateX(3px)}
.timeline-dot-wrap{width:38px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:8px}
.timeline-dot{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:11.5px;font-weight:800;flex-shrink:0;z-index:1;position:relative;
  transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s;
}
.timeline-item:hover .timeline-dot{transform:scale(1.18)}
.timeline-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:0;transition:opacity .25s}
.timeline-item:hover .timeline-dot::after{opacity:.3}
.timeline-line-wrap{flex:1;width:2px;position:relative;min-height:18px}
.timeline-line-wrap::after{
  content:'';position:absolute;left:50%;transform:translateX(-50%);top:6px;bottom:-6px;
  width:0;border-left:2px dashed var(--gray-300);opacity:.6;
}
.timeline-item:last-child .timeline-line-wrap::after{display:none}
.timeline-card{
  flex:1;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);
  padding:12px 16px;margin-bottom:14px;margin-left:12px;
  transition:border-color .25s,box-shadow .25s,transform .2s;position:relative;overflow:hidden;
}
.timeline-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;opacity:0;transition:opacity .25s}
.timeline-item:hover .timeline-card{border-color:var(--gray-300);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.timeline-item:hover .timeline-card::before{opacity:1}
/* Per-category left border */
.tl-scenic .timeline-card::before{background:var(--blue-400)}
.tl-food .timeline-card::before{background:var(--amber-400)}
.tl-culture .timeline-card::before{background:var(--violet-400)}
.tl-nature .timeline-card::before{background:var(--emerald-400)}
.tl-nightlife .timeline-card::before{background:var(--pink-400)}
.tl-hotel .timeline-card::before{background:#818cf8}
.tl-transport .timeline-card::before{background:#fb923c}
/* Dot gradients */
.dot-scenic{background:linear-gradient(135deg,#0ea5e9,#38bdf8);box-shadow:0 2px 10px rgba(14,165,233,.4)}
.dot-food{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 2px 10px rgba(245,158,11,.4)}
.dot-culture{background:linear-gradient(135deg,#8b5cf6,#a78bfa);box-shadow:0 2px 10px rgba(139,92,246,.4)}
.dot-nature{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 2px 10px rgba(16,185,129,.4)}
.dot-nightlife{background:linear-gradient(135deg,#ec4899,#f472b6);box-shadow:0 2px 10px rgba(236,72,153,.4)}
.dot-hotel{background:linear-gradient(135deg,#6366f1,#818cf8);box-shadow:0 2px 10px rgba(99,102,241,.4)}
.dot-shopping{background:linear-gradient(135deg,#a855f7,#c084fc);box-shadow:0 2px 10px rgba(168,85,247,.4)}
.dot-transport{background:linear-gradient(135deg,#ea580c,#fb923c);box-shadow:0 2px 10px rgba(234,88,12,.4)}

/* Card inner */
.card-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.card-time{font-size:11px;font-weight:700;color:var(--gray-500);background:var(--gray-100);padding:2px 9px;border-radius:5px;font-variant-numeric:tabular-nums}
.card-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.03em}
.tag-scenic{background:var(--blue-100);color:var(--blue-700)}
.tag-food{background:var(--amber-100);color:#92400e}
.tag-culture{background:var(--violet-100);color:#5b21b6}
.tag-nature{background:var(--emerald-100);color:#065f46}
.tag-nightlife{background:var(--pink-100);color:#9d174d}
.tag-shopping{background:#fdf4ff;color:#86198f}
.tag-hotel{background:#eef2ff;color:#3730a3}
.tag-transport{background:#fff7ed;color:#9a3412}
.card-name{font-size:14.5px;font-weight:700;color:var(--gray-900);letter-spacing:-.01em}
.card-desc{font-size:11.5px;color:var(--gray-400);margin-top:3px;line-height:1.55}
.card-meta{font-size:10.5px;color:var(--gray-400);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.card-meta span{display:flex;align-items:center;gap:3px}
.card-tip{
  font-size:10.5px;color:var(--blue-600);background:var(--blue-50);
  padding:3px 10px;border-radius:5px;margin-top:6px;display:inline-flex;align-items:center;gap:4px;font-weight:600;
}

/* ========== Right: Map ========== */
.map-panel{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%}

/* Legend */
.map-legend{
  position:absolute;top:16px;right:16px;
  background:rgba(255,255,255,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(0,0,0,.06);border-radius:var(--radius-md);
  padding:12px 16px;font-size:11px;z-index:10;box-shadow:var(--shadow-lg);min-width:120px;
}
.leg-title{font-weight:700;color:var(--gray-700);margin-bottom:8px;font-size:11px;letter-spacing:.02em}
.leg-item{display:flex;align-items:center;gap:8px;margin-bottom:5px;color:var(--gray-600);font-weight:500}
.leg-item:last-child{margin-bottom:0}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ld-scenic{background:var(--blue-500)}.ld-food{background:var(--amber-500)}
.ld-culture{background:var(--violet-500)}.ld-nature{background:var(--emerald-500)}
.ld-nightlife{background:var(--pink-500)}.ld-hotel{background:#6366f1}
.ld-transport{background:#ea580c}

/* Budget */
.budget-panel{
  position:absolute;bottom:16px;left:16px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(0,0,0,.06);border-radius:var(--radius-md);
  padding:14px 18px;font-size:11px;z-index:10;box-shadow:var(--shadow-lg);min-width:210px;
}
.bp-title{font-weight:800;color:var(--gray-900);font-size:12.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.bp-row{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--gray-500);font-weight:500}
.bp-row .bp-val{color:var(--gray-800);font-weight:700;font-variant-numeric:tabular-nums}
.bp-divider{height:1px;background:linear-gradient(90deg,var(--gray-200),transparent);margin:7px 0}
.bp-total{display:flex;justify-content:space-between;font-weight:800;color:var(--blue-600);font-size:13px}

/* InfoWindow custom */
.ci-win{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-xl);padding:14px 18px;min-width:200px;max-width:260px;font-size:13px;border:1px solid rgba(0,0,0,.06)}
.ci-name{font-weight:800;color:var(--gray-900);font-size:14px;margin-bottom:5px}
.ci-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:6px}
.ci-meta{font-size:11px;color:var(--gray-500);line-height:1.5}

/* ========== Animations ========== */
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.timeline-item{animation:fadeInUp .4s cubic-bezier(.4,0,.2,1) both}
.day-group.active .timeline-item:nth-child(1){animation-delay:.03s}
.day-group.active .timeline-item:nth-child(2){animation-delay:.06s}
.day-group.active .timeline-item:nth-child(3){animation-delay:.09s}
.day-group.active .timeline-item:nth-child(4){animation-delay:.12s}
.day-group.active .timeline-item:nth-child(5){animation-delay:.15s}
.day-group.active .timeline-item:nth-child(6){animation-delay:.18s}
.day-group.active .timeline-item:nth-child(7){animation-delay:.21s}
.day-group.active .timeline-item:nth-child(8){animation-delay:.24s}
.day-group.active .timeline-item:nth-child(9){animation-delay:.27s}
.day-group.active .transport-card{animation:fadeInUp .4s .03s cubic-bezier(.4,0,.2,1) both}
.day-group.active .day-header-card{animation:fadeInUp .35s cubic-bezier(.4,0,.2,1) both}

/* ========== Responsive ========== */
@media (max-width:960px){
  .banner{padding:0 24px;height:180px}
  .banner-left h1{font-size:28px}.banner-left h1 span{font-size:14px}
  .banner-badge{padding:14px 20px;gap:18px}.badge-item .num{font-size:22px}
  .tabs-bar{padding:8px 24px}
  .timeline-panel{width:380px;min-width:380px;padding:16px 14px}
  .main-wrap{height:calc(100vh - 180px - 47px)}
}
@media (max-width:680px){
  .banner{flex-direction:column;align-items:flex-start;padding:20px;height:auto;gap:16px}
  .banner-badge{align-self:stretch;justify-content:center}
  .main-wrap{flex-direction:column;height:auto}
  .timeline-panel{width:100%;min-width:100%;max-height:50vh;border-right:none;border-bottom:1px solid var(--gray-200)}
  .map-panel{min-height:40vh}
}
</style>
</head>

<script>
// ==================== DATA ====================
const DAY_META = [
  { date:'6月19日 周五', title:'抵达·万国建筑', note:'D2867 南京南07:57→青岛北12:56，打车约20min到酒店' },

// ==================== RENDER TIMELINE ====================
function renderTimeline(dayIdx) {
  var panel = document.getElementById('timelinePanel');
  var meta = DAY_META[dayIdx];
  var pois = POIS.filter(function(p){ return p.day === dayIdx; });
  var html = '<div class="day-group active">';
  // Day header
  html += '<div class="day-header-card">';
  html += '<div class="dh-date">' + meta.date + '</div>';
  html += '<div class="dh-title">' + meta.title + '</div>';
  html += '<div class="dh-note">' + meta.note + '</div>';
  html += '</div>';
  for (var i = 0; i < pois.length; i++) {
    var p = pois[i];
    var c = CAT[p.cat];
    if (p.isTransport) {
      html += '<div class="transport-card" data-poi-id="' + p.id + '" data-lat="' + p.lat + '" data-lng="' + p.lng + '">';
      html += '<span class="tc-icon">🚄</span>';
      html += '<div class="tc-info"><div class="tc-route">' + p.name + '</div>';
      html += '<div class="tc-detail">' + p.desc + ' · ' + p.duration + '</div></div></div>';
    } else {
      html += '<div class="timeline-item ' + c.tl + '" data-poi-id="' + p.id + '" data-lat="' + p.lat + '" data-lng="' + p.lng + '">';
      html += '<div class="timeline-dot-wrap"><div class="timeline-dot ' + c.dot + '">' + (i+1) + '</div><div class="timeline-line-wrap"></div></div>';
      html += '<div class="timeline-card">';
      html += '<div class="card-header"><span class="card-time">' + p.time + '</span>';
      html += '<span class="card-tag ' + c.tag + '">' + c.label + '</span></div>';
      html += '<div class="card-name">' + p.name + '</div>';
      html += '<div class="card-desc">' + p.desc + '</div>';
      html += '<div class="card-meta"><span>💰 ' + p.cost + '</span><span>⏱ ' + p.duration + '</span></div>';
      if (p.tip) html += '<div class="card-tip">💡 ' + p.tip + '</div>';
      html += '</div></div>';
    }
  }
  html += '</div>';
  panel.innerHTML = html;
  // Click handlers
  panel.querySelectorAll('.timeline-item,.transport-card').forEach(function(el){
    el.addEventListener('click', function(){
      var lat = parseFloat(this.dataset.lat);
      var lng = parseFloat(this.dataset.lng);
      if (lat && lng) flyTo(lat, lng, this.dataset.poiId);
    });
  });
}

// ==================== MAP ====================
var map, markers, polylines, infoWin;
var currentDay = 0;

function initMap() {
  map = new TMap.Map('map', { center: new TMap.LatLng(36.067, 120.35), zoom: 12, viewMode:'2D' });
  addDayMarkers(currentDay);
}

function addDayMarkers(dayIdx) {
  if (markers) markers.setMap(null);
  if (polylines) polylines.setMap(null);
  if (infoWin) { infoWin.close(); infoWin = null; }
  var pois = POIS.filter(function(p){ return p.day === dayIdx && !p.isTransport; });
  if (pois.length === 0) return;
  // Styles
  var styles = {};
  Object.keys(CAT).forEach(function(k){
    styles[k] = new TMap.MarkerStyle({ width:30, height:30, anchor:{ x:15, y:15 }, src: makeDotSVG(CAT[k].color) });
  });
  markers = new TMap.MultiMarker({
    map: map, styles: styles,
    geometries: pois.map(function(p,i){ return { id:'m_'+p.id, styleId:p.cat, position:new TMap.LatLng(p.lat,p.lng), properties:{ title:(i+1)+'. '+p.name } }; })
  });
  markers.on('click', function(evt){
    var pid = parseInt(evt.geometry.id.replace('m_',''));
    var poi = POIS.find(function(p){ return p.id === pid; });
    if (poi) showInfo(poi);
  });
  // Polyline
  if (pois.length >= 2) {
    polylines = new TMap.MultiPolyline({
      map:map, styles:{ route:new TMap.PolylineStyle({ color:'#0ea5e9', width:3, lineCap:'round', dashArray:[12,6], borderWidth:0 }) },
      geometries:[{ id:'poly_'+dayIdx, styleId:'route', paths:pois.map(function(p){ return new TMap.LatLng(p.lat,p.lng); }) }]
    });
  }
  // Fit bounds
  var bounds = new TMap.LatLngBounds();
  pois.forEach(function(p){ bounds.extend(new TMap.LatLng(p.lat,p.lng)); });
  map.fitBounds(bounds, { padding:80 });
}

function showInfo(poi) {
  var c = CAT[poi.cat];
  if (infoWin) infoWin.close();
  infoWin = new TMap.InfoWindow({
    map:map, position:new TMap.LatLng(poi.lat,poi.lng),
    content:'<div class="ci-win"><div class="ci-name">' + poi.name + '</div>'
      + '<div class="ci-tag" style="background:' + c.color + '22;color:' + c.color + '">' + c.label + '</div>'
      + '<div class="ci-meta">' + poi.time + ' · ' + poi.duration + '<br>' + poi.desc + '</div></div>'
  });
  infoWin.open();
  setTimeout(function(){ if(infoWin){ infoWin.close(); } }, 6000);
}

function makeDotSVG(color) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30">'
    + '<defs><filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.2"/></filter></defs>'
    + '<circle cx="15" cy="15" r="12" fill="' + color + '" filter="url(#s)"/>'
    + '<circle cx="15" cy="15" r="9" fill="white" opacity="0.3"/>'
    + '</svg>';
  return toDataURI(svg);
}

function toDataURI(svg) {
  var bytes = [];
  for (var i = 0; i < svg.length; i++) {
    var cd = svg.charCodeAt(i);
    if (cd < 128) bytes.push(cd);
    else if (cd < 2048) { bytes.push((cd>>6)|192); bytes.push((cd&63)|128); }
    else { bytes.push((cd>>12)|224); bytes.push(((cd>>6)&63)|128); bytes.push((cd&63)|128); }
  }
  return 'data:image/svg+xml;base64,' + btoa(String.fromCharCode.apply(null, bytes));
}

function flyTo(lat, lng, poiId) {
  map.easeTo({ center:new TMap.LatLng(lat,lng), zoom:15 }, { duration:800 });
  setTimeout(function(){
    var poi = POIS.find(function(p){ return p.id === parseInt(poiId); });
    if (poi) showInfo(poi);
  }, 900);
}

// ==================== TAB SWITCH ====================
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    var dayIdx = parseInt(this.dataset.day);
    currentDay = dayIdx;
    renderTimeline(dayIdx);
    addDayMarkers(dayIdx);
    document.getElementById('timelinePanel').scrollTop = 0;
    var dayPois = POIS.filter(function(p){ return p.day === dayIdx && !p.isTransport; });
    document.getElementById('statPOIs').textContent = dayPois.length;
  });
});

document.addEventListener('DOMContentLoaded', function(){
  renderTimeline(0);
  initMap();
});
