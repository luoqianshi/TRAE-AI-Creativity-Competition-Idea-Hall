<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="'PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif">
  <rect width="1280" height="800" fill="#f7f9fc"/>
  <text x="640" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b4a">营养拼图 = 达标"区间",不是"补满"</text>
  <text x="640" y="84" text-anchor="middle" font-size="18" fill="#5b6b86">每块有下限(RNI)和上限(UL/慢病约束):落区间内才绿 · 低于下限或高于上限都红</text>

  <!-- legend -->
  <g transform="translate(360,108)">
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#5fae7e"/>
    <text x="30" y="17" font-size="15" fill="#4a5568">达标(区间内)</text>
    <rect x="180" y="0" width="22" height="22" rx="5" fill="#e6b450"/>
    <text x="210" y="17" font-size="15" fill="#4a5568">接近边界</text>
    <rect x="330" y="0" width="22" height="22" rx="5" fill="#d76a63"/>
    <text x="360" y="17" font-size="15" fill="#4a5568">越下限 / 超上限</text>
  </g>

  <!-- helper: each tile shows name + range gauge -->
  <!-- Row 1 -->
  <!-- 谷薯 -->
  <g transform="translate(120,170)">
    <rect width="320" height="170" rx="16" fill="#eaf5ef" stroke="#5fae7e" stroke-width="3"/>
    <text x="24" y="44" font-size="22" font-weight="700" fill="#2f7d5b">谷薯类</text>
    <text x="296" y="44" text-anchor="end" font-size="15" fill="#5fae7e">✓ 达标</text>
    <text x="24" y="78" font-size="14" fill="#5b6b86">碳水 / 膳食纤维 / B族</text>
    <!-- gauge -->
    <rect x="24" y="100" width="272" height="16" rx="8" fill="#e3e9f0"/>
    <rect x="96" y="100" width="120" height="16" rx="8" fill="#bfe2cd"/>
    <circle cx="170" cy="108" r="11" fill="#2f7d5b"/>
    <text x="96" y="142" font-size="12" fill="#94a2b5">下限</text>
    <text x="296" y="142" text-anchor="end" font-size="12" fill="#94a2b5">上限</text>
  </g>
  <!-- 蔬菜 -->
  <g transform="translate(480,170)">
    <rect width="320" height="170" rx="16" fill="#fbf4e6" stroke="#e6b450" stroke-width="3"/>
    <text x="24" y="44" font-size="22" font-weight="700" fill="#a9802b">蔬菜类</text>
    <text x="296" y="44" text-anchor="end" font-size="15" fill="#c79a3a">▲ 略不足</text>
    <text x="24" y="78" font-size="14" fill="#5b6b86">维C / 钾 / 膳食纤维</text>
    <rect x="24" y="100" width="272" height="16" rx="8" fill="#e3e9f0"/>
    <rect x="96" y="100" width="120" height="16" rx="8" fill="#f0dcab"/>
    <circle cx="108" cy="108" r="11" fill="#d99a2b"/>
    <text x="96" y="142" font-size="12" fill="#94a2b5">下限</text>
    <text x="296" y="142" text-anchor="end" font-size="12" fill="#94a2b5">上限</text>
  </g>
  <!-- 水果 -->
  <g transform="translate(840,170)">
    <rect width="320" height="170" rx="16" fill="#eaf5ef" stroke="#5fae7e" stroke-width="3"/>
    <text x="24" y="44" font-size="22" font-weight="700" fill="#2f7d5b">水果类</text>
    <text x="296" y="44" text-anchor="end" font-size="15" fill="#5fae7e">✓ 达标</text>
    <text x="24" y="78" font-size="14" fill="#5b6b86">维C / 钾 / 糖(注意上限)</text>
    <rect x="24" y="100" width="272" height="16" rx="8" fill="#e3e9f0"/>
    <rect x="96" y="100" width="120" height="16" rx="8" fill="#bfe2cd"/>
    <circle cx="190" cy="108" r="11" fill="#2f7d5b"/>
    <text x="96" y="142" font-size="12" fill="#94a2b5">下限</text>
    <text x="296" y="142" text-anchor="end" font-size="12" fill="#94a2b5">上限</text>
  </g>

  <!-- Row 2 -->
  <!-- 畜禽鱼蛋 -->
  <g transform="translate(120,360)">
    <rect width="320" height="170" rx="16" fill="#eaf5ef" stroke="#5fae7e" stroke-width="3"/>
    <text x="24" y="44" font-size="22" font-weight="700" fill="#2f7d5b">畜禽鱼蛋</text>
    <text x="296" y="44" text-anchor="end" font-size="15" fill="#5fae7e">✓ 达标</text>
    <text x="24" y="78" font-size="14" fill="#5b6b86">优质蛋白(嘌呤注意)</text>
    <rect x="24" y="100" width="272" height="16" rx="8" fill="#e3e9f0"/>
    <rect x="96" y="100" width="120" height="16" rx="8" fill="#bfe2cd"/>
    <circle cx="160" cy="108" r="11" fill="#2f7d5b"/>
    <text x="96" y="142" font-size="12" fill="#94a2b5">下限</text>
    <text x="296" y="142" text-anchor="end" font-size="12" fill="#94a2b5">上限</text>
  </g>
  <!-- 奶豆 -->
  <g transform="translate(480,360)">
    <rect width="320" height="170" rx="16" fill="#eaf5ef" stroke="#5fae7e" stroke-width="3"/>
    <text x="24" y="44" font-size="22" font-weight="700" fill="#2f7d5b">奶 · 豆</text>
    <text x="296" y="44" text-anchor="end" font-size="15" fill="#5fae7e">✓ 达标</text>
    <text x="24" y="78" font-size="14" fill="#5b6b86">钙 / 蛋白(老人钙↑)</text>
    <rect x="24" y="100" width="272" height="16" rx="8" fill="#e3e9f0"/>
    <rect x="96" y="100" width="120" height="16" rx="8" fill="#bfe2cd"/>
    <circle cx="150" cy="108" r="11" fill="#2f7d5b"/>
    <text x="96" y="142" font-size="12" fill="#94a2b5">下限</text>
    <text x="296" y="142" text-anchor="end" font-size="12" fill="#94a2b5">上限</text>
  </g>
  <!-- 油盐 (RED - 超上限, 慢病关键) -->
  <g transform="translate(840,360)">
    <rect width="320" height="170" rx="16" fill="#fbedec" stroke="#d76a63" stroke-width="3.5"/>
    <text x="24" y="44" font-size="22" font-weight="700" fill="#b5443f">油 · 盐(钠)</text>
    <text x="296" y="44" text-anchor="end" font-size="15" font-weight="700" fill="#c4514a">● 超上限</text>
    <text x="24" y="78" font-size="14" fill="#8a5a57">慢病老人:要"低于上限才绿"</text>
    <rect x="24" y="100" width="272" height="16" rx="8" fill="#e3e9f0"/>
    <rect x="170" y="100" width="126" height="16" rx="8" fill="#eebcb8"/>
    <circle cx="282" cy="108" r="11" fill="#c4514a"/>
    <text x="96" y="142" font-size="12" fill="#94a2b5">下限</text>
    <text x="296" y="142" text-anchor="end" font-size="12" fill="#c4514a" font-weight="700">上限(超!)</text>
  </g>

  <!-- key message banner -->
  <rect x="120" y="566" width="1040" height="92" rx="14" fill="#fff7ed" stroke="#e3b87a" stroke-width="2"/>
  <text x="150" y="602" font-size="18" font-weight="700" fill="#b07726">为什么是"区间"而不是"补满"?</text>
  <text x="150" y="632" font-size="15" fill="#7a6a52">营养素有下限(RNI)也有上限(UL)。"补满=健康"会驱使给本不缺的老人补铁补钙超 UL、忽视钠要"低于上限"。</text>

  <!-- interaction note -->
  <rect x="120" y="678" width="510" height="86" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="2"/>
  <text x="144" y="710" font-size="16" font-weight="700" fill="#1a2b4a">拼图是操作入口</text>
  <text x="144" y="736" font-size="14" fill="#5b6b86">点缺块 → 从已审核池给"能补这块"的候选菜</text>
  <text x="144" y="756" font-size="13" fill="#94a2b5">自定义加菜 → 触发硬上限复检</text>

  <rect x="650" y="678" width="510" height="86" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="2"/>
  <text x="674" y="710" font-size="16" font-weight="700" fill="#1a2b4a">移除不爱吃 → 近似替换</text>
  <text x="674" y="736" font-size="14" fill="#5b6b86">同组营养相近,显示"相似度 X%"+关键差异</text>
  <text x="674" y="756" font-size="13" fill="#94a2b5">慢病层先过约束+药食检查,命中只提示不自动换</text>
</svg>
