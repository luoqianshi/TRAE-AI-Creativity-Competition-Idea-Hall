<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="'PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif">
  <rect width="1280" height="800" fill="#f7f9fc"/>
  <text x="640" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b4a">吃了么?·四层技术架构</text>
  <text x="640" y="84" text-anchor="middle" font-size="18" fill="#5b6b86">同一引擎,默认层=软目标+指南硬上限 · 慢病层=叠加硬约束 · 营养加总由程序计算,大模型不估算</text>

  <!-- Input -->
  <rect x="80" y="120" width="280" height="120" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="2"/>
  <text x="220" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#1a2b4a">用户档案 = 一组约束</text>
  <text x="220" y="182" text-anchor="middle" font-size="15" fill="#5b6b86">年龄段 / 口味 / 目标</text>
  <text x="220" y="206" text-anchor="middle" font-size="15" fill="#5b6b86">(慢病层) 病种 / 用药 / 医嘱</text>

  <!-- arrow -->
  <path d="M360 180 H 420" stroke="#8aa0bd" stroke-width="3" marker-end="url(#ah)"/>

  <!-- Engine box -->
  <rect x="430" y="120" width="540" height="560" rx="16" fill="#eef3fa" stroke="#9fb6d6" stroke-width="2"/>
  <text x="700" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#33507d">确定性规划引擎(分层加载约束)</text>

  <!-- Layer 1 证据层 -->
  <rect x="460" y="170" width="480" height="110" rx="10" fill="#ffffff" stroke="#cdb98a" stroke-width="2"/>
  <text x="480" y="200" font-size="19" font-weight="700" fill="#8a6d2f">① 证据层</text>
  <text x="480" y="228" font-size="15" fill="#5b6b86">膳食指南 / 说明书 / 标准 + 原文定位</text>
  <text x="480" y="252" font-size="15" fill="#5b6b86">RAG 只答"为什么",不做规则真值</text>
  <text x="918" y="200" text-anchor="end" font-size="13" fill="#a98c4f">文档库+引用索引</text>

  <!-- Layer 2 数据层 -->
  <rect x="460" y="296" width="480" height="100" rx="10" fill="#ffffff" stroke="#8fc0a9" stroke-width="2"/>
  <text x="480" y="326" font-size="19" font-weight="700" fill="#2f7d5b">② 事实数据层</text>
  <text x="480" y="354" font-size="15" fill="#5b6b86">食物成分 / 别名 / 可食部 / 生熟 / 食物组</text>
  <text x="480" y="378" font-size="15" fill="#5b6b86">每份营养精确数值(下限+上限)</text>
  <text x="918" y="326" text-anchor="end" font-size="13" fill="#3f9b73">关系数据库</text>

  <!-- Layer 3 规则层 -->
  <rect x="460" y="412" width="480" height="110" rx="10" fill="#ffffff" stroke="#7fa8d6" stroke-width="2.5"/>
  <text x="480" y="442" font-size="19" font-weight="700" fill="#2b5b9e">③ 规则层(核心)</text>
  <text x="480" y="470" font-size="15" fill="#5b6b86">软目标 / 硬约束 / 合并症冲突 / 升级</text>
  <text x="480" y="494" font-size="15" fill="#5b6b86">营养加总+达标区间判定 = 程序计算</text>
  <text x="918" y="442" text-anchor="end" font-size="13" fill="#3f72b3">确定性规则引擎</text>

  <!-- Layer 4 表达层 -->
  <rect x="460" y="538" width="480" height="116" rx="10" fill="#ffffff" stroke="#c79bd0" stroke-width="2"/>
  <text x="480" y="568" font-size="19" font-weight="700" fill="#834a91">④ 表达层</text>
  <text x="480" y="596" font-size="15" fill="#5b6b86">营养拼图 / 菜单说明 / "为什么"</text>
  <text x="480" y="620" font-size="15" fill="#5b6b86">模板填充(固定句式+证据原文),非自由生成</text>
  <text x="480" y="644" font-size="15" fill="#5b6b86">每条建议强制附来源</text>
  <text x="918" y="568" text-anchor="end" font-size="13" fill="#9a64a6">受约束生成</text>

  <!-- flow arrows inside engine -->
  <path d="M700 280 V 296" stroke="#8aa0bd" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M700 396 V 412" stroke="#8aa0bd" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M700 522 V 538" stroke="#8aa0bd" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- output to user -->
  <path d="M970 596 H 1040" stroke="#8aa0bd" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="1040" y="540" width="160" height="120" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="2"/>
  <text x="1120" y="588" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2b4a">营养拼图</text>
  <text x="1120" y="616" text-anchor="middle" font-size="14" fill="#5b6b86">达标=绿</text>
  <text x="1120" y="638" text-anchor="middle" font-size="14" fill="#5b6b86">越界=红</text>

  <!-- 会话层 side -->
  <rect x="1010" y="120" width="190" height="170" rx="12" fill="#fff7ed" stroke="#e3b87a" stroke-width="2"/>
  <text x="1105" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#b07726">会话层</text>
  <text x="1105" y="178" text-anchor="middle" font-size="13" fill="#7a6a52">多轮状态管理</text>
  <text x="1105" y="200" text-anchor="middle" font-size="13" fill="#7a6a52">偏好记忆(与健康</text>
  <text x="1105" y="218" text-anchor="middle" font-size="13" fill="#7a6a52">数据隔离存储)</text>
  <text x="1105" y="252" text-anchor="middle" font-size="13" fill="#7a6a52">MVP=手动设偏好</text>
  <text x="1105" y="272" text-anchor="middle" font-size="13" fill="#7a6a52">不做自动学习</text>

  <!-- 安全闸门 side -->
  <rect x="1010" y="306" width="190" height="210" rx="12" fill="#fdeeee" stroke="#dd9a9a" stroke-width="2"/>
  <text x="1105" y="336" text-anchor="middle" font-size="17" font-weight="700" fill="#b5443f">安全闸门</text>
  <text x="1105" y="366" text-anchor="middle" font-size="13" fill="#8a5a57">药食警示(全层生效)</text>
  <text x="1105" y="390" text-anchor="middle" font-size="13" fill="#8a5a57">缺数据/冲突未裁决</text>
  <text x="1105" y="410" text-anchor="middle" font-size="13" fill="#8a5a57">→ 停止个体化</text>
  <text x="1105" y="438" text-anchor="middle" font-size="13" fill="#8a5a57">三级降级:</text>
  <text x="1105" y="460" text-anchor="middle" font-size="13" fill="#8a5a57">轻=警示 / 中=通用餐</text>
  <text x="1105" y="480" text-anchor="middle" font-size="13" fill="#8a5a57">重=拒答转人工</text>
  <text x="1105" y="504" text-anchor="middle" font-size="13" fill="#8a5a57">多模型分歧→人工复核</text>

  <!-- bottom note -->
  <text x="80" y="720" font-size="15" fill="#5b6b86">底线:AI 不是证据来源,只做检索/抽取/反证;每条可执行规则绑定权威原始来源 + 营养师/药师审核;缺关键信息→系统会拒答。</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8aa0bd"/>
    </marker>
  </defs>
</svg>
