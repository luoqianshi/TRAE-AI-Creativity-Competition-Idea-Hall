<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="'PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif">
  <rect width="1280" height="760" fill="#f7f9fc"/>
  <text x="640" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b4a">吃了么?·用户旅程</text>
  <text x="640" y="84" text-anchor="middle" font-size="18" fill="#5b6b86">大众默认餐是低门槛入口 · 慢病层是核心专业深度 · 同一引擎,叠加约束</text>

  <!-- top lane: 默认层(大众,低风险) -->
  <rect x="40" y="120" width="1200" height="220" rx="14" fill="#eef6f0" stroke="#a9d2ba" stroke-width="2"/>
  <text x="64" y="150" font-size="18" font-weight="700" fill="#2f7d5b">默认层 · 大众 · 零输入即用 · 低风险</text>

  <!-- step nodes top -->
  <g>
    <rect x="70" y="170" width="220" height="140" rx="12" fill="#ffffff" stroke="#7fbf9b" stroke-width="2"/>
    <text x="180" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#2f7d5b">1 打开即用</text>
    <text x="180" y="232" text-anchor="middle" font-size="14" fill="#5b6b86">不问病不问药</text>
    <text x="180" y="254" text-anchor="middle" font-size="14" fill="#5b6b86">可选年龄段</text>
    <text x="180" y="276" text-anchor="middle" font-size="14" fill="#5b6b86">(成年/65+/80+)</text>

    <rect x="330" y="170" width="220" height="140" rx="12" fill="#ffffff" stroke="#7fbf9b" stroke-width="2"/>
    <text x="440" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#2f7d5b">2 营养拼图</text>
    <text x="440" y="232" text-anchor="middle" font-size="14" fill="#5b6b86">达标区间可视化</text>
    <text x="440" y="254" text-anchor="middle" font-size="14" fill="#5b6b86">绿=区间内</text>
    <text x="440" y="276" text-anchor="middle" font-size="14" fill="#5b6b86">红=越下/上限</text>

    <rect x="590" y="170" width="220" height="140" rx="12" fill="#ffffff" stroke="#7fbf9b" stroke-width="2"/>
    <text x="700" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#2f7d5b">3 近似替换</text>
    <text x="700" y="232" text-anchor="middle" font-size="14" fill="#5b6b86">拿掉不爱吃→补</text>
    <text x="700" y="254" text-anchor="middle" font-size="14" fill="#5b6b86">营养相似项</text>
    <text x="700" y="276" text-anchor="middle" font-size="14" fill="#5b6b86">显示相似度%</text>

    <rect x="850" y="170" width="220" height="140" rx="12" fill="#ffffff" stroke="#7fbf9b" stroke-width="2"/>
    <text x="960" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#2f7d5b">4 周平衡</text>
    <text x="960" y="232" text-anchor="middle" font-size="14" fill="#5b6b86">昨天火锅</text>
    <text x="960" y="254" text-anchor="middle" font-size="14" fill="#5b6b86">今天清淡</text>
    <text x="960" y="276" text-anchor="middle" font-size="14" fill="#5b6b86">衰减窗口+上下界</text>
  </g>
  <path d="M290 240 H 330" stroke="#6aa886" stroke-width="3" marker-end="url(#ag)"/>
  <path d="M550 240 H 590" stroke="#6aa886" stroke-width="3" marker-end="url(#ag)"/>
  <path d="M810 240 H 850" stroke="#6aa886" stroke-width="3" marker-end="url(#ag)"/>

  <!-- switch arrow down (分级知情同意) -->
  <path d="M1095 310 V 360 H 700 V 410" stroke="#cc8a3c" stroke-width="3" fill="none" marker-end="url(#ao)"/>
  <rect x="760" y="332" width="360" height="56" rx="10" fill="#fff7ed" stroke="#e3b87a" stroke-width="2"/>
  <text x="940" y="366" text-anchor="middle" font-size="15" font-weight="600" fill="#b07726">选病种/用药 → 分级知情同意 → 升级慢病层</text>

  <!-- bottom lane: 慢病层(核心,高风险带闸门) -->
  <rect x="40" y="410" width="1200" height="230" rx="14" fill="#eef3fa" stroke="#9fb6d6" stroke-width="2"/>
  <text x="64" y="440" font-size="18" font-weight="700" fill="#2b5b9e">慢病层 · 老人(核心) · 叠加硬约束 + 药食警示 · 带安全闸门</text>

  <g>
    <rect x="70" y="460" width="250" height="150" rx="12" fill="#ffffff" stroke="#7fa8d6" stroke-width="2"/>
    <text x="195" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#2b5b9e">5 叠加约束</text>
    <text x="195" y="522" text-anchor="middle" font-size="14" fill="#5b6b86">高血压→低钠</text>
    <text x="195" y="544" text-anchor="middle" font-size="14" fill="#5b6b86">糖尿病→控糖低GI</text>
    <text x="195" y="566" text-anchor="middle" font-size="14" fill="#5b6b86">拼图钠"低于上限才绿"</text>

    <rect x="360" y="460" width="250" height="150" rx="12" fill="#ffffff" stroke="#dd9a9a" stroke-width="2.5"/>
    <text x="485" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#b5443f">6 药食警示</text>
    <text x="485" y="522" text-anchor="middle" font-size="14" fill="#5b6b86">华法林×菠菜</text>
    <text x="485" y="544" text-anchor="middle" font-size="14" fill="#5b6b86">红色拦截</text>
    <text x="485" y="566" text-anchor="middle" font-size="14" fill="#5b6b86">不自动替换→提示咨询</text>

    <rect x="650" y="460" width="250" height="150" rx="12" fill="#ffffff" stroke="#dd9a9a" stroke-width="2.5"/>
    <text x="775" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#b5443f">7 会拒答</text>
    <text x="775" y="522" text-anchor="middle" font-size="14" fill="#5b6b86">超范围/多病冲突</text>
    <text x="775" y="544" text-anchor="middle" font-size="14" fill="#5b6b86">缺关键数据</text>
    <text x="775" y="566" text-anchor="middle" font-size="14" fill="#5b6b86">→ 停止并转人工</text>

    <rect x="940" y="460" width="250" height="150" rx="12" fill="#ffffff" stroke="#c79bd0" stroke-width="2"/>
    <text x="1065" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#834a91">8 可追溯</text>
    <text x="1065" y="522" text-anchor="middle" font-size="14" fill="#5b6b86">点建议→看来源</text>
    <text x="1065" y="544" text-anchor="middle" font-size="14" fill="#5b6b86">《膳食指南》页码</text>
    <text x="1065" y="566" text-anchor="middle" font-size="14" fill="#5b6b86">+审核营养师+复审日</text>
  </g>
  <path d="M320 535 H 360" stroke="#7f93b3" stroke-width="3" marker-end="url(#ag)"/>
  <path d="M610 535 H 650" stroke="#7f93b3" stroke-width="3" marker-end="url(#ag)"/>
  <path d="M900 535 H 940" stroke="#7f93b3" stroke-width="3" marker-end="url(#ag)"/>

  <text x="640" y="690" text-anchor="middle" font-size="16" fill="#5b6b86">子女端(付费方+监管方):查看父母饮食、接收警示、远程协助 —— MVP 可做轻量小程序,叙事向特殊人群扩散</text>

  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6aa886"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cc8a3c"/>
    </marker>
  </defs>
</svg>
