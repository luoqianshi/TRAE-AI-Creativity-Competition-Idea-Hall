<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日宜·反卷 | 每日解压签</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root{
    --c1:#a8edea; --c2:#fed6e3; --ink:#3a3a4a; --gold:#d4a017;
  }
  html,body{height:100%;}
  body{
    font-family: "PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    background: linear-gradient(135deg,var(--c1) 0%,var(--c2) 100%);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px; color:var(--ink);
  }
  .wrap{ width:100%; max-width:440px; text-align:center; }

  .header h1{
    font-size:34px; letter-spacing:4px; margin-bottom:6px;
    background:linear-gradient(90deg,#ff8fb1,#a78bfa);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .header .sub{ font-size:14px; opacity:.7; margin-bottom:26px; letter-spacing:1px;}

  .name-row{ display:flex; gap:10px; margin-bottom:20px; }
  .name-row input{
    flex:1; padding:13px 16px; border:none; border-radius:14px;
    font-size:15px; outline:none; background:rgba(255,255,255,.75);
    box-shadow:0 4px 14px rgba(0,0,0,.05);
  }
  .btn{
    padding:13px 22px; border:none; border-radius:14px; cursor:pointer;
    font-size:15px; font-weight:600; color:#fff;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    box-shadow:0 6px 16px rgba(255,154,158,.4);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform:scale(.96); }

  /* 签筒占位 */
  .fortune{
    margin-top:10px; min-height:360px; display:flex; align-items:center; justify-content:center;
    perspective:1000px;
  }
  .card{
    width:100%; background:rgba(255,255,255,.82); backdrop-filter:blur(6px);
    border-radius:22px; padding:26px 22px 22px; box-shadow:0 14px 40px rgba(0,0,0,.10);
    position:relative; transform:rotateY(90deg); opacity:0; transition:all .55s cubic-bezier(.2,.8,.2,1);
  }
  .card.show{ transform:rotateY(0); opacity:1; }

  .ribbon{
    position:absolute; top:-12px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#fff; font-size:12px; padding:5px 16px;
    border-radius:20px; letter-spacing:2px; box-shadow:0 4px 10px rgba(212,160,23,.4);
  }
  .who{ font-size:15px; opacity:.6; margin:6px 0 4px;}
  .poem{ font-size:22px; font-weight:700; margin-bottom:18px; letter-spacing:1px;}

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left; }
  .cell{
    background:rgba(255,255,255,.6); border-radius:12px; padding:11px 13px;
  }
  .cell .k{ font-size:12px; opacity:.55; margin-bottom:3px;}
  .cell .v{ font-size:15px; font-weight:600;}
  .cell.yi .v{ color:#2e8b57;}
  .cell.ji .v{ color:#d9534f;}
  .swatch{ display:inline-block; width:14px; height:14px; border-radius:50%;
    vertical-align:-2px; margin-right:5px; border:1px solid rgba(0,0,0,.08);}

  .quote{
    margin-top:16px; padding:12px 14px; background:rgba(167,139,250,.12);
    border-radius:12px; font-size:13.5px; line-height:1.6; font-style:italic;
  }

  .again{ margin-top:18px; font-size:14px;}
  .again button{
    background:transparent; border:1.5px dashed var(--gold); color:var(--gold);
    padding:9px 20px; border-radius:20px; cursor:pointer; font-weight:600;
  }
  .hint{ margin-top:24px; font-size:12px; opacity:.5;}

  .shake{ animation:shake .5s ease; }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px) rotate(-2deg);}
    40%{transform:translateX(8px) rotate(2deg);}
    60%{transform:translateX(-6px) rotate(-1deg);}
    80%{transform:translateX(6px) rotate(1deg);}
  }
  @media(max-width:380px){ .header h1{font-size:28px;} .poem{font-size:19px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>今日宜·反卷</h1>
    <div class="sub">世界很大，先抽个签再躺一会儿 ✨</div>
  </div>

  <div class="name-row">
    <input id="name" type="text" placeholder="输入你的昵称（可不填）" maxlength="12">
    <button class="btn" id="drawBtn">摇一摇抽签</button>
  </div>

  <div class="fortune">
    <div class="card" id="card">
      <div class="ribbon">第 <span id="no">001</span> 签</div>
      <div class="who" id="who">致：未署名的朋友</div>
      <div class="poem" id="poem">点上方按钮，抽取今日好运</div>
      <div class="grid">
        <div class="cell yi"><div class="k">今日宜</div><div class="v" id="yi">—</div></div>
        <div class="cell ji"><div class="k">今日忌</div><div class="v" id="ji">—</div></div>
        <div class="cell"><div class="k">幸运色</div><div class="v" id="color">—</div></div>
        <div class="cell"><div class="k">幸运数字</div><div class="v" id="num">—</div></div>
      </div>
      <div class="quote" id="quote">— 反卷不是摆烂，是温柔地活着 —</div>
      <div class="again">
        <button id="againBtn">↻ 换一签</button>
      </div>
    </div>
  </div>

  <div class="hint">本作品为 TRAE AI 创造力大赛参赛创意 Demo · 纯前端本地随机</div>
</div>

<script>
  // 签文素材库（本地随机，无任何外部依赖）
  const POEMS = [
    "上上签·躺赢","上签·顺其自然","中签·稳住能赢","平签·佛系万岁",
    "惊喜签·好运将至","隐藏签·摸鱼有理"
  ];
  const YI = ["摸鱼","准点下班","喝奶茶","放空发呆","睡午觉","撸猫","看晚霞","吃顿好的","拒绝加班","慢慢走路"];
  const JI = ["内卷","精神内耗","和人比较","深夜emo","立flag","无效社交","过度焦虑","赶DDL"];
  const COLORS = [
    ["治愈薄荷绿","#7ed8b6"],["温柔奶茶色","#d8b48a"],["幸运鹅黄","#f6d365"],
    ["元气珊瑚粉","#ff9a8b"],["宁静天青蓝","#7eb6ff"],["神秘薰衣草","#a78bfa"]
  ];
  const QUOTES = [
    "反卷不是摆烂，是温柔地活着。",
    "你不必时时刻刻有用，存在本身就有意义。",
    "今天的你，已经比昨天更值得被夸。",
    "世界很大，先照顾好自己的情绪。",
    "允许自己慢一点，花开有它的时辰。",
    "把'我可以'换成'我选择'，烦恼少一半。",
    "今天的好运，是从按下抽签键开始的。"
  ];

  const $ = id => document.getElementById(id);
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const pad = n => String(n).padStart(3,"0");

  function draw(){
    const name = $("name").value.trim();
    $("who").textContent = "致：" + (name || "未署名的朋友");

    const poem = pick(POEMS);
    const [colorName, colorHex] = pick(COLORS);

    // 避免宜/忌撞词，简单去重
    let yi = pick(YI), ji = pick(JI);

    $("poem").textContent = poem;
    $("yi").textContent = "宜 " + yi;
    $("ji").textContent = "忌 " + ji;
    $("color").innerHTML = `<span class="swatch" style="background:${colorHex}"></span>${colorName}`;
    $("num").textContent = Math.floor(Math.random()*99)+1;
    $("quote").textContent = "「 " + pick(QUOTES) + " 」";
    $("no").textContent = pad(Math.floor(Math.random()*999)+1);

    const card = $("card");
    card.classList.remove("show");
    // 触发重排后再显示，保证每次都有翻转动效
    void card.offsetWidth;
    card.classList.add("show");
  }

  $("drawBtn").addEventListener("click", function(){
    this.classList.add("shake");
    setTimeout(()=>this.classList.remove("shake"), 500);
    draw();
  });
  $("againBtn").addEventListener("click", draw);

  // 回车也可抽签
  $("name").addEventListener("keydown", e=>{ if(e.key==="Enter") $("drawBtn").click(); });
</script>
</body>
</html>
