<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物大战僵尸 - 时间线实时对战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Microsoft YaHei', sans-serif; overflow: hidden;
        }
        #gameContainer {
            position: relative; width: 1000px; height: 700px;
            background: #2d5016; border-radius: 12px; overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: center;
            color: white; font-size: 14px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .hud-item {
            background: rgba(0,0,0,0.5); padding: 6px 12px;
            border-radius: 8px; border: 2px solid rgba(255,255,255,0.3);
        }
        .era-indicator { font-size: 18px; font-weight: bold; color: #ffd700; }
        .sun-display { display: flex; align-items: center; gap: 6px; }
        .sun-icon {
            width: 20px; height: 20px;
            background: radial-gradient(circle, #ffeb3b, #ff9800);
            border-radius: 50%; display: inline-block;
        }
        #plantSelector {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; pointer-events: all; flex-wrap: wrap; justify-content: center;
            max-width: 900px;
        }
        .plant-card {
            width: 75px; height: 95px; background: rgba(0,0,0,0.7);
            border: 3px solid #8B4513; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; color: white; font-size: 10px;
            position: relative;
        }
        .plant-card:hover { transform: scale(1.08); border-color: #ffd700; }
        .plant-card.selected { border-color: #00ff00; box-shadow: 0 0 12px rgba(0,255,0,0.5); }
        .plant-card.on-cooldown { opacity: 0.4; pointer-events: none; }
        .plant-card.locked { opacity: 0.3; pointer-events: none; border-color: #555; }
        .plant-card .plant-icon { font-size: 28px; margin-bottom: 2px; }
        .plant-card .cost { color: #ffeb3b; font-weight: bold; font-size: 11px; }
        .plant-card .cooldown-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.6); border-radius: 0 0 5px 5px;
            height: 0%;
        }
        .plant-card .cooldown-text {
            position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            font-size: 9px; color: #aaa;
        }
        .plant-card .lock-icon {
            position: absolute; top: 2px; right: 2px; font-size: 14px;
        }
        .tool-btn {
            width: 50px; height: 50px; background: rgba(0,0,0,0.7);
            border: 2px solid #666; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; font-size: 24px;
            pointer-events: all; transition: all 0.2s;
        }
        .tool-btn:hover { border-color: #ffd700; transform: scale(1.1); }
        .tool-btn.selected { border-color: #ff0000; box-shadow: 0 0 10px rgba(255,0,0,0.5); }
        .tool-btn.on-cooldown { opacity: 0.4; pointer-events: none; }
        .item-slot {
            width: 50px; height: 50px; background: rgba(0,0,0,0.7);
            border: 2px solid #8B4513; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; font-size: 22px;
            pointer-events: all; transition: all 0.2s; position: relative;
        }
        .item-slot:hover { border-color: #ffd700; transform: scale(1.1); }
        .item-slot.selected { border-color: #00ff00; box-shadow: 0 0 12px rgba(0,255,0,0.5); }
        #hormoneDisplay {
            position: absolute; top: 55px; right: 10px;
            background: rgba(0,0,0,0.7); padding: 6px 12px;
            border-radius: 8px; border: 2px solid rgba(255,255,255,0.3);
            color: #ff69b4; font-weight: bold; font-size: 14px;
            pointer-events: none; z-index: 50;
        }
        #expDisplay {
            position: absolute; top: 95px; right: 10px;
            background: rgba(0,0,0,0.7); padding: 4px 10px;
            border-radius: 8px; border: 2px solid rgba(255,215,0,0.5);
            color: #ffd700; font-weight: bold; font-size: 12px;
            pointer-events: none; z-index: 50;
        }
        #startScreen, #gameOverScreen, #talentScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
            pointer-events: all; z-index: 100;
        }
        #gameOverScreen, #talentScreen { display: none; }
        .title { font-size: 42px; margin-bottom: 15px; text-shadow: 3px 3px 6px rgba(0,0,0,0.8); color: #ffd700; }
        .subtitle { font-size: 18px; margin-bottom: 20px; color: #ccc; }
        .btn {
            padding: 12px 36px; font-size: 22px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white; border: none; border-radius: 10px; cursor: pointer;
            transition: all 0.3s; font-family: 'Microsoft YaHei', sans-serif;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(76,175,80,0.5); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; text-align: center; }
        .stat-item { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; }
        .stat-value { font-size: 28px; font-weight: bold; color: #ffd700; }
        .stat-label { font-size: 13px; color: #aaa; margin-top: 4px; }
        .grade { font-size: 64px; font-weight: bold; margin: 15px 0; }
        .grade.S { color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.8); }
        .grade.A { color: #ff6b6b; }
        .grade.B { color: #4ecdc4; }
        .grade.C { color: #95a5a6; }
        .rules { text-align: left; max-width: 500px; margin: 15px 0; line-height: 1.7; color: #ddd; font-size: 13px; }
        .rules h3 { color: #ffd700; margin-bottom: 8px; font-size: 15px; }
        .rules ul { margin-left: 18px; }
        .talent-grid {
            display: flex; flex-wrap: wrap; gap: 12px; margin: 15px 0;
            justify-content: center; max-width: 700px;
        }
        .talent-card {
            width: 150px; padding: 14px; background: rgba(255,255,255,0.1);
            border: 3px solid #666; border-radius: 12px; cursor: pointer;
            transition: all 0.3s; text-align: center;
        }
        .talent-card:hover { transform: scale(1.05); border-color: #ffd700; }
        .talent-card.disabled { opacity: 0.35; pointer-events: none; border-color: #444; }
        .talent-card .talent-type { font-size: 24px; margin-bottom: 6px; }
        .talent-card .talent-title { font-size: 14px; font-weight: bold; color: #ffd700; margin-bottom: 6px; }
        .talent-card .talent-desc { font-size: 11px; color: #ccc; line-height: 1.5; }
        .talent-card .talent-cost { font-size: 12px; color: #ff69b4; margin-top: 6px; font-weight: bold; }
        .shop-btn {
            padding: 10px 30px; background: rgba(255,215,0,0.2); border: 2px solid #ffd700;
            border-radius: 8px; color: #ffd700; font-size: 16px; cursor: pointer;
            margin-top: 10px; transition: all 0.2s;
        }
        .shop-btn:hover { background: rgba(255,215,0,0.4); transform: scale(1.05); }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1000" height="700"></canvas>
        <div id="uiLayer">
            <div class="hud" id="hud" style="display:none;">
                <div class="hud-item era-indicator" id="eraDisplay">蛮荒时代</div>
                <div class="hud-item sun-display">
                    <span class="sun-icon"></span>
                    <span id="sunDisplay">200</span>
                </div>
                <div class="hud-item" id="timeDisplay">6:00</div>
                <div class="hud-item" id="killDisplay">击杀: 0</div>
                <div class="hud-item" id="scoreDisplay">分数: 0</div>
                <div class="hud-item" id="levelDisplay">经验: 0</div>
            </div>
            <div id="hormoneDisplay" style="display:none;">激素: 3瓶</div>
            <div id="expDisplay" style="display:none;">经验: 0/10</div>
            <div id="plantSelector" style="display:none;">
                <!-- 基础三系 -->
                <div class="plant-card" data-plant="archer" onclick="selectPlant('archer')">
                    <div class="plant-icon">🏹</div>
                    <div>弓手</div>
                    <div class="cost">100☀</div>
                    <div class="cooldown-overlay" id="cd-archer"></div>
                    <div class="cooldown-text" id="cdt-archer"></div>
                </div>
                <div class="plant-card" data-plant="logistics" onclick="selectPlant('logistics')">
                    <div class="plant-icon">📦</div>
                    <div>后勤</div>
                    <div class="cost">50☀</div>
                    <div class="cooldown-overlay" id="cd-logistics"></div>
                    <div class="cooldown-text" id="cdt-logistics"></div>
                </div>
                <div class="plant-card" data-plant="fortress" onclick="selectPlant('fortress')">
                    <div class="plant-icon">🏰</div>
                    <div>堡垒</div>
                    <div class="cost">50☀</div>
                    <div class="cooldown-overlay" id="cd-fortress"></div>
                    <div class="cooldown-text" id="cdt-fortress"></div>
                </div>
                <!-- 可解锁植物系 -->
                <div class="plant-card locked" data-plant="swamp" onclick="selectPlant('swamp')" id="card-swamp">
                    <div class="lock-icon" id="lock-swamp">🔒</div>
                    <div class="plant-icon">🌊</div>
                    <div>沼泽</div>
                    <div class="cost">250☀</div>
                    <div class="cooldown-overlay" id="cd-swamp"></div>
                    <div class="cooldown-text" id="cdt-swamp"></div>
                </div>
                <div class="plant-card locked" data-plant="push" onclick="selectPlant('push')" id="card-push">
                    <div class="lock-icon" id="lock-push">🔒</div>
                    <div class="plant-icon">🚜</div>
                    <div>推进</div>
                    <div class="cost">200☀</div>
                    <div class="cooldown-overlay" id="cd-push"></div>
                    <div class="cooldown-text" id="cdt-push"></div>
                </div>
                <!-- 工具按钮 -->
                <div class="tool-btn" id="shovelBtn" onclick="selectTool('shovel')" title="铲子(5秒冷却)">🥄</div>
                <div class="tool-btn" id="hormoneBtn" onclick="selectTool('hormone')" title="激素">💊</div>
                <div class="tool-btn" id="shopBtn" onclick="openShop()" title="升级商店" style="border-color:#ffd700;">🏪</div>
                <div id="itemBar" style="display:flex;gap:6px;pointer-events:all;margin-left:10px;"></div>
            </div>
        </div>
        <div id="startScreen">
            <div class="title">植物大战僵尸</div>
            <div class="subtitle">时间线实时对战 - 天赋版</div>
            <div class="rules">
                <h3>核心机制</h3>
                <ul>
                    <li>时代切换：僵尸原地进阶、回满血，植物不进化</li>
                    <li>经验系统：击杀僵尸获得经验，手动打开商店自由分配</li>
                    <li>商店功能：解锁新植物系 / 升级各系高阶形态</li>
                    <li>激素：点击使用，不同植物系效果不同</li>
                </ul>
            </div>
            <button class="btn" onclick="startGame()">开始游戏</button>
        </div>
        <div id="gameOverScreen">
            <div class="title" id="resultTitle">游戏结束</div>
            <div class="grade" id="gradeDisplay">S</div>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-value" id="statKills">0</div><div class="stat-label">击杀数</div></div>
                <div class="stat-item"><div class="stat-value" id="statLeaks">0</div><div class="stat-label">漏怪数</div></div>
                <div class="stat-item"><div class="stat-value" id="statTime">0:00</div><div class="stat-label">坚持时长</div></div>
                <div class="stat-item"><div class="stat-value" id="statScore">0</div><div class="stat-label">总分</div></div>
            </div>
            <button class="btn" onclick="restartGame()">再来一局</button>
        </div>
        <div id="talentScreen">
            <div class="title">升级商店</div>
            <div class="subtitle" id="talentSubtitle">使用经验解锁新体系或升级植物形态</div>
            <div id="shopExpDisplay" style="color:#ffd700;font-size:18px;margin:8px 0;font-weight:bold;"></div>
            <div class="talent-grid" id="talentGrid"></div>
            <button class="shop-btn" onclick="closeShop()">关闭商店</button>
        </div>
    </div>

    <script>
        // ==================== 游戏配置 ====================
        const CONFIG = {
            GRID_COLS: 9, GRID_ROWS: 5,
            CELL_WIDTH: 100, CELL_HEIGHT: 110, GRID_OFFSET_Y: 60,
            GAME_DURATION: 360,
            ERAS: [
                { name: '蛮荒时代', start: 0, end: 120, color: '#8B7355', zombieInterval: 8000 },
                { name: '部落时代', start: 120, end: 240, color: '#CD853F', zombieInterval: 3000 },
                { name: '铁器时代', start: 240, end: 360, color: '#708090', zombieInterval: 2000 }
            ],
            // 植物体系配置 - 所有属性固定，不随时代变化
            PLANTS: {
                // 基础三系
                archer: {
                    name: '弓手', cost: 100, health: 300, cooldown: 10000,
                    eras: [
                        { name: '原始弓手', damage: 20, attackInterval: 1500, knockback: 0, icon: '🏹', color: '#8B4513' },
                        { name: '石弩手', damage: 30, attackInterval: 1000, knockback: 0, icon: '⚔️', color: '#A0522D' },
                        { name: '铁弹手', damage: 60, attackInterval: 1000, knockback: 0.01, icon: '🔫', color: '#708090' },
                        { name: '钢铁机枪手', damage: 60, attackInterval: 400, knockback: 0.01, icon: '🔫', color: '#2F4F4F' }
                    ]
                },
                logistics: {
                    name: '后勤', cost: 50, health: 300, cooldown: 5000,
                    eras: [
                        { name: '原始后勤', sunInterval: 20000, sunAmount: 25, icon: '📦', color: '#DAA520' },
                        { name: '石器后勤', sunInterval: 10000, sunAmount: 25, icon: '📦', color: '#B8860B' },
                        { name: '铁器后勤', sunInterval: 5000, sunAmount: 25, icon: '📦', color: '#CD853F' },
                        { name: '蒸汽后勤', sunInterval: 500, sunAmount: 5, icon: '📦', color: '#FF6347' }
                    ]
                },
                fortress: {
                    name: '堡垒', cost: 50, health: 0, cooldown: 5000,
                    eras: [
                        { name: '原始堡垒', health: 4000, healInterval: 20000, healAmount: 1000, icon: '🏰', color: '#696969' },
                        { name: '坚石堡垒', health: 8000, healInterval: 10000, healAmount: 1000, icon: '🏰', color: '#808080' },
                        { name: '钢铁堡垒', health: 16000, healInterval: 5000, healAmount: 1000, icon: '🏗️', color: '#A9A9A9' },
                        { name: '机械堡垒', health: 16000, healInterval: 2500, healAmount: 1000, icon: '🏗️', color: '#4682B4' }
                    ]
                },
                // 可解锁植物系
                swamp: {
                    name: '沼泽', cost: 250, health: 999999, cooldown: 25000, locked: true,
                    eras: [
                        { name: '蛮荒沼泽', damage: 1, attackInterval: 4000, poisonStack: 1, icon: '🌊', color: '#2E8B57' },
                        { name: '强酸湖', damage: 1, attackInterval: 2000, poisonStack: 2, icon: '🌊', color: '#9ACD32' },
                        { name: '熔铁池', damage: 1, attackInterval: 1000, poisonStack: 3, icon: '🌊', color: '#FF4500' },
                        { name: '废液池', damage: 1, attackInterval: 500, poisonStack: 4, icon: '🌊', color: '#8B008B' }
                    ]
                },
                push: {
                    name: '推进', cost: 200, health: 2000, cooldown: 20000, locked: true,
                    eras: [
                        { name: '蛮荒推进者', icon: '🚜', color: '#8B7355' },
                        { name: '部落推进者', icon: '🚜', color: '#A0522D' },
                        { name: '铁器推进者', icon: '🚜', color: '#708090' },
                        { name: '蒸汽推进者', icon: '🚜', color: '#2F4F4F' }
                    ]
                }
            },
            // 僵尸配置 [蛮荒, 部落, 铁器]
            ZOMBIE_EVOLUTION: {
                normal: [
                    { name: '野人', health: 300, speed: 0.2, damage: 50, attackInterval: 1000, score: 5, color: '#8B4513', size: 1 },
                    { name: '野人', health: 600, speed: 0.2, damage: 100, attackInterval: 1000, score: 10, color: '#A0522D', size: 1 },
                    { name: '野人', health: 1200, speed: 0.2, damage: 200, attackInterval: 1000, score: 20, color: '#708090', size: 1 }
                ],
                giant: [
                    { name: '巨人', health: 1500, speed: 0.1, damage: 600, attackInterval: 3000, score: 50, color: '#800080', size: 1.8 },
                    { name: '巨人', health: 3000, speed: 0.1, damage: 1200, attackInterval: 3000, score: 100, color: '#556B2F', size: 1.8 },
                    { name: '巨人', health: 6000, speed: 0.1, damage: 2400, attackInterval: 3000, score: 200, color: '#2F4F4F', size: 1.8 }
                ],
                imp: [
                    { name: '小鬼', health: 100, speed: 0.5, damage: 50, attackInterval: 1000, score: 5, color: '#FF6347', size: 0.7 },
                    { name: '小鬼', health: 200, speed: 1.0, damage: 50, attackInterval: 500, score: 10, color: '#FF4500', size: 0.7 },
                    { name: '小鬼', health: 400, speed: 2.0, damage: 50, attackInterval: 250, score: 20, color: '#DC143C', size: 0.7 }
                ],
            }
        };

        // ==================== 游戏状态 ====================
        let gameState = {
            running: false, paused: false, gameTime: 0,
            sun: 500, kills: 0, leaks: 0, score: 0,
            currentEra: 0, selectedPlant: null, selectedTool: null,
            plants: [], zombies: [], projectiles: [], zombieProjectiles: [],
            grid: [], lastZombieSpawn: 0,
            // 最后一波状态 [era0, era1, era2]
            finalWaveTriggered: [false, false, false],
            finalWaveActive: false,
            finalWaveSpawnCount: 0,
            cooldowns: { archer: 0, logistics: 0, fortress: 0, swamp: 0, push: 0 },
            shovelCooldown: 0,
            mousePos: null,
            // 经验
            exp: 0,
            // 植物体系解锁状态
            unlockedSystems: { archer: true, logistics: true, fortress: true, swamp: false, push: false },
            plantEraLevels: { archer: 0, logistics: 0, fortress: 0, swamp: 0, push: 0 },
            // 激素
            hormones: 3,
            hormoneActive: false,
            hormoneTarget: null,
            // 分数累计（用于激素奖励）
            scoreForHormone: 0,
            hormoneTier: 0,
            // 随机事件
            lastEventTime: 0,
            nextEventInterval: 30000,
            // 宝箱
            chests: [],
            // 道具
            inventory: [],
            selectedItem: null,
            // 道具掉落物（留在场地上的）
            itemDrops: [],
            // 陨石坑
            craters: [],
            // 滚石
            rollingStones: [],
            // 僵尸刷新计数（二阶系统）
            zombieSpawnCount: { normal: 0, imp: 0, giant: 0 }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function initGrid() {
            gameState.grid = [];
            for (let r = 0; r < CONFIG.GRID_ROWS; r++) {
                gameState.grid[r] = [];
                for (let c = 0; c < CONFIG.GRID_COLS; c++) gameState.grid[r][c] = null;
            }
        }

        function getCurrentEra() {
            for (let i = 0; i < CONFIG.ERAS.length; i++) {
                if (gameState.gameTime >= CONFIG.ERAS[i].start && gameState.gameTime < CONFIG.ERAS[i].end) return i;
            }
            return CONFIG.ERAS.length - 1;
        }

        // ==================== 植物类 ====================
        class Plant {
            constructor(type, row, col) {
                const config = CONFIG.PLANTS[type];
                const eraLevel = gameState.plantEraLevels[type] || 0;
                const eraStats = config.eras[eraLevel];
                this.type = type;
                this.row = row;
                this.col = col;
                this.x = col * CONFIG.CELL_WIDTH + CONFIG.CELL_WIDTH / 2;
                this.y = row * CONFIG.CELL_HEIGHT + CONFIG.CELL_HEIGHT / 2 + CONFIG.GRID_OFFSET_Y;
                this.alive = true;
                this.lastAttack = 0;
                this.lastSun = 0;
                this.lastHeal = 0;
                this.health = config.health || eraStats.health || 300;
                this.maxHealth = this.health;
                this.damage = eraStats.damage || 0;
                this.attackInterval = eraStats.attackInterval || 0;
                this.knockback = eraStats.knockback || 0;
                this.poisonStack = eraStats.poisonStack || 0; // 沼泽系叠毒数值
                this.icon = eraStats.icon;
                this.color = eraStats.color;
                this.sunInterval = eraStats.sunInterval || 0;
                this.sunAmount = eraStats.sunAmount || 0;
                this.healInterval = eraStats.healInterval || 0;
                this.healAmount = eraStats.healAmount || 0;
                // 激素效果
                this.hormoneTimer = 0;
                this.hormoneType = null;
                // 推进者冲刺
                this.dashing = false;
                this.dashDamageTick = 0;
            }

            update(deltaTime) {
                if (!this.alive) return;
                const dt = deltaTime;

                // 推进者冲刺逻辑
                if (this.type === 'push' && this.dashing) {
                    let blockedByTier2 = false;
                    for (let zombie of gameState.zombies) {
                        if (!zombie.alive || zombie.row !== this.row) continue;
                        const dist = Math.abs(zombie.x - this.x);
                        if (dist < CONFIG.CELL_WIDTH * 0.6) {
                            if (zombie.tier === 1) {
                                zombie.launchFlying();
                            } else {
                                blockedByTier2 = true;
                                this.dashDamageTick += dt;
                                if (this.dashDamageTick >= 20) {
                                    this.dashDamageTick = 0;
                                    zombie.takeDamage(50);
                                }
                            }
                        }
                    }
                    if (!blockedByTier2) {
                        this.x += (2 * CONFIG.CELL_WIDTH / 1000) * dt;
                    }
                    if (this.x > canvas.width + 50) {
                        this.alive = false;
                        gameState.grid[this.row][this.col] = null;
                    }
                    return;
                }

                // 激素倒计时
                if (this.hormoneTimer > 0) {
                    this.hormoneTimer -= dt;
                    if (this.hormoneTimer <= 0) {
                        this.hormoneTimer = 0;
                        this.hormoneType = null;
                    }
                }

                // 弓手攻击
                if (this.damage > 0 && this.attackInterval > 0 && this.type !== 'swamp') {
                    this.lastAttack += dt;
                    let interval = this.attackInterval;
                    // 弓手激素效果：0.02秒发射
                    if (this.hormoneType === 'archer' && this.type === 'archer') {
                        interval = 20;
                    }
                    if (this.lastAttack >= interval) {
                        const hasZombie = gameState.zombies.some(z => z.row === this.row && z.x > this.x && z.alive);
                        if (hasZombie) {
                            this.shoot();
                            this.lastAttack = 0;
                        }
                    }
                }

                // 沼泽系：本格叠毒攻击
                if (this.type === 'swamp') {
                    this.lastAttack += dt;
                    if (this.lastAttack >= this.attackInterval) {
                        // 攻击本格所有僵尸
                        for (let zombie of gameState.zombies) {
                            if (zombie.row === this.row && zombie.alive &&
                                Math.abs(zombie.x - this.x) < CONFIG.CELL_WIDTH / 2) {
                                zombie.applyPoison(this.poisonStack);
                            }
                        }
                        this.lastAttack = 0;
                    }
                }

                // 后勤产阳光
                if (this.sunInterval > 0) {
                    this.lastSun += dt;
                    let interval = this.sunInterval;
                    // 激素效果：后勤0.1秒/次
                    if (this.hormoneType === 'logistics') interval = 100;
                    if (this.lastSun >= interval) {
                        let amount = this.sunAmount;
                        if (this.hormoneType === 'logistics') amount = 10;
                        gameState.sun = Math.min(5000, gameState.sun + amount);
                        this.lastSun = 0;
                        createFloatingText(this.x, this.y - 25, `+${amount}☀`, '#FFD700');
                    }
                }

                // 堡垒回血
                if (this.healInterval > 0 && this.health < this.maxHealth) {
                    this.lastHeal += dt;
                    if (this.lastHeal >= this.healInterval) {
                        this.health = Math.min(this.maxHealth, this.health + this.healAmount);
                        this.lastHeal = 0;
                        createFloatingText(this.x, this.y - 35, `+${this.healAmount}`, '#4CAF50');
                    }
                }
            }

            shoot() {
                let dmg = this.damage;
                gameState.projectiles.push(new Projectile(
                    this.x + 25, this.y, this.row, dmg, this.knockback
                ));
            }

            takeDamage(damage) {
                // 沼泽系不可被攻击
                if (this.type === 'swamp') return;
                this.health -= damage;
                if (this.health <= 0) {
                    this.alive = false;
                    gameState.grid[this.row][this.col] = null;
                }
            }

            draw(ctx) {
                if (!this.alive) return;
                const size = this.type === 'fortress' ? 45 : (this.type === 'swamp' ? 40 : 38);

                // 推进者冲刺拖尾
                if (this.type === 'push' && this.dashing) {
                    ctx.fillStyle = 'rgba(255,99,71,0.3)';
                    for (let i = 1; i <= 5; i++) {
                        ctx.beginPath();
                        ctx.arc(this.x - i * 8, this.y, size / 2 - i * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // 激素高亮
                if (this.hormoneTimer > 0) {
                    ctx.fillStyle = 'rgba(255,105,180,0.3)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size / 2 + 8, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.font = `${size - 8}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.icon, this.x, this.y);

                // 血条（沼泽不显示）
                if (this.type !== 'swamp' && this.health < this.maxHealth) {
                    const barW = size + 5, barH = 4;
                    const barX = this.x - barW / 2;
                    const barY = this.y - size / 2 - 10;
                    ctx.fillStyle = '#333';
                    ctx.fillRect(barX, barY, barW, barH);
                    const pct = this.health / this.maxHealth;
                    ctx.fillStyle = pct > 0.5 ? '#4CAF50' : pct > 0.25 ? '#FF9800' : '#f44336';
                    ctx.fillRect(barX, barY, barW * pct, barH);
                }
            }
        }

        // ==================== 僵尸经验计算 ====================
        function getZombieExp(zombie) {
            const era = gameState.currentEra;
            let baseExp;
            if (zombie.type === 'giant') {
                baseExp = [50, 100, 200][era] || 50;
            } else {
                baseExp = [5, 10, 20][era] || 5;
            }
            return baseExp * (zombie.tier === 2 ? 4 : 1);
        }

        // ==================== 二阶敌军属性应用 ====================
        function applyTier2Stats(zombie) {
            const era = gameState.currentEra;
            const stats = CONFIG.ZOMBIE_EVOLUTION[zombie.type][era];
            if (zombie.type === 'normal') {
                // 二阶野人：血量×8，伤害×8
                zombie.maxHealth = stats.health * 8;
                zombie.health = zombie.maxHealth;
                zombie.damage = stats.damage * 8;
            } else if (zombie.type === 'imp') {
                // 二阶小鬼：移速×2、血量×4、伤害×4、攻击间隔÷2
                zombie.maxHealth = stats.health * 4;
                zombie.health = zombie.maxHealth;
                zombie.damage = stats.damage * 4;
                zombie.baseSpeed = stats.speed * 2;
                zombie.speed = zombie.baseSpeed;
                zombie.attackInterval = stats.attackInterval / 2;
            } else if (zombie.type === 'giant') {
                // 二阶巨人：血量×16，伤害×4；移速、攻速不变
                zombie.maxHealth = stats.health * 16;
                zombie.health = zombie.maxHealth;
                zombie.damage = stats.damage * 4;
            }
        }

        // ==================== 僵尸类 ====================
        class Zombie {
            constructor(type, row) {
                const era = gameState.currentEra || 0;
                const stats = CONFIG.ZOMBIE_EVOLUTION[type][era];
                this.type = type;
                this.row = row;
                this.x = canvas.width + 40;
                this.y = row * CONFIG.CELL_HEIGHT + CONFIG.CELL_HEIGHT / 2 + CONFIG.GRID_OFFSET_Y;
                this.health = stats.health;
                this.maxHealth = stats.health;
                this.speed = stats.speed;
                this.damage = stats.damage;
                this.attackInterval = stats.attackInterval;
                this.score = stats.score;
                this.color = stats.color;
                this.size = stats.size;
                this.name = stats.name;
                this.range = stats.range || 0; // 远程攻击范围
                this.alive = true;
                this.attacking = false;
                this.lastAttack = 0;
                this.walkOffset = Math.random() * Math.PI * 2;
                this.knockbackX = 0;
                this.knockbackTimer = 0;
                // 毒伤系统
                this.poison = 0; // 当前毒值
                this.lastPoisonTick = 0; // 上次毒伤时间
                // 冻结效果
                this.frozen = 0;
                this.frozenTimer = 0;
                // 二阶系统
                this.tier = 1; // 1=一阶, 2=二阶
                this.baseSpeed = stats.speed; // 保存基础速度
                // 击飞状态
                this.flying = false;
                this.flyVx = 0;
                this.flyVy = 0;
            }

            launchFlying() {
                if (this.flying) return;
                this.flying = true;
                this.flyVx = 3 + Math.random() * 2; // 向右飞
                this.flyVy = -4 - Math.random() * 3; // 向上飞
                createFloatingText(this.x, this.y - 40, '击飞!', '#00BFFF');
                // 击飞即死，结算击杀
                gameState.kills++;
                gameState.score += this.score;
                gameState.scoreForHormone += this.score;
                const hormoneCost = 50 * Math.pow(2, gameState.hormoneTier || 0);
                while (gameState.scoreForHormone >= hormoneCost) {
                    gameState.scoreForHormone -= hormoneCost;
                    gameState.hormones = Math.min(99, gameState.hormones + 1);
                    gameState.hormoneTier = (gameState.hormoneTier || 0) + 1;
                    createFloatingText(canvas.width / 2, 100, `激素+1! 下次需${hormoneCost * 2}积分`, '#ff69b4');
                }
                addExp(getZombieExp(this));
            }

            update(deltaTime) {
                if (!this.alive) return;
                // 击飞状态
                if (this.flying) {
                    this.x += this.flyVx;
                    this.y += this.flyVy;
                    this.flyVy += 0.15; // 重力
                    if (this.x > canvas.width + 100 || this.y > canvas.height + 100) {
                        this.alive = false;
                    }
                    return;
                }
                this.attacking = false;
                const dt = deltaTime;

                // 毒伤处理：每0.1秒受到持续伤害，伤害=当前毒值
                if (this.poison > 0) {
                    this.lastPoisonTick += dt;
                    if (this.lastPoisonTick >= 100) {
                        this.health -= this.poison;
                        this.lastPoisonTick = 0;
                        createFloatingText(this.x, this.y - 50, `毒-${this.poison}`, '#9932CC');
                        if (this.health <= 0) {
                            this.dieFromPoison();
                            return;
                        }
                    }
                }

                // 毒素减速：每层10%，最高5层50%
                if (this.poison > 0) {
                    const slowStacks = Math.min(5, Math.ceil(this.poison / 20)); // 每20毒值算一层
                    const slowFactor = 1 - (slowStacks * 0.1);
                    this.speed = this.baseSpeed * slowFactor;
                } else {
                    this.speed = this.baseSpeed;
                }

                // 冻结处理：跳过移动和攻击
                if (this.tier === 2) {
                    this.frozen = 0;
                    this.frozenTimer = 0;
                }
                if (this.frozen > 0) {
                    this.frozenTimer -= dt;
                    if (this.frozenTimer <= 0) {
                        this.frozen = 0;
                        this.frozenTimer = 0;
                    }
                    return;
                }

                // 击退处理
                if (this.knockbackTimer > 0) {
                    this.knockbackTimer -= dt;
                    const diff = this.knockbackX - this.x;
                    this.x += diff * 0.6;
                    if (this.knockbackTimer <= 0) this.knockbackX = 0;
                    return;
                }

                // 远程僵尸逻辑
                if (this.range > 0) {
                    const target = this.findTarget();
                    if (target && Math.abs(target.x - this.x) <= this.range) {
                        this.attacking = true;
                        this.lastAttack += dt;
                        if (this.lastAttack >= this.attackInterval) {
                            this.dealDamageTo(target);
                        }
                    } else {
                        this.move(dt);
                    }
                } else {
                    // 近战僵尸
                    const target = this.findTarget();
                    if (target && Math.abs(target.x - this.x) < 45) {
                        this.attacking = true;
                        this.lastAttack += dt;
                        if (this.lastAttack >= this.attackInterval) {
                            this.dealDamageTo(target);
                        }
                    } else {
                        this.move(dt);
                    }
                }
            }

            // 叠毒
            applyPoison(amount) {
                if (this.tier === 2) return; // 二阶免疫毒素
                this.poison = Math.min(100, this.poison + amount);
                createFloatingText(this.x, this.y - 60, `毒+${amount}`, '#9932CC');
            }

            // 毒死时的特殊处理
            dieFromPoison() {
                const hadPoison = this.poison > 0;
                const deathRow = this.row;
                const deathCol = Math.floor(this.x / CONFIG.CELL_WIDTH);
                this.alive = false;
                gameState.kills++;
                gameState.score += this.score;
                gameState.scoreForHormone += this.score;
                const hormoneCost1 = 50 * Math.pow(2, gameState.hormoneTier || 0);
                while (gameState.scoreForHormone >= hormoneCost1) {
                    gameState.scoreForHormone -= hormoneCost1;
                    gameState.hormones = Math.min(99, gameState.hormones + 1);
                    gameState.hormoneTier = (gameState.hormoneTier || 0) + 1;
                    createFloatingText(canvas.width / 2, 100, `激素+1! 下次需${hormoneCost1 * 2}积分`, '#ff69b4');
                }
                addExp(getZombieExp(this));
                createFloatingText(this.x, this.y - 20, `+${this.score}分`, '#4CAF50');

                // 携带毒值死亡时，在死亡格子生成同时代沼泽系
                if (hadPoison && deathCol >= 0 && deathCol < CONFIG.GRID_COLS) {
                    const existingPlant = gameState.grid[deathRow][deathCol];
                    // 如果已有沼泽系，不替换
                    if (existingPlant && existingPlant.type === 'swamp') return;
                    // 销毁原有植物（如果有），原地生成沼泽系
                    if (existingPlant) {
                        existingPlant.alive = false;
                    }
                    const swampPlant = new Plant('swamp', deathRow, deathCol);
                    gameState.plants.push(swampPlant);
                    gameState.grid[deathRow][deathCol] = swampPlant;
                    createFloatingText(swampPlant.x, swampPlant.y - 30, '沼泽蔓延!', '#9932CC');
                }
            }

            findTarget() {
                let target = null;
                for (let plant of gameState.plants) {
                    if (plant.row === this.row && plant.alive && plant.x > this.x && plant.type !== 'swamp') {
                        if (!target || plant.x < target.x) target = plant;
                    }
                }
                return target;
            }

            move(dt) {
                this.x -= this.speed * CONFIG.CELL_WIDTH * (dt / 1000);
                this.walkOffset += dt * 0.01;
                if (this.x < 30) {
                    this.alive = false;
                    gameState.leaks++;
                    createFloatingText(50, this.y, '漏怪!', '#f44336');
                    if (gameState.leaks >= 3) endGame(false);
                }
            }

            applyKnockback(gridCells) {
                // 巨人不受击退
                if (this.type === 'giant') return;
                // 二阶免疫击退
                if (this.tier === 2) return;
                // 击退限制：不能超出场地最外侧格子
                const maxX = (CONFIG.GRID_COLS - 1) * CONFIG.CELL_WIDTH + CONFIG.CELL_WIDTH / 2;
                this.knockbackX = Math.min(this.x + gridCells * CONFIG.CELL_WIDTH, maxX);
                this.knockbackTimer = 200;
                createFloatingText(this.x, this.y - 40, '击退!', '#00BFFF');
            }

            dealDamageTo(target) {
                let dmg = this.damage;
                // 堡垒激素：仅50%反伤，不减伤
                if (target.type === 'fortress' && target.hormoneType === 'fortress' && target.hormoneTimer > 0) {
                    const reflect = Math.floor(this.damage * 0.5);
                    this.health -= reflect;
                    createFloatingText(this.x, this.y - 30, `反伤-${reflect}`, '#ff69b4');
                    if (this.health <= 0) {
                        this.alive = false;
                        gameState.kills++;
                        gameState.score += this.score;
                        gameState.scoreForHormone += this.score;
                        const hormoneCost2 = 50 * Math.pow(2, gameState.hormoneTier || 0);
                        while (gameState.scoreForHormone >= hormoneCost2) {
                            gameState.scoreForHormone -= hormoneCost2;
                            gameState.hormones = Math.min(99, gameState.hormones + 1);
                            gameState.hormoneTier = (gameState.hormoneTier || 0) + 1;
                            createFloatingText(canvas.width / 2, 100, `激素+1! 下次需${hormoneCost2 * 2}积分`, '#ff69b4');
                        }
                        addExp(getZombieExp(this));
                        createFloatingText(this.x, this.y - 20, `+${this.score}分`, '#4CAF50');
                        // 二阶死亡额外触发天降事件
                        if (this.tier === 2) {
                            setTimeout(() => {
                                triggerRandomEvent();
                                createFloatingText(canvas.width / 2, 100, '二阶陨落!天降事件!', '#ff69b4');
                            }, 500);
                        }
                        return;
                    }
                }
                target.takeDamage(dmg);
                this.lastAttack = 0;
                createFloatingText(target.x, target.y - 30, `-${dmg}`, '#f44336');
            }

            takeDamage(damage) {
                this.health -= damage;
                if (this.health <= 0) {
                    // 如果携带毒值，使用毒死处理（生成沼泽）
                    if (this.poison > 0) {
                        this.dieFromPoison();
                    } else {
                        this.alive = false;
                        gameState.kills++;
                        gameState.score += this.score;
                        gameState.scoreForHormone += this.score;
                        const hormoneCost3 = 50 * Math.pow(2, gameState.hormoneTier || 0);
                        while (gameState.scoreForHormone >= hormoneCost3) {
                            gameState.scoreForHormone -= hormoneCost3;
                            gameState.hormones = Math.min(99, gameState.hormones + 1);
                            gameState.hormoneTier = (gameState.hormoneTier || 0) + 1;
                            createFloatingText(canvas.width / 2, 100, `激素+1! 下次需${hormoneCost3 * 2}积分`, '#ff69b4');
                        }
                        addExp(getZombieExp(this));
                        createFloatingText(this.x, this.y - 20, `+${this.score}分`, '#4CAF50');
                        // 二阶死亡额外触发天降事件
                        if (this.tier === 2) {
                            setTimeout(() => {
                                triggerRandomEvent();
                                createFloatingText(canvas.width / 2, 100, '二阶陨落!天降事件!', '#ff69b4');
                            }, 500);
                        }
                    }
                }
            }

            draw(ctx) {
                if (!this.alive) return;
                // 击飞拖尾特效
                if (this.flying) {
                    ctx.fillStyle = 'rgba(0,191,255,0.3)';
                    for (let i = 1; i <= 4; i++) {
                        ctx.beginPath();
                        ctx.arc(this.x - this.flyVx * i * 3, this.y - this.flyVy * i * 2, 8 - i, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                const size = 30 * this.size;
                const bob = this.flying ? 0 : Math.sin(this.walkOffset) * 3;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y + bob, size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(this.x - size * 0.15, this.y + bob - size * 0.1, size * 0.1, 0, Math.PI * 2);
                ctx.arc(this.x + size * 0.15, this.y + bob - size * 0.1, size * 0.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y + bob + size * 0.1, size * 0.15, 0.2 * Math.PI, 0.8 * Math.PI);
                ctx.stroke();
                if (this.type === 'giant') {
                    ctx.strokeStyle = '#ff0';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y + bob, size / 2 + 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
                if (this.type === 'imp') {
                    ctx.fillStyle = '#ff0';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('⚡', this.x, this.y + bob - size / 2 - 5);
                }
                if (this.range > 0) {
                    ctx.fillStyle = '#ff0';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🏹', this.x, this.y + bob - size / 2 - 5);
                }
                // 二阶标记
                if (this.tier === 2) {
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y + bob, size / 2 + 5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('⭐', this.x, this.y + bob - size / 2 - 8);
                }
                // 毒值显示
                if (this.poison > 0) {
                    ctx.fillStyle = '#9932CC';
                    ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`毒${this.poison}`, this.x, this.y + bob - size / 2 - 18);
                }
                // 冻结效果显示
                if (this.frozen > 0) {
                    ctx.fillStyle = 'rgba(100,200,255,0.4)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y + bob, size / 2 + 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(150,220,255,0.8)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y + bob, size / 2 + 4, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = '#87CEEB';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`❄${(this.frozenTimer/1000).toFixed(1)}s`, this.x, this.y + bob - size / 2 - 18);
                }
                const barW = Math.max(30, 40 * this.size), barH = 4;
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x - barW / 2, this.y - size / 2 - 10 + bob, barW, barH);
                const pct = this.health / this.maxHealth;
                ctx.fillStyle = pct > 0.5 ? '#4CAF50' : pct > 0.25 ? '#FF9800' : '#f44336';
                ctx.fillRect(this.x - barW / 2, this.y - size / 2 - 10 + bob, barW * pct, barH);
                if (this.attacking) {
                    ctx.strokeStyle = '#f44336';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(this.x - 12, this.y + bob);
                    ctx.lineTo(this.x - 22, this.y + bob - 12);
                    ctx.stroke();
                }
            }
        }

        // ==================== 子弹类 ====================
        class Projectile {
            constructor(x, y, row, damage, knockback) {
                this.x = x; this.y = y; this.row = row;
                this.damage = damage;
                this.knockback = knockback || 0;
                this.speed = 8;
                this.alive = true;
            }
            update() {
                this.x += this.speed;
                for (let zombie of gameState.zombies) {
                    if (zombie.row === this.row && zombie.alive &&
                        Math.abs(zombie.x - this.x) < 25 && Math.abs(zombie.y - this.y) < 30) {
                        zombie.takeDamage(this.damage);
                        createFloatingText(zombie.x, zombie.y - 30, `-${Math.floor(this.damage)}`, '#FF9800');
                        if (this.knockback > 0) zombie.applyKnockback(this.knockback);
                        this.alive = false;
                        break;
                    }
                }
                if (this.x > canvas.width) this.alive = false;
            }
            draw(ctx) {
                if (this.knockback > 0) {
                    ctx.fillStyle = 'rgba(255,215,0,0.3)';
                    ctx.beginPath(); ctx.arc(this.x, this.y, 12, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath(); ctx.arc(this.x, this.y, 7, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.fillStyle = '#4CAF50';
                    ctx.beginPath(); ctx.arc(this.x, this.y, 6, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillStyle = this.knockback > 0 ? 'rgba(255,215,0,0.2)' : 'rgba(76,175,80,0.3)';
                ctx.beginPath(); ctx.arc(this.x - 8, this.y, 4, 0, Math.PI * 2); ctx.fill();
            }
        }

        // ==================== 滚石类型映射 ====================
        const STONE_TYPES = ['wood', 'stone', 'iron', 'roller'];

        // ==================== 滚石类 ====================
        class RollingStone {
            constructor(type, row, col, eraLevel) {
                this.type = type; // 'wood', 'stone', 'iron', 'roller'
                this.row = row;
                this.col = col;
                this.x = col * CONFIG.CELL_WIDTH + CONFIG.CELL_WIDTH / 2;
                this.y = row * CONFIG.CELL_HEIGHT + CONFIG.GRID_OFFSET_Y + CONFIG.CELL_HEIGHT / 2;
                this.health = 2000;
                this.maxHealth = 2000;
                this.alive = true;
                this.moveSpeed = 1; // 1格/秒
                this.lastDamageTick = 0;
                this.eraLevel = eraLevel;
                // 各滚石属性
                const stats = {
                    wood: { name: '木桩', damage: 25, knockback: 0, icon: '🪵', color: '#8B7355' },
                    stone: { name: '巨石', damage: 50, knockback: 0, icon: '🪨', color: '#808080' },
                    iron: { name: '铁球', damage: 50, knockback: 0, icon: '⚫', color: '#708090' },
                    roller: { name: '滚筒', damage: 100, knockback: 0, icon: '⚙️', color: '#2F4F4F' }
                };
                const s = stats[type];
                this.name = s.name;
                this.damage = s.damage;
                this.knockback = s.knockback;
                this.icon = s.icon;
                this.color = s.color;
                this.moveTimer = 0;
            }

            update(dt) {
                if (!this.alive) return;
                // 向右匀速滚动 1格/秒
                this.x += CONFIG.CELL_WIDTH * (dt / 1000);
                this.col = Math.floor(this.x / CONFIG.CELL_WIDTH);
                // 超出场地消失
                if (this.x > canvas.width + 50) { this.alive = false; return; }
                // 碰撞检测：铁球/滚筒击飞野人/小鬼，巨人只吃伤害
                for (let zombie of gameState.zombies) {
                    if (!zombie.alive || zombie.row !== this.row) continue;
                    if (Math.abs(zombie.x - this.x) < CONFIG.CELL_WIDTH * 0.6) {
                        if ((this.type === 'iron' || this.type === 'roller') && zombie.tier === 1 && zombie.type !== 'giant') {
                            // 击飞秒杀：一阶野人/小鬼直接飞出屏幕
                            zombie.launchFlying();
                        } else {
                            // 正常伤害（木桩/巨石 或 巨人 或 二阶单位）
                            zombie.takeDamage(this.damage);
                        }
                    }
                }
            }

            takeDamage(damage) {
                this.health -= damage;
                if (this.health <= 0) {
                    this.alive = false;
                    createFloatingText(this.x, this.y - 20, '滚石碎裂!', '#ff6347');
                }
            }

            draw(ctx) {
                if (!this.alive) return;
                // 绘制滚石
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
                // 图标
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.icon, this.x, this.y);
                // 血条
                if (this.health < this.maxHealth) {
                    const barW = 40, barH = 4;
                    const ratio = this.health / this.maxHealth;
                    ctx.fillStyle = '#333';
                    ctx.fillRect(this.x - barW/2, this.y - 30, barW, barH);
                    ctx.fillStyle = ratio > 0.5 ? '#4CAF50' : '#f44336';
                    ctx.fillRect(this.x - barW/2, this.y - 30, barW * ratio, barH);
                }
            }
        }

        // ==================== 召唤滚石函数 ====================
        function summonRollingStone(plant) {
            if (gameState.sun < 500) {
                createFloatingText(plant.x, plant.y - 40, '阳光不足! 需要500☀', '#f44336');
                return;
            }
            gameState.sun -= 500;
            const eraLevel = gameState.plantEraLevels.push || 0;
            const stoneType = STONE_TYPES[eraLevel] || 'wood';
            const stone = new RollingStone(stoneType, plant.row, plant.col, eraLevel);
            // 滚石生成在推进者前方一格
            stone.x = plant.x + CONFIG.CELL_WIDTH;
            stone.col = plant.col + 1;
            gameState.rollingStones.push(stone);
            createFloatingText(plant.x, plant.y - 40, `召唤${stone.name}!`, '#ff6347');
        }

        // ==================== 浮动文字 ====================
        let floatingTexts = [];
        function createFloatingText(x, y, text, color) {
            floatingTexts.push({ x, y, text, color, life: 60, maxLife: 60 });
        }
        function updateFloatingTexts() {
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].life--;
                floatingTexts[i].y -= 1;
                if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
            }
        }
        function drawFloatingTexts(ctx) {
            for (let ft of floatingTexts) {
                ctx.globalAlpha = ft.life / ft.maxLife;
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1;
            }
        }

        // ==================== 时代切换大字幕 ====================
        let eraAnnouncements = [];
        function createEraAnnouncement(eraName) {
            eraAnnouncements.push({ text: eraName, life: 90, maxLife: 90 });
        }
        function updateEraAnnouncements() {
            for (let i = eraAnnouncements.length - 1; i >= 0; i--) {
                eraAnnouncements[i].life--;
                if (eraAnnouncements[i].life <= 0) eraAnnouncements.splice(i, 1);
            }
        }
        function drawEraAnnouncements(ctx) {
            for (let ann of eraAnnouncements) {
                const progress = 1 - ann.life / ann.maxLife;
                let alpha, scale;
                if (progress < 0.2) { const p = progress / 0.2; alpha = p; scale = 0.5 + p * 0.5; }
                else if (progress < 0.8) { alpha = 1; scale = 1; }
                else { const p = (progress - 0.8) / 0.2; alpha = 1 - p; scale = 1 - p * 0.3; }
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(scale, scale);
                ctx.font = 'bold 72px "Microsoft YaHei", sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 6;
                ctx.strokeText(ann.text, 0, 0);
                ctx.fillStyle = '#fff';
                ctx.fillText(ann.text, 0, 0);
                ctx.font = 'bold 24px "Microsoft YaHei", sans-serif';
                ctx.fillStyle = '#ffd700';
                ctx.fillText('时代进化', 0, 60);
                ctx.restore();
            }
        }

        // ==================== 经验系统 ====================
        function addExp(amount) {
            gameState.exp += amount;
            updateExpDisplay();
        }

        function updateExpDisplay() {
            const expText = `经验: ${Math.floor(gameState.exp)}`;
            document.getElementById('expDisplay').textContent = expText;
            document.getElementById('levelDisplay').textContent = expText;
        }

        // ==================== 升级商店 ====================
        // 经验消耗表
        const SHOP_COSTS = {
            unlock: { swamp: 30, push: 60 },
            upgrade: { 1: 20, 2: 40, 3: 80 }
        };

        function openShop() {
            gameState.paused = true;
            const screen = document.getElementById('talentScreen');
            const grid = document.getElementById('talentGrid');
            grid.innerHTML = '';
            renderShop();
            screen.style.display = 'flex';
        }

        function closeShop() {
            document.getElementById('talentScreen').style.display = 'none';
            gameState.paused = false;
        }

        function renderShop() {
            const grid = document.getElementById('talentGrid');
            grid.innerHTML = '';
            const expDisplay = document.getElementById('shopExpDisplay');
            expDisplay.textContent = `可用经验: ${Math.floor(gameState.exp)}`;
            const eraNames = ['蛮荒', '部落', '铁器', '蒸汽'];

            // 解锁新体系选项
            for (let key in gameState.unlockedSystems) {
                if (!gameState.unlockedSystems[key] && CONFIG.PLANTS[key] && CONFIG.PLANTS[key].locked) {
                    const cost = SHOP_COSTS.unlock[key] || 30;
                    const canAfford = gameState.exp >= cost;
                    const card = document.createElement('div');
                    card.className = 'talent-card' + (canAfford ? '' : ' disabled');
                    card.innerHTML = `
                        <div class="talent-type">🔓</div>
                        <div class="talent-title">解锁${CONFIG.PLANTS[key].name}系</div>
                        <div class="talent-desc">${CONFIG.PLANTS[key].eras[0].name}</div>
                        <div class="talent-cost">消耗 ${cost} 经验</div>
                    `;
                    if (canAfford) {
                        card.onclick = () => {
                            gameState.exp -= cost;
                            unlockSystem(key);
                            renderShop();
                        };
                    }
                    grid.appendChild(card);
                }
            }

            // 升级已有体系选项
            for (let key in gameState.unlockedSystems) {
                if (gameState.unlockedSystems[key] && gameState.plantEraLevels[key] < 3) {
                    const nextEra = gameState.plantEraLevels[key] + 1;
                    const cost = SHOP_COSTS.upgrade[nextEra] || 40;
                    const canAfford = gameState.exp >= cost;
                    const card = document.createElement('div');
                    card.className = 'talent-card' + (canAfford ? '' : ' disabled');
                    card.innerHTML = `
                        <div class="talent-type">${CONFIG.PLANTS[key].eras[nextEra].icon}</div>
                        <div class="talent-title">${CONFIG.PLANTS[key].name}系升级</div>
                        <div class="talent-desc">${eraNames[gameState.plantEraLevels[key]]} → ${eraNames[nextEra]}</div>
                        <div class="talent-cost">消耗 ${cost} 经验</div>
                    `;
                    if (canAfford) {
                        card.onclick = () => {
                            gameState.exp -= cost;
                            upgradeSystem(key);
                            renderShop();
                        };
                    }
                    grid.appendChild(card);
                }
            }

            // 已满级提示
            let allMaxed = true;
            for (let key in gameState.unlockedSystems) {
                if (gameState.unlockedSystems[key] && gameState.plantEraLevels[key] < 3) { allMaxed = false; break; }
            }
            for (let key in gameState.unlockedSystems) {
                if (!gameState.unlockedSystems[key] && CONFIG.PLANTS[key] && CONFIG.PLANTS[key].locked) { allMaxed = false; break; }
            }
            if (allMaxed) {
                const card = document.createElement('div');
                card.className = 'talent-card disabled';
                card.innerHTML = `
                    <div class="talent-type">🏆</div>
                    <div class="talent-title">全部满级</div>
                    <div class="talent-desc">所有体系已解锁并升至最高形态</div>
                `;
                grid.appendChild(card);
            }
        }

        function unlockSystem(type) {
            gameState.unlockedSystems[type] = true;
            const card = document.getElementById(`card-${type}`);
            const lock = document.getElementById(`lock-${type}`);
            if (card) card.classList.remove('locked');
            if (lock) lock.style.display = 'none';
            createFloatingText(canvas.width / 2, canvas.height / 2, `解锁${CONFIG.PLANTS[type].name}系!`, '#ffd700');
        }

        function upgradeSystem(type) {
            const maxLevel = gameState.currentEra + 1;
            if (gameState.plantEraLevels[type] >= maxLevel) {
                createFloatingText(canvas.width / 2, canvas.height / 2,
                    `${CONFIG.PLANTS[type].name}系已达时代上限!`, '#f44336');
                return;
            }
            gameState.plantEraLevels[type]++;
            const eraNames = ['蛮荒', '部落', '铁器', '蒸汽'];
            const level = gameState.plantEraLevels[type];
            createFloatingText(canvas.width / 2, canvas.height / 2,
                `${CONFIG.PLANTS[type].name}系 → ${eraNames[level]}形态!`, '#ffd700');
            // 更新场上已有植物
            for (let plant of gameState.plants) {
                if (plant.type === type) {
                    const config = CONFIG.PLANTS[type];
                    const eraStats = config.eras[level];
                    plant.damage = eraStats.damage || plant.damage;
                    plant.attackInterval = eraStats.attackInterval || plant.attackInterval;
                    plant.knockback = eraStats.knockback || 0;
                    plant.icon = eraStats.icon;
                    plant.color = eraStats.color;
                    if (eraStats.health) { plant.maxHealth = eraStats.health; plant.health = eraStats.health; }
                    if (eraStats.sunInterval) plant.sunInterval = eraStats.sunInterval;
                    if (eraStats.sunAmount) plant.sunAmount = eraStats.sunAmount;
                    if (eraStats.healInterval) plant.healInterval = eraStats.healInterval;
                    if (eraStats.healAmount) plant.healAmount = eraStats.healAmount;
                }
            }
        }

        // ==================== 时代切换：清理非巨人僵尸 ====================
        function advanceZombiesEra() {
            const newEra = gameState.currentEra;
            let cleared = 0;
            for (let zombie of gameState.zombies) {
                if (!zombie.alive) continue;
                if (zombie.type === 'giant') {
                    // 巨人保留，进阶为新时代属性
                    const stats = CONFIG.ZOMBIE_EVOLUTION[zombie.type][newEra];
                    zombie.health = stats.health;
                    zombie.maxHealth = stats.health;
                    zombie.speed = stats.speed;
                    zombie.damage = stats.damage;
                    zombie.attackInterval = stats.attackInterval;
                    zombie.color = stats.color;
                    zombie.name = stats.name;
                } else {
                    // 普通僵尸、精英小怪全部清除
                    zombie.alive = false;
                    cleared++;
                }
            }
            if (cleared > 0) {
                createFloatingText(canvas.width / 2, 200, `清除 ${cleared} 只僵尸!`, '#FFD700');
            }
        }

        // ==================== 僵尸生成 ====================
        function spawnZombie(isFinalWave) {
            const era = gameState.currentEra;
            let typeRoll = Math.random();
            let type;

            if (isFinalWave) {
                // 最后一波：可以刷新巨人，概率更高
                if (era === 0) {
                    type = typeRoll < 0.5 ? 'normal' : typeRoll < 0.7 ? 'imp' : 'giant';
                } else if (era === 1) {
                    type = typeRoll < 0.35 ? 'normal' : typeRoll < 0.55 ? 'imp' : 'giant';
                } else {
                    type = typeRoll < 0.2 ? 'normal' : typeRoll < 0.4 ? 'imp' : 'giant';
                }
            } else {
                // 常规刷新：完全禁止巨人
                if (era === 0) {
                    type = typeRoll < 0.7 ? 'normal' : 'imp';
                } else if (era === 1) {
                    type = typeRoll < 0.5 ? 'normal' : 'imp';
                } else {
                    type = typeRoll < 0.35 ? 'normal' : 'imp';
                }
            }
            const row = Math.floor(Math.random() * CONFIG.GRID_ROWS);
            const zombie = new Zombie(type, row);
            gameState.zombies.push(zombie);
            // 刷新计数：每10只同类型生成二阶
            gameState.zombieSpawnCount[type]++;
            if (gameState.zombieSpawnCount[type] >= 10) {
                zombie.tier = 2;
                applyTier2Stats(zombie);
                gameState.zombieSpawnCount[type] = 0;
                createFloatingText(zombie.x, zombie.y - 40, '二阶敌军!', '#ff0000');
            }
        }

        // 触发最后一波大规模刷新
        function triggerFinalWave() {
            const era = gameState.currentEra;
            if (gameState.finalWaveTriggered[era]) return;
            gameState.finalWaveTriggered[era] = true;
            gameState.finalWaveActive = true;
            gameState.finalWaveSpawnCount = 0;
            createFloatingText(canvas.width / 2, canvas.height / 2 - 80, `⚠️ ${CONFIG.ERAS[era].name} 最后一波!`, '#ff0000');
        }

        // 最后一波持续生成僵尸
        function updateFinalWave(dt) {
            if (!gameState.finalWaveActive) return;
            const era = gameState.currentEra;
            // 每个时代最后一波生成15只僵尸
            const maxFinalWaveZombies = 15;
            if (gameState.finalWaveSpawnCount < maxFinalWaveZombies) {
                gameState.lastZombieSpawn += dt;
                // 最后一波生成间隔更短（0.8秒）
                if (gameState.lastZombieSpawn >= 800) {
                    spawnZombie(true);
                    gameState.finalWaveSpawnCount++;
                    gameState.lastZombieSpawn = 0;
                }
            } else {
                // 最后一波结束
                gameState.finalWaveActive = false;
            }
        }

        // ==================== 随机事件系统 ====================
        function triggerRandomEvent() {
            const roll = Math.random();
            if (roll < 0.3) {
                spawnMeteorShower(); // 陨石 30%
            } else if (roll < 0.5) {
                spawnChest(); // 空投宝箱 20%
            } else if (roll < 0.7) {
                advanceEnemyTier(); // 敌军进阶 20%
            } else {
                spawnSunRain(); // 阳光雨 30%
            }
        }

        function spawnChest() {
            // 找一个随机空格子（无植物、无陨石坑、无宝箱）
            let attempts = 0;
            while (attempts < 100) {
                const row = Math.floor(Math.random() * CONFIG.GRID_ROWS);
                const col = Math.floor(Math.random() * CONFIG.GRID_COLS);
                const hasPlant = gameState.grid[row][col] !== null;
                const hasCrater = gameState.craters.some(c => c.row === row && c.col === col);
                const hasChest = gameState.chests.some(c => c.row === row && c.col === col);
                if (!hasPlant && !hasCrater && !hasChest) {
                    const x = col * CONFIG.CELL_WIDTH + CONFIG.CELL_WIDTH / 2;
                    const y = row * CONFIG.CELL_HEIGHT + CONFIG.CELL_HEIGHT / 2 + CONFIG.GRID_OFFSET_Y;
                    gameState.chests.push({ row, col, x, y, opened: false, reward: null });
                    createFloatingText(x, y - 40, '宝箱空投!', '#ffd700');
                    return;
                }
                attempts++;
            }
        }

        function openChest(chest) {
            chest.opened = true;
            const roll = Math.random();
            if (roll < 0.5) {
                // 50%：时代阳光补给
                const sunAmount = [100, 200, 400][gameState.currentEra] || 100;
                gameState.sun = Math.min(5000, gameState.sun + sunAmount);
                createFloatingText(chest.x, chest.y - 40, `+${sunAmount}阳光!`, '#FFD700');
            } else {
                // 50%：随机道具池
                const itemRoll = Math.random();
                if (itemRoll < 0.2) {
                    // 火药 20%（道具池的20% = 总概率10%）
                    gameState.inventory.push('gunpowder');
                    createFloatingText(chest.x, chest.y - 40, '火药!', '#ff6347');
                } else if (itemRoll < 0.4) {
                    // 制冷剂 20%（总概率10%）
                    gameState.inventory.push('coolant');
                    createFloatingText(chest.x, chest.y - 40, '制冷剂!', '#00BFFF');
                } else if (itemRoll < 0.8) {
                    // 激素 40%（总概率20%）
                    gameState.hormones = Math.min(99, gameState.hormones + 1);
                    createFloatingText(chest.x, chest.y - 40, '激素+1!', '#ff69b4');
                } else {
                    // 灭敌陷阱 20%（总概率10%）
                    gameState.inventory.push('trap');
                    createFloatingText(chest.x, chest.y - 40, '灭敌陷阱!', '#8B0000');
                }
                renderInventory();
            }
        }

        function spawnMeteorShower() {
            createFloatingText(canvas.width / 2, 100, '☄️ 陨石坠落!', '#ff6347');
            const meteorCount = 3;
            for (let i = 0; i < meteorCount; i++) {
                const row = Math.floor(Math.random() * CONFIG.GRID_ROWS);
                const col = Math.floor(Math.random() * CONFIG.GRID_COLS);
                // 秒杀该格子所有植物和僵尸
                if (gameState.grid[row][col]) {
                    gameState.grid[row][col].alive = false;
                    gameState.grid[row][col] = null;
                }
                for (let zombie of gameState.zombies) {
                    if (zombie.alive && zombie.row === row && zombie.col === col) {
                        zombie.alive = false;
                    }
                }
                // 生成陨石坑
                gameState.craters.push({ row, col, timer: 10000 });
                createFloatingText(col * CONFIG.CELL_WIDTH + CONFIG.CELL_WIDTH/2, row * CONFIG.CELL_HEIGHT + CONFIG.GRID_OFFSET_Y + CONFIG.CELL_HEIGHT/2, '💥', '#ff6347');
            }
        }

        function advanceEnemyTier() {
            // 仅随机选取场上一阶敌军升级为二阶
            const eligible = gameState.zombies.filter(z => z.alive && z.tier === 1);
            if (eligible.length === 0) {
                createFloatingText(canvas.width / 2, 100, '无进阶目标!', '#FFD700');
                return;
            }
            const target = eligible[Math.floor(Math.random() * eligible.length)];
            target.tier = 2;
            // 回满血
            target.health = target.maxHealth;
            // 清除所有控制（冻结、击退、毒素）
            target.frozen = 0;
            target.frozenTimer = 0;
            target.knockbackTimer = 0;
            target.poison = 0;
            target.lastPoisonTick = 0;
            // 应用二阶倍率
            applyTier2Stats(target);
            createFloatingText(target.x, target.y - 40, '敌军进阶!', '#ff0000');
        }

        function spawnSunRain() {
            createFloatingText(canvas.width / 2, 100, '☀️ 阳光雨!', '#FFD700');
            const sunCount = 20 + Math.floor(Math.random() * 31); // 20-50枚
            for (let i = 0; i < sunCount; i++) {
                setTimeout(() => {
                    gameState.sun = Math.min(5000, gameState.sun + 10);
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * (canvas.height - 100);
                    createFloatingText(x, y, '+10☀', '#FFD700');
                }, i * 50); // 每50ms一枚
            }
        }

        function useItem(itemType, row, col) {
            const cx = col * CONFIG.CELL_WIDTH + CONFIG.CELL_WIDTH / 2;
            const cy = row * CONFIG.CELL_HEIGHT + CONFIG.CELL_HEIGHT / 2 + CONFIG.GRID_OFFSET_Y;
            if (itemType === 'gunpowder') {
                // 火药：3x3范围1200伤害，不伤己方
                let hitCount = 0;
                for (let zombie of gameState.zombies) {
                    if (!zombie.alive) continue;
                    const zCol = Math.floor(zombie.x / CONFIG.CELL_WIDTH);
                    const zRow = zombie.row;
                    if (Math.abs(zRow - row) <= 1 && Math.abs(zCol - col) <= 1) {
                        zombie.takeDamage(1200);
                        hitCount++;
                    }
                }
                createFloatingText(cx, cy - 40, `💣 火药爆炸! 命中${hitCount}只`, '#ff8800');
                // 爆炸视觉效果
                createFloatingText(cx, cy - 60, '💥', '#ff4400');
            } else if (itemType === 'coolant') {
                // 制冷剂：5x5范围冻结5秒，巨人同样生效，无伤害
                let hitCount = 0;
                for (let zombie of gameState.zombies) {
                    if (!zombie.alive) continue;
                    const zCol = Math.floor(zombie.x / CONFIG.CELL_WIDTH);
                    const zRow = zombie.row;
                    if (Math.abs(zRow - row) <= 2 && Math.abs(zCol - col) <= 2) {
                        zombie.frozen = 1;
                        zombie.frozenTimer = 5000;
                        hitCount++;
                    }
                }
                createFloatingText(cx, cy - 40, `🧊 制冷剂! 冻结${hitCount}只`, '#87CEEB');
                createFloatingText(cx, cy - 60, '❄️', '#00BFFF');
            } else if (itemType === 'trap') {
                // 灭敌陷阱：放置瞬间清除该格子全部敌人
                for (let zombie of gameState.zombies) {
                    if (zombie.alive && zombie.row === row && zombie.col === col) {
                        zombie.alive = false;
                        gameState.kills++;
                        gameState.score += zombie.score;
                        gameState.scoreForHormone += zombie.score;
                        const hormoneCost = 50 * Math.pow(2, gameState.hormoneTier || 0);
                        while (gameState.scoreForHormone >= hormoneCost) {
                            gameState.scoreForHormone -= hormoneCost;
                            gameState.hormones = Math.min(99, gameState.hormones + 1);
                            gameState.hormoneTier = (gameState.hormoneTier || 0) + 1;
                            createFloatingText(canvas.width / 2, 100, `激素+1! 下次需${hormoneCost * 2}积分`, '#ff69b4');
                        }
                        addExp(getZombieExp(zombie));
                    }
                }
                createFloatingText(col * CONFIG.CELL_WIDTH + CONFIG.CELL_WIDTH/2, row * CONFIG.CELL_HEIGHT + CONFIG.GRID_OFFSET_Y + CONFIG.CELL_HEIGHT/2, '陷阱触发!', '#8B0000');
            }
        }

        function renderInventory() {
            const bar = document.getElementById('itemBar');
            if (!bar) return;
            bar.innerHTML = '';
            const itemIcons = { gunpowder: '💣', coolant: '🧊', trap: '🕸️' };
            const itemNames = { gunpowder: '火药', coolant: '制冷剂', trap: '灭敌陷阱' };
            for (let i = 0; i < gameState.inventory.length; i++) {
                const item = gameState.inventory[i];
                const slot = document.createElement('div');
                slot.className = 'item-slot' + (gameState.selectedItem === i ? ' selected' : '');
                slot.textContent = itemIcons[item] || '?';
                slot.title = itemNames[item] || '未知道具';
                slot.onclick = () => {
                    if (gameState.selectedItem === i) {
                        gameState.selectedItem = null;
                    } else {
                        gameState.selectedItem = i;
                        gameState.selectedPlant = null;
                        gameState.selectedTool = null;
                        document.querySelectorAll('.plant-card').forEach(c => c.classList.remove('selected'));
                        document.querySelectorAll('.tool-btn').forEach(c => c.classList.remove('selected'));
                    }
                    renderInventory();
                };
                bar.appendChild(slot);
            }
        }

        // ==================== 绘制 ====================
        function drawGrid() {
            const era = CONFIG.ERAS[gameState.currentEra];
            ctx.fillStyle = era.color;
            ctx.fillRect(0, CONFIG.GRID_OFFSET_Y, canvas.width, canvas.height - CONFIG.GRID_OFFSET_Y);
            for (let r = 0; r < CONFIG.GRID_ROWS; r++) {
                for (let c = 0; c < CONFIG.GRID_COLS; c++) {
                    const x = c * CONFIG.CELL_WIDTH;
                    const y = r * CONFIG.CELL_HEIGHT + CONFIG.GRID_OFFSET_Y;
                    ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(76,175,80,0.3)' : 'rgba(76,175,80,0.2)';
                    ctx.fillRect(x, y, CONFIG.CELL_WIDTH, CONFIG.CELL_HEIGHT);
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, CONFIG.CELL_WIDTH, CONFIG.CELL_HEIGHT);
                }
            }
            ctx.fillStyle = 'rgba(139,69,19,0.5)';
            ctx.fillRect(0, CONFIG.GRID_OFFSET_Y, 60, canvas.height - CONFIG.GRID_OFFSET_Y);
            ctx.font = '24px Arial'; ctx.textAlign = 'center';
