            ctx.fillText('🏠', 30, canvas.height / 2 + 15);

            // 鼠标悬停
            if ((gameState.selectedPlant || gameState.selectedTool) && gameState.mousePos) {
                const col = Math.floor(gameState.mousePos.x / CONFIG.CELL_WIDTH);
                const row = Math.floor((gameState.mousePos.y - CONFIG.GRID_OFFSET_Y) / CONFIG.CELL_HEIGHT);
                if (row >= 0 && row < CONFIG.GRID_ROWS && col >= 0 && col < CONFIG.GRID_COLS) {
                    const x = col * CONFIG.CELL_WIDTH;
                    const y = row * CONFIG.CELL_HEIGHT + CONFIG.GRID_OFFSET_Y;
                    if (gameState.selectedTool === 'shovel') {
                        ctx.fillStyle = gameState.grid[row][col] ? 'rgba(255,0,0,0.4)' : 'rgba(100,100,100,0.2)';
                    } else if (gameState.selectedTool === 'hormone') {
                        ctx.fillStyle = gameState.grid[row][col] ? 'rgba(255,105,180,0.4)' : 'rgba(100,100,100,0.2)';
                    } else {
                        ctx.fillStyle = gameState.grid[row][col] ? 'rgba(255,0,0,0.3)' : 'rgba(0,255,0,0.3)';
                    }
                    ctx.fillRect(x, y, CONFIG.CELL_WIDTH, CONFIG.CELL_HEIGHT);
                }
            }
            // 道具选中时的格子高亮
            if (gameState.selectedItem !== null && gameState.mousePos) {
                const col = Math.floor(gameState.mousePos.x / CONFIG.CELL_WIDTH);
                const row = Math.floor((gameState.mousePos.y - CONFIG.GRID_OFFSET_Y) / CONFIG.CELL_HEIGHT);
                if (row >= 0 && row < CONFIG.GRID_ROWS && col >= 0 && col < CONFIG.GRID_COLS) {
                    const x = col * CONFIG.CELL_WIDTH;
                    const y = row * CONFIG.CELL_HEIGHT + CONFIG.GRID_OFFSET_Y;
                    const itemType = gameState.inventory[gameState.selectedItem];
                    const range = itemType === 'coolant' ? 2 : 1;
                    for (let dr = -range; dr <= range; dr++) {
                        for (let dc = -range; dc <= range; dc++) {
                            const tr = row + dr, tc = col + dc;
                            if (tr >= 0 && tr < CONFIG.GRID_ROWS && tc >= 0 && tc < CONFIG.GRID_COLS) {
                                const hx = tc * CONFIG.CELL_WIDTH;
                                const hy = tr * CONFIG.CELL_HEIGHT + CONFIG.GRID_OFFSET_Y;
                                ctx.fillStyle = itemType === 'coolant' ? 'rgba(100,200,255,0.3)' : 'rgba(255,100,0,0.3)';
                                ctx.fillRect(hx, hy, CONFIG.CELL_WIDTH, CONFIG.CELL_HEIGHT);
                            }
                        }
                    }
                }
            }
            // 绘制陨石坑
            for (let crater of gameState.craters) {
                const cx = crater.col * CONFIG.CELL_WIDTH + CONFIG.CELL_WIDTH / 2;
                const cy = crater.row * CONFIG.CELL_HEIGHT + CONFIG.CELL_HEIGHT / 2 + CONFIG.GRID_OFFSET_Y;
                // 灰色圆形
                ctx.fillStyle = 'rgba(80,80,80,0.7)';
                ctx.beginPath();
                ctx.arc(cx, cy, CONFIG.CELL_WIDTH / 2 - 5, 0, Math.PI * 2);
                ctx.fill();
                // 裂纹效果
                ctx.strokeStyle = 'rgba(50,50,50,0.8)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    const angle = (Math.PI * 2 / 5) * i + 0.3;
                    const r1 = 10 + Math.random() * 5;
                    const r2 = 25 + Math.random() * 10;
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1);
                    ctx.lineTo(cx + Math.cos(angle) * r2, cy + Math.sin(angle) * r2);
                    ctx.stroke();
                }
                // 倒计时文字
                ctx.fillStyle = '#ff8800';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`${(crater.timer / 1000).toFixed(1)}s`, cx, cy + 4);
            }
            // 绘制宝箱
            for (let chest of gameState.chests) {
                if (chest.opened) continue;
                const cx = chest.x, cy = chest.y;
                // 宝箱底色
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(cx - 20, cy - 15, 40, 30);
                // 宝箱盖
                ctx.fillStyle = '#A0522D';
                ctx.fillRect(cx - 22, cy - 18, 44, 10);
                // 锁扣
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(cx - 4, cy - 8, 8, 8);
                // 宝箱文字
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('📦', cx, cy);
            }
            // 绘制道具掉落物
            for (let drop of gameState.itemDrops) {
                const cx = drop.x, cy = drop.y;
                // 发光效果
                ctx.fillStyle = drop.type === 'gunpowder' ? 'rgba(255,100,0,0.3)' : 'rgba(100,200,255,0.3)';
                ctx.beginPath();
                ctx.arc(cx, cy, 22, 0, Math.PI * 2);
                ctx.fill();
                // 道具图标
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(drop.type === 'gunpowder' ? '💣' : '🧊', cx, cy);
            }
        }

        function drawProgressBar() {
            const barW = canvas.width - 40, barH = 8, x = 20, y = 30;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(x, y, barW, barH);
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(x, y, barW * (gameState.gameTime / CONFIG.GAME_DURATION), barH);
            for (let i = 1; i < CONFIG.ERAS.length; i++) {
                const eraX = x + barW * (CONFIG.ERAS[i].start / CONFIG.GAME_DURATION);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(eraX, y - 2); ctx.lineTo(eraX, y + barH + 2); ctx.stroke();
            }
            ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
            for (let i = 0; i < CONFIG.ERAS.length; i++) {
                const eraX = x + barW * ((CONFIG.ERAS[i].start + CONFIG.ERAS[i].end) / 2 / CONFIG.GAME_DURATION);
                ctx.fillText(CONFIG.ERAS[i].name, eraX, y - 5);
            }
        }

        // ==================== 冷却系统 ====================
        function updateCooldowns(deltaTime) {
            const dt = deltaTime;
            for (let type in gameState.cooldowns) {
                if (gameState.cooldowns[type] > 0) {
                    gameState.cooldowns[type] = Math.max(0, gameState.cooldowns[type] - dt);
                }
            }
            if (gameState.shovelCooldown > 0) gameState.shovelCooldown = Math.max(0, gameState.shovelCooldown - dt);

            for (let type in gameState.cooldowns) {
                const card = document.querySelector(`.plant-card[data-plant="${type}"]`);
                const overlay = document.getElementById(`cd-${type}`);
                const text = document.getElementById(`cdt-${type}`);
                if (!card || !overlay || !text) continue;
                const cd = gameState.cooldowns[type];
                const maxCd = CONFIG.PLANTS[type].cooldown;
                if (cd > 0) {
                    card.classList.add('on-cooldown');
                    overlay.style.height = (cd / maxCd * 100) + '%';
                    text.textContent = (cd / 1000).toFixed(1) + 's';
                } else {
                    card.classList.remove('on-cooldown');
                    overlay.style.height = '0%';
                    text.textContent = '';
                }
            }

            const shovelBtn = document.getElementById('shovelBtn');
            if (shovelBtn) {
                if (gameState.shovelCooldown > 0) shovelBtn.classList.add('on-cooldown');
                else shovelBtn.classList.remove('on-cooldown');
            }
        }

        // ==================== 激素系统 ====================
        function applyHormone(plant) {
            if (!plant || !plant.alive) return;
            gameState.hormones--;

            // 沼泽系专属：激素爆炸
            if (plant.type === 'swamp') {
                const eraLevel = gameState.plantEraLevels.swamp || 0;
                const poisonAmount = [1, 2, 3, 4][eraLevel] || 1;
                // 5x5区域爆炸叠毒
                const centerRow = plant.row;
                const centerCol = plant.col;
                let hitCount = 0;
                for (let zombie of gameState.zombies) {
                    const zCol = Math.floor(zombie.x / CONFIG.CELL_WIDTH);
                    const zRow = zombie.row;
                    // 5x5范围：行±2，列±2
                    if (zombie.alive && Math.abs(zRow - centerRow) <= 2 && Math.abs(zCol - centerCol) <= 2) {
                        zombie.applyPoison(poisonAmount);
                        hitCount++;
                    }
                }
                createFloatingText(plant.x, plant.y - 50, `沼泽爆炸! 毒+${poisonAmount}`, '#9932CC');
                // 爆炸后销毁沼泽系
                plant.alive = false;
                gameState.grid[plant.row][plant.col] = null;
                updateHormoneDisplay();
                return;
            }

            plant.hormoneType = plant.type === 'logistics' ? 'logistics' :
                                plant.type === 'fortress' ? 'fortress' :
                                plant.type === 'archer' ? 'archer' :
                                plant.type === 'push' ? 'push' : null;

            if (plant.type === 'fortress') {
                // 堡垒系：进入30秒特殊状态，仅50%反伤
                plant.hormoneTimer = 30000;
                createFloatingText(plant.x, plant.y - 40, '堡垒觉醒! 30秒反伤', '#ff69b4');
            } else if (plant.type === 'archer') {
                // 弓手系：持续5秒，0.02秒发射1发同级子弹
                plant.hormoneTimer = 5000;
                createFloatingText(plant.x, plant.y - 40, '弓手狂暴! 极速射击', '#ff69b4');
            } else if (plant.type === 'logistics') {
                // 后勤系：持续5秒，每0.1秒产出5阳光
                plant.hormoneTimer = 5000;
                createFloatingText(plant.x, plant.y - 40, '激素产速!', '#ff69b4');
            } else if (plant.type === 'push') {
                // 推进系：启动冲刺
                if (!plant.dashing) {
                    plant.dashing = true;
                    createFloatingText(plant.x, plant.y - 40, '推进冲刺!', '#ff69b4');
                }
            }
            updateHormoneDisplay();
        }

        function updateHormoneDisplay() {
            document.getElementById('hormoneDisplay').textContent = `激素: ${gameState.hormones}瓶`;
        }

        // ==================== 游戏主循环 ====================
        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!gameState.running) return;
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            if (!gameState.paused) update(deltaTime);
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update(deltaTime) {
            const dt = deltaTime;
            gameState.gameTime += dt / 1000;

            // 时代切换
            const newEra = getCurrentEra();
            if (newEra !== gameState.currentEra) {
                gameState.currentEra = newEra;
                createEraAnnouncement(CONFIG.ERAS[newEra].name);
                document.getElementById('eraDisplay').textContent = CONFIG.ERAS[newEra].name;
                // 僵尸原地进阶
                advanceZombiesEra();
            }

            if (gameState.gameTime >= CONFIG.GAME_DURATION) { endGame(true); return; }

            // 僵尸刷新：前90秒少量，90秒后大规模潮
            gameState.lastZombieSpawn += dt;
            if (gameState.gameTime >= 30) {
                let spawnInterval;
                if (gameState.gameTime < 90) {
                    // 前90秒：少量刷新，使用当前时代间隔
                    const era = CONFIG.ERAS[gameState.currentEra];
                    spawnInterval = era.zombieInterval;
                } else {
                    // 90秒后：持续大规模刷新，可出巨人
                    spawnInterval = 3000; // 3秒一只
                }
                if (gameState.lastZombieSpawn >= spawnInterval) {
                    const isMassWave = gameState.gameTime >= 90;
                    spawnZombie(isMassWave);
                    gameState.lastZombieSpawn = 0;
                }
            }

            // 随机事件触发
            if (gameState.gameTime >= 30) {
                gameState.lastEventTime += dt;
                if (gameState.lastEventTime >= gameState.nextEventInterval) {
                    gameState.lastEventTime = 0;
                    gameState.nextEventInterval = 25000 + Math.random() * 20000;
                    triggerRandomEvent();
                }
            }
            // 更新陨石坑
            for (let i = gameState.craters.length - 1; i >= 0; i--) {
                gameState.craters[i].timer -= dt;
                if (gameState.craters[i].timer <= 0) gameState.craters.splice(i, 1);
            }
            // 清理已开启的宝箱
            gameState.chests = gameState.chests.filter(c => !c.opened);

            updateCooldowns(dt);
            for (let plant of gameState.plants) plant.update(dt);
            gameState.plants = gameState.plants.filter(p => p.alive);
            for (let zombie of gameState.zombies) zombie.update(dt);
            gameState.zombies = gameState.zombies.filter(z => z.alive);
            for (let proj of gameState.projectiles) proj.update();
            gameState.projectiles = gameState.projectiles.filter(p => p.alive);
            for (let stone of gameState.rollingStones) stone.update(dt);
            gameState.rollingStones = gameState.rollingStones.filter(s => s.alive);

            updateFloatingTexts();
            updateEraAnnouncements();
            updateHUD();
        }

        function updateHUD() {
            const remaining = Math.max(0, CONFIG.GAME_DURATION - gameState.gameTime);
            const m = Math.floor(remaining / 60);
            const s = Math.floor(remaining % 60);
            document.getElementById('timeDisplay').textContent = `${m}:${s.toString().padStart(2, '0')}`;
            document.getElementById('sunDisplay').textContent = Math.floor(gameState.sun);
            document.getElementById('killDisplay').textContent = `击杀: ${gameState.kills}`;
            document.getElementById('scoreDisplay').textContent = `分数: ${gameState.score}`;
            updateExpDisplay();
            updateHormoneDisplay();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawProgressBar();
            for (let plant of gameState.plants) plant.draw(ctx);
            for (let zombie of gameState.zombies) zombie.draw(ctx);
            for (let proj of gameState.projectiles) proj.draw(ctx);
            for (let stone of gameState.rollingStones) stone.draw(ctx);
            drawFloatingTexts(ctx);
            drawEraAnnouncements(ctx);
        }

        // ==================== 游戏控制 ====================
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('plantSelector').style.display = 'flex';
            document.getElementById('hormoneDisplay').style.display = 'block';
            document.getElementById('expDisplay').style.display = 'block';

            gameState = {
                running: true, paused: false, gameTime: 0,
                sun: 500, kills: 0, leaks: 0, score: 0,
                currentEra: 0, selectedPlant: null, selectedTool: null,
                plants: [], zombies: [], projectiles: [], zombieProjectiles: [],
                grid: [], lastZombieSpawn: 0,
                // 最后一波状态
                finalWaveTriggered: [false, false, false],
                finalWaveActive: false,
                finalWaveSpawnCount: 0,
                cooldowns: { archer: 0, logistics: 0, fortress: 0, swamp: 0, push: 0 },
                shovelCooldown: 0,
                mousePos: null,
                exp: 0,
                unlockedSystems: { archer: true, logistics: true, fortress: true, swamp: false, push: false },
                plantEraLevels: { archer: 0, logistics: 0, fortress: 0, swamp: 0, push: 0 },
                hormones: 3,
                hormoneActive: false,
                hormoneTarget: null,
                scoreForHormone: 0,
                hormoneTier: 0,
                // 随机事件
                lastEventTime: 0,
                nextEventInterval: 30000,
                // 宝箱
                chests: [],
                // 道具
                inventory: [],
                selectedItem: null,
                // 道具掉落物（留在场地上的）
                itemDrops: [],
                // 陨石坑
                craters: [],
                // 滚石
                rollingStones: [],
                // 僵尸刷新计数（二阶系统）
                zombieSpawnCount: { normal: 0, imp: 0, giant: 0 }
            };

            initGrid();

            // 重置UI锁定状态
            for (let key of ['swamp', 'push']) {
                const card = document.getElementById(`card-${key}`);
                const lock = document.getElementById(`lock-${key}`);
                if (card) card.classList.add('locked');
                if (lock) lock.style.display = 'block';
            }

            document.querySelectorAll('.plant-card').forEach(c => c.classList.remove('selected'));
            document.querySelectorAll('.tool-btn').forEach(c => c.classList.remove('selected'));
            renderInventory();

            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function endGame(victory) {
            gameState.running = false;
            let grade = 'C';
            if (victory) {
                if (gameState.leaks === 0 && gameState.score >= 500) grade = 'S';
                else if (gameState.leaks === 0) grade = 'A';
                else grade = 'B';
            } else {
                if (gameState.gameTime > 240) grade = 'B';
                else grade = 'C';
            }
            document.getElementById('resultTitle').textContent = victory ? '胜利!' : '失败!';
            document.getElementById('resultTitle').style.color = victory ? '#4CAF50' : '#f44336';
            document.getElementById('gradeDisplay').textContent = grade;
            document.getElementById('gradeDisplay').className = `grade ${grade}`;
            document.getElementById('statKills').textContent = gameState.kills;
            document.getElementById('statLeaks').textContent = gameState.leaks;
            const m = Math.floor(gameState.gameTime / 60);
            const s = Math.floor(gameState.gameTime % 60);
            document.getElementById('statTime').textContent = `${m}:${s.toString().padStart(2, '0')}`;
            document.getElementById('statScore').textContent = gameState.score;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            startGame();
        }

        // ==================== 输入处理 ====================
        function selectPlant(type) {
            if (!gameState.unlockedSystems[type]) return;
            gameState.selectedPlant = type;
            gameState.selectedTool = null;
            gameState.selectedItem = null;
            document.querySelectorAll('.plant-card').forEach(card => card.classList.remove('selected'));
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('selected'));
            const card = document.querySelector(`.plant-card[data-plant="${type}"]`);
            if (card) card.classList.add('selected');
            renderInventory();
        }

        function selectTool(tool) {
            if (tool === 'shovel' && gameState.shovelCooldown > 0) return;
            if (tool === 'hormone' && gameState.hormones <= 0) return;
            gameState.selectedTool = tool;
            gameState.selectedPlant = null;
            gameState.selectedItem = null;
            document.querySelectorAll('.plant-card').forEach(card => card.classList.remove('selected'));
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('selected'));
            const btn = document.getElementById(tool === 'shovel' ? 'shovelBtn' : 'hormoneBtn');
            if (btn) btn.classList.add('selected');
            renderInventory();
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            gameState.mousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        });

        canvas.addEventListener('click', (e) => {
            if (!gameState.running) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const col = Math.floor(x / CONFIG.CELL_WIDTH);
            const row = Math.floor((y - CONFIG.GRID_OFFSET_Y) / CONFIG.CELL_HEIGHT);

            if (row < 0 || row >= CONFIG.GRID_ROWS || col < 0 || col >= CONFIG.GRID_COLS) return;

            // 铲子
            if (gameState.selectedTool === 'shovel') {
                const plant = gameState.grid[row][col];
                if (plant) {
                    if (plant.type === 'swamp') {
                        createFloatingText(x, y, '无法铲除!', '#ff4444');
                    } else {
                        plant.alive = false;
                        gameState.grid[row][col] = null;
                        gameState.shovelCooldown = 5000;
                        createFloatingText(x, y, '铲除!', '#888');
                    }
                }
                gameState.selectedTool = null;
                document.getElementById('shovelBtn').classList.remove('selected');
                return;
            }

            // 激素
            if (gameState.selectedTool === 'hormone') {
                const plant = gameState.grid[row][col];
                if (plant && plant.alive) {
                    applyHormone(plant);
                }
                gameState.selectedTool = null;
                document.getElementById('hormoneBtn').classList.remove('selected');
                return;
            }

            // 推进者：点击召唤滚石
            if (gameState.grid[row][col] && gameState.grid[row][col].type === 'push') {
                summonRollingStone(gameState.grid[row][col]);
                return;
            }

            // 道具释放
            if (gameState.selectedItem !== null) {
                const itemType = gameState.inventory[gameState.selectedItem];
                useItem(itemType, row, col);
                gameState.inventory.splice(gameState.selectedItem, 1);
                gameState.selectedItem = null;
                renderInventory();
                return;
            }

            // 宝箱点击
            for (let chest of gameState.chests) {
                if (!chest.opened && chest.row === row && chest.col === col) {
                    openChest(chest);
                    return;
                }
            }

            // 道具掉落物点击拾取
            for (let i = gameState.itemDrops.length - 1; i >= 0; i--) {
                const drop = gameState.itemDrops[i];
                if (drop.row === row && drop.col === col) {
                    gameState.inventory.push(drop.type);
                    gameState.itemDrops.splice(i, 1);
                    const itemNames = { gunpowder: '火药', coolant: '制冷剂', trap: '灭敌陷阱' };
                    const itemName = itemNames[drop.type] || '道具';
                    createFloatingText(x, y, `拾取${itemName}!`, '#00BFFF');
                    renderInventory();
                    return;
                }
            }

            // 放置植物
            if (!gameState.selectedPlant) return;
            if (!gameState.grid[row][col]) {
                // 检查陨石坑
                const hasCrater = gameState.craters.some(c => c.row === row && c.col === col);
                if (hasCrater) {
                    createFloatingText(x, y, '陨石坑中无法种植!', '#ff4444');
                    return;
                }
                const pType = gameState.selectedPlant;
                const pConfig = CONFIG.PLANTS[pType];
                if (gameState.sun >= pConfig.cost && gameState.cooldowns[pType] <= 0) {
                    gameState.sun -= pConfig.cost;
                    gameState.cooldowns[pType] = pConfig.cooldown;
                    const plant = new Plant(pType, row, col);
                    gameState.plants.push(plant);
                    gameState.grid[row][col] = plant;
                    createFloatingText(x, y, `-${pConfig.cost}☀`, '#FF9800');
                } else if (gameState.sun < pConfig.cost) {
                    createFloatingText(x, y, '阳光不足!', '#f44336');
                } else {
                    createFloatingText(x, y, '冷却中!', '#f44336');
                }
            } else {
                createFloatingText(x, y, '已有植物!', '#f44336');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!gameState.running) return;
            if (e.key === '1') selectPlant('archer');
            if (e.key === '2') selectPlant('logistics');
            if (e.key === '3') selectPlant('fortress');
            if (e.key === '4') selectPlant('swamp');
            if (e.key === '5') selectPlant('push');
            if (e.key === 'Escape') { gameState.selectedPlant = null; gameState.selectedTool = null; gameState.selectedItem = null; renderInventory(); }
        });
    </script>
</body>
</html>
