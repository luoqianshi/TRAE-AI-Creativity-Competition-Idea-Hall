<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>华夏博物馆 - 数字导览系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #1a1a2e;
            --color-secondary: #16213e;
            --color-accent: #d4af37;
            --color-accent-light: #f4d03f;
            --color-text: #f5f5f0;
            --color-text-muted: #a0a0a0;
            --color-card: #232342;
            --color-card-hover: #2d2d4a;
            --font-serif: 'Noto Serif SC', serif;
            --font-sans: 'Noto Sans SC', sans-serif;
            --shadow-glow: 0 0 30px rgba(212, 175, 55, 0.3);
            --transition-smooth: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background: var(--color-primary);
            color: var(--color-text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: linear-gradient(180deg, rgba(26, 26, 46, 0.98) 0%, rgba(26, 26, 46, 0.7) 50%, rgba(26, 26, 46, 0) 100%);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition-smooth);
        }

        .nav-logo {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition-smooth);
        }

        .nav-logo:hover {
            transform: scale(1.02);
        }

        .nav-logo svg {
            width: 32px;
            height: 32px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
            position: relative;
            padding: 0.25rem 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--color-accent);
            transition: var(--transition-smooth);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--color-accent);
        }

        /* Mobile Menu */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            transition: var(--transition-smooth);
        }

        .mobile-menu-btn:hover {
            transform: scale(1.1);
        }

        .mobile-menu-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--color-text);
        }

        /* Views */
        .view {
            display: none;
            min-height: 100vh;
            opacity: 0;
            transition: opacity 0.6s ease-out;
        }

        .view.active {
            display: block;
            opacity: 1;
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #hero-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            animation: heroFadeIn 1.5s ease-out forwards;
        }

        @keyframes heroFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--color-accent);
            border-radius: 30px;
            font-size: 0.85rem;
            color: var(--color-accent);
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            animation: badgePulse 3s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.5); }
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 700;
            color: var(--color-accent);
            margin-bottom: 1rem;
            text-shadow: 0 0 60px rgba(212, 175, 55, 0.5);
            line-height: 1.2;
            animation: titleGlow 4s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 60px rgba(212, 175, 55, 0.5); }
            50% { text-shadow: 0 0 80px rgba(212, 175, 55, 0.7), 0 0 120px rgba(212, 175, 55, 0.3); }
        }

        .hero-subtitle {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: var(--color-text-muted);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--color-accent) 0%, #c4a030 100%);
            color: var(--color-primary);
            font-weight: 500;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .hero-cta::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }

        .hero-cta:hover::before {
            left: 100%;
        }

        .hero-cta:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4);
        }

        .hero-cta svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .hero-cta:hover svg {
            transform: translateX(5px);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            animation: bounce 2.5s ease-in-out infinite;
        }

        .scroll-indicator svg {
            width: 30px;
            height: 30px;
            stroke: var(--color-accent);
            opacity: 0.7;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(12px); }
        }

        /* Categories Section */
        .categories {
            padding: 5rem 2rem;
            background: linear-gradient(180deg, var(--color-secondary) 0%, var(--color-primary) 100%);
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title {
            font-family: var(--font-serif);
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            color: var(--color-accent);
            margin-bottom: 0.5rem;
        }

        .section-subtitle {
            color: var(--color-text-muted);
            font-size: 1rem;
        }

        .categories-scroll {
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            padding: 1rem 0;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            justify-content: center;
            flex-wrap: wrap;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-card {
            flex: 0 0 160px;
            scroll-snap-align: center;
            padding: 1.5rem 1.25rem;
            background: var(--color-card);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .category-card:hover::before {
            opacity: 1;
        }

        .category-card:hover {
            background: var(--color-card-hover);
            border-color: var(--color-accent);
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .category-card.active {
            background: var(--color-card-hover);
            border-color: var(--color-accent);
            box-shadow: var(--shadow-glow);
        }

        .category-icon {
            width: 50px;
            height: 50px;
            margin: 0 auto 0.75rem;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .category-card:hover .category-icon {
            transform: scale(1.1);
            background: rgba(212, 175, 55, 0.2);
        }

        .category-icon svg {
            width: 26px;
            height: 26px;
            stroke: var(--color-accent);
        }

        .category-name {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--color-text);
            margin-bottom: 0.25rem;
        }

        /* Exhibits Grid */
        .exhibits-section {
            padding: 5rem 2rem;
        }

        .exhibits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .exhibit-card {
            background: var(--color-card);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 1px solid transparent;
            position: relative;
        }

        .exhibit-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .exhibit-card:hover::after {
            opacity: 1;
        }

        .exhibit-card:hover {
            transform: translateY(-12px) scale(1.01);
            border-color: var(--color-accent);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 30px rgba(212, 175, 55, 0.2);
        }

        .exhibit-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--color-secondary) 0%, var(--color-card) 100%);
            transition: transform 0.6s ease;
        }

        .exhibit-card:hover .exhibit-image {
            transform: scale(1.05);
        }

        .exhibit-info {
            padding: 1.5rem;
        }

        .exhibit-category {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--color-accent);
            margin-bottom: 0.75rem;
        }

        .exhibit-name {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            color: var(--color-text);
            margin-bottom: 0.5rem;
        }

        .exhibit-era {
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        /* Detail View */
        .detail-view {
            padding-top: 80px;
            padding-bottom: 120px;
        }

        .detail-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--color-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: var(--color-text);
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: var(--color-card-hover);
            border-color: var(--color-accent);
            transform: translateX(-5px);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        .back-btn:hover svg {
            transform: translateX(-3px);
        }

        .detail-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .detail-3d {
            background: linear-gradient(135deg, var(--color-card) 0%, var(--color-secondary) 100%);
            border-radius: 24px;
            overflow: hidden;
            aspect-ratio: 1;
            position: relative;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        #detail-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: detailSlideIn 0.8s ease-out forwards;
        }

        @keyframes detailSlideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .detail-title {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--color-accent);
            line-height: 1.3;
        }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            background: var(--color-card);
            border-radius: 10px;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
        }

        .meta-item:hover {
            background: var(--color-card-hover);
            transform: translateY(-2px);
        }

        .meta-item svg {
            width: 16px;
            height: 16px;
            stroke: var(--color-accent);
        }

        .detail-description {
            font-size: 1.1rem;
            line-height: 1.9;
            color: var(--color-text-muted);
        }

        /* Audio Player */
        .audio-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding: 1.25rem 2rem;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .audio-player.visible {
            transform: translateY(0);
        }

        .audio-player-inner {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .play-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-accent) 0%, #c4a030 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .play-btn::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.4) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .play-btn:hover::before {
            opacity: 1;
        }

        .play-btn:hover {
            transform: scale(1.12);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
        }

        .play-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--color-primary);
        }

        .audio-info {
            flex: 1;
            min-width: 0;
        }

        .audio-title {
            font-size: 0.95rem;
            color: var(--color-text);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .audio-progress {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .audio-progress:hover {
            height: 10px;
        }

        .audio-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--color-accent) 0%, var(--color-accent-light) 100%);
            border-radius: 4px;
            width: 0%;
            transition: width 0.15s linear;
            position: relative;
        }

        .audio-progress-bar::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: var(--color-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .audio-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-top: 0.35rem;
        }

        .audio-speed {
            padding: 0.5rem 1rem;
            background: var(--color-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--color-text);
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition-smooth);
        }

        .audio-speed:hover {
            border-color: var(--color-accent);
            background: var(--color-card-hover);
        }

        /* List View */
        .list-view {
            padding-top: 100px;
            min-height: 100vh;
        }

        .list-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .list-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .search-bar {
            max-width: 500px;
            margin: 2rem auto 0;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 1rem 1.5rem;
            padding-left: 3.5rem;
            background: var(--color-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: var(--color-text);
            font-size: 1rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .search-bar input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .search-bar input::placeholder {
            color: var(--color-text-muted);
        }

        .search-bar svg {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            stroke: var(--color-text-muted);
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--color-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 1.5rem;
            font-family: var(--font-serif);
            color: var(--color-accent);
            font-size: 1.1rem;
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .detail-content {
                grid-template-columns: 1fr;
            }

            .detail-3d {
                aspect-ratio: 4/3;
                max-height: 400px;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }

            .nav-links.active {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--color-secondary);
                padding: 1rem 2rem;
                gap: 1rem;
                border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            }

            .hero-content {
                padding: 1rem;
            }

            .categories {
                padding: 3rem 1rem;
            }

            .category-card {
                flex: 0 0 130px;
            }

            .exhibits-section {
                padding: 3rem 1rem;
            }

            .exhibits-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .detail-container {
                padding: 1rem;
            }

            .audio-player {
                padding: 0.75rem 1rem;
            }

            .audio-player-inner {
                gap: 1rem;
            }

            .play-btn {
                width: 48px;
                height: 48px;
            }

            .audio-speed {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.7s ease-out forwards;
        }

        .fade-in-delay-1 { animation-delay: 0.1s; }
        .fade-in-delay-2 { animation-delay: 0.2s; }
        .fade-in-delay-3 { animation-delay: 0.3s; }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            const loading = document.getElementById('loading');
            if (loading) {
                loading.classList.add('hidden');
            }
            
            try {
                initHeroScene();
            } catch (e) {
                console.error('Error initializing hero scene:', e);
            }
            
            try {
                renderCategories();
            } catch (e) {
                console.error('Error rendering categories:', e);
            }
            
            try {
                renderFeaturedExhibits();
            } catch (e) {
                console.error('Error rendering featured exhibits:', e);
            }
            
            try {
                setupEventListeners();
            } catch (e) {
                console.error('Error setting up event listeners:', e);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(initializeApp, 1000);
        });
        
        window.addEventListener('load', () => {
            const loading = document.getElementById('loading');
            if (loading && !loading.classList.contains('hidden')) {
                loading.classList.add('hidden');
            }
        });

        function goHome() {
            stopAudioIfPlaying();
            switchView('home');

            stopAudioIfPlaying();
            switchView('list');

            stopAudioIfPlaying();
            const exhibit = exhibits.find(e => e.id === exhibitId);
            if (exhibit) {
                currentExhibit = exhibit;
                switchView('detail');
            }
        }

        function stopAudioIfPlaying() {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            isPlaying = false;
            audioCurrent = 0;
            updateAudioUI();
        }

            const views = document.querySelectorAll('.view');
            views.forEach(v => {
                v.classList.remove('active');
                v.style.opacity = '0';
            });

            const targetView = document.getElementById(viewName + 'View');
            if (targetView) {
                setTimeout(() => {
                    targetView.classList.add('active');
                    targetView.style.opacity = '1';
                }, 50);
            }

            currentView = viewName;

            if (viewName === 'home') {
                document.getElementById('audioPlayer').classList.remove('visible');
                if (!heroAnimationId) initHeroScene();
            } else if (viewName === 'list') {
                document.getElementById('audioPlayer').classList.remove('visible');
                renderAllExhibits();
                renderListCategories();
            } else if (viewName === 'detail') {
                document.getElementById('audioPlayer').classList.add('visible');
                renderExhibitDetail();
                setTimeout(() => initDetailScene(), 100);
            }

            window.scrollTo(0, 0);

            container.innerHTML = categories.map(cat => `

                    <div class="category-name">${cat.name}</div>

            container.innerHTML = categories.map(cat => `
                <div class="category-card ${cat.id === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}', 'list')">

                    <div class="category-name">${cat.name}</div>

            if (view === 'home') {

                specular: 0xffffff
            });
            heroRing = new THREE.Mesh(ringGeometry, ringMaterial);
            heroScene.add(heroRing);

            // Inner ring
            const innerRingGeometry = new THREE.TorusGeometry(1.0, 0.15, 24, 80);
            const innerRingMaterial = new THREE.MeshPhongMaterial({
                color: 0xffd700,
                emissive: 0x442200,
                shininess: 200,
                specular: 0xffffff
            });
            const innerRing = new THREE.Mesh(innerRingGeometry, innerRingMaterial);
            heroScene.add(innerRing);

            // Create floating particles
            const particlesGeometry = new THREE.BufferGeometry();
            const particleCount = 300;
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 20;
                positions[i + 1] = (Math.random() - 0.5) * 20;
                positions[i + 2] = (Math.random() - 0.5) * 20;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                color: 0xd4af37,
                size: 0.08,
                transparent: true,
                opacity: 0.7
            });

            heroParticles = new THREE.Points(particlesGeometry, particlesMaterial);
            heroScene.add(heroParticles);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            heroScene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffd700, 1.2);
            mainLight.position.set(5, 5, 5);
            heroScene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x4488ff, 0.6);
            fillLight.position.set(-5, 0, 5);
            heroScene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
            rimLight.position.set(0, 5, -5);
            heroScene.add(rimLight);

            // Animation variables
            let mouseX = 0, mouseY = 0;
            let targetRotationX = 0, targetRotationY = 0;
            let time = 0;

            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                mouseY = (e.clientY / window.innerHeight) * 2 - 1;
            });

            function animateHero() {
                if (currentView !== 'home') return;
                heroAnimationId = requestAnimationFrame(animateHero);
                time += 0.01;

                heroRing.rotation.x = Math.sin(time * 0.5) * 0.3 + 0.3;
                heroRing.rotation.y += 0.008;
                heroRing.rotation.z = Math.cos(time * 0.3) * 0.1;

                innerRing.rotation.x = Math.sin(time * 0.7) * 0.2;
                innerRing.rotation.y -= 0.01;

                targetRotationX += (mouseY * 0.4 - targetRotationX) * 0.03;
                targetRotationY += (mouseX * 0.4 - targetRotationY) * 0.03;

                heroParticles.rotation.y += 0.0008;
                heroParticles.rotation.x += 0.0003;

                heroCamera.position.x = targetRotationY * 0.6;
                heroCamera.position.y = -targetRotationX * 0.6;
                heroCamera.lookAt(heroScene.position);

                heroRenderer.render(heroScene, heroCamera);
            }

            animateHero();

            window.addEventListener('resize', () => {
                if (heroCamera && heroRenderer) {
                    heroCamera.aspect = window.innerWidth / window.innerHeight;
                    heroCamera.updateProjectionMatrix();
                    heroRenderer.setSize(window.innerWidth, window.innerHeight);
                }
            });
        }

        // Three.js Detail Scene
        function initDetailScene() {
            const canvas = document.getElementById('detail-canvas');
            if (!canvas || !currentExhibit) return;

            // Cleanup previous
            if (detailAnimationId) {
                cancelAnimationFrame(detailAnimationId);
            }
            if (detailRenderer) {
                detailRenderer.dispose();
            }

            detailScene = new THREE.Scene();

            const rect = canvas.getBoundingClientRect();
            detailCamera = new THREE.PerspectiveCamera(50, rect.width / rect.height, 0.1, 1000);
            detailCamera.position.z = 4;

            detailRenderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            detailRenderer.setSize(rect.width, rect.height);
            detailRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const color = currentExhibit.color || '#d4af37';
            const colorHex = parseInt(color.replace('#', '0x'));
            const modelType = currentExhibit.modelType || 'default';

            const group = new THREE.Group();

            const emissiveHex = categoryToEmissive(currentExhibit.category);
            const shininess = categoryToShininess(currentExhibit.category);

            switch(modelType) {
                case 'zun':
                    createZunModel(group, colorHex, emissiveHex, shininess);
                    break;
                case 'jade':
                    createJadeModel(group, colorHex, emissiveHex, shininess);
                    break;
                case 'vase':
                    createVaseModel(group, colorHex, emissiveHex, shininess);
                    break;
                case 'scroll':
                    createScrollModel(group, colorHex, emissiveHex, shininess);
                    break;
                case 'gold':
                    createGoldModel(group, colorHex, emissiveHex, shininess);
                    break;
                case 'bell':
                    createBellModel(group, colorHex, emissiveHex, shininess);
                    break;
                case 'bowl':
                    createBowlModel(group, colorHex, emissiveHex, shininess);
                    break;
                default:
                    createDefaultModel(group, colorHex, emissiveHex, shininess);
            }

            detailMesh = group;

            function categoryToEmissive(category) {
                const emissives = {
                    bronze: 0x221a0a,
                    gold: 0x443300,
                    jade: 0x113311,
                    ceramic: 0x112222,
                    painting: 0x222211
                };
                return emissives[category] || 0x222222;
            }

            function categoryToShininess(category) {
                const shininessValues = {
                    bronze: 120,
                    gold: 150,
                    jade: 100,
                    ceramic: 80,
                    painting: 40
                };
                return shininessValues[category] || 100;
            }

            function createZunModel(group, color, emissive, shininess) {
                const material = new THREE.MeshPhongMaterial({ color, emissive, shininess, specular: 0xffffff });
                
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1.0, 1.8, 32), material);
                group.add(body);

                const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 0.4, 32), material);
                neck.position.y = 1.1;
                group.add(neck);

                const rim = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.15, 16, 32), material);
                rim.position.y = 1.3;
                rim.rotation.x = Math.PI / 2;
                group.add(rim);

                for(let i = 0; i < 4; i++) {
                    const earGeometry = new THREE.SphereGeometry(0.25, 16, 16);
                    const ear = new THREE.Mesh(earGeometry, material);
                    const angle = (i * Math.PI) / 2;
                    ear.position.set(Math.cos(angle) * 0.85, 0.5, Math.sin(angle) * 0.85);
                    group.add(ear);
                }
            }

            function createJadeModel(group, color, emissive, shininess) {
                const material = new THREE.MeshPhongMaterial({ 
                    color, emissive, shininess, specular: 0xffffff,
                    transparent: true, opacity: 0.85 
                });
                
                const outerRing = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.15, 32, 64), material);
                group.add(outerRing);

                const innerRing = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.1, 32, 48), material);
                group.add(innerRing);

                const center = new THREE.Mesh(new THREE.CircleGeometry(0.25, 32), material);
                center.rotation.x = -Math.PI / 2;
                group.add(center);
            }

            function createVaseModel(group, color, emissive, shininess) {
                const material = new THREE.MeshPhongMaterial({ 
                    color, emissive, shininess, specular: 0xffffff,
                    transparent: true, opacity: 0.9 
                });

                const bodyGeometry = new THREE.LatheGeometry([
                    new THREE.Vector2(0.3, -1.2),
                    new THREE.Vector2(0.8, -0.9),
                    new THREE.Vector2(0.9, -0.3),
                    new THREE.Vector2(0.8, 0.3),
                    new THREE.Vector2(0.6, 1.0),
                    new THREE.Vector2(0.5, 1.2)
                ], 32);
                const body = new THREE.Mesh(bodyGeometry, material);
                group.add(body);

                const rim = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.08, 16, 32), material);
                rim.position.y = 1.2;
                rim.rotation.x = Math.PI / 2;
                group.add(rim);
            }

            function createScrollModel(group, color, emissive, shininess) {
                const material = new THREE.MeshPhongMaterial({ color, emissive, shininess });

                const scroll = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 2.8, 32), material);
                scroll.rotation.z = Math.PI / 2;
                group.add(scroll);

                const capMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x8b4513, 
                    emissive: 0x442200, 
                    shininess: 80 
                });

                const capGeometry = new THREE.CylinderGeometry(0.28, 0.28, 0.08, 32);
                const cap1 = new THREE.Mesh(capGeometry, capMaterial);
                cap1.position.x = 1.45;
                cap1.rotation.z = Math.PI / 2;
                group.add(cap1);

                const cap2 = new THREE.Mesh(capGeometry, capMaterial);
                cap2.position.x = -1.45;
                cap2.rotation.z = Math.PI / 2;
                group.add(cap2);
            }

            function createGoldModel(group, color, emissive, shininess) {
                const material = new THREE.MeshPhongMaterial({ color, emissive, shininess, specular: 0xffffff });

                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.8, 32), material);
                group.add(body);

                const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 0.2, 32), material);
                lid.position.y = 0.5;
                group.add(lid);

                const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.3, 16), material);
                spout.position.set(0.5, 0.3, 0);
                spout.rotation.z = Math.PI / 3;
                group.add(spout);

                const handle = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.08, 8, 16), material);
                handle.position.set(-0.4, 0.3, 0);
                handle.rotation.z = Math.PI / 2;
                group.add(handle);
            }

            function createBellModel(group, color, emissive, shininess) {
                const material = new THREE.MeshPhongMaterial({ color, emissive, shininess, specular: 0xffffff });

                const bodyGeometry = new THREE.LatheGeometry([
                    new THREE.Vector2(0.1, -1.2),
                    new THREE.Vector2(0.6, -1.0),
                    new THREE.Vector2(0.8, -0.5),
                    new THREE.Vector2(0.7, 0),
                    new THREE.Vector2(0.5, 0.8),
                    new THREE.Vector2(0.4, 1.0)
                ], 32);
                const body = new THREE.Mesh(bodyGeometry, material);
                group.add(body);

                const rim = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.12, 16, 32), material);
                rim.position.y = 1.0;
                rim.rotation.x = Math.PI / 2;
                group.add(rim);

                const clapper = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), material);
                clapper.position.y = -0.3;
                group.add(clapper);
            }

            function createBowlModel(group, color, emissive, shininess) {
                const material = new THREE.MeshPhongMaterial({ 
                    color, emissive, shininess, specular: 0xffffff,
                    transparent: true, opacity: 0.9 
                });

                const bowlGeometry = new THREE.LatheGeometry([
                    new THREE.Vector2(0.1, -0.1),
                    new THREE.Vector2(0.9, -0.1),
                    new THREE.Vector2(1.0, -0.05),
                    new THREE.Vector2(0.95, 0.2),
                    new THREE.Vector2(0.8, 0.5),
                    new THREE.Vector2(0.6, 0.6)
                ], 32);
                const bowl = new THREE.Mesh(bowlGeometry, material);
                bowl.rotation.x = Math.PI;
                group.add(bowl);
            }

            function createDefaultModel(group, color, emissive, shininess) {
                const material = new THREE.MeshPhongMaterial({ color, emissive, shininess, specular: 0xffffff });
                const geometry = new THREE.BoxGeometry(1.5, 2, 1.5);
                const mesh = new THREE.Mesh(geometry, material);
                group.add(mesh);
            }

            detailScene.add(detailMesh);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.7);
            detailScene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffd700, 1.3);
            mainLight.position.set(3, 3, 5);
            detailScene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x4488ff, 0.5);
            fillLight.position.set(-3, 0, 3);
            detailScene.add(fillLight);

            const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
            backLight.position.set(0, -3, -3);
            detailScene.add(backLight);

            // Interactive rotation
            let isDragging = false;
            let previousMouseX = 0;
            let previousMouseY = 0;
            let rotationX = 0;
            let rotationY = 0;
            let targetRotX = 0;
            let targetRotY = 0;
            let autoRotate = true;
            let time = 0;

            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                autoRotate = false;
                previousMouseX = e.clientX;
                previousMouseY = e.clientY;
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMouseX;
                const deltaY = e.clientY - previousMouseY;
                targetRotY += deltaX * 0.008;
                targetRotX += deltaY * 0.008;
                previousMouseX = e.clientX;
                previousMouseY = e.clientY;
            });

            canvas.addEventListener('mouseup', () => {
                isDragging = false;
                setTimeout(() => autoRotate = true, 2000);
            });
            canvas.addEventListener('mouseleave', () => isDragging = false);

            // Touch events
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                autoRotate = false;
                previousMouseX = e.touches[0].clientX;
                previousMouseY = e.touches[0].clientY;
            }, { passive: true });

            canvas.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const deltaX = e.touches[0].clientX - previousMouseX;
                const deltaY = e.touches[0].clientY - previousMouseY;
                targetRotY += deltaX * 0.008;
                targetRotX += deltaY * 0.008;
                previousMouseX = e.touches[0].clientX;
                previousMouseY = e.touches[0].clientY;
            }, { passive: true });

            canvas.addEventListener('touchend', () => {
                isDragging = false;
                setTimeout(() => autoRotate = true, 2000);
            });

            // Zoom
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                detailCamera.position.z = Math.max(2.5, Math.min(8, detailCamera.position.z + e.deltaY * 0.005));
            }, { passive: false });

            // Animation
            function animateDetail() {
                if (currentView !== 'detail') return;
                detailAnimationId = requestAnimationFrame(animateDetail);
                time += 0.015;

                // Smooth rotation interpolation
                rotationX += (targetRotX - rotationX) * 0.08;
                rotationY += (targetRotY - rotationY) * 0.08;

                if (autoRotate) {
                    targetRotY += 0.005;
                    targetRotX = Math.sin(time * 0.5) * 0.15;
                }

                detailMesh.rotation.x = rotationX;
                detailMesh.rotation.y = rotationY;

                detailRenderer.render(detailScene, detailCamera);
            }

            animateDetail();

            // Resize handler
            const resizeObserver = new ResizeObserver(() => {
                if (canvas.clientWidth && canvas.clientHeight && detailCamera && detailRenderer) {
                    detailCamera.aspect = canvas.clientWidth / canvas.clientHeight;
                    detailCamera.updateProjectionMatrix();
                    detailRenderer.setSize(canvas.clientWidth, canvas.clientHeight);
                }
            });
            resizeObserver.observe(canvas);
        }

        // Audio Player with Web Speech API
        let speechSynthesis = window.speechSynthesis;
        let currentUtterance = null;
        let audioTimer = null;

        const audioTexts = {
            'bronze-zun': '欢迎来到四羊方尊展品前。这件稀世珍宝出土于湖南宁乡，是商代晚期青铜器的巅峰之作。高约58厘米，重达34.5公斤，是目前已知商代青铜器中体量最大的方尊。四羊方尊最神奇之处在于其独特的造型设计：器身四角各铸一只大角羊头，羊身则化为器腹，精美绝伦。',
            'jade-bi': '现在您看到的是著名的金缕玉衣，出土于河北满城的西汉诸侯王墓。这件玉衣全长1.88米，由2498片上等和田玉片用金丝精心编织而成，共用黄金约1100克。金缕玉衣是汉代最高规格的丧葬服饰。',
            'porcelain-vase': '您现在欣赏的是明代永乐青花龙纹大缸。景德镇在明清两代是皇家御用瓷器的生产地，这件大缸就是御窑厂的巅峰杰作。缸高45厘米，器形硕大浑厚，青花发色沉稳艳丽。',
            'painting-chunhua': '眼前这幅就是被誉为画中之兰亭的富春山居图，出自元代大师黄公望之手。黄公望晚年隐居富春江畔，用四五年时间创作了这幅长卷，全长近6.4米。',
            'gold-crown': '这是一件极为珍贵的唐代鎏金银壶，出土于西安何家村窖藏。壶高仅14.3厘米，但造型之美、工艺之精，令人叹为观止。银壶两侧各装饰一匹舞马，马身鎏金，马嘴衔着酒杯。',
            'bronze-bell': '您现在站在曾侯乙编钟面前，这是世界音乐史上最伟大的考古发现之一。这套编钟出土于湖北随州战国早期的诸侯国君墓葬，全套65件，总重量超过2.5吨。',
            'celadon-vase': '这件小小的汝窑洗子，虽然只有巴掌大小，却被誉为中国陶瓷艺术的最高境界。汝窑产自河南宝丰县清凉寺，是北宋皇室的御用窑场。',
            'painting-aurora': '这幅壮丽的千里江山图全长近12米，是北宋天才少年王希孟传世的唯一作品。据画史记载，王希孟曾得到宋徽宗的亲自指点，创作此画时不过十八九岁。'
        };

        function resetAudio() {
            stopAudio();
            isPlaying = false;
            audioCurrent = 0;
            audioDuration = currentExhibit ? 60 : 0;
            updateAudioUI();
        }

        function stopAudio() {
            if (currentUtterance) {
                speechSynthesis.cancel();
                currentUtterance = null;
            }
            if (audioTimer) {
                clearInterval(audioTimer);
                audioTimer = null;
            }
        }

        function togglePlay() {
            if (!currentExhibit) return;

            if (isPlaying) {
                stopAudio();
                isPlaying = false;
                updateAudioUI();
                return;
            }

            isPlaying = true;
            updateAudioUI();

            const text = audioTexts[currentExhibit.id] || '欢迎观看这件展品。';
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = 'zh-CN';
            currentUtterance.rate = playbackRate;
            currentUtterance.pitch = 1;
            currentUtterance.volume = 0.8;

            const voices = speechSynthesis.getVoices();
            const chineseVoice = voices.find(v => v.lang.startsWith('zh')) || voices.find(v => v.lang.startsWith('zh-CN'));
            if (chineseVoice) {
                currentUtterance.voice = chineseVoice;
            }

            currentUtterance.onstart = () => {
                audioTimer = setInterval(() => {
                    audioCurrent += 0.1;
                    if (audioCurrent >= audioDuration) {
                        audioCurrent = audioDuration;
                    }
                    updateAudioUI();
                }, 100);
            };

            currentUtterance.onend = () => {
                stopAudio();
                isPlaying = false;
                audioCurrent = audioDuration;
                updateAudioUI();
            };

            currentUtterance.onerror = () => {
                stopAudio();
                isPlaying = false;
                updateAudioUI();
            };

            speechSynthesis.speak(currentUtterance);
        }

        function updateAudioUI() {
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            if (playIcon && pauseIcon) {
                playIcon.classList.toggle('hidden', isPlaying);
                pauseIcon.classList.toggle('hidden', !isPlaying);
            }

            const progress = audioDuration > 0 ? (audioCurrent / audioDuration) * 100 : 0;
            const progressBar = document.getElementById('audioProgressBar');
            if (progressBar) progressBar.style.width = `${progress}%`;

            const currentTimeEl = document.getElementById('audioCurrentTime');
            const durationEl = document.getElementById('audioDuration');
            if (currentTimeEl) currentTimeEl.textContent = formatTime(audioCurrent);
            if (durationEl) durationEl.textContent = formatTime(audioDuration);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function setPlaybackRate() {
            const rates = [0.75, 1.0, 1.25, 1.5];
            const currentIndex = rates.indexOf(playbackRate);
            playbackRate = rates[(currentIndex + 1) % rates.length];
            const speedBtn = document.getElementById('audioSpeed');
            if (speedBtn) speedBtn.textContent = `${playbackRate}x`;
        }

        function seekAudio(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percent = x / rect.width;
            audioCurrent = percent * audioDuration;
            updateAudioUI();
        }

        // Event Listeners
        function setupEventListeners() {
            const playBtn = document.getElementById('playBtn');
            if (playBtn) playBtn.addEventListener('click', togglePlay);

            const audioSpeed = document.getElementById('audioSpeed');
            if (audioSpeed) audioSpeed.addEventListener('click', setPlaybackRate);

            const audioProgress = document.getElementById('audioProgress');
            if (audioProgress) audioProgress.addEventListener('click', seekAudio);

            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            if (mobileMenuBtn) {
                mobileMenuBtn.addEventListener('click', () => {
                    const navLinks = document.getElementById('navLinks');
                    if (navLinks) navLinks.classList.toggle('active');
                });
            }

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase();
                    const filtered = exhibits.filter(ex =>
                        ex.name.toLowerCase().includes(query) ||
                        ex.era.toLowerCase().includes(query) ||
                        ex.categoryName.toLowerCase().includes(query)
                    );
                    renderFilteredExhibits(filtered);
                });
            }
        }
    </script>
</body>
</html>
