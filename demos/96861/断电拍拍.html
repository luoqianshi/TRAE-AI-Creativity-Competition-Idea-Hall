<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>断电拍拍 · 智能充电管理</title>
  <style>
    :root {
      --bg-primary: #f8f9fa;
      --bg-card: #ffffff;
      --text-primary: #2d3748;
      --text-secondary: #718096;
      --border-color: #e2e8f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --radius-lg: 12px;
      --radius-md: 8px;
      --transition: all 0.2s ease;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .dark-mode {
      --bg-primary: #1a202c;
      --bg-card: #2d3748;
      --text-primary: #e2e8f0;
      --text-secondary: #a0aec0;
      --border-color: #4a5568;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      transition: var(--transition);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      max-width: 400px;
      margin: 0 auto;
    }

    .status-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
      border: 1px solid var(--border-color);
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .status-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .theme-toggle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .power-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .led {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      flex-shrink: 0;
    }

    .led.off {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .power-text {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .timer-display {
      font-size: 2.2rem;
      font-weight: 700;
      text-align: center;
      margin: 20px 0;
      color: var(--accent);
      font-family: "SF Mono", "Consolas", monospace;
      letter-spacing: -0.5px;
    }

    .timer-label {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .duration-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 28px 0;
    }

    .duration-btn {
      padding: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.95rem;
    }

    .duration-btn:hover:not(:disabled) {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .duration-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .duration-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .manual-controls {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 1rem;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: 1px solid var(--accent);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-outline:hover:not(:disabled) {
      background: rgba(79, 70, 229, 0.1);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      margin-top: 24px;
      padding: 16px;
      background: rgba(79, 70, 229, 0.05);
      border-radius: var(--radius-md);
      border-left: 4px solid var(--accent);
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .hint strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .duration-buttons {
        grid-template-columns: 1fr;
      }

      .manual-controls {
        flex-direction: column;
      }

      h1 {
        font-size: 1.6rem;
      }

      .timer-display {
        font-size: 1.9rem;
      }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      .duration-buttons {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Animation for timer change */
    @keyframes pulse {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }
    .timer-display.updating {
      animation: pulse 0.4s ease;
    }

    /* LED pulse effect when active */
    .led.on {
      animation: pulse 1.5s infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>断电拍拍</h1>
      <p class="subtitle">扫码即控 · 多设备智能断电 · 无需App</p>
    </header>

    <div class="status-card">
      <div class="status-header">
        <div class="status-title">当前供电状态</div>
        <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色模式">
          <svg viewBox="0 0 24 24">
            <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 21.75a.75.75 0 01.75.75v.008a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-.008a.75.75 0 01.75-.75h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H15a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5z"/>
          </svg>
        </button>
      </div>

      <div class="power-indicator">
        <div class="led on" id="ledIndicator"></div>
        <div class="power-text">供电中 · 3台设备</div>
      </div>

      <div class="timer-label">下次自动断电倒计时</div>
      <div class="timer-display" id="timerDisplay">00:00</div>

      <div class="duration-buttons">
        <button class="duration-btn" data-minutes="15">15分钟</button>
        <button class="duration-btn" data-minutes="30">30分钟</button>
        <button class="duration-btn" data-minutes="60">60分钟</button>
      </div>

      <div class="manual-controls">
        <button class="btn btn-primary" id="powerToggle">立即断电</button>
        <button class="btn btn-outline" id="cancelBtn">取消延时</button>
      </div>

      <div class="hint">
        <strong>小贴士：</strong>盒体侧面有物理按键，长按3秒可强制断电（适用于手机没电或扫码失败场景）
      </div>
    </div>

    <footer>
      <p>断电拍拍 · 让充电更安心</p>
    </footer>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
    });

    // 倒计时逻辑
    let countdownInterval = null;
    let remainingSeconds = 0;
    const timerDisplay = document.getElementById('timerDisplay');
    const ledIndicator = document.getElementById('ledIndicator');
    const durationButtons = document.querySelectorAll('.duration-btn');
    const powerToggle = document.getElementById('powerToggle');
    const cancelBtn = document.getElementById('cancelBtn');

    function updateTimerDisplay() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      timerDisplay.classList.add('updating');
      setTimeout(() => timerDisplay.classList.remove('updating'), 400);
    }

    function startCountdown(minutes) {
      // 清除已有倒计时
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      // 设置新倒计时
      remainingSeconds = minutes * 60;
      updateTimerDisplay();

      // 激活对应按钮
      durationButtons.forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.minutes) === minutes);
      });

      // 启动定时器
      countdownInterval = setInterval(() => {
        remainingSeconds--;
        updateTimerDisplay();

        if (remainingSeconds <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          // 断电状态
          ledIndicator.classList.remove('on');
          ledIndicator.classList.add('off');
          timerDisplay.textContent = '已断电';
          powerToggle.textContent = '恢复供电';
          powerToggle.classList.remove('btn-primary');
          powerToggle.classList.add('btn-outline');
          powerToggle.style.backgroundColor = 'transparent';
          // 禁用延时按钮
          durationButtons.forEach(btn => btn.disabled = true);
        }
      }, 1000);
    }

    // 绑定延时按钮
    durationButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const mins = parseInt(btn.dataset.minutes);
        startCountdown(mins);
      });
    });

    // 手动断电/恢复
    powerToggle.addEventListener('click', () => {
      if (countdownInterval) {
        // 正在倒计时 → 立即断电
        clearInterval(countdownInterval);
        countdownInterval = null;
        remainingSeconds = 0;
        ledIndicator.classList.remove('on');
        ledIndicator.classList.add('off');
        timerDisplay.textContent = '已断电';
        powerToggle.textContent = '恢复供电';
        powerToggle.classList.remove('btn-primary');
        powerToggle.classList.add('btn-outline');
        durationButtons.forEach(btn => btn.disabled = true);
      } else {
        // 已断电 → 恢复供电
        ledIndicator.classList.remove('off');
        ledIndicator.classList.add('on');
        timerDisplay.textContent = '00:00';
        powerToggle.textContent = '立即断电';
        powerToggle.classList.remove('btn-outline');
        powerToggle.classList.add('btn-primary');
        durationButtons.forEach(btn => btn.disabled = false);
        // 重置按钮激活态
        durationButtons.forEach(btn => btn.classList.remove('active'));
      }
    });

    // 取消延时
    cancelBtn.addEventListener('click', () => {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
        ledIndicator.classList.add('on');
        ledIndicator.classList.remove('off');
        timerDisplay.textContent = '00:00';
        powerToggle.textContent = '立即断电';
        powerToggle.classList.remove('btn-outline');
        powerToggle.classList.add('btn-primary');
        durationButtons.forEach(btn => {
          btn.disabled = false;
          btn.classList.remove('active');
        });
      }
    });

    // 初始化：默认供电中，LED亮，倒计时00:00
    timerDisplay.textContent = '00:00';
  </script>
</body>
</html>
