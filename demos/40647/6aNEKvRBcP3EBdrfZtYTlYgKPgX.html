document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ranslate(34px,-30px);}}\n  @keyframes nd-drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(-30px,26px);}}\n  @keyframes nd-dot{0%,100%{opacity:1;}50%{opacity:.18;}}\n  @keyframes nd-hint{0%{transform:translateY(0);opacity:.7;}50%{transform:translateY(7px);opacity:.25;}100%{transform:translateY(0);opacity:.7;}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div id=\"nd-root\" style=\"--accent:{{accent}};--accent-soft:{{accentSoft}};--accent-line:{{accentLine}};background:#F3ECE0;color:#241F19;font-family:'Noto Sans SC',-apple-system,'PingFang SC',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;position:relative;\">\n\n  <!-- ══════════ NAV ══════════ -->\n  <nav id=\"nd-nav\" style=\"position:fixed;top:0;left:0;right:0;z-index:100;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,52px);transition:background .35s ease,box-shadow .35s ease;\">\n    <a href=\"#hero\" style=\"display:flex;align-items:center;gap:11px;text-decoration:none;color:#241F19;\">\n      <svg width=\"30\" height=\"30\" viewBox=\"0 0 36 36\" fill=\"none\">\n        <path d=\"M18 2.5L5 7.4v9.8c0 7.1 5.4 13.5 13 15.3 7.6-1.8 13-8.2 13-15.3V7.4L18 2.5z\" fill=\"var(--accent,#C25A35)\"><\u002Fpath>\n        <path d=\"M18 25.5s-6.6-4.9-6.6-9C11.4 14.2 12.8 12.8 14.7 12.8c1.1 0 2.1.5 2.8 1.3.7-.8 1.7-1.3 2.8-1.3 1.9 0 3.3 1.4 3.3 3.7 0 4.1-5.6 9-5.6 9z\" fill=\"#FBF2E2\"><\u002Fpath>\n      <\u002Fsvg>\n      <span style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:18px;letter-spacing:.5px;\">暖盾<\u002Fspan>\n      <span style=\"font-size:12px;color:#8C8071;letter-spacing:2px;font-weight:500;padding-left:2px;\">银龄守护<\u002Fspan>\n    <\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:clamp(18px,2.6vw,34px);\">\n      <a href=\"#pain\" style=\"font-size:13.5px;color:#6E6356;text-decoration:none;font-weight:500;\" class=\"nd-navlink\">痛点<\u002Fa>\n      <a href=\"#position\" style=\"font-size: =\"none\" stroke=\"var(--accent,#C25A35)\" stroke-width=\"1\">\n        <path d=\"M300 70L120 138v150c0 108 78 198 180 226 102-28 180-118 180-226V138L300 70z\" opacity=\".16\"><\u002Fpath>\n        <path d=\"M300 118L162 170v118c0 84 60 154 138 176 78-22 138-92 138-176V170L300 118z\" opacity=\".22\"><\u002Fpath>\n        <path d=\"M300 166L204 202v90c0 60 42 108 96 124 54-16 96-64 96-124v-90L300 166z\" opacity=\".3\"><\u002Fpath>\n      <\u002Fg>\n      <circle cx=\"300\" cy=\"300\" r=\"6\" fill=\"var(--accent,#C25A35)\" opacity=\".5\"><\u002Fcircle>\n    <\u002Fsvg>\n\n    <div style=\"position:relative;z-index:2;max-width:860px;\">\n      <div style=\"display:inline-flex;align-items:center;gap:9px;padding:8px 18px;border-radius:40px;background:rgba(251,242,226,.7);border:1px solid var(--accent-line,rgba(194,90,53,.28));backdrop-filter:blur(6px);font-size:12.5px;font-weight:600;color:#7A5340;letter-spacing:.5px;margin-bottom:34px;opacity:0;animation:nd-fadeup .8s .1s ease both;\">\n        <span style=\"width:6px;height:6px;border-radius:50%;background:var(--accent,#C25A35);animation:nd-dot 2s ease-in-out infinite;\"><\u002Fspan>\n        TRAE AI 创造力大赛 · 团队「一见如梦」\n      <\u002Fdiv>\n      <h1 style=\"font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(40px,7.4vw,86px);line-height:1.12;letter-spacing:-1.5px;margin-bottom:28px;opacity:0;animation:nd-fadeup .9s .22s ease both;\">\n        把骗局挡在门外<br>\n        把<span style=\"color:var(--accent,#C25A35);position:relative;\">安心\n          <svg viewBox=\"0 0 200 14\" preserveAspectRatio=\"none\" style=\"position:absolute;left:-4%;bottom:-10px;width:108%;height:13px;\"><path d=\"M2 9C45 3 120 2 198 7\" fill=\"none\" stroke=\"var(--accent,#C25A35)\" stroke-width=\"3.5\" stroke-linecap=\"round\" opacity=\".4\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>带回家中\n      <\u002Fh1>\n      <p style=\"font-size:clamp(15px,1.8vw,18px);color:#6B6052;max-width:540px;margin:0 auto 48px;line-height:1.85;opacity:0;animation:nd-fadeup .9s .34s ease both;\">\n        暖盾以「AI 反诈 + 双端守护」为核心，为银龄父母与异地子女<br style=\"display:none;\">搭起一张随时在线、彼此知情的家庭安全网。\n      <\u002Fp>\n\n      <div style=\"display:flex;justify-content:center;align-items:stretch;gap:clamp(20px,5vw,56px);flex-wrap:wrap;margin-bottom:48px;opacity:0;animation:nd-fadeup .9s .46s ease both;\">\n        <div style=\"text-align:center;\">\n          <div data-count=\"46\" data-suffix=\"%\" style=\"font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(38px,5.6vw,58px);line-height:1;color:#241F19;\">0%<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8C8071;margin-top:8px;font-weight:500;\">老人占电信诈骗受害者<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:1px;background:#D8CCB8;align-self:stretch;\"><\u002Fdiv>\n        <div style=\"text-align:center;\">\n          <div style=\"font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(38px,5.6vw,58px);line-height:1;color:#241F19;\"><span style=\"font-size:.6em;font-weight:700;\">¥<\u002Fspan><span data-count=\"353\" data-suffix=\"亿\">0亿<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8C8071;margin-top:8px;font-weight:500;\">年度电信诈骗损失<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:1px;background:#D8CCB8;align-self:stretch;\"><\u002Fdiv>\n        <div style=\"text-align:center;\">\n          <div style=\"font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(38px,5.6vw,58px);line-height:1;color:#241F19;\"><span data-count=\"2.6\" data-suffix=\"亿\" data-dec=\"1\">0亿<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8C8071;margin-top:8px;font-weight:500;\">全国独居老人规模<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:13px;justify-content:center;flex-wrap:wrap;opacity:0;animation:nd-fadeup .9s .58s ease both;\">\n        <a href=\"#pain\" style=\"display:inline-flex;align-items:center;gap:9px;padding:15px 32px;border-radius:48px;background:var(--accent,#C25A35);color:#FBF2E2;font-size:15px;font-weight:600;text-decoration:none;box-shadow:0 10px 30px var(--accent-soft,rgba(194,90,53,.12));transition:transform .25s,box-shadow .25s;\" style-hover=\"transform:translateY(-3px);box-shadow:0 16px 38px rgba(194,90,53,.34);\">\n          看看父母正面对什么<i class=\"ph ph-arrow-right\" style=\"font-size:15px;\"><\u002Fi>\n        <\u002Fa>\n        <a href=\"#features\" style=\"display:inline-flex;align-items:center;gap:8px;padding:15px 30px;border-radius:48px;background:transparent;border:1px solid #CDBFA8;color:#5C5347;font-size:15px;font-weight:600;text-decoration:none;transition:all .25s;\" style-hover=\"border-color:var(--accent,#C25A35);color:var(--accent,#C25A35);\">核心功能<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;\">\n      <span style=\"font-size:11px;color:#9E9384;letter-spacing:2px;\">向下滚动<\u002Fspan>\n      <i class=\"ph ph-caret-down\" style=\"color:var(--accent,#C25A35);font-size:18px;animation:nd-hint 1.8s ease-in-out infinite;\"><\u002Fi>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ PAIN ══════════ -->\n  <section id=\"pain\" style=\"padding:clamp(80px,11vw,128px) clamp(18px,5vw,52px);background:#EFE6D8;border-top:1px solid #E3D8C6;\">\n    <div style=\"max-width:1140px;margin:0 auto;\">\n      <div data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;margin-bottom:56px;max-width:720px;\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px;\">\n          <span style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:15px;color:var(--accent,#C25A35);\">01<\u002Fspan>\n          <span style=\"width:30px;height:1.5px;background:var(--accent,#C25A35);\"><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:3px;color:#8C8071;\">市场痛点<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(28px,4.6vw,50px);line-height:1.22;letter-spacing:-.8px;\">父母面对的风险，<br>子女<span style=\"color:var(--accent,#C25A35);\">看不见、来不及<\u002Fspan><\u002Fh2>\n        <p style=\"font-size:16px;color:#6B6052;margin-top:18px;line-height:1.7;\">每一天，这三个场景都在无数中国家庭里真实上演。<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;\">\n        <div data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;background:#FBF6EC;border:1px solid #E7DCC9;border-radius:20px;padding:34px 32px;transition:transform .35s,box-shadow .35s,border-color .35s,opacity .8s;\" style-hover=\"transform:translateY(-6px);box-shadow:0 22px 50px rgba(58,46,30,.1);border-color:var(--accent-line,rgba(194,90,53,.28));\">\n          <div style=\"width:52px;height:52px;border-radius:15px;background:var(--accent-soft,rgba(194,90,53,.12));display:flex;align-items:center;justify-content:center;color:var(--accent,#C25A35);font-size:24px;margin-bottom:22px;\"><i class=\"ph ph-phone-call\"><\u002Fi><\u002Fdiv>\n          <h3 style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:20px;margin-bottom:12px;\">新型话术，无从识别<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.85;color:#6B6052;\">一通\"公安局\"来电、一句\"账户冻结\"，父母就被一步步引导转走数十万。黑名单只能拦旧骗局，AI 换词后形同虚设。<\u002Fp>\n        <\u002Fdiv>\n        <div data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;background:#FBF6EC;border:1px solid #E7DCC9;border-radius:20px;padding:34px 32px;\" style-hover=\"transform:translateY(-6px);box-shadow:0 22px 50px rgba(58,46,30,.1);border-color:var(--accent-line,rgba(194,90,53,.28));\">\n          <div style=\"width:52px;height:52px;border-radius:15px;background:var(--accent-soft,rgba(194,90,53,.12));display:flex;align-items:center;justify-content:center;color:var(--accent,#C25A35);font-size:24px;margin-bottom:22px;\"><i class=\"ph ph-house-line\"><\u002Fi><\u002Fdiv>\n          <h3 style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:20px;margin-bottom:12px;\">独居意外，发现太迟<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.85;color:#6B6052;\">老人在家跌倒、突发不适，手机却在另一个房间。子女远在异地，等发现已过数小时，黄金救援时间悄然流逝。<\u002Fp>\n        <\u002Fdiv>\n        <div data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;background:#FBF6EC;border:1px solid #E7DCC9;border-radius:20px;padding:34px 32px;\" style-hover=\"transform:translateY(-6px);box-shadow:0 22px 50px rgba(58,46,30,.1);border-color:var(--accent-line,rgba(194,90,53,.28));\">\n          <div style=\"width:52px;height:52px;border-radius:15px;background:var(--accent-soft,rgba(194,90,53,.12));display:flex;align-items:center;justify-content:center;color:var(--accent,#C25A35);font-size:24px;margin-bottom:22px;\"><i class=\"ph ph-plugs\"><\u002Fi><\u002Fdiv>\n          <h3 style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:20px;margin-bottom:12px;\">联系断线，毫无预警<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.85;color:#6B6052;\">手机没电静默，子女无从得知。市面工具各管一段——反诈靠号码库、守护只做定位，功能分散、互不打通。<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;margin-top:24px;background:#241F19;border-radius:20px;padding:30px 34px;display:flex;gap:20px;align-items:flex-start;\">\n        <i class=\"ph ph-warning-diamond\" style=\"color:#E7B14C;font-size:26px;flex-shrink:0;margin-top:2px;\"><\u002Fi>\n        <p style=\"font-size:15px;color:#D9CEBD;line-height:1.85;\">根本问题：市场缺少一个<strong style=\"color:#E7B14C;\">父母愿意用、子女放心装<\u002Fstrong>的统一守护平台。反诈工具不做守护，守护工具不做健康——关键时刻，依然来不及响应。<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ POSITION ══════════ -->\n  <section id=\"position\" style=\"padding:clamp(80px,11vw,128px) clamp(18px,5vw,52px);background:#F3ECE0;\">\n    <div style=\"max-width:1140px;margin:0 auto;display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(40px,6vw,80px);align-items:center;\" id=\"nd-posgrid\">\n      <div data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px;\">\n          <span style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:15px;color:var(--accent,#C25A35);\">02<\u002Fspan>\n          <span style=\"width:30px;height:1.5px;background:var(--accent,#C25A35);\"><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:3px;color:#8C8071;\">产品定位<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(30px,4.6vw,52px);line-height:1.18;letter-spacing:-.8px;margin-bottom:22px;\">父母<span style=\"color:var(--accent,#C25A35);\">愿意用<\u002Fspan><br>子女<span style=\"color:var(--accent,#C25A35);\">放心装<\u002Fspan><\u002Fh2>\n        <p style=\"font-size:15.5px;color:#6B6052;line-height:1.85;margin-bottom:30px;\">「父母 — AI — 子女」三方安全网。老人端在知情授权下集成 AI 反诈、安全守护与健康管理；儿女端汇总状态、接收预警、远程协助。<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:13px;\">\n          <div style=\"display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border-radius:15px;background:#FBF6EC;border:1px solid #E7DCC9;transition:border-color .3s;\" style-hover=\"border-color:var(--accent-line,rgba(194,90,53,.28));\">\n            <div style=\"width:42px;height:42px;border-radius:12px;flex-shrink:0;background:var(--accent-soft,rgba(194,90,53,.12));display:flex;align-items:center;justify-content:center;color:var(--accent,#C25A35);font-size:19px;\"><i class=\"ph ph-eye\"><\u002Fi><\u002Fdiv>\n            <div><h4 style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;margin-bottom:5px;\">透明守护，而非暗中监控<\u002Fh4><p style=\"font-size:13px;color:#857A6B;line-height:1.7;\">父母知情 → 单独授权 → 状态透明、随时可关。合规底线即产品前提。<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border-radius:15px;background:#FBF6EC;border:1px solid #E7DCC9;transition:border-color .3s;\" style-hover=\"border-color:var(--accent-line,rgba(194,90,53,.28));\">\n            <div style=\"width:42px;height:42px;border-radius:12px;flex-shrink:0;background:var(--accent-soft,rgba(194,90,53,.12));display:flex;align-items:center;justify-content:center;color:var(--accent,#C25A35);font-size:19px;\"><i class=\"ph ph-brain\"><\u002Fi><\u002Fdiv>\n            <div><h4 style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;margin-bottom:5px;\">AI 理解语义，不靠黑名单<\u002Fh4><p style=\"font-size:13px;color:#857A6B;line-height:1.7;\">大模型识别全新话术、读懂上下文，永远领先于诈骗迭代。<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border-radius:15px;background:#FBF6EC;border:1px solid #E7DCC9;transition:border-color .3s;\" style-hover=\"border-color:var(--accent-line,rgba(194,90,53,.28));\">\n            <div style=\"width:42px;height:42px;border-radius:12px;flex-shrink:0;background:rgba(46,93,75,.12);display:flex;align-items:center;justify-content:center;color:#2E5D4B;font-size:19px;\"><i class=\"ph ph-users-three\"><\u002Fi><\u002Fdiv>\n            <div><h4 style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;margin-bottom:5px;\">双端闭环，风险分级接力<\u002Fh4><p style=\"font-size:13px;color:#857A6B;line-height:1.7;\">低风险提示老人，高风险同步子女、一键介入，形成完整家庭响应链。<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- PHONES -->\n      <div data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;display:flex;justify-content:center;align-items:flex-end;gap:18px;\">\n #E7DCC9;\">\n          <div style=\"width:38px;height:38px;border-radius:11px;background:rgba(46,93,75,.12);display:flex;align-items:center;justify-content:center;color:#2E5D4B;font-size:18px;flex-shrink:0;\"><i class=\"ph ph-package\"><\u002Fi><\u002Fdiv>\n          <div><h5 style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:14px;margin-bottom:5px;\">数据最小化<\u002Fh5><p style=\"font-size:12.5px;color:#857A6B;line-height:1.7;\">上报子女的仅是风险结论，不传输完整聊天记录。<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;display:flex;gap:14px;align-items:flex-start;padding:22px;border-radius:16px;background:#FBF6EC;border:1px solid #E7DCC9;\">\n          <div style=\"width:38px;height:38px;border-radius:11px;background:rgba(46,93,75,.12);display:flex;align-items:center;justify-content:center;color:#2E5D4B;font-size:18px;flex-shrink:0;\"><i class=\"ph ph-cpu\"><\u002Fi><\u002Fdiv>\n          <div><h5 style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:14px;margin-bottom:5px;\">本地优先<\u002Fh5><p style=\"font-size:12.5px;color:#857A6B;line-height:1.7;\">敏感识别尽量在设备本地完成，减少上云。<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ FOOTER ══════════ -->\n  <section id=\"footer\" style=\"padding:clamp(80px,10vw,116px) clamp(18px,5vw,52px) 56px;background:#211C16;color:#F3ECE0;text-align:center;position:relative;overflow:hidden;\">\n    <div style=\"position:absolute;bottom:-200px;left:50%;transform:translateX(-50%);width:760px;height:480px;background:radial-gradient(ellipse,var(--accent-soft,rgba(194,90,53,.12)),transparent 70%);pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:760px;margin:0 auto;\">\n      <div data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;display:inline-flex;align-items:center;gap:11px;margin-bottom:26px;\">\n        <svg width=\"36\" height=\"36\" viewBox=\"0 0 36 36\" fill=\"none\">\n          <path d=\"M18 2.5L5 7.4v9.8c0 7.1 5.4 13.5 13 15.3 7.6-1.8 13-8.2 13-15.3V7.4L18 2.5z\" fill=\"var(--accent,#C25A35)\"><\u002Fpath>\n          <path d=\"M18 25.5s-6.6-4.9-6.6-9C11.4 14.2 12.8 12.8 14.7 12.8c1.1 0 2.1.5 2.8 1.3.7-.8 1.7-1.3 2.8-1.3 1.9 0 3.3 1.4 3.3 3.7 0 4.1-5.6 9-5.6 9z\" fill=\"#FBF2E2\"><\u002Fpath>\n        <\u002Fsvg>\n        <span style=\"font-family:'Noto Serif SC',serif;font-weight:700;font-size:20px;\">暖盾 · 银龄守护<\u002Fspan>\n      <\u002Fdiv>\n      <h2 data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(26px,4.5vw,46px);line-height:1.3;letter-spacing:-.5px;margin-bottom:16px;\">科技可以有<span style=\"color:#E7B14C;\">温度<\u002Fspan><br>守护可以不<span style=\"color:#E7B14C;\">缺席<\u002Fspan><\u002Fh2>\n      <p data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;font-size:16px;color:#B5AB9A;margin-bottom:40px;\">让每一位父母被看见，让每一个子女放心。<\u002Fp>\n      <div data-rev=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:44px;\">\n        <span style=\"font-size:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#C9BEAD;padding:8px 17px;border-radius:24px;display:inline-flex;align-items:center;gap:7px;\"><i class=\"ph ph-robot\" style=\"color:var(--accent,#C25A35);\"><\u002Fi>AI 反诈识别<\u002Fspan>\n        <span style=\"font-size:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#C9BEAD;padding:8px 17px;border-radius:24px;display:inline-flex;align-items:center;gap:7px;\"><i class=\"ph ph-map-pin\" style=\"color:var(--accent,#C25A35);\"><\u002Fi>双端实时守护<\u002Fspan>\n        <span style=\"font-size:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#C9BEAD;padding:8px 17px;border-radius:24px;display:inline-flex;align-items:center;gap:7px;\"><i class=\"ph ph-heartbeat\" style=\"color:var(--accent,#C25A35);\"><\u002Fi>健康全链路<\u002Fspan>\n        <span style=\"font-size:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#C9BEAD;padding:8px 17px;border-radius:24px;display:inline-flex;align-items:center;gap:7px;\"><i class=\"ph ph-seal-check\" style=\"color:var(--accent,#C25A35);\"><\u002Fi>透明合规优先<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width:56px;height:1.5px;background:linear-gradient(90deg,transparent,var(--accent,#C25A35),transparent);margin:0 auto 24px;\"><\u002Fdiv>\n      <div style=\"font-size:14px;color:#B5AB9A;\">参赛团队：<strong style=\"color:#F3ECE0;\">一见如梦<\u002Fstrong><\u002Fdiv>\n      <div style=\"font-size:12px;color:#6E6457;margin-top:8px;\">暖盾 · 银龄守护 &nbsp;|&nbsp; TRAE AI 创造力大赛 &nbsp;|&nbsp; v1.0<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;terracotta&quot;,&quot;options&quot;:[&quot;terracotta&quot;,&quot;bronze&quot;,&quot;pine&quot;],&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const themes = {\n      terracotta: { a: '#C25A35', s: 'rgba(194,90,53,.12)', l: 'rgba(194,90,53,.32)' },\n      bronze:     { a: '#A9803A', s: 'rgba(169,128,58,.14)', l: 'rgba(169,128,58,.34)' },\n      pine:       { a: '#2E5D4B', s: 'rgba(46,93,75,.13)',  l: 'rgba(46,93,75,.34)' },\n    };\n    const t = themes[this.props.accent] || themes.terracotta;\n    return { accent: t.a, accentSoft: t.s, accentLine: t.l };\n  }\n\n  componentDidMount() {\n    const root = document.getElementById('nd-root');\n    if (!root) return;\n\n    // responsive: stack two-column grids on narrow screens\n    const applyResp = () => {\n      const narrow = window.innerWidth < 880;\n      ['nd-posgrid', 'nd-bizgrid'].forEach(id => {\n        const el = document.getElementById(id);\n        if (el) el.style.gridTemplateColumns = narrow ? '1fr' : (id === 'nd-posgrid' ? '1.05fr .95fr' : '1fr 1fr');\n      });\n      const fg = document.getElementById('nd-featgrid');\n      if (fg) fg.style.gridTemplateColumns = window.innerWidth < 620 ? '1fr' : (window.innerWidth < 960 ? 'repeat(2,1fr)' : 'repeat(3,1fr)');\n      const fa = document.getElementById('nd-featA');\n      if (fa) fa.style.gridColumn = window.innerWidth < 620 ? 'span 1' : 'span 2';\n    };\n    applyResp();\n    this._resize = applyResp;\n    window.addEventListener('resize', applyResp, { passive: true });\n\n    // scroll reveal\n    const io = new IntersectionObserver((es) => {\n      es.forEach(e => {\n        if (e.isIntersecting) {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n          io.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.12 });\n    root.querySelectorAll('[data-rev]').forEach(el => io.observe(el));\n\n    // counters\n    const co = new IntersectionObserver((es) => {\n      es.forEach(e => {\n        if (e.isIntersecting) { this.runCount(e.target); co.unobserve(e.target); }\n      });\n    }, { threshold: 0.6 });\n    root.querySelectorAll('[data-count]').forEach(el => co.observe(el));\n\n    // nav background on scroll\n    this._scroll = () => {\n      const n = document.getElementById('nd-nav');\n      if (!n) return;\n      const on = window.scrollY > 40;\n      n.style.background = on ? 'rgba(243,236,224,.9)' : 'rgba(243,236,224,0)';\n      n.style.boxShadow = on ? '0 1px 0 rgba(36,31,25,.07)' : 'none';\n      n.style.backdropFilter = on ? 'blur(14px)' : 'none';\n    };\n    this._scroll();\n    window.addEventListener('scroll', this._scroll, { passive: true });\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._scroll);\n    window.removeEventListener('resize', this._resize);\n  }\n\n  runCount(el) {\n    const target = parseFloat(el.dataset.count);\n    const suf = el.dataset.suffix || '';\n    const dec = parseInt(el.dataset.dec || '0');\n    const dur = 1600, t0 = performance.now();\n    const tick = (now) => {\n      const p = Math.min((now - t0) / dur, 1);\n      const e = 1 - Math.pow(1 - p, 3);\n      const v = target * e;\n      el.textContent = (dec ? v.toFixed(dec) : Math.floor(v)) + suf;\n      if (p < 1) requestAnimationFrame(tick);\n      else el.textContent = (dec ? target.toFixed(dec) : target) + suf;\n    };\n    requestAnimationFrame(tick);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
