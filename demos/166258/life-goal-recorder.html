<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生目标记录器 · Life Goal Recorder</title>
<style>
/* ============== 基础重置 ============== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', system-ui, -apple-system, sans-serif;
  color: #e6ecf5;
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
  background: #0b1020;
  overflow-x: hidden;
}
body {
  background:
    radial-gradient(1200px 800px at 10% -10%, rgba(59,130,246,0.18), transparent 60%),
    radial-gradient(900px 700px at 110% 10%, rgba(139,92,246,0.16), transparent 60%),
    radial-gradient(900px 600px at 50% 110%, rgba(16,185,129,0.12), transparent 60%),
    linear-gradient(180deg, #0a0f1c 0%, #0b1224 100%);
  background-attachment: fixed;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

/* ============== 装饰性背景元素 ============== */
.bg-decor {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-decor .blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  animation: float 18s ease-in-out infinite;
}
.bg-decor .blob.b1 { width: 420px; height: 420px; background: #3b82f6; top: -120px; left: -120px; }
.bg-decor .blob.b2 { width: 360px; height: 360px; background: #8b5cf6; bottom: -100px; right: -100px; animation-delay: -6s; }
.bg-decor .blob.b3 { width: 300px; height: 300px; background: #10b981; top: 40%; left: 60%; opacity: 0.3; animation-delay: -12s; }
@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(40px, -30px) scale(1.05); }
  66% { transform: translate(-30px, 40px) scale(0.95); }
}

/* ============== 容器 ============== */
.container {
  position: relative;
  z-index: 1;
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 22px 20px;
}

/* ============== 顶部标题区 ============== */
.header {
  text-align: center;
  padding: 30px 16px 28px;
  position: relative;
}
.header .badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: rgba(59, 130, 246, 0.12);
  border: 1px solid rgba(59, 130, 246, 0.3);
  border-radius: 100px;
  font-size: 0.78rem;
  color: #93c5fd;
  margin-bottom: 18px;
  letter-spacing: 1.5px;
  font-weight: 500;
  backdrop-filter: blur(8px);
}
.header .badge .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #3b82f6;
  box-shadow: 0 0 8px #3b82f6;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.3); }
}
.header h1 {
  font-size: 2.8rem;
  font-weight: 800;
  margin-bottom: 12px;
  letter-spacing: 4px;
  background: linear-gradient(135deg, #ffffff 0%, #93c5fd 50%, #c4b5fd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 40px rgba(59, 130, 246, 0.2);
  animation: titleGlow 3s ease-in-out infinite;
}
@keyframes titleGlow {
  0%, 100% { filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.3)); }
  50% { filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.4)); }
}
.header .subtitle {
  color: #94a3b8;
  font-size: 1rem;
  letter-spacing: 4px;
  font-weight: 300;
  margin-bottom: 6px;
}
.header .date-info {
  display: inline-block;
  margin-top: 14px;
  padding: 8px 18px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 100px;
  font-size: 0.82rem;
  color: #cbd5e1;
  backdrop-filter: blur(8px);
}
.header .date-info span { color: #60a5fa; font-weight: 600; }

/* ============== 通用玻璃卡片 ============== */
.glass {
  background: linear-gradient(135deg, rgba(30, 38, 51, 0.7) 0%, rgba(20, 26, 40, 0.7) 100%);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 20px;
  backdrop-filter: blur(20px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

/* ============== 统计面板 ============== */
.stats-section {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 18px;
  margin-bottom: 30px;
}
.stat-card {
  position: relative;
  padding: 24px 20px;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.stat-card:hover {
  transform: translateY(-4px);
  border-color: rgba(59, 130, 246, 0.3);
  box-shadow: 0 12px 40px rgba(59, 130, 246, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #3b82f6, transparent);
  opacity: 0;
  transition: opacity 0.3s;
}
.stat-card:hover::before { opacity: 1; }
.stat-card .stat-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  margin-bottom: 14px;
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
  color: #93c5fd;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.stat-card .stat-icon.green {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(52, 211, 153, 0.2));
  color: #6ee7b7;
}
.stat-card .stat-icon.orange {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(251, 191, 36, 0.2));
  color: #fcd34d;
}
.stat-card .stat-icon.red {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(248, 113, 113, 0.2));
  color: #fca5a5;
}
.stat-card .stat-icon.blue {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(96, 165, 250, 0.2));
  color: #93c5fd;
}
.stat-card .stat-value {
  font-size: 2.2rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 4px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.stat-card .stat-label {
  font-size: 0.8rem;
  color: #94a3b8;
  letter-spacing: 2px;
  font-weight: 500;
}
/* 进度环卡片 */
.stat-card.rate-card { padding: 22px 20px; }
.rate-card .rate-content {
  display: flex;
  align-items: center;
  gap: 18px;
}
.ring-wrapper {
  position: relative;
  width: 90px;
  height: 90px;
  flex-shrink: 0;
}
.ring-wrapper svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.ring-bg { stroke: rgba(255, 255, 255, 0.08); }
.ring-progress {
  stroke-linecap: round;
  transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.5s ease;
}
.ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #ffffff;
}
.ring-text .num { font-size: 1.35rem; line-height: 1; }
.ring-text .sym { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
.rate-card .rate-info .stat-label { margin-top: 8px; }
.rate-card .rate-info .rate-tag {
  display: inline-block;
  margin-top: 8px;
  padding: 3px 10px;
  font-size: 0.72rem;
  border-radius: 100px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.rate-tag.green { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
.rate-tag.orange { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
.rate-tag.red { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
.rate-tag.empty { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

/* ============== 分类Tab ============== */
.section-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  color: #e2e8f0;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 1px;
}
.section-title::before {
  content: '';
  width: 4px;
  height: 18px;
  background: linear-gradient(180deg, #3b82f6, #8b5cf6);
  border-radius: 2px;
}
.section-title .count {
  margin-left: auto;
  font-size: 0.8rem;
  color: #94a3b8;
  font-weight: 500;
  padding: 4px 10px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 100px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 26px;
}
.tab {
  position: relative;
  padding: 14px 16px;
  text-align: center;
  background: rgba(30, 38, 51, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 14px;
  cursor: pointer;
  color: #94a3b8;
  font-size: 0.9rem;
  font-weight: 500;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  user-select: none;
  letter-spacing: 1px;
  overflow: hidden;
  backdrop-filter: blur(12px);
}
.tab::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
  opacity: 0;
  transition: opacity 0.35s;
  z-index: 0;
}
.tab > * { position: relative; z-index: 1; }
.tab .tab-icon { font-size: 1.1rem; margin-right: 6px; }
.tab .tab-text { vertical-align: middle; }
.tab .tab-count {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 8px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 100px;
  font-size: 0.72rem;
  font-weight: 600;
}
.tab:hover {
  color: #e2e8f0;
  transform: translateY(-1px);
  border-color: rgba(59, 130, 246, 0.2);
}
.tab.active {
  color: #ffffff;
  font-weight: 600;
  border-color: rgba(59, 130, 246, 0.5);
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(139, 92, 246, 0.2));
  box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.tab.active::before { opacity: 1; }
.tab.active .tab-count { background: rgba(255, 255, 255, 0.18); }

/* ============== 工具栏 ============== */
.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 22px;
  flex-wrap: wrap;
  align-items: center;
}
.toolbar .spacer { flex: 1; }

/* ============== 按钮 ============== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 22px;
  border: 1px solid transparent;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 500;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  letter-spacing: 0.5px;
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s;
}
.btn:hover::after { transform: translateX(100%); }
.btn-primary {
  background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
  color: white;
  border-color: rgba(255, 255, 255, 0.1);
  box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(59, 130, 246, 0.5);
}
.btn-primary:active { transform: translateY(0) scale(0.97); }
.btn-secondary {
  background: rgba(30, 38, 51, 0.6);
  color: #cbd5e1;
  border-color: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
}
.btn-secondary:hover {
  color: #ffffff;
  background: rgba(59, 130, 246, 0.12);
  border-color: rgba(59, 130, 246, 0.3);
  transform: translateY(-1px);
}
.btn-secondary:active { transform: scale(0.97); }
.btn-danger {
  background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
  color: white;
  box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
}
.btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(239, 68, 68, 0.5); }
.btn-danger:active { transform: scale(0.97); }
.btn-ghost {
  background: transparent;
  color: #94a3b8;
  border-color: rgba(255, 255, 255, 0.08);
}
.btn-ghost:hover { color: #ffffff; border-color: rgba(255, 255, 255, 0.2); }

/* ============== 表单 ============== */
.form-section {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  margin-bottom: 0;
  transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, margin-bottom 0.4s ease;
}
.form-section.show {
  max-height: 1000px;
  opacity: 1;
  margin-bottom: 26px;
}
.form-section .glass { padding: 28px; }
.form-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.form-header h3 {
  font-size: 1.05rem;
  color: #ffffff;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 1px;
}
.form-header h3::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #3b82f6;
  box-shadow: 0 0 8px #3b82f6;
}
.form-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 20px;
}
.form-group { margin-bottom: 0; }
.form-group.full { grid-column: 1 / -1; }
.form-group label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
  color: #cbd5e1;
  margin-bottom: 8px;
  font-weight: 500;
  letter-spacing: 0.5px;
}
.form-group label .required { color: #f87171; font-size: 0.9rem; }
.form-group label .hint { color: #64748b; font-weight: 400; font-size: 0.75rem; }
.form-group input[type="text"],
.form-group input[type="date"],
.form-group textarea {
  width: 100%;
  padding: 12px 16px;
  background: rgba(15, 22, 38, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  color: #e6ecf5;
  font-size: 0.92rem;
  transition: all 0.3s ease;
  outline: none;
  backdrop-filter: blur(8px);
}
.form-group input[type="text"]:focus,
.form-group input[type="date"]:focus,
.form-group textarea:focus {
  border-color: rgba(59, 130, 246, 0.5);
  background: rgba(15, 22, 38, 0.8);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}
.form-group input::placeholder,
.form-group textarea::placeholder { color: #64748b; }
.form-group textarea {
  resize: vertical;
  min-height: 90px;
  line-height: 1.6;
  font-family: inherit;
}
.form-group input[type="date"] { color-scheme: dark; }

/* 优先级选项 */
.priority-group {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.priority-option {
  position: relative;
  text-align: center;
  padding: 12px 8px;
  background: rgba(15, 22, 38, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.88rem;
  color: #94a3b8;
  transition: all 0.25s ease;
  user-select: none;
  font-weight: 500;
  overflow: hidden;
}
.priority-option .pdot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
  background: currentColor;
  box-shadow: 0 0 6px currentColor;
}
.priority-option:hover { transform: translateY(-1px); border-color: rgba(255, 255, 255, 0.15); }
.priority-option.high { color: #fca5a5; }
.priority-option.medium { color: #fcd34d; }
.priority-option.low { color: #6ee7b7; }
.priority-option.active {
  font-weight: 600;
  background: rgba(15, 22, 38, 0.8);
}
.priority-option.active.high { background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.15)); border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 16px rgba(239, 68, 68, 0.2); }
.priority-option.active.medium { background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.15)); border-color: rgba(245, 158, 11, 0.5); box-shadow: 0 0 16px rgba(245, 158, 11, 0.2); }
.priority-option.active.low { background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.15)); border-color: rgba(16, 185, 129, 0.5); box-shadow: 0 0 16px rgba(16, 185, 129, 0.2); }

.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}
.form-actions .btn { flex: 1; min-width: 120px; }

/* ============== 目标列表 ============== */
.goal-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  margin-bottom: 32px;
}
.goal-card {
  position: relative;
  background: linear-gradient(135deg, rgba(30, 38, 51, 0.7) 0%, rgba(20, 26, 40, 0.6) 100%);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 20px 22px;
  backdrop-filter: blur(20px);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  animation: cardIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}
.goal-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--accent, #3b82f6);
  transition: width 0.3s;
}
.goal-card:hover {
  transform: translateY(-3px);
  border-color: rgba(255, 255, 255, 0.12);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
}
.goal-card:hover::before { width: 5px; }
.goal-card.removing {
  animation: cardOut 0.4s ease forwards;
}
.goal-card.finished { opacity: 0.65; }
.goal-card.finished::before { background: #475569; }
.goal-card.finished .goal-title {
  text-decoration: line-through;
  text-decoration-color: rgba(255, 255, 255, 0.4);
  text-decoration-thickness: 2px;
  color: #94a3b8;
}
.goal-card.expired::before { background: #64748b; }
.goal-card.expired { opacity: 0.78; }

.goal-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.goal-priority {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 100px;
  font-size: 0.72rem;
  font-weight: 600;
  white-space: nowrap;
  letter-spacing: 0.5px;
}
.goal-priority::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 6px currentColor;
}
.goal-priority.high { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.25); }
.goal-priority.medium { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.25); }
.goal-priority.low { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.25); }
.goal-priority.expired { background: rgba(100, 116, 139, 0.2); color: #cbd5e1; border: 1px solid rgba(100, 116, 139, 0.35); }
.goal-priority.finished { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.35); }

.goal-title {
  flex: 1;
  font-size: 1.1rem;
  font-weight: 600;
  color: #f1f5f9;
  min-width: 0;
  word-break: break-word;
  line-height: 1.4;
}
.goal-desc {
  color: #cbd5e1;
  font-size: 0.9rem;
  margin-bottom: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
  padding-left: 14px;
  border-left: 2px solid rgba(59, 130, 246, 0.3);
}
.goal-desc.empty { color: #64748b; font-style: italic; padding-left: 14px; border-left: 2px dashed rgba(100, 116, 139, 0.3); }

<body>

<!-- ============ 打印 / 导出图片 舞台容器(隐藏在屏幕外) ============ -->
<div class="print-stage" id="printStage"></div>

<script>
/* ===================================================
   人生目标记录器 · Life Goal Recorder
   代码分层:
     1) 数据处理层  - 加载/保存/生成ID
     2) 业务逻辑层  - 增/删/改/排序/过期判定
     3) 统计函数层  - 计算完成率与颜色
     4) 渲染层      - 统计面板/目标列表
     5) 弹窗层      - 编辑/确认/提示
     6) 事件处理层  - 交互/导出/Tab
   =================================================== */

/* ============ 全局状态 ============ */
const STORAGE_KEY = 'life_goal_recorder_data_v2';  // localStorage 键名
const TYPE_NAME = {
  longYear: '一生长远目标',
  year: '本年度目标',
  month: '本月目标',
  daily: '日常小目标'
};
let goals = [];                  // 全部目标数据
let currentType = 'longYear';    // 当前选中的分类
let currentLevel = 'medium';     // 新增表单当前选中的优先级
let editLevel = 'medium';        // 编辑弹窗当前选中的优先级
let prevStats = { total: 0, finished: 0, pending: 0, rate: 0 }; // 上一次统计值,用于数字动画

/* ============ 1) 数据处理函数 ============ */

// 从 localStorage 加载数据(兼容 v1)
function loadData() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // 兼容旧版本
      const old = localStorage.getItem('life_goal_recorder_data_v1');
      if (old) {
        localStorage.setItem(STORAGE_KEY, old);
        raw = old;
      }
    }
    const parsed = raw ? JSON.parse(raw) : [];
    goals = Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.error('读取本地数据失败', e);
    goals = [];
  }
}

// 保存数据到 localStorage
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
  } catch (e) {
    showToast('数据保存失败: ' + e.message);
  }
}

// 生成唯一 ID
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ============ 2) 业务逻辑函数 ============ */

// 添加目标
function addGoal(title, desc, deadline, level) {
  const goal = {
    id: genId(),
    type: currentType,
    title: title.trim(),
    desc: desc.trim(),
    deadline: deadline,
    level: level,
    finish: false,
    createdAt: Date.now()
  };
  goals.push(goal);
  saveData();
  render();
}

// 删除目标
function deleteGoal(id) {
  const card = document.querySelector('[data-id="' + id + '"]');
  if (card) {
    card.classList.add('removing');
    setTimeout(() => {
      goals = goals.filter(g => g.id !== id);
      saveData();
      render();
    }, 380);
  } else {
    goals = goals.filter(g => g.id !== id);
    saveData();
    render();
  }
}

// 切换目标完成状态
function toggleFinish(id) {
  const goal = goals.find(g => g.id === id);
  if (!goal) return;
  goal.finish = !goal.finish;
  saveData();
  render();
}

// 更新目标(编辑保存)
function updateGoal(id, title, desc, deadline, level) {
  const goal = goals.find(g => g.id === id);
  if (!goal) return;
  goal.title = title.trim();
  goal.desc = desc.trim();
  goal.deadline = deadline;
  goal.level = level;
  saveData();
  render();
}

// 清空所有已完成目标
function clearFinished() {
  const before = goals.length;
  goals = goals.filter(g => !g.finish);
  saveData();
  render();
  return before - goals.length;
}

// 判断目标是否过期
function isExpired(goal) {
  if (!goal.deadline || goal.finish) return false;
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const dl = new Date(goal.deadline);
  return dl.getTime() < now.getTime();
}

// 计算距截止天数(正数=还有N天,负数=过期N天,无截止=null)
function daysToDeadline(goal) {
  if (!goal.deadline) return null;
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const dl = new Date(goal.deadline);
  dl.setHours(0, 0, 0, 0);
  return Math.round((dl - now) / 86400000);
}

// 按截止日期排序: 过期 > 即将到期 > 进行中 > 已完成
function sortByDeadline(list) {
  return [...list].sort((a, b) => {
    // 已完成置底
    if (a.finish !== b.finish) return a.finish ? 1 : -1;
    // 过期优先
    const ea = isExpired(a) ? 1 : 0;
    const eb = isExpired(b) ? 1 : 0;
    if (ea !== eb) return eb - ea;
    // 无截止日期的置后
    if (!a.deadline && !b.deadline) return 0;
    if (!a.deadline) return 1;
    if (!b.deadline) return -1;
    return new Date(a.deadline) - new Date(b.deadline);
  });
}

/* ============ 3) 统计函数 ============ */

// 计算统计数据
function calcStats() {
  const total = goals.length;
  const finished = goals.filter(g => g.finish).length;
  const pending = total - finished;
  const rate = total === 0 ? 0 : Math.round((finished / total) * 1000) / 10;
  return { total, finished, pending, rate };
}

// 根据完成率返回颜色类名
function getRateColorClass(rate, total) {
  if (total === 0) return 'empty';
  if (rate > 70) return 'green';
  if (rate >= 30) return 'orange';
  return 'red';
}

function getRateColor(rate, total) {
  const cls = getRateColorClass(rate, total);
  return { green: '#10b981', orange: '#f59e0b', red: '#ef4444', empty: '#64748b' }[cls];
}

function getRateText(rate, total) {
  const cls = getRateColorClass(rate, total);
  return { green: '表现优秀', orange: '稳步前行', red: '需要加油', empty: '尚未开始' }[cls];
}

  const stats = calcStats();
  const colorClass = getRateColorClass(stats.rate, stats.total);
  const color = getRateColor(stats.rate, stats.total);
  const circumference = 2 * Math.PI * 38; // r=38
  const offset = circumference * (1 - stats.rate / 100);

  // 判断是否变化,触发数字动画
  const changed = stats.total !== prevStats.total || stats.finished !== prevStats.finished;
  prevStats = stats;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card rate-card glass">
      <div class="rate-content">
        <div class="ring-wrapper">
          <svg viewBox="0 0 90 90">
            <circle class="ring-bg" cx="45" cy="45" r="38" fill="none" stroke-width="8"></circle>
            <circle class="ring-progress" cx="45" cy="45" r="38" fill="none" stroke-width="8"
              stroke="${color}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="ring-text">
            <div class="num">${stats.total === 0 ? '0' : stats.rate}<span style="font-size:0.85rem;color:#94a3b8">%</span></div>
            <div class="sym">完成率</div>
          </div>
        </div>
        <div class="rate-info">

        </div>
      </div>
    </div>
    <div class="stat-card glass">
      <div class="stat-icon blue">📊</div>
      <div class="stat-value ${changed ? 'num-pop' : ''}" data-val="${stats.total}">${stats.total}</div>
      <div class="stat-label">总目标数</div>
    </div>
    <div class="stat-card glass">
      <div class="stat-icon green">✅</div>
      <div class="stat-value ${changed ? 'num-pop' : ''}" data-val="${stats.finished}">${stats.finished}</div>
      <div class="stat-label">已完成目标</div>
    </div>

}

// 单条目标卡片 HTML 模板
function goalCardTemplate(g) {
  const priorityText = { high: '高优先级', medium: '中等优先级', low: '低优先级' }[g.level] || '中等优先级';
  const priorityClass = g.level || 'medium';
  const expired = isExpired(g);
  const accent = g.finish ? '#10b981' : (expired ? '#64748b' : ({ high: '#ef4444', medium: '#f59e0b', low: '#10b981' }[g.level] || '#3b82f6'));
  const deadlineText = g.deadline ? formatDate(g.deadline) : '未设置截止日期';
  const days = daysToDeadline(g);
  let deadlineExtra = '';
  if (g.finish) {
    deadlineExtra = '<span style="color:#6ee7b7">· ✓ 已完成</span>';
  } else if (expired) {
    deadlineExtra = `<span style="color:#fca5a5">· 已过期 ${Math.abs(days)} 天</span>`;
  } else if (days !== null) {
    if (days === 0) deadlineExtra = '<span style="color:#fcd34d">· ⏰ 今天到期</span>';
    else if (days <= 3) deadlineExtra = `<span style="color:#fcd34d">· 还剩 ${days} 天</span>`;
    else if (days <= 7) deadlineExtra = `<span style="color:#93c5fd">· 还剩 ${days} 天</span>`;
    else deadlineExtra = `<span style="color:#94a3b8">· 还剩 ${days} 天</span>`;
  }
  const descHtml = g.desc ? escapeHtml(g.desc) : '<em>暂无详细描述...</em>';
  const finishedTag = g.finish ? '<span class="goal-priority finished">已完成</span>' : '';
  const expiredTag = expired ? '<span class="goal-priority expired">已过期</span>' : '';

  return `
    <div class="goal-card ${g.finish ? 'finished' : ''} ${expired ? 'expired' : ''}" data-id="${g.id}" style="--accent: ${accent}">
      <div class="goal-header">
        <span class="goal-priority ${priorityClass}">${priorityText}</span>
        ${finishedTag}
        ${expiredTag}
        <div class="goal-title">${escapeHtml(g.title)}</div>
      </div>
      <div class="goal-desc ${g.desc ? '' : 'empty'}">${descHtml}</div>
      <div class="goal-meta">
        <span><span class="meta-icon">📅</span>截止: ${deadlineText} ${deadlineExtra}</span>
      </div>
      <div class="goal-actions">
        <button class="goal-btn finish" onclick="onToggleFinish('${g.id}')">${g.finish ? '↩ 撤销完成' : '✓ 标记完成'}</button>
        <button class="goal-btn edit" onclick="onEditGoal('${g.id}')">✎ 编辑</button>
        <button class="goal-btn print" onclick="onPrintGoal('${g.id}')">🖨 打印</button>
        <button class="goal-btn image" onclick="onImageGoal('${g.id}')">🖼 存图</button>
        <button class="goal-btn delete" onclick="onDeleteGoal('${g.id}')">🗑 删除</button>
      </div>
    </div>
  `;
}

// 工具: 格式化日期
function formatDate(d) {
  const date = new Date(d);
  if (isNaN(date.getTime())) return String(d);
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function pad(n) { return String(n).padStart(2, '0'); }

// 工具: HTML 转义防 XSS
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Toast 轻提示
function showToast(msg) {
  // 移除已有 toast
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity 0.3s, transform 0.3s';
    t.style.opacity = '0';
    t.style.transform = 'translate(-50%, 10px)';
    setTimeout(() => t.remove(), 300);
  }, 1800);
}

  txt += '    人生目标记录 · LIFE GOAL RECORDER\n';

  txt += `导出时间: ${new Date().toLocaleString('zh-CN')}\n`;

/* 批量导出所有目标为图片(按分类逐张生成) */
document.getElementById('exportImagesBtn').addEventListener('click', async () => {
  if (goals.length === 0) {
    showAlert('当前没有任何目标可以导出。');
    return;
  }
  const list = sortByDeadline([...goals]);
  showConfirm(
    `即将为 <strong style="color:#93c5fd">${list.length}</strong> 个目标依次生成 PNG 图片并下载。<br>请允许浏览器多次下载文件,可能需要数秒。`,
    async () => {
      showToast('🖼 开始批量生成图片...');
      const stage = document.getElementById('printStage');
      let okCount = 0;
      for (let i = 0; i < list.length; i++) {
        const g = list[i];
        stage.innerHTML = buildPrintStage(g);
        stage.classList.add('export-mode');
        // 等待渲染
        await new Promise(r => setTimeout(r, 120));
        try {
          const rect = stage.getBoundingClientRect();
          const w = Math.ceil(rect.width);
          const h = Math.ceil(rect.height);
          const canvas = await drawNodeToCanvas(stage, w, h);
          const url = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = url;
          const safeTitle = (g.title || '目标').replace(/[\\/:*?"<>|]/g, '_').slice(0, 30);
          a.download = `目标_${pad(i + 1)}_${safeTitle}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          okCount++;
          // 间隔,避免浏览器拦截多次下载
          await new Promise(r => setTimeout(r, 300));
        } catch (e) {
          console.error('生成图片失败:', e);
        }
      }
      stage.innerHTML = '';
      stage.classList.remove('export-mode');
      showToast(`✓ 批量存图完成,共 ${okCount}/${list.length} 张`);
    }
  );
});

/* ============ 7) 打印 / 导出图片 ============ */

/* 构建打印舞台(单个目标的精美打印卡片 HTML) */
function buildPrintStage(goal) {
  const priorityText = { high: '高优先级', medium: '中等优先级', low: '低优先级' }[goal.level] || '中等优先级';
  const priorityKey = goal.level || 'medium';
  const expired = isExpired(goal);
  const days = daysToDeadline(goal);
  const createdAt = goal.createdAt ? formatDate(new Date(goal.createdAt)) : '—';
  const typeName = TYPE_NAME[goal.type] || '目标';

  // 截止日描述
  let deadlineDesc = '未设置截止日期';
  if (goal.deadline) {
    deadlineDesc = formatDate(goal.deadline);
    if (goal.finish) {
      deadlineDesc += ' · 已完成';
    } else if (expired) {
      deadlineDesc += ` · 已过期 ${Math.abs(days)} 天`;
    } else if (days === 0) {
      deadlineDesc += ' · 今天到期';
    } else {
      deadlineDesc += ` · 还剩 ${days} 天`;
    }
  }

  // 状态描述
  let statusText = '进行中';
  let statusClass = '';
  if (goal.finish) { statusText = '✅ 已完成'; statusClass = 'finished'; }
  else if (expired) { statusText = '⚠️ 已过期'; statusClass = 'expired'; }

  // 额外标签
  const extraTags = [];
  if (statusClass) extraTags.push(`<span class="ps-tag ${statusClass}"><span class="dot"></span>${statusText}</span>`);

  return `
    <div class="ps-header">
      <div class="ps-brand">
        <div class="ps-logo">🎯</div>
        <div>
          <div class="ps-title">人生目标记录器</div>
          <div class="ps-sub">Life Goal Recorder · 目标详情</div>
        </div>
      </div>
      <div class="ps-date">
        <div>导出时间</div>
        <div style="font-weight:600;margin-top:2px">${new Date().toLocaleString('zh-CN')}</div>
      </div>
    </div>
    <div class="ps-body">
      <div class="ps-type">${typeName}</div>
      <div class="ps-title-goal">${escapeHtml(goal.title)}</div>
      <div class="ps-tags">
        <span class="ps-tag priority-${priorityKey}"><span class="dot"></span>${priorityText}</span>
        ${extraTags.join('')}
      </div>
      <div class="ps-info-grid">
        <div class="ps-info">
          <div class="ps-info-label">📅 截止时间</div>
          <div class="ps-info-value">${deadlineDesc}</div>
        </div>
        <div class="ps-info">
          <div class="ps-info-label">📝 创建时间</div>
          <div class="ps-info-value">${createdAt}</div>
        </div>
      </div>
      <div class="ps-section">
        <div class="ps-section-title">📖 详细描述</div>
        <div class="ps-section-body">${goal.desc ? escapeHtml(goal.desc) : '<em style="color:#94a3b8">暂无详细描述</em>'}</div>
      </div>
    </div>
    <div class="ps-footer">
      <div class="ps-quote">❝ 你的每一个规划都在塑造未来的自己 ❞</div>
      <div>LIFE GOAL RECORDER</div>
    </div>
  `;
}

/* 打印单个目标(打开浏览器打印对话框,可保存为 PDF) */
window.onPrintGoal = function(id) {
  const goal = goals.find(g => g.id === id);
  if (!goal) return;
  const stage = document.getElementById('printStage');
  stage.innerHTML = buildPrintStage(goal);
  showToast('🖨 正在准备打印...');
  // 等待 DOM 渲染完成,然后打开打印
  setTimeout(() => {
    window.print();
    // 打印对话框关闭后,清空舞台
    setTimeout(() => { stage.innerHTML = ''; }, 800);
  }, 150);
};

/* 导出单个目标为 PNG 图片(纯原生 Canvas 绘制,无外部依赖) */
window.onImageGoal = function(id) {
  const goal = goals.find(g => g.id === id);
  if (!goal) return;
  const stage = document.getElementById('printStage');
  stage.innerHTML = buildPrintStage(goal);
  // 切换为 export 模式让元素参与布局
  stage.classList.add('export-mode');
  showToast('🖼 正在生成图片...');
  // 等待 DOM 渲染
  setTimeout(() => {
    try {
      const node = stage;
      const rect = node.getBoundingClientRect();
      const w = Math.ceil(rect.width);
      const h = Math.ceil(rect.height);
      drawNodeToCanvas(node, w, h).then(canvas => {
        const url = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = url;
        const safeTitle = (goal.title || '目标').replace(/[\\/:*?"<>|]/g, '_').slice(0, 30);
        a.download = `目标_${safeTitle}_${formatDate(new Date())}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        stage.innerHTML = '';
        stage.classList.remove('export-mode');
        showToast('✓ 图片已保存到下载目录');
      }).catch(err => {
        console.error(err);
        stage.classList.remove('export-mode');
        stage.innerHTML = '';
        showToast('⚠ 图片生成失败: ' + err.message);
      });
    } catch (e) {
      stage.classList.remove('export-mode');
      stage.innerHTML = '';
      showToast('⚠ 图片生成失败: ' + e.message);
    }
  }, 200);
};

/* ========== 原生 SVG foreignObject 方式生成图片 ==========
   说明:利用 SVG 的 <foreignObject> 把任意 HTML 嵌入,然后转成 canvas
   优点:不需要 html2canvas,完全纯原生,无需联网,无需后端
   注意:由于 Chrome 等浏览器同源策略,需要 base64 编码内联到 SVG
*/
async function drawNodeToCanvas(node, width, height) {
  // 获取节点计算样式 / 内联关键样式,然后把外链资源转为 dataURL
  const clone = node.cloneNode(true);
  // 设置显式尺寸,避免 canvas 中显示异常
  clone.style.width = width + 'px';
  clone.style.height = height + 'px';
  clone.style.left = '0';
  clone.style.top = '0';
  clone.style.position = 'static';
  // 移除 export-mode 类(避免在 canvas 里出现意外样式)
  clone.classList.remove('export-mode');

  // 内联关键字体 & 图片(此处无外部图片,但保险起见遍历处理)
  const serialized = new XMLSerializer().serializeToString(clone);
  const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
    <foreignObject x="0" y="0" width="100%" height="100%">
      <div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;">
        <style>
          * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
          body, html { margin:0; padding:0; font-family: 'Segoe UI','PingFang SC','Microsoft YaHei', system-ui, sans-serif; }
        </style>
        ${serialized}
      </div>
    </foreignObject>
  </svg>`;

  // 把 SVG 转为 base64 dataURL
  const svgBase64 = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
  // 加载到 Image 对象(此时浏览器会渲染 SVG,包括 foreignObject 内的 HTML)
  const img = await loadImage(svgBase64);
  // 绘制到 canvas
  const canvas = document.createElement('canvas');
  // 缩放比 2,得到 2x 高清图
  const scale = 2;
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(scale, scale);
  ctx.drawImage(img, 0, 0, width, height);
  return canvas;
}

// 图片加载 Promise
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = (e) => reject(new Error('SVG 加载失败,可能是浏览器安全策略限制或内容包含外链资源'));
    img.src = src;
  });
}

function initDateInfo() {
  const now = new Date();
  const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  document.getElementById('todayDate').textContent = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  document.getElementById('weekDay').textContent = weekdays[now.getDay()];
}

loadData();
initDateInfo();
render();
