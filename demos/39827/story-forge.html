<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故事熔炉 · Story Forge</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a1810;
    --ink-soft:#4a3728;
    --gold:#c9a961;
    --gold-deep:#8b6914;
    --parchment:#f4ead5;
    --parchment-dark:#e8d9b8;
    --parchment-darker:#d4c0a0;
    --accent:#782f2f;
    --shadow: 0 4px 24px rgba(42,24,16,0.15);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Noto Serif SC','Songti SC',serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse at top,#3a2818 0%,#1a0e0a 60%,#0a0604 100%);
    min-height:100vh;
    overflow-x:hidden;
    line-height:1.7;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
    background:
      radial-gradient(circle at 20% 30%,rgba(201,169,97,0.08) 0%,transparent 50%),
      radial-gradient(circle at 80% 70%,rgba(120,47,47,0.06) 0%,transparent 50%);
  }
  /* ==== 标题 ===== */
  .header{
    position:relative;z-index:10;
    text-align:center;padding:40px 20px 20px;
  }
  .title{
    font-family:'Ma Shan Zheng','Noto Serif SC',serif;
    font-size:52px;color:var(--gold);
    text-shadow:0 0 30px rgba(201,169,97,0.5), 2px 2px 0 #000;
    letter-spacing:8px;margin-bottom:8px;
    animation:goldGlow 4s ease-in-out infinite alternate;
  }
  @keyframes goldGlow{
    from{text-shadow:0 0 20px rgba(201,169,97,0.3), 2px 2px 0 #000}
    to{text-shadow:0 0 40px rgba(201,169,97,0.7), 2px 2px 0 #000}
  }
  .subtitle{
    font-family:'ZCOOL XiaoWei',serif;
    color:var(--parchment-darker);
    font-size:16px;letter-spacing:4px;opacity:0.85;
  }
  .ornament{
    display:flex;align-items:center;justify-content:center;
    margin:16px auto;gap:12px;color:var(--gold);font-size:20px;
  }
  .ornament .line{
    width:80px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  /* ==== 主容器 ==== */
  .container{
    position:relative;z-index:5;
    max-width:1100px;margin:0 auto;padding:20px;
  }
  /* ==== 羊皮纸卡片 ==== */
  .parchment{
    background:
      radial-gradient(ellipse at top,#f5ecd6 0%,#ede0c0 50%,#e4d4a8 100%);
    border:1px solid var(--gold-deep);
    border-radius:6px;
    box-shadow:
      var(--shadow),
      inset 0 0 0 1px rgba(201,169,97,0.3),
      inset 0 0 60px rgba(139,105,20,0.1);
    padding:36px 40px;
    position:relative;
    overflow:hidden;
  }
  .parchment::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(circle at 15% 25%,rgba(139,105,20,0.06) 2px,transparent 3px),
      radial-gradient(circle at 85% 75%,rgba(139,105,20,0.05) 1px,transparent 2px);
    background-size:60px 60px, 40px 40px;
    opacity:0.6;
  }
  .parchment::after{
    content:'';position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
    background:
      radial-gradient(ellipse at center,transparent 60%,rgba(80,50,20,0.15) 100%);
  }
  /* ==== 输入区域 ==== */
  .input-group{position:relative;z-index:2;}
  .field{margin-bottom:22px 0}
  .field-label{
    font-family:'ZCOOL XiaoWei',serif;
    font-size:18px;color:var(--gold-deep);
    margin-bottom:10px;display:flex;align-items:center;gap:8px;
    letter-spacing:2px;
  }
  .field-label .num{
    display:inline-block;width:24px;height:24px;line-height:24px;
    background:var(--gold);color:var(--parchment);
    border-radius:50%;text-align:center;font-size:13px;
    font-family:'Noto Serif SC',serif;
  }
  textarea,input[type=text]{
    width:100%;padding:14px 18px;
    background:rgba(255,250,235,0.7);
    border:1px solid rgba(139,105,20,0.4);
    border-radius:4px;
    font-family:'Noto Serif SC',serif;
    font-size:15px;color:var(--ink);
    line-height:1.7;resize:vertical;min-height:80px;
    transition:all 0.3s;outline:none;
  }
  textarea:focus,input[type=text]:focus{
    background:rgba(255,250,235,0.95);
    border-color:var(--gold-deep);
    box-shadow:0 0 0 3px rgba(201,169,97,0.2);
  }
  textarea::placeholder{color:rgba(74,55,40,0.5;font-style:italic}
  .knowledge-box{
    background:rgba(255,250,235,0.5);
    border:1px dashed rgba(139,105,20,0.4);
    padding:16px 20px;border-radius:4px;margin:16px 0;
  }
  .knowledge-title{
    font-family:'ZCOOL XiaoWei',serif;
    color:var(--accent);font-size:15px;letter-spacing:2px;
    margin-bottom:8px;
  }
  /* ==== 按钮 ==== */
  .btn-row{display:flex;gap:16px;margin-top:24px;flex-wrap:wrap}
  .btn{
    padding:14px 32px;border:none;cursor:pointer;
    font-family:'ZCOOL XiaoWei',serif;
    font-size:17px;letter-spacing:3px;
    border-radius:4px;transition:all 0.3s;
    position:relative;overflow:hidden;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--gold) 0%,var(--gold-deep) 100%);
    color:#2a1810;
    box-shadow:0 4px 16px rgba(201,169,97,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
    border:1px solid rgba(139,105,20,0.6);
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 24px rgba(201,169,97,0.6), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .btn-secondary{
    background:rgba(120,47,47,0.15);
    color:var(--accent);
    border:1px solid var(--accent);
  }
  .btn-secondary:hover{background:rgba(120,47,47,0.25)}
  .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
  /* ==== 游戏区域 ==== */
  .game-area{display:none;position:relative;z-index:2}
  .chapter-header{
    text-align:center;margin-bottom:30px;padding-bottom:20px;
    border-bottom:2px double rgba(139,105,20,0.3);
  }
  .chapter-num{
    font-family:'Ma Shan Zheng',serif;
    font-size:42px;color:var(--gold-deep);
    letter-spacing:4px;
  }
  .chapter-title{
    font-family:'ZCOOL XiaoWei',serif;
    font-size:22px;color:var(--ink-soft);
    margin-top:8px;letter-spacing:3px;
  }
  .scene-image{
    width:100%;height:280px;border-radius:6px;
    margin:20px 0;position:relative;overflow:hidden;
    border:2px solid rgba(139,105,20,0.4);
    box-shadow:var(--shadow);
  }
  .scene-image svg{width:100%;height:100%;display:block}
  .scene-image .caption{
    position:absolute;bottom:10px;right:10px;
    background:rgba(42,24,16,0.7);color:var(--gold);
    padding:6px 14px;border-radius:3px;
    font-family:'ZCOOL XiaoWei',serif;font-size:13px;
    letter-spacing:2px;
  }
  .story-text{
    font-size:17px;color:var(--ink);
    line-height:2;margin:24px 0;padding:0 20px;
    text-indent:2em;
  }
  .story-text p{margin-bottom:18px;animation:fadeIn 0.8s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .choices{margin-top:30px;padding-top:20px;
    border-top:1px dashed rgba(139,105,20,0.3);
  }
  .choices-title{
    text-align:center;font-family:'ZCOOL XiaoWei',serif;
    color:var(--accent);font-size:16px;letter-spacing:4px;
    margin-bottom:20px;
  }
  .choice{
    display:block;width:100%;padding:18px 24px;margin:12px 0;
    background:rgba(255,250,235,0.6);
    border:1px solid rgba(139,105,20,0.3);
    border-left:4px solid var(--gold);
    border-radius:4px;cursor:pointer;
    font-family:'Noto Serif SC',serif;font-size:16px;
    color:var(--ink);text-align:left;
    transition:all 0.3s;position:relative;
  }
  .choice::before{
    content:'❖';color:var(--gold);margin-right:12px;
  }
  .choice:hover{
    background:rgba(255,250,235,0.95);
    transform:translateX(8px);
    border-left-color:var(--accent);
    box-shadow:0 4px 16px rgba(139,105,20,0.2);
  }
  /* ==== 进度条 ==== */
  .progress{
    display:flex;align-items:center;gap:12px;margin:20px 0 30px;
    padding:14px 20px;background:rgba(139,105,20,0.1);
    border-radius:4px;
  }
  .progress-bar{
    flex:1;height:6px;background:rgba(139,105,20,0.2);
    border-radius:3px;overflow:hidden;position:relative;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));
    width:0;transition:width 0.6s ease;
  }
  .progress-text{
    font-family:'ZCOOL XiaoWei',serif;color:var(--gold-deep);
    font-size:14px;letter-spacing:2px;min-width:80px;text-align:right;
  }
  /* ==== 结局 ==== */
  .ending-banner{
    text-align:center;padding:40px 20px;margin-top:20px;
    background:linear-gradient(135deg,rgba(201,169,97,0.2),rgba(120,47,47,0.15));
    border:2px double var(--gold);border-radius:6px;
  }
  .ending-title{
    font-family:'Ma Shan Zheng',serif;
    font-size:38px;color:var(--gold-deep);
    letter-spacing:6px;margin-bottom:16px;
  }
  /* ==== 细节信息 ==== */
  .info-panel{
    margin-top:24px;padding:20px;
    background:rgba(42,24,16,0.06);
    border-left:4px solid var(--accent);
    border-radius:4px;
  }
  .info-title{
    font-family:'ZCOOL XiaoWei',serif;
    color:var(--accent);font-size:15px;letter-spacing:2px;
    margin-bottom:12px;
  }
  .info-list{list-style:none;font-size:14px;color:var(--ink-soft);line-height:1.9}
  .info-list li{padding-left:20px;position:relative}
  .info-list li::before{
    content:'◆';position:absolute;left:0;color:var(--gold);font-size:10px;top:6px;
  }
  /* ==== 预设示例 ==== */
  .presets{
    display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;
  }
  .preset-btn{
    padding:8px 16px;font-size:13px;
    background:rgba(201,169,97,0.2);
    border:1px solid rgba(139,105,20,0.4);
    color:var(--gold-deep);border-radius:20px;cursor:pointer;
    font-family:'ZCOOL XiaoWei',serif;letter-spacing:1px;
    transition:all 0.3s;
  }
  .preset-btn:hover{background:var(--gold);color:var(--ink);}
  /* ==== 加载动画 ==== */
  .loading{
    display:none;text-align:center;padding:60px 20px;
  }
  .loading-icon{
    font-size:48px;color:var(--gold);
    animation:spin 2s linear infinite;
    display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{
    font-family:'ZCOOL XiaoWei',serif;
    color:var(--gold-deep);font-size:18px;
    letter-spacing:4px;margin-top:20px;
  }
  /* ==== 故事概要 ==== */
  .summary{
    padding:16px 20px;margin:20px 0;
    background:rgba(201,169,97,0.12);
    border-left:4px solid var(--gold);
    border-radius:4px;
  }
  .summary-title{
    font-family:'ZCOOL XiaoWei',serif;
    color:var(--gold-deep);font-size:14px;letter-spacing:3px;
    margin-bottom:8px;
  }
  .summary-text{
    font-size:14px;color:var(--ink-soft);font-style:italic;line-height:1.8;
  }
  /* ==== 角色卡牌 ==== */
  .character-card{
    display:inline-flex;align-items:center;gap:12px;
    padding:10px 16px;background:rgba(255,250,235,0.5);
    border:1px solid rgba(139,105,20,0.3);border-radius:6px;
    margin:6px 8px 6px 0;
  }
  .char-avatar{
    width:40px;height:40px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--accent));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Ma Shan Zheng',serif;font-size:18px;
  }
  .char-info{font-size:13px;color:var(--ink-soft)}
  .char-name{font-weight:600;color:var(--ink);font-size:14px}
  @media(max-width:768px){
    .title{font-size:36px;letter-spacing:4px}
    .parchment{padding:24px 20px}
    .btn{padding:12px 20px;font-size:15px}
    .scene-image{height:200px}
    .story-text{font-size:15px;padding:0 8px}
  }
</style>
</head>
<body>

<div class="header">
  <div class="title">故事熔炉</div>
  <div class="ornament">
    <span class="line"></span>
    <span>❦</span>
    <span class="line"></span>
  </div>
  <div class="subtitle">STORY · FORGE · 推演你的奇幻旅程</div>
</div>

<div class="container">
  <div class="parchment">

    <!-- 输入界面 -->
    <div id="inputArea" class="input-group">
      <div class="summary">
        <div class="summary-title">◆ 故事导引</div>
        <div class="summary-text">输入故事的开头与结尾，辅以你所知的世界观或小说知识作为背景。系统将基于首尾推演中间情节，生成一段可互动的文字冒险。每个选择都会引领不同的结局。</div>
      </div>

      <div class="field">
        <div class="field-label"><span class="labelnum">壹</span>故事开头</div>
        <textarea id="beginning" placeholder="例如：在一个被遗忘的王国里，年轻的炼金学徒在旧书堆中发现了一本被封印的魔法笔记……">在一个被遗忘的古老王国中，年轻的炼金学徒林夜在图书馆最深处的书堆中，意外发现了一本用银色封皮的神秘笔记。笔记的第一页写着：「此书记载着被诸神所遗忘的秘术……」</textarea>
      </div>

      <div class="field">
        <div class="field-label"><span class="labelnum">贰</span>故事结尾</div>
        <textarea id="ending" placeholder="例如：当最后一缕晨光洒在残破的城墙上，他终于明白，真正的炼金术并非操控万物，而是守护心中那一丝不灭的希望。">当最后一缕晨光洒在残破的城墙上，林夜终于明白——真正的炼金术并非操控万物，而是守护心中那一丝不灭的希望。他合上笔记，转身走向远方。</textarea>
      </div>

      <div class="field">
        <div class="field-label"><span class="labelnum">叁</span>外接知识库（可选）</div>
        <div class="presets">
          <button class="preset-btn" onclick="applyPreset('fantasy')">奇幻世界观</button>
          <button class="preset-btn" onclick="applyPreset('cyber')">赛博朋克</button>
          <button class="preset-btn" onclick="applyPreset('wuxia')">武侠江湖</button>
          <button class="preset-btn" onclick="applyPreset('scifi')">星际科幻</button>
        </div>
        <textarea id="knowledge" placeholder="粘贴小说原文、世界观设定、角色背景等，作为推演的基础知识背景……" style="margin-top:10px">✦ 背景：这是一个炼金术与魔法共存的世界。✦ 角色：林夜——17岁，沉默寡言，出身低微的少年。✦ 势力：北方的冰封之城「永夜」，由古老家族统治；南方的「黎明之城崇尚科学与理性。✦ 核心冲突：炼金术的真谛在于「等价交换」，而笔记的真正力量来自使用者的「执念」。</textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="generateStory()">⚔ 熔铸故事 ⚔</button>
        <button class="btn btn-secondary" onclick="resetAll()">清空重来</button>
      </div>
    </div>

    <!-- 加载动画 -->
    <div id="loadingArea" class="loading">
      <div class="loading-icon">✦</div>
      <div class="loading-text">正在熔铸故事脉络……</div>
    </div>

    <!-- 游戏界面 -->
    <div id="gameArea" class="game-area">

      <div class="progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">第一章 / 共六章</div>
      </div>

      <div class="chapter-header">
        <div class="chapter-num" id="chapterNum">第一章</div>
        <div class="chapter-title" id="chapterTitle">银色笔记的低语</div>
      </div>

      <div class="scene-image" id="sceneImage"></div>

      <div class="story-text" id="storyText"></div>

      <div id="characterArea"></div>

      <div class="choices" id="choicesArea" style="display:none">
        <div class="choices-title">— 你的抉择 —</div>
        <div id="choicesList"></div>
      </div>

      <div id="endingArea" style="display:none">
        <div class="ending-banner">
          <div class="ending-title" id="endingTitle">故事圆满</div>
          <div class="story-text" id="endingText" style="text-indent:0;text-align:center"></div>
          <button class="btn btn-primary" onclick="resetAll()">✦ 开启新的旅程 ✦</button>
        </div>
      </div>

      <div class="info-panel">
        <div class="info-title">◆ 细节信息</div>
        <ul class="info-list" id="infoList"></ul>
      </div>

    </div>

  </div>
</div>

<script>
// ============ 预设知识 ============
const presets = {
  fantasy: '✦ 背景：一个魔法与剑并存的奇幻大陆。✦ 力量体系：法师通过吟诵与符文操控元素。✦ 种族：人类、精灵、矮人、龙族。✦ 核心冲突：黑暗之神正在苏醒，古老的预言指向被选中者。',
  cyber: '✦ 背景：2099年，巨型企业统治下的霓虹都市。✦ 科技：神经植入、义体改造、虚拟现实。✦ 角色：被遗忘的黑客——反抗者。✦ 核心冲突：数据即灵魂，代码即命运。',
  wuxia: '✦ 背景：武林纷争的江湖世界。✦ 门派：少林、武当、峨眉、丐帮。✦ 武学：内功、轻功、剑法。✦ 核心冲突：魔教重出江湖，正派面临浩劫。',
  scifi: '✦ 背景：星际殖民时代，人类散布于银河悬臂。✦ 科技：曲率引擎、能量护盾、人工智能。✦ 核心冲突：古老文明的遗产引发多方争夺。'
};

function applyPreset(key){
  document.getElementById('knowledge').value = presets[key];
}

// ============ 故事数据 ============
// 基于开头和结尾，推演中间6个章节
const storyChapters = [
  {
    num: '第一章', title: '银色笔记的低语',
    paragraphs: [
      '陈旧的羊皮纸在林夜的指尖微微震颤，仿佛有某种沉睡的意识正在缓缓苏醒。他屏住呼吸，将笔记翻到下一页。',
      '字迹是用某种银粉混合墨水书写的，在图书馆昏暗的烛光下闪烁着微弱的光芒。笔记的主人自称「晨星」——一个他从未听过的名字。',
      '「炼金的本质并非物质的转化，而是意志的具现。」这行字被重重圈起，旁边的空白处画着一个复杂的六芒星阵。'
    ],
    scene: 'library',
    characters: [
      {name:'林夜',role:'主角 · 炼金学徒',initial:'林'},
      {name:'晨星',role:'笔记的主人 · 身份成谜',initial:'晨'}
    ],
    choices: [
      {text:'潜心研读笔记，试图理解其中的炼金奥秘。',next:1,flag:'scholar'},
      {text:'带着笔记去找导师，询问关于「晨星」的来历。',next:1,flag:'cautious'},
      {text:'偷偷藏起笔记，独自寻找答案。',next:1,flag:'solo'}
    ],
    info: ['关键道具：银色笔记（含有未知的炼金知识）','地点：古老王国的中央图书馆','情绪：好奇、紧张、不安','主题：知识的代价与真相的追寻']
  },
  {
    num: '第二章', title: '导师的警示',
    paragraphs: [

// ============ 游戏逻辑 ============
let currentChapter = 0;
let playerChoices = [];

function generateStory(){
  const begin = document.getElementById('beginning').value.trim();
  const end = document.getElementById('ending').value.trim();
  if(!begin || !end){
    alert('请填写故事的开头和结尾！');
    return;
  }
  
  document.getElementById('inputArea').style.display = 'none';
  document.getElementById('loadingArea').style.display = 'block';
  
  setTimeout(()=>{
    document.getElementById('loadingArea').style.display = 'none';
    document.getElementById('gameArea').style.display = 'block';
    currentChapter = 0;
    playerChoices = [];
    renderChapter();
  }, 2000);
}

function renderChapter(){
  const ch = storyChapters[currentChapter];
  
  // 进度
  const progress = ((currentChapter+1)/storyChapters.length)*100;
  document.getElementById('progressFill').style.width = progress+'%';
  document.getElementById('progressText').textContent = `${ch.num} / 共${storyChapters.length}章`;
  
  // 章节标题
  document.getElementById('chapterNum').textContent = ch.num;
  document.getElementById('chapterTitle').textContent = ch.title;
  
  // 场景插画
  document.getElementById('sceneImage').innerHTML = getSceneSVG(ch.scene)+`<div class="caption">✦ ${ch.scene === 'dawn_final' ? '终章' : '场景'} ✦</div>`;
  
  // 故事文本
  const storyText = document.getElementById('storyText');
  storyText.innerHTML = ch.paragraphs.map((p,i)=>`<p style="animation-delay:${i*0.2}s">${p}</p>`).join('');
  
  // 角色卡牌
  const charArea = document.getElementById('characterArea');
  if(ch.characters && ch.characters.length>0){
    charArea.innerHTML = ch.characters.map(c=>`
      <div class="character-card">
        <div class="char-avatar">${c.initial}</div>
        <div class="char-info">
          <div class="char-name">${c.name}</div>
          <div style="font-size:12px;opacity:0.7">${c.role}</div>
        </div>
      </div>
    `).join('');
  } else {
    charArea.innerHTML = '';
  }
  
  // 选择或结局
  const choicesArea = document.getElementById('choicesArea');
  const endingArea = document.getElementById('endingArea');
  
  if(ch.ending){
    choicesArea.style.display = 'none';
    endingArea.style.display = 'block';
    document.getElementById('endingTitle').textContent = ch.ending.title;
    document.getElementById('endingText').innerHTML = `<p>${ch.ending.text}</p>`;
  } else if(ch.choices && ch.choices.length>0){
    endingArea.style.display = 'none';
    choicesArea.style.display = 'block';
    const choicesList = document.getElementById('choicesList');
    choicesList.innerHTML = ch.choices.map((c,i)=>
      `<button class="choice" onclick="makeChoice(${i})">${c.text}</button>`
    ).join('');
  }
  
  // 信息面板
  document.getElementById('infoList').innerHTML = ch.info.map(i=>`<li>${i}</li>`).join('');
  
  window.scrollTo({top:0,behavior:'smooth'});
}

function makeChoice(idx){
  const ch = storyChapters[currentChapter];
  playerChoices.push({
    chapter: currentChapter,
    choice: ch.choices[idx].text,
    flag: ch.choices[idx].flag
  });
  currentChapter = ch.choices[idx].next;
  renderChapter();
}

function resetAll(){
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('inputArea').style.display = 'block';
  document.getElementById('endingArea').style.display = 'none';
  document.getElementById('choicesArea').style.display = 'none';
  currentChapter = 0;
  playerChoices = [];
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>

</body>
</html>
