  works: [
    { id:1, title:'星辰之旅', content:`第一章 启程\n\n深夜的机场灯火通明，林晓背着一个简单的背包站在航站楼前。她刚刚接到了一个神秘的任务：前往一个名为"星尘计划"的研究基地。\n\n她抬头望着夜空，一颗流星划过天际，仿佛在为她指引方向。\n\n"这会是怎样的一段旅程呢？"她轻声自语，目光中带着期待与不安。\n\n第二章 抵达\n\n当飞机降落在这个偏远的小镇时，已是凌晨时分。接机的是一位沉默寡言的中年男子，他只说了一句"跟我来"。\n\n车辆在崎岖的山路上行驶了大约两个小时。窗外的景色从荒凉的原野逐渐变成茂密的森林。就在林晓即将睡着的时候，车子突然停了下来。\n\n"到了。"男子简短地说道。\n\n林晓揉了揉眼睛，抬头望去——一座现代化的建筑群出现在眼前，在月光下泛着银白色的光芒。`, chapters:[{id:101,title:'第一章 启程',content:'深夜的机场灯火通明，林晓背着一个简单的背包站在航站楼前...'},{id:102,title:'第二章 抵达',content:'当飞机降落在这个偏远的小镇时，已是凌晨时分...'}], createdAt:Date.now()-86400000*3 },
    { id:2, title:'古城谜案', content:`三月的江南，细雨绵绵。\n\n古老的石板路上，周棠撑着一把油纸伞，缓缓走向小镇最深处的那座宅院。他是应一位老友之邀而来的——老友在信中只写了一句话："速来，有要事相商，关乎人命。"\n\n周棠心中隐隐不安。他的这位老友是小镇上有名的医师，素来沉稳。`, chapters:[], createdAt:Date.now()-86400000*7 },
    { id:3, title:'都市奇缘', content:`苏雨薇从未想过，一个普通的上班日会改变她的一生。\n\n那天早上，她像往常一样挤进地铁一号线。车厢里人满为患，她被夹在中间。就在列车即将进入隧道的一刹那，她感到有人轻轻碰了她一下。\n\n她下意识地回头，看到一个穿着米色风衣的男子。对方冲她微微点头，眼神中带着一种难以言喻的深意。`, chapters:[], createdAt:Date.now()-86400000*12 }
  ],
  styles: [
    { id:1, name:'古风·雅致', features:'文风古朴雅致，善用意象与典故，句式长短错落，行文如诗如画。', sample:'月华如水，轻洒于庭院之上。她独自凭栏，望着那一轮清辉，心中百感交集。', createdAt:Date.now()-86400000*5 },
    { id:2, name:'悬疑·冷峻', features:'句式简洁有力，节奏紧凑，善用留白和暗示制造悬念。对话简短有力，环境描写服务于氛围。', sample:'雨声敲打着窗。他放下电话，缓缓抬头看向墙上的钟——凌晨三点零七分。', createdAt:Date.now()-86400000*9 },
    { id:3, name:'都市·细腻', features:'贴近日常生活，细腻的内心描写，对话自然流畅，善用都市意象。', sample:'写字楼的电梯缓缓上升，苏雨薇盯着镜面中自己的倒影出神。', createdAt:Date.now()-86400000*15 }
  ],
  creations: [
    { id:1, mode:'inspiration', input:'写一个穿越到古代的程序员', output:'# 《代码中的盛唐》\n\n## 故事梗概\n28岁的程序员林墨在一次生产事故中意外穿越到唐朝贞观年间。\n\n## 主要角色\n• 林墨 - 28岁，后端工程师\n• 长孙婉儿 - 聪慧女子\n\n## 情节走向\n1. 开端：深夜加班，停电醒来已在古代\n2. 适应：用编程思维解决生活难题\n3. 冲突：因"奇技淫巧"卷入风波\n4. 高潮：用算法思维破解阴谋\n5. 结局：在古代找到自己的位置', createdAt:Date.now()-3600000*5 },
    { id:2, mode:'creative', input:'让主角在基地里发现隐藏的实验室', output:'## 发现\n\n林墨按照指引来到研究所东侧的旧档案楼。这里常年少有人来，走廊里积着厚厚的灰尘。\n\n"第三地下室？"他看着墙上模糊的楼层标识，皱起了眉头。\n\n在好奇心的驱使下，他沿着昏暗的楼梯向下走去。\n\n推开那扇生锈的铁门，眼前的景象让他屏住了呼吸。\n\n这是一个被遗忘的实验室。中央有一台他从未见过的巨大设备，周围散落着无数发黄的图纸和笔记。墙上的日历停在了一个遥远的年份——1989年。', createdAt:Date.now()-3600000*20 }
  ],
  posts:[
    { id:1, author:'星空漫步者', title:'用灵感模式生成的穿越故事大纲分享！', content:'灵感模式真的太香了！输入几个字，AI就给我完整的大纲和人物设定。', likes:42, comments:[{author:'妙笔生花',text:'这个设定好有趣！'}], createdAt:Date.now()-3600000*8 },
    { id:2, author:'文字匠人', title:'古风文风使用心得', content:'建议上传5000字以上代表性文本提取文风，效果更加惊艳！', likes:78, comments:[], createdAt:Date.now()-86400000*2 }

function fmt(t){ if(!t)return''; const d=Date.now()-t; if(d<60000)return'刚刚'; if(d<3600000)return Math.floor(d/3600000)+'小时前'; if(d<86400000*7)return Math.floor(d/86400000)+'天前'; const D=new Date(t); return `${D.getFullYear()}-${String(D.getMonth()+1).padStart(2,'0')}-${String(D.getDate()).padStart(2,'0')}`}

function handleAuth(){ const e=document.getElementById('auth-email').value.trim(); const p=document.getElementById('auth-password').value; const n=document.getElementById('auth-nickname').value.trim()||'演示用户'; if(!e||!p){toast('请填写邮箱和密码');return;} S.user={email:e,nickname:n,createdAt:Date.now()}; ss(); document.getElementById('user-nickname').textContent=n; document.getElementById('user-avatar').textContent=(n[0]||'U').toUpperCase(); document.getElementById('page-login').classList.add('hidden'); document.getElementById('page-app').classList.remove('hidden'); navigate('home'); toast(authMode==='login'?'登录成功！':'注册成功！'); }

function genInsp(){
  const inp=document.getElementById('insp-input').value.trim(); if(!inp){toast('请先输入创作想法');return;}
  const style=document.getElementById('insp-style').value; const styleName = style ? S.styles.find(s=>s.id==style)?.name : '';
  const out=document.getElementById('insp-out'); out.innerHTML=`<div class="flex flex-col items-center"><div class="w-12 h-12 border-4 border-vermilion border-t-transparent rounded-full animate-spin mb-3"></div><p class="text-cream/60 text-sm">AI正在构思中...</p></div>`;
  setTimeout(()=>{
    const title=`<span style="color:#ff5733"># 《${inp.slice(0,10)}${inp.length>10?'...':''}》</span>`;
    const outText = `${title}\n\n【大纲】${styleName?'（文风：'+styleName+'）':''}\n\n## 故事梗概\n基于「${inp.slice(0,30)}${inp.length>30?'...':''}」这一核心构想，构建一个围绕主角成长与抉择展开的故事。故事节奏张弛有度，既有紧张的冲突时刻，也有细腻的情感描写。\n\n## 主要角色\n• 主角 — 25~35岁，具有鲜明性格特征，面临深层内心冲突\n• 核心配角 — 与主角形成强烈对比或互补，推动主线\n• 神秘角色 — 在故事中后段揭示身份，带来关键转折\n\n## 情节走向\n1. **开端**：日常被打破，引出核心事件，建立基本设定\n2. **探索**：主角进入新环境/认知新信息，世界观扩展\n3. **试炼**：遇到第一个重大挑战或抉择，展现角色弧光\n4. **转折**：揭示重要信息，颠覆之前假设，故事方向改变\n5. **深渊**：最低谷时刻，主角看似绝望，实则积蓄力量\n6. **高潮**：最终对决/抉择，所有伏笔回收\n7. **结局**：新的平衡建立，余韵留味\n\n## 核心主题\n• 身份认同与自我认知\n• 选择与代价\n• 人性的多面性\n\n## 开篇建议\n建议从一个具体的、感官丰富的场景入手。避免长篇背景介绍，让读者在情节推进中自然了解世界观。\n\n---\n*以上为AI辅助生成的创意大纲，可直接使用或作为进一步创作的起点。*`;
    // typing effect
    out.innerHTML=''; out.style.padding='0'; out.style.display='block'; out.style.overflow='auto'; out.style.maxHeight='400px';
    const box=document.createElement('div'); box.style.whiteSpace='pre-wrap'; box.style.lineHeight='1.8'; box.style.fontSize='14px'; box.style.color='#f5e9d6';
    out.appendChild(box);
    let i=0; const step=Math.max(3, Math.ceil(outText.length/800));
    const it=setInterval(()=>{ i+=step; box.textContent=outText.slice(0,i); out.scrollTop=out.scrollHeight; if(i>=outText.length){clearInterval(it); inspOut=outText; document.getElementById('insp-save-btn').classList.remove('hidden');} }, 25);
  }, 1000);
}

function saveInsp(){ if(!inspOut){return;} const inp=document.getElementById('insp-input').value.trim(); S.works.unshift({id:S.workIdCounter++,title:`灵感：${inp.slice(0,15)}${inp.length>15?'...':''}`,content:inspOut,chapters:[],createdAt:Date.now()}); ss(); toast('✓ 已保存到作品库'); document.getElementById('insp-save-btn').classList.add('hidden'); }

      </div>`).join('')}</div>`:'<div class="text-center py-8 text-cream/40"><p class="mb-2">还没有保存的文风</p><p class="text-xs">分析后可一键保存</p></div>'}
    </div>
  </div>
</div>`; }

function wnRead(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ document.getElementById('wn-content').value=ev.target.result; if(!document.getElementById('wn-name').value) document.getElementById('wn-name').value=f.name.replace(/\.[^.]+$/,'')+'文风'; }; r.readAsText(f,'UTF-8'); }
function wnAnalyze(){ const n=document.getElementById('wn-name').value.trim(); const c=document.getElementById('wn-content').value.trim(); if(!n||!c){toast('请填写文风名称和内容');return;} const out=document.getElementById('wn-out'); out.innerHTML=`<div class="flex items-center justify-center py-6"><div class="w-8 h-8 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mr-3"></div><span class="text-cream/60 text-sm">AI正在分析中...</span></div>`; setTimeout(()=>{ const fts=`文风古朴雅致，善用意象与典故，句式长短错落。对话简短有力，环境描写服务于氛围。整体节奏紧凑，留白得当。`; out.innerHTML=`<div class="p-4 rounded-xl bg-amber-500/10 border border-amber-500/30"><div class="text-xs text-amber-400 mb-2">【特征提取结果】</div><p class="text-sm text-cream/80 leading-relaxed mb-4">${fts}</p><p class="text-xs text-cream/50 italic mt-2 border-t border-white/10 pt-2 mb-4">"${c.slice(0,60)}${c.length>60?'...':''}"</p><button onclick="wnSave('${encodeURIComponent(n)}','${encodeURIComponent(fts)}','${encodeURIComponent(c.slice(0,100))}')" class="w-full py-2.5 rounded-lg text-sm font-medium" style="background:#fbbf24;color:#1a1a2e">✓ 保存此文风</button></div>`; }, 1200); }
function wnSave(n,f,s){ S.styles.unshift({id:S.styleIdCounter++,name:decodeURIComponent(n),features:decodeURIComponent(f),sample:decodeURIComponent(s),createdAt:Date.now()}); ss(); navigate('wonder'); toast('✓ 文风已保存'); }
function wnDel(id){ if(!confirm('确定删除此文风？'))return; S.styles=S.styles.filter(s=>s.id!==id); ss(); navigate('wonder'); toast('已删除'); }

function wkNew(){ showModal(`<div class="rounded-2xl max-w-xl w-full p-6 glass" style="background:#1a1a2e"><h2 class="text-xl text-cream mb-4" style="font-family:'Noto Serif SC,serif;">新建作品</h2>

  <div class="flex justify-end gap-3 mt-6"><button onclick="closeModal()" class="px-5 py-2 rounded-lg bg-white/10 text-cream text-sm">取消</button><button onclick="wkSaveNew()" class="px-5 py-2 rounded-lg btn-primary text-sm">保存</button></div></div>`); }
function wkSaveNew(){ const t=document.getElementById('wk-t').value.trim(); const c=document.getElementById('wk-c').value.trim(); if(!t||!c){toast('请填写标题和内容');return;} S.works.unshift({id:S.workIdCounter++,title:t,content:c,chapters:[],createdAt:Date.now()}); ss(); closeModal(); navigate('works'); toast('✓ 作品已保存'); }
function wkEdit(id){ const w=S.works.find(x=>x.id===id); if(!w)return; showModal(`<div class="rounded-2xl max-w-xl w-full p-6 glass" style="background:#1a1a2e"><h2 class="text-xl text-cream mb-4" style="font-family:'Noto Serif SC,serif;">编辑作品</h2>
  <label class="block text-sm text-cream/70 mb-2">作品标题</label><input id="wk-t" class="w-full px-3 py-2 text-sm mb-3" value="${w.title.replace(/"/g,'&quot;')}">
  <label class="block text-sm text-cream/70 mb-2">作品内容</label><textarea id="wk-c" class="w-full h-48 p-3 text-sm">${w.content}</textarea>
  <div class="flex justify-end gap-3 mt-6"><button onclick="closeModal()" class="px-5 py-2 rounded-lg bg-white/10 text-cream text-sm">取消</button><button onclick="wkSaveEdit(${id})" class="px-5 py-2 rounded-lg btn-primary text-sm">保存</button></div></div>`); }
function wkSaveEdit(id){ const t=document.getElementById('wk-t').value.trim(); const c=document.getElementById('wk-c').value.trim(); if(!t||!c){toast('请填写标题和内容');return;} const w=S.works.find(x=>x.id===id); if(w){w.title=t;w.content=c;} ss(); closeModal(); navigate('works'); toast('✓ 已更新'); }
function wkDel(id){ if(!confirm('确定删除此作品？'))return; S.works=S.works.filter(w=>w.id!==id); ss(); navigate('works'); toast('已删除'); }
function wkDivChap(id){ const w=S.works.find(x=>x.id===id); if(!w)return; toast('AI分章中...'); setTimeout(()=>{ const p=w.content.split(/\n(?=(第[一二三四五六七八九十]+[章回节卷篇]|[一二三四五六七八九十]+、|\d+\.\s))/).filter(p=>p.trim().length>30); const chs=p.length>=2?p.map((c,i)=>({id:1000+i,title:c.split('\n')[0].slice(0,20)||`第${i+1}章`,content:c.trim()})):[{id:1001,title:'第一章',content:w.content.slice(0,w.content.length/2)},{id:1002,title:'第二章',content:w.content.slice(w.content.length/2)}]; w.chapters=chs; ss(); navigate('works'); toast(`✓ 已分成${chs.length}章`); }, 800); }

function sqToggle(id){ const el=document.getElementById('sq-c-'+id); if(el) el.classList.toggle('hidden'); }
function sqLike(id){ const p=S.posts.find(x=>x.id===id); if(p){p.likes++; ss(); navigate('square');} }
function sqComment(id){ const v=document.getElementById('sq-i-'+id).value.trim(); if(!v)return; const p=S.posts.find(x=>x.id===id); if(p){p.comments.push({author:S.user?.nickname||'我',text:v}); ss(); navigate('square');} }
function sqUse(id){ const p=S.posts.find(x=>x.id===id); if(p){ crWork=null; crChap=null; navigate('creative'); setTimeout(()=>{ const el=document.getElementById('cr-input'); if(el) el.value='基于"' + p.title + '"的灵感继续创作'; }, 200); } }
function sqNew(){ showModal(`<div class="rounded-2xl max-w-xl w-full p-6 glass" style="background:#1a1a2e"><h2 class="text-xl text-cream mb-4" style="font-family:'Noto Serif SC,serif;">发布新帖</h2>
  <input id="sq-t" class="w-full px-3 py-2 text-sm mb-3" placeholder="标题...">
  <textarea id="sq-c" class="w-full h-40 p-3 text-sm" placeholder="分享你的创作想法..."></textarea>
  <div class="flex justify-end gap-3 mt-5"><button onclick="closeModal()" class="px-5 py-2 rounded-lg bg-white/10 text-cream text-sm">取消</button><button onclick="sqSubmit()" class="px-5 py-2 rounded-lg btn-primary text-sm">发布</button></div></div>`); }
function sqSubmit(){ const t=document.getElementById('sq-t').value.trim(); const c=document.getElementById('sq-c').value.trim(); if(!t||!c){toast('请填写标题和内容');return;} S.posts.unshift({id:S.postIdCounter++,author:S.user?.nickname||'我',title:t,content:c,likes:0,comments:[],createdAt:Date.now()}); ss(); closeModal(); navigate('square'); toast('✓ 已发布'); }
