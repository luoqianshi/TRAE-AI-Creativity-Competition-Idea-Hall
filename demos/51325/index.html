<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活娱乐 — 致力帮助舞萌p更好的邂逅滴蜡熊</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fafafa;
  --card-bg: #fff;
  --text: #333;
  --text-secondary: #888;
  --accent: #e0407b;
  --accent-light: #ffe0ec;
  --border: #eee;
  --shadow: 0 1px 4px rgba(0,0,0,.06);
  --radius: 10px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}

.container { max-width: 680px; margin: 0 auto; padding: 16px; }

.header {
  text-align: center;
  padding: 28px 0 10px;
}
.header h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: .5px;
}
.header .sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.arcade-list { display: flex; flex-direction: column; gap: 10px; }

.arcade-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  cursor: pointer;
  transition: box-shadow .15s;
  border: 1px solid var(--border);
}
.arcade-card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.1); }

.arcade-card .name {
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.arcade-card .name .tag {
  font-size: 11px;
  background: var(--accent-light);
  color: var(--accent);
  padding: 1px 7px;
  border-radius: 20px;
  font-weight: 500;
}

.arcade-card .info-row {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}
.arcade-card .info-row span { display: flex; align-items: center; gap: 3px; }

.arcade-card .actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  transition: opacity .15s;
  line-height: 1.4;
}
.btn:hover { opacity: .85; }
.btn-nav { background: #4a90d9; color: #fff; }
.btn-mt { background: #ffc700; color: #333; }
.btn-join { background: var(--accent); color: #fff; font-size: 13px; padding: 8px 20px; }
.btn-cancel { background: #eee; color: #666; font-size: 13px; padding: 8px 20px; }
.btn-swap { background: #f0f0f0; color: #666; font-size: 11px; padding: 3px 10px; border: 1px solid #ddd; }
.btn-accept { background: var(--accent); color: #fff; font-size: 11px; padding: 3px 10px; }
.btn-reject { background: #eee; color: #999; font-size: 11px; padding: 3px 10px; }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100; animation: fadeIn .2s;
}
.modal-sheet {
  background: #fff;
  border-radius: 16px 16px 0 0;
  width: 100%; max-width: 680px; max-height: 85vh;
  overflow-y: auto; padding: 20px 16px 28px;
  animation: slideUp .25s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20%); } to { transform: translateY(0); } }

.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h2 { font-size: 18px; font-weight: 700; }
.modal-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: #f5f5f5; font-size: 18px; cursor: pointer; color: #999; }

.queue-section { margin-top: 14px; }
.queue-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.queue-count { font-size: 12px; color: var(--accent); background: var(--accent-light); padding: 2px 8px; border-radius: 20px; }

.queue-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: 8px; background: #fafafa;
  margin-bottom: 6px; font-size: 13px; gap: 10px;
}
.queue-item.me { background: var(--accent-light); border: 1px solid var(--accent); }
.queue-rank { font-weight: 700; color: var(--accent); font-size: 14px; min-width: 22px; }
.queue-name { flex: 1; font-weight: 500; }
.queue-time { font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
.queue-actions { display: flex; gap: 4px; }

.empty-state { text-align: center; padding: 24px; color: var(--text-secondary); font-size: 13px; }

.my-status {
  margin-top: 14px; padding: 12px; border-radius: var(--radius);
  background: var(--accent-light); font-size: 13px;
  display: flex; align-items: center; justify-content: space-between;
}

.detail-actions { display: flex; gap: 8px; margin-top: 14px; }

.toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 10px 20px; border-radius: 20px;
  font-size: 13px; z-index: 200; animation: toastIn .3s;
  pointer-events: none;
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

.footer { text-align: center; padding: 24px 0 32px; font-size: 12px; color: var(--text-secondary); }
.footer a { color: var(--accent); text-decoration: none; }

.pulse { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(224,64,123,.3); } 50% { box-shadow: 0 0 0 6px rgba(224,64,123,0); } }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
(function() {
  const STORAGE_KEY = 'maimai_queue_data';
  const SESSION_KEY = 'maimai_my_session';
  const QUEUE_TTL = 3 * 60 * 60 * 1000;

  const RANDOM_NAMES = [
    '滴蜡熊本熊','摸鱼の舞萌p','音击战士','彩虹猫','旋转吧小饼干',
    '出勤仙人','键盘毁灭者','今天也要AP','暴走番茄','深夜打歌人',
    '兔兔伯爵','鸽王本王','满分强迫症','机厅流浪猫','甜筒加珍珠',
    '星星果','不吃香菜','摸爆党','双指流大佬','今天出太阳',
    '雪糕刺客','打工人摸鱼中','奶茶星人','小笼包','面壁者',
    '黄油小熊','电波系','月亮不睡我不睡','节奏大师','猫猫头'
  ];

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function randName() { return RANDOM_NAMES[randInt(0, RANDOM_NAMES.length - 1)]; }
  function randId() { return 'u' + Date.now().toString(36) + randInt(100, 999); }

  function getMySession() {
    let s = sessionStorage.getItem(SESSION_KEY);
    if (s) return JSON.parse(s);
    const session = { id: randId(), name: randName(), hasJoined: false };
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    return session;
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

  function cleanExpired(data) {
    const now = Date.now();
    let changed = false;
    for (const arcadeId in data) {
      const players = data[arcadeId] || [];
      const filtered = players.filter(p => (now - p.joinTime) < QUEUE_TTL);
      if (filtered.length !== players.length) { data[arcadeId] = filtered; changed = true; }
    }
    return changed;
  }

  const ARCADES = [
    {
      id: 'a1', name: '环游嘉年华·天河店', address: '广州市天河区天河路228号正佳广场7楼',
      lat: 23.1322, lng: 113.3228, machines: 4, mt: '环游嘉年华 天河 正佳广场'
    },
    {
      id: 'a2', name: '风云再起·北京路店', address: '广州市越秀区北京路238号名盛广场3楼',
      lat: 23.1228, lng: 113.2694, machines: 2, mt: '风云再起 北京路 广州'
    },
    {
      id: 'a3', name: '汤姆熊·中山公园店', address: '上海市长宁区长宁路1018号龙之梦购物中心6楼',
      lat: 31.2212, lng: 121.4141, machines: 4, mt: '汤姆熊 中山公园 龙之梦'
    },
    {
      id: 'a4', name: '星力动漫·南山店', address: '深圳市南山区文心五路33号海岸城购物中心4楼',
      lat: 22.5176, lng: 113.9386, machines: 3, mt: '星力动漫 南山 海岸城'
    },
    {
      id: 'a5', name: '城市英雄·春熙路店', address: '成都市锦江区春熙路伊藤洋华堂5楼',
      lat: 30.6571, lng: 104.0821, machines: 2, mt: '城市英雄 春熙路 成都'
    },
    {
      id: 'a6', name: '环游嘉年华·朝阳大悦城', address: '北京市朝阳区朝阳北路101号朝阳大悦城8楼',
      lat: 39.9245, lng: 116.5211, machines: 4, mt: '环游嘉年华 朝阳大悦城'
    },
    {
      id: 'a7', name: '大玩家·湖滨银泰店', address: '杭州市上城区延安路258号湖滨银泰in77 C区B1',
      lat: 30.2557, lng: 120.1671, machines: 3, mt: '大玩家 湖滨银泰 杭州'
    },
    {
      id: 'a8', name: '风云再起·新街口店', address: '南京市秦淮区中山南路122号大洋百货6楼',
      lat: 32.0415, lng: 118.7842, machines: 2, mt: '风云再起 新街口 南京'
    },
    {
      id: 'a9', name: '大玩家·日照万达店', address: '日照市东港区山东东路与青岛路交汇处万达广场3楼',
      lat: 35.4333, lng: 119.5375, machines: 2, mt: '大玩家 日照万达'
    },
    {
      id: 'a10', name: '星际传奇·日照苏宁店', address: '日照市东港区海曲中路18号苏宁广场4楼',
      lat: 35.4213, lng: 119.4692, machines: 2, mt: '星际传奇 日照 苏宁'
    }
  ];

  let queueData = loadData();
  cleanExpired(queueData);
  saveData(queueData);
  const mySession = getMySession();

  function getArcadeQueue(arcadeId) { return queueData[arcadeId] || []; }

  function myQueueInfo() {
    const myId = mySession.id;
    for (const arcadeId in queueData) {
      const idx = queueData[arcadeId].findIndex(p => p.id === myId);
      if (idx !== -1) return { arcadeId, index: idx, player: queueData[arcadeId][idx] };
    }
    return null;
  }

  function formatTime(ts) {
    const d = new Date(ts);
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function remainingTime(joinTime) {
    const elapsed = Date.now() - joinTime;
    const remaining = QUEUE_TTL - elapsed;
    if (remaining <= 0) return '即将退出';
    const mins = Math.floor(remaining / 60000);
    if (mins >= 60) return Math.floor(mins / 60) + 'h' + (mins % 60) + 'm后退出';
    return mins + 'm后退出';
  }

  function navUrl(arcade) {
    return 'https://uri.amap.com/navigation?to=' + arcade.lng + ',' + arcade.lat + ',' + encodeURIComponent(arcade.name) + '&mode=car&callnative=1';
  }

  function mtUrl(arcade) {
    return 'https://www.meituan.com/s/?q=' + encodeURIComponent(arcade.mt);
  }

  function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 2000);
  }

  let currentModalArcadeId = null;

  function joinQueue(arcadeId) {
    if (mySession.hasJoined) {
      const info = myQueueInfo();
      if (info && info.arcadeId !== arcadeId) {
        showToast('你已在「' + (ARCADES.find(function(a){return a.id===info.arcadeId;}) || {}).name + '」排队中，请先撤销');
        return;
      }
      if (info && info.arcadeId === arcadeId) {
        showToast('你已在此机厅排队中');
        return;
      }
      if (!info) {
        mySession.hasJoined = false;
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(mySession));
      }
    }
    mySession.hasJoined = true;
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(mySession));
    if (!queueData[arcadeId]) queueData[arcadeId] = [];
    queueData[arcadeId].push({ id: mySession.id, name: mySession.name, joinTime: Date.now() });
    saveData(queueData);
    showToast('签到成功，排队中…');
    render();
  }

  function cancelQueue(arcadeId) {
    if (!queueData[arcadeId]) return;
    queueData[arcadeId] = queueData[arcadeId].filter(function(p) { return p.id !== mySession.id; });
    if (queueData[arcadeId].length === 0) delete queueData[arcadeId];
    saveData(queueData);
    mySession.hasJoined = false;
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(mySession));
    showToast('已撤销排队');
    render();
  }

  function requestSwap(arcadeId, targetPlayer) {
    if (targetPlayer.id === mySession.id) { showToast('不能和自己换位'); return; }
    if (targetPlayer.swapRequest) { showToast('该玩家已有待处理请求'); return; }
    const myIdx = queueData[arcadeId].findIndex(function(p) { return p.id === mySession.id; });
    const targetIdx = queueData[arcadeId].findIndex(function(p) { return p.id === targetPlayer.id; });
    if (myIdx === -1 || targetIdx === -1) return;
    if (myIdx <= targetIdx) { showToast('只能与排在你前面的玩家换位'); return; }
    queueData[arcadeId][targetIdx].swapRequest = {
      fromId: mySession.id,
      fromName: mySession.name,
      swapIdx: myIdx
    };
    saveData(queueData);
    showToast('已向 ' + targetPlayer.name + ' 发起换位请求');
    render();
  }

  function acceptSwap(arcadeId, playerId) {
    const players = queueData[arcadeId];
    if (!players) return;
    const idx = players.findIndex(function(p) { return p.id === playerId; });
    if (idx === -1 || !players[idx].swapRequest) return;
    const req = players[idx].swapRequest;
    const fromIdx = players.findIndex(function(p) { return p.id === req.fromId; });
    if (fromIdx === -1) { players[idx].swapRequest = null; saveData(queueData); render(); return; }
    const temp = players[idx];
    players[idx] = players[fromIdx];
    players[fromIdx] = temp;
    players[idx].swapRequest = null;
    players[fromIdx].swapRequest = null;
    saveData(queueData);
    showToast('换位成功！');
    render();
  }

  function rejectSwap(arcadeId, playerId) {
    const players = queueData[arcadeId];
    if (!players) return;
    const idx = players.findIndex(function(p) { return p.id === playerId; });
    if (idx === -1) return;
    players[idx].swapRequest = null;
    saveData(queueData);
    showToast('已拒绝换位请求');
    render();
  }

  function openDetail(arcade) {
    currentModalArcadeId = arcade.id;
    render();
  }

  function closeDetail() {
    currentModalArcadeId = null;
    render();
  }

  function renderArcadeCard(arcade) {
    const queue = getArcadeQueue(arcade.id);
    const count = queue.length;
    return '<div class="arcade-card" onclick="app.openDetail(app.arcades.find(function(a){return a.id===\'' + arcade.id + '\'}))">'
      + '<div class="name">' + arcade.name + '<span class="tag">' + arcade.machines + '台</span></div>'
      + '<div class="info-row">'
      + '<span>' + arcade.address + '</span>'
      + '</div>'
      + '<div class="info-row">'
      + '<span>当前排队: ' + (count > 0 ? '<b style="color:var(--accent)">' + count + '人</b>' : '无人') + '</span>'
      + '</div>'
      + '<div class="actions">'
      + '<a class="btn btn-nav" href="' + navUrl(arcade) + '" target="_blank" onclick="event.stopPropagation()">高德导航</a>'
      + '<a class="btn btn-mt" href="' + mtUrl(arcade) + '" target="_blank" onclick="event.stopPropagation()">美团查看</a>'
      + '</div>'
      + '</div>';
  }

  function renderDetail() {
    const arcade = ARCADES.find(function(a) { return a.id === currentModalArcadeId; });
    if (!arcade) return '';
    const queue = getArcadeQueue(arcade.id);
    const myInfo = myQueueInfo();
    const inThisQueue = myInfo && myInfo.arcadeId === arcade.id;

    let queueHtml = '';
    if (queue.length === 0) {
      queueHtml = '<div class="empty-state">暂无排队玩家，快来签到吧</div>';
    } else {
      queueHtml = queue.map(function(p, i) {
        const isMe = p.id === mySession.id;
        const timeStr = formatTime(p.joinTime);
        const remainStr = '<span style="font-size:11px;color:#aaa">' + remainingTime(p.joinTime) + '</span>';
        let actionsHtml = '';
        if (!isMe && inThisQueue && myInfo.index > i && !p.swapRequest) {
          actionsHtml = '<button class="btn btn-swap" onclick="app.requestSwap(\'' + arcade.id + '\',app.getQueuePlayer(\'' + arcade.id + '\',' + i + '))">换位</button>';
        }
        if (p.swapRequest) {
          if (isMe) {
            actionsHtml = '<button class="btn btn-accept" onclick="app.acceptSwap(\'' + arcade.id + '\',\'' + p.id + '\')">同意</button>'
              + '<button class="btn btn-reject" onclick="app.rejectSwap(\'' + arcade.id + '\',\'' + p.id + '\')">拒绝</button>';
          } else {
            actionsHtml = '<span style="font-size:11px;color:var(--accent)">等待对方确认…</span>';
          }
        }
        return '<div class="queue-item' + (isMe ? ' me' : '') + '">'
          + '<span class="queue-rank">#' + (i + 1) + '</span>'
          + '<span class="queue-name">' + p.name + (isMe ? ' (你)' : '') + '</span>'
          + '<span class="queue-time">' + timeStr + ' ' + remainStr + '</span>'
          + '<span class="queue-actions">' + actionsHtml + '</span>'
          + '</div>';
      }).join('');
    }

    let statusHtml = '';
    if (inThisQueue) {
      statusHtml = '<div class="my-status">'
        + '<span>你正在排队 #' + (myInfo.index + 1) + ' — ' + remainingTime(myInfo.player.joinTime) + '</span>'
        + '<button class="btn btn-cancel" onclick="app.cancelQueue(\'' + arcade.id + '\')">撤销排队</button>'
        + '</div>';
    }

    let joinBtnHtml = '';
    if (!inThisQueue) {
      const disabled = mySession.hasJoined && myInfo ? 'disabled style="opacity:.5;cursor:not-allowed"' : '';
      const text = mySession.hasJoined && myInfo ? '已在其他机厅排队' : '签到排队';
      joinBtnHtml = '<button class="btn btn-join pulse" ' + disabled + ' onclick="app.joinQueue(\'' + arcade.id + '\')">' + text + '</button>';
      if (mySession.hasJoined && myInfo) {
        joinBtnHtml += '<button class="btn btn-cancel" style="margin-left:8px" onclick="app.cancelQueue(\'' + myInfo.arcadeId + '\')">撤销现有排队</button>';
      }
    }

    return '<div class="modal-overlay" onclick="if(event.target===this)app.closeDetail()">'
      + '<div class="modal-sheet">'
      + '<div class="modal-header">'
      + '<h2>' + arcade.name + '</h2>'
      + '<button class="modal-close" onclick="app.closeDetail()">✕</button>'
      + '</div>'
      + '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px">' + arcade.address + '</div>'
      + '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">机台数: ' + arcade.machines + '台</div>'
      + '<div class="detail-actions">'
      + '<a class="btn btn-nav" href="' + navUrl(arcade) + '" target="_blank">高德导航</a>'
      + '<a class="btn btn-mt" href="' + mtUrl(arcade) + '" target="_blank">美团查看</a>'
      + joinBtnHtml
      + '</div>'
      + '<div class="queue-section">'
      + '<h3>排队队列 <span class="queue-count">' + queue.length + '人</span></h3>'
      + queueHtml
      + '</div>'
      + statusHtml
      + '</div>'
      + '</div>';
  }

  function render() {
    cleanExpired(queueData);
    saveData(queueData);
    const myInfo = myQueueInfo();
    if (!myInfo && mySession.hasJoined) {
      mySession.hasJoined = false;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(mySession));
    }

    let html = '';

    html += '<div class="header">'
      + '<h1>生活娱乐</h1>'
      + '<div class="sub">致力帮助舞萌p更好的邂逅滴蜡熊</div>'
      + '</div>';

    html += '<div class="arcade-list">';
    html += ARCADES.map(function(a) { return renderArcadeCard(a); }).join('');
    html += '</div>';

    if (currentModalArcadeId) {
      html += renderDetail();
    }

    html += '<div class="footer">'
      + '如果觉得好用，欢迎<a href="javascript:void(0)" onclick="alert(\'感谢支持！打赏功能开发中～\')">打赏支持</a> · 完全免费 · 为舞萌p而生'
      + '</div>';

    document.getElementById('app').innerHTML = html;
  }

  window.app = {
    arcades: ARCADES,
    openDetail: openDetail,
    closeDetail: closeDetail,
    joinQueue: joinQueue,
    cancelQueue: cancelQueue,
    requestSwap: requestSwap,
    acceptSwap: acceptSwap,
    rejectSwap: rejectSwap,
    getQueuePlayer: function(arcadeId, idx) { return (queueData[arcadeId] || [])[idx]; }
  };

  const restoreArcadeId = sessionStorage.getItem('maimai_detail_arcade');
  if (restoreArcadeId && ARCADES.find(function(a) { return a.id === restoreArcadeId; })) {
    currentModalArcadeId = restoreArcadeId;
  }

  render();

  window.addEventListener('beforeunload', function() {
    if (currentModalArcadeId) {
      sessionStorage.setItem('maimai_detail_arcade', currentModalArcadeId);
    } else {
      sessionStorage.removeItem('maimai_detail_arcade');
    }
  });

  setInterval(function() {
    cleanExpired(queueData);
    saveData(queueData);
    const myInfo = myQueueInfo();
    if (!myInfo && mySession.hasJoined) {
      mySession.hasJoined = false;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(mySession));
    }
    render();
  }, 30000);
})();
</script>
</body>
