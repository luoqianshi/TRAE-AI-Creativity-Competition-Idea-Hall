<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>科研项目智能体</title>
    <style>
      :root {
        --bg: #f7f9fc;
        --surface: #ffffff;
        --surface-elevated: #f2f6fa;
        --border: #dde5ee;
        --border-strong: #c4d0df;
        --text: #172033;
        --muted: #667085;
        --primary: #2563eb;
        --primary-soft: #eaf1ff;
        --accent: #0f766e;
        --accent-soft: #e6f5f3;
        --success: #16a34a;
        --success-soft: #eaf8ef;
        --warning: #d97706;
        --warning-soft: #fff5e6;
        --danger: #dc2626;
        --danger-soft: #fff0f0;
        --radius: 8px;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        --font-sans: Inter, "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        letter-spacing: 0;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        min-height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 7px 11px;
        background: var(--surface);
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          color 0.18s ease,
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }

      button:hover:not(:disabled),
      button.active {
        border-color: var(--primary);
        background: var(--primary-soft);
        color: var(--primary);
      }

      button:active:not(:disabled) {
        transform: translateY(1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }

      button.primary {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      button.primary:hover:not(:disabled) {
        background: #1d4ed8;
        color: #fff;
      }

      button.ghost {
        background: transparent;
      }

      button.danger:hover:not(:disabled) {
        border-color: var(--danger);
        background: var(--danger-soft);
        color: var(--danger);
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
      }

      input,
      select {
        min-height: 36px;
        padding: 7px 10px;
      }

      textarea {
        min-height: 112px;
        padding: 10px 12px;
        line-height: 1.65;
        resize: vertical;
      }

      button:focus-visible,
      .help-tip:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.22);
        outline-offset: 2px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 18px;
        font-weight: 900;
      }

      h2 {
        font-size: 18px;
        font-weight: 900;
      }

      h3 {
        font-size: 15px;
        font-weight: 900;
      }

      p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
      }

      .app {
        min-height: 100vh;
        display: block;
      }

      .subline {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .metric {
        min-width: 88px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 6px 9px;
      }

      .metric strong {
        display: block;
        font-size: 14px;
      }

      .shell {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 14px;
        padding: 14px;
      }

      .sidebar,
      .panel,
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .sidebar {
        position: sticky;
        top: 14px;
        height: calc(100vh - 28px);
        overflow: auto;
        padding: 12px;
      }

      .nav-list {
        display: grid;
        gap: 6px;
      }

      .product-mark {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        padding: 8px 8px 12px;
        border-bottom: 1px solid var(--border);
      }

      .product-logo {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: var(--radius);
        background: var(--text);
        color: #fff;
        font-weight: 900;
      }

      .product-name {
        color: var(--text);
        font-size: 15px;
        font-weight: 900;
        line-height: 1.25;
      }

      .nav-item {
        width: 100%;
        position: relative;
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr);
        align-items: center;
        gap: 9px;
        text-align: left;
        min-height: 48px;
      }

      .nav-icon {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: var(--surface-elevated);
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .nav-item.active .nav-icon {
        background: var(--primary);
        color: #fff;
      }

      .nav-item .subline {
        display: none;
        margin-top: 2px;
      }

      .nav-item:hover .subline,
      .nav-item:focus-visible .subline {
        display: block;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        max-width: 100%;
        min-height: 22px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 8px;
        background: var(--surface-elevated);
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        line-height: 1.35;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge.primary {
        border-color: #bfd2ff;
        background: var(--primary-soft);
        color: var(--primary);
      }

      .badge.success {
        border-color: #bde9cb;
        background: var(--success-soft);
        color: var(--success);
      }

      .badge.warning {
        border-color: #f7d39a;
        background: var(--warning-soft);
        color: var(--warning);
      }

      .badge.danger {
        border-color: #f4b4b4;
        background: var(--danger-soft);
        color: var(--danger);
      }

      .badge.doc-badge {
        max-width: 100%;
        justify-content: flex-start;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .main {
        min-width: 0;
      }

      .page {
        display: none;
      }

      .page.active {
        display: block;
        animation: fadeIn 0.22s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        .page.active {
          animation: none;
        }

        * {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
      }

      .title-line {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
      }

      .field-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .help-tip {
        position: relative;
        width: 24px;
        height: 24px;
        min-height: 24px;
        display: inline-grid;
        place-items: center;
        border-radius: 999px;
        padding: 0;
        border: 1px solid var(--border);
        background: var(--surface-elevated);
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .help-tip::after {
        content: attr(data-tip);
        position: absolute;
        left: 50%;
        top: calc(100% + 8px);
        z-index: 60;
        width: min(360px, 72vw);
        transform: translateX(-50%);
        display: none;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--text);
        color: #fff;
        padding: 8px 10px;
        box-shadow: var(--shadow);
        font-size: 12px;
        font-weight: 600;
        line-height: 1.55;
        text-align: left;
      }

      .help-tip:hover::after,
      .help-tip:focus-visible::after {
        display: block;
      }

      .page-actions,
      .row-actions,
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .grid {
        display: grid;
        gap: 12px;
      }

      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .panel {
        padding: 14px;
        min-width: 0;
      }

      .card {
        padding: 12px;
        min-width: 0;
      }

      .card + .card {
        margin-top: 10px;
      }

      .card.selected {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        min-width: 0;
      }

      .card-title {
        display: block;
        min-width: 0;
        color: var(--text);
        font-size: 14px;
        font-weight: 900;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 9px;
      }

      .muted {
        color: var(--muted);
      }

      .mt-8 {
        margin-top: 8px;
      }

      .mt-10 {
        margin-top: 10px;
      }

      .mt-12 {
        margin-top: 12px;
      }

      .mt-16 {
        margin-top: 16px;
      }

      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 12px;
      }

      .chat-shell {
        min-height: calc(100vh - 176px);
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .message-list {
        min-height: 420px;
        max-height: calc(100vh - 300px);
        overflow: auto;
        padding: 4px;
      }

      .message {
        max-width: 82%;
        margin: 10px 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 12px;
        background: var(--surface);
      }

      .message.user {
        margin-left: auto;
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .message.user p {
        color: #eef4ff;
      }

      .message.tool {
        max-width: 100%;
        background: var(--surface-elevated);
      }

      .composer {
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }

      .composer-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }

      .filters {
        display: grid;
        grid-template-columns: minmax(160px, 1fr) 150px 150px;
        gap: 8px;
      }

      .citation-filters {
        grid-template-columns: minmax(180px, 1fr) minmax(150px, 180px) 150px 150px;
      }

      .list-layout {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 12px;
      }

      .filter-rail {
        align-self: start;
      }

      .filter-group + .filter-group {
        margin-top: 12px;
      }

      .reading-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 12px;
        align-items: start;
      }

      .article {
        line-height: 1.78;
      }

      .article h3 {
        margin-top: 18px;
      }

      .article p {
        color: #334155;
        font-size: 14px;
        line-height: 1.85;
        max-width: 88ch;
      }

      .article blockquote {
        margin: 14px 0;
        border-left: 4px solid var(--primary);
        background: var(--primary-soft);
        padding: 10px 12px;
        color: #1e3a8a;
      }

      .reading-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: start;
        border-bottom: 1px solid var(--border);
        padding-bottom: 14px;
      }

      .reading-meta-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }

      .mini-stat {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-elevated);
        padding: 8px 10px;
      }

      .mini-stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .mini-stat strong {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        color: var(--text);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .reading-section-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 12px;
      }

      .reading-section-card + .reading-section-card {
        margin-top: 10px;
      }

      .section-split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 12px;
        align-items: start;
        margin-top: 10px;
      }

      .analysis-grid {
        display: grid;
        gap: 8px;
      }

      .analysis-item {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-elevated);
        padding: 8px 10px;
      }

      .analysis-item strong {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
      }

      .analysis-item p {
        color: #334155;
        font-size: 12px;
        line-height: 1.6;
      }

      .reading-quote {
        border-left: 3px solid var(--accent);
        background: var(--accent-soft);
        padding: 10px 12px;
        color: #134e4a;
        font-size: 13px;
        line-height: 1.75;
      }

      .assistant-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .assistant-actions .primary {
        grid-column: 1 / -1;
      }

      .answer-grid {
        display: grid;
        gap: 8px;
      }

      .assistant-box {
        position: sticky;
        top: 14px;
      }

      .task-layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }

      .task-rail,
      .task-editor,
      .task-stage-grid,
      .task-stage-side {
        display: grid;
        gap: 12px;
        min-width: 0;
      }

      .task-rail {
        position: sticky;
        top: 14px;
      }

      .task-stage-grid {
        grid-template-columns: minmax(0, 1fr) 320px;
        align-items: start;
      }

      .task-flow {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
        gap: 8px;
      }

      .flow-card {
        width: 100%;
        min-width: 0;
        min-height: 54px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 9px 10px;
        text-align: left;
      }

      .flow-card.active {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      .flow-card.done {
        border-color: #bde9cb;
        background: var(--success-soft);
      }

      .flow-card strong {
        display: block;
        margin-top: 0;
        font-size: 13px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .flow-card p {
        display: none;
        margin-top: 6px;
        color: var(--text);
        font-size: 12px;
        font-weight: 800;
        line-height: 1.35;
      }

      .task-citation-list {
        display: grid;
        gap: 8px;
        max-height: calc(100vh - 330px);
        min-height: 180px;
        overflow: auto;
      }

      .ai-workbench-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .ai-chip {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-elevated);
        padding: 8px 10px;
      }

      .ai-chip span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .ai-chip strong {
        display: block;
        margin-top: 4px;
        overflow: hidden;
        color: var(--text);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .section-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      .section-row .row-actions {
        justify-content: flex-end;
      }

      .draft-section textarea {
        min-height: 150px;
      }

      #taskWorkspace textarea,
      #draftPreview {
        min-height: 220px;
        max-width: 100%;
      }

      #taskWorkspace {
        min-height: 520px;
      }

      .task-stage-side {
        align-content: start;
      }

      .stage-output {
        display: grid;
        gap: 10px;
      }

      .stage-output textarea {
        min-height: 180px;
      }

      .confirm-panel {
        border: 1px solid #bfd2ff;
        border-radius: var(--radius);
        background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
        padding: 12px;
      }

      .confirm-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .confirm-body {
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }

      .confirm-checklist {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .confirm-check {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 8px 10px;
      }

      .confirm-check strong {
        display: block;
        font-size: 12px;
        line-height: 1.35;
      }

      .confirm-check span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .confirmed-output {
        border-color: #bde9cb;
        background: var(--success-soft);
      }

      .confirmed-output p {
        white-space: pre-wrap;
      }

      .empty {
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius);
        padding: 18px;
        background: var(--surface-elevated);
        text-align: center;
      }

      .empty p {
        display: none;
        margin-top: 8px;
      }

      .empty:hover p,
      .empty:focus-within p {
        display: block;
      }

      .statusbar {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 50;
        min-width: 240px;
        max-width: 360px;
        border: 1px solid #bde9cb;
        border-radius: var(--radius);
        background: var(--success-soft);
        color: var(--success);
        box-shadow: var(--shadow);
        padding: 12px 14px;
        font-weight: 800;
        transform: translateY(16px);
        opacity: 0;
        pointer-events: none;
        transition: 0.22s ease;
      }

      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.36);
        padding: 18px;
      }

      .modal-backdrop.show {
        display: flex;
      }

      .modal {
        width: min(620px, 100%);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        padding: 16px;
      }

      .code {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: #0f172a;
        color: #e2e8f0;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.7;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
      }

      @media (max-width: 1380px) {
        .task-layout {
          grid-template-columns: 240px minmax(0, 1fr);
        }

        .task-stage-grid {
          grid-template-columns: minmax(0, 1fr) 300px;
        }
      }

      @media (max-width: 1180px) {
        .shell {
          grid-template-columns: 190px minmax(0, 1fr);
        }

        .task-layout {
          grid-template-columns: 1fr;
        }

        .task-rail {
          position: static;
        }

        .task-stage-grid {
          grid-template-columns: 1fr;
        }

        .task-citation-list {
          max-height: 420px;
        }

        .reading-layout,
        .split {
          grid-template-columns: 1fr;
        }

        .assistant-box {
          position: static;
        }

        .reading-meta-grid,
        .section-split {
          grid-template-columns: 1fr 1fr;
        }

        .ai-workbench-strip {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 900px) {
        .shell {
