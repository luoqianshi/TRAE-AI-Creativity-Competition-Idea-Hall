      const $ = (id) => document.getElementById(id);

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function shortText(value, max = 90) {
        const text = String(value || "").replace(/\s+/g, " ").trim();
        return text.length > max ? `${text.slice(0, max)}...` : text;
      }

      const sectionNameMap = {
        Introduction: "研究背景",
        Method: "方法拆解",
        Experiment: "实验拆解",
        Result: "结果拆解",
        Discussion: "讨论与局限",
      };

      function splitFullText(fullText) {
        return String(fullText || "")
          .split("\n\n")
          .map((part, index) => {
            const [rawHead, ...rest] = part.split(":");
            const hasHead = rest.length > 0;
            const head = hasHead ? rawHead.trim() : `片段 ${index + 1}`;
            const content = hasHead ? rest.join(":").trim() : part.trim();
            return {
              id: `part-${index + 1}`,
              head,
              label: sectionNameMap[head] || head,
              content,
            };
          })
          .filter((part) => part.content);
      }

      function readingSectionInsight(part, item) {
        const text = `${part.head} ${part.content}`;
        if (/method|方法|指标|变量|约束|模型/i.test(text)) {
          return {
            kind: "方法",
            idea: "可转化为研究方法、变量设置或创新点。",
            citation: "适合进入方法章节或实验设计依据。",
            writing: "方法 / 实验",
          };
        }
        if (/experiment|result|实验|结果|比较|指标|seed|随机/i.test(text)) {
          return {
            kind: "实验",
            idea: "可启发对照组、评价指标和结果解释方式。",
            citation: "适合支撑实验设置、结果分析或局限说明。",
            writing: "实验 / 分析",
          };
        }
        if (/discussion|局限|验证|风险|可靠/i.test(text)) {
          return {
            kind: "讨论",
            idea: "可启发论文边界、局限性和后续工作。",
            citation: "适合进入讨论、结论或研究意义部分。",
            writing: "讨论 / 结论",
          };
        }
        return {
          kind: item.type === "data" ? "数据" : "背景",
          idea: "可帮助判断题目背景和研究价值。",
          citation: "适合进入引言或相关工作。",
          writing: "引言 / 相关工作",
        };
      }

      function typeLabel(type) {
        return type === "paper" ? "文献" : type === "method" ? "方法" : type === "data" ? "数据" : "笔记";
      }

      function taskOptionLabel(task) {
        const step = stepDefs.find(([id]) => id === task.step)?.[1] || "写作任务";
        const count = task.citationIds?.length || 0;
        return `${task.title} · ${step} · ${count} 条引用`;
      }

      function showToast(text) {
        const toast = $("toast");
        toast.textContent = text;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
      }

      function setPage(page) {
        state.page = page;
        document.querySelectorAll(".page").forEach((el) => el.classList.toggle("active", el.id === `page-${page}`));
        document.querySelectorAll("[data-page]").forEach((el) => el.classList.toggle("active", el.dataset.page === page));
        if (page === "reading") renderReading();
        if (page === "tasks") renderTasks();
      }

      function filtered(items, search, keys) {
        const query = (search || state.query || "").trim().toLowerCase();
        if (!query) return items;
        return items.filter((item) => keys.map((key) => item[key] || "").join(" ").toLowerCase().includes(query));
      }

      function appendMessage(role, text) {
        state.messages.push({ role, text });
        renderChat();
      }

      function makeKnowledgeFromText(text) {
        const now = Date.now();
        return [
          {
            id: `pk_${now}`,
            type: "paper",
            title: text.includes("低样本") ? "Low-sample Explainable Prediction Survey" : "Research Evidence for AI-assisted Scientific Writing",
            summary: `围绕“${text.slice(0, 42)}”检索到的候选资料，适合先进入知识库，再通过精读判断是否沉淀到启发库或引用库。`,
            source: "AI 检索模拟",
            tags: ["候选文献", "AI 推荐"],
            status: "待入库",
            fullText: `Introduction: 该资料围绕用户提出的问题展开，提供背景、方法和实验线索。\n\nMethod: 可提取研究角度、变量设置和评价指标。\n\nResult: 当前内容需要用户确认后进入知识库，再通过精读形成启发或引用。`,
          },
          {
            id: `pk_${now + 1}`,
            type: "method",
            title: "可复现实验与引用证据整理方法",
            summary: "建议把选题启发和写作引用分开管理，避免把所有文章都直接当作正式引用。",
            source: "AI 方法建议",
            tags: ["启发库", "引用库", "实验"],
            status: "待入库",
            fullText: "启发库用于想题目，引用库用于写论文。启发内容转入引用库前，应确认引用理由、来源片段、适用章节和证据状态。",
          },
        ];
      }

      function sendMessage() {
        const text = $("chatInput").value.trim();
        if (!text) return;
        appendMessage("user", text);
        $("chatInput").value = "";
        $("aiStatus").textContent = "AI 检索中";
        window.setTimeout(() => {
          const cards = makeKnowledgeFromText(text);
          state.pendingKnowledge.unshift(...cards);
          appendMessage("ai", `我找到 ${cards.length} 条候选资料。建议先添加到知识库，再进入精读页判断哪些内容进入启发库或引用库。`);
          $("aiStatus").textContent = "AI 就绪";
          renderAll();
        }, 260);
      }

      function renderChat() {
        $("messageList").innerHTML = state.messages
          .map((message) => `<div class="message ${message.role}"><p>${escapeHtml(message.text)}</p></div>`)
          .join("");
        if (state.pendingKnowledge.length) {
          $("messageList").innerHTML += `<div class="message tool"><strong>资料结果卡</strong><div class="mt-10">${state.pendingKnowledge.map(renderPendingKnowledgeCard).join("")}</div></div>`;
        }
        $("messageList").scrollTop = $("messageList").scrollHeight;
      }

      function renderPendingKnowledgeCard(item) {
        return `
          <article class="card">
            <div class="card-head">
              <div>
                <span class="card-title">${escapeHtml(item.title)}</span>
                <p>${escapeHtml(item.summary)}</p>
              </div>
              <span class="badge warning">待入库</span>
            </div>
            <div class="meta">
              <span class="badge">${escapeHtml(item.source)}</span>
              ${item.tags.map((tag) => `<span class="badge">${escapeHtml(tag)}</span>`).join("")}
            </div>
            <div class="row-actions mt-10">
              <button class="primary" data-save-knowledge="${item.id}" type="button">添加到知识库</button>
              <button data-drop-pending="${item.id}" type="button">忽略</button>
            </div>
          </article>
        `;
      }

      function savePendingKnowledge(id) {
        const item = state.pendingKnowledge.find((entry) => entry.id === id);
        if (!item) return;
        state.pendingKnowledge = state.pendingKnowledge.filter((entry) => entry.id !== id);
        state.knowledge.unshift({ ...item, id: item.id.replace("pk_", "k_"), status: "未精读" });
        showToast("已添加到知识库");
        renderAll();
      }

      function addManualKnowledge() {
        const text = $("chatInput").value.trim();
        if (!text) return;
        state.knowledge.unshift({
          id: `k_${Date.now()}`,
          type: "note",
          title: `用户笔记：${text.slice(0, 22)}`,
          summary: text,
          source: "用户手动输入",
          tags: ["用户笔记"],
          status: "未精读",
          fullText: text,
        });
        $("chatInput").value = "";
        showToast("用户输入已加入知识库");
        renderAll();
      }

      function seedKnowledge() {
        state.pendingKnowledge.unshift(...makeKnowledgeFromText("低样本可解释 DTA 的选题与实验设计"));
        showToast("已生成示例候选资料");
        setPage("chat");
        renderAll();
      }

      function renderKnowledge() {
        const search = $("knowledgeSearch")?.value || "";
        const type = $("knowledgeType")?.value || "all";
        const status = $("knowledgeStatus")?.value || "all";
        let items = filtered(state.knowledge, search, ["title", "summary", "source"]);
        items = items.filter((item) => (type === "all" || item.type === type) && (status === "all" || item.status === status));
        $("knowledgeList").innerHTML = items.length
          ? items.map(renderKnowledgeCard).join("")
          : `<div class="empty"><strong>没有匹配的知识库资料</strong><p>尝试清除筛选，或回到 AI 对话页继续找资料。</p></div>`;
        renderReadingSelect();
      }

      function renderKnowledgeCard(item) {
        return `
          <article class="card ${item.id === state.selectedKnowledgeId ? "selected" : ""}">
            <div class="card-head">
              <div>
                <span class="card-title">${escapeHtml(item.title)}</span>
                <p>${escapeHtml(item.summary)}</p>
              </div>
              <span class="badge ${item.status.includes("引用") ? "success" : item.status.includes("启发") ? "warning" : ""}">${escapeHtml(item.status)}</span>
            </div>
            <div class="meta">
              <span class="badge">${escapeHtml(item.source)}</span>
              ${item.tags.map((tag) => `<span class="badge">${escapeHtml(tag)}</span>`).join("")}
            </div>
            <div class="row-actions mt-10">
              <button class="primary" data-read="${item.id}" type="button">进入精读</button>
              <button data-add-idea="${item.id}" type="button">添加到启发库</button>
              <button data-add-citation="${item.id}" type="button">加入引用库</button>
            </div>
          </article>
        `;
      }

      function renderReadingSelect() {
        $("readingSelect").innerHTML = state.knowledge.map((item) => `<option value="${item.id}" ${item.id === state.selectedKnowledgeId ? "selected" : ""}>${escapeHtml(item.title)}</option>`).join("");
      }

      function currentKnowledge() {
        return state.knowledge.find((item) => item.id === state.selectedKnowledgeId) || state.knowledge[0];
      }

      function renderReading() {
        renderReadingSelect();
        const item = currentKnowledge();
        if (!item) {
          $("articlePanel").innerHTML = `<div class="empty"><strong>暂无可精读资料</strong><p>请先在 AI 对话页添加资料到知识库。</p></div>`;
          $("readingAnswer").innerHTML = "";
          $("readingAnswer").dataset.knowledgeId = "";
          return;
        }
        const parts = splitFullText(item.fullText);
        const wordCount = item.fullText.length;
        const firstInsight = readingSectionInsight(parts[0] || { head: "", content: "" }, item);
        $("articlePanel").innerHTML = `
          <div class="reading-hero">
            <div>
              <h2>${escapeHtml(item.title)}</h2>
              <p>${escapeHtml(item.summary)}</p>
            </div>
            <span class="badge primary">${escapeHtml(item.source)}</span>
          </div>
          <div class="meta">
            ${item.tags.map((tag) => `<span class="badge">${escapeHtml(tag)}</span>`).join("")}
            <span class="badge">${escapeHtml(item.status)}</span>
          </div>
          <div class="reading-meta-grid">
            <div class="mini-stat"><span>资料类型</span><strong>${escapeHtml(typeLabel(item.type))}</strong></div>
            <div class="mini-stat"><span>拆解段落</span><strong>${parts.length} 段</strong></div>
            <div class="mini-stat"><span>全文长度</span><strong>${wordCount} 字符</strong></div>
            <div class="mini-stat"><span>优先用途</span><strong>${escapeHtml(firstInsight.writing)}</strong></div>
          </div>
          <div class="title-line mt-12">
            <h3>分段拆解</h3>
            <button class="help-tip" data-tip="每段拆成核心内容、启发价值、引用价值和写作用途。启发进入启发库；正式写作依据进入引用库。" type="button">?</button>
          </div>
          <div class="mt-10">
            ${parts.map(renderReadingSection).join("")}
          </div>
        `;
        $("readingAiHelp").dataset.tip = `当前精读：「${item.title}」。AI 会围绕全文提炼选题启发和引用证据。`;
        if ($("readingAnswer").dataset.knowledgeId !== item.id || !$("readingAnswer").innerHTML.trim()) {
          $("readingAnswer").innerHTML = renderReadingDefaultAnswer(item, parts);
          $("readingAnswer").dataset.knowledgeId = item.id;
        }
      }

      function renderReadingSection(part) {
        const item = currentKnowledge();
        const insight = readingSectionInsight(part, item);
        return `
          <section class="reading-section-card">
            <div class="card-head">
              <div class="title-line">
                <span class="badge primary">${escapeHtml(insight.kind)}</span>
                <h3>${escapeHtml(part.label)}</h3>
              </div>
              <span class="badge">${escapeHtml(insight.writing)}</span>
            </div>
            <div class="section-split">
              <div>
                <p class="reading-quote">${escapeHtml(part.content)}</p>
              </div>
              <div class="analysis-grid">
                <div class="analysis-item">
                  <strong>核心内容</strong>
                  <p>${escapeHtml(shortText(part.content, 72))}</p>
                </div>
                <div class="analysis-item">
                  <strong>启发价值</strong>
                  <p>${escapeHtml(insight.idea)}</p>
                </div>
                <div class="analysis-item">
                  <strong>引用价值</strong>
                  <p>${escapeHtml(insight.citation)}</p>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function renderReadingDefaultAnswer(item, parts = splitFullText(item.fullText)) {
        const methodPart = parts.find((part) => /method|方法/i.test(part.head)) || parts[0];
        const experimentPart = parts.find((part) => /experiment|result|实验|结果/i.test(part.head)) || parts[1] || parts[0];
        const discussionPart = parts.find((part) => /discussion|讨论|局限/i.test(part.head)) || parts[parts.length - 1];
        return `
          <div class="answer-grid">
            <article class="analysis-item">
              <strong>题目启发</strong>
              <p>${escapeHtml(item.tags[0] || "研究问题")} 可以作为选题切入点，重点看是否能形成明确变量和实验验证。</p>
            </article>
            <article class="analysis-item">
              <strong>可入启发库</strong>
              <p>${escapeHtml(shortText(discussionPart?.content || item.summary, 86))}</p>
            </article>
            <article class="analysis-item">
              <strong>可入引用库</strong>
              <p>${escapeHtml(shortText(methodPart?.content || experimentPart?.content || item.summary, 86))}</p>
            </article>
          </div>
        `;
      }

      function markRead() {
        const item = currentKnowledge();
        if (!item) return;
        item.status = "已精读";
        showToast("已标记为精读");
        renderAll();
      }

      function askReading() {
        const item = currentKnowledge();
        if (!item) return;
        const q = $("readingQuestion").value.trim() || "请提炼启发和可引用证据";
        const parts = splitFullText(item.fullText);
        const methodPart = parts.find((part) => /method|方法/i.test(part.head)) || parts[0];
        const experimentPart = parts.find((part) => /experiment|result|实验|结果/i.test(part.head)) || parts[1] || parts[0];
        const discussionPart = parts.find((part) => /discussion|讨论|局限/i.test(part.head)) || parts[parts.length - 1];
        $("readingAnswer").innerHTML = `
          <div class="answer-grid">
            <article class="analysis-item">
              <strong>问题</strong>
              <p>${escapeHtml(q)}</p>
            </article>
            <article class="analysis-item">
              <strong>选题启发</strong>
              <p>围绕「${escapeHtml(item.tags[0] || "研究问题")}」形成题目，优先保留能解释研究价值和创新角度的段落。</p>
            </article>
            <article class="analysis-item">
              <strong>实验线索</strong>
              <p>${escapeHtml(shortText(experimentPart?.content || item.summary, 92))}</p>
            </article>
            <article class="analysis-item">
              <strong>引用候选</strong>
              <p>${escapeHtml(shortText(methodPart?.content || discussionPart?.content || item.summary, 92))}</p>
            </article>
          </div>
        `;
        $("readingAnswer").dataset.knowledgeId = item.id;
      }

      function createIdeaFromKnowledge(knowledgeId) {
        const item = state.knowledge.find((entry) => entry.id === knowledgeId);
        if (!item) return;
        const exists = state.inspirations.find((idea) => idea.knowledgeId === knowledgeId);
        if (exists) {
          showToast("启发库中已存在该资料");
          return;
        }
        state.inspirations.unshift({
          id: `i_${Date.now()}`,
          knowledgeId,
          title: `启发：${item.title}`,
          summary: item.summary,
          quote: item.fullText.split("\n")[0].slice(0, 120),
          reason: "该内容可以帮助形成研究角度、创新点或论文题目。",
          direction: item.tags.join("、"),
          type: item.type === "data" ? "数据线索" : item.type === "method" ? "方法启发" : "研究角度",
          status: "已确认",
        });
        item.status = "已加入启发库";
        showToast("已添加到启发库");
        renderAll();
      }

      function openCitationModal(sourceType, id) {
        state.pendingCitationSource = { sourceType, id };
        const source = sourceType === "idea" ? state.inspirations.find((item) => item.id === id) : state.knowledge.find((item) => item.id === id);
        if (!source) return;
        $("modalTitle").textContent = "确认加入引用库";
        $("modalHelp").dataset.tip = `来源：${source.title}。加入前需要确认引用理由、来源片段和适用章节。`;
        $("modalReason").value = sourceType === "idea" ? source.reason : "该资料可作为论文写作、实验设计或结果分析的引用依据。";
        renderModalTaskOptions();
        $("confirmModal").classList.add("show");
      }

      function renderModalTaskOptions() {
        if (!state.tasks.length) createBlankTask(false);
        const currentId = state.selectedTaskId || state.tasks[0]?.id || "";
        $("modalTask").innerHTML = state.tasks
          .map((task) => `<option value="${task.id}" ${task.id === currentId ? "selected" : ""}>${escapeHtml(taskOptionLabel(task))}</option>`)
          .join("");
      }

      function confirmAddCitation() {
        const source = state.pendingCitationSource;
        if (!source) return;
        const idea = source.sourceType === "idea" ? state.inspirations.find((item) => item.id === source.id) : null;
        const knowledge = idea ? state.knowledge.find((item) => item.id === idea.knowledgeId) : state.knowledge.find((item) => item.id === source.id);
        const base = idea || knowledge;
        if (!base || !knowledge) return;
        const citationId = `c_${Date.now()}`;
        const targetTaskId = $("modalTask").value;
        if (!targetTaskId) {
          showToast("请选择归属文章文档");
          return;
        }
        state.citations.unshift({
          id: citationId,
          inspirationId: idea?.id || "",
          knowledgeId: knowledge.id,
          taskId: targetTaskId,
          title: idea ? idea.title.replace(/^启发：/, "引用：") : `引用：${knowledge.title}`,
          summary: base.summary,
          quote: idea?.quote || knowledge.fullText.split("\n")[0].slice(0, 140),
          reason: $("modalReason").value.trim() || "作为论文写作依据。",
          chapter: $("modalChapter").value,
          evidence: $("modalEvidence").value,
          status: "已确认",
        });
        const task = state.tasks.find((item) => item.id === targetTaskId);
        if (task && !task.citationIds.includes(citationId)) task.citationIds.push(citationId);
        state.selectedTaskId = targetTaskId || state.selectedTaskId;
        if (idea) idea.status = "已转入引用库";
        knowledge.status = "已加入引用库";
        $("confirmModal").classList.remove("show");
        state.pendingCitationSource = null;
        showToast("已加入所选文章文档");
        renderAll();
      }

      function renderIdeas() {
        const search = $("ideaSearch")?.value || "";
        const type = $("ideaType")?.value || "all";
        const status = $("ideaStatus")?.value || "all";
        let items = filtered(state.inspirations, search, ["title", "summary", "reason", "direction"]);
        items = items.filter((item) => (type === "all" || item.type === type) && (status === "all" || item.status === status));
        $("ideaList").innerHTML = items.length
          ? items.map(renderIdeaCard).join("")
          : `<div class="empty"><strong>启发库为空</strong><p>从精读页或知识库添加能帮助选题的 idea。</p></div>`;
      }

      function renderIdeaCard(item) {
        return `
          <article class="card">
            <div class="card-head">
              <span class="card-title">${escapeHtml(item.title)}</span>
              <span class="badge ${item.status.includes("转入") ? "success" : "warning"}">${escapeHtml(item.status)}</span>
            </div>
            <p class="mt-8">${escapeHtml(item.summary)}</p>
            <p class="mt-8"><strong>启发理由：</strong>${escapeHtml(item.reason)}</p>
            <div class="meta">
              <span class="badge">${escapeHtml(item.type)}</span>
              <span class="badge">${escapeHtml(item.direction)}</span>
            </div>
            <div class="row-actions mt-10">
              <button class="primary" data-idea-to-citation="${item.id}" type="button">一键加入引用库</button>
              <button data-use-idea-topic="${item.id}" type="button">用于选题</button>
            </div>
          </article>
        `;
      }

      function renderCitations() {
        renderCitationTaskOptions();
        const search = $("citationSearch")?.value || "";
        const taskId = $("citationTask")?.value || "all";
        const chapter = $("citationChapter")?.value || "all";
        const status = $("citationStatus")?.value || "all";
        let items = filtered(state.citations, search, ["title", "summary", "reason", "chapter"]);
        items = items.filter((item) => (taskId === "all" || item.taskId === taskId) && (chapter === "all" || item.chapter === chapter) && (status === "all" || item.evidence === status));
        $("citationList").innerHTML = items.length
          ? items.map(renderCitationCard).join("")
          : `<div class="empty"><strong>引用库为空</strong><p>从启发库一键加入，或在精读页直接加入可写作调用的证据。</p></div>`;
      }

      function renderCitationTaskOptions() {
        const select = $("citationTask");
        if (!select) return;
        const previous = select.value || "all";
        const options = [
          `<option value="all">全部文章文档</option>`,
          ...state.tasks.map((task) => `<option value="${task.id}">${escapeHtml(taskOptionLabel(task))}</option>`),
        ];
        select.innerHTML = options.join("");
        select.value = state.tasks.some((task) => task.id === previous) ? previous : "all";
      }

      function renderCitationCard(item) {
        const task = state.tasks.find((entry) => entry.id === item.taskId);
        const taskTitle = task?.title || "未绑定文档";
        return `
          <article class="card">
            <div class="card-head">
              <span class="card-title">${escapeHtml(item.title)}</span>
              <span class="badge success">${escapeHtml(item.status)}</span>
            </div>
            <p class="mt-8">${escapeHtml(item.summary)}</p>
            <p class="mt-8"><strong>原文片段：</strong>${escapeHtml(item.quote)}</p>
            <p class="mt-8"><strong>引用理由：</strong>${escapeHtml(item.reason)}</p>
            <div class="meta">
              <span class="badge doc-badge" title="${escapeHtml(taskTitle)}">${escapeHtml(`文档：${taskTitle}`)}</span>
              <span class="badge primary">${escapeHtml(item.chapter)}</span>
              <span class="badge warning">${escapeHtml(item.evidence)}</span>
            </div>
          </article>
        `;
      }

      function generateTopics() {
        const ideas = state.inspirations.length ? state.inspirations : [];
        const seed = ideas[0]?.direction || "解释稳定性、低样本、可复现实验";
        state.topics = [
          {
            id: `t_${Date.now()}`,
            title: `基于${seed.split("、")[0]}的低样本 DTA 可解释性评估研究`,
            reason: "启发库已经包含研究角度和方法线索，适合形成可实验的理科论文题目。",
            supportIds: ideas.slice(0, 2).map((item) => item.id),
            candidateIdeaIds: ideas.slice(0, 2).map((item) => item.id),
            difficulty: "中",
            risk: "需要补充实验数据和多随机种子验证。",
          },
          {
            id: `t_${Date.now() + 1}`,
            title: "面向可复现实验的解释稳定性指标组合方法",
            reason: "题目聚焦评价指标，实验范围较清晰。",
            supportIds: ideas.slice(0, 1).map((item) => item.id),
            candidateIdeaIds: ideas.slice(0, 1).map((item) => item.id),
            difficulty: "低",
            risk: "创新点可能偏指标整理，需要方法改进支撑。",
          },
        ];
        state.selectedTopicId = state.topics[0].id;
        $("createTaskFromTopicButton").disabled = false;
        showToast("已生成候选标题");
        renderTopics();
      }

      function renderTopics() {
        $("topicList").innerHTML = state.topics.length
          ? state.topics.map(renderTopicCard).join("")
          : `<div class="empty"><strong>还没有候选标题</strong><p>先积累启发库内容，再点击“生成候选标题”。</p></div>`;
        $("topicSupport").innerHTML = state.inspirations.length
          ? state.inspirations.slice(0, 5).map((idea) => `<article class="card"><span class="card-title">${escapeHtml(idea.title)}</span><p>${escapeHtml(idea.reason)}</p></article>`).join("")
          : `<div class="empty"><strong>启发库为空</strong><p>选题页需要启发库内容作为支撑。</p></div>`;
      }

      function renderTopicCard(topic) {
        return `
          <article class="card ${topic.id === state.selectedTopicId ? "selected" : ""}">
            <div class="card-head">
              <span class="card-title">${escapeHtml(topic.title)}</span>
              <span class="badge warning">难度${escapeHtml(topic.difficulty)}</span>
            </div>
            <p class="mt-8">${escapeHtml(topic.reason)}</p>
            <p class="mt-8"><strong>风险：</strong>${escapeHtml(topic.risk)}</p>
            <div class="row-actions mt-10">
              <button class="primary" data-select-topic="${topic.id}" type="button">选择这个标题</button>
              <button data-topic-ideas-to-citation="${topic.id}" type="button">支撑启发转引用库</button>
            </div>
          </article>
        `;
      }

      function selectTopic(id) {
        state.selectedTopicId = id;
        $("createTaskFromTopicButton").disabled = false;
        showToast("已选择论文标题");
        renderTopics();
      }

      function selectedTopic() {
        return state.topics.find((topic) => topic.id === state.selectedTopicId);
      }

      function createTaskFromTopic() {
        const topic = selectedTopic();
        if (!topic) return;
        const id = `task_${Date.now()}`;
        state.tasks.unshift({
          id,
          title: topic.title,
          status: "进行中",
          step: "abstract",
          citationIds: [],
          sections: [],
          experimentLog: "",
          analysis: "",
        });
        state.selectedTaskId = id;
        showToast("已创建论文任务");
        setPage("tasks");
        renderAll();
      }

      function topicIdeasToCitation(topicId) {
        const topic = state.topics.find((item) => item.id === topicId);
        const ideaId = topic?.candidateIdeaIds[0];
        if (ideaId) openCitationModal("idea", ideaId);
      }

      function currentTask() {
        return state.tasks.find((task) => task.id === state.selectedTaskId) || state.tasks[0];
      }

      function citationsForTask(task) {
        if (!task) return [];
        return state.citations.filter((item) => task.citationIds?.includes(item.id));
      }


      function taskStepMeta(step) {
        const meta = {
          abstract: {
            title: "摘要草稿",
            badge: "待确认摘要",
            help: "确认摘要是否准确限定研究问题、引用依据和预期贡献，确认后进入实验代码阶段。",
            confirm: "确认摘要并进入实验代码",
            checks: [
              ["研究范围", "是否紧扣当前论文题目"],
              ["引用依据", "是否只使用已加入任务的引用"],
              ["结论边界", "是否避免未验证的强结论"],
            ],
          },
          experiment: {
            title: "实验方案与代码草案",
            badge: "待确认代码",
            help: "确认实验目标、指标、对照组和代码骨架是否能支撑论文写作，确认后进入结果分析阶段。",
            confirm: "确认实验代码并进入分析",
            checks: [
              ["变量指标", "是否包含主要指标和对照组"],
              ["可复现性", "是否标注随机种子与配置"],
              ["写作价值", "是否能写入方法和实验章节"],
            ],
          },
          analysis: {
            title: "实验分析结论",
            badge: "待确认分析",
            help: "确认分析是否区分趋势、异常点和局限性，确认后用于生成论文初稿。",
            confirm: "确认分析并进入初稿",
            checks: [
              ["结果解释", "是否对应实验指标"],
              ["异常说明", "是否指出不稳定或不足"],
              ["论文可用", "是否能进入实验分析章节"],
            ],
          },
        };
        return meta[step] || meta.abstract;
      }

      function renderConfirmPanel({ step, textareaId, value, actionLabel, extraHtml = "" }) {
        const meta = taskStepMeta(step);
        const checks = meta.checks
          .map(([label, text]) => `<div class="confirm-check"><strong>${escapeHtml(label)}</strong><span>${escapeHtml(text)}</span></div>`)
          .join("");
        return `
          <section class="confirm-panel">
            <div class="confirm-head">
              <div>
                <div class="title-line">
                  <h3>待确认 AI 输出：${escapeHtml(meta.title)}</h3>
                  <span class="badge warning">${escapeHtml(meta.badge)}</span>
                </div>
                <p class="mt-8">${escapeHtml(meta.help)}</p>
              </div>
              <span class="badge primary">人工确认后推进</span>
            </div>
            <div class="confirm-body">
              <div class="confirm-checklist">${checks}</div>
              <textarea id="${textareaId}" aria-label="${escapeHtml(meta.title)}">${escapeHtml(value)}</textarea>
              ${extraHtml}
              <div class="row-actions">
                <button class="primary" data-generate-step="${step}" type="button">${escapeHtml(actionLabel || meta.confirm)}</button>
              </div>
            </div>
          </section>
        `;
      }

      function confirmedTaskOutputs(task) {
        const outputs = [];
        if (task?.abstract) outputs.push({ title: "摘要", content: task.abstract, badge: "已确认" });
        if (task?.experimentLog) outputs.push({ title: "实验代码方案", content: task.experimentLog, badge: "已确认" });
        if (task?.analysis) outputs.push({ title: "实验分析", content: task.analysis, badge: "已确认" });
        if (task?.sections?.length) outputs.push({ title: "论文初稿", content: `已生成 ${task.sections.length} 个章节，可继续调序和编辑。`, badge: "已生成" });
        return outputs;
      }

      function renderConfirmedOutputs(task, limit = 150) {
        const outputs = confirmedTaskOutputs(task);
        if (!outputs.length) {
          return `<div class="empty"><strong>暂无已确认产物</strong><p>完成当前 AI 输出确认后，这里会保留阶段产物。</p></div>`;
        }
        return outputs
          .map(
            (item) => `
              <article class="analysis-item confirmed-output">
                <div class="card-head">
                  <strong>${escapeHtml(item.title)}</strong>
                  <span class="badge success">${escapeHtml(item.badge)}</span>
                </div>
                <p>${escapeHtml(shortText(item.content, limit))}</p>
              </article>
            `,
          )
          .join("");
      }
      function createBlankTask(render = true) {
        const id = `task_${Date.now()}`;
        state.tasks.unshift({
          id,
          title: selectedTopic()?.title || "新的论文任务",
          status: "进行中",
          step: "abstract",
          citationIds: [],
          sections: [],
          experimentLog: "",
          analysis: "",
        });
        state.selectedTaskId = id;
        if (render) {
          renderTasks();
          renderMetrics();
        }
      }

      function renderTasks() {
        if (!state.tasks.length) {
          $("taskList").innerHTML = `<div class="empty"><strong>暂无论文任务</strong><p>从选题页创建，或手动新建任务。</p></div>`;
          $("taskAiContext").innerHTML = "";
          $("taskFlowOverview").innerHTML = "";
          $("taskWorkspace").innerHTML = `<div class="empty"><strong>请选择或创建任务</strong></div>`;
          $("taskStageSide").innerHTML = "";
          return;
        }
        if (!state.selectedTaskId) state.selectedTaskId = state.tasks[0].id;
        const task = currentTask();
        $("taskList").innerHTML = state.tasks
          .map(
            (item) => `
              <article class="card ${item.id === task.id ? "selected" : ""}">
                <span class="card-title">${escapeHtml(item.title)}</span>
                <div class="meta"><span class="badge primary">${stepDefs.find(([id]) => id === item.step)?.[1] || "任务"}</span><span class="badge">${escapeHtml(item.status)}</span><span class="badge">${item.citationIds?.length || 0} 引用</span></div>
                <button class="mt-10" data-select-task="${item.id}" type="button">切换任务</button>
              </article>
            `,
          )
          .join("");
        renderTaskAiContext(task);
        renderTaskFlowOverview(task);
        renderTaskWorkspace(task);
        renderTaskStageSide(task);
      }

      function renderTaskAiContext(task) {
        const citations = citationsForTask(task);
        $("taskAiContext").innerHTML = `
          <div class="ai-chip"><span>当前论文</span><strong title="${escapeHtml(task.title)}">${escapeHtml(task.title)}</strong></div>
          <div class="ai-chip"><span>AI 调用引用</span><strong>${citations.length} 条</strong></div>
          <div class="ai-chip"><span>当前阶段</span><strong>${escapeHtml(stepDefs.find(([id]) => id === task.step)?.[1] || "AI 写作")}</strong></div>
        `;
      }

      function renderTaskCitationPool(task) {
        if (!state.citations.length) {
          return `<div class="empty"><strong>引用库为空</strong><p>先从精读页或启发库添加引用。</p></div>`;
        }
        return state.citations
          .map((item) => {
            const linked = task.citationIds?.includes(item.id);
            const owner = state.tasks.find((entry) => entry.citationIds?.includes(item.id));
            return `
              <article class="card">
                <div class="card-head">
                  <span class="card-title">${escapeHtml(shortText(item.title, 34))}</span>
                  <span class="badge ${linked ? "success" : "warning"}">${linked ? "已加入" : "未加入"}</span>
                </div>
                <p class="mt-8">${escapeHtml(shortText(item.reason || item.summary, 76))}</p>
                <div class="meta">
                  <span class="badge primary">${escapeHtml(item.chapter)}</span>
                  <span class="badge">${escapeHtml(owner?.id === task.id ? "当前任务" : owner?.title || "未绑定任务")}</span>
                </div>
                <div class="row-actions mt-8">
                  ${
                    linked
                      ? `<button class="danger" data-remove-task-citation="${item.id}" type="button">移出任务</button>`
                      : `<button class="primary" data-add-task-citation="${item.id}" type="button">加入当前任务</button>`
                  }
                </div>
              </article>
            `;
          })
          .join("");
      }

      function renderTaskStageSide(task) {
        const confirmedHtml = renderConfirmedOutputs(task);
        const citationStages = ["abstract", "experiment"];
        if (citationStages.includes(task.step)) {
          $("taskStageSide").innerHTML = `
            <div class="title-line">
              <h3>本阶段引用</h3>
              <button class="help-tip" data-tip="只在需要引用输入的阶段显示引用库，选择后当前任务会调用这些内容。" type="button">?</button>
            </div>
            <div class="mt-10 task-citation-list">${renderTaskCitationPool(task)}</div>
            <div class="title-line mt-12">
              <h3>已确认阶段产物</h3>
              <span class="badge success">留痕</span>
            </div>
            <div class="analysis-grid mt-10">${confirmedHtml}</div>
          `;
          return;
        }
        if (task.step === "draft" || task.step === "export") {
          $("taskStageSide").innerHTML = `
            <h3>${task.step === "draft" ? "AI 初稿结构" : "调序与预览"}</h3>
            <div class="mt-10" id="draftSections"></div>
            <textarea class="mt-10" id="draftPreview" placeholder="完成到初稿阶段后显示。"></textarea>
          `;
          renderDraftSections(task);
          return;
        }
        $("taskStageSide").innerHTML = `
          <div class="title-line">
            <h3>已确认阶段产物</h3>
            <span class="badge success">可追溯</span>
          </div>
          <div class="analysis-grid mt-10">${confirmedHtml}</div>
        `;
      }

      function renderTaskFlowOverview(task) {
        const activeIndex = stepDefs.findIndex(([id]) => id === task.step);
        const citations = citationsForTask(task);
        const flowData = {
          abstract: {
            status: task.abstract ? "已生成" : "待生成",
            metric: citations.length ? `${citations.length} 条引用` : "缺引用",
            tip: task.abstract || "AI 读取当前文章文档的引用库，辅助生成摘要草稿。",
          },
          experiment: {
            status: task.experimentLog ? "已有代码" : "待生成",
            metric: task.experimentLog ? `${task.experimentLog.length} 字` : "0 字",
            tip: task.experimentLog || "AI 根据当前任务的引用库内容，生成实验方案、代码实现骨架和运行指标。",
          },
          analysis: {
            status: task.analysis ? "已有分析" : "待分析",
            metric: task.analysis ? `${task.analysis.length} 字` : "0 字",
            tip: task.analysis || "AI 根据实验代码方案和后续运行结果，分析规律、异常点和局限。",
          },
          draft: {
            status: task.sections?.length ? "已有初稿" : "待生成",
            metric: task.sections?.length ? `${task.sections.length} 章` : "0 章",
            tip: task.sections?.length ? `已生成 ${task.sections.length} 个章节，可在下方调整顺序。` : "AI 汇总摘要、引用库、实验代码方案和分析结果生成正文。",
          },
          export: {
            status: task.sections?.length ? "可导出" : "未就绪",
            metric: task.sections?.length ? "MD" : "未就绪",
            tip: task.sections?.length ? "Markdown 导出已就绪，导出前可继续编辑章节。" : "生成初稿后才可导出。",
          },
        };
        $("taskFlowOverview").innerHTML = stepDefs
          .map(([id, label], index) => {
            const item = flowData[id];
            const cls = index < activeIndex ? "done" : id === task.step ? "active" : "";
            return `
              <button class="flow-card ${cls}" data-task-step="${id}" type="button">
                <strong>${index + 1}. ${escapeHtml(label)}</strong>
                <span class="badge ${index < activeIndex ? "success" : id === task.step ? "primary" : ""}">${escapeHtml(item.status)}</span>
                <p>${escapeHtml(item.metric)}</p>
              </button>
            `;
          })
          .join("");
      }

      function renderTaskWorkspace(task) {
        const citations = citationsForTask(task);
        const citationText = citations.map((item) => `- ${item.title}：${item.reason}`).join("\n") || "- 暂无引用库内容，请先从启发库加入引用库。";
        const experimentCode = `<pre class="code"># AI 根据引用库生成的实验代码草案
EXPERIMENT_CONFIG = {
    "seeds": [1, 7, 42],
    "metrics": ["RMSE", "CI", "AUC", "stability_overlap"],
    "groups": ["baseline", "method", "ablation"],
}

def run_experiment(config, dataset):
    results = []
    for seed in config["seeds"]:
        for group in config["groups"]:
            model = build_model(group=group, seed=seed)
            train(model, dataset.train)
            metrics = evaluate(model, dataset.test, config["metrics"])
            results.append({"seed": seed, "group": group, **metrics})
    return results</pre>`;
        const views = {
          abstract: `
            <div class="title-line">
              <h3>步骤 1：AI 生成摘要</h3>
              <button class="help-tip" data-tip="AI 只调用当前论文任务绑定的引用库，围绕题目生成摘要草稿，用户确认后进入实验代码阶段。" type="button">?</button>
            </div>
            <div class="mt-10">
              ${renderConfirmPanel({
                step: "abstract",
                textareaId: "abstractInput",
                value: task.abstract || `AI 输入依据：\n论文题目：${task.title}\n引用库文章：\n${citationText}\n\nAI 摘要草稿：`,
              })}
            </div>
          `,
          experiment: `
            <div class="title-line">
              <h3>步骤 2：AI 生成实验代码</h3>
              <button class="help-tip" data-tip="AI 根据当前任务的引用库文章提取方法、变量、指标和对照组，生成实验方案与代码实现草案。" type="button">?</button>
            </div>
            <div class="mt-10">
              ${renderConfirmPanel({
                step: "experiment",
                textareaId: "experimentInput",
                value:
                  task.experimentLog ||
                  `实验目标：验证「${task.title}」。\n引用库依据：\n${citationText}\n\nAI 生成实验方案：\n1. 从引用库提取变量、指标和对照组。\n2. 生成 baseline、改进方法、消融实验的代码骨架。\n3. 输出可复现实验配置、日志字段和结果表结构。\n\n代码实现草案：`,
                extraHtml: experimentCode,
              })}
            </div>
          `,
          analysis: `
            <div class="title-line">
              <h3>步骤 3：AI 分析实验结果</h3>
              <button class="help-tip" data-tip="AI 根据实验代码方案、运行日志和结果表，分析趋势、异常点、局限性和可写入论文的结论。" type="button">?</button>
            </div>
            <div class="mt-10">
              ${renderConfirmPanel({
                step: "analysis",
                textareaId: "analysisInput",
                value: task.analysis || `AI 输入依据：\n实验代码方案：\n${task.experimentLog || "等待上一步生成实验代码方案。"}\n\n运行日志 / 结果表：\n\nAI 分析结论：`,
              })}
            </div>
          `,
          draft: `
            <div class="title-line">
              <h3>步骤 4：AI 生成论文初稿</h3>
              <button class="help-tip" data-tip="AI 汇总摘要、引用库文章、实验代码方案和分析结论，生成论文各章节初稿。" type="button">?</button>
            </div>
            <section class="confirm-panel mt-10">
              <div class="confirm-head">
                <div>
                  <div class="title-line">
                    <h3>待确认 AI 输出：论文初稿结构</h3>
                    <span class="badge warning">生成前确认</span>
                  </div>
                  <p class="mt-8">确认摘要、实验代码和实验分析都已经可用，再让 AI 生成完整章节初稿。</p>
                </div>
                <span class="badge primary">人工确认后生成</span>
              </div>
              <div class="confirm-body">
                <div class="confirm-checklist">
                  <div class="confirm-check"><strong>摘要</strong><span>${task.abstract ? "已确认" : "未确认"}</span></div>
                  <div class="confirm-check"><strong>实验代码</strong><span>${task.experimentLog ? "已确认" : "未确认"}</span></div>
                  <div class="confirm-check"><strong>实验分析</strong><span>${task.analysis ? "已确认" : "未确认"}</span></div>
                </div>
                <div class="analysis-grid">${renderConfirmedOutputs(task, 120)}</div>
                <div class="row-actions"><button class="primary" data-generate-step="draft" type="button">确认并生成论文初稿</button></div>
              </div>
            </section>
          `,
          export: `
            <div class="title-line">
              <h3>步骤 5：AI 辅助调序与导出</h3>
              <button class="help-tip" data-tip="AI 辅助检查章节顺序和正文完整度，用户可调整章节后导出 Markdown。" type="button">?</button>
            </div>
            <section class="confirm-panel mt-10">
              <div class="confirm-head">
                <div>
                  <div class="title-line">
                    <h3>导出前确认</h3>
                    <span class="badge warning">最终检查</span>
                  </div>
                  <p class="mt-8">导出前检查章节顺序、引用覆盖、实验代码与分析是否一致。</p>
                </div>
                <span class="badge primary">Markdown</span>
              </div>
              <div class="confirm-body">
                <div class="confirm-checklist">
                  <div class="confirm-check"><strong>章节顺序</strong><span>可在右侧上移或下移</span></div>
                  <div class="confirm-check"><strong>引用覆盖</strong><span>${citations.length} 条引用已绑定</span></div>
                  <div class="confirm-check"><strong>草稿状态</strong><span>${task.sections?.length ? `${task.sections.length} 章可导出` : "尚未生成初稿"}</span></div>
                </div>
                <div class="row-actions"><button class="primary" id="exportInlineButton" type="button">AI 检查后导出 Markdown</button></div>
              </div>
            </section>
          `,
        };
        $("taskWorkspace").innerHTML = views[task.step] || views.abstract;
        const exportInline = $("exportInlineButton");
        if (exportInline) exportInline.addEventListener("click", exportMarkdown);
      }

      function completeStep(step) {
        const task = currentTask();
        if (!task) return;
        if (step === "abstract") task.abstract = $("abstractInput")?.value || "";
        if (step === "experiment") task.experimentLog = $("experimentInput")?.value || "";
        if (step === "analysis") task.analysis = $("analysisInput")?.value || "AI 分析：实验结果显示，当前方法在主要指标上有所改善，但仍需要说明样本规模、随机种子和对照组带来的不确定性。";
        if (step === "draft") generateTaskDraft(task);
        const index = stepDefs.findIndex(([id]) => id === step);
        task.step = stepDefs[Math.min(index + 1, stepDefs.length - 1)][0];
        showToast("AI 阶段产物已确认");
        renderTasks();
      }

      function generateTaskDraft(task) {
        const citations = citationsForTask(task);
        task.sections = [
          { id: "s1", title: "摘要", content: task.abstract || `AI 摘要：本文围绕「${task.title}」展开，结合引用库内容构建研究问题。`, order: 0 },
          { id: "s2", title: "引言", content: `AI 引言草稿：现有研究提示，${citations[0]?.summary || "当前方向需要进一步引用支撑"}。本文关注该问题在低样本条件下的可验证性。`, order: 1 },
          { id: "s3", title: "方法", content: citations.map((item) => `AI 提炼依据：${item.title}：${item.reason}`).join("\n") || "AI 方法草稿等待引用库内容补充。", order: 2 },
          { id: "s4", title: "实验代码实现", content: task.experimentLog || "实验代码方案等待补充。", order: 3 },
          { id: "s5", title: "实验分析", content: task.analysis || "实验分析等待补充。", order: 4 },
          { id: "s6", title: "结论", content: "AI 结论草稿：本文结论需要严格限定在引用库、实验代码方案和分析结果能够支撑的范围内。", order: 5 },
        ];
      }

      function renderDraftSections(task) {
        const draftSectionsEl = $("draftSections");
        const draftPreviewEl = $("draftPreview");
        if (!draftSectionsEl) return;
        if (!task) {
          draftSectionsEl.innerHTML = `<div class="empty"><strong>暂无当前任务</strong></div>`;
          if (draftPreviewEl) draftPreviewEl.value = "";
          return;
        }
        const outputs = [];
        if (task.abstract) outputs.push({ title: "摘要", content: task.abstract, type: "摘要" });
        if (task.experimentLog) outputs.push({ title: "实验代码方案", content: task.experimentLog, type: "实验" });
        if (task.analysis) outputs.push({ title: "实验分析", content: task.analysis, type: "分析" });
        if (!task.sections?.length) {
          draftSectionsEl.innerHTML = outputs.length
            ? outputs
                .map(
                  (item) => `
                    <article class="analysis-item">
                      <strong>${escapeHtml(item.title)}</strong>
                      <p>${escapeHtml(shortText(item.content, 150))}</p>
                    </article>
                  `,
                )
                .join("")
            : `<div class="empty"><strong>等待阶段产物</strong><p>完成摘要、实验或分析后，这里逐步补充内容。</p></div>`;
          if (draftPreviewEl) draftPreviewEl.value = outputs.map((item) => `## ${item.title}\n${item.content}`).join("\n\n");
          return;
        }
        const ordered = task.sections.sort((a, b) => a.order - b.order);
        draftSectionsEl.innerHTML = ordered
          .map(
            (section, index) => `
              <article class="card draft-section">
                <div class="section-row">
                  <input data-section-title="${section.id}" value="${escapeHtml(section.title)}" />
                  <div class="row-actions">
                    <button data-move-section="${section.id}" data-dir="-1" ${index === 0 ? "disabled" : ""} type="button">上移</button>
                    <button data-move-section="${section.id}" data-dir="1" ${index === ordered.length - 1 ? "disabled" : ""} type="button">下移</button>
                  </div>
                </div>
                <textarea class="mt-8" data-section-content="${section.id}">${escapeHtml(section.content)}</textarea>
              </article>
            `,
          )
          .join("");
        composeDraft(task);
      }

      function composeDraft(task = currentTask()) {
        const draftPreviewEl = $("draftPreview");
        if (!draftPreviewEl) return;
        if (!task?.sections?.length) {
          const outputs = [];
          if (task?.abstract) outputs.push(`## 摘要\n${task.abstract}`);
          if (task?.experimentLog) outputs.push(`## 实验代码方案\n${task.experimentLog}`);
          if (task?.analysis) outputs.push(`## 实验分析\n${task.analysis}`);
          draftPreviewEl.value = outputs.join("\n\n");
          return;
        }
        draftPreviewEl.value = task.sections
          .sort((a, b) => a.order - b.order)
          .map((section) => `## ${section.title}\n${section.content}`)
          .join("\n\n");
      }

      function moveSection(id, dir) {
        const task = currentTask();
        const ordered = task.sections.sort((a, b) => a.order - b.order);
        const index = ordered.findIndex((item) => item.id === id);
        const next = index + Number(dir);
        if (next < 0 || next >= ordered.length) return;
        [ordered[index].order, ordered[next].order] = [ordered[next].order, ordered[index].order];
        renderDraftSections(task);
      }

      function addCitationToCurrentTask(id) {
        const task = currentTask();
        const citation = state.citations.find((item) => item.id === id);
        if (!task || !citation) return;
        state.tasks.forEach((item) => {
          if (item.id !== task.id) item.citationIds = item.citationIds.filter((citationId) => citationId !== id);
        });
        if (!task.citationIds.includes(id)) task.citationIds.push(id);
        citation.taskId = task.id;
        showToast("已加入当前写作任务");
        renderTasks();
        renderCitations();
      }

      function removeCitationFromCurrentTask(id) {
        const task = currentTask();
        if (!task) return;
        task.citationIds = task.citationIds.filter((item) => item !== id);
        const citation = state.citations.find((item) => item.id === id);
        if (citation?.taskId === task.id) citation.taskId = "";
        showToast("已移出当前写作任务");
        renderTasks();
        renderCitations();
      }

      function exportMarkdown() {
        const task = currentTask();
        const sectionContent = task?.sections?.length
          ? task.sections
              .sort((a, b) => a.order - b.order)
              .map((section) => `## ${section.title}\n${section.content}`)
              .join("\n\n")
          : "";
        const content = $("draftPreview")?.value || sectionContent || `# ${task?.title || "科研写作草稿"}\n\n暂无内容`;
        const blob = new Blob([content], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${(task?.title || "科研写作草稿").replace(/[\\/:*?"<>|]/g, "_")}.md`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        showToast("Markdown 已导出");
      }

      function renderMetrics() {
        if ($("knowledgeMetric")) $("knowledgeMetric").textContent = state.knowledge.length;
        if ($("ideaMetric")) $("ideaMetric").textContent = state.inspirations.length;
        if ($("citationMetric")) $("citationMetric").textContent = state.citations.length;
        if ($("taskMetric")) $("taskMetric").textContent = state.tasks.length;
      }

      function renderAll() {
        renderChat();
        renderKnowledge();
        renderReading();
        renderIdeas();
        renderCitations();
        renderTopics();
        renderTasks();
        renderMetrics();
      }

      function fillTemplate(type) {
        const templates = {
          paper: "我想研究低样本条件下可解释 DTA 模型的解释稳定性，请帮我找相关文献和方法线索。",
          idea: "请从已有资料中提炼能启发论文题目的 idea，不要直接当成正式引用。",
          write: "请检查启发库和引用库，帮我判断现在能写什么论文题目。",
        };
        $("chatInput").value = templates[type] || "";
        $("chatInput").focus();
      }

      function bindEvents() {
        document.addEventListener("click", (event) => {
          const pageButton = event.target.closest("[data-page]");
          const template = event.target.closest("[data-template]");
          const saveKnowledge = event.target.closest("[data-save-knowledge]");
          const dropPending = event.target.closest("[data-drop-pending]");
          const read = event.target.closest("[data-read]");
          const addIdea = event.target.closest("[data-add-idea]");
          const addCitation = event.target.closest("[data-add-citation]");
          const ideaToCitation = event.target.closest("[data-idea-to-citation]");
          const useIdeaTopic = event.target.closest("[data-use-idea-topic]");
          const selectTopicButton = event.target.closest("[data-select-topic]");
          const topicIdeasToCitationButton = event.target.closest("[data-topic-ideas-to-citation]");
          const selectTask = event.target.closest("[data-select-task]");
          const taskStep = event.target.closest("[data-task-step]");
          const generateStep = event.target.closest("[data-generate-step]");
          const moveSectionButton = event.target.closest("[data-move-section]");
          const addTaskCitation = event.target.closest("[data-add-task-citation]");
          const removeTaskCitation = event.target.closest("[data-remove-task-citation]");
          const flowTip = event.target.closest(".flow-card .help-tip");

          if (flowTip) return;
          if (addTaskCitation) {
            addCitationToCurrentTask(addTaskCitation.dataset.addTaskCitation);
            return;
          }
          if (removeTaskCitation) {
            removeCitationFromCurrentTask(removeTaskCitation.dataset.removeTaskCitation);
            return;
          }
          if (pageButton) setPage(pageButton.dataset.page);
          if (template) fillTemplate(template.dataset.template);
          if (saveKnowledge) savePendingKnowledge(saveKnowledge.dataset.saveKnowledge);
          if (dropPending) {
            state.pendingKnowledge = state.pendingKnowledge.filter((item) => item.id !== dropPending.dataset.dropPending);
            renderAll();
          }
          if (read) {
            state.selectedKnowledgeId = read.dataset.read;
            setPage("reading");
          }
          if (addIdea) createIdeaFromKnowledge(addIdea.dataset.addIdea);
          if (addCitation) openCitationModal("knowledge", addCitation.dataset.addCitation);
          if (ideaToCitation) openCitationModal("idea", ideaToCitation.dataset.ideaToCitation);
          if (useIdeaTopic) {
            setPage("topic");
            $("topicPrompt").value = `请基于这个启发生成论文标题：${state.inspirations.find((item) => item.id === useIdeaTopic.dataset.useIdeaTopic)?.title || ""}`;
          }
          if (selectTopicButton) selectTopic(selectTopicButton.dataset.selectTopic);
          if (topicIdeasToCitationButton) topicIdeasToCitation(topicIdeasToCitationButton.dataset.topicIdeasToCitation);
          if (selectTask) {
            state.selectedTaskId = selectTask.dataset.selectTask;
            renderTasks();
          }
          if (taskStep) {
            const task = currentTask();
            if (task) {
              task.step = taskStep.dataset.taskStep;
              renderTasks();
            }
          }
          if (generateStep) completeStep(generateStep.dataset.generateStep);
          if (moveSectionButton) moveSection(moveSectionButton.dataset.moveSection, moveSectionButton.dataset.dir);
        });

        $("sendButton").addEventListener("click", sendMessage);
        $("chatInput").addEventListener("keydown", (event) => {
          if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) sendMessage();
        });
        $("addManualKnowledgeButton").addEventListener("click", addManualKnowledge);
        $("seedKnowledgeButton").addEventListener("click", seedKnowledge);
        $("knowledgeSearch").addEventListener("input", renderKnowledge);
        $("knowledgeType").addEventListener("change", renderKnowledge);
        $("knowledgeStatus").addEventListener("change", renderKnowledge);
        $("readingSelect").addEventListener("change", () => {
          state.selectedKnowledgeId = $("readingSelect").value;
          renderReading();
        });
        $("markReadButton").addEventListener("click", markRead);
        $("askReadingButton").addEventListener("click", askReading);
        $("addCurrentIdeaButton").addEventListener("click", () => createIdeaFromKnowledge(currentKnowledge()?.id));
        $("addCurrentCitationButton").addEventListener("click", () => openCitationModal("knowledge", currentKnowledge()?.id));
        $("ideaSearch").addEventListener("input", renderIdeas);
        $("ideaType").addEventListener("change", renderIdeas);
        $("ideaStatus").addEventListener("change", renderIdeas);
        $("citationSearch").addEventListener("input", renderCitations);
        $("citationTask").addEventListener("change", renderCitations);
        $("citationChapter").addEventListener("change", renderCitations);
        $("citationStatus").addEventListener("change", renderCitations);
        $("generateTopicsButton").addEventListener("click", generateTopics);
        $("askTopicButton").addEventListener("click", generateTopics);
        $("createTaskFromTopicButton").addEventListener("click", createTaskFromTopic);
        $("newTaskButton").addEventListener("click", createBlankTask);
        $("exportButton").addEventListener("click", exportMarkdown);
        $("modalCancelButton").addEventListener("click", () => $("confirmModal").classList.remove("show"));
        $("modalConfirmButton").addEventListener("click", confirmAddCitation);
        const globalSearch = $("globalSearch");
        const resetSearch = $("resetSearchButton");
        if (globalSearch) {
          globalSearch.addEventListener("input", () => {
            state.query = globalSearch.value;
            renderKnowledge();
            renderIdeas();
            renderCitations();
          });
        }
        if (resetSearch) {
          resetSearch.addEventListener("click", () => {
            state.query = "";
            globalSearch.value = "";
            renderAll();
          });
        }
        document.addEventListener("input", (event) => {
          const titleInput = event.target.closest("[data-section-title]");
          const contentInput = event.target.closest("[data-section-content]");
          const task = currentTask();
          if (titleInput && task) {
            const section = task.sections.find((item) => item.id === titleInput.dataset.sectionTitle);
            if (section) section.title = titleInput.value;
            composeDraft(task);
          }
          if (contentInput && task) {
            const section = task.sections.find((item) => item.id === contentInput.dataset.sectionContent);
            if (section) section.content = contentInput.value;
            composeDraft(task);
          }
        });
      }

      bindEvents();
      renderAll();
    </script>
  </body>
</html>
