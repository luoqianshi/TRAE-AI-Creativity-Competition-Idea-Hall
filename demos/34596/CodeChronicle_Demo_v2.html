<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeChronicle · 代码碎念录 - 交互Demo演示</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #111827;
            --accent-cyan: #06b6d4;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --accent-orange: #f97316;
            --text-light: #f3f4f6;
            --text-gray: #9ca3af;
            --border: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .logo-area p {
            font-size: 0.8rem;
            color: var(--text-gray);
        }

        .status-bar {
            display: flex;
            gap: 25px;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 8px 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }

        .status-label {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-bottom: 4px;
        }

        .status-value {
            font-weight: bold;
            font-size: 1.1rem;
            font-family: monospace;
        }

        .main-layout {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .control-panel {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-title {
            font-size: 1.1rem;
            color: var(--accent-cyan);
            font-weight: 600;
            border-left: 4px solid var(--accent-purple);
            padding-left: 10px;
            margin-bottom: 10px;
        }

        .sim-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .sim-btn:hover {
            background: rgba(6, 182, 212, 0.08);
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
        }

        .sim-btn h3 {
            font-size: 0.95rem;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sim-btn p {
            font-size: 0.8rem;
            color: var(--text-gray);
        }

        .sim-btn .time-cost {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 0.75rem;
            background: rgba(249, 115, 22, 0.15);
            color: var(--accent-orange);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .display-panel {
            flex: 1.5;
            background-color: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .terminal-header {
            background-color: var(--panel-bg);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dot-group {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.r { background-color: #ef4444; }
        .dot.y { background-color: #eab308; }
        .dot.g { background-color: #22c55e; }

        .terminal-title {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .log-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 550px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-gray);
            text-align: center;
            gap: 10px;
            padding-top: 100px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-gray);
            opacity: 0.5;
        }

        .log-card {
            background: #111625;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            animation: slideIn 0.3s ease-out forwards;
            border-left: 4px solid var(--accent-cyan);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-bottom: 8px;
            border-bottom: 1px dashed #1e293b;
            padding-bottom: 5px;
        }

        .log-narrative {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .log-reward {
            font-size: 0.8rem;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-footer {
            padding: 15px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>CodeChronicle · 代码碎念录</h1>
            <p>生产力隐形工作量叙事系统 [交互型演示Demo]</p>
        </div>
        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">捕获到隐形工时</span>
                <span class="status-value" id="stat-hours" style="color: var(--accent-orange);">0.0 H</span>
            </div>
            <div class="status-item">
                <span class="status-label">打工人当前理智值</span>
                <span class="status-value" id="stat-sanity" style="color: var(--accent-green);">100%</span>
            </div>
            <div class="status-item">
                <span class="status-label">已转化的Git外战功</span>
                <span class="status-value" id="stat-achievements" style="color: var(--accent-purple);">0 个</span>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <!-- Left: Action Simulator -->
        <div class="control-panel">
            <div class="panel-title">触发日常隐形工作 (点击模拟捕获)</div>
            
            <button class="sim-btn" onclick="triggerLog('pom')">
                <span class="time-cost">+0.8h</span>
                <h3>⚔️ Maven 依赖九头蛇之战</h3>
                <p>修改pom.xml、处理包冲突、高频重启本地服务排错。</p>
            </button>

            <button class="sim-btn" onclick="triggerLog('stackoverflow')">
                <span class="time-cost">+1.2h</span>
                <h3>🔍 赛博沧海考古探险</h3>
                <p>连续检索并浏览数十个国内外技术社区，拼凑历史遗留Bug解法。</p>
            </button>

            <button class="sim-btn" onclick="triggerLog('meeting')">
                <span class="time-cost">+1.5h</span>
                <h3>精神风暴：同步对齐拉通会</h3>
                <p>参加长达一个半小时的对齐会议，实际有效发言仅2分钟。</p>
            </button>

            <button class="sim-btn" onclick="triggerLog('env')">
                <span class="time-cost">+2.0h</span>
                <h3>🪐 拓荒者：本地环境死循环</h3>
                <p>重装虚拟机、配置 Docker 镜像源、修复因系统更新导致的端口占用。</p>
            </button>
        </div>

        <!-- Right: Narrative Terminal -->
        <div class="display-panel">
            <div class="terminal-header">
                <div class="dot-group">
                    <div class="dot r"></div>
                    <div class="dot y"></div>
                    <div class="dot g"></div>
                </div>
                <div class="terminal-title">CHRONICLE-NARRATIVE-STREAM.log</div>
                <div style="width: 40px;"></div>
            </div>

            <div class="log-container" id="log-container">
                <div class="empty-state" id="empty-state">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
                    </svg>
                    <p>尚无捕获数据。请点击左侧动作按钮模拟一天的“隐形摸爬滚打”</p>
                </div>
            </div>

            <div class="action-footer">
                <button class="action-btn" onclick="generateReport()">一键导出打工人战功史诗单页报告 (HTML)</button>
            </div>
        </div>
    </div>

    <script>
        let totalHours = 0.0;
        let sanity = 100;
        let achievements = 0;

        const templates = {
            pom: {
                title: "【局部阻击战】版本依赖防御纠缠",
                cost: 0.8,
                sanityPenalty: 15,
                narrative: "检测到您高频蹂躏 `pom.xml` 并反复重启微服务。编年史评定：您成功阻止了版本冲突全面入侵本地生态，粉碎了‘NoSuchMethodError’的暗黑降临！虽然 Git 上没有新增一行代码，但你成功守护了架构的安全！",
                reward: "获得隐形战功：【九头蛇捕手】"
            },
            stackoverflow: {
                title: "【知识考古术】跨赛博海域寻宝",
                cost: 1.2,
                sanityPenalty: 10,
                narrative: "追踪到您连续跨越 24 个浏览器标签页，深入 StackOverflow 与 CSDN 废墟。编年史评定：您是一位高尚的‘赛博考古学家’，从历史尘埃和古老废墟中拼凑出了能让系统跑起来的远古咒语。虽然主管看不见，但架构因你而延寿！",
                reward: "获得隐形战功：【黄金级代码搬运工】"
            },
            meeting: {
                title: "【精神抗性考验】克苏鲁级别低语对齐",
                cost: 1.5,
                sanityPenalty: 30,
                narrative: "捕获到长达 90 分钟的音视频流量输入，期间您仅麦克风振动 2 次。编年史评定：您经受住了一场宏大的精神风暴洗礼，在满是‘赋能、对齐、颗粒度’的现代克苏鲁式低语中，成功维持了自我的清醒与理智！",
                reward: "获得隐形战功：【开会不掉线神选者】"
            },
            env: {
                title: "【降维打击抵抗】环境虚无漩涡",
                cost: 2.0,
                sanityPenalty: 25,
                narrative: "捕捉到 Docker 容器频繁死锁与 Linux 虚拟网络瞬断。编年史评定：您深入到了系统底层的无人区，与幽灵端口和玄学防火墙进行了手工业级别的搏斗。这是拓荒者的寂寞，系统今晚能跑，全靠您在此处逆天改命！",
                reward: "获得隐形战功：【赛博创世神特质】"
            }
        };

        function triggerLog(type) {
            // Hide empty state
            const empty = document.getElementById('empty-state');
            if (empty) empty.style.display = 'none';

            const data = templates[type];
            
            // Update stats
            totalHours += data.cost;
            sanity = Math.max(0, sanity - data.sanityPenalty);
            achievements += 1;

            document.getElementById('stat-hours').innerText = totalHours.toFixed(1) + " H";
            document.getElementById('stat-sanity').innerText = sanity + "%";
            document.getElementById('stat-achievements').innerText = achievements + " 个";

            // Add dynamic log card
            const container = document.getElementById('log-container');
            const card = document.createElement('div');
            card.className = 'log-card';
            
            const now = new Date().toLocaleTimeString();

            card.innerHTML = `
                <div class="log-meta-row">
                    <span>${now} | ${data.title}</span>
                    <span style="color: var(--accent-orange);">耗时约 ${data.cost}h</span>
                </div>
                <div class="log-narrative">${data.narrative}</div>
                <div class="log-reward">🎁 ${data.reward}</div>
            `;

            container.appendChild(card);
            container.scrollTop = container.scrollHeight;
        }

        function generateReport() {
            if(achievements === 0) {
                alert("请先点击左侧模拟日常隐形工作，生成点内容再导出哦！");
                return;
            }
            alert(`【报告导出成功】\n为您成功打包 ${achievements} 项被埋没的工作量。打工人今天成功抢救了 ${totalHours.toFixed(1)} 小时隐形战功，报告已转码为精美叙事单页！可以直接拿去作为日报/周报的情感佐证！`);
        }
    </script>
</body>
</html>
