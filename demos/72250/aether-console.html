*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#0C0E1A;font-family:'Inter',sans-serif;color:#fff;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.14);}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.6;transform:scale(1.3);}}
@keyframes pulseDot{0%,100%{transform:scale(1);box-shadow:0 0 4px currentColor;}50%{transform:scale(1.15);box-shadow:0 0 12px currentColor;}}
@keyframes tapRipple{0%{transform:scale(0);opacity:0.7;}100%{transform:scale(2.5);opacity:0;}}
@keyframes scan{0%{top:0;opacity:1;}100%{top:100%;opacity:0.3;}}
@keyframes screenIn{from{opacity:0;transform:scale(0.97);}to{opacity:1;transform:scale(1);}}
@keyframes targetIn{from{opacity:0;transform:scale(0.8);}to{opacity:1;transform:scale(1);}}
@keyframes boxIn{from{opacity:0;}to{opacity:1;}}
@keyframes orbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes orbRing{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes thoughtIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes caretBlink{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes logIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 8px rgba(107,99,212,0.3);}50%{box-shadow:0 0 20px rgba(107,99,212,0.6);}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.monospace{font-family:'JetBrains Mono',monospace;}
.faded{opacity:0.35;}

/* Grid background */
.grid-bg{background-image:radial-gradient(circle,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:40px 40px;}

/* ========== CUSTOM HOOK: Simulation Engine ========== */
function useSimulation(selectedApp,onLog,onThink){
  const [running,setRunning]=useState(false);
  const [started,setStarted]=useState(false);
  const [currentScreen,setCurrentScreen]=useState(null);
  const [phase,setPhase]=useState(null);
  const [tapTarget,setTapTarget]=useState(null);
  const [thinking,setThinking]=useState('');
  const [visitedNodes,setVisitedNodes]=useState(new Set());
  const [discoveredEdges,setDiscoveredEdges]=useState([]);
  const [stepCount,setStepCount]=useState(0);
  const [actionsCount,setActionsCount]=useState(0);
  const [coverage,setCoverage]=useState(0);
  const [elements,setElements]=useState([]);
  const [elementBoxes,setElementBoxes]=useState(false);
  const [scanLine,setScanLine]=useState(false);
  const [screenKey,setScreenKey]=useState(0);
  const [startup,setStartup]=useState(false);
  const abortRef=useRef(false);
  const screensRef=useRef(null);

  const totalScreens=useMemo(()=>{
    const s=buildScreens();
    const app=s[selectedApp]||s.taobao;
    return app.length;
  },[selectedApp]);

  const sleep=useCallback((ms)=>new Promise(r=>setTimeout(r,ms)),[]);

  const start=useCallback(async()=>{
    if(running) return;
    const s=buildScreens();
    const app=s[selectedApp]||s.taobao;
    screensRef.current=app;
    abortRef.current=false;
    setStarted(true);
    setStartup(true);
    setRunning(false);
    setPhase('startup');
    setThinking(`正在启动 ${APPS.find(a=>a.id===selectedApp)?.name||selectedApp} · 等待首屏`);
    onLog({ts:new Date(),level:'info',msg:`[boot] 正在启动 ${selectedApp}...`});
    await sleep(1400);
    if(abortRef.current) return;
    setStartup(false);
    const first=app[0];
    setCurrentScreen(first);
    setVisitedNodes(new Set([first.id]));
    setCoverage(Math.round(1/totalScreens*100));
    setScreenKey(k=>k+1);
    setRunning(true);
    setPhase('capture');
    onLog({ts:new Date(),level:'success',msg:`[boot] 首屏已就绪: ${first.name}`});
  },[running,selectedApp,totalScreens,sleep,onLog]);

  const pause=useCallback(()=>{
    abortRef.current=true;
    setRunning(false);
    setPhase(null);
    setTapTarget(null);
    setElementBoxes(false);
    setScanLine(false);
    onLog({ts:new Date(),level:'info',msg:`[ctrl] 探索已暂停 · step=${stepCount}`});
  },[stepCount,onLog]);

  useEffect(()=>{
    if(!running||!currentScreen) return;
    let cancelled=false;

    async function loop(){
      while(!abortRef.current&&!cancelled){
        const app=screensRef.current;
        if(!app) break;
        const screen=app.find(s=>s.id===currentScreen.id);
        if(!screen) break;

        // Phase 1: CAPTURE
        setPhase('capture');
        setTapTarget(null);
        setElementBoxes(false);
        setScanLine(false);
        const capThinking=`正在捕获屏幕快照… [${screen.name}]`;
        setThinking(capThinking);
        onThink(capThinking);
        onLog({ts:new Date(),level:'info',msg:`[capture] screenshot → ${screen.id}`});
        await sleep(600);
        if(abortRef.current||cancelled) break;

        // Phase 2: PARSE
        setPhase('parse');
        setScanLine(true);
        setElementBoxes(false);
        const elems=screen.hotspots;
        setElements(elems);
        const parseThinking=`解析 UI 层级 · 共发现 ${elems.length} 个可交互元素`;
        setThinking(parseThinking);
        onThink(parseThinking);
        onLog({ts:new Date(),level:'info',msg:`[parse] uiautomator dump → ${elems.length} nodes`});
        await sleep(400);
        if(abortRef.current||cancelled) break;
        setScanLine(false);
        setElementBoxes(true);
        await sleep(500);
        if(abortRef.current||cancelled) break;

        // Phase 3: DECIDE
        setPhase('decide');
        const unvisited=elems.filter(e=>e.target&&!visitedNodes.has(e.target));
        let target=unvisited.length>0?unvisited[0]:elems[0];
        const decideThinking=`决策：策略=覆盖优先 · 选择 ${target.label} → ${target.target}`;
        setThinking(decideThinking);
        onThink(decideThinking);
        onLog({ts:new Date(),level:'thought',msg:`[decide] policy=coverage_first · target=${target.label} (${target.target})`});
        await sleep(700);
        if(abortRef.current||cancelled) break;

        // Phase 4: ACT
        setPhase('act');
        setTapTarget(target);
        setThinking(`执行操作: click (${target.x},${target.y}) · ${target.label}`);
        onThink(`执行操作: click (${target.x},${target.y}) · ${target.label}`);
        setActionsCount(c=>c+1);
        onLog({ts:new Date(),level:'action',msg:`[act] click (${target.x},${target.y}) · ${target.label}`});
        await sleep(900);
        if(abortRef.current||cancelled) break;

        // Phase 5: SAVE
        setPhase('save');
        setTapTarget(null);
        setElementBoxes(false);
        const fromId=screen.id;
        const toId=target.target;
        const edge={from:fromId,to:toId,action:target.action,label:target.label};
        setDiscoveredEdges(edges=>[...edges,edge]);
        setStepCount(c=>c+1);
        onLog({ts:new Date(),level:'graph',msg:`[graph] EDGE +1 : ${fromId} -[${target.action}]→ ${toId}`});
        await sleep(500);
        if(abortRef.current||cancelled) break;

        // Switch screen
        const targetScreen=app.find(s=>s.id===toId);
        if(targetScreen){
          const newVisited=new Set(visitedNodes);
          const isNew=!newVisited.has(toId);
          newVisited.add(toId);
          setVisitedNodes(newVisited);
          const newCoverage=Math.round(newVisited.size/totalScreens*100);
          setCoverage(newCoverage);
          setCurrentScreen(targetScreen);
          setScreenKey(k=>k+1);
          if(isNew){
            onLog({ts:new Date(),level:'success',msg:`[discover] NEW SCREEN: ${targetScreen.name} · coverage=${newCoverage}%`});
          }
        }
        await sleep(300);
      }
      if(!cancelled&&!abortRef.current){
        setPhase('capture');
      }
    }

    loop();
    return ()=>{cancelled=true;};
  },[running,currentScreen,visitedNodes,totalScreens,onLog,onThink]);

  const reset=useCallback(()=>{
    abortRef.current=true;
    setRunning(false);
    setStarted(false);
    setCurrentScreen(null);
    setPhase(null);
    setTapTarget(null);
    setThinking('');
    setVisitedNodes(new Set());
    setDiscoveredEdges([]);
    setStepCount(0);
    setActionsCount(0);
    setCoverage(0);
    setElements([]);
    setElementBoxes(false);
    setScanLine(false);
    setScreenKey(0);
    setStartup(false);
  },[]);

  return{running,started,currentScreen,phase,tapTarget,thinking,visitedNodes,discoveredEdges,stepCount,actionsCount,coverage,elements,elementBoxes,scanLine,screenKey,startup,totalScreens,start,pause,reset};
}

/* ========== PHONE COMPONENT ========== */
function Phone({screen,screenKey,tapTarget,phase,elementBoxes,scanLine,startup,startupApp}){
  const phoneW=292,phoneH=632;
  const screenW=252,screenH=544;
  const scale=screenW/375;
  const offsetX=(phoneW-screenW)/2;
  const offsetY=(phoneW===292?28:20);

  const getPhaseInfo=(p)=>{
    const map={capture:{label:'CAPTURE',color:'#9B94F5',icon:'📷'},parse:{label:'PARSE',color:'#F7C65A',icon:'🔍'},decide:{label:'DECIDE',color:'#62C9A3',icon:'🧠'},act:{label:'ACT',color:'#F06060',icon:'👆'},save:{label:'SAVE',color:'#6B63D4',icon:'💾'}};
    return map[p]||null;
  };

  return(
    <div style={{width:phoneW,height:phoneH,background:'linear-gradient(145deg,#1a1a2e,#16213e,#0f3460,#1a1a2e)',borderRadius:44,position:'relative',boxShadow:'0 0 60px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.05)',display:'flex',alignItems:'center',justifyContent:'center'}}>
      {/* Viewfinder corner marks */}
      {[[16,12,'top-left'],[phoneW-24,12,'top-right'],[16,phoneH-20,'bottom-left'],[phoneW-24,phoneH-20,'bottom-right']].map(([x,y,pos],i)=>{
        const isTop=pos.includes('top'),isLeft=pos.includes('left');
        return(<div key={i} style={{position:'absolute',left:x,top:y,width:8,height:8,borderColor:'rgba(155,148,245,0.3)',borderStyle:'solid',borderWidth:isTop?'2px 0 0 2px':'0 0 2px 2px',borderRightWidth:!isLeft&&!isTop?'2px':isLeft?'0':'2px',borderLeftWidth:isLeft?'2px':'0',borderTopWidth:isTop?'2px':'0',borderBottomWidth:!isTop?'2px':'0'}}/>);
      })}
      {/* Notch */}
      <div style={{position:'absolute',top:6,left:'50%',transform:'translateX(-50%)',width:80,height:22,background:'#000',borderRadius:11,zIndex:10}}/>
      {/* Screen area */}
      <div style={{width:screenW,height:screenH,borderRadius:36,background:'#fff',overflow:'hidden',position:'relative',zIndex:5}}>
        {startup?(
          <div style={{height:'100%',background:'#1a1a2e',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'#9B94F5',gap:12}}>
            <div style={{width:32,height:32,border:'3px solid rgba(155,148,245,0.3)',borderTopColor:'#9B94F5',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
            <div className="monospace" style={{fontSize:11,color:'#9B94F5'}}>正在启动...</div>
          </div>
        ):screen?(
          <div key={screenKey} style={{height:'100%',animation:'screenIn 0.3s ease-out',position:'relative'}}>
            {screen.render()}
            {/* Scan line */}
            {scanLine&&<div style={{position:'absolute',left:0,right:0,height:2,background:'linear-gradient(90deg,transparent,rgba(155,148,245,0.8),transparent)',animation:'scan 0.8s linear infinite',zIndex:20,pointerEvents:'none'}}/>}
            {/* Element boxes */}
            {elementBoxes&&screen.hotspots.map((h,i)=>(
              <div key={i} style={{position:'absolute',left:h.x*scale,top:h.y*scale,width:h.w*scale,height:h.h*scale,border:`1.5px dashed rgba(155,148,245,0.6)`,borderRadius:3,animation:`boxIn 0.3s ease-out ${i*0.08}s both`,zIndex:15,pointerEvents:'none'}}/>
            ))}
            {/* Tap target marker */}
            {tapTarget&&phase==='act'&&(
              <div style={{position:'absolute',left:tapTarget.x*scale-2,top:tapTarget.y*scale-2,width:tapTarget.w*scale+4,height:tapTarget.h*scale+4,border:'2px solid rgba(107,99,212,0.9)',borderRadius:4,animation:'targetIn 0.2s ease-out',zIndex:20,pointerEvents:'none'}}>
                {/* Monospace label */}
                <div className="monospace" style={{position:'absolute',top:-18,left:0,fontSize:8,color:'#BAB5FA',background:'rgba(12,14,26,0.85)',padding:'1px 4px',borderRadius:2,whiteSpace:'nowrap'}}>{tapTarget.label}</div>
                {/* Center dot */}
                <div style={{position:'absolute',left:'50%',top:'50%',transform:'translate(-50%,-50%)',width:8,height:8,background:'#fff',borderRadius:'50%',zIndex:25}}/>
                {/* Ripple layers */}
                {[0,1,2].map(r=>(
                  <div key={r} style={{position:'absolute',left:'50%',top:'50%',transform:'translate(-50%,-50%)',width:20,height:20,border:'2px solid rgba(155,148,245,0.5)',borderRadius:'50%',animation:`tapRipple 0.6s ease-out ${r*0.15}s both`,pointerEvents:'none'}}/>
                ))}
              </div>
            )}
            {/* Phase badge */}
            {phase&&phase!=='startup'&&getPhaseInfo(phase)&&(()=>{
              const pi=getPhaseInfo(phase);
              return(
                <div style={{position:'absolute',top:34,left:10,background:'rgba(12,14,26,0.75)',backdropFilter:'blur(8px)',border:`1px solid rgba(255,255,255,0.08)`,borderRadius:8,padding:'4px 10px',display:'flex',alignItems:'center',gap:5,zIndex:25,animation:'targetIn 0.2s ease-out'}}>
                  <span style={{fontSize:10}}>{pi.icon}</span>
                  <span className="monospace" style={{fontSize:9,color:pi.color,fontWeight:600,letterSpacing:1}}>{pi.label}</span>
                </div>
              );
            })()}
          </div>
        ):(
          /* Desktop - no app started */
          <div style={{height:'100%',background:'#F5F5F5',display:'flex',flexDirection:'column'}}>
            <div style={{flex:1,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,padding:'60px 16px 16px',alignContent:'start'}}>
              {APPS.map((app,i)=>(
                <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                  <div style={{width:44,height:44,borderRadius:12,background:`linear-gradient(135deg,${app.color1},${app.color2})`,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:16}}>{app.icon}</div>
                  <span style={{fontSize:8,color:'#333'}}>{app.name}</span>
                </div>
              ))}
            </div>
            <div style={{height:44,background:'#fff',display:'flex',alignItems:'center',justifyContent:'space-around',borderTop:'1px solid #eee'}}>
              {['📱','📞','📸','⚙️'].map((e,i)=>(<div key={i} style={{fontSize:16}}>{e}</div>))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AgentStatusCard({status,stepCount,selectedApp,onStart,onPause}){
  const statusColor=status==='RUNNING'?C.greenBright:status==='PAUSED'?C.yellowBright:'#5A5E78';
  const statusText=status==='RUNNING'?'RUNNING':status==='PAUSED'?'PAUSED':'IDLE';
  const app=APPS.find(a=>a.id===selectedApp);
  return(
    <div style={{margin:'0 16px',background:C.card,borderRadius:12,border:`1px solid ${C.border}`,padding:14}}>
      <div style={{fontSize:9,color:C.textMuted,fontWeight:600,letterSpacing:1.5,marginBottom:10}}>AGENT STATUS</div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:statusColor,boxShadow:`0 0 6px ${statusColor}`,animation:status==='RUNNING'?'pulseDot 2s ease-in-out infinite':'none'}}/>
          <span className="monospace" style={{fontSize:11,color:statusColor,fontWeight:600}}>{statusText}</span>
        </div>
        <span className="monospace" style={{fontSize:10,color:C.textMuted}}>step {stepCount}</span>
      </div>
      <div style={{display:'flex',gap:8,marginTop:10}}>
        <button onClick={onStart} style={{flex:1,height:32,borderRadius:8,border:'none',background:status==='RUNNING'?C.primaryDark:C.primary,color:status==='RUNNING'?C.textSecondary:'#fff',fontSize:10,fontWeight:600,cursor:'pointer',transition:'all 0.2s',display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>开始 ▶</button>
        <button onClick={onPause} disabled={status==='IDLE'} style={{flex:1,height:32,borderRadius:8,border:'none',background:status==='PAUSED'?C.yellow:C.input,color:status==='PAUSED'?'#1a1a2e':C.textDisabled,fontSize:10,fontWeight:600,cursor:status==='IDLE'?'not-allowed':'pointer',transition:'all 0.2s',display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>暂停 ⏸</button>
      </div>
      {app&&(
        <div style={{marginTop:10,display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:C.input,borderRadius:8}}>
          <div style={{width:28,height:28,borderRadius:8,background:`linear-gradient(135deg,${app.color1},${app.color2})`,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:12,flexShrink:0}}>{app.icon}</div>
          <div style={{overflow:'hidden'}}>
            <div style={{fontSize:10,color:C.textPrimary,fontWeight:500,whiteSpace:'nowrap',textOverflow:'ellipsis',overflow:'hidden'}}>{app.name}</div>
            <div style={{fontSize:8,color:status==='RUNNING'?C.yellow:C.textMuted,marginTop:1}}>{status==='RUNNING'?'扫描中…':'待扫描目标'}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function AppSelection({selectedApp,onSelect,filteredList,searchText,setSearchText,currentPage,setCurrentPage,totalFiltered}){
  const perPage=5;
  const totalPages=Math.max(1,Math.ceil(filteredList.length/perPage));
  const pagedList=filteredList.slice((currentPage-1)*perPage,currentPage*perPage);

  return(
    <div style={{margin:'12px 16px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <span style={{fontSize:9,color:C.textMuted,fontWeight:600,letterSpacing:1.5}}>APP SELECTION</span>
        <span className="monospace" style={{fontSize:9,color:C.textMuted}}>{totalFiltered}/{APPS.length}</span>
      </div>
      <div style={{position:'relative',marginBottom:8}}>
        <div style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)'}}><IconMagnify/></div>
        <input value={searchText} onChange={e=>{setSearchText(e.target.value);setCurrentPage(1);}} placeholder="搜索应用…" style={{width:'100%',height:34,background:C.input,border:`1px solid ${C.border}`,borderRadius:8,padding:'0 30px 0 32px',color:C.textPrimary,fontSize:10,outline:'none',fontFamily:'Inter'}}/>
        {searchText&&<div style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',cursor:'pointer'}} onClick={()=>{setSearchText('');setCurrentPage(1);}}><IconX/></div>}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:260,overflow:'hidden'}}>
        {pagedList.map(app=>(
          <div key={app.id} onClick={()=>onSelect(app.id)} style={{background:app.id===selectedApp?`${C.primaryDark}`:C.card,border:`1px solid ${app.id===selectedApp?C.primary:C.border}`,borderRadius:10,padding:'10px 12px',display:'flex',alignItems:'center',gap:10,cursor:'pointer',transition:'all 0.15s'}}>
            <div style={{width:32,height:32,borderRadius:8,background:`linear-gradient(135deg,${app.color1},${app.color2})`,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:13,flexShrink:0}}>{app.icon}</div>
            <div style={{flex:1,overflow:'hidden'}}>
              <div style={{fontSize:10,color:C.textPrimary,fontWeight:500}}>{app.name}</div>
              <div className="monospace" style={{fontSize:8,color:C.textMuted,marginTop:1,whiteSpace:'nowrap',textOverflow:'ellipsis',overflow:'hidden'}}>{app.pkg}</div>
            </div>
            {app.id===selectedApp&&<IconCheck/>}
          </div>
        ))}
      </div>
      {totalPages>1&&(
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,marginTop:10}}>
          <div onClick={()=>setCurrentPage(p=>Math.max(1,p-1))} style={{cursor:'pointer',opacity:currentPage===1?0.3:1}}><IconChevronL/></div>
          {Array.from({length:totalPages},(_,i)=>i+1).map(p=>(
            <div key={p} onClick={()=>setCurrentPage(p)} style={{cursor:'pointer',width:p===currentPage?20:8,height:8,borderRadius:4,background:p===currentPage?`linear-gradient(90deg,${C.primary},${C.primaryBright})`:C.textDisabled,transition:'all 0.2s'}}/>
          ))}
          <div onClick={()=>setCurrentPage(p=>Math.min(totalPages,p+1))} style={{cursor:'pointer',opacity:currentPage===totalPages?0.3:1}}><IconChevronR/></div>
        </div>
      )}
    </div>
  );
}

function PhasePipeline({phase}){
  const phases=['截图','UI解析','决策','操作','存图'];
  const phaseKeys=['capture','parse','decide','act','save'];
  const colors=['#9B94F5','#F7C65A','#62C9A3','#F06060','#6B63D4'];
  const icons=['📷','🔍','🧠','👆','💾'];
  const currentIdx=phaseKeys.indexOf(phase);

  return(
    <div style={{margin:'0 20px 12px'}}>
      <div style={{display:'flex',alignItems:'center',gap:0}}>
        {phases.map((p,i)=>{
          const isCurrent=i===currentIdx;
          const isDone=phase&&i<currentIdx;
          const isActive=phase&&i<=currentIdx;
          return(
            <Fragment key={i}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,flex:'0 0 auto'}}>
                <div style={{width:28,height:28,borderRadius:8,background:isCurrent?`${colors[i]}20`:isDone?`${colors[i]}10`:'transparent',border:`1.5px solid ${isCurrent?colors[i]:isDone?`${colors[i]}50`:'rgba(255,255,255,0.06)'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,boxShadow:isCurrent?`0 0 12px ${colors[i]}40`:'none',transition:'all 0.3s'}}>{icons[i]}</div>
                <span className="monospace" style={{fontSize:7,color:isActive?colors[i]:C.textDisabled,fontWeight:isCurrent?600:400}}>{p}</span>
              </div>
              {i<phases.length-1&&(
                <div style={{flex:1,height:1.5,background:i<currentIdx?`${colors[i]}40`:'rgba(255,255,255,0.06)',margin:'0 4px',marginTop:-12,borderRadius:1}}/>
              )}
            </Fragment>
          );
        })}
      </div>
    </div>
  );
}

function UIJsonBlock({elements,screen}){
  const json={
    screen:screen?.id||'home',
    activity:screen?.activity||'com.example.MainActivity',
    elements:elements.map(e=>({id:e.label,bounds:`[${e.x},${e.y},${e.x+e.w},${e.y+e.h}]`,action:e.action}))
  };

  const highlight=(str)=>{
    const parts=[];
    let i=0;
    while(i<str.length){
      if(str[i]==='"'){
        let j=i+1;
        while(j<str.length&&str[j]!=='"') j++;
        parts.push(<span key={i} style={{color:C.greenBright}}>"{str.slice(i+1,j)}"</span>);
        i=j+1;
      }else if(str[i]>='0'&&str[i]<='9'){
        let j=i;
        while(j<str.length&&str[j]>='0'&&str[j]<='9') j++;
        parts.push(<span key={i} style={{color:C.yellowBright}}>{str.slice(i,j)}</span>);
        i=j;
      }else if(str[i]==='{'){
        parts.push(<span key={i} style={{color:C.textSecondary}}>{'{'}</span>);
        i++;
      }else if(str[i]==='}'){
        parts.push(<span key={i} style={{color:C.textSecondary}}>{'}'}</span>);
        i++;
      }else if(str[i]==='['){
        parts.push(<span key={i} style={{color:C.textSecondary}}>{'['}</span>);
        i++;
      }else if(str[i]===']'){
        parts.push(<span key={i} style={{color:C.textSecondary}}>{']'}</span>);
        i++;
      }else if(str[i]===','){
        parts.push(<span key={i} style={{color:C.textDisabled}}>,</span>);
        i++;
      }else if(str[i]===':'){
        parts.push(<span key={i} style={{color:C.textDisabled}}>: </span>);
        i++;
      }else{
        parts.push(<span key={i} style={{color:C.primaryBright}}>{str[i]}</span>);
        i++;
      }
    }
    return parts;
  };

  const jsonStr=JSON.stringify(json,null,2);

  return(
    <div style={{margin:'0 20px 12px'}}>
      <div style={{fontSize:9,color:C.textMuted,fontWeight:600,marginBottom:6}}>UI STRUCTURE</div>
      <div style={{background:C.input,borderRadius:8,border:`1px solid ${C.border}`,padding:'10px 12px',maxHeight:160,overflow:'auto'}}>
        <pre className="monospace" style={{fontSize:8,lineHeight:1.6,color:C.textSecondary,whiteSpace:'pre-wrap',wordBreak:'break-all'}}>{highlight(jsonStr)}</pre>
      </div>
    </div>
  );
}

/* ========== MAIN APP ========== */
function App(){
  const [selectedApp,setSelectedApp]=useState('taobao');
  const [searchText,setSearchText]=useState('');
  const [currentPage,setCurrentPage]=useState(1);
  const [activeTab,setActiveTab]=useState('ui');
  const [logs,setLogs]=useState([]);
  const [latestThinking,setLatestThinking]=useState('');
  const [fps,setFps]=useState(59.8);
  const [cpu,setCpu]=useState(23);
  const [mem,setMem]=useState(412);

  const filteredList=useMemo(()=>{
    if(!searchText) return APPS;
    const q=searchText.toLowerCase();
    return APPS.filter(a=>a.name.includes(q)||a.pkg.toLowerCase().includes(q));
  },[searchText]);

  const onLog=useCallback((entry)=>{
    setLogs(prev=>[entry,...prev]);
  },[]);

  const onThink=useCallback((text)=>{
    setLatestThinking(text);
  },[]);

  const sim=useSimulation(selectedApp,onLog,onThink);

  // Fake system metrics when running
  useEffect(()=>{
    if(!sim.running) return;
    const iv=setInterval(()=>{
      setFps(+(58+Math.random()*3).toFixed(1));
      setCpu(Math.floor(18+Math.random()*15));
      setMem(Math.floor(380+Math.random()*80));
    },1000);
    return ()=>clearInterval(iv);
  },[sim.running]);

  const status=sim.running?'RUNNING':sim.started&&sim.phase==='startup'?'RUNNING':sim.started?'PAUSED':'IDLE';

  const screensData=useMemo(()=>buildScreens(),[]);
  const appScreens=screensData[selectedApp]||screensData.taobao;

  const lastAction=sim.discoveredEdges.length>0?sim.discoveredEdges[sim.discoveredEdges.length-1]:null;

  return(
    <div style={{height:'100vh',display:'flex',overflow:'hidden'}}>
      {/* LEFT COLUMN */}
      <div style={{width:280,background:C.sidebar,borderRight:`1px solid ${C.border}`,overflow:'auto',flexShrink:0,display:'flex',flexDirection:'column'}}>
        <BrandHeader/>
        <AgentStatusCard status={status} stepCount={sim.stepCount} selectedApp={selectedApp} onStart={()=>sim.start()} onPause={()=>sim.pause()}/>
        <AppSelection selectedApp={selectedApp} onSelect={id=>{setSelectedApp(id);sim.reset();setLogs([]);}} filteredList={filteredList} searchText={searchText} setSearchText={setSearchText} currentPage={currentPage} setCurrentPage={setCurrentPage} totalFiltered={filteredList.length}/>
        <AnalyzedApps/>
        <GraphStorage visitedNodes={sim.visitedNodes} totalScreens={sim.totalScreens} discoveredEdges={sim.discoveredEdges} coverage={sim.coverage}/>
        <ResultSavePath selectedApp={selectedApp}/>
      </div>

      {/* CENTER COLUMN */}
      <div style={{flex:1,background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}} className="grid-bg">
        {/* Top bar */}
        <div style={{height:56,display:'flex',alignItems:'center',padding:'0 24px',gap:14,background:'rgba(9,11,20,0.6)',backdropFilter:'blur(8px)',borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:sim.running?C.redBright:C.textDisabled,boxShadow:sim.running?`0 0 8px ${C.redBright}`:'none',animation:sim.running?'pulseDot 1.5s ease-in-out infinite':'none'}}/>
            <span className="monospace" style={{fontSize:11,color:sim.running?C.redBright:C.textDisabled,fontWeight:600}}>{sim.running?'● LIVE':'● STANDBY'}</span>
          </div>
          <div style={{width:1,height:24,background:C.border}}/>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:10,color:C.textMuted}}>当前任务</span>
            {(()=>{
              const app=APPS.find(a=>a.id===selectedApp);
              return app&&(
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <div style={{width:22,height:22,borderRadius:6,background:`linear-gradient(135deg,${app.color1},${app.color2})`,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:9}}>{app.icon}</div>
                  <span style={{fontSize:11,color:C.textPrimary,fontWeight:500}}>{app.name} · 全量探索</span>
                </div>
              );
            })()}
            <span className="monospace" style={{fontSize:9,color:C.textMuted}}>#run-2026-05-02-0318</span>
          </div>
          <div style={{flex:1}}/>
          <a href="./aether-exec-console.html" style={{padding:'7px 16px',borderRadius:20,background:`linear-gradient(135deg,${C.primary},${C.primaryBright})`,display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontSize:10,fontWeight:600,color:'#fff',boxShadow:`0 0 16px ${C.glowPrimary}`,transition:'all 0.2s',textDecoration:'none'}}>
            <IconStar/><span>Agent Pilot 智能操控</span><IconChevronR2/>
          </a>
        </div>

        {/* Center stage */}
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:40,position:'relative'}}>
          <Phone screen={sim.currentScreen} screenKey={sim.screenKey} tapTarget={sim.tapTarget} phase={sim.phase} elementBoxes={sim.elementBoxes} scanLine={sim.scanLine} startup={sim.startup} startupApp={selectedApp}/>
          <TrajectoryBar screens={appScreens} currentScreenId={sim.currentScreen?.id} actions={sim.discoveredEdges} started={sim.started}/>
        </div>

        {/* Bottom meta bar */}
        <div style={{height:36,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 24px',background:'rgba(9,11,20,0.6)',backdropFilter:'blur(8px)',borderTop:`1px solid ${C.border}`,flexShrink:0}}>
          <div className="monospace" style={{fontSize:9,color:C.textMuted}}>
            activity = <span style={{color:C.textSecondary}}>{sim.currentScreen?.activity||'com.android.launcher3'}</span>
            &nbsp;&nbsp;screen = <span style={{color:C.textSecondary}}>{sim.currentScreen?.name||'Launcher'}</span>
          </div>
          <div className="monospace" style={{fontSize:9,color:C.textMuted}}>
            fps {fps} · cpu {cpu}% · mem {mem}MB
          </div>
        </div>
      </div>

      {/* RIGHT COLUMN */}
      <div style={{width:380,background:C.sidebar,borderLeft:`1px solid ${C.border}`,overflow:'auto',flexShrink:0,display:'flex',flexDirection:'column'}}>
        <CoPilotHeader running={sim.running}/>
        <CurrentReasoning text={sim.thinking}/>

        {/* Tabs */}
        <div style={{margin:'0 20px',display:'flex',gap:0,marginBottom:12}}>
          {[
            {id:'ui',label:'UI 解析'},
            {id:'log',label:'日志'},
          ].map(tab=>(
            <div key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{flex:1,height:32,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:500,color:activeTab===tab.id?C.primaryBright:C.textMuted,background:activeTab===tab.id?`${C.primary}15`:'transparent',borderRadius:activeTab==='ui'?'8px 0 0 8px':activeTab==='log'?'0 8px 8px 0':'0',cursor:'pointer',border:`1px solid ${activeTab===tab.id?`${C.primary}40`:C.border}`,borderRight:activeTab==='ui'&&activeTab!==tab.id?'none':'1px solid',transition:'all 0.2s'}}>
              {tab.label}
            </div>
          ))}
        </div>

        {activeTab==='ui'?(
          <div style={{flex:1,overflow:'auto',display:'flex',flexDirection:'column'}}>
            <PhasePipeline phase={sim.phase}/>
            <UIJsonBlock elements={sim.elements} screen={sim.currentScreen}/>
            <RecentActionCard lastAction={lastAction}/>
            <div style={{flex:1}}/>
          </div>
        ):(
          <div style={{flex:1,overflow:'auto',display:'flex',flexDirection:'column'}}>
            <LogPanel logs={logs}/>
          </div>
        )}

        <BottomMeta screen={sim.currentScreen} coverage={sim.coverage}/>
      </div>
    </div>
  );
}

/* ========== RENDER ========== */
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
