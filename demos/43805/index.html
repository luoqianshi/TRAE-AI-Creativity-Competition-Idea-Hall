<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能生态舱 - Smart Eco Chamber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🌱</div>
                <h1>智能生态舱</h1>
            </div>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">系统运行中</span>
            </div>
        </header>

        <main class="main-content">
            <section class="dashboard">
                <div class="section-title">
                    <span class="title-icon">📊</span>
                    <h2>实时环境监测</h2>
                </div>
                <div class="sensor-grid">
                    <div class="sensor-card" data-type="temperature">
                        <div class="sensor-icon">🌡️</div>
                        <div class="sensor-data">
                            <span class="sensor-value" id="temperature">24.5</span>
                            <span class="sensor-unit">°C</span>
                        </div>
                        <div class="sensor-label">温度</div>
                        <div class="sensor-bar">
                            <div class="bar-fill" id="temp-bar" style="width: 60%"></div>
                        </div>
                    </div>

                    <div class="sensor-card" data-type="humidity">
                        <div class="sensor-icon">💧</div>
                        <div class="sensor-data">
                            <span class="sensor-value" id="humidity">65</span>
                            <span class="sensor-unit">%</span>
                        </div>
                        <div class="sensor-label">湿度</div>
                        <div class="sensor-bar">
                            <div class="bar-fill" id="humidity-bar" style="width: 65%"></div>
                        </div>
                    </div>

                    <div class="sensor-card" data-type="light">
                        <div class="sensor-icon">☀️</div>
                        <div class="sensor-data">
                            <span class="sensor-value" id="light">450</span>
                            <span class="sensor-unit">lux</span>
                        </div>
                        <div class="sensor-label">光照</div>
                        <div class="sensor-bar">
                            <div class="bar-fill" id="light-bar" style="width: 45%"></div>
                        </div>
                    </div>

                    <div class="sensor-card" data-type="co2">
                        <div class="sensor-icon">🌬️</div>
                        <div class="sensor-data">
                            <span class="sensor-value" id="co2">420</span>
                            <span class="sensor-unit">ppm</span>
                        </div>
                        <div class="sensor-label">CO₂</div>
                        <div class="sensor-bar">
                            <div class="bar-fill" id="co2-bar" style="width: 42%"></div>
                        </div>
                    </div>

                    <div class="sensor-card" data-type="soil">
                        <div class="sensor-icon">🌱</div>
                        <div class="sensor-data">
                            <span class="sensor-value" id="soil">58</span>
                            <span class="sensor-unit">%</span>
                        </div>
                        <div class="sensor-label">土壤湿度</div>
                        <div class="sensor-bar">
                            <div class="bar-fill" id="soil-bar" style="width: 58%"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="controls">
                <div class="section-title">
                    <span class="title-icon">🎛️</span>
                    <h2>设备控制</h2>
                </div>
                <div class="control-grid">
                    <div class="control-card">
                        <div class="control-header">
                            <span class="control-icon">💡</span>
                            <span class="control-name">补光灯</span>
                        </div>
                        <div class="control-actions">
                            <button class="control-btn" id="light-toggle" onclick="toggleDevice('light')">
                                <span class="btn-icon">⏻</span>
                                <span class="btn-text">开启</span>
                            </button>
                            <div class="slider-container">
                                <input type="range" min="0" max="100" value="70" class="control-slider" id="light-slider">
                                <span class="slider-value">70%</span>
                            </div>
                        </div>
                    </div>

                    <div class="control-card">
                        <div class="control-header">
                            <span class="control-icon">🌀</span>
                            <span class="control-name">通风系统</span>
                        </div>
                        <div class="control-actions">
                            <button class="control-btn" id="fan-toggle" onclick="toggleDevice('fan')">
                                <span class="btn-icon">⏻</span>
                                <span class="btn-text">开启</span>
                            </button>
                            <div class="slider-container">
                                <input type="range" min="0" max="100" value="50" class="control-slider" id="fan-slider">
                                <span class="slider-value">50%</span>
                            </div>
                        </div>
                    </div>

                    <div class="control-card">
                        <div class="control-header">
                            <span class="control-icon">💦</span>
                            <span class="control-name">灌溉系统</span>
                        </div>
                        <div class="control-actions">
                            <button class="control-btn" id="water-toggle" onclick="toggleDevice('water')">
                                <span class="btn-icon">⏻</span>
                                <span class="btn-text">开启</span>
                            </button>
                            <div class="slider-container">
                                <input type="range" min="0" max="100" value="60" class="control-slider" id="water-slider">
                                <span class="slider-value">60%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="gamification">
                <div class="section-title">
                    <span class="title-icon">🏆</span>
                    <h2>植物成长</h2>
                </div>
                <div class="plant-status">
                    <div class="plant-visual">
                        <div class="plant-stage" id="plant-stage">🌱</div>
                        <div class="plant-info">
                            <h3 class="plant-name">薄荷 #001</h3>
                            <div class="growth-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" id="growth-bar" style="width: 35%"></div>
                                </div>
                                <span class="progress-text">35% 成长度</span>
                            </div>
                            <div class="plant-stats">
                                <div class="stat">
                                    <span class="stat-label">生长天数</span>
                                    <span class="stat-value">12天</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-label">健康度</span>
                                    <span class="stat-value">92%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="achievements">
                    <h3 class="achievements-title">成就徽章</h3>
                    <div class="badge-grid">
                        <div class="badge earned" title="初次种植">
                            <span class="badge-icon">🌱</span>
                            <span class="badge-name">新手园丁</span>
                        </div>
                        <div class="badge earned" title="连续7天养护">
                            <span class="badge-icon">📅</span>
                            <span class="badge-name">坚持一周</span>
                        </div>
                        <div class="badge locked" title="收获第一次作物">
                            <span class="badge-icon">🔒</span>
                            <span class="badge-name">丰收喜悦</span>
                        </div>
                        <div class="badge locked" title="分享数据到社区">
                            <span class="badge-icon">🔒</span>
                            <span class="badge-name">社区之星</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="history">
                <div class="section-title">
                    <span class="title-icon">📈</span>
                    <h2>历史趋势</h2>
                </div>
                <div class="chart-container">
                    <canvas id="historyChart"></canvas>
                </div>
            </section>
        </main>

        <aside class="sidebar">
            <div class="voice-control">
                <div class="section-title">
                    <span class="title-icon">🎤</span>
                    <h2>语音交互</h2>
                </div>
                <button class="voice-btn" id="voice-btn" onclick="toggleVoice()">
                    <span class="voice-icon">🎙️</span>
                    <span class="voice-text">按住说话</span>
                </button>
                <div class="voice-status" id="voice-status">
                    试试说："当前温度是多少？"
                </div>
            </div>

            <div class="alerts">
                <div class="section-title">
                    <span class="title-icon">⚠️</span>
                    <h2>报警阈值</h2>
                </div>
                <div class="alert-list">
                    <div class="alert-item">
                        <span class="alert-label">温度上限</span>
                        <input type="number" value="30" class="alert-input" id="temp-max">
                        <span class="alert-unit">°C</span>
                    </div>
                    <div class="alert-item">
                        <span class="alert-label">湿度下限</span>
                        <input type="number" value="40" class="alert-input" id="humidity-min">
                        <span class="alert-unit">%</span>
                    </div>
                    <div class="alert-item">
                        <span class="alert-label">CO₂上限</span>
                        <input type="number" value="800" class="alert-input" id="co2-max">
                        <span class="alert-unit">ppm</span>
                    </div>
                </div>
            </div>

            <div class="community">
                <div class="section-title">
                    <span class="title-icon">🌐</span>
                    <h2>社区分享</h2>
                </div>
                <button class="share-btn" onclick="shareToCommunity()">
                    <span class="share-icon">📤</span>
                    <span>分享生态舱数据</span>
                </button>
            </div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
