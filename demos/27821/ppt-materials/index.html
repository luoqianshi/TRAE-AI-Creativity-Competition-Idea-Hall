<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT 素材库 - 图形与配色</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 9h18M9 21V9"/>
                    </svg>
                </div>
                <h1>PPT 素材库</h1>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-section">
                    <span class="nav-label">图形素材</span>
                    <a href="#" class="nav-item active" data-category="shapes">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                        基础形状
                    </a>
                    <a href="#" class="nav-item" data-category="arrows">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        箭头与流程
                    </a>
                    <a href="#" class="nav-item" data-category="icons">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                        图标集合
                    </a>
                    <a href="#" class="nav-item" data-category="badges">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        徽章与标签
                    </a>
                    <a href="#" class="nav-item" data-category="charts">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
                        图表元素
                    </a>
                    <a href="#" class="nav-item" data-category="decorations">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><circle cx="12" cy="12" r="3"/></svg>
                        装饰元素
                    </a>
                </div>
                
                <div class="nav-section">
                    <span class="nav-label">文字底板</span>
                    <a href="#" class="nav-item" data-category="text-bases">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h10M7 14h6"/></svg>
                        文字底板
                    </a>
                </div>

                <div class="nav-section">
                    <span class="nav-label">配色方案</span>
                    <a href="#" class="nav-item" data-category="colors-themes">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
                        主题配色
                    </a>
                    <a href="#" class="nav-item" data-category="gradients">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24"><stop offset="0%" stop-color="currentColor"/><stop offset="100%" stop-color="currentColor" stop-opacity="0.3"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="2" fill="url(#g)"/></svg>
                        渐变方案
                    </a>
                    <a href="#" class="nav-item" data-category="combinations">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="8" height="8"/><rect x="14" y="2" width="8" height="8"/><rect x="2" y="14" width="8" height="8"/><rect x="14" y="14" width="8" height="8"/></svg>
                        色彩搭配
                    </a>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <p>点击素材即可复制</p>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <header class="top-bar">
                <h2 id="page-title">基础形状</h2>
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input type="text" placeholder="搜索素材..." id="search-input">
                </div>
            </header>

            <div class="content-area" id="content-area">
                <!-- 动态内容将在这里渲染 -->
            </div>
            
            <div class="toast" id="toast">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
                <span id="toast-message">已复制到剪贴板</span>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
