<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器导航页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --text-color: #fff;
            --text-dark: #333;
            --accent: #4f46e5;
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 50%, #fce7f3 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            transition: background-image 0.5s ease;
        }

        body:not(.has-bg-image) {
            color: var(--text-dark);
        }

        body.has-bg-image {
            background: center/cover no-repeat fixed;
            color: var(--text-color);
        }

        body.has-bg-image::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        body.glass.has-bg-image .card,
        body.glass.has-bg-image .search-box,
        body.glass.has-bg-image .shortcut-item,
        body.glass.has-bg-image .todo-panel,
        body.glass.has-bg-image .modal-content,
        body.glass.has-bg-image .countdown-box {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        body.glass:not(.has-bg-image) .card,
        body.glass:not(.has-bg-image) .search-box,
        body.glass:not(.has-bg-image) .shortcut-item,
        body.glass:not(.has-bg-image) .todo-panel,
        body.glass:not(.has-bg-image) .modal-content,
        body.glass:not(.has-bg-image) .countdown-box {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: var(--text-dark);
        }

        body.glass.has-bg-image .search-input,
        body.glass.has-bg-image .todo-input,
        body.glass.has-bg-image input,
        body.glass.has-bg-image select {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
        }

        body.glass:not(.has-bg-image) .search-input,
        body.glass:not(.has-bg-image) .todo-input,
        body.glass:not(.has-bg-image) input,
        body.glass:not(.has-bg-image) select {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: var(--text-dark);
        }

        body.glass.has-bg-image .search-input::placeholder,
        body.glass.has-bg-image .todo-input::placeholder,
        body.glass.has-bg-image input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        body.glass:not(.has-bg-image) .search-input::placeholder,
        body.glass:not(.has-bg-image) .todo-input::placeholder,
        body.glass:not(.has-bg-image) input::placeholder {
            color: rgba(0, 0, 0, 0.35);
        }

        body.glass:not(.has-bg-image) .shortcut-title,
        body.glass:not(.has-bg-image) .todo-title,
        body.glass:not(.has-bg-image) .countdown-label,
        body.glass:not(.has-bg-image) .countdown-value,
        body.glass:not(.has-bg-image) .time-display,
        body.glass:not(.has-bg-image) .modal-title,
        body.glass:not(.has-bg-image) .setting-label {
            color: var(--text-dark);
        }

        body:not(.glass) .card,
        body:not(.glass) .search-box,
        body:not(.glass) .shortcut-item,
        body:not(.glass) .todo-panel,
        body:not(.glass) .modal-content,
        body:not(.glass) .countdown-box {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.05);
            color: var(--text-dark);
        }

        body:not(.glass) .search-input,
        body:not(.glass) .todo-input,
        body:not(.glass) input,
        body:not(.glass) select {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: var(--text-dark);
        }

        body:not(.glass) .search-input::placeholder,
        body:not(.glass) .todo-input::placeholder,
        body:not(.glass) input::placeholder {
            color: #9ca3af;
        }

        body:not(.glass) .shortcut-title,
        body:not(.glass) .todo-title,
        body:not(.glass) .countdown-label,
        body:not(.glass) .countdown-value,
        body:not(.glass) .time-display,
        body:not(.glass) .modal-title,
        body:not(.glass) .setting-label {
            color: var(--text-dark);
        }

        /* Header */
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .time-display {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .countdown-box {
            padding: 10px 20px;
            border-radius: var(--radius);
            text-align: center;
        }

        .countdown-label {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .countdown-value {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: inherit;
            font-size: 1.1rem;
        }

        .icon-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.3); }

        body.glass:not(.has-bg-image) .icon-btn {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: var(--text-dark);
        }

        /* Search */
        .search-section {
            width: 100%;
            max-width: 680px;
            margin-bottom: 40px;
        }

        .search-box {
            display: flex;
            align-items: center;
            border-radius: 50px;
            padding: 6px;
            box-shadow: var(--glass-shadow);
            overflow: hidden;
        }

        .engine-select {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 14px;
            cursor: pointer;
            border-right: 1px solid rgba(255,255,255,0.2);
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            position: relative;
            user-select: none;
        }

        body:not(.glass) .engine-select,
        body.glass:not(.has-bg-image) .engine-select {
            border-right-color: rgba(0,0,0,0.1);
        }

        .engine-dropdown {
            position: absolute;
            top: 120%;
            left: 0;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 8px;
            min-width: 140px;
            display: none;
            z-index: 100;
            overflow: hidden;
        }

        .engine-dropdown.show { display: block; }

        .engine-option {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #333;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .engine-option:hover { background: #f3f4f6; }

        .engine-option.active { background: #e0e7ff; color: var(--accent); font-weight: 600; }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 16px;
            font-size: 1rem;
            background: transparent;
            color: inherit;
        }

        .search-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .search-btn:hover { opacity: 0.9; }

        /* Shortcuts */
        .shortcuts-section {
            width: 100%;
            max-width: 900px;
        }

        .section-title {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 16px;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 8px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            text-decoration: none;
            color: inherit;
        }

        .shortcut-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }

        .shortcut-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.2);
            overflow: hidden;
            flex-shrink: 0;
        }

        body:not(.glass) .shortcut-icon {
            background: #f3f4f6;
        }

        .shortcut-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .shortcut-title {
            font-size: 0.8rem;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .shortcut-delete {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
            border: none;
            font-size: 0.7rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .shortcut-item:hover .shortcut-delete { display: flex; }

        .add-shortcut {
            border: 2px dashed rgba(255,255,255,0.3);
            background: transparent !important;
            backdrop-filter: none !important;
        }

        body:not(.glass) .add-shortcut,
        body.glass:not(.has-bg-image) .add-shortcut {
            border-color: rgba(0,0,0,0.15);
        }

        .add-shortcut:hover { border-color: var(--accent); }

        /* Todo Panel */
        .todo-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            max-height: 420px;
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            z-index: 50;
            overflow: hidden;
        }

        .todo-header {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body:not(.glass) .todo-header,
        body.glass:not(.has-bg-image) .todo-header {
            border-bottom-color: rgba(0,0,0,0.05);
        }

        .todo-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .todo-toggle {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px;
        }

        .todo-body {
            padding: 12px 16px;
            overflow-y: auto;
            flex: 1;
            max-height: 300px;
        }

        .todo-body.collapsed { display: none; }

        .todo-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .todo-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 10px;
            outline: none;
            font-size: 0.9rem;
        }

        .todo-add-btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .todo-list { list-style: none; }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        body:not(.glass) .todo-item,
        body.glass:not(.has-bg-image) .todo-item {
            border-bottom-color: rgba(0,0,0,0.05);
        }

        .todo-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
            font-size: 0.7rem;
        }

        .todo-checkbox.checked { background: var(--accent); }

        .todo-text {
            flex: 1;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .todo-text.done { text-decoration: line-through; opacity: 0.5; }

        .todo-delete {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            opacity: 0.5;
            font-size: 0.9rem;
        }

        .todo-delete:hover { opacity: 1; }

        .todo-empty {
            text-align: center;
            opacity: 0.5;
            font-size: 0.85rem;
            padding: 20px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal-content {
            width: 100%;
            max-width: 420px;
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: inherit;
            opacity: 0.6;
        }

        .form-group { margin-bottom: 16px; }

        .setting-label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            opacity: 0.85;
        }

        input[type="text"],
        input[type="url"],
        input[type="time"],
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            outline: none;
            font-size: 0.9rem;
        }

        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #ccc;
            border-radius: 24px;
            transition: 0.3s;
        }

        .slider::before {
            content: '';
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }

        .switch input:checked + .slider { background: var(--accent); }
        .switch input:checked + .slider::before { transform: translateX(20px); }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:hover { opacity: 0.9; }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px dashed currentColor;
            background: transparent;
            color: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 8px;
            opacity: 0.7;
        }

        .upload-preview {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 8px;
            display: none;
            background: rgba(255,255,255,0.1);
        }

        .upload-preview img { width: 100%; height: 100%; object-fit: cover; }

        .color-picker-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-dot.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }

        @media (max-width: 640px) {
            .shortcuts-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; }
            .todo-panel { width: calc(100% - 40px); max-height: 50vh; }
            .header { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="time-display" id="clock">--:--:--</div>
        <div class="countdown-box" id="countdownBox">
            <div class="countdown-label">距离下班</div>
            <div class="countdown-value" id="countdown">--:--:--</div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="todoToggleBtn" title="待办">📝</button>
            <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
        </div>
    </div>

    <div class="search-section">
        <div class="search-box">
            <div class="engine-select" id="engineSelect">
                <span id="engineName">百度</span>
                <span>▾</span>
                <div class="engine-dropdown" id="engineDropdown"></div>
            </div>
            <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索...">
            <button class="search-btn" id="searchBtn">🔍</button>
        </div>
    </div>

    <div class="shortcuts-section">
        <div class="section-title">
            <span>快捷方式</span>
        </div>
        <div class="shortcuts-grid" id="shortcutsGrid"></div>
    </div>

    <!-- Todo Panel -->
    <div class="todo-panel" id="todoPanel">
        <div class="todo-header">
            <span class="todo-title">📝 今日待办</span>
            <button class="todo-toggle" id="todoCollapseBtn">▾</button>
        </div>
        <div class="todo-body" id="todoBody">
            <div class="todo-input-row">
                <input type="text" class="todo-input" id="todoInput" placeholder="添加待办事项...">
                <button class="todo-add-btn" id="todoAddBtn">添加</button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">设置</span>
                <button class="modal-close" id="closeSettings">&times;</button>
            </div>
            <div class="form-group">
                <label class="setting-label">背景图片 URL</label>
                <input type="text" id="bgUrl" placeholder="https://...">
            </div>
            <div class="form-group switch-row">
                <label class="setting-label">毛玻璃效果</label>
                <label class="switch">
                    <input type="checkbox" id="glassToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="form-group">
                <label class="setting-label">下班时间</label>
                <input type="time" id="offTime" value="18:00">
            </div>
            <button class="btn-primary" id="saveSettings">保存设置</button>
        </div>
    </div>

    <!-- Add Shortcut Modal -->
    <div class="modal-overlay" id="shortcutModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">添加快捷方式</span>
                <button class="modal-close" id="closeShortcut">&times;</button>
            </div>
            <div class="form-group">
                <label class="setting-label">标题</label>
                <input type="text" id="scTitle" placeholder="例如：百度">
            </div>
            <div class="form-group">
                <label class="setting-label">网址</label>
                <input type="url" id="scUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label class="setting-label">图标（可选，留空自动获取）</label>
                <input type="file" id="scIconFile" accept="image/*" style="display:none">
                <button class="btn-secondary" id="scUploadBtn">上传自定义图标</button>
                <div class="upload-preview" id="scPreview"></div>
            </div>
            <div class="form-group">
                <label class="setting-label">或选择颜色背景</label>
                <div class="color-picker-row" id="colorPicker"></div>
            </div>
            <button class="btn-primary" id="saveShortcut">添加</button>
        </div>
    </div>

    <script>
        // Data & State
        const ENGINES = [
            { name: '百度', url: 'https://www.baidu.com/s?wd={q}' },
            { name: 'Google', url: 'https://www.google.com/search?q={q}' },
            { name: '必应', url: 'https://www.bing.com/search?q={q}' },
            { name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q={q}' },
            { name: '搜狗', url: 'https://www.sogou.com/web?query={q}' },
        ];

        const COLORS = ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981', '#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', '#ec4899'];

        function loadData(key, fallback) {
            try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
            catch { return fallback; }
        }
        function saveData(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

        let settings = loadData('nav_settings', {
            bgUrl: '',
            glass: true,
            offTime: '18:00'
        });
        let shortcuts = loadData('nav_shortcuts', [
            { title: '百度', url: 'https://www.baidu.com', icon: '', color: '#3b82f6' },
            { title: 'B站', url: 'https://www.bilibili.com', icon: '', color: '#f472b6' },
            { title: 'GitHub', url: 'https://github.com', icon: '', color: '#333' },
        ]);
        let currentEngine = loadData('nav_engine', 0);
        let todos = loadData('nav_todos', []);
        let tempIcon = '';
        let tempIconType = '';
        let selectedColor = '';

        // DOM Refs
        const $ = id => document.getElementById(id);
        const body = document.body;

        // Init
        function init() {
            applySettings();
            renderEngineSelect();
            renderShortcuts();
            renderTodos();
            renderColorPicker();
            startClock();
            bindEvents();
        }

        function applySettings() {
            const hasBg = !!(settings.bgUrl && settings.bgUrl.trim());
            body.classList.toggle('has-bg-image', hasBg);
            if (hasBg) {
                body.style.backgroundImage = `url('${settings.bgUrl.trim()}')`;
            } else {
                body.style.backgroundImage = '';
            }
            body.classList.toggle('glass', settings.glass);
            $('bgUrl').value = settings.bgUrl;
            $('glassToggle').checked = settings.glass;
            $('offTime').value = settings.offTime;
        }

        // Engine
        function renderEngineSelect() {
            $('engineName').textContent = ENGINES[currentEngine].name;
            const dd = $('engineDropdown');
            dd.innerHTML = ENGINES.map((e, i) =>
                `<div class="engine-option ${i === currentEngine ? 'active' : ''}" data-i="${i}">${e.name}</div>`
            ).join('');
            dd.querySelectorAll('.engine-option').forEach(el => {
                el.onclick = (ev) => {
                    ev.stopPropagation();
                    currentEngine = +el.dataset.i;
                    saveData('nav_engine', currentEngine);
                    renderEngineSelect();
                    $('engineDropdown').classList.remove('show');
                };
            });
        }

        function doSearch() {
            const q = $('searchInput').value.trim();
            if (!q) return;
            const url = ENGINES[currentEngine].url.replace('{q}', encodeURIComponent(q));
            window.open(url, '_blank');
        }

        // Shortcuts
        function getFavicon(url) {
            try {
                const u = new URL(url);
                return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=128`;
            } catch { return ''; }
        }

        function getInitial(title) {
            const c = title.trim().charAt(0);
            return c || '?';
        }

        function renderShortcuts() {
            const grid = $('shortcutsGrid');
            let html = shortcuts.map((s, i) => {
                let iconHtml;
                if (s.icon) {
                    iconHtml = `<img src="${s.icon}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${getInitial(s.title)}'">`;
                } else {
                    const fav = getFavicon(s.url);
                    iconHtml = `<img src="${fav}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${getInitial(s.title)}';this.parentElement.style.background='${s.color || 'rgba(255,255,255,0.2)'}'">`;
                }
                return `
                    <a class="shortcut-item" href="${s.url}" target="_blank" rel="noopener">
                        <button class="shortcut-delete" data-i="${i}" title="删除">×</button>
                        <div class="shortcut-icon">${iconHtml}</div>
                        <div class="shortcut-title">${escapeHtml(s.title)}</div>
                    </a>
                `;
            }).join('');
            html += `
                <div class="shortcut-item add-shortcut" id="addShortcutBtn">
                    <div class="shortcut-icon" style="background:transparent;font-size:1.6rem">+</div>
                    <div class="shortcut-title">添加</div>
                </div>
            `;
            grid.innerHTML = html;

            grid.querySelectorAll('.shortcut-delete').forEach(btn => {
                btn.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    shortcuts.splice(+btn.dataset.i, 1);
                    saveData('nav_shortcuts', shortcuts);
                    renderShortcuts();
                };
            });

            $('addShortcutBtn').onclick = () => {
                tempIcon = '';
                tempIconType = '';
                selectedColor = '';
                $('scTitle').value = '';
                $('scUrl').value = '';
                $('scPreview').style.display = 'none';
                $('scPreview').innerHTML = '';
                renderColorPicker();
                $('shortcutModal').classList.add('show');
            };
        }

        function escapeHtml(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        function renderColorPicker() {
            $('colorPicker').innerHTML = COLORS.map(c =>
                `<div class="color-dot ${c === selectedColor ? 'active' : ''}" style="background:${c}" data-c="${c}"></div>`
            ).join('');
            $('colorPicker').querySelectorAll('.color-dot').forEach(dot => {
                dot.onclick = () => {
                    selectedColor = dot.dataset.c;
                    tempIcon = '';
                    tempIconType = '';
                    $('scPreview').style.display = 'none';
                    renderColorPicker();
                };
            });
        }

        // Todos
        function renderTodos() {
            const list = $('todoList');
            if (!todos.length) {
                list.innerHTML = '<div class="todo-empty">暂无待办，添加一个吧~</div>';
                return;
            }
            list.innerHTML = todos.map((t, i) => `
                <li class="todo-item">
                    <div class="todo-checkbox ${t.done ? 'checked' : ''}" data-i="${i}">${t.done ? '✓' : ''}</div>
                    <span class="todo-text ${t.done ? 'done' : ''}">${escapeHtml(t.text)}</span>
                    <button class="todo-delete" data-i="${i}">🗑</button>
                </li>
            `).join('');

            list.querySelectorAll('.todo-checkbox').forEach(chk => {
                chk.onclick = () => {
                    const i = +chk.dataset.i;
                    todos[i].done = !todos[i].done;
                    saveData('nav_todos', todos);
                    renderTodos();
                };
            });
            list.querySelectorAll('.todo-delete').forEach(btn => {
                btn.onclick = () => {
                    todos.splice(+btn.dataset.i, 1);
                    saveData('nav_todos', todos);
                    renderTodos();
                };
            });
        }

        // Clock & Countdown
        function startClock() {
            function tick() {
                const now = new Date();
                $('clock').textContent = now.toLocaleTimeString('zh-CN', { hour12: false });

                const [h, m] = settings.offTime.split(':').map(Number);
                let target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
                if (target <= now) target.setDate(target.getDate() + 1);
                const diff = target - now;
                const hh = String(Math.floor(diff / 3600000)).padStart(2, '0');
                const mm = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
                const ss = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
                $('countdown').textContent = `${hh}:${mm}:${ss}`;
            }
            tick();
            setInterval(tick, 1000);
        }

        // Events
        function bindEvents() {
            // Engine dropdown
            $('engineSelect').onclick = (e) => {
                e.stopPropagation();
                $('engineDropdown').classList.toggle('show');
            };
            document.addEventListener('click', () => $('engineDropdown').classList.remove('show'));

            // Search
            $('searchBtn').onclick = doSearch;
            $('searchInput').onkeydown = (e) => { if (e.key === 'Enter') doSearch(); };

            // Settings modal
            $('settingsBtn').onclick = () => $('settingsModal').classList.add('show');
            $('closeSettings').onclick = () => $('settingsModal').classList.remove('show');
            $('saveSettings').onclick = () => {
                settings.bgUrl = $('bgUrl').value.trim();
                settings.glass = $('glassToggle').checked;
                settings.offTime = $('offTime').value;
                saveData('nav_settings', settings);
                applySettings();
                $('settingsModal').classList.remove('show');
            };

            // Shortcut modal
            $('closeShortcut').onclick = () => $('shortcutModal').classList.remove('show');
            $('scUploadBtn').onclick = () => $('scIconFile').click();
            $('scIconFile').onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    tempIcon = ev.target.result;
                    tempIconType = 'custom';
                    selectedColor = '';
                    renderColorPicker();
                    $('scPreview').innerHTML = `<img src="${tempIcon}">`;
                    $('scPreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            };
            $('saveShortcut').onclick = () => {
                const title = $('scTitle').value.trim();
                let url = $('scUrl').value.trim();
                if (!title || !url) return alert('请填写标题和网址');
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                shortcuts.push({
                    title,
                    url,
                    icon: tempIconType === 'custom' ? tempIcon : '',
                    color: selectedColor || COLORS[Math.floor(Math.random() * COLORS.length)]
                });
                saveData('nav_shortcuts', shortcuts);
                renderShortcuts();
                $('shortcutModal').classList.remove('show');
            };

            // Close modals on overlay click
            $('settingsModal').onclick = (e) => { if (e.target === $('settingsModal')) $('settingsModal').classList.remove('show'); };
            $('shortcutModal').onclick = (e) => { if (e.target === $('shortcutModal')) $('shortcutModal').classList.remove('show'); };

            // Todo
            $('todoAddBtn').onclick = addTodo;
            $('todoInput').onkeydown = (e) => { if (e.key === 'Enter') addTodo(); };
            $('todoCollapseBtn').onclick = () => {
                $('todoBody').classList.toggle('collapsed');
                $('todoCollapseBtn').textContent = $('todoBody').classList.contains('collapsed') ? '▸' : '▾';
            };
            $('todoToggleBtn').onclick = () => {
                const p = $('todoPanel');
                p.style.display = p.style.display === 'none' ? 'flex' : 'none';
            };
        }

        function addTodo() {
            const text = $('todoInput').value.trim();
            if (!text) return;
            todos.unshift({ text, done: false });
            saveData('nav_todos', todos);
            $('todoInput').value = '';
            renderTodos();
        }

        init();
    </script>
</body>
</html>
