<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>诗境 · 全球诗意可视化生成器</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #2b2b2b;
    --paper: #f5f0e6;
    --paper-dim: #e8e0d0;
    --cinnabar: #c1272d;
    --cinnabar-soft: #d94a4f;
    --jade: #4a7c59;
    --moon: #e8e4d8;
    --gold: #c9a96e;
    --mist: rgba(245, 240, 230, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Noto Serif SC', serif;
    background: #0d0d0d;
    color: var(--paper);
  }

  /* ============ 地图主页 ============ */
  #globe {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
  }
  #starCanvas {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: radial-gradient(ellipse at center, #0a0a15 0%, #000008 50%, #000000 100%);
  }

  /* 顶部标题栏 */
  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 500;
    padding: 22px 36px 26px;
    background: linear-gradient(180deg, rgba(13,13,13,0.92) 0%, rgba(13,13,13,0.6) 70%, transparent 100%);
    pointer-events: none;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .brand { pointer-events: auto; }
  .brand-row { display: flex; align-items: center; gap: 14px; }
  .seal {
    width: 46px; height: 46px;
    background: var(--cinnabar);
    color: var(--paper);
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    box-shadow: 0 0 0 2px rgba(193,39,45,0.3), 0 4px 18px rgba(193,39,45,0.35);
    transform: rotate(-3deg);
    letter-spacing: -2px;
  }
  .brand-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 34px;
    color: var(--paper);
    letter-spacing: 6px;
    line-height: 1;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .brand-sub {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 8px;
    margin-top: 6px;
    margin-left: 60px;
    opacity: 0.85;
  }
  .top-meta {
    pointer-events: auto;
    text-align: right;
    font-family: 'ZCOOL XiaoWei', serif;
  }
  .top-meta .count {
    font-size: 28px;
    color: var(--paper);
    font-family: 'Ma Shan Zheng', cursive;
  }
  .top-meta .count span { color: var(--cinnabar-soft); }
  .top-meta .label {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 4px;
    margin-top: 2px;
    opacity: 0.7;
  }

  /* 引导提示 */
  .hint {
    position: absolute;
    left: 50%;
    bottom: 48px;
    transform: translateX(-50%);
    z-index: 500;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    color: var(--moon);
    letter-spacing: 6px;
    padding: 10px 28px;
    background: rgba(13,13,13,0.7);
    border: 1px solid rgba(201,169,110,0.25);
    border-radius: 30px;
    backdrop-filter: blur(8px);
    animation: hintPulse 3s ease-in-out infinite;
    pointer-events: none;
  }
  .hint::before {
    content: '·';
    color: var(--cinnabar);
    margin-right: 10px;
    font-size: 20px;
    vertical-align: middle;
  }
  .hint::after {
    content: '·';
    color: var(--cinnabar);
    margin-left: 10px;
    font-size: 20px;
    vertical-align: middle;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.65; transform: translateX(-50%) translateY(0); }
    50% { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  }
  .hint.hide { animation: hintFade 0.6s forwards; }
  @keyframes hintFade { to { opacity: 0; transform: translateX(-50%) translateY(10px); } }

  /* ============ 3D 地球仪 ============ */
  #globe canvas { outline: none; }
  /* 地名悬浮提示 */
  .globe-tip {
    position: absolute;
    z-index: 600;
    pointer-events: none;
    background: rgba(13,13,13,0.92);
    border: 1px solid rgba(201,169,110,0.4);
    color: var(--paper);
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 6px 14px;
    border-radius: 2px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transform: translate(-50%, -130%);
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .globe-tip.show { opacity: 1; }
  .globe-tip .t-count { color: var(--cinnabar-soft); margin-left: 8px; }

  /* ============ 诗歌面板（侧边抽屉） ============ */
  .panel {
    position: absolute;
    top: 0; right: 0;
    height: 100%;
    width: 420px;
    max-width: 90vw;
    z-index: 800;
    background: linear-gradient(180deg, #1a1815 0%, #14110d 100%);
    border-left: 1px solid rgba(201,169,110,0.25);
    box-shadow: -20px 0 60px rgba(0,0,0,0.6);
    transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel.open { transform: translateX(0); }

  .panel-header {
    padding: 28px 30px 22px;
    border-bottom: 1px solid rgba(201,169,110,0.15);
    position: relative;
    flex-shrink: 0;
  }
  .panel-loc {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 6px;
    opacity: 0.8;
  }
  .panel-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 38px;
    color: var(--paper);
    letter-spacing: 4px;
    margin-top: 6px;
    line-height: 1.1;
  }
  .panel-close {
    position: absolute;
    top: 24px; right: 24px;
    width: 34px; height: 34px;
    background: transparent;
    border: 1px solid rgba(245,240,230,0.2);
    color: var(--paper);
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
    font-family: serif;
  }
  .panel-close:hover {
    background: var(--cinnabar);
    border-color: var(--cinnabar);
    transform: rotate(90deg);
  }
  .panel-list {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 30px;
  }
  .panel-list::-webkit-scrollbar { width: 6px; }
  .panel-list::-webkit-scrollbar-track { background: transparent; }
  .panel-list::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.3); border-radius: 3px; }

  .poem-card {
    padding: 20px 22px;
    margin-bottom: 14px;
    background: rgba(245,240,230,0.03);
    border: 1px solid rgba(201,169,110,0.12);
    border-left: 3px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }
  .poem-card:hover {
    background: rgba(245,240,230,0.06);
    border-left-color: var(--cinnabar);
    transform: translateX(-4px);
  }
  .poem-card .pc-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 24px;
    color: var(--paper);
    letter-spacing: 3px;
  }
  .poem-card .pc-meta {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-top: 4px;
    opacity: 0.85;
  }
  .poem-card .pc-line {
    font-size: 14px;
    color: rgba(245,240,230,0.65);
    margin-top: 12px;
    line-height: 1.8;
    letter-spacing: 2px;
  }
  .poem-card .pc-arrow {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--cinnabar);
    opacity: 0;
    transition: all 0.3s;
    font-size: 18px;
  }
  .poem-card:hover .pc-arrow { opacity: 1; right: 14px; }

  /* ============ 意境展示页 ============ */
  .scene {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .scene.active {
    opacity: 1;
    pointer-events: auto;
  }
  #sceneCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .scene-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    z-index: 2;
  }

  .scene-poem {
    text-align: center;
    max-width: 720px;
    position: relative;
  }
  .scene-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: clamp(40px, 6vw, 64px);
    color: var(--paper);
    letter-spacing: 10px;
    text-shadow: 0 4px 30px rgba(0,0,0,0.8), 0 0 60px rgba(0,0,0,0.5);
    opacity: 0;
    animation: fadeUp 1.2s 0.3s forwards;
  }
  .scene-author {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 16px;
    color: var(--gold);
    letter-spacing: 8px;
    margin-top: 14px;
    opacity: 0;
    animation: fadeUp 1s 0.9s forwards;
  }
  .scene-divider {
    width: 60px;
    height: 1px;
    background: var(--cinnabar);
    margin: 30px auto;
    opacity: 0;
    animation: fadeUp 1s 1.3s forwards;
  }
  .scene-lines {
    margin-top: 10px;
  }
  .scene-line {
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
    font-size: clamp(20px, 2.4vw, 28px);
    color: var(--paper);
    line-height: 2.4;
    letter-spacing: 6px;
    text-shadow: 0 2px 16px rgba(0,0,0,0.7);
    opacity: 0;
  }
  .scene-line .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .scene-line.show .ch { opacity: 1; transform: translateY(0); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .scene-mood {
    margin-top: 44px;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    color: rgba(245,240,230,0.7);
    letter-spacing: 4px;
    line-height: 2;
    max-width: 560px;
    text-align: center;
    opacity: 0;
    animation: fadeUp 1.2s 2.2s forwards;
    padding: 0 20px;
  }
  .scene-bg-info {
    margin-top: 22px;
    font-size: 13px;
    color: rgba(201,169,110,0.7);
    letter-spacing: 3px;
    line-height: 1.9;
    max-width: 560px;
    text-align: center;
    opacity: 0;
    animation: fadeUp 1.2s 2.6s forwards;
    padding: 0 20px;
  }

  /* 控制栏 */
  .scene-controls {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    gap: 16px;
    padding: 10px 20px;
    background: rgba(13,13,13,0.5);
    border: 1px solid rgba(201,169,110,0.2);
    border-radius: 40px;
    backdrop-filter: blur(12px);
    opacity: 0;
    animation: fadeUp 1s 1.5s forwards;
  }
  .ctrl-btn {
    background: transparent;
    border: 1px solid rgba(245,240,230,0.2);
    color: var(--paper);
    width: 44px; height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
    font-family: 'Noto Serif SC', serif;
  }
  .ctrl-btn:hover {
    background: var(--cinnabar);
    border-color: var(--cinnabar);
    transform: scale(1.08);
  }
  .ctrl-btn.wide { width: auto; padding: 0 22px; border-radius: 22px; font-size: 13px; letter-spacing: 3px; }
  .ctrl-btn.active { background: var(--cinnabar); border-color: var(--cinnabar); }

  /* 朗读高亮 */
  .scene-line.reading { color: var(--gold); text-shadow: 0 0 20px rgba(201,169,110,0.6); }

  /* 加载遮罩 */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: #0d0d0d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease;
  }
  .loader.hide { opacity: 0; pointer-events: none; }
  .loader-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 56px;
    color: var(--paper);
    letter-spacing: 12px;
    animation: breath 2.5s ease-in-out infinite;
  }
  .loader-sub {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 8px;
    margin-top: 18px;
    opacity: 0.7;
  }
  @keyframes breath {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.03); }
  }

  /* 响应式 */
  @media (max-width: 768px) {
    .topbar { padding: 16px 18px 20px; }
    .brand-title { font-size: 26px; letter-spacing: 4px; }
    .seal { width: 38px; height: 38px; font-size: 22px; }
    .brand-sub { font-size: 11px; letter-spacing: 5px; margin-left: 50px; }
    .top-meta .count { font-size: 22px; }
    .panel { width: 100vw; }
    .scene-overlay { padding: 40px 20px; }
    .hint { font-size: 12px; letter-spacing: 4px; bottom: 30px; }
    .auth-card { width: 92vw; padding: 36px 26px; }
    .compose-card { width: 95vw; max-height: 92vh; overflow-y: auto; }
    .user-actions { gap: 8px; }
    .user-btn { padding: 6px 12px; font-size: 12px; letter-spacing: 2px; }
  }

  /* ============ 用户状态栏 ============ */
  .user-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: auto;
  }
  .user-btn {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--paper);
    background: rgba(245,240,230,0.06);
    border: 1px solid rgba(201,169,110,0.3);
    padding: 8px 18px;
    border-radius: 22px;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .user-btn:hover {
    background: var(--cinnabar);
    border-color: var(--cinnabar);
    transform: translateY(-1px);
  }
  .user-btn.primary {
    background: var(--cinnabar);
    border-color: var(--cinnabar);
  }
  .user-btn.primary:hover {
    background: var(--cinnabar-soft);
    border-color: var(--cinnabar-soft);
  }
  .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 16px 6px 6px;
    background: rgba(245,240,230,0.06);
    border: 1px solid rgba(201,169,110,0.3);
    border-radius: 22px;
  }
  .user-avatar {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--cinnabar), var(--gold));
    color: var(--paper);
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .user-name {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    color: var(--paper);
    letter-spacing: 2px;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ============ 登录/注册页 ============ */
  .auth-overlay {
    position: fixed;
    inset: 0;
    z-index: 3000;
    background: radial-gradient(ellipse at center, #1a1715 0%, #0a0807 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .auth-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .auth-overlay::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(193,39,45,0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(201,169,110,0.06) 0%, transparent 40%);
    pointer-events: none;
  }
  .auth-card {
    position: relative;
    width: 400px;
    max-width: 90vw;
    background: linear-gradient(180deg, rgba(26,24,21,0.95) 0%, rgba(20,17,13,0.95) 100%);
    border: 1px solid rgba(201,169,110,0.25);
    border-radius: 8px;
    padding: 48px 40px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,169,110,0.08);
    backdrop-filter: blur(20px);
    transform: translateY(20px);
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .auth-overlay.show .auth-card { transform: translateY(0); }
  .auth-seal {
    width: 64px; height: 64px;
    margin: 0 auto 24px;
    background: var(--cinnabar);
    color: var(--paper);
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    box-shadow: 0 0 0 2px rgba(193,39,45,0.3), 0 8px 30px rgba(193,39,45,0.4);
    transform: rotate(-3deg);
  }
  .auth-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 32px;
    color: var(--paper);
    text-align: center;
    letter-spacing: 8px;
    margin-bottom: 6px;
  }
  .auth-sub {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 12px;
    color: var(--gold);
    text-align: center;
    letter-spacing: 6px;
    margin-bottom: 36px;
    opacity: 0.8;
  }
  .auth-tabs {
    display: flex;
    margin-bottom: 28px;
    border-bottom: 1px solid rgba(201,169,110,0.2);
  }
  .auth-tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 15px;
    letter-spacing: 4px;
    color: rgba(245,240,230,0.5);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.3s;
  }
  .auth-tab.active {
    color: var(--paper);
    border-bottom-color: var(--cinnabar);
  }
  .auth-field {
    margin-bottom: 20px;
  }
  .auth-label {
    display: block;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 4px;
    margin-bottom: 8px;
    opacity: 0.85;
  }
  .auth-input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(245,240,230,0.04);
    border: 1px solid rgba(201,169,110,0.2);
    border-radius: 4px;
    color: var(--paper);
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    letter-spacing: 1px;
    transition: all 0.3s;
    outline: none;
  }
  .auth-input:focus {
    border-color: var(--cinnabar);
    background: rgba(245,240,230,0.07);
    box-shadow: 0 0 0 3px rgba(193,39,45,0.1);
  }
  .auth-input::placeholder { color: rgba(245,240,230,0.3); }
  .auth-submit {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    background: var(--cinnabar);
    border: none;
    border-radius: 4px;
    color: var(--paper);
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 20px;
    letter-spacing: 8px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .auth-submit:hover {
    background: var(--cinnabar-soft);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(193,39,45,0.4);
  }
  .auth-error {
    color: var(--cinnabar-soft);
    font-size: 13px;
    text-align: center;
    margin-top: 16px;
    min-height: 20px;
    font-family: 'ZCOOL XiaoWei', serif;
    letter-spacing: 2px;
  }
  .auth-skip {
    display: block;
    margin: 20px auto 0;
    background: transparent;
    border: none;
    color: rgba(201,169,110,0.6);
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 12px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: color 0.3s;
  }
  .auth-skip:hover { color: var(--gold); }

  /* ============ 诗歌创作表单 ============ */
  .compose-overlay {
    position: fixed;
    inset: 0;
    z-index: 2500;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .compose-overlay.show {
    opacity: 1;
    pointer-events: auto;

<body>

<!-- 加载页 -->
<div class="loader" id="loader">
  <div class="loader-title">诗境</div>
  <div class="loader-sub">山川入墨 · 诗落人间</div>
</div>

<!-- 水墨星空背景 -->
<canvas id="starCanvas"></canvas>

<!-- 3D 地球仪 -->
<div id="globe"></div>
<div class="globe-tip" id="globeTip"></div>

<!-- 顶部标题栏 -->
<div class="topbar">
  <div class="brand">
    <div class="brand-row">
      <div class="seal">诗</div>
      <div class="brand-title">诗境</div>
    </div>
    <div class="brand-sub">全 球 诗 意 可 视 化 生 成 器</div>
  </div>
  <div class="top-meta">
    <div class="count"><span id="poemCount">0</span> 首 · <span id="locCount">0</span> 地</div>
    <div class="label">点 墨 寻 诗</div>
    <div class="user-actions" id="userActions" style="margin-top:14px;">
      <!-- 未登录状态 -->
      <button class="user-btn primary" id="btnLogin" onclick="showAuth()">登 录</button>
      <button class="user-btn" id="btnRegister" onclick="showAuth('register')">注 册</button>
      <!-- 已登录状态（默认隐藏） -->
      <div class="user-info" id="userInfo" style="display:none;">
        <div class="user-avatar" id="userAvatar">客</div>
        <div class="user-name" id="userName">游客</div>
      </div>
      <button class="user-btn primary" id="btnCompose" style="display:none;" onclick="showCompose()">题 诗</button>
      <button class="user-btn" id="btnLogout" style="display:none;" onclick="logout()">登 出</button>
    </div>
  </div>
</div>

<!-- 引导提示 -->
<div class="hint" id="hint">点 击 墨 点 · 寻 一 首 诗</div>

<!-- 诗歌面板 -->
<div class="panel" id="panel">
  <div class="panel-header">
    <div class="panel-loc" id="panelLoc">诗 之 所 生</div>
    <div class="panel-title" id="panelTitle">地名</div>
    <button class="panel-close" id="panelClose" aria-label="关闭">✕</button>
  </div>
  <div class="panel-list" id="panelList"></div>
</div>

<!-- 意境展示页 -->
<div class="scene" id="scene">
  <canvas id="sceneCanvas"></canvas>
  <div class="scene-overlay">
    <div class="scene-poem">
      <div class="scene-title" id="sceneTitle">诗名</div>
      <div class="scene-author" id="sceneAuthor">作者 · 朝代</div>
      <div class="scene-divider"></div>
      <div class="scene-lines" id="sceneLines"></div>
      <div class="scene-mood" id="sceneMood"></div>
      <div class="scene-bg-info" id="sceneBg"></div>
    </div>
  </div>
  <div class="scene-controls">
    <button class="ctrl-btn wide" id="btnRead" title="朗读">朗 读</button>
    <button class="ctrl-btn" id="btnReplay" title="重播动画">↻</button>
    <button class="ctrl-btn" id="btnClose" title="返回地图">✕</button>
  </div>
</div>

<!-- 登录/注册页 -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-seal">诗</div>
    <div class="auth-title" id="authTitle">登 录</div>
    <div class="auth-sub">入 诗 境 · 题 己 怀</div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">登 录</div>
      <div class="auth-tab" id="tabRegister" onclick="switchAuth('register')">注 册</div>
    </div>
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="auth-field" id="regNameField" style="display:none;">
        <label class="auth-label">笔 名</label>
        <input class="auth-input" type="text" id="authName" placeholder="请取一个笔名" maxlength="20" />
      </div>
      <div class="auth-field">
        <label class="auth-label">账 号</label>
        <input class="auth-input" type="text" id="authAccount" placeholder="请输入账号" maxlength="30" required />
      </div>
      <div class="auth-field">
        <label class="auth-label">密 码</label>
        <input class="auth-input" type="password" id="authPassword" placeholder="请输入密码" minlength="3" maxlength="30" required />
      </div>
      <button class="auth-submit" type="submit" id="authSubmit">登 录</button>
      <div class="auth-error" id="authError"></div>
    </form>
    <button class="auth-skip" onclick="hideAuth()">以游客身份浏览</button>
  </div>
</div>

<!-- 诗歌创作表单 -->
<div class="compose-overlay" id="composeOverlay">
  <div class="compose-card">
    <div class="compose-header">
      <div class="compose-title">题 诗</div>
      <div class="compose-sub">落 墨 成 诗 · 留 迹 山 河</div>
      <button class="compose-close" onclick="hideCompose()">✕</button>
    </div>
    <div class="compose-body">
      <div class="compose-row">
        <div class="compose-field">
          <label class="compose-label">诗 题<span class="req">*</span></label>
          <input class="compose-input" type="text" id="cpTitle" placeholder="如：静夜思" maxlength="30" />
        </div>
        <div class="compose-field">
          <label class="compose-label">作 者</label>
          <input class="compose-input" type="text" id="cpAuthor" placeholder="默认为笔名" maxlength="20" />
        </div>
      </div>
      <div class="compose-row">
        <div class="compose-field">
          <label class="compose-label">朝 代 / 国 别</label>
          <input class="compose-input" type="text" id="cpDynasty" placeholder="如：唐 / 现代 / 日本" maxlength="15" />
        </div>
        <div class="compose-field">
          <label class="compose-label">地 名<span class="req">*</span></label>
          <input class="compose-input" type="text" id="cpLocName" placeholder="如：长安 / 巴黎" maxlength="20" />
        </div>
      </div>
      <div class="compose-row">
        <div class="compose-field">
          <label class="compose-label">纬 度<span class="req">*</span></label>
          <input class="compose-input" type="number" id="cpLat" placeholder="-90 至 90" step="0.01" min="-90" max="90" />
        </div>
        <div class="compose-field">
          <label class="compose-label">经 度<span class="req">*</span></label>
          <input class="compose-input" type="number" id="cpLng" placeholder="-180 至 180" step="0.01" min="-180" max="180" />
        </div>
      </div>
      <div class="compose-field full" style="margin-bottom:18px;">
        <label class="compose-label">诗 句<span class="req">*</span>（每行一句，回车换行）</label>
        <textarea class="compose-textarea" id="cpContent" placeholder="床前明月光，&#10;疑是地上霜。&#10;举头望明月，&#10;低头思故乡。"></textarea>
      </div>
      <div class="compose-field full" style="margin-bottom:18px;">
        <label class="compose-label">意 境<span class="req">*</span></label>
        <div class="mood-grid" id="moodGrid">
          <div class="mood-option active" data-mood="night">夜 · 月</div>
          <div class="mood-option" data-mood="mountain">山 · 岳</div>
          <div class="mood-option" data-mood="water">湖 · 海</div>
          <div class="mood-option" data-mood="river">江 · 河</div>
          <div class="mood-option" data-mood="waterfall">瀑 · 泉</div>
          <div class="mood-option" data-mood="rain">雨 · 霖</div>
          <div class="mood-option" data-mood="snow">雪 · 霜</div>
          <div class="mood-option" data-mood="clouds">云 · 雾</div>
          <div class="mood-option" data-mood="desert">沙 · 漠</div>
        </div>
      </div>
      <div class="compose-field full" style="margin-bottom:18px;">
        <label class="compose-label">意境释义（选填）</label>
        <input class="compose-input" type="text" id="cpMoodText" placeholder="如：月落乌啼，江枫渔火，一缕客愁" maxlength="80" />
      </div>
      <div class="compose-field full">
        <label class="compose-label">创作背景（选填）</label>
        <input class="compose-input" type="text" id="cpBackground" placeholder="如：秋夜客居，望月思乡" maxlength="80" />
      </div>
    </div>
    <div class="compose-footer">
      <button class="compose-btn" onclick="hideCompose()">取 消</button>
      <button class="compose-btn primary" onclick="submitCompose()">落 墨</button>
    </div>
  </div>
</div>

/* ============================================================
   水墨星空背景
   ============================================================ */
class StarCanvas {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.stars = [];
    this.inkParticles = [];
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.initStars();
    this.initInkParticles();
    this.animate();
  }
  resize() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
  }
  initStars() {
    const count = Math.floor((this.canvas.width * this.canvas.height) / 4500);
    for (let i = 0; i < count; i++) {
      this.stars.push({
        x: Math.random() * this.canvas.width,
        y: Math.random() * this.canvas.height,
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.6 + 0.2,
        twinkle: Math.random() * Math.PI * 2,
        twinkleSpeed: Math.random() * 0.02 + 0.005
      });
    }
  }
  initInkParticles() {
    const count = 8;
    for (let i = 0; i < count; i++) {
      this.inkParticles.push({
        x: Math.random() * this.canvas.width,
        y: Math.random() * this.canvas.height,
        radius: Math.random() * 80 + 40,
        alpha: Math.random() * 0.08 + 0.02,
        angle: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.002 + 0.001
      });
    }
  }
  drawStars() {
    this.stars.forEach(s => {
      s.twinkle += s.twinkleSpeed;
      const a = s.alpha * (0.6 + 0.4 * Math.sin(s.twinkle));
      this.ctx.fillStyle = `rgba(232,228,216,${a})`;
      this.ctx.beginPath();
      this.ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      this.ctx.fill();
    });
  }
  drawInk() {
    this.inkParticles.forEach(p => {
      p.angle += p.speed;
      p.x += Math.cos(p.angle) * 0.3;
      p.y += Math.sin(p.angle) * 0.3;
      if (p.x < -p.radius) p.x = this.canvas.width + p.radius;
      if (p.x > this.canvas.width + p.radius) p.x = -p.radius;
      if (p.y < -p.radius) p.y = this.canvas.height + p.radius;
      if (p.y > this.canvas.height + p.radius) p.y = -p.radius;

      const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
      gradient.addColorStop(0, `rgba(60,50,40,${p.alpha})`);
      gradient.addColorStop(0.5, `rgba(30,25,20,${p.alpha * 0.5})`);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      this.ctx.fillStyle = gradient;
      this.ctx.beginPath();
      this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      this.ctx.fill();
    });
  }
  drawMilkyWay() {
    const cx = this.canvas.width * 0.3;
    const cy = this.canvas.height * 0.5;
    const gradient = this.ctx.createRadialGradient(cx, cy, 0, cx, cy, 300);
    gradient.addColorStop(0, 'rgba(40,35,30,0.08)');
    gradient.addColorStop(0.5, 'rgba(30,25,20,0.03)');
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    this.ctx.fillStyle = gradient;
    this.ctx.beginPath();
    this.ctx.ellipse(cx, cy, 200, 80, -0.3, 0, Math.PI * 2);
    this.ctx.fill();
  }
  animate() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.drawInk();
    this.drawMilkyWay();
    this.drawStars();
    requestAnimationFrame(() => this.animate());
  }
}

function getUsers() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '{}'); }
  catch (e) { return {}; }
}
function saveUsers(users) {
  localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
}
function getCurrentUser() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.CURRENT) || 'null'); }
  catch (e) { return null; }
}
function saveCurrentUser(user) {
  if (user) localStorage.setItem(STORAGE_KEYS.CURRENT, JSON.stringify(user));
  else localStorage.removeItem(STORAGE_KEYS.CURRENT);
}
function getCustomPoems() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.POEMS) || '[]'); }
  catch (e) { return []; }
}
function saveCustomPoems(poems) {
  localStorage.setItem(STORAGE_KEYS.POEMS, JSON.stringify(poems));
}
// 获取所有诗歌（内置 + 当前用户创作）
function getAllPoems() {
  const custom = getCustomPoems().filter(p => !p.userId || p.userId === (getCurrentUser() || {}).id);
  if (USE_MOCK) {
    return MOCK_POEMS.concat(custom);
  }
  return POEMS.concat(custom);
}

/* ============================================================
   认证逻辑
   ============================================================ */
function showAuth(mode) {
  authMode = mode || 'login';
  switchAuth(authMode);
  document.getElementById('authError').textContent = '';
  document.getElementById('authOverlay').classList.add('show');
}
function hideAuth() {
  document.getElementById('authOverlay').classList.remove('show');
  document.getElementById('authForm').reset();
}
function switchAuth(mode) {
  authMode = mode;
  const isLogin = mode === 'login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabRegister').classList.toggle('active', !isLogin);
  document.getElementById('authTitle').textContent = isLogin ? '登 录' : '注 册';
  document.getElementById('authSubmit').textContent = isLogin ? '登 录' : '注 册';
  document.getElementById('regNameField').style.display = isLogin ? 'none' : 'block';
  document.getElementById('authError').textContent = '';
}
function handleAuth(e) {
  e.preventDefault();
  const account = document.getElementById('authAccount').value.trim();
  const password = document.getElementById('authPassword').value;
  const name = document.getElementById('authName').value.trim();
  const users = getUsers();
  const errEl = document.getElementById('authError');

  if (authMode === 'register') {
    if (!name) { errEl.textContent = '请输入笔名'; return; }
    if (users[account]) { errEl.textContent = '该账号已存在'; return; }
    users[account] = {
      id: 'u_' + Date.now(),
      account: account,
      name: name,
      password: password,
      createdAt: Date.now()
    };
    saveUsers(users);
    saveCurrentUser(users[account]);
    errEl.textContent = '';
    hideAuth();
    updateUserUI();
    refreshGlobe();
  } else {
    if (!users[account] || users[account].password !== password) {
      errEl.textContent = '账号或密码错误';
      return;
    }
    saveCurrentUser(users[account]);
    errEl.textContent = '';
    hideAuth();
    updateUserUI();
    refreshGlobe();
  }
}
function logout() {
  saveCurrentUser(null);
  updateUserUI();
  refreshGlobe();
}
function updateUserUI() {
  const user = getCurrentUser();
  const logged = !!user;
  document.getElementById('btnLogin').style.display = logged ? 'none' : '';
  document.getElementById('btnRegister').style.display = logged ? 'none' : '';
  document.getElementById('userInfo').style.display = logged ? 'flex' : 'none';
  document.getElementById('btnCompose').style.display = logged ? '' : 'none';
  document.getElementById('btnLogout').style.display = logged ? '' : 'none';
  if (logged) {
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userAvatar').textContent = user.name.charAt(0);
  }
}

/* ============================================================
   诗歌创作逻辑
   ============================================================ */
function showCompose() {
  if (!getCurrentUser()) { showAuth(); return; }
  const user = getCurrentUser();
  document.getElementById('cpAuthor').value = user.name;
  document.getElementById('composeOverlay').classList.add('show');
}
function hideCompose() {
  document.getElementById('composeOverlay').classList.remove('show');
}
function submitCompose() {
  const title = document.getElementById('cpTitle').value.trim();
  const locName = document.getElementById('cpLocName').value.trim();
  const lat = parseFloat(document.getElementById('cpLat').value);
  const lng = parseFloat(document.getElementById('cpLng').value);
  const contentRaw = document.getElementById('cpContent').value.trim();
  const user = getCurrentUser();

  if (!title) { alert('请输入诗题'); return; }
  if (!locName) { alert('请输入地名'); return; }
  if (isNaN(lat) || lat < -90 || lat > 90) { alert('请输入有效纬度（-90 至 90）'); return; }
  if (isNaN(lng) || lng < -180 || lng > 180) { alert('请输入有效经度（-180 至 180）'); return; }
  if (!contentRaw) { alert('请输入诗句'); return; }

  const content = contentRaw.split(/\r?\n/).map(s => s.trim()).filter(s => s);
  if (content.length === 0) { alert('请输入诗句'); return; }

  const author = document.getElementById('cpAuthor').value.trim() || user.name;
  const dynasty = document.getElementById('cpDynasty').value.trim() || '今';
  const moodText = document.getElementById('cpMoodText').value.trim() || '此中真意，欲辨忘言。';
  const background = document.getElementById('cpBackground').value.trim() || (user.name + ' 题于 ' + locName);

  const poem = {
    id: 'custom_' + Date.now(),
    title: title,
    author: author,
    dynasty: dynasty,
    content: content,
    location: { name: locName, lat: lat, lng: lng },
    scene: MOOD_SCENES[selectedMood],
    background: background,
    moodText: moodText,
    userId: user.id,
    custom: true
  };

  const poems = getCustomPoems();
  poems.push(poem);
  saveCustomPoems(poems);

  hideCompose();
  // 清空表单
  ['cpTitle','cpAuthor','cpDynasty','cpLocName','cpLat','cpLng','cpContent','cpMoodText','cpBackground'].forEach(id => {
    document.getElementById(id).value = '';
  });
  refreshGlobe();
  // 飞到新创作地点
  if (map) {
    map.pointOfView({ lat: lat, lng: lng, altitude: 1.8 }, 1200);
  }
}

/* ============================================================
   刷新地球仪数据
   ============================================================ */
function refreshGlobe() {
  if (!map) return;
  const allPoems = getAllPoems();
  const locMap = {};
  allPoems.forEach(p => {
    const key = p.location.name;
    if (!locMap[key]) locMap[key] = { name: p.location.name, lat: p.location.lat, lng: p.location.lng, poems: [] };
    locMap[key].poems.push(p);
  });
  const locations = Object.values(locMap);

  map.pointsData(locations)
    .ringsData(locations)
    .labelsData(locations);

  document.getElementById('poemCount').textContent = allPoems.length;
  document.getElementById('locCount').textContent = locations.length;
}

/* ============================================================
   初始化 3D 地球仪
   ============================================================ */
function initGlobe() {
  // 按地点分组
  const allPoems = getAllPoems();
  const locMap = {};
  allPoems.forEach(p => {
    const key = p.location.name;
    if (!locMap[key]) locMap[key] = { name: p.location.name, lat: p.location.lat, lng: p.location.lng, poems: [] };
    locMap[key].poems.push(p);
  });
  const locations = Object.values(locMap);

  const world = Globe()(document.getElementById('globe'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
    .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
    .backgroundColor('#000000')
    .showAtmosphere(true)
    .atmosphereColor('#d4c4a8')
    .atmosphereAltitude(0.22)
    .pointsData(locations)
    .pointLat('lat')
    .pointLng('lng')
    .pointAltitude(0.018)
    .pointColor(d => d.poems.some(p => p.custom) ? '#4a7c59' : '#c1272d')
    .pointRadius(0.35)
    .pointResolution(12)
    .pointLabel(d => `<div style="font-family:'ZCOOL XiaoWei',serif;letter-spacing:3px;padding:8px 16px;background:rgba(13,13,13,0.95);border:1px solid rgba(201,169,110,0.5);color:#f5f0e6;font-size:14px;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,0.6);">${d.name}<span style="color:#d94a4f;margin-left:12px;">${d.poems.length} 首</span></div>`)
    .onPointClick(point => openPanel(point))
    .onPointHover(point => { world.controls().autoRotate = !point; })
    .ringsData(locations)
    .ringLat('lat')
    .ringLng('lng')
    .ringColor(d => d.poems.some(p => p.custom) ? t => `rgba(74,124,89,${0.8 * (1 - t)})` : t => `rgba(193,39,45,${0.8 * (1 - t)})`)
    .ringMaxRadius(4)
    .ringPropagationSpeed(0.8)
    .ringRepeatPeriod(2000)
    .labelsData(locations)
    .labelLat('lat')
    .labelLng('lng')
    .labelText('name')
    .labelSize(0.016)
    .labelColor(() => 'rgba(245,240,230,0.95)')
    .labelDotRadius(0)
    .labelAltitude(0.015)
    .labelResolution(4);

  world.pointOfView({ lat: 30, lng: 120, altitude: 2.8 }, 1500);

  const controls = world.controls();
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.25;
  controls.enableZoom = true;
  controls.minDistance = 140;
  controls.maxDistance = 500;
  controls.rotateSpeed = 0.6;
  controls.enablePan = false;

  map = world;

  // 更新计数
  document.getElementById('poemCount').textContent = allPoems.length;
  document.getElementById('locCount').textContent = locations.length;
}

function generatePoeticLines(locations) {
  const lines = [];
  for (let i = 0; i < locations.length; i++) {
    for (let j = i + 1; j < locations.length; j++) {
      const dist = Math.acos(Math.sin(locations[i].lat * Math.PI / 180) * Math.sin(locations[j].lat * Math.PI / 180) +
        Math.cos(locations[i].lat * Math.PI / 180) * Math.cos(locations[j].lat * Math.PI / 180) *
        Math.cos(Math.abs(locations[i].lng - locations[j].lng) * Math.PI / 180));
      if (dist < 2.5 && Math.random() > 0.4) {
        lines.push({
          startLat: locations[i].lat,
          startLng: locations[i].lng,
          endLat: locations[j].lat,
          endLng: locations[j].lng
        });
      }
    }
  }
  return lines;
}

/* ============================================================
   意境展示页
   ============================================================ */
function openScene(poem) {
  const scene = document.getElementById('scene');
  document.getElementById('sceneTitle').textContent = poem.title;
  document.getElementById('sceneAuthor').textContent = `${poem.author} · ${poem.dynasty}`;
  document.getElementById('sceneMood').textContent = poem.moodText;
  document.getElementById('sceneBg').textContent = poem.background;

  // 渲染诗句（逐字）
  const linesBox = document.getElementById('sceneLines');
  linesBox.innerHTML = '';
  poem.content.forEach((line, li) => {
    const lineEl = document.createElement('div');
    lineEl.className = 'scene-line';
    Array.from(line).forEach(ch => {
      const span = document.createElement('span');
      span.className = 'ch';
      span.textContent = ch;
      lineEl.appendChild(span);
    });
    linesBox.appendChild(lineEl);
  });

  // 重置动画
  scene.classList.remove('active');
  void scene.offsetWidth;
  scene.classList.add('active');

  // 启动意境引擎
  if (sceneEngine) sceneEngine.stop();
  sceneEngine = new SceneEngine(document.getElementById('sceneCanvas'), poem.scene);
  sceneEngine.start();

  // 逐字逐行浮现
  const lines = linesBox.querySelectorAll('.scene-line');
  let charDelay = 1.5; // 从 1.5s 开始
  lines.forEach((line, li) => {
    const chars = line.querySelectorAll('.ch');
    chars.forEach((ch, ci) => {
      ch.style.transitionDelay = `${charDelay}s`;
      charDelay += 0.06;
    });
    // 整行显示触发
    setTimeout(() => line.classList.add('show'), 1500 + li * 100);
  });
  // 统一触发字符浮现（用 transition delay 错开）
  setTimeout(() => {
    lines.forEach(line => line.classList.add('show'));
  }, 1500);

  stopReading();
  document.getElementById('btnRead').textContent = '朗 读';
  document.getElementById('btnRead').classList.remove('active');
}

function closeScene() {
  document.getElementById('scene').classList.remove('active');
  if (sceneEngine) { sceneEngine.stop(); sceneEngine = null; }
  stopReading();
}

function replayScene() {
  const lines = document.querySelectorAll('.scene-line');
  lines.forEach(line => {
    line.classList.remove('show');
    line.querySelectorAll('.ch').forEach(ch => {
      ch.style.transitionDelay = '0s';
    });
  });
  setTimeout(() => {
    let charDelay = 0;
    lines.forEach((line, li) => {
      const chars = line.querySelectorAll('.ch');
      chars.forEach((ch, ci) => {
        ch.style.transitionDelay = `${charDelay}s`;
        charDelay += 0.06;
      });
    });
    lines.forEach(line => line.classList.add('show'));
  }, 100);
  if (sceneEngine) sceneEngine.restart();
}

/* ============================================================
   朗读（Web Speech API）
   ============================================================ */
function toggleRead() {
  if (isReading) {
    stopReading();
    return;
  }
  if (!('speechSynthesis' in window)) {
    alert('您的浏览器不支持语音朗读');
    return;
  }
  const title = document.getElementById('sceneTitle').textContent;
  const author = document.getElementById('sceneAuthor').textContent;
  const lines = document.querySelectorAll('.scene-line');
  const text = Array.from(lines).map(l => l.textContent).join('');

  speechSynthesis.cancel();
  speechUtter = new SpeechSynthesisUtterance(`${title}，${author}。${text}`);
  speechUtter.lang = 'zh-CN';
  speechUtter.rate = 0.75;
  speechUtter.pitch = 0.9;

  // 逐行高亮（粗略按时间）
  isReading = true;
  document.getElementById('btnRead').textContent = '停 止';
  document.getElementById('btnRead').classList.add('active');

  let lineIdx = 0;
  const highlight = () => {
    lines.forEach(l => l.classList.remove('reading'));
    if (lineIdx < lines.length) {
      lines[lineIdx].classList.add('reading');
      lineIdx++;
      setTimeout(highlight, 2200);
    }
  };
  setTimeout(highlight, 1500);

  speechUtter.onend = () => {
    stopReading();
    lines.forEach(l => l.classList.remove('reading'));
  };
  speechSynthesis.speak(speechUtter);
}

function stopReading() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  isReading = false;
  document.getElementById('btnRead').textContent = '朗 读';
  document.getElementById('btnRead').classList.remove('active');
  document.querySelectorAll('.scene-line').forEach(l => l.classList.remove('reading'));
}

/* ============================================================
   意境渲染引擎（Canvas 粒子系统）
   ============================================================ */
class SceneEngine {
  constructor(canvas, sceneConfig) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.config = sceneConfig;
    this.particles = [];
    this.elements = sceneConfig.elements || [];
    this.running = false;
    this.rafId = null;
    this.time = 0;
    this.resize();
    window.addEventListener('resize', this._resizeHandler = () => this.resize());
  }

  resize() {
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = window.innerWidth * dpr;
    this.canvas.height = window.innerHeight * dpr;
    this.canvas.style.width = window.innerWidth + 'px';
    this.canvas.style.height = window.innerHeight + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    this.initParticles();
  }

  initParticles() {
    this.particles = [];
    const t = this.config.type;
    const count = t === 'waterfall' ? 180 : t === 'rain' ? 160 : t === 'snow' ? 200 : t === 'desert' ? 120 : t === 'night' ? 100 : 140;

    for (let i = 0; i < count; i++) {
      this.particles.push(this.createParticle(t));
    }
  }

  createParticle(type) {
    const w = this.w, h = this.h;
    switch (type) {
      case 'waterfall':
        return {
          x: w * 0.3 + Math.random() * w * 0.4,
          y: -Math.random() * h,
          vx: (Math.random() - 0.5) * 0.5,
          vy: 4 + Math.random() * 6,
          size: 1 + Math.random() * 2.5,
          alpha: 0.3 + Math.random() * 0.5,
          len: 8 + Math.random() * 20
        };
      case 'rain':
        return {
          x: Math.random() * w,
          y: -Math.random() * h,
          vx: -1.2,
          vy: 6 + Math.random() * 5,
          size: 1 + Math.random() * 1.5,
          alpha: 0.2 + Math.random() * 0.4,
          len: 10 + Math.random() * 16
        };
      case 'snow':
        return {
          x: Math.random() * w,
          y: -Math.random() * h,
          vx: (Math.random() - 0.5) * 0.8,
          vy: 0.6 + Math.random() * 1.4,
          size: 1.5 + Math.random() * 3,
          alpha: 0.4 + Math.random() * 0.5,
          sway: Math.random() * Math.PI * 2,
          swaySpeed: 0.01 + Math.random() * 0.02,
          len: 0
        };
      case 'desert':
        return {
          x: Math.random() * w,
          y: h * 0.4 + Math.random() * h * 0.6,
          vx: 1.5 + Math.random() * 2.5,
          vy: (Math.random() - 0.5) * 0.5,
          size: 1 + Math.random() * 2,
          alpha: 0.15 + Math.random() * 0.35,
          len: 0
        };
      case 'night':
        return {
          x: Math.random() * w,
          y: Math.random() * h * 0.7,
          vx: 0,
          vy: 0,
          size: 0.5 + Math.random() * 1.8,
          alpha: 0.3 + Math.random() * 0.6,
          twinkle: Math.random() * Math.PI * 2,
          len: 0
        };
      case 'clouds':
        return {
          x: Math.random() * w,
          y: h * 0.2 + Math.random() * h * 0.4,
          vx: 0.2 + Math.random() * 0.5,
          vy: 0,
          size: 40 + Math.random() * 80,
          alpha: 0.05 + Math.random() * 0.12,
          len: 0
        };
      case 'river':
        return {
          x: Math.random() * w,
          y: h * 0.5 + Math.random() * h * 0.5,
          vx: 1 + Math.random() * 2,
          vy: (Math.random() - 0.5) * 0.3,
          size: 1 + Math.random() * 2,
          alpha: 0.2 + Math.random() * 0.4,
          len: 0
        };
      case 'water':
      case 'mountain':
      default:
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -0.2 - Math.random() * 0.4,
          size: 1 + Math.random() * 2,
          alpha: 0.1 + Math.random() * 0.3,
          len: 0
        };
    }
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.loop();
  }

  stop() {
    this.running = false;
    if (this.rafId) cancelAnimationFrame(this.rafId);
    window.removeEventListener('resize', this._resizeHandler);
    this.ctx.clearRect(0, 0, this.w, this.h);
  }

  restart() {
    this.initParticles();
    this.time = 0;
  }

  loop() {
    if (!this.running) return;
    this.time += 0.016;
    this.draw();
    this.rafId = requestAnimationFrame(() => this.loop());
  }

  draw() {
    const { ctx, w, h, config } = this;
    // 背景渐变
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, config.colors[0]);
    grad.addColorStop(0.5, config.colors[1]);
    grad.addColorStop(1, config.colors[2] || config.colors[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // 元素层（远景）
    this.drawElements();

    // 粒子层
    this.drawParticles();

    // 暗角
    const vignette = ctx.createRadialGradient(w/2, h/2, h*0.3, w/2, h/2, h*0.8);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, w, h);
  }

  drawElements() {
    const { ctx, w, h, time, elements, config } = this;

    // 月亮
    if (elements.includes('moon')) {
      const mx = w * 0.78, my = h * 0.22, r = Math.min(w, h) * 0.06;
      const moonGrad = ctx.createRadialGradient(mx, my, 0, mx, my, r * 2.5);
      moonGrad.addColorStop(0, 'rgba(245,240,220,0.95)');
      moonGrad.addColorStop(0.3, 'rgba(245,240,220,0.5)');
      moonGrad.addColorStop(1, 'rgba(245,240,220,0)');
      ctx.fillStyle = moonGrad;
      ctx.beginPath();
      ctx.arc(mx, my, r * 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(250,245,225,0.95)';
      ctx.beginPath();
      ctx.arc(mx, my, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 太阳
    if (elements.includes('sun')) {
      const sx = w * 0.72, sy = h * 0.32, r = Math.min(w, h) * 0.08;
      const sunGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 3);
      sunGrad.addColorStop(0, 'rgba(255,200,120,0.9)');
      sunGrad.addColorStop(0.3, 'rgba(255,170,80,0.4)');
      sunGrad.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(sx, sy, r * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,210,140,0.9)';
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 山峦剪影
    if (elements.includes('mountains')) {
      ctx.fillStyle = 'rgba(10,10,15,0.7)';
      ctx.beginPath();
      ctx.moveTo(0, h);
      const layers = 3;
      for (let l = 0; l < layers; l++) {
        const baseY = h * (0.55 + l * 0.12);
        const amp = 60 - l * 15;
        ctx.moveTo(0, baseY);
        for (let x = 0; x <= w; x += 20) {
          const y = baseY - Math.abs(Math.sin(x * 0.005 + l * 1.5 + time * 0.05)) * amp - Math.sin(x * 0.012 + l) * 20;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fillStyle = `rgba(8,8,12,${0.4 + l * 0.2})`;
        ctx.fill();
      }
    }

    // 湖面/水面
    if (elements.includes('lake') || elements.includes('water') || elements.includes('river')) {
      const waterY = h * 0.6;
      const waterGrad = ctx.createLinearGradient(0, waterY, 0, h);
      waterGrad.addColorStop(0, 'rgba(20,30,50,0.4)');
      waterGrad.addColorStop(1, 'rgba(10,15,30,0.8)');
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, waterY, w, h - waterY);
      // 水波纹
      ctx.strokeStyle = 'rgba(245,240,230,0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        const wy = waterY + 20 + i * 30;
        ctx.moveTo(0, wy);
        for (let x = 0; x <= w; x += 10) {
          ctx.lineTo(x, wy + Math.sin(x * 0.02 + time + i) * 2);
        }
        ctx.stroke();
      }
    }

    // 船
    if (elements.includes('boat')) {
      const bx = w * 0.5 + Math.sin(time * 0.3) * 8;
      const by = h * 0.72 + Math.sin(time * 0.5) * 3;
      ctx.fillStyle = 'rgba(20,15,10,0.85)';
      ctx.beginPath();
      ctx.moveTo(bx - 30, by);
      ctx.quadraticCurveTo(bx, by + 12, bx + 30, by);
      ctx.lineTo(bx + 24, by + 4);
      ctx.lineTo(bx - 24, by + 4);
      ctx.closePath();
      ctx.fill();
      // 帆
      ctx.fillStyle = 'rgba(245,240,230,0.5)';
      ctx.beginPath();
      ctx.moveTo(bx, by - 2);
      ctx.lineTo(bx, by - 34);
      ctx.lineTo(bx + 18, by - 6);
      ctx.closePath();
      ctx.fill();
    }

    // 渔火/灯火
    if (elements.includes('lamp')) {
      const lx = w * 0.42, ly = h * 0.7;
      const flicker = 0.7 + Math.sin(time * 8) * 0.15 + Math.sin(time * 13) * 0.1;
      const lampGrad = ctx.createRadialGradient(lx, ly, 0, lx, ly, 40);
      lampGrad.addColorStop(0, `rgba(255,180,80,${0.8 * flicker})`);
      lampGrad.addColorStop(0.4, `rgba(255,140,50,${0.3 * flicker})`);
      lampGrad.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = lampGrad;
      ctx.beginPath();
      ctx.arc(lx, ly, 40, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(255,220,150,${flicker})`;
      ctx.beginPath();
      ctx.arc(lx, ly, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // 花瓣
    if (elements.includes('petals')) {
      // 花瓣作为粒子在 drawParticles 中处理，这里画几片大的
      for (let i = 0; i < 8; i++) {
        const px = (w * 0.2 + i * 90 + time * 20) % w;
        const py = h * 0.3 + Math.sin(time + i) * 30 + i * 25;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(time + i);
        ctx.fillStyle = 'rgba(255,180,200,0.5)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 6, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // 雾气
    if (elements.includes('mist')) {
      for (let i = 0; i < 4; i++) {
        const my = h * 0.5 + i * 60;
        const mx = (time * 15 + i * 200) % (w + 200) - 100;
        const mistGrad = ctx.createRadialGradient(mx, my, 0, mx, my, 180);
        mistGrad.addColorStop(0, 'rgba(245,240,230,0.08)');
        mistGrad.addColorStop(1, 'rgba(245,240,230,0)');
        ctx.fillStyle = mistGrad;
        ctx.beginPath();
        ctx.arc(mx, my, 180, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 楼
    if (elements.includes('tower')) {
      const tx = w * 0.5, ty = h * 0.55;
      ctx.fillStyle = 'rgba(15,12,10,0.85)';
      // 简化楼阁剪影
      ctx.beginPath();
      ctx.moveTo(tx - 50, ty + 80);
      ctx.lineTo(tx - 50, ty + 20);
      ctx.lineTo(tx - 60, ty + 20);
      ctx.lineTo(tx - 40, ty - 10);
      ctx.lineTo(tx - 30, ty - 10);
      ctx.lineTo(tx - 35, ty - 30);
      ctx.lineTo(tx - 20, ty - 30);
      ctx.lineTo(tx, ty - 60);
      ctx.lineTo(tx + 20, ty - 30);
      ctx.lineTo(tx + 35, ty - 30);
      ctx.lineTo(tx + 30, ty - 10);
      ctx.lineTo(tx + 40, ty - 10);
      ctx.lineTo(tx + 60, ty + 20);
      ctx.lineTo(tx + 50, ty + 20);
      ctx.lineTo(tx + 50, ty + 80);
      ctx.closePath();
      ctx.fill();
    }
  }

  drawParticles() {
    const { ctx, w, h, particles, config, time } = this;
    const type = config.type;

    particles.forEach(p => {
      // 更新位置
      p.x += p.vx;
      p.y += p.vy;

      switch (type) {
        case 'waterfall':
          if (p.y > h) { p.y = -10; p.x = w * 0.3 + Math.random() * w * 0.4; }
          ctx.strokeStyle = `rgba(180,220,240,${p.alpha})`;
          ctx.lineWidth = p.size;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.vx * 2, p.y + p.len);
          ctx.stroke();
          break;
        case 'rain':
          if (p.y > h) { p.y = -20; p.x = Math.random() * w + 100; }
          ctx.strokeStyle = `rgba(180,220,230,${p.alpha})`;
          ctx.lineWidth = p.size;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 1.5, p.y + p.len);
          ctx.stroke();
          break;
        case 'snow':
          p.sway += p.swaySpeed;
          p.x += Math.sin(p.sway) * 0.6;
          if (p.y > h) { p.y = -10; p.x = Math.random() * w; }
          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;
          ctx.fillStyle = `rgba(245,245,250,${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'desert':
          if (p.x > w) { p.x = -10; p.y = h * 0.4 + Math.random() * h * 0.6; }
          ctx.fillStyle = `rgba(220,180,120,${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'night':
          p.twinkle += 0.05;
          const tw = (Math.sin(p.twinkle) + 1) / 2;
          ctx.fillStyle = `rgba(245,240,230,${p.alpha * tw})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'clouds':
          if (p.x > w + p.size) { p.x = -p.size; p.y = h * 0.2 + Math.random() * h * 0.4; }
          const cg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
          cg.addColorStop(0, `rgba(245,240,230,${p.alpha})`);
          cg.addColorStop(1, 'rgba(245,240,230,0)');
          ctx.fillStyle = cg;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'river':
          if (p.x > w) { p.x = -10; p.y = h * 0.5 + Math.random() * h * 0.5; }
          ctx.fillStyle = `rgba(150,200,220,${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          break;
        default:
          if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;
          ctx.fillStyle = `rgba(245,240,230,${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
      }
    });
  }
}

function hideHint() {
  const hint = document.getElementById('hint');
  if (!hint.classList.contains('hide')) hint.classList.add('hide');
}

/* ============================================================
   启动
   ============================================================ */
window.addEventListener('load', () => {
  initGlobe();
  // 初始化用户状态
  updateUserUI();

  // 隐藏 loader
  setTimeout(() => {
    document.getElementById('loader').classList.add('hide');
  }, 1200);

  // 绑定事件
  document.getElementById('panelClose').addEventListener('click', closePanel);
  document.getElementById('btnClose').addEventListener('click', closeScene);
  document.getElementById('btnReplay').addEventListener('click', replayScene);
  document.getElementById('btnRead').addEventListener('click', toggleRead);

  // 意境选择
  document.querySelectorAll('.mood-option').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.mood-option').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      selectedMood = opt.dataset.mood;
    });
  });

  // ESC 关闭
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('composeOverlay').classList.contains('show')) {
        hideCompose();
      } else if (document.getElementById('authOverlay').classList.contains('show')) {
        hideAuth();
      } else if (document.getElementById('scene').classList.contains('active')) {
        closeScene();
      } else if (document.getElementById('panel').classList.contains('open')) {
        closePanel();
      }
    }
  });

  // 首次点击地球隐藏提示
  document.getElementById('globe').addEventListener('click', hideHint, { once: true });
});
