<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Timer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 30%, #bae6fd 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 480px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        body.has-timers .header-section {
            position: relative;
            top: auto;
            left: auto;
            transform: none;
            margin-top: 20px;
        }
        .title {
            text-align: center;
            margin-bottom: 20px;
        }
        .title h1 {
            font-size: 32px;
            font-weight: 700;
            color: #0c4a6e;
            margin-bottom: 5px;
        }
        .title span {
            font-size: 14px;
            color: #64748b;
            letter-spacing: 2px;
        }
        .input-section {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .input-wrap {
            position: relative;
        }
        input {
            width: 100%;
            padding: 20px 20px 20px 60px;
            border: 2px solid transparent;
            border-radius: 16px;
            font-size: 18px;
            outline: none;
            background: white;
            box-shadow: 0 2px 12px rgba(14,165,233,0.08);
            transition: all 0.3s;
        }
        input:focus {
            border-color: #0ea5e9;
            box-shadow: 0 4px 20px rgba(14,165,233,0.15);
        }
        input::placeholder {
            color: #94a3b8;
            font-size: 16px;
        }
        .mic-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #e0f2fe;
            color: #0ea5e9;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }
        .mic-btn:hover {
            background: #0ea5e9;
            color: white;
        }
        .mic-btn.active {
            background: #0284c7;
            color: white;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.1); }
        }
        .demo-note {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 20px;
        }
        .demo-tip {
            font-size: 11px;
            color: #94a3b8;
        }
        .hidden {
            display: none !important;
        }
        
        .timers {
            display: none;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 480px;
            padding: 0 20px;
        }
        .timers.has-timers {
            display: flex;
        }
        .timer {
            background: rgba(255,255,255,0.85);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 480px;
        }
        .timer.active {
            background: rgba(255,255,255,0.95);
            border-bottom: 2px solid #7dd3fc;
        }
        .timer.completed {
            opacity: 0.5;
        }
        .timer-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            gap: 16px;
        }
        .timer-name {
            font-size: 14px;
            font-weight: 500;
            color: #475569;
        }
        .timer-status {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
        }
        .timer-status.waiting { background: rgba(14,165,233,0.1); color: #0284c7; }
        .timer-status.running { background: rgba(14,165,233,0.2); color: #0369a1; }
        .timer-status.completed { background: rgba(14,165,233,0.1); color: #64748b; }
        .timer-time {
            font-size: 36px;
            font-weight: 600;
            text-align: center;
            font-variant-numeric: tabular-nums;
            color: #1e3a5f;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .timer-time.running { color: #0284c7; }
        .timer-time.completed { color: #94a3b8; }
        .timer-actions {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(14,165,233,0.1);
            color: #0284c7;
        }
        .action-btn:hover {
            background: rgba(14,165,233,0.2);
        }
        .action-btn.delete {
            background: rgba(100,116,139,0.1);
            color: #64748b;
        }
        .action-btn.delete:hover {
            background: rgba(100,116,139,0.2);
        }
        .global-actions {
            display: none;
            justify-content: center;
            gap: 20px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
        }
        .global-actions.visible { display: flex; }
        .global-actions .action-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            padding: 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 400px) {
            .title h1 { font-size: 28px; }
            input { padding: 16px 16px 16px 54px; font-size: 16px; }
            .mic-btn { width: 36px; height: 36px; font-size: 18px; }
            .timer-time { font-size: 28px; }
            .action-btn { padding: 5px 10px; font-size: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section" id="headerSection">
            <div class="title" id="title">
                <h1>智能计时器</h1>
                <span>AI TIMER</span>
            </div>
            <div class="input-section" id="inputSection">
                <div class="input-wrap">
                    <button class="mic-btn" id="micBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </button>
                    <input type="text" id="input" placeholder="输入任务，如：开始学习" onkeydown="if(event.key==='Enter')generatePlan()">
                </div>
            </div>

            <div class="demo-note" id="demoNote">
                <p class="demo-tip">* demo 仅用于演示</p>
            </div>
        </div>

        <div class="timers" id="timers"></div>

        <div class="global-actions" id="globalActions">
            <button class="action-btn play" onclick="playAll()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="action-btn pause" onclick="pauseAll()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="action-btn delete" onclick="clearAll()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
    </div>

    <script>
        let timers = [];
        let isAutoRunning = false;
        let recognition = null;

        // 初始化语音识别
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = false;

            document.getElementById('micBtn').onclick = () => {
                if (recognition) {
                    if (document.getElementById('micBtn').classList.contains('active')) {
                        recognition.stop();
                    } else {
                        recognition.start();
                        document.getElementById('micBtn').classList.add('active');
                    }
                }
            };

            recognition.onstart = () => {
                document.getElementById('micBtn').classList.add('active');
            };

            recognition.onend = () => {
                document.getElementById('micBtn').classList.remove('active');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('input').value = transcript;
            };

            recognition.onerror = () => {
                document.getElementById('micBtn').classList.remove('active');
            };
        }

        // Demo: 直接生成计时器
        function generatePlan() {
            const task = document.getElementById('input').value.trim();
            if (!task) return;

            document.body.classList.add('has-timers');

            // Demo 规划模板
            const plan = [
                { name: '准备阶段', minutes: 5 },
                { name: task, minutes: 25 },
                { name: '休息', minutes: 5 }
            ];

            const newTimers = plan.map(item => ({
                id: Date.now() + Math.random(),
                name: item.name,
                total: item.minutes * 60,
                remain: item.minutes * 60,
                status: 'waiting',
                interval: null
            }));

            timers = [...timers, ...newTimers];
            render();
            document.getElementById('input').value = '';
        }

        function render() {
            const container = document.getElementById('timers');
            const globalActions = document.getElementById('globalActions');
            const title = document.getElementById('title');
            const inputSection = document.getElementById('inputSection');
            const demoNote = document.getElementById('demoNote');
            
            if (timers.length === 0) {
                container.innerHTML = '';
                container.classList.remove('has-timers');
                globalActions.classList.remove('visible');
                title.classList.remove('hidden');
                inputSection.classList.remove('hidden');
                demoNote.classList.remove('hidden');
                return;
            }

            container.classList.add('has-timers');
            title.classList.add('hidden');
            inputSection.classList.add('hidden');
            demoNote.classList.add('hidden');
            globalActions.classList.add('visible');
            
            container.innerHTML = timers.map((t, i) => `
                <div class="timer ${t.status === 'running' ? 'active' : ''} ${t.status === 'completed' ? 'completed' : ''}">
                    <div class="timer-header">
                        <span class="timer-name">${t.name}</span>
                        <span class="timer-status ${t.status}">${t.status === 'waiting' ? '等待' : t.status === 'running' ? '运行' : '完成'}</span>
                    </div>
                    <div class="timer-time ${t.status}">${format(t.remain)}</div>
                    <div class="timer-actions">
                        ${t.status !== 'completed' ? `<button class="action-btn ${t.status === 'running' ? 'pause' : 'play'}" onclick="${t.status === 'running' ? 'pause(' + i + ')' : 'play(' + i + ')'}">${t.status === 'running' ? '暂停' : '开始'}</button>` : ''}
                        <button class="action-btn reset" onclick="reset(${i})">重置</button>
                        <button class="action-btn delete" onclick="del(${i})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function format(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
            return `${pad(m)}:${pad(s)}`;
        }

        function pad(n) { return n.toString().padStart(2, '0'); }

        function play(index) {
            if (timers[index].status === 'completed') return;
            stopAll();
            
            timers[index].status = 'running';
            timers[index].interval = setInterval(() => {
                if (timers[index].remain > 0) {
                    timers[index].remain--;
                    render();
                } else {
                    complete(index);
                }
            }, 1000);
            
            isAutoRunning = true;
            render();
            beep();
        }

        function pause(index) {
            if (timers[index].interval) {
                clearInterval(timers[index].interval);
                timers[index].interval = null;
            }
            timers[index].status = 'waiting';
            isAutoRunning = false;
            render();
        }

        function reset(index) {
            pause(index);
            timers[index].remain = timers[index].total;
            timers[index].status = 'waiting';
            render();
        }

        function del(index) {
            pause(index);
            timers.splice(index, 1);
            render();
        }

        function complete(index) {
            if (timers[index].interval) {
                clearInterval(timers[index].interval);
                timers[index].interval = null;
            }
            timers[index].status = 'completed';
            render();
            playFinishSound();

            setTimeout(() => {
                if (isAutoRunning && index < timers.length - 1) {
                    play(index + 1);
                }
            }, 1500);
        }

        function stopAll() {
            timers.forEach(t => {
                if (t.interval) {
                    clearInterval(t.interval);
                    t.interval = null;
                }
                t.status = 'waiting';
            });
            isAutoRunning = false;
        }

        function playAll() {
            stopAll();
            const first = timers.findIndex(t => t.status === 'waiting');
            if (first !== -1) play(first);
            else if (timers.length > 0) {
                timers.forEach(t => { t.remain = t.total; t.status = 'waiting'; });
                play(0);
            }
        }

        function pauseAll() {
            stopAll();
            render();
        }

        function clearAll() {
            stopAll();
            timers = [];
            document.body.classList.remove('has-timers');
            render();
        }

        function beep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function playFinishSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    const t = ctx.currentTime + i * 0.2;
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.3, t + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
                    osc.start(t);
                    osc.stop(t + 0.4);
                });
            } catch(e) {}
        }
    </script>
</body>
</html>
