<body>

<div class="container">
  <div class="header">
    <h1>{ } JSON Validator</h1>
    <p class="subtitle">在线 JSON 校验 &amp; 格式化工具 — 粘贴 JSON 代码，即时验证与美化</p>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn btn-primary" onclick="validateJSON()" title="校验 JSON 格式">
      &#x2714; 校验 JSON
    </button>
    <button class="btn btn-secondary" onclick="formatJSON()" title="美化/格式化 JSON">
      &#x2728; 格式化
    </button>
    <button class="btn btn-secondary btn-sm" onclick="minifyJSON()" title="压缩 JSON">
      &#x2194; 压缩
    </button>
    <span class="toolbar-spacer"></span>
    <button class="btn btn-secondary btn-sm" onclick="loadExample()" title="加载示例 JSON">
      &#x1F4CB; 加载示例
    </button>
    <button class="btn btn-secondary btn-sm" onclick="copyJSON()" title="复制到剪贴板">
      &#x1F4CB; 复制
    </button>
    <button class="btn btn-danger btn-sm" onclick="clearAll()" title="清空所有内容">
      &#x2716; 清空
    </button>
  </div>

  <!-- Editor -->
  <div class="editor-wrapper">
    <div class="editor-container">
      <div class="line-numbers" id="lineNumbers">1</div>
      <div class="code-area">
        <textarea id="jsonInput" placeholder="{ &quot;key&quot;: &quot;在此粘贴 JSON 代码...&quot; }" spellcheck="false" oninput="updateLineNumbers()" onkeydown="handleTab(event)" onscroll="syncScroll()"></textarea>
      </div>
    </div>
  </div>

  <!-- Result Panel -->
  <div class="result-panel" id="resultPanel">
    <div class="result-header">
      <span class="result-icon" id="resultIcon"></span>
      <span class="result-title" id="resultTitle"></span>
    </div>
    <div class="result-detail" id="resultDetail"></div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // --- Example JSON ---
  const EXAMPLE_JSON = JSON.stringify({
    "name": "JSON Validator 示例",
    "version": "1.0.0",
    "description": "这是一个示例 JSON 数据，用于展示校验功能",
    "author": {
      "name": "张三",
      "email": "zhangsan@example.com",
      "website": "https://example.com"
    },
    "features": ["校验", "格式化", "压缩", "错误定位"],
    "config": {
      "maxSize": 1048576,
      "allowedTypes": ["application/json"],
      "strictMode": true,
      "indentSpaces": 2
    },
    "metadata": {
      "created": "2026-06-16T08:00:00Z",
      "updated": "2026-06-16T10:30:00Z",
      "tags": ["json", "validator", "tool", "web"]
    },
    "stats": {
      "totalUsers": 12580,
      "activeUsers": 3420,
      "validationsToday": 892
    },
    "isPublic": true,
    "rating": 4.8
  }, null, 2);

  const textarea = document.getElementById('jsonInput');
  const lineNumbers = document.getElementById('lineNumbers');
  const resultPanel = document.getElementById('resultPanel');

  // --- Load example on page load ---
  window.addEventListener('DOMContentLoaded', () => {
    textarea.value = EXAMPLE_JSON;
    updateLineNumbers();
  });

  // --- Update line numbers ---
  function updateLineNumbers() {
    const lines = textarea.value.split('\n');
    const count = lines.length;
    let html = '';
    for (let i = 1; i <= count; i++) {
      html += i + '\n';
    }
    lineNumbers.innerHTML = html || '1';
  }

  // --- Sync scroll ---
  function syncScroll() {
    lineNumbers.scrollTop = textarea.scrollTop;
  }

  // --- Handle Tab key ---
  function handleTab(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + 2;
      updateLineNumbers();
    }
  }

  // --- Validate ---
  function validateJSON() {
    const raw = textarea.value.trim();
    if (!raw) {
      showResult('error', '&#x26A0;', '输入为空', '请在编辑器中粘贴 JSON 代码后再进行校验。', null);
      return;
    }

    try {
      const parsed = JSON.parse(raw);
      const stats = computeStats(raw, parsed);
      showResult('success', '&#x2714;', 'JSON 格式正确！', null, stats);
    } catch (err) {
      const detail = formatError(err, raw);
      showResult('error', '&#x2718;', 'JSON 格式错误', detail, null);
    }
  }

  function formatError(err, raw) {
    const msg = err.message;
    // Extract position from error message
    const posMatch = msg.match(/position\s+(\d+)/i);
    if (posMatch) {
      const pos = parseInt(posMatch[1]);
      const before = raw.substring(Math.max(0, pos - 40), pos);
      const after = raw.substring(pos, Math.min(raw.length, pos + 40));
      const line = raw.substring(0, pos).split('\n').length;
      const col = pos - raw.lastIndexOf('\n', pos - 1);
      return '错误信息：' + msg + '\n\n' +
             '错误位置：第 ' + line + ' 行，第 ' + col + ' 列（字符位置 ' + pos + '）\n\n' +
             '上下文：\n' +
             escapeHTML(before) + '<span class="err-pos">' + escapeHTML(after.charAt(0)) + '</span>' + escapeHTML(after.substring(1)) + '\n' +
             '          ' + ' '.repeat(before.length > 40 ? 40 : before.length) + '▲ 此处';
    }
    return '错误信息：' + msg;
  }

  function computeStats(raw, parsed) {
    const size = new Blob([raw]).size;
    const keys = countKeys(parsed);
    return [
      { label: '文件大小', value: formatSize(size) },
      { label: '键数量', value: keys + ' 个' },
      { label: '顶层类型', value: Array.isArray(parsed) ? 'Array' : typeof parsed === 'object' ? 'Object' : typeof parsed },
      { label: '行数', value: raw.split('\n').length + ' 行' }
    ];
  }

  function countKeys(obj) {
    if (Array.isArray(obj)) {
      return obj.reduce((sum, item) => sum + (typeof item === 'object' && item !== null ? countKeys(item) : 0), 0);
    }
    if (typeof obj === 'object' && obj !== null) {
      const ownKeys = Object.keys(obj).length;
      const nested = Object.values(obj).reduce((sum, val) => sum + (typeof val === 'object' && val !== null ? countKeys(val) : 0), 0);
      return ownKeys + nested;
    }
    return 0;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(2) + ' MB';
  }

  function showResult(type, icon, title, detail, stats) {
    resultPanel.className = 'result-panel visible ' + type;
    document.getElementById('resultIcon').innerHTML = icon;
    document.getElementById('resultTitle').textContent = title;
    const detailEl = document.getElementById('resultDetail');
    if (detail) {
      detailEl.innerHTML = detail;
      detailEl.style.display = 'block';
    } else {
      detailEl.style.display = 'none';
    }
    const statsGrid = document.getElementById('statsGrid');
    if (stats) {
      statsGrid.innerHTML = stats.map(s =>
        '<div class="stat-item"><span>' + s.label + '：</span><span class="stat-value">' + s.value + '</span></div>'
      ).join('');
      statsGrid.style.display = 'flex';
    } else {
      statsGrid.style.display = 'none';
    }
    resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // --- Format ---
  function formatJSON() {
    const raw = textarea.value.trim();
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      textarea.value = JSON.stringify(parsed, null, 2);
      updateLineNumbers();
      showToast('JSON 格式化完成');
      autoValidate();
    } catch (err) {
      showResult('error', '&#x2718;', '无法格式化', 'JSON 格式不正确，请先修正错误后再格式化。', null);
    }
  }

  // --- Minify ---
  function minifyJSON() {
    const raw = textarea.value.trim();
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      textarea.value = JSON.stringify(parsed);
      updateLineNumbers();
      showToast('JSON 压缩完成');
      autoValidate();
    } catch (err) {
      showResult('error', '&#x2718;', '无法压缩', 'JSON 格式不正确，请先修正错误后再压缩。', null);
    }
  }

  // --- Auto validate after format/minify ---
  function autoValidate() {
    try {
      const parsed = JSON.parse(textarea.value);
      showResult('success', '&#x2714;', 'JSON 格式正确！', null, computeStats(textarea.value, parsed));
    } catch(e) {}
  }

  // --- Load example ---
  function loadExample() {
    textarea.value = EXAMPLE_JSON;
    updateLineNumbers();
    resultPanel.classList.remove('visible');
    showToast('示例 JSON 已加载');
  }

  // --- Copy ---
  function copyJSON() {
    const raw = textarea.value;
    if (!raw) { showToast('没有可复制的内容'); return; }
    navigator.clipboard.writeText(raw).then(() => {
      showToast('已复制到剪贴板');
    }).catch(() => {
      textarea.select();
      document.execCommand('copy');
      showToast('已复制到剪贴板');
    });
  }

  // --- Clear ---
  function clearAll() {
    textarea.value = '';
    updateLineNumbers();
    resultPanel.classList.remove('visible');
    showToast('已清空');
  }

  // --- Toast ---
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // --- Escape HTML ---
  function escapeHTML(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // --- Keyboard shortcut ---
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      validateJSON();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      formatJSON();
    }
  });
</script>

</body>
