*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{

}

}

.tabs{

}

}
.tab:hover{color:var(--ink)}

.card{
  background:var(--card);border:1px solid var(--rule);

}
.card h3 .icon-sm.orange{background:var(--red-bg);color:var(--accent)}

.btn-row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}

/* Results area */
.results{display:none}
.results.show{display:block;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Score display */
.score-section{
  display:flex;align-items:center;gap:32px;margin-bottom:28px;

}
.score-circle{

}
.score-circle .number{font-size:32px;font-weight:700;color:var(--accent);line-height:1}

.score-details{flex:1;min-width:200px}
.score-details .main-label{font-size:20px;font-weight:700;margin-bottom:4px}

.score-rank{

  font-size:12px;font-weight:700;margin-top:8px;
}
.rank-high{background:var(--green-bg);color:var(--green)}

/* Radar chart container */
.chart-container{width:100%;min-height:380px;margin:20px 0}

}

.gap-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}

}

.gap-level.partial{background:var(--yellow-bg);color:var(--yellow)}

.suggestion-item .priority.high{background:var(--red-bg);color:var(--red)}

/* Feynman learning plan */
.feynman-card{

}
.feynman-card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.feynman-header{

}
.feynman-header .step-num{

.feynman-header .step-num.s5{background:var(--green-bg);color:var(--green)}
.feynman-header .step-title{font-size:14px;font-weight:700;flex:1}

.feynman-body p{font-size:13px;line-height:1.7;margin:8px 0}
.feynman-body ul{padding-left:18px;font-size:13px;line-height:1.8}
.feynman-body .highlight{

}

/* Timeline */
.timeline{position:relative;padding-left:28px;margin:16px 0}
.timeline::before{

}
.timeline-item{position:relative;margin-bottom:18px}

/* Chat/interaction area */
.chat-area{

}

}
.chat-input-row{display:flex;gap:8px;margin-top:8px}

}

}

/* Loading */
.loading-overlay{

}
.loading-overlay.show{display:flex}
.loading-spinner{
  width:40px;height:40px;border:3px solid var(--rule);

}

.loading-text{font-size:14px;color:var(--muted);font-weight:600}

/* Print */
@media print{
  .tabs,.btn-row,.chat-area,.chat-input-row{display:none!important}

}

/* Resume diff styles */
.resume-panel{border:1.5px solid var(--rule);border-radius:12px;overflow:hidden;margin-bottom:20px}
.resume-panel-header{padding:12px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}

.resume-panel-header.optimized{background:var(--green-bg);color:var(--green)}

/* Skill pack styles */
.days-setting{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}

.skill-unit-header .skill-name{font-size:15px;font-weight:700;flex:1}

.skill-unit-header .arrow{transition:transform .25s;font-size:12px;color:var(--muted)}

.skill-unit-body{max-height:0;overflow:hidden;transition:max-height .5s ease}
.skill-unit-body.open{max-height:3000px}
.skill-unit-content{padding:16px}

/* Score card */
.score-card{border:2px solid var(--rule);border-radius:16px;padding:24px;text-align:center;margin:12px 0}
.score-card .big-score{font-size:48px;font-weight:700;line-height:1}
.score-card .score-label{font-size:13px;color:var(--muted);margin-top:4px}
.score-card.grade-a{border-color:var(--green)}
.score-card.grade-a .big-score{color:var(--green)}
.score-card.grade-b{border-color:var(--yellow)}
.score-card.grade-b .big-score{color:var(--yellow)}

.score-card.grade-c .big-score{color:var(--accent)}
.score-card.grade-d{border-color:var(--red)}
.score-card.grade-d .big-score{color:var(--red)}

.ref-answer .ref-content{font-size:13px;line-height:1.7;color:var(--ink)}

<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">知己正在分析中...</div>
</div>

<!-- Header -->
<div class="header">
  <div class="logo">
    <div class="icon">知</div>
    <span>Offer知己</span>
  </div>
  <div class="tagline">你的面试教练 — 不评判你，而是帮你找到通向 Offer 的路</div>
</div>

<div class="container">

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('input')">信息输入</button>
  <button class="tab" onclick="switchTab('analysis')">分析结果</button>
  <button class="tab" onclick="switchTab('resume')">简历优化</button>
  <button class="tab" onclick="switchTab('skills')">技能急救包</button>
  <button class="tab" onclick="switchTab('coach')">教练对话</button>
</div>

<!-- Tab 1: Input -->
<div class="tab-content active" id="tab-input">

  <div class="card">
    <h3><span class="icon-sm orange">JD</span> 岗位信息</h3>
    <div class="input-row">
      <div>
        <label>岗位名称</label>
        <input type="text" id="jobTitle" placeholder="如：高级前端开发工程师">
      </div>
      <div>
        <label>公司/行业</label>
        <input type="text" id="companyName" placeholder="如：字节跳动 / 互联网">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label>薪资范围</label>
        <input type="text" id="salaryRange" placeholder="如：25K-40K">
      </div>
      <div>
        <label>工作年限要求</label>
        <select id="expRequired">
          <option value="不限">不限</option>
          <option value="1年以下">1年以下</option>
          <option value="1-3年">1-3年</option>
          <option value="3-5年">3-5年</option>
          <option value="5-10年">5-10年</option>
          <option value="10年以上">10年以上</option>
        </select>
      </div>
    </div>
    <label>岗位描述（JD全文）</label>
    <textarea id="jdText" placeholder="粘贴完整的岗位JD描述，包含职责要求、任职资格等..."></textarea>
  </div>

  <div class="card">
    <h3><span class="icon-sm green">CV</span> 简历信息</h3>
    <div class="input-row">
      <div>
        <label>你的姓名</label>
        <input type="text" id="candidateName" placeholder="你的名字">
      </div>
      <div>
        <label>实际工作年限</label>
        <select id="expActual">
          <option value="应届">应届/实习</option>
          <option value="1年以下">1年以下</option>
          <option value="1-3年" selected>1-3年</option>
          <option value="3-5年">3-5年</option>
          <option value="5-10年">5-10年</option>
          <option value="10年以上">10年以上</option>
        </select>
      </div>
    </div>
    <label>简历内容 / 个人经历</label>
    <textarea id="resumeText" placeholder="粘贴你的简历内容，或填写你的核心技能、项目经历、工作背景等...&#10;&#10;格式参考：&#10;技能：JavaScript, React, Node.js, MySQL, Git&#10;项目：XXX系统 - 负责前端架构设计和组件开发&#10;教育：XX大学 计算机科学 本科&#10;工作经历：XX公司 前端开发 2年"></textarea>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="startAnalysis()">
      开始分析
    </button>
    <button class="btn btn-secondary" onclick="loadDemo()">
      加载示例数据
    </button>
  </div>

</div>

<!-- Tab 2: Analysis Results -->
<div class="tab-content" id="tab-analysis">
  <div id="resultsArea">
    <div class="empty-state">
      <div class="icon">🔍</div>
      <p>请先在"信息输入"页填写岗位JD和简历信息，点击"开始分析"</p>
    </div>
  </div>
</div>

<!-- Tab 3: Resume Optimization -->
<div class="tab-content" id="tab-resume">
  <div id="resumeOptArea">
    <div class="empty-state">
      <div class="icon">📝</div>
      <p>请先完成分析</p>
    </div>
  </div>
  <div id="originalResume" style="display:none">
    <div class="resume-panel">
      <div class="resume-panel-header original">📋 原始简历</div>
      <div class="resume-panel-body" id="originalResumeBody"></div>
    </div>
  </div>
  <div id="optimizedResume" style="display:none">
    <div class="resume-panel">
      <div class="resume-panel-header optimized">✨ 优化后简历</div>
      <div class="resume-panel-body" id="optimizedResumeBody"></div>
    </div>
  </div>
</div>

<!-- Tab 4: Skills Pack -->
<div class="tab-content" id="tab-skills">
  <div class="days-setting">
    <label style="margin:0;font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0">距离面试还有</label>
    <input type="number" id="daysInput" value="3" min="1" max="30" style="width:70px;min-height:auto;resize:none;text-align:center;font-size:18px;font-weight:700">
    <label style="margin:0;font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0">天</label>
    <button class="btn btn-sm btn-secondary" onclick="adjustPlan()">调整计划</button>
  </div>
  <div id="skillsPackArea">
    <div class="empty-state">
      <div class="icon">🎒</div>
      <p>请先完成分析</p>
    </div>
  </div>
</div>

<!-- Tab 5: Coach Chat -->
<div class="tab-content" id="tab-coach">
  <div class="card">
    <h3><span class="icon-sm teal">💬</span> 知己教练对话</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px">知己教练会根据分析结果，通过对话帮你补全信息、深挖优势、制定策略。</p>
    <div class="chat-area" id="chatArea">
      <div class="chat-msg system">你好！我是你的面试教练「知己」。在完成分析后，我会和你一起深挖细节，帮你找到最有力的表达方式。请先去"信息输入"页完成基础分析吧！</div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="输入你的回答..." onkeypress="if(event.key==='Enter')sendChat()">
      <button class="btn btn-sm btn-teal" onclick="sendChat()">发送</button>
    </div>
  </div>
</div>

</div>

<script>
var TAB_MAP = {'input':'信息输入','analysis':'分析结果','resume':'简历优化','skills':'技能急救包','coach':'教练对话'};
window.switchTab = function(tabName) {
    var tabs = document.querySelectorAll('.tab');
    var contents = document.querySelectorAll('.tab-content');
    var label = TAB_MAP[tabName] || '';
    for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.toggle('active', tabs[i].textContent.indexOf(label) >= 0);
    }
    for (var i = 0; i < contents.length; i++) {
        contents[i].classList.toggle('active', contents[i].id === 'tab-' + tabName);
    }
};
</script>
<script src="./_shared/js/echarts.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
