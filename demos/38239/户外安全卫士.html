<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>户外安全卫士 · AI 户外风险识别与应急助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #1a2a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .phone {
            width: 400px;
            max-width: 100%;
            background: #f5f2ed;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 14px 28px 6px;
            font-size: 12px;
            color: #2d3d2d;
            font-weight: 600;
        }

        .app-content {
            padding: 0 20px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 14px;
        }

        .header h1 {
            font-size: 24px;
            color: #1a3a1a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 span {
            background: #c0392b;
            color: #fff;
            font-size: 10px;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 20px;
        }

        .header .badge {
            background: #d5cdc0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: #4a3d2a;
            font-weight: 500;
        }

        .slogan {
            background: #e8e3da;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 18px;
            border-left: 4px solid #c0392b;
            font-size: 13px;
            color: #2d3d2d;
            line-height: 1.6;
        }

        .slogan strong {
            color: #c0392b;
        }

        /* 场景选择 */
        .scene-select {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 18px;
        }

        .scene-select .scene {
            padding: 10px 4px;
            text-align: center;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: default;
            background: #e8e3da;
            color: #5a5a4a;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .scene-select .scene .icon {
            font-size: 24px;
            display: block;
            margin-bottom: 2px;
        }

        .scene-select .scene.active {
            border-color: #2d6a2d;
            background: #dce8dc;
            color: #1a3a1a;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed #b5ada0;
            border-radius: 18px;
            padding: 24px 16px 20px;
            text-align: center;
            background: #fcfaf7;
            transition: all 0.3s;
            margin-bottom: 18px;
            cursor: default;
        }

        .upload-area .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 4px;
        }

        .upload-area .title {
            font-size: 15px;
            font-weight: 600;
            color: #1a3a1a;
        }

        .upload-area .sub {
            font-size: 12px;
            color: #7a7a6a;
            margin-top: 2px;
        }

        .upload-area .btn-upload {
            display: inline-block;
            margin-top: 12px;
            background: #2d6a2d;
            color: #fff;
            padding: 10px 32px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: default;
            border: none;
            box-shadow: 0 4px 12px rgba(45, 106, 45, 0.3);
        }

        /* 识别结果 */
        .result {
            background: #fcfaf7;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 18px;
            display: none;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .result.show {
            display: block;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result .head .name {
            font-size: 18px;
            font-weight: 700;
            color: #1a3a1a;
        }

        .result .head .risk {
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 600;
        }

        .result .head .risk.danger {
            background: #c0392b;
            color: #fff;
        }

        .result .head .risk.warning {
            background: #e67e22;
            color: #fff;
        }

        .result .head .risk.safe {
            background: #27ae60;
            color: #fff;
        }

        .result .desc {
            font-size: 14px;
            color: #3d3d2d;
            line-height: 1.6;
            padding: 12px 14px;
            background: #f0ede8;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .result .emergency {
            background: #fff5f0;
            border-left: 4px solid #c0392b;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .result .emergency .label {
            font-size: 13px;
            font-weight: 700;
            color: #c0392b;
            margin-bottom: 4px;
        }

        .result .emergency .step {
            font-size: 13px;
            color: #3d3d2d;
            padding: 3px 0;
            line-height: 1.5;
        }

        .result .emergency .step .num {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: #c0392b;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-right: 6px;
        }

        .result .wrong {
            background: #fdf0ed;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .result .wrong .label {
            font-size: 13px;
            font-weight: 700;
            color: #c0392b;
            margin-bottom: 4px;
        }

        .result .wrong .item {
            font-size: 13px;
            color: #3d3d2d;
            padding: 2px 0;
        }

        .result .hospital {
            background: #e8f0e8;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result .hospital .info {
            font-size: 13px;
            color: #1a3a1a;
        }

        .result .hospital .info .name {
            font-weight: 600;
        }

        .result .hospital .btn-call {
            background: #2d6a2d;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: default;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 12px 0 6px;
            border-top: 1px solid #d5cdc0;
            margin-top: 4px;
        }

        .bottom-nav .item {
            text-align: center;
            font-size: 11px;
            color: #7a7a6a;
            cursor: default;
        }

        .bottom-nav .item .icon {
            font-size: 22px;
            display: block;
            margin-bottom: 2px;
        }

        .bottom-nav .item.active {
            color: #1a3a1a;
            font-weight: 600;
        }

        @media (max-width: 440px) {
            body {
                padding: 12px;
            }
            .phone {
                border-radius: 24px;
            }
            .header h1 {
                font-size: 20px;
            }
            .scene-select {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .scene-select .scene {
                font-size: 10px;
                padding: 8px 2px;
            }
            .scene-select .scene .icon {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="phone">
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>

        <div class="app-content">
            <div class="header">
                <h1>
                    🛡️ 户外安全卫士
                    <span>AI</span>
                </h1>
                <div class="badge">识别 · 应急 · 救援</div>
            </div>

            <div class="slogan">
                📸 拍照识别风险 · <strong>AI 告诉你是什么、该怎么办</strong> · 一键导航去医院
            </div>

            <div class="scene-select">
                <div class="scene active" data-scene="mushroom">
                    <span class="icon">🍄</span>
                    毒蘑菇
                </div>
                <div class="scene" data-scene="snake">
                    <span class="icon">🐍</span>
                    毒蛇
                </div>
                <div class="scene" data-scene="animal">
                    <span class="icon">🐻</span>
                    野生动物
                </div>
                <div class="scene" data-scene="water">
                    <span class="icon">🌊</span>
                    危险水域
                </div>
                <div class="scene" data-scene="terrain">
                    <span class="icon">⛰️</span>
                    地质灾害
                </div>
                <div class="scene" data-scene="emergency">
                    <span class="icon">🆘</span>
                    紧急求救
                </div>
            </div>

            <div class="upload-area" id="uploadArea">
                <span class="icon" id="uploadIcon">📤</span>
                <div class="title" id="uploadTitle">拍照识别风险</div>
                <div class="sub" id="uploadSub">拍摄你遇到的蘑菇、蛇、动物或环境</div>
                <div class="btn-upload" id="simulateUpload">📷 拍照识别</div>
            </div>

            <!-- 识别结果 -->
            <div class="result" id="result">
                <!-- 由 JS 动态填充 -->
            </div>

            <div class="bottom-nav">
                <div class="item active">
                    <span class="icon">🏠</span>
                    首页
                </div>
                <div class="item">
                    <span class="icon">📸</span>
                    识别
                </div>
                <div class="item">
                    <span class="icon">📋</span>
                    记录
                </div>
                <div class="item">
                    <span class="icon">👤</span>
                    我的
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 场景数据 =====
        const sceneData = {
            mushroom: {
                icon: '🍄',
                title: '拍照识别蘑菇',
                sub: '拍摄你遇到的野生蘑菇，AI 判断是否有毒'
            },
            snake: {
                icon: '🐍',
                title: '拍照识别蛇类',
                sub: '拍摄你遇到的蛇，AI 判断是否有毒'
            },
            animal: {
                icon: '🐻',
                title: '拍照识别野生动物',
                sub: '拍摄你遇到的野生动物，AI 判断危险等级'
            },
            water: {
                icon: '🌊',
                title: '识别危险水域',
                sub: '拍摄水域环境，AI 评估溺水风险'
            },
            terrain: {
                icon: '⛰️',
                title: '识别地质灾害迹象',
                sub: '拍摄山体、路面，AI 评估塌方/滑坡风险'
            },
            emergency: {
                icon: '🆘',
                title: '紧急求救',
                sub: '一键获取最近的救援点和急救指南'
            }
        };

        // ===== 结果数据（模拟不同场景的识别结果） =====
        const resultData = {
            mushroom: {
                name: '大青褶伞 (剧毒)',
                risk: 'danger',
                riskLabel: '☠️ 剧毒',
                desc: '大青褶伞是我国中毒事件最多的毒蘑菇之一[reference:16]。外观与可食用菌高度相似，误食后6-12小时出现恶心、呕吐、腹泻等症状，严重可导致肝功能衰竭。',
                emergency: [
                    '立即停止食用，保留剩余蘑菇样本',
                    '尽快就医，告知医生食用时间和数量',
                    '如已出现呕吐，不要强行止吐，让毒素排出',
                    '携带蘑菇样本前往医院，帮助医生精准诊断'
                ],
                wrong: [
                    '❌ 不要用银针、大蒜测试毒性——不科学',
                    '❌ 不要相信"颜色鲜艳才有毒"——很多剧毒蘑菇颜色朴素',
                    '❌ 不要拖延就医——越早治疗越好'
                ],
                hospital: '最近三甲医院 · 急诊科 3.2km'
            },
            snake: {
                name: '尖吻蝮 (五步蛇) · 剧毒',
                risk: 'danger',
                riskLabel: '☠️ 剧毒',
                desc: '尖吻蝮是我国十大毒蛇之一，每年造成大量蛇伤事件[reference:17]。被咬后局部剧痛、肿胀、出血，严重可致组织坏死和凝血功能障碍。',
                emergency: [
                    '保持冷静，减少活动，防止毒素扩散',
                    '立即用清水冲洗伤口，不要切开伤口',
                    '去除受伤部位的戒指、手镯等束缚物',
                    '尽快前往有抗蛇毒血清的医院'
                ],
                wrong: [
                    '❌ 不要用嘴吸吮伤口——可能导致二次中毒',
                    '❌ 不要用绳索扎紧肢体——可能导致坏死',
                    '❌ 不要喝酒止痛——酒精加速毒素吸收',
                    '❌ 不要等待症状出现再就医'
                ],
                hospital: '最近有抗蛇毒血清医院 · 急诊科 5.7km'
            },
            animal: {
                name: '亚洲黑熊 · 高风险',
                risk: 'danger',
                riskLabel: '⚠️ 高风险',
                desc: '亚洲黑熊在我国多省均有分布，秋季是活跃期[reference:18]。黑熊攻击力极强，受惊或护崽时可能主动攻击人类。',
                emergency: [
                    '保持镇静，不要大喊大叫或惊慌逃窜',
                    '不要用石子、木棍攻击熊——容易激怒它',
                    '不要装死——遇到捕食的熊，装死可能致命[reference:19]',
                    '面对熊，缓慢后退，不要转身逃跑',
                    '如熊已发起攻击，用防熊喷雾或大声呵斥'
                ],
                wrong: [
                    '❌ 不要装死——这是常见误区',
                    '❌ 不要背对熊逃跑——会激发追捕本能',
                    '❌ 不要靠近熊的幼崽'
                ],
                hospital: '最近医院 · 急诊科 8.1km'
            },
            water: {
                name: '野泳危险水域 · 高风险',
                risk: 'danger',
                riskLabel: '⚠️ 高风险',
                desc: '该水域为无人管理的野外水域[reference:20]。水下可能有暗流、渔网、水草等隐形杀手。每年我国约5.7万人死于溺水，60%发生在野外水域[reference:21][reference:22]。',
                emergency: [
                    '切勿下水游泳或嬉戏',
                    '如有人落水，不要贸然下水施救——先呼救、找工具',
                    '拨打120和119，报告准确位置',
                    '利用竹竿、绳子、救生圈等工具协助救援'
                ],
                wrong: [
                    '❌ 不要高估自己的游泳能力——野外水域完全不同',
                    '❌ 不要手拉手救人——极易一起落水',
                    '❌ 不要盲目下水——会游泳≠会救人'
                ],
                hospital: '最近医院 · 急诊科 4.5km'
            },
            terrain: {
                name: '山体滑坡高风险区域',
                risk: 'warning',
                riskLabel: '⚠️ 注意',
                desc: '该区域存在山体滑坡风险。2025年户外探险事故中，山地事故占总量超八成[reference:23]。裂缝、松动岩石、雨后陡坡都是危险信号。',
                emergency: [
                    '迅速远离滑坡方向，向两侧撤离',
                    '不要停留在陡坡下方或沟谷中',
                    '如无法撤离，寻找坚固掩体',
                    '拨打119和110报告险情'
                ],
                wrong: [
                    '❌ 不要试图穿越滑坡区域',
                    '❌ 不要在山体裂缝附近停留',
                    '❌ 不要在大雨后进入山区'
                ],
                hospital: '最近医院 · 急诊科 6.3km'
            },
            emergency: {
                name: '紧急求救 · 一键救援',
                risk: 'danger',
                riskLabel: '🆘 紧急',
                desc: '您已发起紧急求救。请保持冷静，以下信息将帮助救援人员快速找到您。',
                emergency: [
                    '保持手机电量充足，开启定位',
                    '发送您的精确位置给亲友或救援人员',
                    '描述您的具体情况和需要的帮助',
                    '如有可能，前往开阔地带等待救援'
                ],
                wrong: [],
                hospital: '最近医院 · 急诊科 3.8km · 已通知'
            }
        };

        // ===== DOM 引用 =====
        const scenes = document.querySelectorAll('.scene');
        const uploadArea = document.getElementById('uploadArea');
        const uploadIcon = document.getElementById('uploadIcon');
        const uploadTitle = document.getElementById('uploadTitle');
        const uploadSub = document.getElementById('uploadSub');
        const simulateBtn = document.getElementById('simulateUpload');
        const resultDiv = document.getElementById('result');

        let currentScene = 'mushroom';
        let isProcessing = false;

        // ===== 场景切换 =====
        scenes.forEach(scene => {
            scene.addEventListener('click', function() {
                if (isProcessing) return;
                scenes.forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                currentScene = this.dataset.scene;
                const data = sceneData[currentScene];
                uploadIcon.textContent = data.icon;
                uploadTitle.textContent = data.title;
                uploadSub.textContent = data.sub;
                resultDiv.classList.remove('show');
                resultDiv.innerHTML = '';
                simulateBtn.textContent = '📷 拍照识别';
            });
        });

        // ===== 模拟识别 =====
        simulateBtn.addEventListener('click', function() {
            if (isProcessing) return;

            // 开始识别
            isProcessing = true;
            this.textContent = '⏳ AI 识别中...';
            this.style.background = '#8a8a7a';

            uploadIcon.textContent = '⏳';
            uploadTitle.textContent = 'AI 正在分析...';
            uploadSub.textContent = '请稍候，正在识别风险';

            // 模拟延迟
            setTimeout(() => {
                // 显示结果
                const data = resultData[currentScene];
                if (!data) {
                    isProcessing = false;
                    return;
                }

                let wrongHtml = '';
                if (data.wrong && data.wrong.length > 0) {
                    wrongHtml = `
                        <div class="wrong">
                            <div class="label">🚫 常见错误做法（千万不要做）</div>
                            ${data.wrong.map(w => `<div class="item">${w}</div>`).join('')}
                        </div>
                    `;
                }

                resultDiv.innerHTML = `
                    <div class="head">
                        <span class="name">${data.name}</span>
                        <span class="risk ${data.risk}">${data.riskLabel}</span>
                    </div>
                    <div class="desc">${data.desc}</div>
                    <div class="emergency">
                        <div class="label">🆘 应急处理步骤</div>
                        ${data.emergency.map((s, i) => `
                            <div class="step"><span class="num">${i+1}</span>${s}</div>
                        `).join('')}
                    </div>
                    ${wrongHtml}
                    <div class="hospital">
                        <div class="info">
                            <div class="name">🏥 ${data.hospital}</div>
                            <div style="font-size:12px;color:#5a7a5a;">点击右侧一键导航</div>
                        </div>
                        <div class="btn-call">🧭 导航</div>
                    </div>
                `;

                resultDiv.classList.add('show');
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });

                // 恢复按钮
                this.textContent = '📷 重新识别';
                this.style.background = '#2d6a2d';
                uploadIcon.textContent = '✅';
                uploadTitle.textContent = '识别完成';
                uploadSub.textContent = '查看下方结果';

                isProcessing = false;
            }, 1800);
        });
    </script>

</body>
</html>
