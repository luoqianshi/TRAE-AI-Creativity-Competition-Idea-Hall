<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>专注时光轴</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f3ef;
            color: #1e1e1e;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            padding: 2rem 2rem 2.5rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #8a8a8a;
        }
        .sub {
            color: #6b6b6b;
            border-left: 3px solid #d6d2ca;
            padding-left: 1rem;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* 任务输入 */
        .task-input-area {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.8rem;
        }
        .task-input-area input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid #ddd8d0;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #faf9f7;
            outline: none;
            transition: 0.2s;
        }
        .task-input-area input:focus {
            border-color: #b0a89a;
            background: #ffffff;
        }
        .task-input-area button {
            padding: 0.7rem 1.8rem;
            background: #2c2c2c;
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .task-input-area button:hover {
            background: #1a1a1a;
        }

        /* 任务列表 */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 2.2rem;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1rem 0.6rem 1.2rem;
            background: #f9f8f5;
            border-radius: 60px;
            border: 1px solid #efede8;
            transition: 0.15s;
        }
        .task-item .name {
            flex: 1;
            font-weight: 450;
            word-break: break-word;
        }
        .task-item .timer-display {
            font-variant-numeric: tabular-nums;
            background: #eae7e1;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #3d3d3d;
            min-width: 4.5rem;
            text-align: center;
        }
        .task-item .actions {
            display: flex;
            gap: 0.3rem;
        }
        .task-item .actions button {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 30px;
            font-size: 0.85rem;
            transition: 0.15s;
            font-weight: 450;
        }
        .task-item .actions .btn-start {
            color: #2c6e4f;
            background: #e2efe8;
        }
        .task-item .actions .btn-start:hover {
            background: #c5ded0;
        }
        .task-item .actions .btn-stop {
            color: #a64b4b;
            background: #f5e5e5;
        }
        .task-item .actions .btn-stop:hover {
            background: #edd4d4;
        }
        .task-item .actions .btn-delete {
            color: #888;
            background: transparent;
        }
        .task-item .actions .btn-delete:hover {
            background: #eee;
        }
        .task-item.active {
            background: #f2efe9;
            border-color: #b8ae9e;
        }

        /* 时间线 */
        .timeline-section h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            border-bottom: 1px solid #efede8;
            padding-bottom: 0.3rem;
        }
        .timeline-empty {
            color: #9a9a9a;
            font-size: 0.9rem;
            padding: 1rem 0 0.2rem;
        }
        .timeline-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .timeline-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.8rem;
            background: #faf9f6;
            border-radius: 14px;
            border-left: 4px solid #c6bfb4;
            font-size: 0.9rem;
        }
        .timeline-item .tl-name {
            font-weight: 450;
        }
        .timeline-item .tl-duration {
            background: #ece9e2;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #3d3d3d;
        }
        .timeline-item .tl-time {
            color: #7a7a7a;
            font-size: 0.75rem;
        }
        .clear-timeline {
            margin-top: 0.8rem;
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline dotted;
        }
        .clear-timeline:hover {
            color: #6a6a6a;
        }

        /* 响应式 */
        @media (max-width: 550px) {
            .app {
                padding: 1.2rem;
            }
            .task-input-area {
                flex-wrap: wrap;
            }
            .task-input-area input {
                width: 100%;
            }
            .task-input-area button {
                width: 100%;
                justify-content: center;
            }
            .task-item {
                flex-wrap: wrap;
                border-radius: 20px;
                padding: 0.6rem 0.8rem;
            }
            .task-item .actions {
                margin-left: auto;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>
            🧭 专注时光轴
            <small>· 任务时间线</small>
        </h1>
        <div class="sub">为每个任务记录专注时长，自动汇入时间线</div>

        <!-- 任务输入 -->
        <div class="task-input-area">
            <input type="text" id="taskInput" placeholder="输入任务名称，按回车或点击添加" />
            <button id="addTaskBtn">➕ 添加任务</button>
        </div>

        <!-- 任务列表 -->
        <div id="taskList" class="task-list"></div>

        <!-- 时间线 -->
        <div class="timeline-section">
            <h2>⏳ 专注时间线</h2>
            <div id="timelineContainer">
                <div class="timeline-empty">还没有记录，完成专注任务后会自动出现。</div>
            </div>
            <button id="clearTimelineBtn" class="clear-timeline">清空所有记录</button>
        </div>
    </div>

    <script>
        (function() {
            // ---------- 数据管理 ----------
            const STORAGE_KEY_TASKS = 'focus_tasks';
            const STORAGE_KEY_TIMELINE = 'focus_timeline';

            let tasks = [];           // { id, name, elapsedSeconds, isActive, startTime? }
            let timeline = [];        // { id, taskName, durationSeconds, finishedAt }

            // 计时器句柄
            let timerInterval = null;

            // 加载存储
            function loadData() {
                try {
                    const t = localStorage.getItem(STORAGE_KEY_TASKS);
                    if (t) tasks = JSON.parse(t);
                    const tl = localStorage.getItem(STORAGE_KEY_TIMELINE);
                    if (tl) timeline = JSON.parse(tl);
                } catch (e) { /* ignore */ }
                // 确保每个任务有 elapsedSeconds, isActive
                tasks = tasks.map(task => ({
                    ...task,
                    elapsedSeconds: task.elapsedSeconds || 0,
                    isActive: task.isActive || false,
                    startTime: task.startTime || null
                }));
                // 如果有任务处于激活状态，但页面关闭时丢失了 interval，我们仅显示，不自动恢复计时（安全起见）
                // 但可把isActive设为false，以免异常
                let anyActive = false;
                tasks = tasks.map(task => {
                    if (task.isActive) {
                        anyActive = true;
                        // 不重置，保留状态，但用户点击停止或重新开始时会处理
                    }
                    return task;
                });
                // 若有激活的任务，用户可手动停止或重新开始
                // 为保险，如果有多个激活，只保留第一个激活，其余重置
                const activeTasks = tasks.filter(t => t.isActive);
                if (activeTasks.length > 1) {
                    // 只保留第一个激活，其余设为false
                    let first = true;
                    tasks = tasks.map(task => {
                        if (task.isActive) {
                            if (first) { first = false; return task; }
                            else { return { ...task, isActive: false, startTime: null }; }
                        }
                        return task;
                    });
                }
                saveTasks();
            }

            function saveTasks() {
                localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(tasks));
            }

            function saveTimeline() {
                localStorage.setItem(STORAGE_KEY_TIMELINE, JSON.stringify(timeline));
            }

            // ---------- 渲染 ----------
            function renderAll() {
                renderTasks();
                renderTimeline();
            }

            function renderTasks() {
                const container = document.getElementById('taskList');
                if (tasks.length === 0) {
                    container.innerHTML = `<div style="color:#aaa; font-size:0.9rem; padding:0.4rem 0;">还没有任务，添加一个开始专注吧</div>`;
                    return;
                }
                let html = '';
                tasks.forEach(task => {
                    const isActive = task.isActive || false;
                    const elapsed = task.elapsedSeconds || 0;
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    const timeStr = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
                    const activeClass = isActive ? 'active' : '';
                    html += `
                        <div class="task-item ${activeClass}" data-id="${task.id}">
                            <span class="name">${escapeHtml(task.name)}</span>
                            <span class="timer-display">${timeStr}</span>
                            <div class="actions">
                                ${isActive ? 
                                    `<button class="btn-stop" data-action="stop" data-id="${task.id}">⏹ 停止</button>` :
                                    `<button class="btn-start" data-action="start" data-id="${task.id}">▶ 开始</button>`
                                }
                                <button class="btn-delete" data-action="delete" data-id="${task.id}">✕</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

                // 绑定事件（委托）
                container.querySelectorAll('[data-action]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const action = this.dataset.action;
                        const id = parseInt(this.dataset.id);
                        if (action === 'start') handleStart(id);
                        else if (action === 'stop') handleStop(id);
                        else if (action === 'delete') handleDelete(id);
                    });
                });
            }

            function renderTimeline() {
                const container = document.getElementById('timelineContainer');
                if (timeline.length === 0) {
                    container.innerHTML = `<div class="timeline-empty">还没有记录，完成专注任务后会自动出现。</div>`;
                    return;
                }
                // 按时间倒序排列（最新的在前）
                const sorted = [...timeline].sort((a, b) => b.finishedAt - a.finishedAt);
                let html = '<div class="timeline-list">';
                sorted.forEach(entry => {
                    const dur = entry.durationSeconds || 0;
                    const minutes = Math.floor(dur / 60);
                    const seconds = dur % 60;
                    const durStr = minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;
                    const date = new Date(entry.finishedAt);
                    const timeStr = date.toLocaleString('zh-CN', { hour12: false });
                    html += `
                        <div class="timeline-item">
                            <span class="tl-name">${escapeHtml(entry.taskName)}</span>
                            <span class="tl-duration">${durStr}</span>
                            <span class="tl-time">${timeStr}</span>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }

            // 简单防XSS
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ---------- 业务逻辑 ----------
            function handleStart(id) {
                const task = tasks.find(t => t.id === id);
                if (!task) return;
                // 如果有其他激活任务，先停止它们
                tasks.forEach(t => {
                    if (t.id !== id && t.isActive) {
                        t.isActive = false;
                        t.startTime = null;
                    }
                });
                // 如果当前任务已经是激活状态，不重复启动
                if (task.isActive) return;
                task.isActive = true;
                task.startTime = Date.now();
                saveTasks();
                renderAll();
                startGlobalTimer();
            }

            function handleStop(id) {
                const task = tasks.find(t => t.id === id);
                if (!task || !task.isActive) return;
                // 计算本次专注时长
                if (task.startTime) {
                    const now = Date.now();
                    const delta = Math.floor((now - task.startTime) / 1000);
                    if (delta > 0) {
                        task.elapsedSeconds = (task.elapsedSeconds || 0) + delta;
                        // 记录到时间线
                        timeline.push({
                            id: Date.now() + Math.random() * 1000,
                            taskName: task.name,
                            durationSeconds: delta,
                            finishedAt: now
                        });
                        saveTimeline();
                    }
                }
                task.isActive = false;
                task.startTime = null;
                saveTasks();
                renderAll();
                // 如果没有任何激活任务，停止全局计时
                const hasActive = tasks.some(t => t.isActive);
                if (!hasActive) stopGlobalTimer();
            }

            function handleDelete(id) {
                const task = tasks.find(t => t.id === id);
                if (!task) return;
                // 如果任务正在计时，先停止（不计入时间线）
                if (task.isActive) {
                    task.isActive = false;
                    task.startTime = null;
                    stopGlobalTimerIfNoActive();
                }
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderAll();
            }

            function addTask(name) {
                const trimmed = name.trim();
                if (!trimmed) return;
                // 重名检测（可选）
                const exists = tasks.some(t => t.name === trimmed);
                if (exists) {
                    alert('已存在同名任务，请使用不同的名称');
                    return;
                }
                const newTask = {
                    id: Date.now() + Math.random() * 1000,
                    name: trimmed,
                    elapsedSeconds: 0,
                    isActive: false,
                    startTime: null
                };
                tasks.push(newTask);
                saveTasks();
                renderAll();
            }

            // 全局计时器
            function startGlobalTimer() {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    // 更新所有激活任务的 elapsedSeconds
                    let anyActive = false;
                    tasks.forEach(task => {
                        if (task.isActive && task.startTime) {
                            anyActive = true;
                            // 增加秒数
                            const now = Date.now();
                            const delta = Math.floor((now - task.startTime) / 1000);
                            // 但注意：因为我们每次更新时，startTime不变，所以累计增量
                            // 但我们用elapsedSeconds存储总秒数，而startTime是上次重置开始时间
                            // 所以每次tick，我们计算从startTime到现在的秒数，但elapsedSeconds应加上增量，但不能重复加
                            // 更好方式：每次tick时，重新计算从startTime到现在的秒数，并设置为elapsedSeconds=基础秒数+增量。
                            // 但基础秒数可能是之前累积的。我们需要存储累积基础秒数。
                            // 简化：在start时，将当前elapsedSeconds作为基准，而startTime记录开始时间，每次tick计算总秒数=基准+delta。
                            // 所以我们需要额外存储baseSeconds。
                            // 为了不改变数据结构，我们利用elapsedSeconds存储总秒数，但每次tick更新elapsedSeconds = 基准 + delta
                            // 但基准我们无法得知，因为elapsedSeconds可能已经包含了之前的累积。
                            // 所以改进：在start时，记录startBase = elapsedSeconds，然后每次tick计算总秒数 = startBase + (now - startTime)/1000
                            // 但我们没有存储startBase，所以我们需要在任务对象上存储startBase。
                            // 为了兼容，我们给任务添加一个baseSeconds字段，如果不存在则使用elapsedSeconds
                            if (task.baseSeconds === undefined) {
                                task.baseSeconds = task.elapsedSeconds || 0;
                            }
                            const delta2 = Math.floor((now - task.startTime) / 1000);
                            task.elapsedSeconds = task.baseSeconds + delta2;
                        }
                    });
                    if (!anyActive) {
                        // 没有激活任务，停止计时器
                        stopGlobalTimer();
                    }
                    // 重新渲染任务列表（更新计时显示）
                    renderTasks();
                    // 保存任务状态
                    saveTasks();
                }, 1000);
            }

            function stopGlobalTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                // 重置所有任务的 baseSeconds 和 startTime，清除激活状态
                tasks.forEach(task => {
                    if (task.isActive) {
                        // 在停止时，已经处理过了，但为了保险，我们在这里清掉
                        // 但停止全局计时器通常是因为没有激活任务，或者手动停止了所有任务
                        // 我们应该确保没有激活任务
                    }
                    // 清除临时字段
                    delete task.baseSeconds;
                });
                saveTasks();
            }

            function stopGlobalTimerIfNoActive() {
                const hasActive = tasks.some(t => t.isActive);
                if (!hasActive) {
                    stopGlobalTimer();
                }
            }

            // 清除时间线
            function clearTimeline() {
                if (timeline.length === 0) return;
                if (confirm('确定要清空所有专注记录吗？')) {
                    timeline = [];
                    saveTimeline();
                    renderTimeline();
                }
            }

            // ---------- 初始化 ----------
            loadData();
            renderAll();

            // 如果有激活任务，启动计时器
            const hasActive = tasks.some(t => t.isActive);
            if (hasActive) {
                // 重置startTime为当前时间，并设置baseSeconds
                tasks.forEach(task => {
                    if (task.isActive) {
                        task.startTime = Date.now();
                        task.baseSeconds = task.elapsedSeconds || 0;
                    }
                });
                saveTasks();
                startGlobalTimer();
                renderTasks();
            }

            // ---------- 事件绑定 ----------
            document.getElementById('addTaskBtn').addEventListener('click', function() {
                const input = document.getElementById('taskInput');
                addTask(input.value);
                input.value = '';
                input.focus();
            });

            document.getElementById('taskInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('addTaskBtn').click();
                }
            });

            document.getElementById('clearTimelineBtn').addEventListener('click', clearTimeline);

            // 页面关闭前保存
            window.addEventListener('beforeunload', function() {
                saveTasks();
                saveTimeline();
            });
        })();
    </script>
</body>
</html>
