<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>跳动爱心 · 粉色粒子特效</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #2a0a1f 0%, #0a0010 100%);
    font-family: "Microsoft YaHei", sans-serif;
  }

  /* 背景照片层：绝对定位，缓慢淡入淡出 */
  .photo-layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 1;
    pointer-events: none;
  }
  .photo {
    position: absolute;
    border-radius: 12px;
    /* 模糊 + 粉色偏移，让照片融入氛围而不突兀 */
    filter: blur(3px) saturate(1.1) hue-rotate(-8deg) brightness(0.9);
    opacity: 0;
    object-fit: cover;
    box-shadow: 0 0 40px rgba(255, 105, 180, 0.15);
    /* 每张照片独立的呼吸节奏 */
    animation: breathe 14s ease-in-out infinite;
  }
  @keyframes breathe {
    0%   { opacity: 0;    transform: scale(1.02); }
    25%  { opacity: 0.16; transform: scale(1.0);  }
    50%  { opacity: 0.05; transform: scale(1.01); }
    75%  { opacity: 0.18; transform: scale(1.0);  }
    100% { opacity: 0;    transform: scale(1.02); }
  }

  /* 顶部柔和的粉色光雾，统一画面色调 */
  .veil {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,105,180,0.06), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,182,193,0.05), transparent 45%),
      radial-gradient(ellipse at center, transparent 30%, rgba(10,0,16,0.55) 90%);
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* 角落一行小字 */
  .caption {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    z-index: 4;
    text-align: center;
    color: rgba(255, 182, 193, 0.55);
    font-size: 13px;
    letter-spacing: 4px;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(255, 105, 180, 0.4);
  }
</style>
</head>
<body>

<!-- 爱情照片背景层：散布在四周，缓慢呼吸式淡入淡出 -->
<div class="photo-layer" id="photoLayer"></div>
<div class="veil"></div>

<canvas id="heart"></canvas>
<div class="caption">♡ My Heart Beats For You ♡</div>

<script>
/* ============ 1. 生成背景爱情照片（使用图片生成 API） ============ */
const photoSpecs = [
  { prompt: "Silhouette of a couple holding hands at sunset, soft warm dreamy light, bokeh, vintage film photography, romantic mood",
    size: "landscape_4_3", top: "6%",  left: "4%",  w: "20vw", h: "26vh", delay: "0s",    dur: "16s" },
  { prompt: "A bouquet of pink roses with soft focus, romantic vintage background, gentle morning light, dreamy atmosphere",
    size: "portrait_4_3",  top: "8%",  right: "5%", w: "18vw", h: "30vh", delay: "-4s",   dur: "18s" },
  { prompt: "Couple embracing under an umbrella in gentle rain, romantic cinematic mood, soft pastel tones, film grain",
    size: "landscape_4_3", bottom: "8%", left: "6%", w: "22vw", h: "26vh", delay: "-8s",  dur: "20s" },
  { prompt: "Two coffee cups with heart latte art on a wooden table, soft morning light, cozy romantic cafe, shallow depth of field",
    size: "landscape_4_3", bottom: "6%", right: "7%", w: "19vw", h: "24vh", delay: "-2s",  dur: "17s" },
  { prompt: "Couple walking on a beach at golden hour, back view, dreamy film photography, warm soft haze, romantic",
    size: "portrait_4_3",  top: "32%", left: "2%",  w: "15vw", h: "28vh", delay: "-11s", dur: "19s" },
  { prompt: "Heart shaped cloud in a pink sunset sky, soft dreamy atmosphere, pastel colors, romantic and serene",
    size: "landscape_4_3", top: "30%", right: "3%", w: "16vw", h: "22vh", delay: "-6s",  dur: "21s" },
];

const photoLayer = document.getElementById('photoLayer');
photoSpecs.forEach(spec => {
  const img = document.createElement('img');
  img.className = 'photo';
  const url = "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=" +
              encodeURIComponent(spec.prompt) + "&image_size=" + spec.size;
  img.src = url;
  img.style.width = spec.w;
  img.style.height = spec.h;
  if (spec.top)    img.style.top = spec.top;
  if (spec.bottom) img.style.bottom = spec.bottom;
  if (spec.left)   img.style.left = spec.left;
  if (spec.right)  img.style.right = spec.right;
  img.style.animationDelay = spec.delay;
  img.style.animationDuration = spec.dur;
  photoLayer.appendChild(img);
});

/* ============ 2. 粉色粒子跳动爱心 ============ */
const canvas = document.getElementById('heart');
const ctx = canvas.getContext('2d');

let W, H, cx, cy, scale;
function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  cx = W / 2;
  cy = H / 2;
  scale = Math.min(W, H) / 40;
}
window.addEventListener('resize', resize);
resize();

// 爱心参数方程
function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
  return { x: x * scale, y: y * scale };
}

// 轮廓粒子
const outlinePoints = [];
const OUTLINE_COUNT = 360;
for (let i = 0; i < OUTLINE_COUNT; i++) {
  const t = (i / OUTLINE_COUNT) * Math.PI * 2;
  const p = heartPoint(t);
  outlinePoints.push({
    baseX: p.x, baseY: p.y,
    jitter: Math.random() * Math.PI * 2,
    size: 1.5 + Math.random() * 2
  });
}

// 内部填充粒子
const fillPoints = [];
const FILL_COUNT = 240;
for (let i = 0; i < FILL_COUNT; i++) {
  const t = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random());
  const p = heartPoint(t);
  fillPoints.push({
    baseX: p.x * r, baseY: p.y * r,
    jitter: Math.random() * Math.PI * 2,
    size: 0.8 + Math.random() * 1.6
  });
}

// 飘动小粒子
const floaters = [];
for (let i = 0; i < 70; i++) {
  floaters.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -0.2 - Math.random() * 0.4,
    size: 0.5 + Math.random() * 1.5,
    life: Math.random()
  });
}

// 粉色调色板
const pinkColors = [
  '255, 105, 180',
  '255, 182, 193',
  '255, 20, 147',
  '255, 192, 203',
  '255, 153, 204',
  '255, 220, 235'
];

/* === 真实心跳节律：lub-dub 双拍 ===
   一个心动周期约 1 秒（60bpm）：
   - lub（S1，心室收缩）：相位 ~0.08 处一个尖锐高斯峰
   - dub（S2，半月瓣关闭）：相位 ~0.24 处一个稍小的峰
   - 随后是较长的舒张期静息
*/
function heartbeat(t) {
  const period = 1.0;                       // 每次心跳 1 秒
  const phase = (t % period) / period;       // 0~1 归一化相位
  const lub = Math.exp(-Math.pow((phase - 0.08) / 0.035, 2));
  const dub = Math.exp(-Math.pow((phase - 0.24) / 0.045, 2)) * 0.62;
  // 收缩瞬间还带一点点轻微回弹，更像肌肉运动
  const recoil = Math.exp(-Math.pow((phase - 0.16) / 0.04, 2)) * -0.08;
  return 1 + 0.14 * (lub + dub + recoil);
}
// 光晕脉冲：紧随心跳，S1 时最亮
function glowPulseValue(t) {
  const period = 1.0;
  const phase = (t % period) / period;
  const lub = Math.exp(-Math.pow((phase - 0.08) / 0.05, 2));
  const dub = Math.exp(-Math.pow((phase - 0.24) / 0.06, 2)) * 0.6;
  return 0.25 + 0.75 * (lub + dub);
}

let t0 = performance.now();
function draw(now) {
  const time = (now - t0) / 1000;  // 秒

  // 拖尾遮罩
  ctx.fillStyle = 'rgba(10, 0, 16, 0.18)';
  ctx.fillRect(0, 0, W, H);

  const beat = heartbeat(time);
  const glowPulse = glowPulseValue(time);

  ctx.save();
  ctx.translate(cx, cy);

  // 外层光晕，随心跳明灭
  const glowRadius = 18 * scale * beat;
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, glowRadius);
  glow.addColorStop(0,   `rgba(255, 105, 180, ${0.28 * glowPulse})`);
  glow.addColorStop(0.4, `rgba(255, 105, 180, ${0.09 * glowPulse})`);
  glow.addColorStop(1,   'rgba(255, 105, 180, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
  ctx.fill();

  ctx.scale(beat, beat);

  // 填充粒子
  fillPoints.forEach((p, i) => {
    const wobble = Math.sin(time * 2 + p.jitter) * 1.2;
    const x = p.baseX + wobble;
    const y = p.baseY + wobble;
    const color = pinkColors[i % pinkColors.length];
    ctx.fillStyle = `rgba(${color}, 0.5)`;
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  // 轮廓粒子（带辉光）
  outlinePoints.forEach((p, i) => {
    const wobble = Math.sin(time * 2.5 + p.jitter) * 1.5;
    const x = p.baseX + wobble;
    const y = p.baseY + wobble;
    const color = pinkColors[i % pinkColors.length];
    // 辉光强度也随心跳增强
    ctx.shadowBlur = 8 + 6 * glowPulse;
    ctx.shadowColor = `rgba(${color}, 0.9)`;
    ctx.fillStyle = `rgba(${color}, 0.95)`;
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.shadowBlur = 0;
  ctx.restore();

  // 飘动小粒子
  floaters.forEach(f => {
    f.x += f.vx;
    f.y += f.vy;
    f.life += 0.005;
    if (f.y < -10 || f.x < -10 || f.x > W + 10) {
      f.x = Math.random() * W;
      f.y = H + 10;
      f.life = 0;
    }
    const alpha = Math.sin(f.life * Math.PI) * 0.6;
    ctx.fillStyle = `rgba(255, 182, 193, ${alpha})`;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * devicePixelRatio, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
