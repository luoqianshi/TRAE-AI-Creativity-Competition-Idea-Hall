<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 冰箱管家 - 创意原型</title>
    <style>
        :root {
            --primary-color: #00Bfa5;
            --bg-color: #f4f7f6;
            --text-main: #333333;
            --text-sub: #888888;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 375px; /* 模拟手机宽度 */
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 24px 20px 20px;
            text-align: center;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 12px;
            opacity: 0.9;
        }

        .main-content {
            padding: 20px;
            background: var(--bg-color);
            min-height: 500px;
        }

        .upload-card {
            background: #e0f2f1;
            border: 2px dashed var(--primary-color);
            color: #00796b;
            padding: 16px;
            text-align: center;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 24px;
        }

        .upload-card:active {
            background: #b2dfdb;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            margin-top: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            margin: 0;
        }

        .list-container {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .list-item {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .item-info h3 {
            margin: 0 0 6px 0;
            font-size: 15px;
            color: var(--text-main);
        }

        .item-info p {
            margin: 0;
            font-size: 12px;
            color: var(--text-sub);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-danger { background: #ffebee; color: #d32f2f; }
        .badge-warning { background: #fff3e0; color: #ef6c00; }
        .badge-safe { background: #e8f5e9; color: #2e7d32; }
        .badge-ai { background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb;}

        /* 加载动画 */
        .loading-overlay {
            display: none;
            text-align: center;
            padding: 20px 0;
            color: var(--primary-color);
            font-size: 14px;
            font-weight: bold;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0, 191, 165, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- 头部 -->
        <div class="header">
            <h1>AI 冰箱管家</h1>
            <p>智能识别记录 · 拒绝食物浪费</p>
        </div>

        <!-- 内容区 -->
        <div class="main-content">
            
            <!-- 拍照交互区 -->
            <div class="upload-card" id="scanBtn" onclick="simulateAI()">
                📸 点击拍照，一键录入食材
            </div>
            
            <div class="loading-overlay" id="loadingState">
                <div class="spinner"></div> AI 正在提取保质期...
            </div>

            <!-- 冰箱库存清单 -->
            <div class="section-header">
                <h2 class="section-title">❄️ 临期提醒</h2>
                <span class="status-badge" style="background:#f5f5f5; color:#666;">共 3 件</span>
            </div>
            <ul class="list-container" id="inventoryList">
                <li class="list-item">
                    <div class="item-info">
                        <h3>纯鲜牛奶 (950ml)</h3>
                        <p>录入于：2天前</p>
                    </div>
                    <span class="status-badge badge-warning">仅剩 1 天</span>
                </li>
                <li class="list-item">
                    <div class="item-info">
                        <h3>西红柿 (3个)</h3>
                        <p>录入于：3天前</p>
                    </div>
                    <span class="status-badge badge-warning">仅剩 2 天</span>
                </li>
            </ul>

            <!-- AI 推荐菜谱 -->
            <div class="section-header">
                <h2 class="section-title">👨‍🍳 拯救临期计划</h2>
                <span class="status-badge badge-ai">AI 动态生成</span>
            </div>
            <ul class="list-container" id="recipeList">
                <li class="list-item">
                    <div class="item-info">
                        <h3>奶香番茄浓汤</h3>
                        <p>✨ 消耗：牛奶、西红柿 | ⏱️ 15分钟</p>
                    </div>
                    <div style="font-size: 24px;">🍲</div>
                </li>
            </ul>

        </div>
    </div>

    <!-- 交互脚本 -->
    <script>
        function simulateAI() {
            const btn = document.getElementById('scanBtn');
            const loading = document.getElementById('loadingState');
            const inventoryList = document.getElementById('inventoryList');
            const recipeList = document.getElementById('recipeList');

            // 隐藏按钮，显示加载动画
            btn.style.display = 'none';
            loading.style.display = 'block';

            // 模拟 API 请求延迟
            setTimeout(() => {
                loading.style.display = 'none';
                btn.style.display = 'block';
                btn.innerHTML = '✅ 录入成功！继续拍照';
                btn.style.background = '#e8f5e9';
                btn.style.borderColor = '#4caf50';
                btn.style.color = '#2e7d32';

                // 动态添加新食材
                const newItem = document.createElement('li');
                newItem.className = 'list-item';
                newItem.innerHTML = `
                    <div class="item-info">
                        <h3>有机花菜 (1棵)</h3>
                        <p>刚刚通过照片识别录入</p>
                    </div>
                    <span class="status-badge badge-safe">保质期 7 天</span>
                `;
                // 插入到库存最前面
                inventoryList.insertBefore(newItem, inventoryList.firstChild);

                // 动态更新菜谱
                const newRecipe = document.createElement('li');
                newRecipe.className = 'list-item';
                newRecipe.innerHTML = `
                    <div class="item-info">
                        <h3>番茄炒花菜</h3>
                        <p>✨ 消耗：西红柿、花菜 | ⏱️ 10分钟</p>
                    </div>
                    <div style="font-size: 24px;">🥗</div>
                `;
                recipeList.insertBefore(newRecipe, recipeList.firstChild);

            }, 1800); // 1.8秒后执行
        }
    </script>
</body>
</html>
