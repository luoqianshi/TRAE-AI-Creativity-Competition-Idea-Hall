<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI基础知识消消乐</title>
  <style>
    :root {
      --primary: #5B6EF5;
      --primary-light: #8A9AFF;
      --accent: #FF6B6B;
      --accent2: #FFD166;
      --bg: #F7F9FC;
      --card-bg: #fff;
      --text: #2D3436;
      --text-light: #636E72;
      --success: #00B894;
      --shadow: 0 4px 20px rgba(91,110,245,0.15);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #E0E7FF 0%, #F7F9FC 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      padding: 40px 20px 20px;
    }
    header h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    header p { color: var(--text-light); font-size: 0.95rem; }
    .scoreboard {
      display: flex;
      gap: 24px;
      margin: 10px 0 20px;
      font-size: 0.9rem;
    }
    .scoreboard span {
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    #game {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 0 20px 40px;
      width: 100%;
      max-width: 900px;
    }
    .column {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      min-width: 280px;
    }
    .column-title {
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px 22px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.95rem;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(91,110,245,0.25); }
    .card.selected {
      border-color: var(--primary);
      background: #F0F3FF;
    }
    .card.matched {
      background: linear-gradient(135deg, #E8FFF5, #D1FAE5);
      border-color: var(--success);
      color: var(--success);
      cursor: default;
      animation: matchPop 0.5s ease;
    }
    .card.wrong {
      animation: shake 0.4s ease;
      border-color: var(--accent);
    }
    .card.hidden { opacity: 0; pointer-events: none; transform: scale(0.8); }
    @keyframes matchPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px 36px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      transform: scale(0.9);
      transition: transform 0.3s;
    }
    .overlay.active .modal { transform: scale(1); }
    .modal h2 { margin-bottom: 12px; color: var(--primary); }
    .modal p { color: var(--text-light); margin-bottom: 20px; line-height: 1.6; }
    .modal .btn {
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 24px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .modal .btn:hover { opacity: 0.9; }
    .knowledge-tip {
      max-width: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin: 0 20px 40px;
      box-shadow: var(--shadow);
      font-size: 0.9rem;
      color: var(--text-light);
      line-height: 1.7;
      border-left: 4px solid var(--accent2);
    }
    .knowledge-tip strong { color: var(--primary); }
    footer {
      padding: 20px;
      font-size: 0.8rem;
      color: #B2BEC3;
      text-align: center;
    }
    @media (max-width: 680px) {
      #game { gap: 20px; }
      .column { min-width: 140px; }
      .card { padding: 14px; font-size: 0.85rem; min-height: 60px; }
      header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>AI 基础知识消消乐</h1>
    <p>点击左侧「提示词/概念」，再点击右侧「效果」，正确配对即可消除！</p>
    <div class="scoreboard">
      <span>配对: <b id="matched">0</b> / <b id="total">0</b></span>
      <span>错误: <b id="wrong">0</b></span>
      <span>用时: <b id="timer">0</b>秒</span>
    </div>
  </header>

  <div id="game">
    <div class="column" id="leftCol"></div>
    <div class="column" id="rightCol"></div>
  </div>

  <div class="knowledge-tip" id="tipBox">
    <strong>💡 AI小贴士：</strong>点击卡片开始游戏，每次配对成功都会显示一条AI知识哦！
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">🎉 恭喜通关！</h2>
      <p id="modalText">你已经掌握了这些AI基础知识，快去实际应用吧！</p>
      <button class="btn" onclick="restartGame()">再来一局</button>
    </div>
  </div>

  <footer>学习工作赛道 — 让AI学习变得更有趣</footer>

  <script>
    const pairs = [
      { left: "给AI设定一个专业角色", right: "获得更专业、精准的回复", tip: "提示词技巧：在提问前先让AI扮演特定角色（如专家、顾问），能显著提升回答质量。" },
      { left: "把复杂任务拆成步骤", right: "AI执行更准确、不易出错", tip: "任务分解：将复杂请求拆成多个简单步骤，引导AI逐步完成，可降低错误率。" },
      { left: "提供具体的示例", right: "AI能更好理解你想要的格式", tip: "少样本学习：给AI提供1-3个输入输出示例，能让它更快掌握你的需求。" },
      { left: "使用明确的约束条件", right: "回复内容更可控、更符合预期", tip: "约束提示：明确字数、格式、语气等限制，让AI输出更可控。" },
      { left: "让AI先思考再回答", right: "逻辑推理类问题的答案更严谨", tip: "链式思考：在提示词中要求AI'一步一步思考'，可提升数学和逻辑题的准确率。" },
      { left: "迭代优化提示词", right: "通过多轮对话获得最佳结果", tip: "迭代优化：第一次答案不满意时，告诉AI具体哪里需要改进，多轮打磨效果更佳。" },
      { left: "给AI提供足够的上下文", right: "回复更贴合实际场景和需求", tip: "上下文工程：提供背景信息、相关数据，让AI的回答更贴合你的真实场景。" },
      { left: "使用清晰的输出格式要求", right: "方便直接复制或使用结果", tip: "结构化输出：要求AI用表格、列表、JSON等格式输出，方便后续使用。" }
    ];

    let leftSelected = null, rightSelected = null;
    let matchedCount = 0, wrongCount = 0, timer = 0, timerInterval = null;
    let isProcessing = false;

    function shuffle(arr) {
      return arr.slice().sort(() => Math.random() - 0.5);
    }

    function startGame() {
      document.getElementById("leftCol").innerHTML = "";
      document.getElementById("rightCol").innerHTML = "";
      leftSelected = null; rightSelected = null;
      matchedCount = 0; wrongCount = 0; timer = 0;
      document.getElementById("matched").textContent = matchedCount;
      document.getElementById("total").textContent = pairs.length;
      document.getElementById("wrong").textContent = wrongCount;
      document.getElementById("timer").textContent = timer;
      document.getElementById("overlay").classList.remove("active");
      document.getElementById("tipBox").innerHTML = "<strong>💡 AI小贴士：</strong>点击卡片开始游戏，每次配对成功都会显示一条AI知识哦！";

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer++;
        document.getElementById("timer").textContent = timer;
      }, 1000);

      const leftItems = shuffle(pairs.map((p, i) => ({ text: p.left, index: i })));
      const rightItems = shuffle(pairs.map((p, i) => ({ text: p.right, index: i })));

      const leftCol = document.getElementById("leftCol");
      const rightCol = document.getElementById("rightCol");

      leftCol.innerHTML = '<div class="column-title">🎯 提示词 / 概念</div>';
      rightCol.innerHTML = '<div class="column-title">✨ 产生的效果</div>';

      leftItems.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.textContent = item.text;
        card.dataset.side = "left";
        card.dataset.index = item.index;
        card.onclick = () => handleCardClick(card);
        leftCol.appendChild(card);
      });

      rightItems.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.textContent = item.text;
        card.dataset.side = "right";
        card.dataset.index = item.index;
        card.onclick = () => handleCardClick(card);
        rightCol.appendChild(card);
      });
    }

    function handleCardClick(card) {
      if (isProcessing || card.classList.contains("matched") || card.classList.contains("hidden")) return;

      const side = card.dataset.side;
      if (side === "left") {
        if (leftSelected) leftSelected.classList.remove("selected");
        leftSelected = card;
        card.classList.add("selected");
      } else {
        if (rightSelected) rightSelected.classList.remove("selected");
        rightSelected = card;
        card.classList.add("selected");
      }

      if (leftSelected && rightSelected) {
        checkMatch();
      }
    }

    function checkMatch() {
      isProcessing = true;
      const leftIdx = parseInt(leftSelected.dataset.index);
      const rightIdx = parseInt(rightSelected.dataset.index);

      if (leftIdx === rightIdx) {
        matchedCount++;
        document.getElementById("matched").textContent = matchedCount;
        document.getElementById("tipBox").innerHTML = "<strong>✅ AI知识：</strong>" + pairs[leftIdx].tip;

        leftSelected.classList.add("matched");
        rightSelected.classList.add("matched");
        leftSelected.classList.remove("selected");
        rightSelected.classList.remove("selected");

        setTimeout(() => {
          leftSelected.classList.add("hidden");
          rightSelected.classList.add("hidden");
          leftSelected = null; rightSelected = null;
          isProcessing = false;

          if (matchedCount === pairs.length) {
            clearInterval(timerInterval);
            showWin();
          }
        }, 600);
      } else {
        wrongCount++;
        document.getElementById("wrong").textContent = wrongCount;
        leftSelected.classList.add("wrong");
        rightSelected.classList.add("wrong");

        setTimeout(() => {
          leftSelected.classList.remove("selected", "wrong");
          rightSelected.classList.remove("selected", "wrong");
          leftSelected = null; rightSelected = null;
          isProcessing = false;
        }, 600);
      }
    }

    function showWin() {
      document.getElementById("modalTitle").textContent = "🎉 恭喜通关！";
      document.getElementById("modalText").textContent = `你用时 ${timer} 秒，完成了全部 ${pairs.length} 组配对！\n\n这些提示词技巧将帮助你更高效地使用AI，快去TRAE里实践吧！`;
      document.getElementById("overlay").classList.add("active");
    }

    function restartGame() {
      startGame();
    }

    startGame();
  </script>
</body>
</html>
