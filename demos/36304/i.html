<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心愈学 - AI学业压力舒缓助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(160deg, #e8f4ff, #fff0f6);
            min-height: 100vh;
            padding: 20px 15px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #5b7fb9;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .desc {
            color: #777;
            font-size: 15px;
        }

        .tab-nav {
            display: flex;
            gap: 6px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            border: none;
            padding: 10px 16px;
            border-radius: 99px;
            background: #fff;
            color: #666;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(91, 127, 185, 0.1);
        }

        .tab-btn.active {
            background: #789fd8;
            color: white;
        }

        .panel {
            display: none;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(91, 127, 185, 0.08);
            margin-bottom: 20px;
        }

        .panel.show {
            display: block;
        }

        .panel-title {
            font-size: 19px;
            margin-bottom: 16px;
            color: #4468a3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 1. AI树洞聊天区 */
        .chat-box {
            height: 320px;
            overflow-y: auto;
            border: 1px solid #e0e9f5;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
            background: #fafcff;
        }

        .msg {
            margin: 10px 0;
            max-width: 85%;
        }

        .user-msg {
            text-align: right;
        }

        .msg-bubble {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
        }

        .user-msg .msg-bubble {
            background: #789fd8;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-msg .msg-bubble {
            background: #e8f0fc;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .chat-input-wrap {
            display: flex;
            gap: 8px;
        }

        #chatInput {
            flex: 1;
            border: 1px solid #d1dcec;
            border-radius: 99px;
            padding: 11px 16px;
            outline: none;
            font-size: 14px;
        }

        #sendChat {
            border: none;
            background: #789fd8;
            color: white;
            border-radius: 99px;
            padding: 0 18px;
            cursor: pointer;
        }

        /* 2. 呼吸减压动画 */
        .breath-wrap {
            text-align: center;
            padding: 20px 0;
        }

        .breath-circle {
            width: 160px;
            height: 160px;
            margin: 20px auto;
            border-radius: 50%;
            background: radial-gradient(circle, #b6d0f5, #789fd8);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 1s ease-in-out;
            box-shadow: 0 0 30px rgba(120, 159, 216, 0.3);
        }

        .breath-circle.breathe-in {
            transform: scale(1.4);
        }

        .breath-circle.breathe-hold {
            transform: scale(1.4);
        }

        .breath-circle.breathe-out {
            transform: scale(1);
        }

        .breath-text {
            color: white;
            font-size: 18px;
            font-weight: 500;
        }

        .breath-desc {
            color: #666;
            margin: 10px 0 22px;
            font-size: 14px;
        }

        .breath-btn {
            border: none;
            padding: 10px 24px;
            border-radius: 99px;
            background: #789fd8;
            color: white;
            cursor: pointer;
        }

        /* 3. 任务拆解模块 */
        .task-item {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        #taskInput {
            width: 100%;
            border: 1px solid #d1dcec;
            border-radius: 10px;
            padding: 11px 14px;
            margin-bottom: 12px;
            outline: none;
        }

        #splitTask {
            border: none;
            background: #789fd8;
            color: white;
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .task-result {
            background: #f0f6ff;
            padding: 14px;
            border-radius: 12px;
            line-height: 1.7;
            font-size: 14px;
        }

        /* 4. 暖心卡片 */
        .card-box {
            background: linear-gradient(135deg, #d4e4fc, #fce8f0);
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-text {
            font-size: 17px;
            line-height: 1.8;
            color: #3a4c70;
            margin-bottom: 22px;
        }

        #newCard {
            border: none;
            background: #789fd8;
            color: white;
            border-radius: 99px;
            padding: 10px 22px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>心愈学 · AI学业压力舒缓助手</h1>
            <p class="desc">匿名树洞｜呼吸放松｜任务拆解｜暖心疗愈卡片</p>
        </header>

        <!-- 顶部切换标签 -->
        <div class="tab-nav">
            <button class="tab-btn active" data-target="chatPanel">AI情绪树洞</button>
            <button class="tab-btn" data-target="breathPanel">478呼吸减压</button>
            <button class="tab-btn" data-target="taskPanel">学业任务拆解</button>
            <button class="tab-btn" data-target="cardPanel">每日暖心卡片</button>
        </div>

        <!-- 面板1：AI树洞 -->
        <div class="panel show" id="chatPanel">
            <h2 class="panel-title">💬 匿名AI树洞，倾诉学业烦恼</h2>
            <div class="chat-box" id="chatBox">
                <div class="ai-msg msg">
                    <div class="msg-bubble">你好呀！把考试焦虑、作业压力、学习内耗都和我说吧，我会温柔陪伴你～</div>
                </div>
            </div>
            <div class="chat-input-wrap">
                <input type="text" id="chatInput" placeholder="输入你的烦恼，例如：期末复习压力好大，总害怕考不好">
                <button id="sendChat">发送</button>
            </div>
        </div>

        <!-- 面板2：呼吸减压 -->
        <div class="panel" id="breathPanel">
            <h2 class="panel-title">🌬 478深呼吸快速平复焦虑</h2>
            <div class="breath-wrap">
                <p class="breath-desc">吸气4秒 → 屏息7秒 → 呼气8秒，跟随圆圈节奏放松大脑</p>
                <div class="breath-circle" id="breathCircle">
                    <span class="breath-text">准备</span>
                </div>
                <button class="breath-btn" id="startBreath">开始呼吸练习</button>
            </div>
        </div>

        <!-- 面板3：任务拆解 -->
        <div class="panel" id="taskPanel">
            <h2 class="panel-title">📝 AI拆解繁重学习任务，消除畏难情绪</h2>
            <input id="taskInput" placeholder="输入你堆积的学习任务，例如：3套数学卷子+背诵英语单词+复习历史三单元">
            <button id="splitTask">一键拆分任务+规划休息</button>
            <div class="task-result" id="taskResult">
                点击上方按钮，AI会自动拆分小块任务、搭配劳逸结合计划
            </div>
        </div>

        <!-- 面板4：暖心卡片 -->
        <div class="panel" id="cardPanel">
            <h2 class="panel-title">💌 学业疗愈暖心卡片</h2>
            <div class="card-box">
                <p class="card-text" id="cardText">学习很累也没关系，允许自己偶尔放慢脚步，你已经很努力了</p>
                <button id="newCard">换一张鼓励卡片</button>
            </div>
        </div>
    </div>

    <script>
        // 1. 标签切换逻辑
        const tabBtns = document.querySelectorAll('.tab-btn');
        const panels = document.querySelectorAll('.panel');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.dataset.target;
                tabBtns.forEach(b => b.classList.remove('active'));
                panels.forEach(p => p.classList.remove('show'));
                btn.classList.add('active');
                document.getElementById(targetId).classList.add('show');
            })
        })

        // 2. AI树洞对话（学业压力专属回复库）
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');
        const sendChat = document.getElementById('sendChat');
        const replyLib = [
            "我特别懂这种考前焦虑，不用逼自己完美，按节奏一点点复习就足够啦，累了一定要休息10分钟",
            "作业堆积确实会让人崩溃，我们可以把任务拆成很小的片段，完成一小段就奖励自己休息一会",
            "不用和别人对比进度，每个人节奏不一样，你的努力都在悄悄沉淀，慢慢来不丢人",
            "厌学情绪很正常，大脑长时间紧绷会本能抗拒学习，先放空15分钟再重新开始会轻松很多",
            "一次成绩不能定义你的全部，失误只是提醒我们查漏补缺，不代表你不够优秀",
            "长期熬夜学习会加重焦虑，尽量保证基础睡眠，清醒的大脑学习效率会翻倍",
            "不用强迫时刻紧绷，允许自己有摆烂的一小段时间，休息不是偷懒，是为了更好前行",
            "内耗只会消耗你的精力，专注当下能完成的小事，不用提前担忧还没发生的考试结果"
        ];
        function addMsg(text, isUser) {
            const div = document.createElement('div');
            div.className = isUser ? "user-msg msg" : "ai-msg msg";
            div.innerHTML = `<div class="msg-bubble">${text}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        function sendMsg() {
            const val = chatInput.value.trim();
            if (!val) return;
            addMsg(val, true);
            chatInput.value = "";
            setTimeout(() => {
                const randomReply = replyLib[Math.floor(Math.random() * replyLib.length)];
                addMsg(randomReply, false);
            }, 600)
        }
        sendChat.addEventListener('click', sendMsg);
        chatInput.addEventListener('keydown', e => e.key === "Enter" && sendMsg())

        // 3. 478呼吸动画
        const breathCircle = document.getElementById('breathCircle');
        const breathText = document.querySelector('.breath-text');
        const startBreath = document.getElementById('startBreath');
        let breathTimer = null;
        startBreath.addEventListener('click', () => {
            clearInterval(breathTimer);
            let step = 0;

                { cls: "breathe-in", text: "吸气 4s", t: 4000 },
                { cls: "breathe-hold", text: "屏息 7s", t: 7000 },
                { cls: "breathe-out", text: "呼气 8s", t: 8000 },
                { cls: "", text: "放松片刻", t: 1000 }
            ]
            function runStep() {
                const s = steps
            }
        }
