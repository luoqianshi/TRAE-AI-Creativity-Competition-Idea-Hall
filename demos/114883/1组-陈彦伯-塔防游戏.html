<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>元素塔防 扩容金币+新塔版</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:Arial}
        body {background:#1a1a2e; display:flex; flex-direction:column; align-items:center; padding:10px; color:#fff}
        #gameBox {
            position:relative;
            width:800px; height:500px;
            background:#365b35;
            border:3px solid #fff;
            overflow:hidden;
        }
        .road {position:absolute; background:#926c48; border:1px solid #704f33}

        /* 普通防御塔（草地） */
        .tower {
            position:absolute; width:44px; height:44px;
            border-radius:8px; display:flex; align-items:center; justify-content:center;
            font-size:22px; font-weight:bold; cursor:pointer;
            border:2px solid rgba(255,255,255,0.8);
            box-shadow:0 0 10px rgba(0,0,0,0.5);
            z-index:2;
        }
        .fire {background:linear-gradient(135deg,#ff4422,#ff7744)}
        .ice {background:linear-gradient(135deg,#44ccff,#88eeff)}
        .thunder {background:linear-gradient(135deg,#ffdd00,#ffee66); color:#222}
        .poison {background:linear-gradient(135deg,#22cc22,#66ff66)}
        .rock {background:linear-gradient(135deg,#888888,#bbbbbb)}
        .laser {background:linear-gradient(135deg,#ff0066,#ff66aa)}
        .wind {background:linear-gradient(135deg,#b0e8ff,#e0f8ff); color:#111}
        .arrow {background:linear-gradient(135deg,#b86b33,#ffb370)}
        .lava {background:linear-gradient(135deg,#c02000,#ff7000)}
        .electro {background:linear-gradient(135deg,#7733ff,#bb99ff)}

        /* 道路陷阱（只能放路面） */
        .trap {
            position:absolute; width:36px; height:36px;
            border-radius:4px; display:flex; align-items:center; justify-content:center;
            font-size:18px; cursor:pointer;
            border:2px solid #222;
            z-index:1;
        }
        .spikeTrap {background:#553322}
        .mudTrap {background:#665533}

        /* 敌人外观 */
        .enemy {
            position:absolute; width:34px; height:34px;
            border-radius:6px; display:flex; align-items:center; justify-content:center;
            font-size:18px; font-weight:bold;
            transition:left 0.05s linear,top 0.05s linear;
            border:2px solid rgba(0,0,0,0.4);
            z-index:3;
        }
        .normal {background:#ff7777}
        .heavy {background:#666666; width:44px;height:44px}
        .fast {background:#77ff77}
        .boss {background:#aa2222; width:54px;height:54px; font-size:24px; border:3px solid #ffcc00}
        .swarm {background:#aaffaa; width:24px;height:24px; font-size:14px}
        .shield {background:#2288ff; width:38px;height:38px}

        /* 血条 */
        .hpBar {
            position:absolute; left:0; top:-8px;
            width:100%; height:4px;
            background:#444;
            border-radius:2px;
            overflow:hidden;
        }
        .hpFill {
            width:100%; height:100%;
            background:#ff3333;
            transition:width 0.1s linear;
        }

        /* 子弹 */
        .bullet {position:absolute; width:10px;height:10px; border-radius:50%; box-shadow:0 0 8px currentColor; z-index:4}
        .fireBullet {background:#ff2200; color:#ff2200}
        .iceBullet {background:#aaddff; color:#aaddff}
        .thunderBullet {background:#ffff22; color:#ffff22}
        .poisonBullet {background:#22ff22; color:#22ff22}
        .rockBullet {background:#bbbbbb; color:#bbbbbb}
        .laserBullet {background:#ff0066; color:#ff0066}
        .windBullet {background:#e0f8ff; color:#b0e8ff}
        .arrowBullet {background:#ffb370; color:#b86b33}
        .lavaBullet {background:#ff7000; color:#c02000}
        .electroBullet {background:#bb99ff; color:#7733ff}

        /* 特效 */
        .slowEffect {
            position:absolute; width:40px; height:40px;
            border-radius:50%; border:3px solid #aaddff;
            animation:pulse 0.6s infinite alternate;
            pointer-events:none; z-index:0
        }
        .poisonEffect {
            position:absolute; width:30px; height:30px;
            border-radius:50%; background:rgba(34,255,34,0.3);
            animation:pulse 0.5s infinite alternate;
            pointer-events:none; z-index:0
        }
        .burnEffect {
            position:absolute; width:36px; height:36px;
            border-radius:50%; background:rgba(255,80,0,0.35);
            animation:pulse 0.4s infinite alternate;
            pointer-events:none; z-index:0
        }
        @keyframes pulse {
            from {transform:scale(0.8); opacity:0.6}
            to {transform:scale(1.2); opacity:1}
        }

        /* UI */
        #ui {
            width:800px; display:flex; justify-content:space-between;
            padding:8px 0; font-size:18px; margin-bottom:8px
        }
        #towerPanel {
            width:800px; display:flex; gap:6px; padding:10px;
            background:#222; border:2px solid #666; margin-top:10px; flex-wrap:wrap
        }
        .towerBtn {
            padding:5px 8px; cursor:pointer; border:none; border-radius:4px;
            font-size:13px; color:#fff;
            min-width:72px;
        }
        .trapBtn {background:#442211}
        #fireBtn {background:#f33}
        #iceBtn {background:#0cf}
        #thunderBtn {background:#fc0; color:#000}
        #poisonBtn {background:#2c2}
        #rockBtn {background:#888}
        #laserBtn {background:#f06}
        #windBtn {background:#b0e8ff; color:#111}
        #arrowBtn {background:#b86b33}
        #lavaBtn {background:#c02000}
        #electroBtn {background:#7733ff}
        #shovelBtn {background:#c99428}
        .tip {margin-top:8px; color:#aaa; font-size:14px; width:100%}

        #gameOver {
            position:absolute; left:0;top:0; width:100%;height:100%;
            background:rgba(0,0,0,0.85); display:none;
            flex-direction:column; align-items:center; justify-content:center;
            font-size:48px; z-index:99
        }
        #restart {margin-top:20px; padding:10px 30px; font-size:20px; cursor:pointer}
    </style>
</head>
<body>
    <div id="ui">
        <div>金币：<span id="gold">200</span></div>
        <div>基地血量：<span id="hp">20</span></div>
        <div>波次：<span id="wave">1</span></div>
        <div>击杀：<span id="kills">0</span></div>
    </div>
    <div id="gameBox">
        <div id="gameOver">
            游戏结束
            <button id="restart">重新开始</button>
        </div>
    </div>
    <div id="towerPanel">
        <button class="towerBtn" id="fireBtn">火塔(50)<br>高伤</button>
        <button class="towerBtn" id="iceBtn">冰塔(40)<br>减速</button>
        <button class="towerBtn" id="thunderBtn">雷塔(70)<br>群伤</button>
        <button class="towerBtn" id="poisonBtn">毒塔(60)<br>持续毒</button>
        <button class="towerBtn" id="rockBtn">石塔(55)<br>击晕</button>
        <button class="towerBtn" id="laserBtn">激光塔(90)<br>破甲</button>
        <button class="towerBtn" id="windBtn">风旋塔(65)<br>击退</button>
        <button class="towerBtn" id="arrowBtn">箭塔(45)<br>暴击</button>
        <button class="towerBtn" id="lavaBtn">熔岩塔(75)<br>灼烧</button>
        <button class="towerBtn" id="electroBtn">电磁塔(85)<br>连锁电击</button>
        <button class="towerBtn trapBtn" id="spikeBtn">尖刺陷阱(30)<br>路面伤害</button>
        <button class="towerBtn trapBtn" id="mudBtn">泥浆陷阱(25)<br>大幅减速</button>
        <button class="towerBtn" id="shovelBtn">铲子<br>出售返还50%</button>
        <div class="tip">彩色塔放草地；陷阱放道路；选中铲子点击建筑可出售；不可重叠建造</div>
    </div>

<script>
const game = {
    gold: 200, // 开局金币提升至200
    baseHp: 20,
    wave: 1,
    kills: 0,
    selectedTower: null,
    selectedTrap: null,
    selectedShovel: false,
    towers: [],
    traps: [],
    enemies: [],
    bullets: [],
    effects: [],
    roadPoints: [],
    gameLoop: null,
    spawnTimer: null,
    isGameOver: false
}

const gameBox = document.getElementById('gameBox');
const goldText = document.getElementById('gold');
const hpText = document.getElementById('hp');
const waveText = document.getElementById('wave');
const killsText = document.getElementById('kills');
const gameOverDom = document.getElementById('gameOver');
const restartBtn = document.getElementById('restart');

game.roadPoints = [
    {x:0, y:200},
    {x:150, y:200},
    {x:150, y:80},
    {x:350, y:80},
    {x:350, y:320},
    {x:550, y:320},
    {x:550, y:180},
    {x:800, y:180}
]

// 判断坐标是否在道路上
function pointOnRoad(x, y) {
    for(let i=0; i<game.roadPoints.length-1; i++){
        let p1 = game.roadPoints[i], p2 = game.roadPoints[i+1];
        let minX = Math.min(p1.x, p2.x) - 12;
        let maxX = Math.max(p1.x, p2.x) + 12;
        let minY = Math.min(p1.y, p2.y) - 12;
        let maxY = Math.max(p1.y, p2.y) + 12;
        if(x >= minX && x <= maxX && y >= minY && y <= maxY) return true;
    }
    return false;
}

// 判断该坐标是否已有塔/陷阱（防重叠）
function hasBuildingAtPos(x, y, range=25) {
    for(let t of game.towers){
        let dx = Math.abs(t.x + 22 - x);
        let dy = Math.abs(t.y + 22 - y);
        if(dx < range && dy < range) return true;
    }
    for(let tr of game.traps){
        let dx = Math.abs(tr.x - x);
        let dy = Math.abs(tr.y - y);
        if(dx < range && dy < range) return true;
    }
    return false;
}

function drawRoad(){
    gameBox.querySelectorAll('.road').forEach(el=>el.remove());
    for(let i=0; i<game.roadPoints.length-1; i++){
        let p1 = game.roadPoints[i];
        let p2 = game.roadPoints[i+1];
        let road = document.createElement('div');
        road.className = 'road';
        if(p1.x === p2.x){
            road.style.left = p1.x + 'px';
            road.style.top = Math.min(p1.y,p2.y) + 'px';
            road.style.width = '20px';
            road.style.height = Math.abs(p2.y-p1.y)+'px';
        }else{
            road.style.left = Math.min(p1.x,p2.x) + 'px';
            road.style.top = p1.y + 'px';
            road.style.width = Math.abs(p2.x-p1.x)+'px';
            road.style.height = '20px';
        }
        gameBox.appendChild(road);
    }
}

// 普通炮塔配置（新增4座塔）
const towerConfig = {
    fire: {cost:50, damage:14, range:120, speed:800, name:'fire', icon:'🔥'},
    ice: {cost:40, damage:5, range:100, speed:1000, slow:0.4, name:'ice', icon:'❄️'},
    thunder: {cost:70, damage:8, range:130, speed:1200, aoe:true, name:'thunder', icon:'⚡'},
    poison: {cost:60, damage:4, range:110, speed:1400, poison:3, poisonTime:3000, name:'poison', icon:'☠️'},
    rock: {cost:55, damage:9, range:105, speed:1600, stun:0.8, name:'rock', icon:'🪨'},
    laser: {cost:90, damage:20, range:150, speed:2200, armorBreak:true, name:'laser', icon:'🔴'},
    wind: {cost:65, damage:6, range:115, speed:1100, knockback:true, name:'wind', icon:'🌪️'},
    arrow: {cost:45, damage:7, range:140, speed:600, crit:2.2, critRate:0.35, name:'arrow', icon:'🏹'},
    lava: {cost:75, damage:5, range:100, speed:1300, burn:2.5, burnTime:2500, name:'lava', icon:'🌋'},
    electro: {cost:85, damage:10, range:135, speed:1500, chain:3, name:'electro', icon:'⚡️'}
}

// 道路陷阱配置
const trapConfig = {
    spike: {cost:30, damage:2, tickSpeed:400, name:'spikeTrap', icon:'🔺'},
    mud: {cost:25, slowRate:0.3, tickSpeed:500, name:'mudTrap', icon:'〰️'}
}

// 按钮绑定
document.getElementById('fireBtn').onclick = ()=> {game.selectedTower='fire';game.selectedTrap=null;game.selectedShovel=false};
document.getElementById('iceBtn').onclick = ()=> {game.selectedTower='ice';game.selectedTrap=null;game.selectedShovel=false};
document.getElementById('thunderBtn').onclick = ()=> {game.selectedTower='thunder';game.selectedTrap=null;game.selectedShovel=false};
document.getElementById('poisonBtn').onclick = ()=> {game.selectedTower='poison';game.selectedTrap=null;game.selectedShovel=false};
document.getElementById('rockBtn').onclick = ()=> {game.selectedTower='rock';game.selectedTrap=null;game.selectedShovel=false};
document.getElementById('laserBtn').onclick = ()=> {game.selectedTower='laser';game.selectedTrap=null;game.selectedShovel=false};
document.getElementById('windBtn').onclick = ()=> {game.selectedTower='wind';game.selectedTrap=null;game.selectedShovel=false};
document.getElementById('arrowBtn').onclick = ()=> {game.selectedTower='arrow';game.selectedTrap=null;game.selectedShovel=false};
document.getElementById('lavaBtn').onclick = ()=> {game.selectedTower='lava';game.selectedTrap=null;game.selectedShovel=false};
document.getElementById('electroBtn').onclick = ()=> {game.selectedTower='electro';game.selectedTrap=null;game.selectedShovel=false};
document.getElementById('spikeBtn').onclick = ()=> {game.selectedTrap='spike';game.selectedTower=null;game.selectedShovel=false};
document.getElementById('mudBtn').onclick = ()=> {game.selectedTrap='mud';game.selectedTower=null;game.selectedShovel=false};
document.getElementById('shovelBtn').onclick = ()=> {game.selectedShovel=true;game.selectedTower=null;game.selectedTrap=null};

gameBox.onclick = (e)=>{
    if(game.isGameOver) return;
    const rect = gameBox.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;
    const onRoad = pointOnRoad(clickX,clickY);

    // 铲子出售模式
    if(game.selectedShovel){
        for(let i=game.towers.length-1; i>=0; i--){
            let t = game.towers[i];
            let tCenterX = t.x + 22;
            let tCenterY = t.y + 22;
            let dist = Math.sqrt((clickX-tCenterX)**2 + (clickY-tCenterY)**2);
            if(dist < 25){
                let refund = Math.floor(t.cost * 0.5);
                game.gold += refund;
                t.dom.remove();
                game.towers.splice(i,1);
                updateUI();
                alert(`出售成功，返还${refund}金币`);
                return;
            }
        }
        for(let i=game.traps.length-1; i>=0; i--){
            let tr = game.traps[i];
            let dist = Math.sqrt((clickX-tr.x)**2 + (clickY-tr.y)**2);
            if(dist < 22){
                let refund = Math.floor(tr.cost * 0.5);
                game.gold += refund;
                tr.dom.remove();
                game.traps.splice(i,1);
                updateUI();
                alert(`出售成功，返还${refund}金币`);
                return;
            }
        }
        alert("没有选中可出售的建筑！");
        return;
    }

    // 放置草地塔
    if(game.selectedTower){
        if(onRoad){
            alert('元素塔不能放在道路上！请点绿色草地');
            return;
        }
        if(hasBuildingAtPos(clickX, clickY, 28)){
            alert('此处已有防御建筑，不可重叠放置！');
            return;
        }
        const cfg = towerConfig[game.selectedTower];
        if(game.gold < cfg.cost){
            alert('金币不足！');
            return;
        }
        let tX = clickX - 22;
        let tY = clickY - 22;
        let towerDom = document.createElement('div');
        towerDom.className = `tower ${cfg.name}`;
        towerDom.style.left = tX + 'px';
        towerDom.style.top = tY + 'px';
        towerDom.innerHTML = cfg.icon;
        gameBox.appendChild(towerDom);
        game.towers.push({
            x:tX, y:tY, dom: towerDom, type: game.selectedTower,
            ...cfg, lastAttack:0
        })
        game.gold -= cfg.cost;
        updateUI();
    }

    // 放置道路陷阱
    if(game.selectedTrap){
        if(!onRoad){
            alert('陷阱只能放置在棕色道路上！');
            return;
        }
        if(hasBuildingAtPos(clickX, clickY, 22)){
            alert('此处已有陷阱，不可重叠放置！');
            return;
        }
        const cfg = trapConfig[game.selectedTrap];
        if(game.gold < cfg.cost){
            alert('金币不足！');
            return;
        }
        let tX = clickX - 18;
        let tY = clickY - 18;
        let trapDom = document.createElement('div');
        trapDom.className = `trap ${cfg.name}`;
        trapDom.style.left = tX + 'px';
        trapDom.style.top = tY + 'px';
        trapDom.innerHTML = cfg.icon;
        gameBox.appendChild(trapDom);
        game.traps.push({
            x:clickX, y:clickY, dom: trapDom, type: game.selectedTrap,
            ...cfg, lastTick:0
        })
        game.gold -= cfg.cost;
        updateUI();
    }
}

// 敌人配置
const enemyConfig = {
    normal: {hp:35, speed:1, gold:8, size:34, cls:'normal', icon:'👹', armor:0},
    heavy: {hp:90, speed:0.55, gold:18, size:44, cls:'heavy', icon:'🛡️', armor:0.35},
    fast: {hp:22, speed:2, gold:12, size:34, cls:'fast', icon:'💨', armor:0},
    boss: {hp:250, speed:0.45, gold:60, size:54, cls:'boss', icon:'👿', armor:0.4},
    swarm: {hp:12, speed:1.6, gold:5, size:24, cls:'swarm', icon:'🐜', armor:0},
    shield: {hp:60, speed:0.85, gold:22, size:38, cls:'shield', icon:'🔷', armor:0.5}
}

function spawnEnemy(){
    if(game.isGameOver) return;
    let pool = ['normal','normal','heavy','fast','swarm','swarm','shield'];
    if(game.wave >= 3) pool.push('boss');
    let type = pool[Math.floor(Math.random()*pool.length)];
    let cfg = enemyConfig[type];
    let enemyDom = document.createElement('div');
    enemyDom.className = `enemy ${cfg.cls}`;
    enemyDom.style.left = game.roadPoints[0].x + 'px';
    enemyDom.style.top = game.roadPoints[0].y + 'px';
    enemyDom.innerHTML = cfg.icon;

    let hpBar = document.createElement('div');
    hpBar.className = 'hpBar';
    let hpFill = document.createElement('div');
    hpFill.className = 'hpFill';
    hpBar.appendChild(hpFill);
    enemyDom.appendChild(hpBar);

    gameBox.appendChild(enemyDom);
    let enemy = {
        dom: enemyDom,
        hpFill: hpFill,
        type, hp: cfg.hp, maxHp: cfg.hp, speed: cfg.speed, gold: cfg.gold,
        pointIndex:0, x:game.roadPoints[0].x, y:game.roadPoints[0].y,
        slowRate:1, stunTime:0, poisonTime:0, poisonDmg:0, armor: cfg.armor,
        burnTime:0, burnDmg:0
    }
    game.enemies.push(enemy);
}

function updateUI(){
    goldText.innerText = game.gold;
    hpText.innerText = game.baseHp;
    waveText.innerText = game.wave;
    killsText.innerText = game.kills;
}

function updateHpBar(enemy){
    let percent = Math.max(0, enemy.hp / enemy.maxHp) * 100;
    enemy.hpFill.style.width = percent + '%';
}

function towerAttack(tower, now){
    if(now - tower.lastAttack < tower.speed) return;
    let target = null;
    let minDist = tower.range;
    for(let e of game.enemies){
        let dx = e.x - tower.x;
        let dy = e.y - tower.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < minDist){
            minDist = dist;
            target = e;
        }
    }
    if(!target) return;
    tower.lastAttack = now;
    let bulletDom = document.createElement('div');
    bulletDom.className = `bullet ${tower.name}Bullet`;
    bulletDom.style.left = tower.x+17 + 'px';
    bulletDom.style.top = tower.y+17 + 'px';
    gameBox.appendChild(bulletDom);
    game.bullets.push({
        dom: bulletDom, x: tower.x+17, y: tower.y+17,
        target, tower, speed:7
    })
}

// 陷阱持续作用
function trapTick(trap, now) {
    if(now - trap.lastTick < trap.tickSpeed) return;
    trap.lastTick = now;
    for(let e of game.enemies){
        let dx = e.x - trap.x;
        let dy = e.y - trap.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 30){
            if(trap.type === 'spike'){
                let dmg = trap.damage;
                if(e.armor) dmg *= (1 - e.armor);
                e.hp -= dmg;
                updateHpBar(e);
                if(e.hp <= 0){
                    game.gold += e.gold;
                    game.kills++;
                    e.dom.remove();
                    game.enemies.splice(game.enemies.indexOf(e),1);
                    updateUI();
                }
            }
            if(trap.type === 'mud'){
                e.slowRate = trap.slowRate;
            }
        }
    }
}

function applyEffect(enemy, type, duration){
    let effectDom = document.createElement('div');
    if(type === 'slow') effectDom.className = 'slowEffect';
    else if(type === 'poison') effectDom.className = 'poisonEffect';
    else if(type === 'burn') effectDom.className = 'burnEffect';
    effectDom.style.left = enemy.x + 'px';
    effectDom.style.top = enemy.y + 'px';
    gameBox.appendChild(effectDom);
    game.effects.push({dom:effectDom, timer:duration, target:enemy});
}

function updateBullets(){
    for(let i=game.bullets.length-1; i>=0; i--){
        let b = game.bullets[i];
        let t = b.target;
        if(!game.enemies.includes(t)){
            b.dom.remove();
            game.bullets.splice(i,1);
            continue;
        }
        let dx = t.x - b.x;
        let dy = t.y - b.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 14){
            let damage = b.tower.damage;

            // 箭塔暴击计算
            if(b.tower.crit && Math.random() < b.tower.critRate){
                damage *= b.tower.crit;
            }
            // 护甲减免
            if(t.armor && !b.tower.armorBreak){
                damage *= (1 - t.armor);
            }
            if(b.tower.armorBreak){
                t.armor = Math.max(0, t.armor - 0.15);
            }

            t.hp -= damage;
            updateHpBar(t);

            // 风塔击退
            if(b.tower.knockback){
                let backX = (t.x - b.x) * 0.4;
                let backY = (t.y - b.y) * 0.4;
                t.x += backX;
                t.y += backY;
            }
            // 冰塔减速
            if(b.tower.slow){
                t.slowRate = b.tower.slow;
                applyEffect(t, 'slow', 600);
            }
            // 石塔击晕
            if(b.tower.stun){
                t.stunTime = b.tower.stun * 1000;
            }
            // 毒塔持续毒伤
            if(b.tower.poison){
                t.poisonTime = b.tower.poisonTime;
                t.poisonDmg = b.tower.poison;
                applyEffect(t, 'poison', b.tower.poisonTime);
            }
            // 熔岩灼烧
            if(b.tower.burn){
                t.burnTime = b.tower.burnTime;
                t.burnDmg = b.tower.burn;
                applyEffect(t, 'burn', b.tower.burnTime);
            }
            // 雷电AOE
            if(b.tower.aoe){
                game.enemies.forEach(e=>{
                    if(e !== t){
                        let edx = e.x - t.x;
                        let edy = e.y - t.y;
                        if(Math.sqrt(edx*edx+edy*edy) < 65){
                            let aoeDmg = b.tower.damage/2;
                            if(e.armor) aoeDmg *= (1 - e.armor);
                            e.hp -= aoeDmg;
                            updateHpBar(e);
                        }
                    }
                })
            }
            // 电磁连锁电击
            if(b.tower.chain){
                let hitList = [t];
                let last = t;
                for(let c=0; c < b.tower.chain; c++){
                    let near = null;
                    let minD = 80;
                    for(let e of game.enemies){
                        if(hitList.includes(e)) continue;
                        let edx = e.x - last.x;
                        let edy = e.y - last.y;
                        let d = Math.sqrt(edx*edx+edy*edy);
                        if(d < minD){
                            minD = d;
                            near = e;
                        }
                    }
                    if(!near) break;
                    let chainDmg = b.tower.damage * 0.6;
                    if(near.armor) chainDmg *= (1 - near.armor);
                    near.hp -= chainDmg;
                    updateHpBar(near);
                    hitList.push(near);
                    last = near;
                }
            }

            b.dom.remove();
            game.bullets.splice(i,1);
            if(t.hp <= 0){
                game.gold += t.gold;
                game.kills++;
                t.dom.remove();
                game.enemies.splice(game.enemies.indexOf(t),1);
                updateUI();
            }
        }else{
            b.x += (dx/dist)*b.speed;
            b.y += (dy/dist)*b.speed;
            b.dom.style.left = b.x + 'px';
            b.dom.style.top = b.y + 'px';
        }
    }
}

function updateEnemies(delta){
    for(let i=game.enemies.length-1; i>=0; i--){
        let e = game.enemies[i];

        // 毒素伤害
        if(e.poisonTime > 0){
            e.poisonTime -= delta;
            e.hp -= e.poisonDmg * (delta / 1000);
            updateHpBar(e);
            if(e.hp <= 0){
                game.gold += e.gold;
                game.kills++;
                e.dom.remove();
                game.enemies.splice(i,1);
                updateUI();
                continue;
            }
        }
        // 熔岩灼烧
        if(e.burnTime > 0){
            e.burnTime -= delta;
            e.hp -= e.burnDmg * (delta / 1000);
            updateHpBar(e);
            if(e.hp <= 0){
                game.gold += e.gold;
                game.kills++;
                e.dom.remove();
                game.enemies.splice(game.enemies.indexOf(e),1);
                updateUI();
                continue;
            }
        }

        if(e.stunTime > 0){
            e.stunTime -= delta;
            continue;
        }

        let targetPoint = game.roadPoints[e.pointIndex+1];
        if(!targetPoint){
            game.baseHp--;
            e.dom.remove();
            game.enemies.splice(i,1);
            updateUI();
            if(game.baseHp <= 0) gameOver();
            continue;
        }
        let dx = targetPoint.x - e.x;
        let dy = targetPoint.y - e.y;
        let spd = e.speed * e.slowRate;
        e.slowRate = Math.min(1, e.slowRate + 0.002);
        e.x += dx > 0 ? spd : dx < 0 ? -spd : 0;
        e.y += dy > 0 ? spd : dy < 0 ? -spd : 0;
        e.dom.style.left = e.x + 'px';
        e.dom.style.top = e.y + 'px';
        if(Math.abs(e.x-targetPoint.x)<5 && Math.abs(e.y-targetPoint.y)<5){
            e.pointIndex++;
        }
    }
}

function updateEffects(delta){
    for(let i=game.effects.length-1; i>=0; i--){
        let e = game.effects[i];
        e.timer -= delta;
        if(e.timer <= 0){
            e.dom.remove();
            game.effects.splice(i,1);
        }
    }
}

let lastTime = performance.now();
function loop(timestamp){
    if(game.isGameOver) return;
    let delta = timestamp - lastTime;
    lastTime = timestamp;
    game.towers.forEach(t=> towerAttack(t, timestamp));
    game.traps.forEach(tr=> trapTick(tr, timestamp));
    updateBullets();
    updateEnemies(delta);
    updateEffects(delta);
    game.gameLoop = requestAnimationFrame(loop);
}

function gameOver(){
    game.isGameOver = true;
    cancelAnimationFrame(game.gameLoop);
    clearInterval(game.spawnTimer);
    gameOverDom.style.display = 'flex';
}

function resetGame(){
    gameBox.querySelectorAll('.tower,.trap,.enemy,.bullet,.road,.slowEffect,.poisonEffect,.burnEffect').forEach(el=>el.remove());
    game.gold = 200;
    game.baseHp = 20;
    game.wave = 1;
    game.kills = 0;
    game.selectedTower = null;
    game.selectedTrap = null;
    game.selectedShovel = false;
    game.towers = [];
    game.traps = [];
    game.enemies = [];
    game.bullets = [];
    game.effects = [];
    game.isGameOver = false;
    gameOverDom.style.display = 'none';
    drawRoad();
    updateUI();
    startWave();
    lastTime = performance.now();
    game.gameLoop = requestAnimationFrame(loop);
}

function startWave(){
    clearInterval(game.spawnTimer);
    let spawnCount = 0;
    let maxSpawn = 12 + game.wave * 2;
    game.spawnTimer = setInterval(()=>{
        spawnEnemy();
        spawnCount++;
        if(spawnCount >= maxSpawn){
            clearInterval(game.spawnTimer);
            setTimeout(()=>{
                game.wave++;
                updateUI();
                startWave();
            }, 3000)
        }
    }, Math.max(600, 1200 - game.wave * 80))
}

restartBtn.onclick = resetGame;

drawRoad();
updateUI();
startWave();
lastTime = performance.now();
game.gameLoop = requestAnimationFrame(loop);
</script>
