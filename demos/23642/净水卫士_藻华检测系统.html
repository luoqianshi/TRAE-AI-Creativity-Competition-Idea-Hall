<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>净水卫士 - 藻华智能检测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Han Sans CN', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1E3A5F 0%, #00A8E8 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #00C896;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 18px;
            color: #fff;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            animation: fadeIn 1s ease-out;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .upload-section {
            border: 3px dashed #00A8E8;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 168, 232, 0.1);
        }

        .upload-section:hover {
            border-color: #00C896;
            background: rgba(0, 200, 150, 0.2);
        }

        .upload-icon {
            font-size: 60px;
            color: #00A8E8;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 20px;
            color: #1E3A5F;
            font-weight: bold;
        }

        .upload-hint {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .image-preview {
            margin-top: 20px;
            max-width: 100%;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .image-preview img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .controls-section {
            margin-top: 30px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            font-size: 16px;
            color: #1E3A5F;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00A8E8;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #00C896;
        }

        .slider-value {
            font-size: 14px;
            color: #1E3A5F;
            font-weight: bold;
            min-width: 40px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            margin: 10px 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00A8E8 0%, #00C896 100%);
            color: #fff;
            box-shadow: 0 5px 15px rgba(0, 168, 232, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 168, 232, 0.6);
        }

        .btn-secondary {
            background: #1E3A5F;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #00A8E8;
        }

        .btn-danger {
            background: #FF4757;
            color: #fff;
        }

        .btn-danger:hover {
            background: #ff6b7a;
        }

        .result-section {
            display: none;
        }

        .result-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .result-image-container {
            border-radius: 10px;
            overflow: hidden;
            background: #f5f5f5;
            padding: 10px;
        }

        .result-image-label {
            font-size: 16px;
            color: #1E3A5F;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .result-image-container img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .statistics-card {
            background: linear-gradient(135deg, #00C896 0%, #00A8E8 100%);
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .statistics-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .statistics-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .statistics-value {
            font-weight: bold;
            color: #fff;
        }

        .download-section {
            margin-top: 30px;
            text-align: center;
        }

        .progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .progress-content {
            text-align: center;
            color: #fff;
        }

        .progress-spinner {
            width: 100px;
            height: 100px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #00C896;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .progress-text {
            font-size: 24px;
            font-weight: bold;
        }

        .water-effect {
            position: relative;
            overflow: hidden;
        }

        .water-effect::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 168, 232, 0.3) 0%, transparent 70%);
            animation: waterWave 3s ease-in-out infinite;
            opacity: 0.5;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes waterWave {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(-10px, -10px);
            }
        }

        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltip-text {
            visibility: hidden;
            width: 200px;
            background-color: #1E3A5F;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 14px;
        }

        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .preset-btn {
            padding: 8px 15px;
            border: 2px solid #00A8E8;
            border-radius: 5px;
            background: transparent;
            color: #00A8E8;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            background: #00A8E8;
            color: #fff;
        }

        .preset-btn.active {
            background: #00A8E8;
            color: #fff;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 32px;
            }

            .result-images {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="water-effect">
            <h1>净水卫士</h1>
            <div class="subtitle">基于RGB无人机图像的藻华智能检测系统</div>
        </header>

        <div class="main-content">
            <div class="card">
                <div class="upload-section" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">点击或拖拽上传无人机RGB图像</div>
                    <div class="upload-hint">支持 JPG、PNG、BMP 格式，最大 50MB</div>
                    <input type="file" id="imageInput" accept="image/*">
                </div>

                <div class="image-preview" id="imagePreview">
                    <img id="originalImage" alt="原始图像">
                </div>

                <div class="controls-section" id="controlsSection" style="display: none;">
                    <h3 style="color: #1E3A5F; margin-bottom: 20px; font-size: 20px;">参数调节</h3>

                    <div class="preset-buttons">
                        <button class="preset-btn active" onclick="applyPreset('default')">默认参数</button>
                        <button class="preset-btn" onclick="applyPreset('light')">轻度藻华</button>
                        <button class="preset-btn" onclick="applyPreset('heavy')">重度藻华</button>
                        <button class="preset-btn" onclick="applyPreset('fine')">精细检测</button>
                    </div>

                    <div class="control-group">
                        <label class="control-label">H 最小值 (色调下限)</label>
                        <div class="slider-container">
                            <input type="range" id="hMin" min="0" max="179" value="42">
                            <span class="slider-value" id="hMinValue">42</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">H 最大值 (色调上限)</label>
                        <div class="slider-container">
                            <input type="range" id="hMax" min="0" max="179" value="90">
                            <span class="slider-value" id="hMaxValue">90</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">S 最小值 (饱和度下限)</label>
                        <div class="slider-container">
                            <input type="range" id="sMin" min="0" max="255" value="90">
                            <span class="slider-value" id="sMinValue">90</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">S 最大值 (饱和度上限)</label>
                        <div class="slider-container">
                            <input type="range" id="sMax" min="0" max="255" value="255">
                            <span class="slider-value" id="sMaxValue">255</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">V 最小值 (亮度下限)</label>
                        <div class="slider-container">
                            <input type="range" id="vMin" min="0" max="255" value="60">
                            <span class="slider-value" id="vMinValue">60</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">V 最大值 (亮度上限)</label>
                        <div class="slider-container">
                            <input type="range" id="vMax" min="0" max="255" value="255">
                            <span class="slider-value" id="vMaxValue">255</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">G 最小值 (抓取丝纹)</label>
                        <div class="slider-container tooltip">
                            <input type="range" id="gMin" min="0" max="255" value="15">
                            <span class="slider-value" id="gMinValue">15</span>
                            <span class="tooltip-text">用于抓取与背景反差强的细丝和纹理，值越小抓得越多</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">G 最大值 (保团块)</label>
                        <div class="slider-container tooltip">
                            <input type="range" id="gMax" min="0" max="255" value="180">
                            <span class="slider-value" id="gMaxValue">180</span>
                            <span class="tooltip-text">用于兜底保留绝对浓度极高的大团块，防止中心空洞</span>
                        </div>
                    </div>

                    <div style="text-align: center; margin-top: 30px;">
                        <button class="btn btn-primary" onclick="startDetection()">开始检测</button>
                        <button class="btn btn-secondary" onclick="resetParams()">重置参数</button>
                    </div>
                </div>
            </div>

            <div class="card result-section" id="resultSection">
                <h3 style="color: #1E3A5F; margin-bottom: 20px; font-size: 20px;">检测结果</h3>

                <div class="result-images">
                    <div class="result-image-container">
                        <div class="result-image-label">原始图像</div>
                        <img id="resultOriginal" alt="原始图像">
                    </div>
                    <div class="result-image-container">
                        <div class="result-image-label">藻华检测结果 (红色区域)</div>
                        <img id="resultMask" alt="分割结果">
                    </div>
                </div>

                <div class="statistics-card" id="statisticsCard">
                    <div class="statistics-title">检测统计数据</div>
                    <div class="statistics-item">
                        <span>藻华面积:</span>
                        <span class="statistics-value" id="algaeArea">-</span>
                    </div>
                    <div class="statistics-item">
                        <span>覆盖率:</span>
                        <span class="statistics-value" id="coverageRate">-</span>
                    </div>
                    <div class="statistics-item">
                        <span>水体面积:</span>
                        <span class="statistics-value" id="waterArea">-</span>
                    </div>
                    <div class="statistics-item">
                        <span>检测置信度:</span>
                        <span class="statistics-value" id="confidence">-</span>
                    </div>
                    <div class="statistics-item">
                        <span>处理耗时:</span>
                        <span class="statistics-value" id="processingTime">-</span>
                    </div>
                </div>

                <div class="download-section">
                    <button class="btn btn-primary" onclick="downloadMask()">下载分割掩膜</button>
                    <button class="btn btn-primary" onclick="downloadJSON()">下载JSON标注</button>
                    <button class="btn btn-secondary" onclick="downloadReport()">下载检测报告</button>
                    <button class="btn btn-danger" onclick="clearResults()">清除结果</button>
                </div>
            </div>
        </div>
    </div>

    <div class="progress-overlay" id="progressOverlay">
        <div class="progress-content">
            <div class="progress-spinner"></div>
            <div class="progress-text">正在检测藻华...</div>
        </div>
    </div>

    <script>
        let originalImageData = null;
        let resultImageData = null;
        let currentMask = null;
        let contours = [];
        let imageWidth = 0;
        let imageHeight = 0;
        let fileName = '';

        // 上传区域事件
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');

        uploadArea.addEventListener('click', () => imageInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#00C896';
            uploadArea.style.background = 'rgba(0, 200, 150, 0.3)';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#00A8E8';
            uploadArea.style.background = 'rgba(0, 168, 232, 0.1)';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImageUpload(file);
            }
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleImageUpload(file);
            }
        });

        // 处理图片上传
        function handleImageUpload(file) {
            fileName = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    // 限制最大尺寸
                    const maxSize = 2048;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxSize || height > maxSize) {
                        if (width > height) {
                            height = Math.round(height * maxSize / width);
                            width = maxSize;
                        } else {
                            width = Math.round(width * maxSize / height);
                            height = maxSize;
                        }
                    }

                    imageWidth = width;
                    imageHeight = height;

                    // 创建canvas获取图像数据
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    originalImageData = ctx.getImageData(0, 0, width, height);

                    // 显示预览
                    document.getElementById('originalImage').src = e.target.result;
                    document.getElementById('imagePreview').style.display = 'block';
                    document.getElementById('controlsSection').style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 滑块值更新
        const sliders = ['hMin', 'hMax', 'sMin', 'sMax', 'vMin', 'vMax', 'gMin', 'gMax'];
        sliders.forEach(id => {
            const slider = document.getElementById(id);
            const valueSpan = document.getElementById(id + 'Value');
            slider.addEventListener('input', () => {
                valueSpan.textContent = slider.value;
            });
        });

        // 预设参数
        function applyPreset(preset) {
            const presets = {
                default: { hMin: 42, hMax: 90, sMin: 90, sMax: 255, vMin: 60, vMax: 255, gMin: 15, gMax: 180 },
                light: { hMin: 35, hMax: 95, sMin: 70, sMax: 255, vMin: 50, vMax: 255, gMin: 10, gMax: 200 },
                heavy: { hMin: 45, hMax: 85, sMin: 100, sMax: 255, vMin: 70, vMax: 255, gMin: 20, gMax: 150 },
                fine: { hMin: 40, hMax: 92, sMin: 85, sMax: 255, vMin: 55, vMax: 255, gMin: 12, gMax: 190 }
            };

            const params = presets[preset];
            Object.keys(params).forEach(key => {
                const slider = document.getElementById(key);
                const valueSpan = document.getElementById(key + 'Value');
                slider.value = params[key];
                valueSpan.textContent = params[key];
            });

            // 更新按钮状态
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // 重置参数
        function resetParams() {
            applyPreset('default');
        }

        // 开始检测
        function startDetection() {
            if (!originalImageData) {
                alert('请先上传图片！');
                return;
            }

            document.getElementById('progressOverlay').style.display = 'flex';

            setTimeout(() => {
                const startTime = Date.now();

                // 获取参数
                const params = {
                    hMin: parseInt(document.getElementById('hMin').value),
                    hMax: parseInt(document.getElementById('hMax').value),
                    sMin: parseInt(document.getElementById('sMin').value),
                    sMax: parseInt(document.getElementById('sMax').value),
                    vMin: parseInt(document.getElementById('vMin').value),
                    vMax: parseInt(document.getElementById('vMax').value),
                    gMin: parseInt(document.getElementById('gMin').value),
                    gMax: parseInt(document.getElementById('gMax').value)
                };

                // 执行分割算法
                const result = performSegmentation(originalImageData, params);
                currentMask = result.mask;
                contours = result.contours;

                // 计算统计数据
                const stats = calculateStatistics(currentMask);

                // 显示结果
                displayResults(originalImageData, currentMask, stats, Date.now() - startTime);

                document.getElementById('progressOverlay').style.display = 'none';
            }, 100);
        }

        // 藻华分割算法
        function performSegmentation(imageData, params) {
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;

            // 创建输出canvas
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const outputData = ctx.createImageData(width, height);

            // HSV转换和超绿指数计算
            const hsvData = new Float32Array(width * height * 3);
            const exgData = new Float32Array(width * height);

            for (let i = 0; i < width * height; i++) {
                const idx = i * 4;
                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];

                // RGB to HSV
                const rNorm = r / 255;
                const gNorm = g / 255;
                const bNorm = b / 255;

                const max = Math.max(rNorm, gNorm, bNorm);
                const min = Math.min(rNorm, gNorm, bNorm);
                const diff = max - min;

                let h = 0;
                let s = max === 0 ? 0 : diff / max;
                let v = max;

                if (diff !== 0) {
                    if (max === rNorm) {
                        h = 60 * (((gNorm - bNorm) / diff) % 6);
                    } else if (max === gNorm) {
                        h = 60 * ((bNorm - rNorm) / diff + 2);
                    } else {
                        h = 60 * ((rNorm - gNorm) / diff + 4);
                    }
                }

                if (h < 0) h += 360;
                h = h / 2; // 转换到0-179范围

                hsvData[i * 3] = h;
                hsvData[i * 3 + 1] = s * 255;
                hsvData[i * 3 + 2] = v * 255;

                // 超绿指数 ExG = 2G - R - B
                exgData[i] = 2 * g - r - b;
            }

            // 动态底色差分 - 使用均值模糊模拟
            const blurRadius = 75;
            const blurredExg = blurArray(exgData, width, height, blurRadius);
            const localDiff = new Float32Array(width * height);

            for (let i = 0; i < width * height; i++) {
                localDiff[i] = exgData[i] - blurredExg[i];
            }

            // 创建掩膜
            const mask = new Uint8Array(width * height);

            for (let i = 0; i < width * height; i++) {
                const h = hsvData[i * 3];
                const s = hsvData[i * 3 + 1];
                const v = hsvData[i * 3 + 2];
                const exg = exgData[i];
                const diff = localDiff[i];

                // HSV阈值检查
                const hsvValid = h >= params.hMin && h <= params.hMax &&
                                 s >= params.sMin && s <= params.sMax &&
                                 v >= params.vMin && v <= params.vMax;

                // 双通道特征提取
                const localVeins = diff >= params.gMin;
                const absoluteBlobs = exg >= params.gMax;

                // 智能融合
                mask[i] = hsvValid && (localVeins || absoluteBlobs) ? 255 : 0;
            }

            // NDWI水体识别
            const waterMask = new Uint8Array(width * height);
            for (let i = 0; i < width * height; i++) {
                const idx = i * 4;
                const g = data[idx + 1];
                const r = data[idx];
                const ndwi = (g - r) / (g + r + 1e-6);
                waterMask[i] = ndwi > 0 ? 255 : 0;
            }

            // 合并掩膜 - 只保留水体中的藻华
            for (let i = 0; i < width * height; i++) {
                mask[i] = mask[i] && waterMask[i] ? 255 : 0;
            }

            // 形态学处理 - 开运算去噪
            morphologyOpen(mask, width, height, 3);

            // 形态学处理 - 闭运算填充空洞
            morphologyClose(mask, width, height, 25);

            // 连通域分析 - 过滤小区域
            const filteredMask = filterConnectedComponents(mask, width, height, 500);

            // 提取轮廓
            const contours = extractContours(filteredMask, width, height);

            // 创建可视化结果
            for (let i = 0; i < width * height; i++) {
                const idx = i * 4;
                outputData.data[idx] = data[idx];
                outputData.data[idx + 1] = data[idx + 1];
                outputData.data[idx + 2] = data[idx + 2];
                outputData.data[idx + 3] = 255;

                if (filteredMask[i] > 0) {
                    // 红色半透明叠加
                    outputData.data[idx] = Math.min(255, data[idx] * 0.55 + 255 * 0.45);
                    outputData.data[idx + 1] = data[idx + 1] * 0.55;
                    outputData.data[idx + 2] = data[idx + 2] * 0.55;
                }
            }

            ctx.putImageData(outputData, 0, 0);

            return {
                mask: filteredMask,
                contours: contours,
                resultCanvas: canvas
            };
        }

        // 数组模糊
        function blurArray(arr, width, height, radius) {
            const result = new Float32Array(width * height);
            const kernelSize = radius * 2 + 1;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let sum = 0;
                    let count = 0;

                    for (let ky = -radius; ky <= radius; ky++) {
                        for (let kx = -radius; kx <= radius; kx++) {
                            const nx = Math.min(Math.max(x + kx, 0), width - 1);
                            const ny = Math.min(Math.max(y + ky, 0), height - 1);
                            sum += arr[ny * width + nx];
                            count++;
                        }
                    }

                    result[y * width + x] = sum / count;
                }
            }

            return result;
        }

        // 形态学开运算
        function morphologyOpen(mask, width, height, kernelSize) {
            // 先腐蚀
            const eroded = new Uint8Array(width * height);
            const half = kernelSize / 2;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let allWhite = true;
                    for (let ky = -half; ky <= half && allWhite; ky++) {
                        for (let kx = -half; kx <= half && allWhite; kx++) {
                            const nx = Math.min(Math.max(x + kx, 0), width - 1);
                            const ny = Math.min(Math.max(y + ky, 0), height - 1);
                            if (mask[ny * width + nx] === 0) {
                                allWhite = false;
                            }
                        }
                    }
                    eroded[y * width + x] = allWhite ? 255 : 0;
                }
            }

            // 再膨胀
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let hasWhite = false;
                    for (let ky = -half; ky <= half && !hasWhite; ky++) {
                        for (let kx = -half; kx <= half && !hasWhite; kx++) {
                            const nx = Math.min(Math.max(x + kx, 0), width - 1);
                            const ny = Math.min(Math.max(y + ky, 0), height - 1);
                            if (eroded[ny * width + nx] > 0) {
                                hasWhite = true;
                            }
                        }
                    }
                    mask[y * width + x] = hasWhite ? 255 : 0;
                }
            }
        }

        // 形态学闭运算
        function morphologyClose(mask, width, height, kernelSize) {
            // 先膨胀
            const dilated = new Uint8Array(width * height);
            const half = kernelSize / 2;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let hasWhite = false;
                    for (let ky = -half; ky <= half && !hasWhite; ky++) {
                        for (let kx = -half; kx <= half && !hasWhite; kx++) {
                            const nx = Math.min(Math.max(x + kx, 0), width - 1);
                            const ny = Math.min(Math.max(y + ky, 0), height - 1);
                            if (mask[ny * width + nx] > 0) {
                                hasWhite = true;
                            }
                        }
                    }
                    dilated[y * width + x] = hasWhite ? 255 : 0;
                }
            }

            // 再腐蚀
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let allWhite = true;
                    for (let ky = -half; ky <= half && allWhite; ky++) {
                        for (let kx = -half; kx <= half && allWhite; kx++) {
                            const nx = Math.min(Math.max(x + kx, 0), width - 1);
                            const ny = Math.min(Math.max(y + ky, 0), height - 1);
                            if (dilated[ny * width + nx] === 0) {
                                allWhite = false;
                            }
                        }
                    }
                    mask[y * width + x] = allWhite ? 255 : 0;
                }
            }
        }

        // 连通域分析
        function filterConnectedComponents(mask, width, height, minArea) {
            const labels = new Int32Array(width * height);
            let currentLabel = 0;
            const areas = new Map();

            // 简化的连通域标记
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (mask[y * width + x] > 0 && labels[y * width + x] === 0) {
                        currentLabel++;
                        let area = 0;

                        // BFS标记连通区域
                        const queue = [[x, y]];
                        while (queue.length > 0) {
                            const [cx, cy] = queue.shift();
                            if (cx < 0 || cx >= width || cy < 0 || cy >= height) continue;
                            if (mask[cy * width + cx] === 0) continue;
                            if (labels[cy * width + cx] !== 0) continue;

                            labels[cy * width + cx] = currentLabel;
                            area++;

                            queue.push([cx - 1, cy]);
                            queue.push([cx + 1, cy]);
                            queue.push([cx, cy - 1]);
                            queue.push([cx, cy + 1]);
                        }

                        areas.set(currentLabel, area);
                    }
                }
            }

            // 过滤小区域
            const result = new Uint8Array(width * height);
            for (let i = 0; i < width * height; i++) {
                const label = labels[i];
                if (label > 0 && areas.get(label) >= minArea) {
                    result[i] = 255;
                }
            }

            return result;
        }

        // 提取轮廓
        function extractContours(mask, width, height) {
            const contours = [];
            const visited = new Uint8Array(width * height);

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    if (mask[y * width + x] > 0 && !visited[y * width + x]) {
                        // 检查是否是边界点
                        const isBorder =
                            mask[(y - 1) * width + x] === 0 ||
                            mask[(y + 1) * width + x] === 0 ||
                            mask[y * width + (x - 1)] === 0 ||
                            mask[y * width + (x + 1)] === 0;

                        if (isBorder) {
                            const contour = traceContour(mask, visited, x, y, width, height);
                            if (contour.length >= 10) {
                                contours.push(contour);
                            }
                        }
                    }
                }
            }

            return contours;
        }

        // 轮廓追踪
        function traceContour(mask, visited, startX, startY, width, height) {
            const contour = [];
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            let x = startX;
            let y = startY;
            let dir = 0;

            do {
                contour.push([x, y]);
                visited[y * width + x] = 1;

                // 寻找下一个边界点
                let found = false;
                for (let i = 0; i < 4; i++) {
                    const newDir = (dir + i) % 4;
                    const nx = x + directions[newDir][0];
                    const ny = y + directions[newDir][1];

                    if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                        if (mask[ny * width + nx] > 0) {
                            const isBorder =
                                mask[Math.max(0, ny - 1) * width + nx] === 0 ||
                                mask[Math.min(height - 1, ny + 1) * width + nx] === 0 ||
                                mask[ny * width + Math.max(0, nx - 1)] === 0 ||
                                mask[ny * width + Math.min(width - 1, nx + 1)] === 0;

                            if (isBorder && !visited[ny * width + nx]) {
                                x = nx;
                                y = ny;
                                dir = newDir;
                                found = true;
                                break;
                            }
                        }
                    }
                }

                if (!found) break;
            } while (x !== startX || y !== startY);

            return contour;
        }

        // 计算统计数据
        function calculateStatistics(mask) {
            let algaePixels = 0;
            let waterPixels = 0;

            for (let i = 0; i < mask.length; i++) {
                if (mask[i] > 0) {
                    algaePixels++;
                }
            }

            // 假设整个图像都是水体区域（简化计算）
            waterPixels = imageWidth * imageHeight;

            const coverageRate = (algaePixels / waterPixels * 100).toFixed(2);
            const algaeArea = algaePixels; // 实际应用中需要根据分辨率转换为平方米

            // 简化的置信度计算
            const confidence = Math.min(95, 70 + coverageRate * 0.5).toFixed(1);

            return {
                algaeArea: algaeArea,
                coverageRate: coverageRate,
                waterArea: waterPixels,
                confidence: confidence
            };
        }

        // 显示结果
        function displayResults(originalData, mask, stats, processingTime) {
            // 创建原图canvas
            const originalCanvas = document.createElement('canvas');
            originalCanvas.width = imageWidth;
            originalCanvas.height = imageHeight;
            const originalCtx = originalCanvas.getContext('2d');
            originalCtx.putImageData(originalData, 0, 0);

            // 创建结果canvas
            const resultCanvas = document.createElement('canvas');
            resultCanvas.width = imageWidth;
            resultCanvas.height = imageHeight;
            const resultCtx = resultCanvas.getContext('2d');

            // 绘制原图
            resultCtx.drawImage(originalCanvas, 0, 0);

            // 创建红色半透明叠加层
            const overlayData = resultCtx.getImageData(0, 0, imageWidth, imageHeight);
            for (let i = 0; i < mask.length; i++) {
                if (mask[i] > 0) {
                    const idx = i * 4;
                    overlayData.data[idx] = Math.min(255, overlayData.data[idx] * 0.55 + 255 * 0.45);
                    overlayData.data[idx + 1] = overlayData.data[idx + 1] * 0.55;
                    overlayData.data[idx + 2] = overlayData.data[idx + 2] * 0.55;
                }
            }
            resultCtx.putImageData(overlayData, 0, 0);

            // 显示结果
            document.getElementById('resultOriginal').src = originalCanvas.toDataURL();
            document.getElementById('resultMask').src = resultCanvas.toDataURL();
            document.getElementById('resultSection').style.display = 'block';

            // 显示统计数据
            document.getElementById('algaeArea').textContent = stats.algaeArea + ' 像素';
            document.getElementById('coverageRate').textContent = stats.coverageRate + '%';
            document.getElementById('waterArea').textContent = stats.waterArea + ' 像素';
            document.getElementById('confidence').textContent = stats.confidence + '%';
            document.getElementById('processingTime').textContent = processingTime + ' ms';

            resultImageData = resultCtx.getImageData(0, 0, imageWidth, imageHeight);
        }

        // 下载分割掩膜
        function downloadMask() {
            if (!currentMask) {
                alert('没有可下载的掩膜数据！');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = imageWidth;
            canvas.height = imageHeight;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(imageWidth, imageHeight);

            for (let i = 0; i < currentMask.length; i++) {
                const idx = i * 4;
                imageData.data[idx] = currentMask[i];
                imageData.data[idx + 1] = currentMask[i];
                imageData.data[idx + 2] = currentMask[i];
                imageData.data[idx + 3] = 255;
            }

            ctx.putImageData(imageData, 0, 0);

            const link = document.createElement('a');
            link.download = fileName.replace(/\.[^/.]+$/, '') + '_mask.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // 下载JSON标注
        function downloadJSON() {
            if (!contours || contours.length === 0) {
                alert('没有可下载的标注数据！');
                return;
            }

            const shapes = contours.map(contour => {
                // 简化轮廓点
                const simplified = simplifyContour(contour, 0.002);
                return {
                    label: 'algae',
                    points: simplified,
                    group_id: null,
                    shape_type: 'polygon',
                    flags: {}
                };
            });

            const labelmeData = {
                version: '5.2.1',
                flags: {},
                shapes: shapes,
                imagePath: fileName,
                imageData: null,
                imageHeight: imageHeight,
                imageWidth: imageWidth
            };

            const blob = new Blob([JSON.stringify(labelmeData, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.download = fileName.replace(/\.[^/.]+$/, '') + '.json';
            link.href = URL.createObjectURL(blob);
            link.click();
        }

        // 简化轮廓
        function simplifyContour(contour, tolerance) {
            if (contour.length < 3) return contour;

            const maxDist = tolerance * calculateContourLength(contour);
            const simplified = [contour[0]];

            for (let i = 1; i < contour.length - 1; i++) {
                const prev = simplified[simplified.length - 1];
                const curr = contour[i];
                const dist = Math.sqrt(Math.pow(curr[0] - prev[0], 2) + Math.pow(curr[1] - prev[1], 2));

                if (dist > maxDist) {
                    simplified.push(curr);
                }
            }

            simplified.push(contour[contour.length - 1]);
            return simplified;
        }

        // 计算轮廓长度
        function calculateContourLength(contour) {
            let length = 0;
            for (let i = 1; i < contour.length; i++) {
                const dx = contour[i][0] - contour[i - 1][0];
                const dy = contour[i][1] - contour[i - 1][1];
                length += Math.sqrt(dx * dx + dy * dy);
            }
            return length;
        }

        // 下载检测报告
        function downloadReport() {
            const stats = {
                algaeArea: document.getElementById('algaeArea').textContent,
                coverageRate: document.getElementById('coverageRate').textContent,
                waterArea: document.getElementById('waterArea').textContent,
                confidence: document.getElementById('confidence').textContent,
                processingTime: document.getElementById('processingTime').textContent
            };

            const report = `
净水卫士藻华检测报告
====================

文件名: ${fileName}
检测时间: ${new Date().toLocaleString()}
图像尺寸: ${imageWidth} x ${imageHeight}

检测结果统计:
- 藻华面积: ${stats.algaeArea}
- 覆盖率: ${stats.coverageRate}
- 水体面积: ${stats.waterArea}
- 检测置信度: ${stats.confidence}
- 处理耗时: ${stats.processingTime}

检测参数:
- H范围: ${document.getElementById('hMin').value} - ${document.getElementById('hMax').value}
- S范围: ${document.getElementById('sMin').value} - ${document.getElementById('sMax').value}
- V范围: ${document.getElementById('vMin').value} - ${document.getElementById('vMax').value}
- G最小值: ${document.getElementById('gMin').value}
- G最大值: ${document.getElementById('gMax').value}

算法说明:
本系统采用"动态底色差分提取法"，完美解决"绿水绿背景里找高光绿藻"的问题。
核心算法包括：
1. HSV颜色空间转换
2. 超绿指数(ExG)计算
3. 动态底色差分
4. 双通道特征提取
5. NDWI水体识别
6. 连通域分析过滤
7. 形态学平滑处理

====================
净水卫士 - 保护水资源，守护生态环境
            `;

            const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.download = fileName.replace(/\.[^/.]+$/, '') + '_report.txt';
            link.href = URL.createObjectURL(blob);
            link.click();
        }

        // 清除结果
        function clearResults() {
            document.getElementById('resultSection').style.display = 'none';
            currentMask = null;
            contours = [];
            resultImageData = null;
        }
    </script>
