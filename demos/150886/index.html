<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>睦邻微报 - 社区AI便民报修平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7ff 100%);
            padding: 24px 16px;
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .header-box {
            background: linear-gradient(120deg, #1677ff, #4096ff);
            color: #fff;
            padding: 28px 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 8px 20px rgba(22, 119, 255, 0.2);
        }
        .header-box h1 {
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .header-box p {
            opacity: 0.9;
            font-size: 15px;
            line-height: 1.5;
        }
        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 19px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-item {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #4b5563;
            font-weight: 500;
            font-size: 15px;
        }
        input, textarea, select {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.25s ease;
            background-color: #fafcff;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #1677ff;
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.15);
        }
        textarea {
            min-height: 110px;
            resize: vertical;
            line-height: 1.6;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(120deg, #1677ff, #4096ff);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 6px;
        }
        .submit-btn:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(22, 119, 255, 0.25);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .ai-result-panel {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #e6f7ff, #f0f9ff);
            border-radius: 14px;
            border-left: 5px solid #1677ff;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ai-result-panel h4 {
            color: #1677ff;
            margin-bottom: 12px;
            font-size: 17px;
        }
        .ai-result-panel p {
            margin: 8px 0;
            color: #374151;
            font-size: 15px;
            line-height: 1.6;
        }
        .ticket-item {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            background: #fbfdff;
            transition: all 0.2s ease;
        }
        .ticket-item:hover {
            border-color: #1677ff;
            background: #ffffff;
        }
        .ticket-item p {
            margin: 6px 0;
            color: #374151;
            font-size: 14px;
        }
        .tag-urgent {
            display: inline-block;
            padding: 2px 8px;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 6px;
            font-weight: 500;
            font-size: 13px;
        }
        .tag-normal {
            display: inline-block;
            padding: 2px 8px;
            background: #dbeafe;
            color: #2563eb;
            border-radius: 6px;
            font-weight: 500;
            font-size: 13px;
        }
        .tips-text {
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            margin-top: 10px;
            padding-bottom: 20px;
        }
        .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
        .form-item.has-error input,
        .form-item.has-error select,
        .form-item.has-error textarea {
            border-color: #dc2626;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-input-wrapper .file-btn {
            display: block;
            width: 100%;
            padding: 13px 16px;
            border: 1px dashed #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            color: #6b7280;
            background-color: #fafcff;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .file-input-wrapper .file-btn:hover {
            border-color: #1677ff;
            color: #1677ff;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header-box">
        <h1>🏘️ 睦邻微报 · 社区AI报修</h1>
        <p>手机一键上报故障，AI自动分级派单，便民高效不跑腿</p>
    </div>

    <div class="card">
        <div class="card-title">📝 提交故障报修</div>
        <div class="form-item">
            <label>📍 楼栋房号 <span style="color: #dc2626;">*</span></label>
            <input type="text" id="roomInput" placeholder="例如：5栋3单元102室">
            <div class="error-msg" id="roomError">请填写楼栋房号</div>
        </div>
        <div class="form-item">
            <label>🔧 故障分类 <span style="color: #dc2626;">*</span></label>
            <select id="typeSelect">
                <option value="">请选择故障类型</option>
                <option value="水电">水电故障（漏水、停电、灯具损坏、水管爆裂）</option>
                <option value="公共设施">公共设施（电梯、楼道门、健身器材、扶手）</option>
                <option value="环境">环境卫生（垃圾堆积、绿化损坏、积水）</option>
                <option value="其他">其他社区问题</option>
            </select>
            <div class="error-msg" id="typeError">请选择故障类型</div>
        </div>
        <div class="form-item">
            <label>📄 故障详细描述 <span style="color: #dc2626;">*</span></label>
            <textarea id="descInput" placeholder="简单描述现场情况，方便维修人员快速判断"></textarea>
            <div class="error-msg" id="descError">请填写故障描述</div>
        </div>
        <div class="form-item">
            <label>📷 上传现场照片（可选）</label>
            <div class="file-input-wrapper">
                <div class="file-btn" id="fileBtn">点击选择照片或拖拽到此处</div>
                <input type="file" accept="image/*" id="photoInput">
            </div>
            <div id="photoPreview" style="margin-top: 10px;"></div>
        </div>
        <button class="submit-btn" id="submitBtn">🤖 AI智能识别并生成报修工单</button>

        <div class="ai-result-panel" id="aiPanel">
            <h4>AI智能分析工单结果</h4>
            <div id="aiContent"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📋 我的报修工单记录</div>
        <div id="ticketContainer">
            <div class="ticket-item">
                <p>工单编号：#0001</p>
                <p>故障：3栋楼道照明损坏</p>
                <p>紧急等级：<span class="tag-normal">一般故障</span></p>
                <p>处理状态：物业维修人员处理中</p>
            </div>
            <div class="ticket-item">
                <p>工单编号：#0002</p>
                <p>故障：1栋2单元水管漏水</p>
                <p>紧急等级：<span class="tag-urgent">紧急故障</span></p>
                <p>处理状态：已完成维修</p>
            </div>
        </div>
    </div>

    <p class="tips-text">本应用为轻量化网页工具，无需下载，浏览器直接打开使用</p>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const aiPanel = document.getElementById('aiPanel');
        const aiContent = document.getElementById('aiContent');
        const ticketBox = document.getElementById('ticketContainer');
        const roomInput = document.getElementById('roomInput');
        const typeSelect = document.getElementById('typeSelect');
        const descInput = document.getElementById('descInput');
        const photoInput = document.getElementById('photoInput');
        const photoPreview = document.getElementById('photoPreview');
        const fileBtn = document.getElementById('fileBtn');

        function showError(element, message) {
            element.parentElement.classList.add('has-error');
            const errorDiv = element.parentElement.querySelector('.error-msg');
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }
        }

        function hideError(element) {
            element.parentElement.classList.remove('has-error');
            const errorDiv = element.parentElement.querySelector('.error-msg');
            if (errorDiv) {
                errorDiv.style.display = 'none';
            }
        }

        function validateForm() {
            let isValid = true;
            
            if (!roomInput.value.trim()) {
                showError(roomInput, '请填写楼栋房号');
                isValid = false;
            } else {
                hideError(roomInput);
            }
            
            if (!typeSelect.value) {
                showError(typeSelect, '请选择故障类型');
                isValid = false;
            } else {
                hideError(typeSelect);
            }
            
            if (!descInput.value.trim()) {
                showError(descInput, '请填写故障描述');
                isValid = false;
            } else {
                hideError(descInput);
            }
            
            return isValid;
        }

        function generateTicketId() {
            const now = new Date();
            const year = now.getFullYear().toString().slice(-2);
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const random = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
            return `${year}${month}${day}${random}`;
        }

        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    photoPreview.innerHTML = `<img src="${event.target.result}" style="max-width: 200px; max-height: 150px; border-radius: 8px;">`;
                    fileBtn.textContent = `已选择：${file.name}`;
                };
                reader.readAsDataURL(file);
            } else {
                photoPreview.innerHTML = '';
                fileBtn.textContent = '点击选择照片或拖拽到此处';
            }
        });

        submitBtn.addEventListener('click', function() {
            if (!validateForm()) {
                return;
            }

            const room = roomInput.value.trim();
            const faultType = typeSelect.value;
            const desc = descInput.value.trim();
            const ticketId = generateTicketId();

            let levelStr, tagClass, sendTip;
            if (faultType === "水电") {
                levelStr = "紧急故障";
                tagClass = "tag-urgent";
                sendTip = "已自动加急派单至水电维修班组，1小时内响应";
            } else if (faultType === "公共设施") {
                levelStr = "一般故障";
                tagClass = "tag-normal";
                sendTip = "已分配物业维修人员，24小时内上门处理";
            } else if (faultType === "环境") {
                levelStr = "一般故障";
                tagClass = "tag-normal";
                sendTip = "已通知保洁人员处理，48小时内完成";
            } else {
                levelStr = "一般故障";
                tagClass = "tag-normal";
                sendTip = "已提交至物业，按流程安排处理";
            }

            aiPanel.style.display = "block";
            aiContent.innerHTML = `
                <p>📍 故障位置：${room}</p>
                <p>🔧 故障类别：${faultType}</p>
                <p>📄 故障描述：${desc}</p>
                <p>⚡ 紧急等级：<span class="${tagClass}">${levelStr}</span></p>
                <p>📤 派单提示：${sendTip}</p>
                <p>✅ 标准化报修工单已同步至物业后台</p>
                <p style="margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ccc; color: #6b7280; font-size: 13px;">工单编号：#${ticketId}</p>
            `;

            const newTicket = document.createElement('div');
            newTicket.className = "ticket-item";
            newTicket.innerHTML = `
                <p><strong>新工单（待接单）</strong></p>
                <p>工单编号：#${ticketId}</p>
                <p>故障位置：${room}</p>
                <p>故障类型：${faultType}</p>
                <p>紧急等级：<span class="${tagClass}">${levelStr}</span></p>
                <p>处理状态：物业待接单</p>
            `;
            ticketBox.prepend(newTicket);

            roomInput.value = '';
            typeSelect.value = '';
            descInput.value = '';
            photoInput.value = '';
            photoPreview.innerHTML = '';
            fileBtn.textContent = '点击选择照片或拖拽到此处';
        });
    </script>
</body>
</html>
