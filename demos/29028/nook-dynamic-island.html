        :root {

        .desktop { width: 100%; height: 100%; position: relative; overflow: hidden; }

        .wallpaper {

            background:
                radial-gradient(ellipse 120% 80% at 50% 55%, rgba(0,90,180,0.35) 0%, transparent 60%),

        }

        /* ===== 灵动岛 ===== */
        .island-wrapper {
            position: absolute;
            top: 16px; left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .dynamic-island {
            background: var(--glass);
            backdrop-filter: blur(50px) saturate(200%);
            -webkit-backdrop-filter: blur(50px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            height: 44px;
            width: 200px;
            position: relative;
            transition: all 0.55s cubic-bezier(0.32, 0.72, 0, 1);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            box-shadow:
                0 8px 40px rgba(0,0,0,0.6),
                0 2px 12px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .dynamic-island:hover {
            box-shadow:
                0 14px 50px rgba(0,0,0,0.7),
                0 4px 16px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        /* 灵动岛尺寸 - 适中尺寸，内容完整展示 */
        .dynamic-island.compact { width: 200px; height: 44px; border-radius: 24px; }
        .dynamic-island.music { width: 520px; height: 220px; border-radius: 32px; }
        .dynamic-island.notification { width: 480px; height: 150px; border-radius: 32px; }
        .dynamic-island.call { width: 440px; height: 240px; border-radius: 32px; }
        .dynamic-island.timer { width: 420px; height: 200px; border-radius: 32px; }
        .dynamic-island.system { width: 480px; height: 220px; border-radius: 32px; }
        .dynamic-island.weather { width: 500px; height: 280px; border-radius: 32px; }
        .dynamic-island.calendar { width: 480px; height: 380px; border-radius: 32px; }
        .dynamic-island.transfer { width: 480px; height: 200px; border-radius: 32px; }
        .dynamic-island.clipboard { width: 480px; height: 340px; border-radius: 32px; }
        .dynamic-island.volume { width: 400px; height: 160px; border-radius: 32px; }
        .dynamic-island.brightness { width: 400px; height: 160px; border-radius: 32px; }
        .dynamic-island.battery { width: 440px; height: 220px; border-radius: 32px; }
        .dynamic-island.airdrop { width: 440px; height: 240px; border-radius: 32px; }

        .island-layer {
            position: absolute; inset: 0;
            display: flex; align-items: center;
            padding: 0 18px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .island-layer.active { opacity: 1; pointer-events: auto; }

        /* ===== 紧凑模式 ===== */
        .compact-inner {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; gap: 10px;

        .compact-left { display: flex; align-items: center; gap: 10px; }

            width: 28px; height: 28px; border-radius: 8px;

            font-size: 15px; background: var(--win-accent); flex-shrink: 0;

        .compact-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--win-accent);
            animation: dotPulse 1.8s ease-in-out infinite;
        }
        .compact-dot:nth-child(2) { animation-delay: 0.3s; }
        .compact-dot:nth-child(3) { animation-delay: 0.6s; }
        @keyframes dotPulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

            min-width: 20px; height: 20px; border-radius: 10px;
            background: var(--danger); color: #fff;
            font-size: 11px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            padding: 0 6px;
        }

        /* ===== 展开模式通用 ===== */
        .expanded-layer { flex-direction: column; padding: 16px 20px; gap: 0; }
        .exp-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px; flex-shrink: 0;

        /* ===== 音乐播放器 ===== */
        .music-layout { display: flex; gap: 12px; align-items: flex-start; }
        .music-left { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .music-cover {
            width: 72px; height: 72px; border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;

            box-shadow: 0 4px 20px rgba(102,126,234,0.3);
            animation: spin 12s linear infinite;
            animation-play-state: paused;
            position: relative; overflow: hidden;
        }
        .music-cover.playing { animation-play-state: running; }
        .music-cover::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.1) 100%);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .music-visualizer {
            display: flex; align-items: flex-end; gap: 2px;
            height: 16px; width: 72px; justify-content: center;

        .viz-bar {
            width: 3px; background: var(--win-accent);
            border-radius: 1px; transition: height 0.1s;
        }
        .viz-bar:nth-child(1) { height: 6px; animation: viz1 0.6s ease infinite; }
        .viz-bar:nth-child(2) { height: 12px; animation: viz2 0.5s ease infinite; }
        .viz-bar:nth-child(3) { height: 9px; animation: viz3 0.7s ease infinite; }
        .viz-bar:nth-child(4) { height: 16px; animation: viz4 0.4s ease infinite; }
        .viz-bar:nth-child(5) { height: 8px; animation: viz5 0.55s ease infinite; }
        .viz-bar:nth-child(6) { height: 14px; animation: viz6 0.65s ease infinite; }
        .viz-bar:nth-child(7) { height: 10px; animation: viz7 0.45s ease infinite; }
        .viz-bar:nth-child(8) { height: 16px; animation: viz8 0.5s ease infinite; }
        .music-visualizer.paused .viz-bar { animation-play-state: paused; height: 3px !important; }

        @keyframes viz1 { 0%,100%{height:6px} 50%{height:16px} }
        @keyframes viz2 { 0%,100%{height:12px} 50%{height:5px} }
        @keyframes viz3 { 0%,100%{height:9px} 50%{height:16px} }
        @keyframes viz4 { 0%,100%{height:16px} 50%{height:6px} }

        @keyframes viz6 { 0%,100%{height:14px} 50%{height:5px} }
        @keyframes viz7 { 0%,100%{height:10px} 50%{height:16px} }
        @keyframes viz8 { 0%,100%{height:16px} 50%{height:8px} }

        .music-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

            font-size: 9px; padding: 1px 6px; border-radius: 3px;

        }
        .music-progress-wrap { margin-top: 6px; }
        .music-bar-bg {
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; cursor: pointer;
        }
        .music-bar-fill { height: 100%; width: 35%; background: var(--win-accent); border-radius: 2px; transition: width 0.3s; }
        .music-time-row { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }

        .music-controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; }
        .m-btn {

        /* ===== 通知 ===== */
        .notif-layout { display: flex; align-items: center; gap: 10px; }
        .notif-icon {

        .call-layout { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .call-avatar-wrap { position: relative; }
        .call-avatar {
            width: 56px; height: 56px; border-radius: 50%;

            0%,100% { transform: scale(1); opacity: 1; }

        .call-name { font-size: 18px; font-weight: 600; }

        .timer-layout { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .timer-display { font-size: 40px; font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: 3px; }
        .timer-laps { font-size: 11px; color: var(--muted); }
        .timer-btns { display: flex; gap: 8px; }

            padding: 6px 20px; border-radius: 8px;
            background: var(--surface); border: 1px solid var(--glass-border);

        .sys-layout { display: flex; gap: 12px; align-items: flex-start; justify-content: center; }

        .slider-icon { font-size: 28px; }
        .slider-track {
            width: 100%; height: 5px;
            background: rgba(255,255,255,0.06); border-radius: 3px;
            position: relative; cursor: pointer;
        }
        .slider-fill {
            height: 100%; border-radius: 3px;
            background: var(--win-accent); position: relative;
        }
        .slider-fill::after {
            content: ''; position: absolute; right: -7px; top: 50%; transform: translateY(-50%);
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--win-accent); box-shadow: 0 2px 6px rgba(96,205,255,0.4);
        }
        .slider-val { font-size: 20px; font-weight: 200; }
        .slider-label { font-size: 11px; color: var(--muted); }

        /* ===== 电池详情 ===== */
        .battery-layout { display: flex; gap: 16px; align-items: center; }
        .battery-big {
            width: 60px; height: 110px;
            border: 2px solid rgba(255,255,255,0.1); border-radius: 10px;
            padding: 3px; position: relative;
        }
        .battery-big::before {
            content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 5px; background: rgba(255,255,255,0.1); border-radius: 2px 2px 0 0;
        }
        .battery-big-fill {
            width: 100%; border-radius: 5px;
            background: linear-gradient(180deg, var(--success), #4caf50);
            position: absolute; bottom: 3px; left: 3px; right: 3px;
            transition: height 0.5s;
        }
        .battery-big-text {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; z-index: 2;
        }
        .battery-info { flex: 1; }
        .battery-info-row {
            display: flex; justify-content: space-between;
            padding: 4px 0; font-size: 11px;
            border-bottom: 1px solid var(--glass-border);
        }
        .battery-info-row:last-child { border-bottom: none; }
        .battery-info-label { color: var(--muted); }
        .battery-info-val { font-weight: 500; }

        /* ===== AirDrop ===== */
        .airdrop-layout { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .airdrop-radar {
            width: 90px; height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(96,205,255,0.2);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .airdrop-radar::before, .airdrop-radar::after {
            content: ''; position: absolute; border-radius: 50%;
            border: 1px solid rgba(96,205,255,0.1);
            animation: radar 2s ease-out infinite;
        }
        .airdrop-radar::before { width: 60px; height: 60px; }
        .airdrop-radar::after { width: 120px; height: 120px; animation-delay: 1s; }
        @keyframes radar {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .airdrop-icon { font-size: 30px; z-index: 2; }
        .airdrop-text { font-size: 12px; color: var(--muted); }
        .airdrop-devices { display: flex; gap: 12px; margin-top: 2px; }
        .airdrop-device {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            padding: 8px 12px; border-radius: 10px;
            background: var(--surface); cursor: pointer;
            transition: all 0.15s;
        }
        .airdrop-device:hover { background: var(--surface-hover); }
        .airdrop-device-icon { font-size: 22px; }
        .airdrop-device-name { font-size: 10px; color: var(--muted); }

        /* ===== 桌面图标 ===== */
        .desktop-icons {
            position: absolute; top: 80px; left: 24px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 5;
        }
        .desktop-icon {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            width: 76px; padding: 8px 4px; border-radius: 8px;
            cursor: pointer; transition: background 0.15s;
        }
        .desktop-icon:hover { background: rgba(255,255,255,0.06); }
        .desktop-icon-img {
            width: 44px; height: 44px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .desktop-icon-name {
            font-size: 11px; color: var(--ink); text-align: center; line-height: 1.3;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* ===== 任务栏 ===== */
        .taskbar {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 52px;
            background: rgba(32,32,32,0.7);
            backdrop-filter: blur(60px) saturate(180%);
            -webkit-backdrop-filter: blur(60px) saturate(180%);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: center;
            z-index: 900; padding: 0 12px;
        }
        .taskbar-center { display: flex; align-items: center; gap: 4px; }
        .taskbar-btn {
            width: 44px; height: 40px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 22px;
            transition: background 0.15s; position: relative;
        }
        .taskbar-btn:hover { background: rgba(255,255,255,0.08); }
        .taskbar-btn.active::after {
            content: ''; position: absolute;
            bottom: 2px; left: 50%; transform: translateX(-50%);
            width: 16px; height: 3px; background: var(--win-accent); border-radius: 2px;
        }
        .taskbar-right {
            position: absolute; right: 12px;
            display: flex; align-items: center; gap: 2px; height: 100%;
        }
        .tray-group {
            display: flex; align-items: center; gap: 0;
            padding: 0 8px; height: 36px; border-radius: 6px;
            cursor: pointer; transition: background 0.15s;
        }
        .tray-group:hover { background: rgba(255,255,255,0.06); }
        .tray-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .tray-clock {
            padding: 0 12px; height: 36px; border-radius: 6px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.15s;
        }
        .tray-clock:hover { background: rgba(255,255,255,0.06); }
        .tray-time { font-size: 12px; font-weight: 400; line-height: 1.3; }
        .tray-date { font-size: 12px; font-weight: 400; line-height: 1.3; }

        /* ===== 控制面板 ===== */
        .control-float {
            position: absolute; top: 50%; right: 24px;
            transform: translateY(-50%);
            z-index: 800;
            display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
            max-height: 90vh; overflow-y: auto;
        }
        .ctrl-label {
            font-size: 11px; color: rgba(255,255,255,0.35);
            text-transform: uppercase; letter-spacing: 1.5px;
            margin-bottom: 4px;
        }
        .ctrl-btn {
            padding: 8px 16px; border-radius: 10px;
            background: rgba(32,32,32,0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--ink); font-size: 12px; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 8px;
            white-space: nowrap;
        }
        .ctrl-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.12);
            transform: translateX(-4px);
        }
        .ctrl-btn .ctrl-icon { font-size: 14px; }

        /* ===== 品牌 ===== */
        .brand {
            position: absolute; bottom: 68px; right: 24px;
            z-index: 800; text-align: right;
        }
        .brand-name { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.25); letter-spacing: 2px; }
        .brand-sub { font-size: 10px; color: rgba(255,255,255,0.15); letter-spacing: 1px; margin-top: 2px; }

        /* ===== 动画 ===== */
        .fade-in { animation: fadeIn 0.35s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* 响应式 */
        @media (max-width: 900px) {
            .dynamic-island.music { width: 360px; height: 220px; }
            .dynamic-island.notification { width: 340px; height: 150px; }
            .dynamic-island.call { width: 340px; height: 240px; }
            .dynamic-island.timer { width: 320px; height: 200px; }
            .dynamic-island.system { width: 340px; height: 220px; }
            .dynamic-island.weather { width: 340px; height: 280px; }
            .dynamic-island.calendar { width: 360px; height: 380px; }
            .dynamic-island.transfer { width: 340px; height: 200px; }
            .dynamic-island.clipboard { width: 360px; height: 340px; }
            .dynamic-island.volume { width: 320px; height: 160px; }
            .dynamic-island.brightness { width: 320px; height: 160px; }
            .dynamic-island.battery { width: 340px; height: 220px; }
            .dynamic-island.airdrop { width: 340px; height: 240px; }
            .control-float { display: none; }
            .desktop-icons { display: none; }
        }
    </style>
</head>
<body>
    <div class="desktop">
        <div class="wallpaper"></div>

        <!-- 桌面图标 -->
        <div class="desktop-icons">
            <div class="desktop-icon"><div class="desktop-icon-img" style="background:linear-gradient(135deg,#f25022,#ff8c00);">📁</div><span class="desktop-icon-name">此电脑</span></div>
            <div class="desktop-icon"><div class="desktop-icon-img" style="background:linear-gradient(135deg,#0078d4,#00bcf2);">🌐</div><span class="desktop-icon-name">Edge</span></div>
            <div class="desktop-icon"><div class="desktop-icon-img" style="background:linear-gradient(135deg,#00a4ef,#7fba00);">📁</div><span class="desktop-icon-name">文档</span></div>
            <div class="desktop-icon"><div class="desktop-icon-img" style="background:linear-gradient(135deg,#ff4444,#cc0000);">🗑️</div><span class="desktop-icon-name">回收站</span></div>
            <div class="desktop-icon"><div class="desktop-icon-img" style="background:linear-gradient(135deg,#744da9,#b146c2);">🎵</div><span class="desktop-icon-name">Nook X</span></div>
        </div>

        <!-- ===== 灵动岛 ===== -->
        <div class="island-wrapper">
            <div class="dynamic-island compact" id="island">

                <!-- 紧凑层 -->
                <div class="island-layer active" id="layerCompact">
                    <div class="compact-inner">
                        <div class="compact-left">
                            <div class="compact-icon" id="cmpIcon" style="background:var(--win-accent);">⚡</div>
                            <span class="compact-label" id="cmpLabel">Nook X</span>
                        </div>
                        <div class="compact-right">
                            <div class="compact-dots" id="cmpDots" style="display:none;">
                                <div class="compact-dot"></div><div class="compact-dot"></div><div class="compact-dot"></div>

                <!-- 音乐层 -->

                    </div>
                    <div class="exp-body" id="timerBody"></div>

                    </div>
                    <div class="exp-body" id="sysBody"></div>
                </div>

                <!-- 天气层 -->

                    </div>
                    <div class="exp-body" id="weatherBody"></div>
                </div>

                <!-- 日历层 -->
                <div class="island-layer expanded-layer" id="layerCalendar">
                    <div class="exp-header">
                        <span class="exp-title">日历</span>
                        <div class="exp-close" onclick="closeIsland()">✕</div>
                    </div>
                    <div class="exp-body" id="calendarBody"></div>
                </div>

                <!-- 文件传输层 -->
                <div class="island-layer expanded-layer" id="layerTransfer">
                    <div class="exp-header">

                <!-- 音量层 -->

                    <div class="exp-header">
                        <span class="exp-title">音量</span>
                        <div class="exp-close" onclick="closeIsland()">✕</div>
                    </div>
                    <div class="exp-body" id="volumeBody"></div>
                </div>

                <!-- 亮度层 -->
                <div class="island-layer expanded-layer" id="layerBrightness">
                    <div class="exp-header">
                        <span class="exp-title">亮度</span>
                        <div class="exp-close" onclick="closeIsland()">✕</div>
                    </div>
                    <div class="exp-body" id="brightnessBody"></div>
                </div>

                <!-- 电池层 -->
                <div class="island-layer expanded-layer" id="layerBattery">
                    <div class="exp-header">
                        <span class="exp-title">电池</span>
                        <div class="exp-close" onclick="closeIsland()">✕</div>
                    </div>
                    <div class="exp-body" id="batteryBody"></div>

                <!-- AirDrop层 -->

        <!-- 控制面板 -->
        <div class="control-float">

                        <rect x="11" y="1" width="8" height="8" rx="1" fill="var(--win-accent)"/>
                        <rect x="1" y="11" width="8" height="8" rx="1" fill="var(--win-accent)"/>
                        <rect x="11" y="11" width="8" height="8" rx="1" fill="var(--win-accent)"/>
                    </svg>
                </div>

                </div>

    <script>
        // ===== 元素引用 =====
        const island = document.getElementById('island');
        const layers = {
            compact: document.getElementById('layerCompact'),
            music: document.getElementById('layerMusic'),
            notif: document.getElementById('layerNotif'),
            call: document.getElementById('layerCall'),
            timer: document.getElementById('layerTimer'),
            sys: document.getElementById('layerSys'),
            weather: document.getElementById('layerWeather'),
            calendar: document.getElementById('layerCalendar'),
            transfer: document.getElementById('layerTransfer'),
            clipboard: document.getElementById('layerClipboard'),
            volume: document.getElementById('layerVolume'),
            brightness: document.getElementById('layerBrightness'),
            battery: document.getElementById('layerBattery'),
            airdrop: document.getElementById('layerAirdrop')
        };

        let currentMode = 'compact';
        let isPlaying = false;
        let timerInterval = null, timerSeconds = 0;
        let callTimerInterval = null;
        let volumeVal = 65, brightnessVal = 80;

        // ===== 时钟 =====
        function updateClock() {
            const now = new Date();
            const h = now.getHours().toString().padStart(2,'0');
            const m = now.getMinutes().toString().padStart(2,'0');
            document.getElementById('trayTime').textContent = `${h}:${m}`;
            document.getElementById('trayDate').textContent = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
        }
        setInterval(updateClock, 1000); updateClock();

        function switchLayer(name) {
            Object.values(layers).forEach(l => l.classList.remove('active'));
            if (layers[name]) layers[name].classList.add('active');
        }

        function setCompact(icon, bg, label, showDots, showBadge, badgeNum) {
            const ic = document.getElementById('cmpIcon');
            const lb = document.getElementById('cmpLabel');
            const dt = document.getElementById('cmpDots');
            const bd = document.getElementById('cmpBadge');
            ic.textContent = icon; ic.style.background = bg;
            lb.textContent = label;
            dt.style.display = showDots ? 'flex' : 'none';
            bd.style.display = showBadge ? 'flex' : 'none';
            if (badgeNum) bd.textContent = badgeNum;
        }

        function closeIsland() {
            currentMode = 'compact';
            island.className = 'dynamic-island compact';
            switchLayer('compact');
            setCompact('⚡', 'var(--win-accent)', 'Nook X', false, false);
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
        }

        // ===== 音乐 =====
        function showMusic() {
            currentMode = 'music';
            island.className = 'dynamic-island music';
            switchLayer('music');
            setCompact('🎵', '#744da9', '正在播放', true, false);

            document.getElementById('musicBody').innerHTML = `
                <div class="music-layout fade-in">
                    <div class="music-left">
                        <div class="music-cover ${isPlaying ? 'playing' : ''}" id="mCover">🎵</div>
                        <div class="music-visualizer ${isPlaying ? '' : 'paused'}" id="mViz">
                            <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                            <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                            <div class="viz-bar"></div><div class="viz-bar"></div>
                        </div>
                    </div>
                    <div class="music-right">
                        <div class="music-song">夜曲</div>
                        <div class="music-artist">周杰伦 · 十一月的萧邦</div>
                        <div class="music-tags">
                            <span class="music-tag">流行</span>
                            <span class="music-tag">华语</span>
                            <span class="music-tag">320kbps</span>

        let laps = [];
        function toggleTimer() {
            const btn = document.getElementById('tToggle');
            if (timerInterval) {
                clearInterval(timerInterval); timerInterval = null;
                if (btn) btn.textContent = '继续';
            } else {
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    const hh = Math.floor(timerSeconds/3600).toString().padStart(2,'0');
                    const mm = Math.floor((timerSeconds%3600)/60).toString().padStart(2,'0');
                    const ss = (timerSeconds%60).toString().padStart(2,'0');
                    const d = document.getElementById('tDisplay');
                    if (d) d.textContent = `${hh}:${mm}:${ss}`;
                    document.getElementById('cmpLabel').textContent = `${mm}:${ss}`;
                }, 1000);
                if (btn) btn.textContent = '暂停';
            }
        }
        function lapTimer() {
            if (!timerInterval) return;
            laps.push(timerSeconds);
            const el = document.getElementById('tLaps');
            if (el) el.textContent = `已计 ${laps.length} 圈 · 最近 ${formatTime(laps[laps.length-1])}`;
        }
        function formatTime(s) {
            const mm = Math.floor(s/60).toString().padStart(2,'0');
            const ss = (s%60).toString().padStart(2,'0');
            return `${mm}:${ss}`;
        }
        function resetTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            timerSeconds = 0; laps = [];
            const d = document.getElementById('tDisplay');
            if (d) d.textContent = '00:00:00';
            const b = document.getElementById('tToggle');
            if (b) b.textContent = '开始';
            const l = document.getElementById('tLaps');
            if (l) l.textContent = '已计 0 圈';
            document.getElementById('cmpLabel').textContent = '00:00';
        }

                </div>
            `;
        }

        // ===== AirDrop / 附近共享 =====
        function showAirdrop() {
            currentMode = 'airdrop';
            island.className = 'dynamic-island airdrop';
            switchLayer('airdrop');
            setCompact('📡', '#0078d4', '搜索中...', true, false);

            document.getElementById('airdropBody').innerHTML = `
                <div class="airdrop-layout fade-in">
                    <div class="airdrop-radar">
                        <div class="airdrop-icon">📡</div>
                    </div>
                    <div class="airdrop-text">正在搜索附近的设备...</div>
                    <div class="airdrop-devices">
                        <div class="airdrop-device">
                            <div class="airdrop-device-icon">📱</div>
                            <div class="airdrop-device-name">iPhone 15 Pro</div>
                        </div>
                        <div class="airdrop-device">
                            <div class="airdrop-device-icon">💻</div>
                            <div class="airdrop-device-name">MacBook Pro</div>
                        </div>
                        <div class="airdrop-device">
                            <div class="airdrop-device-icon">📱</div>
                            <div class="airdrop-device-name">iPad Air</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ===== 点击灵动岛 =====
        island.addEventListener('click', function(e) {
            if (e.target.closest('.exp-close') || e.target.closest('.m-btn') ||
                e.target.closest('.c-btn') || e.target.closest('.t-btn') ||
                e.target.closest('.notif-action-btn') || e.target.closest('.cal-nav-btn') ||
                e.target.closest('.cb-item') || e.target.closest('.airdrop-device')) return;
            if (currentMode === 'compact') showMusic();
            else closeIsland();
        });

        // 初始化
        closeIsland();
    </script>
</body>
</html>
