<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 驱动的股票智能投研台（演示）</title>
<style>
  :root{
    --bg:#f5f5f7; --panel:#ffffff; --panel-2:#fbfbfd; --line:#e6e6eb; --line-2:#ededf2;
    --ink:#1d1d1f; --ink-2:#46474b; --ink-3:#86868b; --blue:#0071e3; --blue-ink:#0a66c2;
    --up:#e0322a; --down:#0a9d54; --flat:#8a8a8e;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);
    --radius:16px; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .app{display:grid;grid-template-columns:390px 1fr;grid-template-rows:minmax(0,1fr);height:100vh;overflow:hidden}

  /* ============ Sidebar ============ */
  .sidebar{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
  .brand{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
  .logo{display:flex;align-items:center;gap:11px}
  .logo-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;
    background:linear-gradient(135deg,#0a84ff,#0040dd);box-shadow:0 4px 12px rgba(10,90,230,.35)}
  .logo-text{display:flex;flex-direction:column;line-height:1.15}
  .logo-text strong{font-size:16px;letter-spacing:.2px}
  .logo-text span{font-size:11.5px;color:var(--ink-3)}
  .status-pill{font-size:11px;color:var(--blue-ink);background:#eaf3ff;border:1px solid #d6e8ff;padding:4px 9px;border-radius:999px}

  .caps{display:flex;flex-wrap:wrap;gap:7px;padding:4px 16px 14px}
  .cap{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);
    font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer;transition:.15s;font-family:inherit}
  .cap:hover{border-color:#cfd2da;background:#fff;color:var(--ink);transform:translateY(-1px)}
  .cap.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cap-ai{border-color:#d6e2ff;background:#f3f7ff;color:var(--blue-ink)}
  .cap-ai:hover{border-color:#b7cdff;background:#eaf2ff}
  .cap-ai.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .cap-sep{width:1px;height:22px;background:var(--line);margin:0 2px;align-self:center}

  .chat{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 12px;display:flex;flex-direction:column;gap:12px}
  .chat::-webkit-scrollbar{width:8px}.chat::-webkit-scrollbar-thumb{background:#dcdce2;border-radius:8px}
  .hint{margin:auto;text-align:center;color:var(--ink-3);max-width:280px;padding:20px 0}
  .hint b{color:var(--ink-2);font-weight:600}
  .hint .k{display:inline-block;margin-top:10px;font-size:11.5px;color:var(--blue-ink);background:#eaf3ff;border:1px solid #d6e8ff;border-radius:8px;padding:8px 11px;text-align:left;line-height:1.7}
  .msg{display:flex;gap:9px;max-width:100%}
  .msg .av{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}
  .msg.user{flex-direction:row-reverse}
  .msg.user .av{background:#1d1d1f;color:#fff}
  .msg.bot .av{background:#eaf3ff;color:var(--blue);border:1px solid #d6e8ff}
  .bubble{font-size:13px;line-height:1.62;padding:9px 12px;border-radius:13px;max-width:280px}
  .msg.user .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:5px}
  .msg.bot .bubble{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);border-bottom-left-radius:5px}
  .bubble .tag{display:inline-block;font-size:11px;color:var(--blue-ink);background:#eaf3ff;border-radius:6px;padding:1px 7px;margin-bottom:5px}
  .bubble code{background:#eef0f4;border-radius:5px;padding:1px 5px;font-size:12px}
  .typing{display:inline-flex;gap:4px;padding:3px 0}
  .typing i{width:6px;height:6px;border-radius:50%;background:#b9bcc6;animation:tp 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  .composer{border-top:1px solid var(--line);padding:11px 16px 14px;background:var(--panel)}
  .ctx-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .ctx-symbol{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:5px 9px;background:var(--panel-2);flex:1;min-width:0}
  .ctx-tag{font-size:10.5px;color:var(--ink-3);background:#eef0f4;border-radius:6px;padding:2px 6px;flex:none}
  .ctx-symbol input{border:0;background:transparent;font-size:13px;width:84px;outline:none;font-family:inherit;color:var(--ink)}
  .ctx-name{font-size:12.5px;color:var(--blue-ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12.5px;background:var(--panel-2);color:var(--ink-2);font-family:inherit;cursor:pointer}
  .quick-actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .quick-actions button{border:1px dashed var(--line);background:#fff;color:var(--ink-2);font-size:11.5px;padding:5px 10px;border-radius:8px;cursor:pointer;font-family:inherit}
  .quick-actions button:hover{border-color:var(--blue);color:var(--blue-ink)}
  .input-row{display:flex;align-items:flex-end;gap:8px}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:13px;padding:10px 12px;font-size:13.5px;line-height:1.5;font-family:inherit;outline:none;max-height:120px;background:var(--panel-2)}
  textarea:focus{border-color:var(--blue);background:#fff}
  .send-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:17px;cursor:pointer;flex:none;display:grid;place-items:center;transition:.15s}
  .send-btn:hover{background:#0063c6;transform:translateY(-1px)}

  /* ============ Workspace ============ */
  .workspace{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
  .workspace-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px}
  .workspace-title{display:flex;flex-direction:column;gap:1px}
  .workspace-title strong{font-size:15px}
  .workspace-title span{font-size:12px;color:var(--ink-3)}
  .toolbar{display:flex;gap:7px;align-items:center}
  .toolbar button{border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:12px;padding:6px 11px;border-radius:9px;cursor:pointer;font-family:inherit}
  .toolbar button:hover{border-color:#cfd2da;color:var(--ink)}
  .progress-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 0 rgba(0,113,227,.5);animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,113,227,.45)}70%{box-shadow:0 0 0 8px rgba(0,113,227,0)}100%{box-shadow:0 0 0 0 rgba(0,113,227,0)}}

  .tabbar{display:flex;gap:6px;padding:0 20px 8px;overflow-x:auto;min-height:34px}
  .tabbar::-webkit-scrollbar{height:0}
  .tab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px 9px 0 0;
    padding:7px 11px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap;max-width:230px}
  .tab.active{border-color:#cfd6e6;background:linear-gradient(#fff,#fbfcff);color:var(--ink);font-weight:600;box-shadow:0 -2px 0 var(--blue) inset}
  .tab .x{color:var(--ink-3);font-size:13px;line-height:1}
  .tab .x:hover{color:var(--up)}

  .render-shell{flex:1;min-height:0;margin:0 20px 16px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .host{flex:1;min-height:0;overflow-y:auto}
  .host::-webkit-scrollbar{width:10px}.host::-webkit-scrollbar-thumb{background:#dcdce2;border-radius:10px}
  .empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--ink-3)}
  .empty .big{font-size:46px;margin-bottom:10px;opacity:.5}
  .status-bar{display:flex;gap:14px;padding:7px 16px;border-top:1px solid var(--line-2);background:var(--panel-2);font-size:11.5px;color:var(--ink-3)}
  .status-chip{display:flex;align-items:center;gap:6px}
  .status-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}

  /* ============ Artifact styles ============ */
  .art{padding:26px 30px 40px;color:var(--ink);max-width:980px;margin:0 auto}
  .art-banner{border-radius:16px;padding:20px 22px;margin-bottom:20px;color:#fff;position:relative;overflow:hidden}
  .art-banner.blue{background:linear-gradient(120deg,#0a84ff,#0a40c8)}
  .art-banner.dark{background:linear-gradient(120deg,#2b2d33,#15161a)}
  .art-banner.warm{background:linear-gradient(120deg,#ff7a45,#e0322a)}
  .art-banner h1{margin:0 0 6px;font-size:21px;letter-spacing:.3px}
  .art-banner p{margin:0;font-size:13px;opacity:.92;line-height:1.6}
  .art-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
  .art-chips span{font-size:11.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px}
  .verdict{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:7px 13px;margin-top:13px}

  .sec-title{font-size:13px;font-weight:700;color:var(--ink-2);margin:24px 0 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--blue);border-radius:2px}
  .grid{display:grid;gap:13px}
  .g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
  .card{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:var(--panel-2)}
  .card.soft{background:#fff}
  .metric .lab{font-size:11.5px;color:var(--ink-3);margin-bottom:6px}
  .metric .val{font-size:23px;font-weight:700;letter-spacing:.3px}
  .metric .sub{font-size:12px;margin-top:3px}
  .up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
  .pill.up{background:#fdecec;color:var(--up)}.pill.down{background:#e6f6ee;color:var(--down)}.pill.flat{background:#eef0f4;color:var(--flat)}
  .pill.blue{background:#eaf3ff;color:var(--blue-ink)}

  table.art-table{width:100%;border-collapse:collapse;font-size:13px}
  .art-table th{text-align:right;font-size:11.5px;color:var(--ink-3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line)}
  .art-table th:first-child,.art-table td:first-child{text-align:left}
  .art-table td{padding:11px 10px;border-bottom:1px solid var(--line-2);text-align:right}
  .art-table tr:hover td{background:#fafbff}
  .tname{font-weight:600;color:var(--ink)}
  .tcode{color:var(--ink-3);font-size:11.5px;margin-left:7px;font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}

  .bars .row{display:flex;align-items:center;gap:12px;margin:11px 0}
  .bars .name{width:64px;font-size:12.5px;color:var(--ink-2);flex:none}
  .bars .track{flex:1;height:9px;background:#eef0f4;border-radius:6px;overflow:hidden}
  .bars .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#0a84ff,#0040dd)}
  .bars .sc{width:44px;text-align:right;font-size:12.5px;font-weight:700;flex:none}

  .plan{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .plan div{padding:14px;border-right:1px solid var(--line-2)}
  .plan div:last-child{border-right:0}
  .plan .lab{font-size:11.5px;color:var(--ink-3);margin-bottom:6px}
  .plan .v{font-size:17px;font-weight:700}

  .bb{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .bb .col{border:1px solid var(--line);border-radius:13px;padding:14px 16px}
  .bb .bull{background:#fdf3f2;border-color:#f5d9d6}
  .bb .bear{background:#eef8f2;border-color:#cfeede}
  .bb h4{margin:0 0 9px;font-size:13px}
  .bb .bull h4{color:var(--up)}.bb .bear h4{color:var(--down)}
  .bb ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.85;color:var(--ink-2)}

  .timeline{position:relative;margin-left:6px;padding-left:18px;border-left:2px solid var(--line)}
  .timeline .it{position:relative;padding:0 0 16px 4px}
  .timeline .it::before{content:"";position:absolute;left:-25px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 2px #d6e8ff}
  .timeline .d{font-size:11.5px;color:var(--blue-ink);font-weight:600}
  .timeline .t{font-size:13px;margin-top:2px}
  .timeline .t span{color:var(--ink-3);font-size:12px}

  .feed .it{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);align-items:flex-start}
  .feed .it:last-child{border-bottom:0}
  .feed .tm{font-size:11.5px;color:var(--ink-3);width:46px;flex:none;padding-top:2px;font-variant-numeric:tabular-nums}
  .feed .ic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:14px}
  .feed .bd{flex:1}
  .feed .bd .h{font-size:13px;font-weight:600;margin-bottom:2px}
  .feed .bd .s{font-size:12px;color:var(--ink-3);line-height:1.55}

  .callout{border-radius:13px;padding:14px 16px;font-size:13px;line-height:1.7;margin:8px 0}
  .callout.con{background:#eef6ff;border:1px solid #d3e6ff;color:#0a4ea8}
  .callout.risk{background:#fff7ed;border:1px solid #ffe2bf;color:#9a5b08}
  .callout b{font-weight:700}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin:10px 2px 4px;font-size:12.5px}
  .legend .lg{display:flex;align-items:center;gap:7px}
  .legend .sw{width:14px;height:3px;border-radius:2px}
  .chart-wrap{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
  .foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line-2);font-size:11px;color:var(--ink-3);line-height:1.7}
  .scan-card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:13px;background:#fff}
  .scan-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .rank{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
  .badge{font-size:11px;font-weight:700;border-radius:7px;padding:4px 9px}
  .badge.buy{background:#fdecec;color:var(--up)}.badge.hold{background:#fff4e5;color:#c77700}

  /* ============ Intro / welcome ============ */
  .intro{padding:0 0 40px}
  .hero{position:relative;overflow:hidden;padding:50px 0 58px;color:#fff;
    background:radial-gradient(130% 150% at 12% -10%,#102a63 0%,#0b1736 48%,#0a1124 100%)}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:96px;z-index:1;pointer-events:none;
    background:linear-gradient(to bottom,transparent 0%,transparent 42%,var(--bg) 100%)}
  .hero-bg{position:absolute;inset:0;pointer-events:none;z-index:0}
  .hero-bg .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(120,160,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.10) 1px,transparent 1px);
    background-size:36px 36px;-webkit-mask-image:radial-gradient(120% 95% at 30% 0%,#000,transparent 72%);mask-image:radial-gradient(120% 95% at 30% 0%,#000,transparent 72%)}
  .hero-bg .orb{position:absolute;border-radius:50%;filter:blur(54px);opacity:.5;animation:float 9s ease-in-out infinite}
  .hero-bg .a{width:300px;height:300px;background:#0a84ff;top:-90px;right:-30px}
  .hero-bg .b{width:230px;height:230px;background:#7d4dff;bottom:-46px;left:8%;opacity:.42;animation-delay:1.6s}
  .hero-bg .c{width:170px;height:170px;background:#00d2ff;top:24%;left:46%;opacity:.32;animation-delay:3s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
  .hero-bg .beam{position:absolute;top:-60%;left:0;width:9%;height:240%;pointer-events:none;mix-blend-mode:screen;filter:blur(2px);
    background:linear-gradient(90deg,transparent,rgba(120,180,255,.10),rgba(205,228,255,.62),rgba(120,180,255,.10),transparent);
    transform:translateX(-220%) rotate(15deg);animation:sweep 5.6s cubic-bezier(.45,0,.25,1) infinite}
  @keyframes sweep{0%{transform:translateX(-220%) rotate(15deg);opacity:0}10%{opacity:1}86%{opacity:1}100%{transform:translateX(1180%) rotate(15deg);opacity:0}}
  .hero-in{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:0 30px}
  .hero-term{font-size:12px;color:#8fe3b8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:16px;letter-spacing:.3px}
  .hero-term .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#39d98a;margin-right:7px;animation:blink 1.4s infinite;vertical-align:middle}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#bcd4ff;border:1px solid rgba(140,180,255,.32);background:rgba(80,130,255,.12);padding:5px 12px;border-radius:999px}
  .hero h1{font-size:31px;margin:15px 0 11px;letter-spacing:.5px;line-height:1.2;font-weight:700;
    background:linear-gradient(92deg,#ffffff,#bcd4ff 55%,#9ab6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin:0;font-size:14.5px;color:#aebbd6;max-width:580px;line-height:1.75}
  .hero-stats{display:flex;gap:30px;margin-top:26px;flex-wrap:wrap}
  .hero-stats div{display:flex;flex-direction:column;gap:3px}
  .hero-stats b{font-size:19px;line-height:1;font-weight:700;background:linear-gradient(90deg,#84b6ff,#cab4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero-stats div:first-child b{font-size:30px}
  .hero-stats span{font-size:11.5px;color:#8b98b8}

  .intro-body{padding:8px 30px 0;max-width:980px;margin:0 auto}
  .intro-sec-title{font-size:13px;font-weight:700;color:var(--ink-2);margin:26px 0 13px;display:flex;align-items:center;gap:9px}
  .intro-sec-title::before{content:"";width:3px;height:14px;background:linear-gradient(#0a84ff,#7d4dff);border-radius:2px}
  .intro-sec-title small{font-weight:500;color:var(--ink-3);font-size:11.5px}
  .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
  .feat-card{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--panel-2);cursor:pointer;transition:.18s;position:relative;overflow:hidden;min-height:120px}
  .feat-card::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,132,255,.06),transparent 60%);opacity:0;transition:.18s}
  .feat-card:hover{transform:translateY(-3px);border-color:#cdd9f5;box-shadow:0 12px 28px rgba(20,40,90,.11);background:#fff}
  .feat-card:hover::after{opacity:1}
  .feat-card .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;margin-bottom:11px;background:linear-gradient(135deg,#eaf2ff,#eef0ff);border:1px solid #e2e9ff}
  .feat-card h4{margin:0 0 5px;font-size:14px;display:flex;align-items:center;gap:7px;padding-right:22px}
  .feat-card .ai-tag{font-size:10px;color:#7d4dff;border:1px solid #e0d6ff;background:#f6f2ff;border-radius:5px;padding:1px 6px;font-weight:600}
  .feat-card p{margin:0;font-size:12px;color:var(--ink-3);line-height:1.62;position:relative;z-index:1}
  .feat-card .go{position:absolute;right:14px;top:17px;color:#c2c7d2;font-size:15px;transition:.18s}
  .feat-card:hover .go{color:var(--blue);transform:translateX(3px)}

  .flow{display:flex;align-items:stretch;gap:4px;flex-wrap:wrap}
  .flow .step{flex:1;min-width:140px;border:1px solid var(--line);border-radius:13px;padding:13px 13px 15px;background:#fff;display:flex;flex-direction:column}

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const f2 = n => Number(n).toFixed(2);
const signPct = v => (v>0?'+':'') + Number(v).toFixed(2) + '%';
const cls = v => v>0?'up':v<0?'down':'flat';
const nm = (name,code) => `<span class="tname">${name}</span><span class="tcode">${code}</span>`;
function rng(seed){let s=seed;return ()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}

/* ---------- SVG charts ---------- */
function candleChart(){
  const r=rng(41); let price=11.0; const c=[];
  for(let i=0;i<46;i++){
    const open=price; const drift=(r()-0.47)*0.34;
    let close=Math.max(9.4, open+drift);
    const hi=Math.max(open,close)+r()*0.16, lo=Math.min(open,close)-r()*0.16;
    c.push({open,close,hi,lo,vol:0.45+r()}); price=close;
  }
  const closes=c.map(x=>x.close);
  const ma=(n,i)=> i<n-1?null: closes.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n;
  const W=760,H=300,VH=78,padL=10,padR=48,padT=12,padB=8;
  const lo=Math.min(...c.map(x=>x.lo)), hi=Math.max(...c.map(x=>x.hi));
  const X=i=>padL+i*(W-padL-padR)/(c.length-1);
  const Y=p=>padT+(hi-p)/(hi-lo)*(H-padT-padB);
  const cw=Math.max(3,(W-padL-padR)/c.length*0.56);
  let body='';
  c.forEach((x,i)=>{
    const up=x.close>=x.open; const col=up?'#e0322a':'#0a9d54';
    const xc=X(i);
    body+=`<line x1="${xc}" x2="${xc}" y1="${Y(x.hi)}" y2="${Y(x.lo)}" stroke="${col}" stroke-width="1"/>`;
    const y1=Y(Math.max(x.open,x.close)), y2=Y(Math.min(x.open,x.close));
    body+=`<rect x="${xc-cw/2}" y="${y1}" width="${cw}" height="${Math.max(1,y2-y1)}" fill="${up?col:col}" opacity="${up?1:1}"/>`;
  });
  const line=(n,color)=>{
    let pts=c.map((_,i)=>{const v=ma(n,i);return v==null?null:`${X(i).toFixed(1)},${Y(v).toFixed(1)}`;}).filter(Boolean).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" opacity=".9"/>`;
  };
  // grid labels
  let grid='';
  for(let k=0;k<=4;k++){const p=lo+(hi-lo)*k/4;const y=Y(p);grid+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#eef0f4"/><text x="${W-padR+5}" y="${y+3.5}" font-size="10" fill="#86868b">${p.toFixed(2)}</text>`;}
  // volume
  const vmax=Math.max(...c.map(x=>x.vol));
  let vol='';
  c.forEach((x,i)=>{const up=x.close>=x.open;const h=x.vol/vmax*(VH-10);vol+=`<rect x="${X(i)-cw/2}" y="${H+ (VH-10-h)}" width="${cw}" height="${h}" fill="${up?'#e0322a':'#0a9d54'}" opacity=".55"/>`;});
  return `<svg viewBox="0 0 ${W} ${H+VH}" style="width:100%;height:auto">${grid}${body}${line(5,'#f5a623')}${line(20,'#0071e3')}<line x1="${padL}" x2="${W-padR}" y1="${H+4}" y2="${H+4}" stroke="#ededf2"/>${vol}</svg>`;
}
function lineChart(series){
  const W=760,H=290,padL=12,padR=52,padT=14,padB=24;
  const N=series[0].data.length;
  const all=series.flatMap(s=>s.data); const lo=Math.min(...all,0), hi=Math.max(...all,0);
  const X=i=>padL+i*(W-padL-padR)/(N-1);
  const Y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB);
  let grid='';
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;const y=Y(v);grid+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="${Math.abs(v)<.01?'#c9ccd4':'#eef0f4'}" stroke-dasharray="${Math.abs(v)<.01?'0':'3 4'}"/><text x="${W-padR+5}" y="${y+3.5}" font-size="10" fill="#86868b">${v.toFixed(1)}%</text>`;}
  const y0=Y(0);grid+=`<line x1="${padL}" x2="${W-padR}" y1="${y0}" y2="${y0}" stroke="#b9bcc6"/>`;
  let lines=series.map(s=>{
    const pts=s.data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    const end=s.data[N-1];
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"/><circle cx="${X(N-1)}" cy="${Y(end)}" r="3" fill="${s.color}"/>`;
  }).join('');
  // x labels
  let xl='';['60日前','45日','30日','15日','今'].forEach((t,k)=>{const i=Math.round(k*(N-1)/4);xl+=`<text x="${X(i)}" y="${H-6}" font-size="10" fill="#86868b" text-anchor="middle">${t}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${lines}${xl}</svg>`;
}
function genSeries(){
  const mk=(seed,drift)=>{const r=rng(seed);let v=0;const d=[0];for(let i=0;i<59;i++){v+=(r()-0.5)*1.5+drift;d.push(v);}return d;};
  return [
    {name:'平安银行',code:'000001.SZ',color:'#e0322a',data:mk(7,0.11)},
    {name:'贵州茅台',code:'600519.SH',color:'#0071e3',data:mk(19,-0.07)},
    {name:'五粮液',code:'000858.SZ',color:'#7d4dff',data:mk(31,-0.16)},
  ];
}

    <div class="foot">数据来源：Tushare Pro / AkShare（演示数据，非实时行情）。本页为服务端生成的 HTML artifact 示意。</div>

const tabs=[]; let active=null; const MAX=8;
const host=$('#host'), chat=$('#chat');

function pushChat(role,html){
  $('#hint')?.remove();
  const m=document.createElement('div'); m.className='msg '+(role==='user'?'user':'bot');
  m.innerHTML=`<div class="av">${role==='user'?'我':'α'}</div><div class="bubble">${html}</div>`;

}
function typingBubble(){
  $('#hint')?.remove();
  const m=document.createElement('div'); m.className='msg bot';
  m.innerHTML=`<div class="av">α</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`;
  chat.appendChild(m); chat.scrollTop=chat.scrollHeight; return m;
}
function setActiveCap(key){document.querySelectorAll('.cap').forEach(b=>b.classList.toggle('active',b.dataset.cap===key));}

function renderTabs(){
  const bar=$('#tabbar'); bar.innerHTML='';
  tabs.forEach(t=>{
    const el=document.createElement('div'); el.className='tab'+(t.id===active?' active':'');
    el.innerHTML=`<span>${t.title}</span><span class="x" title="关闭">×</span>`;
    el.querySelector('span').onclick=()=>activate(t.id);
    el.onclick=e=>{if(!e.target.classList.contains('x'))activate(t.id);};
    el.querySelector('.x').onclick=e=>{e.stopPropagation();closeTab(t.id);};
    bar.appendChild(el);
  });
  $('#tabCount').textContent=tabs.length;
}
function activate(id){
  const t=tabs.find(x=>x.id===id); if(!t)return; active=id;
  host.innerHTML=t.html;
  $('#renderTitle').textContent=t.title; $('#renderSubtitle').textContent=t.sub;
  $('#artifactSize').textContent=(new Blob([t.html]).size/1024).toFixed(1)+' KB';
  $('#runtimeStatus').textContent='rendered · '+t.title;
  renderTabs();
}
function closeTab(id){
  const i=tabs.findIndex(x=>x.id===id); if(i<0)return;
  tabs.splice(i,1);
  if(active===id){ if(tabs.length){activate(tabs[Math.max(0,i-1)].id);} else {active=null;showEmpty();} }
  renderTabs();
}

      <div class="intro-sec-title">怎么用 <small>· 从一句话到一份报告</small></div>
      <div class="flow">
        ${FLOW.map(([n,t,d],i)=>`<div class="step"><div class="n">${n}</div><b>${t}</b><span>${d}</span></div>${i<FLOW.length-1?'<div class="arr">→</div>':''}`).join('')}
      </div>

      <div class="intro-sec-title">为什么不一样</div>
      <div class="why-grid">
        ${WHY.map(([ic,t,d])=>`<div class="why-card"><div class="wic">${ic}</div><div><b>${t}</b><p>${d}</p></div></div>`).join('')}
      </div>

      <div class="intro-cta">👈 点击左侧功能按钮，或在下方输入框 <b>直接提问</b>，右侧画布会立即生成对应的图文报告。</div>
    </div>
  </div>`;
}
function renderIntro(){
  host.innerHTML=buildIntro();
  $('#renderTitle').textContent='功能总览';
  $('#renderSubtitle').textContent='AI 驱动的股票智能投研台 · 点击卡片或左侧按钮开始';
  $('#runtimeStatus').textContent='ready';
  $('#artifactSize').textContent='—';
  host.querySelectorAll('.feat-card[data-cap]').forEach(el=>el.addEventListener('click',()=>run(el.dataset.cap)));
  active=null; renderTabs();
}
function showEmpty(){ renderIntro(); }
let seq=0;
function openTab(title,sub,html){
  if(tabs.length>=MAX){ tabs.shift(); }   // evict oldest for stability
  const id=++seq; tabs.push({id,title,sub,html}); activate(id);
}

let busy=false;
function run(key,customUser){
  if(busy) return; const cap=CAPS[key]; if(!cap)return;
  busy=true; setActiveCap(key);
  pushChat('user', customUser||cap.user);
  $('#progressDot').hidden=false; $('#runtimeStatus').textContent='生成中…';
  const tb=typingBubble();
  setTimeout(()=>{
    tb.remove(); $('#progressDot').hidden=true;
    pushChat('bot', `<span class="tag">${cap.title}</span>${cap.reply}`);
    openTab(cap.title, cap.sub, cap.build());
    busy=false;
  }, 600);
}

/* intent recognition for free text */
function detect(t){
  const s=t.toLowerCase();
  if(/脉搏|大盘|今天.*(行情|盘|市场)|情绪|指数/.test(t)) return 'pulse';
  if(/选股|筛选|策略|低估|价值股/.test(t)) return 'screener';
  if(/对比|比较|哪个强|相对收益/.test(t)) return 'compare';
  if(/k\s*线|kline|走势|关键价位|支撑|阻力/i.test(t)) return 'kline';
  if(/自选/.test(t)) return 'watchlist';
  if(/监控|异动|盯盘|预警/.test(t)) return 'monitor';
  if(/尽调|深度|基本面|研报|尽职/.test(t)) return 'deep';
  if(/扫描|top|多空|全市场.*选/i.test(t)) return 'scan';
  return 'ask';
}
function send(){
  const t=$('#input').value.trim(); if(!t||busy)return;
  $('#input').value=''; autoGrow();
  const key=detect(t); const cap=CAPS[key]; setActiveCap(key);
  busy=true;
  pushChat('user', t);
  $('#progressDot').hidden=false; $('#runtimeStatus').textContent='识别意图…';
  const tb=typingBubble();
  setTimeout(()=>{
    tb.remove(); $('#progressDot').hidden=true;
    pushChat('bot', `<span class="tag">意图识别 → ${cap.title}</span>${cap.reply}`);
    openTab(cap.title, cap.sub, cap.build());
    busy=false;
  }, 700);
}

/* wiring */
document.querySelectorAll('.cap').forEach(b=>b.addEventListener('click',()=>run(b.dataset.cap)));
$('#send').addEventListener('click', send);
const ta=$('#input');
function autoGrow(){ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px';}
ta.addEventListener('input',autoGrow);
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
document.querySelectorAll('.quick-actions button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.cap){run(b.dataset.cap);} else {ta.value=b.dataset.fill;autoGrow();ta.focus();}
}));
$('#symbolInput').addEventListener('input',e=>{
  const map={'000001.SZ':'平安银行','600519.SH':'贵州茅台','000858.SZ':'五粮液','300750.SZ':'宁德时代','688256.SH':'寒武纪'};
  $('#symbolName').textContent=map[e.target.value.trim().toUpperCase()]||'';
});
$('#reloadBtn').addEventListener('click',()=>{const t=tabs.find(x=>x.id===active);if(t)activate(t.id);});
$('#clearBtn').addEventListener('click',()=>{tabs.length=0;active=null;renderIntro();renderTabs();});

/* initial canvas: feature intro */
renderIntro();
</script>
</body>
</html>
