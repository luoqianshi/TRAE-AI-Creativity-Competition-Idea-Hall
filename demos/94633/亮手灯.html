<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>亮手灯 · 手工补光助手</title>
  <style>
    :root {
      --bg-primary: #fff9f0;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #ffcc80;
      --accent-light: #ffe5b4;
      --border: #f0d9b5;
      --shadow: 0 2px 12px rgba(230, 184, 125, 0.15);
      --transition: all 0.3s ease;
      --radius: 12px;
    }

    .dark-theme {
      --bg-primary: #2a221c;
      --bg-card: #3a2d23;
      --text-primary: #f5f0e6;
      --text-secondary: #c9b8a5;
      --accent: #d9a366;
      --accent-light: #b87d4a;
      --border: #5a4535;
      --shadow: 0 2px 12px rgba(90, 69, 53, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 16px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--accent), #ff9a4d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
      transition: var(--transition);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    .lux-control {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lux-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .lux-slider {
      -webkit-appearance: none;
      height: 8px;
      border-radius: 4px;
      background: #f5f0e6;
      outline: none;
      width: 100%;
    }

    .lux-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(255, 204, 128, 0.5);
    }

    .lux-value {
      font-weight: 600;
      font-size: 1.1rem;
      text-align: center;
      margin-top: 8px;
      color: var(--accent);
    }

    .brightness-indicator {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 120px;
      margin: 24px 0;
      border-radius: var(--radius);
      background: #fff5e6;
      position: relative;
      overflow: hidden;
      transition: background-color 0.4s ease;
    }

    .brightness-indicator::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0%, transparent 70%);
      opacity: 0.6;
    }

    .light-bulb {
      width: 60px;
      height: 60px;
      fill: #ffeb3b;
      filter: drop-shadow(0 0 12px rgba(255, 235, 59, 0.6));
      transition: transform 0.3s ease;
    }

    .light-bulb.active {
      transform: scale(1.1);
      fill: #ffca28;
    }

    .status-text {
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      margin-top: 12px;
      min-height: 28px;
    }

    .mode-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 8px;
      background: var(--accent-light);
      color: #5a4535;
    }

    .trigger-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #5a4535;
      border: none;
      border-radius: var(--radius);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .trigger-btn:hover:not(:disabled) {
      background: #ffb347;
      transform: translateY(-1px);
    }

    .trigger-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .trigger-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: rotate(15deg);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    .instructions {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }

    .instructions ul {
      padding-left: 20px;
      margin-top: 8px;
    }

    .instructions li {
      margin-bottom: 6px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .card {
        padding: 16px;
      }
      .brightness-indicator {
        height: 100px;
      }
      .theme-toggle {
        width: 40px;
        height: 40px;
      }
    }

    /* Animation for brightness change */
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(255, 204, 128, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(255, 204, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 204, 128, 0); }
    }

    .pulse {
      animation: pulseGlow 0.8s ease-out;
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">
    <svg viewBox="0 0 24 24">
      <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 017.5 12zM8.25 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM9.75 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 019.75 12zM10.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM12 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0112 12zM12.75 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM14.25 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0114.25 12zM15 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0116.5 12zM17.25 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM18.75 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0118.75 12zM19.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75z"/>
    </svg>
  </div>

  <div class="container">
    <header>
      <h1>亮手灯</h1>
      <p class="subtitle">手机摄像头识别手部遮挡，自动调节台灯亮度｜无需APP · 不联网 · 即开即用</p>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 017.5 12zM8.25 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM9.75 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 019.75 12zM10.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM12 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0112 12zM12.75 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM14.25 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0114.25 12zM15 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0116.5 12zM17.25 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM18.75 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0118.75 12zM19.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75z"/></svg>
          当前环境照度（lux）
        </h2>
        <div class="lux-control">
          <div class="lux-label">
            <span>昏暗（<50 lux）</span>
            <span>明亮（>300 lux）</span>
          </div>
          <input type="range" min="0" max="400" step="10" value="80" class="lux-slider" id="luxSlider">
          <div class="lux-value"><span id="luxValue">80</span> lux</div>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 3v1.5m0 15V21m9-10.5h-1.5m1.5 0h-1.5m-12 4.5h1.5M21 12h-1.5m-12 0h1.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          模拟手部悬停补光
        </h2>
        <div class="brightness-indicator" id="lightIndicator">
          <svg class="light-bulb" viewBox="0 0 24 24"><path d="M9.343 3.479a.75.75 0 00-1.414.706A9.001 9.001 0 0112 21.75a9.001 9.001 0 018.657-5.441.75.75 0 00-1.414-.706A7.495 7.495 0 0012 18.75a7.495 7.495 0 00-6.343-3.571z"/></svg>
        </div>
        <div class="status-text" id="statusText">等待手部悬停…</div>
        <button class="trigger-btn" id="triggerBtn">
          <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 017.5 12zM8.25 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM9.75 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 019.75 12zM10.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM12 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0112 12zM12.75 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM14.25 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0114.25 12zM15 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0116.5 12zM17.25 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM18.75 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0118.75 12zM19.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75z"/></svg>
          手悬停 → 补光启动
        </button>
        <div class="mode-badge" id="modeBadge">柔光模式（适合刺绣）</div>
      </section>

      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 9v3.75m-9.304.646a1.5 1.5 0 01.404-2.016L2.85 4.5a1.5 1.5 0 012.016-.404L10 9m-2.296 2.296a1.5 1.5 0 01.404-2.016l.03.03h8.418a1.5 1.5 0 01.404.404l3 3a1.5 1.5 0 01.404 2.016l-.03.03H21m-8.16-9.04a1.5 1.5 0 01.404-2.016l.03.03H15m-2.296 2.296a1.5 1.5 0 01.404-2.016l.03.03h8.418a1.5 1.5 0 01.404.404l3 3a1.5 1.5 0 01.404 2.016l-.03.03H21m-8.16-9.04a1.5 1.5 0 01.404-2.016l.03.03H15m-2.296 2.296a1.5 1.5 0 01.404-2.016l.03.03h8.418a1.5 1.5 0 01.404.404l3 3a1.5 1.5 0 01.404 2.016l-.03.03H21"/></svg>
          使用说明
        </h2>
        <div class="instructions">
          <p>将手机固定在台灯支架上方，前置摄像头对准您的手工区域：</p>
          <ul>
            <li>✅ <strong>无需安装APP</strong> —— 打开本页即用</li>
            <li>✅ <strong>不联网不上传</strong> —— 所有计算在手机本地完成</li>
            <li>✅ <strong>适配百元内USB台灯</strong> —— 加装28元蓝牙模块即可联动</li>
            <li>✅ <strong>老人友好</strong> —— 一次扫码，终身免设置</li>
          </ul>
        </div>
      </section>
    </main>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      body.classList.add('dark-theme');
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      const isDark = body.classList.contains('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // 照度滑块
    const luxSlider = document.getElementById('luxSlider');
    const luxValue = document.getElementById('luxValue');
    const lightIndicator = document.getElementById('lightIndicator');
    const statusText = document.getElementById('statusText');
    const modeBadge = document.getElementById('modeBadge');
    const triggerBtn = document.getElementById('triggerBtn');
    const bulb = document.querySelector('.light-bulb');

    luxSlider.addEventListener('input', () => {
      luxValue.textContent = luxSlider.value;
      
      // 根据照度动态调整推荐模式
      const lux = parseInt(luxSlider.value);
      let mode = '柔光模式（适合刺绣）';
      let bgColor = '#fff5e6';
      if (lux < 50) {
        mode = '高亮模式（精细作业）';
        bgColor = '#fff8e1';
      } else if (lux < 150) {
        mode = '柔光模式（适合刺绣）';
        bgColor = '#fff5e6';
      } else {
        mode = '标准模式（日常缝纫）';
        bgColor = '#f9f5ed';
      }
      modeBadge.textContent = mode;
      lightIndicator.style.background = bgColor;
    });

    // 手悬停模拟
    let isTriggered = false;
    triggerBtn.addEventListener('click', () => {
      if (isTriggered) return;
      
      isTriggered = true;
      triggerBtn.disabled = true;
      triggerBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 017.5 12zM8.25 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM9.75 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 019.75 12zM10.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM12 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0112 12zM12.75 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM14.25 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0114.25 12zM15 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0116.5 12zM17.25 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM18.75 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0118.75 12zM19.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75z"/></svg> 已响应 —— 光已补足';
      statusText.textContent = '✅ 补光已启动（模拟）';
      statusText.style.color = '#4CAF50';
      bulb.classList.add('active', 'pulse');
      lightIndicator.classList.add('pulse');

      // 恢复状态
      setTimeout(() => {
        isTriggered = false;
        triggerBtn.disabled = false;
        triggerBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 017.5 12zM8.25 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM9.75 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 019.75 12zM10.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM12 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0112 12zM12.75 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM14.25 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0114.25 12zM15 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0116.5 12zM17.25 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM18.75 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V12.75A.75.75 0 0118.75 12zM19.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75z"/></svg> 手悬停 → 补光启动';
        statusText.textContent = '等待手部悬停…';
        statusText.style.color = '';
        bulb.classList.remove('active', 'pulse');
        lightIndicator.classList.remove('pulse');
      }, 2000);
    });
  </script>
</body>
</html>
