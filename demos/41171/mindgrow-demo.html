  <style>

    body {
      font-family: var(--font);

    }

    .app-container {
      width: 100%;
      max-width: var(--max);

      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 60px rgba(99,102,241,0.1);
    }

    /* ===== Header ===== */
    .header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
      color: white;
      padding: 20px 20px 24px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 8px 32px rgba(99,102,241,0.3);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -40%;
      left: -10%;
      width: 150px;
      height: 150px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }
    .header-brand {

    .header-subtitle { font-size: 12px; opacity: 0.8; }
    .stats-grid {
      display: grid;

      gap: 10px;

      z-index: 1;
    }
    .stat-card {
      background: rgba(255,255,255,0.15);

    .stat-card:hover { transform: translateY(-2px); }
    .stat-value { font-size: 24px; font-weight: 700; }

    .main-content {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
    }
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Section Title ===== */
    .section-title {
      font-size: 17px;

      display: flex;

      margin-bottom: 12px;

    .section-title svg { width: 20px; height: 20px; color: var(--accent); }

      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-header .count {
      font-size: 13px;
      color: var(--muted);
    }

    /* ===== Habit Cards ===== */
    .habit-list { display: flex; flex-direction: column; gap: 8px; }
    .habit-card {
      background: var(--bg2);
      border: 2px solid var(--rule);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }
    .habit-card:hover { border-color: var(--accent-light); }
    .habit-card.completed {
      border-color: var(--accent2);
      background: #f0fdf4;
    }
    .habit-card.completed .habit-name {
      text-decoration: line-through;
      color: var(--muted);
    }
    .habit-check {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .habit-check-circle {
      width: 22px;
      height: 22px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      transition: all 0.25s;
    }
    .habit-card.completed .habit-check-circle {
      border-color: var(--accent2);
      background: var(--accent2);
    }
    .habit-check-circle.checked::after {
      content: '';
      display: block;
      width: 6px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin: 1px auto 0;
    }
    .habit-info { flex: 1; }
    .habit-name { font-size: 14px; font-weight: 600; transition: all 0.25s; }
    .habit-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .habit-tag {
      font-size: 11px;
      background: #f1f5f9;
      color: #64748b;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .habit-streak {
      font-size: 11px;
      color: #f97316;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* ===== Add Habit Button ===== */
    .add-habit-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.25s;
    }
    .add-habit-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== Mood Section ===== */
    .mood-section { margin-top: 24px; }
    .mood-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 16px;
    }
    .mood-question { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .mood-options {
      display: flex;
      gap: 10px;
    }
    .mood-btn {
      flex: 1;
      padding: 12px 8px;
      border-radius: 12px;
      border: 2px solid transparent;
      background: #f8fafc;

      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.25s;
      font-family: var(--font);
    }
    .mood-btn:hover { background: #f1f5f9; }
    .mood-btn.selected.happy { background: #dcfce7; border-color: #86efac; }
    .mood-btn.selected.neutral { background: #fef9c3; border-color: #fde047; }
    .mood-btn.selected.sad { background: #fee2e2; border-color: #fca5a5; }
    .mood-btn .mood-icon { font-size: 28px; }
    .mood-btn .mood-label { font-size: 12px; color: var(--muted); }
    .mood-note-area {
      margin-top: 12px;
      display: none;
    }
    .mood-note-area.show { display: block; animation: fadeIn 0.3s ease; }
    .mood-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      font-size: 13px;
      font-family: var(--font);
      resize: none;
      outline: none;
      background: #f8fafc;
      transition: border-color 0.2s;
    }
    .mood-textarea:focus { border-color: var(--accent); }
    .mood-submit {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.2s;
    }
    .mood-submit:hover { background: var(--accent-light); }

    /* ===== Achievement Section ===== */
    .achievement-section { margin-top: 24px; }
    .achievement-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .achievement-card {
      border-radius: 14px;
      padding: 16px;
      border: 1px solid;
    }
    .achievement-card .emoji { font-size: 32px; margin-bottom: 4px; }
    .achievement-card .title { font-size: 14px; font-weight: 700; }
    .achievement-card .desc { font-size: 11px; margin-top: 2px; }
    .achievement-card.orange {
      background: linear-gradient(135deg, #fff7ed, #fef3c7);
      border-color: #fed7aa;
    }
    .achievement-card.orange .title { color: #c2410c; }
    .achievement-card.orange .desc { color: #ea580c; }
    .achievement-card.blue {
      background: linear-gradient(135deg, #eff6ff, #e0e7ff);
      border-color: #bfdbfe;
    }
    .achievement-card.blue .title { color: #1d4ed8; }
    .achievement-card.blue .desc { color: #3b82f6; }

    /* ===== Habits Page ===== */
    .habits-stats {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .habits-stats-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .habits-stats-value { font-size: 28px; font-weight: 700; }
    .habits-stats-value.purple { color: var(--accent); }
    .habits-stats-value.green { color: var(--accent2); }
    .habits-stats-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    /* ===== Chat Page ===== */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 240px);
      min-height: 400px;
    }
    .chat-messages {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-msg {
      display: flex;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }
    .chat-msg.user { flex-direction: row-reverse; }
    .chat-avatar {
      width: 32px;
      height: 32px;

      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;

    .chat-msg.assistant .chat-avatar { background: #dcfce7; color: #16a34a; }
    .chat-msg.user .chat-avatar { background: var(--accent); color: white; }
    .chat-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    .chat-msg.assistant .chat-bubble {
      background: #f1f5f9;
      color: var(--ink);
      border-bottom-left-radius: 4px;
    }
    .chat-msg.user .chat-bubble {
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .chat-input-area {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--rule);
      border-radius: 12px;
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      background: var(--bg2);
      transition: border-color 0.2s;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-send {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .chat-send:hover { background: var(--accent-light); }
    .chat-send svg { width: 20px; height: 20px; }

    /* ===== Mood Page ===== */
    .mood-chart-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .mood-chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .mood-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 120px;
      gap: 6px;
    }
    .mood-chart-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .mood-chart-bar {
      width: 100%;
      border-radius: 6px 6px 2px 2px;
      transition: height 0.5s ease;
      min-height: 8px;
    }
    .mood-chart-bar.happy { background: #4ade80; }
    .mood-chart-bar.neutral { background: #facc15; }
    .mood-chart-bar.sad { background: #f87171; }
    .mood-chart-label { font-size: 11px; color: var(--muted); }
    .mood-diary { display: flex; flex-direction: column; gap: 8px; }
    .mood-diary h3 { font-size: 14px; font-weight: 600; }
    .mood-diary-card {
      background: var(--bg2);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mood-diary-card.happy { border: 1px solid #bbf7d0; background: #f0fdf4; }
    .mood-diary-card.neutral { border: 1px solid #fef08a; background: #fefce8; }
    .mood-diary-card.sad { border: 1px solid #fecaca; background: #fef2f2; }
    .mood-diary-icon { font-size: 22px; flex-shrink: 0; }
    .mood-diary-date { font-size: 13px; font-weight: 600; }
    .mood-diary-note { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed;

      z-index: 100;
    }
    .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
    .modal {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      animation: scaleIn 0.25s ease;
    }
    @keyframes scaleIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-header h3 { font-size: 17px; font-weight: 700; }
    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: #f1f5f9;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 18px;
      transition: background 0.2s;
    }
    .modal-close:hover { background: #e2e8f0; }
    .modal-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--rule);
      border-radius: 12px;
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      background: #f8fafc;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .modal-input:focus { border-color: var(--accent); }
    .modal-submit {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.2s;
    }
    .modal-submit:hover { background: var(--accent-light); }

    /* ===== Bottom Nav ===== */
    .bottom-nav {
      background: white;
      border-top: 1px solid var(--rule);
      padding: 6px 16px 10px;
      display: flex;

      position: sticky;
      bottom: 0;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 12px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 11px;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.25s;
    }
    .nav-btn:hover { color: #64748b; }
    .nav-btn.active {
      color: var(--accent);
      background: rgba(99,102,241,0.1);
    }
    .nav-btn svg { width: 22px; height: 22px; }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1e293b;
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 200;
      transition: transform 0.3s ease;
      white-space: nowrap;

    /* ===== Responsive ===== */
    @media (max-width: 480px) {
      .app-container { max-width: 100%; }
      body { padding: 0; }
    }

<body>
  <div class="app-container" id="app">
    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="header-logo">&#x1F331;</div>
        <div>
          <div class="header-title">MindGrow</div>
          <div class="header-subtitle">AI习惯养成与心灵陪伴</div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-completed">2</div>
          <div class="stat-label">今日完成</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-total">4</div>
          <div class="stat-label">进行中</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-streak">28</div>
          <div class="stat-label">连续天数</div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">

      <!-- ===== HOME PAGE ===== -->
      <div class="page active" id="page-home">
        <div class="section-header">
          <div class="section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            今日习惯
          </div>
          <span class="count" id="home-count">2/4 完成</span>
        </div>
        <div class="habit-list" id="home-habits"></div>
        <button class="add-habit-btn" onclick="openAddModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加新习惯
        </button>

        <div class="mood-section">
          <div class="section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            心情速记
          </div>
          <div class="mood-card">
            <div class="mood-question">今天感觉怎么样？</div>
            <div class="mood-options">
              <button class="mood-btn" data-mood="happy" onclick="selectMood('happy')">
                <span class="mood-icon">&#128522;</span>
                <span class="mood-label">开心</span>
              </button>
              <button class="mood-btn" data-mood="neutral" onclick="selectMood('neutral')">
                <span class="mood-icon">&#128528;</span>
                <span class="mood-label">一般</span>
              </button>
              <button class="mood-btn" data-mood="sad" onclick="selectMood('sad')">
                <span class="mood-icon">&#128543;</span>
                <span class="mood-label">低落</span>
              </button>
            </div>
            <div class="mood-note-area" id="mood-note-area">
              <textarea class="mood-textarea" id="mood-note" placeholder="写点什么...（可选）" rows="2"></textarea>
              <button class="mood-submit" onclick="saveMood()">记录心情</button>
            </div>
          </div>
        </div>

        <div class="achievement-section">
          <div class="section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            我的成就
          </div>
          <div class="achievement-grid">
            <div class="achievement-card orange">
              <div class="emoji">&#128293;</div>
              <div class="title">早起达人</div>
              <div class="desc">连续早起12天</div>
            </div>
            <div class="achievement-card blue">
              <div class="emoji">&#128218;</div>
              <div class="title">阅读之星</div>
              <div class="desc">本周阅读5小时</div>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== HABITS PAGE ===== -->
      <div class="page" id="page-habits">
        <div class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          习惯管理
        </div>
        <div class="habits-stats">
          <div class="habits-stats-row">
            <div>
              <div class="habits-stats-value purple" id="habits-streak">28</div>
              <div class="habits-stats-label">总连续天数</div>
            </div>
            <div style="text-align:right">
              <div class="habits-stats-value green" id="habits-rate">50%</div>
              <div class="habits-stats-label">今日完成率</div>
            </div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="habits-progress" style="width:50%"></div>
          </div>
        </div>
        <div class="habit-list" id="habits-list"></div>
      </div>

      <!-- ===== CHAT PAGE ===== -->
      <div class="page" id="page-chat">
        <div class="chat-container">
          <div class="section-title" style="margin-bottom:12px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
            AI心灵伙伴
          </div>
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-area">
            <input type="text" class="chat-input" id="chat-input" placeholder="和AI伙伴聊聊..." onkeydown="if(event.key==='Enter')sendChat()">
            <button class="chat-send" onclick="sendChat()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- ===== MOOD PAGE ===== -->
      <div class="page" id="page-mood">
        <div class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          心情追踪
        </div>
        <div class="mood-chart-card">
          <h3>本周心情趋势</h3>
          <div class="mood-chart" id="mood-chart"></div>
        </div>
        <div class="mood-diary">
          <h3>心情日记</h3>
          <div id="mood-diary"></div>
        </div>
      </div>

    </main>

    <!-- Add Habit Modal -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeAddModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>添加新习惯</h3>
          <button class="modal-close" onclick="closeAddModal()">&times;</button>
        </div>
        <input type="text" class="modal-input" id="new-habit-input" placeholder="例如：每天背单词" onkeydown="if(event.key==='Enter')addHabit()">
        <button class="modal-submit" onclick="addHabit()">添加</button>
      </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-page="home" onclick="switchPage('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>
        首页
      </button>
      <button class="nav-btn" data-page="habits" onclick="switchPage('habits')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        习惯
      </button>
      <button class="nav-btn" data-page="chat" onclick="switchPage('chat')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        AI陪伴
      </button>
      <button class="nav-btn" data-page="mood" onclick="switchPage('mood')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        心情
      </button>
    </nav>
  </div>

  <script>
    // ==================== Data ====================
    var habits = [
      { id: 1, name: '早起晨读', category: '学习', completed: true, streak: 12 },
      { id: 2, name: '运动30分钟', category: '健康', completed: false, streak: 5 },
      { id: 3, name: '整理书桌', category: '生活', completed: false, streak: 3 },
      { id: 4, name: '睡前冥想', category: '心理', completed: true, streak: 8 }
    ];

    var moodEntries = [
      { date: '周一', mood: 'happy', note: '今天数学考试考了95分！' },
      { date: '周二', mood: 'neutral', note: '平平常常的一天' },
      { date: '周三', mood: 'happy', note: '和朋友一起打篮球，超开心' },
      { date: '周四', mood: 'sad', note: '作业有点多，压力山大' },
      { date: '周五', mood: 'happy', note: '周末快到了，期待！' },
      { date: '周六', mood: 'neutral', note: '' },
      { date: '周日', mood: 'happy', note: '完成了所有习惯打卡！' }
    ];

    var chatMessages = [
      { role: 'assistant', content: '你好！我是MindGrow AI助手。我会陪伴你养成好习惯，关注你的心理健康。今天过得怎么样？' }
    ];

    var aiResponses = [
      '太棒了！坚持早起晨读12天，你的自律让我佩服。今天想聊聊什么？',
      '我注意到你最近运动习惯有点波动，要不要我帮你制定一个更轻松的计划？',
      '学习累了的话，试试番茄工作法：专注25分钟，休息5分钟。需要我帮你计时吗？',
      '你今天的心情看起来不错！保持这种状态，一切都会越来越好的。',
      '记得多喝水哦！良好的身体状态是高效学习的基础。',
      '遇到困难不要慌，一步一步来。你可以的！',
      '你已经连续打卡好多天了，这种坚持真的很了不起！',
      '今天有没有什么让你开心的小事？分享给我听听吧！'
    ];

    var selectedMood = null;

    // ==================== Page Switch ====================
    function switchPage(page) {
      document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
      document.getElementById('page-' + page).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelector('.nav-btn[data-page="' + page + '"]').classList.add('active');
    }

    // ==================== Render Habits ====================
    function renderHabits() {
      var completed = habits.filter(function(h) { return h.completed; }).length;
      var totalStreak = habits.reduce(function(s, h) { return s + h.streak; }, 0);
      var rate = Math.round((completed / habits.length) * 100);

      // Update stats
      document.getElementById('stat-completed').textContent = completed;
      document.getElementById('stat-total').textContent = habits.length;
      document.getElementById('stat-streak').textContent = totalStreak;
      document.getElementById('home-count').textContent = completed + '/' + habits.length + ' 完成';
      document.getElementById('habits-streak').textContent = totalStreak;
      document.getElementById('habits-rate').textContent = rate + '%';
      document.getElementById('habits-progress').style.width = rate + '%';

      // Render home habits
      var homeHtml = '';
      habits.forEach(function(h) {
        homeHtml += '<div class="habit-card ' + (h.completed ? 'completed' : '') + '" onclick="toggleHabit(' + h.id + ')">' +
          '<div class="habit-check"><div class="habit-check-circle ' + (h.completed ? 'checked' : '') + '"></div></div>' +
          '<div class="habit-info"><div class="habit-name">' + h.name + '</div>' +
          '<div class="habit-meta"><span class="habit-tag">' + h.category + '</span>' +
          '<span class="habit-streak">&#128293; ' + h.streak + '天</span></div></div></div>';
      });
      document.getElementById('home-habits').innerHTML = homeHtml;
      document.getElementById('habits-list').innerHTML = homeHtml;
    }

    function toggleHabit(id) {
      habits.forEach(function(h) {
        if (h.id === id) {
          h.completed = !h.completed;
          h.streak = h.completed ? h.streak + 1 : Math.max(0, h.streak - 1);
          showToast(h.completed ? '完成打卡！' : '已取消打卡');
        }
      });
      renderHabits();
    }

    // ==================== Add Habit ====================
    function openAddModal() {
      document.getElementById('modal-overlay').classList.add('show');
      setTimeout(function() { document.getElementById('new-habit-input').focus(); }, 100);
    }
    function closeAddModal() {
      document.getElementById('modal-overlay').classList.remove('show');
      document.getElementById('new-habit-input').value = '';
    }
    function addHabit() {
      var name = document.getElementById('new-habit-input').value.trim();
      if (!name) return;
      habits.push({ id: Date.now(), name: name, category: '自定义', completed: false, streak: 0 });
      closeAddModal();
      renderHabits();
      showToast('已添加习惯：' + name);
    }

    // ==================== Mood ====================
    function selectMood(mood) {
      selectedMood = mood;
      document.querySelectorAll('.mood-btn').forEach(function(b) {
        b.classList.remove('selected');
        if (b.getAttribute('data-mood') === mood) b.classList.add('selected');
      });
      document.getElementById('mood-note-area').classList.add('show');
    }

    function saveMood() {
      if (!selectedMood) return;
      var note = document.getElementById('mood-note').value;
      moodEntries.push({ date: '今天', mood: selectedMood, note: note });
      selectedMood = null;
      document.getElementById('mood-note').value = '';
      document.getElementById('mood-note-area').classList.remove('show');
      document.querySelectorAll('.mood-btn').forEach(function(b) { b.classList.remove('selected'); });
      renderMoodPage();
      showToast('心情已记录');
    }

    function renderMoodPage() {
      // Chart
      var chartHtml = '';
      moodEntries.forEach(function(e) {
        var h = e.mood === 'happy' ? '100%' : e.mood === 'sad' ? '35%' : '65%';
        chartHtml += '<div class="mood-chart-col"><div class="mood-chart-bar ' + e.mood + '" style="height:' + h + '"></div>' +
          '<span class="mood-chart-label">' + e.date + '</span></div>';
      });
      document.getElementById('mood-chart').innerHTML = chartHtml;

      // Diary
      var icons = { happy: '&#128522;', neutral: '&#128528;', sad: '&#128543;' };
      var diaryHtml = '';
      moodEntries.forEach(function(e) {
        diaryHtml += '<div class="mood-diary-card ' + e.mood + '">' +
          '<span class="mood-diary-icon">' + icons[e.mood] + '</span>' +
          '<div><div class="mood-diary-date">' + e.date + '</div>' +
          (e.note ? '<div class="mood-diary-note">' + e.note + '</div>' : '') +
          '</div></div>';
      });
      document.getElementById('mood-diary').innerHTML = diaryHtml;
    }

    // ==================== Chat ====================
    function renderChat() {
      var html = '';
      chatMessages.forEach(function(m) {
        var avatar = m.role === 'assistant' ? '&#129302;' : '&#128100;';
        html += '<div class="chat-msg ' + m.role + '">' +
          '<div class="chat-avatar">' + avatar + '</div>' +
          '<div class="chat-bubble">' + m.content + '</div></div>';
      });
      var container = document.getElementById('chat-messages');
      container.innerHTML = html;
      container.scrollTop = container.scrollHeight;
    }

    function sendChat() {
      var input = document.getElementById('chat-input');
      var msg = input.value.trim();
      if (!msg) return;
      chatMessages.push({ role: 'user', content: msg });
      input.value = '';
      renderChat();

      // Simulate AI reply
      setTimeout(function() {
        var reply = aiResponses[Math.floor(Math.random() * aiResponses.length)];
        chatMessages.push({ role: 'assistant', content: reply });
        renderChat();
      }, 800 + Math.random() * 600);
    }

    // ==================== Toast ====================
    function showToast(msg) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 2000);
    }

    // ==================== Init ====================
    renderHabits();
    renderChat();
    renderMoodPage();
  </script>
</body>
</html>
