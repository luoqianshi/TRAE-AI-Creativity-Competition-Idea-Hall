      { name: "意面套餐", price: 42, cuisine: "西餐", type: "面食", pairings: ["管饱"], avoid: [], desc: "适合想吃西式简餐，又希望一顿解决的时候。", icon: "意" },
      { name: "三明治", price: 18, cuisine: "轻食", type: "轻食", pairings: ["清爽"], avoid: [], desc: "方便、轻盈，适合早餐、下午或不太饿的时候。", icon: "轻" },
      { name: "冒菜", price: 26, cuisine: "川菜", type: "米饭", pairings: ["配饭", "管饱"], avoid: ["辣", "香菜"], desc: "一个人也能吃火锅感，适合想吃热辣口味的时候。", icon: "辣" },
      { name: "皮蛋瘦肉粥", price: 14, cuisine: "粤菜", type: "汤粉", pairings: ["清爽"], avoid: ["猪肉"], desc: "温和舒服，适合没胃口或想吃清淡一点的时候。", icon: "粥" },
      { name: "炸鸡汉堡", price: 33, cuisine: "西餐", type: "小吃", pairings: ["管饱"], avoid: [], desc: "快乐感很强，适合想奖励自己的一餐。", icon: "堡" },
      { name: "重庆小面", price: 15, cuisine: "川菜", type: "面食", pairings: ["管饱"], avoid: ["辣", "香菜"], desc: "便宜有味道，适合想快速解决一顿饭的时候。", icon: "面" },
      { name: "芒果班戟", price: 18, cuisine: "小吃", type: "甜品", pairings: ["清爽"], avoid: ["甜"], desc: "适合作为饭后甜点，也适合下午想吃点开心的。", icon: "甜" },
      { name: "海鲜炒饭", price: 38, cuisine: "家常菜", type: "米饭", pairings: ["配饭", "管饱"], avoid: ["海鲜"], desc: "香气足、份量稳定，适合喜欢米饭但想吃点鲜味的人。", icon: "饭" },
      { name: "鳗鱼饭", price: 58, cuisine: "日料", type: "米饭", pairings: ["配饭"], avoid: ["海鲜", "甜"], desc: "价格较高但幸福感强，适合想吃好一点的时候。", icon: "鳗" },
      { name: "烤冷面", price: 12, cuisine: "小吃", type: "小吃", pairings: ["管饱"], avoid: ["香菜"], desc: "街头感强，便宜又有味道，适合突然嘴馋。", icon: "烤" },
      { name: "清汤牛肉粉", price: 20, cuisine: "家常菜", type: "汤粉", pairings: ["配汤", "清爽"], avoid: ["牛肉", "香菜"], desc: "热汤和米粉都很舒服，适合想吃清爽热乎的一餐。", icon: "粉" },
      { name: "双拼烧腊饭", price: 35, cuisine: "粤菜", type: "米饭", pairings: ["配饭", "管饱"], avoid: ["猪肉"], desc: "一次吃到两种肉，适合想丰富一点但不想纠结。", icon: "饭" },
      { name: "金枪鱼饭团", price: 13, cuisine: "日料", type: "轻食", pairings: ["清爽"], avoid: ["海鲜"], desc: "方便携带，适合不太饿或只想快速垫一下。", icon: "团" },
      { name: "芝士年糕", price: 28, cuisine: "韩餐", type: "小吃", pairings: ["适合聚餐"], avoid: ["辣", "甜"], desc: "适合分享，口感软糯，适合和朋友一起点。", icon: "糕" },
      { name: "罗宋汤套餐", price: 39, cuisine: "西餐", type: "汤粉", pairings: ["配汤", "清爽"], avoid: ["牛肉"], desc: "有汤、有主食，适合想吃温暖西式简餐的时候。", icon: "汤" },
      { name: "凉皮", price: 12, cuisine: "小吃", type: "小吃", pairings: ["清爽"], avoid: ["辣", "香菜"], desc: "清爽开胃，适合夏天或不想吃热饭的时候。", icon: "凉" },
      { name: "鱼香肉丝饭", price: 24, cuisine: "川菜", type: "米饭", pairings: ["配饭", "管饱"], avoid: ["猪肉"], desc: "经典下饭菜，酸甜咸香，适合日常午餐。", icon: "饭" }
    ];

    const price = document.getElementById("price");
    const cuisine = document.getElementById("cuisine");
    const type = document.getElementById("type");
    const pairing = document.getElementById("pairing");
    const count = document.getElementById("count");
    const recommendBtn = document.getElementById("recommendBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const resetBtn = document.getElementById("resetBtn");
    const resultGrid = document.getElementById("resultGrid");
    const summary = document.getElementById("summary");
    const resultHint = document.getElementById("resultHint");
    const favoriteList = document.getElementById("favoriteList");
    const heroDish = document.getElementById("heroDish");
    const favorites = [];

    function getAvoids() {
      return Array.from(document.querySelectorAll(".checks input:checked")).map(item => item.value);
    }

    function matchPrice(dish) {
      if (price.value === "all") return true;
      if (price.value === "low") return dish.price <= 20;
      if (price.value === "mid") return dish.price > 20 && dish.price <= 40;
      if (price.value === "high") return dish.price > 40;
      return true;
    }

    function getFilteredDishes() {
      const avoids = getAvoids();
      return dishes.filter(dish => {
        const priceOk = matchPrice(dish);
        const cuisineOk = cuisine.value === "all" || dish.cuisine === cuisine.value;
        const typeOk = type.value === "all" || dish.type === type.value;
        const pairingOk = pairing.value === "all" || dish.pairings.includes(pairing.value);
        const avoidOk = avoids.every(item => !dish.avoid.includes(item));
        return priceOk && cuisineOk && typeOk && pairingOk && avoidOk;
      });
    }

    function shuffle(array) {
      const copy = array.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function describeFilters() {
      const chips = [];
      chips.push(price.options[price.selectedIndex].text);
      chips.push(cuisine.options[cuisine.selectedIndex].text);
      chips.push(type.options[type.selectedIndex].text);
      chips.push(pairing.options[pairing.selectedIndex].text);
      getAvoids().forEach(item => chips.push(`忌口：${item}`));
      summary.innerHTML = chips.map((text, index) => `<span class="chip ${index % 2 ? "green" : ""}">${text}</span>`).join("");
    }

    function renderResults() {
      const filtered = getFilteredDishes();
      const wantedCount = Math.min(Math.max(Number(count.value) || 3, 1), 6);
      const selected = shuffle(filtered).slice(0, wantedCount);
      describeFilters();

      if (!selected.length) {
        resultHint.textContent = `没有找到符合条件的菜品，可以放宽价格、菜系或忌口条件。`;
        resultGrid.innerHTML = `
          <div class="empty">
            <div>
              <strong>暂时没有匹配结果</strong>
              <span>试试选择“不限菜系”或减少忌口条件。</span>
            </div>
          </div>
        `;
        return;
      }

      heroDish.textContent = selected[0].name;
      resultHint.textContent = `已从 ${filtered.length} 个符合条件的菜品中，为你随机推荐 ${selected.length} 款。`;
      resultGrid.innerHTML = selected.map(dish => `
        <article class="dish" data-icon="${dish.icon}">
          <div class="dish-top">
            <h3>${dish.name}</h3>
            <span class="price">约 ${dish.price} 元</span>
          </div>
          <p>${dish.desc}</p>
          <div class="meta">
            <span>${dish.cuisine}</span>
            <span>${dish.type}</span>
            ${dish.pairings.slice(0, 2).map(item => `<span>${item}</span>`).join("")}
          </div>
          <div class="dish-actions">
            <button class="save-btn" data-name="${dish.name}">加入备选</button>
          </div>
        </article>
      `).join("");
    }

    function resetFilters() {
      price.value = "all";
      cuisine.value = "all";
      type.value = "all";
      pairing.value = "all";
      count.value = 3;
      document.querySelectorAll(".checks input").forEach(item => item.checked = false);
      summary.innerHTML = "";
      resultHint.textContent = "点击“随机推荐”，马上生成适合你的菜品。";
      resultGrid.innerHTML = `
        <div class="empty">
          <div>
            <strong>还没有推荐结果</strong>
            <span>先选择条件，再点击“随机推荐”。</span>
          </div>
        </div>
      `;
    }

    function renderFavorites() {
      if (!favorites.length) {
        favoriteList.innerHTML = `<span>点击菜品卡片里的“加入备选”即可收藏</span>`;
        return;
      }
      favoriteList.innerHTML = favorites.map(name => `<span>${name}</span>`).join("");
    }

    recommendBtn.addEventListener("click", renderResults);
    shuffleBtn.addEventListener("click", renderResults);
    resetBtn.addEventListener("click", resetFilters);

    resultGrid.addEventListener("click", event => {
      const button = event.target.closest(".save-btn");
      if (!button) return;
      const name = button.dataset.name;
      if (!favorites.includes(name)) {
        favorites.push(name);
        renderFavorites();
      }
    });
  </script>
</body>
</html>
