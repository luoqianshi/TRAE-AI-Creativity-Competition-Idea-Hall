<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食光记忆 · AI美食日记 | 创意展示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(145deg, #fef6e4 0%, #f9e4d4 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      box-shadow: 0 25px 50px -10px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.6);
    }
    .header {
      background: #f58220;
      color: white;
      padding: 24px 20px 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header .sub {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 6px;
    }
    .content {
      padding: 20px;
    }
    .feature {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }
    .icon {
      width: 48px;
      height: 48px;
      background: #ffe6d5;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .desc h3 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    .desc p {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
      line-height: 1.4;
    }
    .demo-img {
      background: #fbe9e0;
      border-radius: 20px;
      padding: 16px;
      margin: 18px 0;
      text-align: center;
    }
    .demo-img .food-icon {
      font-size: 48px;
    }
    .demo-img .caption {
      margin-top: 8px;
      font-weight: 600;
      color: #a0522d;
      font-size: 16px;
    }
    .demo-img .tags {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .tag {
      background: #fff;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: #f58220;
      font-weight: 500;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .btn {
      display: block;
      width: 100%;
      background: #f58220;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
      transition: 0.2s;
    }
    .btn:hover {
      background: #e0741a;
    }
    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>🍽️ 食光记忆</h1>
      <div class="sub">AI 美食日记 · 让味道被看见</div>
    </div>
    <div class="content">
      <div class="feature">
        <div class="icon">📸</div>
        <div class="desc">
          <h3>一拍即记</h3>
          <p>拍照自动识别菜品、菜系，AI 生成菜名与口味标签。</p>
        </div>
      </div>
      <div class="feature">
        <div class="icon">🔍</div>
        <div class="desc">
          <h3>语义搜索</h3>
          <p>用自然语言查找：“上个月和妈妈吃的辣的火锅”，即刻呈现。</p>
        </div>
      </div>
      <div class="feature">
        <div class="icon">📔</div>
        <div class="desc">
          <h3>时光日记</h3>
          <p>按时间线自动整理美食故事，每一餐都有温度。</p>
        </div>
      </div>

      <div class="demo-img">
        <div class="food-icon">🍜</div>
        <div class="caption">招牌豚骨拉面</div>
        <div class="tags">
          <span class="tag">#日料</span>
          <span class="tag">#浓郁汤底</span>
          <span class="tag">#晚餐</span>
          <span class="tag">⭐ 4.5</span>
        </div>
        <div style="font-size:13px; color:#888;">2026-06-22  ·  一风堂 · 和姐妹的治愈之夜</div>
      </div>

      <button class="btn" onclick="alert('AI 美食日记卡片已生成！可以去社区分享啦 🎉')">📤 生成我的美食卡片</button>
      <div class="footer-note">TRAE Work 创意原型 · 食光记忆</div>
    </div>
  </div>
</body>
</html>
