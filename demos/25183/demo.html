<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>娱乐足迹 - 个人娱乐记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0b1a;--bg2:#12101f;--card:#16132b;--card-hover:#1c1940;
  --gold:#f5a623;--pink:#e84393;--purple:#6c5ce7;
  --text:#e8e6f0;--text-dim:#8a86a0;--text-muted:#5a5670;
  --border:rgba(255,255,255,0.06);
  --glass:rgba(22,19,43,0.75);
  --radius:14px;--radius-sm:8px;
  --font-cn:'Noto Sans SC',sans-serif;--font-en:'Outfit',sans-serif;
  --shadow:0 8px 32px rgba(0,0,0,0.4);
  --transition:0.3s cubic-bezier(0.4,0,0.2,1);
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-cn);background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;line-height:1.6;
}
body::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse at 20% 0%,rgba(108,92,231,0.08) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 100%,rgba(245,166,35,0.06) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}
/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}

/* ===== NAV ===== */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(13,11,26,0.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding:0 24px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-logo{
  font-family:var(--font-en);font-size:22px;font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;letter-spacing:-0.5px;
}
.nav-logo span{font-family:var(--font-cn);font-weight:500;font-size:18px}
.nav-actions{display:flex;gap:8px;align-items:center}
.nav-btn{
  padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:transparent;color:var(--text-dim);cursor:pointer;
  font-family:var(--font-cn);font-size:13px;transition:var(--transition);
  display:flex;align-items:center;gap:6px;
}
.nav-btn:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.nav-btn.active{background:rgba(108,92,231,0.15);border-color:rgba(108,92,231,0.3);color:var(--purple)}
.nav-btn.add-btn{
  background:linear-gradient(135deg,var(--purple),var(--pink));
  border:none;color:#fff;font-weight:500;padding:8px 20px;
}
.nav-btn.add-btn:hover{opacity:0.9;transform:translateY(-1px)}

/* ===== MAIN ===== */
.main{padding:80px 24px 40px;max-width:1200px;margin:0 auto;position:relative;z-index:1}

/* ===== FILTER BAR ===== */
.filter-bar{
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  margin-bottom:24px;padding:16px 20px;
  background:var(--glass);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
}
.filter-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filter-label{font-size:12px;color:var(--text-muted);margin-right:4px;white-space:nowrap}
.filter-chip{
  padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--text-dim);
  transition:var(--transition);white-space:nowrap;
}
.filter-chip:hover{background:rgba(255,255,255,0.05)}
.filter-chip.active{background:rgba(108,92,231,0.2);border-color:rgba(108,92,231,0.4);color:var(--purple)}
.filter-chip.type-movie.active{background:rgba(245,166,35,0.15);border-color:rgba(245,166,35,0.4);color:var(--gold)}
.filter-chip.type-tv.active{background:rgba(52,152,219,0.15);border-color:rgba(52,152,219,0.4);color:#3498db}
.filter-chip.type-theater.active{background:rgba(231,76,60,0.15);border-color:rgba(231,76,60,0.4);color:#e74c3c}
.filter-chip.type-anime.active{background:rgba(108,92,231,0.15);border-color:rgba(108,92,231,0.4);color:var(--purple)}
.filter-chip.type-script.active{background:rgba(46,204,113,0.15);border-color:rgba(46,204,113,0.4);color:#2ecc71}
.filter-chip.type-escape.active{background:rgba(26,188,156,0.15);border-color:rgba(26,188,156,0.4);color:#1abc9c}
.sort-select{
  padding:5px 12px;border-radius:20px;font-size:12px;
  border:1px solid var(--border);background:var(--card);color:var(--text-dim);
  cursor:pointer;font-family:var(--font-cn);outline:none;
}
.sort-select option{background:var(--card)}

/* ===== WATERFALL ===== */
.waterfall{
  columns:3;column-gap:20px;
}
@media(max-width:900px){.waterfall{columns:2}}
@media(max-width:560px){.waterfall{columns:1}}

.card{
  break-inside:avoid;margin-bottom:20px;
  background:var(--glass);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:var(--transition);
  animation:cardIn 0.5s ease both;
}
.card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.12);box-shadow:var(--shadow)}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card-poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--card)}
.card-body{padding:14px 16px 16px}
.card-title{
  font-size:15px;font-weight:600;margin-bottom:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.type-tag{
  font-size:11px;padding:2px 10px;border-radius:12px;font-weight:500;
  display:inline-flex;align-items:center;gap:4px;
}
.type-tag.movie{background:rgba(245,166,35,0.15);color:var(--gold)}
.type-tag.tv{background:rgba(52,152,219,0.15);color:#3498db}
.type-tag.theater{background:rgba(231,76,60,0.15);color:#e74c3c}
.type-tag.anime{background:rgba(108,92,231,0.15);color:var(--purple)}
.type-tag.script{background:rgba(46,204,113,0.15);color:#2ecc71}
.type-tag.escape{background:rgba(26,188,156,0.15);color:#1abc9c}
.card-date{font-size:11px;color:var(--text-muted);font-family:var(--font-en)}
.card-stars{display:flex;gap:2px;margin-bottom:8px}
.card-stars .star{color:var(--gold);font-size:14px}
.card-stars .star.empty{color:var(--text-muted);opacity:0.3}
.card-note{
  font-size:12px;color:var(--text-dim);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  transition:var(--transition);
}
.card:hover .card-note{-webkit-line-clamp:unset}

/* ===== TIMELINE ===== */
.timeline-view{max-width:800px;margin:0 auto}
.timeline-month{
  position:relative;padding-left:60px;margin-bottom:40px;
}
.timeline-month::before{
  content:'';position:absolute;left:24px;top:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,var(--purple),transparent);
}
.timeline-month-header{
  position:relative;margin-bottom:16px;
  display:flex;align-items:baseline;gap:12px;
}
.timeline-month-header::before{
  content:'';position:absolute;left:-44px;top:6px;width:12px;height:12px;
  border-radius:50%;background:var(--purple);border:2px solid var(--bg);
  box-shadow:0 0 12px rgba(108,92,231,0.5);
}
.timeline-month-title{font-size:18px;font-weight:600;color:var(--text)}
.timeline-month-count{
  font-size:12px;color:var(--text-muted);
  background:rgba(108,92,231,0.1);padding:2px 10px;border-radius:10px;
}
.timeline-item{
  position:relative;margin-bottom:16px;padding:12px 16px;
  background:var(--glass);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  display:flex;gap:14px;align-items:center;cursor:pointer;
  transition:var(--transition);
}
.timeline-item::before{
  content:'';position:absolute;left:-44px;top:50%;transform:translateY(-50%);
  width:6px;height:6px;border-radius:50%;background:var(--text-muted);
}
.timeline-item:hover{background:var(--card-hover);border-color:rgba(255,255,255,0.1)}
.timeline-thumb{width:48px;height:72px;border-radius:6px;object-fit:cover;flex-shrink:0}
.timeline-info{flex:1;min-width:0}
.timeline-info h4{font-size:14px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline-info .tl-meta{font-size:11px;color:var(--text-muted);display:flex;gap:8px;align-items:center}
.timeline-info .tl-stars{display:flex;gap:1px}
.timeline-info .tl-stars .star{font-size:12px;color:var(--gold)}
.timeline-info .tl-stars .star.empty{color:var(--text-muted);opacity:0.3}

/* ===== REVIEW ===== */
.review-view{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.review-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:32px;
}
@media(max-width:560px){.review-stats{grid-template-columns:1fr}}
.stat-card{
  background:var(--glass);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;text-align:center;
}
.stat-number{
  font-family:var(--font-en);font-size:48px;font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;line-height:1.2;
}
.stat-label{font-size:13px;color:var(--text-dim);margin-top:4px}
.review-charts{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-bottom:32px;
}
.chart-card{
  background:var(--glass);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;
}
.chart-card h3{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--text)}
.chart-card canvas{width:100%!important;max-height:300px}
.review-highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.highlight-card{
  background:var(--glass);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;position:relative;overflow:hidden;
}
.highlight-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--pink));
}
.highlight-card h4{font-size:13px;color:var(--text-muted);margin-bottom:8px;font-weight:400}
.highlight-card .hl-value{font-size:20px;font-weight:600;color:var(--text)}
.highlight-card .hl-sub{font-size:12px;color:var(--text-dim);margin-top:4px}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:var(--transition);
}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  width:100%;max-width:520px;max-height:85vh;overflow-y:auto;
  transform:scale(0.95) translateY(10px);transition:var(--transition);
}
.modal-overlay.show .modal{transform:scale(1) translateY(0)}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 24px;border-bottom:1px solid var(--border);
}
.modal-header h2{font-size:18px;font-weight:600}
.modal-close{
  width:32px;height:32px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.05);color:var(--text-dim);
  cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
}
.modal-close:hover{background:rgba(255,255,255,0.1);color:var(--text)}
.modal-body{padding:24px}

/* Detail Modal */
.detail-poster{width:100%;max-height:300px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:16px}
.detail-title{font-size:22px;font-weight:700;margin-bottom:8px}
.detail-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.detail-stars{display:flex;gap:3px;margin-bottom:12px}
.detail-stars .star{font-size:20px;color:var(--gold)}
.detail-stars .star.empty{color:var(--text-muted);opacity:0.3}
.detail-date{font-size:13px;color:var(--text-dim);font-family:var(--font-en)}
.detail-note{font-size:14px;color:var(--text-dim);line-height:1.7;white-space:pre-wrap;margin-bottom:20px}
.detail-actions{display:flex;gap:10px;justify-content:flex-end}
.btn{
  padding:8px 20px;border-radius:var(--radius-sm);border:none;
  cursor:pointer;font-family:var(--font-cn);font-size:13px;
  transition:var(--transition);font-weight:500;
}
.btn-primary{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
.btn-primary:hover{opacity:0.9}
.btn-danger{background:rgba(231,76,60,0.15);color:#e74c3c;border:1px solid rgba(231,76,60,0.3)}
.btn-danger:hover{background:rgba(231,76,60,0.25)}
.btn-ghost{background:rgba(255,255,255,0.05);color:var(--text-dim);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,0.1);color:var(--text)}

/* Form */
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;font-weight:500}
.form-input,.form-select,.form-textarea{
  width:100%;padding:10px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg2);color:var(--text);
  font-family:var(--font-cn);font-size:14px;outline:none;transition:var(--transition);
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:rgba(108,92,231,0.5)}
.form-textarea{resize:vertical;min-height:80px}
.form-select option{background:var(--card)}
.star-rating{display:flex;gap:6px}
.star-rating .star-btn{
  font-size:24px;background:none;border:none;cursor:pointer;
  color:var(--text-muted);opacity:0.3;transition:var(--transition);padding:0;
}
.star-rating .star-btn.active,.star-rating .star-btn:hover{color:var(--gold);opacity:1}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}

/* ===== VIEW TRANSITIONS ===== */
.view{display:none;animation:fadeIn 0.4s ease}
.view.active{display:block}

/* ===== EMPTY STATE ===== */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-muted);
}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:0.3}
.empty-state p{font-size:14px}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .nav{padding:0 16px}
  .nav-btn span.btn-text{display:none}
  .nav-btn{padding:8px 12px}
  .main{padding:72px 16px 30px}
  .filter-bar{padding:12px 14px;gap:8px}
  .review-stats{gap:12px}
  .stat-number{font-size:36px}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-logo">EntertainFoot <span>娱乐足迹</span></div>
  <div class="nav-actions">
    <button class="nav-btn active" data-view="waterfall" onclick="switchView('waterfall')">
      <span>&#9638;</span> <span class="btn-text">瀑布流</span>
    </button>
    <button class="nav-btn" data-view="timeline" onclick="switchView('timeline')">
      <span>&#9776;</span> <span class="btn-text">时间线</span>
    </button>
    <button class="nav-btn" data-view="review" onclick="switchView('review')">
      <span>&#9733;</span> <span class="btn-text">年度回顾</span>
    </button>
    <button class="nav-btn add-btn" onclick="openAddModal()">
      <span>+</span> <span class="btn-text">添加记录</span>
    </button>
  </div>
</nav>

<!-- MAIN -->
<div class="main">
  <!-- FILTER BAR -->
  <div class="filter-bar" id="filterBar">
    <div class="filter-group">
      <span class="filter-label">类型</span>
      <button class="filter-chip active" data-type="all" onclick="setFilter('all')">全部</button>
      <button class="filter-chip type-movie" data-type="电影" onclick="setFilter('电影')">电影</button>
      <button class="filter-chip type-tv" data-type="电视剧" onclick="setFilter('电视剧')">电视剧</button>
      <button class="filter-chip type-theater" data-type="话剧" onclick="setFilter('话剧')">话剧</button>
      <button class="filter-chip type-anime" data-type="动漫" onclick="setFilter('动漫')">动漫</button>
      <button class="filter-chip type-script" data-type="剧本杀" onclick="setFilter('剧本杀')">剧本杀</button>
      <button class="filter-chip type-escape" data-type="密室逃脱" onclick="setFilter('密室逃脱')">密室逃脱</button>
    </div>
    <div class="filter-group">
      <span class="filter-label">排序</span>
      <select class="sort-select" id="sortSelect" onchange="setSort(this.value)">
        <option value="date-desc">最新优先</option>
        <option value="date-asc">最早优先</option>
        <option value="rating-desc">评分最高</option>
        <option value="rating-asc">评分最低</option>
      </select>
    </div>
  </div>

  <!-- WATERFALL VIEW -->
  <div class="view active" id="waterfallView">
    <div class="waterfall" id="waterfallGrid"></div>
  </div>

  <!-- TIMELINE VIEW -->
  <div class="view" id="timelineView">
    <div class="timeline-view" id="timelineContainer"></div>
  </div>

  <!-- REVIEW VIEW -->
  <div class="view" id="reviewView">
    <div class="review-view" id="reviewContainer"></div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">详情</h2>
      <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="formTitle">添加记录</h2>
      <button class="modal-close" onclick="closeModal('formModal')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="recordForm" onsubmit="saveRecord(event)">
        <input type="hidden" id="formId">
        <div class="form-group">
          <label>标题</label>
          <input type="text" class="form-input" id="formTitleInput" required placeholder="输入作品名称">
        </div>
        <div class="form-group">
          <label>类型</label>
          <select class="form-select" id="formType" required>
            <option value="电影">电影</option>
            <option value="电视剧">电视剧</option>
            <option value="话剧">话剧</option>
            <option value="动漫">动漫</option>
            <option value="剧本杀">剧本杀</option>
            <option value="密室逃脱">密室逃脱</option>
          </select>
        </div>
        <div class="form-group">
          <label>评分</label>
          <div class="star-rating" id="formStars">
            <button type="button" class="star-btn" data-val="1" onclick="setFormRating(1)">&#9733;</button>
            <button type="button" class="star-btn" data-val="2" onclick="setFormRating(2)">&#9733;</button>
            <button type="button" class="star-btn" data-val="3" onclick="setFormRating(3)">&#9733;</button>
            <button type="button" class="star-btn" data-val="4" onclick="setFormRating(4)">&#9733;</button>
            <button type="button" class="star-btn" data-val="5" onclick="setFormRating(5)">&#9733;</button>
          </div>
        </div>
        <div class="form-group">
          <label>日期</label>
          <input type="date" class="form-input" id="formDate" required>
        </div>
        <div class="form-group">
          <label>感想</label>
          <textarea class="form-textarea" id="formNote" placeholder="写下你的感想..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal('formModal')">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
// ===== DATA =====
const TYPE_ICONS = {

// ===== STATE =====
let records = [];
let currentFilter = 'all';
let currentSort = 'date-desc';
let currentView = 'waterfall';
let formRating = 0;
let chartInstances = {};

// ===== INIT =====
function init() {
  const stored = localStorage.getItem('entertainment_records');
  if (stored) {
    records = JSON.parse(stored);
  } else {
    records = JSON.parse(JSON.stringify(SAMPLE_DATA));
    saveToStorage();
  }
  renderCurrentView();
}

function saveToStorage() {
  localStorage.setItem('entertainment_records', JSON.stringify(records));
}

function getPosterUrl(title) {
  return 'https://picsum.photos/seed/' + encodeURIComponent(title) + '/300/450';
}

// ===== VIEW SWITCH =====
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-btn[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(view + 'View').classList.add('active');
  // Show/hide filter bar
  document.getElementById('filterBar').style.display = view === 'waterfall' ? '' : 'none';
  renderCurrentView();
}

function renderCurrentView() {
  if (currentView === 'waterfall') renderWaterfall();
  else if (currentView === 'timeline') renderTimeline();
  else if (currentView === 'review') renderReview();
}

// ===== FILTER & SORT =====
function setFilter(type) {
  currentFilter = type;
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.type === type);
  });
  renderWaterfall();
}

function setSort(sort) {
  currentSort = sort;
  renderWaterfall();
}

function getFilteredSorted() {
  let list = [...records];
  if (currentFilter !== 'all') {
    list = list.filter(r => r.type === currentFilter);
  }
  switch (currentSort) {
    case 'date-desc': list.sort((a,b) => new Date(b.date) - new Date(a.date)); break;
    case 'date-asc': list.sort((a,b) => new Date(a.date) - new Date(b.date)); break;
    case 'rating-desc': list.sort((a,b) => b.rating - a.rating); break;
    case 'rating-asc': list.sort((a,b) => a.rating - b.rating); break;
  }
  return list;
}

// ===== STARS HTML =====
function starsHTML(rating, size) {
  size = size || 14;
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += '<span class="star' + (i > rating ? ' empty' : '') + '" style="font-size:' + size + 'px">&#9733;</span>';
  }
  return html;
}

// ===== WATERFALL =====
function renderWaterfall() {
  const grid = document.getElementById('waterfallGrid');
  const list = getFilteredSorted();
  if (list.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">&#127916;</div><p>暂无记录，点击右上角添加你的第一条娱乐足迹吧</p></div>';
    return;
  }
  grid.innerHTML = list.map((r, i) => {
    const cls = TYPE_CLASS[r.type] || 'movie';
    const icon = TYPE_ICONS[r.type] || '';
    return '<div class="card" style="animation-delay:' + (i * 0.05) + 's" onclick="openDetail(' + r.id + ')">' +
      '<img class="card-poster" src="' + getPosterUrl(r.title) + '" alt="' + r.title + '" loading="lazy">' +
      '<div class="card-body">' +
        '<div class="card-title">' + r.title + '</div>' +
        '<div class="card-meta">' +
          '<span class="type-tag ' + cls + '">' + icon + ' ' + r.type + '</span>' +
          '<span class="card-date">' + r.date + '</span>' +
        '</div>' +
        '<div class="card-stars">' + starsHTML(r.rating) + '</div>' +
        '<div class="card-note">' + (r.note || '') + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ===== TIMELINE =====
function renderTimeline() {
  const container = document.getElementById('timelineContainer');
  const sorted = [...records].sort((a,b) => new Date(b.date) - new Date(a.date));
  if (sorted.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">&#128197;</div><p>暂无记录</p></div>';
    return;
  }
  const months = {};
  sorted.forEach(r => {
    const m = r.date.substring(0, 7); // YYYY-MM
    if (!months[m]) months[m] = [];
    months[m].push(r);
  });
  const monthKeys = Object.keys(months).sort((a,b) => b.localeCompare(a));
  container.innerHTML = monthKeys.map(m => {
    const items = months[m];
    const [y, mo] = m.split('-');
    const label = y + '年' + parseInt(mo) + '月';
    return '<div class="timeline-month">' +
      '<div class="timeline-month-header">' +
        '<span class="timeline-month-title">' + label + '</span>' +
        '<span class="timeline-month-count">' + items.length + ' 条记录</span>' +
      '</div>' +
      items.map(r => {
        const cls = TYPE_CLASS[r.type] || 'movie';
        const icon = TYPE_ICONS[r.type] || '';
        return '<div class="timeline-item" onclick="openDetail(' + r.id + ')">' +
          '<img class="timeline-thumb" src="' + getPosterUrl(r.title) + '" alt="' + r.title + '" loading="lazy">' +
          '<div class="timeline-info">' +
            '<h4>' + r.title + '</h4>' +
            '<div class="tl-meta">' +
              '<span class="type-tag ' + cls + '" style="font-size:10px;padding:1px 8px">' + icon + ' ' + r.type + '</span>' +
              '<span class="card-date">' + r.date + '</span>' +
              '<span class="tl-stars">' + starsHTML(r.rating, 12) + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }).join('');
}

// ===== REVIEW =====
function renderReview() {
  const container = document.getElementById('reviewContainer');
  if (records.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">&#128202;</div><p>暂无数据，添加记录后即可查看年度回顾</p></div>';
    return;
  }
  const totalCount = records.length;
  const types = [...new Set(records.map(r => r.type))];
  const typeCount = types.length;
  const avgRating = (records.reduce((s,r) => s + r.rating, 0) / totalCount).toFixed(1);

  // Find highlights
  const highest = records.reduce((a,b) => a.rating > b.rating ? a : b);
  const typeCounts = {};
  records.forEach(r => { typeCounts[r.type] = (typeCounts[r.type] || 0) + 1; });
  const mostType = Object.entries(typeCounts).sort((a,b) => b[1] - a[1])[0];
  const monthCounts = {};
  records.forEach(r => { const m = r.date.substring(0,7); monthCounts[m] = (monthCounts[m] || 0) + 1; });
  const activeMonth = Object.entries(monthCounts).sort((a,b) => b[1] - a[1])[0];
  const [ay, amo] = activeMonth[0].split('-');
  const activeMonthLabel = ay + '年' + parseInt(amo) + '月';

  container.innerHTML =
    '<div class="review-stats">' +
      '<div class="stat-card"><div class="stat-number">' + totalCount + '</div><div class="stat-label">总记录数</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + typeCount + '</div><div class="stat-label">涵盖类型</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + avgRating + '</div><div class="stat-label">平均评分</div></div>' +
    '</div>' +
    '<div class="review-charts">' +
      '<div class="chart-card"><h3>类型占比</h3><canvas id="chartPie"></canvas></div>' +
      '<div class="chart-card"><h3>月度趋势</h3><canvas id="chartLine"></canvas></div>' +
      '<div class="chart-card"><h3>评分分布</h3><canvas id="chartBar"></canvas></div>' +
    '</div>' +
    '<div class="review-highlights">' +
      '<div class="highlight-card"><h4>最高评分</h4><div class="hl-value">' + highest.title + '</div><div class="hl-sub">' + starsHTML(highest.rating, 16) + ' ' + highest.rating + '分</div></div>' +
      '<div class="highlight-card"><h4>最多类型</h4><div class="hl-value">' + mostType[0] + '</div><div class="hl-sub">共 ' + mostType[1] + ' 条记录</div></div>' +
      '<div class="highlight-card"><h4>最活跃月份</h4><div class="hl-value">' + activeMonthLabel + '</div><div class="hl-sub">记录了 ' + activeMonth[1] + ' 条</div></div>' +
    '</div>';

  // Destroy old charts
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  // Pie Chart - Type Distribution
  const pieLabels = Object.keys(typeCounts);
  const pieData = Object.values(typeCounts);
  const pieColors = pieLabels.map(t => TYPE_COLORS[t] || '#888');
  chartInstances.pie = new Chart(document.getElementById('chartPie'), {
    type: 'doughnut',
    data: {
      labels: pieLabels,
      datasets: [{data: pieData, backgroundColor: pieColors, borderColor: 'rgba(22,19,43,0.8)', borderWidth: 2}]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: {
        legend: {position: 'bottom', labels: {color: '#8a86a0', font: {family: "'Noto Sans SC'", size: 12}, padding: 16}}
      }
    }
  });

  // Line Chart - Monthly Trend
  const sortedMonths = Object.keys(monthCounts).sort();
  const lineLabels = sortedMonths.map(m => { const [y, mo] = m.split('-'); return parseInt(mo) + '月'; });
  const lineData = sortedMonths.map(m => monthCounts[m]);
  chartInstances.line = new Chart(document.getElementById('chartLine'), {
    type: 'line',
    data: {
      labels: lineLabels,
      datasets: [{
        label: '记录数',
        data: lineData,
        borderColor: '#6c5ce7',
        backgroundColor: 'rgba(108,92,231,0.1)',
        fill: true, tension: 0.4,
        pointBackgroundColor: '#6c5ce7',
        pointBorderColor: '#16132b', pointBorderWidth: 2, pointRadius: 5
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      scales: {
        x: {ticks: {color: '#5a5670', font: {family: "'Noto Sans SC'", size: 11}}, grid: {color: 'rgba(255,255,255,0.04)'}},
        y: {beginAtZero: true, ticks: {color: '#5a5670', stepSize: 1, font: {family: "'Outfit'", size: 11}}, grid: {color: 'rgba(255,255,255,0.04)'}}
      },
      plugins: {legend: {display: false}}
    }
  });

  // Bar Chart - Rating Distribution
  const ratingDist = [0,0,0,0,0];
  records.forEach(r => { ratingDist[r.rating - 1]++; });
  chartInstances.bar = new Chart(document.getElementById('chartBar'), {
    type: 'bar',
    data: {
      labels: ['1星','2星','3星','4星','5星'],
      datasets: [{
        label: '数量',
        data: ratingDist,
        backgroundColor: ['rgba(231,76,60,0.6)','rgba(243,156,18,0.6)','rgba(241,196,15,0.6)','rgba(46,204,113,0.6)','rgba(245,166,35,0.8)'],
        borderColor: ['#e74c3c','#f39c12','#f1c40f','#2ecc71','#f5a623'],
        borderWidth: 1, borderRadius: 6
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      scales: {
        x: {ticks: {color: '#5a5670', font: {family: "'Noto Sans SC'", size: 11}}, grid: {display: false}},
        y: {beginAtZero: true, ticks: {color: '#5a5670', stepSize: 1, font: {family: "'Outfit'", size: 11}}, grid: {color: 'rgba(255,255,255,0.04)'}}
      },
      plugins: {legend: {display: false}}
    }
  });
}

// ===== DETAIL MODAL =====
function openDetail(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  const cls = TYPE_CLASS[r.type] || 'movie';
  const icon = TYPE_ICONS[r.type] || '';
  document.getElementById('detailTitle').textContent = r.title;
  document.getElementById('detailBody').innerHTML =
    '<img class="detail-poster" src="' + getPosterUrl(r.title) + '" alt="' + r.title + '">' +
    '<div class="detail-title">' + r.title + '</div>' +
    '<div class="detail-meta">' +
      '<span class="type-tag ' + cls + '">' + icon + ' ' + r.type + '</span>' +
      '<span class="detail-date">' + r.date + '</span>' +
    '</div>' +
    '<div class="detail-stars">' + starsHTML(r.rating, 20) + '</div>' +
    '<div class="detail-note">' + (r.note || '暂无感想') + '</div>' +
    '<div class="detail-actions">' +
      '<button class="btn btn-ghost" onclick="closeModal(\'detailModal\');openEditModal(' + r.id + ')">编辑</button>' +
      '<button class="btn btn-danger" onclick="deleteRecord(' + r.id + ')">删除</button>' +
    '</div>';
  openModal('detailModal');
}

// ===== ADD/EDIT MODAL =====
function openAddModal() {
  document.getElementById('formTitle').textContent = '添加记录';
  document.getElementById('formId').value = '';
  document.getElementById('formTitleInput').value = '';
  document.getElementById('formType').value = '电影';
  document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('formNote').value = '';
  setFormRating(0);
  openModal('formModal');
}

function openEditModal(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  document.getElementById('formTitle').textContent = '编辑记录';
  document.getElementById('formId').value = r.id;
  document.getElementById('formTitleInput').value = r.title;
  document.getElementById('formType').value = r.type;
  document.getElementById('formDate').value = r.date;
  document.getElementById('formNote').value = r.note || '';
  setFormRating(r.rating);
  openModal('formModal');
}

function setFormRating(val) {
  formRating = val;
  document.querySelectorAll('#formStars .star-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.val) <= val);
  });
}

function saveRecord(e) {
  e.preventDefault();
  const id = document.getElementById('formId').value;
  const title = document.getElementById('formTitleInput').value.trim();
  const type = document.getElementById('formType').value;
  const date = document.getElementById('formDate').value;
  const note = document.getElementById('formNote').value.trim();

  if (!title || !date || formRating === 0) {
    alert('请填写完整信息并选择评分');
    return;
  }

  if (id) {
    // Edit
    const idx = records.findIndex(r => r.id === parseInt(id));
    if (idx !== -1) {
      records[idx] = {...records[idx], title, type, rating: formRating, date, note};
    }
  } else {
    // Add
    const newId = records.length > 0 ? Math.max(...records.map(r => r.id)) + 1 : 1;
    records.push({id: newId, title, type, rating: formRating, date, note});
  }

  saveToStorage();
  closeModal('formModal');
  renderCurrentView();
}

function deleteRecord(id) {
  if (!confirm('确定要删除这条记录吗？')) return;
  records = records.filter(r => r.id !== id);
  saveToStorage();
  closeModal('detailModal');
  renderCurrentView();
}

// ===== MODAL HELPERS =====
function openModal(id) {
  document.getElementById(id).classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
  document.body.style.overflow = '';
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === this) closeModal(this.id);
  });
});

// Close modal on Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.show').forEach(m => closeModal(m.id));
  }
});

// ===== INIT =====
init();
</script>
