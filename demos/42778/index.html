<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1预测王者 - 2026赛季</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --f1-red: #e10600;
      --f1-dark: #1a1a2e;
      --f1-silver: #c0c0c0;
      --f1-yellow: #ffed00;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      color: white;
      min-height: 100vh;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(225, 6, 0, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(225, 6, 0, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(225, 6, 0, 0.2);
      z-index: 100;
    }

    .navbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--f1-red);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      font-size: 14px;
    }

    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      font-size: 18px;
    }

    .nav-links {
      display: flex;
      gap: 8px;
    }

    .nav-link {
      padding: 8px 16px;
      border-radius: 8px;
      color: #9ca3af;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-link:hover {
      color: white;
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-link.active {
      color: white;
      background: var(--f1-red);
    }

    /* Main Content */
    .main-content {
      padding-top: 80px;
      padding-bottom: 60px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 60px 0;
    }

    .hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .hero h1 .red {
      color: var(--f1-red);
    }

    .hero p {
      color: #9ca3af;
      font-size: 18px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Section */
    .section {
      margin-bottom: 48px;
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Cards */
    .card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s;
    }

    .card:hover {
      border-color: rgba(225, 6, 0, 0.5);
      transform: translateY(-2px);
    }

    /* Grid */
    .grid {
      display: grid;
      gap: 24px;
    }

    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    @media (max-width: 1024px) {
      .grid-4 { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .hero h1 { font-size: 32px; }
      .nav-link { padding: 8px 10px; font-size: 12px; }
      .nav-link span { display: none; }
    }

    /* Next Race Card */
    .next-race-card {
      background: linear-gradient(135deg, rgba(225, 6, 0, 0.1) 0%, transparent 100%);
      border: 1px solid rgba(225, 6, 0, 0.3);
      border-radius: 16px;
      padding: 24px;
    }

    .race-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .race-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .race-circuit {
      color: #9ca3af;
    }

    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }

    .status-completed { background: #16a34a; }
    .status-upcoming { background: var(--f1-red); animation: pulse-glow 2s infinite; }
    .status-future { background: #4b5563; }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 10px rgba(225, 6, 0, 0.3); }
      50% { box-shadow: 0 0 25px rgba(225, 6, 0, 0.6); }
    }

    /* Countdown */
    .countdown {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .countdown-block {
      background: linear-gradient(135deg, rgba(225, 6, 0, 0.2) 0%, transparent 100%);
      border: 1px solid rgba(225, 6, 0, 0.3);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
      min-width: 60px;
    }

    .countdown-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: bold;
    }

    .countdown-label {
      font-size: 12px;
      color: #9ca3af;
    }

    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
      font-size: 14px;
    }

    .btn-primary {
      background: var(--f1-red);
      color: white;
    }

    .btn-primary:hover {
      background: #c00500;
    }

    /* Weather */
    .weather-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .weather-item {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px;
    }

    .weather-label {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .weather-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: bold;
    }

    .weather-emoji {
      font-size: 48px;
    }

    /* Standings */
    .standing-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 8px;
      transition: background 0.2s;
    }

    .standing-item:hover {
      background: rgba(255,255,255,0.1);
    }

    .position {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      font-size: 14px;
    }

    .pos-1 { background: #eab308; color: #000; }
    .pos-2 { background: #9ca3af; color: #000; }
    .pos-3 { background: #b45309; color: #fff; }
    .pos-other { background: rgba(255,255,255,0.1); color: #fff; }

    .driver-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: white;
    }

    .driver-info {
      flex: 1;
      min-width: 0;
    }

    .driver-name {
      font-weight: 500;
      margin-bottom: 2px;
    }

    .driver-team {
      font-size: 12px;
      color: #9ca3af;
    }

    .driver-points {
      text-align: right;
    }

    .driver-points .num {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: bold;
      color: var(--f1-red);
    }

    .driver-points .label {
      font-size: 11px;
      color: #9ca3af;
    }

    /* Race Card */
    .race-card {
      cursor: pointer;
    }

    .race-card-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .race-info-block {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px;
    }

    .race-info-label {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .race-info-value {
      font-weight: 600;
      font-size: 14px;
    }

    /* Prediction Winner */
    .prediction-winner {
      background: linear-gradient(135deg, rgba(225, 6, 0, 0.2) 0%, transparent 100%);
      border: 1px solid rgba(225, 6, 0, 0.3);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
    }

    .winner-display {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
    }

    .winner-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: bold;
      color: white;
    }

    .winner-info h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .winner-info p {
      color: #9ca3af;
    }

    .winner-prob {
      margin-left: auto;
      text-align: right;
    }

    .winner-prob .num {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      font-weight: 900;
      color: var(--f1-red);
    }

    .winner-prob .label {
      color: #9ca3af;
    }

    /* Podium */
    .podium-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .podium-item {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px;
    }

    .podium-rank {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      margin-right: 12px;
    }

    .podium-driver {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .podium-driver .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
      color: white;
      margin-right: 8px;
    }

    .podium-prob {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: bold;
      color: var(--f1-red);
    }

    /* Chart */
    .chart-container {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .chart-canvas {
      width: 100%;
      height: 350px;
    }

    /* Driver Card */
    .driver-card {
      cursor: pointer;
    }

    .driver-card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .driver-card-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-item {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      font-size: 16px;
    }

    .stat-label {
      font-size: 10px;
      color: #6b7280;
    }

    /* Race Selector */
    .race-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .race-option {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .race-option:hover {
      border-color: rgba(255,255,255,0.3);
    }

    .race-option.active {
      border-color: var(--f1-red);
      background: rgba(225, 6, 0, 0.1);
    }

    .race-option h4 {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .race-option p {
      font-size: 12px;
      color: #9ca3af;
    }

    /* Quick Stats */
    .quick-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 48px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
    }

    .stat-card .num {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .stat-card .label {
      color: #9ca3af;
    }

    .stat-card.red .num {
      color: var(--f1-red);
    }

    /* Team Card */
    .team-card {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .team-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      color: white;
    }

    .team-info h3 {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .team-info p {
      font-size: 13px;
      color: #9ca3af;
    }

    .team-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .team-detail-item {
      font-size: 12px;
    }

    .team-detail-item .label {
      color: #6b7280;
    }

    /* Back Button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #9ca3af;
      cursor: pointer;
      margin-bottom: 24px;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: white;
    }

    /* Section Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .see-all {
      color: var(--f1-red);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
    }

    .see-all:hover {
      gap: 8px;
    }

    /* Detail Page */
    .detail-profile {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
    }

    .detail-avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: bold;
      color: white;
    }

    .detail-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .detail-meta {
      display: flex;
      gap: 16px;
      color: #9ca3af;
    }

    .detail-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    @media (max-width: 768px) {
      .detail-stats { grid-template-columns: repeat(2, 1fr); }
      .detail-avatar { width: 80px; height: 80px; font-size: 24px; }
      .detail-name { font-size: 24px; }
      .podium-grid { grid-template-columns: 1fr; }
      .winner-display { flex-direction: column; text-align: center; }
      .winner-prob { margin-left: 0; }
      .race-selector { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="logo" onclick="showPage('home')">
        <div class="logo-icon">F1</div>
        <span class="logo-text">预测王者</span>
      </div>
      <div class="nav-links">
        <div class="nav-link active" onclick="showPage('home')">首页</div>
        <div class="nav-link" onclick="showPage('schedule')">赛程</div>
        <div class="nav-link" onclick="showPage('predictions')">预测</div>
        <div class="nav-link" onclick="showPage('drivers')">车手</div>
        <div class="nav-link" onclick="showPage('teams')">车队</div>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <div class="container">

      <!-- ===================== HOME PAGE ===================== -->
      <div id="page-home" class="page active">
        <div class="hero">
          <h1><span class="red">F1</span> 预测王者</h1>
          <p>基于赛道数据、天气状况和车手历史表现，提供精准的比赛预测分析</p>
        </div>

        <!-- Next Race -->
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">🏁 下一场比赛</h2>
            <div class="see-all" onclick="showPage('predictions')">查看预测 →</div>
          </div>
          <div class="grid grid-2">
            <div id="next-race-card" class="next-race-card"></div>
            <div id="next-weather-card" class="card"></div>
          </div>
        </div>

        <!-- Quick Stats -->
        <div class="quick-stats">
          <div class="stat-card red">
            <div class="num">23</div>
            <div class="label">赛季总比赛</div>
          </div>
          <div class="stat-card">
            <div class="num">20</div>
            <div class="label">现役车手</div>
          </div>
          <div class="stat-card">
            <div class="num">10</div>
            <div class="label">参赛车队</div>
          </div>
        </div>

        <!-- Standings & Upcoming -->
        <div class="grid grid-2">
          <div class="card">
            <h3 class="section-title" style="font-size: 20px;">🏆 积分榜 TOP 10</h3>
            <div id="home-standings"></div>
          </div>
          <div class="card">
            <h3 class="section-title" style="font-size: 20px;">📅 即将到来</h3>
            <div id="home-upcoming"></div>
          </div>
        </div>
      </div>

      <!-- ===================== SCHEDULE PAGE ===================== -->
      <div id="page-schedule" class="page">
        <div class="hero">
          <h1>2026赛季赛程</h1>
          <p>共23场大奖赛，覆盖5大洲</p>
        </div>

        <div style="display:flex; gap:24px; justify-content:center; margin-bottom:32px;">
          <span style="color:#9ca3af; font-size:14px;">✅ 已完赛 <span id="completed-count">10</span>场</span>
          <span style="color:#9ca3af; font-size:14px;">⏰ 未开始 <span id="upcoming-count">13</span>场</span>
        </div>

        <div class="section">
          <h2 class="section-title">✅ 已完赛</h2>
          <div id="completed-races" class="grid grid-3"></div>
        </div>

        <div class="section">
          <h2 class="section-title">⏰ 即将开始 / 未开始</h2>
          <div id="upcoming-races" class="grid grid-3"></div>
        </div>
      </div>

      <!-- ===================== PREDICTIONS PAGE ===================== -->
      <div id="page-predictions" class="page">
        <div class="hero">
          <h1>🎯 预测中心</h1>
          <p>基于AI算法的F1比赛预测分析</p>
        </div>

        <h3 class="section-title" style="font-size: 18px;">选择比赛</h3>
        <div id="prediction-race-selector" class="race-selector"></div>

        <div id="prediction-content"></div>
      </div>

      <!-- ===================== RACE DETAIL PAGE ===================== -->
      <div id="page-race-detail" class="page">
        <div class="back-btn" onclick="showPage('schedule')">← 返回赛程</div>
        <div id="race-detail-content"></div>

    function calculatePrediction(raceId) {
      const profile = trackProfiles[raceId] || { type: 'permanent', avgSpeed: 'medium', tireDegradation: 'medium' };
      const weather = weatherMap[raceId];

      const scores = drivers.map(driver => {
        let trackSuitability = 50;
        
        if (profile.type === 'street') {
          trackSuitability = ['lec', 'ham', 'ver', 'nor', 'alo'].includes(driver.id) ? 85 : 60;
        } else if (profile.avgSpeed === 'high') {
          trackSuitability = ['ver', 'nor', 'ham', 'lec', 'rus'].includes(driver.id) ? 85 : 55;
        } else if (profile.avgSpeed === 'low') {
          trackSuitability = ['alo', 'ham', 'ver', 'rus', 'nor'].includes(driver.id) ? 80 : 60;
        }

        const recentForm = Math.max(20, 100 - (driver.position - 1) * 5);
        
        const history = historicalWins[raceId] || [];
        const winCount = history.filter(w => w === driver.id).length;
        const historicalPerformance = Math.min(95, 40 + winCount * 15);

        const teamIndex = teams.findIndex(t => t.drivers.includes(driver.id));
        const teamStrength = Math.max(40, 100 - (teamIndex * 6));

        let weatherBonus = 0;
        if (weather.condition === 'rainy') {
          weatherBonus = ['ver', 'ham', 'alo', 'nor'].includes(driver.id) ? 15 : 0;
        } else if (weather.condition === 'sunny' && profile.tireDegradation === 'high') {
          weatherBonus = ['ham', 'lec', 'alo'].includes(driver.id) ? 10 : 0;
        }

        const totalScore = (
          trackSuitability * 0.30 +
          recentForm * 0.25 +
          historicalPerformance * 0.25 +
          teamStrength * 0.20 +
          weatherBonus
        );

        return {
          driverId: driver.id,
          driverName: driver.name,
          team: driver.team,
          score: Math.min(100, Math.max(0, totalScore)),
        };
      });

        ...s,
        probability: Math.round((s.score / totalScore) * 10000) / 100,
      })).sort((a, b) => b.probability - a.probability);

      return {
        raceId,
        predictions,
        winner: predictions[0].driverId,
        podium: predictions.slice(0, 3).map(p => p.driverId),
        fastestLap: predictions[Math.floor(Math.random() * 5)].driverId,
      };
    }

          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#9ca3af' } },
              y: { grid: { display: false }, ticks: { color: 'white' } }
            }
          }
        });

        startRaceDetailCountdown(race.date + 'T' + race.time);
      }
    }

    // ==================== COUNTDOWN ====================
    let countdownInterval = null;

    function startCountdown(targetDateTime) {
      if (countdownInterval) clearInterval(countdownInterval);

      function update() {
        const target = new Date(targetDateTime);
        const now = new Date();
        const diff = target - now;

        if (diff <= 0) {
          document.getElementById('countdown').innerHTML = '<div style="color:var(--f1-red); font-weight:bold;">比赛已开始！</div>';
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById('countdown').innerHTML = `
          <div class="countdown-block">
            <div class="countdown-num">${String(days).padStart(2, '0')}</div>
            <div class="countdown-label">天</div>
          </div>
          <div class="countdown-block">
            <div class="countdown-num">${String(hours).padStart(2, '0')}</div>
            <div class="countdown-label">时</div>
          </div>
          <div class="countdown-block">
            <div class="countdown-num">${String(minutes).padStart(2, '0')}</div>
            <div class="countdown-label">分</div>
          </div>
          <div class="countdown-block">
            <div class="countdown-num">${String(seconds).padStart(2, '0')}</div>
            <div class="countdown-label">秒</div>
          </div>
        `;
      }

      update();
      countdownInterval = setInterval(update, 1000);
    }

    let raceDetailCountdownInterval = null;

    function startRaceDetailCountdown(targetDateTime) {
      if (raceDetailCountdownInterval) clearInterval(raceDetailCountdownInterval);

      function update() {
        const el = document.getElementById('race-detail-countdown');
        if (!el) return;

        const target = new Date(targetDateTime);
        const now = new Date();
        const diff = target - now;

        if (diff <= 0) {
          el.innerHTML = '<div style="color:var(--f1-red); font-weight:bold;">比赛已开始！</div>';
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        el.innerHTML = `
          <div class="countdown-block">
            <div class="countdown-num">${String(days).padStart(2, '0')}</div>
            <div class="countdown-label">天</div>
          </div>
          <div class="countdown-block">
            <div class="countdown-num">${String(hours).padStart(2, '0')}</div>
            <div class="countdown-label">时</div>
          </div>
          <div class="countdown-block">
            <div class="countdown-num">${String(minutes).padStart(2, '0')}</div>
            <div class="countdown-label">分</div>
          </div>
          <div class="countdown-block">
            <div class="countdown-num">${String(seconds).padStart(2, '0')}</div>
            <div class="countdown-label">秒</div>
          </div>
        `;
      }

      update();
      raceDetailCountdownInterval = setInterval(update, 1000);
    }

    // ==================== NAVIGATION ====================
    function showPage(pageName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + pageName).classList.add('active');

      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      const navMap = {
        'home': 0, 'schedule': 1, 'predictions': 2, 'drivers': 3, 'teams': 4,
        'race-detail': 1, 'driver-detail': 3,
      };
      const navIndex = navMap[pageName];
      if (navIndex !== undefined) {
        document.querySelectorAll('.nav-link')[navIndex].classList.add('active');
      }

      window.scrollTo(0, 0);
    }

    function showDriverDetail(driverId) {
      renderDriverDetail(driverId);
      showPage('driver-detail');
    }

    // ==================== INIT ====================
    function init() {
      renderHomeNextRace();
      renderStandings(document.getElementById('home-standings'), 10);
      renderHomeUpcoming();
      renderSchedule();
      renderPredictionsPage();
      renderDrivers();
      renderTeams();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
