<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小星球邮差 - Little Planet Messenger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a1a; font-family: 'Noto Sans SC', sans-serif; }
canvas { display: block; }

#ui-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}

/* Quest Panel */
#quest-panel {
  position: absolute; top: 16px; right: 16px;
  background: rgba(20,20,40,0.65);
  backdrop-filter: blur(16px);
  border-radius: 14px; padding: 14px 18px;
  color: #fff; min-width: 200px; max-width: 240px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  pointer-events: auto; transition: opacity 0.5s;
}
#quest-panel h3 {
  font-size: 12px; margin-bottom: 8px;
  color: rgba(255,215,0,0.9); letter-spacing: 2px;
  text-transform: uppercase; font-weight: 300;
}
#quest-list { font-size: 12px; line-height: 2; }
.quest-done { color: rgba(120,255,120,0.9); }
.quest-active { color: #fff; font-weight: 400; }
.quest-locked { color: rgba(255,255,255,0.25); }

/* Letter indicator */
#letter-indicator {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(255,215,0,0.15);
  backdrop-filter: blur(12px);
  border-radius: 20px; padding: 6px 18px;
  color: #ffd700; font-size: 13px;
  border: 1px solid rgba(255,215,0,0.2);
  display: none; transition: opacity 0.3s;
  animation: floatIn 0.5s ease-out;
}
@keyframes floatIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* Interact hint */
#interact-hint {
  position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%);
  background: rgba(255,215,0,0.15);
  backdrop-filter: blur(8px);
  border-radius: 10px; padding: 6px 14px;
  color: rgba(255,215,0,0.9); font-size: 12px;
  border: 1px solid rgba(255,215,0,0.2);
  display: none; animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
  50% { opacity: 0.7; transform: translateX(-50%) scale(0.97); }
}

/* Message box */
#message-box {
  position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: rgba(15,15,35,0.8);
  backdrop-filter: blur(20px);
  border-radius: 16px; padding: 20px 28px;
  color: #fff; max-width: 480px; width: 90%; text-align: left;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  font-size: 14px; line-height: 1.9;
  opacity: 0; transition: opacity 0.3s;
  pointer-events: auto; cursor: pointer;
  display: none;
}
#message-box.show { display: block; opacity: 1; }
#message-box .speaker { color: #ffd700; font-weight: 700; margin-bottom: 4px; font-size: 13px; }
#message-box .content { color: rgba(255,255,255,0.9); }
#message-box .letter-text { 
  color: rgba(255,215,0,0.8); font-style: italic; 
  border-left: 2px solid rgba(255,215,0,0.3); 
  padding-left: 12px; margin: 8px 0;
}
#message-box .hint { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 10px; text-align: right; }

/* Title screen */
#title-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 40%, #2a1a3e 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; transition: opacity 1.2s ease-out;
}
#title-screen .planet-icon {
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #7ec850, #4a8030);
  box-shadow: 0 0 60px rgba(126,200,80,0.3), inset -10px -10px 20px rgba(0,0,0,0.3);
  margin-bottom: 30px; position: relative;
  animation: floatPlanet 4s infinite ease-in-out;
}
#title-screen .planet-icon::after {
  content: ''; position: absolute; top: 15%; left: 20%;
  width: 25%; height: 20%; border-radius: 50%;
  background: rgba(255,255,255,0.15);
}
@keyframes floatPlanet {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
#title-screen h1 {
  font-size: 36px; color: #fff; margin-bottom: 6px;
  font-weight: 300; letter-spacing: 8px;
}
#title-screen .subtitle {
  font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 40px;
  letter-spacing: 4px; text-transform: uppercase;
}
#start-btn {
  background: transparent;
  border: 1px solid rgba(255,215,0,0.4);
  border-radius: 30px; padding: 12px 40px;
  font-size: 14px; color: #ffd700; font-weight: 300;
  cursor: pointer; pointer-events: auto;
  letter-spacing: 4px; transition: all 0.3s;
}
#start-btn:hover {
  background: rgba(255,215,0,0.1);
  border-color: rgba(255,215,0,0.7);
  box-shadow: 0 0 30px rgba(255,215,0,0.15);
}
#controls-hint {
  margin-top: 30px; color: rgba(255,255,255,0.25); font-size: 11px;
  text-align: center; line-height: 2.2; letter-spacing: 1px;
}

/* Completion overlay */
#completion-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
  z-index: 50; pointer-events: auto;
}
#completion-overlay.show { display: flex; }
#completion-content {
  text-align: center; color: #fff;
  animation: scaleIn 0.8s ease-out;
}
@keyframes scaleIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
#completion-content h2 { font-size: 28px; font-weight: 300; margin-bottom: 12px; color: #ffd700; }
#completion-content p { font-size: 14px; color: rgba(255,255,255,0.7); line-height: 2; }
</style>
</head>
<body>

<div id="title-screen">
  <div class="planet-icon"></div>
  <h1>小星球邮差</h1>
  <div class="subtitle">Little Planet Messenger</div>
  <button id="start-btn">开 始 旅 程</button>
  <div id="controls-hint">
    WASD 移动 · 鼠标拖拽旋转视角<br>
    靠近居民按 E 键对话
  </div>
</div>

<div id="ui-layer">
  <div id="letter-indicator"></div>
  <div id="quest-panel">
    <h3>任 务 清 单</h3>
    <div id="quest-list"></div>
  </div>
  <div id="interact-hint">按 E 对话</div>
  <div id="message-box">
    <div class="speaker" id="msg-speaker"></div>
    <div class="content" id="msg-content"></div>
    <div class="hint">点击继续 ▸</div>
  </div>
</div>

<div id="completion-overlay">
  <div id="completion-content">
    <h2>✨ 旅途完成 ✨</h2>
    <p>你帮助小星球上所有的居民传递了信件<br>每一份心意都已送达<br>谢谢你，小邮差</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ===== SCENE SETUP =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a3e);
scene.fog = new THREE.FogExp2(0x1a1a3e, 0.008);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ===== LIGHTING =====
const ambientLight = new THREE.AmbientLight(0x6688cc, 0.4);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedd, 1.5);
sunLight.position.set(15, 20, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 60;
sunLight.shadow.camera.left = -20;
sunLight.shadow.camera.right = 20;
sunLight.shadow.camera.top = 20;
sunLight.shadow.camera.bottom = -20;
sunLight.shadow.bias = -0.001;
scene.add(sunLight);

const rimLight = new THREE.DirectionalLight(0xff8844, 0.3);
rimLight.position.set(-10, 5, -10);
scene.add(rimLight);

// ===== PLANET =====
const R = 8;
const planetGroup = new THREE.Group();
scene.add(planetGroup);

// Main planet
const planetGeo = new THREE.SphereGeometry(R, 96, 96);
// Color the planet with vertex colors for grass/water/sand
const colors = [];
const posAttr = planetGeo.getAttribute('position');
for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i), y = posAttr.getY(i), z = posAttr.getZ(i);
  const n = new THREE.Vector3(x, y, z).normalize();
  const lat = Math.acos(n.y);
  // Simple biome: green grass, some sand near equator, some dark patches
  const noise = Math.sin(n.x * 8) * Math.cos(n.z * 6) * 0.5 + 0.5;
  let r, g, b;
  if (noise > 0.7) { r = 0.55; g = 0.78; b = 0.35; } // grass
  else if (noise > 0.4) { r = 0.45; g = 0.72; b = 0.30; } // darker grass
  else { r = 0.76; g = 0.70; b = 0.50; } // sand
  // Polar regions
  if (lat < 0.4 || lat > 2.7) { r = 0.9; g = 0.92; b = 0.95; }
  colors.push(r, g, b);
}
planetGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
const planetMat = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.85, metalness: 0.02
});
const planet = new THREE.Mesh(planetGeo, planetMat);
planet.receiveShadow = true;
planet.castShadow = true;
planetGroup.add(planet);

// Atmosphere glow
const atmosGeo = new THREE.SphereGeometry(R * 1.08, 64, 64);
const atmosMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.5);
      gl_FragColor = vec4(0.4, 0.7, 1.0, intensity * 0.4);
    }
  `,
  transparent: true, side: THREE.BackSide, depthWrite: false
});
planetGroup.add(new THREE.Mesh(atmosGeo, atmosMat));

// ===== HELPERS =====
function surfPos(theta, phi, r = R) {
  return new THREE.Vector3(
    r * Math.sin(theta) * Math.cos(phi),
    r * Math.cos(theta),
    r * Math.sin(theta) * Math.sin(phi)
  );
}

function orientToNormal(obj, pos) {
  const n = pos.clone().normalize();
  obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n);
}

// ===== BUILDINGS =====
const bColors = [0xf5e6ca, 0xe8d5b7, 0xfff0db, 0xd4c4a8, 0xfce4c8];
const rColors = [0xc0392b, 0xd35400, 0x8e44ad, 0x2980b9, 0x27ae60, 0xf39c12];

function makeBuilding(theta, phi, scale = 1) {
  const g = new THREE.Group();
  const pos = surfPos(theta, phi, R + 0.01 * scale);
  
  const w = 0.5 * scale, h = (0.5 + Math.random() * 0.5) * scale;
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, w),
    new THREE.MeshStandardMaterial({ color: bColors[Math.floor(Math.random() * bColors.length)], roughness: 0.9 })
  );
  body.position.y = h / 2;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(w * 0.75, 0.35 * scale, 4),
    new THREE.MeshStandardMaterial({ color: rColors[Math.floor(Math.random() * rColors.length)], roughness: 0.7 })
  );
  roof.position.y = h + 0.17 * scale;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);
  
  // Window glow
  const win = new THREE.Mesh(
    new THREE.PlaneGeometry(0.1 * scale, 0.1 * scale),
    new THREE.MeshStandardMaterial({ color: 0xffee88, emissive: 0xffdd44, emissiveIntensity: 0.6 })
  );
  win.position.set(0, h * 0.55, w / 2 + 0.005);
  g.add(win);
  
  g.position.copy(pos);
  orientToNormal(g, pos);
  return g;
}

function makeTree(theta, phi, scale = 1) {
  const g = new THREE.Group();
  const pos = surfPos(theta, phi, R + 0.01);
  
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04 * scale, 0.06 * scale, 0.35 * scale, 6),
    new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.9 })
  );
  trunk.position.y = 0.17 * scale;
  trunk.castShadow = true;
  g.add(trunk);
  
  const hue = 0.25 + Math.random() * 0.12;
  const leaves = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.22 * scale, 1),
    new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(hue, 0.55, 0.38), roughness: 0.85 })
  );
  leaves.position.y = 0.42 * scale;
  leaves.castShadow = true;
  g.add(leaves);
  
  g.position.copy(pos);
  orientToNormal(g, pos);
  return g;
}

// Place buildings in clusters
const buildingSpots = [
  // Town center
  { t: 0.9, p: 0.5, s: 1.0 }, { t: 0.85, p: 0.7, s: 0.8 },
  { t: 0.95, p: 0.65, s: 0.9 }, { t: 0.88, p: 0.4, s: 0.7 },
  // Forest area
  { t: 1.8, p: 2.5, s: 0.6 }, { t: 1.9, p: 2.7, s: 0.7 },
  // Coast
  { t: 0.5, p: 4.0, s: 0.8 }, { t: 0.55, p: 4.2, s: 0.6 },
  // Hilltop
  { t: 1.3, p: 5.5, s: 0.9 },
  // Scattered
  { t: 2.2, p: 1.0, s: 0.7 }, { t: 1.5, p: 3.8, s: 0.8 },
  { t: 0.7, p: 2.0, s: 0.6 },
];
buildingSpots.forEach(s => planetGroup.add(makeBuilding(s.t, s.p, s.s)));

// Trees
for (let i = 0; i < 30; i++) {
  const t = Math.random() * Math.PI;
  const p = Math.random() * Math.PI * 2;
  planetGroup.add(makeTree(t, p, 0.5 + Math.random() * 0.8));
}

// ===== FLOWERS (small color dots) =====
for (let i = 0; i < 40; i++) {
  const t = Math.random() * Math.PI;
  const p = Math.random() * Math.PI * 2;
  const pos = surfPos(t, p, R + 0.02);
  const flower = new THREE.Mesh(
    new THREE.SphereGeometry(0.04, 6, 6),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(Math.random(), 0.7, 0.6),
      emissive: new THREE.Color().setHSL(Math.random(), 0.5, 0.2),
      emissiveIntensity: 0.3
    })
  );
  flower.position.copy(pos);
  planetGroup.add(flower);
}

// ===== CLOUDS =====
const clouds = [];
for (let i = 0; i < 6; i++) {
  const cg = new THREE.Group();
  const t = Math.random() * Math.PI;
  const p = Math.random() * Math.PI * 2;
  const cr = R + 2.5 + Math.random() * 1.5;
  const pos = surfPos(t, p, cr);
  
  for (let j = 0; j < 4; j++) {
    const c = new THREE.Mesh(
      new THREE.SphereGeometry(0.25 + Math.random() * 0.25, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.6 })
    );
    c.position.set((j - 1.5) * 0.25, Math.random() * 0.1, Math.random() * 0.15);
    cg.add(c);
  }
  cg.position.copy(pos);
  orientToNormal(cg, pos);
  cg.userData = { theta: t, phi: p, r: cr, speed: 0.02 + Math.random() * 0.02 };
  planetGroup.add(cg);
  clouds.push(cg);
}

// ===== NPCs =====
const npcDefs = [
  { name: '渔夫老陈', color: 0x3498db, theta: 0.75, phi: 0.45, desc: '海边的渔夫' },
  { name: '花店小美', color: 0xe91e63, theta: 1.15, phi: 2.1, desc: '花店的主人' },
  { name: '面包师阿明', color: 0xff9800, theta: 0.55, phi: 4.1, desc: '面包店的师傅' },
  { name: '图书管理员', color: 0x9c27b0, theta: 1.85, phi: 2.6, desc: '安静的读书人' },
  { name: '天文爱好者', color: 0x00bcd4, theta: 2.1, phi: 1.1, desc: '仰望星空的人' },
];

const npcs = [];
function makeNPC(def) {
  const g = new THREE.Group();
  const pos = surfPos(def.theta, def.phi, R + 0.25);
  
  // Body
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.13, 0.25, 8, 12),
    new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.5 })
  );
  body.position.y = 0.12;
  body.castShadow = true;
  g.add(body);
  
  // Head
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 })
  );
  head.position.y = 0.38;
  head.castShadow = true;
  g.add(head);
  
  // Eyes
  for (let side of [-1, 1]) {
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.02, 6, 6),
      new THREE.MeshStandardMaterial({ color: 0x222222 })
    );
    eye.position.set(side * 0.04, 0.4, 0.08);
    g.add(eye);
  }
  
  // Chat indicator - floating diamond
  const indicator = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.05, 0),
    new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.8 })
  );
  indicator.position.y = 0.6;
  g.add(indicator);
  
  g.position.copy(pos);
  orientToNormal(g, pos);
  g.userData = { ...def, indicator };
  planetGroup.add(g);
  npcs.push(g);
  return g;
}
npcDefs.forEach(d => makeNPC(d));

// ===== PLAYER =====
const player = new THREE.Group();
const playerStart = surfPos(1.0, 1.5, R + 0.18);

// Body
const pBody = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.13, 0.25, 8, 12),
  new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.4 })
);
pBody.position.y = 0.12;
pBody.castShadow = true;
player.add(pBody);

// Head
const pHead = new THREE.Mesh(
  new THREE.SphereGeometry(0.1, 12, 12),
  new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 })
);
pHead.position.y = 0.38;
pHead.castShadow = true;
player.add(pHead);

// Hat
const hatMat = new THREE.MeshStandardMaterial({ color: 0x1a5276, roughness: 0.5 });
const hatTop = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.1, 12), hatMat);
hatTop.position.y = 0.5;
player.add(hatTop);
const hatBrim = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.02, 12), hatMat);
hatBrim.position.y = 0.46;
player.add(hatBrim);

// Mail bag
const bag = new THREE.Mesh(
  new THREE.BoxGeometry(0.12, 0.1, 0.06),
  new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.8 })
);
bag.position.set(0.14, 0.18, 0);
player.add(bag);

// Bag strap
const strap = new THREE.Mesh(
  new THREE.BoxGeometry(0.02, 0.2, 0.02),
  new THREE.MeshStandardMaterial({ color: 0x6B3410 })
);
strap.position.set(0.08, 0.25, 0);
strap.rotation.z = 0.3;
player.add(strap);

player.position.copy(playerStart);
orientToNormal(player, playerStart);
planetGroup.add(player);

// ===== STARS =====
const starsGeo = new THREE.BufferGeometry();
const starPos = [];
const starSizes = [];
for (let i = 0; i < 800; i++) {
  const r = 50 + Math.random() * 30;
  const t = Math.random() * Math.PI;
  const p = Math.random() * Math.PI * 2;
  starPos.push(r * Math.sin(t) * Math.cos(p), r * Math.cos(t), r * Math.sin(t) * Math.sin(p));
  starSizes.push(0.05 + Math.random() * 0.1);
}
starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
starsGeo.setAttribute('size', new THREE.Float32BufferAttribute(starSizes, 1));
const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, sizeAttenuation: true });
scene.add(new THREE.Points(starsGeo, starsMat));

// ===== FIREFLIES (ambient particles) =====
const fireflyCount = 30;
const fireflyGeo = new THREE.BufferGeometry();
const ffPos = new Float32Array(fireflyCount * 3);
const ffData = [];
for (let i = 0; i < fireflyCount; i++) {
  const t = Math.random() * Math.PI;
  const p = Math.random() * Math.PI * 2;
  const r = R + 0.5 + Math.random() * 1;
  const pos = surfPos(t, p, r);
  ffPos[i * 3] = pos.x;
  ffPos[i * 3 + 1] = pos.y;
  ffPos[i * 3 + 2] = pos.z;
  ffData.push({ t, p, r, phase: Math.random() * Math.PI * 2 });
}
fireflyGeo.setAttribute('position', new THREE.Float32BufferAttribute(ffPos, 3));
const fireflyMat = new THREE.PointsMaterial({
  color: 0xffee88, size: 0.06, sizeAttenuation: true,
  transparent: true, opacity: 0.7
});
const fireflies = new THREE.Points(fireflyGeo, fireflyMat);
planetGroup.add(fireflies);

// ===== QUEST SYSTEM =====
const quests = [
  {
    id: 0, title: '渔夫的信件',
    giver: 0, receiver: 2,
    giverText: '嘿，小邮差！这封信请帮我送给面包师阿明吧，他上次说想看看海底的宝贝。',
    receiverText: '哦？老陈给我的？让我看看...',
    letter: '阿明，我昨天在海边捡到一颗像面包一样的贝壳，哈哈，送你当纪念！——老陈',
    replyText: '哈哈，老陈总是这么有趣！这贝壳确实像我的小面包，谢谢你，小邮差！'
  },
  {
    id: 1, title: '花店的心意',
    giver: 1, receiver: 3,
    giverText: '小邮差～这束干花请帮我送给图书管理员吧，她最近在整理植物图鉴呢。',
    receiverText: '给我的？好漂亮的花...',
    letter: '听说你在整理植物图鉴，这束干花送给你夹在书里，希望能给你灵感～——小美',
    replyText: '小美真细心，这束花让我的图鉴增色不少。谢谢你，小邮差。'
  },
  {
    id: 2, title: '星空的约定',
    giver: 4, receiver: 0,
    giverText: '小邮差！今晚有流星雨！这封信帮我带给渔夫老陈，约他一起来看！',
    receiverText: '哦？天文爱好者给我的？',
    letter: '老陈！今晚有流星雨，带上你的鱼竿来海边，我们用鱼竿钓星星！——天文爱好者',
    replyText: '钓星星？哈哈这个主意太棒了！我已经在海边等着了，谢谢你送信！'
  },
  {
    id: 3, title: '面包的秘方',
    giver: 2, receiver: 1,
    giverText: '小邮差！这封信送给花店小美，我用她的花瓣做了新面包，一定要告诉她！',
    receiverText: '阿明给我的信？好香...',
    letter: '小美，我试了用你送的花瓣做面包，居然意外的好吃！这个配方送给你！——阿明',
    replyText: '花瓣面包？听起来太浪漫了！我要去尝尝，谢谢小邮差！'
  },
  {
    id: 4, title: '给未来的信',
    giver: 3, receiver: 4,
    giverText: '请把这封信带给天文爱好者。我在旧书里发现了一些有趣的东西...',
    receiverText: '图书管理员给我的？',
    letter: '我在旧书里发现一张星图，标注的位置和你昨晚说的一模一样！快来看看！——图书管理员',
    replyText: '太巧了！这张星图和我观测到的完全吻合！我要去找她讨论，谢谢小邮差！'
  }
];

let currentQuest = 0;
let carryingLetter = null; // quest id being carried
let questsCompleted = 0;
let gameStarted = false;

// ===== UI =====
const questListEl = document.getElementById('quest-list');
const msgBox = document.getElementById('message-box');
const msgSpeaker = document.getElementById('msg-speaker');
const msgContent = document.getElementById('msg-content');
const interactHint = document.getElementById('interact-hint');
const letterInd = document.getElementById('letter-indicator');

function updateQuestUI() {
  let html = '';
  quests.forEach((q, i) => {
    if (i < currentQuest) {
      html += `<div class="quest-done">✓ ${q.title}</div>`;
    } else if (i === currentQuest) {
      html += `<div class="quest-active">▸ ${q.title}</div>`;
    } else {
      html += `<div class="quest-locked">○ ???</div>`;
    }
  });
  questListEl.innerHTML = html;
}

function showMsg(speaker, content, letter, callback) {
  msgSpeaker.textContent = speaker;
  let html = content;
  if (letter) {
    html += `<div class="letter-text">「${letter}」</div>`;
  }
  msgContent.innerHTML = html;
  msgBox.classList.add('show');
  msgBox.onclick = () => {
    msgBox.classList.remove('show');
    if (callback) setTimeout(callback, 200);
  };
}

// ===== INPUT =====
const keys = { f: false, b: false, l: false, r: false };
let camAngle = 0, camPitch = 0.4;
let dragging = false, lastMX = 0, lastMY = 0;

document.addEventListener('keydown', e => {
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.f = true;
  if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.b = true;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.l = true;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.r = true;
  if (e.key === 'e' || e.key === 'E') tryInteract();
});
document.addEventListener('keyup', e => {
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.f = false;
  if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.b = false;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.l = false;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.r = false;
});

renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true; lastMX = e.clientX; lastMY = e.clientY;
});
document.addEventListener('pointermove', e => {
  if (!dragging) return;
  camAngle += (e.clientX - lastMX) * 0.004;
  camPitch = Math.max(-0.3, Math.min(1.0, camPitch + (e.clientY - lastMY) * 0.004));
  lastMX = e.clientX; lastMY = e.clientY;
});
document.addEventListener('pointerup', () => { dragging = false; });

// ===== INTERACTION =====
function tryInteract() {
  if (!gameStarted || msgBox.classList.contains('show')) return;
  
  const pWorld = new THREE.Vector3();
  player.getWorldPosition(pWorld);
  
  for (const npc of npcs) {
    const nWorld = new THREE.Vector3();
    npc.getWorldPosition(nWorld);
    if (pWorld.distanceTo(nWorld) < 2.2) {
      handleNPC(npc);
      return;
    }
  }
}

function handleNPC(npc) {
  const idx = npcDefs.indexOf(npc.userData);
  const q = quests[currentQuest];
  if (!q) return;
  
  // Is this the giver?
  if (idx === q.giver && carryingLetter === null) {
    showMsg(npc.userData.name, q.giverText, null, () => {
      carryingLetter = currentQuest;
      letterInd.style.display = 'block';
      letterInd.textContent = `✉️ 信件：送给${npcDefs[q.receiver].name}`;
    });
    return;
  }
  
  // Is this the receiver?
  if (idx === q.receiver && carryingLetter === currentQuest) {
    showMsg(npc.userData.name, q.receiverText, q.letter, () => {
      showMsg(npc.userData.name, q.replyText, null, () => {
        carryingLetter = null;
        letterInd.style.display = 'none';
        questsCompleted++;
        currentQuest++;
        updateQuestUI();
        
        if (currentQuest >= quests.length) {
          setTimeout(() => {
            document.getElementById('completion-overlay').classList.add('show');
          }, 800);
        }
      });
    });
    return;
  }
  
  // Generic dialogue
  const generic = [
    `${npc.userData.name}："在小星球上散步真舒服～"`,
    `${npc.userData.name}："今天的天气真好呢。"`,
    `${npc.userData.name}："谢谢你来看我，小邮差！"`,
    `${npc.userData.name}："这个星球虽然小，但很温暖。"`,
  ];
  showMsg(npc.userData.name, generic[Math.floor(Math.random() * generic.length)], null, null);
}

// ===== TITLE =====
document.getElementById('start-btn').addEventListener('click', () => {
  const ts = document.getElementById('title-screen');
  ts.style.opacity = '0';
  setTimeout(() => { ts.style.display = 'none'; }, 1200);
  gameStarted = true;
  updateQuestUI();
  setTimeout(() => {
    showMsg('系统提示', '欢迎来到小星球！<br>你是这里的邮差，请帮助居民们传递信件。<br><br>靠近头顶有金色标记的居民，按 E 键对话。<br>WASD 移动，鼠标拖拽旋转视角。', null, null);
  }, 1500);
});

// ===== ANIMATION =====
const clock = new THREE.Clock();
let bobPhase = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.getElapsedTime();
  
  // Player movement
  const speed = 2.5 * dt;
  const pWorld = new THREE.Vector3();
  player.getWorldPosition(pWorld);
  
  const moving = keys.f || keys.b || keys.l || keys.r;
  if (moving && gameStarted) {
    const dir = new THREE.Vector3();
    if (keys.f) dir.z -= 1;
    if (keys.b) dir.z += 1;
    if (keys.l) dir.x -= 1;
    if (keys.r) dir.x += 1;
    dir.normalize();
    
    const c = Math.cos(camAngle), s = Math.sin(camAngle);
    const rx = dir.x * c - dir.z * s;
    const rz = dir.x * s + dir.z * c;
    
    const up = pWorld.clone().normalize();
    const right = new THREE.Vector3().crossVectors(up, new THREE.Vector3(0, 1, 0.001)).normalize();
    const fwd = new THREE.Vector3().crossVectors(right, up).normalize();
    
    const moveVec = fwd.multiplyScalar(-rz * speed).add(right.multiplyScalar(rx * speed));
    const newPos = pWorld.clone().add(moveVec).normalize().multiplyScalar(R + 0.18);
    const localPos = planetGroup.worldToLocal(newPos);
    
    player.position.copy(localPos);
    orientToNormal(player, localPos);
    
    bobPhase += dt * 10;
    player.position.addScaledVector(localPos.clone().normalize(), Math.abs(Math.sin(bobPhase)) * 0.015);
  }
  
  // Camera follow
  const pWorldCam = new THREE.Vector3();
  player.getWorldPosition(pWorldCam);
  const up = pWorldCam.clone().normalize();
  
  const camR = 4.5;
  const camOffset = new THREE.Vector3(
    Math.sin(camAngle) * camR,
    1.5 + Math.sin(camPitch) * camR * 0.4,
    Math.cos(camAngle) * camR
  );
  
  camera.position.lerp(pWorldCam.clone().add(camOffset), 0.05);
  camera.lookAt(pWorldCam);
  
  // Planet slow rotation
  planetGroup.rotation.y += dt * 0.015;
  
  // NPC indicators float
  npcs.forEach((npc, i) => {
    if (npc.userData.indicator) {
      npc.userData.indicator.position.y = 0.6 + Math.sin(time * 2.5 + i * 1.5) * 0.04;
      npc.userData.indicator.rotation.y = time * 1.5;
    }
  });
  
  // Clouds drift
  clouds.forEach(c => {
    c.userData.phi += dt * c.userData.speed;
    const pos = surfPos(c.userData.theta, c.userData.phi, c.userData.r);
    c.position.copy(pos);
    orientToNormal(c, pos);
  });
  
  // Fireflies
  const ffPositions = fireflies.geometry.getAttribute('position');
  for (let i = 0; i < fireflyCount; i++) {
    const d = ffData[i];
    d.phase += dt * 0.5;
    const r = d.r + Math.sin(d.phase) * 0.3;
    const pos = surfPos(d.t, d.p + time * 0.01, r);
    ffPositions.setXYZ(i, pos.x, pos.y, pos.z);
  }
  ffPositions.needsUpdate = true;
  fireflyMat.opacity = 0.4 + Math.sin(time * 1.5) * 0.3;
  
  // Proximity hint
  let nearNPC = false;
  npcs.forEach(npc => {
    const nw = new THREE.Vector3();
    npc.getWorldPosition(nw);
    if (pWorld.distanceTo(nw) < 2.2) nearNPC = true;
  });
  interactHint.style.display = (nearNPC && gameStarted && !msgBox.classList.contains('show')) ? 'block' : 'none';
  
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
