<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI K歌评分与排行榜 Demo</title>
  <style>
    :root {
      --primary: #6C5DD3;
      --primary-dark: #5849B8;
      --accent: #00D4AA;
      --bg: #0F0F1A;
      --card: #1A1A2E;
      --text: #FFFFFF;
      --text-secondary: #A0A0B8;
      --border: #2A2A45;
      --danger: #FF4757;
      --warning: #FFA502;
      --success: #2ED573;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0F0F1A 0%, #1A1A2E 50%, #0F0F1A 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 0 30px;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 1.3rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title .icon {
      font-size: 1.5rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 50px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 4px 20px rgba(108, 93, 211, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(108, 93, 211, 0.5);
    }

    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #3A3A5A;
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      color: var(--accent);
      font-size: 1rem;
      min-height: 28px;
      margin-bottom: 15px;
    }

    .status.recording {
      color: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .visualizer {
      width: 100%;
      height: 220px;
      background: #0A0A15;
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    #pitchCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-secondary);
      text-align: center;
      pointer-events: none;
    }

    .scores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .score-item {
      background: #0A0A15;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .score-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .score-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .score-value.total {
      font-size: 3rem;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .score-comment {
      color: var(--warning);
      font-size: 1rem;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0A0A15;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }

    .leaderboard {
      list-style: none;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: #0A0A15;
      border-radius: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      transition: transform 0.2s;
    }

    .leaderboard-item:hover {
      transform: translateX(5px);
      border-color: var(--primary);
    }

    .rank {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin-right: 16px;
      background: var(--border);
      color: var(--text-secondary);
    }

    .rank.top1 { background: #FFD700; color: #000; }
    .rank.top2 { background: #C0C0C0; color: #000; }
    .rank.top3 { background: #CD7F32; color: #000; }

    .leaderboard-info {
      flex: 1;
    }

    .leaderboard-name {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .leaderboard-song {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .leaderboard-score {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .hidden {
      display: none !important;
    }

    .tips {
      background: rgba(0, 212, 170, 0.1);
      border-left: 4px solid var(--accent);
      padding: 16px 20px;
      border-radius: 0 12px 12px 0;
      margin-bottom: 20px;
    }

    .tips h3 {
      color: var(--accent);
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .tips ul {
      margin-left: 18px;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .audio-playback {
      width: 100%;
      margin-top: 15px;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.8rem; }
      .card { padding: 20px; }
      .btn { padding: 12px 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI K歌评分与排行榜</h1>
      <p>本地实时音高分析 · AI 多维度打分 · 歌友排行榜</p>
    </header>

    <div class="tips">
      <h3>使用提示</h3>
      <ul>
        <li>建议使用 Chrome / Edge 浏览器，并允许麦克风权限。</li>
        <li>点击“开始录音”后，跟唱或清唱 15-30 秒，效果最佳。</li>
        <li>AI 会从音准、节奏、气息、稳定度四个维度打分。</li>
      </ul>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">🎤</span> 录音演唱</div>
      <div class="form-group">
        <label for="singerName">你的名字 / 昵称</label>
        <input type="text" id="singerName" placeholder="请输入昵称" maxlength="16">
      </div>
      <div class="form-group">
        <label for="songName">演唱歌曲</label>
        <input type="text" id="songName" placeholder="例如：《月亮代表我的心》" maxlength="30">
      </div>
      <div class="controls">
        <button class="btn btn-primary" id="startBtn" onclick="startRecording()">🎙️ 开始录音</button>
        <button class="btn btn-danger" id="stopBtn" onclick="stopRecording()" disabled>⏹ 停止录音</button>
        <button class="btn btn-secondary" id="resetBtn" onclick="resetRecording()" disabled>🔄 重新录制</button>
      </div>
      <div class="status" id="status">准备就绪，点击下方按钮开始录音</div>
      <div class="visualizer">
        <canvas id="pitchCanvas"></canvas>
        <div class="empty-state" id="emptyState">波形与音高曲线将在这里显示</div>
      </div>
      <audio class="audio-playback" id="playback" controls hidden></audio>
    </div>

    <div class="card hidden" id="resultCard">
      <div class="card-title"><span class="icon">📊</span> AI 评分结果</div>
      <div class="scores-grid">
        <div class="score-item">
          <div class="score-label">音准</div>
          <div class="score-value" id="pitchScore">--</div>
        </div>
        <div class="score-item">
          <div class="score-label">节奏</div>
          <div class="score-value" id="rhythmScore">--</div>
        </div>
        <div class="score-item">
          <div class="score-label">气息</div>
          <div class="score-value" id="breathScore">--</div>
        </div>
        <div class="score-item">
          <div class="score-label">稳定度</div>
          <div class="score-value" id="stabilityScore">--</div>
        </div>
      </div>
      <div class="score-item" style="margin-bottom:20px">
        <div class="score-label">综合评分</div>
        <div class="score-value total" id="totalScore">--</div>
        <div class="score-comment" id="comment">--</div>
      </div>
      <div class="controls">
        <button class="btn btn-primary" id="submitBtn" onclick="submitToLeaderboard()">🏆 提交到排行榜</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">🏅</span> 歌友排行榜</div>
      <ul class="leaderboard" id="leaderboard">
        <li class="leaderboard-item" style="justify-content:center; color: var(--text-secondary);">
          暂无记录，快来成为第一个歌友吧！
        </li>
      </ul>
    </div>
  </div>

  <script>
    // 全局状态
    let audioContext = null;
    let analyser = null;
    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedBlob = null;
    let isRecording = false;
    let rafId = null;
    let pitchHistory = [];
    let volumeHistory = [];
    let recordingStartTime = 0;
    let recordingDuration = 0;

    const canvas = document.getElementById('pitchCanvas');
    const ctx = canvas.getContext('2d');
    const emptyState = document.getElementById('emptyState');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 更新状态
    function setStatus(text, recording) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.classList.toggle('recording', recording);
    }

    // 音高检测：自相关算法
    function autoCorrelate(buf, sampleRate) {
      const SIZE = buf.length;
      const rms = Math.sqrt(buf.reduce((sum, x) => sum + x*x, 0) / SIZE);
      if (rms < 0.01) return -1;

      let r1 = 0, r2 = SIZE - 1;
      const thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) {
        if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      }
      for (let i = 1; i < SIZE / 2; i++) {
        if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
      }
      buf = buf.slice(r1, r2);
      const c = new Array(buf.length).fill(0);
      for (let i = 0; i < buf.length; i++) {
        for (let j = 0; j < buf.length - i; j++) {
          c[i] += buf[j] * buf[j + i];
        }
      }
      let d = 0;
      while (c[d] > c[d+1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < buf.length; i++) {
        if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      }
      let T0 = maxpos;
      const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
      const a = (x1 + x3 - 2*x2) / 2;
      const b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2*a);
      return sampleRate / T0;
    }

    // 频率转音名
    function freqToNote(freq) {
      if (freq <= 0) return null;
      const A4 = 440;
      const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const semitones = 12 * Math.log2(freq / A4);
      const noteIndex = Math.round(semitones) + 9;
      const octave = Math.floor(noteIndex / 12) + 4;
      const name = noteNames[((noteIndex % 12) + 12) % 12];
      return name + octave;
    }

    // 开始录音
    async function startRecording() {
      const singer = document.getElementById('singerName').value.trim() || '匿名歌友';
      const song = document.getElementById('songName').value.trim() || '未知歌曲';
      if (!song || song === '未知歌曲') {
        alert('请先填写演唱歌曲名称');
        return;
      }

      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        const source = audioContext.createMediaStreamSource(mediaStream);
        source.connect(analyser);

        mediaRecorder = new MediaRecorder(mediaStream);
        recordedChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          recordedBlob = new Blob(recordedChunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(recordedBlob);
          const playback = document.getElementById('playback');
          playback.src = url;
          playback.hidden = false;
        };
        mediaRecorder.start();

        pitchHistory = [];
        volumeHistory = [];
        recordingStartTime = Date.now();
        isRecording = true;
        emptyState.classList.add('hidden');

        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('resetBtn').disabled = false;
        document.getElementById('resultCard').classList.add('hidden');
        document.getElementById('submitBtn').disabled = true;
        setStatus('🎤 录音中... 请尽情演唱', true);

        drawPitch();
      } catch (err) {
        console.error(err);
        alert('无法访问麦克风，请检查权限或浏览器设置。');
      }
    }

    // 停止录音
    function stopRecording() {
      isRecording = false;
      recordingDuration = (Date.now() - recordingStartTime) / 1000;
      if (rafId) cancelAnimationFrame(rafId);
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioContext && audioContext.state !== 'closed') audioContext.close();

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('resetBtn').disabled = false;
      setStatus('录音结束，AI 分析中...');

      setTimeout(() => {
        analyzeAndShow();
      }, 600);
    }

    // 重新录制
    function resetRecording() {
      isRecording = false;
      if (rafId) cancelAnimationFrame(rafId);
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioContext && audioContext.state !== 'closed') audioContext.close();
      pitchHistory = [];
      volumeHistory = [];
      recordedBlob = null;
      document.getElementById('playback').hidden = true;
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('resetBtn').disabled = true;
      document.getElementById('singerName').value = '';
      document.getElementById('songName').value = '';
      emptyState.classList.remove('hidden');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      setStatus('准备就绪，点击下方按钮开始录音');
    }

    // 实时绘制音高曲线
    function drawPitch() {
      if (!isRecording) return;
      const buffer = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buffer);
      const freq = autoCorrelate(buffer, audioContext.sampleRate);
      const rms = Math.sqrt(buffer.reduce((sum, x) => sum + x*x, 0) / buffer.length);
      const volume = Math.min(rms * 10, 1);

      pitchHistory.push({ freq, time: Date.now() - recordingStartTime });
      volumeHistory.push({ vol: volume, time: Date.now() - recordingStartTime });

      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      ctx.clearRect(0, 0, w, h);

      // 网格
      ctx.strokeStyle = '#1a1a35';
      ctx.lineWidth = 1;
      for (let i = 1; i < 8; i++) {
        ctx.beginPath();
        ctx.moveTo(0, h * i / 8);
        ctx.lineTo(w, h * i / 8);
        ctx.stroke();
      }

      // 音量波形
      ctx.strokeStyle = 'rgba(0, 212, 170, 0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const step = buffer.length / w;
      for (let i = 0; i < w; i++) {
        const idx = Math.floor(i * step);
        const y = h/2 - buffer[idx] * h/2;
        if (i === 0) ctx.moveTo(i, y); else ctx.lineTo(i, y);
      }
      ctx.stroke();

      // 音高曲线
      ctx.strokeStyle = '#6C5DD3';
      ctx.lineWidth = 3;
      ctx.beginPath();
      const minFreq = 80, maxFreq = 800;
      const recent = pitchHistory.slice(-Math.min(pitchHistory.length, 300));
      let started = false;
      for (let i = 0; i < recent.length; i++) {
        const f = recent[i].freq;
        if (f <= 0) continue;
        const x = w * i / recent.length;
        const normalized = Math.max(0, Math.min(1, (Math.log2(f) - Math.log2(minFreq)) / (Math.log2(maxFreq) - Math.log2(minFreq))));
        const y = h - normalized * h * 0.8 - h * 0.1;
        if (!started) { ctx.moveTo(x, y); started = true; }
        else { ctx.lineTo(x, y); }
      }
      ctx.stroke();

      // 当前音高文字
      if (freq > 0) {
        const note = freqToNote(freq);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(note ? `当前音高: ${note}` : '当前音高: --', 20, 36);
      }

      rafId = requestAnimationFrame(drawPitch);
    }

    // 分析并显示评分
    function analyzeAndShow() {
      const validPitches = pitchHistory.filter(p => p.freq > 0).map(p => p.freq);
      const validVolumes = volumeHistory.map(v => v.vol);

      if (validPitches.length < 10) {
        setStatus('未能捕捉到有效歌声，请重新录制并靠近麦克风。');
        return;
      }

      // 音准分：音高标准差越小越准
      const logFreqs = validPitches.map(f => Math.log2(f));
      const mean = logFreqs.reduce((a,b) => a+b, 0) / logFreqs.length;
      const variance = logFreqs.reduce((sum, f) => sum + (f-mean)**2, 0) / logFreqs.length;
      const std = Math.sqrt(variance);
      const pitchScore = Math.max(0, Math.min(100, Math.round(100 - std * 80)));

      // 稳定度：音高变化频率
      let transitions = 0;
      for (let i = 1; i < validPitches.length; i++) {
        if (Math.abs(validPitches[i] - validPitches[i-1]) / validPitches[i-1] > 0.08) transitions++;
      }
      const stabilityScore = Math.max(0, Math.min(100, Math.round(100 - transitions / validPitches.length * 120)));

      // 节奏分：音量起伏规律性
      let peaks = 0;
      for (let i = 2; i < validVolumes.length; i++) {
        if (validVolumes[i-1] > validVolumes[i-2] && validVolumes[i-1] > validVolumes[i] && validVolumes[i-1] > 0.1) peaks++;
      }
      const expectedPeaks = Math.max(1, recordingDuration / 1.5);
      const rhythmScore = Math.max(0, Math.min(100, Math.round(100 - Math.abs(peaks - expectedPeaks) / expectedPeaks * 50)));

      // 气息分：演唱时长与停顿
      const breathScore = Math.min(100, Math.round(recordingDuration * 6 + validVolumes.reduce((a,b)=>a+b,0)/validVolumes.length*20));

      // 综合分
      const total = Math.round(pitchScore * 0.35 + rhythmScore * 0.25 + breathScore * 0.2 + stabilityScore * 0.2);

      document.getElementById('pitchScore').textContent = pitchScore;
      document.getElementById('rhythmScore').textContent = rhythmScore;
      document.getElementById('breathScore').textContent = breathScore;
      document.getElementById('stabilityScore').textContent = stabilityScore;
      document.getElementById('totalScore').textContent = total;

      let comment = '';
      if (total >= 90) comment = '🎉 歌神降临！建议直接出道';
      else if (total >= 80) comment = '🌟 专业级水准，太稳了';
      else if (total >= 70) comment = '👍 麦霸水准，再多练几首';
      else if (total >= 60) comment = '💪 潜力股，继续加油';
      else comment = '🎤 勇气可嘉，多唱几次会更好';
      document.getElementById('comment').textContent = comment;

      document.getElementById('resultCard').classList.remove('hidden');
      document.getElementById('submitBtn').disabled = false;
      setStatus('评分完成，可以提交到排行榜或重新录制');
    }

    // 提交到排行榜
    function submitToLeaderboard() {
      const singer = document.getElementById('singerName').value.trim() || '匿名歌友';
      const song = document.getElementById('songName').value.trim() || '未知歌曲';
      const total = parseInt(document.getElementById('totalScore').textContent);
      if (isNaN(total)) return;

      const records = JSON.parse(localStorage.getItem('karaokeLeaderboard') || '[]');
      records.push({ name: singer, song: song, score: total, date: new Date().toLocaleString() });
      records.sort((a, b) => b.score - a.score);
      if (records.length > 10) records.length = 10;
      localStorage.setItem('karaokeLeaderboard', JSON.stringify(records));

      renderLeaderboard();
      document.getElementById('submitBtn').disabled = true;
      setStatus('已提交到排行榜！');
    }

    // 渲染排行榜
    function renderLeaderboard() {
      const list = document.getElementById('leaderboard');
      const records = JSON.parse(localStorage.getItem('karaokeLeaderboard') || '[]');
      list.innerHTML = '';
      if (records.length === 0) {
        list.innerHTML = '<li class="leaderboard-item" style="justify-content:center; color: var(--text-secondary);">暂无记录，快来成为第一个歌友吧！</li>';
        return;
      }
      records.forEach((r, i) => {
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        const rankClass = i < 3 ? `top${i+1}` : '';
        li.innerHTML = `
          <div class="rank ${rankClass}">${i+1}</div>
          <div class="leaderboard-info">
            <div class="leaderboard-name">${escapeHtml(r.name)}</div>
            <div class="leaderboard-song">${escapeHtml(r.song)} · ${r.date}</div>
          </div>
          <div class="leaderboard-score">${r.score}</div>
        `;
        list.appendChild(li);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 初始化
    renderLeaderboard();
  </script>
</body>
</html>
