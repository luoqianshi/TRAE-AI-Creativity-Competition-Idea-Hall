<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智学伴侣 - AI学习知识管理助手 | Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #f5f6fa;
            color: #2c3e50;
        }
        .header {
            background: #4a69bd;
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header h1 { font-size: 24px; }
        .header span { font-size: 14px; opacity: 0.9; }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .panel h2 {
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4a69bd;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        .btn-primary { background: #4a69bd; color: white; }
        .btn-success { background: #00b894; color: white; }
        .btn-default { background: #dfe6e9; color: #2c3e50; }
        textarea {
            width: 100%;
            height: 180px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            resize: vertical;
            font-family: inherit;
        }
        .stats {
            color: #4a69bd;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .card-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .card-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .card-item:hover, .card-item.active {
            background: #4a69bd;
            color: white;
        }
        .detail-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.8;
            min-height: 180px;
        }
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #dfe6e9;
            padding: 8px 30px;
            font-size: 12px;
            color: #636e72;
        }
        .hidden { display: none; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            background: #e3f2fd;
            color: #4a69bd;
            border-radius: 12px;
            font-size: 12px;
            margin-right: 5px;
        }
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>智学伴侣</h1>
        <span>AI驱动的个人学习知识管理助手 | TRAE AI创造力大赛 · 学习工作赛道</span>
    </div>

    <div class="container">
        <div class="panel">
            <h2>内容导入</h2>
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="输入文章链接..." value="https://example.com/python-tutorial">
                <button class="btn-primary" onclick="fetchContent()">获取内容</button>
            </div>
            <p style="font-size:12px;color:#999;margin-bottom:8px;">原文预览：</p>
            <textarea id="contentPreview" placeholder="点击“获取内容”后，文章内容将显示在这里..."></textarea>
            <div style="margin-top:12px;display:flex;gap:10px;">
                <button class="btn-success" id="genBtn" onclick="generateCard()" disabled>AI总结生成知识卡片</button>
                <button class="btn-default" onclick="clearInput()">清空</button>
            </div>
        </div>

        <div class="panel">
            <h2>我的知识库</h2>
            <div class="stats" id="statsLabel">已收录 0 张知识卡片</div>
            <div class="card-list" id="cardList"></div>
            <p style="font-size:12px;color:#999;margin-bottom:8px;">卡片详情：</p>
            <div class="detail-box" id="cardDetail">点击左侧卡片查看详情...</div>
        </div>
    </div>

    <div class="status-bar">就绪 | 选择学习工作赛道 | TRAE AI创造力大赛Demo</div>

    <script>
        const DEMO_CONTENTS = {
            python: `Python是一种解释型、面向对象、动态数据类型的高级程序设计语言。它由Guido van Rossum于1989年发明，第一个公开发行版发行于1991年。Python语法简洁清晰，特色之一是强制用空白符作为语句缩进。Python拥有丰富的标准库和第三方库，广泛应用于Web开发、数据分析、人工智能等领域。`,
            machine: `机器学习是人工智能的一个分支，它使用统计学方法让计算机系统能够从数据中学习和改进。主要类型包括监督学习、无监督学习和强化学习。监督学习使用标记数据训练模型，无监督学习发现数据中的隐藏模式。深度学习是机器学习的一个子集，使用多层神经网络处理复杂数据。`,
            default: `这是从网页抓取的内容示例。在实际应用中，这里会调用爬虫模块获取真实网页内容。用户输入URL后，系统会自动提取文章正文、标题和关键信息。然后调用AI接口对内容进行分析和总结，生成结构化的知识点卡片。`
        };

        let currentContent = '';
        let knowledgeBase = JSON.parse(localStorage.getItem('knowledge_base') || '{}');
        let selectedCardId = null;

        function fetchContent() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) { alert('请输入文章链接'); return; }

            let content = DEMO_CONTENTS.default;
            if (url.includes('python')) content = DEMO_CONTENTS.python;
            else if (url.includes('machine') || url.includes('learning')) content = DEMO_CONTENTS.machine;

            currentContent = content;
            document.getElementById('contentPreview').value = content;
            document.getElementById('genBtn').disabled = false;
            updateStatus('内容获取成功，请点击“AI总结生成知识卡片”');
        }

        function simulateAISummary(content) {
            const sentences = content.split(/[。！？]/).filter(s => s.trim().length > 10);
            const title = content.slice(0, 20) + '...';
            const keyPoints = sentences.slice(0, 4);
            return {
                title: title,
                summary: content.slice(0, 80) + '...',
                keyPoints: keyPoints.length ? keyPoints : ['核心概念：该内容介绍了相关领域的基础知识', '关键要点：掌握基本原理对深入理解至关重要'],
                tags: ['学习', '知识管理', 'AI辅助']
            };
        }

        function generateCard() {
            if (!currentContent) { alert('请先获取内容'); return; }

            const card = simulateAISummary(currentContent);
            const cardId = 'card_' + new Date().toISOString().slice(0,19).replace(/[-:T]/g, '');
            card.id = cardId;
            card.url = document.getElementById('urlInput').value;
            card.created_at = new Date().toLocaleString('zh-CN');

            knowledgeBase[cardId] = card;
            localStorage.setItem('knowledge_base', JSON.stringify(knowledgeBase));
            refreshCardList();
            updateStatus(`知识卡片生成成功！已收录 ${Object.keys(knowledgeBase).length} 张卡片`);
            alert(`知识卡片已生成并保存！\n\n标题: ${card.title}\n要点数: ${card.keyPoints.length}`);
        }

        function clearInput() {
            document.getElementById('urlInput').value = '';
            document.getElementById('contentPreview').value = '';
            document.getElementById('genBtn').disabled = true;
            currentContent = '';
            updateStatus('已清空输入');
        }

        function refreshCardList() {
            const list = document.getElementById('cardList');
            list.innerHTML = '';
            Object.values(knowledgeBase).forEach(card => {
                const div = document.createElement('div');
                div.className = 'card-item' + (card.id === selectedCardId ? ' active' : '');
                div.textContent = card.title.slice(0, 25) + '... [' + card.created_at + ']';
                div.onclick = () => showCardDetail(card.id);
                list.appendChild(div);
            });
            document.getElementById('statsLabel').textContent = `已收录 ${Object.keys(knowledgeBase).length} 张知识卡片`;
        }

        function showCardDetail(cardId) {
            selectedCardId = cardId;
            const card = knowledgeBase[cardId];
            if (!card) return;

            const tags = card.tags.map(t => `<span class="tag">${t}</span>`).join('');
            document.getElementById('cardDetail').innerHTML = `
                <strong>【${card.title}】</strong><br><br>
                摘要: ${card.summary}<br><br>
                核心要点:<br>
                ${card.keyPoints.map((p, i) => `&nbsp;&nbsp;${i+1}. ${p}<br>`).join('')}
                <br>标签: ${tags}<br>
                来源: ${card.url || 'N/A'}<br>
                创建时间: ${card.created_at}
            `;
            refreshCardList();
        }

        function updateStatus(msg) {
            document.querySelector('.status-bar').textContent = msg + ' | 选择学习工作赛道 | TRAE AI创造力大赛Demo';
        }

        refreshCardList();
    </script>
</body>
</html>
