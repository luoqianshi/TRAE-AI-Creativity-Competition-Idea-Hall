<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光饮伴侣 - 智能水杯与氛围灯的喝水养成游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 顶部标题 */
        .header {
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        .header h1 {
            font-size: 1.5em;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            font-size: 0.85em;
            color: #64748b;
            margin-top: 4px;
        }

        /* 桌面场景 */
        .desk-scene {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 400px;
        }

        /* 氛围灯 */
        .lamp-area {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
        }
        .lamp-glow {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            filter: blur(40px);
            opacity: 0.6;
        }
        .lamp-glow.blue {
            background: radial-gradient(circle, #3b82f6, #1d4ed8);
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.5), 0 0 120px rgba(59, 130, 246, 0.2);
        }
        .lamp-glow.orange {
            background: radial-gradient(circle, #f97316, #ea580c);
            box-shadow: 0 0 80px rgba(249, 115, 22, 0.5), 0 0 120px rgba(249, 115, 22, 0.2);
        }
        .lamp-glow.green {
            background: radial-gradient(circle, #22c55e, #16a34a);
            box-shadow: 0 0 80px rgba(34, 197, 94, 0.5), 0 0 120px rgba(34, 197, 94, 0.2);
        }
        .lamp-glow.pulse {
            animation: lampPulse 2s ease-in-out infinite;
        }
        @keyframes lampPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.8; }
        }

        .lamp-body {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            backdrop-filter: blur(10px);
            z-index: 2;
            transition: all 0.5s;
        }
        .lamp-body.blue { border-color: rgba(59, 130, 246, 0.5); }
        .lamp-body.orange { border-color: rgba(249, 115, 22, 0.5); }
        .lamp-body.green { border-color: rgba(34, 197, 94, 0.5); }

        .lamp-stand {
            position: absolute;
            width: 60px;
            height: 8px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            border-radius: 4px;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 状态文字 */
        .status-text {
            text-align: center;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .status-text .main {
            font-size: 1.3em;
            font-weight: 600;
            transition: color 0.5s;
        }
        .status-text .main.blue { color: #60a5fa; }
        .status-text .main.orange { color: #fb923c; }
        .status-text .main.green { color: #4ade80; }
        .status-text .sub {
            font-size: 0.85em;
            color: #64748b;
            margin-top: 4px;
        }

        /* 智能水杯 */
        .cup-area {
            position: relative;
            width: 140px;
            height: 180px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .cup-area:active { transform: scale(0.95); }
        .cup-area:hover { transform: translateY(-5px); }

        .cup-body {
            position: absolute;
            width: 100px;
            height: 140px;
            left: 20px;
            top: 20px;
            background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
            border-radius: 12px 12px 30px 30px;
            border: 2px solid rgba(255,255,255,0.1);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        .cup-water {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.6), rgba(37, 99, 235, 0.8));
            transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0 0 28px 28px;
        }
        .cup-water::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(180deg, rgba(255,255,255,0.3), transparent);
            border-radius: 50%;
        }
        .cup-water.wave {
            animation: waterWave 1s ease-in-out;
        }
        @keyframes waterWave {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(-8px); }
            75% { transform: translateY(4px); }
        }

        .cup-handle {
            position: absolute;
            width: 30px;
            height: 50px;
            right: 0;
            top: 50px;
            border: 4px solid rgba(255,255,255,0.15);
            border-left: none;
            border-radius: 0 20px 20px 0;
        }

        .cup-label {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75em;
            color: #64748b;
            white-space: nowrap;
        }

        /* 水量刻度 */
        .water-marks {
            position: absolute;
            right: 8px;
            top: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
        }
        .water-mark {
            width: 8px;
            height: 1px;
            background: rgba(255,255,255,0.2);
        }

        /* 时间进度条 */
        .timer-bar {
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .timer-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #64748b;
            margin-bottom: 8px;
        }
        .timer-track {
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .timer-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s, background 0.5s;
            position: relative;
        }
        .timer-fill.blue { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .timer-fill.orange { background: linear-gradient(90deg, #ea580c, #fb923c); }
        .timer-fill.green { background: linear-gradient(90deg, #16a34a, #22c55e); }

        /* 数据统计 */
        .stats-area {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            padding: 0 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
        }
        .stat-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }
        .stat-card .stat-icon {
            font-size: 1.5em;
            margin-bottom: 6px;
        }
        .stat-card .stat-value {
            font-size: 1.4em;
            font-weight: 700;
            color: #e2e8f0;
        }
        .stat-card .stat-label {
            font-size: 0.7em;
            color: #64748b;
            margin-top: 2px;
        }

        /* 控制按钮区 */
        .controls {
            display: flex;
            gap: 12px;
            padding: 0 20px 20px;
            justify-content: center;
        }
        .ctrl-btn {
            flex: 1;
            max-width: 160px;
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.drink {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .ctrl-btn.drink:hover {
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }
        .ctrl-btn.reset {
            background: rgba(255,255,255,0.08);
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ctrl-btn.reset:hover {
            background: rgba(255,255,255,0.12);
        }

        /* 底部提示 */
        .footer-hint {
            text-align: center;
            padding: 10px 20px 20px;
            color: #475569;
            font-size: 0.75em;
            line-height: 1.6;
        }

        /* 喝水动画粒子 */
        .drink-particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 100;
            animation: drinkFly 1s ease-out forwards;
        }
        @keyframes drinkFly {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
        }

        /* 气泡效果 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            animation: bubbleRise 3s ease-in infinite;
            pointer-events: none;
        }
        @keyframes bubbleRise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-100px) scale(0.3); opacity: 0; }
        }

        /* 提示弹窗 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 20px 30px;
            border-radius: 16px;
            font-size: 1.1em;
            z-index: 200;
            transition: all 0.3s;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .toast.show {
            transform: translate(-50%, -50%) scale(1);
        }

        /* 响应式 */
        @media (max-width: 380px) {
            .lamp-area { width: 160px; height: 160px; }
            .lamp-glow { width: 160px; height: 160px; }
            .cup-area { width: 120px; height: 160px; }
            .cup-body { width: 85px; height: 120px; }
            .stats-area { gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部 -->
        <div class="header">
            <h1>💡 光饮伴侣</h1>
            <p>智能水杯 × 氛围灯 · 喝水养成游戏</p>
        </div>

        <!-- 桌面场景 -->
        <div class="desk-scene">
            <!-- 氛围灯 -->
            <div class="lamp-area">
                <div class="lamp-glow blue" id="lampGlow"></div>
                <div class="lamp-body blue" id="lampBody">💡</div>
                <div class="lamp-stand"></div>
            </div>

            <!-- 状态文字 -->
            <div class="status-text">
                <div class="main blue" id="statusMain">状态良好，继续保持</div>
                <div class="sub" id="statusSub">距离上次喝水已过去 0 分钟</div>
            </div>

            <!-- 时间进度条 -->
            <div class="timer-bar">
                <div class="timer-label">
                    <span>上次喝水</span>
                    <span id="timerText">0 / 60 分钟</span>
                </div>
                <div class="timer-track">
                    <div class="timer-fill blue" id="timerFill" style="width: 0%"></div>
                </div>
            </div>

            <!-- 智能水杯 -->
            <div class="cup-area" id="cupArea" onclick="drinkWater()">
                <div class="cup-body">
                    <div class="cup-water" id="cupWater" style="height: 60%"></div>
                    <div class="water-marks">
                        <div class="water-mark"></div>
                        <div class="water-mark"></div>
                        <div class="water-mark"></div>
                        <div class="water-mark"></div>
                    </div>
                </div>
                <div class="cup-handle"></div>
                <div class="cup-label">点击喝水 💧</div>
            </div>
        </div>

        <!-- 数据统计 -->
        <div class="stats-area">
            <div class="stat-card">
                <div class="stat-icon">💧</div>
                <div class="stat-value" id="todayDrink">3</div>
                <div class="stat-label">今日喝水</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value" id="avgInterval">45</div>
                <div class="stat-label">平均间隔(分)</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="streak">5</div>
                <div class="stat-label">连续达标</div>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="ctrl-btn drink" onclick="drinkWater()">
                <span>💧</span> 喝一口水
            </button>
            <button class="ctrl-btn reset" onclick="resetTimer()">
                <span>🔄</span> 重置计时
            </button>
        </div>

        <div class="footer-hint">
            超过 1 小时没喝水，台灯会变成橙色提醒你<br>
            喝水后灯光变回蓝色，像在跟台灯"玩游戏"
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== 状态变量 =====
        let elapsedMinutes = 0;
        let waterLevel = 60;
        let todayCount = 3;
        let streak = 5;
        let timerInterval = null;
        let isOrange = false;
        const THRESHOLD = 60; // 1小时提醒阈值

        // ===== DOM 元素 =====
        const lampGlow = document.getElementById('lampGlow');
        const lampBody = document.getElementById('lampBody');
        const statusMain = document.getElementById('statusMain');
        const statusSub = document.getElementById('statusSub');
        const timerFill = document.getElementById('timerFill');
        const timerText = document.getElementById('timerText');
        const cupWater = document.getElementById('cupWater');
        const toast = document.getElementById('toast');

        // ===== 计时器 =====
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedMinutes++;
                updateUI();
                
                // 超过阈值，变橙色
                if (elapsedMinutes >= THRESHOLD && !isOrange) {
                    setOrange();
                }
            }, 1000); // 实际用1000ms=1分钟，演示加速
        }

        function updateUI() {
            const progress = Math.min((elapsedMinutes / THRESHOLD) * 100, 100);
            timerFill.style.width = progress + '%';
            timerText.textContent = `${elapsedMinutes} / ${THRESHOLD} 分钟`;
            statusSub.textContent = `距离上次喝水已过去 ${elapsedMinutes} 分钟`;

            // 进度条颜色变化
            if (elapsedMinutes < THRESHOLD * 0.5) {
                timerFill.className = 'timer-fill blue';
            } else if (elapsedMinutes < THRESHOLD) {
                timerFill.className = 'timer-fill green';
            } else {
                timerFill.className = 'timer-fill orange';
            }
        }

        // ===== 变橙色（提醒状态）=====
        function setOrange() {
            isOrange = true;
            lampGlow.className = 'lamp-glow orange pulse';
            lampBody.className = 'lamp-body orange';
            statusMain.className = 'main orange';
            statusMain.textContent = '该喝水啦！台灯在提醒你呢';
            showToast('💡 台灯变橙色了！\n它在提醒你该喝水了');
        }

        // ===== 变蓝色（正常状态）=====
        function setBlue() {
            isOrange = false;
            lampGlow.className = 'lamp-glow blue';
            lampBody.className = 'lamp-body blue';
            statusMain.className = 'main blue';
            statusMain.textContent = '状态良好，继续保持';
        }

        // ===== 变绿色（喝水后反馈）=====
        function setGreen() {
            lampGlow.className = 'lamp-glow green';
            lampBody.className = 'lamp-body green';
            statusMain.className = 'main green';
            statusMain.textContent = '做得好！灯光为你点赞';
            setTimeout(() => {
                setBlue();
            }, 2000);
        }

        // ===== 喝水 =====
        function drinkWater() {
            // 减少水量
            waterLevel = Math.max(0, waterLevel - 15);
            cupWater.style.height = waterLevel + '%';
            cupWater.classList.add('wave');
            setTimeout(() => cupWater.classList.remove('wave'), 1000);

            // 如果水快没了，提示加水
            if (waterLevel <= 0) {
                waterLevel = 80;
                setTimeout(() => {
                    cupWater.style.height = waterLevel + '%';
                    showToast('💧 水杯已自动续满\n（实际产品需手动加水）');
                }, 800);
            }

            // 重置计时
            elapsedMinutes = 0;
            isOrange = false;
            updateUI();
            setGreen();

            // 更新数据
            todayCount++;
            document.getElementById('todayDrink').textContent = todayCount;

            // 喝水粒子效果
            createDrinkParticles();

            // 气泡效果
            createBubbles();

            // 提示
            const messages = [
                '💧 咕嘟咕嘟~ 喝得好！',
                '🌟 台灯变蓝了，它很开心！',
                '💪 继续保持，身体感谢你！',
                '✨ 又完成一次喝水目标！'
            ];
            if (!isOrange) {
                showToast(messages[Math.floor(Math.random() * messages.length)]);
            }
        }

        // ===== 重置计时 =====
        function resetTimer() {
            elapsedMinutes = 0;
            isOrange = false;
            updateUI();
            setBlue();
            showToast('🔄 计时器已重置');
        }

        // ===== 喝水粒子效果 =====
        function createDrinkParticles() {
            const cupRect = document.getElementById('cupArea').getBoundingClientRect();
            const cx = cupRect.left + cupRect.width / 2;
            const cy = cupRect.top + cupRect.height / 2;

            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.className = 'drink-particle';
                const size = 6 + Math.random() * 10;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = `rgba(${100 + Math.random() * 100}, ${150 + Math.random() * 100}, 255, ${0.5 + Math.random() * 0.5})`;
                p.style.left = cx + 'px';
                p.style.top = cy + 'px';
                const dx = (Math.random() - 0.5) * 300;
                const dy = -(100 + Math.random() * 200);
                p.style.setProperty('--dx', dx + 'px');
                p.style.setProperty('--dy', dy + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        // ===== 气泡效果 =====
        function createBubbles() {
            const cupBody = document.querySelector('.cup-body');
            for (let i = 0; i < 5; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = 4 + Math.random() * 8;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = (20 + Math.random() * 60) + 'px';
                bubble.style.bottom = (10 + Math.random() * 30) + '%';
                bubble.style.animationDelay = (Math.random() * 0.5) + 's';
                cupBody.appendChild(bubble);
                setTimeout(() => bubble.remove(), 3000);
            }
        }

        // ===== Toast =====
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ===== 初始化 =====
        function init() {
            // 模拟已经过了一段时间
            elapsedMinutes = 35;
            updateUI();
            startTimer();
            
            // 初始提示
            setTimeout(() => {
                showToast('👋 欢迎使用光饮伴侣！\n点击水杯或按钮来喝水');
            }, 800);
        }

        init();
    </script>
</body>
</html>
