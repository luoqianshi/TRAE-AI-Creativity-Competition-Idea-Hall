<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>懒虫窗帘 - 寝室床头蓝牙窗帘控制器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #e8e8e8;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        /* 顶部 */
        .header {
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .header p {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
        }

        /* 寝室场景模拟 */
        .room-scene {
            position: relative;
            height: 280px;
            margin: 0 20px 20px;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 60%, #f5f0e8 60%, #e8dcc8 100%);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .window-frame {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 160px;
            border: 6px solid #8B7355;
            border-radius: 4px;
            background: #87CEEB;
            overflow: hidden;
        }
        .window-frame::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 100%;
            background: #8B7355;
            left: 50%;
            transform: translateX(-50%);
        }
        .window-frame::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: #8B7355;
            top: 50%;
            transform: translateY(-50%);
        }
        /* 窗外景色 */
        .outside-view {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }
        .sun {
            position: absolute;
            top: 20px;
            right: 30px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: sunPulse 3s ease-in-out infinite;
        }
        @keyframes sunPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); }
        }
        .cloud {
            position: absolute;
            background: white;
            border-radius: 20px;
            opacity: 0.8;
        }
        .cloud1 { width: 40px; height: 15px; top: 25px; left: 20px; animation: cloudFloat 8s ease-in-out infinite; }
        .cloud2 { width: 30px; height: 12px; top: 45px; left: 80px; animation: cloudFloat 10s ease-in-out infinite reverse; }
        @keyframes cloudFloat {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(15px); }
        }

        /* 窗帘 */
        .curtain {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(180deg, #6c5ce7 0%, #a29bfe 100%);
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }
        .curtain::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.1));
        }
        .curtain.left { left: 0; transform-origin: left; }
        .curtain.right { right: 0; transform-origin: right; }
        .curtain.closed.left { transform: scaleX(1); }
        .curtain.closed.right { transform: scaleX(1); }
        .curtain.open.left { transform: scaleX(0.15); }
        .curtain.open.right { transform: scaleX(0.15); }
        .curtain-pattern {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 8px,
                rgba(255,255,255,0.05) 8px,
                rgba(255,255,255,0.05) 10px
            );
        }

        /* 床铺 */
        .bed {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 60px;
            background: linear-gradient(180deg, #d4a574 0%, #c4956a 100%);
            border-radius: 8px 8px 0 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .bed::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 5px;
            right: 5px;
            height: 20px;
            background: linear-gradient(180deg, #f5f0e8, #e8dcc8);
            border-radius: 4px;
        }
        .bed-label {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6em;
            color: rgba(0,0,0,0.4);
        }

        /* 床头控制器 */
        .bedside-controller {
            position: absolute;
            bottom: 35px;
            right: 25px;
            width: 50px;
            height: 70px;
            background: linear-gradient(145deg, #2d3436, #1e272e);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .bedside-btn {
            width: 32px;
            height: 22px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.7em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .bedside-btn.open-btn {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
        }
        .bedside-btn.close-btn {
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            color: white;
        }
        .bedside-btn:active { transform: scale(0.9); }
        .controller-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.55em;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
        }

        /* 状态显示 */
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0 20px 20px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .status-icon {
            font-size: 1.3em;
        }
        .status-text {
            font-size: 0.85em;
        }
        .status-text .status-label {
            color: #888;
            font-size: 0.75em;
        }
        .status-text .status-value {
            color: #e8e8e8;
            font-weight: 600;
        }

        /* 控制面板 */
        .control-panel {
            padding: 0 20px 20px;
        }
        .panel-title {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .main-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .control-btn {
            padding: 20px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 1em;
            font-weight: 600;
        }
        .control-btn:active { transform: scale(0.95); }
        .control-btn .btn-icon {
            font-size: 2em;
        }
        .control-btn.open {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
            box-shadow: 0 4px 15px rgba(116, 185, 255, 0.3);
        }
        .control-btn.open:hover {
            box-shadow: 0 6px 25px rgba(116, 185, 255, 0.5);
        }
        .control-btn.close {
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            color: white;
            box-shadow: 0 4px 15px rgba(162, 155, 254, 0.3);
        }
        .control-btn.close:hover {
            box-shadow: 0 6px 25px rgba(162, 155, 254, 0.5);
        }

        /* 快捷场景 */
        .scene-section {
            padding: 0 20px 20px;
        }
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .scene-btn {
            aspect-ratio: 1;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: #aaa;
            font-size: 0.75em;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .scene-btn:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }
        .scene-btn:active { transform: scale(0.95); }
        .scene-btn.active {
            background: linear-gradient(135deg, rgba(116,185,255,0.2), rgba(162,155,254,0.2));
            border-color: rgba(116,185,255,0.3);
            color: #74b9ff;
        }
        .scene-btn .scene-icon {
            font-size: 1.5em;
        }

        /* 定时设置 */
        .timer-section {
            padding: 0 20px 20px;
        }
        .timer-card {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .timer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .timer-row:last-child { border-bottom: none; }
        .timer-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .timer-info .timer-icon {
            font-size: 1.3em;
        }
        .timer-info .timer-text {
            font-size: 0.85em;
        }
        .timer-info .timer-text .timer-label {
            color: #888;
            font-size: 0.75em;
        }
        /* 开关 */
        .toggle {
            width: 44px;
            height: 24px;
            border-radius: 12px;
            background: #333;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        .toggle.active { background: linear-gradient(135deg, #74b9ff, #0984e3); }
        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        .toggle.active::after { transform: translateX(20px); }

        /* 底部信息 */
        .footer-info {
            text-align: center;
            padding: 10px 20px 30px;
            color: #555;
            font-size: 0.75em;
            line-height: 1.6;
        }

        /* 蓝牙连接动画 */
        .bluetooth-connecting {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .bluetooth-connecting.active { display: flex; }
        .bt-icon {
            font-size: 4em;
            animation: btPulse 1s ease-in-out infinite;
            margin-bottom: 16px;
        }
        @keyframes btPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .bt-text {
            color: white;
            font-size: 1.1em;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(20, 20, 40, 0.95);
            color: white;
            padding: 16px 28px;
            border-radius: 14px;
            font-size: 0.95em;
            z-index: 300;
            transition: all 0.3s;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .toast.show { transform: translate(-50%, -50%) scale(1); }

        /* 响应式 */
        @media (max-width: 380px) {
            .room-scene { height: 240px; }
            .window-frame { width: 160px; height: 130px; }
            .scene-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
            .control-btn { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部 -->
        <div class="header">
            <h1>🛏️ 懒虫窗帘</h1>
            <p>床头蓝牙控制 · 不用下床开关窗帘</p>
        </div>

        <!-- 寝室场景 -->
        <div class="room-scene">
            <div class="window-frame">
                <div class="outside-view">
                    <div class="sun"></div>
                    <div class="cloud cloud1"></div>
                    <div class="cloud cloud2"></div>
                </div>
                <div class="curtain left closed" id="curtainLeft">
                    <div class="curtain-pattern"></div>
                </div>
                <div class="curtain right closed" id="curtainRight">
                    <div class="curtain-pattern"></div>
                </div>
            </div>
            <div class="bed">
                <div class="bed-label">我的床</div>
            </div>
            <div class="bedside-controller">
                <button class="bedside-btn open-btn" onclick="openCurtain()">▲</button>
                <button class="bedside-btn close-btn" onclick="closeCurtain()">▼</button>
                <div class="controller-label">床头遥控</div>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-icon" id="statusIcon">🌙</span>
                <div class="status-text">
                    <div class="status-label">窗帘状态</div>
                    <div class="status-value" id="statusText">已关闭</div>
                </div>
            </div>
            <div class="status-item">
                <span class="status-icon">🔵</span>
                <div class="status-text">
                    <div class="status-label">蓝牙连接</div>
                    <div class="status-value">已连接</div>
                </div>
            </div>
        </div>

        <!-- 主控制 -->
        <div class="control-panel">
            <div class="panel-title">🎮 主控制</div>
            <div class="main-controls">
                <button class="control-btn open" onclick="openCurtain()">
                    <span class="btn-icon">☀️</span>
                    <span>打开窗帘</span>
                </button>
                <button class="control-btn close" onclick="closeCurtain()">
                    <span class="btn-icon">🌙</span>
                    <span>关闭窗帘</span>
                </button>
            </div>
        </div>

        <!-- 快捷场景 -->
        <div class="scene-section">
            <div class="panel-title">⚡ 快捷场景</div>
            <div class="scene-grid">
                <div class="scene-btn active" onclick="setScene('sleep')">
                    <span class="scene-icon">😴</span>
                    <span>睡觉</span>
                </div>
                <div class="scene-btn" onclick="setScene('wake')">
                    <span class="scene-icon">⏰</span>
                    <span>起床</span>
                </div>
                <div class="scene-btn" onclick="setScene('nap')">
                    <span class="scene-icon">💤</span>
                    <span>午睡</span>
                </div>
                <div class="scene-btn" onclick="setScene('study')">
                    <span class="scene-icon">📖</span>
                    <span>学习</span>
                </div>
            </div>
        </div>

        <!-- 定时设置 -->
        <div class="timer-section">
            <div class="panel-title">⏰ 定时设置</div>
            <div class="timer-card">
                <div class="timer-row">
                    <div class="timer-info">
                        <span class="timer-icon">🌅</span>
                        <div class="timer-text">
                            <div>早上自动开窗帘</div>
                            <div class="timer-label">07:00 · 模拟日出唤醒</div>
                        </div>
                    </div>
                    <div class="toggle active" onclick="toggleTimer(this)"></div>
                </div>
                <div class="timer-row">
                    <div class="timer-info">
                        <span class="timer-icon">🌙</span>
                        <div class="timer-text">
                            <div>晚上自动关窗帘</div>
                            <div class="timer-label">22:30 · 保护隐私助眠</div>
                        </div>
                    </div>
                    <div class="toggle active" onclick="toggleTimer(this)"></div>
                </div>
                <div class="timer-row">
                    <div class="timer-info">
                        <span class="timer-icon">💤</span>
                        <div class="timer-text">
                            <div>午睡自动关窗帘</div>
                            <div class="timer-label">12:30 · 营造暗光环境</div>
                        </div>
                    </div>
                    <div class="toggle" onclick="toggleTimer(this)"></div>
                </div>
            </div>
        </div>

        <div class="footer-info">
            蓝牙连接范围：10米<br>
            支持手机App远程控制 · 可设置定时自动开关
        </div>
    </div>

    <!-- 蓝牙连接动画 -->
    <div class="bluetooth-connecting" id="btConnecting">
        <div class="bt-icon">🔵</div>
        <div class="bt-text">正在连接蓝牙...</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let isCurtainOpen = false;

        // ===== 打开窗帘 =====
        function openCurtain() {
            if (isCurtainOpen) {
                showToast('☀️ 窗帘已经是打开状态');
                return;
            }
            
            const left = document.getElementById('curtainLeft');
            const right = document.getElementById('curtainRight');
            
            left.classList.remove('closed');
            left.classList.add('open');
            right.classList.remove('closed');
            right.classList.add('open');
            
            isCurtainOpen = true;
            updateStatus('☀️', '已打开', '阳光照进来了！');
        }

        // ===== 关闭窗帘 =====
        function closeCurtain() {
            if (!isCurtainOpen) {
                showToast('🌙 窗帘已经是关闭状态');
                return;
            }
            
            const left = document.getElementById('curtainLeft');
            const right = document.getElementById('curtainRight');
            
            left.classList.remove('open');
            left.classList.add('closed');
            right.classList.remove('open');
            right.classList.add('closed');
            
            isCurtainOpen = false;
            updateStatus('🌙', '已关闭', '可以安心睡觉啦');
        }

        // ===== 更新状态 =====
        function updateStatus(icon, text, message) {
            document.getElementById('statusIcon').textContent = icon;
            document.getElementById('statusText').textContent = text;
            if (message) showToast(message);
        }

        // ===== 设置场景 =====
        function setScene(scene) {
            document.querySelectorAll('.scene-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            const scenes = {
                sleep: () => { closeCurtain(); showToast('😴 睡眠模式\n窗帘已关闭，晚安！'); },
                wake: () => { openCurtain(); showToast('⏰ 起床模式\n窗帘已打开，早安！'); },
                nap: () => { closeCurtain(); showToast('💤 午睡模式\n窗帘已关闭，睡个好觉'); },
                study: () => { openCurtain(); showToast('📖 学习模式\n窗帘已打开，光线充足'); }
            };
            
            if (scenes[scene]) scenes[scene]();
        }

        // ===== 定时开关 =====
        function toggleTimer(el) {
            el.classList.toggle('active');
            const isActive = el.classList.contains('active');
            const label = el.previousElementSibling.querySelector('.timer-text div:first-child').textContent;
            showToast(isActive ? `✅ ${label} 已开启` : `❌ ${label} 已关闭`);
        }

        // ===== Toast =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerHTML = message.replace(/\n/g, '<br>');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ===== 初始化 =====
        function init() {
            setTimeout(() => {
                showToast('👋 欢迎来到懒虫窗帘！\n点击按钮，不用下床就能控制窗帘');
            }, 500);
        }

        init();
    </script>
</body>
</html>
