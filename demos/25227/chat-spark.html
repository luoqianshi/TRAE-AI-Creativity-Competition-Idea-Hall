<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>话匣子 · 聊天话题生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --coral: #E85D5D;
            --coral-light: #FF7676;
            --gold: #F4C542;
            --gold-light: #FDE7A0;
            --teal: #3A9B8F;
            --teal-light: #7ECDC1;
            --cream: #FDF6EC;
            --warm-white: #FFFBF5;
            --dark: #2D2A24;
            --dark-soft: #4A453E;
            --grey: #8A857E;
            --light-grey: #D5D0C8;
            --bg-gradient: linear-gradient(160deg, #FFFBF5 0%, #FDF6EC 40%, #FEF0E3 100%);
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'DM Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-gradient);
            color: var(--dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== 顶部装饰 ========== */
        .top-ornament {
            height: 6px;
            background: linear-gradient(90deg, var(--coral), var(--gold), var(--teal), var(--gold), var(--coral));
            background-size: 200% 100%;
            animation: shimmer 6s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        /* ========== 头部 ========== */
        .header {
            text-align: center;
            padding: 60px 20px 30px;
            position: relative;
        }

        .header-badge {
            display: inline-block;
            background: var(--coral);
            color: white;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            padding: 4px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .header h1 {
            font-family: var(--font-display);
            font-size: clamp(40px, 7vw, 72px);
            font-weight: 700;
            color: var(--dark);
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .header h1 .highlight {
            background: linear-gradient(135deg, var(--coral), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 17px;
            color: var(--grey);
            margin-top: 16px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* ========== 装饰浮动元素 ========== */
        .float-decor {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            font-size: 60px;
            opacity: 0.06;
            animation: floatAround 20s ease-in-out infinite;
        }
        .float-decor:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .float-decor:nth-child(2) { top: 60%; right: 8%; animation-delay: -5s; font-size: 80px; }
        .float-decor:nth-child(3) { bottom: 15%; left: 10%; animation-delay: -10s; }
        .float-decor:nth-child(4) { top: 30%; right: 3%; animation-delay: -15s; font-size: 40px; }

        @keyframes floatAround {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(15px, -20px) rotate(5deg); }
            50% { transform: translate(-10px, 10px) rotate(-3deg); }
            75% { transform: translate(20px, 15px) rotate(4deg); }
        }

        /* ========== 主容器 ========== */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* ========== Step 部件 ========== */
        .step-section {
            margin-bottom: 48px;
        }

        .step-label {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .step-number {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--dark);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-display);
            flex-shrink: 0;
        }

        .step-label h2 {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 600;
            color: var(--dark);
        }

        .step-label h2 small {
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 400;
            color: var(--grey);
            margin-left: 8px;
        }

        /* ========== 人物选择 ========== */
        .person-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }

        .person-card {
            background: var(--warm-white);
            border: 2px solid var(--light-grey);
            border-radius: 16px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .person-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(232, 93, 93, 0.06));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .person-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(45, 42, 36, 0.1);
            border-color: var(--coral);
        }

        .person-card:hover::before { opacity: 1; }

        .person-card.active {
            border-color: var(--coral);
            background: white;
            box-shadow: 0 8px 24px rgba(232, 93, 93, 0.15);
            transform: translateY(-4px) scale(1.02);
        }

        .person-card.active .person-emoji { transform: scale(1.15); }

        .person-emoji {
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
            transition: transform 0.3s;
        }

        .person-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
        }

        .person-hint {
            font-size: 12px;
            color: var(--grey);
            margin-top: 4px;
        }

        .person-card .selected-check {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--coral);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .person-card.active .selected-check {
            opacity: 1;
            transform: scale(1);
        }

        /* ========== 场景选择 ========== */
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .scene-card {
            background: var(--warm-white);
            border: 2px solid var(--light-grey);
            border-radius: 14px;
            padding: 18px 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .scene-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(45, 42, 36, 0.08);
            border-color: var(--gold);
        }

        .scene-card.active {
            border-color: var(--gold);
            background: white;
            box-shadow: 0 8px 24px rgba(244, 197, 66, 0.15);
            transform: translateY(-3px);
        }

        .scene-emoji { font-size: 28px; flex-shrink: 0; }

        .scene-info h4 {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
        }

        .scene-info p {
            font-size: 12px;
            color: var(--grey);
            margin-top: 2px;
        }

        /* ========== 生成按钮 ========== */
        .generate-area {
            text-align: center;
            margin: 40px 0;
        }

        .generate-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--dark);
            color: white;
            border: none;
            padding: 18px 52px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .generate-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--coral), var(--gold));
            opacity: 0;
            transition: opacity 0.4s;
        }

        .generate-btn:hover::before { opacity: 1; }

        .generate-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 40px rgba(45, 42, 36, 0.2);
        }

        .generate-btn > * { position: relative; z-index: 1; }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .generate-btn .btn-icon {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .generate-btn:hover .btn-icon { transform: rotate(-10deg) scale(1.1); }

        .generate-btn.generating .btn-icon {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== 结果区域 ========== */
        .results-area {
            display: none;
            margin-top: 20px;
            margin-bottom: 60px;
        }

        .results-area.visible {
            display: block;
            animation: fadeUpIn 0.6s ease;
        }

        @keyframes fadeUpIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--light-grey);
        }

        .results-header h3 {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
        }

        .results-header h3 span {
            color: var(--coral);
        }

        .results-header .regen-btn {
            background: none;
            border: 2px solid var(--light-grey);
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font-body);
            color: var(--grey);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .results-header .regen-btn:hover {
            border-color: var(--coral);
            color: var(--coral);
            background: rgba(232, 93, 93, 0.05);
        }

        /* ========== 话题卡片 ========== */
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .topic-card {
            background: white;
            border-radius: 16px;
            padding: 22px 20px;
            box-shadow: 0 4px 16px rgba(45, 42, 36, 0.06);
            transition: all 0.3s;
            animation: cardIn 0.5s ease both;
            border: 1px solid rgba(213, 208, 200, 0.3);
        }

        .topic-card:nth-child(1) { animation-delay: 0.05s; }
        .topic-card:nth-child(2) { animation-delay: 0.12s; }
        .topic-card:nth-child(3) { animation-delay: 0.19s; }
        .topic-card:nth-child(4) { animation-delay: 0.26s; }
        .topic-card:nth-child(5) { animation-delay: 0.33s; }
        .topic-card:nth-child(6) { animation-delay: 0.40s; }
        .topic-card:nth-child(7) { animation-delay: 0.47s; }
        .topic-card:nth-child(8) { animation-delay: 0.54s; }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .topic-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(45, 42, 36, 0.1);
        }

        .topic-category {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--teal);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .topic-category .cat-emoji { font-size: 16px; }

        .topic-content {
            font-size: 16px;
            line-height: 1.7;
            color: var(--dark-soft);
        }

        .topic-content .keyword {
            display: inline-block;
            background: linear-gradient(135deg, rgba(244, 197, 66, 0.15), rgba(244, 197, 66, 0.05));
            color: var(--dark);
            padding: 1px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--grey);
        }

        .empty-state .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .empty-state h4 {
            font-family: var(--font-display);
            font-size: 22px;
            color: var(--dark-soft);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 15px;
            line-height: 1.6;
        }

        /* ========== 底部 ========== */
        .footer {
            text-align: center;
            padding: 40px 20px 30px;
            color: var(--grey);
            font-size: 13px;
            border-top: 1px solid var(--light-grey);
            max-width: 960px;
            margin: 0 auto;
        }

        .footer a {
            color: var(--coral);
            text-decoration: none;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .header { padding: 40px 16px 24px; }
            .header h1 { font-size: 34px; }
            .person-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .person-card { padding: 14px 8px; }
            .person-emoji { font-size: 28px; }
            .person-name { font-size: 13px; }
            .scene-grid { grid-template-columns: 1fr; }
            .generate-btn { padding: 16px 36px; font-size: 15px; width: 100%; }
            .topics-grid { grid-template-columns: 1fr; }
            .results-header { flex-direction: column; gap: 12px; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- 浮动装饰 -->
    <div class="float-decor">💬</div>
    <div class="float-decor">🗣️</div>
    <div class="float-decor">✨</div>
    <div class="float-decor">🎭</div>

    <!-- 顶部彩条 -->
    <div class="top-ornament"></div>

    <!-- 头部 -->
    <header class="header">
        <div class="header-badge">🎙️ 社交利器</div>
        <h1>
            <span class="highlight">话匣子</span> · 聊什么
        </h1>
        <p>选一个人，挑一个场景，让沉默变金句。<br>再也不怕没话聊。</p>
    </header>

    <!-- 主内容 -->
    <div class="container">
        <!-- Step 1: 选择对象 -->
        <div class="step-section">
            <div class="step-label">
                <div class="step-number">1</div>
                <h2>和谁聊？ <small>选择聊天对象</small></h2>
            </div>
            <div class="person-grid" id="personGrid">
                <div class="person-card" data-person="parent">
                    <div class="selected-check">✓</div>
                    <span class="person-emoji">👨‍👩‍👧‍👦</span>
                    <div class="person-name">父母</div>
                    <div class="person-hint">家人长辈</div>
                </div>
                <div class="person-card" data-person="lover">
                    <div class="selected-check">✓</div>
                    <span class="person-emoji">💑</span>
                    <div class="person-name">情侣</div>
                    <div class="person-hint">另一半</div>
                </div>
                <div class="person-card" data-person="stranger">
                    <div class="selected-check">✓</div>
                    <span class="person-emoji">👋</span>
                    <div class="person-name">陌生人</div>
                    <div class="person-hint">初次见面</div>
                </div>
                <div class="person-card" data-person="colleague">
                    <div class="selected-check">✓</div>
                    <span class="person-emoji">💼</span>
                    <div class="person-name">同事</div>
                    <div class="person-hint">工作伙伴</div>
                </div>
                <div class="person-card" data-person="friend">
                    <div class="selected-check">✓</div>
                    <span class="person-emoji">🍻</span>
                    <div class="person-name">朋友</div>
                    <div class="person-hint">死党闺蜜</div>
                </div>
                <div class="person-card" data-person="classmate">
                    <div class="selected-check">✓</div>
                    <span class="person-emoji">🎒</span>
                    <div class="person-name">同学</div>
                    <div class="person-hint">同窗之谊</div>
                </div>
                <div class="person-card" data-person="blinddate">
                    <div class="selected-check">✓</div>
                    <span class="person-emoji">💘</span>
                    <div class="person-name">相亲对象</div>
                    <div class="person-hint">缘分一线牵</div>
                </div>
                <div class="person-card" data-person="child">
                    <div class="selected-check">✓</div>
                    <span class="person-emoji">👶</span>
                    <div class="person-name">儿女</div>
                    <div class="person-hint">自家孩子</div>
                </div>
            </div>
        </div>

        <!-- Step 2: 选择场景 -->
        <div class="step-section">
            <div class="step-label">
                <div class="step-number">2</div>
                <h2>什么场景？ <small>挑选最接近的情境</small></h2>
            </div>
            <div class="scene-grid" id="sceneGrid">
                <!-- 由 JS 动态渲染 -->
            </div>
        </div>

        <!-- Step 3: 生成按钮 -->
        <div class="generate-area">
            <button class="generate-btn" id="generateBtn">
                <span class="btn-icon">✨</span>
                <span>生成聊天话题</span>
            </button>
        </div>

        <!-- 结果 -->
        <div class="results-area" id="resultsArea">
            <div class="results-header">
                <h3>💡 试试聊这些 <span id="resultLabel"></span></h3>
                <button class="regen-btn" id="regenBtn">🔄 换一批</button>
            </div>
            <div class="topics-grid" id="topicsGrid"></div>
        </div>
    </div>

    <!-- 底部 -->
    <footer class="footer">
        话匣子 · 再也不怕没话聊 &nbsp;|&nbsp; Made with 💬
    </footer>

    <script>
        // ========== 话题数据库 ==========
        const TOPICS = {
            parent: {
                label: '👨‍👩‍👧‍👦 父母',
                scenarios: {
                    '晚餐聊天': {
                        icon: '🍲',
                        desc: '坐在饭桌前的日常',
                        topics: [
                            { cat: '近况关心', icon: '💛', text: '最近身体怎么样？有没有哪里不舒服？' },
                            { cat: '生活日常', icon: '🏠', text: '今天做了什么好吃的？教我怎么做那个菜。' },
                            { cat: '新闻慢聊', icon: '📰', text: '最近新闻说养老金又要涨了，你们听说了吗？' },
                            { cat: '天气问候', icon: '🌤️', text: '这几天降温了，你们出门多穿点没有？' },
                            { cat: '家庭回忆', icon: '📸', text: '还记得我小时候最喜欢吃的那道菜吗？' },
                            { cat: '邻里故事', icon: '🏘️', text: '小区最近有什么新鲜事？隔壁王叔叔还在跳广场舞吗？' },
                            { cat: '健康科普', icon: '🩺', text: '我看网上说中老年人补钙要搭配维生素D，你们知道吗？' },
                            { cat: '未来计划', icon: '🎯', text: '等天气好了我们一起去公园走走吧，听说新开了个步道。' },
                            { cat: '催婚防御', icon: '🛡️', text: '妈，今天不聊找对象的事行吗？我先把饭吃完保命要紧。' },
                            { cat: '代沟现场', icon: '🤯', text: '你们说的那个"网上的东西"，能不能具体一点？我怀疑咱上的不是一个网。' },
                            { cat: '养生暴击', icon: '🧊', text: '爸你天天转发那些养生文章，我给你转一篇"如何科学地转发养生文章"，你看看？' },
                            { cat: '灵魂拷问', icon: '💀', text: '妈，你做的红烧肉到底放了什么？为什么外面永远做不出这个味？是不是有祖传秘方？' },
                            { cat: '工资汇报', icon: '💸', text: '工资嘛……跟我的发际线一样，稳中有降，不提也罢。' },
                        ]
                    },
                    '周末回家': {
                        icon: '🏡',
                        desc: '周末相聚的时刻',
                        topics: [
                            { cat: '近况关心', icon: '💛', text: '这周工作累不累？有没有好好吃饭？' },

                            { cat: '压力疏导', icon: '🌊', text: '觉得压力大的时候，可以跟我聊聊，我虽然不一定能帮上忙，但能听你说。' },
                            { cat: '价值观引导', icon: '🧭', text: '你觉得什么是最重要的？——不管你怎么回答，我都尊重你。' },
                            { cat: '成长肯定', icon: '🌟', text: '我觉得你最近长大了不少，很多事情能自己处理了，我挺欣慰的。' },
                            { cat: '社死现场', icon: '🫠', text: '我偷偷看了你朋友圈——结果发现你把我屏蔽了——行，我假装不知道。' },
                            { cat: '灵魂拷问', icon: '🧠', text: '你说你什么都跟我无话不谈——那你为什么从来不主动给我打电话？' },
                            { cat: '求生欲拉满', icon: '😭', text: '我知道我有时候很烦，但你能不能偶尔也主动跟我说说话？就当哄哄你妈/你爸。' },
                            { cat: '反差萌', icon: '🤪', text: '你小时候天天追着我问"为什么"，现在我问你一句你就嫌我烦——风水轮流转啊。' },
                            { cat: '梗文化', icon: '🤣', text: '当父母的终极矛盾：想管你又怕你烦，不管你又怕你走弯路——这叫"父母式薛定谔的关心"。' },
                        ]
                    },
                    '催婚催育': {
                        icon: '💍',
                        desc: '让父母最操心的头等大事',
                        topics: [
                            { cat: '温柔试探', icon: '🌸', text: '你那个同学/同事___好像结婚了吧？你们差不多大呢。' },
                            { cat: '侧面暗示', icon: '👀', text: '隔壁阿姨家的孩子都上幼儿园了——我不是说你啊，就是随便聊聊。' },
                            { cat: '直接出击', icon: '🎯', text: '你也老大不小了，有对象了吗？要不要给你介绍一个？' },
                            { cat: '长辈施压', icon: '👴', text: '你爷爷奶奶又问了——你什么时候带个对象回来让他们看看？' },
                            { cat: '理解包容', icon: '🤗', text: '其实我也不是催你，就是希望你身边有个人照顾你。' },
                            { cat: '幽默化解', icon: '😄', text: '算了算了，你开心就好——但你要是带个对象回来，我保证不吓跑对方。' },
                            { cat: '社死现场', icon: '💀', text: '我给你安排了一次相亲——对方人挺好的，就是你别再像上次一样把人家聊跑了。' },
                            { cat: '灵魂拷问', icon: '🤔', text: '你说你不想结婚——那你养我吗？我老了可指望你呢。' },
                            { cat: '求生欲拉满', icon: '🛡️', text: '我不催了不催了——但你看看人家___的孩子都会打酱油了（小声）。' },
                            { cat: '反差萌', icon: '🤪', text: '你说不结婚不生孩子——我当年也这么说的，然后就有了你。真香定律了解一下。' },
                            { cat: '梗文化', icon: '🤣', text: '催婚三连：第一年"不着急"，第二年"有对象了吗"，第三年"随便找个就行"——父母的底线在不断突破。' },
                        ]
                    }
                }
            }
        };

        // ========== 状态管理 ==========
        let selectedPerson = null;
        let selectedScene = null;

        const personGrid = document.getElementById('personGrid');
        const sceneGrid = document.getElementById('sceneGrid');
        const generateBtn = document.getElementById('generateBtn');
        const resultsArea = document.getElementById('resultsArea');
        const topicsGrid = document.getElementById('topicsGrid');
        const resultLabel = document.getElementById('resultLabel');
        const regenBtn = document.getElementById('regenBtn');

        // ========== 人物选择 ==========
        personGrid.querySelectorAll('.person-card').forEach(card => {
            card.addEventListener('click', () => {
                personGrid.querySelectorAll('.person-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                selectedPerson = card.dataset.person;
                selectedScene = null;
                renderScenes();
                resultsArea.classList.remove('visible');
            });
        });

        // ========== 场景渲染 ==========
        function renderScenes() {
            if (!selectedPerson) {
                sceneGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
                    <div class="empty-icon">👈</div>
                    <h4>先选一个聊天对象</h4>
                    <p>选好之后，场景会自动出现</p>
                </div>`;
                return;
            }

            const scenarios = TOPICS[selectedPerson].scenarios;
            sceneGrid.innerHTML = Object.entries(scenarios).map(([key, val]) => `
                <div class="scene-card" data-scene="${key}">
                    <div class="scene-emoji">${val.icon}</div>
                    <div class="scene-info">
                        <h4>${key}</h4>
                        <p>${val.desc}</p>
                    </div>
                </div>
            `).join('');

            sceneGrid.querySelectorAll('.scene-card').forEach(card => {
                card.addEventListener('click', () => {
                    sceneGrid.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    selectedScene = card.dataset.scene;
                });
            });
        }

        // 初始渲染
        renderScenes();

        // ========== 生成话题 ==========
        function generateTopics() {
            if (!selectedPerson || !selectedScene) return;

            resultsArea.classList.remove('visible');
            generateBtn.classList.add('generating');
            generateBtn.querySelector('span:last-child').textContent = '正在绞尽脑汁...';

            setTimeout(() => {
                const personData = TOPICS[selectedPerson];
                const sceneData = personData.scenarios[selectedScene];
                const topics = sceneData.topics;

                // 随机打乱后取全部
                const shuffled = [...topics].sort(() => Math.random() - 0.5);

                resultLabel.textContent = `${personData.label} · ${sceneData.icon} ${selectedScene}`;

                topicsGrid.innerHTML = shuffled.map(t => `
                    <div class="topic-card">
                        <div class="topic-category">
                            <span class="cat-emoji">${t.icon}</span>
                            ${t.cat}
                        </div>
                        <div class="topic-content">${t.text}</div>
                    </div>
                `).join('');

                resultsArea.classList.add('visible');
                generateBtn.classList.remove('generating');
                generateBtn.querySelector('span:last-child').textContent = '生成聊天话题';

                // 滚动到结果
                resultsArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 600);
        }

        generateBtn.addEventListener('click', generateTopics);
        regenBtn.addEventListener('click', generateTopics);
    </script>
</body>
</html>
