<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikuTap</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            min-height: 100vh;
            overflow: hidden;
            cursor: crosshair;
        }
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    let audioCtx = null;
    let masterGain = null;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.4;
        masterGain.connect(audioCtx.destination);
    }

    const notes = [
        261.63, 277.18, 293.66, 311.13, 328.63, 349.23,
        392.00, 415.30, 440.00, 466.16, 493.88, 523.25,
        587.33, 622.25, 659.25, 698.46, 739.99, 783.99,
        880.00, 932.33, 987.77, 1046.50, 1108.73, 1174.66
    ];

    const bassNotes = [65.41, 73.42, 82.41, 87.31, 98.00, 110.00];

    function playNote(index, isBass = false) {
        if (!audioCtx) return;
        const freq = isBass ? bassNotes[index % bassNotes.length] : notes[index % notes.length];
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = isBass ? 'sawtooth' : (index % 3 === 0 ? 'square' : 'sine');
        osc.frequency.value = freq;

        filter.type = 'lowpass';
        filter.frequency.value = isBass ? 400 : 2000;
        filter.Q.value = 5;

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    let particles = [];
    let clickEffects = [];

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 0.5) * 8 - 2;
            this.color = color;
            this.life = 1;
            this.decay = 0.015 + Math.random() * 0.01;
            this.size = 2 + Math.random() * 4;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.2;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.15;
            this.vx *= 0.98;
            this.vy *= 0.98;
            this.life -= this.decay;
            this.rotation += this.rotSpeed;
            return this.life > 0;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
            ctx.restore();
        }
    }

    class ClickRipple {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 0;
            this.maxRadius = 200;
            this.life = 1;
        }

        update() {
            this.radius += 15;
            this.life = 1 - this.radius / this.maxRadius;
            return this.life > 0;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255,255,255,${this.life * 0.3})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    let bgCircles = [];

    class BgCircle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * W;
            this.y = H + 50;
            this.size = 20 + Math.random() * 100;
            this.speed = 0.5 + Math.random() * 1;
            this.opacity = 0.02 + Math.random() * 0.05;
            this.hue = Math.random() * 360;
        }

        update() {
            this.y -= this.speed;
            this.x += Math.sin(this.y * 0.01) * 0.5;
            if (this.y < -this.size) this.reset();
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${this.opacity})`;
            ctx.fill();
        }
    }

    for (let i = 0; i < 20; i++) {
        bgCircles.push(new BgCircle());
    }

    const colors = [
        '#ff6b9d', '#c44569', '#ff8a5c', '#ffc75f',
        '#f9f871', '#78e08f', '#38ada9', '#3c40c6',
        '#8e44ad', '#fd79a8', '#a29bfe', '#00cec9'
    ];

    function spawnParticles(x, y, count = 30, isBeat = false) {
        for (let i = 0; i < count; i++) {
            const color = colors[Math.floor(Math.random() * colors.length)];
            const p = new Particle(x, y, color);
            if (isBeat) {
                p.vx *= 2;
                p.vy *= 2;
                p.size *= 1.5;
            }
            particles.push(p);
        }
    }

    let gridOffset = 0;

    function drawGrid() {
        gridOffset = (gridOffset + 0.5) % 50;
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;

        for (let x = gridOffset; x < W; x += 50) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.stroke();
        }
        for (let y = gridOffset; y < H; y += 50) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
        }
    }

    let isRunning = false;

    function animate() {
        if (!isRunning) return;

        ctx.fillStyle = 'rgba(10, 10, 18, 0.15)';
        ctx.fillRect(0, 0, W, H);

        drawGrid();

        bgCircles.forEach(c => {
            c.update();
            c.draw();
        });

        clickEffects = clickEffects.filter(r => {
            r.update();
            r.draw();
            return r.life > 0;
        });

        particles = particles.filter(p => {
            p.update();
            p.draw();
            return p.life > 0;
        });

        requestAnimationFrame(animate);
    }

    const keyMap = {
        'KeyA': 0, 'KeyS': 1, 'KeyD': 2, 'KeyF': 3, 'KeyG': 4, 'KeyH': 5,
        'KeyJ': 6, 'KeyK': 7, 'KeyL': 8, 'KeyQ': 9, 'KeyW': 10, 'KeyE': 11,
        'KeyR': 12, 'KeyT': 13, 'KeyY': 14, 'KeyU': 15, 'KeyI': 16, 'KeyO': 17,
        'KeyP': 18, 'Space': 19, 'KeyZ': 20, 'KeyX': 21, 'KeyC': 22, 'KeyV': 23
    };

    const bassKeys = ['1', '2', '3', '4', '5', '6'];

    document.addEventListener('keydown', (e) => {
        if (!isRunning) return;

        let noteIndex = keyMap[e.code];
        if (noteIndex !== undefined) {
            playNote(noteIndex);
            const x = (noteIndex % 6) * (W / 6) + W / 12;
            const y = Math.floor(noteIndex / 6) * (H / 4) + H / 8;
            spawnParticles(x, y, 40, true);
            clickEffects.push(new ClickRipple(x, y));
        }

        let bassIndex = bassKeys.indexOf(e.key);
        if (bassIndex !== -1) {
            playNote(bassIndex, true);
            const x = W / 2;
            const y = H * 0.75;
            spawnParticles(x, y, 50, true);
            clickEffects.push(new ClickRipple(x, y));
        }

        if (e.code === 'Enter') {
            for (let i = 0; i < 24; i++) {
                const x = (i % 6) * (W / 6) + W / 12;
                const y = Math.floor(i / 6) * (H / 4) + H / 8;
                playNote(i);
                spawnParticles(x, y, 20);
            }
        }
    });

    canvas.addEventListener('click', (e) => {
        if (!isRunning) {
            initAudio();
            isRunning = true;
            animate();
            return;
        }
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const col = Math.floor(x / (W / 6));
        const row = Math.floor(y / (H / 4));
        let noteIndex = row * 6 + col;

        if (row === 3) {
            noteIndex = 19 + col;
            if (col >= 4) return;
        }

        playNote(noteIndex);
        spawnParticles(x, y, 35, true);
        clickEffects.push(new ClickRipple(x, y));
    });

    canvas.addEventListener('touchstart', (e) => {
        if (!isRunning) {
            initAudio();
            isRunning = true;
            animate();
            return;
        }
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;

        const col = Math.floor(x / (W / 6));
        const row = Math.floor(y / (H / 4));
        let noteIndex = row * 6 + col;

        if (row === 3) {
            noteIndex = 19 + col;
            if (col >= 4) return;
        }

        playNote(noteIndex);
        spawnParticles(x, y, 35, true);
        clickEffects.push(new ClickRipple(x, y));
    }, { passive: false });

    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, W, H);
    </script>
</body>
</html>
