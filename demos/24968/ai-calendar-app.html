<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 日历 — 让每一天都有迹可循</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F3EE;
      --bg2: #EDE8E0;
      --ink: #2A2520;
      --muted: #8A8075;
      --rule: #D5CFC6;
      --accent: #C4703F;
      --accent2: #5A7D6B;
      --accent-light: #E8D5C4;
      --accent2-light: #C8D9CE;
      --card-bg: #FFFFFF;
      --shadow: rgba(42, 37, 32, 0.06);
      --shadow-hover: rgba(42, 37, 32, 0.12);
      --ai-bubble: #F0EBE5;
      --user-bubble: #C4703F;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      font-size: 14px;
      overflow: hidden;
      height: 100vh;
    }

    /* ===== LAYOUT ===== */
    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ===== LEFT: CALENDAR ===== */
    .calendar-panel {
      width: 420px;
      min-width: 420px;
      background: var(--card-bg);
      border-right: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      overflow-y: auto;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--rule);
    }

    .calendar-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .calendar-title .accent-dot {
      color: var(--accent);
    }

    .year-month-selector {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .year-month-selector select {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.85rem;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .year-month-selector select:focus {
      border-color: var(--accent);
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    .today-btn {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.75rem;
      padding: 0.35rem 0.8rem;
      border: 1px solid var(--accent);
      border-radius: 100px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.2s;
    }

    .today-btn:hover {
      background: var(--accent);
      color: white;
    }

    /* Week header */
    .week-header {
      display: grid;
      grid-template-columns: 40px repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 0.5rem;
    }

    .week-header .week-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      text-align: center;
      padding: 0.3rem 0;
      letter-spacing: 0.05em;
    }

    .week-header .day-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      padding: 0.4rem 0;
    }

    .week-header .day-label.weekend {
      color: var(--accent);
    }

    /* Calendar grid */
    .calendar-grid {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .calendar-row {
      display: grid;
      grid-template-columns: 40px repeat(7, 1fr);
      gap: 4px;
    }

    .week-number {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.5;
    }

    .day-cell {
      aspect-ratio: 1;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      border: 1px solid transparent;
    }

    .day-cell:hover {
      background: var(--bg2);
      border-color: var(--rule);
    }

    .day-cell .day-num {
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--ink);
    }

    .day-cell.other-month .day-num {
      color: var(--rule);
    }

    .day-cell.weekend .day-num {
      color: var(--accent);
    }

    .day-cell.today {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .day-cell.today .day-num {
      color: var(--accent);
      font-weight: 700;
    }

    .day-cell.selected {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(196, 112, 63, 0.3);
    }

    .day-cell.selected .day-num {
      color: white;
      font-weight: 700;
    }

    .day-cell.selected:hover {
      background: var(--accent);
    }

    .day-cell .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent2);
      margin-top: 2px;
    }

    .day-cell.selected .dot {
      background: rgba(255,255,255,0.7);
    }

    /* Selected date info */
    .selected-info {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--bg);
      border-radius: 12px;
      border-left: 3px solid var(--accent);
    }

    .selected-info .date-display {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink);
    }

    .selected-info .date-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* ===== RIGHT: SPLIT PANEL ===== */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* AI Chat Panel */
    .ai-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-bottom: 1px solid var(--rule);
      min-height: 0;
    }

    .ai-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--rule);
      background: linear-gradient(90deg, var(--bg) 0%, var(--card-bg) 100%);
    }

    .ai-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .ai-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent) 0%, #A85A2E 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1rem;
    }

    .ai-header-text h4 {
      font-family: 'Noto Serif SC', serif;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .ai-header-text span {
      font-size: 0.7rem;
      color: var(--accent2);
      letter-spacing: 0.05em;
    }

    .ai-status {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .ai-status .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .ai-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 0;
    }

    .message {
      display: flex;
      gap: 0.75rem;
      max-width: 85%;
      animation: msgIn 0.3s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.ai-msg { align-self: flex-start; }
    .message.user-msg { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    .msg-avatar.ai { background: var(--accent-light); }
    .msg-avatar.user { background: var(--accent2-light); }

    .msg-bubble {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .ai-msg .msg-bubble {
      background: var(--ai-bubble);
      color: var(--ink);
      border-bottom-left-radius: 4px;
    }

    .user-msg .msg-bubble {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.25rem;
      text-align: right;
    }

    .ai-input-area {
      padding: 0.75rem 1.5rem;
      border-top: 1px solid var(--rule);
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }

    .ai-input {
      flex: 1;
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 0.6rem 1rem;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.85rem;
      outline: none;
      resize: none;
      min-height: 40px;
      max-height: 100px;
      background: var(--bg);
      color: var(--ink);
      transition: border-color 0.2s;
    }

    .ai-input:focus {
      border-color: var(--accent);
    }

    .ai-send-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .ai-send-btn:hover {
      background: #A85A2E;
      transform: scale(1.05);
    }

    /* ===== RICH TEXT EDITOR ===== */
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      min-height: 0;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--rule);
      background: linear-gradient(90deg, var(--bg) 0%, var(--card-bg) 100%);
    }

    .editor-header h4 {
      font-family: 'Noto Serif SC', serif;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .editor-header h4 .icon {
      font-size: 1rem;
    }

    .editor-actions {
      display: flex;
      gap: 0.5rem;
    }

    .editor-actions button {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.75rem;
      padding: 0.35rem 0.8rem;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .editor-actions button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .editor-actions button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .editor-actions button.primary:hover {
      background: #A85A2E;
    }

    /* Toolbar */
    .editor-toolbar {
      display: flex;
      gap: 0.25rem;
      padding: 0.5rem 1.5rem;
      border-bottom: 1px solid var(--rule);
      background: var(--bg);
      flex-wrap: wrap;
    }

    .toolbar-group {
      display: flex;
      gap: 0.15rem;
      padding-right: 0.5rem;
      margin-right: 0.5rem;
      border-right: 1px solid var(--rule);
    }

    .toolbar-group:last-child {
      border-right: none;
      padding-right: 0;
      margin-right: 0;
    }

    .toolbar-btn {
      width: 32px;
      height: 32px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: all 0.15s;
    }

    .toolbar-btn:hover {
      background: var(--card-bg);
      border-color: var(--rule);
      color: var(--ink);
    }

    .toolbar-btn.active {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }

    .toolbar-btn .icon { font-size: 0.9rem; }

    /* Editor content */
    .editor-content {
      flex: 1;
      padding: 1rem 1.5rem;
      overflow-y: auto;
      min-height: 0;
    }

    .rich-text-area {
      width: 100%;
      min-height: 100%;
      border: none;
      outline: none;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--ink);
      background: transparent;
    }

    .rich-text-area:empty::before {
      content: '在此记录今天的故事……';
      color: var(--rule);
      font-style: italic;
    }

    /* Image upload hint */
    .image-hint {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.5rem;
      border-top: 1px solid var(--rule);
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--bg);
    }

    .image-hint .hint-icon {
      font-size: 1rem;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* Responsive */
    @media (max-width: 1024px) {
      .calendar-panel { width: 360px; min-width: 360px; }
    }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      .calendar-panel { width: 100%; min-width: 100%; max-height: 50vh; border-right: none; border-bottom: 1px solid var(--rule); }
      .right-panel { max-height: 50vh; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- LEFT: Calendar -->
    <div class="calendar-panel">
      <div class="calendar-header">
        <div class="calendar-title"><span class="accent-dot">●</span> AI 日历</div>
        <div class="year-month-selector">
          <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
          <select id="yearSelect" onchange="renderCalendar()"></select>
          <select id="monthSelect" onchange="renderCalendar()"></select>
          <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
          <button class="today-btn" onclick="goToToday()">今天</button>
        </div>
      </div>

      <div class="week-header">
        <div class="week-label">周</div>
        <div class="day-label">一</div>
        <div class="day-label">二</div>
        <div class="day-label">三</div>
        <div class="day-label">四</div>
        <div class="day-label">五</div>
        <div class="day-label weekend">六</div>
        <div class="day-label weekend">日</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="selected-info" id="selectedInfo">
        <div class="date-display" id="dateDisplay">2026年6月16日</div>
        <div class="date-sub" id="dateSub">星期二 · 第24周</div>
      </div>
    </div>

    <!-- RIGHT: AI Chat + Rich Text Editor -->
    <div class="right-panel">
      <!-- AI Chat -->
      <div class="ai-panel">
        <div class="ai-header">
          <div class="ai-header-left">
            <div class="ai-avatar">&#129302;</div>
            <div class="ai-header-text">
              <h4>AI 助手</h4>
              <span>基于你的日历记录提供建议</span>
            </div>
          </div>
          <div class="ai-status">
            <span class="status-dot"></span>
            <span>在线</span>
          </div>
        </div>

        <div class="ai-messages" id="aiMessages">
          <div class="message ai-msg">
            <div class="msg-avatar ai">&#129302;</div>
            <div>
              <div class="msg-bubble">你好！我是你的 AI 日历助手。选中任意日期，我可以帮你分析当天的记录，或者回答关于时间管理的问题。</div>
              <div class="msg-time">刚刚</div>
            </div>
          </div>
        </div>

        <div class="ai-input-area">
          <textarea class="ai-input" id="aiInput" placeholder="向 AI 提问……" rows="1" onkeydown="handleAIKey(event)"></textarea>
          <button class="ai-send-btn" onclick="sendAIMessage()">&#10148;</button>
        </div>
      </div>

      <!-- Rich Text Editor -->
      <div class="editor-panel">
        <div class="editor-header">
          <h4><span class="icon">&#9997;</span> 日记记录</h4>
          <div class="editor-actions">
            <button onclick="clearEditor()">清空</button>
            <button class="primary" onclick="saveEntry()">保存</button>
          </div>
        </div>

        <div class="editor-toolbar">
          <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('bold')" title="加粗"><b>B</b></button>
            <button class="toolbar-btn" onclick="execCmd('italic')" title="斜体"><i>I</i></button>
            <button class="toolbar-btn" onclick="execCmd('underline')" title="下划线"><u>U</u></button>
            <button class="toolbar-btn" onclick="execCmd('strikeThrough')" title="删除线"><s>S</s></button>
          </div>
          <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('justifyLeft')" title="左对齐">&#8676;</button>
            <button class="toolbar-btn" onclick="execCmd('justifyCenter')" title="居中">&#8596;</button>
            <button class="toolbar-btn" onclick="execCmd('justifyRight')" title="右对齐">&#8677;</button>
          </div>
          <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('insertUnorderedList')" title="无序列表">&#8226;&#8226;&#8226;</button>
            <button class="toolbar-btn" onclick="execCmd('insertOrderedList')" title="有序列表">1. 2. 3.</button>
          </div>
          <div class="toolbar-group">
            <button class="toolbar-btn" onclick="insertHeading()" title="标题">H</button>
            <button class="toolbar-btn" onclick="execCmd('removeFormat')" title="清除格式">&#128465;</button>
          </div>
          <div class="toolbar-group">
            <button class="toolbar-btn" onclick="insertImage()" title="插入图片">&#128247;</button>
            <button class="toolbar-btn" onclick="insertLink()" title="插入链接">&#128279;</button>
          </div>
        </div>

        <div class="editor-content">
          <div class="rich-text-area" id="richEditor" contenteditable="true"></div>
        </div>

        <div class="image-hint">
          <span class="hint-icon">&#128206;</span>
          <span>支持粘贴图片、拖拽上传，或点击工具栏插入图片</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== STATE =====
    let currentYear = 2026;
    let currentMonth = 5; // 0-indexed, June = 5
    let selectedDate = new Date(2026, 5, 16);
    const today = new Date(2026, 5, 16);

    // ===== INIT =====
    function init() {
      populateYearSelect();
      populateMonthSelect();
      renderCalendar();
      updateSelectedInfo();
    }

    function populateYearSelect() {
      const select = document.getElementById('yearSelect');
      select.innerHTML = '';
      for (let y = 2020; y <= 2035; y++) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + '年';
        if (y === currentYear) opt.selected = true;
        select.appendChild(opt);
      }
    }

    function populateMonthSelect() {
      const select = document.getElementById('monthSelect');
      select.innerHTML = '';
      const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
      months.forEach((m, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = m;
        if (i === currentMonth) opt.selected = true;
        select.appendChild(opt);
      });
    }

    // ===== CALENDAR =====
    function renderCalendar() {
      currentYear = parseInt(document.getElementById('yearSelect').value);
      currentMonth = parseInt(document.getElementById('monthSelect').value);

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const firstDay = new Date(currentYear, currentMonth, 1);
      const lastDay = new Date(currentYear, currentMonth + 1, 0);
      const daysInMonth = lastDay.getDate();

      // Monday = 0, Sunday = 6
      let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

      const prevMonthLastDay = new Date(currentYear, currentMonth, 0).getDate();

      let currentRow = document.createElement('div');
      currentRow.className = 'calendar-row';

      // Week number for first row
      const weekNum = getWeekNumber(new Date(currentYear, currentMonth, 1));
      const weekNumEl = document.createElement('div');
      weekNumEl.className = 'week-number';
      weekNumEl.textContent = weekNum;
      currentRow.appendChild(weekNumEl);

      // Previous month days
      for (let i = startOffset - 1; i >= 0; i--) {
        const day = prevMonthLastDay - i;
        currentRow.appendChild(createDayCell(day, true));
      }

      // Current month days
      for (let day = 1; day <= daysInMonth; day++) {
        if (currentRow.children.length === 8) {
          grid.appendChild(currentRow);
          currentRow = document.createElement('div');
          currentRow.className = 'calendar-row';
          const wn = getWeekNumber(new Date(currentYear, currentMonth, day));
          const wnEl = document.createElement('div');
          wnEl.className = 'week-number';
          wnEl.textContent = wn;
          currentRow.appendChild(wnEl);
        }
        currentRow.appendChild(createDayCell(day, false));
      }

      // Next month days
      let nextDay = 1;
      while (currentRow.children.length < 8) {
        currentRow.appendChild(createDayCell(nextDay, true));
        nextDay++;
      }
      grid.appendChild(currentRow);

      // Fill remaining rows
      while (grid.children.length < 6) {
        const row = document.createElement('div');
        row.className = 'calendar-row';
        const wn = getWeekNumber(new Date(currentYear, currentMonth, daysInMonth)) + grid.children.length - 1;
        const wnEl = document.createElement('div');
        wnEl.className = 'week-number';
        wnEl.textContent = wn > 52 ? wn - 52 : wn;
        row.appendChild(wnEl);
        for (let i = 0; i < 7; i++) {
          row.appendChild(createDayCell(nextDay, true));
          nextDay++;
        }
        grid.appendChild(row);
      }
    }

    function createDayCell(day, isOtherMonth) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (isOtherMonth) cell.classList.add('other-month');

      const dayOfWeek = (cell.parentElement ? cell.parentElement.children.length - 1 : 0) % 7;
      if (dayOfWeek >= 5) cell.classList.add('weekend');

      const num = document.createElement('span');
      num.className = 'day-num';
      num.textContent = day;
      cell.appendChild(num);

      // Check if today
      if (!isOtherMonth && currentYear === today.getFullYear() && currentMonth === today.getMonth() && day === today.getDate()) {
        cell.classList.add('today');
      }

      // Check if selected
      if (!isOtherMonth && currentYear === selectedDate.getFullYear() && currentMonth === selectedDate.getMonth() && day === selectedDate.getDate()) {
        cell.classList.add('selected');
      }

      // Mock data dot
      if (!isOtherMonth && Math.random() > 0.6) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        cell.appendChild(dot);
      }

      cell.onclick = () => selectDate(day);
      return cell;
    }

    function getWeekNumber(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function selectDate(day) {
      selectedDate = new Date(currentYear, currentMonth, day);
      renderCalendar();
      updateSelectedInfo();

      // Simulate AI greeting for selected date
      const dateStr = formatDate(selectedDate);
      addAIMessage(`你选中了 ${dateStr}。这一天有什么特别的计划或回忆想记录吗？`, false);
    }

    function updateSelectedInfo() {
      const y = selectedDate.getFullYear();
      const m = selectedDate.getMonth() + 1;
      const d = selectedDate.getDate();
      const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      const weekNum = getWeekNumber(selectedDate);

      document.getElementById('dateDisplay').textContent = `${y}年${m}月${d}日`;
      document.getElementById('dateSub').textContent = `${weekdays[selectedDate.getDay()]} · 第${weekNum}周`;
    }

    function formatDate(date) {
      return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      document.getElementById('yearSelect').value = currentYear;
      document.getElementById('monthSelect').value = currentMonth;
      renderCalendar();
    }

    function goToToday() {
      currentYear = today.getFullYear();
      currentMonth = today.getMonth();
      selectedDate = new Date(today);
      document.getElementById('yearSelect').value = currentYear;
      document.getElementById('monthSelect').value = currentMonth;
      renderCalendar();
      updateSelectedInfo();
    }

    // ===== AI CHAT =====
    function addAIMessage(text, isUser) {
      const container = document.getElementById('aiMessages');
      const msg = document.createElement('div');
      msg.className = 'message ' + (isUser ? 'user-msg' : 'ai-msg');

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar ' + (isUser ? 'user' : 'ai');
      avatar.textContent = isUser ? '&#128100;' : '&#129302;';

      const bubbleWrap = document.createElement('div');
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = text;

      const time = document.createElement('div');
      time.className = 'msg-time';
      const now = new Date();
      time.textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

      bubbleWrap.appendChild(bubble);
      bubbleWrap.appendChild(time);
      msg.appendChild(avatar);
      msg.appendChild(bubbleWrap);
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    function sendAIMessage() {
      const input = document.getElementById('aiInput');
      const text = input.value.trim();
      if (!text) return;

      addAIMessage(escapeHtml(text), true);
      input.value = '';
      input.style.height = 'auto';

      // Simulate AI response
      setTimeout(() => {
        const responses = [
          '这是一个很好的想法！建议你把它加入到今天的计划中。',
          '根据你最近的记录，这个时间段的效率比较高，可以考虑安排重要任务。',
          '记录得很详细呢！继续保持这个习惯，长期积累会很有价值。',
          '我注意到你这个月的记录频率很高，这是一个很好的趋势。',
          '需要我帮你总结一下本周的记录要点吗？'
        ];
        const response = responses[Math.floor(Math.random() * responses.length)];
        addAIMessage(response, false);
      }, 800);
    }

    function handleAIKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendAIMessage();
      }
    }

    // Auto-resize textarea
    document.getElementById('aiInput').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    // ===== RICH TEXT EDITOR =====
    function execCmd(command) {
      document.execCommand(command, false, null);
      document.getElementById('richEditor').focus();
    }

    function insertHeading() {
      document.execCommand('formatBlock', false, 'H3');
      document.getElementById('richEditor').focus();
    }

    function insertImage() {
      const url = prompt('请输入图片 URL：');
      if (url) {
        document.execCommand('insertImage', false, url);
      }
    }

    function insertLink() {
      const url = prompt('请输入链接 URL：');
      if (url) {
        document.execCommand('createLink', false, url);
      }
    }

    function clearEditor() {
      if (confirm('确定要清空当前内容吗？')) {
        document.getElementById('richEditor').innerHTML = '';
      }
    }

    function saveEntry() {
      const content = document.getElementById('richEditor').innerHTML;
      if (!content || content === '<br>') {
        alert('内容为空，无法保存');
        return;
      }
      // Simulate save
      const btn = event.target;
      const original = btn.textContent;
      btn.textContent = '已保存 ✓';
      btn.style.background = 'var(--accent2)';
      setTimeout(() => {
        btn.textContent = original;
        btn.style.background = '';
      }, 1500);
    }

    // Paste image support
    document.getElementById('richEditor').addEventListener('paste', function(e) {
      const items = e.clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          const reader = new FileReader();
          reader.onload = function(event) {
            document.execCommand('insertImage', false, event.target.result);
          };
          reader.readAsDataURL(blob);
          e.preventDefault();
        }
      }
    });

    // Drag and drop image
    document.getElementById('richEditor').addEventListener('dragover', function(e) {
      e.preventDefault();
    });

    document.getElementById('richEditor').addEventListener('drop', function(e) {
      e.preventDefault();
      const files = e.dataTransfer.files;
      for (let i = 0; i < files.length; i++) {
        if (files[i].type.indexOf('image') !== -1) {
          const reader = new FileReader();
          reader.onload = function(event) {
            document.execCommand('insertImage', false, event.target.result);
          };
          reader.readAsDataURL(files[i]);
        }
      }
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== START =====
    init();
  </script>
</body>
</html>
