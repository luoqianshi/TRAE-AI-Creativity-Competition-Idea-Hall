<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音韵 · 中西音乐创作平台</title>
  <style>
/* ============================================================
 * style.css — 音韵音乐创作平台样式
 * ============================================================ */

:root {
  --bg: #0f1117;
  --bg-2: #161a26;
  --bg-3: #1c2030;
  --line: #2a2f3e;
  --text: #e6e8ef;
  --text-dim: #8b90a0;
  --accent: #4aa3ff;
  --accent-2: #2ecc71;
  --warn: #f39c12;
  --danger: #e74c3c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  font-size: 13px; overflow: hidden; user-select: none;
}

.app { display: flex; flex-direction: column; height: 100vh; }

/* ===== 顶栏 ===== */
.topbar {
  display: flex; align-items: center; gap: 16px; padding: 8px 16px;
  background: var(--bg-2); border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.brand { display: flex; align-items: baseline; gap: 8px; }
.logo { font-size: 20px; font-weight: 700; color: var(--accent); }
.subtitle { font-size: 11px; color: var(--text-dim); }

.transport { display: flex; align-items: center; gap: 8px; }
.tbtn {
  width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg-3); color: var(--text); cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.tbtn:hover { border-color: var(--accent); color: var(--accent); }
.tbtn.active { border-color: var(--accent); color: var(--accent); background: rgba(74,163,255,.12); }
.tbtn.play.playing { background: var(--accent); color: #0f1117; border-color: var(--accent); }
.tbtn.rec.recording { background: var(--danger); color: #fff; border-color: var(--danger); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.divider { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.ctrl { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); }
.ctrl input[type=number] { width: 48px; padding: 3px 6px; background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px; color: var(--text); }
.time { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 12px; }

.top-actions { margin-left: auto; display: flex; gap: 8px; }
.actbtn {
  padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg-3); color: var(--text); cursor: pointer; font-size: 12px;
}
.actbtn:hover { border-color: var(--accent); color: var(--accent); }

/* ===== 主体 ===== */
.main {
  display: grid; grid-template-columns: 240px minmax(0, 1fr) 260px;
  flex: 1; min-height: 0; min-width: 0;
}
.panel { background: var(--bg-2); display: flex; flex-direction: column; min-height: 0; }
.panel-left { border-right: 1px solid var(--line); }
.panel-right { border-left: 1px solid var(--line); }
.panel-center { background: var(--bg); min-width: 0; overflow: hidden; position: relative; }

.panel-head {
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.panel-head h2 { font-size: 13px; font-weight: 600; }
#searchInstr {
  width: 90px; padding: 3px 6px; background: var(--bg-3); border: 1px solid var(--line);
  border-radius: 4px; color: var(--text); font-size: 11px;
}

/* 组选择（顶层） */
.group-tabs {
  display: flex; gap: 0; padding: 6px 8px 0; background: var(--bg-2);
  border-bottom: 1px solid var(--line);
}
.gtab {
  flex: 1; padding: 7px 4px; background: transparent; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 11px; border-radius: 5px 5px 0 0; border-bottom: 2px solid transparent;
  transition: color .12s;
}
.gtab:hover { color: var(--text); background: rgba(255,255,255,.03); }
.gtab.active { color: var(--accent); background: var(--bg-3); border-bottom-color: var(--accent); font-weight: 600; }

/* 子分类 tab（沿用原样式，支持自动换行） */
.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--bg-3); }
.tab {
  flex: 1 1 auto; min-width: 56px; padding: 7px 6px; background: transparent; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 11px; border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.panel-body { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
/* 右侧声部列表可伸缩，但音效调整面板固定不被挤压 */
.track-list-body { flex: 1 1 auto; min-height: 60px; }
#configPanel { flex: 0 0 auto; overflow-y: visible; max-height: 60%; }
.empty { color: var(--text-dim); font-size: 11px; padding: 16px 8px; text-align: center; }

/* 乐器卡片 */
.instr-card {
  display: flex; align-items: center; gap: 8px; padding: 8px; margin-bottom: 6px;
  background: var(--bg-3); border-radius: 6px; border: 1px solid transparent;
}
.instr-card:hover { border-color: var(--accent); }
.instr-icon { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; }
.icon-strings { background: linear-gradient(135deg,#e74c3c,#c0392b); }
.icon-winds { background: linear-gradient(135deg,#3498db,#2980b9); }
.icon-percussion { background: linear-gradient(135deg,#f39c12,#d35400); }
.icon-keyboard { background: linear-gradient(135deg,#2ecc71,#27ae60); }
.instr-info { flex: 1; min-width: 0; }
.instr-name { font-size: 12px; font-weight: 500; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.instr-note { font-size: 10px; color: var(--text-dim); font-weight: 400; }
.instr-status {
  font-size: 9px; padding: 1px 5px; border-radius: 8px; background: rgba(243,156,18,.15);
  color: var(--warn); border: 1px solid rgba(243,156,18,.3); white-space: nowrap; font-weight: 400;
}
.instr-cat { font-size: 10px; color: var(--text-dim); margin-top: 1px; }
.instr-desc {
  font-size: 10px; color: var(--text-dim); margin-top: 3px; padding: 2px 5px;
  border-left: 2px solid var(--accent); background: rgba(74,163,255,.06); border-radius: 0 3px 3px 0;
  line-height: 1.4;
}
.instr-preview, .instr-add {
  width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line);
  background: var(--bg-2); color: var(--text); cursor: pointer; font-size: 12px;
}
.instr-preview:hover { color: var(--accent); border-color: var(--accent); }
.instr-add:hover { color: var(--accent-2); border-color: var(--accent-2); }
.instr-tutorial {
  width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line);
  background: var(--bg-2); color: var(--text-dim); cursor: pointer; font-size: 13px;
  font-weight: 600; line-height: 1; display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.instr-tutorial:hover { color: var(--accent); border-color: var(--accent); background: rgba(74,163,255,.08); }

/* ===== 乐器教程面板（tut-） ===== */
.tut-overlay {
  position: fixed; inset: 0; z-index: 1200;
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .2s;
}
.tut-overlay.show { opacity: 1; }
.tut-modal {
  width: min(640px, 94vw); max-height: 90vh;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.tut-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 16px 20px; border-bottom: 1px solid var(--line);
  background: var(--bg-3);
}
.tut-title { font-size: 16px; font-weight: 600; color: var(--text); margin: 0; }
.tut-subtitle { font-size: 11px; color: var(--text-dim); margin: 4px 0 0; }
.tut-close {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--bg-2); color: var(--text-dim); cursor: pointer; font-size: 18px;
  line-height: 1; flex-shrink: 0; transition: all .15s;
  display: flex; align-items: center; justify-content: center;
}
.tut-close:hover { color: var(--text); border-color: var(--accent); background: rgba(74,163,255,.1); }

.tut-steps {
  display: flex; gap: 2px; padding: 6px 16px; border-bottom: 1px solid var(--line);
  background: var(--bg-3); overflow-x: auto; scrollbar-width: none;
}
.tut-steps::-webkit-scrollbar { display: none; }
.tut-step-btn {
  padding: 6px 12px; border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; font-size: 11px; border-radius: 6px; white-space: nowrap;
  transition: all .15s; font-weight: 500;
}
.tut-step-btn:hover { color: var(--text); background: rgba(255,255,255,.03); }
.tut-step-btn.active { color: #fff; background: var(--accent); font-weight: 600; }

.tut-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
.tut-panel { display: flex; flex-direction: column; gap: 16px; }
.tut-section { display: flex; flex-direction: column; gap: 8px; }
.tut-section-title {
  font-size: 12px; color: var(--accent); font-weight: 600;
  text-transform: uppercase; letter-spacing: .5px;
  padding-bottom: 6px; border-bottom: 1px solid var(--line);
}
.tut-image {
  width: 100%; background: var(--bg-3); border-radius: 8px; padding: 16px;
  display: flex; align-items: center; justify-content: center; min-height: 140px;
}
.tut-image svg { width: 100%; max-width: 400px; height: auto; }
.tut-image img.tut-img { width: 100%; max-width: 400px; height: auto; border-radius: 6px; object-fit: contain; }
.tut-noimg { color: var(--text-dim); font-size: 12px; font-style: italic; }
.tut-pr-range { font-size: 12px; color: var(--text); }
.tut-pr-range b { color: var(--accent); font-weight: 600; }
.tut-tech-list {
  margin: 0; padding-left: 20px; font-size: 12px; color: var(--text); line-height: 1.7;
}
.tut-tech-list li { margin-bottom: 6px; }
.tut-tech-list li::marker { color: var(--accent); }
.tut-playing {
  font-size: 12px; color: var(--text); line-height: 1.7; margin: 0;
  padding: 10px 14px; background: var(--bg-3); border-left: 3px solid var(--accent);
  border-radius: 0 4px 4px 0;
}

/* 学习目标 */
.tut-goals { display: flex; flex-direction: column; gap: 8px; }
.tut-goal {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; background: var(--bg-3); border-radius: 6px;
}
.tut-goal-num {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: #0f1117; font-size: 11px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.tut-goal-text { font-size: 12px; color: var(--text); line-height: 1.5; }

/* 练习区域 */
.tut-exercise {
  background: rgba(74,163,255,.06); border: 1px solid rgba(74,163,255,.2);
  border-radius: 8px; padding: 12px;
}
.tut-exercise-header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 8px;
}
.tut-exercise-name { font-size: 13px; font-weight: 600; color: var(--accent); }
.tut-exercise-btn {
  padding: 5px 12px; border-radius: 6px; border: 1px solid var(--accent);
  background: rgba(74,163,255,.15); color: var(--accent); cursor: pointer;
  font-size: 11px; font-weight: 500; transition: all .15s;
}
.tut-exercise-btn:hover { background: var(--accent); color: #0f1117; }
.tut-exercise-desc {
  margin: 0 0 8px; font-size: 12px; color: var(--text); line-height: 1.5;
}
.tut-exercise-tips {
  font-size: 11px; color: var(--accent); padding: 6px 8px;
  background: rgba(74,163,255,.08); border-radius: 4px;
}

/* 进阶技巧 */
.tut-advanced { display: flex; flex-direction: column; gap: 6px; }
.tut-advanced-item {
  font-size: 12px; color: var(--text); padding: 8px 10px;
  background: var(--bg-3); border-radius: 6px; line-height: 1.5;
  border-left: 3px solid var(--accent-2);
}

/* 常见问题 */
.tut-mistakes { display: flex; flex-direction: column; gap: 10px; }
.tut-mistake {
  background: var(--bg-3); border-radius: 8px; overflow: hidden;
}
.tut-mistake-q {
  padding: 8px 12px; font-size: 12px; color: var(--danger);
  background: rgba(231,76,60,.1); border-bottom: 1px solid rgba(231,76,60,.2);
}
.tut-mistake-a {
  padding: 8px 12px; font-size: 12px; color: var(--accent-2); line-height: 1.5;
}

/* 底部按钮栏 */
.tut-footer {
  display: flex; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line);
  background: var(--bg-3);
}
.tut-footer-btn {
  flex: 1; height: 36px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg-2); color: var(--text); cursor: pointer; font-size: 12px;
  font-weight: 500; transition: all .15s;
}
.tut-footer-btn:hover { border-color: var(--accent); color: var(--accent); }
.tut-footer-btn:active { transform: scale(.98); }

.rhythm-box { padding: 10px; border-top: 1px solid var(--line); }
.rh-title { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
.rhythm-box select { width: 100%; padding: 4px 6px; background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px; color: var(--text); margin-bottom: 6px; }
.rhythm-box .actbtn { width: 100%; }

/* ===== 编辑区 ===== */
.editor-head {
  padding: 8px 14px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px;
}
.view-title { font-size: 13px; font-weight: 600; }
.hint { font-size: 11px; color: var(--text-dim); }

.tracks-area { flex: 1; overflow: auto; background: var(--bg); position: relative; }

/* 钢琴卷帘 */
.piano-view { display: block; }
.pr-wrap { display: flex; flex-direction: column; }
.pr-main { display: flex; }
.pr-gutter {
  width: 56px; flex-shrink: 0; background: var(--bg-2); border-right: 1px solid var(--line);
  position: sticky; left: 0; z-index: 5;
}
.pr-key {
  position: absolute; left: 0; width: 100%; font-size: 9px; color: var(--text-dim);
  padding-left: 4px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,.03);
}
.pr-key.black { background: var(--bg-3); }
.pr-key:hover { background: var(--accent); color: #0f1117; cursor: pointer; }
.pr-grid {
  position: relative; background: #0c0e14;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 22px 14px;
}
.pr-bg { position: absolute; inset: 0; pointer-events: none; }
.pr-row { position: absolute; left: 0; width: 100%; height: 14px; }
.pr-row.black { background: rgba(0,0,0,.2); }
.pr-row.c-row { box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.pr-barline { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.12); }
.pr-note {
  position: absolute; border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.4);
  cursor: pointer; z-index: 2;
}
.pr-note.selected { outline: 2px solid #fff; outline-offset: -1px; z-index: 3; }
.pr-playhead {
  position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent);
  z-index: 4; box-shadow: 0 0 6px var(--accent);
}

/* ===== 横轴时间线系统 ===== */
.pr-timeline {
  display: flex; height: 30px; position: sticky; top: 0; z-index: 8;
  background: var(--bg-2); border-bottom: 1px solid var(--line);
  user-select: none;
}
.pr-tl-corner {
  width: 56px; flex-shrink: 0; position: sticky; left: 0; z-index: 3;
  background: var(--bg-3); border-right: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
}
.pr-tl-corner-label { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
.pr-tl-ruler {
  position: relative; height: 30px; cursor: text; overflow: hidden;
  background:
    linear-gradient(to bottom, var(--bg-2), var(--bg-3));
}

/* 刻度线：分层视觉层次 */
.pr-tl-tick {
  position: absolute; top: 0; bottom: 0; width: 1px; pointer-events: none;
}
.pr-tl-tick--bar {
  width: 2px; background: rgba(255,255,255,.32);
  box-shadow: 0 0 1px rgba(0,0,0,.5);
}
.pr-tl-tick--beat {
  width: 1px; background: rgba(255,255,255,.16);
}
.pr-tl-tick--second {
  width: 1px; background: rgba(80,200,255,.30);
  background-image: linear-gradient(to bottom, rgba(80,200,255,.5) 0, rgba(80,200,255,.5) 100%);
}
.pr-tl-tick--step {
  width: 1px; background: rgba(255,255,255,.06);
}
/* 标签 */
.pr-tl-label {
  position: absolute; top: 2px; font-size: 9px; line-height: 1;
  color: var(--text-dim); white-space: nowrap; pointer-events: none;
  transform: translateX(3px); font-variant-numeric: tabular-nums;
}
.pr-tl-label--bar-label { color: var(--text); font-weight: 600; font-size: 10px; }
.pr-tl-label--beat-label { color: var(--text-dim); }
.pr-tl-label--second-label { color: #6cf; }

/* 播放头（时间线上方倒三角 + 竖线） */
.pr-tl-playhead {
  position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent);
  z-index: 4; box-shadow: 0 0 6px var(--accent); pointer-events: none;
}
.pr-tl-playhead::before {
  content: ''; position: absolute; top: 0; left: -4px;
  border-left: 5px solid transparent; border-right: 5px solid transparent;
  border-top: 6px solid var(--accent);
}

/* 循环区域 */
.pr-tl-loop {
  position: absolute; top: 0; bottom: 0; display: none;
  background: rgba(255,200,0,.10); border-left: 1px dashed rgba(255,200,0,.5);
  border-right: 1px dashed rgba(255,200,0,.5); pointer-events: none; z-index: 2;
}
.pr-tl-loop-handle {
  position: absolute; top: 0; bottom: 0; width: 8px; display: none; z-index: 5;
  background: rgba(255,200,0,.7); cursor: ew-resize;
  box-shadow: 0 0 4px rgba(255,200,0,.6);
}
.pr-tl-loop-handle:hover { background: rgba(255,220,80,1); }

/* ===== 时间线控件（editor-head 内） ===== */
.tl-controls {
  margin-left: auto; display: flex; align-items: center; gap: 4px;
  font-size: 11px;
}
.tl-ctrl { display: flex; align-items: center; gap: 4px; color: var(--text-dim); }
.tl-ctrl select {
  background: var(--bg-3); color: var(--text); border: 1px solid var(--line);
  border-radius: 3px; padding: 2px 4px; font-size: 11px; cursor: pointer;
}
.tl-btn {
  min-width: 24px; height: 22px; padding: 0 6px; cursor: pointer;
  background: var(--bg-3); color: var(--text); border: 1px solid var(--line);
  border-radius: 3px; font-size: 12px; line-height: 1; transition: background .12s;
}
.tl-btn:hover { background: var(--accent); color: #0f1117; }
.tl-btn-toggle.active {
  background: rgba(255,200,0,.25); border-color: rgba(255,200,0,.6); color: #ffd;
}
.tl-zoom-val {
  min-width: 36px; text-align: center; color: var(--text-dim);
  font-variant-numeric: tabular-nums; font-size: 10px;
}
.tl-divider { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }
.tl-tip { color: var(--text-dim); font-size: 10px; margin-left: 4px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 高分屏/缩放下保持锐利 */
@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 2dppx) {
  .pr-tl-tick--bar { box-shadow: 0 0 0.5px rgba(0,0,0,.6); }
}

/* 频谱 */
.spectrum-box { height: 80px; border-top: 1px solid var(--line); background: #0a0c12; }
#spectrum { width: 100%; height: 100%; display: block; }

/* ===== 右侧 ===== */
/* 声部查看侧栏 */
.track-summary {
  display: flex; gap: 12px; padding: 6px 14px; font-size: 10px; color: var(--text-dim);
  background: var(--bg-3); border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.track-summary span { white-space: nowrap; }
.track-list-body { padding: 6px; }

.track-item {
  display: flex; align-items: center; gap: 6px; padding: 7px 8px; margin-bottom: 4px;
  background: var(--bg-3); border-radius: 6px; border: 1px solid transparent; cursor: pointer;
  transition: border-color .12s;
}
.track-item:hover { border-color: var(--line); }
.track-item.active { border-color: var(--accent); background: rgba(74,163,255,.08); }
.track-no { font-size: 10px; color: var(--text-dim); width: 18px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.track-color { width: 4px; height: 28px; border-radius: 2px; flex-shrink: 0; }
.track-main { flex: 1; min-width: 0; }
.track-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-note { font-size: 10px; color: var(--text-dim); font-weight: 400; }
.track-meta { display: flex; gap: 6px; font-size: 10px; color: var(--text-dim); margin-top: 2px; flex-wrap: wrap; }
.tag-mute { color: var(--warn); }
.tag-solo { color: var(--accent-2); }
.tag-tr { color: var(--accent); }
.track-mute, .track-solo, .track-del {
  width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line);
  background: var(--bg-2); color: var(--text-dim); cursor: pointer; font-size: 10px; flex-shrink: 0;
}
.track-mute.on { background: var(--warn); color: #0f1117; border-color: var(--warn); }
.track-solo.on { background: var(--accent-2); color: #0f1117; border-color: var(--accent-2); }
.track-del:hover { color: var(--danger); border-color: var(--danger); }
.track-sort select {
  padding: 2px 4px; background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px; color: var(--text); font-size: 11px;
}
.cfg-st { font-size: 11px; font-weight: 400; }
.actbtn:disabled { opacity: .5; cursor: not-allowed; }

.cfg-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--accent); }
.cfg-row {
  display: grid; grid-template-columns: 40px 1fr 50px; align-items: center; gap: 8px;
  margin-bottom: 8px; font-size: 11px;
}
.cfg-row label { color: var(--text-dim); }
.cfg-row span { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
.cfg-row input[type=range] { width: 100%; }
.cfg-actions { display: flex; gap: 6px; margin-top: 10px; }
.cfg-actions .actbtn { flex: 1; }

input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; background: var(--line); border-radius: 2px; outline: none; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: 2px solid #fff;
}
input[type=range]::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: 2px solid #fff;
}

/* ===== 状态栏 ===== */
.statusbar {
  display: flex; align-items: center; gap: 16px; padding: 5px 14px;
  background: var(--bg-2); border-top: 1px solid var(--line); font-size: 11px; color: var(--text-dim);
  flex-shrink: 0;
}
.sel-count { color: var(--accent); }
.recording-info { color: var(--text-dim); font-size: 10px; }

/* ===== Toast ===== */
.toast-container {
  position: fixed; right: 16px; bottom: 32px; z-index: 9000;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 8px;
  min-width: 200px; max-width: 360px; padding: 8px 14px; border-radius: 6px;
  background: var(--bg-3); color: var(--text); border: 1px solid var(--line); border-left-width: 3px;
  box-shadow: 0 6px 24px rgba(0,0,0,.45); font-size: 12px;
  opacity: 0; transform: translateX(20px); transition: opacity .18s ease, transform .18s ease;
}
.toast.show { opacity: 1; transform: translateX(0); }
.toast-icon { font-size: 14px; }
.toast-info { border-left-color: var(--accent); } .toast-info .toast-icon { color: var(--accent); }
.toast-success { border-left-color: var(--accent-2); } .toast-success .toast-icon { color: var(--accent-2); }
.toast-warn { border-left-color: var(--warn); } .toast-warn .toast-icon { color: var(--warn); }
.toast-error { border-left-color: var(--danger); } .toast-error .toast-icon { color: var(--danger); }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

/* 滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2f3e; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #3a4156; }

@media (max-width: 1000px) {
  .main { grid-template-columns: 200px 1fr 220px; }
  .subtitle { display: none; }
}

/* ===== 多音轨预览 ===== */
.mt-view {
  --mt-lane-h: 56px;
  position: absolute; inset: 0; z-index: 50;
  background: var(--bg-2); display: flex; flex-direction: column;
}
.mt-view[hidden] { display: none; }
.mt-wrap { display: flex; flex-direction: column; height: 100%; }
.mt-toolbar {
  display: flex; align-items: center; gap: 10px; padding: 6px 12px;
  border-bottom: 1px solid var(--line); background: var(--bg-3); flex-wrap: wrap;
}
.mt-title { font-size: 13px; font-weight: 600; color: var(--accent); }
.mt-divider { width: 1px; height: 18px; background: var(--line); display: inline-block; }
.mt-btn {
  background: var(--bg-2); border: 1px solid var(--line); color: var(--text);
  border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
}
.mt-btn:hover { border-color: var(--accent); color: var(--accent); }
.mt-close { margin-left: auto; }
.mt-zoom { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
.mt-zoom input[type=range] { width: 80px; }
.mt-hint { font-size: 10px; color: var(--text-dim); }
.mt-body { flex: 1; display: flex; min-height: 0; }
.mt-gutter {
  flex: 0 0 auto; overflow: hidden; border-right: 1px solid var(--line);
  background: var(--bg-2);
}
.mt-gutter-spacer { border-bottom: 1px solid var(--line); }
.mt-lane-info {
  display: flex; align-items: center; gap: 6px; padding: 0 8px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.mt-lane-color { width: 4px; height: 70%; border-radius: 2px; flex-shrink: 0; }
.mt-lane-meta { flex: 1; min-width: 0; }
.mt-lane-name { font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mt-lane-sub { font-size: 9px; color: var(--text-dim); }
.mt-ms {
  width: 20px; height: 20px; border-radius: 3px; border: 1px solid var(--line);
  background: transparent; color: var(--text-dim); cursor: pointer; font-size: 10px;
}
.mt-ms:hover { border-color: var(--accent); }
.mt-ms.on { background: var(--warn); color: #fff; border-color: var(--warn); }
.mt-ms.on.solo { background: var(--accent); border-color: var(--accent); }
.mt-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.mt-ruler {
  flex: 0 0 auto; overflow: hidden; position: relative; background: var(--bg-3);
  border-bottom: 1px solid var(--line);
}
.mt-bar-mark {
  position: absolute; top: 0; font-size: 9px; color: var(--text-dim);
  padding: 4px 0 0 4px; border-left: 1px solid rgba(255,255,255,0.15); height: 100%;
}
.mt-scroll { flex: 1; overflow: auto; }
.mt-canvas { display: block; }
.mt-empty { padding: 24px 8px; font-size: 11px; color: var(--text-dim); text-align: center; }

/* ===== 智能编曲 ===== */
.ac-host { flex: 0 0 auto; }
.ac-toggle {
  height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--accent);
  background: transparent; color: var(--accent); cursor: pointer; font-size: 12px;
  transition: all .15s;
}
.ac-toggle:hover { background: rgba(74,163,255,.12); }
.ac-toggle.on { background: var(--accent); color: #0f1117; }
.ac-panel {
  position: absolute; top: 100%; right: 0; z-index: 60;
  width: 280px; background: var(--bg-3); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  display: flex; flex-direction: column; gap: 8px; margin-top: 4px;
}
.ac-panel[hidden] { display: none; }
.panel-right .panel-head { position: relative; }
.ac-mode-switch { display: flex; background: var(--bg-2); border-radius: 8px; padding: 2px; }
.ac-mode-btn {
  flex: 1; height: 32px; border: none; background: transparent; color: var(--text-dim);
  border-radius: 6px; cursor: pointer; font-size: 12px; transition: all .15s;
}
.ac-mode-btn.active { background: var(--accent); color: #0f1117; font-weight: 600; }
.ac-label { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.ac-count { background: var(--bg-2); border-radius: 8px; padding: 0 6px; font-size: 10px; }
.ac-tpl-label { margin-left: auto; }
.ac-mini {
  height: 18px; padding: 0 6px; font-size: 10px; border: 1px solid var(--line);
  background: transparent; color: var(--text-dim); border-radius: 4px; cursor: pointer;
}
.ac-mini:hover { color: var(--accent); border-color: var(--accent); }
.ac-tracks { display: flex; flex-direction: column; gap: 3px; max-height: 140px; overflow-y: auto; }
.ac-track {
  display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px;
  background: var(--bg-2); cursor: pointer; border: 1px solid transparent; transition: all .12s;
}
.ac-track:hover { border-color: var(--line); }
.ac-track.on { border-color: var(--accent); background: rgba(74,163,255,.1); }
.ac-track-ic { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; }
.ac-track-name { flex: 1; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-track-check { font-size: 12px; color: var(--accent); width: 14px; text-align: center; }
.ac-empty { padding: 12px; font-size: 11px; color: var(--text-dim); text-align: center; }
.ac-tpls { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.ac-tpl {
  height: 22px; padding: 0 8px; font-size: 10px; border-radius: 12px;
  border: 1px solid var(--line); background: transparent; color: var(--text-dim); cursor: pointer;
}
.ac-tpl:hover { border-color: var(--accent); color: var(--accent); }
.ac-prompt {
  width: 100%; box-sizing: border-box; background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 6px; color: var(--text); padding: 8px; font-size: 12px; resize: vertical;
  font-family: inherit; line-height: 1.5;
}
.ac-prompt:focus { outline: none; border-color: var(--accent); }
.ac-prompt-wrap[hidden] { display: none; }
.ac-gen {
  height: 36px; border-radius: 8px; border: none; background: var(--accent); color: #0f1117;
  font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center;
  justify-content: center; gap: 6px; transition: all .15s;
}
.ac-gen:hover { filter: brightness(1.1); }
.ac-gen:active { transform: scale(.98); }
.ac-gen:disabled { opacity: .5; cursor: not-allowed; }
.ac-gen.loading { background: var(--text-dim); cursor: progress; }
.ac-gen-spin { animation: ac-spin 1s linear infinite; display: inline-block; }
@keyframes ac-spin { to { transform: rotate(360deg); } }
.ac-progress { display: flex; flex-direction: column; gap: 4px; }
.ac-progress[hidden] { display: none; }
.ac-progress-bar { height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; }
.ac-progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
.ac-progress-text { font-size: 10px; color: var(--text-dim); text-align: center; }
.ac-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.ac-actions[hidden] { display: none; }
.ac-act {
  flex: 1 1 auto; min-width: 60px; height: 28px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg-2); color: var(--text); cursor: pointer; font-size: 11px;
}
.ac-act:hover { border-color: var(--accent); color: var(--accent); }

/* ===== 差异化参数滑块 ===== */
.ac-diff-wrap {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px;
}
.ac-diff-tip { font-size: 10px; color: var(--text-dim); margin-left: auto; font-weight: normal; }
.ac-slider-row {
  display: grid; grid-template-columns: 70px 1fr 36px; align-items: center; gap: 8px;
}
.ac-slider-name { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
.ac-slider {
  -webkit-appearance: none; appearance: none; height: 4px; background: var(--bg-3);
  border-radius: 2px; outline: none; cursor: pointer;
}
.ac-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
.ac-slider::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
  cursor: pointer; border: none;
}
.ac-slider-val { font-size: 10px; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.ac-report-btn { background: rgba(255,200,0,.15); border-color: rgba(255,200,0,.4); color: #ffd; }
.ac-report-btn:hover { background: rgba(255,200,0,.3); color: #ffd; }

/* ===== 相似度检测报告弹窗 ===== */
.ac-rpt-overlay {
  position: fixed; inset: 0; z-index: 1100;
  background: rgba(0,0,0,.6); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .2s;
}
.ac-rpt-overlay.show { opacity: 1; }
.ac-rpt-modal {
  background: var(--bg-3); border: 1px solid var(--line);
  border-radius: 12px; width: calc(100% - 48px); max-width: 720px; max-height: 86vh;
  display: flex; flex-direction: column; box-shadow: 0 16px 48px rgba(0,0,0,.5);
}
.ac-rpt-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.ac-rpt-title { font-size: 15px; font-weight: 600; margin: 0; }
.ac-rpt-close {
  width: 28px; height: 28px; border: none; background: transparent; color: var(--text-dim);
  font-size: 20px; cursor: pointer; border-radius: 6px; line-height: 1;
}
.ac-rpt-close:hover { background: var(--bg-2); color: var(--text); }
.ac-rpt-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.ac-rpt-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.ac-rpt-stat {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; display: flex; flex-direction: column; gap: 2px;
}
.ac-rpt-stat-label { font-size: 10px; color: var(--text-dim); }
.ac-rpt-stat-val { font-size: 14px; font-weight: 600; color: var(--text); }
.ac-rpt-stat--pass { border-color: rgba(80,220,120,.5); }
.ac-rpt-stat--pass .ac-rpt-stat-val { color: #5fd87a; }
.ac-rpt-stat--warn { border-color: rgba(255,200,0,.5); }
.ac-rpt-stat--warn .ac-rpt-stat-val { color: #ffd24a; }
.ac-rpt-note {
  background: rgba(255,200,0,.1); border: 1px solid rgba(255,200,0,.3);
  border-radius: 6px; padding: 8px 12px; font-size: 11px; color: #ffd;
}
.ac-rpt-section h4 { font-size: 12px; margin: 0 0 8px 0; color: var(--text); font-weight: 600; }
.ac-rpt-table {
  width: 100%; border-collapse: collapse; font-size: 11px;
  background: var(--bg-2); border-radius: 6px; overflow: hidden;
}
.ac-rpt-table th, .ac-rpt-table td {
  padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--line);
}
.ac-rpt-table th { background: var(--bg-3); color: var(--text-dim); font-weight: 600; font-size: 10px; }
.ac-rpt-table td { color: var(--text); }
.ac-rpt-bar {
  position: relative; height: 14px; background: var(--bg-3); border-radius: 3px; min-width: 40px; overflow: hidden;
}
.ac-rpt-bar-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); border-radius: 3px; }
.ac-rpt-bar + span { display: block; font-size: 9px; margin-top: 1px; color: var(--text-dim); }
.ac-rpt-table td > .ac-rpt-bar { margin: 0 auto; }
.ac-rpt-dim { color: #ffd24a; font-weight: 600; }
.ac-rpt-feat {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  background: var(--bg-2); border-radius: 8px; padding: 10px;
}
.ac-rpt-feat > div { font-size: 11px; color: var(--text); }
.ac-rpt-feat > div > span { display: block; font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
.ac-rpt-diffs { margin: 0; padding-left: 18px; font-size: 11px; color: var(--text-dim); line-height: 1.7; }
.ac-rpt-diffs li { margin-bottom: 4px; }
.ac-rpt-diffs strong { color: #ffd24a; }

/* ===== 智能编曲 保存提示对话框 ===== */
.ac-modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .2s;
}
.ac-modal-overlay.show { opacity: 1; }
.ac-modal {
  background: var(--bg-3); border: 1px solid var(--line);
  border-radius: 12px; padding: 24px; max-width: 380px; width: calc(100% - 32px);
  box-shadow: 0 16px 48px rgba(0,0,0,.5);
  transform: translateY(8px); transition: transform .2s;
  text-align: center;
}
.ac-modal-overlay.show .ac-modal { transform: translateY(0); }
.ac-modal-icon {
  width: 44px; height: 44px; margin: 0 auto 12px;
  border-radius: 50%; background: rgba(243,156,18,.15); color: #f39c12;
  display: flex; align-items: center; justify-content: center; font-size: 22px;
}
.ac-modal-title {
  margin: 0 0 8px; font-size: 15px; font-weight: 600; color: var(--text);
}
.ac-modal-desc {
  margin: 0 0 18px; font-size: 12px; line-height: 1.5; color: var(--text-dim);
}
.ac-modal-actions { display: flex; gap: 10px; justify-content: center; }
.ac-modal-btn {
  flex: 1; height: 36px; border-radius: 8px; border: none;
  font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s;
}
.ac-modal-save {
  background: var(--accent); color: #0f1117;
}
.ac-modal-save:hover { filter: brightness(1.1); }
.ac-modal-save:active { transform: scale(.98); }
.ac-modal-discard {
  background: transparent; color: var(--text-dim); border: 1px solid var(--line);
}
.ac-modal-discard:hover { color: var(--text); border-color: var(--text-dim); }
.ac-modal-discard:active { transform: scale(.98); }
.ac-modal-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ===== 名曲参考数据库画廊（rw-） ===== */
.rw-overlay {
  position: fixed; inset: 0; z-index: 1100;
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .2s;
}
.rw-overlay.show { opacity: 1; }
.rw-modal {
  background: var(--bg-3); border: 1px solid var(--line);
  border-radius: 12px; width: min(1100px, calc(100% - 32px));
  max-height: calc(100vh - 48px); display: flex; flex-direction: column;
  box-shadow: 0 16px 48px rgba(0,0,0,.5); transform: translateY(8px); transition: transform .2s;
}
.rw-overlay.show .rw-modal { transform: translateY(0); }
.rw-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--line);
}
.rw-title { font-size: 18px; font-weight: 600; color: var(--text); margin: 0; }
.rw-subtitle { font-size: 11px; color: var(--text-dim); margin: 4px 0 0; }
.rw-close {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: var(--bg-2); color: var(--text-dim); font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.rw-close:hover { color: var(--text); background: var(--bg-1); }
.rw-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap;
}
.rw-filter { display: flex; gap: 4px; flex-wrap: wrap; }
.rw-filter-btn {
  height: 26px; padding: 0 12px; border-radius: 13px;
  border: 1px solid var(--line); background: var(--bg-2); color: var(--text-dim);
  font-size: 11px; cursor: pointer; transition: all .15s;
}
.rw-filter-btn:hover { color: var(--text); border-color: var(--text-dim); }
.rw-filter-btn.active {
  background: var(--color, var(--accent)); color: #0f1117; border-color: transparent;
  font-weight: 600;
}
.rw-upload-btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 28px; padding: 0 12px; border-radius: 6px;
  background: var(--accent); color: #0f1117; font-size: 11px; cursor: pointer; font-weight: 600;
}
.rw-upload-btn:hover { filter: brightness(1.1); }
.rw-stats {
  padding: 10px 20px; font-size: 11px; color: var(--text-dim);
  display: flex; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line);
}
.rw-stats b { color: var(--accent); font-weight: 600; }
.rw-body {
  flex: 1; overflow-y: auto; padding: 16px 20px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
  align-content: start;
}
.rw-card {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px; cursor: pointer; transition: all .15s; border-left: 3px solid var(--color, var(--accent));
}
.rw-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.rw-card-title { font-size: 13px; font-weight: 600; color: var(--text); margin: 0 0 4px; }
.rw-card-meta { font-size: 10px; color: var(--text-dim); display: flex; flex-direction: column; gap: 2px; }
.rw-card-tag {
  display: inline-block; padding: 1px 6px; border-radius: 3px;
  font-size: 9px; background: var(--color, var(--accent)); color: #0f1117; font-weight: 600;
}
.rw-detail { padding: 20px; overflow-y: auto; }
.rw-detail-back {
  height: 28px; padding: 0 12px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg-2); color: var(--text-dim);
  font-size: 11px; cursor: pointer; margin-bottom: 12px;
}
.rw-detail-back:hover { color: var(--text); border-color: var(--text-dim); }
.rw-detail h3 { font-size: 20px; margin: 0 0 4px; color: var(--text); }
.rw-detail p { font-size: 12px; color: var(--text-dim); margin: 0; }
.rw-detail-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px;
  margin-bottom: 8px;
}
.rw-detail-item {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  display: flex; flex-direction: column; gap: 2px;
}
.rw-detail-item > span { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .3px; }
.rw-detail-item > b { font-size: 12px; color: var(--text); word-break: break-word; }
.rw-detail-wide { grid-column: span 2; }
@media (max-width: 600px) { .rw-detail-wide { grid-column: span 1; } }
.rw-feat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.rw-feat {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
}
.rw-feat-label { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
.rw-feat-val { font-size: 12px; color: var(--text); word-break: break-word; }

/* ===== 多维度筛选器 ===== */
.rw-toolbar { flex-direction: column; align-items: stretch; gap: 6px; }
.rw-filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rw-filter-label {
  font-size: 10px; color: var(--text-dim); min-width: 28px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
}
.rw-filter { gap: 3px; flex-wrap: wrap; }
.rw-filter-btn { padding: 0 9px; height: 22px; font-size: 10px; }
.rw-stats { gap: 12px; }
.rw-stat-fav i { background: #ffd24a !important; }

/* ===== 卡片标签组 + 操作按钮 ===== */
.rw-card-tags { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 6px; }
.rw-card-region, .rw-card-era {
  background: transparent; border: 1px solid var(--color, var(--line));
  color: var(--color, var(--text-dim)); font-size: 9px; padding: 1px 4px; border-radius: 3px;
}
.rw-card-region { background: rgba(0,0,0,.15); }
.rw-card-actions {
  display: flex; gap: 6px; margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--line);
}
.rw-card-play, .rw-card-fav {
  height: 22px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--line);
  background: var(--bg-3); color: var(--text); font-size: 10px; cursor: pointer;
  transition: all .15s; line-height: 1;
}
.rw-card-play:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,0,0,.2); }
.rw-card-fav { margin-left: auto; min-width: 28px; font-size: 12px; color: var(--text-dim); }
.rw-card-fav.on { color: #ffd24a; border-color: #ffd24a; }

/* ===== 详情页增强 ===== */
.rw-detail-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.rw-detail-head h3 { flex-basis: 100%; }
.rw-detail-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px;
  background: var(--color, var(--accent)); color: #0f1117; font-weight: 600;
}
.rw-detail-actions { display: flex; gap: 8px; margin-bottom: 12px; }
.rw-detail-play, .rw-detail-fav {
  height: 32px; padding: 0 16px; border-radius: 6px; font-size: 12px; cursor: pointer;
  border: 1px solid var(--line); transition: all .15s; font-weight: 600;
}
.rw-detail-play {
  background: var(--accent); color: #0f1117; border-color: transparent;
}
.rw-detail-play:hover { filter: brightness(1.1); }
.rw-detail-fav { background: var(--bg-2); color: var(--text-dim); }
.rw-detail-fav.on { color: #ffd24a; border-color: #ffd24a; }
.rw-detail-phonology {
  background: var(--bg-2); border-left: 3px solid var(--accent); border-radius: 4px;
  padding: 10px 14px; margin-bottom: 16px;
}
.rw-detail-phonology h4 { margin: 0 0 6px; font-size: 12px; color: var(--accent); font-weight: 600; }
.rw-detail-phonology p { margin: 0; font-size: 12px; color: var(--text); line-height: 1.6; }
.rw-detail-recs { margin-top: 16px; }
.rw-detail-recs h4 { font-size: 13px; margin: 0 0 10px; color: var(--text); }
.rw-rec-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.rw-rec-card {
  background: var(--bg-2); border: 1px solid var(--line); border-left: 3px solid var(--color, var(--accent));
  border-radius: 6px; padding: 8px 10px; cursor: pointer; transition: all .15s;
  display: flex; flex-direction: column; gap: 2px;
}
.rw-rec-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.rw-rec-tag { font-size: 9px; color: var(--color, var(--accent)); font-weight: 600; }
.rw-rec-title { font-size: 12px; color: var(--text); font-weight: 600; }
.rw-rec-composer { font-size: 10px; color: var(--text-dim); }

/* ===== 底部播放器 ===== */
.rw-player {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-top: 1px solid var(--line); background: var(--bg-2);
  flex-wrap: wrap;
}
.rw-player-btn {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: var(--accent); color: #0f1117; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.rw-player-btn:hover { filter: brightness(1.15); }
.rw-player-stop { background: var(--bg-3); color: var(--text-dim); width: 28px; height: 28px; font-size: 10px; }
.rw-player-loop { background: var(--bg-3); color: var(--text-dim); width: 28px; height: 28px; font-size: 12px; }
.rw-player-loop.on { background: var(--accent); color: #0f1117; }
.rw-player-info { display: flex; flex-direction: column; gap: 2px; min-width: 140px; max-width: 240px; }
.rw-player-title {
  font-size: 12px; color: var(--text); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rw-player-time { font-size: 10px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.rw-player-progress {
  flex: 1; min-width: 120px; height: 6px; background: var(--bg-3); border-radius: 3px;
  position: relative; cursor: pointer; margin: 0 4px;
}
.rw-player-progress-fill {
  position: absolute; left: 0; top: 0; height: 100%; width: 0%;
  background: var(--accent); border-radius: 3px; transition: width .1s linear;
}
.rw-player-progress-handle {
  position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
  width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 1px 4px rgba(0,0,0,.5); transition: left .1s linear; pointer-events: none;
}
.rw-player-progress:hover .rw-player-progress-handle { width: 14px; height: 14px; }
.rw-player-vol { display: flex; align-items: center; gap: 4px; }
.rw-player-vol-icon { font-size: 12px; color: var(--text-dim); }
.rw-player-vol-slider {
  -webkit-appearance: none; appearance: none; width: 70px; height: 4px;
  background: var(--bg-3); border-radius: 2px; outline: none; cursor: pointer;
}
.rw-player-vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: none;
}
.rw-player-vol-slider::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
  cursor: pointer; border: none;
}

/* ===== 移动端适配 ===== */
#btnMenu { display: none; }
.mob-menu-overlay {
  position: fixed; inset: 0; z-index: 8000;
  background: rgba(0,0,0,.5); backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.mob-menu-overlay.show { opacity: 1; pointer-events: auto; }
.mob-menu-panel {
  position: fixed; top: 0; left: 0; bottom: 0; width: 260px;
  background: var(--bg-2); border-right: 1px solid var(--line);
  transform: translateX(-100%); transition: transform .25s ease;
  z-index: 8001; display: flex; flex-direction: column;
}
.mob-menu-overlay.show .mob-menu-panel { transform: translateX(0); }
.mob-menu-header {
  padding: 16px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.mob-menu-title { font-size: 16px; font-weight: 600; }
.mob-menu-close {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--bg-3); color: var(--text-dim); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.mob-menu-body { flex: 1; overflow-y: auto; }
.mob-menu-section { padding: 12px; border-bottom: 1px solid var(--line); }
.mob-menu-section-title {
  font-size: 10px; color: var(--text-dim); text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 8px;
}
.mob-menu-item {
  display: flex; align-items: center; gap: 8px; padding: 10px;
  border-radius: 6px; cursor: pointer; transition: background .12s;
}
.mob-menu-item:hover { background: rgba(74,163,255,.06); }
.mob-menu-item.active { background: rgba(74,163,255,.1); color: var(--accent); }
.mob-menu-item-icon { width: 24px; height: 24px; border-radius: 4px; flex-shrink: 0; }
.mob-menu-item-text { flex: 1; font-size: 13px; }
.mob-menu-item-badge {
  font-size: 10px; padding: 2px 6px; border-radius: 10px;
  background: var(--bg-3); color: var(--text-dim);
}

@media (max-width: 768px) {
  body { font-size: 12px; }
  #btnMenu { display: flex; }
  .topbar { padding: 6px 10px; gap: 8px; }
  .logo { font-size: 16px; }
  .subtitle { display: none; }
  .tbtn { width: 28px; height: 28px; font-size: 11px; }
  .ctrl input[type=number] { width: 40px; font-size: 10px; }
  .time { font-size: 11px; }
  .actbtn { padding: 4px 8px; font-size: 11px; }
  .divider { height: 18px; }
  
  .main { grid-template-columns: 1fr; }

  .rw-modal { width: calc(100% - 16px); max-height: calc(100vh - 24px); }

  .rw-toolbar { padding: 8px 14px; }
  .rw-filter-btn { height: 22px; padding: 0 8px; font-size: 10px; }
  .rw-body { padding: 10px 14px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .rw-card { padding: 10px; }
  .rw-card-title { font-size: 12px; }
  .rw-detail { padding: 14px; }
  .rw-detail h3 { font-size: 16px; }

  .rw-player { padding: 8px 10px; gap: 6px; }

  .ac-panel { width: 240px; padding: 8px; }
  .ac-prompt { font-size: 11px; padding: 6px; }
  
  .mt-toolbar { padding: 4px 8px; }

  .tut-header { padding: 12px 14px; }
  .tut-title { font-size: 15px; }
  .tut-steps { padding: 4px 8px; }
  .tut-step-btn { padding: 5px 8px; font-size: 10px; }
  .tut-body { padding: 12px 14px; }
  .tut-footer { padding: 10px 14px; }

}

@media (max-width: 480px) {
  body { font-size: 11px; }
  .topbar { padding: 5px 8px; }
  .logo { font-size: 15px; }
  .tbtn { width: 26px; height: 26px; font-size: 10px; }
  .ctrl { gap: 2px; }
  .ctrl input[type=number] { width: 36px; padding: 2px 4px; }
  .top-actions { gap: 4px; }
  .actbtn { padding: 3px 6px; font-size: 10px; }
  
  .editor-head { flex-wrap: wrap; }
  .view-title { flex-basis: 100%; }
  .tl-controls { width: 100%; justify-content: space-between; }
  
  .pr-gutter { width: 36px; }
  .pr-key { font-size: 7px; padding-left: 2px; }
  
  .rw-body { grid-template-columns: 1fr; }
  .rw-card { display: flex; align-items: center; gap: 10px; }
  .rw-card-title { font-size: 13px; }
  .rw-card-meta { flex: 1; }
  .rw-card-actions { border-top: none; padding-top: 0; margin-top: 0; }
  
  .rw-detail-grid { grid-template-columns: 1fr; }
  .rw-feat-grid { grid-template-columns: 1fr; }
  .rw-rec-list { grid-template-columns: 1fr; }
  
  .rw-player { justify-content: space-between; }
  .rw-player-info { display: none; }
  .rw-player-progress { flex: 1; }
  
  .mt-view { --mt-lane-h: 40px; }
  .tut-exercise-header { flex-wrap: wrap; }
  .tut-exercise-btn { flex: 1; }
}

/* 触控优化 */
@media (hover: none) {
  .instr-card:active { border-color: var(--accent); background: rgba(74,163,255,.06); }
  .track-item:active { border-color: var(--accent); background: rgba(74,163,255,.08); }
  .rw-card:active { transform: translateY(0); }
  .tbtn:active { background: var(--accent); color: #0f1117; }
  .actbtn:active { background: var(--accent); color: #0f1117; }
}

/* 横竖屏切换 */
@media (orientation: landscape) and (max-width: 900px) {
  .panel-left, .panel-right { display: none; }
  .main { grid-template-columns: 1fr; }
}

/* 防止双击缩放 */
html { touch-action: manipulation; }

/* 移动端按钮点击区域 */
.tbtn, .actbtn, .instr-preview, .instr-add, .instr-tutorial,
.track-mute, .track-solo, .track-del, .rw-card-play, .rw-card-fav,
.rw-detail-play, .rw-detail-fav, .mt-btn {
  min-height: 44px; min-width: 44px;
}
@media (min-width: 769px) {
  .tbtn, .track-mute, .track-solo, .track-del {
    min-height: auto; min-width: auto;
  }
}
</style>
</head>
<body>
  <div class="app">
    <!-- 顶部 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo">音韵</span>
        <span class="subtitle">中西音乐创作与编排平台</span>
      </div>
      <div class="transport">
        <button id="btnMenu" class="tbtn" title="菜单">☰</button>
        <button id="btnMultiTrack" class="tbtn" title="多音轨预览模式">▦</button>
        <button id="btnPlay" class="tbtn play" title="播放/暂停 (空格)">▶</button>
        <button id="btnStop" class="tbtn" title="停止">■</button>
        <button id="btnRecord" class="tbtn rec" title="录制">●</button>
        <span class="divider"></span>
        <label class="ctrl">BPM<input type="number" id="tempo" min="30" max="300" value="100" /></label>
        <label class="ctrl">小节<input type="number" id="barsInput" min="1" max="32" value="4" /></label>
        <label class="ctrl"><input type="checkbox" id="metroOn" /> 节拍器</label>
        <span class="divider"></span>
        <span id="timeDisplay" class="time">00:00 / 00:00</span>
      </div>
      <div class="top-actions">
        <button id="btnExport" class="actbtn">导出</button>
        <button id="btnImport" class="actbtn">导入</button>
        <input type="file" id="importFile" accept=".json" hidden />
      </div>
    </header>

    <!-- 主体 -->
    <main class="main">
      <!-- 左：乐器库 -->
      <aside class="panel panel-left">
        <div class="panel-head">
          <h2>乐器库</h2>
          <input type="text" id="searchInstr" placeholder="搜索乐器…" />
        </div>
        <div class="group-tabs" id="groupTabs"></div>
        <div class="tabs" id="catTabs"></div>
        <div class="panel-body" id="libraryBody"></div>
        <div class="rhythm-box">
          <div class="rh-title">节奏模板</div>
          <select id="rhythmSel">
            <option value="rock">摇滚</option>
            <option value="pop">流行</option>
            <option value="jazz">爵士</option>
            <option value="latin">拉丁</option>
            <option value="waltz">华尔兹</option>
            <option value="chinese">中国风</option>
            <option value="march">进行曲</option>
            <option value="ballad">抒情</option>
          </select>
          <button id="btnApplyRhythm" class="actbtn">应用</button>
        </div>
      </aside>

      <!-- 中：编辑区 -->
      <section class="panel panel-center">
        <div class="editor-head">
          <span class="view-title">钢琴卷帘</span>
          <span class="hint">点击空白添加音符 · 拖动移动 · 右键删除 · Shift/Ctrl 多选</span>
          <div class="tl-controls">
            <label class="tl-ctrl">时间单位
              <select id="tlUnit" title="时间线显示单位">
                <option value="bar">小节</option>
                <option value="beat">拍</option>
                <option value="second">秒</option>
              </select>
            </label>
            <span class="tl-divider"></span>
            <button class="tl-btn" id="tlZoomOut" title="缩小">−</button>
            <span class="tl-zoom-val" id="tlZoomVal">100%</span>
            <button class="tl-btn" id="tlZoomIn" title="放大">+</button>
            <button class="tl-btn" id="tlZoomReset" title="重置缩放">⟲</button>
            <span class="tl-divider"></span>
            <button class="tl-btn tl-btn-toggle" id="tlLoop" title="循环开关（双击时间线设置区间）">循环</button>
            <span class="tl-tip">双击时间线设置循环 · 拖动定位播放头 · Ctrl+滚轮缩放</span>
          </div>
        </div>
        <div class="tracks-area">
          <div id="pianoView" class="piano-view"></div>
        </div>
        <div class="spectrum-box">
          <canvas id="spectrum" width="800" height="80"></canvas>
        </div>
        <!-- 多音轨预览模式（覆盖在编辑区上方） -->
        <div id="multiTrackView" class="mt-view" hidden></div>
      </section>

      <!-- 右：声部查看侧栏 + 配置 -->
      <aside class="panel panel-right">
        <div class="panel-head">
          <h2>声部查看</h2>
          <div class="ac-host" id="autoComposeHost"></div>
          <div class="track-sort">
            <select id="trackSortSel" title="排序方式">
              <option value="time">按添加时间</option>
              <option value="name">按名称</option>
              <option value="notes">按音符数</option>
            </select>
          </div>
        </div>
        <div class="track-summary" id="trackSummary"></div>
        <div class="panel-body track-list-body" id="trackList"></div>
        <div class="panel-head"><h2>音效调整</h2></div>
        <div class="panel-body" id="configPanel"></div>
      </aside>
    </main>

    <!-- 状态栏 -->
    <footer class="statusbar">
      <span id="trackCount">声部: 0</span>
      <span id="selCount" class="sel-count"></span>
      <span style="flex:1"></span>
      <span class="recording-info">键盘弹奏：下排 Z-M 为 C4-B4，上排 Q-P 为 C5-C6</span>
    </footer>
  </div>

  <!-- 脚本 -->
  <script>
/* ============================================================
 * instruments.js — 乐器目录与合成预设
 * 分类：弦乐 / 管乐 / 打击乐 / 键盘
 * 每个乐器包含合成参数（振荡器、包络、滤波器、泛音），
 * 以及预留的采样加载字段 sample（为空则用合成；后续可填充 URL 加载真实采样）
 * ============================================================ */

  <script>
/* ============================================================
 * referenceWorks.js — 名曲参考数据库 + MIR 特征提取
 * 功能：
 *   1) 内置 5+ 流派各 20+ 经典作品（共 100+ 首）
 *   2) 每首作品含 MIR 特征：和声进行/旋律轮廓/节奏型态/乐器编配/动态
 *   3) getFeaturesByStyle(styleKey) 提供生成算法参考
 *   4) 标准化作品添加接口：addWork() 含格式验证、元数据提取、风格分类
 *   5) showGallery() 渲染可视化展示（点击"音韵"标题触发）
 * ============================================================ */

const ReferenceWorks = (() => {
  // ---------- 流派定义 ----------
  const GENRES = {
    classical: { label: '古典', era: '巴洛克-古典-浪漫', color: '#9b59b6' },
    pop:        { label: '流行', era: '20世纪-当代',     color: '#3498db' },
    jazz:       { label: '爵士', era: '20世纪-当代',     color: '#f39c12' },
    chinese:    { label: '中国风', era: '古代-现代',     color: '#e74c3c' },
    folk:       { label: '民谣', era: '传统-当代',       color: '#2ecc71' },
  };

  // ---------- 地域分类（音韵学地域维度） ----------
  const REGIONS = {
    euro:  { label: '欧洲',   color: '#5b8def' },
    ame:   { label: '美洲',   color: '#ef8b5b' },
    asia:  { label: '亚洲',   color: '#ef5b8d' },
    africa:{ label: '非洲',   color: '#8def5b' },
    global:{ label: '全球',   color: '#9aa0a6' },
  };

  // ---------- 年代分类（音乐史断代） ----------
  const ERAS = [
    { key: 'early',   label: '早期 (<1750)',  range: [-9999, 1749],   color: '#8e7cc3' },
    { key: 'classic', label: '古典 (1750-1820)', range: [1750, 1820], color: '#9b59b6' },
    { key: 'roman',   label: '浪漫 (1821-1900)', range: [1821, 1900], color: '#c39bd3' },
    { key: 'modern',  label: '近现代 (1901-1950)', range: [1901, 1950], color: '#3498db' },
    { key: 'contemp', label: '当代 (1951-今)',   range: [1951, 9999], color: '#1abc9c' },
  ];

  // 根据年份推断年代
  function inferEra(year) {
    const y = parseInt(year, 10);
    if (isNaN(y)) return 'modern';
    return (ERAS.find(e => y >= e.range[0] && y <= e.range[1]) || { key: 'contemp' }).key;
  }

  // 根据流派+作曲家推断地域
  function inferRegion(work) {
    if (work.region) return work.region;
    if (work.genre === 'chinese') return 'asia';
    if (work.genre === 'jazz') return 'ame';
    if (work.genre === 'folk') {
      // 部分民谣按作曲家判定
      const c = (work.composer || '') + (work.title || '');
      if (/中国|蒙古|藏|古|丝路|江南|草原|茉莉|春江/.test(c)) return 'asia';
      if (/非洲|鼓|部落/.test(c)) return 'africa';
      return 'global';
    }
    if (work.genre === 'pop') {
      const c = (work.composer || '');
      if (/中国|陈奕迅|周杰伦|王菲|邓丽君|罗大佑|李宗盛|beyond|黄家驹|Beyond/i.test(c)) return 'asia';
      return 'ame';
    }
    // classical 默认欧洲
    return 'euro';
  }

  // 根据流派与特征生成简短的音韵学分析与创作背景说明
  function buildPhonologyNote(w) {
    const scaleName = w.scale === 'minor' ? '小调（阴柔、抒情）' : '大调（明朗、稳定）';
    const tempoDesc = w.tempo < 70 ? '慢板' : w.tempo < 100 ? '中板' : w.tempo < 130 ? '快板' : '急板';
    const densityDesc = (w.rhythmDensity || 0) < 0.5 ? '稀疏（长音为主，留白充分）'
                       : (w.rhythmDensity || 0) < 0.75 ? '适中（叙述性节奏）'
                       : '密集（活泼织体）';
    const dynamicDesc = (w.dynamicRange || 0) < 0.5 ? '平稳克制'
                      : (w.dynamicRange || 0) < 0.75 ? '富有层次'
                      : '强烈对比';
    const prog = (w.progression || []).map(p => ['I','II','III','IV','V','VI','VII'][p[0]] || '?').join('-');
    return `${scaleName}；${tempoDesc}（${w.tempo} BPM）；节奏${densityDesc}；动态${dynamicDesc}。核心和声进行：${prog}。`;
  }

  // ============================================================
  // 音频播放器：从 MIR 特征合成可聆听的代表乐句
  // ============================================================
  // 大调/小调音阶（相对根音的半音偏移）
  const SCALE_SEMITONES = {
    major: [0, 2, 4, 5, 7, 9, 11],
    minor: [0, 2, 3, 5, 7, 8, 10],
    pentatonic: [0, 2, 4, 7, 9],   // 五声（中国风常用）
    dorian: [0, 2, 3, 5, 7, 9, 10],
  };
  // 默认根音（C 调体系）
  const ROOT_MIDI = 60;
  // 乐器标签 -> Instruments.byId 映射
  // 乐器分类字符串 → 该分类下适合各角色的具体乐器 id
  // 按 role 选合适音域的乐器，避免用错乐器导致失真（如小提琴当低音用）
  const CAT_INSTR_BY_ROLE = {
    strings: { melody: 'violin', harmony: 'viola', bass: 'cello' },
    winds:   { melody: 'flute',  harmony: 'clarinet', bass: 'cello' },  // 无大管 preset，借大提琴作低音
    keyboard:{ melody: 'piano',  harmony: 'piano',  bass: 'piano' },
  };
  // 中国风乐器映射
  const CHINESE_INSTR_MAP = {
    melody: 'c-pipa', harmony: 'c-yangqin', bass: 'cello', percussion: 'c-muyu',
  };
  // 默认打击乐器：用底鼓（低频）而非军鼓（高频白噪声+方波，密集叠加易刺耳）
  const DEFAULT_PERC = 'kick';

  function pickPreset(role, work) {
    // 优先用中国风乐器
    if (work.genre === 'chinese' && CHINESE_INSTR_MAP[role]) {
      const ins = window.Instruments && Instruments.byId ? Instruments.byId(CHINESE_INSTR_MAP[role]) : null;
      if (ins) return ins.preset;
    }
    const label = (work.instruments && work.instruments[role]) || null;
    // 打击角色：若作品显式指定 percussion → 用底鼓（默认）或军鼓（仅当 label === 'snare'）
    if (role === 'percussion') {
      if (!label) return null;   // null 表示不打打击乐
      const id = (label === 'percussion' || label === 'drums') ? DEFAULT_PERC : label;
      const ins = window.Instruments && Instruments.byId ? Instruments.byId(id) : null;
      return ins ? ins.preset : null;
    }
    // 旋律/和声/低音：按乐器分类 + 角色选合适音域
    if (label && CAT_INSTR_BY_ROLE[label] && CAT_INSTR_BY_ROLE[label][role]) {
      const id = CAT_INSTR_BY_ROLE[label][role];
      const ins = window.Instruments && Instruments.byId ? Instruments.byId(id) : null;
      if (ins) return ins.preset;
    }
    // 兜底
    if (role === 'bass') {
      const ins = Instruments.byId('cello');   // 低音用大提琴而非小提琴
      return ins ? ins.preset : null;
    }
    return null;
  }

  // 从 MIR 特征生成代表乐句（4-8 小节循环，按曲式长度）
  function generatePhrase(work) {
    const tempo = work.tempo || 80;
    const beatDur = 60 / tempo;            // 一拍秒数
    const barDur = beatDur * 4;            // 4/4 拍一小节
    const progression = (work.progression || [[0,''],[4,''],[5,''],[3,'']]).slice();
    const contour = work.melodyContour || ['s','U','s','D','R','U','s'];
    const scaleKey = SCALE_SEMITONES[work.scale] ? work.scale : 'major';
    const scale = SCALE_SEMITONES[scaleKey];
    const numBars = Math.min(8, Math.max(4, (work.structure || []).length * 2 || 4));
    const density = work.rhythmDensity || 0.5;
    const dyn = work.dynamicRange || 0.6;
    const accent = work.accentPattern || [0, 4, 8, 12];

    const melodyPreset = pickPreset('melody', work) || (Instruments.byId('piano') || {}).preset;
    const harmonyPreset = pickPreset('harmony', work) || (Instruments.byId('piano') || {}).preset;
    const bassPreset = pickPreset('bass', work) || (Instruments.byId('cello') || {}).preset;
    // 打击乐：尊重作品设定；null 则不打（避免强制启用军鼓导致高频白噪声刺耳）
    const percPreset = pickPreset('percussion', work);

    const notes = [];
    // 旋律基音
    let melodyMidi = ROOT_MIDI + (work.scale === 'minor' ? 0 : 0);
    let contourIdx = 0;

    for (let bar = 0; bar < numBars; bar++) {
      const chord = progression[bar % progression.length];
      const degree = chord[0];               // 0-6
      const chordType = chord[1] || '';       // '', 'm', 'dim'...
      const rootOffset = scale[degree % 7];
      const barStart = bar * barDur;

      // 1) 和声层：整小节和弦（三音+五音），持续
      if (harmonyPreset) {
        const triadRoot = ROOT_MIDI - 12 + rootOffset;       // 低八度
        const third = triadRoot + (chordType === 'm' ? 3 : 4);
        const fifth = triadRoot + 7;
        // 三音叠加 vel 控制在 0.18 左右，避免累积过载
        [triadRoot, third, fifth].forEach(m => {
          notes.push({ midi: m, when: barStart, dur: barDur * 0.9, vel: 0.18 * dyn + 0.08, preset: harmonyPreset, role: 'harmony' });
        });
      }

      // 2) 低音层：根音 + 五度（每拍换）
      if (bassPreset) {
        const bassRoot = ROOT_MIDI - 24 + rootOffset;
        notes.push({ midi: bassRoot, when: barStart, dur: beatDur * 0.85, vel: 0.28 * dyn + 0.12, preset: bassPreset, role: 'bass' });
        if (density > 0.6) {
          notes.push({ midi: bassRoot, when: barStart + beatDur * 2, dur: beatDur * 0.85, vel: 0.25 * dyn + 0.1, preset: bassPreset, role: 'bass' });
          notes.push({ midi: bassRoot + 7, when: barStart + beatDur * 3, dur: beatDur * 0.85, vel: 0.22 * dyn + 0.1, preset: bassPreset, role: 'bass' });
        }
      }

      // 3) 旋律层：按 contour 生成音高
      if (melodyPreset) {
        const stepsPerBar = Math.max(2, Math.round(3 * density * 2));   // 略降密度
        const stepDur = barDur / stepsPerBar;
        for (let s = 0; s < stepsPerBar; s++) {
          const sym = contour[contourIdx % contour.length];
          contourIdx++;
          // 根据 contour 符号更新旋律音高
          let step = 0;
          if (sym === 'U') step = scale[1] || 2;            // 上行级进
          else if (sym === 'D') step = -(scale[1] || 2);     // 下行级进
          else if (sym === 's') step = 0;                   // 同音
          else if (sym === 'R') step = 0;                   // 重复
          else if (sym === 'S') step = 5;                    // 跳进（向上五度）
          // 旋律上限 MIDI 79 (G5, 784Hz)：避免高音区谐波落入 2-5kHz 刺耳频段
          melodyMidi = Math.max(48, Math.min(79, melodyMidi + step));
          // 让旋律贴近和弦音：若偏离过远则拉回和弦三度内
          const chordTone = ROOT_MIDI + rootOffset;
          if (Math.abs(melodyMidi - chordTone) > 12) melodyMidi = chordTone + (melodyMidi < chordTone ? 0 : 0);
          const when = barStart + s * stepDur;
          const isAccent = accent.includes(s * (16 / stepsPerBar) | 0);
          const vel = (isAccent ? 0.4 : 0.28) * dyn + 0.12;
          notes.push({ midi: melodyMidi, when, dur: stepDur * 0.85, vel, preset: melodyPreset, role: 'melody' });
        }

      // 4) 打击层：按 accentPattern + density
      if (percPreset) {
        for (let b = 0; b < 4; b++) {
          if (density < 0.4 && b % 2 !== 0) continue;        // 慢曲只打强拍
          const when = barStart + b * beatDur;
          const vel = accent.includes(b * 4) ? 0.32 * dyn + 0.1 : 0.18 * dyn + 0.06;
          notes.push({ midi: 60, when, dur: 0.15, vel, preset: percPreset, role: 'percussion' });
          if (density > 0.7) {
            // 反拍
            notes.push({ midi: 62, when: when + beatDur * 0.5, dur: 0.12, vel: 0.14 * dyn + 0.06, preset: percPreset, role: 'percussion' });
          }
        }
      }
    }
    return { notes, duration: numBars * barDur, barDur, numBars };
  }

    if (!player.phrase || !player.bus) return;
    const ctx = SynthEngine.getCtx();
    const t0 = ctx.currentTime;
    player.phrase.notes.forEach(n => {
      if (n.when < fromSec) return;        // 跳过已过
      const when = t0 + (n.when - fromSec);

    stopProgressTimer();

    player.progressTimer = setInterval(() => {
      if (!player.isPlaying) return;
      const elapsed = ctx.currentTime - player.startTime + player.pausedAt;
      if (elapsed >= player.duration) {

        if (player.onEnd) player.onEnd();
        return;

      if (player.onTick) player.onTick(elapsed, player.duration);

  function stopProgressTimer() {
    if (player.progressTimer) { clearInterval(player.progressTimer); player.progressTimer = null; }
  }

  function stopPlaybackInternal() {
    player.isPlaying = false;

    stopProgressTimer();

  }

  // 公共：播放作品
  function playWork(work, opts) {
    opts = opts || {};
    if (!ensureEngine()) { window.Toast && Toast.error && Toast.error('音频引擎不可用'); return false; }
    // 若同一作品且已暂停，则恢复
    if (player.isPaused && player.work && player.work.id === work.id) {
      resumePlayback();
      return true;
    }
    // 停止当前
    stopPlaybackInternal();
    player.work = work;
    player.phrase = generatePhrase(work);
    player.duration = player.phrase.duration;
    player.pausedAt = 0;
    player.volume = opts.volume != null ? opts.volume : player.volume;
    applyVolume();
    // 调度
    const ctx = SynthEngine.getCtx();
    player.startTime = ctx.currentTime;
    scheduleNotes(0);
    player.isPlaying = true;
    player.isPaused = false;
    startProgressTimer();
    return true;
  }

  function pausePlayback() {
    if (!player.isPlaying) return;
    const ctx = SynthEngine.getCtx();
    player.pausedAt = ctx.currentTime - player.startTime + player.pausedAt;
    player.isPlaying = false;
    player.isPaused = true;
    stopProgressTimer();
    if (window.SynthEngine) SynthEngine.stopPlayback(true);
    if (player.onTick) player.onTick(player.pausedAt, player.duration);
  }

  function resumePlayback() {
    if (!player.isPaused || !player.phrase) return;
    if (!ensureEngine()) return;
    const ctx = SynthEngine.getCtx();
    player.startTime = ctx.currentTime;
    scheduleNotes(player.pausedAt);
    player.isPlaying = true;
    player.isPaused = false;
    startProgressTimer();
  }

  function stopPlayback() {
    stopPlaybackInternal();
    player.pausedAt = 0;
    if (player.onTick) player.onTick(0, player.duration);
  }

  function seekPlayback(ratio) {
    ratio = Math.max(0, Math.min(1, ratio));
    const target = ratio * player.duration;
    if (player.isPlaying) {
      if (window.SynthEngine) SynthEngine.stopPlayback(true);
      const ctx = SynthEngine.getCtx();
      player.startTime = ctx.currentTime;
      player.pausedAt = 0;
      scheduleNotes(target);
    } else if (player.isPaused) {
      player.pausedAt = target;
    }
    if (player.onTick) player.onTick(target, player.duration);
  }

  function setVolume(v) {
    player.volume = Math.max(0, Math.min(1, v));
    applyVolume();
  }

  function getPlayerState() {
    let elapsed = 0;
    if (player.isPlaying && window.SynthEngine) {
      const ctx = SynthEngine.getCtx();
      elapsed = ctx.currentTime - player.startTime + player.pausedAt;
    } else {
      elapsed = player.pausedAt;
    }
    return {
      work: player.work,
      isPlaying: player.isPlaying,
      isPaused: player.isPaused,
      elapsed,
      duration: player.duration,
      volume: player.volume,
    };
  }
