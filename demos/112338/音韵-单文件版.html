        </div>
        <div class="ac-rpt-body">
          <div class="ac-rpt-summary">
            <div class="ac-rpt-stat ac-rpt-stat--${statusClass}">
              <span class="ac-rpt-stat-label">检测结果</span>
              <span class="ac-rpt-stat-val">${statusText}</span>
            </div>
            <div class="ac-rpt-stat">
              <span class="ac-rpt-stat-label">最高相似度</span>
              <span class="ac-rpt-stat-val">${Math.round(r.maxSim * 100)}%</span>
            </div>
            <div class="ac-rpt-stat">
              <span class="ac-rpt-stat-label">相似度阈值</span>
              <span class="ac-rpt-stat-val">${Math.round(r.threshold * 100)}%</span>
            </div>
            <div class="ac-rpt-stat">
              <span class="ac-rpt-stat-label">重生次数</span>
              <span class="ac-rpt-stat-val">${r.attempt}</span>
            </div>
          </div>
          ${r.note ? `<div class="ac-rpt-note">${r.note}</div>` : ''}
          <div class="ac-rpt-section">
            <h4>与历史编曲比对（随机 3 首）</h4>
            <table class="ac-rpt-table">
              <thead><tr><th>#</th><th>历史时间</th><th>风格</th><th>旋律</th><th>和声</th><th>节奏</th><th>结构</th><th>综合</th><th>最相似维度</th></tr></thead>
              <tbody>${diffRows}</tbody>
            </table>
          </div>
          <div class="ac-rpt-section">
            <h4>新曲特征摘要</h4>
            <div class="ac-rpt-feat">
              <div><span>旋律音域</span>${fs.melodyRange[0]}–${fs.melodyRange[1]}</div>
              <div><span>旋律密度</span>${(fs.melodyDensity * 100).toFixed(1)}%</div>
              <div><span>和声进行</span>${fs.harmonyProg.join(' → ') || '—'}</div>
              <div><span>节奏密度</span>${(fs.rhythmDensity * 100).toFixed(1)}%</div>
              <div><span>切分度</span>${(fs.rhythmSyncopation * 100).toFixed(1)}%</div>
              <div><span>曲式</span>${fs.structure}</div>
            </div>
          </div>
          <div class="ac-rpt-section">
            <h4>差异点分析</h4>
            <ul class="ac-rpt-diffs">
              ${r.diffs.map(d => `<li>与 ${d.timestamp} 的 <strong>${d.dominantLabel}</strong> 维度最相似（${Math.round(d.scores[d.dominantDim === 'melody' ? 'melody' : d.dominantDim === 'harmony' ? 'harmony' : d.dominantDim === 'rhythm' ? 'rhythm' : 'structure'] * 100)}%），建议调高对应差异化参数</li>`).join('')}
            </ul>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));
    overlay.querySelector('#acRptClose').addEventListener('click', () => closeReport(overlay));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeReport(overlay); });
    const onKey = (e) => { if (e.key === 'Escape') { closeReport(overlay); document.removeEventListener('keydown', onKey); } };
    document.addEventListener('keydown', onKey);
  }
  function closeReport(overlay) {
    overlay.classList.remove('show');
    setTimeout(() => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 200);
  }

  function updateCount() {
    const v = container.querySelector('#acPrompt').value;
    container.querySelector('#acCount').textContent = v.length;
  }

  // 提示词解析预览（仅显示解析结果，不生成）
  function parsePreview() {
    if (mode !== 'prompt') return;
    const text = container.querySelector('#acPrompt').value;
    const parsed = parsePrompt(text);
    // 简单的语法高亮：在 placeholder 旁显示解析结果
    let info = '';
    if (parsed.style) info += `风格:${parsed.style} `;
    if (parsed.emotion) info += `情感:${parsed.emotion} `;
    if (parsed.tempoHint) info += `速度:${parsed.tempoHint}`;
    const genBtn = container.querySelector('#acGen');
    genBtn.disabled = (selected.size === 0);
    genBtn.title = info || '（未识别，将自动生成）';
  }

  // ---------- 提示词解析 ----------
  function parsePrompt(text) {
    if (!text) return {};
    const lower = text.toLowerCase();
    const result = {};
    // 风格
    for (const kw in STYLE_KEYWORDS) {
      if (lower.includes(kw.toLowerCase())) { result.style = STYLE_KEYWORDS[kw]; break; }
    }
    // 情感
    for (const kw in EMOTION_KEYWORDS) {
      if (lower.includes(kw.toLowerCase())) { result.emotion = EMOTION_KEYWORDS[kw]; break; }
    }
    // 节奏/速度
    for (const kw in RHYTHM_KEYWORDS) {
      if (lower.includes(kw.toLowerCase())) { result.tempoHint = RHYTHM_KEYWORDS[kw]; break; }
    }
    // 根音
    const rootMatch = text.match(/([A-G]#?)/);
    if (rootMatch && ROOTS[rootMatch[1]] !== undefined) result.root = ROOTS[rootMatch[1]];
    return result;
  }

  // ---------- 声部选择 ----------
  function refreshTrackSelect() {
    const tracks = app.getTracks();
    const wrap = container.querySelector('#acTracks');
    wrap.innerHTML = '';
    if (tracks.length === 0) {
      wrap.innerHTML = '<div class="ac-empty">请先从左侧添加乐器</div>';
      return;
    }
    tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'ac-track' + (selected.has(i) ? ' on' : '');
      const cat = t.instr.category;
      el.innerHTML = `
        <span class="ac-track-ic icon-${cat}"></span>
        <span class="ac-track-name">${t.instr.name}</span>
        <span class="ac-track-check">${selected.has(i) ? '✓' : ''}</span>
      `;
      el.addEventListener('click', () => {
        if (selected.has(i)) selected.delete(i);
        else selected.add(i);
        el.classList.toggle('on', selected.has(i));
        el.querySelector('.ac-track-check').textContent = selected.has(i) ? '✓' : '';
        parsePreview();
      });
      wrap.appendChild(el);
    });
    // 若之前选中的索引已失效，清理
    const max = tracks.length - 1;
    [...selected].forEach(i => { if (i > max) selected.delete(i); });
    parsePreview();
  }

  function selectAllTracks(on) {
    const tracks = app.getTracks();
    selected.clear();
    if (on) tracks.forEach((_, i) => selected.add(i));
    refreshTrackSelect();
  }

  // ---------- 生成主流程 ----------
  function generate() {
    if (generating) return;
    const tracks = app.getTracks();
    if (tracks.length === 0) { Toast.warn('请先添加乐器声部'); return; }
    if (selected.size === 0) { Toast.warn('请至少选择一个声部'); return; }

    const targetTracks = [...selected].map(i => tracks[i]).filter(Boolean);
    if (targetTracks.length === 0) { Toast.error('所选声部无效'); return; }

    // 解析提示词
    let cfg;
    if (mode === 'prompt') {
      const text = container.querySelector('#acPrompt').value.trim();
      if (!text) { Toast.warn('请输入提示词或切换到自动生成模式'); return; }
      cfg = resolveConfig(parsePrompt(text), targetTracks);
    } else {
      cfg = resolveConfig({}, targetTracks);
    }

    // 启动进度
    startProgress();
    generating = true;
    const genBtn = container.querySelector('#acGen');
    genBtn.classList.add('loading');
    genBtn.disabled = true;
    genBtn.querySelector('.ac-gen-text').textContent = '生成中…';
    genBtn.querySelector('.ac-gen-spin').hidden = false;

    // 异步执行（避免阻塞 UI）
    setTimeout(() => {
      try {
        // ===== 历史比对 + 自动重生流程 =====
        // 1) 生成 → 提取特征 → 与历史随机 3 首比对
        // 2) 超阈值则按差异化参数扰动 cfg 后重生（最多 REGEN_MAX_RETRIES 次）
        const result = checkAndRegenerate(targetTracks, cfg);
        cfg = result.cfg;
        // 3) 记录到历史数据库（保留最近 HISTORY_MAX 首）
        const features = extractFeatures(targetTracks, cfg);
        composeHistory.push({ features, timestamp: Date.now(), styleKey: cfg.styleKey });
        if (composeHistory.length > HISTORY_MAX) composeHistory.shift();
        // 4) 生成相似度检测报告
        lastReport = buildSimilarityReport(result.report);

        finishProgress(true);
        const regenInfo = result.report.attempt > 0 ? `（重生 ${result.report.attempt} 次）` : '';
        const reportInfo = lastReport && !lastReport.passed ? '· 相似度偏高' : '';
        Toast.success(`已为 ${targetTracks.length} 个声部生成编曲（${cfg.styleLabel}）${regenInfo}${reportInfo}`);
        container.querySelector('#acActions').hidden = false;
        // 显示"查看报告"按钮
        const reportBtn = container.querySelector('#acReport');
        if (reportBtn) reportBtn.hidden = false;
        if (app && app.refresh) app.refresh();
      } catch (e) {
        console.error('AutoCompose error:', e);
        Toast.error('生成失败：' + e.message);
        finishProgress(false);
      } finally {
        generating = false;
        genBtn.classList.remove('loading');
        genBtn.disabled = false;
        genBtn.querySelector('.ac-gen-text').textContent = '智能生成';
        genBtn.querySelector('.ac-gen-spin').hidden = true;
      }
    }, 30);
  }

  // 风格 key → 名曲数据库 genre key 映射
  // 用于查询 ReferenceWorks.getFeaturesByStyle() 提取的参考特征
  const STYLE_TO_GENRE = {
    pop:'pop', classical:'classical', jazz:'jazz', chinese:'chinese', folk:'folk',
    // 其余风格就近映射到 5 大流派
    rock:'pop', blues:'jazz', ballad:'pop', latin:'jazz', waltz:'classical',
    march:'classical', electronic:'pop', funk:'jazz', lofi:'jazz',
    ambient:'classical', metal:'pop', reggae:'pop', country:'folk',
    rnb:'pop', techno:'pop',
  };

  // 解析结果 → 完整配置（结合声部乐器特性 + 名曲参考特征）
  function resolveConfig(parsed, targetTracks) {
    // 默认风格：根据声部乐器推断
    let styleKey = parsed.style;
    if (!styleKey) {
      const cats = targetTracks.map(t => t.instr.category);
      if (cats.includes('percussion')) styleKey = 'rock';
      else if (cats.every(c => c === 'strings')) styleKey = 'classical';
      else if (cats.includes('keyboard')) styleKey = 'pop';
      else styleKey = 'pop';
    }
    const preset = STYLE_PRESETS[styleKey] || STYLE_PRESETS.pop;

    // 情感调整
    let scaleName = preset.scale;
    let tempoMul = 1;
    let velMul = 1;
    if (parsed.emotion && EMOTION_MOD[parsed.emotion]) {
      const mod = EMOTION_MOD[parsed.emotion];
      tempoMul *= mod.tempoMul;
      velMul *= mod.velMul;
      if (mod.preferScale) scaleName = mod.preferScale;
    }

    // 速度
    let tempo = preset.tempo;
    if (parsed.tempoHint === 'fast') tempo = Math.round(tempo * 1.3);
    else if (parsed.tempoHint === 'slow') tempo = Math.round(tempo * 0.7);
    tempo = Math.round(tempo * tempoMul);
    tempo = Math.max(40, Math.min(220, tempo));

    const root = parsed.root !== undefined ? parsed.root : 0; // 默认 C

    // ===== 名曲参考特征接入（强制启用）=====
    // 从 ReferenceWorks 提取该风格的聚合参考特征，用于优化生成
    // 该特征现为所有生成流程的强制依赖，UI 不再提供关闭入口
    let refFeatures = null;
    const genreKey = STYLE_TO_GENRE[styleKey] || 'pop';
    if (window.ReferenceWorks && ReferenceWorks.getFeaturesByStyle) {
      try { refFeatures = ReferenceWorks.getFeaturesByStyle(genreKey); } catch (e) { refFeatures = null; }
    }

    // 参考速度（与预设和提示词叠加：取中位数避免极端值）
    let refTempo = tempo;
    if (refFeatures && refFeatures.tempo) {
      refTempo = Math.round((tempo + refFeatures.tempo) / 2);
    }
    // 参考和声进行：优先使用名曲库的高频进行，提升和声功能性
    let progression = PROGRESSIONS[preset.prog] || PROGRESSIONS.pop;
    if (refFeatures && refFeatures.progression && refFeatures.progression.length) {
      progression = refFeatures.progression;
    }
    // 参考调式
    let scaleArr = SCALES[scaleName] || SCALES.major;
    if (refFeatures && refFeatures.scale && SCALES[refFeatures.scale]) {
      scaleArr = SCALES[refFeatures.scale];
      scaleName = refFeatures.scale;
    }
    // 参考节奏密度 → 调整打击乐密度系数
    let densityFactor = 1;
    if (refFeatures && typeof refFeatures.rhythmDensity === 'number') {
      densityFactor = Math.max(0.6, Math.min(1.3, refFeatures.rhythmDensity / 0.55));
    }
    // 参考动态范围 → 调整强弱对比
    let dynamicFactor = 1;
    if (refFeatures && typeof refFeatures.dynamicRange === 'number') {
      dynamicFactor = Math.max(0.7, Math.min(1.2, refFeatures.dynamicRange / 0.6));
    }

    return {
      styleKey, styleLabel: preset.label,
      scaleName, scale: scaleArr,
      progression,
      rhythm: RHYTHMS[preset.rhythm] || RHYTHMS.pop,
      tempo: refTempo, velMul, root,
      // 参考特征透传，供生成器内部使用
      refFeatures,
      densityFactor,
      dynamicFactor,
      refInstruments: refFeatures ? refFeatures.instruments : null,
      refContour: refFeatures ? refFeatures.melodyContour : null,
      refAccent: refFeatures ? refFeatures.accentPattern : null,
    };
  }

  // ---------- 历史比对：特征提取 / 相似度 / 差异化 / 重生 ----------
  // 从已生成的 tracks 中提取多维音乐特征
  function extractFeatures(tracks, cfg) {
    const numBars = app.getNumBars();
    const stepsPerBar = 16;
    // 按角色归类
    const melodies = [], harmonies = [], percs = [];
    tracks.forEach(t => {
      const role = decideRole(t, (t.range || t.instr.range)[0], (t.range || t.instr.range)[1], cfg.refInstruments);
      if (role === 'melody') melodies.push(t);
      else if (role === 'harmony') harmonies.push(t);
      else if (role === 'percussion') percs.push(t);
    });

    // 旋律特征：音高轮廓 + 音域 + 平均音程 + 密度
    let melodyFeat = { contour: [], range: [60, 60], avgInterval: 0, density: 0, notesCount: 0 };
    const allMelNotes = melodies.flatMap(t => t.notes || []);
    if (allMelNotes.length) {
      const sorted = [...allMelNotes].sort((a, b) => a.step - b.step);
      const pitches = sorted.map(n => n.midi);
      // 轮廓：每 4 步取一音，标记 U/D/s（上行/下行/平稳）
      const samples = [];
      for (let i = 0; i < sorted.length; i += Math.max(1, Math.floor(sorted.length / 16))) samples.push(sorted[i].midi);
      const contour = [];
      for (let i = 1; i < samples.length; i++) {
        const d = samples[i] - samples[i - 1];
        contour.push(d > 1 ? 'U' : d < -1 ? 'D' : 's');
      }
      melodyFeat = {
        contour,
        range: [Math.min(...pitches), Math.max(...pitches)],
        avgInterval: pitches.length > 1 ? (pitches.reduce((s, p, i) => i ? s + Math.abs(p - pitches[i - 1]) : s, 0) / (pitches.length - 1)) : 0,
        density: allMelNotes.length / (numBars * stepsPerBar),
        notesCount: allMelNotes.length,
      };
    }

    // 和声特征：和弦进行序列（级数+类型）+ 调式中心
    let harmonyFeat = { progression: [], scaleName: cfg.scaleName, root: cfg.root };
    if (harmonies.length) {
      harmonyFeat.progression = cfg.progression.map(c => `${c[0]}${c[1]}`);
    }

    // 节奏特征：打击乐密度 + 切分度 + 模式签名
    let rhythmFeat = { density: 0, syncopation: 0, signature: '' };
    const allPercNotes = percs.flatMap(t => t.notes || []);
    if (allPercNotes.length) {
      const beats = new Array(stepsPerBar * numBars).fill(0);
      allPercNotes.forEach(n => { if (n.step < beats.length) beats[n.step] = 1; });
      // 切分：落在弱拍（非 0/4/8/12）的击打占比
      const sync = beats.reduce((s, v, i) => s + (v && i % 4 !== 0 ? 1 : 0), 0);
      rhythmFeat = {
        density: allPercNotes.length / (numBars * stepsPerBar),
        syncopation: allPercNotes.length ? sync / allPercNotes.length : 0,
        signature: beats.join('').slice(0, 32),
      };
    }

    // 结构特征：曲式（主副歌比例）+ 小节数 + 速度
    const structureFeat = {
      numBars,
      verseChorusRatio: numBars ? Math.floor(numBars / 2) / numBars : 0,
      tempo: cfg.tempo,
      form: numBars >= 4 ? 'AB' : 'A',
    };

    return {
      melody: melodyFeat,
      harmony: harmonyFeat,
      rhythm: rhythmFeat,
      structure: structureFeat,
      meta: { styleKey: cfg.styleKey, scaleName: cfg.scaleName, tempo: cfg.tempo },
      timestamp: Date.now(),
    };
  }

  // 计算两个特征的多维相似度（0=完全不同，1=完全相同）
  function computeSimilarity(fA, fB) {
    // 旋律相似度：轮廓重合 + 音域重叠 + 平均音程接近
    let melSim = 0;
    if (fA.melody.contour.length && fB.melody.contour.length) {
      const len = Math.min(fA.melody.contour.length, fB.melody.contour.length);
      let match = 0;
      for (let i = 0; i < len; i++) if (fA.melody.contour[i] === fB.melody.contour[i]) match++;
      const contourSim = match / len;
      const rangeOverlap = Math.max(0, Math.min(fA.melody.range[1], fB.melody.range[1]) - Math.max(fA.melody.range[0], fB.melody.range[0])) /
        Math.max(1, Math.max(fA.melody.range[1], fB.melody.range[1]) - Math.min(fA.melody.range[0], fB.melody.range[0]));
      const intervalSim = 1 - Math.min(1, Math.abs(fA.melody.avgInterval - fB.melody.avgInterval) / 6);
      melSim = contourSim * 0.5 + rangeOverlap * 0.25 + intervalSim * 0.25;
    }
    // 和声相似度：进行序列重合 + 调式匹配
    let harSim = 0;
    if (fA.harmony.progression.length && fB.harmony.progression.length) {
      const len = Math.min(fA.harmony.progression.length, fB.harmony.progression.length);
      let match = 0;
      for (let i = 0; i < len; i++) if (fA.harmony.progression[i] === fB.harmony.progression[i]) match++;
      const progSim = match / len;
      const scaleSim = fA.harmony.scaleName === fB.harmony.scaleName ? 1 : 0;
      harSim = progSim * 0.7 + scaleSim * 0.3;
    }
    // 节奏相似度：密度接近 + 切分接近 + 签名重合
    let rhySim = 0;
    if (fA.rhythm.signature && fB.rhythm.signature) {
      const densSim = 1 - Math.min(1, Math.abs(fA.rhythm.density - fB.rhythm.density) / 0.3);
      const syncSim = 1 - Math.min(1, Math.abs(fA.rhythm.syncopation - fB.rhythm.syncopation) / 0.5);
      const len = Math.min(fA.rhythm.signature.length, fB.rhythm.signature.length);
      let match = 0;
      for (let i = 0; i < len; i++) if (fA.rhythm.signature[i] === fB.rhythm.signature[i]) match++;
      const sigSim = match / len;
      rhySim = densSim * 0.4 + syncSim * 0.3 + sigSim * 0.3;
    }
    // 结构相似度：曲式 + 小节数 + 速度接近
    const formSim = fA.structure.form === fB.structure.form ? 1 : 0;
    const barsSim = 1 - Math.min(1, Math.abs(fA.structure.numBars - fB.structure.numBars) / 8);
    const tempoSim = 1 - Math.min(1, Math.abs(fA.structure.tempo - fB.structure.tempo) / 60);
    const strSim = formSim * 0.4 + barsSim * 0.3 + tempoSim * 0.3;
    // 综合（加权）
    const overall = melSim * 0.35 + harSim * 0.25 + rhySim * 0.25 + strSim * 0.15;
    return { melody: melSim, harmony: harSim, rhythm: rhySim, structure: strSim, overall };
  }

  // 从历史中随机抽取 n 首进行比对
  function pickRandomHistory(n) {
    if (composeHistory.length === 0) return [];
    const pool = [...composeHistory];
    const out = [];
    for (let i = 0; i < n && pool.length; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      out.push(pool.splice(idx, 1)[0]);
    }
    return out;
  }

  // 根据差异化参数对 cfg 进行扰动（提升与历史的差异）
  function applyDifferentiation(cfg, attempt) {
    const p = diffParams;
    const strength = 0.3 + p.melodyInnovation * 0.7; // 创新度越高扰动越强
    // 旋律创新：随机替换部分音阶（在同调式中选取变体）
    if (p.melodyInnovation > 0.3 && Math.random() < strength) {
      const variants = { major: 'majorPent', minor: 'minorPent', dorian: 'minor', chinese: 'majorPent' };
      const alt = variants[cfg.scaleName];
      if (alt && SCALES[alt]) { cfg.scale = SCALES[alt]; cfg.scaleName = alt; }
    }
    // 和声变化：根据范围扩展或替换和弦进行
    if (p.harmonyRange > 0.4 && attempt > 0) {
      const progs = Object.keys(PROGRESSIONS).filter(k => k !== cfg.styleKey);
      // 在范围内（harmonyRange 越大可选越多）
      const pool = progs.slice(0, Math.ceil(p.harmonyRange * progs.length));
      const alt = pool[Math.floor(Math.random() * pool.length)];
      if (PROGRESSIONS[alt]) cfg.progression = PROGRESSIONS[alt];
    }
    // 节奏复杂度：切换更复杂的节奏模板 + 提升切分
    if (p.rhythmComplexity > 0.5 && attempt > 0) {
      const complex = ['funk', 'latin', 'jazz', 'electronic'];
      const alt = complex[Math.floor(Math.random() * complex.length)];
      if (RHYTHMS[alt]) cfg.rhythm = RHYTHMS[alt];
    }
    // 根音微调（每次重试换一个根音，避免和声雷同）
    if (attempt > 0) {
      cfg.root = (cfg.root + (attempt * 3)) % 12;
    }
    return cfg;
  }

  // 检查 + 重生：与历史 3 首比对，超阈值则重生
  function checkAndRegenerate(targetTracks, baseCfg) {
    const threshold = diffParams.similarityThreshold;
    let cfg = baseCfg;
    let attempt = 0;
    let report = null;
    while (attempt <= REGEN_MAX_RETRIES) {
      // 生成
      targetTracks.forEach(t => { t.notes = []; });
      compose(targetTracks, cfg);
      const features = extractFeatures(targetTracks, cfg);
      // 与历史随机 3 首比对
      const samples = pickRandomHistory(3);
      const scores = samples.map(s => ({ vs: s, sim: computeSimilarity(features, s.features) }));
      const maxSim = scores.length ? Math.max(...scores.map(s => s.sim.overall)) : 0;
      const passed = maxSim <= threshold;
      report = {
        features, scores, maxSim, threshold, passed, attempt,
        timestamp: Date.now(),
      };
      if (passed || composeHistory.length === 0) {
        return { ok: true, cfg, report };
      }
      // 超阈值：扰动后重生
      attempt++;
      cfg = applyDifferentiation({ ...baseCfg }, attempt);
    }
    // 达到最大重试仍未通过：接受当前结果但标记
    report.passed = false;
    report.note = '已达到最大重试次数，采用最接近阈值的版本';
    return { ok: true, cfg, report };
  }

  // 构建相似度检测报告（含差异点分析）
  function buildSimilarityReport(report) {
    if (!report) return null;
    const diffs = [];
    report.scores.forEach(s => {
      const sim = s.sim;
      const dim = ['melody', 'harmony', 'rhythm', 'structure'].reduce((max, k) => sim[k] > sim[max] ? k : max, 'melody');
      diffs.push({
        timestamp: new Date(s.vs.timestamp).toLocaleTimeString(),
        styleKey: s.vs.styleKey,
        scores: sim,
        dominantDim: dim,
        dominantLabel: { melody: '旋律', harmony: '和声', rhythm: '节奏', structure: '结构' }[dim],
      });
    });
    return {
      passed: report.passed,
      attempt: report.attempt,
      maxSim: report.maxSim,
      threshold: report.threshold,
      note: report.note || '',
      diffs,
      featureSummary: {
        melodyRange: report.features.melody.range,
        melodyDensity: report.features.melody.density,
        harmonyProg: report.features.harmony.progression,
        rhythmDensity: report.features.rhythm.density,
        rhythmSyncopation: report.features.rhythm.syncopation,
        structure: report.features.structure.form,
      },
    };
  }

  // ---------- 核心生成 ----------
  // 参考乐器编配 → 决定每个声部应当承担的角色
  // 返回 'melody' | 'harmony' | 'bass' | 'percussion'
  function decideRole(t, lo, hi, refInstr) {
    const isPerc = !t.instr.pitched;
    if (isPerc) return 'percussion';
    const isBass = (t.instr.category === 'strings' && hi <= 60) || (lo <= 36);
    if (isBass) return 'bass';
    // 若名曲库提供了参考乐器编配，则按乐器匹配角色
    if (refInstr) {
      const id = (t.instr.id || '').toLowerCase();
      const name = (t.instr.name || '').toLowerCase();
      const matchKey = (role) => {
        const v = refInstr[role];
        if (!v) return false;
        const vv = v.toLowerCase();
        // 通用映射：strings/keyboard/percussion
        if (vv === 'strings' && t.instr.category === 'strings') return true;
        if (vv === 'keyboard' && t.instr.category === 'keyboard') return true;
        if (vv === 'percussion') return false; // 非打击不映射
        return id.includes(vv) || name.includes(vv);
      };
      if (refInstr.melody && matchKey('melody')) return 'melody';
      if (refInstr.harmony && matchKey('harmony')) return 'harmony';
    }
    // 默认：键盘/弦乐 → 和声，其他 → 旋律
    if (t.instr.category === 'keyboard' || t.instr.category === 'strings') return 'harmony';
    return 'melody';
  }

  function compose(targetTracks, cfg) {
    const numBars = app.getNumBars();
    const stepsPerBar = 16;
    const totalSteps = numBars * stepsPerBar;

    // 应用速度
    if (app.setTempo) app.setTempo(cfg.tempo);

    // 曲式：前半为主歌(verse)，后半为副歌(chorus)
    const verseEnd = Math.floor(numBars / 2);
    const scale = cfg.scale;
    const root = cfg.root + 60; // 根音基准 C4=60

    // 先决定每个声部角色，便于在多声部中明确分工
    const roleMap = targetTracks.map(t => {
      const range = t.range || (t.instr && t.instr.range) || [36, 84];
      return { track: t, role: decideRole(t, range[0], range[1], cfg.refInstruments), lo: range[0], hi: range[1] };
    });

    roleMap.forEach(({ track: t, role, lo, hi }) => {
      t.notes = [];
      if (role === 'percussion') {
        // 打击乐：套用节奏模板，结合参考节奏密度调整
        for (let b = 0; b < numBars; b++) {
          const isChorus = b >= verseEnd;
          const intensity = isChorus ? 1 : 0.85;
          const pat = cfg.rhythm;
          let key = 'hat';
          const id = (t.instr.id || '').toLowerCase();
          if (id.includes('kick') || id.includes('bass') || id.includes('底') || id.includes('大鼓')) key = 'kick';
          else if (id.includes('snare') || id.includes('军') || id.includes('小鼓')) key = 'snare';
          else if (id.includes('hihat') || id.includes('hat') || id.includes('镲')) key = 'hat';
          const arr = pat[key] || pat.hat;
          for (let s = 0; s < stepsPerBar; s++) {
            if (arr[s]) {
              // 参考密度因子调整：稀疏风格降低 vel
              const densMod = (cfg.densityFactor || 1) * (cfg.dynamicFactor || 1);
              t.notes.push({ step: b * stepsPerBar + s, midi: lo, dur: 1, vel: Math.min(1, 0.9 * intensity * cfg.velMul * densMod) });
            }
          }
        }
      } else if (role === 'bass') {
        generateBass(t, numBars, stepsPerBar, cfg, lo, hi, verseEnd);
      } else if (role === 'harmony') {
        generateChords(t, numBars, stepsPerBar, cfg, lo, hi, verseEnd);
      } else {
        generateMelody(t, numBars, stepsPerBar, cfg, lo, hi, verseEnd, root, scale);
      }
    });
  }

  // 生成旋律
  // 改进点：1) 依据参考轮廓引导音高走向；2) 优先选择和弦音 + 邻音级进；3) 强化主题发展
  function generateMelody(t, numBars, stepsPerBar, cfg, lo, hi, verseEnd, root, scale) {
    const prog = cfg.progression;
    const contour = (cfg.refContour || ['s','U','s','D','R','U','s']);
    // 轮廓符号映射为半音方向
    const dirOf = (c) => ({ U: 1, D: -1, s: 0, S: 0, R: 0 }[c] || 0);
    for (let b = 0; b < numBars; b++) {
      const isChorus = b >= verseEnd;
      const chord = prog[b % prog.length];
      const chordRoot = root + scale[chord[0] % scale.length];
      const chordTones = buildChord(chordRoot, chord[1], scale);
      // 把和弦音映射到乐器音域
      const usableTones = chordTones.map(m => snapToRange(m, lo, hi)).filter(m => m >= lo && m <= hi);
      const density = (isChorus ? 0.7 : 0.5) * (cfg.densityFactor || 1);
      let lastNote = usableTones[0] || lo;
      let contourIdx = 0;
      for (let s = 0; s < stepsPerBar; s++) {
        // 节奏：偶数拍 + 一些切分
        const onBeat = (s % 4 === 0) || (s % 4 === 2);
        const syncopa = (s === 6 || s === 14);
        if (onBeat || syncopa) {
          if (Math.random() < density) {
            // 取当前轮廓方向
            const dir = dirOf(contour[contourIdx % contour.length]);
            contourIdx++;
            let midi;
            // 选音：依据方向偏好选择和弦音/邻音
            // 上行：选高于上一个音的和弦音；下行：选低于；其余随机
            const candidates = usableTones.length
              ? usableTones.filter(m => dir > 0 ? m >= lastNote : dir < 0 ? m <= lastNote : true)
              : [];
            const pool = candidates.length ? candidates : usableTones;
            if (Math.random() < 0.72 && pool.length) {
              midi = pool[Math.floor(Math.random() * pool.length)];
            } else {
              // 经过音：按轮廓方向级进
              const idx = scale.findIndex(iv => (root + iv) % 12 === lastNote % 12);
              const stepDir = dir !== 0 ? dir : (Math.random() < 0.5 ? 1 : -1);
              const next = scale[(idx + stepDir + scale.length) % scale.length];
              midi = snapToRange(root + next, lo, hi);
            }
            // 避免突兀大跳（≤5 度）
            if (Math.abs(midi - lastNote) > 7) midi = lastNote + (midi > lastNote ? 5 : -5);
            midi = Math.max(lo, Math.min(hi, midi));
            const dur = (s % 4 === 0) ? 2 : 1;
            const vel = (0.7 + Math.random() * 0.2) * cfg.velMul * (cfg.dynamicFactor || 1) * (isChorus ? 1.05 : 0.9);
            t.notes.push({ step: b * stepsPerBar + s, midi, dur, vel: Math.min(1, vel) });
            lastNote = midi;
          }
        }
      }
    }
  }

  // 生成和声（铺底和弦）
  function generateChords(t, numBars, stepsPerBar, cfg, lo, hi, verseEnd) {
    const root = cfg.root + 60;
    const scale = cfg.scale;
    const prog = cfg.progression;
    for (let b = 0; b < numBars; b++) {
      const chord = prog[b % prog.length];
      const chordRoot = root + (scale[chord[0] % scale.length] || 0);
      const chordTones = buildChord(chordRoot, chord[1], scale);
      // 降到乐器音域
      const tones = chordTones.map(m => snapToRange(m, lo, hi - 12)).filter(m => m >= lo && m <= hi);
      const dur = stepsPerBar; // 整小节长音
      const vel = (0.5 + Math.random() * 0.15) * cfg.velMul * (b >= verseEnd ? 1.0 : 0.85);
      tones.forEach(m => {
        t.notes.push({ step: b * stepsPerBar, midi: m, dur, vel: Math.min(1, vel) });
      });
    }
  }

  // 生成低音
  function generateBass(t, numBars, stepsPerBar, cfg, lo, hi, verseEnd) {
    const prog = cfg.progression;
    const root = cfg.root + 36; // 低音区 C2
    // 副歌节奏型：优先采用参考重音模式
    let chorusPattern = [0, 4, 8, 12];
    if (cfg.refAccent && cfg.refAccent.length) {
      chorusPattern = cfg.refAccent.filter(s => s < stepsPerBar);
      if (chorusPattern.length === 0) chorusPattern = [0, 4, 8, 12];
    }
    for (let b = 0; b < numBars; b++) {
      const chord = prog[b % prog.length];
      const bassNote = snapToRange(root + (cfg.scale[chord[0] % cfg.scale.length] || 0), lo, hi);
      const isChorus = b >= verseEnd;
      // 主歌：根音长音；副歌：参考节奏型
      if (isChorus) {
        chorusPattern.forEach((s, i) => {
          // 节奏点：参考重音模式首位强、其余渐弱
          const accent = i === 0 ? 0.9 : 0.78;
          t.notes.push({ step: b * stepsPerBar + s, midi: bassNote, dur: 3, vel: Math.min(1, accent * cfg.velMul * (cfg.dynamicFactor || 1)) });
        });
      } else {
        t.notes.push({ step: b * stepsPerBar, midi: bassNote, dur: stepsPerBar, vel: 0.7 * cfg.velMul * (cfg.dynamicFactor || 1) });
      }
    }
  }

  // 构建和弦音
  function buildChord(root, type, scale) {
    // 根据和弦类型取音
    let intervals;
    switch (type) {
      case 'm': case 'm7': intervals = [0, 3, 7, 10]; break;
      case '7': intervals = [0, 4, 7, 10]; break;
      case 'M7': intervals = [0, 4, 7, 11]; break;
      default: intervals = [0, 4, 7]; // 大三
    }
    return intervals.map(iv => root + iv);
  }

  // 把音符映射到音域内（升降八度）
  function snapToRange(midi, lo, hi) {
    while (midi < lo) midi += 12;
    while (midi > hi) midi -= 12;
    return midi;
  }

  // ---------- 进度 ----------
  function startProgress() {
    const p = container.querySelector('#acProgress');
    p.hidden = false;
    const fill = container.querySelector('#acProgressFill');
    const text = container.querySelector('#acProgressText');
    fill.style.width = '0%';
    text.textContent = '准备中…';
    let pct = 0;
    progressTimer = setInterval(() => {
      pct = Math.min(95, pct + Math.random() * 25 + 10);
      fill.style.width = pct + '%';
      text.textContent = `生成中 ${Math.round(pct)}%`;
    }, 400);
  }
  function finishProgress(ok) {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    const fill = container.querySelector('#acProgressFill');
    const text = container.querySelector('#acProgressText');
    if (ok) {
      fill.style.width = '100%';
      text.textContent = '完成';
      setTimeout(() => { container.querySelector('#acProgress').hidden = true; }, 1200);
    } else {
      text.textContent = '失败';
    }
  }

  // ---------- 预览 ----------
  // 保存提示对话框（检测钢琴卷帘未保存内容后弹出）
  function showSaveDialog(onDone) {
    const overlay = document.createElement('div');
    overlay.className = 'ac-modal-overlay';
    overlay.innerHTML = `
      <div class="ac-modal" role="dialog" aria-modal="true" aria-labelledby="acModalTitle">
        <div class="ac-modal-icon" aria-hidden="true">⚠</div>
        <h3 class="ac-modal-title" id="acModalTitle">您有未保存的编曲内容，是否保存？</h3>
        <p class="ac-modal-desc">预览智能编曲结果将切换钢琴卷帘显示内容，未保存的编辑将保留在工程中但不再显示于当前视图。</p>
        <div class="ac-modal-actions">
          <button class="ac-modal-btn ac-modal-save" id="acModalSave">保存</button>
          <button class="ac-modal-btn ac-modal-discard" id="acModalDiscard">不保存</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));

    const close = (choice) => {
      overlay.classList.remove('show');
      setTimeout(() => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 200);
      onDone(choice);
    };

    overlay.querySelector('#acModalSave').addEventListener('click', () => close('save'));
    overlay.querySelector('#acModalDiscard').addEventListener('click', () => close('discard'));
    // 点击遮罩或 Esc 视为不保存
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close('discard'); });
    const onKey = (e) => {
      if (e.key === 'Escape') { close('discard'); document.removeEventListener('keydown', onKey); }
      else if (e.key === 'Enter') { close('save'); document.removeEventListener('keydown', onKey); }
    };
    document.addEventListener('keydown', onKey);
    // 聚焦主按钮
    setTimeout(() => overlay.querySelector('#acModalSave').focus(), 50);
  }

  // 将智能编曲生成的音乐加载到钢琴卷帘并播放预览
  function loadAndPreview() {
    const tracks = app.getTracks();
    const target = [...selected].map(i => tracks[i]).filter(Boolean);
    if (target.length === 0) { Toast.warn('请先选择声部'); return; }

    // 切换钢琴卷帘显示首个选中声部（已含生成音符）
    const firstIdx = [...selected].find(i => tracks[i] && tracks[i].notes.length > 0);
    if (firstIdx != null && app.previewInPianoRoll) {
      app.previewInPianoRoll(firstIdx);
      Toast.info(`已在钢琴卷帘加载「${tracks[firstIdx].instr.name}」声部`);
    }

    // 播放音频预览
    if (!window.SynthEngine) { Toast.error('音频引擎未就绪'); return; }
    SynthEngine.resume && SynthEngine.resume();
    SynthEngine.startPlayback(target, 16, app.getNumBars(), app.getTempo(), null, () => {
      Toast.info('预览结束');
    });
  }

  function preview() {
    const tracks = app.getTracks();
    const target = [...selected].map(i => tracks[i]).filter(Boolean);
    if (target.length === 0) { Toast.warn('请先选择声部'); return; }

    // 检测钢琴卷帘是否存在未保存的用户编曲内容
    const hasUnsaved = app.isDirty && app.isDirty() && tracks.some(t => t.notes.length > 0);

    if (hasUnsaved) {
      showSaveDialog((choice) => {
        if (choice === 'save') {
          // 保存当前工程
          if (app.exportProject) app.exportProject();
          else if (app.markSaved) app.markSaved();
        }
        // 无论保存与否，加载生成内容到钢琴卷帘预览
        loadAndPreview();
      });
    } else {
      // 无未保存内容，直接加载预览
      loadAndPreview();
    }
  }

  // ---------- MIDI 导出（Type-0） ----------
  function exportMidi() {
    const tracks = app.getTracks();
    const target = [...selected].map(i => tracks[i]).filter(Boolean);
    if (target.length === 0) { Toast.warn('请先选择声部'); return; }
    try {
      const midi = buildMidiFile(target, app.getNumBars(), app.getTempo());
      const blob = new Blob([midi], { type: 'audio/midi' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `composition_${Date.now()}.mid`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      Toast.success('MIDI 已导出');
    } catch (e) {
      Toast.error('MIDI 导出失败：' + e.message);
    }
  }

  function buildMidiFile(tracks, numBars, tempo) {
    const ticksPerQuarter = 480;
    const stepsPerBar = 16;
    const secPerStep = 60 / tempo / 4;
    const ticksPerStep = ticksPerQuarter / 4;
    // 收集所有事件（绝对 tick）
    const events = [];
    tracks.forEach((t, ti) => {
      const channel = ti % 16;
      (t.notes || []).forEach(n => {
        const startTick = Math.round(n.step * ticksPerStep);
        const durTicks = Math.round((n.dur || 1) * ticksPerStep);
        const midi = t.pitched ? n.midi + (t.transpose || 0) : (t.preset && t.preset.range ? t.preset.range[0] : 60);
        const vel = Math.round((n.vel || 0.8) * 127);
        events.push({ tick: startTick, type: 'on', channel, midi, vel });
        events.push({ tick: startTick + durTicks, type: 'off', channel, midi, vel: 0 });
      });
    });
    events.sort((a, b) => a.tick - b.tick || (a.type === 'off' ? -1 : 1));

    // 编码
    const bytes = [];
    function writeVarLen(v) {
      const buf = [];
      buf.push(v & 0x7F);
      v >>= 7;
      while (v > 0) { buf.push((v & 0x7F) | 0x80); v >>= 7; }
      buf.reverse().forEach(b => bytes.push(b));
    }
    function writeStr(s) { for (let i = 0; i < s.length; i++) bytes.push(s.charCodeAt(i)); }
    function write32(v) { bytes.push((v >> 24) & 0xFF, (v >> 16) & 0xFF, (v >> 8) & 0xFF, v & 0xFF); }
    function write16(v) { bytes.push((v >> 8) & 0xFF, v & 0xFF); }

    // Header
    writeStr('MThd'); write32(6); write16(0); write16(1); write16(ticksPerQuarter);
    // Tempo meta
    const trackBytes = [];
    const usPerQuarter = Math.round(60000000 / tempo);
    trackBytes.push(0x00, 0xFF, 0x51, 0x03, (usPerQuarter >> 16) & 0xFF, (usPerQuarter >> 8) & 0xFF, usPerQuarter & 0xFF);
    // End of track placeholder

    let lastTick = 0;
    events.forEach(ev => {
      const delta = ev.tick - lastTick;
      lastTick = ev.tick;
      // write varlen
      const dl = [];
      let v = delta;
      dl.push(v & 0x7F); v >>= 7;
      while (v > 0) { dl.push((v & 0x7F) | 0x80); v >>= 7; }
      dl.reverse().forEach(b => trackBytes.push(b));
      if (ev.type === 'on') {
        trackBytes.push(0x90 | ev.channel, ev.midi & 0x7F, ev.vel & 0x7F);
      } else {
        trackBytes.push(0x80 | ev.channel, ev.midi & 0x7F, 0x00);
      }
    });
    // End of track
    trackBytes.push(0x00, 0xFF, 0x2F, 0x00);

    writeStr('MTrk'); write32(trackBytes.length);
    trackBytes.forEach(b => bytes.push(b));
    return new Uint8Array(bytes);
  }

  // ---------- 外部刷新 ----------
  function refresh() {
    if (container && !container.querySelector('#acPanel').hidden) refreshTrackSelect();
  }

  return { init, refresh };
})();

window.AutoCompose = AutoCompose;

</script>
  <script>
/* ============================================================
 * toast.js — 轻量通知反馈（含无障碍 ARIA live region）
 * ============================================================ */

const Toast = (() => {
  let container = null, liveRegion = null;
  const STACK = [];
  const MAX_VISIBLE = 4;

  function ensureEls() {
    if (container) return container;
    container = document.createElement('div');
    container.className = 'toast-container';
    container.setAttribute('role', 'region');
    container.setAttribute('aria-label', '操作反馈通知');
    document.body.appendChild(container);
    liveRegion = document.createElement('div');
    liveRegion.className = 'sr-only';
    liveRegion.setAttribute('aria-live', 'polite');
    liveRegion.setAttribute('aria-atomic', 'true');
    document.body.appendChild(liveRegion);
    return container;
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

  function dismiss(el) {
    el.classList.remove('show');
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
  }

  function show(msg, opts = {}) {
    if (!ensureEls()) return;
    const type = opts.type || 'info';
    const duration = opts.duration == null ? 2200 : opts.duration;
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.setAttribute('role', 'alert');
    const icon = { info:'ℹ', success:'✓', warn:'⚠', error:'✕' }[type] || 'ℹ';
    el.innerHTML = `<span class="toast-icon" aria-hidden="true">${icon}</span><span class="toast-msg">${escapeHtml(msg)}</span>`;
    container.appendChild(el);
    STACK.push(el);
    if (STACK.length > MAX_VISIBLE) { const old = STACK.shift(); dismiss(old); }
    requestAnimationFrame(() => el.classList.add('show'));
    if (!opts.silent && liveRegion) liveRegion.textContent = msg;
    if (duration > 0) setTimeout(() => dismiss(el), duration);
    return el;
  }

  function info(msg, opts) { return show(msg, Object.assign({ type: 'info' }, opts)); }
  function success(msg, opts) { return show(msg, Object.assign({ type: 'success' }, opts)); }
  function warn(msg, opts) { return show(msg, Object.assign({ type: 'warn' }, opts)); }
  function error(msg, opts) { return show(msg, Object.assign({ type: 'error', duration: 4000 }, opts)); }

  return { show, info, success, warn, error };
})();

window.Toast = Toast;

</script>
  <script>
/* ============================================================
 * app.js — 主控制器
 * 管理轨道、乐器库、传输、生成、录制、导入导出、音效调整、快捷键
 * ============================================================ */

const App = (() => {
  const tracks = [];
  let selectedTrackId = null;
  let numBars = 4;
  const STEPS_PER_BAR = 16;
  let isPlaying = false;
  let isRecording = false;
  let dirty = false;  // 钢琴卷帘是否有未保存的用户编曲内容
  const COLORS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e91e63','#00bcd4','#f1c40f'];
  const $ = (id) => document.getElementById(id);

  let activeGroup = 'basic';
  let activeCat = 'strings';

  function init() {
    SynthEngine.init();
    Recorder.init(SynthEngine.getCtx());
    PianoRoll.init($('pianoView'), {
      onChange: renderScore,
      onSelect: (n) => updateSel(n),
      onSeek: (step) => onTimelineSeek(step),
      onLoop: (lp) => onLoopChanged(lp),
    });
    PianoRoll.setTempoRef(getTempo());
    Spectrum.init($('spectrum'));
    Spectrum.start();
    renderGroupTabs('basic');
    bindEvents();
    bindShortcuts();
    renderTrackList();
    renderConfig();
    updateStatus();
    MultiTrack.init($('multiTrackView'), {
      stepsPerBar: STEPS_PER_BAR,
      onStep: () => { renderTrackList(); },
      onEnd: () => updateStatus(),
    });
    AutoCompose.init($('autoComposeHost'), {
      getTracks: () => tracks,
      getNumBars: () => numBars,
      getTempo: getTempo,
      setTempo: (v) => { $('tempo').value = v; updateTime(0); renderTrackList(); },
      exportProject: exportProject,
      refresh: () => { renderTrackList(); renderConfig(); if (MultiTrack.isActive()) MultiTrack.setTracks(tracks, numBars); },
      isDirty: isDirty,
      markSaved: markSaved,
      previewInPianoRoll: previewInPianoRoll,
    });
  }

  // ---------- 乐器库：两级导航 ----------
  // 顶层组按钮
  function renderGroupTabs(gid) {
    activeGroup = gid;
    const wrap = $('groupTabs');
    wrap.innerHTML = '';
    Instruments.groups().forEach(g => {
      const btn = document.createElement('button');
      btn.className = 'gtab' + (g.id === gid ? ' active' : '');
      btn.textContent = g.name;
      btn.dataset.gid = g.id;
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('.gtab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCatTabs(g.id);
      });
      wrap.appendChild(btn);
    });
    renderCatTabs(gid);
  }

  // 子分类 tab
  function renderCatTabs(gid) {
    const group = Instruments.groupById(gid);
    const wrap = $('catTabs');
    wrap.innerHTML = '';
    if (!group) return;
    // 沿用当前 activeCat 若属于该组，否则取第一个
    let first = group.cats[0].id;
    if (!group.cats.some(c => c.id === activeCat)) activeCat = first;
    group.cats.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (c.id === activeCat ? ' active' : '');
      btn.textContent = c.name;
      btn.dataset.cat = c.id;
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = c.id;
        renderLibrary(c.id, $('searchInstr').value);
      });
      wrap.appendChild(btn);
    });
    renderLibrary(activeCat, $('searchInstr').value);
  }

  function renderLibrary(cat, filter = '') {
    $('libraryBody').innerHTML = '';
    const list = Instruments.byCategory(cat).filter(i => !filter || i.name.includes(filter));
    list.forEach(instr => {
      const card = document.createElement('div');
      card.className = 'instr-card';
      // 名称：保留括号补充说明
      const nameHtml = instr.note
        ? `${instr.name}<span class="instr-note">（${instr.note}）</span>`
        : instr.name;
      // 编制状态徽章
      const statusHtml = instr.status
        ? `<span class="instr-status" title="${instr.status}">${instr.status}</span>`
        : '';
      // 附加说明
      const descHtml = instr.desc
        ? `<div class="instr-desc">${instr.desc}</div>`
        : '';
      card.innerHTML = `
        <div class="instr-icon ${iconClass(cat)}"></div>
        <div class="instr-info">
          <div class="instr-name">${nameHtml}${statusHtml}</div>
          <div class="instr-cat">${catName(cat)} · ${instr.pitched ? '有音高' : '无音高'}</div>
          ${descHtml}
        </div>
        <button class="instr-preview" title="试听" aria-label="试听 ${instr.name}">▶</button>
        <button class="instr-tutorial" title="教程" aria-label="${instr.name} 教程">?</button>
        <button class="instr-add" title="添加为声部" aria-label="添加 ${instr.name}">+</button>
      `;
      card.querySelector('.instr-preview').addEventListener('click', () => previewInstr(instr));
      card.querySelector('.instr-tutorial').addEventListener('click', () => showInstrTutorial(instr));
      card.querySelector('.instr-add').addEventListener('click', () => addTrack(instr));
      $('libraryBody').appendChild(card);
    });
    if (list.length === 0) $('libraryBody').innerHTML = '<div class="empty">无匹配乐器</div>';
  }

  // 按 category 映射图标颜色类（保留现有 4 色风格）
  function iconClass(cat) {
    if (cat.indexOf('strings') >= 0 || cat === 'chinese-bowed' || cat === 'chinese-plucked') return 'icon-strings';
    if (cat === 'winds' || cat.indexOf('woodwind') >= 0 || cat.indexOf('brass') >= 0 || cat === 'chinese-wind') return 'icon-winds';
    if (cat === 'percussion' || cat.indexOf('percussion') >= 0) return 'icon-percussion';
    if (cat === 'keyboard' || cat.indexOf('keyboard') >= 0) return 'icon-keyboard';
    return 'icon-percussion';
  }

  function catName(c) {
    const all = {};
    Instruments.groups().forEach(g => g.cats.forEach(cat => { all[cat.id] = cat.name; }));
    return all[c] || c;
  }

  function previewInstr(instr) {
    const ctx = SynthEngine.getCtx();
    SynthEngine.resume();
    const midi = instr.pitched ? (instr.range[0] + instr.range[1]) / 2 : instr.range[0];
    // 临时总线
    const bus = SynthEngine.createTrackBus(0.8, 0, 0.15, 0);
    if (!SynthEngine.getSample(instr.id)) {
      SynthEngine.playNote(instr.preset, midi, ctx.currentTime, 0.6, 0.8, bus.bus);
    } else {
      SynthEngine.playSample(instr.id, midi, ctx.currentTime, 0.6, 0.8, bus.bus);
    }
    Toast.info(`试听：${instr.name}`);
  }

  // ---------- 乐器教程 ----------
  let tutEl = null;
  
  async function loadInstrumentImage(tut, instrName) {
    if (!tut || !tut.image) return null;
    const svgImg = tut.image;
    
    if (!tut.wikiArticle) return svgImg;
    
    try {
      const apiUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(tut.wikiArticle)}`;
      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error('API request failed');
      const data = await response.json();
      
      if (data.thumbnail && data.thumbnail.source) {
        const imgUrl = data.thumbnail.source.replace('/thumb/', '/').replace(/\/[^/]+$/, '/800px-' + data.thumbnail.source.split('/').pop());
        return `<img src="${imgUrl}" alt="${instrName}" class="tut-img" onerror="this.outerHTML='${svgImg.replace(/'/g, "\\'")}'">`;
      }
    } catch (e) {
      console.log('Failed to load Wikipedia image:', e);
    }
    
    return svgImg;
  }

          <button class="tut-step-btn" data-step="pr">钢琴卷帘</button>
          <button class="tut-step-btn" data-step="exercise">练习</button>
          <button class="tut-step-btn" data-step="advanced">进阶</button>
          <button class="tut-step-btn" data-step="mistakes">常见问题</button>
        </div>
        
        <div class="tut-body">
          <div class="tut-panel" id="tutPanelIntro">
            <div class="tut-section">
              <div class="tut-section-title">乐器细节</div>
              ${imgHtml}
            </div>
            <div class="tut-section">
              <div class="tut-section-title">演奏方法与特点</div>
              <p class="tut-playing">${playingText}</p>
            </div>
          </div>
          
          <div class="tut-panel" id="tutPanelGoals" hidden>

          <div class="tut-panel" id="tutPanelAdvanced" hidden>

          <div class="tut-panel" id="tutPanelMistakes" hidden>

    if (tut && tut.wikiArticle) {
      const imgContainer = tutEl.querySelector('.tut-image');
      if (imgContainer) {

          .then(data => {

  function applyExercise(instrId) {
    const tut = window.InstrumentTutorials && InstrumentTutorials.get(instrId);
    if (!tut || !tut.basicExercise) return;
    const instr = Instruments.byId(instrId);
    if (!instr) return;
    
    closeInstrTutorial();
    addTrack(instr);
    
    const track = getSelectedTrack();
    if (track) {
      track.notes = tut.basicExercise.notes.map(n => ({ ...n }));
      if (PianoRoll) {
        PianoRoll.setTrack(track);
        PianoRoll.render();
      }
      renderTrackList();
      Toast.success(`已应用练习：${tut.basicExercise.name}`);
    }
  }
  
  function closeInstrTutorial() {
    if (tutEl && tutEl.parentNode) tutEl.parentNode.removeChild(tutEl);
    tutEl = null;
  }

  // ---------- 轨道 ----------
  function addTrack(instr) {
    const id = 't' + Date.now();
    const bus = SynthEngine.createTrackBus(0.8, 0, 0.2, 0.1);
    const t = {
      id, instr, preset: instr.preset, pitched: instr.pitched, range: instr.range,
      notes: [], volume: 0.8, pan: 0, transpose: 0, reverb: 0.2, delay: 0.1,
      mute: false, solo: false, color: COLORS[tracks.length % COLORS.length],
      _bus: bus,
    };
    tracks.push(t);
    selectedTrackId = id;
    dirty = true;  // 新增声部=未保存内容
    renderTrackList();
    renderConfig();
    try { PianoRoll.setTrack(t); }
    catch (e) { console.error('PianoRoll.setTrack failed:', e); Toast.error('轨道切换失败: ' + e.message); }
    updateStatus();
    if (MultiTrack.isActive()) MultiTrack.setTracks(tracks, numBars);
    Toast.success(`已添加 ${instr.name}`);
  }

  function getSelectedTrack() { return tracks.find(t => t.id === selectedTrackId); }

  // 钢琴卷帘未保存内容检测与预览加载（供智能编曲模块调用）
  function isDirty() { return dirty; }
  function markSaved() { dirty = false; }
  function previewInPianoRoll(trackIndex) {
    const t = tracks[trackIndex];
    if (!t) return false;
    selectedTrackId = t.id;
    try { PianoRoll.setTrack(t); PianoRoll.render(); }
    catch (e) { console.error('PianoRoll.setTrack failed:', e); return false; }
    renderTrackList(); renderConfig();
    return true;
  }

  let trackSortMode = 'time';

  function getSortedTracks() {
    const arr = tracks.map((t, i) => ({ t, i }));
    if (trackSortMode === 'name') arr.sort((a, b) => a.t.instr.name.localeCompare(b.t.instr.name, 'zh'));
    else if (trackSortMode === 'notes') arr.sort((a, b) => b.t.notes.length - a.t.notes.length);
    // time: 保持原顺序
    return arr;
  }

  function trackDuration(t) {
    if (!t.notes.length) return 0;
    const last = t.notes.reduce((m, n) => Math.max(m, n.step + n.dur), 0);
    const secPerStep = 60 / getTempo() / (STEPS_PER_BAR / 4);
    return last * secPerStep;
  }

  function renderTrackList() {
    const body = $('trackList');
    body.innerHTML = '';
    // 同步刷新智能编曲的声部选择列表
    if (window.AutoCompose) AutoCompose.refresh();
    // 汇总信息
    const totalNotes = tracks.reduce((s, t) => s + t.notes.length, 0);
    const maxDur = tracks.reduce((m, t) => Math.max(m, trackDuration(t)), 0);
    $('trackSummary').innerHTML = tracks.length
      ? `<span>共 ${tracks.length} 个声部</span><span>${totalNotes} 个音符</span><span>时长 ${fmt(maxDur)}</span>`
      : '';

    const sorted = getSortedTracks();
    sorted.forEach(({ t, i }) => {
      const el = document.createElement('div');
      el.className = 'track-item' + (t.id === selectedTrackId ? ' active' : '');
      const dur = trackDuration(t);
      el.innerHTML = `
        <span class="track-no">${i + 1}</span>
        <span class="track-color" style="background:${t.color}"></span>
        <div class="track-main">
          <div class="track-name">${t.instr.name}${t.note ? `<span class="track-note">（${t.note}）</span>` : ''}</div>
          <div class="track-meta">
            <span>${t.notes.length} 音符</span>
            <span>${fmt(dur)}</span>
            ${t.mute ? '<span class="tag-mute">M</span>' : ''}
            ${t.solo ? '<span class="tag-solo">S</span>' : ''}
            ${t.transpose ? `<span class="tag-tr">${t.transpose > 0 ? '+' : ''}${t.transpose}</span>` : ''}
          </div>
        </div>
        <button class="track-mute ${t.mute?'on':''}" data-act="mute" data-idx="${i}" title="静音">M</button>
        <button class="track-solo ${t.solo?'on':''}" data-act="solo" data-idx="${i}" title="独奏">S</button>
        <button class="track-del" data-act="del" data-idx="${i}" title="删除">×</button>
      `;
      // 按钮事件：阻止冒泡，避免触发外层轨道切换
      el.querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const act = btn.dataset.act;
          const idx = parseInt(btn.dataset.idx, 10);
          const tr = tracks[idx];
          if (!tr) return;
          if (act === 'mute') { tr.mute = !tr.mute; renderTrackList(); if (tr.id === selectedTrackId) renderConfig(); }
          else if (act === 'solo') { tr.solo = !tr.solo; renderTrackList(); if (tr.id === selectedTrackId) renderConfig(); }
          else if (act === 'del') {
            // 删除前若正在试听该声部，停止播放避免音频残留
            SynthEngine.stopPlayback();
            tracks.splice(idx, 1);
            if (selectedTrackId === tr.id) selectedTrackId = tracks[0] && tracks[0].id;
            renderTrackList(); renderConfig();
            const sel = getSelectedTrack();
            PianoRoll.setTrack(sel || { notes: [], preset: null, pitched: true, color: '#888' });
            updateStatus();
            Toast.info(sel ? `已切换至 ${sel.instr.name}` : '已无声部');
          }
        });
      });
      // 点击轨道项（非按钮）切换为当前编辑声部
      el.addEventListener('click', () => {
        if (t.id === selectedTrackId) return;
        selectedTrackId = t.id;
        renderTrackList(); renderConfig();
        PianoRoll.setTrack(t);
        Toast.info(`已切换至 ${t.instr.name}`);
      });
      body.appendChild(el);
    });
    if (tracks.length === 0) body.innerHTML = '<div class="empty">请从左侧添加乐器</div>';
  }

  // ---------- 配置面板 ----------
  function renderConfig() {
    const t = getSelectedTrack();
    const panel = $('configPanel');
    if (!t) { panel.innerHTML = '<div class="empty">未选中声部</div>'; return; }
    panel.innerHTML = `
      <div class="cfg-title">${t.instr.name}${t.mute ? ' <span class="cfg-st tag-mute">[静音]</span>' : ''}${t.solo ? ' <span class="cfg-st tag-solo">[独奏]</span>' : ''}</div>
      <div class="cfg-row"><label>音量</label><input type="range" id="cfgVol" min="0" max="1" step="0.01" value="${t.volume}"><span id="cfgVolV">${Math.round(t.volume*100)}</span></div>
      <div class="cfg-row"><label>声像</label><input type="range" id="cfgPan" min="-1" max="1" step="0.05" value="${t.pan}"><span id="cfgPanV">${t.pan.toFixed(2)}</span></div>
      <div class="cfg-row"><label>音调</label><input type="range" id="cfgTr" min="-24" max="24" step="1" value="${t.transpose}"><span id="cfgTrV">${t.transpose>0?'+':''}${t.transpose} 半音</span></div>
      <div class="cfg-row"><label>混响</label><input type="range" id="cfgRv" min="0" max="1" step="0.05" value="${t.reverb}"><span id="cfgRvV">${Math.round(t.reverb*100)}</span></div>
      <div class="cfg-row"><label>延迟</label><input type="range" id="cfgDl" min="0" max="1" step="0.05" value="${t.delay}"><span id="cfgDlV">${Math.round(t.delay*100)}</span></div>
      <div class="cfg-actions">
        <button class="actbtn" id="cfgClear">清空音符</button>
        <button class="actbtn" id="cfgPreview">试听声部</button>
      </div>
    `;
    $('cfgVol').oninput = (e) => { t.volume = +e.target.value; SynthEngine.setTrackVolume(t._bus, t.volume); $('cfgVolV').textContent = Math.round(t.volume*100); };
    $('cfgPan').oninput = (e) => { t.pan = +e.target.value; SynthEngine.setTrackPan(t._bus, t.pan); $('cfgPanV').textContent = t.pan.toFixed(2); };
    $('cfgTr').oninput = (e) => { t.transpose = +e.target.value; $('cfgTrV').textContent = (t.transpose>0?'+':'')+t.transpose+' 半音'; renderTrackList(); };
    $('cfgRv').oninput = (e) => { t.reverb = +e.target.value; SynthEngine.setTrackReverb(t._bus, t.reverb); $('cfgRvV').textContent = Math.round(t.reverb*100); };
    $('cfgDl').oninput = (e) => { t.delay = +e.target.value; SynthEngine.setTrackDelay(t._bus, t.delay); $('cfgDlV').textContent = Math.round(t.delay*100); };
    $('cfgClear').onclick = () => { if (confirm('清空该声部所有音符？')) { t.notes = []; renderScore(); Toast.info('已清空'); } };
    $('cfgPreview').onclick = () => previewTrack(t);
  }

  function previewTrack(t) {
    if (!t.notes.length) { Toast.warn('该声部没有音符'); return; }
    const btn = $('cfgPreview');
    if (btn) { btn.disabled = true; btn.textContent = '试听中…'; }
    SynthEngine.resume();
    SynthEngine.startPlayback([t], STEPS_PER_BAR, numBars, getTempo(), null, () => {
      if (btn) { btn.disabled = false; btn.textContent = '试听声部'; }
      Toast.info('试听结束');
    });
  }

  // ---------- 节奏模板 ----------
  function applyRhythm() {
    const t = getSelectedTrack();
    if (!t) { Toast.warn('请先选中声部'); return; }
    const rid = $('rhythmSel').value;
    const tpl = Rhythms.byId(rid);
    if (!tpl) return;
    // 找到或创建对应的打击乐轨道，写入节奏
    // 简化：把模板中各打击乐写入对应轨道（若无则创建）
    Object.keys(tpl.pattern).forEach(instrId => {
      let target = tracks.find(tr => tr.instr.id === instrId);
      if (!target) {
        const instr = Instruments.byId(instrId);
        if (!instr) return;
        addTrack(instr);
        target = getSelectedTrack();
      }
      target.notes = tpl.pattern[instrId].map(step => ({ step, midi: target.instr.range ? target.instr.range[0] : 60, dur: 1, vel: 0.9 }));
    });
    renderScore();
    Toast.success(`已应用节奏：${tpl.name}`);
  }

  // ---------- 多音轨预览模式 ----------
  function toggleMultiTrack() {
    if (MultiTrack.isActive()) {
      MultiTrack.hide();
      $('btnMultiTrack').classList.remove('active');
      Toast.info('已退出多音轨预览');
    } else {
      MultiTrack.setTracks(tracks, numBars);
      MultiTrack.show();
      $('btnMultiTrack').classList.add('active');
      Toast.info('多音轨预览模式：可查看/编辑所有声部');
    }
  }

  // ---------- 传输 ----------
  function getTempo() { return parseInt($('tempo').value, 10) || 100; }

  function buildPlayTracks() {
    return tracks.map(t => ({ preset: t.preset, notes: t.notes, pitched: t.pitched, transpose: t.transpose, _bus: t._bus, mute: t.mute, solo: t.solo }));
  }

  // 统一的播放启动：支持从指定步开始（seek/loop 用）
  function startPlaybackFrom(startStep) {
    const lp = PianoRoll.getLoop();
    const onStep = (step) => {
      PianoRoll.setPlayhead(step);
      updateTime(step);
      // 循环：到达 loop.end 时从 loop.start 重新播放
      // 使用 setTimeout(0) 延迟重启，避免在 onStep 回调内同步重启
      // 导致旧调度器残留 timer 与新调度器冲突
      if (lp && step >= lp.end) {
        SynthEngine.stopPlayback();
        setTimeout(() => {
          if (isPlaying) {
            SynthEngine.startPlayback(buildPlayTracks(), STEPS_PER_BAR, numBars, getTempo(), onStep, () => stop(), { startStep: lp.start });
          }
        }, 0);
      }
    };
    SynthEngine.startPlayback(buildPlayTracks(), STEPS_PER_BAR, numBars, getTempo(), onStep, () => stop(), { startStep });
  }

  function play() {
    if (tracks.length === 0) { Toast.warn('请先添加乐器声部'); return; }
    if (isPlaying) return;
    SynthEngine.resume();
    isPlaying = true;
    $('btnPlay').classList.add('playing');
    PianoRoll.showPlayhead();
    const lp = PianoRoll.getLoop();
    startPlaybackFrom(lp ? lp.start : 0);
    Toast.info('开始播放');
  }
  function pause() {
    SynthEngine.stopPlayback();
    isPlaying = false;
    $('btnPlay').classList.remove('playing');
    Toast.info('已暂停');
  }
  function togglePlay() { isPlaying ? pause() : play(); }
  function stop() {
    SynthEngine.stopPlayback();
    isPlaying = false;
    $('btnPlay').classList.remove('playing');
    PianoRoll.hidePlayhead();
    PianoRoll.setPlayhead(0);
    updateTime(0);
    if (isRecording) stopRecord();
  }

  // ---------- 时间线交互回调 ----------
  // 拖拽时间线定位：播放中则从该步重启，否则仅移动播放头
  function onTimelineSeek(step) {
    if (isPlaying) {
      SynthEngine.stopPlayback();
      startPlaybackFrom(step);
    } else {
      PianoRoll.showPlayhead();
      PianoRoll.setPlayhead(step);
      updateTime(step);
    }
  }
  // 循环区间变化：更新按钮高亮
  function onLoopChanged(lp) {
    const btn = $('tlLoop');
    if (btn) btn.classList.toggle('active', !!lp);
  }

  // ---------- 录制 ----------
  function startRecord() {
    const t = getSelectedTrack();
    if (!t) { Toast.warn('请先选中要录制的声部'); return; }
    if (!t.pitched) { Toast.warn('打击乐请用钢琴卷帘点击录入'); return; }
    SynthEngine.resume();
    isRecording = true;
    $('btnRecord').classList.add('recording');
    Recorder.setBpm(getTempo());
    Recorder.setStepsPerBar(STEPS_PER_BAR);
    Recorder.setMetronome($('metroOn').checked);
    Recorder.start(
      (midi) => { SynthEngine.playNote(t.preset, midi + t.transpose, SynthEngine.getCtx().currentTime, 0.4, 0.8, t._bus.bus); },
      () => {}
    );
    Toast.info('录制中…按键盘弹奏，再次点击停止');
    if (!isPlaying) play(); // 录制时同步播放
  }
  function stopRecord() {
    if (!isRecording) return;
    isRecording = false;
    $('btnRecord').classList.remove('recording');
    const events = Recorder.stop();
    const t = getSelectedTrack();
    if (!t) return;
    const secPerStep = 60 / getTempo() / (STEPS_PER_BAR / 4);
    const totalSteps = STEPS_PER_BAR * numBars;
    const notes = Recorder.quantize(events, secPerStep, totalSteps, 1);
    if (notes.length) {
      t.notes = t.notes.concat(notes);
      renderScore();
      Toast.success(`已录入 ${notes.length} 个音符`);
    } else {
      Toast.info('未录入音符');
    }
  }
  function toggleRecord() { isRecording ? stopRecord() : startRecord(); }

  // ---------- 录制键盘输入 ----------
  function bindKeyboardRecord() {
    document.addEventListener('keydown', (e) => {
      if (!isRecording) return;
      if (e.repeat) return;
      // 输入框中不录
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      const midi = Recorder.keyToMidi(e.key);
      if (midi != null) { e.preventDefault(); Recorder.noteOn(midi, 0.8); }
      // 八度切换
      if (e.key === 'z' && e.shiftKey) Recorder.setOctave(Math.max(0, --recOctave));
      if (e.key === 'x' && e.shiftKey) Recorder.setOctave(Math.min(8, ++recOctave));
    });
    document.addEventListener('keyup', (e) => {
      if (!isRecording) return;
      const midi = Recorder.keyToMidi(e.key);
      if (midi != null) Recorder.noteOff(midi);
    });
  }
  let recOctave = 4;

  // ---------- 渲染 ----------
  function renderScore() {
    const t = getSelectedTrack();
    if (t) PianoRoll.render();
    updateStatus();
    dirty = true;  // 钢琴卷帘内容已变更
  }

  function updateTime(step) {
    const sec = step * (60 / getTempo() / (STEPS_PER_BAR / 4));
    const total = numBars * STEPS_PER_BAR * (60 / getTempo() / (STEPS_PER_BAR / 4));
    $('timeDisplay').textContent = fmt(sec) + ' / ' + fmt(total);
  }
  function fmt(s) { const m = Math.floor(s/60); return String(m).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0'); }

  function updateStatus() {
    $('trackCount').textContent = `声部: ${tracks.length}`;
    $('selCount').textContent = '';
  }
  function updateSel(n) { $('selCount').textContent = n ? `选中: ${n}` : ''; }

  // ---------- 导入导出 ----------
  function exportProject() {
    if (tracks.length === 0) { Toast.warn('没有可导出的内容'); return; }
    const data = {
      version: 1, bars: numBars, tempo: getTempo(),
      tracks: tracks.map(t => ({ instrId: t.instr.id, notes: t.notes, volume: t.volume, pan: t.pan, transpose: t.transpose, reverb: t.reverb, delay: t.delay, mute: t.mute, solo: t.solo })),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `composition_${Date.now()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    dirty = false;  // 工程已保存
    Toast.success('已导出工程文件');
  }
  function importProject(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        numBars = data.bars || 4;
        $('barsInput').value = numBars;
        tracks.length = 0;
        data.tracks.forEach(td => {
          const instr = Instruments.byId(td.instrId);
          if (!instr) return;
          const bus = SynthEngine.createTrackBus(td.volume, td.pan, td.reverb, td.delay);
          tracks.push({
            id: 't' + Date.now() + Math.random(), instr, preset: instr.preset, pitched: instr.pitched, range: instr.range,
            notes: td.notes || [], volume: td.volume || 0.8, pan: td.pan || 0, transpose: td.transpose || 0,
            reverb: td.reverb || 0, delay: td.delay || 0, mute: !!td.mute, solo: !!td.solo,
            color: COLORS[tracks.length % COLORS.length], _bus: bus,
          });
        });
        selectedTrackId = tracks[0] && tracks[0].id;
        renderTrackList(); renderConfig();
        if (getSelectedTrack()) PianoRoll.setTrack(getSelectedTrack());
        updateStatus();
        dirty = true;  // 导入的工程视为未保存
        Toast.success(`已导入 ${tracks.length} 个声部`);
      } catch (err) { Toast.error('导入失败：' + err.message); }
    };
    reader.readAsText(file);
  }

  // ---------- 快捷键 ----------
  function bindShortcuts() {
    document.addEventListener('keydown', (e) => {
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === ' ' || e.code === 'Space') { if (e.target.tagName !== 'BUTTON') { e.preventDefault(); togglePlay(); } }
      else if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); /* undo 留空 */ }
      else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        const cnt = PianoRoll.getSelectedCount();
        if (cnt > 0) { PianoRoll.deleteSelected(); renderScore(); Toast.info(`已删除 ${cnt} 个音符`); }
      }
      else if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) { e.preventDefault(); PianoRoll.selectAll(); }
    });
  }

  // ---------- 事件 ----------
  function bindEvents() {
    $('searchInstr').addEventListener('input', (e) => {
      renderLibrary(activeCat, e.target.value);
    });
    $('btnPlay').addEventListener('click', togglePlay);
    $('btnStop').addEventListener('click', stop);
    $('btnMultiTrack').addEventListener('click', toggleMultiTrack);
    $('btnRecord').addEventListener('click', toggleRecord);
    $('btnExport').addEventListener('click', exportProject);
    $('btnImport').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', (e) => { if (e.target.files[0]) importProject(e.target.files[0]); e.target.value = ''; });
    // 点击"音韵"标题 → 打开名曲参考数据库画廊
    const logo = document.querySelector('.logo');
    if (logo && window.ReferenceWorks && ReferenceWorks.showGallery) {
      logo.style.cursor = 'pointer';
      logo.title = '点击查看名曲参考数据库';
      logo.addEventListener('click', () => ReferenceWorks.showGallery());
    }
    $('btnApplyRhythm').addEventListener('click', applyRhythm);
    $('barsInput').addEventListener('change', (e) => { numBars = Math.max(1, parseInt(e.target.value, 10) || 4); PianoRoll.setBars(numBars); if (MultiTrack.isActive()) MultiTrack.setBars(numBars); });
    $('tempo').addEventListener('input', () => { updateTime(0); renderTrackList(); PianoRoll.setTempoRef(getTempo()); });
    $('trackSortSel').addEventListener('change', (e) => { trackSortMode = e.target.value; renderTrackList(); });
    bindKeyboardRecord();
    bindTimelineControls();
    bindMobileMenu();
  }

  // ---------- 移动端菜单 ----------
  function bindMobileMenu() {
    const btnMenu = $('btnMenu');
    if (!btnMenu) return;
    
    let overlay = null, panel = null;
    
    function createMenu() {
      if (overlay) return;
      overlay = document.createElement('div');
      overlay.className = 'mob-menu-overlay';
      panel = document.createElement('div');
      panel.className = 'mob-menu-panel';
      
      const trackCount = tracks.length;
      const favCount = window.ReferenceWorks ? (ReferenceWorks.getFavorites ? ReferenceWorks.getFavorites().length : 0) : 0;
      
      panel.innerHTML = `
        <div class="mob-menu-header">
          <span class="mob-menu-title">音韵</span>
          <button class="mob-menu-close" id="mobMenuClose">×</button>
        </div>
        <div class="mob-menu-body">
          <div class="mob-menu-section">
            <div class="mob-menu-section-title">快速功能</div>
            <div class="mob-menu-item" data-action="library">
              <div class="mob-menu-item-icon" style="background:linear-gradient(135deg,#3498db,#2980b9)"></div>
              <span class="mob-menu-item-text">乐器库</span>
            </div>
            <div class="mob-menu-item" data-action="tracks">
              <div class="mob-menu-item-icon" style="background:linear-gradient(135deg,#2ecc71,#27ae60)"></div>
              <span class="mob-menu-item-text">声部列表</span>
              <span class="mob-menu-item-badge">${trackCount}</span>
            </div>
            <div class="mob-menu-item" data-action="autoCompose">
              <div class="mob-menu-item-icon" style="background:linear-gradient(135deg,#9b59b6,#8e44ad)"></div>
              <span class="mob-menu-item-text">智能编曲</span>
            </div>
          </div>
          <div class="mob-menu-section">
            <div class="mob-menu-section-title">音乐资源</div>
            <div class="mob-menu-item" data-action="gallery">
              <div class="mob-menu-item-icon" style="background:linear-gradient(135deg,#e74c3c,#c0392b)"></div>
              <span class="mob-menu-item-text">名曲参考</span>
              <span class="mob-menu-item-badge">100</span>
            </div>
            <div class="mob-menu-item" data-action="favorites">
              <div class="mob-menu-item-icon" style="background:linear-gradient(135deg,#f39c12,#d35400)"></div>
              <span class="mob-menu-item-text">我的收藏</span>
              <span class="mob-menu-item-badge">${favCount}</span>
            </div>
          </div>
        </div>
      `;
      
      overlay.appendChild(panel);
      document.body.appendChild(overlay);
      
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeMenu(); });
      panel.querySelector('#mobMenuClose').addEventListener('click', closeMenu);
      
      panel.querySelectorAll('.mob-menu-item').forEach(item => {
        item.addEventListener('click', () => {
          const action = item.dataset.action;
          handleMenuAction(action);
          closeMenu();
        });
      });
    }
    
    function handleMenuAction(action) {
      switch (action) {
        case 'library':
          $('libraryBody')?.scrollIntoView({ behavior: 'smooth' });
          break;
        case 'tracks':
          $('trackList')?.scrollIntoView({ behavior: 'smooth' });
          break;
        case 'autoCompose':
          if (window.AutoCompose) {
            const toggle = document.querySelector('#acToggle');
            if (toggle) toggle.click();
          }
          break;
        case 'gallery':
          if (window.ReferenceWorks && ReferenceWorks.showGallery) {
            ReferenceWorks.showGallery();
          }
          break;
        case 'favorites':
          if (window.ReferenceWorks && ReferenceWorks.showGallery) {
            ReferenceWorks.showGallery('favorites');
          }
          break;
      }
    }
    
    function openMenu() {
      createMenu();
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    
    function closeMenu() {
      if (overlay) {
        overlay.classList.remove('show');
        document.body.style.overflow = '';
      }
    }
    
    btnMenu.addEventListener('click', openMenu);
    
    // ESC 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay && overlay.classList.contains('show')) {
        closeMenu();
      }
    });
  }

  // ---------- 时间线控件绑定 ----------
  function updateZoomLabel() {
    const el = $('tlZoomVal');
    if (el) el.textContent = Math.round(PianoRoll.getZoom() * 100) + '%';
  }
  function bindTimelineControls() {
    // 时间单位切换
    $('tlUnit').addEventListener('change', (e) => PianoRoll.setTimeUnit(e.target.value));
    // 缩放按钮
    $('tlZoomIn').addEventListener('click', () => { PianoRoll.setZoom(PianoRoll.getZoom() + 0.25); updateZoomLabel(); });
    $('tlZoomOut').addEventListener('click', () => { PianoRoll.setZoom(PianoRoll.getZoom() - 0.25); updateZoomLabel(); });
    $('tlZoomReset').addEventListener('click', () => { PianoRoll.setZoom(1); updateZoomLabel(); });
    // 循环开关
    $('tlLoop').addEventListener('click', () => {
      PianoRoll.toggleLoop();
      onLoopChanged(PianoRoll.getLoop());
    });
    // PianoRoll 内部 Ctrl+滚轮缩放 → 同步标签
    PianoRoll.onZoom(() => updateZoomLabel());
    updateZoomLabel();
  }

  return { init };
})();

window.addEventListener('DOMContentLoaded', () => App.init());

// ---------- 移动端音频上下文恢复 ----------
function ensureAudioContext() {
  if (window.SynthEngine && SynthEngine.resume) {
    SynthEngine.resume();
  }
  if (window.Recorder && Recorder.init) {
    const ctx = window.SynthEngine && SynthEngine.getCtx ? SynthEngine.getCtx() : null;
    if (ctx) Recorder.init(ctx);
  }
}

document.addEventListener('touchstart', ensureAudioContext, { once: true });
document.addEventListener('click', ensureAudioContext, { once: true });

</script>
</body>
</html>
