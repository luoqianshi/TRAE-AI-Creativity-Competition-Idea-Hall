  // ---------- MIR 特征提取与聚合 ----------
  // 取对象中出现次数最多的 key
  function mostFrequent(countMap) {
    const entries = Object.entries(countMap);
    if (!entries.length) return null;
    entries.sort((a, b) => b[1] - a[1]);
    return entries[0][0];
  }

  function getFeaturesByStyle(styleKey) {
    const works = WORKS.filter(w => w.genre === styleKey);
    if (works.length === 0) return null;
    // 和声进行频率分析
    const progCount = {};
    works.forEach(w => {
      const key = JSON.stringify(w.progression);
      progCount[key] = (progCount[key] || 0) + 1;
    });
    const topProg = JSON.parse(Object.keys(progCount)
      .sort((a, b) => progCount[b] - progCount[a])[0]);
    // 旋律轮廓：按位置统计出现次数最多的轮廓符号
    const maxLen = works.reduce((m, w) => Math.max(m, (w.melodyContour || []).length), 0);
    const contourAgg = [];
    for (let i = 0; i < maxLen; i++) {
      const cnt = {};
      works.forEach(w => {
        const c = (w.melodyContour || [])[i];
        if (c) cnt[c] = (cnt[c] || 0) + 1;
      });
      contourAgg.push(mostFrequent(cnt) || 's');
    }
    // 节奏密度平均
    const rhythmDensityAvg = works.reduce((s, w) => s + w.rhythmDensity, 0) / works.length;
    // 速度平均
    const tempoAvg = Math.round(works.reduce((s, w) => s + w.tempo, 0) / works.length);
    // 动态范围平均
    const dynamicAvg = works.reduce((s, w) => s + w.dynamicRange, 0) / works.length;
    // 调式频率（取最常见）
    const scaleCount = {};
    works.forEach(w => { if (w.scale) scaleCount[w.scale] = (scaleCount[w.scale] || 0) + 1; });
    const topScale = mostFrequent(scaleCount) || 'major';
    // 乐器编配比例：按角色统计出现次数最多的乐器
    const instrRoles = { melody: {}, harmony: {}, bass: {}, percussion: {} };
    works.forEach(w => {
      Object.keys(instrRoles).forEach(role => {
        const v = w.instruments && w.instruments[role];
        if (v) instrRoles[role][v] = (instrRoles[role][v] || 0) + 1;
      });
    });
    const topInstr = {};
    Object.keys(instrRoles).forEach(role => {
      topInstr[role] = mostFrequent(instrRoles[role]);
    });
    // 重音模式频率
    const accentCount = {};
    works.forEach(w => {
      const key = w.accentPattern.join(',');
      accentCount[key] = (accentCount[key] || 0) + 1;
    });
    const topAccent = mostFrequent(accentCount).split(',').map(Number);
    // 曲式结构（取最长者为典型）
    const structureSample = works
      .map(w => w.structure || [])
      .sort((a, b) => b.length - a.length)[0] || [];
    return {
      genre: styleKey,
      label: GENRES[styleKey] ? GENRES[styleKey].label : styleKey,
      progression: topProg,
      melodyContour: contourAgg,
      rhythmDensity: rhythmDensityAvg,
      tempo: tempoAvg,
      dynamicRange: dynamicAvg,
      scale: topScale,
      instruments: topInstr,
      accentPattern: topAccent,
      structure: structureSample,
      sampleCount: works.length,
    };
  }

  // ---------- 风格分类（基于关键词） ----------
  function classifyGenre(text) {
    if (!text) return 'pop';
    const lower = String(text).toLowerCase();
    const map = {
      classical: ['古典', '莫扎特', '贝多芬', '巴赫', '肖邦', 'classical', '钢琴曲'],
      jazz: ['爵士', 'jazz', 'swing', '布鲁斯', '即兴'],
      chinese: ['中国风', '古风', '国风', '民族', 'chinese', '宫商', '二胡', '古筝'],
      folk: ['民谣', 'folk', '乡村', '吉他', '叙事'],
      pop: ['流行', 'pop', '现代', '抒情'],
    };
    for (const g in map) {
      if (map[g].some(kw => lower.includes(kw.toLowerCase()))) return g;
    }
    return 'pop';
  }

  // ---------- 标准化作品添加接口 ----------
  const SUPPORTED_FORMATS = ['mid', 'midi', 'json', 'xml', 'musicxml'];
  const userWorks = [];

  function validateWork(work) {
    if (!work || typeof work !== 'object') return { ok: false, msg: '作品数据为空' };
    if (!work.title || !work.title.trim()) return { ok: false, msg: '缺少标题' };
    if (!work.composer || !work.composer.trim()) return { ok: false, msg: '缺少作曲者' };
    if (work.tempo && (work.tempo < 30 || work.tempo > 300)) return { ok: false, msg: '速度范围应为 30-300' };
    if (work.progression && !Array.isArray(work.progression)) return { ok: false, msg: '和弦进行格式错误' };
    if (work.genre && !GENRES[work.genre]) return { ok: false, msg: '未知风格：' + work.genre };
    return { ok: true };
  }

  function extractMetadata(file) {
    const name = file.name || '';
    const ext = name.split('.').pop().toLowerCase();
    const meta = { _file: name, _format: ext, _size: file.size };
    const base = name.replace(/\.[^.]+$/, '');
    meta.title = base;
    meta.genre = classifyGenre(base);
    return meta;
  }

  function validateFile(file) {
    if (!file) return { ok: false, msg: '未选择文件' };
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (!SUPPORTED_FORMATS.includes(ext)) {
      return { ok: false, msg: '不支持的格式 .' + ext + '，仅支持 ' + SUPPORTED_FORMATS.join(', ') };
    }
    if (file.size > 10 * 1024 * 1024) return { ok: false, msg: '文件超过 10MB' };
    return { ok: true, ext };
  }

  function addWork(work) {
    const v = validateWork(work);
    if (!v.ok) return { ok: false, msg: v.msg };
    if (!work.id) work.id = 'usr' + Date.now();
    if (!work.genre) work.genre = classifyGenre(work.title);
    if (!work.progression) work.progression = [[0,''],[4,''],[5,'m'],[3,'']];
    if (!work.melodyContour) work.melodyContour = ['s','U','s','D','R','U','s'];
    if (!work.rhythmDensity) work.rhythmDensity = 0.5;
    if (!work.accentPattern) work.accentPattern = [0,4,8,12];
    if (!work.instruments) work.instruments = { melody:'strings', harmony:'keyboard', bass:'strings', percussion:'percussion' };
    if (!work.dynamicRange) work.dynamicRange = 0.6;
    if (!work.structure) work.structure = ['主歌','副歌'];
    userWorks.push(work);
    return { ok: true, id: work.id };
  }

  function addWorkFromFile(file, overrides) {
    const fv = validateFile(file);
    if (!fv.ok) return fv;
    const meta = extractMetadata(file);
    const work = Object.assign({ title: meta.title, genre: meta.genre }, overrides || {});
    return addWork(work);
  }

  // ============================================================
  // 用户交互：收藏 / 播放历史 / 相关推荐（localStorage 持久化）
  // ============================================================
  const LS_FAV_KEY = 'rw_favorites';
  const LS_HIST_KEY = 'rw_history';
  const HISTORY_MAX = 20;

  function lsGet(key) {
    try { return JSON.parse(localStorage.getItem(key) || '[]'); }
    catch (e) { return []; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  function getFavorites() { return lsGet(LS_FAV_KEY); }
  function isFavorite(id) { return getFavorites().includes(id); }
  function toggleFavorite(id) {
    const favs = getFavorites();
    const i = favs.indexOf(id);
    if (i >= 0) { favs.splice(i, 1); lsSet(LS_FAV_KEY, favs); return false; }
    favs.push(id); lsSet(LS_FAV_KEY, favs); return true;
  }

  function getHistory() { return lsGet(LS_HIST_KEY); }
  function recordHistory(id) {
    if (!id) return;
    const hist = getHistory().filter(x => x.id !== id);
    hist.unshift({ id, time: Date.now() });
    if (hist.length > HISTORY_MAX) hist.length = HISTORY_MAX;
    lsSet(LS_HIST_KEY, hist);
  }
  function clearHistory() { lsSet(LS_HIST_KEY, []); }

  // 相关推荐：按流派/调式/速度相似度排序，排除自身与已播放
  function getRecommendations(workId, limit) {
    limit = limit || 4;
    const work = getAllWorks().find(w => w.id === workId);
    if (!work) return [];
    const all = getAllWorks().filter(w => w.id !== workId);
    const scored = all.map(w => {
      let score = 0;
      if (w.genre === work.genre) score += 0.4;
      if (w.scale === work.scale) score += 0.25;
      score += (1 - Math.min(1, Math.abs(w.tempo - work.tempo) / 60)) * 0.2;
      score += (1 - Math.min(1, Math.abs((w.rhythmDensity||0) - (work.rhythmDensity||0)) / 0.5)) * 0.15;
      // 和声进行重合度
      const pa = work.progression || [], pb = w.progression || [];
      const len = Math.min(pa.length, pb.length);
      if (len) {
        let m = 0; for (let i = 0; i < len; i++) if (pa[i][0] === pb[i][0]) m++;
        score += (m / len) * 0.2;
      }
      return { w, score };
    }).sort((a, b) => b.score - a.score);
    return scored.slice(0, limit).map(s => s.w);
  }

  function getAllWorks() { return WORKS.concat(userWorks); }
  function getUserWorks() { return userWorks; }
  function getGenres() { return GENRES; }

  // 绑定画廊交互
  function bindGallery() {
    galleryEl.querySelector('#rwClose').addEventListener('click', closeGallery);
    galleryEl.addEventListener('click', (e) => { if (e.target === galleryEl) closeGallery(); });
    galleryEl.querySelectorAll('.rw-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const dim = btn.dataset.dim;
        const val = btn.dataset.val;
        filterState[dim] = val;
        galleryEl.querySelectorAll(`.rw-filter-btn[data-dim="${dim}"]`).forEach(b => b.classList.toggle('active', b === btn));
        renderGallery();
      });
    });
    const fileInput = galleryEl.querySelector('#rwFile');
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const r = addWorkFromFile(file);
      if (r.ok) {
        window.Toast && Toast.success ? Toast.success('作品已添加：' + (file.name)) : null;
        renderGallery();
      } else {
        window.Toast && Toast.error ? Toast.error(r.msg || '添加失败') : alert(r.msg);
      }
      fileInput.value = '';
    });
    // Esc 关闭
    const onKey = (e) => {
      if (e.key === 'Escape' && galleryEl && galleryEl.parentNode) {
        closeGallery();
        document.removeEventListener('keydown', onKey);
      }
    };
    document.addEventListener('keydown', onKey);
  }

  function closeGallery() {
    if (galleryEl && galleryEl.parentNode) {
      // 关闭时停止播放
      if (player.isPlaying || player.isPaused) stopPlayback();
      galleryEl.parentNode.removeChild(galleryEl);
      galleryEl = null;
    }
  }

  // 渲染画廊
  function renderGallery() {
    if (!galleryEl) return;
    const all = getAllWorks();
    // 多维度筛选
    const list = all.filter(w => {
      if (filterState.genre !== 'all' && w.genre !== filterState.genre) return false;
      if (filterState.region !== 'all' && inferRegion(w) !== filterState.region) return false;
      if (filterState.era !== 'all' && inferEra(w.year) !== filterState.era) return false;
      return true;
    });
    galleryEl.querySelector('#rwCount').textContent = all.length;
    // 风格统计
    const stats = galleryEl.querySelector('#rwStats');
    stats.innerHTML = Object.entries(GENRES).map(([key, g]) => {
      const n = all.filter(w => w.genre === key).length;
      return `<span class="rw-stat" style="--color:${g.color}"><i></i>${g.label} <b>${n}</b></span>`;

    body.querySelectorAll('.rw-card').forEach(card => {

    body.querySelectorAll('[data-play]').forEach(btn => {
      btn.addEventListener('click', (e) => {

    body.querySelectorAll('[data-fav]').forEach(btn => {

      });

  // 展示作品详情（完整 MIR 特征 + 试听 + 收藏 + 推荐）

    if (!w) return;
    const detail = galleryEl.querySelector('#rwDetail');
    const g = GENRES[w.genre] || { label: w.genre, color: '#888' };
    const region = REGIONS[inferRegion(w)] || { label: '—', color: '#888' };
    const eraKey = inferEra(w.year);
    const era = ERAS.find(e => e.key === eraKey) || { label: '—', color: '#888' };
    const progStr = (w.progression || []).map(p => {
      const roman = ['I','II','III','IV','V','VI','VII'][p[0]] || '?';
      return roman + (p[1] || '');
    }).join(' → ');
    const contourStr = (w.melodyContour || []).map(c => ({
      U:'↑', D:'↓', s:'·', S:'↷', R:'—'

    const instrStr = w.instruments ? Object.entries(w.instruments)
      .filter(([_, v]) => v)
      .map(([k, v]) => `${roleLabel(k)}:${v}`).join('，') : '—';
    const phonologyNote = buildPhonologyNote(w);
    const fav = isFavorite(w.id);
    // 相关推荐
    const recs = getRecommendations(w.id, 4);
    const recHtml = recs.length ? recs.map(rw => {
      const rg = GENRES[rw.genre] || { color: '#888', label: rw.genre };
      return `<div class="rw-rec-card" data-id="${rw.id}" style="--color:${rg.color}">
        <span class="rw-rec-tag">${rg.label}</span>
        <span class="rw-rec-title">${escapeHtml(rw.title)}</span>
        <span class="rw-rec-composer">${escapeHtml(rw.composer)}</span>
      </div>`;
    }).join('') : '<div class="rw-empty">暂无相关推荐</div>';

    detail.innerHTML = `
      <button class="rw-back" id="rwBack">← 返回列表</button>
      <div class="rw-detail-head" style="--color:${g.color}">
        <span class="rw-detail-tag">${g.label}</span>
        <span class="rw-detail-tag" style="--color:${region.color}">${region.label}</span>
        <span class="rw-detail-tag" style="--color:${era.color}">${era.label}</span>
        <h3>${escapeHtml(w.title)}</h3>
        <p>${escapeHtml(w.composer)} · ${escapeHtml(String(w.year))}</p>
      </div>
      <div class="rw-detail-actions">
        <button class="rw-detail-play" id="rwDetailPlay">▶ 试听代表乐句</button>
        <button class="rw-detail-fav ${fav ? 'on' : ''}" id="rwDetailFav">${fav ? '★ 已收藏' : '☆ 收藏'}</button>
      </div>
      <div class="rw-detail-phonology">
        <h4>音韵学分析</h4>
        <p>${escapeHtml(phonologyNote)}</p>
      </div>
      <div class="rw-detail-grid">
        <div class="rw-detail-item"><span>速度</span><b>${w.tempo} BPM</b></div>

        <div class="rw-detail-item"><span>节奏密度</span><b>${(w.rhythmDensity||0).toFixed(2)}</b></div>

    detail.querySelectorAll('.rw-rec-card').forEach(c => {
      c.addEventListener('click', () => showDetail(c.dataset.id));

  }

  function closeDetail() {
    if (!galleryEl) return;
    galleryEl.querySelector('#rwDetail').hidden = true;
    galleryEl.querySelector('#rwBody').style.display = '';
    galleryEl.querySelector('#rwStats').style.display = '';
    galleryEl.querySelector('.rw-toolbar').style.display = '';
  }

  // ---------- 播放器 UI 绑定 ----------
  let loopEnabled = false;

  function bindPlayer() {
    const playBtn = galleryEl.querySelector('#rwPlay');
    const stopBtn = galleryEl.querySelector('#rwStop');
    const progress = galleryEl.querySelector('#rwProgress');
    const volume = galleryEl.querySelector('#rwVolume');
    const loopBtn = galleryEl.querySelector('#rwLoop');
    playBtn.addEventListener('click', () => {
      if (!player.work) return;
      if (player.isPlaying) pausePlayback();
      else if (player.isPaused) resumePlayback();
      else startPlayerUI(player.work);
    });
    stopBtn.addEventListener('click', () => stopPlayback());
    loopBtn.addEventListener('click', () => {
      loopEnabled = !loopEnabled;
      loopBtn.classList.toggle('on', loopEnabled);
    });
    // 进度条点击/拖拽
    let seeking = false;
    const seekTo = (e) => {
      const rect = progress.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      seekPlayback(ratio);
    };
    progress.addEventListener('mousedown', (e) => { seeking = true; seekTo(e); });
    document.addEventListener('mousemove', (e) => { if (seeking) seekTo(e); });
    document.addEventListener('mouseup', () => { seeking = false; });
    // 音量
    volume.addEventListener('input', () => setVolume(parseFloat(volume.value)));
    // 注册进度回调
    player.onTick = (elapsed, duration) => updatePlayerUI(elapsed, duration);
    player.onEnd = () => {
      updatePlayerUI(player.duration, player.duration);
      const playBtn2 = galleryEl.querySelector('#rwPlay');
      if (playBtn2) playBtn2.textContent = '▶';
      if (loopEnabled && player.work) {
        // 循环播放
        setTimeout(() => startPlayerUI(player.work), 200);
      }
    };
  }

  function startPlayerUI(work) {
    // 记录播放历史
    recordHistory(work.id);
    // 显示播放器
    const playerBar = galleryEl.querySelector('#rwPlayer');
    if (playerBar) playerBar.hidden = false;
    const ok = playWork(work);
    if (!ok) return;
    // 更新标题
    const titleEl = galleryEl.querySelector('#rwPTitle');
    if (titleEl) titleEl.textContent = work.title + ' · ' + work.composer;
    // 更新播放按钮图标
    const playBtn = galleryEl.querySelector('#rwPlay');
    if (playBtn) playBtn.textContent = '⏸';
    updatePlayerUI(0, player.duration);
  }

  function formatTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updatePlayerUI(elapsed, duration) {
    if (!galleryEl) return;
    const timeEl = galleryEl.querySelector('#rwPTime');
    const fillEl = galleryEl.querySelector('#rwProgressFill');
    const handleEl = galleryEl.querySelector('#rwProgressHandle');
    const playBtn = galleryEl.querySelector('#rwPlay');
    if (timeEl) timeEl.textContent = formatTime(elapsed) + ' / ' + formatTime(duration);
    const ratio = duration > 0 ? Math.min(1, elapsed / duration) : 0;
    if (fillEl) fillEl.style.width = (ratio * 100) + '%';
    if (handleEl) handleEl.style.left = (ratio * 100) + '%';
    if (playBtn) playBtn.textContent = player.isPlaying ? '⏸' : (player.isPaused ? '▶' : '▶');
  }

  function roleLabel(role) {
    return { melody:'旋律', harmony:'和声', bass:'低音', percussion:'打击' }[role] || role;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  }

  // ---------- 公共 API ----------
  function showGallery() {
    if (!galleryEl) buildGallery();
    else renderGallery();
    requestAnimationFrame(() => galleryEl.classList.add('show'));
  }

  return {
    GENRES, REGIONS, ERAS,
    getGenres,
    getAllWorks,
    getUserWorks,
    getFeaturesByStyle,
    classifyGenre,
    addWork,
    addWorkFromFile,
    validateWork,
    validateFile,
    showGallery,
    // 播放器
    playWork,
    pausePlayback,
    resumePlayback,
    stopPlayback,
    seekPlayback,
    setVolume,
    getPlayerState,
    // 用户交互
    getFavorites,
    isFavorite,
    toggleFavorite,
    getHistory,
    clearHistory,
    getRecommendations,
    // 分析
    buildPhonologyNote,
    inferRegion,
    inferEra,
  };
})();

window.ReferenceWorks = ReferenceWorks;

  <script>
/* ============================================================
 * effects.js — 效果链（混响 / 延迟）
 * 为每条轨道提供独立的发送式效果链，挂载到 AudioContext
 * 用法：const fx = new EffectsBus(ctx);  track.out -> fx.input -> master
 * ============================================================ */

class EffectsBus {
  constructor(ctx, masterDest) {
    this.ctx = ctx;
    this.input = ctx.createGain();   // 轨道干声入口
    this.dryGain = ctx.createGain();
    this.wetGain = ctx.createGain(); // 混响发送
    this.delayGain = ctx.createGain();
    this.output = ctx.createGain();
    this.output.gain.value = 1;

    // 干声路径
    this.input.connect(this.dryGain).connect(this.output);

    // 混响：用卷积合成一个简易脉冲响应
    this.reverb = ctx.createConvolver();
    this.reverb.buffer = this._makeImpulse(2.2, 2.5);
    this.input.connect(this.wetGain);
    this.wetGain.connect(this.reverb).connect(this.output);

    // 延迟：反馈延迟线
    this.delay = ctx.createDelay(2.0);
    this.delay.delayTime.value = 0.38;
    this.feedback = ctx.createGain();
    this.feedback.gain.value = 0.35;
    this.input.connect(this.delayGain);
    this.delayGain.connect(this.delay);
    this.delay.connect(this.feedback);
    this.feedback.connect(this.delay); // 反馈环
    this.delay.connect(this.output);

    // 默认参数
    this.setReverb(0.25);
    this.setDelay(0.18);
    this.setDry(1.0);

    if (masterDest) this.output.connect(masterDest);
  }

  // 生成简易脉冲响应（指数衰减噪声）
  _makeImpulse(duration, decay) {
    const sr = this.ctx.sampleRate;
    const len = Math.floor(sr * duration);
    const buf = this.ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  setDry(v) { this.dryGain.gain.value = v; }
  setReverb(v) { this.wetGain.gain.value = v; }   // 0..1
  setDelay(v) { this.delayGain.gain.value = v; }  // 0..1
  setFeedback(v) { this.feedback.gain.value = Math.max(0, Math.min(0.9, v)); }
  setDelayTime(s) { this.delay.delayTime.value = s; }
  setVolume(v) { this.output.gain.value = v; }

  connect(dest) { this.output.connect(dest); }
  disconnect() { this.output.disconnect(); }
}

window.EffectsBus = EffectsBus;

</script>
  <script>
/* ============================================================
 * synth.js — Web Audio 合成引擎
 *
 * 职责：
 *  - 管理 AudioContext / 主输出 / 频谱分析节点
 *  - 单音合成（基于乐器 preset）：振荡器+泛音+包络+滤波器+噪声+音高滑动
 *  - 采样加载接口：loadSample(instrId, ArrayBuffer) -> 转为 AudioBuffer 供采样回放
 *  - 轨道总线：每条轨道一个 GainNode（音量/声像）+ EffectsBus
 *  - 调度器：startPlayback(tracks, stepsPerBar, numBars, tempo, onStep, onEnd)
 *           按时间网格调度音符，支持暂停/停止
 * ============================================================ */

const SynthEngine = (() => {
  let ctx = null;
  let master = null;
  let limiter = null;
  let warmthFilter = null;    // 主低通：驯化锯齿/方波高音区谐波与混叠
  let harshShelf = null;     // 高频高货架：削减 2-5kHz 刺耳频段
  let analyser = null;
  let spectrumData = null;
  let activeNodes = new Set();      // 正在发声的节点（用于停止时清理）
  let schedulerTimer = null;
  let isPlaying = false;
  let playStartTime = 0;            // ctx.currentTime at play start
  let startStep = 0;                // 上次回调的步数（去重）
  let playbackStartStep = 0;        // 播放起始偏移步数（seek/loop 用）
  let notesQueue = [];              // 待调度音符
  let playbackConfig = null;

  // ---------- 初始化 ----------
  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { console.warn('Web Audio API 不可用'); return; }
    ctx = new AC();
    // 限幅器：防止多声部叠加过载削波
    limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -6;
    limiter.knee.value = 6;
    limiter.ratio.value = 12;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.25;
    master = ctx.createGain();
    master.gain.value = 0.6;
    // 暖色低通：截止 10kHz，Q=0.7（无共振），移除锯齿/方波在 10kHz+ 的刺耳高次谐波
    warmthFilter = ctx.createBiquadFilter();
    warmthFilter.type = 'lowpass';
    warmthFilter.frequency.value = 10000;
    warmthFilter.Q.value = 0.7;
    // 刺耳频段高架子：4kHz 起 -3dB，削减 2-5kHz 共振峰（人耳最敏感的刺耳区）
    harshShelf = ctx.createBiquadFilter();
    harshShelf.type = 'highshelf';
    harshShelf.frequency.value = 4000;
    harshShelf.gain.value = -3;
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    spectrumData = new Uint8Array(analyser.frequencyBinCount);
    // 信号链：master -> warmthFilter -> harshShelf -> limiter -> analyser -> destination
    master.connect(warmthFilter);
    warmthFilter.connect(harshShelf);
    harshShelf.connect(limiter);
    limiter.connect(analyser);
    analyser.connect(ctx.destination);
  }

  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }

  function getCtx() { return ctx; }
  function getAnalyser() { return analyser; }
  function getSpectrumData() {
    if (!analyser) return null;
    analyser.getByteFrequencyData(spectrumData);
    return spectrumData;
  }

  // ---------- 单音合成 ----------
  /**
   * 触发一个音符
   * @param {object} preset  乐器 preset
   * @param {number} midi    MIDI 音高
   * @param {number} when    ctx.currentTime 起始
   * @param {number} dur     秒
   * @param {number} vel     0..1
   * @param {AudioNode} dest 目标节点（轨道总线）
   */
  function playNote(preset, midi, when, dur, vel, dest) {
    if (!ctx || !preset) return;
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    vel = vel == null ? 0.8 : Math.max(0, Math.min(1, vel));
    dur = Math.max(0.05, dur);
    // 信号链：osc -> g(partials) -> out(vel*0.5) -> env(ADSR) -> [filter] -> dest
    // env 必须串入，否则 osc.stop 硬切断会产生咔哒爆音
    const out = ctx.createGain();
    out.gain.value = vel * 0.5;

    const nodes = [];
    // 包络节点（先创建并配置曲线，最后再 push 到 nodes，保持 nodes[i*2] 索引指向 osc）
    const env = ctx.createGain();
    env.gain.setValueAtTime(0, when);
    const a = preset.attack || 0.01;
    const d = preset.decay || 0.1;
    const s = preset.sustain != null ? preset.sustain : 0.7;
    const r = preset.release || 0.2;
    env.gain.linearRampToValueAtTime(1, when + a);
    env.gain.linearRampToValueAtTime(s, when + a + d);
    env.gain.setValueAtTime(s, when + dur);
    env.gain.linearRampToValueAtTime(0, when + dur + r);

    // 主振荡器 + 泛音 → out（先 push，保持 nodes[i*2] = osc, nodes[i*2+1] = g）
    const partials = preset.partials && preset.partials.length ? preset.partials : [{ ratio: 1, gain: 1, type: preset.type || 'sine' }];
    partials.forEach(p => {
      const osc = ctx.createOscillator();
      osc.type = p.type || preset.type || 'sine';
      osc.frequency.value = freq * (p.ratio || 1);
      if (preset.detune) osc.detune.value = (Math.random() * 2 - 1) * preset.detune;
      const g = ctx.createGain();
      g.gain.value = p.gain || 0.5;
      osc.connect(g).connect(out);
      osc.start(when);
      // 多留 release 时间，避免 osc 在包络未结束时停止
      osc.stop(when + dur + r + 0.1);
      nodes.push(osc, g);
    });
    nodes.push(out);   // out 加入，便于 stopPlayback 时淡出（消除爆音）

    // 连接信号链：out -> env -> [filter] -> dest
    let filterTarget = env;
    if (preset.filterType && preset.filterFreq) {
      const f = ctx.createBiquadFilter();
      f.type = preset.filterType;
      f.frequency.value = preset.filterFreq;
      f.Q.value = preset.filterQ || 1;
      out.connect(env);
      env.connect(f);
      f.connect(dest);
      filterTarget = f;
      nodes.push(f);
    } else {
      out.connect(env);
      env.connect(dest);
    }
    nodes.push(env);  // env 放最后，不影响前面 osc/g 的索引

    // 音高滑动（底鼓/通通鼓）
    if (preset.pitchDrop) {
      const pd = preset.pitchDrop;
      partials.forEach((p, i) => {
        const osc = nodes[i * 2];
        if (osc && osc.frequency) {
          osc.frequency.setValueAtTime(pd.from * (p.ratio || 1), when);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, pd.to * (p.ratio || 1)), when + pd.time);
        }
      });
    }

    // 颤音
    if (preset.vibrato) {
      const lfo = ctx.createOscillator();
      lfo.frequency.value = preset.vibrato.freq;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = preset.vibrato.depth;
      lfo.connect(lfoGain);
      partials.forEach((p, i) => {
        const osc = nodes[i * 2];
        if (osc) lfoGain.connect(osc.detune);
      });
      lfo.start(when);
      lfo.stop(when + dur + 0.2);
      nodes.push(lfo, lfoGain);
    }

    // 噪声（军鼓/踩镲/镲）
    if (preset.noise) {
      const noiseBuf = _makeNoise(dur + 0.2, preset.noise.type || 'white');
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      const ng = ctx.createGain();
      ng.gain.value = preset.noise.gain;
      src.connect(ng).connect(filterTarget);
      src.start(when);
      src.stop(when + dur + 0.1);
      nodes.push(src, ng);
    }

    nodes.forEach(n => activeNodes.add(n));
    // 清理
    const cleanup = when + dur + (preset.release || 0.2) + 0.3;
    setTimeout(() => { nodes.forEach(n => activeNodes.delete(n)); }, (cleanup - ctx.currentTime) * 1000 + 50);
  }

  function _makeNoise(dur, type) {
    const sr = ctx.sampleRate;
    const len = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    if (type === 'pink') {
      let b0=0,b1=0,b2=0;
      for (let i=0;i<len;i++){
        const w = Math.random()*2-1;
        b0 = 0.99765*b0 + w*0.0990460;
        b1 = 0.96300*b1 + w*0.2965164;
        b2 = 0.57000*b2 + w*1.0526913;
        data[i] = (b0+b1+b2+w*0.1848)*0.18;
      }
    } else {
      for (let i=0;i<len;i++) data[i] = Math.random()*2-1;
    }
    return buf;
  }

  // ---------- 轨道总线 ----------
  function createTrackBus(volume, pan, reverbAmount, delayAmount) {
    if (!ctx) init();
    const bus = ctx.createGain();
    bus.gain.value = volume != null ? volume : 0.8;
    const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (panner) {
      panner.pan.value = pan || 0;
      bus.connect(panner);
    }
    const fx = new EffectsBus(ctx, master);
    const finalDest = panner || bus;
    finalDest.connect(fx.input);
    fx.setReverb(reverbAmount || 0);
    fx.setDelay(delayAmount || 0);
    return { bus, panner, fx };
  }

  function setTrackVolume(busObj, v) { if (busObj && busObj.bus) busObj.bus.gain.value = v; }
  function setTrackPan(busObj, p) { if (busObj && busObj.panner) busObj.panner.pan.value = p; }
  function setTrackReverb(busObj, v) { if (busObj && busObj.fx) busObj.fx.setReverb(v); }
  function setTrackDelay(busObj, v) { if (busObj && busObj.fx) busObj.fx.setDelay(v); }

  // ---------- 采样加载接口（预留） ----------
  // 调用 loadSample('violin', arrayBuffer, callback) 将音频数据加载为 AudioBuffer
  // 加载后该乐器播放时优先使用采样回放而非合成
  const sampleBuffers = {};
  function loadSample(instrId, arrayBuffer, cb) {
    if (!ctx) init();
    try {
      ctx.decodeAudioData(arrayBuffer, (buf) => {
        sampleBuffers[instrId] = buf;
        if (cb) cb(true, buf);
      }, (err) => { console.warn('采样解码失败', instrId, err); if (cb) cb(false); });
    } catch (e) { if (cb) cb(false); }
  }
  function getSample(instrId) { return sampleBuffers[instrId] || null; }
  function playSample(instrId, midi, when, dur, vel, dest) {
    const buf = sampleBuffers[instrId];
    if (!buf || !ctx) return false;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = Math.pow(2, (midi - 60) / 12); // 以 C4 为基准变调
    const g = ctx.createGain();
    g.gain.value = (vel || 0.8) * 0.5;
    src.connect(g).connect(dest);
    src.start(when);
    src.stop(when + (dur || 0.5) + 0.1);
    activeNodes.add(src); activeNodes.add(g);
    return true;
  }

  // ---------- 调度器 ----------
  /**
   * 开始播放
   * @param {Array} playTracks  [{ preset, notes, pitched, _bus, transpose, volume, mute, solo }]
   * @param {number} stepsPerBar
   * @param {number} numBars
   * @param {number} tempo  BPM
   * @param {Function} onStep(step)  每步回调（UI 更新），step 为乐曲中的绝对步数
   * @param {Function} onEnd()  播放结束
   * @param {Object} [opts]  { startStep: 起始绝对步数（seek/loop 用，默认 0） }
   */
  function startPlayback(playTracks, stepsPerBar, numBars, tempo, onStep, onEnd, opts) {
    if (!ctx) init();
    resume();
    stopPlayback(true); // 清理旧调度
    opts = opts || {};
    const startOffset = Math.max(0, Math.min(opts.startStep || 0, stepsPerBar * numBars - 1));
    const totalSteps = stepsPerBar * numBars;
    const secPerStep = 60 / tempo / (stepsPerBar / 4); // 4分音符为一拍
    playbackConfig = { playTracks, stepsPerBar, numBars, tempo, onStep, onEnd, secPerStep, totalSteps, startOffset };
    playbackStartStep = startOffset;

    // 决定 solo：若任一轨道 solo，则只播放 solo 轨
    const anySolo = playTracks.some(t => t.solo);
    const audible = (t) => !t.mute && (!anySolo || t.solo);

    // 预排所有音符到时间队列（仅排 startOffset 及之后的音符；时间相对 startOffset）
    notesQueue = [];
    playTracks.forEach((t, ti) => {
      if (!audible(t)) return;
      const dest = t._bus ? t._bus.bus : master;
      const transpose = t.transpose || 0;
      (t.notes || []).forEach(n => {
        const step = n.step;
        if (step < startOffset || step >= totalSteps) return;
        const when = (step - startOffset) * secPerStep;
        const midi = (t.pitched ? n.midi : (t.preset.range ? t.preset.range[0] : 60)) + transpose;
        const dur = (n.dur || 1) * secPerStep;
        notesQueue.push({ when, midi, dur, vel: n.vel || 0.8, preset: t.preset, instrId: t.preset.id, dest, pitched: t.pitched });
      });
    });
    notesQueue.sort((a, b) => a.when - b.when);

    playStartTime = ctx.currentTime + 0.1;
    startStep = -1;
    isPlaying = true;
    _scheduleLoop();
  }

  function _scheduleLoop() {
    if (!isPlaying || !playbackConfig) return;
    const { secPerStep, totalSteps, onStep, onEnd, startOffset } = playbackConfig;
    const lookahead = 0.1; // 提前 100ms 调度
    const now = ctx.currentTime - playStartTime;

    // 调度到 lookahead 窗口的音符
    while (notesQueue.length && notesQueue[0].when <= now + lookahead) {
      const n = notesQueue.shift();
      const when = playStartTime + n.when;
      // 优先采样，否则合成
      if (!playSample(n.instrId, n.midi, when, n.dur, n.vel, n.dest)) {
        playNote(n.preset, n.midi, when, n.dur, n.vel, n.dest);
      }
    }

    // 步进回调（UI）：转换为绝对步数
    const relStep = Math.floor(now / secPerStep);
    const curStep = startOffset + relStep;
    if (relStep >= 0 && curStep < totalSteps && curStep !== startStep) {
      startStep = curStep;
      if (onStep) onStep(curStep);
    }

    if (now >= (totalSteps - startOffset) * secPerStep) {
      isPlaying = false;
      if (onEnd) onEnd();
      return;
    }
    schedulerTimer = setTimeout(_scheduleLoop, 25);
  }

  // 快速淡出并停止所有活动节点，消除硬切断爆音
  // silent 参数仅用于保留旧 API 兼容；现在统一做淡出清理
  function stopPlayback(silent) {
    if (schedulerTimer) { clearTimeout(schedulerTimer); schedulerTimer = null; }
    isPlaying = false;
    if (!ctx) return;
    const now = ctx.currentTime;
    const fade = 0.03;   // 30ms 淡出，足以消除咔哒爆音
    activeNodes.forEach(n => {
      try {
        if (n.gain && n.gain.cancelScheduledValues) {
          // GainNode：取消未来值，从当前值淡到 0
          n.gain.cancelScheduledValues(now);
          n.gain.setValueAtTime(n.gain.value, now);
          n.gain.linearRampToValueAtTime(0, now + fade);
        }
        if (n.stop) {
          // 振荡器/采样源：在淡出结束后停止
          n.stop(now + fade + 0.01);
        }
      } catch (e) { /* 已停止的节点忽略 */ }
    });
    // 延迟断开连接，让淡出完成
    const toClear = activeNodes;
    activeNodes = new Set();
    setTimeout(() => {
      toClear.forEach(n => { try { n.disconnect && n.disconnect(); } catch (e) {} });
    }, (fade + 0.05) * 1000 + 20);
  }

  function isEnginePlaying() { return isPlaying; }

  return {
    init, resume, getCtx, getAnalyser, getSpectrumData,
    playNote, createTrackBus, setTrackVolume, setTrackPan, setTrackReverb, setTrackDelay,
    loadSample, getSample, playSample,
    startPlayback, stopPlayback, isEnginePlaying,
  };
})();

window.SynthEngine = SynthEngine;

</script>
  <script>
/* ============================================================
 * recorder.js — 实时多轨录制
 *
 * 工作方式：
 *  - 提供虚拟键盘（电脑键盘映射为 MIDI 音高）
 *  - 录制时记录每个音符的按下/松开时刻与 MIDI
 *  - 录制结束按当前 BPM 对齐到 16 步网格，写入轨道 notes
 *  - 支持节拍器
 * ============================================================ */

const Recorder = (() => {
  // 电脑键盘 -> MIDI（以 C4=60 为基准的八度）
  // 下排：Z S X D C V G B H N J M ,  -> C4..C5
  // 上排：Q 2 W 3 E R 5 T 6 Y 7 U I 9 O 0 P  -> C5..C6
  const KEYMAP_LOWER = ['z','s','x','d','c','v','g','b','h','n','j','m'];
  const KEYMAP_UPPER = ['q','2','w','3','e','r','5','t','6','y','7','u','i','9','o','0','p'];

  let recording = false;
  let baseOctave = 4; // C4
  let activeNotes = {}; // midi -> { startTime, vel }
  let recordedEvents = []; // { midi, start, end, vel }
  let ctx = null;
  let startTime = 0;
  let bpm = 100;
  let stepsPerBar = 16;
  let onNoteOnCb = null;  // (midi) 实时回放
  let onNoteOffCb = null; // (midi)
  let metronome = false;
  let metroTimer = null;
  let metroStep = 0;
  let metroSecPerStep = 0;

  function init(audioCtx) { ctx = audioCtx; }

  function setBpm(b) { bpm = b; }
  function setStepsPerBar(s) { stepsPerBar = s; }
  function setOctave(o) { baseOctave = o; }

  function keyToMidi(key) {
    key = key.toLowerCase();
    let idx = KEYMAP_LOWER.indexOf(key);
    if (idx >= 0) return (baseOctave) * 12 + 12 + idx; // C4=60
    idx = KEYMAP_UPPER.indexOf(key);
    if (idx >= 0) return (baseOctave + 1) * 12 + 12 + idx;
    return null;
  }

  function start(onNoteOn, onNoteOff) {
    recording = true;
    activeNotes = {};
    recordedEvents = [];
    onNoteOnCb = onNoteOn;
    onNoteOffCb = onNoteOff;
    if (ctx) startTime = ctx.currentTime;
    else startTime = performance.now() / 1000;
    if (metronome) startMetronome();
  }

  function stop() {
    recording = false;
    // 强制结束所有未释放的音符
    Object.keys(activeNotes).forEach(midi => {
      noteOff(parseInt(midi, 10));
    });
    stopMetronome();
    return recordedEvents;
  }

  function isRecording() { return recording; }

  function noteOn(midi, vel) {
    if (!recording) return;
    if (activeNotes[midi]) return; // 已按下
    const now = ctx ? ctx.currentTime : performance.now() / 1000;
    activeNotes[midi] = { startTime: now - startTime, vel: vel || 0.8 };
    if (onNoteOnCb) onNoteOnCb(midi, activeNotes[midi].vel);
  }

  function noteOff(midi) {
    if (!recording) return;
    const a = activeNotes[midi];
    if (!a) return;
    const now = ctx ? ctx.currentTime : performance.now() / 1000;
    const end = now - startTime;
    recordedEvents.push({ midi, start: a.startTime, end: Math.max(end, a.startTime + 0.05), vel: a.vel });
    delete activeNotes[midi];
    if (onNoteOffCb) onNoteOffCb(midi);
  }

  // ---------- 节拍器 ----------
  function setMetronome(on) {
    metronome = !!on;
    if (!metronome) stopMetronome();
  }
  function startMetronome() {
    if (!ctx) return;
    metroSecPerStep = 60 / bpm / (stepsPerBar / 4);
    metroStep = 0;
    const tick = () => {
      if (!recording || !metronome) return;
      _click(metroStep % stepsPerBar === 0);
      metroStep++;
      metroTimer = setTimeout(tick, metroSecPerStep * 1000);
    };
    tick();
  }
  function stopMetronome() {
    if (metroTimer) { clearTimeout(metroTimer); metroTimer = null; }
  }
  function _click(accent) {
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.frequency.value = accent ? 1200 : 800;
    g.gain.value = 0;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(accent ? 0.3 : 0.15, ctx.currentTime + 0.001);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.connect(g).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.06);
  }

  // ---------- 录制事件转网格音符 ----------
  /**
   * 把录制的事件量化对齐到 16 步网格
   * @param {Array} events
   * @param {number} secPerStep
   * @param {number} totalSteps
   * @param {number} quantize  量化精度（步数，默认1=16分音符）
   * @returns {Array} notes [{ step, midi, dur, vel }]
   */
  function quantize(events, secPerStep, totalSteps, quantize) {
    quantize = quantize || 1;
    const notes = [];
    events.forEach(e => {
      let step = Math.round(e.start / secPerStep / quantize) * quantize;
      let dur = Math.max(1, Math.round((e.end - e.start) / secPerStep / quantize) * quantize);
      if (step < 0) step = 0;
      if (step >= totalSteps) return;
      if (step + dur > totalSteps) dur = totalSteps - step;
      notes.push({ step, midi: e.midi, dur, vel: e.vel });
    });
    // 合并同音同步的重叠
    return notes;
  }

  return {
    init, keyToMidi, setBpm, setStepsPerBar, setOctave,
    start, stop, isRecording, noteOn, noteOff,
    setMetronome, quantize,
  };
})();

window.Recorder = Recorder;

  <script>
/* ============================================================
 * spectrum.js — 频谱可视化分析器
 * 从 SynthEngine.getAnalyser() 取数据，用 Canvas 绘制频谱柱状图
 * ============================================================ */

const Spectrum = (() => {
  let canvas = null, cctx = null;
  let rafId = null;
  let running = false;
  let barCount = 48;
  let peakHold = []; // 峰值保持

  function init(el) {
    canvas = el;
    cctx = canvas.getContext('2d');
    peakHold = new Array(barCount).fill(0);
  }

  function start() {
    if (running) return;
    running = true;
    _loop();
  }
  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  function _loop() {
    if (!running) return;
    const data = SynthEngine.getSpectrumData();
    _draw(data);
    rafId = requestAnimationFrame(_loop);
  }

  function _draw(data) {
    const w = canvas.width, h = canvas.height;
    cctx.clearRect(0, 0, w, h);
    if (!data) return;
    const bw = w / barCount;
    const step = Math.floor(data.length / barCount) || 1;
    for (let i = 0; i < barCount; i++) {
      // 取该频段最大值
      let v = 0;
      for (let j = 0; j < step; j++) v = Math.max(v, data[i * step + j] || 0);
      v = v / 255;
      // 峰值保持
      if (v > peakHold[i]) peakHold[i] = v;
      else peakHold[i] = Math.max(0, peakHold[i] - 0.012);
      const bh = v * h * 0.92;
      const x = i * bw + 1;
      // 渐变填充
      const grad = cctx.createLinearGradient(0, h, 0, h - bh);
      grad.addColorStop(0, '#3498db');
      grad.addColorStop(0.6, '#2ecc71');
      grad.addColorStop(1, '#f1c40f');
      cctx.fillStyle = grad;
      cctx.fillRect(x, h - bh, bw - 2, bh);
      // 峰值线
      const ph = peakHold[i] * h * 0.92;
      cctx.fillStyle = 'rgba(255,255,255,.6)';
      cctx.fillRect(x, h - ph - 2, bw - 2, 2);
    }
  }

  return { init, start, stop };
})();

window.Spectrum = Spectrum;

</script>
  <script>
/* ============================================================
 * pianoRoll.js — 钢琴卷帘编辑器（含横轴时间线系统）
 * 功能：
 *   - 增/移/缩放/删除音符；单击/Shift+范围/Ctrl+切换选择；
 *   - 播放头指示；右键删除；预览试听
 *   - 时间线：小节/拍/秒 三种单位；缩放（COL_W 动态）；
 *     节拍线/小节线/秒线分层显示；循环点标记（可拖拽）；
 *     点击/拖拽时间线定位播放头（seek）；与音符区精确对齐、同步滚动
 * ============================================================ */

const PianoRoll = (() => {
  let container = null, grid = null, gutter = null, playheadEl = null;
  // 时间线 DOM
  let timelineEl = null, cornerEl = null, rulerEl = null;
  let tlPlayheadEl = null, loopRegionEl = null, loopStartEl = null, loopEndEl = null;
  let track = null;            // 当前声部
  let onChangeCb = null, onSelectCb = null, onSeekCb = null, onLoopCb = null;
  let numBars = 4, stepsPerBar = 16;
  const BASE_COL_W = 22, ROW_H = 14, SNAP = 1;
  let COL_W = BASE_COL_W;     // 受缩放影响
  let lowMidi = 36, highMidi = 84;

  // 时间线状态
  let zoom = 1;                       // 缩放倍率 [0.5, 4]
  let timeUnit = 'bar';               // 'bar' | 'beat' | 'second'
  let loop = null;                    // { start, end } 步数，null 表示无循环
  let tempoRef = 100;                 // 用于秒换算的 BPM（由 app 注入）

  const selected = new Set(); // 选中音符索引

  function init(el, opts = {}) {
    container = el;
    onChangeCb = opts.onChange || null;
    onSelectCb = opts.onSelect || null;
    onSeekCb = opts.onSeek || null;
    onLoopCb = opts.onLoop || null;
    container.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'pr-wrap';

    // ===== 时间线行（sticky top） =====
    timelineEl = document.createElement('div');
    timelineEl.className = 'pr-timeline';

    cornerEl = document.createElement('div');
    cornerEl.className = 'pr-tl-corner';
    cornerEl.innerHTML = '<span class="pr-tl-corner-label">时间</span>';

    rulerEl = document.createElement('div');
    rulerEl.className = 'pr-tl-ruler';

    // 循环区域 + 句柄
    loopRegionEl = document.createElement('div');
    loopRegionEl.className = 'pr-tl-loop';
    loopStartEl = document.createElement('div');
    loopStartEl.className = 'pr-tl-loop-handle pr-tl-loop-start';
    loopStartEl.setAttribute('title', '循环起点（拖动调整）');
    loopEndEl = document.createElement('div');
    loopEndEl.className = 'pr-tl-loop-handle pr-tl-loop-end';
    loopEndEl.setAttribute('title', '循环终点（拖动调整）');

    // 时间线播放头
    tlPlayheadEl = document.createElement('div');
    tlPlayheadEl.className = 'pr-tl-playhead';
    tlPlayheadEl.style.display = 'none';

    rulerEl.appendChild(loopRegionEl);
    rulerEl.appendChild(loopStartEl);
    rulerEl.appendChild(loopEndEl);
    rulerEl.appendChild(tlPlayheadEl);

    timelineEl.appendChild(cornerEl);
    timelineEl.appendChild(rulerEl);

    // ===== 主行：键名 + 网格 =====
    const main = document.createElement('div');
    main.className = 'pr-main';
    gutter = document.createElement('div');
    gutter.className = 'pr-gutter';
    grid = document.createElement('div');
    grid.className = 'pr-grid';
    grid.tabIndex = 0;
    grid.setAttribute('role', 'application');
    grid.setAttribute('aria-label', '钢琴卷帘编辑器');
    main.appendChild(gutter);
    main.appendChild(grid);

    wrap.appendChild(timelineEl);
    wrap.appendChild(main);
    container.appendChild(wrap);

    playheadEl = document.createElement('div');
    playheadEl.className = 'pr-playhead';
    playheadEl.style.display = 'none';
    grid.appendChild(playheadEl);

    bindEvents();
    bindTimelineEvents();
  }

  function setTrack(t) {
    track = t;
    selected.clear();
