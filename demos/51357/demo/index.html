<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>曹操到了— 产品全景</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 顶部导航 -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="#top" class="nav-brand">
        <span class="logo">曹</span>
        曹操到了
      </a>
      <div class="nav-links">
        <a href="#student">学生端</a>
        <a href="#words">单词学习</a>
        <a href="#train">单词训练</a>
        <a href="#book">绘本</a>
        <a href="#ai">AI 助手</a>
        <a href="#teacher">教师端</a>
        <a href="#material">教材库</a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero" id="top">
    <div class="eyebrow">曹操到了</div>
    <h1>让每个单词<br/>都被真正记住</h1>
    <p class="sub">从词力定标到绘本生成，从单词游戏到 AI 陪练 —— 一套贯穿学与教的英语学习系统。</p>
    <div class="cta">
      <a href="#student" class="btn btn-primary">开始探索</a>
      <a href="#teacher" class="btn btn-ghost">了解教师端 ›</a>
    </div>
    <div class="hero-stats">
      <div class="stat"><div class="num">5+</div><div class="lbl">单词游戏与训练玩法</div></div>
      <div class="stat"><div class="num">7</div><div class="lbl">环节闭环式单词训练</div></div>
      <div class="stat"><div class="num">AI</div><div class="lbl">绘本生成 · 对话 · 批改</div></div>
    </div>
    <div class="scroll-hint"><span>向下滚动体验</span><span class="chev">⌄</span></div>
  </header>

  <!-- 内容由 main.js 渲染 -->
  <main id="app"></main>

  <!-- 页脚 -->
  <footer class="footer">
    <h3>学得有趣，记得牢固，教得轻松。</h3>
    <p>一个英语学习与陪练一体化平台。</p>
    <div class="fbrand"><b>曹操到了</b> — 产品功能全景展示页（离线演示版）</div>
  </footer>

  <!-- 弹窗容器 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-hero" id="modalHero">
        <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
        <div class="m-icon" id="mIcon"></div>
        <h3 id="mTitle"></h3>
        <div class="m-en" id="mEn"></div>
        <div class="m-desc" id="mDesc"></div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/demos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
