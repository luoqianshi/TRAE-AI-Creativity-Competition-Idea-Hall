<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和旭电商退货查询系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* 头部 */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    .header p {
      color: rgba(255,255,255,0.85);
      font-size: 15px;
      font-weight: 300;
    }

    /* 搜索区域 */
    .search-box {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      margin-bottom: 24px;
    }

    .search-form {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-input-wrapper {
      flex: 1;
      position: relative;
    }

    .search-input-wrapper svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: #aaa;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      color: #333;
    }

    .search-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .search-input::placeholder {
      color: #bbb;
    }

    .search-btn {
      padding: 14px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.15s;
      white-space: nowrap;
    }

    .search-btn:hover {
      opacity: 0.9;
    }

    .search-btn:active {
      transform: scale(0.97);
    }

    .search-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 状态栏 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 13px;
      color: #999;
    }

    .refresh-btn {
      background: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 12px;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    /* 结果区域 */
    .result-area {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      overflow: hidden;
      display: none;
    }

    .result-area.visible {
      display: block;
    }

    .result-header {
      padding: 20px 32px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .result-count {
      font-size: 14px;
      color: #888;
    }

    .result-count span {
      color: #667eea;
      font-weight: 700;
    }

    /* 表格 */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: #f8f9fc;
      padding: 14px 20px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #eef0f5;
      white-space: nowrap;
    }

    tbody td {
      padding: 14px 20px;
      font-size: 14px;
      color: #444;
      border-bottom: 1px solid #f5f5f5;
      vertical-align: middle;
    }

    tbody tr:hover {
      background: #fafbff;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .source-tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      background: #eef0ff;
      color: #667eea;
      white-space: nowrap;
    }

    .highlight {
      background: #fff3cd;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      color: #ddd;
      margin-bottom: 16px;
    }

    .empty-state p {
      color: #aaa;
      font-size: 15px;
    }

    /* 初始提示 */
    .welcome {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.7);
    }

    .welcome svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .welcome p {
      font-size: 16px;
      line-height: 1.8;
    }

    /* 加载动画 */
    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .loading.visible {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 3px solid #e8e8e8;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading p {
      margin-top: 12px;
      color: #888;
      font-size: 14px;
    }

    /* 错误提示 */
    .error-msg {
      display: none;
      background: #fff5f5;
      border: 1px solid #fee2e2;
      border-radius: 10px;
      padding: 16px 24px;
      color: #dc2626;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .error-msg.visible {
      display: block;
    }

    /* 响应式 */
    @media (max-width: 640px) {
      .container {
        padding: 20px 12px;
      }

      .header h1 {
        font-size: 24px;
      }

      .search-box {
        padding: 20px;
      }

      .search-form {
        flex-direction: column;
      }

      .search-btn {
        width: 100%;
      }

      .result-header {
        padding: 16px 20px;
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
      }

      thead th,
      tbody td {
        padding: 10px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <h1>和旭电商退货查询系统</h1>
      <p>输入快递单号，快速查询退货记录</p>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
      <div class="search-form">
        <div class="search-input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="请输入快递单号进行查询..."
            autocomplete="off"
          />
        </div>
        <button class="search-btn" id="searchBtn" onclick="doSearch()">查询</button>
      </div>
      <div class="status-bar">
        <span id="statusText">就绪</span>
        <button class="refresh-btn" onclick="doRefresh()">刷新数据</button>
      </div>
    </div>

    <!-- 错误提示 -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- 加载动画 -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>正在查询，请稍候...</p>
    </div>

    <!-- 初始欢迎 -->
    <div class="welcome" id="welcome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      <p>在上方搜索框中输入快递单号<br/>即可快速查询退货记录</p>
    </div>

    <!-- 结果区域 -->
    <div class="result-area" id="resultArea">
      <div class="result-header">
        <h2>查询结果</h2>
        <div class="result-count">共找到 <span id="totalCount">0</span> 条记录</div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>来源</th>
              <th>登记日期</th>
              <th>快递单号</th>
              <th>商品名称</th>
              <th>正品数量</th>
              <th>次品数量</th>
              <th>次品备注</th>
              <th>备注</th>
            </tr>
          </thead>
          <tbody id="resultBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultArea = document.getElementById('resultArea');
    const resultBody = document.getElementById('resultBody');
    const totalCount = document.getElementById('totalCount');
    const loading = document.getElementById('loading');
    const errorMsg = document.getElementById('errorMsg');
    const welcome = document.getElementById('welcome');
    const statusText = document.getElementById('statusText');

    // 回车搜索
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        doSearch();
      }
    });

    // 高亮匹配文本
    function highlightText(text, query) {
      if (!query) return escapeHtml(text);
      const escaped = escapeHtml(text);
      const escapedQuery = escapeHtml(query);
      const regex = new RegExp('(' + escapedQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return escaped.replace(regex, '<span class="highlight">$1</span>');
    }

    // HTML 转义
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 显示错误
    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
      setTimeout(() => {
        errorMsg.classList.remove('visible');
      }, 8000);
    }

    // 更新状态
    function setStatus(text) {
      statusText.textContent = text;
    }

    // 执行搜索
    async function doSearch() {
      const query = searchInput.value.trim();
      if (!query) {
        showError('请输入快递单号');
        searchInput.focus();
        return;
      }

      // UI 状态切换
      welcome.style.display = 'none';
      resultArea.classList.remove('visible');
      loading.classList.add('visible');
      errorMsg.classList.remove('visible');
      searchBtn.disabled = true;
      setStatus('查询中...');

      try {
        const resp = await fetch('/api/search?q=' + encodeURIComponent(query));
        const data = await resp.json();

        loading.classList.remove('visible');

        if (!data.success) {
          showError(data.error || '查询失败，请稍后重试');
          setStatus('查询失败');
          return;
        }

        totalCount.textContent = data.total;
        resultBody.innerHTML = '';

        if (data.total === 0) {
          resultBody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg><p>未找到匹配的退货记录</p></div></td></tr>';
        } else {
          data.data.forEach(function(row) {
            const tr = document.createElement('tr');
            tr.innerHTML =
              '<td><span class="source-tag">' + escapeHtml(row.source) + '</span></td>' +
              '<td>' + escapeHtml(row['登记日期']) + '</td>' +
              '<td>' + highlightText(row['快递单号'], query) + '</td>' +
              '<td>' + escapeHtml(row['商品名称']) + '</td>' +
              '<td>' + escapeHtml(row['正品数量']) + '</td>' +
              '<td>' + escapeHtml(row['次品数量']) + '</td>' +
              '<td>' + escapeHtml(row['次品备注']) + '</td>' +
              '<td>' + escapeHtml(row['备注']) + '</td>';
            resultBody.appendChild(tr);
          });
        }

        resultArea.classList.add('visible');
        setStatus('查询完成 - ' + data.total + ' 条结果');
      } catch (err) {
        loading.classList.remove('visible');
        showError('网络请求失败，请检查服务是否正常运行');
        setStatus('请求失败');
      } finally {
        searchBtn.disabled = false;
      }
    }

    // 刷新数据
    async function doRefresh() {
      setStatus('正在刷新数据...');
      try {
        const resp = await fetch('/api/refresh');
        const data = await resp.json();
        if (data.success) {
          setStatus('数据已刷新 - 共 ' + data.total + ' 条记录');
        } else {
          showError('刷新失败: ' + (data.error || '未知错误'));
          setStatus('刷新失败');
        }
      } catch (err) {
        showError('刷新请求失败');
        setStatus('刷新失败');
      }
    }
  </script>

</body>
</html>
