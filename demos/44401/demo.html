<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Math Correction</title>
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --warning: #ffcc00;
            --danger: #ff3b30;
            --gray-100: #f8f9fa;
            --gray-200: #e9ecef;
            --gray-300: #dee2e6;
            --gray-400: #ced4da;
            --gray-500: #adb5bd;
            --gray-600: #6c757d;
            --gray-700: #495057;
            --gray-800: #343a40;
            --gray-900: #212529;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
            --transition-slow: 0.4s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background: var(--gray-100);
            color: var(--gray-900);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: var(--white);
            padding: 24px 0;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            background: rgba(255,255,255,0.85);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .logo path {
            transition: fill var(--transition-normal);
        }

        .header:hover .logo path {
            fill: var(--primary);
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .main {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .card {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin-bottom: 24px;
            animation: cardFadeIn 0.5s ease both;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-900);
        }

        .card-body {
            padding: 24px;
        }

        .tabs {
            display: flex;
            background: var(--gray-100);
            border-radius: var(--radius-lg);
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 12px 16px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--gray-600);
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            position: relative;
        }

        .tab.active {
            background: var(--white);
            color: var(--gray-900);
            box-shadow: var(--shadow-sm);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
            animation: tabIndicator 0.3s ease;
        }

        @keyframes tabIndicator {
            from {
                width: 0;
            }
            to {
                width: 20px;
            }
        }

        .upload-area {
            border: 2px dashed var(--gray-300);
            border-radius: var(--radius-lg);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-normal);
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(0,122,255,0.02);
        }

        .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(0,122,255,0.05);
            transform: scale(1.01);
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            opacity: 0.4;
            transition: opacity var(--transition-normal);
        }

        .upload-area:hover .upload-icon {
            opacity: 0.6;
        }

        .upload-area h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .upload-area p {
            font-size: 0.85rem;
            color: var(--gray-500);
        }

        .upload-area input {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            cursor: pointer;
        }

        .image-preview {
            margin-top: 16px;
            border-radius: var(--radius-md);
            overflow: hidden;
            display: none;
            animation: previewFadeIn 0.3s ease;
        }

        @keyframes previewFadeIn {
            from {
                opacity: 0;
                height: 0;
            }
            to {
                opacity: 1;
                height: auto;
            }
        }

        .image-preview img {
            width: 100%;
            height: auto;
            display: block;
        }

        .text-input {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-family: inherit;
            background: var(--gray-100);
            border: none;
            border-radius: var(--radius-lg);
            resize: vertical;
            min-height: 140px;
            transition: all var(--transition-normal);
            line-height: 1.6;
        }

        .text-input:focus {
            outline: none;
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(0,122,255,0.1);
        }

        .text-input::placeholder {
            color: var(--gray-400);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-normal);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left var(--transition-slow);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: #0066cc;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
        }

        .btn-sm {
            padding: 10px 16px;
            font-size: 0.85rem;
        }

        .sample-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .sample-card {
            padding: 16px;
            background: var(--gray-50);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            border: 1px solid transparent;
        }

        .sample-card:hover {
            background: var(--white);
            border-color: var(--gray-200);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .sample-card h4 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .sample-card p {
            font-size: 0.8rem;
            color: var(--gray-600);
            line-height: 1.5;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .loading-content {
            background: var(--white);
            padding: 40px;
            border-radius: var(--radius-xl);
            text-align: center;
            animation: loadingAppear 0.3s ease;
        }

        @keyframes loadingAppear {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            position: relative;
        }

        .loading-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid var(--gray-100);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: loadingSpin 1s linear infinite;
        }

        .loading-ring:nth-child(2) {
            animation-delay: 0.1s;
            opacity: 0.8;
        }

        .loading-ring:nth-child(3) {
            animation-delay: 0.2s;
            opacity: 0.6;
        }

        @keyframes loadingSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 0.95rem;
            color: var(--gray-600);
        }

        .result-section {
            display: none;
            animation: resultSlideIn 0.4s ease;
        }

        @keyframes resultSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .score {
            font-size: 1.2rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .score.correct {
            background: rgba(52,199,89,0.1);
            color: var(--success);
        }

        .score.partial {
            background: rgba(255,204,0,0.1);
            color: #cc9900;
        }

        .score.wrong {
            background: rgba(255,59,48,0.1);
            color: var(--danger);
        }

        .result-content {
            background: var(--gray-50);
            padding: 20px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
        }

        .result-item {
            margin-bottom: 12px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-500);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-text {
            font-size: 1rem;
            color: var(--gray-900);
            line-height: 1.6;
        }

        .analysis-box {
            background: rgba(0,122,255,0.03);
            border-left: 4px solid var(--primary);
            padding: 20px;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
        }

        .analysis-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .analysis-text {
            font-size: 0.95rem;
            color: var(--gray-700);
            line-height: 1.7;
        }

        .practice-section {
            margin-top: 24px;
            padding: 24px;
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-100);
            animation: practiceFadeIn 0.5s ease 0.2s both;
        }

        @keyframes practiceFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .practice-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .practice-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .practice-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-900);
        }

        .practice-subtitle {
            font-size: 0.85rem;
            color: var(--gray-500);
            margin-left: auto;
        }

        .practice-question {
            padding: 20px;
            background: var(--gray-50);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }

        .practice-question p {
            font-size: 1rem;
            color: var(--gray-900);
            line-height: 1.6;
        }

        .practice-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            margin-top: 12px;
            transition: all var(--transition-normal);
        }

        .practice-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,122,255,0.08);
        }

        .practice-feedback {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            display: none;
        }

        .practice-feedback.correct {
            background: rgba(52,199,89,0.08);
            color: var(--success);
            display: block;
        }

        .practice-feedback.wrong {
            background: rgba(255,59,48,0.08);
            color: var(--danger);
            display: block;
        }

        .practice-actions {
            display: flex;
            gap: 12px;
        }

        .footer {
            text-align: center;
            padding: 32px 24px;
            color: var(--gray-400);
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .main {
                padding: 20px 16px;
            }

            .card-body {
                padding: 16px;
            }

            .upload-area {
                padding: 32px 16px;
            }

            .btn-group {
                flex-direction: column;
            }

            .practice-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <svg class="logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="32" height="32" rx="6" stroke="#007aff" stroke-width="2"/>
                <path d="M12 28L18 16L24 22L28 14" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="28" cy="28" r="3" fill="#007aff"/>
            </svg>
            <div class="header-title">MathAI</div>
        </div>
    </header>

    <main class="main">
        <div class="card">
            <div class="card-header">
                <div class="card-title">作业批改</div>
            </div>
            <div class="card-body">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('upload')">拍照上传</button>
                    <button class="tab" onclick="switchTab('manual')">手动输入</button>
                </div>

                <div id="upload-tab">
                    <div class="upload-area" id="upload-area">
                        <svg class="upload-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M24 12V36M24 12L16 20M24 12L32 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="8" y="28" width="32" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <h3>点击或拖拽上传作业照片</h3>
                        <p>支持 JPG、PNG 格式，图片大小不超过 10MB</p>
                        <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)">
                    </div>
                    <div class="image-preview" id="image-preview">
                        <img id="preview-img" src="" alt="Preview">
                    </div>
                </div>

                <div id="manual-tab" style="display: none;">
                    <textarea id="question-input" class="text-input" placeholder="请输入数学题目内容...

例如：已知三角形ABC，AB=5cm，BC=12cm，角B=90度，求AC的长度。

或者：解方程 2x + 5 = 15"></textarea>
                </div>

                <div class="sample-grid" id="sample-grid">
                    <div class="sample-card" onclick="fillSample('math1')">
                        <h4>几何题</h4>
                        <p>已知三角形ABC，AB=5cm，BC=12cm，求AC的长度</p>
                    </div>
                    <div class="sample-card" onclick="fillSample('math2')">
                        <h4>代数题</h4>
                        <p>解方程：2x + 5 = 15，求x的值</p>
                    </div>
                    <div class="sample-card" onclick="fillSample('math3')">
                        <h4>应用题</h4>
                        <p>小明买了3支笔和2本笔记本，共花了20元...</p>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="startCorrection()">开始批改</button>
                    <button class="btn btn-secondary" onclick="clearInput()">清空</button>
                </div>
            </div>
        </div>

        <div class="result-section" id="result-section">
            <div class="card">
                <div class="card-header">
                    <div class="result-header">
                        <div class="result-title">批改结果</div>
                        <div class="score" id="score">得分</div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="result-content">
                        <div class="result-item">
                            <div class="result-label">题目</div>
                            <div class="result-text" id="result-question"></div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">参考答案</div>
                            <div class="result-text" id="result-answer"></div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">批改意见</div>
                            <div class="result-text" id="result-comment"></div>
                        </div>
                    </div>
                    <div class="analysis-box">
                        <div class="analysis-title">解题分析</div>
                        <div class="analysis-text" id="result-analysis"></div>
                    </div>
                </div>
            </div>

            <div class="practice-section" id="practice-section">
                <div class="practice-header">
                    <svg class="practice-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div class="practice-title">针对性练习</div>
                    <div class="practice-subtitle" id="practice-subtitle">第 1 题</div>
                </div>
                <div class="practice-question">
                    <p id="practice-question-text"></p>
                    <input type="text" class="practice-input" id="practice-input" placeholder="请输入答案...">
                    <div class="practice-feedback" id="practice-feedback"></div>
                </div>
                <div class="practice-actions">
                    <button class="btn btn-primary btn-sm" onclick="checkPractice()">提交答案</button>
                    <button class="btn btn-secondary btn-sm" onclick="nextPractice()">下一题</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        MathAI - AI 数学作业批改助手
    </footer>

    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner">
                <div class="loading-ring"></div>
                <div class="loading-ring"></div>
                <div class="loading-ring"></div>
            </div>
            <div class="loading-text">AI 正在分析中...</div>
        </div>
    </div>

    <script>
        const questionBank = {
            geometry: [
                {
                    question: "已知直角三角形ABC，AB=8cm，BC=15cm，角B=90度，求斜边AC的长度。",
                    answer: "17cm",
                    analysis: "根据勾股定理：AC² = AB² + BC² = 8² + 15² = 64 + 225 = 289，所以 AC = √289 = 17cm"
                },
                {
                    question: "一个直角三角形的两条直角边分别为6cm和8cm，求斜边上的高。",
                    answer: "4.8cm",
                    analysis: "先求斜边：√(6²+8²)=10cm。三角形面积=6×8÷2=24cm²，斜边上的高=24×2÷10=4.8cm"
                },
                {
                    question: "已知等腰直角三角形的斜边为10cm，求两条直角边的长度。",
                    answer: "5√2 cm",
                    analysis: "设直角边为x，则x² + x² = 10²，2x² = 100，x² = 50，x = √50 = 5√2 cm"
                }
            ],
            algebra: [
                {
                    question: "解方程：3x - 7 = 20，求x的值。",
                    answer: "x = 9",
                    analysis: "移项得：3x = 20 + 7 = 27，两边同时除以3：x = 27 ÷ 3 = 9"
                },
                {
                    question: "解方程：2(x + 5) = 18，求x的值。",
                    answer: "x = 4",
                    analysis: "先展开：2x + 10 = 18，移项得：2x = 8，x = 4"
                },
                {
                    question: "解方程：4x + 3 = 2x + 11，求x的值。",
                    answer: "x = 4",
                    analysis: "移项得：4x - 2x = 11 - 3，2x = 8，x = 4"
                }
            ],
            application: [
                {
                    question: "小红买了4支钢笔和1个文具盒，共花了32元。已知每个文具盒8元，求每支钢笔多少钱？",
                    answer: "6元",
                    analysis: "设每支钢笔x元，则4x + 8 = 32，4x = 24，x = 6元"
                },
                {
                    question: "一本书有180页，小明每天看15页，看了6天后还剩多少页？",
                    answer: "90页",
                    analysis: "小明6天看了15×6=90页，还剩180-90=90页"
                },
                {
                    question: "一辆汽车每小时行驶60公里，行驶3小时后，又以每小时80公里的速度行驶了2小时，求总路程。",
                    answer: "340公里",
                    analysis: "第一段路程：60×3=180公里，第二段路程：80×2=160公里，总路程：180+160=340公里"
                }
            ]
        };

        const sampleData = {
            math1: {
                question: "已知三角形ABC，AB=5cm，BC=12cm，角B=90度，求AC的长度。",
                answer: "AC = 13cm",
                score: 100,
                type: "correct",
                comment: "回答正确。根据勾股定理计算得出AC的长度为13cm。",
                analysis: "勾股定理是直角三角形中最重要的定理之一，公式为：a² + b² = c²，其中c为斜边。在这道题中，AB和BC是两条直角边，AC是斜边，直接代入公式即可求出结果。",
                category: "geometry"
            },
            math2: {
                question: "解方程：2x + 5 = 15，求x的值。",
                answer: "x = 5",
                score: 100,
                type: "correct",
                comment: "回答正确。解方程得出x的值为5。",
                analysis: "解一元一次方程的基本步骤：1.移项（将常数项移到等号另一边）；2.合并同类项；3.将未知数系数化为1。这道题比较基础，只要掌握移项的方法就能轻松解决。",
                category: "algebra"
            },
            math3: {
                question: "小明买了3支笔和2本笔记本，共花了20元。已知每支笔3元，求每本笔记本多少钱？",
                answer: "每本笔记本5.5元",
                score: 100,
                type: "correct",
                comment: "回答正确。设每本笔记本x元，列方程求解得出x=5.5元。",
                analysis: "这是一道典型的一元一次方程应用题。解题关键是根据题意列出方程：总花费 = 笔的花费 + 笔记本的花费。设未知数时，通常设要求的量为x，然后根据等量关系列出方程求解。",
                category: "application"
            }
        };

        let currentCategory = '';
        let currentPracticeIndex = 0;
        let practiceQuestions = [];

        function switchTab(tabName) {
            const uploadTab = document.getElementById('upload-tab');
            const manualTab = document.getElementById('manual-tab');
            const tabs = document.querySelectorAll('.tab');

            tabs.forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            if (tabName === 'upload') {
                uploadTab.style.display = 'block';
                manualTab.style.display = 'none';
            } else {
                uploadTab.style.display = 'none';
                manualTab.style.display = 'block';
            }

            document.getElementById('result-section').style.display = 'none';
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    const img = document.getElementById('preview-img');
                    img.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function fillSample(key) {
            switchTab('manual');
            document.getElementById('question-input').value = sampleData[key].question;
        }

        function startCorrection() {
            const input = document.getElementById('question-input').value.trim();
            const preview = document.getElementById('image-preview');

            if (!input && preview.style.display === 'none') {
                alert('请输入题目或上传图片');
                return;
            }

            document.getElementById('loading-overlay').style.display = 'flex';

            setTimeout(() => {
                document.getElementById('loading-overlay').style.display = 'none';
                showResult(input);
            }, 1800);
        }

        function showResult(input) {
            let data;
            
            if (input.includes('三角形') || input.includes('勾股') || input.includes('斜边')) {
                data = { ...sampleData.math1 };
            } else if (input.includes('解方程') || input.includes('x=') || input.includes('求x')) {
                data = { ...sampleData.math2 };
            } else if (input.includes('买') || input.includes('元') || input.includes('花')) {
                data = { ...sampleData.math3 };
            } else {
                data = {
                    question: input || '上传的题目',
                    answer: 'AI正在分析中',
                    score: 80,
                    type: 'partial',
                    comment: 'AI已识别您的题目并给出批改意见。您的解答思路基本正确，但在某些步骤上还可以优化。',
                    analysis: 'AI批改系统可以识别各种数学题型，包括代数、几何、应用题等。系统会分析您的解题步骤，指出错误所在，并提供详细的解析和改进建议。',
                    category: 'algebra'
                };
            }

            const scoreEl = document.getElementById('score');
            scoreEl.className = `score ${data.type}`;
            scoreEl.textContent = `${data.score}分`;

            document.getElementById('result-question').textContent = data.question;
            document.getElementById('result-answer').textContent = data.answer;
            document.getElementById('result-comment').textContent = data.comment;
            document.getElementById('result-analysis').textContent = data.analysis;

            currentCategory = data.category || 'algebra';
            initPractice();

            document.getElementById('result-section').style.display = 'block';
            document.getElementById('result-section').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function initPractice() {
            practiceQuestions = [...questionBank[currentCategory]];
            currentPracticeIndex = 0;
            
            const shuffled = practiceQuestions.sort(() => Math.random() - 0.5);
            practiceQuestions = shuffled.slice(0, 3);
            
            showPracticeQuestion();
        }

        function showPracticeQuestion() {
            if (currentPracticeIndex >= practiceQuestions.length) {
                document.getElementById('practice-question-text').textContent = '恭喜完成所有练习！';
                document.getElementById('practice-input').style.display = 'none';
                document.getElementById('practice-feedback').style.display = 'none';
                return;
            }

            const q = practiceQuestions[currentPracticeIndex];
            document.getElementById('practice-question-text').textContent = q.question;
            document.getElementById('practice-input').value = '';
            document.getElementById('practice-input').style.display = 'block';
            document.getElementById('practice-feedback').style.display = 'none';
            document.getElementById('practice-subtitle').textContent = `第 ${currentPracticeIndex + 1} / ${practiceQuestions.length} 题`;
        }

        function checkPractice() {
            if (currentPracticeIndex >= practiceQuestions.length) return;

            const q = practiceQuestions[currentPracticeIndex];
            const userAnswer = document.getElementById('practice-input').value.trim();
            const feedback = document.getElementById('practice-feedback');

            if (!userAnswer) {
                alert('请输入答案');
                return;
            }

            const isCorrect = userAnswer.toLowerCase().includes(q.answer.toLowerCase().replace(/[^0-9.√]/g, ''));
            
            if (isCorrect) {
                feedback.className = 'practice-feedback correct';
                feedback.textContent = '回答正确！';
            } else {
                feedback.className = 'practice-feedback wrong';
                feedback.textContent = `回答错误，正确答案是：${q.answer}`;
            }
        }

        function nextPractice() {
            currentPracticeIndex++;
            showPracticeQuestion();
        }

        function clearInput() {
            document.getElementById('question-input').value = '';
            document.getElementById('file-input').value = '';
            document.getElementById('image-preview').style.display = 'none';
            document.getElementById('result-section').style.display = 'none';
        }

        const uploadArea = document.getElementById('upload-area');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    const img = document.getElementById('preview-img');
                    img.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
