<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLabel-Vision - 试运行演示</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-color: #0ea5e9;
            --primary-dark: #0284c7;
            --accent-color: #8b5cf6;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-dark: #0a0f1a;
            --bg-card: #111827;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, var(--bg-dark) 0%, #0f172a 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p { color: var(--text-secondary); }

        .steps {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .step.active {
            background: rgba(14, 165, 233, 0.1);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .step.done {
            background: rgba(34, 197, 94, 0.1);
            border-color: var(--success-color);
            color: var(--success-color);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .card:hover { border-color: var(--primary-color); }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover, .upload-area.dragging {
            border-color: var(--primary-color);
            background: rgba(14, 165, 233, 0.05);
        }

        .upload-area input {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .file-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 16px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .file-icon { color: var(--primary-color); }

        .progress-section {
            margin-top: 24px;
        }

        .progress-bar {
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .process-log {
            background: #0a0f1a;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Consolas', monospace;
            font-size: 0.8rem;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .log-entry {
            margin-bottom: 4px;
            display: flex;
            gap: 8px;
        }

        .log-time { color: var(--text-muted); }
        .log-message { color: var(--text-secondary); }
        .log-success { color: var(--success-color); }
        .log-info { color: var(--primary-color); }

        .result-section {
            margin-top: 24px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .result-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .preview-section {
            margin-top: 24px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .preview-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .preview-image {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(139, 92, 246, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .preview-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bbox {
            position: absolute;
            border: 2px solid var(--success-color);
            background: rgba(34, 197, 94, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .preview-info {
            padding: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .label-content {
            background: #0a0f1a;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Consolas', monospace;
            font-size: 0.75rem;
            margin-top: 8px;
            overflow-x: auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success-color), #16a34a);
            color: white;
        }

        .action-area {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
            .steps { gap: 12px; }
            .upload-area { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AutoLabel-Vision 试运行演示</h1>
            <p>体验机器视觉批量标签自动生成系统的完整流程</p>
        </header>

        <div class="steps">
            <div class="step" id="step1">
                <i data-lucide="upload" width="16" height="16"></i>
                <span>1. 上传图片</span>
            </div>
            <div class="step" id="step2">
                <i data-lucide="loader-2" width="16" height="16"></i>
                <span>2. 自动处理</span>
            </div>
            <div class="step" id="step3">
                <i data-lucide="check-circle" width="16" height="16"></i>
                <span>3. 生成标签</span>
            </div>
            <div class="step" id="step4">
                <i data-lucide="download" width="16" height="16"></i>
                <span>4. 下载结果</span>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <div class="card-title">
                    <i data-lucide="image" width="20" height="20" style="color: var(--primary-color);"></i>
                    图片上传区
                </div>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" multiple accept="image/*">
                    <div class="upload-icon" id="uploadIcon">
                        <i data-lucide="upload-cloud" width="48" height="48"></i>
                    </div>
                    <div class="upload-text" id="uploadText">点击或拖拽图片到此处上传</div>
                    <div class="upload-hint">支持 JPG、PNG、BMP 格式，可多选</div>
                </div>
                <div class="file-list hidden" id="fileList"></div>
                <div class="action-area">
                    <button class="btn btn-primary" id="startBtn" disabled>
                        <i data-lucide="play" width="18" height="18"></i>
                        开始处理
                    </button>
                    <button class="btn btn-outline" id="resetBtn" style="display:none;">
                        <i data-lucide="rotate-ccw" width="18" height="18"></i>
                        重新上传
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <i data-lucide="terminal" width="20" height="20" style="color: var(--accent-color);"></i>
                    处理日志
                </div>
                <div class="process-log" id="processLog">
                    <div class="log-entry">
                        <span class="log-time">[系统]</span>
                        <span class="log-message">AutoLabel-Vision 系统已就绪</span>
                    </div>
                    <div class="log-entry">
                        <span class="log-time">[提示]</span>
                        <span class="log-message">请上传图片开始处理流程</span>
                    </div>
                </div>
                <div class="progress-section hidden" id="progressSection">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-info">
                        <span id="progressText">0%</span>
                        <span id="progressStatus">准备中...</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card hidden" id="resultCard">
            <div class="card-title">
                <i data-lucide="bar-chart-2" width="20" height="20" style="color: var(--success-color);"></i>
                处理结果
            </div>
            <div class="result-grid">
                <div class="result-card">
                    <div class="result-value" id="totalImages">0</div>
                    <div class="result-label">处理图片数</div>
                </div>
                <div class="result-card">
                    <div class="result-value" id="totalDetections">0</div>
                    <div class="result-label">检测目标数</div>
                </div>
                <div class="result-card">
                    <div class="result-value" id="avgConfidence">0.00</div>
                    <div class="result-label">平均置信度</div>
                </div>
                <div class="result-card">
                    <div class="result-value" id="processingTime">0s</div>
                    <div class="result-label">处理耗时</div>
                </div>
            </div>

            <div class="preview-section">
                <h3 style="font-size: 1rem; font-weight: 600; margin: 24px 0 16px;">标签预览</h3>
                <div class="preview-grid" id="previewGrid"></div>
            </div>

            <div class="action-area" style="justify-content: flex-end;">
                <button class="btn btn-success" id="downloadBtn">
                    <i data-lucide="download" width="18" height="18"></i>
                    下载数据集 (ZIP)
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const uploadIcon = document.getElementById('uploadIcon');
        const uploadText = document.getElementById('uploadText');
        const fileList = document.getElementById('fileList');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const processLog = document.getElementById('processLog');
        const progressSection = document.getElementById('progressSection');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const progressStatus = document.getElementById('progressStatus');
        const resultCard = document.getElementById('resultCard');
        const totalImages = document.getElementById('totalImages');
        const totalDetections = document.getElementById('totalDetections');
        const avgConfidence = document.getElementById('avgConfidence');
        const processingTime = document.getElementById('processingTime');
        const previewGrid = document.getElementById('previewGrid');
        const downloadBtn = document.getElementById('downloadBtn');

        const steps = ['step1', 'step2', 'step3', 'step4'];

        let uploadedFiles = [];
        let processingStartTime = 0;

        function addLog(message, type = 'message') {
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="log-${type}">${message}</span>
            `;
            processLog.appendChild(entry);
            processLog.scrollTop = processLog.scrollHeight;
        }

        function updateStep(stepIndex, status) {
            document.getElementById(steps[stepIndex]).className = `step ${status}`;
        }

        function handleFiles(files) {
            uploadedFiles = Array.from(files);
            fileList.innerHTML = '';
            
            uploadedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-icon">
                        <i data-lucide="image" width="18" height="18"></i>
                    </div>
                    <span>${file.name}</span>
                    <span style="color: var(--text-muted); font-size: 0.8rem;">(${formatSize(file.size)})</span>
                `;
                fileList.appendChild(item);
            });

            lucide.createIcons();
            fileList.classList.remove('hidden');
            uploadIcon.innerHTML = '<i data-lucide="check-circle" width="48" height="48" style="color: var(--success-color);"></i>';
            uploadText.textContent = `已选择 ${uploadedFiles.length} 张图片`;
            startBtn.disabled = false;
            resetBtn.style.display = 'flex';
            lucide.createIcons();

            addLog(`已上传 ${uploadedFiles.length} 张图片`, 'success');
            updateStep(0, 'done');
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files);
            }
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragging');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragging');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');
            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        resetBtn.addEventListener('click', () => {
            uploadedFiles = [];
            fileInput.value = '';
            fileList.classList.add('hidden');
            fileList.innerHTML = '';
            uploadIcon.innerHTML = '<i data-lucide="upload-cloud" width="48" height="48"></i>';
            uploadText.textContent = '点击或拖拽图片到此处上传';
            startBtn.disabled = true;
            resetBtn.style.display = 'none';
            resultCard.classList.add('hidden');
            previewGrid.innerHTML = '';
            progressSection.classList.add('hidden');
            progressFill.style.width = '0%';
            
            steps.forEach((step, index) => {
                document.getElementById(step).className = 'step';
            });
            
            processLog.innerHTML = `
                <div class="log-entry">
                    <span class="log-time">[系统]</span>
                    <span class="log-message">AutoLabel-Vision 系统已就绪</span>
                </div>
                <div class="log-entry">
                    <span class="log-time">[提示]</span>
                    <span class="log-message">请上传图片开始处理流程</span>
                </div>
            `;
            lucide.createIcons();
        });

        async function simulateProcessing() {
            updateStep(1, 'active');
            progressSection.classList.remove('hidden');
            startBtn.disabled = true;
            processingStartTime = Date.now();

            addLog('=== 开始自动处理流程 ===', 'info');
            
            await delay(500);
            updateProgress(5, '创建批量处理任务...');
            addLog('创建批量处理任务 ID#DEMO2026', 'info');

            await delay(800);
            updateProgress(15, '图片预处理...');
            addLog('正在进行图片缩放至 640x640', 'info');
            
            await delay(600);
            addLog('执行像素值归一化', 'info');
            
            await delay(600);
            addLog('应用背景减除算法 (MOG2)', 'info');

            await delay(500);
            updateProgress(35, '目标检测推理...');
            addLog('加载 YOLOv8n 预训练模型', 'info');
            
            const detectionCount = Math.floor(Math.random() * 50) + 20;
            for (let i = 0; i < 5; i++) {
                await delay(400);
                updateProgress(35 + (i + 1) * 8, `检测中... ${Math.round((i + 1) * 20)}%`);
                addLog(`处理批次 ${i + 1}/5，检测到 ${Math.floor(detectionCount / 5)} 个目标`, 'success');
            }

            await delay(400);
            updateProgress(80, '坐标归一化...');
            addLog('将像素坐标转换为 YOLO 归一化格式', 'info');
            addLog('应用公式: cx=(x1+x2)/2/w, cy=(y1+y2)/2/h', 'info');

            await delay(300);
            updateProgress(90, '质量评估...');
            addLog('过滤低置信度样本 (<0.5)', 'info');
            addLog('归档漏检样本至复核队列', 'info');

            await delay(300);
            updateProgress(95, '生成标签文件...');
            addLog('创建 dataset/images/ 目录', 'info');
            addLog('创建 dataset/labels/ 目录', 'info');
            
            await delay(200);
            updateProgress(100, '处理完成！');
            addLog(`=== 处理完成 ===`, 'success');
            
            const elapsed = ((Date.now() - processingStartTime) / 1000).toFixed(1);
            addLog(`总耗时: ${elapsed} 秒`, 'success');
            addLog(`检测目标: ${detectionCount} 个`, 'success');
            addLog(`平均置信度: ${(0.8 + Math.random() * 0.15).toFixed(2)}`, 'success');

            updateStep(1, 'done');
            updateStep(2, 'done');
            updateStep(3, 'done');
            updateStep(4, 'active');

            showResults(detectionCount, elapsed);
        }

        function updateProgress(percent, status) {
            progressFill.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
            progressStatus.textContent = status;
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function showResults(detectionCount, elapsed) {
            totalImages.textContent = uploadedFiles.length;
            totalDetections.textContent = detectionCount;
            avgConfidence.textContent = (0.8 + Math.random() * 0.15).toFixed(2);
            processingTime.textContent = elapsed + 's';

            previewGrid.innerHTML = '';
            const previewCount = Math.min(uploadedFiles.length, 4);
            
            for (let i = 0; i < previewCount; i++) {
                const file = uploadedFiles[i];
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';
                
                const url = URL.createObjectURL(file);
                const bboxCount = Math.floor(Math.random() * 3) + 1;
                let bboxesHtml = '';
                
                for (let j = 0; j < bboxCount; j++) {
                    const x = 15 + Math.random() * 50;
                    const y = 15 + Math.random() * 50;
                    const w = 20 + Math.random() * 25;
                    const h = 20 + Math.random() * 25;
                    bboxesHtml += `<div class="bbox" style="left: ${x}%; top: ${y}%; width: ${w}%; height: ${h}%;"></div>`;
                }

                const labelContent = generateLabelContent(bboxCount);

                previewItem.innerHTML = `
                    <div class="preview-image">
                        <img src="${url}" alt="${file.name}">
                        ${bboxesHtml}
                    </div>
                    <div class="preview-info">
                        <div style="font-weight: 600;">${file.name}</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">检测到 ${bboxCount} 个瑕疵</div>
                        <div class="label-content">${labelContent}</div>
                    </div>
                `;
                previewGrid.appendChild(previewItem);
            }

            resultCard.classList.remove('hidden');
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function generateLabelContent(count) {
            let content = '';
            for (let i = 0; i < count; i++) {
                const cx = (0.2 + Math.random() * 0.6).toFixed(6);
                const cy = (0.2 + Math.random() * 0.6).toFixed(6);
                const w = (0.1 + Math.random() * 0.2).toFixed(6);
                const h = (0.1 + Math.random() * 0.2).toFixed(6);
                content += `0 ${cx} ${cy} ${w} ${h}\n`;
            }
            return content.trim();
        }

        startBtn.addEventListener('click', () => {
            simulateProcessing();
        });

        downloadBtn.addEventListener('click', () => {
            addLog('正在生成下载包...', 'info');
            
            setTimeout(() => {
                addLog('数据集打包完成，准备下载...', 'success');
                
                const blob = new Blob([generateDemoDataset()], { type: 'application/zip' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
