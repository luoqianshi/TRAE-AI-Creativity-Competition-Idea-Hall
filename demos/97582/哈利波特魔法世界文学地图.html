    // ==================== State ====================
    let map, markers = {}, userPhotos = {};
    let checkedLocations = JSON.parse(localStorage.getItem('hp-checked') || '{}');
    let userPhotosData = JSON.parse(localStorage.getItem('hp-photos') || '{}');

    // ==================== Init ====================
    function init() {
        createParticles();
        initMap();
        addMarkers();
        updateStats();
        updateFilterCounts();
        bindEvents();
        populateUploadSelect();

        // Hide loading screen
        setTimeout(() => {
            document.getElementById('loading-screen').classList.add('hidden');
        }, 1500);
    }

    // ==================== Particles ====================
    function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            p.style.width = (2 + Math.random() * 3) + 'px';
            p.style.height = p.style.width;
            container.appendChild(p);
        }
    }

    // ==================== Map Init ====================
    function initMap() {
        map = L.map('map', {
            center: [54.5, -3.5],
            zoom: 6,
            zoomControl: false,
            inertia: true,
            inertiaDeceleration: 3000,
            inertiaMaxSpeed: Infinity,
            easeLinearity: 0.25,
            zoomAnimation: true,
            zoomSnap: 1,
            zoomDelta: 1,
            wheelDebounceTime: 40,
            wheelPxPerZoomLevel: 60,
            bounceAtZoomLimits: true,
            maxBounds: [[48, -8], [60, 2]],
            maxBoundsViscosity: 0.5
        });

        // Dark magic-style tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 18,
            minZoom: 5
        }).addTo(map);

        // Zoom control position
        L.control.zoom({ position: 'bottomright' }).addTo(map);
    }

    // ==================== Custom Marker Icon ====================
    function createMagicIcon(isChecked) {
        const glowColor = isChecked ? 'rgba(126,184,255,0.5)' : 'rgba(212,175,55,0.4)';
        const bgColor = isChecked
            ? 'radial-gradient(circle at 30% 30%, #a0d0ff, #7eb8ff, #4a90d9)'
            : 'radial-gradient(circle at 30% 30%, #f0d060, #d4af37, #8B6914)';
        const borderColor = isChecked ? 'rgba(126,184,255,0.5)' : 'rgba(255,255,255,0.3)';
        const icon = isChecked ? '✓' : '⚡';

        return L.divIcon({
            className: 'magic-marker',
            html: `
                <div class="marker-pulse" style="background:${glowColor}"></div>
                <div class="marker-pin" style="background:${bgColor};border-color:${borderColor}">
                    <span class="marker-icon" style="font-size:14px;">${icon}</span>
                </div>
            `,
            iconSize: [36, 36],
            iconAnchor: [18, 36],
            popupAnchor: [0, -36],
            tooltipAnchor: [18, -10]
        });
    }

    // ==================== Add Markers ====================
    function addMarkers() {
        locations.forEach(loc => {
            const isChecked = !!checkedLocations[loc.id];
            const marker = L.marker([loc.lat, loc.lng], {
                icon: createMagicIcon(isChecked)
            }).addTo(map);

            // Tooltip
            marker.bindTooltip(loc.name, {
                direction: 'top',
                offset: [0, -10],
                className: 'magic-tooltip'
            });

            // Popup
            const popupHTML = createPopupHTML(loc, isChecked);
            marker.bindPopup(popupHTML, {
                maxWidth: 320,
                minWidth: 280,
                className: 'magic-popup',
                autoPan: true,
                autoPanPadding: [50, 80]
            });

            marker.on('popupopen', function() {
                bindPopupEvents(loc, marker);
            });

            markers[loc.id] = marker;
        });
    }

    // ==================== Popup HTML ====================
    function createPopupHTML(loc, isChecked) {
        const photos = userPhotosData[loc.id] || [];
        const photosHTML = photos.length > 0 ? `
            <div class="user-photos-section">
                <h4>📸 巫师打卡照 (${photos.length})</h4>
                <div class="user-photos-grid">
                    ${photos.map((p, i) => `
                        <div class="user-photo-item" onclick="window.hpLightbox('${p.data}')">
                            <img src="${p.data}" alt="${p.name || '巫师'}">
                            <div class="photo-overlay">${p.name || '匿名巫师'}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        ` : '';

        const quoteHTML = loc.quote ? `
            <div class="popup-quote">
                "${loc.quote}"
                <span class="q-source">${loc.quoteSource}</span>
            </div>
        ` : '';

        const tagsHTML = `
            <div class="popup-tags">
                ${loc.inFilm ? '<span class="popup-tag film">🎬 电影取景</span>' : '<span class="popup-tag book">📖 书籍场景</span>'}
                ${loc.category.map(c => {
                    const labels = { scotland: '🏔️ 苏格兰', london: '🏙️ 伦敦', castle: '🏰 城堡', york: '🏘️ 约克' };
                    return `<span class="popup-tag">${labels[c] || c}</span>`;
                }).join('')}
            </div>
        `;

        return `
            <div class="popup-content">
                <h3>${loc.name}</h3>
                <div class="popup-subtitle">${loc.nameEn}</div>
                <img class="popup-img" src="${loc.img}" alt="${loc.name}" onerror="this.style.display='none'">
                <div class="popup-tags">
                    <span class="popup-tag film">🎬 ${loc.scene}</span>
                </div>
                <div class="popup-desc">${loc.filmDesc}</div>
                ${quoteHTML}
                ${tagsHTML}
                <div class="popup-desc" style="font-size:12px;color:var(--accent);">💡 ${loc.tips}</div>
                ${photosHTML}
                <div class="popup-actions">
                    <button class="popup-btn primary" onclick="window.hpCheckin('${loc.id}')" ${isChecked ? 'disabled style="opacity:0.5;cursor:default;"' : ''}>
                        ${isChecked ? '✅ 已打卡' : '⚡ 打卡'}
                    </button>
                    <button class="popup-btn" onclick="window.hpUploadFor('${loc.id}')">📸 上传照片</button>
                    <button class="popup-btn" onclick="window.hpFlyTo('${loc.id}')">🔍 放大</button>
                </div>
            </div>
        `;
    }

    // ==================== Bind Popup Events ====================
    function bindPopupEvents(loc, marker) {
        // Events are bound via inline onclick in popup HTML
    }

    // ==================== Global Functions ====================
    window.hpCheckin = function(locId) {
        checkedLocations[locId] = true;
        localStorage.setItem('hp-checked', JSON.stringify(checkedLocations));

        const loc = locations.find(l => l.id === locId);
        if (loc && markers[locId]) {
            markers[locId].setIcon(createMagicIcon(true));
            markers[locId].setPopupContent(createPopupHTML(loc, true));
        }
        updateStats();
        updateFilterCounts();
        showToast('⚡ 已成功打卡: ' + (loc ? loc.name : locId));
    };

    window.hpUploadFor = function(locId) {
        document.getElementById('upload-location').value = locId;
        openModal();
    };

    window.hpFlyTo = function(locId) {
        const loc = locations.find(l => l.id === locId);
        if (loc) {
            map.closePopup();
            map.flyTo([loc.lat, loc.lng], 14, { duration: 1.5 });
            setTimeout(() => {
                if (markers[locId]) markers[locId].openPopup();
            }, 1600);
        }
    };

    window.hpLightbox = function(src) {
        const lb = document.getElementById('lightbox');
        document.getElementById('lightbox-img').src = src;
        lb.classList.add('open');
    };

    // ==================== Events ====================
    function bindEvents() {
        // Start button
        document.getElementById('btn-start').addEventListener('click', function() {
            document.getElementById('intro-overlay').classList.add('hidden');
            // Fly to UK overview
            setTimeout(() => {
                map.flyTo([54.5, -3.5], 6, { duration: 2 });
            }, 300);
        });

        // List panel
        document.getElementById('btn-list').addEventListener('click', function() {
            togglePanel();
            this.classList.toggle('active');
        });
        document.getElementById('panel-close').addEventListener('click', function() {
            closePanel();
            document.getElementById('btn-list').classList.remove('active');
        });

        // Fly to UK
        document.getElementById('btn-fly-uk').addEventListener('click', function() {
            map.closePopup();
            map.flyTo([54.5, -3.5], 6, { duration: 2 });
        });

        // Upload button
        document.getElementById('btn-upload').addEventListener('click', openModal);
        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('upload-cancel').addEventListener('click', closeModal);
        document.getElementById('upload-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Upload zone
        const uploadZone = document.getElementById('upload-zone');
        const uploadFile = document.getElementById('upload-file');
        const uploadPreview = document.getElementById('upload-preview');

        uploadZone.addEventListener('click', () => uploadFile.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        uploadFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Submit upload
        document.getElementById('upload-submit').addEventListener('click', submitUpload);

        // Lightbox
        document.getElementById('lightbox').addEventListener('click', function() {
            this.classList.remove('open');
        });

        // Filter chips
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                const filter = this.dataset.filter;
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                applyFilter(filter);
            });
        });
    }

    // ==================== Panel ====================
    function togglePanel() {
        const panel = document.getElementById('side-panel');
        if (panel.classList.contains('open')) {
            closePanel();
        } else {
            panel.classList.add('open');
            renderPanelList();
        }
    }

    function closePanel() {
        document.getElementById('side-panel').classList.remove('open');
    }

    function renderPanelList(filter) {
        const body = document.getElementById('panel-body');
        const filtered = filter && filter !== 'all'
            ? locations.filter(loc => {
                if (filter === 'checked') return !!checkedLocations[loc.id];
                return loc.category.includes(filter);
            })
            : locations;

        body.innerHTML = filtered.map(loc => {
            const isChecked = !!checkedLocations[loc.id];
            const photos = userPhotosData[loc.id] || [];
            return `
                <div class="location-card" onclick="window.hpFlyTo('${loc.id}'); document.getElementById('side-panel').classList.remove('open'); document.getElementById('btn-list').classList.remove('active');">
                    <img class="location-card-img" src="${loc.img}" alt="${loc.name}" onerror="this.style.display='none'">
                    <div class="location-card-body">
                        <h3>${loc.name}</h3>
                        <span class="scene-tag ${loc.inFilm ? '' : 'book-only'}">${loc.inFilm ? '🎬 电影取景' : '📖 书籍场景'}</span>
                        <p>${loc.filmDesc.substring(0, 80)}...</p>
                        ${loc.quote ? `<div class="quote">"${loc.quote.substring(0, 60)}..."<span class="source">${loc.quoteSource}</span></div>` : ''}
                        <div class="location-card-actions">
                            <button class="card-btn checkin-btn ${isChecked ? 'checked' : ''}" onclick="event.stopPropagation(); window.hpCheckin('${loc.id}')">
                                ${isChecked ? '✅ 已打卡' : '⚡ 打卡'}
                            </button>
                            <button class="card-btn checked-count" onclick="event.stopPropagation(); window.hpUploadFor('${loc.id}')">
                                📸 ${photos.length > 0 ? photos.length + '张' : '上传'}
                            </button>
                            <button class="card-btn" onclick="event.stopPropagation(); window.hpFlyTo('${loc.id}')">
                                🔍 查看
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ==================== Filter ====================
    function applyFilter(filter) {
        locations.forEach(loc => {
            const marker = markers[loc.id];
            if (!marker) return;

            let show = true;
            if (filter === 'checked') {
                show = !!checkedLocations[loc.id];
            } else if (filter !== 'all') {
                show = loc.category.includes(filter);
            }
            if (show) {
                if (!map.hasLayer(marker)) marker.addTo(map);
            } else {
                if (map.hasLayer(marker)) map.removeLayer(marker);
            }
        });

        // Also update panel if open
        if (document.getElementById('side-panel').classList.contains('open')) {
            renderPanelList(filter);
        }
    }

    // ==================== Upload ====================
    let pendingFile = null;

    function openModal() {
        document.getElementById('upload-modal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('upload-modal').classList.remove('open');
        pendingFile = null;
        document.getElementById('upload-preview').style.display = 'none';
        document.getElementById('upload-file').value = '';
        document.getElementById('upload-name').value = '';
        document.getElementById('upload-note').value = '';
    }

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            showToast('⚠️ 请上传图片文件');
            return;
        }
        if (file.size > 10 * 1024 * 1024) {
            showToast('⚠️ 文件大小不能超过 10MB');
            return;
        }
        pendingFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
            const preview = document.getElementById('upload-preview');
            preview.src = e.target.result;
            preview.style.display = 'block';
            document.getElementById('upload-zone').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    function submitUpload() {
        const locId = document.getElementById('upload-location').value;
        if (!locId) {
            showToast('⚠️ 请选择打卡地点');
            return;
        }
        if (!pendingFile) {
            showToast('⚠️ 请上传照片');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            if (!userPhotosData[locId]) userPhotosData[locId] = [];

            // Compress image for localStorage
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxW = 800;
                const scale = Math.min(maxW / img.width, 1);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const compressed = canvas.toDataURL('image/jpeg', 0.7);

                userPhotosData[locId].push({
                    data: compressed,
                    name: document.getElementById('upload-name').value || '匿名巫师',
                    note: document.getElementById('upload-note').value,
                    date: new Date().toLocaleDateString('zh-CN')
                });

                try {
                    localStorage.setItem('hp-photos', JSON.stringify(userPhotosData));
                } catch(e) {
                    // localStorage full, remove oldest photos
                    showToast('⚠️ 存储空间已满，部分旧照片可能被清理');
                    Object.keys(userPhotosData).forEach(k => {
                        if (userPhotosData[k].length > 3) {
                            userPhotosData[k] = userPhotosData[k].slice(-3);
                        }
                    });
                    try {
                        localStorage.setItem('hp-photos', JSON.stringify(userPhotosData));
                    } catch(e2) {
                        showToast('⚠️ 存储空间不足，请清理浏览器数据');
                    }
                }

                // Auto check-in
                if (!checkedLocations[locId]) {
                    window.hpCheckin(locId);
                }

                // Update popup
                const loc = locations.find(l => l.id === locId);
                if (loc && markers[locId]) {
                    markers[locId].setPopupContent(createPopupHTML(loc, !!checkedLocations[locId]));
                }

                updateStats();
                closeModal();
                showToast('✨ 打卡成功！你的魔法时刻已记录');

                // Fly to location
                setTimeout(() => {
                    window.hpFlyTo(locId);
                }, 500);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(pendingFile);
    }

    function populateUploadSelect() {
        const select = document.getElementById('upload-location');
        locations.forEach(loc => {
            const opt = document.createElement('option');
            opt.value = loc.id;
            opt.textContent = `${loc.name} — ${loc.scene}`;
            select.appendChild(opt);
        });
    }

    // ==================== Stats ====================
    function updateStats() {
        const totalLoc = locations.length;
        const totalChecked = Object.keys(checkedLocations).filter(k => locations.some(l => l.id === k)).length;
        let totalPhotos = 0;
        Object.values(userPhotosData).forEach(arr => totalPhotos += arr.length);

        document.getElementById('stat-locations').textContent = totalLoc;
        document.getElementById('stat-checked').textContent = totalChecked;
        document.getElementById('stat-photos').textContent = totalPhotos;
    }

    function updateFilterCounts() {
        document.getElementById('count-all').textContent = locations.length;
        document.getElementById('count-film').textContent = locations.filter(l => l.inFilm).length;
        document.getElementById('count-scotland').textContent = locations.filter(l => l.category.includes('scotland')).length;
        document.getElementById('count-london').textContent = locations.filter(l => l.category.includes('london')).length;
        document.getElementById('count-castle').textContent = locations.filter(l => l.category.includes('castle')).length;
        document.getElementById('count-york').textContent = locations.filter(l => l.category.includes('york')).length;
        document.getElementById('count-checked').textContent = Object.keys(checkedLocations).filter(k => locations.some(l => l.id === k)).length;
    }

    // ==================== Toast ====================
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ==================== Start ====================
    document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
