<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发票号对比工具 — 两表查重</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f5f6fa;
    --card-bg: #ffffff;
    --primary: #4f6ef7;
    --primary-hover: #3b5de7;
    --danger: #e74c3c;
    --success: #27ae60;
    --warning: #f39c12;
    --text: #2c3e50;
    --text-light: #7f8c8d;
    --border: #e1e5eb;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 12px;
    --transition: 0.2s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 6px;
  }
  .header p {
    color: var(--text-light);
    font-size: 15px;
  }

  /* ── Card ── */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .icon { font-size: 20px; }

  /* ── Upload Zone ── */
  .upload-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 640px) {
    .upload-row { grid-template-columns: 1fr; }
  }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color var(--transition), background var(--transition);
    position: relative;
  }
  .upload-zone:hover,
  .upload-zone.dragover {
    border-color: var(--primary);
    background: rgba(79,110,247,0.04);
  }
  .upload-zone.loaded {
    border-color: var(--success);
    border-style: solid;
    background: rgba(39,174,96,0.04);
  }
  .upload-zone input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .upload-zone .upload-icon {
    font-size: 40px;
    margin-bottom: 8px;
  }
  .upload-zone .upload-label {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .upload-zone .upload-hint {
    color: var(--text-light);
    font-size: 13px;
  }
  .upload-zone .file-name {
    margin-top: 8px;
    font-size: 13px;
    color: var(--success);
    font-weight: 500;
  }
  .upload-zone .sheet-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 10px;
    justify-content: center;
  }
  .upload-zone .sheet-tab {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 20px;
    background: #eef0fd;
    color: var(--primary);
    cursor: pointer;
    border: 1px solid transparent;
    transition: all var(--transition);
  }
  .upload-zone .sheet-tab.active {
    background: var(--primary);
    color: #fff;
  }
  .upload-zone .sheet-tab:hover:not(.active) {
    border-color: var(--primary);
  }

  .clear-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    opacity: 0.6;
    z-index: 2;
  }
  .clear-btn:hover { opacity: 1; }

  /* ── Controls ── */
  .controls-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: end;
  }
  @media (max-width: 640px) {
    .controls-row { grid-template-columns: 1fr; }
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
  }
  .field input {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    transition: border-color var(--transition);
    outline: none;
  }
  .field input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,110,247,0.12);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all var(--transition);
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
  }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-sm { padding: 6px 14px; font-size: 13px; }

  /* ── Results ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 640px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
  .stat-box {
    text-align: center;
    padding: 16px 12px;
    border-radius: 10px;
    background: #f8f9fc;
    border: 1px solid var(--border);
  }
  .stat-box .stat-num {
    font-size: 26px;
    font-weight: 700;
  }
  .stat-box .stat-label {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .stat-box.stat-match .stat-num { color: var(--success); }
  .stat-box.stat-only-a .stat-num { color: var(--primary); }
  .stat-box.stat-only-b .stat-num { color: var(--warning); }
  .stat-box.stat-total .stat-num { color: var(--text); }

  /* ── Table ── */
  .table-wrapper {
    max-height: 500px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead {
    position: sticky;
    top: 0;
    z-index: 1;
  }
  th {
    background: #f0f2f8;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid #f0f0f0;
    white-space: nowrap;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  tr:hover td { background: #fafbff; }

  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .tag-match { background: #e8f8ef; color: #1e7e4a; }
  .tag-only-a { background: #eef0fd; color: var(--primary); }
  .tag-only-b { background: #fef5e7; color: #b37400; }

  .section-header {
    font-size: 15px;
    font-weight: 600;
    margin: 20px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-header:first-child { margin-top: 0; }

  /* ── Tabs ── */
  .result-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .result-tab {
    padding: 8px 18px;
    border-radius: 8px 8px 0 0;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #f8f9fc;
    color: var(--text-light);
    transition: all var(--transition);
  }
  .result-tab.active {
    background: var(--card-bg);
    color: var(--primary);
    border-bottom-color: var(--card-bg);
  }
  .result-tab:hover:not(.active) {
    color: var(--primary);
  }
  .result-tab .badge {
    margin-left: 6px;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 10px;
    background: #e1e5eb;
    color: var(--text);
  }
  .result-tab.active .badge { background: #eef0fd; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-light);
  }
  .empty .empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    animation: slideIn 0.3s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .toast-error { background: var(--danger); }
  .toast-success { background: var(--success); }
  .toast-info { background: var(--primary); }

  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .column-hint {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-light);
  }
  .column-hint code {
    background: #f0f2f8;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
  }

  .flex-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .mt-12 { margin-top: 12px; }

  /* ── Cell reference inputs ── */
  .cell-ref-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 4px;
  }
  @media (max-width: 640px) {
    .cell-ref-row { grid-template-columns: 1fr; }
  }
  .cell-ref-hint {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .cell-ref-hint.ok { color: #27ae60; background: #e8f8ef; }
  .cell-ref-hint.err { color: #e74c3c; background: #fdecea; }
  .cell-ref-hint.empty { display: none; }

  /* ── Summary banner ── */
  .summary-banner {
    padding: 16px 20px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 16px;
    display: none;
  }
  .summary-banner.found {
    display: block;
    background: #e8f8ef;
    color: #1e7e4a;
    border: 1px solid #b7e4c7;
  }
  .summary-banner.not-found {
    display: block;
    background: #fef5e7;
    color: #b37400;
    border: 1px solid #fcd9a7;
  }

  /* ── Column preview ── */
  .col-preview {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-light);
    display: none;
    text-align: left;
    max-height: 80px;
    overflow-y: auto;
    padding: 6px 10px;
    background: #f9fafc;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .col-preview.visible { display: block; }
  .col-preview .col-tag {
    display: inline-block;
    background: #eef0fd;
    color: var(--primary);
    padding: 1px 8px;
    border-radius: 10px;
    margin: 2px 3px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .col-preview .col-tag:hover {
    background: var(--primary);
    color: #fff;
  }
  .col-preview .col-preview-title {
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--text);
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>🧾 发票号对比工具</h1>
    <p>上传两个表格，自动找出相同的发票号 — 哪些已报销、哪些重复、哪些遗漏，一目了然</p>
  </div>

  <!-- Step 1: Upload -->
  <div class="card">
    <div class="card-title"><span class="icon">📁</span> 第一步：上传两个含发票号的表格</div>
    <div class="upload-row">
      <!-- File A -->
      <div class="upload-zone" id="zoneA">
        <input type="file" id="fileInputA" accept=".xls,.xlsx,.csv" />
        <div class="upload-icon">📗</div>
        <div class="upload-label">上传 表格 A</div>
        <div class="upload-hint">例如：报销申请表、发票登记表…</div>
        <div class="file-name" id="fileNameA"></div>
        <div class="sheet-tabs" id="sheetTabsA"></div>
        <div class="col-preview" id="colPreviewA"></div>
      </div>
      <!-- File B -->
      <div class="upload-zone" id="zoneB">
        <input type="file" id="fileInputB" accept=".xls,.xlsx,.csv" />
        <div class="upload-icon">📘</div>
        <div class="upload-label">上传 表格 B</div>
        <div class="upload-hint">例如：财务系统导出表、已报销清单…</div>
        <div class="file-name" id="fileNameB"></div>
        <div class="sheet-tabs" id="sheetTabsB"></div>
        <div class="col-preview" id="colPreviewB"></div>
      </div>
    </div>
  </div>

  <!-- Step 2: Cell Reference & Compare -->
  <div class="card">
    <div class="card-title"><span class="icon">🔍</span> 第二步：指定数据起始位置（Excel 单元格坐标）</div>

    <div class="cell-ref-row">
      <div class="field">
        <label for="cellRefA">📗 表格 A — 发票号起始单元格</label>
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="text" id="cellRefA" placeholder="例如: G5" autocomplete="off" style="width:120px;text-transform:uppercase;font-family:monospace;font-size:16px;text-align:center;" />
          <span class="cell-ref-hint" id="cellRefHintA"></span>
        </div>
        <div style="font-size:11px;color:var(--text-light);margin-top:2px;">
          即发票号所在列的第一个数据单元格，如 G 列第 5 行 → G5
        </div>
      </div>
      <div class="field">
        <label for="cellRefB">📘 表格 B — 发票号起始单元格</label>
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="text" id="cellRefB" placeholder="例如: H3" autocomplete="off" style="width:120px;text-transform:uppercase;font-family:monospace;font-size:16px;text-align:center;" />
          <span class="cell-ref-hint" id="cellRefHintB"></span>
        </div>
        <div style="font-size:11px;color:var(--text-light);margin-top:2px;">
          即发票号所在列的第一个数据单元格，如 H 列第 3 行 → H3
        </div>
      </div>
    </div>

    <div class="flex-row mt-12">
      <label style="font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="caseSensitive" />
        区分大小写
      </label>
      <label style="font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="trimSpaces" checked />
        自动去除首尾空格
      </label>
      <button class="btn btn-primary" id="compareBtn" disabled>🔎 查找重复发票号</button>
    </div>
  </div>

  <!-- Step 3: Results -->
  <div class="card" id="resultCard" style="display:none;">
    <div class="card-title"><span class="icon">📋</span> 第三步：发票号查重结果</div>

    <!-- Summary banner -->
    <div class="summary-banner" id="summaryBanner"></div>

    <!-- Stats -->
    <div class="stats-row" id="statsRow"></div>

    <!-- Result Tabs -->
    <div class="result-tabs" id="resultTabs">
      <div class="result-tab active" data-tab="match">
        ✅ 两表都有 <span class="badge" id="badgeMatch">0</span>
      </div>
      <div class="result-tab" data-tab="onlyA">
        ⚠️ 仅在表格 A <span class="badge" id="badgeOnlyA">0</span>
      </div>
      <div class="result-tab" data-tab="onlyB">
        ℹ️ 仅在表格 B <span class="badge" id="badgeOnlyB">0</span>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table id="resultTable">
        <thead id="resultThead"></thead>
        <tbody id="resultTbody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Toast container -->
<div id="toastContainer"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════════════════ */
const state = {
  fileA: { name: '', workbook: null, sheetName: '', values: [], cellRef: '' },
  fileB: { name: '', workbook: null, sheetName: '', values: [], cellRef: '' },
  results: null,   // { match, onlyA, onlyB }
  activeTab: 'match',
};

/* ═══════════════════════════════════════════════════════════════
   DOM refs
   ═══════════════════════════════════════════════════════════════ */
const $ = sel => document.querySelector(sel);

const dom = {
  fileInputA: $('#fileInputA'), fileInputB: $('#fileInputB'),
  zoneA: $('#zoneA'), zoneB: $('#zoneB'),
  fileNameA: $('#fileNameA'), fileNameB: $('#fileNameB'),
  sheetTabsA: $('#sheetTabsA'), sheetTabsB: $('#sheetTabsB'),
  colPreviewA: $('#colPreviewA'), colPreviewB: $('#colPreviewB'),
  cellRefA: $('#cellRefA'), cellRefB: $('#cellRefB'),
  cellRefHintA: $('#cellRefHintA'), cellRefHintB: $('#cellRefHintB'),
  compareBtn: $('#compareBtn'),
  caseSensitive: $('#caseSensitive'),
  trimSpaces: $('#trimSpaces'),
  resultCard: $('#resultCard'),
  summaryBanner: $('#summaryBanner'),
  statsRow: $('#statsRow'),
  resultTabs: $('#resultTabs'),
  resultThead: $('#resultThead'),
  resultTbody: $('#resultTbody'),
  badgeMatch: $('#badgeMatch'), badgeOnlyA: $('#badgeOnlyA'), badgeOnlyB: $('#badgeOnlyB'),
};

/* ═══════════════════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════════════════ */
function toast(msg, type) {
  type = type || 'info';
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  $('#toastContainer').appendChild(el);
  setTimeout(function() { el.remove(); }, 2800);
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function normalizeValue(v) {
  if (v == null) return '';
  var s = String(v);
  if (dom.trimSpaces.checked) s = s.trim();
  if (!dom.caseSensitive.checked) s = s.toLowerCase();
  return s;
}

/* ═══════════════════════════════════════════════════════════════
   Parse cell reference like "G5" → { col: 6, row: 5 }
   A=0, B=1, ..., Z=25, AA=26, ...
   ═══════════════════════════════════════════════════════════════ */
function parseCellRef(ref) {
  if (!ref || typeof ref !== 'string') return null;
  ref = ref.trim().toUpperCase();
  var m = ref.match(/^([A-Z]+)(\d+)$/);
  if (!m) return null;

  var colStr = m[1];
  var rowNum = parseInt(m[2], 10);
  if (rowNum < 1) return null;

  // Convert column letters to 0-based index
  var colIndex = 0;
  for (var i = 0; i < colStr.length; i++) {
    colIndex = colIndex * 26 + (colStr.charCodeAt(i) - 64);
  }
  colIndex -= 1; // 0-based

  return { col: colIndex, row: rowNum };
}

/* ═══════════════════════════════════════════════════════════════
   Read values from sheet starting at cellRef downward until empty
   Returns array of { value, rowNum } objects
   ═══════════════════════════════════════════════════════════════ */
function readColumnFromCell(workbook, sheetName, cellRef) {
  var parsed = parseCellRef(cellRef);
  if (!parsed) return [];

  var sheet = workbook.Sheets[sheetName];
  if (!sheet) return [];

  // Read sheet as array-of-arrays (header:1 → no header, raw rows)
  var aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  if (aoa.length === 0) return [];

  var colIdx = parsed.col;
  var startRow = parsed.row; // 1-based

  var values = [];
  var consecutiveEmpty = 0;
  var MAX_EMPTY = 10; // Stop after 10 consecutive empty cells in this column

  for (var r = startRow - 1; r < aoa.length; r++) {
    var row = aoa[r];
    if (!row) {
      consecutiveEmpty++;
      if (consecutiveEmpty >= MAX_EMPTY) break;
      continue;
    }

    var cellVal = (colIdx < row.length) ? row[colIdx] : '';
    // Treat null/undefined/empty-string/whitespace-only as empty
    var isEmpty = (cellVal === '' || cellVal == null || (typeof cellVal === 'string' && cellVal.trim() === ''));

    if (isEmpty) {
      consecutiveEmpty++;
      if (consecutiveEmpty >= MAX_EMPTY) break;
      continue;
    }

    // Non-empty cell found → reset counter and collect it
    consecutiveEmpty = 0;
    values.push({ value: String(cellVal).trim(), rowNum: r + 1 });
  }

  return values;
}

/* ═══════════════════════════════════════════════════════════════
   Read Excel file
   ═══════════════════════════════════════════════════════════════ */
function readWorkbook(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        resolve(wb);
      } catch (err) {
        reject(new Error('无法解析该文件，请确认是有效的 Excel 或 CSV 文件'));
      }
    };
    reader.onerror = function() { reject(new Error('文件读取失败')); };
    reader.readAsArrayBuffer(file);
  });
}

function getSheetNames(workbook) {
  return workbook.SheetNames || [];
}

/* ═══════════════════════════════════════════════════════════════
   Upload handling
   ═══════════════════════════════════════════════════════════════ */
function loadDataForSide(side) {
  var s = side === 'A' ? state.fileA : state.fileB;
  var input = side === 'A' ? dom.cellRefA : dom.cellRefB;
  var hint = side === 'A' ? dom.cellRefHintA : dom.cellRefHintB;

  s.cellRef = input.value.trim().toUpperCase();
  s.values = [];

  if (!s.workbook || !s.cellRef) {
    hint.className = 'cell-ref-hint empty';
    hint.textContent = '';
  }

  var parsed = parseCellRef(s.cellRef);
  if (!parsed) {
    hint.className = 'cell-ref-hint err';
    hint.textContent = '❌ 格式错误';
    s.values = [];
  } else {
    hint.className = 'cell-ref-hint ok';
    hint.textContent = '✅ ' + toColLetter(parsed.col) + '列 第' + parsed.row + '行';
    s.values = readColumnFromCell(s.workbook, s.sheetName, s.cellRef);
  }

  renderUploadUI(side);
  updateCompareButton();
  if (state.results) { state.results = null; dom.resultCard.style.display = 'none'; }
}

/* ── Convert 0-based column index to letter (0→A, 25→Z, 26→AA) ── */
function toColLetter(idx) {
  var s = '';
  var n = idx;
  do {
    s = String.fromCharCode(65 + (n % 26)) + s;
    n = Math.floor(n / 26) - 1;
  } while (n >= 0);
  return s;
}

async function handleFileUpload(file, side) {
  var s = side === 'A' ? state.fileA : state.fileB;
  s.name = file.name;
  s.workbook = null;
  s.sheetName = '';
  s.values = [];
  s.cellRef = '';

  try {
    var wb = await readWorkbook(file);
    s.workbook = wb;
    var sheets = getSheetNames(wb);
    s.sheetName = sheets[0] || '';
  } catch (err) {
    toast(err.message, 'error');
    s.name = '';
    s.workbook = null;
    s.sheetName = '';
    s.values = [];
    s.cellRef = '';
  }

  // Clear cell ref input
  var input = side === 'A' ? dom.cellRefA : dom.cellRefB;
  var hint = side === 'A' ? dom.cellRefHintA : dom.cellRefHintB;
  input.value = '';
  hint.className = 'cell-ref-hint empty';

  renderUploadUI(side);
  updateCompareButton();
}

function renderUploadUI(side) {
  var s = side === 'A' ? state.fileA : state.fileB;
  var zone = side === 'A' ? dom.zoneA : dom.zoneB;
  var nameEl = side === 'A' ? dom.fileNameA : dom.fileNameB;
  var tabsEl = side === 'A' ? dom.sheetTabsA : dom.sheetTabsB;
  var previewEl = side === 'A' ? dom.colPreviewA : dom.colPreviewB;

  if (s.workbook) {
    zone.classList.add('loaded');
    var cellInfo = s.cellRef ? ' · 起始: ' + s.cellRef : '';
    var countInfo = s.values.length > 0 ? ' · 读取 ' + s.values.length + ' 条' : '';
    nameEl.textContent = '✅ ' + s.name + '  —  工作表: ' + s.sheetName + cellInfo + countInfo;

    // Render sheet tabs
    var sheets = getSheetNames(s.workbook);
    if (sheets.length > 1) {
      tabsEl.innerHTML = sheets.map(function(sh) {
        return '<span class="sheet-tab' + (sh === s.sheetName ? ' active' : '') + '" data-side="' + side + '" data-sheet="' + sh + '">' + sh + '</span>';
      }).join('');
    } else {
      tabsEl.innerHTML = '';
    }

    // Render data preview
    if (s.values.length > 0) {
      var preview = s.values.slice(0, 15).map(function(v) { return escapeHtml(v.value); }).join(' ｜ ');
      if (s.values.length > 15) preview += ' …（共' + s.values.length + '条）';
      previewEl.className = 'col-preview visible';
      previewEl.innerHTML = '<div class="col-preview-title">📌 从 ' + s.cellRef + ' 向下读取（不含表头），共 ' + s.values.length + ' 条数据：</div>' + preview;
    } else if (s.cellRef) {
      previewEl.className = 'col-preview visible';
      previewEl.innerHTML = '<span style="color:#e74c3c;">⚠️ 从 ' + s.cellRef + ' 向下未读到数据，请检查单元格位置</span>';
    } else {
      previewEl.className = 'col-preview visible';
      previewEl.innerHTML = '<span style="color:#999;">💡 请在第二步输入发票号起始单元格（如 G5，即 G 列第 5 行第一个发票号）</span>';
    }
  } else {
    zone.classList.remove('loaded');
    nameEl.textContent = s.name || '';
    tabsEl.innerHTML = '';
    previewEl.className = 'col-preview';
    previewEl.innerHTML = '';
  }
}

/* ── Switch sheet ── */
function switchSheet(side, sheetName) {
  var s = side === 'A' ? state.fileA : state.fileB;
  if (!s.workbook) return;
  s.sheetName = sheetName;
  // Re-read data for current cellRef
  if (s.cellRef) {
    s.values = readColumnFromCell(s.workbook, s.sheetName, s.cellRef);
  }
  renderUploadUI(side);
  updateCompareButton();
  state.results = null;
  dom.resultCard.style.display = 'none';
}

/* ═══════════════════════════════════════════════════════════════
   Compare button state
   ═══════════════════════════════════════════════════════════════ */
function updateCompareButton() {
  var hasA = state.fileA.values.length > 0;
  var hasB = state.fileB.values.length > 0;
  dom.compareBtn.disabled = !(hasA && hasB);
}

/* ═══════════════════════════════════════════════════════════════
   Core: Compare
   ═══════════════════════════════════════════════════════════════ */
function doCompare() {
  var valsA = state.fileA.values;
  var valsB = state.fileB.values;

  if (!valsA.length || !valsB.length) {
    toast('请先为两个表格指定正确的起始单元格', 'error');
    return;
  }

  // Build lookup: normalized value → array of { value, rowNum, side }
  var mapA = new Map();
  for (var i = 0; i < valsA.length; i++) {
    var key = normalizeValue(valsA[i].value);
    if (key === '') continue;
    if (!mapA.has(key)) mapA.set(key, []);
    mapA.get(key).push({ value: valsA[i].value, rowNum: valsA[i].rowNum, side: 'A' });
  }

  var mapB = new Map();
  for (var j = 0; j < valsB.length; j++) {
    var keyB = normalizeValue(valsB[j].value);
    if (keyB === '') continue;
    if (!mapB.has(keyB)) mapB.set(keyB, []);
    mapB.get(keyB).push({ value: valsB[j].value, rowNum: valsB[j].rowNum, side: 'B' });
  }

  var keysA = Array.from(mapA.keys());
  var keysB = Array.from(mapB.keys());
  var setB = new Set(keysB);

  var match = [];
  var onlyA = [];
  var onlyB = [];

  for (var k = 0; k < keysA.length; k++) {
    var ka = keysA[k];
    if (setB.has(ka)) {
      match = match.concat(mapA.get(ka));
      match = match.concat(mapB.get(ka));
    } else {
      onlyA = onlyA.concat(mapA.get(ka));
    }
  }

  var setA = new Set(keysA);
  for (var l = 0; l < keysB.length; l++) {
    var kb = keysB[l];
    if (!setA.has(kb)) {
      onlyB = onlyB.concat(mapB.get(kb));
    }
  }

  state.results = { match: match, onlyA: onlyA, onlyB: onlyB };
  state.activeTab = 'match';
  renderResults();
}

/* ═══════════════════════════════════════════════════════════════
   Render results
   ═══════════════════════════════════════════════════════════════ */
function renderResults() {
  var r = state.results;
  if (!r) return;

  dom.resultCard.style.display = 'block';
  dom.badgeMatch.textContent = new Set(r.match.map(function(x) { return normalizeValue(x.value); })).size;
  dom.badgeOnlyA.textContent = r.onlyA.length;
  dom.badgeOnlyB.textContent = r.onlyB.length;

  // Summary banner
  var matchCount = new Set(r.match.map(function(x) { return normalizeValue(x.value); })).size;
  if (matchCount > 0) {
    dom.summaryBanner.className = 'summary-banner found';
    dom.summaryBanner.innerHTML = '✅ 两个表格存在 <strong>' + matchCount + '</strong> 个相同的发票号';
  } else {
    dom.summaryBanner.className = 'summary-banner not-found';
    dom.summaryBanner.innerHTML = '⚠️ 两个表格 <strong>没有</strong> 相同的发票号';
  }

  dom.statsRow.innerHTML =
    '<div class="stat-box stat-match">' +
      '<div class="stat-num">' + new Set(r.match.map(function(x) { return normalizeValue(x.value); })).size + '</div>' +
      '<div class="stat-label">🔗 重复发票号数量</div>' +
    '</div>' +
    '<div class="stat-box stat-match">' +
      '<div class="stat-num">' + r.match.length + '</div>' +
      '<div class="stat-label">📋 匹配总行数</div>' +
    '</div>' +
    '<div class="stat-box stat-only-a">' +
      '<div class="stat-num">' + r.onlyA.length + '</div>' +
      '<div class="stat-label">📌 仅在表格 A 的发票 (' + (state.fileA.cellRef || '?') + ')</div>' +
    '</div>' +
    '<div class="stat-box stat-only-b">' +
      '<div class="stat-num">' + r.onlyB.length + '</div>' +
      '<div class="stat-label">📌 仅在表格 B 的发票 (' + (state.fileB.cellRef || '?') + ')</div>' +
    '</div>';

  // Highlight active tab
  var tabs = dom.resultTabs.querySelectorAll('.result-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].dataset.tab === state.activeTab);
  }

  renderTable();
}

function renderTable() {
  var r = state.results;
  var rows;
  switch (state.activeTab) {
    case 'onlyA': rows = r.onlyA; break;
    case 'onlyB': rows = r.onlyB; break;
    default:      rows = r.match; break;
  }

  var isMatch = state.activeTab === 'match';

  dom.resultThead.innerHTML =
    '<tr>' +
      (isMatch ? '<th>来源</th>' : '') +
      '<th>发票号</th>' +
      '<th>行号</th>' +
    '</tr>';

  if (rows.length === 0) {
    dom.resultTbody.innerHTML = '<tr><td colspan="' + (isMatch ? 3 : 2) + '" style="text-align:center;padding:32px;color:#999;">没有发现数据 👀</td></tr>';
    return;
  }

  dom.resultTbody.innerHTML = rows.map(function(item) {
    var sourceTag = isMatch
      ? '<td><span class="tag ' + (item.side === 'A' ? 'tag-only-a' : 'tag-only-b') + '">表格 ' + item.side + '</span></td>'
      : '';
    var cellRef = item.side === 'A' ? state.fileA.cellRef : state.fileB.cellRef;
    var colLetter = '';
    var parsed = parseCellRef(cellRef);
    if (parsed) colLetter = toColLetter(parsed.col);
    return '<tr>' +
      sourceTag +
      '<td><strong>' + escapeHtml(String(item.value)) + '</strong></td>' +
      '<td>' + (colLetter || '?') + item.rowNum + '</td>' +
      '</tr>';
  }).join('');
}

/* ═══════════════════════════════════════════════════════════════
   Event listeners
   ═══════════════════════════════════════════════════════════════ */

/* File inputs */
dom.fileInputA.addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  handleFileUpload(file, 'A');
});
dom.fileInputB.addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  handleFileUpload(file, 'B');
});

/* Drag & Drop */
['A', 'B'].forEach(function(side) {
  var zone = side === 'A' ? dom.zoneA : dom.zoneB;
  zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', function() { zone.classList.remove('dragover'); });
  zone.addEventListener('drop', function(e) {
    e.preventDefault();
    zone.classList.remove('dragover');
    var file = e.dataTransfer.files[0];
    if (!file) return;
    handleFileUpload(file, side);
  });
});

/* Sheet tab switching */
document.addEventListener('click', function(e) {
  var tab = e.target.closest('.sheet-tab');
  if (tab) {
    var side = tab.dataset.side;
    var sheet = tab.dataset.sheet;
    switchSheet(side, sheet);
  }
});

/* Cell reference inputs */
dom.cellRefA.addEventListener('input', function() {
  loadDataForSide('A');
});
dom.cellRefB.addEventListener('input', function() {
  loadDataForSide('B');
});

/* Compare button */
dom.compareBtn.addEventListener('click', doCompare);

/* Enter key triggers compare */
dom.cellRefA.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doCompare();
});
dom.cellRefB.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doCompare();
});

/* Checkboxes */
dom.caseSensitive.addEventListener('change', function() {
  if (state.results) doCompare();
});
dom.trimSpaces.addEventListener('change', function() {
  if (state.results) doCompare();
});

/* Result tabs */
dom.resultTabs.addEventListener('click', function(e) {
  var tab = e.target.closest('.result-tab');
  if (!tab) return;
  state.activeTab = tab.dataset.tab;
  var tabs = dom.resultTabs.querySelectorAll('.result-tab');
  for (var i = 0; i < tabs.length; i++) { tabs[i].classList.remove('active'); }
  tab.classList.add('active');
  renderTable();
});

/* ═══════════════════════════════════════════════════════════════
   Init
   ═══════════════════════════════════════════════════════════════ */
updateCompareButton();
</script>

</body>
</html>
