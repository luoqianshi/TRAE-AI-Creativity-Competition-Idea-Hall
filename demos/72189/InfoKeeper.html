<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>InfoKeeper — 个人信息碎片管理器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ===== 容器 ===== */
  .app-container {
    width: 420px;
    max-width: 100vw;
    height: 700px;
    max-height: 100vh;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== 页面容器（滑动） ===== */
  .page-viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #fff;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
  }
  .page-main { transform: translateX(0); }
  .page-detail { transform: translateX(100%); }
  .page-detail.open { transform: translateX(0); }
  .page-main.slide-left { transform: translateX(-30%); }

  /* ===== 主页面 ===== */
  .main-header {
    padding: 20px 20px 12px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .main-header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a2e;
  }
  .main-header .header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .main-header .header-actions button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: #666;
    padding: 4px;
    border-radius: 8px;
    transition: background 0.2s;
    line-height: 1;
  }
  .main-header .header-actions button:hover {
    background: #f0f2f5;
  }

  .group-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
  }
  .group-list::-webkit-scrollbar { width: 4px; }
  .group-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

  .group-item {
    display: flex;
    align-items: center;
    padding: 14px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid #f5f5f5;
  }
  .group-item:hover { background: #f8f9ff; }
  .group-item .icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .group-item .icon.github { background: #2b3137; color: #fff; }
  .group-item .icon.wechat { background: #07c160; color: #fff; }
  .group-item .icon.default { background: #e8f0fe; color: #1a73e8; }

  .group-item .info { flex: 1; min-width: 0; }
  .group-item .info .name { font-size: 15px; font-weight: 600; }
  .group-item .info .preview {
    font-size: 12px; color: #999;
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-item .actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .group-item .actions button {
    background: none; border: none; cursor: pointer;
    font-size: 16px; color: #ccc; padding: 6px;
    border-radius: 8px; transition: all 0.2s; line-height: 1;
  }
  .group-item .actions button.del-btn:hover { color: #e74c3c; background: #fde8e8; }
  .group-item .actions .arrow {
    font-size: 18px; color: #ccc;
    padding: 6px 4px;
  }

  /* ===== 底部添加按钮 ===== */
  .add-group-bar {
    padding: 12px 20px 20px;
    border-top: 1px solid #f0f0f0;
  }
  .add-group-bar button {
    width: 100%;
    padding: 12px;
    border: 2px dashed #d0d5dd;
    border-radius: 12px;
    background: none;
    color: #666;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .add-group-bar button:hover {
    border-color: #1a73e8;
    color: #1a73e8;
    background: #f0f5ff;
  }

  /* ===== 详情页 ===== */
  .detail-header {
    padding: 16px 20px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .detail-header .back-btn {
    background: none; border: none; cursor: pointer;
    font-size: 22px; color: #333; padding: 4px;
    border-radius: 8px; transition: background 0.2s; line-height: 1;
  }
  .detail-header .back-btn:hover { background: #f0f2f5; }
  .detail-header .title {
    flex: 1;
    font-size: 18px; font-weight: 700;
  }
  .detail-header .add-entry-btn {
    background: none; border: none; cursor: pointer;
    font-size: 14px; color: #1a73e8; font-weight: 600;
    padding: 6px 12px; border-radius: 8px;
    transition: background 0.2s;
  }
  .detail-header .add-entry-btn:hover { background: #e8f0fe; }
  .detail-header .del-group-btn {
    background: none; border: none; cursor: pointer;
    font-size: 16px; color: #ccc; padding: 6px;
    border-radius: 8px; transition: all 0.2s; line-height: 1;
  }
  .detail-header .del-group-btn:hover { color: #e74c3c; background: #fde8e8; }

  .entry-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
  }
  .entry-list::-webkit-scrollbar { width: 4px; }
  .entry-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

  .entry-card {
    background: #f8f9fc;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    position: relative;
    transition: background 0.2s;
  }
  .entry-card:hover { background: #f0f2f8; }
  .entry-card .entry-title {
    font-size: 14px; font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .entry-card .entry-title .tag {
    font-size: 11px; font-weight: 400;
    color: #999;
  }
  .entry-card .entry-content {
    font-size: 13px;
    color: #555;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .entry-card .entry-actions {
    position: absolute;
    top: 10px; right: 10px;
    display: flex; gap: 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .entry-card:hover .entry-actions { opacity: 1; }
  .entry-card .entry-actions button {
    background: none; border: none; cursor: pointer;
    font-size: 14px; color: #999; padding: 4px 6px;
    border-radius: 6px; transition: all 0.15s; line-height: 1;
  }
  .entry-card .entry-actions .edit-btn:hover { color: #1a73e8; background: #e8f0fe; }
  .entry-card .entry-actions .del-entry-btn:hover { color: #e74c3c; background: #fde8e8; }

  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; color: #ccc; font-size: 14px;
  }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

  /* ===== 弹窗 ===== */
  .modal-overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1000;
    justify-content: center; align-items: center;
    animation: fadeIn 0.2s ease;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    width: 340px;
    max-width: 90vw;
    box-shadow: 0 12px 48px rgba(0,0,0,0.2);
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
  .modal label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; margin-top: 12px; }
  .modal label:first-of-type { margin-top: 0; }
  .modal input,
  .modal textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .modal input:focus,
  .modal textarea:focus { border-color: #1a73e8; }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal .modal-actions {
    display: flex; gap: 8px;
    margin-top: 18px;
    justify-content: flex-end;
  }
  .modal .modal-actions button {
    padding: 8px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .modal .modal-actions .btn-cancel {
    background: #f0f2f5; color: #666;
  }
  .modal .modal-actions .btn-cancel:hover { background: #e5e7eb; }
  .modal .modal-actions .btn-confirm {
    background: #1a73e8; color: #fff;
  }
  .modal .modal-actions .btn-confirm:hover { background: #1557b0; }
  .modal .modal-actions .btn-danger {
    background: #e74c3c; color: #fff;
  }
  .modal .modal-actions .btn-danger:hover { background: #c0392b; }

  /* ===== 导出/导入 ===== */
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: #323232;
    color: #fff;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ===== 登录页 ===== */
  .login-page {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; justify-content: center; align-items: center;
    z-index: 3000;
  }
  .login-page.hidden { display: none; }
  .login-box {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 36px 32px 32px;
    width: 360px;
    max-width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
    animation: loginFadeIn 0.5s ease;
  }
  @keyframes loginFadeIn {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .login-box .login-icon { font-size: 48px; margin-bottom: 8px; }
  .login-box h2 { font-size: 22px; font-weight: 800; color: #1a1a2e; }
  .login-box .login-sub { font-size: 13px; color: #999; margin: 4px 0 24px; }
  .login-box .login-field { text-align: left; margin-bottom: 16px; }
  .login-box .login-field label {
    display: block; font-size: 13px; font-weight: 600;
    color: #555; margin-bottom: 6px;
  }
  .login-box .login-field input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #e0e0e0; border-radius: 10px;
    font-size: 15px; outline: none;
    transition: border-color 0.2s; background: #f8f9fc;
  }
  .login-box .login-field input:focus { border-color: #1a73e8; background: #fff; }
  .login-box #loginBtn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #1a73e8, #0f3460);
    color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.2s;
    margin-top: 8px;
  }
  .login-box #loginBtn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(26,115,232,0.4);
  }
  .login-box #loginBtn:active { transform: translateY(0); }
  .login-box .login-error {
    font-size: 13px; color: #e74c3c;
    margin-top: 10px; min-height: 22px;
  }
  .login-box .login-hint { font-size: 12px; color: #bbb; margin-top: 12px; }
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <h2>InfoKeeper</h2>
    <p class="login-sub">个人信息碎片管理器</p>
    <div class="login-field">
      <label>账号</label>
      <input type="text" id="loginAccount" placeholder="请输入账号" maxlength="20">
    </div>
    <div class="login-field">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="请输入密码" maxlength="20">
    </div>
    <button id="loginBtn">登 录</button>
    <p class="login-error" id="loginError"></p>
    <p class="login-hint">提示：账号 A123456 / 密码 123456</p>
  </div>
</div>

<div class="app-container" id="appContainer" style="display:none">
  <!-- ===== 页面视口 ===== -->
  <div class="page-viewport">
    <!-- 主页 -->
    <div class="page page-main" id="pageMain">
      <div class="main-header">
        <h1>InfoKeeper</h1>
        <div class="header-actions">
          <button id="exportBtn" title="导出备份">📤</button>
          <button id="importBtn" title="导入备份">📥</button>
        </div>
      </div>
      <div class="group-list" id="groupList"></div>
      <div class="add-group-bar">
        <button id="addGroupBtn">＋ 添加分组</button>
      </div>
    </div>

    <!-- 详情页 -->
    <div class="page page-detail" id="pageDetail">
      <div class="detail-header">
        <button class="back-btn" id="backBtn">‹</button>
        <span class="title" id="detailTitle">分组名称</span>
        <button class="del-group-btn" id="delGroupBtn" title="删除分组">🗑️</button>
        <button class="add-entry-btn" id="addEntryBtn">＋添加</button>
      </div>
      <div class="entry-list" id="entryList"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 弹窗：添加/编辑分组 -->
<div class="modal-overlay" id="groupModal">
  <div class="modal">
    <h3 id="groupModalTitle">新建分组</h3>
    <label>分组名称</label>
    <input id="groupNameInput" placeholder="例如：WeChat、Git、Work" maxlength="30">
    <div class="modal-actions">
      <button class="btn-cancel" id="groupModalCancel">取消</button>
      <button class="btn-confirm" id="groupModalConfirm">确定</button>
    </div>
  </div>
</div>

<!-- 弹窗：添加/编辑条目 -->
<div class="modal-overlay" id="entryModal">
  <div class="modal">
    <h3 id="entryModalTitle">新建条目</h3>
    <label>标题</label>
    <input id="entryTitleInput" placeholder="例：微信号信息、常用指令" maxlength="50">
    <label>内容</label>
    <textarea id="entryContentInput" placeholder="填写详细内容，支持多行"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" id="entryModalCancel">取消</button>
      <button class="btn-confirm" id="entryModalConfirm">确定</button>
    </div>
  </div>
</div>

<!-- 隐藏的 file input -->
<input type="file" id="fileInput" accept=".json" style="display:none">

<script>
// ============================================================
// 数据
// ============================================================
const DEFAULT_DATA = {
  groups: [
    {
      id: genId(),
      name: 'GitHub',
      entries: [
        { id: genId(), title: 'SSH 密钥信息', content: '密钥路径：~/.ssh/id_rsa\n公钥：ssh-rsa AAAA...\n备注：用于 GitHub 代码推送' },
        { id: genId(), title: '常用 Git 命令', content: 'git status — 查看状态\ngit add . — 暂存所有\ngit commit -m "" — 提交\ngit push — 推送' }
      ]
    },
    {
      id: genId(),
      name: 'WeChat',
      entries: [
        { id: genId(), title: '账号信息', content: '微信号：my_wechat\n密码：wechat_pwd123\n绑定手机：138xxxx' },
        { id: genId(), title: '常用指令', content: '朋友圈推文文案生成：xxx\n自动回复设置：xxx' }
      ]
    }
  ]
};

let data = loadData();
let currentGroupId = null;
let editingGroupId = null;   // 编辑分组时的 ID，null 表示新建
let editingEntryId = null;   // 编辑条目时的 ID，null 表示新建

// ============================================================
// 工具函数
// ============================================================
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function loadData() {
  try {
    const raw = localStorage.getItem('infokeeper_data');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.groups && Array.isArray(parsed.groups)) return parsed;
    }
  } catch (e) { /* ignore */ }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveData() {
  localStorage.setItem('infokeeper_data', JSON.stringify(data));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// 渲染：主页
// ============================================================
function getIcon(name) {
  const lower = name.toLowerCase();
  if (lower.includes('github') || lower.includes('git')) return { emoji: '🐙', cls: 'github' };
  if (lower.includes('wechat') || lower.includes('微信')) return { emoji: '💬', cls: 'wechat' };
  return { emoji: '📁', cls: 'default' };
}

function renderMain() {
  const container = document.getElementById('groupList');
  if (!data.groups.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">📂</div>暂无分组，点击下方按钮添加</div>`;
    return;
  }
  container.innerHTML = data.groups.map(g => {
    const icon = getIcon(g.name);
    const preview = g.entries.length ? g.entries[0].title + (g.entries.length > 1 ? ` 等 ${g.entries.length} 项` : '') : '暂无内容';
    return `
      <div class="group-item" data-id="${g.id}">
        <div class="icon ${icon.cls}">${icon.emoji}</div>
        <div class="info">
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="preview">${escapeHtml(preview)}</div>
        </div>
        <div class="actions">
          <button class="del-btn" data-id="${g.id}" title="删除分组">✕</button>
          <span class="arrow">›</span>
        </div>
      </div>
    `;
  }).join('');

  // 点击行 → 进入详情
  container.querySelectorAll('.group-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.del-btn')) return;
      openDetail(el.dataset.id);
    });
  });
  // 删除按钮
  container.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('确定要删除该分组吗？')) {
        data.groups = data.groups.filter(g => g.id !== btn.dataset.id);
        saveData();
        renderMain();
        showToast('已删除');
      }
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// 渲染：详情页
// ============================================================
function renderDetail() {
  const group = data.groups.find(g => g.id === currentGroupId);
  if (!group) { goBack(); return; }

  document.getElementById('detailTitle').textContent = group.name;
  const container = document.getElementById('entryList');

  if (!group.entries.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">📝</div>暂无条目，点击右上角「＋添加」</div>`;
    return;
  }
  container.innerHTML = group.entries.map(e => `
    <div class="entry-card">
      <div class="entry-title">${escapeHtml(e.title)}</div>
      <div class="entry-content">${escapeHtml(e.content)}</div>
      <div class="entry-actions">
        <button class="edit-btn" data-id="${e.id}" title="编辑">✎</button>
        <button class="del-entry-btn" data-id="${e.id}" title="删除">✕</button>
      </div>
    </div>
  `).join('');

  container.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openEntryModal(btn.dataset.id));
  });
  container.querySelectorAll('.del-entry-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (confirm('确定要删除该条目吗？')) {
        const g = data.groups.find(x => x.id === currentGroupId);
        if (g) { g.entries = g.entries.filter(e => e.id !== btn.dataset.id); saveData(); renderDetail(); showToast('已删除'); }
      }
    });
  });
}

// ============================================================
// 页面切换
// ============================================================
function openDetail(groupId) {
  currentGroupId = groupId;
  document.getElementById('pageMain').classList.add('slide-left');
  document.getElementById('pageDetail').classList.add('open');
  renderDetail();
}

function goBack() {
  document.getElementById('pageMain').classList.remove('slide-left');
  document.getElementById('pageDetail').classList.remove('open');
  currentGroupId = null;
}

// ============================================================
// 弹窗：分组
// ============================================================
function openGroupModal(id) {
  editingGroupId = id || null;
  const titleEl = document.getElementById('groupModalTitle');
  const inputEl = document.getElementById('groupNameInput');
  if (id) {
    const g = data.groups.find(x => x.id === id);
    titleEl.textContent = '编辑分组';
    inputEl.value = g ? g.name : '';
  } else {
    titleEl.textContent = '新建分组';
    inputEl.value = '';
  }
  document.getElementById('groupModal').classList.add('show');
  inputEl.focus();
}

document.getElementById('addGroupBtn').addEventListener('click', () => openGroupModal(null));
document.getElementById('groupModalCancel').addEventListener('click', () => {
  document.getElementById('groupModal').classList.remove('show');
});
document.getElementById('groupModalConfirm').addEventListener('click', () => {
  const name = document.getElementById('groupNameInput').value.trim();
  if (!name) { showToast('请输入分组名称'); return; }
  if (editingGroupId) {
    const g = data.groups.find(x => x.id === editingGroupId);
    if (g) g.name = name;
    showToast('已重命名');
  } else {
    data.groups.push({ id: genId(), name, entries: [] });
    showToast('已添加分组');
  }
  saveData();
  renderMain();
  document.getElementById('groupModal').classList.remove('show');
});

// ============================================================
// 弹窗：条目
// ============================================================
function openEntryModal(id) {
  editingEntryId = id || null;
  const titleEl = document.getElementById('entryModalTitle');
  const titleInput = document.getElementById('entryTitleInput');
  const contentInput = document.getElementById('entryContentInput');
  const group = data.groups.find(g => g.id === currentGroupId);

  if (id && group) {
    const entry = group.entries.find(e => e.id === id);
    titleEl.textContent = '编辑条目';
    titleInput.value = entry ? entry.title : '';
    contentInput.value = entry ? entry.content : '';
  } else {
    titleEl.textContent = '新建条目';
    titleInput.value = '';
    contentInput.value = '';
  }
  document.getElementById('entryModal').classList.add('show');
  titleInput.focus();
}

document.getElementById('addEntryBtn').addEventListener('click', () => openEntryModal(null));
document.getElementById('entryModalCancel').addEventListener('click', () => {
  document.getElementById('entryModal').classList.remove('show');
});
document.getElementById('entryModalConfirm').addEventListener('click', () => {
  const title = document.getElementById('entryTitleInput').value.trim();
  const content = document.getElementById('entryContentInput').value.trim();
  if (!title) { showToast('请输入标题'); return; }
  const group = data.groups.find(g => g.id === currentGroupId);
  if (!group) return;

  if (editingEntryId) {
    const entry = group.entries.find(e => e.id === editingEntryId);
    if (entry) { entry.title = title; entry.content = content; }
    showToast('已更新');
  } else {
    group.entries.push({ id: genId(), title, content });
    showToast('已添加条目');
  }
  saveData();
  renderDetail();
  renderMain();
  document.getElementById('entryModal').classList.remove('show');
});

// ============================================================
// 返回按钮
// ============================================================
document.getElementById('backBtn').addEventListener('click', goBack);

// ============================================================
// 删除分组（从详情页）
// ============================================================
document.getElementById('delGroupBtn').addEventListener('click', () => {
  if (!currentGroupId) return;
  if (confirm('确定要删除该分组吗？')) {
    data.groups = data.groups.filter(g => g.id !== currentGroupId);
    saveData();
    renderMain();
    goBack();
    showToast('已删除分组');
  }
});

// ============================================================
// 导出 / 导入
// ============================================================
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `InfoKeeper_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('导出成功');
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (imported && imported.groups && Array.isArray(imported.groups)) {
        if (confirm('导入将覆盖当前数据，确定继续吗？')) {
          data = imported;
          saveData();
          renderMain();
          showToast('导入成功');
        }
      } else {
        showToast('文件格式不正确');
      }
    } catch (err) {
      showToast('文件解析失败');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ============================================================
// 键盘事件：Enter 确认弹窗
// ============================================================
document.getElementById('groupNameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('groupModalConfirm').click();
});
document.getElementById('entryTitleInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('entryContentInput').focus();
  }
});

// ============================================================
// 登录逻辑
// ============================================================
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('loginAccount').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loginPassword').focus();
});

function doLogin() {
  const account = document.getElementById('loginAccount').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errorEl = document.getElementById('loginError');

  if (account === 'A123456' && password === '123456') {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('appContainer').style.display = 'flex';
    renderMain();
  } else if (account !== 'A123456') {
    errorEl.textContent = '⚠️ 账号不存在，请重新输入';
    document.getElementById('loginAccount').focus();
    document.getElementById('loginAccount').select();
  } else {
    errorEl.textContent = '⚠️ 密码错误，请重新输入';
    document.getElementById('loginPassword').focus();
    document.getElementById('loginPassword').select();
  }
}

// 自动聚焦账号输入框
document.getElementById('loginAccount').focus();
</script>
