<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; text-align: center; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.2em; opacity: 0.9; }
        
        .nav { display: flex; background: #f8f9fa; border-bottom: 2px solid #e9ecef; }
        .nav-btn { flex: 1; padding: 20px; border: none; background: none; font-size: 1.1em; cursor: pointer; transition: all 0.3s; color: #495057; }
        .nav-btn:hover { background: #e9ecef; }
        .nav-btn.active { background: white; color: #667eea; border-bottom: 3px solid #667eea; font-weight: bold; }
        
        .content { padding: 40px; }
        .section { display: none; }
        .section.active { display: block; }

        .update-banner { background: linear-gradient(135deg, #28a745 0%, #20c997 100%); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .update-banner.hidden { display: none; }
        .update-text { display: flex; align-items: center; gap: 10px; font-size: 1.1em; }
        .update-btn { background: white; color: #28a745; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        .update-btn:hover { transform: scale(1.05); }
        .version-info { font-size: 0.9em; opacity: 0.8; margin-top: 5px; }
        
        /* 思维导图样式 */
        .mindmap-container { background: #f8f9fa; border-radius: 15px; padding: 30px; }
        .mindmap-center { text-align: center; margin-bottom: 40px; }
        .mindmap-center h2 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 40px; border-radius: 50px; display: inline-block; font-size: 1.5em; }
        .mindmap-branches { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .mindmap-branch { background: white; border-radius: 15px; padding: 25px; border-left: 5px solid #667eea; transition: transform 0.3s, box-shadow 0.3s; }
        .mindmap-branch:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .branch-title { font-size: 1.3em; font-weight: bold; color: #667eea; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .branch-icon { font-size: 1.5em; }
        .branch-topics { list-style: none; }
        .branch-topics li { padding: 10px 15px; margin: 8px 0; background: #f8f9fa; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .branch-topics li:hover { background: #667eea15; }
        .topic-info { display: flex; align-items: center; gap: 8px; }
        .star-high { color: #ff0000; font-size: 1.2em; }
        .star-medium { color: #fd7e14; }
        .star-low { color: #ffc107; }
        .branch-count { float: right; background: #667eea; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.8em; }
        .topic-percent { font-size: 0.85em; color: #6c757d; margin-left: 5px; }

        /* 测试模块样式 */
        .test-selector { background: #f8f9fa; border-radius: 15px; padding: 30px; margin-bottom: 30px; }
        .test-selector h3 { margin-bottom: 20px; color: #495057; }
        .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .subject-card { background: white; border-radius: 12px; padding: 25px; text-align: center; cursor: pointer; transition: all 0.3s; border: 3px solid transparent; }
        .subject-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-color: #667eea; }
        .subject-icon { font-size: 2.5em; margin-bottom: 10px; }
        .subject-name { font-size: 1.1em; font-weight: bold; color: #495057; }
        .subject-count { color: #667eea; font-size: 0.9em; }
        
        .test-container { max-width: 800px; margin: 0 auto; }
        .test-start { text-align: center; padding: 60px 40px; }
        .start-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 20px 60px; font-size: 1.3em; border-radius: 50px; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; margin-top: 30px; }
        .start-btn:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
        
        .question-card { background: #f8f9fa; padding: 30px; border-radius: 15px; margin-bottom: 20px; }
        .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .question-number { background: #667eea; color: white; padding: 5px 15px; border-radius: 20px; display: inline-block; }
        .favorite-btn { background: none; border: none; font-size: 1.5em; cursor: pointer; transition: transform 0.2s; }
        .favorite-btn:hover { transform: scale(1.1); }
        .favorite-btn.favorited { color: #dc3545; }
        .question-text { font-size: 1.2em; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: white; padding: 15px 20px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .option:hover { border-color: #667eea; background: #667eea10; }
        .option.selected { border-color: #667eea; background: #667eea20; }
        .option.correct { border-color: #28a745; background: #28a74515; }
        .option.wrong { border-color: #dc3545; background: #dc354515; }
        .option-label { font-weight: bold; color: #667eea; margin-right: 10px; }
        
        .nav-buttons { display: flex; justify-content: space-between; gap: 20px; margin-top: 30px; }
        .nav-btn-test { flex: 1; padding: 15px 30px; border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer; transition: all 0.3s; }
        .nav-btn-test.prev { background: #6c757d; color: white; }
        .nav-btn-test.next { background: #667eea; color: white; }
        .nav-btn-test.submit { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .nav-btn-test:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .progress-bar { background: #e9ecef; height: 10px; border-radius: 5px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); height: 100%; transition: width 0.3s; }

        /* 结果页样式 */
        .result-container { text-align: center; padding: 40px; }
        .score-display { font-size: 4em; font-weight: bold; color: #667eea; margin: 20px 0; }
        .score-label { font-size: 1.5em; color: #495057; }
        
        .wrong-answers { margin-top: 40px; text-align: left; }
        .wrong-answers h2 { color: #dc3545; margin-bottom: 20px; }
        .wrong-item { background: #fff3cd; padding: 25px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #dc3545; }
        .wrong-item h4 { color: #dc3545; margin-bottom: 10px; }
        .knowledge-point { background: #d4edda; padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 5px solid #28a745; }
        .knowledge-point h5 { color: #28a745; margin-bottom: 8px; }
        
        .restart-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px 40px; font-size: 1.1em; border-radius: 50px; cursor: pointer; margin-top: 30px; transition: transform 0.3s; }
        .restart-btn:hover { transform: scale(1.05); }

        /* 错题/收藏题本样式 */
        .wrongbook-container { max-width: 900px; margin: 0 auto; }
        .wrongbook-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .wrongbook-title { display: flex; align-items: center; gap: 10px; }
        .filter-tabs { display: flex; gap: 10px; }
        .filter-tab { padding: 8px 20px; border: none; border-radius: 20px; cursor: pointer; background: #e9ecef; transition: all 0.2s; }
        .filter-tab.active { background: #667eea; color: white; }
        .wrongbook-stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 30px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 2em; font-weight: bold; }
        .stat-label { font-size: 0.9em; opacity: 0.9; }
        
        .wrongbook-list { list-style: none; }
        .wrongbook-item { background: #fff3cd; padding: 25px; border-radius: 15px; margin-bottom: 20px; border-left: 5px solid #dc3545; }
        .wrongbook-item.favorited { border-left-color: #fd7e14; background: #fff9e6; }
        .wrongbook-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .wrongbook-question { font-size: 1.1em; font-weight: bold; color: #495057; flex: 1; }
        .question-stats { background: white; padding: 10px 15px; border-radius: 8px; font-size: 0.85em; }
        .question-stats div { margin: 3px 0; }
        .wrongbook-meta { font-size: 0.85em; color: #6c757d; margin-top: 10px; }
        .wrongbook-actions { display: flex; gap: 10px; margin-top: 15px; }
        .action-btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95em; transition: all 0.2s; }
        .action-btn.practice { background: #667eea; color: white; }
        .action-btn.remove { background: #dc3545; color: white; }
        .action-btn.favorite { background: #fd7e14; color: white; }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 3px 10px rgba(0,0,0,0.2); }

        /* 做题记录 */
        .history-container { background: #f8f9fa; border-radius: 15px; padding: 30px; }
        .history-container h3 { margin-bottom: 20px; color: #495057; }
        .history-list { list-style: none; }
        .history-item { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .history-info { flex: 1; }
        .history-subject { font-weight: bold; color: #667eea; }
        .history-date { color: #6c757d; font-size: 0.9em; }
        .history-score { font-size: 1.5em; font-weight: bold; color: #28a745; }

        /* 恭喜弹窗 */
        .congratulation-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 60px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; z-index: 1000; }
        .congratulation-modal.show { display: block; }
        .congratulation-icon { font-size: 4em; margin-bottom: 20px; }
        .congratulation-modal h2 { color: #28a745; margin-bottom: 15px; }
        .congratulation-modal p { color: #6c757d; margin-bottom: 30px; }
        .congratulation-modal button { background: #667eea; color: white; border: none; padding: 15px 40px; border-radius: 50px; cursor: pointer; font-size: 1.1em; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .modal-overlay.show { display: block; }
    </style>
</head>

    <div class="container">
        <div class="header">
            <h1>📚 临床科目复习测试系统</h1>
            <p>阶段性复习成果检验 - 兽医执业资格考试</p>

            const savedVersion = localStorage.getItem('appVersion');
            
            if (!savedVersion) {
                // 首次使用
                localStorage.setItem('appVersion', APP_VERSION);
                return;
            }
            
            if (savedVersion !== APP_VERSION) {

            const banner = document.getElementById('updateBanner');

            banner.classList.remove('hidden');
            info.textContent = `从 v${oldVersion} 更新到 v${new_VERSION} | ${UPDATE_NOTES}`;

            // 更新本地版本号
            localStorage.setItem('appVersion', APP_VERSION);

        function generateQuestionSet(subject) {
            const allQuestions = questionBank[subject] || [];
            const wrongQuestions = wrongBook.filter(item => item.subject === subject && !item.isFavorite) || [];
            
            const wrongKnowledgePoints = [...new Set(wrongQuestions.map(item => item.question.knowledgePoint))];
            
            const wrongRelatedQuestions = [];
            if (wrongKnowledgePoints.length > 0) {
                allQuestions.forEach(q => {
                    if (wrongKnowledgePoints.some(kp => q.knowledgePoint.includes(kp.split('-')[0]))) {
                        wrongRelatedQuestions.push(q);
                    }
                });
                wrongQuestions.forEach(item => {
                    if (!wrongRelatedQuestions.find(q => q.id === item.question.id)) {
                        wrongRelatedQuestions.push(item.question);
                    }
                });
            }
            
            const totalCount = Math.min(15, allQuestions.length);
            const wrongRatio = Math.min(0.3, Math.max(0.2, wrongQuestions.length / totalCount));
            const wrongCount = Math.round(totalCount * wrongRatio);
            const normalCount = totalCount - wrongCount;
            
            const shuffledWrong = shuffleArray([...wrongRelatedQuestions]);
            const selectedWrong = shuffledWrong.slice(0, Math.min(wrongCount, shuffledWrong.length));
            
            const normalPool = allQuestions.filter(q => {
                const stats = questionStats[q.id];
                return !stats || stats.attempts === 0 || (stats.correct / stats.attempts) < 0.6;
            });
            
            const shuffledNormal = shuffleArray([...normalPool]);
            
            const selectedNormal = [];
            const selectedIds = new Set(selectedWrong.map(q => q.id));
            
            for (const q of shuffledNormal) {
                if (!selectedIds.has(q.id) && selectedNormal.length < normalCount) {
                    selectedNormal.push(q);
                    selectedIds.add(q.id);
                }
            }
            
            if (selectedNormal.length < normalCount) {
                const remaining = allQuestions.filter(q => !selectedIds.has(q.id));
                for (const q of shuffleArray(remaining)) {
                    if (selectedNormal.length < normalCount) {
                        selectedNormal.push(q);
                        selectedIds.add(q.id);
                    }
                }
            }
            
            const finalQuestions = shuffleArray([...selectedWrong, ...selectedNormal]);
            
            return finalQuestions;
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function toggleFavorite(questionId) {
            const index = favorites.indexOf(questionId);
            if (index === -1) {
                favorites.push(questionId);
                const question = findQuestionById(questionId);
                if (question) {
                    const existingIndex = wrongBook.findIndex(item => item.question.id === questionId);
                    if (existingIndex === -1) {
                        wrongBook.push({
                            question: question,
                            userAnswer: null,
                            subject: getSubjectByQuestionId(questionId),
                            isFavorite: true
                        });
                    }
                }
            } else {
                favorites.splice(index, 1);
                const bookIndex = wrongBook.findIndex(item => item.question.id === questionId && item.isFavorite);
                if (bookIndex !== -1) {
                    wrongBook.splice(bookIndex, 1);
                }
            }
            saveData();
            renderQuestion();
        }

        function findQuestionById(id) {
            for (const subject of Object.values(questionBank)) {
                const question = subject.find(q => q.id === id);
                if (question) return question;
            }
            return null;
        }

        function getSubjectByQuestionId(id) {
            for (const [subject, questions] of Object.entries(questionBank)) {
                if (questions.find(q => q.id === id)) return subject;
            }
            return '';
        }

            userAnswers[currentQuestionIndex] = idx;
            renderQuestion();

            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

            const unanswered = userAnswers.filter(a => a === null).length;

                if (userAnswers[idx] === q.correct) {
                    questionStats[q.id].correct++;

            saveData();

                                </div>
                            </li>
                        `;
                    }).join('')}
                </ul>
            `;
        }

        function setFilter(filter) {
            currentFilter = filter;
            renderWrongBook();
        }

        function addToFavorites(questionId, bookIndex) {
            if (!favorites.includes(questionId)) {
                favorites.push(questionId);
                wrongBook[bookIndex].isFavorite = true;
                saveData();
                renderWrongBook();
            }
        }

        function startPractice(knowledgePoint) {
            const practiceQs = practiceQuestions[knowledgePoint];
            if (!practiceQs || practiceQs.length === 0) {
                alert('暂无该知识点的强化练习题');
                return;
            }
            
            practiceMode = true;
            practiceKnowledgePoint = knowledgePoint;
            currentQuestions = practiceQs.map((q, idx) => ({
                id: 100 + idx,
                question: q.question,
                options: q.options,
                correct: q.correct,
                knowledgePoint: knowledgePoint,
                explanation: '强化练习题'
            }));
            currentQuestionIndex = 0;
            userAnswers = new Array(currentQuestions.length).fill(null);
            testStarted = true;
            testFinished = false;
            showSection('test');
            renderTest();
        }

        function removeFromWrongBook(index) {
            const filteredBook = currentFilter === 'all' ? wrongBook : 
                               currentFilter === 'wrong' ? wrongBook.filter(item => !item.isFavorite) :
                               wrongBook.filter(item => item.isFavorite);
            const actualIndex = wrongBook.indexOf(filteredBook[index]);
            
            if (confirm('确定要移除这道题吗？')) {
                if (wrongBook[actualIndex].isFavorite) {
                    const favIndex = favorites.indexOf(wrongBook[actualIndex].question.id);
                    if (favIndex !== -1) favorites.splice(favIndex, 1);
                }
                wrongBook.splice(actualIndex, 1);
                saveData();
                renderWrongBook();
            }
        }

        function showCongratulation() {
            document.getElementById('modal-overlay').classList.add('show');
            document.getElementById('congratulation-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
            document.getElementById('congratulation-modal').classList.remove('show');
            showSection('wrongbook');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            checkForUpdates();
            renderMindmap();
        });
    </script>
</body>
</html>
