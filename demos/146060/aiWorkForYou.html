<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>废话回收站 · AI嘴替</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 28px 24px 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header p {
            color: #aaa;
            font-size: 13px;
            margin-top: 4px;
            letter-spacing: 2px;
        }
        /* 场景选择 */
        .scene-select {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 18px;
        }
        .scene-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 6px 16px;
            color: #ccc;
            font-size: 13px;
            transition: all 0.2s;
            cursor: pointer;
            flex: 1 0 auto;
        }
        .scene-btn.active {
            background: #f7971e;
            border-color: #f7971e;
            color: #1a1a2e;
            font-weight: 600;
        }
        /* 输入框 */
        .input-area {
            background: rgba(0,0,0,0.3);
            border-radius: 24px;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .input-area textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            resize: none;
            height: 60px;
            line-height: 1.5;
            font-family: inherit;
        }
        .input-area textarea::placeholder {
            color: #666;
            font-size: 14px;
        }
        /* 摇一摇按钮 */
        .shake-area {
            text-align: center;
            margin: 12px 0 20px;
        }
        .shake-btn {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border: none;
            border-radius: 60px;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            box-shadow: 0 8px 24px rgba(247, 151, 30, 0.35);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            width: 80%;
            max-width: 260px;
            letter-spacing: 2px;
        }
        .shake-btn:active {
            transform: scale(0.94);
            box-shadow: 0 4px 12px rgba(247, 151, 30, 0.2);
        }
        .shake-hint {
            color: #888;
            font-size: 12px;
            margin-top: 8px;
        }
        /* 结果展示 */
        .result-box {
            background: rgba(0,0,0,0.35);
            border-radius: 24px;
            padding: 20px;
            margin-top: 16px;
            min-height: 110px;
            border-left: 4px solid #f7971e;
            transition: all 0.3s;
            display: none;
        }
        .result-box.show {
            display: block;
        }
        .result-mode {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .mode-tag {
            background: rgba(247, 151, 30, 0.2);
            padding: 2px 14px;
            border-radius: 12px;
            font-size: 12px;
            color: #ffd200;
            border: 1px solid rgba(247,151,30,0.3);
        }
        .result-text {
            color: #f0f0f0;
            font-size: 17px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .copy-btn {
            background: rgba(255,255,255,0.06);
            border: none;
            border-radius: 16px;
            padding: 6px 18px;
            color: #aaa;
            font-size: 12px;
            margin-top: 12px;
            cursor: pointer;
            float: right;
        }
        .copy-btn:active {
            background: rgba(255,255,255,0.15);
        }
        .footer {
            text-align: center;
            color: #444;
            font-size: 11px;
            margin-top: 24px;
            letter-spacing: 0.5px;
        }
        /* 模拟摇一摇动画 */
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(8deg); }
            50% { transform: rotate(-6deg); }
            75% { transform: rotate(4deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header">
        <h1>🗑️ 废话回收站</h1>
        <p>AI 嘴替 · 摇一摇即出招</p>
    </div>

    <!-- 场景选择 -->
    <div class="scene-select">
        <button class="scene-btn active" data-scene="work">💼 职场</button>
        <button class="scene-btn" data-scene="family">👨‍👩‍👧 家庭</button>
        <button class="scene-btn" data-scene="shopping">🛍️ 消费</button>
        <button class="scene-btn" data-scene="custom">✨ 自定义</button>
    </div>

    <!-- 输入对方说的话 -->
    <div class="input-area">
        <textarea id="userInput" placeholder="输入对方刚刚对你说的话…（例如：你这方案不行啊）" rows="2"></textarea>
    </div>

    <!-- 摇一摇触发 -->
    <div class="shake-area" id="shakeArea">
        <button class="shake-btn" id="shakeBtn">📱 摇一摇 · 生成</button>
        <div class="shake-hint">点击按钮 或 真正摇动手机</div>
    </div>

    <!-- 结果 -->
    <div class="result-box" id="resultBox">
        <div class="result-mode">
            <span class="mode-tag" id="modeTag">💬 高情商捧杀</span>
            <span class="mode-tag" style="background:rgba(255,70,70,0.15);color:#ff6b6b;" id="modeTag2">🔥 发疯文学</span>
            <span class="mode-tag" style="background:rgba(100,200,255,0.15);color:#6bcfff;" id="modeTag3">😶 糊弄学</span>
        </div>
        <div class="result-text" id="resultText">点击“摇一摇”或摇动手机，AI 将为你生成三种话术。</div>
        <button class="copy-btn" id="copyBtn">📋 复制全部</button>
    </div>

    <div class="footer">⭐ 用完即走 · 绝不内耗</div>
</div>

<script>
    // ========== 模拟 AI 话术库（真实场景可接入大模型） ==========
    const mockReplies = {
        work: {
            highEQ: [
                "您说得有道理，不过我从另一个角度补充一下，可能更全面。",
                "感谢指正，我记下了，回头优化时一定重点考虑这块。",
                "这个视角很新颖，我们团队可以借鉴，不过执行上可能需要再细化。"
            ],
            crazy: [
                "啊对对对，您最懂，要不您来写？我给您递键盘。",
                "真是听君一席话，胜读十年书——可惜我书读得少，您能再说一遍吗？",
                "哇，逻辑鬼才！建议您出书，我肯定买来垫桌脚。"
            ],
            fudge: [
                "嗯嗯，好的，我再想想。",
                "有道理，回头我反馈一下。",
                "行，我先记着，后续再说。"
            ]
        },
        family: {
            highEQ: [
                "您说得对，我确实该考虑了，不过现在工作还在上升期，想再沉淀一下。",
                "您这关心我特别感动，不过每个人节奏不一样，我按自己步调来。",
                "哈哈，您说的这个我也想过，但缘分这事儿急不来，对吧？"
            ],
            crazy: [
                "对对对，我明年就结，后年生，大后年离婚，满足您所有KPI。",
                "您这么关心我，不如先帮我把房贷还了？",
                "我其实有对象了，AI，刚领证的，您要看结婚证吗？"
            ],
            fudge: [
                "嗯嗯，随缘吧。",
                "到时候再说。",
                "看情况哈。"
            ]
        },
        shopping: {
            highEQ: [
                "谢谢您的推荐，我回去考虑一下，有需要再来找您。",
                "这款确实不错，不过我的预算有限，下次吧。",
                "您太会说了，我都心动了，可惜今天没带够钱。"
            ],
            crazy: [
                "这东西这么棒，您自己怎么不留着？",
                "我像是有钱人吗？您再推销我就要报警了。",
                "好的，我买了，但我要开发票，抬头写“智商税”。"
            ],
            fudge: [
                "嗯，还行。",
                "我再看看别的。",
                "好吧，谢谢。"
            ]
        },
        custom: {
            highEQ: [
                "我理解你的看法，不过我们可以换个角度想。",
                "你说的有部分对，但整体上我持保留意见。",
                "这个观点很有意思，我需要时间消化一下。"
            ],
            crazy: [
                "你厉害，你全对，我无话可说。",
                "要不你来说？我洗耳恭听。",
                "啊？风太大我没听清。"
            ],
            fudge: [
                "哦，这样啊。",
                "好吧。",
                "行吧。"
            ]
        }
    };

    // 当前场景
    let currentScene = 'work';

    // DOM 元素
    const sceneBtns = document.querySelectorAll('.scene-btn');
    const userInput = document.getElementById('userInput');
    const shakeBtn = document.getElementById('shakeBtn');
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');
    const modeTag = document.getElementById('modeTag');
    const modeTag2 = document.getElementById('modeTag2');
    const modeTag3 = document.getElementById('modeTag3');
    const copyBtn = document.getElementById('copyBtn');
    const shakeArea = document.getElementById('shakeArea');

    // 场景切换
    sceneBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            sceneBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentScene = this.dataset.scene;
            // 清空结果
            resultBox.classList.remove('show');
        });
    });

    // 核心生成函数
    function generateReplies() {
        const inputText = userInput.value.trim() || '（对方说了些话）';
        const sceneData = mockReplies[currentScene] || mockReplies.custom;

        // 随机取一条（真实项目会根据输入语义匹配，此处仅演示）
        const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

        const high = getRandom(sceneData.highEQ);
        const crazy = getRandom(sceneData.crazy);
        const fudge = getRandom(sceneData.fudge);

        // 显示结果
        resultText.innerHTML = `
            💬 高情商捧杀：${high}\n\n
            🔥 发疯文学：${crazy}\n\n
            😶 糊弄学大法：${fudge}
        `;
        resultBox.classList.add('show');

        // 更新标签（可不用改）
        modeTag.textContent = '💬 高情商捧杀';
        modeTag2.textContent = '🔥 发疯文学';
        modeTag3.textContent = '😶 糊弄学';

        // 添加摇动反馈动画
        shakeArea.classList.remove('shake-animation');
        void shakeArea.offsetWidth; // 触发回流
        shakeArea.classList.add('shake-animation');
    }

    // 按钮点击
    shakeBtn.addEventListener('click', generateReplies);

    // ========== 手机摇一摇 (DeviceMotion) ==========
    let lastShakeTime = 0;
    let shakeThreshold = 15; // 加速度变化阈值

    if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', function(event) {
            const acc = event.accelerationIncludingGravity;
            const total = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
            const now = Date.now();

            if (total > shakeThreshold && now - lastShakeTime > 800) {
                lastShakeTime = now;
                // 触发生成（但防止误触，仅在页面可见时）
                if (!resultBox.classList.contains('show') || confirm('再摇一次生成新话术？')) {
                    generateReplies();
                }
            }
        }, false);
    } else {
        console.log('设备不支持摇一摇');
    }

    // 复制功能
    copyBtn.addEventListener('click', function() {
        const text = resultText.innerText;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ 话术已复制，快去用吧！');
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    });

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        alert('✅ 已复制！');
    }

    // 键盘快捷键：回车（Ctrl+Enter）触发
    userInput.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            generateReplies();
        }
    });

    // 预设示例（方便演示）
    userInput.placeholder = '例如：你这方案不行啊 / 你怎么还不结婚 / 这衣服多适合你';
</script>

</body>
</html>
