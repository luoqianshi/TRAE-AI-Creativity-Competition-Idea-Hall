<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Get PDF - Demo</title>
  <style>
    @import url('https://fonts.googleapis.cn/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@300;0,400;0,500;0,600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-color: #e5e0d8;
      outline-color: rgba(196, 69, 54, 0.5);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Work Sans', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
      background-color: #fdfbf7;
      color: #1a1817;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: hsl(8 55% 50% / 0.15); color: #1a1817; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e5e0d8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #d5cfc5; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: #fdfbf7;
      overflow: hidden;
    }

    /* ========== Tab Bar ========== */
    .tab-bar {
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(229, 224, 216, 0.6);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      height: 40px;
      user-select: none;
    }

    .logo { display: flex; align-items: center; padding: 0 12px; flex-shrink: 0; }
    .logo h1 {
      font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
      font-size: 16px; font-style: italic; letter-spacing: -0.01em; font-weight: 400;
    }
    .logo h1 .accent { font-weight: 600; font-style: normal; color: #c44536; }

    .tab-divider { margin: 10px 0; width: 1px; background: rgba(229, 224, 216, 0.5); flex-shrink: 0; }

    .tab-list {
      display: flex; flex: 1; align-items: flex-end; overflow-x: auto;
      padding: 0 4px; gap: 1px; scrollbar-width: none;
    }
    .tab-list::-webkit-scrollbar { display: none; }

    .tab-item {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 6px 6px 12px; border-radius: 8px 8px 0 0;
      cursor: pointer; transition: all 0.2s; max-width: 200px; min-width: 80px;
    }
    .tab-item.active { background: #fdfbf7; color: #1a1817; box-shadow: 0 1px 2px hsl(30 8% 90% / 0.6); }
    .tab-item:not(.active) { color: #8b8680; }
    .tab-item:not(.active):hover { background: rgba(243, 240, 234, 0.5); color: rgba(26, 24, 23, 0.7); }

    .tab-icon { width: 12px; height: 12px; flex-shrink: 0; opacity: 0.5; }
    .tab-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ========== Content Area ========== */
    .content-area { position: relative; flex: 1; overflow: hidden; }

    /* ========== Player Layout ========== */
    .player {
      position: relative; display: flex; height: 100%; width: 100%;
      background: #fdfbf7; overflow: hidden;
    }

    /* ========== Sidebar ========== */
    .sidebar {
      flex-shrink: 0; overflow-y: auto;
      border-right: 1px solid rgba(229, 224, 216, 0.5);
      background: rgba(255, 255, 255, 0.3); width: 176px; padding: 8px;
    }
    .sidebar-list { display: flex; flex-direction: column; gap: 8px; }

    .page-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      border-radius: 8px; transition: all 0.3s; padding: 8px;
      border: none; background: none; cursor: pointer;
    }
    .page-btn:hover { background: rgba(255, 255, 255, 0.8); }
    .page-btn.active { background: rgba(196, 69, 54, 0.08); box-shadow: inset 0 0 0 1px rgba(196, 69, 54, 0.3); }

    .page-thumb {
      position: relative; width: 100%; overflow: hidden;
      border: 1px solid rgba(229, 224, 216, 0.5); border-radius: 4px;
      background: rgba(243, 240, 234, 0.3); aspect-ratio: 3/4;
    }
    .page-thumb img { width: 100%; height: 100%; object-fit: contain; }
    .page-thumb-placeholder {
      display: flex; width: 100%; height: 100%; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(139, 134, 128, 0.4);
    }
    .page-num {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      font-variant-numeric: tabular-nums; color: #8b8680;
    }
    .page-btn.active .page-num { color: #c44536; font-weight: 500; }

    /* ========== PDF Canvas Area ========== */
    .pdf-area {
      position: relative; flex: 1; display: flex;
      align-items: center; justify-content: center; overflow: hidden; padding: 0;
    }
    .pdf-canvas { position: relative; z-index: 1; }

    /* ========== Loading ========== */
    .loading-overlay { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .loading-spinner { position: relative; width: 48px; height: 48px; }
    .loading-spinner::before { content: ''; position: absolute; inset: 0; border: 2px solid rgba(196, 69, 54, 0.2); border-radius: 50%; }
    .loading-spinner::after { content: ''; position: absolute; inset: 0; border: 2px solid transparent; border-top-color: #c44536; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-style: italic; color: #8b8680; }

    /* ========== Error Overlay ========== */
    .error-overlay {
      display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 40px; max-width: 500px;
    }
    .error-overlay h3 {
      font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; color: #c44536;
    }
    .error-overlay p { font-size: 14px; color: #8b8680; text-align: center; line-height: 1.6; }
    .error-overlay input {
      width: 100%; padding: 10px 14px; border: 1px solid #e5e0d8; border-radius: 8px;
      font-size: 12px; font-family: 'JetBrains Mono', monospace; color: #3d3a37;
      background: #fff; outline: none;
    }
    .error-overlay input:focus { border-color: #c44536; }
    .error-overlay button {
      padding: 10px 24px; border: none; border-radius: 20px;
      background: #c44536; color: #fdfbf7; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .error-overlay button:hover { background: #a0352a; }

    /* ========== Subtitle ========== */
    .subtitle-container {
      position: absolute; left: 50%; z-index: 40; transform: translateX(-50%);
      width: 95%; bottom: 76px; pointer-events: none; animation: fade-in 0.8s ease-out both;
    }
    .subtitle-text {
      text-align: center; font-weight: 600; letter-spacing: 0.02em; line-height: 1.6;
      max-width: 30em; margin: 0 auto; font-size: clamp(28px, 2.3vw, 44px);
      color: rgba(255, 255, 255, 0.95);
      -webkit-text-stroke: 1px rgba(0, 0, 0, 0.9); paint-order: stroke fill;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .subtitle-text.user { -webkit-text-stroke: 1px rgba(196, 69, 54, 0.9); }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* ========== Action Button ========== */
    .btn-container {
      position: absolute; left: 50%; z-index: 40; transform: translateX(-50%);
      bottom: 32px; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
    }
    .action-btn {
      position: relative; display: flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 16px; font-family: 'Work Sans', sans-serif;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transition: all 0.3s;
      height: 38px; width: 338px; font-size: 12px;
      border: 1px solid rgba(196, 69, 54, 0.28); background: rgba(253, 251, 247, 0.62);
      color: #c44536;
      box-shadow: 0 10px 28px -8px rgba(196,69,54,0.25), 0 0 0 1px rgba(196,69,54,0.1), inset 0 1px 0 rgba(255,255,255,0.6);
      cursor: pointer;
    }
    .action-btn:active { transform: scale(0.97); }

    .btn-glow {
      position: absolute; inset: -4px; border-radius: 16px; pointer-events: none;
      filter: blur(8px); z-index: -1;
    }
    .btn-glow.breathe { background: linear-gradient(90deg, rgba(196,69,54,0.4), rgba(196,69,54,0.25)); animation: idle-breathe 2.8s ease-in-out infinite; }
    .btn-glow.faint { background: linear-gradient(90deg, rgba(196,69,54,0.35), rgba(196,69,54,0.22)); animation: paused-faint 3.4s ease-in-out infinite; }
    .btn-glow.blink { background: linear-gradient(90deg, rgba(196,69,54,0.5), rgba(196,69,54,0.35)); animation: rec-blink 0.9s ease-in-out infinite; }

    @keyframes idle-breathe { 0%,100%{opacity:.4;transform:scale(1);} 50%{opacity:.65;transform:scale(1.015);} }
    @keyframes paused-faint { 0%,100%{opacity:.4;transform:scale(1);} 50%{opacity:.6;transform:scale(1.02);} }
    @keyframes rec-blink { 0%,100%{opacity:1;} 50%{opacity:.7;} }

    .eq-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
    .eq-bar { display: inline-block; background: #c44536; border-radius: 1.5px; width: 3px; transform-origin: bottom; animation: eq-bounce 1s ease-in-out infinite; }
    @keyframes eq-bounce { 0%,100%{transform:scaleY(.28);opacity:.6;} 50%{transform:scaleY(1);opacity:1;} }

    .ripple { position: absolute; inset: 0; border-radius: 16px; border: 2px solid #c44536; pointer-events: none; animation: ripple-out 1.4s ease-out infinite; }
    @keyframes ripple-out { 0%{transform:scale(1);opacity:.5;} 100%{transform:scale(1.08);opacity:0;} }

    .rec-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c44536; animation: rec-blink 0.9s ease-in-out infinite; }

    .load-dots { display: inline-flex; align-items: center; gap: 4px; }
    .load-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: #c44536; animation: load-bounce 1.2s ease-in-out infinite; }
    @keyframes load-bounce { 0%,80%,100%{transform:translateY(0);opacity:.35;} 40%{transform:translateY(-5px);opacity:1;} }

    .mic-pulse { animation: mic-pulse 2.6s ease-in-out infinite; }
    @keyframes mic-pulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.04);opacity:.85;} }

    .icon-play { width: 16px; height: 16px; fill: currentColor; }
    .icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 14px; height: 14px; }
    .icon-xs { width: 12px; height: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <!-- ===== Tab Bar ===== -->
    <header class="tab-bar">
      <div class="logo">
        <h1>Get <span class="accent">PDF</span></h1>
      </div>
      <div class="tab-divider"></div>
      <div class="tab-list" id="tabList">
        <div class="tab-item active">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span class="tab-title">getpdf</span>
        </div>
      </div>
    </header>

    <!-- ===== Content Area ===== -->
    <div class="content-area">
      <div class="player">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-list" id="sidebarList"></div>
        </aside>

        <!-- PDF Canvas Area -->
        <main class="pdf-area" id="pdfArea">
          <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <p class="loading-text">正在加载...</p>
          </div>
          <canvas class="pdf-canvas" id="pdfCanvas" style="display: none;"></canvas>
        </main>

        <!-- Subtitle -->
        <div class="subtitle-container" id="subtitleContainer">
          <p class="subtitle-text" id="subtitleText">这里是字幕</p>
        </div>

        <!-- Action Button -->
        <div class="btn-container" id="btnContainer">
          <button class="action-btn" id="actionBtn">
            <span class="btn-glow breathe"></span>
            <svg class="icon-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <span>按空格开始播报</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- PDF.js v3 (local, no CDN needed) -->
  <script src="./pdf.min.js"></script>
  <script src="./pdf.worker.min.js"></script>
  <!-- PDF data as base64 (avoids file:// XHR restrictions) -->
  <script src="./pdf-data.js"></script>

  <script>
    // ========== Config ==========
    // PDF is loaded from base64 to support file:// protocol

    // ========== State ==========
    const states = ['idle', 'playing', 'paused', 'finished', 'recording', 'answering'];
    let currentStateIdx = 0;
    let currentPage = 1;
    let totalPages = 0;
    let pdfDoc = null;
    let thumbnails = new Map();

    // ========== DOM ==========
    const sidebarList = document.getElementById('sidebarList');
    const pdfArea = document.getElementById('pdfArea');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const pdfCanvas = document.getElementById('pdfCanvas');
    const subtitleText = document.getElementById('subtitleText');
    const actionBtn = document.getElementById('actionBtn');

    // ========== PDF.js Setup (v3 UMD, local) ==========
    // Both pdf.min.js and pdf.worker.min.js loaded via <script> tags
    // This enables "fake worker" mode (main thread) for file:// compatibility
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = '';
    }

    // ========== SVG Icons ==========
    const icons = {
      play: '<svg class="icon-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>',
      mic: '<svg class="icon-sm mic-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>',
    };

    // ========== PDF Loading (from base64) ==========
    async function loadPdf() {
      if (typeof pdfjsLib === 'undefined') {
        showError('PDF.js 加载失败', '本地 pdf.min.js 文件缺失，请检查 demo 文件夹');
        return;
      }
      if (typeof window.PDF_BASE64 === 'undefined') {
        showError('PDF 数据加载失败', 'pdf-data.js 文件缺失，请检查 demo 文件夹');
        return;
      }

      try {
        // Decode base64 to Uint8Array
        const binaryString = window.atob(window.PDF_BASE64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }

        const loadingTask = pdfjsLib.getDocument({
          data: bytes,
          useSystemFonts: true,
        });
        pdfDoc = await loadingTask.promise;
        totalPages = pdfDoc.numPages;

        loadingOverlay.style.display = 'none';
        pdfCanvas.style.display = 'block';

        await renderPage(1);
        generateThumbnails();
      } catch (err) {
        console.error('PDF loading error:', err);
        showError('PDF 加载失败', err.message || '未知错误');
      }
    }

    function showError(title, msg, allowInput = false) {
      let html = `<div class="error-overlay"><h3>${title}</h3><p>${msg}</p>`;
      if (allowInput) {
        html += `
          <input type="text" id="pdfUrlInput" placeholder="粘贴新的 PDF 预签名 URL..." style="margin-top:8px;">
          <button id="retryBtn">加载 PDF</button>
        `;
      }
      html += `</div>`;
      loadingOverlay.innerHTML = html;
      loadingOverlay.style.display = 'flex';

      if (allowInput) {
        const input = document.getElementById('pdfUrlInput');
        const btn = document.getElementById('retryBtn');
        btn.addEventListener('click', () => {
          const url = input.value.trim();
          if (!url) { input.focus(); return; }
          PDF_URL = url;
          loadingOverlay.innerHTML = '<div class="loading-spinner"></div><p class="loading-text">正在加载...</p>';
          loadPdf();
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') btn.click();
        });
      }
    }

    // ========== Render PDF Page ==========
    async function renderPage(pageNum) {
      if (!pdfDoc) return;
      const page = await pdfDoc.getPage(pageNum);
      const baseViewport = page.getViewport({ scale: 1 });

      const containerW = pdfArea.clientWidth;
      const containerH = pdfArea.clientHeight;
      if (containerW === 0 || containerH === 0) return;

      const scaleW = containerW / baseViewport.width;
      const scaleH = containerH / baseViewport.height;
      const padding = 0.97;
      let scale = Math.min(scaleW, scaleH) * padding;
      scale = Math.max(0.5, scale);

      const dpr = window.devicePixelRatio || 1;
      const renderScale = scale * dpr;
      const viewport = page.getViewport({ scale: renderScale });

      const ctx = pdfCanvas.getContext('2d');
      pdfCanvas.width = viewport.width;
      pdfCanvas.height = viewport.height;
      pdfCanvas.style.width = `${baseViewport.width * scale}px`;
      pdfCanvas.style.height = `${baseViewport.height * scale}px`;

      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    // ========== Thumbnails ==========
    async function generateThumbnails() {
      const BATCH_SIZE = 5;
      for (let batchStart = 1; batchStart <= totalPages; batchStart += BATCH_SIZE) {
        const batchEnd = Math.min(batchStart + BATCH_SIZE - 1, totalPages);
        for (let i = batchStart; i <= batchEnd; i++) {
          try {
            const page = await pdfDoc.getPage(i);
            const viewport = page.getViewport({ scale: 0.3 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;
            thumbnails.set(i, canvas.toDataURL('image/jpeg', 0.7));
          } catch { /* ignore */ }
        }
        renderSidebar();
        await new Promise(r => setTimeout(r, 0));
      }
    }

    // ========== Sidebar ==========
    function renderSidebar() {
      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        const thumb = thumbnails.get(i);
        html += `
          <button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">
            <div class="page-thumb">
              ${thumb ? `<img src="${thumb}" alt="第 ${i} 页">` : '<div class="page-thumb-placeholder">...</div>'}
            </div>
            <span class="page-num">${i}</span>
          </button>
        `;
      }
      sidebarList.innerHTML = html;
      sidebarList.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentPage = parseInt(btn.dataset.page);
          renderPage(currentPage);
          renderSidebar();
        });
      });
    }

    // ========== Button State ==========
    function renderButton() {
      const state = states[currentStateIdx];
      let glowClass = '';
      let innerHTML = '';

      switch (state) {
        case 'idle':
          glowClass = 'breathe';
          innerHTML = `${icons.play}<span>按空格开始播报</span>`;
          break;
        case 'playing':
          glowClass = 'breathe';
          innerHTML = `<span class="eq-bars">
            <span class="eq-bar" style="height:60%;animation-delay:0ms;"></span>
            <span class="eq-bar" style="height:100%;animation-delay:180ms;"></span>
            <span class="eq-bar" style="height:75%;animation-delay:360ms;"></span>
            <span class="eq-bar" style="height:90%;animation-delay:120ms;"></span>
          </span><span>点击暂停 · 长按说话</span>`;
          break;
        case 'paused':
          glowClass = 'faint';
          innerHTML = `${icons.play}<span>点击继续 · 长按说话</span>`;
          break;
        case 'finished':
          glowClass = 'faint';
          innerHTML = `${icons.mic}<span>长按说话</span>`;
          break;
        case 'recording':
          glowClass = 'blink';
          innerHTML = `<span class="ripple"></span><span class="ripple" style="animation-delay:800ms;"></span><span class="rec-dot"></span><span>识别中 · 松开发送</span>`;
          break;
        case 'answering':
          glowClass = 'breathe';
          innerHTML = `<span class="load-dots">
            <span class="load-dot" style="animation-delay:0ms;"></span>
            <span class="load-dot" style="animation-delay:160ms;"></span>
            <span class="load-dot" style="animation-delay:320ms;"></span>
          </span><span>AI回复中</span>`;
          break;
      }
      actionBtn.innerHTML = `<span class="btn-glow ${glowClass}"></span>${innerHTML}`;
    }

    // ========== Cycle State ==========
    function cycleState() {
      currentStateIdx = (currentStateIdx + 1) % states.length;
      renderButton();
      const state = states[currentStateIdx];
      if (state === 'recording') {
        subtitleText.classList.add('user');
      } else {
        subtitleText.classList.remove('user');
      }
    }

    actionBtn.addEventListener('click', cycleState);

    // ========== Keyboard: Space to cycle ==========
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat) {
        e.preventDefault();
        cycleState();
      }
    });

    // ========== Resize ==========
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (pdfDoc) renderPage(currentPage); }, 200);
    });

    // ========== Init ==========
    loadPdf();
  </script>
</body>
</html>
