<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>故事百宝箱 - 监护人首页</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/voice-assistant.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

  :root {
    --primary: #5b6cf9;
    --primary-dark: #4a5de0;
    --primary-light: #e8eaf6;
    --accent: #ff6b6b;
    --warm: #ff9a56;
    --bg: #f8f9fc;
    --white: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --text-light: #9ca3af;
    --border: #e5e7eb;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow: 0 8px 32px rgba(0,0,0,0.08);
    --radius: 20px;
    --radius-sm: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 80px;
    overflow-x: hidden;
  }

  /* ===== 顶部问候区 ===== */
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    padding: 28px 24px 50px;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -30px;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -20px; left: -20px;
    width: 80px; height: 80px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .greeting h1 {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .greeting p {
    color: rgba(255,255,255,0.75);
    font-size: 13px;
  }

  .header-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    text-decoration: none;
  }

  .header-wave {
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 30px;
  }

  .header-wave svg {
    width: 100%; height: 100%; display: block;
  }

  /* ===== 情绪预警通知 ===== */
  .alert-section {
    padding: 0 20px;
    margin-top: -24px;
    position: relative;
    z-index: 2;
  }

  .alert-card {
    background: linear-gradient(135deg, #fff8e1, #fff3cd);
    border-radius: var(--radius-sm);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid rgba(255,193,7,0.25);
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .alert-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }

  .alert-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(245,124,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .alert-content {
    flex: 1;
  }

  .alert-content h4 {
    font-size: 14px;
    font-weight: 600;
    color: #5d4037;
    margin-bottom: 2px;
  }

  .alert-content p {
    font-size: 12px;
    color: #8d6e63;
  }

  .alert-arrow {
    color: #bcaaa4;
    font-size: 14px;
  }

  /* ===== 我的家人区域 ===== */
  .family-section {
    padding: 20px 20px 0;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .section-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }

  .section-action {
    font-size: 13px;
    color: var(--primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .family-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }

  .family-scroll::-webkit-scrollbar { display: none; }

  .family-card {
    flex-shrink: 0;
    width: 100px;
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 16px 12px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: inherit;
  }

  .family-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
    border-color: var(--primary-light);
  }

  .family-card .family-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 10px;
    position: relative;
  }

  .family-card .family-avatar .mood-dot {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #52c41a;
    border: 2px solid var(--white);
  }

  .family-card .family-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  .family-card .family-status {
    font-size: 11px;
    color: var(--text-light);
  }

  /* 添加家人卡片 */
  .family-card.add {
    border: 2px dashed var(--border);
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 140px;
  }

  .family-card.add .add-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--primary-light);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 8px;
  }

  .family-card.add .add-text {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* ===== 今日动态 ===== */
  .today-section {
    padding: 20px 20px 0;
  }

  .today-card {
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .today-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }

  .today-card .today-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .today-card .today-info {
    flex: 1;
  }

  .today-card .today-info h4 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  .today-card .today-info p {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .today-card .today-time {
    font-size: 11px;
    color: var(--text-light);
    flex-shrink: 0;
  }

  /* ===== 快捷操作 ===== */
  .quick-section {
    padding: 20px 20px 0;
  }

  .quick-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .quick-item {
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 20px 8px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    color: inherit;
    transition: all 0.3s ease;
    border: 1px solid var(--border);
    cursor: pointer;
  }

  .quick-item:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }

  .quick-item .qi-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
    font-size: 18px;
  }

  .quick-item:nth-child(1) .qi-icon { background: linear-gradient(135deg, #e8eaf6, #c5cae9); color: var(--primary); }
  .quick-item:nth-child(2) .qi-icon { background: linear-gradient(135deg, #fff3e0, #ffe0b2); color: #ff9800; }
  .quick-item:nth-child(3) .qi-icon { background: linear-gradient(135deg, #fce4ec, #f8bbd0); color: #e91e63; }

  .quick-item .qi-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  /* ===== 亲情陪伴入口 ===== */
  .companion-section {
    padding: 20px 20px 0;
  }

  .companion-card-large {
    display: flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, var(--warm), #ff6b9d);
    border-radius: var(--radius-sm);
    padding: 20px 22px;
    text-decoration: none;
    color: #fff;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px rgba(255,107,157,0.25);
    cursor: pointer;
  }

  .companion-card-large:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255,107,157,0.35);
  }

  .companion-card-large .companion-icon {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .companion-card-large .companion-text {
    flex: 1;
  }

  .companion-card-large .companion-text h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .companion-card-large .companion-text p {
    font-size: 12px;
    opacity: 0.9;
  }

  .companion-card-large .companion-arrow {
    font-size: 18px;
    opacity: 0.7;
  }

  /* ===== 底部 Tab ===== */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    height: 64px;
    background: var(--white);
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px var(--shadow-sm);
    z-index: 100;
  }

  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    padding: 4px 16px;
    text-decoration: none;
    color: var(--text-light);
    transition: color 0.2s;
  }

  .tab-item .icon {
    font-size: 20px;
    margin-bottom: 2px;
  }

  .tab-item .label {
    font-size: 11px;
  }

  .tab-item.active {
    color: var(--primary);
  }

  .tab-item.active .icon {
    filter: drop-shadow(0 0 4px rgba(91,108,249,0.3));
  }

  /* ===== 动画 ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .alert-section { animation: fadeInUp 0.5s ease 0.1s both; }
  .family-section { animation: fadeInUp 0.5s ease 0.2s both; }
  .today-section { animation: fadeInUp 0.5s ease 0.3s both; }
  .quick-section { animation: fadeInUp 0.5s ease 0.4s both; }
  .companion-section { animation: fadeInUp 0.5s ease 0.5s both; }
</style>
</head>
<body>

<!-- 顶部问候区 -->
<div class="header">
  <div class="header-top">
    <div class="greeting">
      <h1 id="greeting">晚上好！</h1>
      <p>今天家人过得怎么样？</p>
    </div>
    <a href="profile.html" class="header-avatar">
      <i class="fas fa-user"></i>
    </a>
  </div>
  <div class="header-wave">
    <svg viewBox="0 0 430 30" preserveAspectRatio="none">
      <path d="M0,15 C80,30 160,0 240,15 C320,30 400,0 430,5 L430,30 L0,30 Z" fill="#f8f9fc"/>
    </svg>
  </div>
</div>

<!-- 情绪预警通知 -->
<div class="alert-section">
  <div class="alert-card" onclick="location.href='companion-panel.html?user=xiaoming'">
    <div class="alert-icon">&#9888;&#65039;</div>
    <div class="alert-content">
      <h4>情绪预警</h4>
      <p>小明最近几天心情不太好，可能需要你的关心</p>
    </div>
    <div class="alert-arrow"><i class="fas fa-chevron-right"></i></div>
  </div>
</div>

<!-- 我的家人 -->
<div class="family-section">
  <div class="section-header">
    <h2 class="section-title">我的家人</h2>
    <span class="section-action" onclick="location.href='family-manage.html'">
      管理 <i class="fas fa-chevron-right" style="font-size:10px;"></i>
    </span>
  </div>
  <div class="family-scroll">
    <a class="family-card" href="companion-panel.html?user=xiaoming">
      <div class="family-avatar" style="background: linear-gradient(135deg, #e3f2fd, #bbdefb);">
        &#128082;
        <div class="mood-dot" style="background: #ff9800;"></div>
      </div>
      <div class="family-name">小明</div>
      <div class="family-status">8岁 · 需要关心</div>
    </a>
    <a class="family-card" href="companion-panel.html?user=xiaohong">
      <div class="family-avatar" style="background: linear-gradient(135deg, #fce4ec, #f8bbd0);">
        &#128081;
        <div class="mood-dot" style="background: #52c41a;"></div>
      </div>
      <div class="family-name">小红</div>
      <div class="family-status">12岁 · 开心</div>
    </a>
    <a class="family-card" href="companion-panel.html?user=yeye">
      <div class="family-avatar" style="background: linear-gradient(135deg, #f3e5f5, #e1bee7);">
        &#128116;
        <div class="mood-dot" style="background: #52c41a;"></div>
      </div>
      <div class="family-name">爷爷</div>
      <div class="family-status">75岁 · 平静</div>
    </a>
    <div class="family-card add" onclick="location.href='family-manage.html'">
      <div class="add-icon"><i class="fas fa-plus"></i></div>
      <div class="add-text">添加家人</div>
    </div>
  </div>
</div>

<!-- 今日动态 -->
<div class="today-section">
  <div class="section-header">
    <h2 class="section-title">今日动态</h2>
  </div>
  <div class="today-card" onclick="location.href='companion-panel.html?user=xiaoming'">
    <div class="today-avatar" style="background: linear-gradient(135deg, #e3f2fd, #bbdefb);">&#128082;</div>
    <div class="today-info">
      <h4>小明分享了新故事</h4>
      <p>今天在公园和小狗玩，特别开心...</p>
    </div>
    <div class="today-time">2小时前</div>
  </div>
</div>

<!-- 快捷操作 -->
<div class="quick-section">
  <div class="section-header">
    <h2 class="section-title">快捷操作</h2>
  </div>
  <div class="quick-grid">
    <div class="quick-item" onclick="location.href='../chat.html'">
      <div class="qi-icon"><i class="fas fa-pen-fancy"></i></div>
      <div class="qi-label">开始记录</div>
    </div>
    <div class="quick-item" onclick="location.href='storybook.html'">
      <div class="qi-icon"><i class="fas fa-book-open"></i></div>
      <div class="qi-label">故事本</div>
    </div>
    <div class="quick-item" onclick="location.href='square.html'">
      <div class="qi-icon"><i class="fas fa-users"></i></div>
      <div class="qi-label">广场</div>
    </div>
  </div>
</div>

<!-- 亲情陪伴管理 -->
<div class="companion-section">
  <div class="section-header">
    <h2 class="section-title">亲情陪伴</h2>
  </div>
  <div class="companion-card-large" onclick="location.href='family-manage.html'">
    <div class="companion-icon"><i class="fas fa-heart"></i></div>
    <div class="companion-text">
      <h3>管理陪伴设置</h3>
      <p>查看情绪预警、发送关怀消息</p>
    </div>
    <div class="companion-arrow"><i class="fas fa-chevron-right"></i></div>
  </div>
</div>

<!-- 底部 Tab -->
<div class="tab-bar">
  <a class="tab-item active" href="home.html">
    <span class="icon"><i class="fas fa-home"></i></span>
    <span class="label">首页</span>
  </a>
  <a class="tab-item" href="storybook.html">
    <span class="icon"><i class="fas fa-book-open"></i></span>
    <span class="label">故事本</span>
  </a>
  <a class="tab-item" href="square.html">
    <span class="icon"><i class="fas fa-users"></i></span>
    <span class="label">广场</span>
  </a>
  <a class="tab-item" href="profile.html">
    <span class="icon"><i class="fas fa-user"></i></span>
    <span class="label">我的</span>
  </a>
</div>

<script src="../shared/voice-assistant.js"></script>
<script>
  // 根据时间显示问候语
  var hour = new Date().getHours();
  var greeting = '晚上好！';
  if (hour < 12) greeting = '早上好！';
  else if (hour < 18) greeting = '下午好！';
  document.getElementById('greeting').textContent = greeting;

  // 初始化语音助手 - 监护人模式
  VoiceAssistant.init({
    role: 'guardian',
    primaryAvatar: '\uD83D\uDCE6',
    primaryName: 'AI小箱',
    targets: [
      { id: 'xiaoming', avatar: '\uD83D\uDC66', name: '小明', desc: '8岁 · 儿子', type: 'family' },
      { id: 'xiaohong', avatar: '\uD83D\uDC67', name: '小红', desc: '12岁 · 女儿', type: 'family' },
      { id: 'yeye', avatar: '\uD83D\uDC74', name: '爷爷', desc: '75岁 · 父亲', type: 'family' }
    ],
    messages: [
      { speaker: 'ai', type: 'text', content: '你好呀！我是AI小箱，有什么可以帮你的吗？', avatar: '\uD83D\uDCE6' }
    ],
    onSend: function(data) {
      console.log('发送消息给：', data.target ? data.target.name : '', '内容：', data.text || data.type);
    },
    onSwitch: function(target) {
      console.log('切换到：', target.name);
    }
  });
</script>

</body>
</html>
