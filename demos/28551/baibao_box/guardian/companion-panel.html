<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陪伴面板 - 监护人</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/voice-assistant.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
  :root {
    --primary: #5b6cf9; --primary-dark: #4a5de0; --primary-light: #e8eaf6;
    --accent: #ff6b6b; --warm: #ff9a56; --bg: #f8f9fc; --white: #ffffff;
    --text: #1a1a2e; --text-secondary: #6b7280; --text-light: #9ca3af;
    --border: #e5e7eb; --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow: 0 8px 32px rgba(0,0,0,0.08); --radius-sm: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    max-width: 430px; margin: 0 auto; min-height: 100vh;
    padding-bottom: 80px; overflow-x: hidden;
  }
  .top-nav { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 16px 20px 24px; }
  .nav-row { display: flex; align-items: center; gap: 12px; }
  .nav-back { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; cursor: pointer; text-decoration: none; flex-shrink: 0; }
  .nav-title { color: #fff; font-size: 17px; font-weight: 600; flex: 1; }
  .nav-btn {
    width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 16px; cursor: pointer; border: none;
  }
  .profile-card {
    margin: -16px 20px 0; background: var(--white); border-radius: var(--radius-sm);
    padding: 20px; box-shadow: var(--shadow); position: relative; z-index: 2;
    text-align: center;
  }
  .profile-avatar {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center; font-size: 36px;
  }
  .profile-name { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .profile-tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .profile-tag {
    padding: 4px 12px; border-radius: 14px; font-size: 11px; font-weight: 600;
  }
  .profile-tag.role { background: var(--primary-light); color: var(--primary); }
  .profile-tag.status { background: #fff3e0; color: #ff9800; }
  .profile-tag.active { background: #e8f5e9; color: #4caf50; }
  .quick-actions {
    display: flex; gap: 10px; padding: 16px 20px 0;
  }
  .qa-btn {
    flex: 1; padding: 14px 8px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    background: var(--white); text-align: center; cursor: pointer; transition: all 0.2s;
    font-family: inherit;
  }
  .qa-btn:hover { border-color: var(--primary); background: var(--primary-light); }
  .qa-btn i { font-size: 20px; display: block; margin-bottom: 6px; color: var(--primary); }
  .qa-btn span { font-size: 13px; font-weight: 600; color: var(--text); }

  /* 子账号管理区 */
  .account-section { padding: 16px 20px 0; animation: fadeInUp 0.5s ease 0.25s both; }
  .account-section-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .account-section-title i { color: var(--primary); font-size: 16px; }
  .account-card {
    background: var(--white); border-radius: var(--radius-sm); padding: 16px;
    box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .account-avatar {
    width: 48px; height: 48px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
  }
  .account-info { flex: 1; }
  .account-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .account-role { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .account-status { font-size: 11px; color: var(--text-light); margin-top: 2px; }
  .account-badge {
    font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: 500;
  }
  .account-badge.main { background: var(--primary-light); color: var(--primary); }
  .account-badge.sub { background: #fff3e0; color: #ff9800; }
  .account-actions { display: flex; gap: 8px; margin-top: 4px; }
  .account-action-btn {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--white); font-size: 12px; color: var(--primary); cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .account-action-btn:hover { background: var(--primary-light); border-color: var(--primary); }
  .account-action-btn.danger { color: var(--accent); border-color: #fecaca; }
  .account-action-btn.danger:hover { background: #fef2f2; }
  .account-tip {
    font-size: 12px; color: var(--text-secondary); line-height: 1.6; padding: 12px;
    background: var(--primary-light); border-radius: 10px; margin-top: 10px;
  }
  .account-tip i { color: var(--primary); margin-right: 4px; }
  .account-tip strong { color: var(--accent); }

  /* 重置密码弹窗 */
  .reset-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 3000;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .reset-modal.active { display: flex; }
  .reset-content {
    background: var(--white); border-radius: var(--radius-sm); padding: 24px;
    text-align: center; max-width: 320px; width: 100%; animation: fadeInUp 0.3s ease;
  }
  .reset-icon { font-size: 40px; margin-bottom: 12px; }
  .reset-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .reset-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px; }
  .reset-actions { display: flex; gap: 10px; }
  .reset-actions button {
    flex: 1; padding: 12px; border-radius: 10px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .reset-actions .cancel-btn { background: var(--bg); color: var(--text-secondary); }
  .reset-actions .confirm-btn { background: var(--accent); color: #fff; }

  .data-section { padding: 16px 20px 0; }
  .section-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 14px; }
  .data-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .data-card {
    background: var(--white); border-radius: var(--radius-sm); padding: 16px;
    box-shadow: var(--shadow-sm); border: 1px solid var(--border); text-align: center;
  }
  .data-card .dc-icon { font-size: 24px; margin-bottom: 8px; }
  .data-card .dc-value { font-size: 22px; font-weight: 700; color: var(--text); }
  .data-card .dc-label { font-size: 12px; color: var(--text-light); margin-top: 4px; }
  .chart-section { padding: 16px 20px 0; }
  .chart-card {
    background: var(--white); border-radius: var(--radius-sm); padding: 20px;
    box-shadow: var(--shadow-sm); border: 1px solid var(--border);
  }
  .chart-card h4 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; }
  .chart-bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .chart-bar {
    width: 100%; border-radius: 6px 6px 0 0; transition: height 0.5s ease;
    min-height: 8px;
  }
  .chart-bar.green { background: linear-gradient(180deg, #66bb6a, #43a047); }
  .chart-bar.orange { background: linear-gradient(180deg, #ffa726, #fb8c00); }
  .chart-bar.red { background: linear-gradient(180deg, #ef5350, #e53935); }
  .chart-label { font-size: 11px; color: var(--text-light); }
  .chart-legend { display: flex; gap: 16px; margin-top: 12px; justify-content: center; }
  .chart-legend span { font-size: 11px; color: var(--text-light); display: flex; align-items: center; gap: 4px; }
  .chart-legend .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chart-legend .dot.green { background: #43a047; }
  .chart-legend .dot.orange { background: #fb8c00; }
  .chart-legend .dot.red { background: #e53935; }
  .stories-section { padding: 16px 20px 0; }
  .story-item {
    display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .story-item:last-child { border-bottom: none; }
  .story-item .si-cover {
    width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
  }
  .story-item .si-info { flex: 1; }
  .story-item .si-info h4 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .story-item .si-info p { font-size: 12px; color: var(--text-secondary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .story-item .si-meta { font-size: 11px; color: var(--text-light); margin-top: 4px; }
  .care-section { padding: 16px 20px 0; }
  .care-card {
    background: linear-gradient(135deg, var(--warm), #ff6b9d); border-radius: var(--radius-sm);
    padding: 20px; color: #fff;
  }
  .care-card h4 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .care-card p { font-size: 13px; opacity: 0.9; margin-bottom: 12px; }
  .care-input-row { display: flex; gap: 10px; }
  .care-input {
    flex: 1; padding: 10px 14px; border: none; border-radius: 10px;
    font-size: 14px; font-family: inherit; outline: none; background: rgba(255,255,255,0.2);
    color: #fff;
  }
  .care-input::placeholder { color: rgba(255,255,255,0.6); }
  .care-send {
    padding: 10px 18px; border-radius: 10px; background: rgba(255,255,255,0.25);
    color: #fff; border: none; font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; height: 64px; background: var(--white);
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid var(--border); box-shadow: 0 -4px 16px var(--shadow-sm); z-index: 100;
  }
  .tab-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 4px 16px; text-decoration: none; color: var(--text-light); transition: color 0.2s; }
  .tab-item .icon { font-size: 20px; margin-bottom: 2px; }
  .tab-item .label { font-size: 11px; }
  .tab-item.active { color: var(--primary); }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .profile-card { animation: fadeInUp 0.5s ease 0.1s both; }
  .quick-actions { animation: fadeInUp 0.5s ease 0.2s both; }
  .data-section { animation: fadeInUp 0.5s ease 0.3s both; }
  .chart-section { animation: fadeInUp 0.5s ease 0.4s both; }
  .stories-section { animation: fadeInUp 0.5s ease 0.5s both; }
  .care-section { animation: fadeInUp 0.5s ease 0.6s both; }
</style>
</head>
<body>
<div class="top-nav">
  <div class="nav-row">
    <a href="home.html" class="nav-back"><i class="fas fa-arrow-left"></i></a>
    <div class="nav-title">陪伴面板</div>
    <button class="nav-btn" onclick="alert('语音通话（演示）')"><i class="fas fa-phone"></i></button>
    <button class="nav-btn" onclick="alert('发消息（演示）')"><i class="fas fa-comment"></i></button>
  </div>
</div>

<div class="profile-card" id="profileCard"></div>

<div class="quick-actions">
  <div class="qa-btn" onclick="alert('发消息（演示）')"><i class="fas fa-comment"></i><span>发消息</span></div>
  <div class="qa-btn" onclick="alert('语音通话（演示）')"><i class="fas fa-phone"></i><span>语音通话</span></div>
  <div class="qa-btn" onclick="alert('关怀消息已发送（演示）')"><i class="fas fa-hand-holding-heart"></i><span>关怀消息</span></div>
</div>

<div class="data-section">
  <h3 class="section-title">今日数据</h3>
  <div class="data-grid">
    <div class="data-card"><div class="dc-icon">&#9201;</div><div class="dc-value">45<span style="font-size:14px;font-weight:400;">分钟</span></div><div class="dc-label">使用时长</div></div>
    <div class="data-card"><div class="dc-icon">&#128221;</div><div class="dc-value">2</div><div class="dc-label">记录故事</div></div>
    <div class="data-card"><div class="dc-icon">&#128152;</div><div class="dc-value" id="moodValue">一般</div><div class="dc-label">心情状态</div></div>
    <div class="data-card"><div class="dc-icon">&#129302;</div><div class="dc-value">8</div><div class="dc-label">AI对话</div></div>
  </div>
</div>

<div class="chart-section">
  <div class="chart-card">
    <h4>近7天情绪趋势</h4>
    <div class="chart-bars" id="chartBars"></div>
    <div class="chart-legend">
      <span><span class="dot green"></span>开心</span>
      <span><span class="dot orange"></span>一般</span>
      <span><span class="dot red"></span>低落</span>
    </div>
  </div>
</div>

<div class="stories-section">
  <h3 class="section-title">最近的故事</h3>
  <div id="recentStories"></div>
</div>

<div class="care-section">
  <div class="care-card">
    <h4><i class="fas fa-hand-holding-heart"></i> 关怀消息</h4>
    <p>发送一条温暖的关怀消息，让小明感受到你的爱。</p>
    <div class="care-input-row">
      <input class="care-input" placeholder="输入关怀消息..." id="careInput">
      <button class="care-send" onclick="sendCare()"><i class="fas fa-paper-plane"></i> 发送</button>
    </div>
  </div>
</div>

<div class="tab-bar">
  <a class="tab-item" href="home.html"><span class="icon"><i class="fas fa-home"></i></span><span class="label">首页</span></a>
  <a class="tab-item" href="storybook.html"><span class="icon"><i class="fas fa-book-open"></i></span><span class="label">故事本</span></a>
  <a class="tab-item" href="square.html"><span class="icon"><i class="fas fa-users"></i></span><span class="label">广场</span></a>
  <a class="tab-item" href="profile.html"><span class="icon"><i class="fas fa-user"></i></span><span class="label">我的</span></a>
</div>
<script src="../shared/voice-assistant.js"></script>
<script>
var users = {
  xiaoming: { name:'小明', avatar:'&#128082;', bg:'linear-gradient(135deg, #e3f2fd, #bbdefb)', mood:'一般', tags:['被陪伴者','需要关心','今天活跃'], stories:[
    { title:'今天在公园和小狗玩', summary:'今天在公园遇到了一只可爱的小狗。', cover:'https://picsum.photos/seed/childplay/100/100.jpg', date:'今天 14:30' },
    { title:'考试没考好', summary:'今天数学考试只考了75分。', cover:'https://picsum.photos/seed/sadchild/100/100.jpg', date:'5天前' }
  ], chart:[60,40,80,30,50,20,45] },
  xiaohong: { name:'小红', avatar:'&#128081;', bg:'linear-gradient(135deg, #fce4ec, #f8bbd0)', mood:'开心', tags:['被陪伴者','今天活跃'], stories:[
    { title:'画了一幅彩虹', summary:'用颜料画了一道大大的彩虹。', cover:'https://picsum.photos/seed/childpaint/100/100.jpg', date:'昨天 16:20' },
    { title:'学了一首新歌', summary:'音乐课学了一首关于春天的歌。', cover:'https://picsum.photos/seed/sing/100/100.jpg', date:'4天前' }
  ], chart:[80,70,90,85,75,80,90] },
  yeye: { name:'爷爷', avatar:'&#128116;', bg:'linear-gradient(135deg, #f3e5f5, #e1bee7)', mood:'平静', tags:['被陪伴者','今天活跃'], stories:[
    { title:'和老朋友下棋', summary:'今天和老李在公园下棋。', cover:'https://picsum.photos/seed/grandpa/100/100.jpg', date:'3天前' },
    { title:'想起了年轻时候的事', summary:'翻到了一张老照片。', cover:'https://picsum.photos/seed/oldphoto/100/100.jpg', date:'1周前' }
  ], chart:[70,75,65,80,70,75,70] }
};
var params = new URLSearchParams(window.location.search);
var uid = params.get('user') || 'xiaoming';
var user = users[uid] || users.xiaoming;

function render() {
  document.getElementById('profileCard').innerHTML =
    '<div class="profile-avatar" style="background:'+user.bg+';">'+user.avatar+'</div>' +
    '<div class="profile-name">'+user.name+'</div>' +
    '<div class="profile-tags">' +
    user.tags.map(function(t,i) {
      var cls = i===0?'role':i===1?'status':'active';
      return '<span class="profile-tag '+cls+'">'+t+'</span>';
    }).join('') + '</div>';
  document.getElementById('moodValue').textContent = user.mood;
  var days = ['周一','周二','周三','周四','周五','周六','周日'];
  var html = '';
  user.chart.forEach(function(v,i) {
    var cls = v >= 70 ? 'green' : v >= 40 ? 'orange' : 'red';
    html += '<div class="chart-bar-item"><div class="chart-bar '+cls+'" style="height:'+v+'%;"></div><div class="chart-label">'+days[i]+'</div></div>';
  });
  document.getElementById('chartBars').innerHTML = html;
  var shtml = '';
  user.stories.forEach(function(s) {
    shtml += '<div class="story-item"><img class="si-cover" src="'+s.cover+'" alt=""><div class="si-info"><h4>'+s.title+'</h4><p>'+s.summary+'</p><div class="si-meta">'+s.date+'</div></div></div>';
  });
  document.getElementById('recentStories').innerHTML = shtml;
}
function sendCare() {
  var input = document.getElementById('careInput');
  if (input.value.trim()) { alert('关怀消息已发送：' + input.value + '（演示）'); input.value = ''; }
}
render();
VoiceAssistant.init({
  role: 'guardian', primaryAvatar: '\uD83D\uDCE6', primaryName: 'AI小箱',
  targets: [
    { id: 'xiaoming', avatar: '\uD83D\uDC66', name: '小明', desc: '8岁 · 儿子', type: 'family' },
    { id: 'xiaohong', avatar: '\uD83D\uDC67', name: '小红', desc: '12岁 · 女儿', type: 'family' },
    { id: 'yeye', avatar: '\uD83D\uDC74', name: '爷爷', desc: '75岁 · 父亲', type: 'family' }
  ],
  messages: [{ speaker: 'ai', type: 'text', content: '你好呀！我是AI小箱，有什么可以帮你的吗？', avatar: '\uD83D\uDCE6' }]
});
</script>
</body>
</html>
