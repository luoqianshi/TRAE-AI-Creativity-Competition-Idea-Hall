<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>故事本 - 监护人</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/voice-assistant.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
  :root {
    --primary: #5b6cf9; --primary-dark: #4a5de0; --primary-light: #e8eaf6;
    --accent: #ff6b6b; --warm: #ff9a56; --bg: #f8f9fc; --white: #ffffff;
    --text: #1a1a2e; --text-secondary: #6b7280; --text-light: #9ca3af;
    --border: #e5e7eb; --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow: 0 8px 32px rgba(0,0,0,0.08); --radius-sm: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    max-width: 430px; margin: 0 auto; min-height: 100vh;
    padding-bottom: 80px; overflow-x: hidden;
  }
  .top-nav {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    padding: 16px 20px 24px;
  }
  .nav-row { display: flex; align-items: center; gap: 12px; }
  .nav-back {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.15); display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 16px; cursor: pointer;
    text-decoration: none; flex-shrink: 0;
  }
  .nav-title { color: #fff; font-size: 17px; font-weight: 600; flex: 1; }
  .nav-action {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.15); display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 16px; cursor: pointer; border: none;
  }
  .search-section { padding: 16px 20px 0; }
  .search-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--white); border-radius: var(--radius-sm);
    padding: 12px 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
  }
  .search-bar i { color: var(--text-light); font-size: 16px; }
  .search-bar input {
    flex: 1; border: none; outline: none; font-size: 14px;
    font-family: 'Noto Sans SC', sans-serif; color: var(--text); background: transparent;
  }
  .search-bar input::placeholder { color: var(--text-light); }
  .filter-row {
    padding: 12px 20px 0; display: flex; align-items: center; justify-content: space-between;
  }
  .sort-btn {
    display: flex; align-items: center; gap: 6px; padding: 6px 14px;
    border-radius: 20px; background: var(--white); border: 1px solid var(--border);
    font-size: 12px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s;
    flex-shrink: 0; white-space: nowrap;
  }
  .sort-btn:hover { border-color: var(--primary); color: var(--primary); }
  .sort-btn i { font-size: 12px; }
  .emotion-filter {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; flex-wrap: nowrap; padding-right: 20px;
  }
  .emotion-filter::-webkit-scrollbar { display: none; }
  .emotion-tag {
    display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
    padding: 5px 12px 5px 8px; border-radius: 16px; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.2s ease; border: 1.5px solid transparent;
    user-select: none; -webkit-user-select: none;
  }
  .emotion-tag::before {
    content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .emotion-tag.happy { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
  .emotion-tag.happy::before { background: #4caf50; }
  .emotion-tag.calm { background: #e3f2fd; color: #1565c0; border-color: #90caf9; }
  .emotion-tag.calm::before { background: #2196f3; }
  .emotion-tag.excited { background: #fff3e0; color: #ef6c00; border-color: #ffcc80; }
  .emotion-tag.excited::before { background: #ff9800; }
  .emotion-tag.sad { background: #fce4ec; color: #c2185b; border-color: #f48fb1; }
  .emotion-tag.sad::before { background: #e91e63; }
  .emotion-tag.worried { background: #f3e5f5; color: #7b1fa2; border-color: #ce93d8; }
  .emotion-tag.worried::before { background: #9c27b0; }
  .emotion-tag:hover { transform: translateY(-1px); }
  .emotion-tag.active {
    border-width: 1.5px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .emotion-tag:not(.active) { opacity: 0.55; }
  .emotion-tag:not(.active):hover { opacity: 0.85; }
  .stories-section { padding: 16px 20px 0; }
  .section-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
  }
  .section-title { font-size: 17px; font-weight: 700; color: var(--text); }
  .story-card {
    display: flex; gap: 14px; background: var(--white); border-radius: var(--radius-sm);
    padding: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
    margin-bottom: 12px; cursor: pointer; transition: all 0.3s ease;
  }
  .story-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .story-cover {
    width: 90px; height: 90px; border-radius: 12px; object-fit: cover;
    flex-shrink: 0; background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
  }
  .story-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .story-info h4 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
  .story-info p { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .story-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-light); flex-wrap: wrap; }
  .story-meta .mood-tag {
    padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600;
  }
  .story-meta .mood-tag.happy { background: #e8f5e9; color: #4caf50; }
  .story-meta .mood-tag.calm { background: #e3f2fd; color: #2196f3; }
  .story-meta .mood-tag.excited { background: #fff3e0; color: #ff9800; }
  .story-meta .mood-tag.sad { background: #fce4ec; color: #e91e63; }
  .story-meta .voice-badge { color: var(--primary); }
  .story-meta .voice-badge i { margin-right: 2px; }
  .story-meta .ai-confidence { display:flex; align-items:center; gap:3px; font-size:10px; color:#7b1fa2; background:#f3e5f5; padding:2px 6px; border-radius:6px; font-weight:500; }
  .story-meta .ai-confidence i { font-size:9px; }
  .story-arrow { color: var(--text-light); font-size: 14px; align-self: center; }

  /* 弹窗通用 */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-content {
    width: 100%; max-width: 430px; background: var(--white);
    border-radius: 24px 24px 0 0; padding: 0; animation: slideUp 0.3s ease;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-header {
    padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-size: 18px; font-weight: 700; color: var(--text); }
  .modal-close {
    width: 36px; height: 36px; border-radius: 50%; background: var(--bg);
    border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; color: var(--text-light);
  }
  .modal-body { padding: 20px 24px 32px; }

  /* 故事详情弹窗 */
  .detail-cover { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; }
  .detail-tags { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .detail-content { font-size: 14px; color: var(--text); line-height: 1.8; margin-bottom: 16px; }
  .detail-content p { margin-bottom: 12px; }
  .detail-content img { width: 100%; border-radius: 12px; margin: 12px 0; }
  .audio-bar {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: var(--primary-light); border-radius: 12px; margin-bottom: 16px;
  }
  .audio-bar .play-btn {
    width: 40px; height: 40px; border-radius: 50%; background: var(--primary);
    color: #fff; border: none; font-size: 16px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .audio-bar .audio-info { flex: 1; }
  .audio-bar .audio-info .audio-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .audio-bar .audio-info .audio-dur { font-size: 11px; color: var(--text-light); }
  .audio-bar .audio-progress { width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; }
  .audio-bar .audio-progress-fill { height: 100%; width: 35%; background: var(--primary); border-radius: 2px; }
  .version-btns { display: flex; gap: 8px; margin-bottom: 16px; }
  .version-btn {
    flex: 1; padding: 10px 8px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--white); font-size: 12px; font-weight: 600; color: var(--text-secondary);
    cursor: pointer; text-align: center; transition: all 0.2s; font-family: inherit;
  }
  .version-btn:hover { border-color: var(--primary); color: var(--primary); }
  .version-btn .coming-soon { font-size: 10px; color: var(--text-light); display: block; margin-top: 2px; }
  .continue-chat-btn {
    width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }

  /* 继续聊天弹窗 */
  .chat-modes { display: flex; gap: 10px; margin-bottom: 16px; }
  .chat-mode-btn {
    flex: 1; padding: 12px; border-radius: 12px; border: 2px solid var(--border);
    background: var(--white); text-align: center; cursor: pointer; transition: all 0.2s;
    font-family: inherit;
  }
  .chat-mode-btn.active { border-color: var(--primary); background: var(--primary-light); }
  .chat-mode-btn i { font-size: 20px; display: block; margin-bottom: 6px; color: var(--primary); }
  .chat-mode-btn span { font-size: 13px; font-weight: 600; color: var(--text); }
  .chat-input-area { display: flex; gap: 10px; }
  .chat-input {
    flex: 1; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 14px;
    font-size: 14px; font-family: inherit; color: var(--text); outline: none;
  }
  .chat-input:focus { border-color: var(--primary); }
  .chat-send {
    width: 44px; height: 44px; border-radius: 50%; background: var(--primary);
    color: #fff; border: none; font-size: 16px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .chat-voice-area { text-align: center; padding: 20px; display: none; }
  .chat-voice-area.show { display: block; }
  .chat-text-area { display: flex; }
  .chat-text-area.hide { display: none; }
  .voice-big-btn {
    width: 64px; height: 64px; border-radius: 50%; background: var(--primary);
    color: #fff; border: none; font-size: 24px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; margin: 0 auto 10px;
  }
  .voice-hint { font-size: 13px; color: var(--text-light); }
  .ai-guide {
    padding: 14px 16px; background: var(--primary-light); border-radius: 12px;
    font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px;
  }
  .ai-guide i { color: var(--primary); margin-right: 4px; }

  /* 匿名发布弹窗 */
  .anon-preview {
    padding: 16px; background: var(--bg); border-radius: 12px; margin-bottom: 16px;
  }
  .anon-preview h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .anon-preview p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .anon-preview .highlight { background: #fff3cd; padding: 1px 4px; border-radius: 4px; }
  .anon-edit-area { margin-bottom: 16px; }
  .anon-edit-area textarea {
    width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 14px;
    font-size: 14px; font-family: inherit; color: var(--text); outline: none;
    min-height: 100px; resize: vertical; line-height: 1.6;
  }
  .anon-edit-area textarea:focus { border-color: var(--primary); }
  .publish-btn {
    width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }

  /* 底部 Tab */
  .tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; height: 64px; background: var(--white);
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid var(--border); box-shadow: 0 -4px 16px var(--shadow-sm); z-index: 100;
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center; cursor: pointer;
    padding: 4px 16px; text-decoration: none; color: var(--text-light); transition: color 0.2s;
  }
  .tab-item .icon { font-size: 20px; margin-bottom: 2px; }
  .tab-item .label { font-size: 11px; }
  .tab-item.active { color: var(--primary); }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .search-section { animation: fadeInUp 0.5s ease 0.1s both; }
  .category-section { animation: fadeInUp 0.5s ease 0.2s both; }
  .stories-section { animation: fadeInUp 0.5s ease 0.3s both; }
</style>
</head>
<body>

<div class="top-nav">
  <div class="nav-row">
    <a href="home.html" class="nav-back"><i class="fas fa-arrow-left"></i></a>
    <div class="nav-title">故事本</div>
    <button class="nav-action" onclick="alert('新建故事（演示）')"><i class="fas fa-plus"></i></button>
  </div>
</div>

<div class="search-section">
  <div class="search-bar">
    <i class="fas fa-search"></i>
    <input type="text" placeholder="搜索故事..." id="searchInput" oninput="filterStories()">
  </div>
</div>

<div class="filter-row">
  <div class="sort-btn" onclick="cycleSort()" id="sortBtn">
    <i class="fas fa-sort"></i> <span id="sortLabel">情绪</span>
  </div>
  <div class="emotion-filter">
    <div class="emotion-tag happy active" onclick="toggleEmotion(this)">开心</div>
    <div class="emotion-tag calm active" onclick="toggleEmotion(this)">平静</div>
    <div class="emotion-tag excited active" onclick="toggleEmotion(this)">激动</div>
    <div class="emotion-tag sad active" onclick="toggleEmotion(this)">悲伤</div>
    <div class="emotion-tag worried active" onclick="toggleEmotion(this)">担心</div>
  </div>
</div>

<div class="stories-section" id="storiesList"></div>

<!-- 故事详情弹窗 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">故事详情</div>
      <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<!-- 继续聊天弹窗 -->
<div class="modal-overlay" id="chatModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">继续聊天</div>
      <button class="modal-close" onclick="closeModal('chatModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="ai-guide"><i class="fas fa-robot"></i> AI小箱会引导你继续这个故事，可以选择文字或语音模式。</div>
      <div class="chat-modes">
        <div class="chat-mode-btn active" onclick="switchChatMode('text',this)"><i class="fas fa-keyboard"></i><span>文字</span></div>
        <div class="chat-mode-btn" onclick="switchChatMode('voice',this)"><i class="fas fa-microphone"></i><span>语音</span></div>
      </div>
      <div class="chat-text-area" id="chatTextArea">
        <div class="chat-input-area">
          <input class="chat-input" placeholder="输入你想说的..." id="chatInput">
          <button class="chat-send" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
      <div class="chat-voice-area" id="chatVoiceArea">
        <button class="voice-big-btn" onclick="alert('语音输入中...（演示）')"><i class="fas fa-microphone"></i></button>
        <div class="voice-hint">点击开始语音输入</div>
      </div>
    </div>
  </div>
</div>

<!-- 匿名发布弹窗 -->
<div class="modal-overlay" id="anonModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">匿名发布</div>
      <button class="modal-close" onclick="closeModal('anonModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="anon-preview" id="anonPreview"></div>
      <div class="anon-edit-area">
        <textarea placeholder="编辑匿名版本..." id="anonEdit"></textarea>
      </div>
      <button class="publish-btn" onclick="alert('发布成功！（演示）');closeModal('anonModal')"><i class="fas fa-paper-plane"></i> 发布到广场</button>
    </div>
  </div>
</div>

<div class="tab-bar">
  <a class="tab-item" href="home.html"><span class="icon"><i class="fas fa-home"></i></span><span class="label">首页</span></a>
  <a class="tab-item active" href="storybook.html"><span class="icon"><i class="fas fa-book-open"></i></span><span class="label">故事本</span></a>
  <a class="tab-item" href="square.html"><span class="icon"><i class="fas fa-users"></i></span><span class="label">广场</span></a>
  <a class="tab-item" href="profile.html"><span class="icon"><i class="fas fa-user"></i></span><span class="label">我的</span></a>
</div>

<script src="../shared/voice-assistant.js"></script>
<script>
var stories = [
  { id:1, title:'今天在公园和小狗玩', summary:'今天在公园遇到了一只可爱的小狗，它一直跟着我们跑，还叼来了球让我扔。', cover:'https://picsum.photos/seed/childplay/200/200.jpg', mood:'happy', moodLabel:'开心', owner:'小明', ownerType:'xiaoming', date:'今天 14:30', hasVoice:true, content:'今天天气特别好，妈妈带我去了公园。刚到门口就看到一只棕色的小狗，它摇着尾巴朝我跑过来。我蹲下来摸了摸它的头，它就一直跟着我。后来我们玩了扔球游戏，小狗每次都能把球叼回来，特别聪明！妈妈说下次可以带小狗来家里玩，我开心极了！', aiConfidence:'96%' },
  { id:2, title:'画了一幅彩虹', summary:'用颜料画了一道大大的彩虹，有七种颜色呢，妈妈说我画得越来越好了。', cover:'https://picsum.photos/seed/childpaint/200/200.jpg', mood:'excited', moodLabel:'激动', owner:'小红', ownerType:'xiaohong', date:'昨天 16:20', hasVoice:true, content:'今天美术课上老师教我们画彩虹。我用红色、橙色、黄色、绿色、蓝色、靛色和紫色，画了一道大大的彩虹。老师说我用色很大胆，画得越来越好看了。我还在彩虹下面画了小花和小草，整幅画特别漂亮。', aiConfidence:'91%' },
  { id:3, title:'和老朋友下棋', summary:'今天和老李在公园下棋，赢了两盘。天气很好，心情也不错。', cover:'https://picsum.photos/seed/grandpa/200/200.jpg', mood:'calm', moodLabel:'平静', owner:'爷爷', ownerType:'yeye', date:'3天前', hasVoice:false, content:'今天天气晴朗，我照常去了公园。老李已经在石桌旁等着了，我们下了三盘棋，我赢了两盘。下完棋后我们坐在长椅上聊天，聊到了年轻时候的事情。老李说他孙子也喜欢下棋，下次带来一起下。', aiConfidence:'88%' },
  { id:4, title:'全家一起去野餐', summary:'周末天气很好，全家一起去郊外野餐，孩子们玩得很开心。', cover:'https://picsum.photos/seed/family/200/200.jpg', mood:'happy', moodLabel:'开心', owner:'我', ownerType:'me', date:'上周', hasVoice:true, content:'这个周末天气特别好，我们全家决定去郊外野餐。我准备了三明治、水果和果汁。小明和小红在草地上跑来跑去，爷爷坐在树下看书。我们拍了好多照片，是一段很美好的回忆。', aiConfidence:'94%' },
  { id:5, title:'考试没考好', summary:'今天数学考试只考了75分，心里很难过，不敢告诉妈妈。', cover:'https://picsum.photos/seed/sadchild/200/200.jpg', mood:'sad', moodLabel:'悲伤', owner:'小明', ownerType:'xiaoming', date:'5天前', hasVoice:true, content:'今天发了数学试卷，我只考了75分。看着卷子上的红叉，心里特别难受。同桌考了95分，老师还表扬了他。回家的路上我一直低着头，不知道该怎么跟妈妈说。', aiConfidence:'93%' },

var sortMode = 0; // 0=情绪排序, 1=最新时间, 2=最早时间
var sortLabels = ['情绪','最新','最早'];
var activeEmotions = ['happy','calm','excited','sad','worried'];

function renderStories() {
  var list = document.getElementById('storiesList');
  var filtered = stories.filter(function(s) {
    if (activeEmotions.indexOf(s.mood) === -1) return false;
    var q = document.getElementById('searchInput').value.toLowerCase();
    if (q && s.title.toLowerCase().indexOf(q) === -1 && s.summary.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  if (sortMode === 0) {
    var moodOrder = { happy:0, excited:1, calm:2, worried:3, sad:4 };
    filtered.sort(function(a,b) { return (moodOrder[a.mood]||0) - (moodOrder[b.mood]||0); });
  }
  var html = '<div class="section-header"><h2 class="section-title">故事列表</h2><span style="font-size:13px;color:var(--text-light);">'+filtered.length+'篇</span></div>';
  if (filtered.length === 0) {
    html += '<div style="text-align:center;padding:40px 20px;"><div style="font-size:48px;margin-bottom:12px;opacity:0.3;">&#128218;</div><h3 style="font-size:15px;color:var(--text-secondary);margin-bottom:6px;">暂无故事</h3><p style="font-size:13px;color:var(--text-light);">换个筛选条件试试</p></div>';
  } else {
    filtered.forEach(function(s) {
      html += '<div class="story-card" onclick="showDetail('+s.id+')">' +
        '<img class="story-cover" src="'+s.cover+'" alt="封面">' +
        '<div class="story-info">' +
        '<h4>'+s.title+'</h4>' +
        '<p>'+s.summary+'</p>' +
        '<div class="story-meta">' +
        '<span class="mood-tag '+s.mood+'">'+s.moodLabel+'</span>' +
        '<span class="ai-confidence"><i class="fas fa-wand-magic-sparkles"></i> AI '+s.aiConfidence+'</span>' +
        '<span><i class="fas fa-user"></i> '+s.owner+'</span>' +
        '<span><i class="fas fa-clock"></i> '+s.date+'</span>' +
        (s.hasVoice ? '<span class="voice-badge"><i class="fas fa-headphones"></i>配音</span>' : '') +
        '</div></div>' +
        '<div class="story-arrow"><i class="fas fa-chevron-right"></i></div></div>';
    });
  }
  list.innerHTML = html;
}

function cycleSort() {
  sortMode = (sortMode + 1) % 3;
  document.getElementById('sortLabel').textContent = sortLabels[sortMode];
  renderStories();
}

function toggleEmotion(el) {
  el.classList.toggle('active');
  activeEmotions = [];
  document.querySelectorAll('.emotion-tag.active').forEach(function(t) {
    var cls = t.className.replace('emotion-tag ','').replace(' active','');
    activeEmotions.push(cls);
  });
  renderStories();
}

function filterStories() { renderStories(); }

function showDetail(id) {
  var s = stories.find(function(x){ return x.id === id; });
  if (!s) return;
  var body = document.getElementById('detailBody');
  body.innerHTML =
    '<img class="detail-cover" src="'+s.cover+'" alt="封面">' +
    '<div class="detail-tags"><span class="mood-tag '+s.mood+'" style="padding:4px 12px;border-radius:14px;font-size:12px;font-weight:600;">'+s.moodLabel+'</span><span style="font-size:12px;color:var(--text-light);"><i class="fas fa-user"></i> '+s.owner+' · '+s.date+'</span></div>' +
    (s.hasVoice ? '<div class="audio-bar"><button class="play-btn" onclick="alert(\'播放配音（演示）\')"><i class="fas fa-play"></i></button><div class="audio-info"><div class="audio-title">AI配音朗读</div><div class="audio-dur">02:35</div><div class="audio-progress"><div class="audio-progress-fill"></div></div></div></div>' : '') +
    '<div class="detail-content">'+s.content.split('\n').map(function(p){ return '<p>'+p+'</p>'; }).join('')+'</div>' +
    '<div class="version-btns">' +
    '<button class="version-btn" onclick="alert(\'图文配音版（演示）\')">图文配音</button>' +
    '<button class="version-btn" onclick="alert(\'即将上线\')">漫画配音<span class="coming-soon">即将上线</span></button>' +
    '<button class="version-btn" onclick="alert(\'即将上线\')">视频版<span class="coming-soon">即将上线</span></button>' +
    '</div>' +
    '<button class="continue-chat-btn" onclick="closeModal(\'detailModal\');openModal(\'chatModal\')"><i class="fas fa-comments"></i> 故事后续 - 继续聊天</button>' +
    '<div style="text-align:center;margin-top:12px;"><span style="font-size:13px;color:var(--primary);cursor:pointer;" onclick="closeModal(\'detailModal\');showAnon('+s.id+')"><i class="fas fa-user-secret"></i> 匿名发布到广场</span></div>';
  openModal('detailModal');
}

function showAnon(id) {
  var s = stories.find(function(x){ return x.id === id; });
  if (!s) return;
  var preview = document.getElementById('anonPreview');
  preview.innerHTML = '<h4>原文预览</h4><p>'+s.summary.replace(/小明|小红|爷爷/g, function(m){ return '<span class="highlight">'+m+'</span>'; })+'</p><p style="margin-top:8px;font-size:12px;color:var(--text-light);">黄色高亮部分将被替换为匿名</p>';
  document.getElementById('anonEdit').value = s.summary.replace(/小明|小红|爷爷/g, '某人');
  openModal('anonModal');
}

function switchChatMode(mode, el) {
  document.querySelectorAll('.chat-mode-btn').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  if (mode === 'text') {
    document.getElementById('chatTextArea').classList.remove('hide');
    document.getElementById('chatVoiceArea').classList.remove('show');
  } else {
    document.getElementById('chatTextArea').classList.add('hide');
    document.getElementById('chatVoiceArea').classList.add('show');
  }
}

function sendChat() {
  var input = document.getElementById('chatInput');
  if (input.value.trim()) { alert('发送: ' + input.value + '（演示）'); input.value = ''; }
}

function openModal(id) { document.getElementById(id).classList.add('show'); document.body.style.overflow='hidden'; }
function closeModal(id) { document.getElementById(id).classList.remove('show'); document.body.style.overflow=''; }
document.querySelectorAll('.modal-overlay').forEach(function(m) {
  m.addEventListener('click', function(e) { if (e.target === m) closeModal(m.id); });
});

renderStories();

  ],
  messages: [{ speaker: 'ai', type: 'text', content: '你好呀！我是AI小箱，有什么可以帮你的吗？', avatar: '\uD83D\uDCE6' }]
});
