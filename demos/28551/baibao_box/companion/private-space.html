<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>故事百宝箱 - 隐私空间</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/voice-assistant.css">
<style>
:root{--primary-from:#42a5f5;--primary-to:#ff6b9d;--primary-gradient:linear-gradient(135deg,var(--primary-from),var(--primary-to));--radius-sm:14px;--shadow:0 4px 16px rgba(0,0,0,.08);--bg:#f0f8ff;--card-bg:#ffffff;--text-primary:#1a1a2e;--text-secondary:#6b7280;--text-light:#9ca3af}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px;overflow-x:hidden}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.top-nav{background:linear-gradient(135deg,#42a5f5,#ff6b9d);padding:44px 16px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-nav .back-btn{color:#fff;font-size:18px;background:none;border:none;cursor:pointer;padding:4px}
.top-nav .nav-title{color:#fff;font-size:17px;font-weight:700}
.top-nav .nav-badge{color:rgba(255,255,255,.85);font-size:11px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:10px}

/* 隐私提示 */
.privacy-tip{margin:16px;background:var(--card-bg);border-radius:var(--radius-sm);padding:16px;display:flex;align-items:flex-start;gap:12px;animation:fadeInUp .4s ease;border:1px solid #e0e0e0}
.privacy-tip .lock-icon{font-size:24px;flex-shrink:0;margin-top:2px}
.privacy-tip .tip-content{flex:1}
.privacy-tip .tip-title{font-size:14px;font-weight:600;color:var(--text-primary)}
.privacy-tip .tip-desc{font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.6}

/* 统计卡片 */
.stats-row{display:flex;gap:12px;padding:0 16px;margin-bottom:16px;animation:fadeInUp .5s ease}
.stat-card{flex:1;background:var(--card-bg);border-radius:var(--radius-sm);padding:16px;text-align:center;box-shadow:var(--shadow);border:1px solid #e0e0e0}
.stat-card .stat-num{font-size:24px;font-weight:700;color:var(--primary-from)}
.stat-card .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px}

/* 私密故事列表 */
.private-stories{padding:0 16px;animation:fadeInUp .6s ease}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px;color:var(--text-primary)}
.section-title i{color:var(--primary-to)}

.private-story-item{background:var(--card-bg);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;display:flex;gap:12px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow);border:1px solid #e0e0e0}
.private-story-item:active{transform:scale(.98)}
.private-story-cover{width:64px;height:64px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.private-story-info{flex:1;display:flex;flex-direction:column;justify-content:center}
.private-story-title{font-size:14px;font-weight:600;color:var(--text-primary)}
.private-story-date{font-size:11px;color:var(--text-secondary);margin-top:4px}
.private-story-lock{color:var(--text-light);font-size:12px;display:flex;align-items:center;gap:4px;margin-top:4px}

.pc-0{background:linear-gradient(135deg,#fff3e0,#ffe0b2)}.pc-1{background:linear-gradient(135deg,#e3f2fd,#bbdefb)}.pc-2{background:linear-gradient(135deg,#fce4ec,#f8bbd0)}.pc-3{background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}

/* 密码锁屏 */
.lock-screen{position:fixed;inset:0;z-index:2000;background:linear-gradient(135deg,#f0f8ff,#e3f2fd);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px}
.lock-screen.unlocked{display:none}
.lock-icon-big{font-size:64px;margin-bottom:20px;animation:pulse 2s infinite}
.lock-title{font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:8px}
.lock-desc{font-size:13px;color:var(--text-secondary);text-align:center;margin-bottom:30px;line-height:1.6}
.lock-input-wrap{width:100%;max-width:280px;margin-bottom:16px}
.lock-input{width:100%;padding:14px 18px;border-radius:12px;border:1.5px solid #e0e0e0;background:var(--card-bg);color:var(--text-primary);font-size:16px;font-family:inherit;text-align:center;letter-spacing:8px;outline:none;transition:border-color .2s}
.lock-input:focus{border-color:var(--primary-from)}
.lock-input.error{border-color:#ff6b6b;animation:shake .4s ease}
.lock-submit{width:100%;max-width:280px;padding:14px;border-radius:12px;border:none;background:var(--primary-gradient);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .2s}
.lock-submit:active{transform:scale(.97)}
.lock-error{font-size:12px;color:#ff6b6b;margin-top:10px;min-height:18px;text-align:center}
.lock-reset-btn{margin-top:20px;padding:10px 20px;border-radius:10px;border:1px solid rgba(255,107,107,.3);background:rgba(255,107,107,.08);color:#ff6b6b;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s}
.lock-reset-btn:active{transform:scale(.97)}
.lock-hint{font-size:11px;color:var(--text-light);margin-top:8px;text-align:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* 重置密码弹窗 */
.reset-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:none;align-items:center;justify-content:center;padding:20px}
.reset-modal.active{display:flex}
.reset-modal-content{background:var(--card-bg);border-radius:var(--radius-sm);padding:24px;text-align:center;max-width:320px;width:100%;animation:fadeInUp .3s ease;border:1px solid #e0e0e0}
.reset-icon{font-size:40px;margin-bottom:12px}
.reset-title{font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:10px}
.reset-desc{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:20px}
.reset-actions{display:flex;gap:10px}
.reset-btn{flex:1;padding:12px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.reset-btn.cancel{background:#f5f5f5;color:var(--text-secondary)}
.reset-btn.confirm{background:#ff6b6b;color:#fff}

/* 底部Tab */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:64px;background:var(--card-bg);display:flex;align-items:center;justify-content:space-around;box-shadow:0 -2px 12px rgba(0,0,0,.08);z-index:1000;border-top:1px solid #e0e0e0}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;color:#9ca3af;font-size:10px;padding:4px 12px;-webkit-tap-highlight-color:transparent}
.tab-item.active{color:var(--primary-from)}
.tab-item i{font-size:20px}
.tab-item span{font-size:10px;font-weight:500}
</style>
</head>
<body>

<div class="top-nav">
  <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
  <span class="nav-title">隐私空间</span>
  <span class="nav-badge"><i class="fa-solid fa-eye-slash"></i> 仅自己可见</span>
</div>

<!-- 隐私提示 -->
<div class="privacy-tip">
  <span class="lock-icon">🔒</span>
  <div class="tip-content">
    <div class="tip-title">你的秘密花园</div>
    <div class="tip-desc">这里的故事只有你自己能看到。家人和任何人都无法查看你的隐私空间。放心地把心里话都存放在这里吧~</div>
  </div>
</div>

<!-- 密码锁屏 -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-icon-big">🔐</div>
  <div class="lock-title">隐私空间已锁定</div>
  <div class="lock-desc">请输入独立密码解锁<br>此密码与登录密码不同</div>
  <div class="lock-input-wrap">
    <input type="password" class="lock-input" id="lockInput" placeholder="····" maxlength="6" autocomplete="off">
  </div>
  <button class="lock-submit" id="lockSubmit" onclick="tryUnlock()">解锁</button>
  <div class="lock-error" id="lockError"></div>
  <button class="lock-reset-btn" onclick="showResetWarning()">
    <i class="fa-solid fa-rotate-left"></i> 重置隐私空间密码
  </button>
  <div class="lock-hint">忘记密码？可以让爸爸妈妈帮你重置</div>
</div>

<!-- 重置密码警告弹窗 -->
<div class="reset-modal" id="resetModal">
  <div class="reset-modal-content">
    <div class="reset-icon">⚠️</div>
    <div class="reset-title">确认重置隐私空间密码？</div>
    <div class="reset-desc">重置密码后，<strong style="color:#ff6b6b">隐私空间内所有私密故事、想法和收藏将被永久删除</strong>，且无法恢复。请谨慎操作。</div>
    <div class="reset-actions">
      <button class="reset-btn cancel" onclick="closeResetModal()">取消</button>
      <button class="reset-btn confirm" onclick="confirmResetSpace()">确认重置</button>
    </div>
  </div>
</div>

<!-- 统计卡片 -->
<div class="stats-row">
  <div class="stat-card">
    <div class="stat-num">3</div>
    <div class="stat-label">私密故事</div>
  </div>
  <div class="stat-card">
    <div class="stat-num">5</div>
    <div class="stat-label">私密对话</div>
  </div>
  <div class="stat-card">
    <div class="stat-num">2</div>
    <div class="stat-label">收藏</div>
  </div>
</div>

<!-- 私密故事列表 -->
<div class="private-stories">
  <div class="section-title"><i class="fa-solid fa-lock"></i> 私密故事</div>

  <div class="private-story-item">
    <div class="private-story-cover pc-0">💭</div>
    <div class="private-story-info">
      <div class="private-story-title">写给自己的信</div>
      <div class="private-story-date">2025-06-14</div>
      <div class="private-story-lock"><i class="fa-solid fa-lock"></i> 私密</div>
    </div>
  </div>

  <div class="private-story-item">
    <div class="private-story-cover pc-1">🌧️</div>
    <div class="private-story-info">
      <div class="private-story-title">不想让别人知道的事</div>
      <div class="private-story-date">2025-06-10</div>
      <div class="private-story-lock"><i class="fa-solid fa-lock"></i> 私密</div>
    </div>
  </div>

  <div class="private-story-item">
    <div class="private-story-cover pc-2">✨</div>
    <div class="private-story-info">
      <div class="private-story-title">我的小秘密</div>
      <div class="private-story-date">2025-06-05</div>
      <div class="private-story-lock"><i class="fa-solid fa-lock"></i> 私密</div>
    </div>
  </div>
</div>

<!-- 底部Tab -->
<nav class="tab-bar">
  <a class="tab-item" href="home.html"><i class="fa-solid fa-house"></i><span>首页</span></a>
  <a class="tab-item" href="storybook.html"><i class="fa-solid fa-book"></i><span>故事本</span></a>
  <a class="tab-item" href="square.html"><i class="fa-solid fa-globe"></i><span>广场</span></a>
  <a class="tab-item active" href="profile.html"><i class="fa-solid fa-user"></i><span>我的</span></a>
</nav>

<script src="../shared/voice-assistant.js"></script>
<script>
// 演示密码（实际项目中由后端验证）
var PRIVATE_PASSWORD = '123456';
var MAX_ATTEMPTS = 5;
var attempts = 0;

function tryUnlock() {
  var input = document.getElementById('lockInput');
  var error = document.getElementById('lockError');
  var pwd = input.value.trim();

  if (!pwd) { error.textContent = '请输入密码'; return; }

  if (pwd === PRIVATE_PASSWORD) {
    document.getElementById('lockScreen').classList.add('unlocked');
  } else {
    attempts++;
    input.classList.add('error');
    error.textContent = '密码错误（还可尝试 ' + (MAX_ATTEMPTS - attempts) + ' 次）';
    input.value = '';
    setTimeout(function() { input.classList.remove('error'); }, 400);

    if (attempts >= MAX_ATTEMPTS) {
      error.textContent = '尝试次数过多，请让爸爸妈妈帮你重置密码';
      document.getElementById('lockSubmit').disabled = true;
      document.getElementById('lockSubmit').style.opacity = '0.5';
      input.disabled = true;
    }
  }
}

document.getElementById('lockInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') tryUnlock();
});

function showResetWarning() { document.getElementById('resetModal').classList.add('active'); }
function closeResetModal() { document.getElementById('resetModal').classList.remove('active'); }
function confirmResetSpace() {
  closeResetModal();
  var tip = document.createElement('div');
  tip.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:20px 28px;border-radius:12px;font-size:14px;z-index:9999;text-align:center;';
  tip.innerHTML = '<div style="font-size:32px;margin-bottom:10px">🗑️</div><div style="font-weight:600;margin-bottom:4px">隐私空间已重置</div><div style="font-size:12px;color:#aaa;line-height:1.5">所有私密内容已清空<br>请设置新密码</div>';
  document.body.appendChild(tip);
  attempts = 0;
  document.getElementById('lockSubmit').disabled = false;
  document.getElementById('lockSubmit').style.opacity = '1';
  document.getElementById('lockInput').disabled = false;
  document.getElementById('lockInput').value = '';
  document.getElementById('lockError').textContent = '';
  setTimeout(function() { tip.remove(); }, 3000);
}

VoiceAssistant.init({role:'companion',primaryAvatar:'🦊',primaryName:'小箱',targets:[{id:'ai',avatar:'🦊',name:'小箱',desc:'在线',online:true,bg:'#fff3e0'}],messages:[],onSend:function(t){setTimeout(function(){VoiceAssistant.addAIMessage('小箱会帮你守护这个秘密的~')},800)}});
</script>
</body>
</html>
