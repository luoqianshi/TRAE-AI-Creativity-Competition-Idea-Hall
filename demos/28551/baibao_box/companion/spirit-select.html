<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>故事百宝箱 - 选择故事精灵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/voice-assistant.css">
<style>
:root{--primary-from:#ff9a56;--primary-to:#ff6b9d;--primary-gradient:linear-gradient(135deg,var(--primary-from),var(--primary-to));--radius-sm:14px;--shadow:0 4px 16px rgba(255,107,157,.15);--bg:#fff5f0;--card-bg:#fff;--text-primary:#333;--text-secondary:#888;--text-light:#bbb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px;overflow-x:hidden}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.top-nav{background:var(--primary-gradient);padding:44px 16px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-nav .back-btn{color:#fff;font-size:18px;background:none;border:none;cursor:pointer;padding:4px}
.top-nav .nav-title{color:#fff;font-size:17px;font-weight:700}

/* 精灵列表 */
.spirit-list{padding:16px}

.spirit-card{border-radius:var(--radius-sm);padding:20px;margin-bottom:16px;position:relative;overflow:hidden;cursor:pointer;transition:transform .2s;animation:fadeInUp .5s ease}
.spirit-card:active{transform:scale(.98)}
.spirit-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:rgba(255,255,255,.1);border-radius:50%}

.spirit-card-top{display:flex;align-items:center;gap:14px;margin-bottom:12px;position:relative;z-index:1}
.spirit-avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:36px;animation:float 3s ease-in-out infinite;flex-shrink:0}
.spirit-info{flex:1}
.spirit-name{font-size:18px;font-weight:700;color:#fff}
.spirit-personality{font-size:12px;color:rgba(255,255,255,.8);margin-top:2px}
.spirit-level{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;background:rgba(255,255,255,.2);color:#fff;margin-top:4px}

.spirit-card-bottom{display:flex;gap:10px;position:relative;z-index:1}
.spirit-btn{flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .2s}
.spirit-btn:active{transform:scale(.96)}
.spirit-btn.primary{background:rgba(255,255,255,.95);color:#333}
.spirit-btn.secondary{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3)}

.spirit-source{font-size:11px;color:rgba(255,255,255,.6);margin-top:10px;position:relative;z-index:1}

/* 精灵渐变色 */
.spirit-fox{background:linear-gradient(135deg,#ff7043,#e64a19)}
.spirit-ink{background:linear-gradient(135deg,#7c4dff,#4527a0)}
.spirit-spark{background:linear-gradient(135deg,#ec407a,#ab47bc)}
.spirit-water{background:linear-gradient(135deg,#29b6f6,#0288d1)}
.spirit-stardust{background:linear-gradient(135deg,#ab47bc,#7b1fa2)}
.spirit-echo{background:linear-gradient(135deg,#26a69a,#00897b)}

/* 底部Tab */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:64px;background:#fff;display:flex;align-items:center;justify-content:space-around;box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:1000}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;color:var(--text-light);font-size:10px;padding:4px 12px;-webkit-tap-highlight-color:transparent}
.tab-item.active{color:var(--primary-to)}
.tab-item i{font-size:20px}
.tab-item span{font-size:10px;font-weight:500}

/* 精灵背景故事弹窗 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal-sheet{width:100%;max-width:430px;max-height:70vh;background:#fff;border-radius:20px 20px 0 0;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:10px auto 8px}
.modal-spirit-header{padding:20px;text-align:center}
.modal-spirit-emoji{font-size:56px;margin-bottom:8px}
.modal-spirit-name{font-size:20px;font-weight:700}
.modal-spirit-desc{font-size:13px;color:var(--text-secondary);margin-top:4px}
.modal-spirit-story{padding:0 20px 20px;font-size:14px;line-height:1.8;color:var(--text-primary)}
.modal-spirit-story p{margin-bottom:12px}
.modal-close-btn{display:block;margin:0 20px 20px;padding:12px;border-radius:12px;border:none;background:var(--primary-gradient);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div class="top-nav">
  <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
  <span class="nav-title">选择你的故事精灵</span>
  <span></span>
</div>

<div class="spirit-list" id="spiritList"></div>

<!-- 底部Tab -->
<nav class="tab-bar">
  <a class="tab-item" href="home.html"><i class="fa-solid fa-house"></i><span>首页</span></a>
  <a class="tab-item" href="storybook.html"><i class="fa-solid fa-book"></i><span>故事本</span></a>
  <a class="tab-item" href="square.html"><i class="fa-solid fa-globe"></i><span>广场</span></a>
  <a class="tab-item" href="profile.html"><i class="fa-solid fa-user"></i><span>我的</span></a>
</nav>

<!-- 精灵背景故事弹窗 -->
<div class="modal-overlay" id="spiritModal">
  <div class="modal-sheet" id="spiritSheet"></div>
</div>

<script src="../shared/voice-assistant.js"></script>
<script>
var spirits=[
  {id:'fox',emoji:'🦊',name:'小箱',personality:'温暖活泼',level:'Lv.1 萌芽',source:'来自故事森林的守护者',cls:'spirit-fox',
   story:'<p>小箱是一只来自故事森林的小狐狸。它从小就特别喜欢听故事，每天都会跑到森林深处的大树下，听风精灵讲述各种各样的冒险故事。</p><p>有一天，小箱发现了一个神奇的百宝箱，里面装满了来自世界各地孩子们的故事。从那以后，小箱决定成为故事的守护者，帮助每一个孩子记录和分享他们的故事。</p><p>小箱最喜欢说的话是："每个故事都值得被听到！"</p>'},
  {id:'ink',emoji:'📜',name:'墨白',personality:'冷静深沉',level:'Lv.1 萌芽',source:'来自古老书阁的智者',cls:'spirit-ink',
   story:'<p>墨白是一本活了千年的古书化成的精灵。它见证了无数朝代的兴衰，记录了无数动人的故事。</p><p>墨白说话总是慢慢的，但每一句话都很有分量。它喜欢用古诗词来回应孩子们的问题，让人觉得既神秘又有趣。</p><p>墨白相信："文字是最温柔的力量。"</p>'},
  {id:'spark',emoji:'🔥',name:'火花',personality:'活泼幽默',level:'Lv.1 萌芽',source:'来自快乐星球的使者',cls:'spirit-spark',
   story:'<p>火花是从快乐星球来的小精灵！它浑身散发着温暖的橙色光芒，走到哪里都能带来欢笑。</p><p>火花最擅长讲搞笑的故事，每次都能把小朋友们逗得哈哈大笑。它说笑话的时候，尾巴上的火花会变得更亮更闪。</p><p>火花的座右铭是："笑一笑，没什么大不了！"</p>'},
  {id:'water',emoji:'🌊',name:'静水',personality:'温暖慢条斯理',level:'Lv.1 萌芽',source:'来自深海的故事收藏家',cls:'spirit-water',
   story:'<p>静水是深海里的一只温柔的水精灵。它收集了海底所有的故事，把它们变成美丽的珍珠。</p><p>静水说话慢慢的，像海浪轻轻拍打沙滩一样。它特别擅长讲温馨的故事，听完之后心里总是暖暖的。</p><p>静水常说："慢慢来，故事需要时间沉淀。"</p>'},
  {id:'stardust',emoji:'✨',name:'星尘',personality:'冷静轻松',level:'Lv.1 萌芽',source:'来自银河系的旅行者',cls:'spirit-stardust',
   story:'<p>星尘是一颗从银河系飘来的小星星。它游历了无数星球，收集了宇宙中最美丽的故事。</p><p>星尘说话的时候，周围会飘起小小的星光。它喜欢讲关于星星、月亮和宇宙的故事，让人充满想象力。</p><p>星尘相信："每个人心里都住着一片星空。"</p>'},
  {id:'echo',emoji:'🎵',name:'回响',personality:'深沉幽默',level:'Lv.1 萌芽',source:'来自音乐山谷的吟游者',cls:'spirit-echo',
   story:'<p>回响是音乐山谷里最有才华的吟游诗人。它能把任何故事都变成一首动听的歌。</p><p>回响外表看起来有点酷酷的，但其实特别幽默。它讲的故事总能在结尾来一个意想不到的反转，让人又感动又想笑。</p><p>回响说："最好的故事，是听完之后会哼起旋律的那种。"</p>'}
];

function renderSpirits(){
  var h='';
  spirits.forEach(function(s){
    h+='<div class="spirit-card '+s.cls+'" style="animation-delay:'+spirits.indexOf(s)*0.1+'s">';
    h+='<div class="spirit-card-top">';
    h+='<div class="spirit-avatar">'+s.emoji+'</div>';
    h+='<div class="spirit-info">';
    h+='<div class="spirit-name">'+s.name+'</div>';
    h+='<div class="spirit-personality">'+s.personality+'</div>';
    h+='<div class="spirit-level">'+s.level+'</div>';
    h+='</div></div>';
    h+='<div class="spirit-card-bottom">';
    h+='<button class="spirit-btn primary" onclick="event.stopPropagation();showToast(\'已选择'+s.name+'！开始聊天吧~\')">开始聊天</button>';
    h+='<button class="spirit-btn secondary" onclick="event.stopPropagation();openSpiritStory('+spirits.indexOf(s)+')">了解更多</button>';
    h+='</div>';
    h+='<div class="spirit-source"><i class="fa-solid fa-seedling"></i> '+s.source+'</div>';
    h+='</div>';
  });
  document.getElementById('spiritList').innerHTML=h;
}

function openSpiritStory(idx){
  var s=spirits[idx];
  var h='<div class="modal-handle"></div>';
  h+='<div class="modal-spirit-header">';
  h+='<div class="modal-spirit-emoji">'+s.emoji+'</div>';
  h+='<div class="modal-spirit-name">'+s.name+'</div>';
  h+='<div class="modal-spirit-desc">'+s.personality+' · '+s.level+'</div>';
  h+='</div>';
  h+='<div class="modal-spirit-story">'+s.story+'</div>';
  h+='<button class="modal-close-btn" onclick="closeSpiritModal()">我知道了</button>';
  document.getElementById('spiritSheet').innerHTML=h;
  document.getElementById('spiritModal').classList.add('active');
}

function closeSpiritModal(){document.getElementById('spiritModal').classList.remove('active')}
document.getElementById('spiritModal').addEventListener('click',function(e){if(e.target===this)closeSpiritModal()});

function showToast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:9999;animation:fadeInUp .3s ease;font-family:inherit';
  t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},1500);
}

renderSpirits();

VoiceAssistant.init({role:'companion',primaryAvatar:'🦊',primaryName:'小箱',targets:[{id:'ai',avatar:'🦊',name:'小箱',desc:'在线',online:true,bg:'#fff3e0'}],messages:[],onSend:function(t){setTimeout(function(){VoiceAssistant.addAIMessage('选好精灵了吗？每个精灵都很棒哦~')},800)}});
</script>
</body>
</html>
