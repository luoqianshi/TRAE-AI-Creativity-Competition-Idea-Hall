<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>故事百宝箱 - 故事本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/voice-assistant.css">
<style>
:root{--primary-from:#ff9a56;--primary-to:#ff6b9d;--primary-gradient:linear-gradient(135deg,var(--primary-from),var(--primary-to));--radius-sm:14px;--radius-md:20px;--shadow:0 4px 16px rgba(255,107,157,.15);--bg:#fff5f0;--card-bg:#fff;--text-primary:#333;--text-secondary:#888;--text-light:#bbb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px;overflow-x:hidden}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* 顶部导航 */
.top-nav{background:var(--primary-gradient);padding:44px 16px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-nav .back-btn{color:#fff;font-size:18px;background:none;border:none;cursor:pointer;padding:4px}
.top-nav .nav-title{color:#fff;font-size:17px;font-weight:700}
.top-nav .nav-action{color:#fff;font-size:18px;background:none;border:none;cursor:pointer;padding:4px}

/* 排序+筛选区 */
.filter-bar{padding:12px 16px;display:flex;align-items:center;gap:10px}
.sort-btn{display:flex;align-items:center;gap:4px;padding:6px 14px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;font-size:12px;color:var(--text-secondary);cursor:pointer;font-family:inherit;white-space:nowrap}
.sort-btn i{font-size:10px;color:var(--primary-to)}
.tag-scroll{display:flex;gap:8px;overflow-x:auto;flex:1;padding:4px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tag-scroll::-webkit-scrollbar{display:none}
.tag-pill{padding:6px 14px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:var(--text-secondary);transition:all .2s;flex-shrink:0}
.tag-pill.active{background:var(--primary-gradient);color:#fff;border-color:transparent}

/* 故事列表 - 36Kr风格 */
.story-list{padding:0 16px}
.story-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;animation:fadeInUp .4s ease;transition:transform .2s}
.story-item:active{transform:scale(.98)}
.story-item:last-child{border-bottom:none}
.story-cover{width:110px;height:78px;border-radius:10px;object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:36px}
.story-body{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.story-title{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.story-excerpt{font-size:12px;color:var(--text-secondary);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.story-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--text-light)}
.story-tag{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:500}
.story-voice{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--primary-to)}
.ai-tag{display:flex;align-items:center;gap:3px;font-size:10px;color:#9c27b0;background:#f3e5f5;padding:2px 6px;border-radius:6px;font-weight:500}
/* 情绪标签颜色 */
.tag-搞笑{background:#fff3e0;color:#e65100}.tag-有趣{background:#f3e5f5;color:#7b1fa2}.tag-激动{background:#fff9c4;color:#f57f17}.tag-有意义{background:#e8f5e9;color:#2e7d32}.tag-纪念{background:#e0f7fa;color:#00838f}.tag-平静{background:#f3e5f5;color:#6a1b9a}.tag-难过{background:#e3f2fd;color:#1565c0}.tag-悲伤{background:#ede7f6;color:#4527a0}.tag-烦恼{background:#fce4ec;color:#c62828}.tag-郁闷{background:#efebe9;color:#4e342e}.tag-emo{background:#263238;color:#b0bec5}.tag-痛苦{background:#212121;color:#9e9e9e}.tag-温暖{background:#fff0f0;color:#d32f2f}.tag-开心{background:#e8f5e9;color:#2e7d32}.tag-感动{background:#fce4ec;color:#c2185b}.tag-温馨{background:#fff8e1;color:#f9a825}.tag-担心{background:#f3e5f5;color:#7b1fa2}

/* 封面颜色 */
.cover-0{background:linear-gradient(135deg,#ffe0b2,#ffcc80)}.cover-1{background:linear-gradient(135deg,#b3e5fc,#81d4fa)}.cover-2{background:linear-gradient(135deg,#fff9c4,#fff176)}.cover-3{background:linear-gradient(135deg,#c8e6c9,#a5d6a7)}.cover-4{background:linear-gradient(135deg,#e0f7fa,#80deea)}.cover-5{background:linear-gradient(135deg,#dcedc8,#c5e1a5)}.cover-6{background:linear-gradient(135deg,#bbdefb,#90caf9)}.cover-7{background:linear-gradient(135deg,#424242,#616161)}

/* 底部Tab */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:64px;background:#fff;display:flex;align-items:center;justify-content:space-around;box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:1000}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;color:var(--text-light);font-size:10px;padding:4px 12px;-webkit-tap-highlight-color:transparent}
.tab-item.active{color:var(--primary-to)}
.tab-item i{font-size:20px}
.tab-item span{font-size:10px;font-weight:500}

/* ===== 弹窗通用 ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:2000;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal-sheet{width:100%;max-width:430px;max-height:85vh;background:#fff;border-radius:20px 20px 0 0;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:10px auto 8px}
.modal-close{position:absolute;top:12px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.06);border:none;font-size:14px;color:#666;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ===== 故事详情弹窗 ===== */
.detail-modal .modal-sheet{padding:0 0 20px;position:relative}
.detail-cover{width:100%;height:200px;display:flex;align-items:center;justify-content:center;font-size:72px}
.detail-info{padding:14px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail-tag{padding:3px 10px;border-radius:10px;font-size:12px;font-weight:500}
.detail-date{font-size:12px;color:var(--text-light)}
.detail-more-btn{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#f5f5f5;border:none;font-size:14px;color:#666;cursor:pointer}
.detail-body{padding:0 16px 16px;font-size:14px;line-height:1.8;color:var(--text-primary)}
.detail-body p{margin-bottom:12px}
.detail-body .detail-img{width:100%;border-radius:10px;height:160px;display:flex;align-items:center;justify-content:center;font-size:48px;margin:12px 0}
.detail-body .img-caption{font-size:12px;color:var(--text-light);text-align:center;margin-top:-6px;margin-bottom:12px}
/* 配音播放条 */
.audio-bar{margin:0 16px 16px;background:#f5f5f5;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.audio-play-btn{width:36px;height:36px;border-radius:50%;background:var(--primary-gradient);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.audio-progress{flex:1;height:4px;background:#e0e0e0;border-radius:2px;position:relative;cursor:pointer}
.audio-progress-fill{height:100%;background:var(--primary-gradient);border-radius:2px;width:35%;transition:width .3s}
.audio-time{font-size:11px;color:var(--text-light);white-space:nowrap}
/* 更多菜单 */
.more-menu{position:absolute;top:48px;right:16px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);padding:6px 0;z-index:10;min-width:160px;display:none}
.more-menu.active{display:block}
.more-menu-item{padding:10px 16px;font-size:13px;color:var(--text-primary);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.more-menu-item:hover{background:#f5f5f5}
.more-menu-item.disabled{color:#bbb;pointer-events:none}
.more-menu-item i{width:16px;text-align:center;font-size:12px}
.more-menu-divider{height:1px;background:#f0f0f0;margin:4px 0}
/* 底部按钮 */
.detail-footer{padding:12px 16px;display:flex;gap:10px}
.detail-footer-btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .2s}
.detail-footer-btn:active{transform:scale(.97)}
.detail-footer-btn.primary{background:var(--primary-gradient);color:#fff}
.detail-footer-btn.secondary{background:#f5f5f5;color:var(--text-primary)}

/* ===== 继续聊天弹窗 ===== */
.chat-modal .modal-sheet{display:flex;flex-direction:column;height:80vh}
.chat-header{padding:14px 16px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-header-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff3e0}
.chat-header-info{flex:1}
.chat-header-name{font-size:14px;font-weight:600}
.chat-header-desc{font-size:11px;color:var(--text-secondary)}
.chat-messages{flex:1;overflow-y:auto;padding:16px}
.chat-msg{display:flex;margin-bottom:12px;animation:fadeInUp .3s ease}
.chat-msg.left{justify-content:flex-start}
.chat-msg.right{justify-content:flex-end}
.chat-msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-right:8px}
.chat-msg.right .chat-msg-avatar{margin-right:0;margin-left:8px}
.chat-msg-bubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6;word-break:break-word}
.chat-msg.left .chat-msg-bubble{background:#f5f0ff;color:#333;border-bottom-left-radius:4px}
.chat-msg.right .chat-msg-bubble{background:var(--primary-gradient);color:#fff;border-bottom-right-radius:4px}
.chat-msg-bubble.voice-bubble{display:flex;align-items:center;gap:8px;min-width:100px;cursor:pointer}
.voice-bars{display:flex;align-items:center;gap:2px;height:18px}
.voice-bars span{width:3px;border-radius:2px;background:currentColor}
.voice-bars span:nth-child(1){height:5px}.voice-bars span:nth-child(2){height:10px}.voice-bars span:nth-child(3){height:7px}.voice-bars span:nth-child(4){height:14px}.voice-bars span:nth-child(5){height:9px}.voice-bars span:nth-child(6){height:12px}
.voice-dur{font-size:11px;opacity:.8}
.chat-input-area{padding:10px 16px;border-top:1px solid #f0f0f0;display:flex;gap:10px;align-items:center;flex-shrink:0}
.chat-input{flex:1;height:38px;border:1px solid #e0e0e0;border-radius:19px;padding:0 14px;font-size:13px;outline:none;font-family:inherit}
.chat-input:focus{border-color:var(--primary-to)}
.chat-send-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--primary-gradient);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-voice-toggle{width:38px;height:38px;border-radius:50%;border:none;background:#f5f5f5;color:#666;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ===== 匿名发布弹窗 ===== */
.anon-modal .modal-sheet{padding:0 0 20px}
.anon-step{padding:16px}
.anon-step-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.anon-step-title i{color:var(--primary-to)}
.anon-original{background:#fafafa;border-radius:12px;padding:14px;font-size:13px;line-height:1.7;color:var(--text-secondary);margin-bottom:12px}
.anon-original .highlight{background:#fff3cd;border-radius:4px;padding:0 2px;color:#e65100;font-weight:500}
.anon-edited{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:14px;font-size:13px;line-height:1.7;min-height:100px;outline:none;width:100%;font-family:inherit;resize:none}
.anon-actions{display:flex;gap:10px;padding:0 16px}
.anon-actions button{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.anon-actions .cancel{background:#f5f5f5;color:var(--text-primary)}
.anon-actions .confirm{background:var(--primary-gradient);color:#fff}
.anon-success{text-align:center;padding:40px 20px}
.anon-success-icon{font-size:56px;margin-bottom:12px}
.anon-success-text{font-size:16px;font-weight:600;color:var(--text-primary)}
.anon-success-desc{font-size:13px;color:var(--text-secondary);margin-top:6px}

/* 隐私空间入口 */
.private-entry{padding:16px;text-align:center}
.private-entry a{font-size:11px;color:#ccc;text-decoration:none;transition:color .2s}
.private-entry a:hover{color:#aaa}
</style>
</head>

<script>
/* ===== 数据 ===== */
var EMOTION_ORDER = ['搞笑','有趣','激动','有意义','纪念','平静','难过','悲伤','烦恼','郁闷','emo','痛苦'];
var EMOTION_SCORE = {};
EMOTION_ORDER.forEach(function(e,i){ EMOTION_SCORE[e]=i; });

var stories = [
  {id:0,title:'老爸学用智能手机',tags:['搞笑','有趣'],aiTags:['搞笑','有趣'],aiConfidence:'96%',date:'2025-06-15',emoji:'🤓',coverClass:'cover-0',hasAudio:true,audioDur:'2:35',
   excerpt:'老爸第一次用智能手机，把微信语音发到了群里，结果全家人都笑翻了...',
   body:'<p>今天发生了一件超级搞笑的事情！老爸说他要学习用智能手机，让我们教他。</p><p>结果他拿起手机就开始对着屏幕大喊："喂喂喂？听得见吗？"我和妈妈笑得肚子都疼了。</p><div class="detail-img" style="background:linear-gradient(135deg,#ffe0b2,#ffcc80)">📱</div><p class="img-caption">老爸认真研究手机的样子</p><p>后来他学会了发微信语音，但是不知道要松手才能发送，结果录了一段30秒的"嗯...这个...那个..."发到了家族群里。</p><p>姑姑回复说："哥，你这是在练气功吗？"全家人都笑翻了！</p>'},
  {id:1,title:'雨天的温暖',tags:['有趣','温暖'],aiTags:['有趣','温暖'],aiConfidence:'91%',date:'2025-06-13',emoji:'🌧️',coverClass:'cover-1',hasAudio:true,audioDur:'3:12',
   excerpt:'放学的时候突然下起了大雨，我没有带伞，正不知道怎么办的时候...',
   body:'<p>放学的时候突然下起了大雨，我没有带伞，站在学校门口不知道怎么办。</p><p>这时候，我的好朋友小雨跑过来，把她的伞举到我们两个人头上说："一起走吧！"</p><div class="detail-img" style="background:linear-gradient(135deg,#b3e5fc,#81d4fa)">☂️</div><p class="img-caption">两个人挤在一把伞下</p><p>我们一路走一路笑，虽然两个人的肩膀都淋湿了，但是心里暖暖的。这就是友情的力量吧！</p>'},
  {id:2,title:'项目评审通过',tags:['激动','开心'],aiTags:['激动','开心'],aiConfidence:'94%',date:'2025-06-10',emoji:'🎉',coverClass:'cover-2',hasAudio:false,audioDur:'',
   excerpt:'经过一个月的努力，我的项目终于通过了评审！那一刻我激动得差点跳起来...',
   body:'<p>今天是我最激动的一天！经过整整一个月的努力，我的项目终于通过了评审！</p><p>当老师念到我的名字说"通过"的时候，我激动得差点从椅子上跳起来。同学们都给我鼓掌，我感到特别特别开心。</p><p>这一个月里，我每天放学后都在修改方案，有时候做到很晚。妈妈总是给我端来热牛奶说："宝贝加油！"</p><p>现在回想起来，那些辛苦都是值得的！</p>'},
  {id:3,title:'孩子第一次叫妈妈',tags:['有意义','感动'],aiTags:['有意义','感动'],aiConfidence:'89%',date:'2025-06-08',emoji:'👶',coverClass:'cover-3',hasAudio:true,audioDur:'1:58',
   excerpt:'今天是一个特别有意义的日子，因为小宝第一次清楚地叫了"妈妈"...',
   body:'<p>今天是一个特别有意义的日子！</p><p>小宝一直咿咿呀呀的，今天突然很清楚地说了一句："妈妈！"</p><p>妈妈当时正在厨房做饭，听到这句话，手里的锅铲都掉了，跑过来一把抱住小宝，眼泪都流出来了。</p><div class="detail-img" style="background:linear-gradient(135deg,#c8e6c9,#a5d6a7)">👶</div><p class="img-caption">小宝第一次叫妈妈的瞬间</p><p>爸爸在旁边偷偷擦眼泪，还假装说"眼睛进沙子了"。这个家因为一个小小的"妈妈"变得特别温暖。</p>'},
  {id:4,title:'爷爷的手写信',tags:['纪念','悲伤'],aiTags:['纪念','悲伤'],aiConfidence:'93%',date:'2025-06-05',emoji:'✉️',coverClass:'cover-4',hasAudio:true,audioDur:'4:20',
   excerpt:'在整理旧物的时候，我发现了一封爷爷写给我的手写信，那是他去世前一个月写的...',

/* ===== 状态 ===== */
var sortState = 0; // 0=情绪 1=最新 2=最早
var sortLabels = ['情绪排序','最新优先','最早优先'];
var activeTag = null;
var filteredStories = stories.slice();

/* ===== 初始化 ===== */
function init() {
  renderTags();
  applySortAndFilter();
}

function renderTags() {
  var html = '<div class="tag-pill active" data-tag="" onclick="filterTag(this)">全部</div>';
  EMOTION_ORDER.forEach(function(tag) {
    html += '<div class="tag-pill" data-tag="'+tag+'" onclick="filterTag(this)">'+tag+'</div>';
  });
  document.getElementById('tagScroll').innerHTML = html;
}

function toggleSort() {
  sortState = (sortState + 1) % 3;
  document.getElementById('sortLabel').textContent = sortLabels[sortState];
  applySortAndFilter();
}

function filterTag(el) {
  document.querySelectorAll('.tag-pill').forEach(function(p){p.classList.remove('active')});
  el.classList.add('active');
  activeTag = el.dataset.tag || null;
  applySortAndFilter();
}

function applySortAndFilter() {
  filteredStories = stories.filter(function(s) {
    return !activeTag || s.tags.indexOf(activeTag) !== -1;
  });
  filteredStories.sort(function(a,b) {
    if (sortState === 0) return (EMOTION_SCORE[a.tags[0]]||0) - (EMOTION_SCORE[b.tags[0]]||0);
    if (sortState === 1) return new Date(b.date) - new Date(a.date);
    return new Date(a.date) - new Date(b.date);
  });
  renderStories();
}

function renderStories() {
  var html = '';
  filteredStories.forEach(function(s) {
    var tagsHtml = '';
    s.tags.forEach(function(t) {
      tagsHtml += '<span class="story-tag tag-'+t+'">'+t+'</span>';
    });
    html += '<div class="story-item" onclick="openDetail('+s.id+')">';
    html += '<div class="story-cover '+s.coverClass+'">'+s.emoji+'</div>';
    html += '<div class="story-body">';
    html += '<div class="story-title">'+s.title+'</div>';
    html += '<div class="story-excerpt">'+s.excerpt+'</div>';
    html += '<div class="story-meta">';
    html += tagsHtml;
    html += '<span class="ai-tag"><i class="fa-solid fa-wand-magic-sparkles"></i> AI '+s.aiConfidence+'</span>';
    html += '<span>'+s.date+'</span>';
    if(s.hasAudio) html += '<span class="story-voice"><i class="fa-solid fa-headphones"></i> 配音</span>';
    html += '</div></div></div>';
  });
  document.getElementById('storyList').innerHTML = html || '<div style="text-align:center;padding:40px;color:#bbb;font-size:14px">暂无故事</div>';
}

/* ===== 故事详情弹窗 ===== */
function openDetail(id) {
  var s = stories[id];
  var detailTagsHtml = '';
  s.tags.forEach(function(t) {
    detailTagsHtml += '<span class="detail-tag tag-'+t+'">'+t+'</span>';
  });
  var html = '<div class="modal-handle"></div>';
  html += '<button class="modal-close" onclick="closeModal(\'detailModal\')"><i class="fa-solid fa-xmark"></i></button>';
  html += '<div class="detail-cover '+s.coverClass+'">'+s.emoji+'</div>';
  html += '<div class="detail-info">';
  html += detailTagsHtml;
  html += '<span class="detail-date">'+s.date+'</span>';
  html += '<button class="detail-more-btn" onclick="toggleMoreMenu(event)"><i class="fa-solid fa-ellipsis"></i></button>';
  html += '</div>';
  html += '<div class="more-menu" id="moreMenu">';
  html += '<div class="more-menu-item" onclick="openAnon('+id+')"><i class="fa-solid fa-user-secret"></i> 匿名发布</div>';
  html += '<div class="more-menu-item disabled"><i class="fa-solid fa-images"></i> 图文配音版 (即将上线)</div>';
  html += '<div class="more-menu-item disabled"><i class="fa-solid fa-masks-theater"></i> 漫画配音版 (即将上线)</div>';
  html += '<div class="more-menu-item disabled"><i class="fa-solid fa-video"></i> 视频版 (即将上线)</div>';
  html += '<div class="more-menu-divider"></div>';
  html += '<div class="more-menu-item" style="color:#ff3b30" onclick="deleteStory('+id+')"><i class="fa-solid fa-trash"></i> 删除</div>';
  html += '</div>';
  if(s.hasAudio) {
    html += '<div class="audio-bar">';
    html += '<button class="audio-play-btn" onclick="toggleAudio(this)"><i class="fa-solid fa-play"></i></button>';
    html += '<div class="audio-progress"><div class="audio-progress-fill"></div></div>';
    html += '<span class="audio-time">'+s.audioDur+'</span>';
    html += '</div>';
  }
  html += '<div class="detail-body">'+s.body+'</div>';
  html += '<div class="detail-footer">';
  html += '<button class="detail-footer-btn primary" onclick="openChat('+id+')"><i class="fa-solid fa-comments"></i> 故事后续</button>';
  html += '<button class="detail-footer-btn secondary" onclick="closeModal(\'detailModal\')"><i class="fa-solid fa-bookmark"></i> 收藏</button>';
  html += '</div>';
  document.getElementById('detailSheet').innerHTML = html;
  showModal('detailModal');
}

function toggleMoreMenu(e) {
  e.stopPropagation();
  document.getElementById('moreMenu').classList.toggle('active');
}

function toggleAudio(btn) {
  var icon = btn.querySelector('i');
  if(icon.classList.contains('fa-play')) {
    icon.classList.remove('fa-play');
    icon.classList.add('fa-pause');
  } else {
    icon.classList.remove('fa-pause');
    icon.classList.add('fa-play');
  }
}

function deleteStory(id) {
  document.getElementById('moreMenu').classList.remove('active');
  closeModal('detailModal');
  stories.splice(id,1);
  applySortAndFilter();
  showToast('故事已删除');
}

/* ===== 继续聊天弹窗 ===== */
function openChat(id) {
  closeModal('detailModal');
  var s = stories[id];
  var chatData = [
    {side:'left',text:'哇，"'+s.title+'"这个故事好有意思！你能再告诉我更多细节吗？'},
    {side:'right',text:'嗯...当时其实还有一个小细节我忘了说'},
    {side:'left',text:'什么细节呀？快告诉我！'},
    {side:'right',type:'voice',dur:'8"'},
    {side:'left',text:'天哪！真的吗？太不可思议了！那后来呢？'},
    {side:'right',text:'后来嘛...事情的发展出乎所有人的意料'},
    {side:'left',text:'你这么一说，我更加好奇了！这个故事可以写成一本小书呢~'},
    {side:'right',text:'哈哈，也许以后可以！谢谢小箱陪我聊这个故事'}
  ];
  var html = '<div class="modal-handle"></div>';
  html += '<div class="chat-header">';
  html += '<div class="chat-header-avatar">🦊</div>';
  html += '<div class="chat-header-info"><div class="chat-header-name">小箱</div><div class="chat-header-desc">AI故事精灵 · 在线</div></div>';
  html += '<button class="modal-close" onclick="closeModal(\'chatModal\')" style="position:static"><i class="fa-solid fa-xmark"></i></button>';
  html += '</div>';
  html += '<div class="chat-messages" id="chatMessages"></div>';
  html += '<div class="chat-input-area">';
  html += '<button class="chat-voice-toggle" onclick="toggleChatMode(this)"><i class="fa-solid fa-microphone"></i></button>';
  html += '<input class="chat-input" placeholder="输入消息..." id="chatInput" onkeydown="if(event.key===\'Enter\'&&this.value.trim()){sendChatMsg();this.value=\'\'}">';
  html += '<button class="chat-send-btn" onclick="sendChatMsg()"><i class="fa-solid fa-paper-plane"></i></button>';
  html += '</div>';
  document.getElementById('chatSheet').innerHTML = html;
  showModal('chatModal');
  // 逐条显示消息
  var msgArea = document.getElementById('chatMessages');
  chatData.forEach(function(msg, i) {
    setTimeout(function() {
      var div = document.createElement('div');
      div.className = 'chat-msg ' + msg.side;
      if(msg.type === 'voice') {
        var bubble = '<div class="chat-msg-bubble voice-bubble"><div class="voice-bars">';
        for(var j=0;j<6;j++) bubble += '<span></span>';
        bubble += '</div><span class="voice-dur">'+msg.dur+'</span></div>';
        if(msg.side === 'left') {
          div.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div>' + bubble;
        } else {
          div.innerHTML = bubble + '<div class="chat-msg-avatar" style="background:linear-gradient(135deg,#ff9a56,#ff6b9d)">😊</div>';
        }
      } else {
        var bubbleText = '<div class="chat-msg-bubble">'+msg.text+'</div>';
        if(msg.side === 'left') {
          div.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div>' + bubbleText;
        } else {
          div.innerHTML = bubbleText + '<div class="chat-msg-avatar" style="background:linear-gradient(135deg,#ff9a56,#ff6b9d)">😊</div>';
        }
      }
      msgArea.appendChild(div);
      msgArea.scrollTop = msgArea.scrollHeight;
    }, i * 600);
  });
}

function sendChatMsg() {
  var input = document.getElementById('chatInput');
  if(!input.value.trim()) return;
  var msgArea = document.getElementById('chatMessages');
  var div = document.createElement('div');
  div.className = 'chat-msg right';
  div.innerHTML = '<div class="chat-msg-bubble">'+input.value+'</div><div class="chat-msg-avatar" style="background:linear-gradient(135deg,#ff9a56,#ff6b9d)">😊</div>';
  msgArea.appendChild(div);
  msgArea.scrollTop = msgArea.scrollHeight;
  input.value = '';
  setTimeout(function() {
    var aiDiv = document.createElement('div');
    aiDiv.className = 'chat-msg left';
    aiDiv.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div><div class="chat-msg-bubble">嗯嗯，我明白了！这个故事越来越精彩了呢~</div>';
    msgArea.appendChild(aiDiv);
    msgArea.scrollTop = msgArea.scrollHeight;
  }, 800);
}

function toggleChatMode(btn) {
  var icon = btn.querySelector('i');
  var input = document.getElementById('chatInput');
  if(icon.classList.contains('fa-microphone')) {
    icon.classList.remove('fa-microphone');
    icon.classList.add('fa-keyboard');
    input.placeholder = '语音模式（按住说话）';
    input.type = 'button';
    input.value = '🎤 按住说话';
  } else {
    icon.classList.remove('fa-keyboard');
    icon.classList.add('fa-microphone');
    input.placeholder = '输入消息...';
    input.type = 'text';
    input.value = '';
  }
}

/* ===== 匿名发布弹窗 ===== */

  document.getElementById('moreMenu').classList.remove('active');

  var s = stories[id];
  var html = '<div class="modal-handle"></div>';
  html += '<div class="anon-step">';
  html += '<div class="anon-step-title"><i class="fa-solid fa-wand-magic-sparkles"></i> AI匿名替换</div>';

function confirmAnon() {

/* ===== 弹窗控制 ===== */
function showModal(id) {
  document.getElementById(id).classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}
document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
  overlay.addEventListener('click', function(e) {
    if(e.target === this) this.classList.remove('active');
  });
});

/* ===== Toast ===== */
function showToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:9999;animation:fadeInUp .3s ease;font-family:inherit';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove()},1500);
}
