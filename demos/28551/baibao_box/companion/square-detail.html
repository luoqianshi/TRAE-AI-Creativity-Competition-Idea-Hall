<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>故事百宝箱 - 广场故事详情</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/voice-assistant.css">
<style>
:root{--primary-from:#ff9a56;--primary-to:#ff6b9d;--primary-gradient:linear-gradient(135deg,var(--primary-from),var(--primary-to));--radius-sm:14px;--shadow:0 4px 16px rgba(255,107,157,.15);--bg:#fff5f0;--card-bg:#fff;--text-primary:#333;--text-secondary:#888;--text-light:#bbb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px;overflow-x:hidden}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.top-nav{background:var(--primary-gradient);padding:44px 16px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-nav .back-btn{color:#fff;font-size:18px;background:none;border:none;cursor:pointer;padding:4px}
.top-nav .nav-title{color:#fff;font-size:17px;font-weight:700}
.top-nav .share-btn{color:#fff;font-size:18px;background:none;border:none;cursor:pointer;padding:4px}

/* 封面 */
.detail-cover{width:100%;height:220px;display:flex;align-items:center;justify-content:center;font-size:80px}

/* 信息栏 */
.detail-info{padding:14px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail-tag{padding:3px 10px;border-radius:10px;font-size:12px;font-weight:500}
.detail-anon{padding:3px 10px;border-radius:10px;font-size:12px;background:#f5f5f5;color:#999;display:flex;align-items:center;gap:4px}
.detail-date{font-size:12px;color:var(--text-light)}

/* 配音播放条 */
.audio-bar{margin:0 16px 16px;background:#fff;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.audio-play-btn{width:36px;height:36px;border-radius:50%;background:var(--primary-gradient);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.audio-progress{flex:1;height:4px;background:#e0e0e0;border-radius:2px;position:relative;cursor:pointer}
.audio-progress-fill{height:100%;background:var(--primary-gradient);border-radius:2px;width:0%;transition:width .3s}
.audio-time{font-size:11px;color:var(--text-light);white-space:nowrap}

/* 正文 */
.detail-body{padding:0 16px 20px;font-size:15px;line-height:1.8;color:var(--text-primary)}
.detail-body p{margin-bottom:14px}
.detail-body .detail-img{width:100%;border-radius:10px;height:180px;display:flex;align-items:center;justify-content:center;font-size:56px;margin:14px 0}
.detail-body .img-caption{font-size:12px;color:var(--text-light);text-align:center;margin-top:-8px;margin-bottom:14px}

/* 点赞大按钮 */
.like-section{text-align:center;padding:20px 16px}
.like-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 36px;border-radius:30px;border:2px solid #f0f0f0;background:#fff;cursor:pointer;font-size:16px;font-weight:600;color:var(--text-secondary);transition:all .2s;font-family:inherit}
.like-btn.liked{border-color:var(--primary-to);color:var(--primary-to);background:rgba(255,107,157,.05)}
.like-btn i{font-size:22px;transition:transform .3s}
.like-btn.liked i{transform:scale(1.2)}
.like-btn:active{transform:scale(.95)}

/* 评论区 */
.comment-section{padding:0 16px 100px}
.comment-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.comment-title i{color:var(--primary-to)}
.comment-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f5f5f5}
.comment-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.comment-body{flex:1}
.comment-name{font-size:13px;font-weight:600;color:var(--text-primary)}
.comment-text{font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.5}
.comment-time{font-size:11px;color:var(--text-light);margin-top:4px}

/* 底部评论输入 */
.comment-input-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:100}
.comment-input{flex:1;height:40px;border:1px solid #e0e0e0;border-radius:20px;padding:0 16px;font-size:14px;outline:none;font-family:inherit}
.comment-input:focus{border-color:var(--primary-to)}
.comment-send{width:40px;height:40px;border-radius:50%;border:none;background:var(--primary-gradient);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.tag-搞笑{background:#fff3e0;color:#e65100}.tag-有趣{background:#f3e5f5;color:#7b1fa2}.tag-激动{background:#fff9c4;color:#f57f17}.tag-有意义{background:#e8f5e9;color:#2e7d32}.tag-纪念{background:#e0f7fa;color:#00838f}.tag-平静{background:#f3e5f5;color:#6a1b9a}.tag-难过{background:#e3f2fd;color:#1565c0}.tag-悲伤{background:#ede7f6;color:#4527a0}.tag-烦恼{background:#fce4ec;color:#c62828}.tag-郁闷{background:#efebe9;color:#4e342e}.tag-emo{background:#263238;color:#b0bec5}.tag-痛苦{background:#212121;color:#9e9e9e}
.cover-0{background:linear-gradient(135deg,#ffe0b2,#ffcc80)}.cover-1{background:linear-gradient(135deg,#b3e5fc,#81d4fa)}.cover-2{background:linear-gradient(135deg,#fff9c4,#fff176)}.cover-3{background:linear-gradient(135deg,#c8e6c9,#a5d6a7)}.cover-4{background:linear-gradient(135deg,#e0f7fa,#80deea)}.cover-5{background:linear-gradient(135deg,#dcedc8,#c5e1a5)}.cover-6{background:linear-gradient(135deg,#bbdefb,#90caf9)}.cover-7{background:linear-gradient(135deg,#424242,#616161)}
</style>
</head>
<body>

<div class="top-nav">
  <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
  <span class="nav-title" id="navTitle">故事详情</span>
  <button class="share-btn" onclick="showToast('分享功能即将上线~')"><i class="fa-solid fa-share-nodes"></i></button>
</div>

<div id="detailContent"></div>

<!-- 底部评论输入 -->
<div class="comment-input-bar">
  <input class="comment-input" placeholder="写评论..." id="commentInput" onkeydown="if(event.key==='Enter'&&this.value.trim()){sendComment();this.value=''}">
  <button class="comment-send" onclick="sendComment()"><i class="fa-solid fa-paper-plane"></i></button>
</div>

<script src="../shared/voice-assistant.js"></script>
<script>
var storyData=[
  {id:0,title:'第一次独自做饭',tag:'搞笑',date:'2025-06-14',emoji:'🍳',coverClass:'cover-0',likes:128,hasAudio:true,audioDur:'2:18',

  {id:1,title:'雨天偶遇的温暖',tag:'有趣',date:'2025-06-12',emoji:'🌈',coverClass:'cover-1',likes:96,hasAudio:true,audioDur:'3:05',
   body:'<p>下雨天在公交站等车，雨越下越大，我却没有带伞。</p><p>这时候旁边一个阿姨主动把伞挪过来，说："小姑娘，一起撑吧，别淋湿了。"</p><div class="detail-img cover-1">☂️</div><p class="img-caption">雨中共享的温暖</p><p>我们就这样一起等到了公交车。虽然只是短短十几分钟，但那种被陌生人关心的感觉真的很温暖。</p><p>希望我也能成为给别人撑伞的人。</p>',

   ]},
  {id:3,title:'外婆的菜园',tag:'有意义',date:'2025-06-08',emoji:'🌻',coverClass:'cover-3',likes:167,hasAudio:true,audioDur:'4:10',
   body:'<p>外婆有一个小小的菜园，虽然不大，但种满了各种各样的蔬菜。</p><p>每天早上外婆都会去浇水除草，她说这些菜就像她的孩子一样。</p><div class="detail-img cover-3">🌻</div><p class="img-caption">外婆的宝贝菜园</p><p>暑假的时候我帮外婆浇水，她教我怎么分辨不同的菜苗。那些简单的时光，是我最珍贵的记忆。</p>',
   comments:[
     {avatar:'👵',name:'匿名用户A',text:'好温暖的故事，让我想起了我的奶奶',time:'4小时前'},
     {avatar:'🌱',name:'匿名用户B',text:'外婆的菜园里种的不只是菜，还有爱',time:'12小时前'},
     {avatar:'❤️',name:'匿名用户C',text:'珍惜和外婆在一起的每一天',time:'2天前'}
   ]},
  {id:4,title:'毕业那天',tag:'纪念',date:'2025-06-05',emoji:'🎓',coverClass:'cover-4',likes:302,hasAudio:true,audioDur:'3:40',
   body:'<p>毕业那天，天空特别蓝。</p><p>我们全班同学抱在一起哭了，老师说："这只是一个开始，你们的故事才刚刚开始。"</p><div class="detail-img cover-4">🎓</div><p class="img-caption">毕业典礼</p><p>我翻看着同学们写的留言册，每一页都是满满的祝福和不舍。那些一起笑过、哭过、闹过的日子，都变成了最珍贵的回忆。</p>',
   comments:[
     {avatar:'🎓',name:'匿名用户A',text:'看哭了...毕业是最不舍的告别',time:'2小时前'},
     {avatar:'📖',name:'匿名用户B',text:'每一个毕业季都有说不完的故事',time:'1天前'},
     {avatar:'🌈',name:'匿名用户C',text:'前方路还长，带着回忆勇敢前行吧',time:'3天前'}
   ]},
  {id:5,title:'午后的猫咪',tag:'平静',date:'2025-06-03',emoji:'🐱',coverClass:'cover-5',likes:89,hasAudio:false,audioDur:'',
   body:'<p>午后阳光洒在阳台上，猫咪懒洋洋地趴着打盹。</p><p>我也靠在椅子上发呆，看着猫咪的肚子一起一伏，感觉整个世界都安静了下来。</p><div class="detail-img cover-5">🐱</div><p class="img-caption">慵懒的午后时光</p><p>有时候什么都不做，就这样安静地待着，也是一种幸福。</p>',
   comments:[
     {avatar:'😺',name:'匿名用户A',text:'猫咪就是治愈系的存在！',time:'5小时前'},
     {avatar:'☀️',name:'匿名用户B',text:'平淡的日子才是最幸福的',time:'1天前'},
     {avatar:'🍵',name:'匿名用户C',text:'好想也有这样一个安静的午后',time:'2天前'}
   ]},
  {id:6,title:'和好朋友吵架',tag:'难过',date:'2025-05-30',emoji:'💔',coverClass:'cover-6',likes:74,hasAudio:true,audioDur:'3:20',
   body:'<p>因为一点小事和最好的朋友吵了架。</p><p>冷战了三天，每天看到她都假装不在意，但其实心里特别难受。</p><div class="detail-img cover-6">💔</div><p class="img-caption">冷战的日子</p><p>最后还是我先低头道歉了。她看到我的时候也红了眼眶，说："我等你三天了。"我们抱在一起，又和好了。</p>',
   comments:[
     {avatar:'🫂',name:'匿名用户A',text:'真正的友情经得起考验',time:'3小时前'},
     {avatar:'💕',name:'匿名用户B',text:'先低头不是认输，是因为更珍惜这段友情',time:'10小时前'},
     {avatar:'🌈',name:'匿名用户C',text:'和好之后感情会更好哦',time:'1天前'}
   ]},
  {id:7,title:'深夜的思考',tag:'emo',date:'2025-05-27',emoji:'🌙',coverClass:'cover-7',likes:156,hasAudio:true,audioDur:'2:55',
   body:'<p>凌晨三点还醒着，看着窗外的月亮，想着很多很多的事情。</p><p>那些白天不想面对的情绪，到了深夜全都涌了上来。</p><div class="detail-img cover-7">🌙</div><p class="img-caption">深夜的月光</p><p>但是我想，每个人都会有这样的夜晚吧。重要的是，第二天太阳还是会照常升起。一切都会好起来的。</p>',
   comments:[
     {avatar:'🌙',name:'匿名用户A',text:'深夜emo是每个人的必修课',time:'1小时前'},
     {avatar:'☀️',name:'匿名用户B',text:'明天会更好的，加油！',time:'6小时前'},
     {avatar:'🤗',name:'匿名用户C',text:'你不是一个人，我们都在',time:'1天前'}
   ]}
];

var params=new URLSearchParams(window.location.search);
var id=parseInt(params.get('id'))||0;
var story=storyData[id]||storyData[0];
var isLiked=false;

function render(){
  document.getElementById('navTitle').textContent=story.title;
  var h='<div class="detail-cover '+story.coverClass+'">'+story.emoji+'</div>';
  h+='<div class="detail-info">';
  h+='<span class="detail-tag tag-'+story.tag+'">'+story.tag+'</span>';
  h+='<span class="detail-anon"><i class="fa-solid fa-user-secret"></i> 匿名</span>';
  h+='<span class="detail-date">'+story.date+'</span>';
  h+='</div>';
  if(story.hasAudio){
    h+='<div class="audio-bar">';
    h+='<button class="audio-play-btn" onclick="toggleAudio(this)"><i class="fa-solid fa-play"></i></button>';
    h+='<div class="audio-progress"><div class="audio-progress-fill" id="audioFill"></div></div>';
    h+='<span class="audio-time">'+story.audioDur+'</span>';
    h+='</div>';
  }
  h+='<div class="detail-body">'+story.body+'</div>';
  h+='<div class="like-section">';
  h+='<button class="like-btn" id="likeBtn" onclick="toggleLike()">';
  h+='<i class="fa-regular fa-heart"></i>';
  h+='<span id="likeCount">'+story.likes+'</span>';
  h+='</button></div>';
  h+='<div class="comment-section">';
  h+='<div class="comment-title"><i class="fa-solid fa-comments"></i> 评论 ('+story.comments.length+')</div>';
  story.comments.forEach(function(c){
    h+='<div class="comment-item">';
    h+='<div class="comment-avatar" style="background:#f5f5f5">'+c.avatar+'</div>';
    h+='<div class="comment-body">';
    h+='<div class="comment-name">'+c.name+'</div>';
    h+='<div class="comment-text">'+c.text+'</div>';
    h+='<div class="comment-time">'+c.time+'</div>';
    h+='</div></div>';
  });
  h+='</div>';
  document.getElementById('detailContent').innerHTML=h;
}

function toggleAudio(btn){
  var icon=btn.querySelector('i');
  var fill=document.getElementById('audioFill');
  if(icon.classList.contains('fa-play')){
    icon.classList.remove('fa-play');icon.classList.add('fa-pause');
    fill.style.width='100%';
  }else{
    icon.classList.remove('fa-pause');icon.classList.add('fa-play');
    fill.style.width='0%';
  }
}

function toggleLike(){
  isLiked=!isLiked;
  var btn=document.getElementById('likeBtn');
  var icon=btn.querySelector('i');
  var count=document.getElementById('likeCount');
  if(isLiked){
    btn.classList.add('liked');
    icon.classList.remove('fa-regular');icon.classList.add('fa-solid');
    count.textContent=story.likes+1;
  }else{
    btn.classList.remove('liked');
    icon.classList.remove('fa-solid');icon.classList.add('fa-regular');
    count.textContent=story.likes;
  }
}

function sendComment(){
  var input=document.getElementById('commentInput');
  if(!input.value.trim())return;
  var section=document.querySelector('.comment-section');
  var div=document.createElement('div');
  div.className='comment-item';
  div.style.animation='fadeInUp .3s ease';
  div.innerHTML='<div class="comment-avatar" style="background:linear-gradient(135deg,#ff9a56,#ff6b9d)">😊</div><div class="comment-body"><div class="comment-name">我</div><div class="comment-text">'+input.value+'</div><div class="comment-time">刚刚</div></div>';
  section.appendChild(div);
  input.value='';
  showToast('评论成功~');
}

function showToast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:9999;animation:fadeInUp .3s ease;font-family:inherit';
  t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},1500);
}

render();

VoiceAssistant.init({role:'companion',primaryAvatar:'🦊',primaryName:'小箱',targets:[{id:'ai',avatar:'🦊',name:'小箱',desc:'在线',online:true,bg:'#fff3e0'}],messages:[],onSend:function(t){setTimeout(function(){VoiceAssistant.addAIMessage('这个故事真感人呢~')},800)}});
</script>
</body>
</html>
