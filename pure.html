<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纯享模式 · TRAE IDEA HALL</title>
  <link rel="icon" type="image/png" href="assets/trae-logo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      overflow: hidden;
    }

    .pure-stage {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 64px);
      margin-top: 64px;
    }

    /* ---- 顶部信息条 ---- */
    .pure-info-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .pure-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .pure-info-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .pure-info-meta .tag-pill {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
      white-space: nowrap;
    }

    .pure-info-meta .meta-sep {
      color: var(--border-strong);
    }

    /* ---- iframe 区域 ---- */
    .pure-iframe-wrap {
      flex: 1;
      position: relative;
      background: #0a0a0b;
      min-height: 0;
    }

    .pure-iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .pure-empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 15px;
    }

    .pure-empty .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---- 底部控制栏 ---- */
    .pure-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 14px 24px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .pure-nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .pure-nav-btn:hover:not(:disabled) {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .pure-nav-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .pure-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .pure-counter {
      font-size: 14px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 90px;
      text-align: center;
    }

    .pure-counter strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .pure-open-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 12px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 13px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .pure-open-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ---- 响应式 ---- */
    @media (max-width: 640px) {
      .pure-info-bar {
        padding: 10px 14px;
        gap: 8px;
      }
      .pure-title {
        font-size: 14px;
      }
      .pure-info-meta {
        gap: 6px;
        font-size: 12px;
      }
      .pure-info-meta .tag-pill {
        display: none;
      }
      .pure-controls {
        padding: 12px 14px;
        gap: 10px;
      }
      .pure-nav-btn {
        width: 42px;
        height: 42px;
      }
      .pure-counter {
        min-width: 60px;
        font-size: 12px;
      }
      .pure-open-link {
        margin-left: 4px;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="./" class="logo">
      <img src="assets/trae-logo.png" alt="TRAE" class="logo-img">
      <span><span class="logo-brand">TRAE</span> IDEA HALL · 纯享模式</span>
    </a>
    <div class="nav-right">
      <a href="./" class="btn btn-secondary" style="padding:6px 16px;font-size:13px;">← 返回首页</a>
    </div>
  </nav>

  <div class="pure-stage">
    <!-- 顶部信息条 -->
    <div class="pure-info-bar">
      <span class="pure-title" id="pure-title">加载中...</span>
      <div class="pure-info-meta" id="pure-meta"></div>
    </div>

    <!-- iframe 展示区 -->
    <div class="pure-iframe-wrap">
      <div class="pure-empty" id="pure-empty">
        <div class="spinner"></div>
        <span>正在随机抽取作品...</span>
      </div>
      <iframe id="pure-iframe" loading="lazy" style="display:none;"></iframe>
    </div>

    <!-- 底部控制栏 -->
    <div class="pure-controls">
      <button class="pure-nav-btn" id="btn-prev" title="上一个 (←)" disabled>◀</button>
      <span class="pure-counter" id="pure-counter">— / —</span>
      <button class="pure-nav-btn" id="btn-next" title="下一个 (→ / Space)">▶</button>
      <a href="#" class="pure-open-link" id="open-link" target="_blank" rel="noopener">新标签页打开 ↗</a>
    </div>
  </div>

  <script src="data/demos.min.js"></script>
  <script>
    (function() {
      'use strict';

      var data = window.DEMOS_DATA || [];
      // 只保留有 Demo 的作品
      var demoPool = data.filter(function(d) {
        return d.has_demo && d.demo_url;
      });

      var history = [];
      var currentPos = -1;

      var elIframe = document.getElementById('pure-iframe');
      var elEmpty = document.getElementById('pure-empty');
      var elTitle = document.getElementById('pure-title');
      var elMeta = document.getElementById('pure-meta');
      var elCounter = document.getElementById('pure-counter');
      var elBtnPrev = document.getElementById('btn-prev');
      var elBtnNext = document.getElementById('btn-next');
      var elOpenLink = document.getElementById('open-link');

      function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function render(demo) {
        if (!demo) return;

        // iframe
        elIframe.src = demo.demo_url;
        elIframe.style.display = 'block';
        elEmpty.style.display = 'none';

        // 标题
        elTitle.textContent = demo.title || '未命名作品';

        // 信息元数据
        var metaParts = [];
        if (demo.tags && demo.tags.length) {
          demo.tags.slice(0, 3).forEach(function(tag) {
            metaParts.push('<span class="tag-pill">' + escapeHtml(tag) + '</span>');
          });
        }
        var metaRight = [];
        if (demo.views !== undefined) metaRight.push('👁 ' + demo.views);
        if (demo.like_count !== undefined) metaRight.push('❤ ' + demo.like_count);
        if (demo.author) metaRight.push(escapeHtml(demo.author));

        if (metaRight.length) {
          metaParts.push('<span class="meta-sep">|</span>');
          metaParts.push('<span>' + metaRight.join(' · ') + '</span>');
        }

        elMeta.innerHTML = metaParts.join('');

        // 新标签页链接
        elOpenLink.href = demo.demo_url;

        // 计数器
        elCounter.innerHTML = '<strong>' + (currentPos + 1) + '</strong> / ' + history.length;

        // 按钮状态
        elBtnPrev.disabled = currentPos <= 0;
      }

      function nextDemo() {
        if (demoPool.length === 0) return;

        // 随机选一个，排除当前
        var currentDemoIdx = currentPos >= 0 ? history[currentPos] : -1;
        var newIdx;

        if (demoPool.length === 1) {
          newIdx = 0;
        } else {
          do {
            newIdx = Math.floor(Math.random() * demoPool.length);
          } while (newIdx === currentDemoIdx);
        }

        // 截断历史（如果用户回退过）
        if (currentPos < history.length - 1) {
          history = history.slice(0, currentPos + 1);
        }

        history.push(newIdx);
        currentPos = history.length - 1;
        render(demoPool[newIdx]);
      }

      function prevDemo() {
        if (currentPos <= 0) return;
        currentPos--;
        render(demoPool[history[currentPos]]);
      }

      // 事件绑定
      elBtnNext.addEventListener('click', nextDemo);
      elBtnPrev.addEventListener('click', prevDemo);

      // 键盘快捷键
      document.addEventListener('keydown', function(e) {
        // 如果焦点在输入框中，不拦截
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;

        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevDemo();
        } else if (e.key === 'ArrowRight' || e.key === ' ') {
          e.preventDefault();
          nextDemo();
        }
      });

      // 空状态
      if (demoPool.length === 0) {
        elEmpty.innerHTML = '<span>暂无可展示的 Demo 作品</span>';
      } else {
        // 自动加载第一个
        nextDemo();
      }
    })();
  </script>
</body>
</html>
